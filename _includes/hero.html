<!-- begin masthead -->
<div class="masthead">
  <div class="container">
    <div class="masthead__topline">
      <span class="masthead__date">{{ 'now' | date: "%A, %B %-d, %Y" }}</span>
      <span class="masthead__edition">AI · Tech · Markets — daily, in 5 languages</span>
    </div>
    <h1 class="masthead__title"><a href="{{ site.baseurl }}/">{{ site.data.settings.title }}</a></h1>
    <div class="masthead__rule"></div>
  </div>
</div>
<!-- end masthead -->
