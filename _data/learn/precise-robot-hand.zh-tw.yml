  title: 打造精密的 5 機器手臂
  summary: 這是一門以專案為導向的課程，帶領學員完成從機器人學基礎到 5 機器手臂設計、運動學、電子電路、控制演算法及系統整合的全過程。
  outcome: 具備製作獨立運作 5 機器手臂原型機的能力，並掌握機構設計與嵌入式控制系統的實作技巧。
  audience: 對機器人學感興趣的大學生及創客
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3D 印表機
  - 萬用電表
  - 烙鐵
  - 一般手工具
  - PC-CF 用硬化鋼噴嘴
  - 抗衝擊作業護目鏡
  - 游標卡尺
  safety_summary:
  - 此為低電壓教學用原型機，並非經認證的機械安全系統
  - 學員製作的停止電路不得作為安全功能或緊急停止使用
  - 正常停止應透過軟體扭力解除執行；計劃停止後，在維修或接近設備前，必須物理斷開 3 個絕緣電源供應器，並確認處於無電狀態
  - 通電期間請勿將手伸入活動範圍內，並應先於固定夾具上進行無負載測試
  - 進行切割、鑽孔及肌腱張力測試時，請務必配戴抗衝擊作業護目鏡
  - 若偵測到異常發熱、異味或冒煙，請勿靠近，並透過危險區域外的預設建物配電盤斷路器或認證的 upstream master disconnect 切斷 3 個供應器的電源後撤離。若危險區域外無可操作的
    upstream 斷電手段，禁止系統通電。扭力解除不等於電源切斷。
  - 在投入人員作業環境前，必須在具備資格的安全專家審查下，另行設計並驗證雙通道、手動重置、EDM 及可回授的雙接觸器系統
