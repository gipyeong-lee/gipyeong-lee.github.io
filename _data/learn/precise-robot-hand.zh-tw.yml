capstone:
  title: 智慧型 5 指機器手最終製作與測試
  deliverables:
  - 最終設計 CAD 檔
  - 整合韌體與控制程式碼
  - 抓取效能與耐久性測試資料
  - 系統安全評估書
  - 最終專案結果報告
  rubric:
  - 機構精度與作動性評估
  - 即時控制演算法實作水準
  - 計畫停機後維護/接近前之物理斷電與無電源測量程序文件完整性
  - 文件化 (BOM、圖面) 之完整性
  - 測試資料分析與效能驗證
  safety:
  - 計畫停機後維護/接近前，物理分離 3 個隔離電源變壓器，並記錄各分支殘餘電壓在 DC 電壓檔位下低於 1 V
  - 檢查各獨立電源分支之 10 A 保險絲額定值與時間-電流特性
  - 固定治具進行無負載測試後，分階段增加抓取負載
  - 在切斷、鑽孔、肌腱張力與抓取測試過程中，佩戴防衝擊作業用安全眼鏡
