    - 教育用原型機不主張符合機械安全標準或經認證，投入人員作業環境前須由具資格的安全專家另行審查？
    - 是否理解並遵守電源物理斷開之安全規則？
  quiz:
  - question: FSR 電壓分壓電路之電源供應應選用何者？
    choices:
    - 12 V 致動器電源
    - OpenCR 3.3 V 感測器電源
    answer_index: 1
    explanation: FSR 感測器的 ADC 訊號應使用 OpenCR 之 3.3 V 感測器軌，並與 12 V 致動器電源電氣上完全分離。
  - question: 各分流熔斷器保護的主要目的為何？
    choices:
    - 將電壓強制鎖定在 12 V
    - 若偵測到異常發熱、異味或冒煙，請勿靠近，並透過危險區域外的預設建物配電盤斷路器或認證的 upstream master disconnect 切斷 3
      個供應器的電源後撤離。若危險區域外無可操作的 upstream 斷電手段，禁止系統通電。扭力解除不等於電源切斷。維修或接近設備必須在計畫停止後，物理斷開電源並確認無電後才可進行
    answer_index: 1
    explanation: 配置於各分流的 10 A 熔斷器，在允許致動器峰值電流運作的同時，可於配線短路等故障發生時保護系統。
  - question: 絕緣型電源供應器的各個獨立正極 (+) 輸出是否可以連結？
    choices:
