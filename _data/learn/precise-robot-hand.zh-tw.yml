modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: 機器人機構學基礎
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 理解機器人機構學的基本定義與剛體變換 (Rigid-body transformation) 概念。
  - 學習使用座標系變換與旋轉矩陣，以數學方式描述機器人的位置與方向。
  - 習得 5 機器人手設計所需的機構學基礎理論與分析方法。
  theory_markdown: '## 機器人機構學基礎


    機器人機構學是一門探討機器人運動，但不考慮力或扭力的學問，著重於位置、速度與加速度 [S1]。設計如機器人手等機械臂的起點，在於將各關節的狀態描述為空間中的座標。


    ### 1. 剛體變換 (Rigid-body Transformation)

    機器人的各個連桿被視為剛體，從一個座標系變換到另一個座標系的過程，可表示為旋轉 (Rotation) 與移動 (Translation) 的組合。在 3 維空間中，旋轉矩陣
    (Rotation Matrix) $R$ 為正交矩陣，藉此定義兩個座標系間的方向 [S1]。


    ### 2. 正向機構學 (Forward Kinematics)

    正向機構學是指在已知關節變數（角度或位置）時，計算機器人末端執行器 (End-effector) 位置與方向的過程。在 5 機器人手中，透過手指關節角度 ($\theta_1,
    \theta_2, \dots, \theta_n$) 求出指尖位置。


    ### 3. 反向機構學 (Inverse Kinematics)

    反向機構學是指設定期望的指尖位置為目標值後，求出達成該位置所需之各關節變數的過程。由於由非線性方程式構成，可能不存在解或產生多重解 [S1]。'
  worked_examples:
  - 例題 1：在 2 維平面中，求出具有 1 個旋轉關節 (Rotation Joint) 的機器人連桿末端位置 $(x, y)$。當關節角度為 $\theta$
    且連桿長度為 $L$ 時，$x = L \cos(\theta), y = L \sin(\theta)$ [S1]。
  - 例題 2：描述繞 $x$ 軸旋轉 $\theta$ 的 2 維旋轉矩陣 $R$。$R = \begin{bmatrix} \cos(\theta) & -\sin(\theta)
    \\ \sin(\theta) \cos(\theta) \end{bmatrix}$ [S1]。
  lab:
    title: 座標系變換模擬與基礎機構學分析
    steps:
    - 使用機構分析軟體建立 2 連桿平面機械臂模型。
    - 改變關節角度並確認末端位置的軌跡。
    - 手動推導反向機構學公式，並與模擬結果比較。
    safety:
    - 電腦作業時請調整螢幕亮度並定時休息。
    - 本實習為模擬基礎，不要求硬體通電。
    deliverables:
    - 包含機構分析過程的總結報告
    - 軌跡模擬結果影像
  assignment:
    title: 5 機器人手關節結構機構建模
    deliverables:
    - 機器人手指 1 個的正向機構學方程式推導成果
    - 隨關節角度變化之指尖位置變化預測數據
    rubric:
    - 旋轉矩陣的數學精確度
    - 正向機構學方程式的物理合理性
    - 報告的邏輯架構
  quiz:
  - question: 在機器人機構學中，不考慮力或扭力，僅描述運動的學問為何？
    choices:
    - 動力學 (Dynamics)
    - 機構學 (Kinematics)
    - 控制理論 (Control Theory)
    - 材料力學 (Material Mechanics)
    answer_index: 1
    explanation: 機構學是排除力與扭力，以位置、速度與加速度為中心的運動學 [S1]。
  - question: 在 3 維空間中，定義兩個座標系間方向的矩陣為何？
    choices:
    - 旋轉矩陣 (Rotation Matrix)
    - 質量矩陣 (Mass Matrix)
    - 剛性矩陣 (Stiffness Matrix)
    - 阻尼矩陣 (Damping Matrix)
    answer_index: 0
    explanation: 旋轉矩陣是將兩座標系方向進行數學變換的正交矩陣 [S1]。
  completion_criteria:
  - 完成理論課程學習
  - 提交機構分析結果報告
  - 達成理論測驗 100 分
  source_ids:
  - S1
- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: 肌腱驅動機制設計
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 理解肌腱驅動機制的基本動力學結構與關節模擬原理。
  - 學習用於精密機器人手的肌腱材料 (Dyneema SK78) 特性。
  - 學習肌腱的張力傳遞路徑與絞盤設計時的摩擦及磨損防範法。
  - 計算致動器的失速扭力與肌腱驅動時的機械增益。
  theory_markdown: '## 肌腱驅動機制基礎


    肌腱驅動 (Tendon-driven) 系統是透過遠端的致動器，經由肌腱（線）將張力傳遞至關節進行驅動的方式 [S9]。模仿生物手指的肌腱結構，將致動器移動至手掌或前臂，藉此減輕手指自身的質量並實現精密的動作
    [S10]。


    ### 1. 肌腱選擇與張力傳遞

    本設計使用高強度低伸長率纖維 Dyneema SK78 [S16]。此材料在直徑 1.5 mm 時具有 230 daN（約 230 kgf）的斷裂負荷，操作伸長率小於
    1%，適合精密位置控制 [S16]。


    ### 2. 機械增益與致動器選擇

    XM430-W350-T 智慧致動器提供 4.1 N·m 的失速扭力 [S11]。由於肌腱透過絞盤半徑從旋轉軸轉換力量，致動器的扭力輸出會轉換為肌腱張力。全系統使用
    11 台致動器，峰值電流總和最高可達 25.3 A [S11]。因此，為穩定供應，規劃了總計 3 個獨立的 12 V 電源分路，各分路透過獨立的 10 A
    保險絲保護以防止過電流 [S15, S24, S25]。


    ### 3. 安全與保護設計

    每個 12 V 電源分路均透過獨立保險絲運作 [S15, S24]。3 個電源供應器各具備 11.5 A 額定值，合計電流容量達 34.5 A，足以涵蓋系統
    25.3 A 的峰值電流 [S11, S15]。分路總額定值設計為超過致動器總峰值電流，以確保運作安全。'
  worked_examples:
  - "例題 1：肌腱驅動張力計算\n當致動器扭力 ($\tau$) 為 1 N·m 且絞盤半徑 ($r$) 為 0.01 m 時，肌腱張力 ($T$) 為 $T\
    \ = \tau/r = 1/0.01 = 100 N。設計時需考慮相對 Dyneema SK78 斷裂負荷 230 daN（約 2300 N）的安全係數\
    \ [S16]。"
  - '例題 2：電源分路分配與保護

    總致動器 11 台的失速電流總和為 25.3 A [S11]。將其分配至 3 個分路中（分別為 4 台、 4 台、 3 台），各分路最大負載分別為 9.2
    A、 9.2 A、 6.9 A。4 台致動器分路的理論峰值 9.2 A 雖低於 10 A 保險絲與 11.5 A 電源額定，但此數值不能單獨確保安全性或動作順序。需同時檢視保險絲製造商的時間-電流曲線與電源供應器
    OCP 特性，確認保護協調 [S24, S25]。'
  lab:
    title: 肌腱張力與關節摩擦測量實習
    steps:
    - 使用提供的連桿與軸承組裝手指關節模型。
    - 連接肌腱並使用張力器設定初始張力。
    - 將三用電表設定為 DC 電壓模式，物理斷開各分路的 12 V 電源供應器輸出進行確認。
    - 通電前手動測量並記錄關節旋轉摩擦力。
    safety:
    - 維修或接近設備前，物理斷開 3 個絕緣電源供應器，並使用三用電表確認 1 V 以下之 DC 電壓。
    - 通電期間絕對不得接近手指可活動範圍。
    - 必須佩戴防撞護目鏡。
    deliverables:
    - 隨關節旋轉角度變化的肌腱張力測量數據
    - 摩擦力分析報告
    - 最終安全計量紀錄
  assignment:
    title: 5 機器人手肌腱路徑設計
    deliverables:
    - 機器人手指肌腱路徑 CAD 圖面
    - 肌腱摩擦與損失計算書
    - 各分路電源負載分配與保險絲保護設計圖
    rubric:
    - 肌腱路徑設計是否將彎曲部摩擦降至最低？
    - 是否考量 Dyneema SK78 的物理特性？
    - 3 個電源分路的負載分配是否適切反映了致動器失速電流？
    - 保險絲與電源短路防護設計是否遵守 BOM 規格？
  quiz:
  - question: 使用 Dyneema SK78 肌腱的主要優點為何？
    choices:
    - 高伸長率帶來的衝擊吸收能力
    - 極低的運作伸長率與高斷裂負荷
    - 較金屬輕的重量與低抗拉強度
    - 電導性
    answer_index: 1
    explanation: Dyneema SK78 的伸長率極低（小於 1%），可提升位置控制精度，且具備極高的斷裂負荷 [S16]。
  - question: 使用 3 個 12 V 電源供應器（各 11.5 A）的原因，何者最為適切？
    choices:
    - 為了使用單一電源驅動所有致動器
    - 為了將電壓升壓至 36 V 以提升扭力
    - 為了分散處理致動器的總峰值電流並透過個別分路保險絲保護
    - 為了消除電源雜訊
    answer_index: 2
    explanation: 為了安全分散總計 11 台致動器的峰值電流，並透過各分路 10 A 保險絲保護，降低系統過電流風險 [S11, S15, S25]。
  completion_criteria:
  - 所有實習數據與圖面必須包含於最終報告中。
  - 物理斷開電源後，需驗證 3 個分路的 DC 電壓低於 1 V。
  - 肌腱路徑設計中需包含考量絞盤摩擦的分析。
  source_ids:
  - S9
  - S10
  - S16
  - S11
  - S15
  - S24
  - S25
- id: M3
  slug: actuator-controller-selection
  phase_id: P1
  title: 致動器與控制器選擇
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - 理解 DYNAMIXEL XM430-W350-T 致動器的額定電壓、電流與通訊特性。
  - 熟知 OpenCR 1.0 控制器的 DYNAMIXEL 連接埠配置與 12V 電源分離結構。
  - 設計使用 FSR 402 感測器與 10kΩ 電阻的分壓電路。
  - 計算系統電力需求並建立獨立分路保險絲保護設計。
  theory_markdown: '### 致動器與控制器系統設計理論


    #### 1. 致動器選擇與電力特性

    為實現機器人手的精密驅動，選擇 DYNAMIXEL XM430-W350-T。該致動器於 12V 額定電壓下運作，失速 (Stall) 電流為 2.3A [S11]。機器人手總體由
    11 個致動器組成，總失速電流總和達約 25.3A。因此，為穩定驅動，需具備獨立的供電體系。


    #### 2. 控制器架構

    OpenCR 1.0 搭載 216MHz ARM Cortex-M7 處理器，適合即時控制 [S13]。此控制器支援將 12V 致動器電源與邏輯/感測器電源物理分離的結構。由於
    FSR 感測器等類比輸入需在 0~3.3V 範圍內處理，感測器分壓電路務必連接至 OpenCR 的 3.3V 感測器導軌 [S13]。


    #### 3. 過電流保護與電源分路設計

    使用 3 個 138W 輸出的 MEAN WELL GST160A12-R7B 電源供應器 [S15]。各供應器額定電流為 11.5A，據此建立 3 個獨立的
    12V 分路。各分路內置 10A ATOF 保險絲以在發生過電流時保護電路 [S24, S25]。保險絲設定需低於 11.5A 額定電流，以達成保護協調。


    #### 4. 感測器訊號獲取

    FSR 402 具備壓力增加則電阻減少的特性 [S12]。將其連接至 10kΩ 固定電阻構成電壓分壓器，將力量變化轉換為電壓訊號，輸入至 OpenCR 的
    12bit ADC 連接埠 [S12, S13, S26]。'
  worked_examples:
  - 例題 1：確認單一分路最大電流。若單一分路連接 4 個 XM430 致動器，失速電流總和為 4 * 2.3A = 9.2A。此數值滿足電源供應器 11.5A
    額定值及 10A 線路保險絲額定，維持安全範圍 [S11, S15, S25]。
  - 例題 2：FSR 分壓電路電壓計算。在 3.3V 供應電壓下，若 FSR 電阻為 $R_fsr$，ADC 輸入電壓 $V_adc = 3.3 * (10k
    / (10k + R_fsr)) V$。根據感測器範圍 (0.2N~20N) 確認電阻變化，避免電壓超出 0~3.3V 範圍 [S12, S13, S26]。
  lab:
    title: 電源分路配置與 ADC 感測器介面實習
    steps:
    - 在各 MEAN WELL 供應器輸出端連接 0AFH0001Z 保險絲座，並插入 0287010 10A 保險絲。
    - 將三用電表設定為 DC 電壓模式，確認各分路電壓是否穩定於 12V。
    - 在 OpenCR 的 3.3V 感測器導軌上，使用 10kΩ 電阻與 FSR 402 組成分壓電路。
    - 於非通電狀態確認分壓電路輸出電壓是否位於 0~3.3V 範圍內。
    safety:
    - 作業開始前，物理切斷 3 個供應器的 AC 電源，並以三用電表確認為 0V。
    - 隨時佩戴防撞護目鏡。
    - 通電期間絕對不得更改電路或觸碰配線。
    - 保險絲僅用於過電流切斷，非計畫性停止手段。
    deliverables:
    - 各分路 12V 輸出測量紀錄單
    - FSR 分壓電路組裝完成照
    - 配置完成之配線圖
  assignment:
    title: 電源分路與保護設計審查
    deliverables:
    - 整體機器人手電流分路分配表（各分路分配之致動器）
    - 證明所選保險絲可在保護致動器失速電流的同時，不超過供應器容量的計算書
    rubric:
    - 獨立保險絲是否正確配置於各分路？
    - 致動器分路分配是否為 4/4/3 並符合規範？
    - 感測器電源是否由 3.3V 感測器導軌而非 12V 提供？
  quiz:
  - question: 使用 FSR 402 感測器與 10kΩ 電阻的分壓電路，正確電源連接為何？
    choices:
    - 12V 致動器電源
    - OpenCR 3.3V 感測器導軌
    - 5V 通用電源
    - OpenCR 12V 輸出
    answer_index: 1
    explanation: OpenCR 的 ADC 輸入操作電壓基準為 3.3V，因此分壓電路務必由 3.3V 感測器導軌供電 [S13]。
  - question: XM430-W350-T 致動器的失速電流值為？
    choices:
    - 1.0A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: 依據數據表，該致動器的失速電流為 2.3A [S11]。
  - question: 電源分路設計中，絕對禁止的行為為何？
    choices:
    - 於各供應器輸出裝設保險絲
    - 將供應器的陽極(+)輸出並聯
    - 每分路使用 10A 保險絲
    - 使用絕緣型供應器
    answer_index: 1
    explanation: 供應器的陽極(+)輸出必須維持獨立分路，嚴禁並聯連接 [B3]。
  completion_criteria:
  - 於實習中透過三用電表驗證 3 個獨立分路的 12V 電壓
  - 確認 FSR 402 感測器分壓電路之接線與 ADC 輸入電壓範圍
  - 提交並通過電源分路與保護設計報告
