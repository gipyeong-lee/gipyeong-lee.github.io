modules:
- id: m1
  slug: intro-robotics
  phase_id: p1
  title: 機器人學概論
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 理解機器人學的定義與系統組件。
  - 了解 5 機器手臂原型機中所使用的致動器與控制器之角色。
  - 學習機器人系統的電源分流配置與物理斷路原理。
  - 熟練力感測器 (FSR) 的運作原理與 ADC 資料擷取方式。
  theory_markdown: '## 機器人系統組成元件

    機器人由感測(Sensor)、思考(Controller)、動作(Actuator)這三個核心要素組成 [S1]。本課程的 5 指機器人手使用 DYNAMIXEL
    XM430-W350-T 致動器，透過腱驅動方式來控制關節 [S14]，並透過 OpenCR 1.0 控制器處理這些致動器以及指尖 FSR 感測器的訊號 [S16]。


    ## 電力系統的安全設計

    由於致動器在 12 V 電壓下需要 2.3 A 的堵轉電流 [S14]，考量系統整體負載，使用 3 個 MEAN WELL GST160A12-R7B 變壓器
    [S17]。每個變壓器運行在獨立的 12 V 分支，分別負責 4 個 / 4 個 / 3 個致動器，這些分支的正極(+)輸出互不結合，在物理上是隔離的。每個分支都透過線路座
    (0AFH0001Z) 安裝 10 A ATOF 保險絲，以在發生過電流時保護配線 [S25, S26]。這不僅僅是單純的停止功能，更是電氣安全的基本基礎。


    ## 感測器介面

    FSR 402 感測器具有隨接觸力增加而電阻減小的特性 [S15]。將其與 10 kΩ 電阻組成分壓電路，並連接至 OpenCR 的 12-bit ADC
    通道，即可將接觸力換算為電壓 [S16, S27]。此時感測器電路必須僅由 3.3 V 感測器電源軌供電，不得與致動器用的 12 V 電源軌混合使用。'
  worked_examples:
  - 致動器負載計算：將 4 台 XM430-W350-T 配置於 1 個分流時，峰值電流為 4 * 2.3 A = 9.2 A [S14]。此數值在 10 A
    熔斷器的額定範圍內，且低於電源供應器的 11.5 A 輸出額定，確保運行穩定 [S17, S26]。
  - FSR 分壓器設計：在感測器與 10 kΩ 電阻串聯的分壓器中，當輸入 3.3 V 且感測器未受壓（高電阻狀態）時，ADC 數值接近 0 V；當受強力按壓使電阻驟降時，ADC
    數值則接近 3.3 V [S15, S27]。
  lab:
    title: 電源分流配置與系統基本通電測試
    steps:
    - 將各 MEAN WELL 供應器的正極 (+) 端子連接 ATO inline holder 與 10 A 熔斷器，建立 3 個獨立分流 [S17, S25,
      S26]。
    - 將萬用電表設定為 DC 電壓模式，確認各分流輸出電壓為 12 V。
    - 將 OpenCR 控制器連接至 3.3 V 感測器電源軌，並利用 FSR 感測器與 10 kΩ 電阻組成分壓電路 [S16, S27]。
    - 通電後，使用 DYNAMIXEL Wizard 確認各肌腱致動器通訊是否正常 [S14, S16]。
    safety:
    - 通電前，請務必透過目視與電路圖重新驗證所有接線，勿使用萬用電表電阻檔位檢查。
    - 通電期間禁止接近系統，配線作業必須在完全無電狀態（物理斷開供應器）下進行。
    - 若偵測到異常發熱、異味或冒煙，請勿靠近，並透過危險區域外的預設建物配電盤斷路器或認證的 upstream master disconnect 切斷 3
      個供應器的電源後撤離。若危險區域外無可操作的 upstream 斷電手段，禁止系統通電。扭力解除不等於電源切斷。維修或接近設備必須在計畫停止後，物理斷開電源並確認無電後才可進行。
    - 隨時配戴護目鏡，切勿將身體部位伸入活動範圍內。
    deliverables:
    - 各分流 12 V 測量記錄照片
    - OpenCR ADC 感測器資料擷取程式碼
    - 獨立分流接線圖
  assignment:
    title: 機器人系統安全設計報告
    deliverables:
    - 獨立電源分流配置圖
    - 致動器峰值電流對應熔斷器額定之合理性分析
    - FSR 分壓電路設計公式與計算
    rubric:
    - 致動器 11 台與電源分流 3 個的分配是否明確？
    - 3.3 V 感測器軌與 12 V 致動器軌之分離描述是否正確？
    - 斷電流程（物理斷開）描述是否精確？
  quiz:
  - question: 系統電源設計時，為何禁止將 12 V 輸出端子的正極 (+) 並聯？
    choices:
    - 因為電壓會上升至 24 V
    - 存在因供應器間電位差導致逆電流產生及獨立分流保護失效之風險
    - 因為會導致致動器通訊速度下降
    - 因為無法使用軟體扭力解除功能
    answer_index: 1
    explanation: 各電源供應器必須作為獨立分流運作，若將輸出端子連結，恐導致故障或使獨立熔斷器的安全保護功能失效。
  - question: 使用 OpenCR ADC 連接埠讀取 FSR 訊號時，合適的供電電壓為何？
    choices:
    - 12 V 致動器電源軌
    - 3.3 V 感測器電源軌
    - 24 V 輸入電源
    - 非接觸式無線電源
    answer_index: 1
    explanation: OpenCR 的 ADC 使用 0~3.3 V 範圍，為保護感測器，必須由專用的 3.3 V 感測器電源軌供電。
  - question: 系統檢查與維修時，切斷電源最安全的方法為何？
    choices:
    - 透過軟體指令解除致動器扭力
    - 移除熔斷器
    - 物理斷開 3 個電源供應器後進行電壓測量
    - 僅關閉控制器電源開關
    answer_index: 2
    explanation: 軟體指令或移除熔斷器無法確保完全無電。必須物理斷開供應器，並使用萬用電表測量確認電壓低於 1 V。
  completion_criteria:
  - 使用萬用電表確認各分流 12 V 電壓在正常範圍內，並繳交照片證明。
  - 透過控制器確認 FSR 感測器隨接觸力變化的 ADC 數值變化，並取得合理數據。
  - 理解並遵守物理斷電與電壓測量之安全停止程序。
  source_ids:
  - S1
  - S14
  - S16
  - S17
  - S25
  - S26
  - S15
  - S27
- id: m2
  slug: mechanism-design
  phase_id: p1
  title: 機器人機構設計
  estimated_hours: 15.0
  prerequisites:
  - m1
  objectives:
  - 理解機器人手臂機構設計的核心原理：欠驅動 (Underactuated) 系統。
  - 學習肌腱驅動方式的動力學特性，以及摩擦力與伸長率管理的重要性。
  - 學習考慮剛性與尺寸穩定性的工程材料 (PC-CF) 選擇與設計手法。
  - 奠定使用熱熔鑲件與軸承進行精密組裝設計之基礎。
  theory_markdown: '## 機器人機構設計原理


    精密的 5 指機器人手設計的核心，在於實現欠驅動系統，以高效率控制超過致動器數量的自由度 (DoF) [S11]。這使得無需過度增加關節數量，即可穩定抓取各種形狀的物體
    [S3]。


    ### 腱驅動動力學

    腱 (Tendon) 驅動是將遠端馬達的張力傳遞至關節的方式。此時，腱的物理特性決定了控制的精度。本課程使用 `Dyneema SK78` 纖維，其在直徑
    1.5 mm 下可承受 230 daN 的高斷裂負載，且工作伸長率 (Working stretch) 低於 1%，重複精度極佳 [S18]。


    ### 材質與結構設計

    機器人手的框架與連桿要求高剛性與尺寸穩定性。FDM 方式的 `Prusament PC Blend Carbon Fiber` 是含碳纖維的 PC 材質，具備耐高溫與優秀的強度，適合製作工程級零件
    [S21]。組裝時為了重複拆解與再組裝，不使用直接螺紋鎖合，而是使用 M3 黃銅熱熔埋入螺母 (OD 4.4 mm，長度 5.8 mm) 以確保螺紋耐用度
    [S23]。旋轉軸使用無給油聚合物套筒軸承 (JSM-0810-10)，實現無需維護的平滑旋轉與摩擦管理 [S19]。'
  worked_examples:
  - 範例 1：肌腱張力傳遞分析。當肌腱工作伸長率為 1% 時，在 100 mm 距離下會產生 1 mm 的誤差。為達精密控制，利用致動器電流回授與感測器資料進行閉迴路控制是必要的
    [S14]。
  - 範例 2：鑲件連結設計。將 HTBI-M3-BR 鑲件植入 PC-CF 輸出件時，必須嚴格遵守 CAD 設計時的導向孔徑 4 mm，才能實現無間隙組裝 [S23]。
  lab:
    title: 機器人關節與肌腱模組組裝實習
    steps:
    - 配戴護目鏡並整理工作台。
    - 檢查 PC-CF 輸出件的導向孔狀態，必要時進行加工。
    - 使用烙鐵加熱熱熔鑲件，並垂直壓入輸出件中。
    - 將 igus 軸承安裝至手腕及關節外殼。
    - 將鋁合金軸穿過軸承，檢查間隙。
    - 將 Dyneema 肌腱繞於捲筒 (Capstan) 上，並固定於組裝好的關節上。
    safety:
    - 使用烙鐵時請注意高溫，並務必配戴護目鏡。
    - 肌腱張力測試期間，為防肌腱斷裂彈跳傷人，切勿將手伸入活動範圍內。
    - 系統組裝完成後，通電前請先以測量儀器確認處於物理斷開狀態。
    deliverables:
    - 已組裝的機器人關節模組
    - 軸承與軸間隙測量記錄
  assignment:
    title: 5 機器手臂機構設計專案
    deliverables:
    - 整體機器手臂 CAD 組裝圖
    - 零件清單 (BOM) 與選用依據報告
    - 肌腱路徑最佳化設計圖
    rubric:
    - 所使用的零件是否符合規格 (BOM)？
    - 熱熔鑲件與軸承設計是否得當？
    - 是否實現無機構干涉的自由運動？
  quiz:
  - question: 肌腱驅動選擇 Dyneema SK78 的主要原因為何？
    choices:
    - 伸長率大且價格便宜
    - 提供低伸長率與高斷裂負荷，確保精度
    answer_index: 1
    explanation: Dyneema SK78 的伸長率極低（低於 1%），能提升機器人控制的重複精度 [S18]。
  - question: 對於 PC-CF 輸出件進行重複螺絲組裝，建議的方法為何？
    choices:
    - 直接在輸出件上加工螺紋
    - 嵌入黃銅熱熔鑲件
    answer_index: 1
    explanation: 熱熔鑲件能顯著提升在 PC-CF 等工程塑膠中的螺紋耐用度 [S23]。
  completion_criteria:
  - 依據 BOM 規格完成各零件之文件化。
  - 確認組裝完成之關節模組的功能性運動。
  - 遵守安全準則並完成實習。
  source_ids:
  - S3
  - S11
  - S18
  - S21
  - S23
  - S19
  - S14
- id: m3
  slug: cad-modeling
  phase_id: p1
  title: 3D CAD 模型製作
  estimated_hours: 15.0
  prerequisites:
  - m2
  objectives:
  - 理解 3D CAD 模型製作的設計限制與製造流程 (FDM)。
  - 學習應用 PC-CF 線材提升結構剛性的技巧。
  - 進行考慮熱熔鑲件與軸承公差的精密組裝設計。
  theory_markdown: '### 3D CAD 建模與製造設計


    製作精密 5 指機器人手時，必須考量 FDM 層積製造特性的設計 (Design for Additive Manufacturing, DfAM)。含碳纖維的
    PC-CF 線材具備優秀的機械剛性與尺寸穩定性，適合製作精密連桿 [S21]。


    #### 核心設計考量

    1. **公差管理與軸承安裝**：使用 8mm 精密鋁軸與 igus JSM-0810-10 軸承時，必須將外殼孔公差納入設計。由於軸承採用壓入 (Press-fit)
    方式固定，設計時孔徑需比軸承外徑 (10mm) 微小，以確保組裝緊密 [S19, S20]。

    2. **鎖固零件設計**：PC-CF 列印件不適合直接攻螺紋。為了確保重複拆裝的再現性，使用 HTBI-M3-BR 黃銅熱熔埋入螺母。為此，設計時必須配置
    4mm 直徑的導引孔 [S23]。

    3. **結構最佳化**：在腱驅動方式下，連桿可能會因張力而變形。應確保應力集中的關節部位壁厚，並將模型擺放方向調整為有利於層積方向的抗拉強度。


    ### 系統整合與安全

    本專案的電氣系統由 3 個獨立的 12V 電源分支組成。致動器驅動時為了過電流保護，務必在每個分支安裝 10A ATOF 保險絲，致動器需按 4/4/3 的比例分配以管理尖峰電流
    [S17, S26]。感測器訊號獲取時，FSR 402 感測器必須透過 3.3V 感測器電源軌的分壓電阻產生 ADC 輸入值，且必須與 12V 致動器電源完全隔離
    [S15, S16, S27]。'
  worked_examples:
  - '**鑲件孔設計**：由於 Accu-components 的 M3 鑲件外徑為 4.4mm，請在 3D CAD 中為輸出件建模 4.0mm 的導向孔 [S23]。列印後加熱插入鑲件，黃銅材質即可在塑膠內部定位，形成堅固的
    M3 內螺紋。'
  - '**軸承外殼公差**：使用 igus 軸承 JSM-0810-10 時，10mm 外殼孔徑需設計為壓入後，內徑能與 8mm 精密軸密合且無間隙。過寬會導致軸向晃動，過窄則損壞軸承，請透過測試列印調整公差
    [S19, S20]。'
  lab:
    title: 精密連桿設計與組裝驗證
    steps:
    - 將提供的肌腱路徑與關節機構進行 3D CAD 設計與模擬。
    - 將 PC-CF 線材裝入 FDM 印表機，並使用硬化鋼噴嘴列印試件 [S21]。
    - 確認輸出件之 4mm 導向孔後，植入熱熔鑲件 [S23]。
    - 組裝 8mm 鋁合金軸與軸承，確認連桿旋轉自由度並測量間隙 [S19, S20]。
    - 使用萬用電表檢查 3 個獨立電源分流之熔斷器座連接狀態，並檢查通電前熔斷器是否安裝妥當 [S25, S26]。
    safety:
    - 隨時配戴抗衝擊作業護目鏡。
    - 熱熔作業時請注意燙傷，並在通風良好處進行。
    - 通電時務必使用固定夾具，絕對不要將手伸入旋轉部位。
    - 維修或接近系統時，務必物理斷開 3 個電源供應器，並使用萬用電表確認低於 1V。
    deliverables:
    - 機器手臂整體組裝 3D CAD 模型檔
    - 包含鑲件與軸承公差調整之設計驗證報告
