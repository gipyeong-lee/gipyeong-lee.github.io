    - 熔斷器額定選用足以適當執行過電流保護
  quiz:
  - question: 下列何者為電源分流配置時之禁止行為？
    choices:
    - 各分流串聯 10 A 熔斷器
    - 將獨立供應器之正極 (+) 端子並聯
    - 將致動器以 4:4:3 比例分配
    - 將 FSR 感測器連接至 3.3 V 軌
    answer_index: 1
    explanation: 各供應器輸出應作為獨立分流使用，將電源供應器輸出並聯恐導致系統故障與火災風險，絕對禁止。
