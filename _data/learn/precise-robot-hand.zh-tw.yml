    - 絕對禁止，各分流必須維持獨立
    answer_index: 1
    explanation: 為確保獨立分流結構，嚴禁將正極 (+) 輸出並聯，各輸出須以物理分離的電源線束運作。
  completion_criteria:
  - 確認各致動器分流皆可正常測得 12 V 電壓。
  - 成功透過控制器擷取 FSR 感測器資料，並驗證隨接觸力變化之 ADC 數值變化。
  - 能物理切斷系統電源，並在低於 1 V 狀態下安全進行維修。
  - 提交所有實作作業與安全遵守誓約書。
