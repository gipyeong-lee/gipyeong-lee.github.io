- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D 列印與零件加工
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 理解使用碳纖維強化 PC 耗材 (PC-CF) 製作零件及最佳化列印設定。
  - 學習熱壓入嵌件 (Heat-set insert) 與套筒軸承的精密組裝公差管理。
  - 理解用於肌腱驅動機制的 Dyneema 線材處理與絞盤結構設計。
  - 習得確保機器人結構體尺寸穩定性與剛性的加工與緊固技巧。
  theory_markdown: '### 3D 列印與零件加工理論


    #### 碳纖維強化工程材料 (PC-CF)

    PC (Polycarbonate) 具備優異剛性與耐熱性，添加碳纖維的 PC-CF 耗材可最大化剛性，適合結構零件製作 [S19]。但由於碳纖維的磨耗性，必須使用硬化鋼噴嘴
    [S19]，且需以 285°C 左右的高溫列印 [S19]。


    #### 精密組裝用的嵌件與緊固

    為實現塑膠列印件的可反覆拆裝，使用熱壓入螺紋嵌件 [S21]。針對 M3 嵌件，CAD 設計時需預留 4.0mm 直徑的引導孔，以確保正確位置 [S21]。此外，免加油聚合物套筒軸承
    (iglide J) 與 8mm 鋁合金軸組裝時，設計上需確保壓入後內徑達到最佳間隙 [S17]，因此對 8mm 軸徑的公差管理極為重要 [S17, S18]。


    #### 肌腱驅動結構

    Dyneema SK78 纖維在 1.5mm 直徑下具備 230 daN 的高斷裂負荷與 1% 以下伸長率 [S16]，是鋼索的優良替代品。由於肌腱在旋轉軸上會重複彎曲，設計結構時需對絞盤邊緣進行倒圓處理，以防止因摩擦導致斷裂。'
  worked_examples:
  - 例題 1：PC-CF 耗材噴嘴選擇 - 考量碳纖維的高磨耗性，黃銅 (Brass) 噴嘴會迅速磨損導致列印品質下降與阻塞，務必確認選擇硬化鋼 (Hardened
    steel) 噴嘴 [S19]。
  - 例題 2：嵌件孔設計 - Accu HTBI-M3-BR 嵌件外徑為 4.4mm，但官方建議孔徑為 4.0mm [S21]，因此 CAD 設計時將孔徑固定為
    4.0mm，確保熱壓入時塑膠能充分進入嵌件滾花 (knurling) 之間 [S21]。
  lab:
    title: 手指結構製作與組裝實習
    steps:
    - 設定安裝硬化鋼噴嘴之 FDM 3D 印表機的碳纖維 PC 列印環境 [S19]。
    - 列印手指連桿與手掌框架，去除支撐並清理表面。
    - 以熱工具將熱壓入嵌件垂直安放入 4.0mm 引導孔 [S21]。
    - 依據軸承規格裁切 IGUS 精密鋁軸並進行端面倒角 [S18]。
    - 將套筒軸承壓入外殼後插入軸，確認間隙 [S17]。
    - 以 M3 內六角螺絲緊固結構與感測器支架 [S20]。
    safety:
    - 注意高溫噴嘴 (285°C) 及加熱床 (110°C) 造成的燙傷風險 [S19]。
    - 列印件後加工與倒角時，必須佩戴護目鏡。
    - 嵌件加熱時可能產生煙霧，請開啟換氣設備。
    - 通電前確認所有機械緊固狀態。
    deliverables:
    - 製作完成之 5 機器人手結構（連桿、手掌）。
    - 熱壓入嵌件垂直度與軸承間隙測量紀錄。
    - 最終緊固部位目視檢查報告。
  assignment:
    title: 機器人手製作精度驗證
    deliverables:
    - 完成之結構體 CAD 數據與實際尺寸測量比較表
    - 組裝公差管理計畫書
    - 肌腱路徑結構的摩擦降低設計說明書
    rubric:
    - 熱壓入嵌件是否垂直安裝 (優/良/差)
    - 軸承與軸組裝後是否旋轉順暢 (合格/不合格)
    - 是否遵守 BOM 規範之零件額定值與規格 [B10, B11, B12, B13, B14]
  quiz:
  - question: 使用 PC-CF 耗材時，必須使用硬化鋼噴嘴的主要原因為何？
    choices:
    - 防止碳纖維磨耗導致黃銅噴嘴快速損壞
    - 耗材熔點低，一般噴嘴無法列印
    - 提升列印件表面光澤
    - 提升擠出速度
    answer_index: 0
    explanation: 碳纖維磨耗性極高，會迅速損壞一般黃銅噴嘴，故必須使用硬化鋼噴嘴 [S19]。
  - question: 使用 M3 熱壓入嵌件 (Accu HTBI-M3-BR) 時，建議的引導孔直徑為何？
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: 依據官方數據表，建議孔徑為 4.0mm [S21]。
  completion_criteria:
  - 所有結構零件均以 FDM 3D 印表機製作完成 [B10]
  - 熱壓入嵌件已正確安放入所有指定孔位 [B14]
  - 鋁合金軸與套筒軸承的組裝間隙符合基準值 [B11, B12]
  - 緊固時正確使用 BOM 指定的 M3 內六角螺絲 [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: 軸承與緊固零件安裝
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 理解精密機器人手製作所需的軸承與軸之機械公差與安裝原理。
  - 學習使用熱壓入嵌件 (Heat-set insert) 以確保工程塑膠零件之緊固強度的方法。
  - 使用適當扭力與緊固規格，使組裝間隙最小化。
  theory_markdown: '### 軸承與軸的公差管理

    為確保精密機器人關節的流暢運作與剛性，使用 iglide® J 套筒軸承 (JSM-0810-10) 及 8 mm 鋁合金精密軸 (AWMP-08)。套筒軸承設計為壓入
    (press-fit) 外殼時內徑會自動調整，務必遵守外殼建議的內徑公差 [S17, S18]。間隙過大會導致關節精度下降，過窄則會增加摩擦力，降低致動器
    (DYNAMIXEL XM430) 的電流效率。


    ### 熱壓入嵌件安裝

    PC-CF (碳纖維強化 PC) 列印件若直接鎖入金屬螺絲，易因材料特性磨損螺紋。為此，使用黃銅材質的熱壓入嵌件 (HTBI-M3-BR) [S21]。嵌件插入
    4.0 mm 引導孔後，透過加熱融化周圍樹脂進行緊固，即使反覆拆裝仍能維持高機械強度 [S21]。安裝時嵌件若傾斜，會導致已組裝的連桿對齊偏差，因此務必維持垂直。'
  worked_examples:
  - 例題 1：確認外殼內徑 - iglide® JSM-0810-10 軸承外徑為 10 mm。因此外殼內孔需設計為 10 mm，且嵌件安裝時若未遵守 4.0
    mm 引導孔規格，可能導致嵌件鬆動或外殼損壞 [S17, S21]。
  - 例題 2：M3 螺絲組裝 - M3x10 內六角螺絲使用 2.5 mm 六角扳手鎖緊，過大扭力會導致嵌件周圍樹脂產生裂痕，故固定於「無法再轉動的瞬間」即可，切勿施加過大力量
    [S20]。
  lab:
    title: 機器人手關節精密組裝
    steps:
    - 1. 確認 PC-CF 列印件外殼的 4.0 mm 引導孔乾淨無雜質，並將嵌件垂直對齊。
    - 2. 將烙鐵加熱至適當溫度，將嵌件垂直緩慢下壓至與外殼表面平行。
    - 3. 將 iglide® 軸承壓入內孔，並插入 8 mm 鋁合金軸確認間隙與阻力。
    - 4. 使用 M3 螺絲完成連桿間緊固，並活動關節以驗證摩擦是否均勻。
    safety:
    - 烙鐵溫度極高，小心燙傷，加熱後應立即歸位。
    - 嵌件壓入過程產生的細微粉塵應避免吸入，請確保通風良好。
    - 作業時務必佩戴護目鏡。
    - 偵測到異常發熱、異味或冒煙時，請勿靠近，並由危險區域外切斷建築配電盤斷路器或認證的 upstream master disconnect 以中斷 3 個電源供應器之供電。若危險區域外無可操作的
      upstream 斷電手段，禁止系統通電。扭力釋放不可取代電源切斷。維修或接近設備必須在計畫性停止後物理斷開並驗證無電源狀態。
    deliverables:
    - 各關節摩擦試驗紀錄
    - 嵌件垂直對齊確認照
    - 已組裝連桿之自由度與間隙測量紀錄
  assignment:
    title: 組裝公差與緊固力分析報告
    deliverables:
    - 關節組裝順序與扭力管理計畫書
    - 間隙發生時的解決方案（使用墊片 Shim 或修正公差）說明
    - 已組裝機器人手指之握持試驗預備數據
    rubric:
    - 是否明確描述嵌件安裝的垂直度？
    - 是否正確說明軸承與軸的公差概念？
    - 是否遵守組裝階段的安全守則？
  quiz:
  - question: iglide® J 軸承壓入外殼後內徑自動調整的原因為何？
    choices:
    - 因材料彈性，壓入後自動膨脹。
    - 因設計上使其在壓入外殼孔位後，可調整至精確尺寸。
    - 因為壓入前的內徑設計上總是小於基準值。
    answer_index: 1
    explanation: iglide® 套筒軸承在壓入前設計為大於基準值，當壓入正確尺寸的外殼內孔後，才會達到設計內的公差內徑 [S17]。
  - question: 於 PC-CF 列印件使用黃銅熱壓入嵌件時，適當的引導孔尺寸為何？
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: 依據數據表，HTBI-M3-BR 嵌件建議引導孔尺寸為 4.0 mm [S21]。
  completion_criteria:
  - 確認已組裝之 5 個手指關節摩擦阻力均勻，並提交測量紀錄。
  - 以目視及測量確認所有嵌件與 PC-CF 外殼保持平行。
  - 簽署並提交組裝安全守則承諾書及作業紀錄表。
  source_ids:
  - S17
  - S18
  - S20
  - S21
- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: 配線與安全電源分離建構
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - 理解為致動器驅動配置獨立 12 V 電源分路的方法。
  - 學習用於過電流保護之 ATOF 保險絲的角色與選定原理。
  - 習得安全電源管理與物理斷電協定。
  - 配置 OpenCR 控制器與 FSR 感測器的安全分壓電路。
  theory_markdown: '## 安全接線與電源分離原則


    5支機器手系統使用多個高扭力致動器，因此高效且安全的電源分配至關重要。本專案使用 11 個電源變壓器，將致動器按 4 台/4 台/3 台為單位分組配置，旨在分散各分路的電流負載並提升電源穩定性
    [S15]。


    ### 1. 電源獨立性確保

    各變壓器的正極(+)輸出必須保持獨立分路，嚴禁任意合併或捆綁。設計上需確保在 [S15] 所述之變壓器額定輸出電流(11.5 A)內，能容納致動器峰值電流(XM430-W350-T
    1 台總計 2.3 A) [S11]。4 台分組之峰值電流總和為 9.2 A，在變壓器之連續輸出容許範圍內。


    ### 2. 過電流保護 (Protection Coordination)

    各分路配置 10 A ATOF 保險絲，以保護系統免受配線或致動器故障時產生之過電流損害 [S25]。由於 ATOF 保險絲於額定電流之 110%~135%
    水準動作，故能針對 9.2 A 之峰值電流提供穩定保護。惟保險絲之選定務必參考製造商提供之「時間-電流曲線」(Time-Current Curve)，負載電流低不代表絕對安全
    [S25]。


    ### 3. 控制電路分離

    使用內建 DYNAMIXEL 連接埠之 OpenCR 控制板，移除複雜外部橋接電路，以提升重現性 [S13]。FSR 力感測器為將電壓轉換為 ADC 輸入，採用由
    3.3 V 感測器軌供電之分壓電路，且必須與 12 V 致動器電源在電氣上隔離 [S13]。


    ### 4. 作業安全須知

    由於桌面原型並非認證之機械安全系統，進行維修或修改作業前，務必物理性拔除 3 個電源變壓器，並使用三用電表之直流電壓模式確認各分路之殘餘電壓低於 1 V [S7]。'
  worked_examples:
  - 偵測到異常發熱、異味或冒煙時，請勿靠近，並由危險區域外切斷建築配電盤斷路器或認證的 upstream master disconnect 以中斷 3 個電源供應器之供電。若危險區域外無可操作的
    upstream 斷電手段，禁止系統通電。扭力釋放不可取代電源切斷。維修或接近設備必須在計畫性停止後物理斷開並驗證無電源狀態 [S11] [S25]
  - 例題 2：FSR ADC 電路電壓 - 使用 OpenCR 的 3.3 V 感測器導軌連接 10 kΩ 分壓電阻與 FSR 402 [S13, S26]。感測器訊號電壓需位於
    0~3.3 V 範圍內，此電路必須與 12 V 致動器電源電路在物理上與電氣上分離。
  lab:
    title: 電源分路線束製作與安全點檢
    steps:
    - 各供應器輸出端焊接 ATO 線型保險絲座，並插入 10 A ATOF 保險絲 [S24, S25]。
    - 使用 Molex Micro-Fit 3.0 接頭製作致動器與感測器連接線束 [S14]。
    - 將 OpenCR 板與各致動器以 3 個分路分配配線，並連接至各供應器 [S13]。
    - 通電前，使用三用電表電阻模式確認各供應器輸出端之絕緣狀態。
    - 通電後，於電壓模式確認各分路為 12 V，斷電時務必拆除 3 個供應器。
    safety:
    - 維修前物理斷開 3 個電源供應器。
    - 殘留電壓低於 1 V 經三用電表確認後方可更換零件。
    - 通電中不可將手伸入活動範圍。
    - 所有接點應完成絕緣處理，焊接時須佩戴護目鏡。
    deliverables:
    - 製作完成之電源分路線束照片
    - 各分路測量電壓紀錄單
    - 配線圖審查確認書
  assignment:
    title: 安全配線設計報告
    deliverables:
    - 3 個電源分路致動器分配設計案 (每分路 4/4/3 台)
    - 各分路過電流切斷計算書 (峰值電流與保險絲額定比較)
    - 計畫性停止後維修或接近設備前，必須物理斷開 3 個電源供應器，並以儀表確認處於無電源狀態
    rubric:
    - 是否遵守電源獨立與分離原則？
    - 保險絲與連接頭規格是否適宜負載？
    - 電源分離與殘留電壓確認協定是否符合安全指導？
  quiz:
  - question: 各電源供應器的 12 V 輸出(+)是否可並聯使用？
    choices:
    - 可以，電流供應能力提升。
    - 不行，必須維持獨立分路。
    - 只要電壓相同即可。
    - 只要加上保險絲即可。
    answer_index: 1
    explanation: 各供應器輸出必須維持獨立，絕對禁止並聯連接 [S15]。
  - question: 機器人手維修前最重要的安全措施為何？
    choices:
    - 軟體扭力釋放
    - 三用電表電阻測量
    - 物理斷開 3 個電源供應器並確認殘留電壓
    - 按下計畫性停止鈕
    answer_index: 2
    explanation: 維修前務必物理斷開 3 個電源供應器，並以三用電表確認各分路殘留電壓低於 1 V。
  - question: FSR 力量感測器 ADC 電路應使用哪種電源導軌？
    choices:
    - 12 V 致動器導軌
    - 5 V 電源導軌
    - 3.3 V 感測器導軌
    - 24 V 電源導軌
    answer_index: 2
    explanation: 為保護 OpenCR ADC 電路，必須使用 3.3 V 感測器導軌 [S13]。
  completion_criteria:
  - 完成 3 個獨立分路線束配置與保險絲安裝
  - 確認各分路無負載時電壓測量為 12 V
  - 物理斷開電源後，紀錄所有測量節點殘留電壓皆低於 1 V
  - 提交並通過配線安全設計報告
