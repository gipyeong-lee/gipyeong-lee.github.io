capstone:
  title: 機器手臂最終組裝與抓取測試
  deliverables:
  - 最終組裝完成之機器手臂
  - 控制韌體原始碼
  - 抓取測試數據紀錄
  - 最終專案報告
  rubric:
  - 機械精度與運作範圍
  - 抓取成功率（針對多樣化物件）
  - 控制系統反應速度
  - 電氣與機械安全性遵守狀況
  safety:
  - 計畫性停機後，維修/進入前請物理斷開 3 個絕緣電源轉接器，並記錄各分支殘餘電壓於 DC 電壓模式下小於 1 V。
  - 檢查各獨立電源分支之 10 A 保險絲額定與時間-電流特性。
  - 於固定治具上進行無負載測試後，分階段增加抓取負載。
  - 於切割、鑽孔、肌腱張力調整及抓取測試過程中，務必佩戴防衝擊安全護目鏡。
