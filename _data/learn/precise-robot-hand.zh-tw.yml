    safety:
    - 維修前物理斷開 3 個電源供應器，確認電壓低於 1 V，證實處於無電狀態。
    - 通電期間，切勿將手伸入致動器活動範圍內。
    - 電路測試時務必配戴護目鏡。
    - 若偵測到異常發熱、異味或冒煙，請勿靠近，並透過危險區域外的預設建物配電盤斷路器或認證的 upstream master disconnect 切斷 3
      個供應器的電源後撤離。若危險區域外無可操作的 upstream 斷電手段，禁止系統通電。扭力解除不等於電源切斷。維修或接近設備必須在計畫停止後，物理斷開電源並確認無電後才可進行。
    deliverables:
    - 各分流電壓測量校準記錄表
    - FSR 感測器壓力-ADC 值特性曲線圖
    - 正常運作狀態下的機器手臂線束照片與配線圖
  assignment:
    title: 電源系統設計與回授邏輯實作
    deliverables:
    - 致動器分流負載分配與熔斷器保護計算書
    - 利用 FSR 感測器資料之抓取力控制演算法（虛擬碼）
    - 最終配線與電源整合設計報告
    rubric:
    - 12 V 致動器與 3.3 V 感測器電源軌是否正確分離？
