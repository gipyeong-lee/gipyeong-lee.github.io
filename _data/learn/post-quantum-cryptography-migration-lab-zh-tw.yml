- id: m7
  slug: hybrid-tls-analysis
  phase_id: p3
  title: Hybrid TLS 交握分析
  estimated_hours: 8.0
  prerequisites:
  - m6
  objectives:
  - 說明量子威脅環境下 TLS 1.3 的脆弱性。
  - 理解基於 ML-KEM 的混合 (Hybrid) TLS 交握結構。
  - 在基於 OQS (Open Quantum Safe) 的本地環境中測量混合模式效能。
  - 透過封包擷取分析傳統演算法與 PQ 演算法結合的交握過程。
  theory_markdown: '### 混合 TLS 交握理論


    現行的 TLS 1.3 依賴 ECDH (Elliptic Curve Diffie-Hellman) 等傳統公開金鑰密碼學，若足夠強大的量子電腦問世，此類加密將面臨被破解的風險
    [S2]。作為應對，將 ML-KEM (Module-Lattice-Based Key-Encapsulation Mechanism) 等 NIST 標準後量子密碼
    (PQC) 整合的研究正蓬勃發展 [S2]。


    #### 混合模式的安全假設

    在完全遷移至 PQC 之前，為確保營運穩定性，使用結合傳統演算法與 PQ 演算法的『混合 (Hybrid) 模式』。此方法結合兩演算法的共享秘密 (Shared
    Secret)，設計上確保只要兩演算法中任一者安全，即可維持通訊機密性。


    #### 效能考量

    TLS 1.3 交握效能直接依賴於 KEM 的計算成本 [S2]。特別是金鑰產生 (Key Generation)、封裝 (Encapsulation)、解封
    (Decapsulation) 階段的運算效率決定了整體交握速度。近期已透過 AVX-512 等指令集最佳化，加速多項式乘法與模組化縮減，以提升交握效能的技術正被應用中
    [S2]。'
  worked_examples:
  - 範例 1：混合金鑰交換過程 - 用戶端將傳統共享秘密值與 PQC 封裝結果傳送給伺服器。伺服器在解封後，將兩組共享秘密結合至 KDF (Key Derivation
    Function) 以產生階段金鑰。
  - 範例 2：交握延遲分析 - 比較 PQ 演算法應用時，因金鑰大小 (Key Size) 增加導致網路傳輸時間延長的現象。數值化性能最佳化 (例如 AVX-512
    使用) 應用前後，每秒交握數 (Handshakes per second) 的差異 [S2]。
  lab:
    title: 基於 OQS 的混合 TLS 交握重現實驗
    steps:
    - 在隔離的 Docker 環境中建置整合 liboqs 與 oqs-provider 的 OpenSSL 3 建置環境。
    - 設定既有的 ECDH 模式與 ML-KEM 基礎的混合模式 (如 secp256r1_mlkem768)。
