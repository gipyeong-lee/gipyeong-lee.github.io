  - S1
- id: m4
  slug: test-env-setup
  phase_id: p2
  title: 建立隔離的實驗環境
  estimated_hours: 8.0
  prerequisites:
  - m3
  objectives:
  - 理解用於後量子密碼 (PQC) 實驗的隔離式本地開發環境的結構原理及其必要工具 (liboqs, oqs-provider) 的角色。
  - 分析 KEM 效能在 TLS 1.3 等協定中對交握 (Handshake) 延遲的影響。
  - 利用 Docker 容器設計並建立具備固定依賴、可重現的實驗環境。
  theory_markdown: '### 隔離 PQC 實驗環境的必要性

    為了保護現有公開金鑰密碼 (RSA, ECDH 等) 免受量子電腦威脅，NIST 標準化了 ML-KEM (基於 Kyber) 與 ML-DSA (基於 Dilithium)
    等後量子演算法。若要在本地環境評估這些演算法的效能與安全性，具備 **密碼敏捷性 (Crypto-agility)** 且可重現的環境是不可或缺的 [S2]。


    #### 1. 主要構成要素

    *   **liboqs**: 以 C 語言實作 PQC 演算法的函式庫，提供了可測試多種 KEM 與簽章演算法的基礎。

    *   **oqs-provider**: 使用 OpenSSL 3 的提供者架構，將 PQC 演算法整合至現有 TLS 基礎設施的介面。

    *   **混合模式 (Hybrid mode)**: 結合現有傳統密碼 (ECDH) 與 PQC 演算法，作為即使 PQC 函式庫存在潛在弱點也能維持現有安全水準的轉型策略
    [S2]。


    #### 2. 實驗環境的核心：隔離與可重現性

    實驗必須與營運環境徹底分離。使用 Docker 等容器技術將依賴版本固定 (Locking)，可減少研究者間執行結果的差異，並能準確測量演算法最佳化 (例如利用
    AVX-512) 的效果 [S2]。在評估交握效能時，應使用固定硬體與隔離網路，以將延遲時間的不確定性降至最低。'
  worked_examples:
  - 範例 1：利用 Dockerfile 建立基於 oqs-provider 的環境。說明如何藉由註明各函式庫版本以確保建置可重現性。
  - 範例 2：利用 OpenSSL CLI 測試混合 TLS 交握。使用 'openssl s_server' 與 's_client' 模擬 ML-KEM-768
    支援的混合 TLS 1.3 連線的方法。
