    - 由於標竿測試過程中可能產生高 CPU 負載，請監控系統資源。
    - 注意避免將實際秘密值或金鑰資料包含在擷取檔案中。
    deliverables:
    - 運算效能測量腳本 (.py)
    - 測量結果 CSV 資料
    - 各演算法效能比較分析報告 (.md 或 .ipynb)
  assignment:
    title: 基於密碼敏捷性的效能評估報告
    deliverables:
