- id: m8
  slug: migration-roadmap
  phase_id: p3
  title: 編寫轉換優先順序報告
  estimated_hours: 8.0
  prerequisites:
  - m7
  objectives:
  - 理解用於後量子密碼 (PQC) 轉換的風險及業務影響分析架構
  - 基於密碼資產清單數據決定轉換優先順序
  - 建立確保密碼敏捷性 (Cryptographic Agility) 的技術策略
  - 規劃最終轉換路線圖及結構化驗證報告
  theory_markdown: '### 轉換優先順序策略 (Migration Prioritization Strategy)


    向 NIST 後量子標準 (ML-KEM, ML-DSA) 的轉換始於系統整體的密碼資產評估。轉換優先順序不僅取決於演算法的老舊程度，還取決於資料的壽命 (Data
    Shelf Life)、密碼暴露風險以及系統的戰略重要性 [S1]。


    #### 1. 密碼資產評估標準 (Assessment Criteria)

    為判斷轉換急迫性，請利用以下標準：

    - **資料安全壽命：** 加密資料若在未來被量子電腦破解時所造成的影響（例如：10 年以上需維持機密性的資料）。

    - **系統敏捷性：** 目前實現的密碼是否為硬編碼，或是能否透過設定檔 (Config) 進行演算法更換。

    - **技術債：** 使用該密碼模組的依賴項 (Dependency) 及維護可能性。


    #### 2. 確保密碼敏捷性

    轉換路線圖的核心是在更換演算法時將程式碼變更最小化。建議使用抽象層 (Abstraction Layer) 分離業務邏輯與密碼引擎，並透過混合式金鑰交換方式，確保既有演算法的穩定性與
    PQC 的量子抵抗性。'
  worked_examples:
  - 範例 1：基於資料生命週期的優先順序計算 - 需保存 20 年的人事資料庫，其 PQC 轉換優先順序評估高於保存 5 年的日誌資料。
  - 範例 2：混合式 TLS 設定案例 - 結合既有的 ECDH 與 ML-KEM，設計為即便其中一種演算法失效，仍能維持通訊機密性的混合式模型分析。
