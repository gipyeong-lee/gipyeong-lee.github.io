- id: m8
  slug: migration-roadmap
  phase_id: p3
  title: 编写转换优先级报告
  estimated_hours: 8.0
  prerequisites:
  - m7
  objectives:
  - 理解用于后量子密码 (PQC) 转换的风险与业务影响分析框架
  - 基于加密资产清单数据确定转换优先级
  - 为确保密码敏捷性 (Cryptographic Agility) 制定技术策略
  - 构建最终转换路线图及验证报告
  theory_markdown: '### 转换优先级策略 (Migration Prioritization Strategy)


    向 NIST 后量子标准 (ML-KEM, ML-DSA) 的转换始于对整个系统的加密资产评估。转换优先级不仅取决于算法的老化程度，还取决于数据的生命周期
    (Data Shelf Life)、加密暴露风险以及系统的战略重要性 [S1]。


    #### 1. 加密资产评估标准 (Assessment Criteria)

    使用以下标准来判断转换的紧迫性：

    - **数据安全生命周期：** 加密数据在未来被量子计算机破解时产生的影响（例如：需要保密 10 年以上的数据）。

    - **系统敏捷性：** 当前实现的密码是硬编码的，还是可以通过配置文件 (Config) 替换算法。

    - **技术债务：** 使用该加密模块的依赖项 (Dependency) 以及是否可维护。


    #### 2. 确保密码敏捷性

    转换路线图的核心是在替换算法时最大限度地减少代码更改。建议采用抽象层 (Abstraction Layer) 将业务逻辑与加密引擎分离，并通过混合密钥交换方式确保既有算法的稳定性和
    PQC 的抗量子性。'
  worked_examples:
  - 示例 1：基于数据生命周期的优先级估算 - 需保存 20 年的人事信息数据库比仅需保存 5 年的日志数据在 PQC 转换中具有更高的优先级。
  - 示例 2：混合 TLS 配置案例 - 分析将现有的 ECDH 与 ML-KEM 相结合，从而设计出只要两种算法中有一种是安全的，就能维持通信保密性的混合模型。
