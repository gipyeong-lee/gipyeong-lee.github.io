    - 为优先级最高的 3 个资产制定混合实现计划。
    - 描述转换过程中可能出现的兼容性问题及其应对措施（回退策略）。
    safety:
    - 所有计算和分析仅在独立的隔离虚拟环境中进行。
    - 不得更改生产服务器的实际加密配置。
    - 审查分析笔记，确保其中不包含实际的密钥材料。
    deliverables:
    - 已排列优先级的清单 CSV 分析文档
    - 包含转换计划的技术决策表
