- id: m5
  slug: liboqs-integration
  phase_id: p2
  title: OQS 与 oqs-provider 集成
  estimated_hours: 8.0
  prerequisites:
  - m4
  objectives:
  - 理解 Open Quantum Safe (OQS) 架构与 oqs-provider 的作用。
  - 掌握 PQ (Post-Quantum) 算法在 TLS 1.3 中的集成方式。
  - 在本地环境中构建并验证混合 (Hybrid) TLS 握手。
  - 思考 KEM 实现优化（如 AVX-512）对实际握手性能的影响。
  theory_markdown: '## OQS 与 oqs-provider 集成理论


    为了保护现有的数据传输免受量子计算机威胁，将 NIST 标准的后量子算法 (PQC) 集成至现有协议（如 TLS 1.3）中至关重要。OQS (Open Quantum
    Safe) 项目为加速这一集成提供了关键框架 [S2]。


    ### 1. liboqs 与 oqs-provider

    - **liboqs**: 包含 PQC 算法 (ML-KEM, ML-DSA 等) 的 C 语言实现的核心库，为各种算法提供统一 API。

    - **oqs-provider**: 利用 OpenSSL 3 的 Provider 架构，帮助 OpenSSL 应用程序 (如 `s_client`,
    `s_server`) 原生使用 liboqs 的 PQC 算法的中间层。通过此方式，无需修改代码即可在现有 TLS 工具中测试 PQC 功能。


    ### 2. TLS 1.3 的 PQ 集成方式

    在 TLS 1.3 握手过程中，PQC KEM 替换或补充了现有的密钥交换 (如 ECDH)。

    - **PQ-only 模式**: 仅使用 PQC KEM 进行密钥交换。

    - **混合 (Hybrid) 模式**: 结合现有的传统算法 (ECDH) 与 PQC 算法。此策略旨在确保后量子安全性同时保持传统安全保障，从而应对算法实现错误或未来的漏洞
    [S2]。


    ### 3. 性能考虑因素

    PQC KEM 的密钥大小或计算量通常大于传统算法，因此会对握手性能产生直接影响 [S2]。利用最新的硬件指令集 (如 AVX-512) 优化多项式乘法及模运算，可以提升握手速度
    [S2]。'
  worked_examples:
  - 示例 1：要验证 oqs-provider 是否已加载到 OpenSSL 中，执行 `openssl list -providers` 命令。输出结果应包含
    'oqs' 提供程序。
  - 示例 2：执行混合握手时，通过命令行参数指定密钥交换组，如 `openssl s_client -groups kyber768_x25519...`。这是
    ML-KEM (Kyber) 与传统 Curve25519 相结合的混合组。
  lab:
