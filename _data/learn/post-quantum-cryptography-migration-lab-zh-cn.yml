- id: m2
  slug: nist-pq-standards
  phase_id: p1
  title: ML-KEM 与 ML-DSA 标准理解
  estimated_hours: 8.0
  prerequisites:
  - m1
  objectives:
  - 解释格密码体系的数学基础与安全性依据。
  - 理解 NIST 标准 ML-KEM（密钥封装机制）的运行原理。
  - 掌握 NIST 标准 ML-DSA（数字签名算法）的结构特性。
  - 分析格密码相比其他密码方式（代码基、哈希基）具有实务优势的原因。
  theory_markdown: '## 理解 ML-KEM 与 ML-DSA 标准


    ### 1. 格密码的兴起

    目前主导实务标准化的系统是基于格 (Lattice-based) 的系统。这是因为它们在最坏情况 (worst-case) 到平均情况 (average-case)
    之间存在强大的数学归约 (reductions)，且能够高效实现 [S4]。另一方面，基于代码 (Code-based) 或基于哈希 (Hash-based)
    的方式起着保守锚点 (conservative anchors) 的作用，具备更长的安全历史或仅需最低限度假设的特性 [S4]。


    ### 2. ML-KEM (Module-Lattice Key Encapsulation Mechanism)

    ML-KEM 基于以前称为 Kyber 的算法。它基于模格难题 (Module Learning With Errors, MLWE)，流程如下：

    - **KeyGen:** 在模格中生成公钥和私钥。

    - **Encapsulation:** 使用公钥生成共享秘密值 (Shared Secret) 和封装后的密钥 (Ciphertext)。

    - **Decapsulation:** 使用私钥从封装后的密钥中恢复出原始共享秘密值。


    ### 3. ML-DSA (Module-Lattice Digital Signature Algorithm)

    ML-DSA 基于 Dilithium，使用了“带中止的 Fiat-Shamir (Fiat-Shamir with Aborts)”技术。它通过格难题的难度提供防伪能力，是兼顾签名大小与公钥大小的实用标准。


    ### 4. 安全假设

    格密码系统的安全性与寻找最短向量问题 (Shortest Vector Problem, SVP) 密切相关。与量子计算机的 Shor 算法能高效破解传统
    RSA 或 ECC 不同，格难题被认为即使使用量子算法也无法在多项式时间内求解。'
  worked_examples:
  - 示例 1：格基 KEM 的安全强度对比。ML-KEM-512, 768, 1024 分别对应 NIST 安全强度 1, 3, 5 级别。其目标是达到类似于传统密码
    AES-128, 192, 256 的安全水平。
  - 示例 2：应用模格 (Module Lattice) 概念。通过使用向量和矩阵优化运算，从而在保持安全强度的情况下优化性能，优于普通格结构。
  lab:
    title: ML-KEM 与 ML-DSA 算法基础实验
    steps:
    - 安装 liboqs 并设置环境变量。
    - 使用 Python 示例代码执行 ML-KEM 密钥对生成及封装过程。
    - 执行使用 ML-DSA 对消息进行签名与验证的脚本。
    - 测量并记录每项运算所需的时间。
    safety:
    - 不得访问实验用虚拟环境以外的系统证书或真实密钥文件。
    - liboqs 库仅供研究与测试使用，不得将其误认为是运行环境的安全解决方案。
    - 所有实验数据保留在本地虚拟环境中，不得传输至外部网络。
    deliverables:
    - 包含运算时间测量数据的 CSV 文件
    - 算法实现执行结果截图
    - 实操过程总结日志
  assignment:
    title: 后量子密码标准分析报告
    deliverables:
    - ML-KEM 与 ML-DSA 算法特征总结表
    - 格密码系统在实际转换时需考虑的性能约束（如密钥大小）分析
    - 利用研究用库进行测试的局限性描述
    rubric:
    - 是否准确描述了标准算法的数学依据？
    - 是否分析了格密码系统的优势与局限？
    - 是否展示了对安全威胁模型的正确理解？
  quiz:
  - question: 下列哪项是格密码系统主导实务标准化的主要原因？
    choices:
    - 因为它拥有最短的安全历史
    - 因为它能够实现最坏情况到平均情况的归约，且具备高效实现可能
    - 因为它可以轻易被量子算法破解
    - 因为它仅使用基于代码的密码来最大化安全性
    answer_index: 1
    explanation: 格密码系统凭借其强大的数学归约依据及高效的实现可行性，处于 NIST 标准化的中心 [S4]。
  - question: ML-KEM 基于哪种数学问题类型？
    choices:
    - 大整数分解问题
    - 椭圆曲线离散对数问题
    - 模学习误差问题 (MLWE)
    - 哈希冲突问题
    answer_index: 2
    explanation: ML-KEM 以模格基础的学习误差 (MLWE) 问题作为安全性依据。
  completion_criteria:
  - 理论学习评估测验全部答对
  - 提交包含实验过程及测量数据的报告
  - 提交确认已遵守实验安全指南并在隔离环境中进行测试的检查清单
  source_ids:
  - S4
- id: m3
  slug: crypto-inventory
  phase_id: p2
  title: 密码资产识别与管理
  estimated_hours: 8.0
  prerequisites:
  - m2
  objectives:
  - 解释密码资产识别 (Cryptographic Inventory) 的概念与必要性。
  - 学习系统分类组织内加密算法、库及使用处的方法。
  - 掌握为密码敏捷性 (Crypto-agility) 进行元数据管理的要素。
  - 评估已识别密码资产的风险等级，以确定后量子转换优先级。
  theory_markdown: '## 密码资产识别 (Cryptographic Inventory)


    密码资产识别是指将组织内使用的所有加密算法、协议、库以及应用这些加密技术的系统和数据进行系统化列表的过程。这是准备向后量子密码 (PQC) 转换的第一步，核心在于明确所保护密码算法的依赖关系
    [S1]。


    ### 1. 主要管理对象

    - **算法与协议**: TLS, SSH, 代码签名, 数据加密 (AES, RSA, ECC 等)。

    - **基础设施**: 证书颁发机构 (CA), 密钥管理系统 (KMS), HSM, 云密钥存储。

    - **软件**: 加密库版本 (OpenSSL, BoringSSL 等) 及静态/动态链接情况。


    ### 2. 密码敏捷性 (Crypto-agility)

    密码敏捷性是指在最小化代码变更的前提下，能够迅速更换加密算法的能力。为实现此点，系统不应硬编码特定算法，而应具备通过配置文件选择算法的抽象层。


    ### 3. 风险评估标准

    - **数据生命周期**: 加密数据在未来是否需要保持机密？（例如：现在窃取并在未来可能被解密的数据）

    - **转换难度**: 是否需要更换硬件，还是仅需软件更新即可？

    - **法规与合规**: 是否与 NIST PQC 标准的应用时机对齐。'
  worked_examples:
  - 系统扫描结果示例：识别到“正在使用 TLS 1.2 (ECDHE-RSA-AES128-GCM-SHA256)”。在此情况下，意识到 RSA 和 ECDHE
    暴露于量子威胁，并对 ML-KEM/ML-DSA 转换对象进行分类。
  - 密码敏捷性自检表：若“算法是否被硬编码？”回答为“是”，则提升风险分数。若“是否可以通过配置文件选择密码算法？”回答为“否”，则提升转换难度。
  lab:
    title: 密码资产识别与风险评估实操
    steps:
    - 对示例项目的源代码进行 'AES', 'RSA', 'ECC' 关键词搜索，寻找使用点。
    - 将已识别的密码实现（包括库）记录至 '密码资产清单 CSV'。
    - 根据 '安全寿命', '量子威胁等级', '数据重要性' 为每项资产核算风险分数。
    - 基于算出的分数对转换优先级 (P0~P3) 进行分类。
    safety:
    - 不得扫描正在运行的生产系统中的私钥或实际服务证书。
    - 测试仅使用隔离于虚拟环境内的虚拟证书（测试用）。
    - 分析结果（CSV, 文档）中不得包含实际秘密值或加密密钥值。
    deliverables:
    - 密码资产清单 CSV 文件（包括算法、使用处、库、库版本）
    - 基于优先级的密码资产风险评估报告 (Markdown)
  assignment:
    title: 密码敏捷性分析与转换路线图制定
    deliverables:
    - 密码资产清单 CSV
    - 定义了转换优先级的决策表
    - 后量子转换路线图
    rubric:
    - 是否全面识别了密码资产？
    - 风险评估标准是否客观合理？
    - 转换路线图是否遵循了后量子技术转换的逻辑顺序？
    - 是否包含了改进密码敏捷性的具体技术建议？
  quiz:
  - question: 密码资产识别 (Cryptographic Inventory) 的主要目的是什么？
    choices:
    - 为了优化所有加密库的性能
    - 为了把握组织内的密码依赖性，准备 PQC 转换
    - 为了删除所有加密算法
    - 为了强制仅使用非对称密码
    answer_index: 1
    explanation: 密码资产识别旨在系统地管理需要转换的加密算法位置和依赖关系，从而有效地执行 PQC 转换。
  - question: 下列关于密码敏捷性 (Crypto-agility) 的定义，哪项最为贴切？
    choices:
    - 为了更强大的加密而更换硬件的过程
    - 自动化更新加密库的功能
    - 在最小化代码变更的前提下，需要时能迅速更换密码算法的灵活性
    - 极其频繁地更换加密密钥
    answer_index: 2
    explanation: 密码敏捷性是指在算法更换时最小化代码变更负担，以适应不断变化的安全环境的能力。
  completion_criteria:
  - 提交密码资产清单 CSV 并完成风险评估
  - 编写各密码资产转换难度及风险优先级说明报告
  - 퀴즈 项目正确率达到 100%
  source_ids:
  - S1
- id: m4
  slug: test-env-setup
  phase_id: p2
  title: 构建隔离实验环境
  estimated_hours: 8.0
  prerequisites:
  - m3
  objectives:
  - 理解用于后量子密码 (PQC) 实验的隔离本地开发环境的构成原理，以及必要工具（liboqs, oqs-provider）的作用。
  - 分析在 TLS 1.3 等协议中 KEM 性能对握手延迟的影响。
  - 使用 Docker 容器设计并构建依赖项固定、可重现的实验环境。
  theory_markdown: '### 隔离 PQC 实验环境的必要性

    为了保护现有公钥密码（RSA, ECDH 等）免受量子计算机威胁，NIST 标准化了如 ML-KEM（基于 Kyber）及 ML-DSA（基于 Dilithium）等后量子算法。要在本地环境评估这些算法的性能与安全性，具备“密码敏捷性
    (Crypto-agility)”且可重现的环境至关重要 [S2]。


    #### 1. 主要构成要素

    *   **liboqs**: 以 C 语言实现 PQC 算法的库，为测试各种 KEM 及签名算法提供基础。

    *   **oqs-provider**: 利用 OpenSSL 3 的 Provider 架构，将 PQC 算法集成至现有 TLS 基础设施的接口。

    *   **混合模式 (Hybrid mode)**: 结合现有传统密码 (ECDH) 与 PQC 算法，作为一种转换期策略，即使在 PQC 库存在潜在缺陷时也能维持现有的安全水平
    [S2]。


    #### 2. 实验环境核心：隔离与可重现性

    实验必须完全脱离生产环境。利用 Docker 等容器技术固定 (Locking) 依赖项版本，可以减少研究人员之间的执行结果差异，从而精确测量算法优化（如利用
    AVX-512）的效果 [S2]。在进行握手性能评估时，应使用固定的硬件和隔离的网络，以最小化延迟的不确定性。'
  worked_examples:
  - 示例 1：利用 Dockerfile 构建基于 oqs-provider 的环境。说明通过明确各库版本来确保构建可重现性的方式。
  - 示例 2：使用 OpenSSL CLI 进行混合 TLS 握手测试。说明使用 'openssl s_server' 和 's_client' 模拟连接支持
    ML-KEM-768 的混合 TLS 1.3 的方法。
  lab:
    title: 构建隔离的 PQC 测试台 (Testbed)
    steps:
    - 准备实验用 Docker 容器镜像基础 (Ubuntu 22.04 LTS 及以上)。
