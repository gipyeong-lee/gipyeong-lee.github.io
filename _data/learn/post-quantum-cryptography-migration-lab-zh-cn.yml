    - 验证握手是否成功，并查看会话加密算法信息。
    safety:
    - 实验务必仅在隔离的本地虚拟环境内执行。
    - 绝不使用生产服务中使用的证书或密钥。
    - Wireshark 捕获时请确保不包含真实服务流量。
    deliverables:
    - oqs-provider 激活确认截图
