  title: インテリジェント5指ロボットハンド最終製作および試験
  deliverables:
  - 最終設計CADファイル
  - 統合ファームウェアおよび制御コード
  - 把持性能および耐久試験データ
  - システム安全性評価書
  - 最終プロジェクト結果報告書
  rubric:
  - 機構的な精度および動作性の評価
  - リアルタイム制御アルゴリズムの実装レベル
  - 計画停止後、整備・接近前の物理的な電源分離と無電源計測手順の文書化の完結性
  - 文書化（BOM、図面）の完結性
  - 試験データ分析および性能検証
  safety:
  - 計画停止後、整備・接近前に3個の絶縁電源アダプターを物理的に分離し、各分岐の残留電圧がDC電圧モードで1 V未満であることを記録
  - 各独立電源分岐の10 Aヒューズ定格と時間-電流特性を点検
  - 固定治具で無負荷試験後、段階的に把持荷重を増加
  - 切断・ドリル・腱の張力および把持試験中は、衝撃防止用の作業用保護メガネを着用
