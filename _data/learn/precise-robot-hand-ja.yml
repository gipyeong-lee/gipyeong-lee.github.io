    rubric:
    - 電源独立性と分離原則を遵守したか？
    - ヒューズとコネクタの定格が負荷に対して適切に選定されているか？
    - 電源分離および残留電圧確認プロトコルが安全指針に従っているか？
  quiz:
  - question: 各電源アダプタの 12 V 出力(+)を並列に接続してもよいか？
    choices:
    - 可能、電流供給能力が高まる。
    - 不可能、独立した分岐として維持しなければならない。
    - 電圧が一致すれば可能。
    - ヒューズを追加すれば可能。
    answer_index: 1
    explanation: 各アダプタ出力は独立して維持されなければならず、並列接続は絶対に禁止です [S15]。
  - question: ロボットハンドのメンテナンス前に最も優先すべき安全措置は？
    choices:
