- id: M7
  slug: firmware-development
  phase_id: P3
  title: ファームウェア開発および制御
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - DYNAMIXEL スマートアクチュエータ通信および制御フレームワークの理解
  - OpenCR 制御ボードを活用したアクチュエータおよび FSR センサ信号取得の実装
  - リアルタイムロボット制御の状態機械および閉ループフィードバックループ設計
  - 安全な電源管理およびトルクオフシーケンスプログラミング
  theory_markdown: '### ファームウェアアーキテクチャおよび DYNAMIXEL 制御

    ロボットハンドのファームウェアは、高速ループ内でセンサデータを取得し、アクチュエータ命令を処理します。`OpenCR 1.0` 制御器は 216MHz ARM
    Cortex-M7 プロセッサをベースとし [S13]、別途のブリッジなしで DYNAMIXEL プロトコル 2.0 を処理して [S11] 遅延時間を最小化します。各アクチュエータは電流、速度、位置モードをサポートし、ロボットハンドは電流制御を通じたトルクベースの把持戦略を使用します。


    ### FSR 力フィードバックシステム

    FSR 402 センサは、加えられた力に反比例する抵抗特性を持ちます [S12]。OpenCR の 12 ビット ADC を使用し [S13]、3.3V センサレールから
    10kΩ 抵抗と電圧分圧回路を構成します。分圧された電圧は `ADC値 = (V_in * R_fsr) / (R_fsr + R_ref)` を通じて正規化され、この値は指の腱張力と連動して把持力フィードバックとして使用されます。


    ### 安全な制御ルーチン

    システム停止は安全のために二段階に分けられます。ソフトウェア段階ではアクチュエータのトルクをオフ（Torque Off）にして物理的駆動力即座に除去します。整備前には必ず
    3 個の独立電源アダプタの電源を物理的に分離した後、マルチメータの DC モードを使用してすべての分岐で 1V 未満であることを確認しなければなりません。'
  worked_examples:
  - '1. アクチュエータ目標位置/電流設定: DYNAMIXEL SDK を使用して XM430 アクチュエータの電流制限（Goal Current）を設定し、センサ値に応じた
    PID ループを通じて指関節の最終位置を更新する例題。'
  - '2. FSR 電圧データフィルタリング: ADC で収集された生データのノイズを除去するために移動平均フィルタ（Moving Average Filter）を適用し、上限（20N）と下限（0.2N）範囲を正規化するコード実装
    [S12]。'
  lab:
    title: ロボットハンド統合制御および精密把持実習
    steps:
    - 各独立分岐の電圧が 1V 未満であることをマルチメータ DC モードで確認した後、組立を開始する。
    - OpenCR の 3.3V センサレールに FSR 電圧分圧回路をはんだ付けし、ADC ポートに接続する。
    - DYNAMIXEL SDK を使用して 11 個のアクチュエータの ID をスキャンし、初期位置を設定する。
    - 無負荷状態で指関節駆動命令をテストしながら、腱の伸長率と張力を調節する。
    - FSR センサデータをシリアルモニタで視覚化しながら把持力応答をチューニングする。
    safety:
    - 絶対に 5V または 12V アクチュエータ電源を FSR センサ回路の供給電源として使用しないこと。
    - システム通電中には決して指の可動範囲に近づかず、固定治具を使用すること。
    - 電源分岐アダプタの陽(+)端子を絶対に相互接続しないこと。
    - 整備・組立接近前には、必ず 3 個の電源アダプタを物理的に分離し、すべての分岐で 1V 未満であることを計測確認すること。
    deliverables:
    - リアルタイムセンサデータフィードバックが含まれたファームウェアソースコード
    - 電圧分圧データの正規化および校正データシート
    - アクチュエータフィードバックループ正常作動ログ
  assignment:
    title: 把持状態機械設計および実装
    deliverables:
    - 把持および把持解除状態機械ダイアグラム
    - 電流ベースのトルク制御実装コード
    - 最終性能評価レポート
    rubric:
    - センサ値に応じた電流制限範囲( 0- 2.3A)が安定的に制御されているか？
    - トルク解除指令時、物理的な張力が即座に除去されるか？
    - コード内に安全なハードウェア分離手順が明示されているか？
  quiz:
  - question: FSR 402センサーと電圧分割回路を構成する際に推奨される電源レールは何ですか？
    choices:
    - 12Vアクチュエータ電源レール
    - 5V汎用電源レール
    - OpenCR 3.3Vセンサーレール
    - 24V外部入力レール
    answer_index: 2
    explanation: システムの安全性とOpenCR ADC保護のため、FSR電圧分割回路は必ず3.3Vセンサー電源レールに接続する必要があります。
  - question: ロボットハンド整備時に、システムが「無電源状態」であることを確認する正しい方法は何ですか？
    choices:
    - ソフトウェアでトルク解除指令を送る。
    - マルチメーターの抵抗モードで配線状態を確認する。
    - マルチメーターのDC電圧モードで、すべての分岐が1V未満であることを計測する。
    - 電源分岐のヒューズを外す。
    answer_index: 2
    explanation: 物理的な電源分離後、必ずマルチメーターのDC電圧モードですべての分岐の残留電圧が1V未満であることを直接確認する必要があります。
  - question: 複数の独立した電源アダプター出力のプラス(+)端子を並列に接続してもよいですか？
    choices:
    - 電流の合計のために必要である。
    - 絶対禁止である。
    - 定格出力電流が同じであれば可能である。
    - ヒューズを装着すれば可能である。
    answer_index: 1
    explanation: 独立した分岐で構成された電源アダプターのプラス(+)出力は、互いに接続したり統合したりしては絶対にいけません。
  completion_criteria:
  - 各分岐別の独立した電源供給およびヒューズ保護がBOM仕様に従って構成されたことをマルチメーターで検証完了
  - OpenCR ADCを通じた5個のFSRセンサーの精密な力信号取得およびフィルタリング確認
  - ソフトウェアのトルク解除ルーチンと物理的な電源遮断後の計測手順を完璧に遂行
  - 把持ステートマシンが意図通りにアクチュエータとセンサーデータを処理し、最終報告書が提出された
  source_ids:
  - S13
  - S11
  - S12
- id: M8
  slug: sensor-integration
  phase_id: P3
  title: センサー統合およびフィードバック制御
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - FSR 402センサーと10 kΩ抵抗を用いた電圧分割回路の構成原理を理解する
  - OpenCRコントローラーのADC機能と入力範囲（0〜3.3 V）の制約条件を習得する
  - センサーデータのフィルタリングおよびキャリブレーション技術を習得する
  - フィードバックに基づく把持制御アルゴリズムを実装し、ロボットハンドの接触力制御を実習する
  theory_markdown: '## センサー統合と接触力フィードバック


    ロボットハンドの精密な把持制御は、指先に作用する力を正確に測定することから始まります。FSR 402センサーは、加えられる圧力が増加するほど抵抗値が減少する感圧抵抗器です
    [S12]。これをマイクロコントローラーが読み取れる電圧信号に変換するには、電圧分割回路が必要です。


    ### 1. 電圧分割回路

    FSRセンサーと10 kΩ分圧抵抗を直列に接続し、3.3 Vセンサー電源を供給します [B4, B5, B2]。ADCピンはセンサーと抵抗の接点に接続され、出力電圧
    $V_{out}$は次のように計算されます。

    10 kΩプルダウン分圧器は $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$ を使用する。


    - OpenCRコントローラーのADCは12ビットの分解能を持ち、入力範囲は0〜3.3 Vに制限されます [B2]。この範囲を超えた入力は回路素子を損傷させる可能性があるため、必ず指定されたセンサー電源レール（3.3
    V）のみを使用しなければなりません [B2]。


    ### 2. 制御ループとフィードバック

    測定された力データは、PID制御アルゴリズムや適応制御戦略の入力値として使用されます [S3]。ロボットハンドが物体を把持する際、腱駆動モーター（DYNAMIXEL
    XM430-W350-T）はセンサー値を参照し、設定された目標接触力に達するまでトルクを微調整します [B1, B4]。'
  worked_examples:
  - '例題1: FSR出力計算。$R_{FSR}$が5 kΩ、$R_{fixed}$が10 kΩのとき、3.3 V入力基準で $V_{out} = 3.3 \times
    (5 / (5 + 10)) = 1.1 V$。これはADC入力範囲（0〜3.3 V）内に正常に位置します。'
  - '例題2: 把持力補正。センサー値がノイズによって揺れる場合、単純移動平均フィルタを適用することで、センサー値の急激な変動を抑え、把持力を安定的に維持できます。'
  lab:
    title: 指先FSRセンサー回路の構成および補正
    steps:
    - OpenCRの3.3 VセンサーレールとGNDをブレッドボードに接続します。
    - FSR 402と10 kΩ抵抗を直列に接続し、電圧分割回路を構成します [B4, B5]。
    - 分圧接点をOpenCRのADCピンに接続します [B2]。
    - PCとOpenCRを接続し、センサー値を読み取るテストコードを実行します。
    - 無負荷状態と目標の力を加えたときのADC値を記録し、補正表を作成します。
    safety:
    - 電源投入前には必ずマルチメーターで3.3 Vレールと12 Vアクチュエータレールの短絡の有無を確認してください [B2]。
    - 保護メガネを常時着用し、通電中はロボットハンドの可動範囲内に手を入れないでください。
    - 異常な発熱・異臭・煙を感知した場合は近づかず、危険区域の外から事前指定された建物配電盤の遮断器、または認証済みのupstream master disconnectにより3個のアダプターの供給電源を遮断した後に避難する。危険区域の外に操作可能なupstream遮断手段がない場合は、システムの通電を禁止する。トルク解除は電源遮断の代わりにはならない。整備・接近は計画停止後、物理的な分離および無電源計測確認の後でのみ行う。
    - 修理やセンサーへの接近前には3個の絶縁電源アダプターを物理的に分離し、すべての分岐の電圧が1 V未満であることを計測確認してください。
    deliverables:
    - ADCセンサー読み取りテストの結果データ
    - センサー補正テーブル（ADC値 vs 物理的な力）
    - センサーデータフィルタリングの実装コード
  assignment:
    title: 把持力フィードバック制御アルゴリズムの実装
    deliverables:
    - フィードバック制御コード（センサー読み取り、目標値比較、モータトルク調整）
    - 把持試験結果グラフ（時間 vs 力）
    - 最終報告書（制御ロジックの説明および把持安定性分析）
    rubric:
    - ADCデータが0〜3.3 Vの範囲内で安定的に測定されるか？
    - センサー値が目標値に達したとき、モータが適切にトルクを解除または維持するか？
    - 非常時にトルク解除がソフトウェア的に正常動作するか？
    - 報告書に電源遮断確認手順が技術的に記述されているか？
  quiz:
  - question: OpenCRコントローラーのADCピンにFSR電圧分割信号を入力する際、必ず守るべきことは何ですか？
    choices:
    - 12 Vアクチュエータ電源レールを使用する。
    - 3.3 Vセンサー電源レールのみを使用する。
    - 5 V電源レールを使用する。
    - 電源を外部から別途供給する。
    answer_index: 1
    explanation: OpenCRのADC入力範囲は0〜3.3 Vであるため、これを超える電圧が印加されないよう、必ず3.3 Vセンサー電源レールのみを使用しなければなりません。
  - question: FSRセンサーの抵抗値変化と物理的な力の関係はどうですか？
    choices:
    - 圧力が増加すると抵抗値が増加する。
    - 圧力が増加すると抵抗値が減少する。
    - 圧力変化と抵抗値は無関係である。
    - 圧力が増加すると抵抗値が一定の割合で増幅される。
    answer_index: 1
    explanation: FSRは、圧力を加えるとセンサーの抵抗値が減少する特性を持つ感圧抵抗器です。
  - question: ロボットハンド試作作業中に、整備や接近のために電源を遮断した後に確認すべき安全状態は何ですか？
    choices:
    - ソフトウェア的にトルクを解除したか確認する。
    - ヒューズの断線の有無をマルチメーターで測定する。
    - 3個の電源アダプターを物理的に分離し、各分岐の電圧が1 V未満であることをDC電圧モードで計測する。
    - 電源スイッチを切った後、抵抗モードで導線状態を測定する。
    answer_index: 2
    explanation: 電源遮断とは3個の電源を物理的に分離することであり、安全のために必ずマルチメーターのDC電圧モードですべての分岐が1 V未満であることを直接確認しなければなりません。
  completion_criteria:
  - ADCを通じたFSR値読み取り実習の合格
  - 把持力フィードバック制御コードが目標値に90%以上到達
  - すべての安全規則（物理的な電源分離および電圧測定）の遵守証明
  - 最終結果報告書の提出
  source_ids:
  - S3
  - S12
  - S26
- id: M9
  slug: testing-validation
  phase_id: P3
  title: 性能試験および検証
  estimated_hours: 10.0
  prerequisites:
  - M8
  objectives:
  - ロボットハンドの精度および再現性を検証するための定量的試験指標を設計する
  - FSRセンサーデータを利用した把持力制御アルゴリズムの安定性を評価する
  - DYNAMIXELアクチュエータフィードバックデータと実際の物理的動作の誤差を分析する
  - 機構的な欠陥および腱駆動メカニズムの耐久性検証手順を習得する
  theory_markdown: '## 性能試験および検証理論


    ロボットハンドの性能検証は、設計仕様と実際の物理的な挙動の整合性を確認する過程です [S1]。主な指標は次の通りです。


    ### 1. 位置および把持精度

    再現性（Repeatability）は、同じ指令を実行したときにロボットハンドが到達する位置の誤差範囲を意味します。XM430-W350-Tアクチュエータは内部エンコーダーを通じて精密な位置フィードバックを提供しますが
    [S11]、最終的な指先位置は腱の伸び（伸縮）や摩擦によって誤差が発生します。Dyneema腱は伸縮率が1%未満と非常に低く、再現性の確保に有利です [S16]。


    ### 2. 力制御とFSRセンサー信号処理

    FSR 402センサーは加わった力に応じて抵抗が減少する特性を持ちます [S12]。これを10 kΩ抵抗と分割回路で構成し、OpenCRの12ビットADCで測定します
    [S13, S26]。センサーデータはノイズが多いため、移動平均フィルタ（Moving Average Filter）を適用して安定的な把持力フィードバックループを形成しなければなりません。


    ### 3. 過電流保護および電源安定性

    システムは3個の独立した12 V電源分岐を使用します [S15]。各分岐は10 A ATOFヒューズで保護されており [S25]、アクチュエータのピーク電流合計が保護定格を超えないよう配分しなければなりません。これはメーカーが提供するヒューズの「時間-電流曲線」を通じて保護協調を検証しなければなりません。'
  worked_examples:
  - '例題1: OpenCR ADC電圧計算。FSR抵抗が10 kΩで、直列抵抗が10 kΩのとき、3.3 V電圧分割器の出力は $V_{out} = 3.3
    \times (10k / (10k + 10k)) = 1.65 V$ です。これは12ビットADC範囲内に適しています [S13, S26]。'
  - '例題2: ヒューズ保護協調。アクチュエータ4台がストール状態のとき、電流合計は9.2 Aです [S11]。10 Aヒューズのコールド抵抗は7.7 mΩであるため
    [S25]、通常運転時の電圧降下は約0.07 Vレベルで無視できますが、過電流時の正確な応答はヒューズメーカーの時間-電流曲線を参照しなければなりません。'
  lab:
    title: ロボットハンド統合機能試験
    steps:
    - 各電源分岐を物理的に分離した状態で3個のアダプターの出力をDC電圧モードで計測し、12 Vが出力されるか確認します。
    - 安全治具にロボットハンドを固定し、コントローラー（OpenCR）をPCに接続してアクチュエータトルクを0で解除します。
    - 指ごとにFSRセンサーに加えられる圧力を手で加え、ADCデータの変化を記録します。
    - 無負荷状態で各指の最大可動範囲（ROM）を5回繰り返して動作させ、腱の干渉の有無を確認します。
    - 試験終了後、必ず3個の電源アダプターを壁面のコンセントから抜き、残留電圧を確認します。
    safety:
    - 必ず保護メガネを着用して試験に臨みます。
    - 電源投入中、可動範囲内に手を入れないでください。
    - 異常な発熱・異臭・煙を感知した場合は近づかず、危険区域の外から事前指定された建物配電盤の遮断器、または認証済みのupstream master disconnectにより3個のアダプターの供給電源を遮断した後に避難する。危険区域の外に操作可能なupstream遮断手段がない場合は、システムの通電を禁止する。トルク解除は電源遮断の代わりにはならない。整備・接近は計画停止後、物理的な分離および無電源計測確認の後でのみ行う。
    - 電圧計測を行わずにシステムに触れてはいけません。1 V未満のDC確認は必須です。
    deliverables:
    - 指の把持力センサー校正記録
    - 繰り返し動作の精度測定データ
    - 電源分岐別の負荷電流測定値
  assignment:
    title: ロボットハンド性能分析最終報告書
    deliverables:
    - 性能試験結果分析報告書
    - データに基づく把持制御アルゴリズムコード
    rubric:
    - センサーデータの信号対雑音比（SNR）分析の適切性
    - 繰り返し動作試験における精度の定量化
    - 保護設計（ヒューズ）がシステム保護の意図を満たしているかについての理論的考察
    - 設計仕様と実際の製作物の性能指標の比較
  quiz:
  - question: FSR 402センサーとOpenCR ADCを利用した力測定回路を構成する際に正しいものは？
    choices:
    - FSR電圧分割器は3.3 Vセンサー電源のみを使用し、アナログ入力信号を0〜3.3 V範囲に維持する
    - FSRと10 kΩ抵抗で電圧分圧器を構成し、3.3 Vセンサーレールを使用する
    - ADC信号は常に0〜5 Vの範囲でなければならない
    - FSRは抵抗が一定であるため、別途の分圧抵抗は不要である
    answer_index: 1
    explanation: OpenCRセンサーレール（3.3 V）を使用してADC入力を0〜3.3 V範囲に制限し、分割回路を構成して抵抗変化を電圧変化として読み取らなければなりません
      [S13, S26]。
  - question: DYNAMIXEL XM430-W350-Tアクチュエータの12 V電源分岐を管理する方法として正しいものは？
    choices:
    - 3個のアダプタープラス(+)出力を一つにまとめ、電力を合計する
    - アダプターごとに10 Aヒューズを装着し、個別の独立分岐として使用する
    - 電流がヒューズ定格以下であるため、安全検証なしで使用可能である
    - 電源アダプター出力はヒューズなしで直接並列に接続する
    answer_index: 1
    explanation: 各アダプター出力は独立して維持されなければならず、独立した分岐に合ったヒューズを装着して過電流を保護しなければなりません [S15]。
  - question: ロボットハンド検証段階で最も重要な安全手順は何か？
    choices:
    - ソフトウェア的にトルクを解除すれば電源遮断と同じである
    - 常にマルチメーターで1 V未満のDCを確認した後、整備に接近する
    - ヒューズは計画停止装置の役割をするため、ヒューズを外せばよい
    - 導通（Continuity）モードで電源が遮断されたことを確認する
    answer_index: 1
    explanation: ソフトウェア解除は物理的な電源遮断の代わりにはならず、物理的な分離後にDC電圧モードで残留エネルギーがないことを計測確認することが必須です。
  completion_criteria:
  - 性能試験結果報告書の提出および70点以上の獲得
  - すべてのLab段階において安全指針の遵守および物理的な電源分離の確認完了
  - 制御コードのセンサーデータフィルタリング機能の実装確認
