- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D プリントおよび部品加工
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 炭素繊維補強 PC フィラメント（PC-CF）を使用した部品製作およびプリント設定最適化の理解
  - 熱圧入インサート（Heat-set insert）およびスリーブベアリングの精密組立公差管理の習得
  - 腱駆動メカニズムのための Dyneema ラインの取り扱いおよびキャプスタン設計構造の理解
  - ロボット構造物の寸法安定性と剛性確保のための加工および締結技法の熟知
  theory_markdown: '### 3Dプリントおよび部品加工理論


    #### 炭素繊維強化エンジニアリング素材 (PC-CF)

    PC(Polycarbonate)は高剛性と耐熱性に優れており、ここに炭素繊維が添加されたPC-CFフィラメントは剛性を極大化し、構造用部品の製作に適しています
    [S19]。ただし、炭素繊維の摩耗性のため、必ず硬化鋼ノズルを使用しなければならず [S19]、 285°C前後の高温出力が必要です [S19]。


    #### 精密組立のためのインサートおよび締結

    プラスチック出力物に繰り返しの組立・分解を可能にするため、熱圧入ネジ山インサートを使用します [S21]。M3インサートの場合、 4.0mm直径のパイロットホールをCAD設計時にあらかじめ配置し、正確な位置に着座させる必要があります
    [S21]。また、無給油ポリマーすべり軸受(iglide J)は、8mmアルミニウムシャフトと組み立てられる際、圧入後に内径が最適な隙間を持つように設計されており
    [S17]、軸直径8mmとの公差管理が必須です [S17, S18]。


    #### 腱駆動構造

    Dyneema SK78繊維は 1.5mm直径で 230 daNの高い破断荷重と 1% 未満の伸び率を示し [S16]、鋼製ケーブルの優れた代替材です。腱は回転軸で屈曲が繰り返されるため、キャプスタン端を丸める処理を行い、摩擦による断線を防止する構造設計が重要です。'
  worked_examples:
  - '例題 1: PC-CF フィラメント用ノズルの選択 - 炭素繊維の高い摩耗度を考慮すると、Brass（真鍮）ノズルは急速に摩耗してプリント品質低下やノズル詰まりを誘発するため、必ず硬化鋼（Hardened
    steel）ノズルを選択しなければならないことを確認 [S19]。'
  - '例題 2: インサート穴の設計 - Accu HTBI-M3-BR インサートの外径が 4.4mm だが公式推奨穴径は 4.0mm であるため [S21]、CAD
    設計時に穴径を 4.0mm に固定して熱圧入時にプラスチックがインサートのナーリング（knurling）間に十分入り込むようにする [S21]。'
  lab:
    title: 指構造物製作および組立実習
    steps:
    - 硬化鋼ノズルを装着した FDM 3Dプリンタで炭素繊維 PC フィラメントプリント環境を設定 [S19]。
    - 指リンクと手のひらフレームを出力後、サポート除去および表面整理。
    - 4.0mm パイロット穴に熱圧入インサートをホットツールで垂直設置 [S21]。
    - IGUS 精密アルミニウムシャフトをベアリング規格に合わせて切断および端面取り [S18]。
    - スリーブベアリングをハウジングに圧入後、シャフトを挿入してガタつきを確認 [S17]。
    - M3 キャップスクリューで構造物およびセンサブラケットを締結 [S20]。
    safety:
    - 高温のノズル（285°C）およびベッド（110°C）による火傷に注意 [S19]。
    - 出力物の後加工および面取り時には保護メガネ着用必須。
    - インサート加熱時に煙が発生する可能性があるため、換気設備を稼働。
    - 通電前にすべての機械的締結状態を確認。
    deliverables:
    - 製作された 5 指ロボットハンド構造物（リンク、手のひら）。
    - 熱圧入インサートの垂直度およびベアリングのガタつき測定記録。
    - 最終締結部目視検査完了報告書。
  assignment:
    title: ロボットハンド製作精度検証
    deliverables:
    - 完成した構造物の CAD データと実測値の比較表
    - 組立公差管理計画書
    - 腱ルーティング構造の摩擦低減設計説明書
    rubric:
    - 熱圧入インサートの垂直着座の有無 (上/中/下)
    - シャフト・ベアリング組立後のスムーズな回転運動の有無 (合格/不合格)
    - BOMに明示された部品定格およびモデル規格の遵守有無 [B10, B11, B12, B13, B14]
  quiz:
  - question: PC-CF フィラメント使用時に硬化鋼ノズルを使用しなければならない主な理由は？
    choices:
    - 炭素繊維の摩耗性による真鍮ノズルの急速な摩耗防止
    - フィラメントの融点が低く、通常のノズルでは出力不可
    - 出力物の表面光沢を増大させるため
    - 押出速度を速めるため
    answer_index: 0
    explanation: 炭素繊維は非常に高い摩耗性を持ち、通常の真鍮ノズルを急速に破損させるため、硬化鋼ノズルが必須です [S19]。
  - question: M3 熱圧入インサート（Accu HTBI-M3-BR）使用時に推奨されるパイロット穴径は？
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: 公式データシートで推奨される穴径は 4.0mm です [S21]。
  completion_criteria:
  - すべての構造部品が FDM 3Dプリンタで製作完了 [B10]
  - 熱圧入インサートがすべての指定された穴に正確に設置済み [B14]
  - アルミニウムシャフトとスリーブベアリングの組立ガタつきが基準値を満たしている [B11, B12]
  - 締結時に明示された M3 規格のキャップスクリューが正しく使用されている [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: ベアリングおよび締結部品設置
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 精密ロボットハンド製作のためのベアリングおよびシャフトの機械的公差と設置原理を理解する。
  - 熱圧入インサート（Heat-set insert）を使用してエンジニアリングプラスチック部品の締結強度を確保する方法を習得する。
  - 適切なトルクと締結規格を使用して組立時のガタつきを最小化する。
  theory_markdown: '### ベアリングとシャフトの公差管理

    精密ロボット関節の滑らかな動きと剛性確保のために iglide® J スリーブベアリング（JSM-0810-10）と 8 mm アルミニウム精密シャフト（AWMP-08）を使用する。スリーブベアリングはハウジングに圧入（press-fit）されると内径が調整されるように設計されており、ハウジングの推奨内径公差を遵守することが肝要である
    [S17, S18]。ガタつきが発生すると関節の精度が低下し、逆に狭すぎると摩擦力が増加して駆動器（DYNAMIXEL XM430）の電流効率を低下させる。


    ### 熱圧入インサート設置

    PC-CF（炭素繊維補強 PC）出力物は、金属ネジを直接締結すると材質の特性上、ネジ山が摩耗しやすい。これを防止するために真鍮製の熱圧入インサート（HTBI-M3-BR）を使用する
    [S21]。インサートは 4.0 mm パイロット穴に挿入後、熱を加えて周辺の樹脂を溶かして締結することで、繰り返しの分解・組立にも高い機械的強度を維持する
    [S21]。この際、インサートが傾くと組立済みリンクの整列がずれるため、垂直の維持が必須である。'
  worked_examples:
  - '例題 1: ハウジング内径確認 - iglide® JSM-0810-10 ベアリングの外径は 10 mm である。したがってハウジングボアは 10 mm
    に合わせて設計される必要があり、インサート挿入時にパイロット穴 4.0 mm を守らないと、インサートが空転したりハウジングが破損したりする可能性がある [S17,
    S21]。'
  - '例題 2: M3 ネジ組立 - M3x10 キャップスクリューは 2.5 mm 六角レンチを使用して締結し、過度なトルクはインサート周辺の樹脂にクラックを誘発する可能性があるため、「これ以上回らない時点」で最小限の力で固定する
    [S20]。'
  lab:
    title: ロボットハンド関節精密組立
    steps:
    - 1. PC-CF 出力物ハウジングの 4.0 mm パイロット穴がきれいか確認し、インサートを垂直に整列する。
    - 2. はんだごてを適正温度に加熱し、インサートを垂直にゆっくりと押してハウジング表面と平行に圧入する。
    - 3. iglide® ベアリングをボアに圧入し、8 mm アルミニウムシャフトを挿入してガタつきと抵抗を確認する。
    - 4. M3 ネジを使用してリンク間の締結を完了し、関節を動かして摩擦が均一か検証する。
    safety:
    - はんだごては高温のため火傷に注意し、加熱後は直ちにスタンドに置く。
    - インサート圧入時に発生する微細粉塵は吸入しないよう換気を徹底する。
    - 保護メガネを必ず着用して作業を進める。
    - 異常発熱・異臭・煙を感知した場合は接近せず、危険区域外で指定された分電盤ブレーカーまたは認証された upstream master disconnect
      で 3 個のアダプタ電源を遮断した後に避難すること。危険区域外で操作可能な upstream 遮断手段がない場合は、システム通電を禁止する。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後の物理的分離および無電源計測確認の後でのみ実行すること。
    deliverables:
    - 関節別摩擦試験ログ
    - インサート垂直整列確認写真
    - 組立済みリンクの自由度およびガタつき測定記録
  assignment:
    title: 組立公差および締結力分析レポート
    deliverables:
    - 関節組立順序およびトルク管理計画書
    - ガタつき発生時の解決策（Shim 使用または公差修正）記述
    - 組立完了したロボットハンドリンクの把持試験予備データ
    rubric:
    - インサート挿入の垂直度が明確に記述されているか？
    - ベアリングとシャフトの公差概念を正しく説明しているか？
    - 組立段階での安全規則を遵守したか？
  quiz:
  - question: iglide® J ベアリングがハウジングに圧入された後、内径が調整される理由は何ですか？
    choices:
    - ベアリング材質の弾性により、圧入時に内径が自動的に広がるため。
    - 圧入過程でベアリング内径がハウジングボアの公差に合わせて精密に調整されるよう設計されているため。
    - 圧入前の内径は常に基準値より小さく製作されるため。
    answer_index: 1
    explanation: iglide® スリーブベアリングは圧入前は基準値より大きい状態で製作され、正しいハウジングボアに圧入されたときに設計された公差内の内径を持つように設計されています
      [S17]。
  - question: PC-CF 出力物に真鍮製熱圧入インサートを使用する際、適切なパイロット穴サイズは？
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: データシートによると、HTBI-M3-BR インサートの推奨パイロット穴サイズは 4.0 mm です [S21]。
  completion_criteria:
  - 組立済み 5 本の指関節の摩擦抵抗が均一であることを確認し、測定記録を提出。
  - すべてのインサートが PC-CF ハウジングと水平をなしているかを目視および寸法検査完了。
  - 組立中の安全規則を遵守したことを誓約し、作業記録簿を提出。
  source_ids:
  - S17
  - S18
  - S20
  - S21
- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: 配線および安全な電源分離構築
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - アクチュエータ駆動のための独立した 12 V 電源分岐構成方法を理解する。
  - 過電流保護のための ATOF ヒューズの役割と選定原理を学習する。
  - 安全な電源管理および物理的遮断プロトコルを習得する。
  - OpenCR 制御器および FSR センサの安全な電圧分圧回路を構成する。
  theory_markdown: '## 安全な配線および電源分離原理


    5指ロボットハンドシステムは多数の高トルクアクチュエータを使用するため、効率的で安全な電源分配が不可欠です。本プロジェクトは電源アダプタ 11個を使用し、アクチュエータを
    4台/ 4台/ 3台単位で分離配置しますが、これは各分岐の電流負荷を分散し、電源安定性を高めるためです [S15]。


    ### 1. 電源独立性の確保

    各アダプタのプラス(+)出力は独立した分岐として維持されなければならず、任意に合わせたりまとめる行為は絶対禁止されます。 [S15]に明示されたアダプタの定格出力電流(
    11.5 A)内で、アクチュエータピーク電流(XM430-W350-T 1台あたり 2.3 A)を許容するように設計します [S11]。 4台単位分岐のピーク電流合計は
    9.2 Aであり、アダプタの連続出力許容範囲内にあります。


    ### 2. 過電流保護 (Protection Coordination)

    分岐ごとに 10 A ATOFヒューズを配置し、配線やアクチュエータエラー時の過電流からシステムを保護します [S25]。ヒューズと負荷・電源定格の比較のみで、安全性や動作順序を保証するものではない。ヒューズメーカーのタイム・電流曲線と電源OCP特性を併せて検討し、保護協調を確認する。ただし、ヒューズ選定は必ずメーカーが提供する
    ''Time-Current Curve'' を参照しなければならず、負荷電流が低いからといって安全が保証されるわけではありません [S25]。


    ### 3. 制御回路分離

    DYNAMIXELポート内蔵型OpenCR制御ボードを使用して複雑な外部ブリッジ回路を排除することで、再現性を高めます [S13]。FSR力センサはADC入力で電圧を変換するために
    3.3 V センサレールから供給される分圧回路を使用し、 12 V アクチュエータ電源とは電気的に分離されなければなりません [S13]。


    ### 4. 作業安全規則

    ベンチプロトタイプは認定された機械安全システムではないため、整備や修正作業前には必ず 3個の電源アダプタを物理的に分離し、各分岐の残留電圧が 1 V 未満であることをマルチメータのDC電圧モードで計測確認しなければなりません
    [S7]。'
  worked_examples:
  - 異常発熱・異臭・煙を感知した場合は接近せず、危険区域外で指定された分電盤ブレーカーまたは認証された upstream master disconnect で
    3 個のアダプタ供給電源を遮断した後に避難すること。危険区域外で操作可能な upstream 遮断手段がない場合は、システム通電を禁止する。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後の物理的分離および無電源計測確認の後でのみ実行すること
    [S11] [S25]
  - '例題 2: FSR ADC 回路電圧 - OpenCR の 3.3 V センサレールを使い、10 kΩ 分圧抵抗と FSR 402 を接続する [S13,
    S26]。センサ信号電圧は 0~3.3 V 範囲内にある必要があり、この回路は 12 V アクチュエータ電源回路と物理的/電気的に分離して保護する。'
  lab:
    title: 電源分岐ハーネス製作および安全点検
    steps:
    - 各アダプタ出力ラインに ATO インラインヒューズホルダをはんだ付けし、10 10A ヒューズを挿入する [S24, S25]。
    - Molex Micro-Fit 3.0 コネクタを使用してアクチュエータおよびセンサ接続ハーネスを製作する [S14]。
    - OpenCR ボードと各アクチュエータを 3 個の分岐に配分して配線し、各電源アダプタに接続する [S13]。
    - 通電前に、各アダプタ出力端子の絶縁状態をマルチメータの抵抗モードで確認する。
    - 通電後、電圧モードで各分岐が 12 V であることを確認し、遮断時には必ず 3 個のアダプタをすべて除去する。
    safety:
    - 整備前に 3 個の電源アダプタを物理的に分離すること。
    - 残留電圧が 1 V 未満であることをマルチメータで確認してから部品を交換すること。
    - 通電中には可動範囲内に手を入れないこと。
    - すべての結線部は絶縁処理し、はんだ付け時には保護メガネを着用すること。
    deliverables:
    - 製作された電源分岐ハーネス写真
    - 各分岐別測定電圧記録用紙
    - 配線図検討確認書
  assignment:
    title: 安全配線設計レポート
    deliverables:
    - 3 個の電源分岐のアクチュエータ割り当て設計案（分岐あたり 4 台/4 台/3 台）
    - 各分岐別過電流遮断計算書（ピーク電流とヒューズ定格の比較）
