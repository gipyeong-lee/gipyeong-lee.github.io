modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: ロボット機構学基礎
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - ロボット機構学の基本定義と剛体変換（Rigid-body transformation）の概念を理解する。
  - 座標系変換と回転行列を使用して、ロボットの位置と方向を数学的に記述する方法を習得する。
  - 5 指ロボットハンド設計のための機構学的基礎理論を習得し、解析的アプローチを習得する。
  theory_markdown: '## ロボット機構学の基礎


    ロボット機構学は、ロボットの運動を力やトルクを考慮せず、位置、速度、加速度の側面から扱う学問です [S1]。ロボットハンドのようなマニピュレータ設計の出発点は、各関節の状態を空間上の座標で記述することです。


    ### 1. 剛体変換 (Rigid-body Transformation)

    ロボットの各リンクは剛体と見なされ、一つの座標系から別の座標系への変換は回転(Rotation)と移動(Translation)の組み合わせで表されます。
    3次元空間において回転行列(Rotation Matrix) $R$は直交行列であり、これを通じて二つの座標系間の方向を定義します [S1]。


    ### 2. 順機構学 (Forward Kinematics)

    順機構学は、関節の変数(角度または位置)が分かっているときに、ロボットの末端(End-effector)の位置と方向を計算する過程です。 5指ロボットハンドでは、指の関節角度($\theta_1,
    \theta_2, \dots, \theta_n$)を通じて指先位置を求めます。


    ### 3. 逆機構学 (Inverse Kinematics)

    逆機構学は、望ましい指先位置を目標値として設定したときに、これを達成するための各関節変数を求める過程です。非線形方程式で構成されているため、解が存在しなかったり、多重解が発生したりすることがあります
    [S1]。'
  worked_examples:
  - '例題 1: 2 次元平面で 1 個の回転関節（Rotation Joint）を持つロボットリンクの先端位置 $(x, y)$ を求めよ。関節角度が $\theta$
    でリンク長が $L$ のとき、$x = L \cos(\theta), y = L \sin(\theta)$ である [S1]。'
  - '例題 2: $x$軸に対して $\theta$ だけ回転する 2 次元回転行列 $R$ を記述せよ。$R = \begin{bmatrix} \cos(\theta)
    & -\sin(\theta) \\ \sin(\theta) & \cos(\theta) \end{bmatrix}$ である [S1]。'
  lab:
    title: 座標系変換シミュレーションおよび基礎機構学解析
    steps:
    - 機構学解析ソフトウェアを使用して 2 リンク平面マニピュレータモデルを作成する。
    - 関節角度を変化させながら先端位置の軌跡を確認する。
    - 逆機構学計算式を手動で導出し、シミュレーション結果と比較する。
    safety:
    - コンピュータ作業時は画面の明るさを調節し、定期的に休憩する。
    - 本実習はシミュレーションベースであるため、ハードウェア通電は要求されない。
    deliverables:
    - 機構学解析過程が含まれた要約レポート
    - 軌跡シミュレーション結果画像
  assignment:
    title: 5 指ロボットハンド関節構造機構学モデリング
    deliverables:
    - ロボット指 1 本に対する順機構学方程式の導出成果物
    - 関節角度変化による指先位置の変化予測データ
    rubric:
    - 回転行列の数学的正確性
    - 順機構学方程式の物理的妥当性
    - レポートの論理的構成
  quiz:
  - question: ロボット機構学において、力やトルクを考慮せずに運動のみを記述する学問は何か？
    choices:
    - 動力学（Dynamics）
    - 機構学（Kinematics）
    - 制御理論（Control Theory）
    - 材料力学（Material Mechanics）
    answer_index: 1
    explanation: 機構学は、力とトルクを除外した位置、速度、加速度を中心とする運動論です [S1]。
  - question: 3次元空間において二つの座標系間の方向を定義する行列は？
    choices:
    - 回転行列（Rotation Matrix）
    - 質量行列（Mass Matrix）
    - 剛性行列（Stiffness Matrix）
    - 減衰行列（Damping Matrix）
    answer_index: 0
    explanation: 回転行列は二つの座標系間の方向を数学的に変換する直交行列です [S1]。
  completion_criteria:
  - 理論講座の学習完了
  - 機構学解析結果レポートの提出
  - 理論クイズで 100 点達成
  source_ids:
  - S1
- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: 腱駆動メカニズム設計
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 腱駆動メカニズムの基本力学構造と関節模倣原理を理解する。
  - 精巧なロボットハンドのための腱材料（Dyneema SK78）の特性を学習する。
  - 腱の張力伝達経路とキャプスタン設計時の摩擦および摩耗防止法を習得する。
  - アクチュエータのストールトルクと腱駆動時の機械的利得を計算する。
  theory_markdown: '## 腱駆動メカニズムの基礎


    腱駆動(Tendon-driven)システムは、遠隔地に配置されたアクチュエータからの引張力を、腱（線）を通じて関節に伝達して駆動する方式である [S9]。生物学的な指の腱構造を模倣し、アクチュエータを手のひらや前腕に移動させることで、指自体の質量を減らし、精巧な動きを実現できる
    [S10]。


    ### 1. 腱の選択および張力伝達

    本設計では、高強度・低伸長繊維であるDyneema SK78を使用する [S16]。この材料は直径 1.5 mmで 230 daN(約 230 kgf)の破断荷重を有し、作動伸び率が
    1% 未満であり、精密な位置制御に適している [S16]。


    ### 2. 機械的利得と駆動機の選定

    XM430-W350-T スマートアクチュエータは、ストールトルク 4.1 N·mを提供する [S11]。腱は回転軸からキャプスタン半径を通じて力を変換するため、アクチュエータのトルク出力は腱の張力に置換される。システム全体で
    11台のアクチュエータを使用し、ピーク電流合計は約 25.3 Aに達する可能性がある [S11]。ヒューズと負荷・電源定格の比較のみで、安全性や動作順序を保証するものではない。ヒューズメーカーのタイム・電流曲線と電源OCP特性を併せて検討し、保護協調を確認する
    [S15, S24, S25]。


    ### 3. 安全および保護設計

    各 12 V 電源分岐は、独立したヒューズを介して運用される [S15, S24]。 3個の電源アダプタはそれぞれ 11.5 A 定格であり、合計電流容量は
    34.5 Aに達し、システムピーク電流である 25.3 Aを十分に許容する [S11, S15]。分岐合計定格がアクチュエータの総ピーク電流を上回るように設計し、運用安全性を確保する。'
  worked_examples:
  - '例題 1: 腱駆動時の張力計算

    アクチュエータトルク(τ)が 1 N·m、キャプスタン半径(r)が 0.01 mのとき、腱張力(T)は T = τ/r = 1/0.01 = 100 Nである。Dyneema
    SK78 の破断荷重 230 daN（約 2300 N）に対する安全率を考慮して設計する [S16]。'
  - '例題 2: 電源分岐配分および保護

    アクチュエータ全 11 台のストール電流合計は 25.3 A である [S11]。これを 3 個の分岐に 4 台、4 台、3 台ずつ配分すると、各分岐の最大負荷はそれぞれ
    9.2 A、9.2 A、6.9 A となる。ヒューズと負荷・電源定格の比較だけでは安全性や動作順序を保証できない。ヒューズメーカーの時間-電流曲線と電源 OCP
    特性を併せて検討し、保護協調を確認すること。ヒューズメーカーの時間-電流曲線とアダプタ OCP 特性を併せて検討し、保護協調を確認すること [S24, S25]。'
  lab:
    title: 腱張力および関節摩擦測定実習
    steps:
    - 提供されたリンクとベアリングを使用して指関節モデルを組み立てる。
    - 腱を接続し、テンショナーを使用して初期張力を設定する。
    - マルチメータを DC 電圧モードに設定し、各分岐の 12 V 電源アダプタ出力を物理的に分離して確認する。
    - 通電前に、関節の回転摩擦力を手動で測定し記録する。
    safety:
    - 整備・接近前には 3 個の絶縁電源アダプタを物理的に分離し、マルチメータで 1 V 未満の DC 電圧であることを確認する。
    - 通電中は決して指の可動範囲に近づかないこと。
    - 耐衝撃作業用保護メガネを必ず着用すること。
    deliverables:
    - 関節回転角度に応じた腱張力測定データ
    - 摩擦力分析レポート
    - 最終安全計測記録
  assignment:
    title: 5 指ロボットハンド腱経路設計
    deliverables:
    - ロボット指の腱経路 CAD 図面
    - 腱の摩擦および損失計算書
    - 分岐別電源負荷配分およびヒューズ保護設計図
    rubric:
    - 腱経路が屈曲部の摩擦を最小化するように設計されているか？
    - Dyneema SK78の物理的特性が考慮されているか？
    - 3個の電源分岐の負荷配分が、アクチュエータのストール電流を適切に反映しているか？
    - ヒューズおよび電源短絡防止設計がBOM仕様を遵守しているか？
  quiz:
  - question: Dyneema SK78 腱を使用する際の主な利点は何か？
    choices:
    - 高い伸長率による衝撃吸収
    - 非常に低い動作伸長率と高い破断荷重
    - 金属より軽い重量と低い引張強度
    - 電気伝導性
    answer_index: 1
    explanation: Dyneema SK78 は伸長率が 1% 未満と非常に低く、位置制御の精度を高め、非常に高い破断荷重を持つ高性能繊維である [S16]。
  - question: 3 個の 12 V 電源アダプタ（各 11.5 A）を使用する理由として適切なものは？
    choices:
    - すべてのシステムを一つの電源で駆動するため
    - 電圧を 36 V に増幅してトルクを高めるため
    - アクチュエータの総ピーク電流を分散収容し、個別の分岐ヒューズで保護するため
    - 電源ノイズを除去するため
    answer_index: 2
    explanation: ヒューズと負荷・電源定格の比較だけでは安全性や動作順序を保証できない。ヒューズメーカーの時間-電流曲線と電源 OCP 特性を併せて検討し、保護協調を確認すること
      [S11, S15, S25]。
  completion_criteria:
  - すべての実習データと図面が最終レポートに含まれていること。
  - 物理的電源分離後、3 個の分岐の DC 電圧が 1 V 未満であることを計測で実証すること。
  - 腱経路設計においてキャプスタン摩擦を考慮した解析が含まれていること。
  source_ids:
  - S9
  - S10
  - S16
  - S11
  - S15
  - S24
  - S25
- id: M3
  slug: actuator-controller-selection
  phase_id: P1
  title: 駆動器および制御器選定
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - DYNAMIXEL XM430-W350-T アクチュエータの定格電圧、電流、通信特性を理解する。
  - OpenCR 1.0 制御器の DYNAMIXEL ポート構成および 12V 電源分離構造を熟知する。
  - FSR 402 センサと 10kΩ 抵抗を用いた電圧分圧回路を設計する。
  - システム電力要件を計算し、独立分岐ヒューズ保護設計を策定する。
  theory_markdown: '### 駆動機および制御器システム設計理論


    #### 1. アクチュエータ選定および電力特性

    ロボットハンドの精密駆動のためにDYNAMIXEL XM430-W350-Tを使用する。このアクチュエータは12V定格電圧で動作し、ストール(Stall)電流は
    2.3Aである [S11]。ロボットハンド全体は 11個のアクチュエータで構成されるため、全ストール電流合計は約 25.3Aに達する。したがって、安定した駆動のために独立した電源供給体系が必要である。


    #### 2. 制御器アーキテクチャ

    OpenCR 1.0は216MHz ARM Cortex-M7プロセッサを搭載しており、リアルタイム制御に適している [S13]。この制御器は、12Vアクチュエータ電源とロジック/センサ電源を物理的に分離できる構造をサポートする。FSRセンサのようなアナログ入力は
    0~3.3Vの範囲内で処理する必要があるため、センサ電圧分圧回路は必ずOpenCRの 3.3V センサレールから供給を受けなければならない [S13]。


    #### 3. 過電流保護および電源分岐設計

    138W出力のMEAN WELL GST160A12-R7Bアダプタ 3個を使用する [S15]。各アダプタの定格電流は 11.5Aであり、これを通じて独立した12V分岐を
    3個生成する。各分岐には10A ATOFヒューズをインラインで装着し、過電流発生時に回路を保護する [S24, S25]。ヒューズは定格電流 11.5Aより低く設定し、保護協調を達成する。


    #### 4. センサ信号取得

    FSR 402は、圧力が上昇すると抵抗が減少する特性を持つ [S12]。これを10kΩ固定抵抗と電圧分圧器で接続して力の変化を電圧信号に変換し、OpenCRの12bit
    ADCポートに入力する [S12, S13, S26]。'
  worked_examples:
  - '例題 1: 分岐あたりの最大電流確認。分岐一つに 4 個の XM430 アクチュエータを接続する場合、ストール電流の合計は 4 * 2.3A = 9.2A
    である。これはアダプタの 11.5A 定格およびインラインヒューズの 10A 定格を満たし、安全な範囲を維持する [S11, S15, S25]。'
  - '例題 2: FSR 分圧回路電圧計算。3.3V 供給電圧下で FSR 抵抗が R_fsr のとき、ADC 入力電圧 V_adc = 3.3 * (10k
    / (10k + R_fsr)) V となる。センサ範囲（0.2N~20N）に合わせて抵抗変化を確認し、0~3.3V 範囲を超えないように補正する [S12,
    S13, S26]。'
  lab:
    title: 電源分岐構成および ADC センサインタフェース実習
    steps:
    - 各 MEAN WELL アダプタ出力に 0AFH0001Z ヒューズホルダを接続し、0287010 10A ヒューズを挿入する。
    - マルチメータを DC 電圧モードに設定し、各分岐の電圧が安定した 12V であるかを確認する。
    - OpenCR の 3.3V センサレールに 10kΩ 抵抗と FSR 402 を使用して分圧回路を構成する。
    - 非通電状態で分圧回路の出力電圧が 0~3.3V 範囲内にあることを確認する。
    safety:
    - 作業開始前に 3 個のアダプタの AC 電源を物理的に遮断し、マルチメータで 0V であることを確認する。
    - 耐衝撃作業用保護メガネを常に着用すること。
    - 通電中には決して回路を変更したり配線に触れたりしないこと。
    - ヒューズは過電流遮断用であり、計画停止手段ではないことを明示する。
    deliverables:
    - 各分岐別 12V 出力測定値記録用紙
    - FSR 分圧回路組立完了写真
    - 構成された配線図
  assignment:
    title: 電源分岐および保護設計検討
    deliverables:
    - ロボットハンド全体の電流分岐配分表（各分岐別アクチュエータ割り当て）
    - 選定したヒューズがアクチュエータのストール電流を保護しつつ、アダプタ容量を超えないことを証明する計算書
    rubric:
    - 独立ヒューズが各分岐に正確に配置されているか？
    - アクチュエータ分岐配分が 4/4/3 で規定に合致しているか？
    - センサ電源が12Vではなく 3.3V センサレールから供給されているか？
  quiz:
  - question: FSR 402 センサと 10kΩ 抵抗を使用した分圧回路の正しい電源接続は？
    choices:
    - 12V アクチュエータ電源
    - OpenCR 3.3V センサレール
    - 5V 汎用電源
    - OpenCR 12V 出力
    answer_index: 1
    explanation: OpenCR の ADC 入力は 3.3V を基準に動作するため、電圧分圧回路は必ず 3.3V センサレールから電力を供給されなければなりません
      [S13]。
  - question: XM430-W350-T アクチュエータのストール電流値は？
    choices:
    - 1.0A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: データシートによると、該当アクチュエータのストール電流は 2.3A です [S11]。
  - question: 電源分岐設計において絶対に禁止されている行為は？
    choices:
    - 各アダプタ出力にヒューズ装着
    - アダプタの陽(+)出力の並列接続
    - 分岐あたり 10A ヒューズ使用
    - 絶縁型アダプタ使用
    answer_index: 1
    explanation: アダプタの陽(+)出力は独立した分岐として維持しなければならず、並列接続は絶対に禁止です [B3]。
  completion_criteria:
  - 実習で 3 個の独立分岐の 12V 電圧をマルチメータで検証完了
  - FSR 402 センサ分圧回路の配線と ADC 入力電圧範囲の確認完了
  - 電源分岐および保護設計レポート提出および合格
