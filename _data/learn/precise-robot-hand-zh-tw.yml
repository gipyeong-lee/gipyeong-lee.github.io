- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: 肌腱驅動機制設計
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 理解肌腱驅動機制的基本動力結構與關節模擬原理。
  - 學習用於精密機器手的肌腱材料 (Dyneema SK78) 特性。
  - 熟悉肌腱的張力傳遞路徑與絞盤設計時的摩擦及磨損防護方法。
  - 計算致動器的失速扭力與肌腱驅動時的機械增益。
  theory_markdown: '## 肌腱驅動機制基礎


    肌腱驅動 (Tendon-driven) 系統是一種透過肌腱（繩索）將遠端致動器的張力傳遞至關節來驅動的方式 [S9]。模仿生物手指的肌腱結構，將致動器移動至手掌或前臂，可減輕手指本身的質量，並實現精密的動作
    [S10]。


    ### 1. 肌腱的選擇與張力傳遞

    本設計採用高強度、低延伸率的纖維 Dyneema SK78 [S16]。此材料在直徑 1.5 mm 時具有 230 daN（約 230 kgf）的斷裂負載，運作延伸率低於
    1%，適合精密的位置控制 [S16]。


    ### 2. 機械增益與致動器選型

    XM430-W350-T 智慧致動器可提供 4.1 N·m 的失速扭力 [S11]。肌腱透過旋轉軸的絞盤半徑進行力轉換，因此致動器的扭力輸出會置換為肌腱的張力。整個系統使用
    11 台致動器，峰值電流總和可達約 25.3 A [S11]。僅比較保險絲與負載/電源額定值無法保證安全性或動作順序。請務必審閱保險絲製造商的時間-電流曲線與電源
    OCP 特性，以確認保護協調性 [S15, S24, S25]。


    ### 3. 安全與保護設計

    每個 12 V 電源分路均透過獨立保險絲運作 [S15, S24]。 3 個電源轉接器額定皆為 11.5 A，總電流容量達 34.5 A，足以負載系統峰值電流
    25.3 A [S11, S15]。設計時應確保分路總額定值高於致動器總峰值電流，以確保操作安全性。'
  worked_examples:
  - '範例 1：肌腱驅動時的張力計算

    當致動器扭力 (τ) 為 1 N·m，絞盤半徑 (r) 為 0.01 m 時，肌腱張力 (T) 為 T = τ/r = 1/0.01 = 100 N。設計時須考慮
    Dyneema SK78 相對於斷裂負載 230 daN（約 2300 N）的安全係數 [S16]。'
  - '範例 2：電源分路分配與保護

    總共 11 台致動器的失速電流合計為 25.3 A [S11]。若分配至 3 個分路，分別為 4 台、 4 台、 3 台，各分路的最大負載分別為 9.2 A、
    9.2 A、 6.9 A。僅比較保險絲與負載/電源額定值無法保證安全性或動作順序。請審閱保險絲製造商的時間-電流曲線與電源 OCP 特性，以確認保護協調性
    [S24, S25]。'
  lab:
    title: 肌腱張力與關節摩擦測量實習
    steps:
    - 使用提供的連桿與軸承組裝手指關節模型。
    - 連接肌腱並使用張力調整器設定初始張力。
    - 將三用電表設為 DC 電壓模式，物理斷開各分路的 12 V 電源轉接器輸出進行確認。
    - 電源開啟前，手動測量並記錄關節旋轉摩擦力。
    safety:
    - 在維修或接近設備前，須將 3 個絕緣電源轉接器物理斷開，並使用三用電表確認 DC 電壓低於 1 V。
    - 電源開啟時，絕不可接近手指的可移動範圍。
    - 必須佩戴耐衝擊防護眼鏡。
    deliverables:
    - 隨關節旋轉角度的肌腱張力測量數據
    - 摩擦力分析報告
    - 最終安全測量紀錄
  assignment:
    title: 5 機器手肌腱路徑設計
    deliverables:
    - 機器手指肌腱路徑 CAD 圖檔
    - 肌腱摩擦與損失計算書
    - 各分路電源負載分配與保險絲保護設計圖
    rubric:
    - 肌腱路徑設計是否已將彎曲處的摩擦最小化？
    - 是否考量了 Dyneema SK78 的物理特性？
    - 3 個電源分路的負載分配是否適當反映了致動器失速電流？
    - 保險絲及電源短路防護設計是否符合 BOM 規格？
  quiz:
  - question: 使用 Dyneema SK78 肌腱的主要優點為何？
    choices:
    - 因高延伸率產生的衝擊吸收
    - 極低的運作延伸率與高斷裂負載
    - 比金屬輕的重量與低抗拉強度
    - 導電性
    answer_index: 1
    explanation: Dyneema SK78 的延伸率低於 1%，運作極為精確，且為斷裂負載極高的高性能纖維 [S16]。
  - question: 使用 3 個 12 V 電源轉接器（各 11.5 A）的原因何者最為適當？
    choices:
    - 為了用單一電源驅動所有致動器
    - 為了將電壓增幅至 36 V 以提高扭力
    - 為了分散並承載致動器的總峰值電流，並透過個別分路保險絲進行保護
    - 為了消除電源雜訊
    answer_index: 2
    explanation: 僅比較保險絲與負載/電源額定值無法保證安全性或動作順序。請審閱保險絲製造商的時間-電流曲線與電源 OCP 特性，以確認保護協調性
      [S11, S15, S25]。
  completion_criteria:
  - 所有實習數據與圖檔必須包含於最終報告中。
  - 物理斷開電源後，須以測量證明 3 個分路的 DC 電壓皆低於 1 V。
  - 肌腱路徑設計必須包含考量絞盤摩擦的解析。
  source_ids:
  - S9
  - S10
  - S16
  - S11
  - S15
  - S24
  - S25
- id: M3
  slug: actuator-controller-selection
  phase_id: P1
  title: 致動器與控制器選型
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - 理解 DYNAMIXEL XM430-W350-T 致動器的額定電壓、電流與通訊特性。
  - 熟悉 OpenCR 1.0 控制器的 DYNAMIXEL 連接埠架構與 12V 電源分離結構。
  - 設計使用 FSR 402 感測器與 10kΩ 電阻的分壓電路。
  - 計算系統電源需求並建立獨立分路保險絲保護設計。
  theory_markdown: '### 致動器與控制器系統設計理論


    #### 1. 致動器選型與電源特性

    為了機器手的精密驅動，採用 DYNAMIXEL XM430-W350-T。此致動器於 12V 額定電壓下運作，失速 (Stall) 電流為 2.3A [S11]。整個機器手由
    11 台致動器組成，總失速電流合計約達 25.3A。因此，為了穩定驅動，需要獨立的電源供應體系。


    #### 2. 控制器架構

    OpenCR 1.0 搭載 216MHz ARM Cortex-M7 處理器，適合即時控制 [S13]。此控制器支援將 12V 致動器電源與邏輯/感測器電源進行物理分離的架構。由於
    FSR 感測器等類比輸入必須在 0~3.3V 範圍內處理，感測器分壓電路務必由 OpenCR 的 3.3V 感測器軌供電 [S13]。


    #### 3. 過電流保護與電源分路設計

    使用輸出 138W 的 MEAN WELL GST160A12-R7B 轉接器 3 台 [S15]。各轉接器額定電流為 11.5A，據此建立 3 個獨立的
    12V 分路。每個分路均安裝 10A ATOF 串聯式保險絲，以在發生過電流時保護電路 [S24, S25]。保險絲應設定低於額定電流 11.5A，以達成保護協調性。


    #### 4. 感測器訊號獲取

    FSR 402 具有壓力增加時電阻降低的特性 [S12]。將其與 10kΩ 固定電阻以電壓分壓器連接，將力變化轉換為電壓訊號，並輸入至 OpenCR 的 12bit
    ADC 埠 [S12, S13, S26]。'
  worked_examples:
  - 範例 1：確認各分路最大電流。若單一分路連接 4 台 XM430 致動器，失速電流合計為 4 * 2.3A = 9.2A。此數值滿足轉接器 11.5A 額定與串聯式保險絲
    10A 額定，維持在安全範圍內 [S11, S15, S25]。
  - 範例 2：FSR 分壓電路電壓計算。在 3.3V 供應電壓下，當 FSR 電阻為 R_fsr 時，ADC 輸入電壓 V_adc = 3.3 * (10k /
    (10k + R_fsr)) V。依據感測器範圍 (0.2N~20N) 確認電阻變化，以校準確保不超過 0~3.3V 範圍 [S12, S13, S26]。
  lab:
    title: 電源分路建構與 ADC 感測器介面實習
    steps:
    - 於每個 MEAN WELL 轉接器輸出端連接 0AFH0001Z 保險絲座並插入 0287010 10A 保險絲。
    - 將三用電表設為 DC 電壓模式，確認各分路電壓皆為穩定的 12V。
    - 使用 10kΩ 電阻與 FSR 402 在 OpenCR 的 3.3V 感測器軌上架設分壓電路。
    - 在無電源狀態下，確認分壓電路輸出電壓位於 0~3.3V 範圍內。
    safety:
    - 作業開始前，請物理斷開 3 台轉接器的 AC 電源，並確認三用電表顯示為 0V。
    - 必須隨時佩戴耐衝擊防護眼鏡。
    - 電源開啟時，絕不可更改電路或觸碰線路。
    - 明示保險絲僅用於過電流截斷，不得作為計畫停止手段。
    deliverables:
    - 各分路 12V 輸出測量紀錄表
    - FSR 分壓電路組裝完成照
    - 配置好的線路圖
  assignment:
    title: 電源分路與保護設計審核
    deliverables:
    - 整個機器手的電流分路分配表（各分路致動器分配）
    - 證明選用保險絲在保護致動器失速電流的同時，不超過轉接器容量的計算書
    rubric:
    - 獨立保險絲是否已準確配置於各分路？
    - 致動器分路分配是否符合 4/4/3 之規定？
    - 感測器電源是否由 3.3V 感測器軌（而非 12V）供應？
  quiz:
  - question: 使用 FSR 402 感測器與 10kΩ 電阻的分壓電路，正確的電源連接為何？
    choices:
    - 12V 致動器電源
    - OpenCR 3.3V 感測器軌
    - 5V 通用電源
    - OpenCR 12V 輸出
    answer_index: 1
    explanation: 由於 OpenCR 的 ADC 輸入基於 3.3V 運作，電壓分壓電路務必由 3.3V 感測器軌供電 [S13]。
  - question: XM430-W350-T 致動器的失速電流值為何？
    choices:
    - 1.0A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: 根據資料手冊，該致動器的失速電流為 2.3A [S11]。
  - question: 電源分路設計中絕對禁止的行為為何？
    choices:
    - 各轉接器輸出加裝保險絲
    - 轉接器的陽極(+)輸出並聯
    - 每分路使用 10A 保險絲
    - 使用絕緣型轉接器
    answer_index: 1
    explanation: 轉接器的陽極(+)輸出必須維持獨立分路，絕對禁止並聯 [B3]。
  completion_criteria:
  - 實習中已用三用電表驗證 3 個獨立分路的 12V 電壓
