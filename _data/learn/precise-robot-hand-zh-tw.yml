- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D 列印與零件加工
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 理解使用碳纖維強化 PC 線材 (PC-CF) 進行零件製作與最佳化列印設定。
  - 習得熱壓入嵌件 (Heat-set insert) 與套筒軸承的精密組裝公差管理。
  - 理解用於肌腱驅動機制的 Dyneema 線材處理與絞盤設計結構。
  - 熟練確保機器人結構尺寸穩定性與剛性的加工與緊固技術。
  theory_markdown: '### 3D 列印與零件加工理論


    #### 碳纖維強化工程材料 (PC-CF)

    PC (Polycarbonate) 具備優異的剛性與耐熱性，添加碳纖維後的 PC-CF 線材更能將剛性最大化，適合製作結構用零件 [S19]。然而，由於碳纖維的磨蝕性，務必使用硬化鋼噴嘴
    [S19]，且需在 285°C 左右的高溫下輸出 [S19]。


    #### 為了精密組裝的嵌件與緊固

    為了讓塑膠輸出件能進行重複的組裝與拆卸，採用熱壓入螺紋嵌件 [S21]。針對 M3 嵌件，CAD 設計時需預留 4.0mm 直徑的導引孔，以確保安放於精確位置
    [S21]。此外，免潤滑聚合物套筒軸承 (iglide J) 與 8mm 鋁合金軸組裝時，壓入後內徑需達到最佳間隙，且與軸徑 8mm 的公差管理至關重要 [S17,
    S18]。


    #### 肌腱驅動結構

    Dyneema SK78 纖維在直徑 1.5mm 時具有 230 daN 的高斷裂負載與低於 1% 的延伸率 [S16]，是鋼纜的優質替代品。由於肌腱在旋轉軸上會反覆彎曲，絞盤邊緣需進行圓角處理，以防止因摩擦導致斷裂的結構設計至關重要。'
  worked_examples:
  - 範例 1：PC-CF 線材噴嘴選擇 - 考量碳纖維的高磨蝕性，Brass (黃銅) 噴嘴會迅速磨損導致輸出品質下降與噴嘴阻塞，因此必須確認選用硬化鋼 (Hardened
    steel) 噴嘴 [S19]。
  - 範例 2：嵌件孔設計 - Accu HTBI-M3-BR 嵌件外徑為 4.4mm，但官方推薦孔徑為 4.0mm [S21]，故 CAD 設計時將孔徑固定為
    4.0mm，以利熱壓入時塑膠能充分滲入嵌件紋路 (knurling) [S21]。
  lab:
    title: 手指結構製作與組裝實習
    steps:
    - 設定配備硬化鋼噴嘴的 FDM 3D 列印機進行碳纖維 PC 線材列印環境 [S19]。
    - 輸出手指連桿與手掌框架後，進行支撐去除與表面整理。
    - 使用熱工具將熱壓入嵌件垂直安放於 4.0mm 導引孔 [S21]。
    - 依照軸承規格切割 IGUS 精密鋁合金軸並進行末端倒角 [S18]。
    - 將套筒軸承壓入殼體後，插入軸以確認間隙 [S17]。
    - 使用 M3 帽頭螺絲鎖固結構件與感測器支架 [S20]。
    safety:
    - 注意高溫噴嘴 (285°C) 與底板 (110°C) 造成的燙傷風險 [S19]。
    - 進行輸出件後加工與倒角時，務必佩戴防護眼鏡。
    - 嵌件加熱時可能產生煙霧，請啟動通風設備。
    - 通電前請確認所有機械緊固狀態。
    deliverables:
    - 製作完成的 5 機器手結構件（連桿、手掌）。
    - 熱壓入嵌件垂直度與軸承間隙測量紀錄。
    - 最終緊固部位肉眼檢測完成報告。
  assignment:
    title: 機器手製作精度驗證
    deliverables:
    - 完成結構件的 CAD 數據與實際尺寸測量比較表
    - 組裝公差管理計畫書
    - 肌腱繞線結構的減摩擦設計說明書
    rubric:
    - 熱壓入嵌件是否垂直安放（優/良/差）
    - 軸-軸承組裝後是否能平順旋轉（合格/不合格）
    - 是否遵守 BOM 表中所列零件額定與型號規格 [B10, B11, B12, B13, B14]
  quiz:
  - question: 使用 PC-CF 線材時，必須使用硬化鋼噴嘴的主要原因為何？
    choices:
    - 為了防止碳纖維磨蝕性導致黃銅噴嘴快速磨損
    - 因線材熔點低，一般噴嘴無法列印
    - 為了增加輸出件表面光澤
    - 為了提高擠出速度
    answer_index: 0
    explanation: 碳纖維具有極高的磨蝕性，會迅速破壞一般黃銅噴嘴，故必須使用硬化鋼噴嘴 [S19]。
  - question: 使用 M3 熱壓入嵌件 (Accu HTBI-M3-BR) 時，推薦的導引孔直徑為何？
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: 根據官方資料手冊，推薦的孔徑為 4.0mm [S21]。
  completion_criteria:
  - 所有結構零件皆已使用 FDM 3D 列印機製作完成 [B10]
  - 熱壓入嵌件皆準確安放於所有指定孔位 [B14]
  - 鋁合金軸與套筒軸承的組裝間隙符合基準值 [B11, B12]
  - 緊固時正確使用了 BOM 規定的 M3 帽頭螺絲 [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: 軸承與緊固零件安裝
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 理解製作精密機器手時，軸承與軸的機械公差及安裝原理。
  - 習得使用熱壓入嵌件 (Heat-set insert) 確保工程塑膠零件緊固強度的方法。
  - 使用適當的扭力與緊固規格，以將組裝間隙最小化。
  theory_markdown: '### 軸承與軸的公差管理

    為了確保精密機器手關節的平順運動與剛性，採用 iglide® J 套筒軸承 (JSM-0810-10) 與 8 mm 鋁合金精密軸 (AWMP-08)。套筒軸承設計為在壓入
    (press-fit) 殼體時內徑會隨之調整，關鍵在於遵守殼體的建議內徑公差 [S17, S18]。若出現間隙，將導致關節精度下降；若過緊，則會增加摩擦力，降低致動器
    (DYNAMIXEL XM430) 的電流效率。


    ### 熱壓入嵌件安裝

    PC-CF (碳纖維強化 PC) 輸出件因材料特性，若直接鎖入金屬螺絲，螺紋易磨損。為此採用黃銅材質的熱壓入嵌件 (HTBI-M3-BR) [S21]。嵌件置入
    4.0 mm 導引孔後加熱，熔化周邊樹脂進行緊固，即使反覆拆裝也能保持高度機械強度 [S21]。此時若嵌件傾斜，將導致組裝後的連桿對齊失準，故垂直度維持至關重要。'
  worked_examples:
  - 範例 1：確認殼體內徑 - iglide® JSM-0810-10 軸承外徑為 10 mm。因此殼體孔徑須設計為 10 mm；若未遵守嵌件插入導引孔 4.0
    mm，將導致嵌件晃動或殼體破裂 [S17, S21]。
  - 範例 2：M3 螺絲組裝 - M3x10 帽頭螺絲使用 2.5 mm 六角扳手鎖固。過大扭力會導致嵌件周邊樹脂龜裂，故應在「螺絲無法再轉動的瞬間」以最小力道固定
    [S20]。
  lab:
    title: 機器手關節精密組裝
    steps:
    - 1. 確認 PC-CF 輸出件殼體內的 4.0 mm 導引孔潔淨無虞，並將嵌件垂直對齊。
    - 2. 將烙鐵加熱至適當溫度，緩慢垂直壓入嵌件，確保其與殼體表面平行。
    - 3. 將 iglide® 軸承壓入孔位，插入 8 mm 鋁合金軸確認間隙與阻力。
    - 4. 使用 M3 螺絲完成連桿間的鎖固，並測試關節運動，驗證摩擦力是否均勻。
    safety:
    - 烙鐵溫度極高，小心燙傷，加熱後應立即置於架上。
    - 嵌件壓入時產生的微細粉塵請勿吸入，務必徹底通風。
    - 作業時務必佩戴防護眼鏡。
    - 若偵測到異常發熱、氣味或煙霧，請勿靠近，並由危險區域外透過指定的建築配電盤斷路器或經認證的 upstream master disconnect 切斷
      3 個轉接器的供電並撤離。若危險區域外無可操作的 upstream 斷電手段，禁止系統通電。扭力解除不能代替切斷電源。維修與接近須在計畫停止後，確認物理斷開並驗證無電狀態下執行。
    deliverables:
    - 各關節摩擦測試紀錄
    - 嵌件垂直對齊照片
    - 組裝後的連桿自由度與間隙測量紀錄
  assignment:
    title: 組裝公差與緊固力分析報告
    deliverables:
    - 關節組裝順序與扭力管理計畫書
    - 間隙出現時的解決方案（使用墊片 Shim 或修正公差）說明
    - 組裝完成的機器手連桿夾持測試預備數據
    rubric:
    - 是否明確描述了嵌件插入的垂直度？
    - 是否正確解釋了軸承與軸的公差概念？
    - 是否遵守組裝階段的安全規則？
  quiz:
  - question: 為何 iglide® J 軸承在壓入殼體後會調整內徑？
    choices:
    - 因軸承材料彈性，壓入時內徑會自動變大。
    - 因壓入過程設計為讓軸承內徑精確配合殼體孔徑公差。
    - 因壓入前的內徑製作得總是小於基準值。
    answer_index: 1
    explanation: iglide® 套筒軸承在壓入前製作得比基準值大，當壓入正確的殼體孔徑時，會形成符合設計公差的內徑 [S17]。
  - question: 在 PC-CF 輸出件使用黃銅熱壓入嵌件時，適當的導引孔大小為何？
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: 根據資料手冊，HTBI-M3-BR 嵌件的建議導引孔大小為 4.0 mm [S21]。
  completion_criteria:
  - 已確認 5 根手指關節的摩擦阻力均勻，並提交測量紀錄。
  - 已完成所有嵌件是否與 PC-CF 殼體水平的肉眼與尺寸檢查。
  - 誓約遵守組裝安全守則並提交作業紀錄簿。
  source_ids:
  - S17
  - S18
  - S20
  - S21
- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: 配線與安全電源分路建構
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - 理解為驅動致動器配置獨立 12 V 電源分路的方法。
  - 學習 ATOF 保險絲在過電流保護中的角色與選用原理。
  - 習得安全電源管理與物理斷電協定。
  - 建構 OpenCR 控制器與 FSR 感測器的安全電壓分壓電路。
  theory_markdown: '## 安全配線與電源分離原理


    5 機器手系統使用了多個高扭力致動器，因此高效且安全的電源分配至關重要。本專案使用 11 個電源轉接器，將致動器以 4 台/4 台/3 台為單位分路佈置，旨在分散各分路的電流負載並提升電源穩定性
    [S15]。


    ### 1. 電源獨立性確保

    各轉接器的陽極(+)輸出必須維持獨立分路，嚴禁任意合線或綑綁。請在 [S15] 明示的轉接器額定輸出電流 (11.5 A) 範圍內，承載致動器峰值電流（XM430-W350-T
    每 1 台 2.3 A）[S11]。 4 台單位分路的峰值電流合計為 9.2 A，在轉接器的連續輸出允許範圍內。


    ### 2. 過電流保護 (Protection Coordination)

    於每個分路配置 10 A ATOF 保險絲，以保護線路或致動器異常時的過電流 [S25]。僅比較保險絲與負載/電源額定值無法保證安全性或動作順序。請審閱保險絲製造商的時間-電流曲線與電源
    OCP 特性，以確認保護協調性。保險絲選用務必參考製造商提供的「Time-Current Curve」，且非負載電流低即代表安全 [S25]。


    ### 3. 控制電路分離

    使用 DYNAMIXEL 連接埠內建的 OpenCR 控制板，藉由移除複雜的外部橋接電路來提升重現性 [S13]。FSR 力感測器為將電壓轉換為 ADC 輸入，須使用
    3.3 V 感測器軌的供電分壓電路，並須與 12 V 致動器電源電氣分離 [S13]。


    ### 4. 作業安全守則

    由於工作檯原型並非經認證的機械安全系統，在維修或修正作業前，務必物理斷開 3 個電源轉接器，並以三用電表 DC 電壓模式確認各分路殘留電壓低於 1 V [S7]。'
  worked_examples:
  - 若偵測到異常發熱、氣味或煙霧，請勿靠近，並由危險區域外透過指定的建築配電盤斷路器或經認證的 upstream master disconnect 切斷 3
    個轉接器的電源後撤離。若危險區域外無可操作的 upstream 斷電手段，禁止系統通電。扭力解除不能代替切斷電源。維修與接近須在計畫停止後，確認物理斷開並驗證無電狀態下執行
    [S11] [S25]。
  - 範例 2：FSR ADC 電路電壓 - 使用 OpenCR 的 3.3 V 感測器軌連接 10 kΩ 分壓電阻與 FSR 402 [S13, S26]。感測器訊號電壓須保持在
    0~3.3 V 範圍內，且此電路必須與 12 V 致動器電源電路物理/電氣分離以進行保護。
  lab:
    title: 電源分路線束製作與安全檢查
    steps:
    - 於每個轉接器輸出端烙接 ATO 串聯式保險絲座，並插入 10 A ATOF 保險絲 [S24, S25]。
    - 使用 Molex Micro-Fit 3.0 連接器製作致動器與感測器連接線束 [S14]。
    - 將 OpenCR 板與各致動器以 3 個分路分配佈線，並連接至各電源轉接器 [S13]。
    - 電源開啟前，以三用電表電阻模式檢查各轉接器輸出端子的絕緣狀態。
    - 電源開啟後，於電壓模式確認各分路皆為 12 V，斷電時務必移除所有 3 個轉接器。
    safety:
    - 維修前請將 3 個電源轉接器物理斷開。
    - 確認殘留電壓低於 1 V 後，方可更換零件。
    - 電源開啟時，手部勿置於可移動範圍內。
    - 所有接線處皆需絕緣，烙鐵作業時請佩戴防護眼鏡。
    deliverables:
    - 製作完成的電源分路線束照片
    - 各分路測量電壓紀錄表
    - 配線圖審核確認書
  assignment:
    title: 安全配線設計報告
    deliverables:
    - 3 個電源分路的致動器配置設計方案（每分路 4 台/4 台/3 台）
    - 各分路過電流截斷計算書（峰值電流與保險絲額定比較）
    - 計畫停止後，維修與接近前將 3 個轉接器物理斷開，並確認各分路無電狀態的執行紀錄
    rubric:
    - 是否遵守電源獨立性與分離原則？
    - 保險絲與連接器額定是否符合負載？
    - 電源分離與殘留電壓確認協定是否符合安全指引？
  quiz:
  - question: 是否可將各電源轉接器的 12 V 輸出(+)並聯？
    choices:
    - 可以，電流供應能力會提高。
    - 不行，必須維持獨立分路。
    - 電壓一致時即可。
    - 加裝保險絲即可。
    answer_index: 1
    explanation: 各轉接器輸出必須保持獨立，絕對禁止並聯 [S15]。
  - question: 機器手維護前，最優先執行的安全措施為何？
    choices:
    - 軟體扭力解除
    - 三用電表電阻測量
    - 3 個電源轉接器的物理斷開與殘留電壓確認
    - 按下計畫停止按鈕
    answer_index: 2
    explanation: 維修前務必物理斷開 3 個電源轉接器，並以三用電表確認殘留電壓低於 1 V。
