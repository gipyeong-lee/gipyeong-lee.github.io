  - S13
  - S11
  - S12
- id: M8
  slug: sensor-integration
  phase_id: P3
  title: 傳感器集成與反饋控制
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - 理解使用 FSR 402 傳感器和 10 kΩ 電阻構成分壓電路的原理
  - 熟悉 OpenCR 控制器的 ADC 功能及輸入範圍（0-3.3 V）限制條件
  - 掌握傳感器數據的過濾與校準技術
  - 實現基於反饋的抓取控制算法，並進行機器手接觸力控制實踐
  theory_markdown: '## 感測器整合與接觸力回饋


    機器手精密抓取控制，始於準確測量作用於指尖的力。FSR 402 感測器是一種壓力感測電阻器，其電阻值會隨著施加壓力增加而減少 [S12]。為將其轉換為微控制器可讀取的電壓訊號，需要電壓分壓電路。


    ### 1。電壓分壓電路

    將 FSR 感測器與 10 kΩ 分壓電阻串聯，並供應 3.3 V 感測器電源 [B4, B5, B2]。ADC 接腳連接至感測器與電阻的接觸點，輸出電壓
    $V_{out}$ 計算方式如下：

    10 kΩ 下拉分壓器使用 $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$


    - OpenCR 控制器的 ADC 具有 12 位元解析度，且輸入範圍限制為 0~3.3 V [B2]。超出此範圍的輸入可能會損壞電路元件，因此必須僅使用指定的感測器電源軌
    (3.3 V) [B2]。


    ### 2。控制迴路與回饋

    測得的力數據將作為 PID 控制演算法或適應性控制策略的輸入值 [S3]。當機器手抓取物體時，腱驅動馬達 (DYNAMIXEL XM430-W350-T)
    會參考感測器數值，微調扭矩直至達到設定的目標接觸力 [B1, B4]。'
  worked_examples:
  - 範例 1：FSR 輸出計算。當 $R_{FSR}$ 為 5 kΩ，$R_{fixed}$ 為 10 kΩ，且以 3.3 V 輸入為基準時，$V_{out}
    = 3.3 \times (5 / (5 + 10)) = 1.1 V。此值正常處於 ADC 輸入範圍（0-3.3 V）內。
  - 範例 2：抓取力校準。若傳感器值因噪聲而波動，可應用簡單移動平均濾波器，以減少傳感器值的劇烈波動並穩定保持抓取力。
  lab:
    title: 指尖 FSR 傳感器電路構建與校準
    steps:
    - 將 OpenCR 的 3.3 V 傳感器軌和 GND 連接到麵包板。
    - 將 FSR 402 與 10 kΩ 電阻串聯，構建分壓電路 [B4, B5]。
    - 將分壓節點連接到 OpenCR 的 ADC 引腳 [B2]。
    - 連接 PC 與 OpenCR，並執行讀取傳感器值的測試代碼。
    - 記錄無負載狀態和施加目標力時的 ADC 值，編寫校準表。
    safety:
    - 接通電源前，務必使用萬用表確認 3.3 V 軌與 12 V 執行器軌之間是否存在短路 [B2]。
    - 務必隨時佩戴護目鏡；通電期間，切勿將手放入機器手的運動範圍內。
    - 若偵測到異常發熱、氣味或煙霧，請勿靠近。在危險區域外，請斷開預先指定的建築配電盤斷路器或認證的上游主斷路器，切斷 3 個適配器的電源後撤離。若危險區域外無可操作的上游斷電手段，則禁止對系統通電。扭矩釋放不能替代切斷電源。維護與接近操作僅能在規劃停機後，經過物理斷電及確認無電狀態後方可進行。
    - 維修或接近傳感器前，請物理斷開 3 個絕緣電源適配器，並測量確認所有分支的電壓低於 1 V。
    deliverables:
    - ADC 傳感器讀取測試結果數據
    - 傳感器校準表（ADC 值 vs 物理力）
    - 傳感器數據過濾實現代碼
  assignment:
    title: 抓取力反饋控制算法實現
    deliverables:
    - 反饋控制代碼（傳感器讀取、目標值比較、電機扭矩調整）
    - 抓取試驗結果圖表（時間與力）
    - 最終報告（控制邏輯說明及抓取穩定性分析）
    rubric:
    - ADC 數據是否在 0-3.3 V 範圍內穩定測量？
    - 當傳感器值達到目標值時，電機是否適當地釋放或保持扭矩？
    - 緊急情況下的扭矩釋放功能是否能通過軟件正常運作？
    - 報告中是否技術性描述了斷電確認程序？
  quiz:
  - question: 將 FSR 分壓信號輸入到 OpenCR 控制器的 ADC 引腳時，必須遵守的事項是什麼？
    choices:
    - 使用 12 V 執行器電源軌。
    - 僅使用 3.3 V 傳感器電源軌。
    - 使用 5 V 電源軌。
    - 另外從外部供應電源。
    answer_index: 1
    explanation: OpenCR 的 ADC 輸入範圍為 0-3.3 V，因此為了確保不施加超過此範圍的電壓，必須僅使用 3.3 V 傳感器電源軌。
  - question: FSR 傳感器的電阻值變化與物理力之間有什麼關係？
    choices:
    - 壓力增加時電阻值增加。
    - 壓力增加時電阻值減小。
    - 壓力變化與電阻值無關。
    - 壓力增加時電阻值按固定比例放大。
    answer_index: 1
    explanation: FSR 是一種壓力感應電阻器，具有受壓時電阻值減小的特性。
  - question: 在機器手原型開發過程中，為了維護或接近而切斷電源後，需要確認的安全狀態是什麼？
    choices:
    - 確認是否通過軟件釋放了扭矩。
    - 使用萬用表測量保險絲是否斷路。
    - 物理斷開 3 個電源適配器，並使用直流電壓模式測量確認各分支電壓低於 1 V。
    - 關閉電源開關後，使用電阻模式測量導線狀態。
    answer_index: 2
    explanation: 切斷電源是指物理斷開 3 個電源，為了安全，必須使用萬用表的直流電壓模式直接測量確認所有分支電壓低於 1 V。
  completion_criteria:
  - 通過 ADC 讀取 FSR 值的實驗練習
  - 抓取力反饋控制代碼達到目標值的 90% 以上
  - 證明遵守所有安全守則（物理斷電及測量電壓）
  - 提交最終結果報告
  source_ids:
  - S3
  - S12
  - S26
- id: M9
  slug: testing-validation
  phase_id: P3
  title: 性能測試與驗證
  estimated_hours: 10.0
  prerequisites:
  - M8
  objectives:
  - 設計用於驗證機器手精度與重複性的定量測試指標
  - 評估利用 FSR 傳感器數據的抓取力控制算法的穩定性
  - 分析 DYNAMIXEL 執行器反饋數據與實際物理動作之間的誤差
  - 掌握機械缺陷及腱驅動機制的耐久性驗證程序
  theory_markdown: '## 性能測試與驗證理論


    機器手的性能驗證是確認設計規格與實際物理行為之間一致性的過程 [S1]。主要指標如下：


    ### 1. 位置與抓取精度

    重複性（Repeatability）是指機器手執行相同命令時，到達位置的誤差範圍。XM430-W350-T 執行器通過內部編碼器提供精確的位置反饋 [S11]，但最終指尖位置會因腱的伸長和摩擦而產生誤差。Dyneema
    腱的伸長率低於 1%，這對確保重複性非常有利 [S16]。


    ### 2. 力控制與 FSR 傳感器信號處理

    FSR 402 傳感器具有電阻隨所施加力減小的特性 [S12]。通過將其與 10 kΩ 電阻構成分壓電路，並用 OpenCR 的 12 位 ADC 測量 [S13,
    S26]。傳感器數據噪聲較大，因此需要應用移動平均濾波器（Moving Average Filter）來形成穩定的抓取力反饋迴路。


    ### 3. 過電流保護與電源穩定性

    系統使用 3 個獨立的 12 V 電源分支 [S15]。每個分支由 10 A ATOF 保險絲保護 [S25]，必須分配電源以確保執行器峰值電流總和不超過保護額定值。這必須通過供應商提供的保險絲時間-電流曲線來驗證保護協調性。'
  worked_examples:
  - 範例 1：OpenCR ADC 電壓計算。當 FSR 電阻為 10 kΩ，串聯電阻為 10 kΩ 時，3.3 V 分壓器輸出為 V_out = 3.3 *
    (10k / (10k + 10k)) = 1.65 V。這適合 12 位 ADC 的範圍 [S13, S26]。
  - 範例 2：保險絲保護協調。當執行器 4 台處於堵轉狀態時，電流總和為 9.2 A [S11]。由於 10 A 保險絲的冷電阻為 7.7 mΩ [S25]，正常運行時電壓降約為
    0.07 V，屬於可忽略水平；但在過電流情況下，精確響應需參考保險絲製造商的時間-電流曲線。
  lab:
    title: 機器手集成功能測試
    steps:
    - 在每個電源分支物理隔離的狀態下，使用直流電壓模式測量 3 個適配器的輸出，確認輸出為 12 V。
    - 將機器手固定在安全夾具上，並將控制器（OpenCR）連接至 PC，將執行器扭矩釋放為 0。
    - 手動對每個手指的 FSR 傳感器施加壓力，並記錄 ADC 數據變化。
    - 在無負載狀態下，將各手指的最大運動範圍（ROM）重複動作 5 次，以確認是否存在腱干涉。
    - 測試結束後，務必將 3 個電源適配器從牆面插座斷開，並確認殘餘電壓。
    safety:
    - 測試時務必佩戴護目鏡。
    - 通電期間，請勿將手放入運動範圍內。
    - 若偵測到異常發熱、氣味或煙霧，請勿靠近。在危險區域外，請斷開預先指定的建築配電盤斷路器或認證的上游主斷路器，切斷 3 個適配器的電源後撤離。若危險區域外無可操作的上游斷電手段，則禁止對系統通電。扭矩釋放不能替代切斷電源。維護與接近操作僅能在規劃停機後，經過物理斷電及確認無電狀態後方可進行。
    - 未經電壓測量不得接觸系統。必須確認 DC 電壓低於 1 V。
    deliverables:
    - 手指抓取力傳感器校準記錄
    - 重複動作精度測量數據
    - 各電源分支的負載電流測量值
  assignment:
    title: 機器手性能分析最終報告
    deliverables:
    - 性能測試結果分析報告
    - 基於數據的抓取控制算法代碼
    rubric:
    - 傳感器數據信噪比（SNR）分析的適當性
    - 重複動作測試中精度的定量化
    - 保護設計（保險絲）是否滿足系統保護意圖的理論思考
    - 設計規格與實際成品性能指標的比較
  quiz:
  - question: 在使用 FSR 402 傳感器和 OpenCR ADC 組成力測量電路時，下列哪項是正確的？
    choices:
    - FSR 分壓器僅使用 3.3 V 傳感器電源，並將模擬輸入信號保持在 0~3.3 V 範圍內
    - 由 FSR 和 10 kΩ 電阻組成分壓器，並使用 3.3 V 傳感器軌
    - ADC 信號必須始終在 0~5 V 範圍內
    - 由於 FSR 電阻恆定，因此不需要額外的分壓電阻
    answer_index: 1
    explanation: 使用 OpenCR 傳感器軌（3.3 V）將 ADC 輸入限制在 0~3.3 V 範圍內，並構建分壓電路以將電阻變化讀取為電壓變化
      [S13, S26]。
  - question: 管理 DYNAMIXEL XM430-W350-T 執行器的 12 V 電源分支的正確方法是什麼？
    choices:
    - 將 3 個適配器的正極(+)輸出捆綁在一起以疊加電力
    - 為每個適配器安裝 10 A 保險絲，並作為單獨的獨立分支使用
    - 由於電流低於保險絲額定值，無需安全驗證即可使用
    - 電源適配器輸出在沒有保險絲的情況下直接並聯連接
    answer_index: 1
    explanation: 各適配器輸出必須保持獨立，並安裝符合獨立分支要求的保險絲以防止過電流 [S15]。
  - question: 在機器手驗證階段，最重要的安全程序是什麼？
    choices:
    - 通過軟件釋放扭矩等同於切斷電源
    - 務必使用萬用表確認 DC 電壓低於 1 V 後，方可接近維修
    - 保險絲充當計劃停機裝置，因此應拔掉保險絲
    - 通過連續性（Continuity）模式確認電源已切斷
    answer_index: 1
    explanation: 軟件釋放不能替代物理切斷電源，物理隔離後使用直流電壓模式測量確認無殘餘能量是必不可少的。
  completion_criteria:
  - 性能測試結果報告提交及獲得 70 分以上
  - 所有 Lab 階段皆遵守安全準則及確認物理斷電
  - 確認控制代碼中傳感器數據過濾功能的實現
