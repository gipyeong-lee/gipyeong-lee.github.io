modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: 機器人機構學基礎
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 理解機器人機構學的基本定義與剛體變換 (Rigid-body transformation) 概念。
  - 學會使用座標系變換與旋轉矩陣，以數學方式描述機器人的位置與方向。
  - 習得 5 機器手設計所需的機構學基礎理論與解析方法。
  theory_markdown: '## 機器人機構學基礎


    機器人機構學是一門探討機器人運動的學科，不考慮力或力矩，僅從位置、速度、加速度的角度進行研究 [S1]。設計機器手等機械手臂的起點，在於將每個關節的狀態以空間座標描述出來。


    ### 1. 剛體變換 (Rigid-body Transformation)

    機器人的每個連桿皆視為剛體，從一個座標系變換至另一個座標系的過程，表現為旋轉 (Rotation) 與平移 (Translation) 的組合。在 3 維空間中，旋轉矩陣
    (Rotation Matrix) $R$ 為正交矩陣，藉此定義兩個座標系間的方向 [S1]。


    ### 2. 正向運動學 (Forward Kinematics)

    正向運動學是在已知關節變數（角度或位置）時，計算機器人末端執行器 (End-effector) 位置與方向的過程。在 5 機器手中，透過手指關節角度 ($\theta_1,
    \theta_2, \dots, \theta_n$) 求取指尖位置。


    ### 3. 逆向運動學 (Inverse Kinematics)

    逆向運動學是在將期望的指尖位置設為目標值時，求取達成該目標所需的各關節變數的過程。由於由非線性方程式組成，可能存在無解或多重解的情況 [S1]。'
  worked_examples:
  - 範例 1：求取在 2 維平面上，具有 1 個旋轉關節 (Rotation Joint) 的機器連桿末端位置 $(x, y)$。當關節角度為 $\theta$
    且連桿長度為 $L$ 時，$x = L \cos(\theta)$, $y = L \sin(\theta)$ [S1]。
  - 範例 2：描述繞著 $x$ 軸旋轉 $\theta$ 角的 2 維旋轉矩陣 $R$。$R = \begin{bmatrix} \cos(\theta) &
    -\sin(\theta) \\ \sin(\theta) & \cos(\theta) \end{bmatrix}$ [S1]。
  lab:
    title: 座標系變換模擬與基礎機構學解析
    steps:
    - 使用機構學解析軟體建立 2 連桿平面機械手臂模型。
    - 變更關節角度，確認末端位置的軌跡。
    - 手動推導逆向運動學計算公式，並與模擬結果進行比較。
    safety:
    - 電腦操作時請調整螢幕亮度並定期休息。
    - 本實習為模擬基礎，無需硬體通電。
    deliverables:
    - 包含機構學解析過程的總結報告
    - 軌跡模擬結果影像
  assignment:
    title: 5 機器手關節結構機構學建模
    deliverables:
    - 機器手指 1 根的正向運動學方程式推導結果
    - 隨關節角度變化之指尖位置變化預測數據
    rubric:
    - 旋轉矩陣的數學準確性
    - 正向運動學方程式的物理合理性
    - 報告的邏輯架構
  quiz:
  - question: 在機器人機構學中，不考慮力或力矩，僅描述運動的學科為何？
    choices:
    - 動力學 (Dynamics)
    - 機構學 (Kinematics)
    - 控制理論 (Control Theory)
    - 材料力學 (Material Mechanics)
    answer_index: 1
    explanation: 機構學是不包含力與力矩，以位置、速度、加速度為中心的運動理論 [S1]。
  - question: 在 3 維空間中，定義兩個座標系間方向的矩陣為何？
    choices:
    - 旋轉矩陣 (Rotation Matrix)
    - 質量矩陣 (Mass Matrix)
    - 剛性矩陣 (Stiffness Matrix)
    - 阻尼矩陣 (Damping Matrix)
    answer_index: 0
    explanation: 旋轉矩陣是將兩個座標系間的方向進行數學變換的正交矩陣 [S1]。
  completion_criteria:
  - 完成理論課程學習
  - 提交機構學解析結果報告
  - 達到理論測驗 100 分
