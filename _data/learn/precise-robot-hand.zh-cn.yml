modules:
- id: m1
  slug: intro-robotics
  phase_id: p1
  title: 机器人工程概论
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 理解机器人工程的定义与系统组成要素。
  - 掌握 5 级机器人手原型所用执行器与控制器的作用。
  - 学习机器人系统的安全电源分支配置与物理断开原理。
  - 掌握力传感器 (FSR) 的工作原理与 ADC 数据获取方法。
  theory_markdown: '## 机器人系统组成要素

    机器人由感知 (Sensor)、思维 (Controller)、动作 (Actuator) 三个核心要素组成 [S1]。本课程的 5 级机器人手使用 DYNAMIXEL
    XM430-W350-T 执行器，通过肌腱驱动方式控制关节 [S14]，并由 OpenCR 1.0 控制器处理这些执行器及指尖 FSR 传感器的信号 [S16]。


    ## 电力系统的安全设计

    执行器在 12 V 电压下需要 2.3 A 的堵转电流 [S14]，因此考虑到系统总负载，使用了 3 个 MEAN WELL GST160A12-R7B 适配器
    [S17]。每个适配器负责 4 台/4 台/3 台执行器的独立 12 V 分支，这些分支的阳极 (+) 输出互不连接，在物理上是隔离的。各分支通过内联保险丝座
    (0AFH0001Z) 安装 10 A ATOF 保险丝，以在发生过电流时保护配线 [S25, S26]。这是超越简单停机功能的电气安全基础。


    ## 传感器接口

    FSR 402 传感器具有电阻随接触力增加而减小的特性 [S15]。将其与 10 kΩ 电阻构成电压分压电路，并连接至 OpenCR 的 12 位 ADC
    端口，从而将接触力转换为电压 [S16, S27]。此时，传感器电路必须仅由 3.3 V 传感器电源轨供电，不得与执行器用的 12 V 电源轨混用。'
  worked_examples:
  - 执行器负载计算：将 4 台 XM430-W350-T 分配到 1 个分支时，峰值电流为 4 * 2.3 A = 9.2 A [S14]。这在 10 A 保险丝的额定范围内，且小于电源适配器的
    11.5 A 输出额定值，可稳定运行 [S17, S26]。
  - FSR 电压分压器设计：在传感器与 10 kΩ 电阻串联的分压器中，输入 3.3 V 时，传感器未受压处于高阻态，ADC 输出接近 0 V；受到强力导致电阻骤减时，ADC
    输出接近 3.3 V [S15, S27]。
  lab:
    title: 电源分支配置及系统基本通电测试
    steps:
    - 在各 MEAN WELL 适配器的阳极 (+) 端子上连接 ATO 内联保险丝座和 10 A 保险丝，创建 3 个独立分支 [S17, S25, S26]。
    - 将万用表设置为 DC 电压模式，确认各分支的输出电压为 12 V。
    - 将 OpenCR 控制器连接至 3.3 V 传感器电源轨，并利用 FSR 传感器和 10 kΩ 电阻构成分压电路 [S16, S27]。
    - 给控制器通电后，使用 DYNAMIXEL Wizard 确认各肌腱执行器是否正常通信 [S14, S16]。
    safety:
    - 通电前，不要使用万用表的电阻模式，而应通过肉眼和电路图重新验证所有连接。
    - 通电期间禁止接近系统，必须在非通电状态（物理断开适配器）下进行配线。
    - 若发现异常发热、异味或冒烟，请勿接近，并从危险区域外通过预先指定的建筑配电盘断路器或认证的上游主断路器切断 3 个适配器的供电电源后再撤离。若危险区域外无上游断路手段，则禁止系统通电。扭矩释放不能代替电源切断。维护和接近必须在计划停机后通过物理断开并确认无电状态下进行。
    - 全程佩戴护目镜，身体部位不得进入活动范围。
    deliverables:
    - 各分支 12 V 测量记录照片
    - OpenCR ADC 传感器数据获取代码
    - 独立分支连接配线图
  assignment:
    title: 机器人系统安全设计报告
    deliverables:
    - 独立电源分支配置图
    - 执行器峰值电流与保险丝额定值合理性分析
    - FSR 电压分压电路设计计算公式
    rubric:
    - 是否明确分配了 11 台执行器与 3 个电源分支？
    - 是否正确说明了 3.3 V 传感器轨与 12 V 执行器轨的分离？
    - 是否准确叙述了电源切断程序（物理断开）？
  quiz:
  - question: 在系统电源设计中，为何禁止将 12 V 输出端子的阳极 (+) 极并联连接？
    choices:
    - 因为电压会升高至 24 V
    - 存在因适配器间电位差导致逆电流及破坏独立分支保护的风险
    - 因为会导致执行器的通信速度下降
    - 因为无法使用软件扭矩释放功能
    answer_index: 1
    explanation: 各电源适配器应作为独立分支运行，若连接输出端子，可能会发生故障或导致独立保险丝提供的安全保护功能失效。
  - question: 读取 FSR 信号至 OpenCR 的 ADC 端口时，合适的供电电压是？
    choices:
    - 12 V 执行器轨道
    - 3.3 V 传感器轨道
    - 24 V 输入电源
    - 非接触式无线电力
    answer_index: 1
    explanation: OpenCR 的 ADC 使用 0~3.3 V 范围，为保护传感器，必须使用专用的 3.3 V 传感器轨供电。
  - question: 进行系统检查和维护时，切断电源的最安全方法是？
    choices:
    - 通过软件指令释放执行器扭矩
    - 移除保险丝
    - 物理断开 3 个电源适配器并测量电压
    - 仅关闭控制器电源开关
    answer_index: 2
    explanation: 软件指令或保险丝不能保证完全的无电状态。必须物理断开适配器并用万用表测量确认电压低于 1 V。
  completion_criteria:
  - 通过万用表确认各分支 12 V 电压在正常范围内并提交照片
  - 通过控制器确认 FSR 传感器随接触力变化的 ADC 值变化并获取有效数据
  - 理解并遵守物理切断电源及通过电压测量进行安全停机的程序
  source_ids:
  - S1
  - S14
  - S16
  - S17
  - S25
  - S26
  - S15
  - S27
- id: m2
  slug: mechanism-design
  phase_id: p1
  title: 机器人机构设计
  estimated_hours: 15.0
  prerequisites:
  - m1
  objectives:
  - 理解欠驱动系统这一机器人手机构设计的核心原理。
  - 学习肌腱驱动方式的动力学特性以及摩擦力与伸长率管理的重要性。
  - 掌握考虑刚性与尺寸稳定性的工程材料 (PC-CF) 选择及设计技巧。
  - 夯实利用热压嵌入螺母与轴承进行精密组装设计的基础。
  theory_markdown: '## 机器人机构设计原理


    精密 5 级机器人手设计的核心在于实现欠驱动系统，该系统能有效控制比执行器 (Actuator) 数量更多的自由度 (DoF) [S11]。这使得机器人无需盲目增加关节数量即可稳定抓取各种形状的物体
    [S3]。


    ### 肌腱驱动动力学

    肌腱 (Tendon) 驱动是将远程电机的张力传递至关节的方式。肌腱的物理特性决定了控制精度。本课程使用 `Dyneema SK78` 纤维，其在 1.5
    mm 直径下可承受 230 daN 的高断裂载荷，工作伸长率低于 1%，重复精度极高 [S18]。


    ### 材料与结构设计

    机器人手的框架与连杆要求高刚性与尺寸稳定性。FDM 方式的 `Prusament PC Blend Carbon Fiber` 是一种含有碳纤维的 PC 材料，提供耐高温性与出色的强度，适合制作工程级零件
    [S21]。为实现多次拆装，组装时避免直接切削螺纹，而是使用 M3 黄铜热压嵌入螺母（外径 4.4 mm，长度 5.8 mm）来确保螺纹耐久性 [S23]。旋转轴使用无油聚合物衬套轴承
    (JSM-0810-10)，实现无需维护的顺畅旋转与摩擦管理 [S19]。'
  worked_examples:
  - 示例 1：肌腱张力传递分析。若肌腱工作伸长率为 1%，在 100 mm 距离下会产生 1 mm 的误差。为实现精密控制，利用执行器电流反馈与传感器数据的闭环控制至关重要
    [S14]。
  - 示例 2：嵌入件连接处设计。将 HTBI-M3-BR 螺母插入 PC-CF 打印件时，必须在 CAD 设计中遵守 4 mm 的建议导向孔直径，以实现无间隙组装
    [S23]。
  lab:
    title: 机器人关节及肌腱模块组装实践
    steps:
    - 佩戴护目镜并整理工作台。
    - 确认 PC-CF 打印件导向孔状态，必要时进行加工。
    - 用电烙铁加热热压嵌入螺母，将其垂直压入打印件。
    - 将 igus 轴承安装至腕部及关节外壳。
    - 将铝轴穿过轴承并确认间隙。
    - 将 Dyneema 肌腱缠绕在绞盘上并固定在组装好的关节上。
    safety:
    - 使用电烙铁时注意高温，务必佩戴护目镜。
    - 肌腱张力测试时，为防止肌腱断裂导致的反弹事故，不得将手放入活动范围。
    - 系统组装完成后，通电前务必使用仪表确认物理断开状态。
    deliverables:
    - 已组装的机器人关节模块
    - 轴承与轴的间隙测量记录
  assignment:
    title: 5 级机器人手机构设计项目
    deliverables:
    - 机器人手整体 CAD 装配图
    - 材料清单 (BOM) 及选型依据报告
    - 肌腱路径优化设计图
    rubric:
    - 使用的部件是否符合规格 (BOM)？
    - 热压嵌入螺母与轴承设计是否合理？
    - 是否实现了无机械干涉的自由运动？
  quiz:
  - question: 肌腱驱动中使用 Dyneema SK78 的主要原因是什么？
    choices:
    - 伸长率大且价格便宜
    - 提供低伸长率和高断裂载荷，能够确保精度
    answer_index: 1
    explanation: Dyneema SK78 的伸长率低于 1%，极低，可提高机器人控制的重复精度 [S18]。
  - question: 针对 PC-CF 打印件进行重复螺纹组装，推荐的方法是什么？
    choices:
    - 直接在打印件上加工螺纹
    - 插入黄铜热压嵌入螺母
    answer_index: 1
    explanation: 对于 PC-CF 等工程塑料，热压嵌入螺母可大幅提高螺纹耐久性 [S23]。
  completion_criteria:
  - 完成各零件规格与参数的 BOM 文档化
  - 确认组装完成的关节模块的功能性运动
  - 遵守安全指引并完成实践
  source_ids:
  - S3
  - S11
  - S18
  - S21
  - S23
  - S19
  - S14
- id: m3
  slug: cad-modeling
  phase_id: p1
  title: 3D CAD 建模
  estimated_hours: 15.0
  prerequisites:
  - m2
  objectives:
  - 理解 3D CAD 建模的设计限制及制造工艺 (FDM)。
  - 学习利用 PC-CF 丝材提高结构刚性的技巧。
  - 执行考虑热压嵌入螺母与轴承公差的精密组装设计。
  theory_markdown: '### 3D CAD建模与制造设计


    为制作精密的 5 机械手，必须考虑FDM方式增材制造特性的设计(Design for Additive Manufacturing, DfAM)。碳纤维增强PC-CF长丝具有优异的机械刚性和尺寸稳定性，适合制作精密连杆
    [S21]。


    #### 核心设计注意事项

    1. **公差管理及轴承安装**：使用8mm精密铝轴和igus JSM-0810-10 轴承时，需在设计中反映外壳孔径公差。由于轴承采用压入式(Press-fit)固定，孔内径应设计得比轴承外径(10mm)略小，以实现坚固的装配
    [S19, S20]。

    2. **紧固件设计**：PC-CF打印件不适合直接攻丝。为确保反复拆卸装配的重现性，使用HTBI-M3-BR黄铜热压螺纹嵌件。为此，设计时需布置4mm直径的引孔
    [S23]。

    3. **结构优化**：在肌腱驱动方式中，连杆可能会因张力而变形。应确保应力集中的关节部位壁厚，并将模型放置在有利于拉伸强度的层积方向上。


    ### 系统集成及安全

    本项目的电气系统由 3 个独立的12V电源分支组成。为防止驱动执行器时出现过流，必须在每个分支安装10A ATOF保险丝，并按 4/4/3 的比例分配执行器以管理峰值电流
    [S17, S26]。采集传感器信号时，FSR 402 传感器必须通过 3.3V 传感器电源轨的分压电阻生成ADC输入值，且必须与12V执行器电源完全分离
    [S15, S16, S27]。'
  worked_examples:
  - '**嵌件孔设计**：由于Accu-components的M3嵌件外径为 4.4mm，在3D CAD中需为打印件建模 4.0mm 的引孔 [S23]。打印后加热插入嵌件，黄铜材料会嵌入塑料内部，形成牢固的M3内螺纹。'
  - '**轴承外壳公差**：使用igus轴承JSM-0810-10时，10mm外壳孔应设计为在压入后内径与8mm精密轴紧密配合且无间隙。若过宽会产生轴向间隙，过窄则会导致轴承损坏，因此需通过试打印来调整公差
    [S19, S20]。'
  lab:
    title: 精密连杆设计及组装验证
    steps:
    - 在 3D CAD 中设计提供的肌腱路径与关节机构并进行仿真。
    - 将 PC-CF 丝材加载至 FDM 打印机，使用硬化钢喷嘴进行打印 [S21]。
    - 确认打印件上的4mm引孔后，插入热压嵌件 [S23]。
    - 装配8mm铝轴与轴承，确认连杆的旋转自由度并测量间隙 [S19, S20]。
    - 使用万用表确认 3 个独立电源分支的保险丝座连接状态，并检查通电前保险丝安装是否正常 [S25, S26]。
    safety:
    - 全程佩戴防冲击护目镜。
    - 热压操作时注意烫伤，并在通风良好的地方作业。
    - 通电时务必使用固定夹具，绝对不要将手放入旋转部位。
    - 维护系统或接近系统时，必须物理断开 3 个电源适配器，并用万用表确认电压低于1V。
    deliverables:
    - 机器人手整体组装 3D CAD 模型文件
    - 包含嵌入件及轴承公差调整的设计验证报告
    - 各电源分支独立连接状态及保险丝安装检查照片
  assignment:
    title: 机器人手机构设计与集成配线计划
    deliverables:
    - 包含所有连杆与关节的详细 3D CAD 设计文件
    - BOM 与设计一致性确认报告
    - 包含 3 个独立分支及保险丝布置的配线图
    rubric:
    - 3D设计是否遵守了增材制造公差及黄铜嵌件规格(4.4mm OD)？
    - 轴承外壳与轴之间的间隙是否合理？
    - 电气接线图中12V执行器电源与传感器电路是否分离，且每个分支是否设计了10A保险丝？
  quiz:
  - question: 针对 PC-CF 打印件模型，若需要螺纹，最合适的方法是什么？
    choices:
    - 直接在建模中输出螺纹。
    - 通过加热插入黄铜热压嵌入螺母。
    answer_index: 1
    explanation: 相比直接对 PC-CF 材料建模螺纹，为确保重复组装的再现性，建议使用黄铜热压嵌入螺母 [S23]。
  - question: 配置 3 个独立12V电源分支时的注意事项是？
    choices:
    - 并联连接适配器的阳极 (+) 输出以增加电流容量。
    - 每个分支通过独立的10A保险丝保护以防过流。
    answer_index: 1
    explanation: 禁止并联独立电源适配器的阳极 (+) 输出，必须通过各分支独立保险丝进行保护 [S17, S26]。
  - question: FSR 力传感器驱动应使用什么电源？
    choices:
    - OpenCR的 3.3V 传感器电源轨
    - 12V执行器电源轨
    answer_index: 0
    explanation: FSR分压电路必须从 3.3V 传感器电源轨获取电力，且必须与执行器电源分离 [S16]。
