course:
  course_type: build_project
  slug: precise-robot-hand
  title: 构建精密的 5 级机器人手
  summary: 这是一门大学及研究生水平的实践型课程，从机器人基础开始，指导学生亲自设计、制造、控制和验证 5 级机器人手。
  outcome: 学生将理解执行器、控制器、传感器集成及肌腱驱动机制，并能够对精密机器人手进行原型制作。
  audience: 机器人工程专业的工程申请者及学生
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3D打印机
  - 万用表
  - 烙铁
  - 通用手动工具
  - 适用于PC-CF的硬化钢喷嘴
  - 防冲击工作安全护目镜
  - 游标卡尺
  safety_summary:
  - 这是低压教学原型，而非认证的机器安全系统
  - 学习者制作的停止电路不得用作安全功能或紧急停止
  - 正常停止通过软件转矩释放执行；计划停止后，在进行维护或接近前，必须物理断开 3 个绝缘电源适配器，并测量确认处于无电状态
  - 通电期间请勿将手放入工作范围内，并在固定夹具中从空载开始测试
  - 在进行切割、钻孔、肌腱张力测试时，必须佩戴防冲击工作安全护目镜
  - 检测到异常发热、异味或冒烟时，请勿靠近，应切断危险区域外预先指定的建筑配电盘断路器或经认证的 upstream master disconnect，以切断
    3 个适配器的供电电源，然后撤离。若危险区域外没有可操作的 upstream 断开手段，禁止系统通电。转矩释放不能代替断电
  - 在将系统投入人员可接近环境前，必须在合格的安全专家的评审下，另行设计并验证双通道、手动重置、EDM、可反馈的双接触器
