capstone:
  title: 智能 5 指机械手最终制作与试验
  deliverables:
  - 最终设计 CAD 文件
  - 集成固件及控制代码
  - 抓取性能及耐久性试验数据
  - 系统安全评估报告
  - 最终项目结果报告
  rubric:
  - 机械精度及可操作性评估
  - 实时控制算法实现水平
  - 计划停机后维护/接近前，物理断电及无电源测量程序的文档完整性
  - 文档 (BOM, 图纸) 的完整性
  - 试验数据分析及性能验证
  safety:
  - 计划停机后维护/接近前，物理分离 3 个绝缘电源适配器，并记录各分支残留电压在 DC 电压档下低于 1 V
  - 检查各独立电源分支的 10 A 保险丝额定值及时间-电流特性
  - 在固定夹具上进行无负载测试后，分阶段增加抓取负荷
  - 在切割、钻孔、肌腱张力及抓取试验过程中，必须佩戴防冲击工作护目镜
