- id: m7
  slug: firmware-control
  phase_id: p3
  title: 固件及控制
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - 理解 DYNAMIXEL 智能执行器的工作原理与控制协议 (Protocol 2.0)。
  - 掌握 OpenCR 控制器结构，并配置传感器与执行器接口。
  - 设计 FSR 电压分压电路并实现 ADC 信号处理过程。
  - 利用状态机 (State Machine) 在固件中编写机器人手的抓取与控制逻辑。
  theory_markdown: '## DYNAMIXEL 智能执行器控制

    机械手的每个关节使用XM430-W350-T执行器驱动 [S14]。该执行器实时提供位置、速度、电流反馈，并通过DYNAMIXEL Protocol 2.0
    进行控制 [S14]。控制器OpenCR 1.0 搭载216MHz ARM Cortex-M7处理器，无需额外的通信桥接器，直接与执行器通信 [S16]。


    ## ADC 及传感器接口

    指尖的接触力使用FSR 402 传感器测量 [S15]。FSR具有随着施加力增大电阻减小的特性 [S15]。OpenCR的ADC输入分辨率为 12 位 [S16]，使用
    3.3V 传感器电源轨构成电压分压电路 [S16, S27]。


    10 kΩ 下拉分压器使用 $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$


    此处 $R_{fixed}$ 使用10kΩ电阻 [S27]。为安全起见，所有模拟信号的设计范围必须不超过 0-3.3V [S16]。


    ## 固件结构

    机械手的控制系统由‘待机’、‘执行抓取’、‘保持抓取’、‘释放’的状态机实现。固件在循环中周期性轮询传感器值，分析执行器的电流及位置数据，以保持稳定的抓取力。'
  worked_examples:
  - 示例 1：FSR ADC 值归一化。若 FSR 传感器连接至 OpenCR ADC 并输出 0~4095 (12 位) 范围的值，编写代码将其转换为 0.0~1.0
    的力比率。（公式：`normalized = adc_value / 4095.0`）
  - 示例 2：XM430 位置控制指令。使用 DYNAMIXEL SDK 构建指令，将 1 号关节移动至 2048 (中心值)。使用 `packetHandler->write2ByteTxRx(portHandler,
    1, ADDR_GOAL_POSITION, 2048, &error);` 这样的调用体系。
  lab:
    title: 机器人手固件实现及传感器校准
    steps:
    - 将 OpenCR 1.0 板通过 USB 连接至 PC 并设置基础通信环境 [S16]。
    - 将连接到每个手指的FSR分压电路焊接连接到OpenCR的 3.3V 传感器电源轨 [S16, S27]。
    - 使用万用表确认FSR无负载和加压时的电压是否在 0-3.3V 范围内。
    - 在固件中读取传感器值并输出至串口监视器，确认物理接触时的变化。
    - 将单台执行器连接至固定夹具，并通过控制代码测试精密运动。
    safety:
    - 绝对禁止将5V或12V执行器电源轨直接连接到ADC传感器电路 [S16]。
    - 通电前重新确认配线图，并用万用表检查是否短路。
    - 在执行器空载状态下执行初步启动测试。
    - 若检测到异常发热、异味或烟雾，请勿靠近，应在危险区域外通过预设的建筑物配电盘断路器或经认证的 upstream master disconnect 切断
      3 个适配器的供电电源，然后撤离。若危险区域外没有可操作的 upstream 断路手段，则严禁系统通电。扭矩释放不能代替断电。维护与接触操作仅可在计划停机后，经物理隔离并确认处于无电状态后方可进行
      [S17]。
    - 接近前物理断开 3 个电源适配器，然后在直流电压模式下确认各分支电压低于1V。
    deliverables:
    - 传感器数据输出串行日志
    - 完成运行测试及校准的固件源代码
    - ADC 归一化公式定义书
  assignment:
    title: 5 指机械手系统集成控制报告
    deliverables:
    - 状态机设计图及逻辑详细技术文档
    - 总计 11 个执行器及 5 个传感器集成控制固件
    - 动作验证视频及抓取力分析图表
    rubric:
    - 状态机是否安全地执行了抓取和释放循环？
    - 传感器数据采集是否稳定且无噪声？
    - 各电源分支设计是否遵循 BOM 的独立分支原则？
    - 是否遵守并记录了安全守则（物理断电等）？
  quiz:
  - question: 在 OpenCR 控制器中，用于 FSR 分压电路的电源轨应为？
    choices:
    - 12V执行器电源
    - 3.3V 传感器电源
    - 5V电源
    - USB 5V
    answer_index: 1
    explanation: 根据OpenCR手册和兼容性标准，FSR电压分压必须仅使用 3.3V 传感器电源轨 [S16]。
  - question: 当执行器电源分支适配器有 3 个时，正确的电源连接方法是？
    choices:
    - 将 3 个适配器的正 (+) 输出并联以增加电流容量。
    - 将每个适配器配置为独立分支并经过保险丝。
    - 将所有执行器连接到 1 个适配器，其余作为备用。
    - 组合适配器输出，升压至36V使用。
    answer_index: 1
    explanation: 严禁并联正 (+) 输出，每个适配器应保持为独立分支，并必须通过保险丝进行过流保护 [S17]。
  - question: 在维护或接触机械手系统前必须执行的必要步骤是？
    choices:
    - 仅下达软件扭矩释放指令。
    - 移除保险丝。
    - 物理断开 3 个电源，并用万用表确认各分支电压低于1V。
    - 按下控制器的 Reset 按钮。
    answer_index: 2
    explanation: 扭矩释放不能代替断电，必须物理断开 3 个适配器，并通过直流电压测量进行确认。
  completion_criteria:
  - 集成控制固件在循环内执行 5 指机械手的抓取动作。
  - 所有传感器均能正常采集 0-3.3V 范围内的ADC信号。
  - 所有电气连接符合包含保险丝的独立分支设计标准。
  - 安全评估报告中包含无电测量确认记录。
  source_ids:
  - S16
  - S14
  - S15
  - S27
  - S17
- id: m8
  slug: testing-validation
  phase_id: p3
  title: 测试与验证
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - 制定系统的机械手驱动性能评估测试流程。
  - 为数据驱动的精密验证分析传感器数据与执行器反馈。
  - 验证机械手的机构耐久性及重复精度。
  - 编写系统集成后的安全操作指南。
  theory_markdown: '### 1. 机械手性能评估的核心指标

    机械手性能验证是证明机构设计保真度和控制算法有效性的过程 [S1]。主要评估指标如下：

    - **重复精度 (Repeatability)：** 到达相同目标位置时的误差范围，通过 `XM430-W350-T` 执行器的高分辨率编码器反馈进行计算
    [S14]。

    - **抓取稳定性 (Grasp Stability)：** 通过分析 `FSR 402` 传感器测量的接触力分布，评估物体抓取是否平稳无滑动 [S15]。

    - **耐久性 (Durability)：** 执行重复负载测试，确认腱 (`Dyneema SK78`) 和连杆 (`PC-CF`) 结构的疲劳破坏情况
    [S18, S21]。


    ### 2. 数据采集与分析

    通过 `OpenCR` 控制板的 ADC 实时采集 FSR 数据。使用 3.3 V 传感器电源，将力信号转换为 0~3.3 V 范围内最大 12-bit 分辨率的信号
    [S16]。数据采集时，为减少噪声，应应用移动平均滤波器等来平滑抓取力的变化。


    ### 3. 电气安全验证

    每个执行器组配置为独立的 `12 V` 适配器分支，并使用 `10 A` ATOF 保险丝进行过流保护 [S17, S26]。系统无电状态的确认始终通过 DC-电压模式（低于
    1 V）进行测量。'
  worked_examples:
  - '**示例 1：重复精度误差分析**

    在目标点 50 度处重复移动 100 次后收集编码器值，结果显示平均值为 50.02 度，标准差为 0.05 度。符合要求的精度范围。'
  - '**示例 2：基于 FSR 的抓取力校准**

    当无压力时 ADC 值为 50，最大抓取（20 N）时为 3800，使用线性插值公式从 ADC 值实时估算力 (N) [S15]。'
  lab:
    title: 机械手工作范围及抓取力验证
    steps:
    - 确认各独立分支电源适配器连接处的电压为 12 V。
    - 在软件扭矩释放状态下，进行机械机构检查，确保各连杆无干涉。
    - 在空载状态下，逐步确认各手指的工作范围。
    - 分阶段（0.5 N, 1 N, 5 N）向 FSR 传感器施加压力并记录 ADC 信号。
    - 结束通电测试后，物理断开所有电源适配器。
    - 使用万用表确认 3 个分支的电压已放电至低于 1 V。
    safety:
    - 维护及接触前，物理断开 3 个绝缘电源适配器，并测量确认处于无电状态。
    - 通电过程中严禁将手伸入工作范围，并须固定在测试夹具上。
    - 若检测到异常发热、异味或烟雾，请勿靠近，应在危险区域外通过预设的建筑物配电盘断路器或经认证的 upstream master disconnect 切断
      3 个适配器的供电电源，然后撤离。若危险区域外没有可操作的 upstream 断路手段，则严禁系统通电。扭矩释放不能代替断电。维护与接触操作仅可在计划停机后，经物理隔离并确认处于无电状态后方可进行。
    - 操作时必须佩戴防冲击安全防护眼镜。
    deliverables:
    - 工作范围及抓取力测试日志数据文件
    - 重复精度统计分析报告
    - 各电源分支测量安全确认书
  assignment:
    title: 编写最终性能验证报告
    deliverables:
    - 系统集成验证报告 (PDF)
    - 性能指标数值数据及可视化图表
    - 操作指南及故障排除程序手册
    rubric:
    - 确认工作范围及重复精度测量数据的一致性
    - 基于 FSR 传感器数据的力控制算法验证
    - 通过机械耐久性测试评估是否存在破损及装配稳定性
    - 安全指南遵守情况及程序合理性
  quiz:
  - question: 下列关于系统安全维护程序的说法中不正确的是？
    choices:
    - 执行软件扭矩释放。
    - 计划停机后，维护/接触前物理断开 3 个电源适配器，并测量确认各分支处于无电状态。
    - 物理断开 3 个电源适配器，并使用万用表直流电压模式确认各分支剩余电压低于 1 V。
    - 用直流电压模式测量确认各分支低于 1 V。
    answer_index: 2
    explanation: 电阻模式可能会测量带电电路或因未放电的电容器导致设备损坏及读数错误。必须始终使用直流电压模式确认无电状态。
  - question: 在使用 FSR 402 传感器和 OpenCR 板进行电路构建时需要注意什么？
    choices:
    - FSR 分压器仅使用 3.3 V 传感器电源，并将模拟输入信号保持在 0~3.3 V 范围内。
    - FSR 分压电路必须仅使用 3.3 V 传感器电源。
    answer_index: 1
    explanation: OpenCR 的 ADC 输入不得超过 0~3.3 V 范围，因此必须使用稳定的 3.3 V 传感器电源。
  completion_criteria:
  - 提交测试验证阶段的所有实验数据并完成日志分析。
  - 遵守 3 个独立电源分支的物理隔离及安全电压测量程序。
  - 重复精度和抓取力的定量评估指标达到目标范围。
  - 通过最终报告证明所有机械部件和电子电路运行安全。
