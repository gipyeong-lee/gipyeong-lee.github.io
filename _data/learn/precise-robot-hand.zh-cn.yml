- id: M8
  slug: sensor-integration
  phase_id: P3
  title: 传感器集成与反馈控制
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - 理解利用 FSR 402 传感器和 10 kΩ 电阻构建分压电路的原理
  - 熟知 OpenCR 控制器的 ADC 功能及输入范围 (0-3.3 V) 约束条件
  - 掌握传感器数据的滤波及校准技术
  - 实现基于反馈的抓取控制算法及机械手接触力控制实操
  theory_markdown: '## 传感器集成与接触力反馈


    机械手的精密抓取控制始于精确测量作用在指尖的力。FSR 402 传感器是一种压力感应电阻器，其电阻值随着施加压力的增加而减小 [S12]。为了将其转换为微控制器可读取的电压信号，需要分压电路。


    ### 1. 分压电路

    将 FSR 传感器和 10 kΩ 分压电阻串联，并供给 3.3 V 传感器电源 [B4, B5, B2]。ADC 引脚连接到传感器和电阻的交点，输出电压 $V_{out}$
    计算如下：

    10 kΩ 下拉分压器使用 $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$


    - OpenCR 控制器的 ADC 具有 12 位分辨率，输入范围限制为 0~3.3 V [B2]。超出此范围的输入可能会损坏电路元件，因此必须仅使用指定的传感器电源轨
    (3.3 V) [B2]。


    ### 2. 控制回路与反馈

    测得的力数据被用作 PID 控制算法或自适应控制策略的输入值 [S3]。当机械手抓取物体时，肌腱驱动电机 (DYNAMIXEL XM430-W350-T)
    参考传感器值，微调转矩直至达到设定的目标接触力 [B1, B4]。'
  worked_examples:
  - '示例 1: 计算 FSR 输出。当 $R_{FSR}$ 为 5 kΩ，$R_{fixed}$ 为 10 kΩ，以 3.3 V 输入为基准时，$V_{out}
    = 3.3 \times (5 / (5 + 10)) = 1.1 V。该值正常处于 ADC 输入范围 (0-3.3 V) 内。'
  - '示例 2: 抓取力校准。如果传感器值因噪声而波动，可应用简单移动平均滤波，减少传感器值的剧烈变动，从而稳定维持抓取力。'
  lab:
    title: 指尖 FSR 传感器电路构建与校准
    steps:
    - 将 OpenCR 的 3.3 V 传感器轨与 GND 连接至面包板。
    - 将 FSR 402 与 10 kΩ 电阻串联，构建分压电路 [B4, B5]。
    - 将分压接点连接至 OpenCR 的 ADC 引脚 [B2]。
    - 连接 PC 与 OpenCR，运行读取传感器值的测试代码。
    - 记录无负载状态及施加目标力时的 ADC 值，编制校准表。
    safety:
    - 在施加电源前，必须用万用表检查 3.3 V 轨与 12 V 执行器轨是否短路 [B2]。
    - 必须时刻佩戴护目镜，通电期间请勿将手放入机械手的活动范围内。
    - 若检测到异常发热、异味或烟雾，请勿靠近，应在危险区域外利用预先指定的楼宇配电盘断路器或经认证的 upstream master disconnect 切断
      3 个适配器的电源后再撤离。若危险区域外无可操作的 upstream 断开手段，则禁止系统通电。转矩释放不能代替断电。仅在计划停机、物理隔离并确认无电源测量后，方可进行维护或接近。
    - 在维修或接触传感器前，请物理分离 3 个绝缘电源适配器，并测量确认所有分支电压低于 1 V。
    deliverables:
    - ADC 传感器读取测试结果数据
    - 传感器校准表 (ADC 值 vs 物理力)
    - 传感器数据滤波实现代码
  assignment:
    title: 抓取力反馈控制算法实现
    deliverables:
    - 反馈控制代码 (传感器读取、目标值比较、电机转矩调节)
    - 抓取试验结果图表 (时间 vs 力)
    - 最终报告 (控制逻辑说明及抓取稳定性分析)
    rubric:
    - ADC 数据是否在 0-3.3 V 范围内稳定测量？
    - 当传感器值达到目标值时，电机是否适当地释放或维持转矩？
    - 紧急情况下转矩释放是否能在软件层面正常工作？
    - 报告中是否记录了断电确认程序？
  quiz:
  - question: 将 FSR 分压信号输入到 OpenCR 控制器的 ADC 引脚时，必须遵守的事项是什么？
    choices:
    - 使用 12 V 执行器电源轨。
    - 仅使用 3.3 V 传感器电源轨。
    - 使用 5 V 电源轨。
    - 从外部独立供电。
    answer_index: 1
    explanation: OpenCR 的 ADC 输入范围为 0-3.3 V，为防止施加超出此范围的电压，必须仅使用 3.3 V 传感器电源轨。
  - question: FSR 传感器的电阻值变化与物理力之间的关系是什么？
    choices:
    - 压力增加时，电阻值增加。
    - 压力增加时，电阻值减小。
    - 压力变化与电阻值无关。
    - 压力增加时，电阻值按比例放大。
    answer_index: 1
    explanation: FSR 是一种压力感应电阻器，具有施加压力时传感器电阻值减小的特性。
  - question: 在机械手原型工作中，为维护或接近而断电后，必须确认的安全状态是什么？
    choices:
    - 确认是否在软件层面释放了转矩。
    - 用万用表测量保险丝是否断路。
    - 物理分离 3 个电源适配器，并用 DC 电压档测量各分支电压是否低于 1 V。
    - 关闭电源开关后，用电阻档测量导线状态。
    answer_index: 2
    explanation: 断电是指物理分离 3 个电源，为确保安全，务必使用万用表的 DC 电压档直接确认所有分支是否低于 1 V。
  completion_criteria:
  - 通过通过 ADC 读取 FSR 值的实操练习
  - 抓取力反馈控制代码达到目标值的 90% 以上
  - 证明遵守所有安全规程 (物理断电及电压测量)
  - 提交最终结果报告
  source_ids:
  - S3
  - S12
  - S26
- id: M9
  slug: testing-validation
  phase_id: P3
  title: 性能试验与验证
  estimated_hours: 10.0
  prerequisites:
  - M8
  objectives:
  - 设计用于验证机械手精度及重复性的定量试验指标
  - 评估利用 FSR 传感器数据的抓取力控制算法的稳定性
  - 分析 DYNAMIXEL 执行器反馈数据与实际物理动作之间的误差
  - 掌握机械缺陷及肌腱驱动机构的耐久性验证程序
  theory_markdown: '## 性能试验与验证理论


    机械手的性能验证是确认设计规范与实际物理行为之间一致性的过程 [S1]。主要指标如下：


    ### 1. 位置及抓取精度

    重复性 (Repeatability) 指机械手执行相同指令时到达位置的误差范围。XM430-W350-T 执行器通过内部编码器提供精确的位置反馈 [S11]，但最终指尖的位置会因肌腱的伸长和摩擦而产生误差。Dyneema
    肌腱的伸长率极低，低于 1%，有利于确保重复性 [S16]。


    ### 2. 力控制与 FSR 传感器信号处理

    FSR 402 传感器具有电阻随施加力减小的特性 [S12]。通过 10 kΩ 电阻构建分压电路，利用 OpenCR 的 12 位 ADC 进行测量 [S13,
    S26]。由于传感器数据噪声较大，必须应用移动平均滤波 (Moving Average Filter) 形成稳定的抓取力反馈回路。


    ### 3. 过流保护与电源稳定性

    系统使用 3 个独立的 12 V 电源分支 [S15]。各分支由 10 A ATOF 保险丝保护 [S25]，必须分配执行器峰值电流总和以确保不超过保护额定值。这需要通过制造商提供的保险丝时间-电流曲线验证保护协调。'
  worked_examples:
  - '示例 1: 计算 OpenCR ADC 电压。当 FSR 电阻为 10 kΩ，串联电阻为 10 kΩ 时，3.3 V 分压器输出为 $V_{out} =
    3.3 * (10k / (10k + 10k)) = 1.65 V。该值适合 12 位 ADC 范围 [S13, S26]。'
  - '示例 2: 熔断器保护协调。当 4 台执行器处于锁定 (Stall) 状态时，电流总和为 9.2 A [S11]。 10 A 保险丝的冷电阻为 7.7 mΩ
    [S25]，因此正常运行时的电压降约为 0.07 V，可以忽略，但在过电流情况下，精确响应必须参考保险丝制造商的时间-电流曲线。'
  lab:
    title: 机械手集成功能测试
    steps:
    - 在物理分离各电源分支的状态下，利用 DC 电压档测量 3 个适配器的输出，确认是否为 12 V。
    - 将机械手固定在安全夹具上，连接控制器 (OpenCR) 至 PC，将执行器转矩解为 0。
    - 手动对各手指的 FSR 传感器施加压力，记录 ADC 数据变化。
    - 在无负载状态下，对各手指的活动范围 (ROM) 进行 5 次重复动作，确认肌腱是否产生干涉。
    - 试验结束后，务必将 3 个电源适配器从墙壁插座断开，并确认残留电压。
    safety:
    - 务必佩戴护目镜进行试验。
    - 通电期间请勿将手放入活动范围内。
    - 若检测到异常发热、异味或烟雾，请勿靠近，应在危险区域外利用预先指定的楼宇配电盘断路器或经认证的 upstream master disconnect 切断
      3 个适配器的电源后再撤离。若危险区域外无可操作的 upstream 断开手段，则禁止系统通电。转矩释放不能代替断电。仅在计划停机、物理隔离并确认无电源测量后，方可进行维护或接近。
    - 未经电压测量，请勿触摸系统。确认 DC 低于 1 V 是必需的。
    deliverables:
    - 指尖抓取力传感器校准记录
    - 重复动作精度测量数据
    - 各电源分支负载电流测量值
  assignment:
    title: 机械手性能分析最终报告
    deliverables:
    - 性能测试结果分析报告
    - 基于数据的抓取控制算法代码
    rubric:
    - 传感器数据信噪比 (SNR) 分析的合理性
    - 重复动作测试中精度的量化
    - 关于保护设计 (保险丝) 是否满足系统保护意图的理论考察
    - 设计规范与实际制造产品性能指标的对比
  quiz:
  - question: 配置利用 FSR 402 传感器和 OpenCR ADC 的力测量电路时，正确的是什么？
    choices:
    - FSR 分压器仅使用 3.3 V 传感器电源，并将模拟输入信号维持在 0~3.3 V 范围内
    - 用 FSR 和 10 kΩ 电阻构建分压器，并使用 3.3 V 传感器轨
    - ADC 信号必须始终处于 0~5 V 范围内
    - FSR 电阻固定，因此不需要额外的分压电阻
    answer_index: 1
    explanation: 应使用 OpenCR 传感器轨 (3.3 V) 将 ADC 输入限制在 0~3.3 V 范围内，并构建分压电路，以读取电阻变化带来的电压变化
      [S13, S26]。
  - question: 管理 DYNAMIXEL XM430-W350-T 执行器的 12 V 电源分支的方法，正确的是什么？
    choices:
    - 将 3 个适配器的阳极 (+) 输出捆绑在一起以合并功率
    - 为每个适配器安装 10 A 保险丝，并将其用作单独的独立分支
    - 由于电流低于保险丝额定值，可在未进行安全验证的情况下使用
    - 电源适配器输出应无需保险丝直接并联连接
    answer_index: 1
    explanation: 各适配器输出应保持独立，并安装适合独立分支的保险丝，以防止过电流 [S15]。
  - question: 在机械手验证阶段，最重要的安全程序是什么？
    choices:
    - 软件释放转矩与断电相同
    - 始终在万用表确认 DC 低于 1 V 后，方可接近维护
    - 保险丝作为计划停机装置，因此只需拔出保险丝即可
    - 利用连续性 (Continuity) 模式确认电源已切断
    answer_index: 1
    explanation: 软件释放不能替代物理断电，物理分离后利用 DC 电压档确认无残留能量是必需的。
  completion_criteria:
  - 提交性能测试结果报告并获得 70 分以上
  - 在所有实验步骤中遵守安全准则及完成物理断电确认
  - 确认控制代码中传感器数据滤波功能的实现
