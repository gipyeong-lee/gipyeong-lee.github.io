- id: m5
  slug: actuators-sensors
  phase_id: p2
  title: 执行器及传感器集成
  estimated_hours: 13.0
  prerequisites:
  - m4
  objectives:
  - 理解 DYNAMIXEL 智能执行器的控制信号与电源分配结构。
  - 掌握 FSR（力感应电阻）传感器的工作原理，并设计 OpenCR 控制器中的分压电路。
  - 习得执行器电源分支与个别保险丝保护的重要性。
  - 掌握肌腱驱动系统的机构特性与电子控制反馈的联动方法。
  theory_markdown: 若发现异常发热、异味或冒烟，请勿接近，并从危险区域外通过预先指定的建筑配电盘断路器或认证的上游主断路器切断 3 个适配器的供电电源后再撤离。若危险区域外无上游断路手段，则禁止系统通电。扭矩释放不能代替电源切断。维护和接近必须在计划停机后通过物理断开并确认无电状态下进行
    [S14] [S16] [S17] [S15] [S27] [S26]
  worked_examples:
  - 示例 1：执行器分支最大负载计算。若 1 台执行器，堵转电流为 2.3 A [S14]，配置有 4 台执行器的分支最大峰值电流为 4 * 2.3 A = 9.2
    A。这在 10 A 保险丝额定范围内 [S26]，且未超过 11.5 A 适配器输出规范，是安全的 [S17]。
  - 示例 2：FSR分压电路的ADC电压计算。设传感器电阻为R_fsr，固定电阻为R_fixed(10 kΩ)，则ADC输入电压 V_adc = 3.3V *
    (R_fixed / (R_fsr + R_fixed)) [S16, S27]。无接触力时(电阻无穷大) V_adc 为 0 V，最大接触时若传感器电阻小于固定电阻，V_adc
    趋近于 3.3 V，从而将力数据数字化。
  lab:
    title: 执行器及 FSR 传感器集成测试
