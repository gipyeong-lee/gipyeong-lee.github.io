  - 使用 FSR 402 传感器设计电压分压电路并获取 ADC 信号。
  - 为系统过电流保护设计基于保险丝的电源分支。
  - 掌握电气电路绝缘与物理隔离原则。
  theory_markdown: 若发现异常发热、异味或冒烟，请勿接近，并从危险区域外通过预先指定的建筑配电盘断路器或认证的上游主断路器切断 3 个适配器的供电电源后再撤离。若危险区域外无上游断路手段，则禁止系统通电。扭矩释放不能代替电源切断。维护和接近必须在计划停机后通过物理断开并确认无电状态下进行
    [S14] [S17] [S26, S25] [S26] [S15] [S27] [S16]
  worked_examples:
  - 示例 1：分支电源电流总和计算。若一个分支分配有 4 台执行器（各堵转电流 2.3 A），最大理论电流为 9.2 A。这在 10 A 保险丝额定范围内，且未超过适配器
    11.5 A 的输出限值，可安全运行 [S14, S17, S26]。
  - 示例 2：FSR 分压器输出计算。对 FSR 施加力导致传感器电阻变为 10 kΩ 时，分压节点电压为 3.3 V * (10 kΩ / (10 kΩ +
    10 kΩ)) = 1.65 V。这在 OpenCR 12 位 ADC 有效范围内，因此可进行精密力反馈 [S15, S16, S27]。
  lab:
    title: 电源分支配置及传感器输入测试
    steps:
    - 在每个MEAN WELL适配器输出线上串联安装0AFH0001Z在线支架和 10 A ATOF保险丝 [S17, S25, S26]。
    - 利用万用表测量各分支 12 V 电压是否在正常范围内。
    - 使用 OpenCR 3.3 V 引脚、10 kΩ 电阻和 FSR 402 在面包板上构建分压电路 [S16, S27]。
