modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: 机器人运动学基础
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 理解机器人运动学的基本定义及刚体变换（Rigid-body transformation）的概念。
  - 学习使用坐标变换和旋转矩阵以数学方式描述机器人的位置和姿态的方法。
  - 获取 5 级机器人手设计的运动学基础理论并掌握解析方法。
  theory_markdown: '## 机器人运动学基础


    机器人运动学是在不考虑力或转矩的情况下，从位置、速度、加速度的角度处理机器人运动的学科 [S1]。像机械手这类操纵器的设计起点是将每个关节的状态描述为空间坐标。


    ### 1. 刚体变换 (Rigid-body Transformation)

    机器人的每个连杆均被视为刚体，从一个坐标系到另一个坐标系的转换表现为旋转（Rotation）与平移（Translation）的组合。在 3 维空间中，旋转矩阵（Rotation
    Matrix） $R$ 为正交矩阵，通过它定义两个坐标系间的方向 [S1]。


    ### 2. 正运动学 (Forward Kinematics)

    正运动学是在已知关节变量（角度或位置）的情况下，计算机器人末端执行器（End-effector）的位置和方向的过程。在 5 级机器人手中，通过手指关节角（$\theta_1,
    \theta_2, \dots, \theta_n$）来求取指尖位置。


    ### 3. 逆运动学 (Inverse Kinematics)

    逆运动学是将目标指尖位置设定为目标值，并求解为此所需各关节变量的过程。由于其由非线性方程构成，可能存在无解或多解的情况 [S1]。'
  worked_examples:
  - 例题 1：求在 2 维平面上具有 1 个旋转关节（Rotation Joint）的机器人连杆的末端位置 $(x, y)$。当关节角为 $\theta$ 且连杆长度为
    $L$ 时，$x = L \cos(\theta)$, $y = L \sin(\theta)$ [S1]。
  - 例题 2：描述绕 $x$ 轴旋转 $\theta$ 的 2 维旋转矩阵 $R$。$R = \begin{bmatrix} \cos(\theta) & -\sin(\theta)
    \\ \sin(\theta) & \cos(\theta) \end{bmatrix}$ [S1]。
  lab:
    title: 坐标系变换模拟及基础运动学解析
    steps:
    - 使用运动学解析软件创建 2 连杆平面操纵器模型。
    - 改变关节角度，确认末端位置的轨迹。
    - 手动推导逆运动学计算公式并与模拟结果进行比较。
    safety:
    - 进行计算机工作时，请调节屏幕亮度并定期休息。
    - 本实验基于模拟，无需硬件通电。
    deliverables:
    - 包含运动学解析过程的摘要报告
    - 轨迹模拟结果图像
  assignment:
    title: 5 级机器人手关节结构运动学建模
    deliverables:
    - 机器人手指 1 个关节的正运动学方程推导结果
    - 根据关节角度变化预测指尖位置变化的数据
    rubric:
    - 旋转矩阵的数学准确性
    - 正运动学方程的物理合理性
    - 报告的逻辑结构
  quiz:
  - question: 在机器人运动学中，不考虑力或转矩，仅描述运动的学科是什么？
    choices:
    - 动力学 (Dynamics)
    - 运动学 (Kinematics)
    - 控制理论 (Control Theory)
    - 材料力学 (Material Mechanics)
    answer_index: 1
    explanation: 运动学是以位置、速度、加速度为中心的动力学，不含力与转矩 [S1]。
  - question: 在 3 维空间中定义两个坐标系间方向的矩阵是？
    choices:
    - 旋转矩阵 (Rotation Matrix)
    - 质量矩阵 (Mass Matrix)
    - 刚度矩阵 (Stiffness Matrix)
    - 阻尼矩阵 (Damping Matrix)
    answer_index: 0
    explanation: 旋转矩阵是将两个坐标系间方向进行数学转换的正交矩阵 [S1]。
  completion_criteria:
  - 完成理论课程学习
  - 提交运动学解析结果报告
  - 理论测验达到 100 分
  source_ids:
  - S1
- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: 肌腱驱动机制设计
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 理解肌腱驱动机制的基本动力学结构及关节模拟原理。
  - 学习用于精密机器人手的肌腱材料 (Dyneema SK78) 的特性。
  - 掌握肌腱张力传递路径及卷扬轮设计时的摩擦与磨损防护方法。
  - 计算执行器的停转转矩及肌腱驱动时的机械增益。
  theory_markdown: '## 肌腱驱动机制基础


    肌腱驱动 (Tendon-driven) 系统是一种通过肌腱（线）将远程执行器的拉力传递给关节的驱动方式 [S9]。模仿生物手指的肌腱结构，将执行器移至手掌或前臂，从而减少手指自身的质量，并实现精密的运动
    [S10]。


    ### 1. 肌腱的选择及张力传递

    本设计使用高强度低延伸率纤维 Dyneema SK78 [S16]。该材料在直径为 1.5 mm 时具有 230 daN（约 230 kgf）的断裂载荷，工作延伸率低于
    1%，适合精密位置控制 [S16]。


    ### 2. 机械增益与执行器选择

    XM430-W350-T 智能执行器提供 4.1 N·m 的停转转矩 [S11]。由于肌腱通过卷扬轮半径将力从旋转轴转换，执行器的转矩输出会转换为肌腱张力。整个系统使用
    11 台执行器，峰值电流总和可达约 25.3 A [S11]。因此，为稳定供电，构成了总共 3 个独立的 12 V 电源分支，每个分支通过独立的 10 A
    熔断器保护以防止过流 [S15, S24, S25]。


    ### 3. 安全与防护设计

    各 12 V 电源分支通过独立的熔断器运行 [S15, S24]。 3 个电源适配器额定电流均为 11.5 A，合计电流容量达到 34.5 A，足以承载系统峰值电流
    25.3 A [S11, S15]。设计分支合计额定值高于执行器总峰值电流，以确保运行安全性。'
  worked_examples:
  - '例题 1：肌腱驱动时的张力计算

    当执行器转矩 (τ) 为 1 N·m 且卷扬轮半径 (r) 为 0.01 m 时，肌腱张力 (T) 为 T = τ/r = 1/0.01 = 100 N。考虑
    Dyneema SK78 断裂载荷 230 daN（约 2300 N）的安全系数进行设计 [S16]。'
  - '例题 2：电源分支分配与保护

    执行器总计 11 台的停转电流合计为 25.3 A [S11]。将其分配至 3 个分支（各为 4 台、4 台、3 台），各分支最大负载分别为 9.2 A、9.2
    A、6.9 A。 4 台执行器分支的理论峰值 9.2 A 低于 10 A 熔断器和 11.5 A 适配器额定值，但该数值不能单独保证安全性或动作顺序。应结合熔断器制造商的时间-电流曲线与适配器
    OCP 特性，检查保护配合 [S24, S25]。'
  lab:
    title: 肌腱张力及关节摩擦测量实践
    steps:
    - 使用提供的连杆和轴承组装手指关节模型。
    - 连接肌腱并使用张紧器设定初始张力。
    - 将万用表设为直流电压模式，物理断开并检查各分支的 12 V 电源适配器输出。
    - 通电前，手动测量并记录关节的旋转摩擦力。
    safety:
    - 维护/接近前，物理断开 3 个绝缘电源适配器，并使用万用表确认直流电压低于 1 V。
    - 通电期间绝不接近手指的工作范围。
    - 必须佩戴防冲击工作安全护目镜。
    deliverables:
    - 根据关节旋转角度的肌腱张力测量数据
    - 摩擦力分析报告
    - 最终安全测量记录
  assignment:
    title: 5 级机器人手肌腱路径设计
    deliverables:
    - 机器人手指肌腱路径CAD图纸
    - 肌腱摩擦及损耗计算书
    - 各分支电源负载分配及熔断器保护设计图
    rubric:
    - 腱路径是否设计为最小化弯曲部分的摩擦？
    - 是否考虑了 Dyneema SK78 的物理特性？
    - 3个电源分支的负载分配是否适当反映了执行器堵转电流？
    - 保险丝及电源短路保护设计是否符合物料清单规范？
  quiz:
  - question: 使用 Dyneema SK78 肌腱的主要优势是什么？
    choices:
    - 因高延伸率带来的冲击吸收
    - 极低的工作延伸率与高断裂载荷
    - 比金属轻的重量与低拉伸强度
    - 导电性
    answer_index: 1
    explanation: Dyneema SK78 延伸率低于 1%，极低，提高了位置控制精度，是具备高断裂载荷的高性能纤维 [S16]。
  - question: 使用 3 个 12 V 电源适配器（各 11.5 A）的原因描述最恰当的是？
    choices:
    - 为了使用一个电源驱动所有执行器
    - 为了将电压增幅至 36 V 以提高转矩
    - 为了分散承载执行器的总峰值电流，并通过独立的熔断器进行保护
    - 为了消除电源噪声
    answer_index: 2
    explanation: 为了安全地分散 11 台执行器的峰值电流，并用 10 A 熔断器保护各分支，降低系统过流风险 [S11, S15, S25]。
  completion_criteria:
  - 所有实验数据和图纸必须包含在最终报告中。
  - 物理断开电源后，需通过测量证实 3 个分支的直流电压低于 1 V。
  - 肌腱路径设计中必须包含考虑卷扬轮摩擦的解析。
  source_ids:
  - S9
  - S10
  - S16
  - S11
  - S15
  - S24
  - S25
- id: M3
  slug: actuator-controller-selection
  phase_id: P1
  title: 执行器与控制器选择
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - 理解 DYNAMIXEL XM430-W350-T 执行器的额定电压、电流及通信特性。
  - 熟知 OpenCR 1.0 控制器的 DYNAMIXEL 端口配置及12V电源分离结构。
  - 设计使用 FSR 402 传感器与 10kΩ 电阻的分压电路。
  - 计算系统功率要求并建立独立分支熔断器保护设计。
  theory_markdown: '### 执行器及控制器系统设计理论


    #### 1. 执行器选型及功率特性

    为实现机器人手部的精密驱动，使用 DYNAMIXEL XM430-W350-T。该执行器在十二伏额定电压下工作，堵转电流为 2.三安培 [S11]。整个机器人手部由
    11 个执行器构成，因此总堵转电流之和约为 25.三安培。因此，为实现稳定驱动，需要独立的电源供应体系。


    #### 2. 控制器架构

    OpenCR 1.0 搭载二百十六兆赫兹 ARM Cortex-M7 处理器，适用于实时控制 [S13]。该控制器支持将十二伏执行器电源与逻辑/传感器电源在物理上分离的结构。由于
    FSR 传感器等模拟输入必须在 0 至 3.三伏范围内处理，传感器分压电路必须从 OpenCR 的 3.三伏传感器轨获取电源 [S13]。


    #### 3. 过电流保护及电源分支设计

    使用输出功率为一百三十八瓦的 MEAN WELL GST160A12-R7B 适配器 3 个 [S15]。每个适配器的额定电流为 11.五安培，通过此生成
    3 个独立的十二伏分支。每个分支均安装十安培 ATOF 保险丝，以便在发生过电流时保护电路 [S24, S25]。保险丝设置得低于额定电流 11.五安培，从而实现保护配合。


    #### 4. 传感器信号采集

    FSR 402 具有随着压力增加电阻减小的特性 [S12]。将其与十千欧姆固定电阻和分压器连接，将力变化转换为电压信号，并输入到 OpenCR 的十二位模数转换器端口
    [S12, S13, S26]。'
  worked_examples:
  - 例题 1：确认每分支最大电流。当一个分支连接 4 个 XM430 执行器时，停转电流合计为 4 * 2.3A = 9.2A。这满足适配器 11.5A 额定值及在线熔断器
    10A 额定值，维持在安全范围内 [S11, S15, S25]。
  - 例题 2：FSR 分压电路电压计算。在 3.3V 供电电压下，FSR 电阻为 R_fsr 时，ADC 输入电压 V_adc = 3.3 * (10k / (10k
    + R_fsr)) V。根据传感器范围 (0.2N~20N) 确认电阻变化，以确保不超过 0~3.3V 范围 [S12, S13, S26]。
  lab:
    title: 电源分支配置及 ADC 传感器接口实践
    steps:
    - 在各 MEAN WELL 适配器输出端连接 0AFH0001Z 熔断器座，并插入 0287010 10A 熔断器。
    - 将万用表设为直流电压模式，确认各分支电压为稳定的 12V。
    - 在 OpenCR 的 3.3V 传感器导轨上，使用 10kΩ 电阻与 FSR 402 构成分压电路。
    - 非通电状态下，确认分压电路输出电压是否在 0~3.3V 范围内。
    safety:
    - 开始作业前，物理断开 3 个适配器的交流电源，并使用万用表确认电压为 0V。
    - 务必始终佩戴防冲击工作安全护目镜。
    - 通电期间绝对禁止更改电路或触摸配线。
    - 说明熔断器用于过流阻断，而非计划停止手段。
    deliverables:
    - 各分支 12V 输出测量记录表
    - FSR 分压电路组装完成照片
    - 配置好的配线图
  assignment:
    title: 电源分支及保护设计评审
    deliverables:
    - 整个机器人手电流分配表（各分支执行器分配）
    - 证明所选熔断器既能保护执行器停转电流，又不超过适配器容量的计算书
    rubric:
    - 独立熔断器是否准确布置在各分支？
    - 执行器分支分配是否按照 4/4/3 的规定？
    - 传感器电源是否从非 12V 的 3.3V 传感器导轨供应？
  quiz:
  - question: 使用 FSR 402 传感器与 10kΩ 电阻的分压电路，正确的电源连接是？
    choices:
    - 12V 执行器电源
    - OpenCR 3.3V 传感器导轨
    - 5V 通用电源
    - OpenCR 12V 输出
    answer_index: 1
    explanation: OpenCR 的 ADC 输入基于 3.3V 运行，因此电压分压电路必须从 3.3V 传感器导轨供电 [S13]。
  - question: XM430-W350-T 执行器的停转电流值是？
    choices:
    - 1.0A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: 根据数据手册，该执行器的停转电流为 2.3A [S11]。
  - question: 在电源分支设计中，绝对禁止的行为是？
    choices:
    - 在各适配器输出安装熔断器
    - 将适配器的正极(+)输出并联
    - 每分支使用 10A 熔断器
    - 使用绝缘型适配器
    answer_index: 1
    explanation: 适配器的正极(+)输出必须维持独立分支，绝对禁止并联 [B3]。
  completion_criteria:
  - 通过实验万用表验证 3 个独立分支的 12V 电压
  - 完成 FSR 402 传感器分压电路配线及 ADC 输入电压范围确认
  - 提交并通电源分支及保护设计报告
  source_ids:
  - S4
  - S5
  - S11
  - S13
  - S15
  - S24
  - S25
  - S12
  - S26
- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D 打印及零件加工
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 理解使用碳纤维增强 PC 丝材 (PC-CF) 进行零件制作及输出设置优化的方法。
  - 掌握热熔嵌入螺母 (Heat-set insert) 及滑动轴承的精密组装公差管理。
  - 理解用于肌腱驱动机制的 Dyneema 线处理及卷扬轮设计结构。
  - 熟知为确保机器人结构尺寸稳定性和刚性的加工及紧固技术。
  theory_markdown: '### 3D 打印及零件加工理论


    #### 碳纤维增强工程材料 (PC-CF)

    PC (Polycarbonate) 具备优异的刚性与耐热性，其中添加了碳纤维的 PC-CF 丝材最大化了刚性，适用于结构件制作 [S19]。但由于碳纤维的磨损性，务必使用硬化钢喷嘴
    [S19]，并需要 285°C 左右的高温打印 [S19]。


    #### 用于精密组装的插件及紧固

    为实现塑料件的可重复装卸，使用热熔嵌入螺纹插件 [S21]。对于 M3 插件，需在 CAD 设计时预先放置 4.0mm 直径的引导孔以精确就位 [S21]。此外，免润滑聚合物滑动轴承
    (iglide J) 与 8mm 铝轴组装时，设计为压入后内径具有最佳间隙 [S17]，因此对轴直径 8mm 的公差管理必不可少 [S17, S18]。


    #### 肌腱驱动结构

    Dyneema SK78 纤维在直径 1.5mm 时具有 230 daN 的高断裂载荷和低于 1% 的延伸率 [S16]，是钢缆的优良替代品。由于肌腱在旋转轴处反复弯曲，将卷扬轮边缘进行倒角处理以防止摩擦造成的断线是重要的结构设计。'
  worked_examples:
  - 例题 1：PC-CF 丝材喷嘴选择 - 鉴于碳纤维的高磨损性，黄铜喷嘴会迅速磨损并导致打印质量下降及喷嘴堵塞，因此必须确认选择硬化钢 (Hardened steel)
    喷嘴 [S19]。
  - 例题 2：插件孔设计 - Accu HTBI-M3-BR 插件外径为 4.4mm，但官方建议孔径为 4.0mm [S21]，因此 CAD 设计时应将孔直径固定为
    4.0mm，以便热熔嵌入时塑料足以渗入插件滚花 (knurling) 之间 [S21]。
  lab:
    title: 手指结构件制造与组装实践
    steps:
    - 设置配备硬化钢喷嘴的 FDM 3D 打印机以适用于碳纤维 PC 丝材环境 [S19]。
    - 打印手指连杆与手掌框架后，清除支撑并整理表面。
    - 用热工具将热熔嵌入插件垂直安装至 4.0mm 引导孔中 [S21]。
    - 切割 IGUS 精密铝轴并对末端进行倒角 [S18]。
    - 将滑动轴承压入外壳，插入轴并确认间隙 [S17]。
    - 使用 M3 帽螺钉紧固结构及传感器支架 [S20]。
    safety:
    - 注意高温喷嘴 (285°C) 及热床 (110°C) 造成的烧伤 [S19]。
    - 后加工打印件及倒角时必须佩戴护目镜。
    - 加热插件时可能产生烟雾，应开启通风设施。
    - 通电前检查所有机械紧固状态。
    deliverables:
    - 制作完成的 5 级机器人手结构（连杆、手掌）。
    - 热熔嵌入插件垂直度及轴承间隙测量记录。
    - 最终紧固部位外观检查完成报告。
  assignment:
    title: 机器人手制造精度验证
    deliverables:
    - 成品结构的 CAD 数据与实际尺寸测量对照表
    - 组装公差管理计划书
    - 肌腱布线结构的摩擦减小设计说明书
    rubric:
    - 热熔嵌入插件是否垂直就位（优/良/差）
    - 轴承-轴组装后旋转运动是否平滑（合格/不合格）
    - 是否遵守 BOM 中指定的零件额定值及型号规格 [B10, B11, B12, B13, B14]
  quiz:
  - question: 使用 PC-CF 丝材时必须使用硬化钢喷嘴的主要原因是什么？
    choices:
    - 防止碳纤维的磨损性导致黄铜喷嘴迅速磨损
    - 丝材熔点低，普通喷嘴无法打印
    - 为了提高打印件的表面光泽
    - 为了提高挤出速度
    answer_index: 0
    explanation: 碳纤维具有极高的磨损性，会迅速损坏普通黄铜喷嘴，因此硬化钢喷嘴是必须的 [S19]。
  - question: 使用 M3 热熔嵌入插件 (Accu HTBI-M3-BR) 时建议的引导孔直径是？
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: 数据手册中建议的孔直径为 4.0mm [S21]。
  completion_criteria:
  - 所有结构件均通过 FDM 3D 打印完成 [B10]
  - 热熔嵌入插件准确就位于所有指定孔位 [B14]
  - 铝轴与滑动轴承的组装间隙满足标准值 [B11, B12]
  - 紧固时正确使用了 M3 规格的帽螺钉 [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: 轴承及紧固件安装
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 理解用于精密机器人手制作的轴承及轴的机械公差与安装原理。
  - 掌握使用热熔嵌入插件 (Heat-set insert) 确保工程塑料件紧固强度的方法。
  - 通过使用适当的转矩和紧固规格最小化组装间隙。
  theory_markdown: '### 轴承与轴的公差管理

    为确保精密机器人关节的平稳运动及刚性，使用 iglide® J 滑动轴承 (JSM-0810-10) 和 8 mm 精密铝轴 (AWMP-08)。滑动轴承设计为压入
    (press-fit) 外壳时调整内径，遵守外壳建议内径公差是核心 [S17, S18]。间隙过大会降低关节精度，反之过小会增加摩擦，从而降低执行器 (DYNAMIXEL
    XM430) 的电流效率。


    ### 热熔嵌入插件安装

    PC-CF (碳纤维增强 PC) 打印件在直接锁紧金属螺钉时，由于材质特性容易磨损螺纹。为防止此类现象，使用黄铜材质的热熔嵌入插件 (HTBI-M3-BR)
    [S21]。插件插入 4.0 mm 引导孔后加热，使周围树脂熔化并紧固，从而在反复拆装时保持高机械强度 [S21]。此时插件如果倾斜，会导致连杆排列偏差，因此保持垂直是必须的。'
  worked_examples:
  - 例题 1：确认外壳内径 - iglide® JSM-0810-10 轴承外径为 10 mm。因此外壳内孔设计必须符合 10 mm，若不遵守插件安装时 4.0
    mm 引导孔，插件可能产生空转或导致外壳破裂 [S17, S21]。
  - 例题 2：M3 螺钉组装 - M3x10 帽螺钉使用 2.5 mm 内六角扳手锁紧，由于过大转矩会导致插件周围树脂开裂，应在“不再转动时”以最小力度固定 [S20]。
  lab:
    title: 机器人手关节精密组装
    steps:
    - 1. 确认 PC-CF 打印件外壳中 4.0 mm 引导孔清洁，并将插件垂直对齐。
    - 2. 将烙铁加热至适当温度，垂直缓慢按下插件，使其与外壳表面平行压入。
    - 3. 将 iglide® 轴承压入内孔，插入 8 mm 铝轴，确认间隙与阻力。
    - 4. 使用 M3 螺钉完成连杆间的紧固，并活动关节验证摩擦是否均匀。
    safety:
    - 烙铁为高温物件，注意烧伤，加热后立即放入支架。
    - 插件压入时产生的微尘不得吸入，务必充分通风。
    - 必须佩戴护目镜进行作业。
    - 检测到异常发热、异味或冒烟时请勿靠近，在危险区域外用指定断路器切断 3 个适配器的供电电源后撤离。没有 upstream 断开手段时禁止系统通电。转矩释放不能代替断电。维护/接近应在计划停止后进行物理断开及无电测量确认后再执行。
    deliverables:
    - 各关节摩擦测试记录表
    - 插件垂直对齐确认照片
    - 组装后的连杆自由度及间隙测量记录
  assignment:
    title: 组装公差及紧固力分析报告
    deliverables:
    - 关节组装顺序及转矩管理计划书
    - 出现间隙时的解决方法（使用 Shim 或修正公差）说明
    - 组装完成后的机器人手连杆抓取测试初步数据
    rubric:
    - 是否明确描述了插件安装的垂直度？
    - 是否正确说明了轴承与轴的公差概念？
    - 组装阶段是否遵守了安全守则？
  quiz:
  - question: 为什么 iglide® J 轴承压入外壳后内径会发生调整？
    choices:
    - 由于轴承材质的弹性，压入时内径自动增大。
    - 是因为设计上使得压入过程中的内径可以根据外壳内孔的公差精确调整。
    - 是因为压入前的内径总是被制作得比标准值小。
    answer_index: 1
    explanation: iglide® 滑动轴承制作时比标准值大，设计为压入正确的外壳内孔时，内径达到设计公差内 [S17]。
  - question: 在 PC-CF 打印件上使用黄铜热熔嵌入插件时合适的引导孔大小是？
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: 根据数据手册，HTBI-M3-BR 插件的建议引导孔大小为 4.0 mm [S21]。
  completion_criteria:
  - 完成 5 个手指关节摩擦阻力均匀性的确认及测量记录提交。
  - 完成所有插件与 PC-CF 外壳水平度及尺寸检查。
  - 承诺遵守组装中的安全守则并提交工作记录表。
  source_ids:
  - S17
  - S18
  - S20
  - S21
- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: 布线及安全的电源分离构建
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - 理解用于执行器驱动的独立 12 V 电源分支配置方法。
  - 学习用于过流保护的 ATOF 熔断器作用及选型原理。
  - 掌握安全的电源管理及物理断开协议。
  - 构成 OpenCR 控制器及 FSR 传感器安全的电压分压电路。
  theory_markdown: '## 安全布线及电源分离原理


    5 级机器人手系统使用多台高转矩执行器，因此高效且安全的电源分配至关重要。本课程使用 11 个电源适配器，将执行器以 4 台/4 台/3 台单位进行分离配置，旨在分散各分支电流负载并提高电源稳定性
    [S15]。


    ### 1. 电源独立性确保

    各适配器的正极(+)输出必须维持为独立分支，严禁擅自合并或捆绑。应在 [S15] 中说明的适配器额定输出电流 (11.5 A) 内，承载执行器峰值电流（XM430-W350-T
    每 1 台 2.3 A） [S11]。 4 台单位分支的峰值电流合计为 9.2 A，在适配器的连续输出允许范围内。


    ### 2. 过流保护 (Protection Coordination)

    各分支配置 10 A ATOF 熔断器，以保护系统免受线路或执行器错误导致的过流侵害 [S25]。ATOF 熔断器在额定电流的 110%~135% 水平动作，相对于峰值电流
    9.2 A，可进行稳定的保护。但熔断器选型务必参照制造商提供的“Time-Current Curve”，负载电流小并不能保证安全 [S25]。


    ### 3. 控制电路分离

    使用 DYNAMIXEL 端口内建型 OpenCR 控制板，剔除复杂的外部桥接电路，提高再现性 [S13]。FSR 力传感器为将电压转换给 ADC 输入，使用从
    3.3 V 传感器导轨供电的分压电路，该电路必须与 12 V 执行器电源在电气上分离 [S13]。


    ### 4. 工作安全守则

    台式原型机非认证机器安全系统，在进行维护或修正作业前，务必物理断开 3 个电源适配器，并使用万用表直流电压模式确认各分支残余电压低于 1 V [S7]。'
  worked_examples:
  - 检测到异常发热、异味或冒烟时请勿靠近，在危险区域外用指定断路器切断 3 个适配器的供电电源后撤离。没有 upstream 断开手段时禁止系统通电。转矩释放不能代替断电。维护/接近应在计划停止后进行物理断开及无电测量确认后再执行
    [S11] [S25]
  - 例题 2：FSR ADC 电路电压 - 使用 OpenCR 的 3.3 V 传感器导轨连接 10 kΩ 分压电阻与 FSR 402 [S13, S26]。传感器信号电压应在
    0~3.3 V 范围内，此电路必须与 12 V 执行器电源电路在物理/电气上分离以进行保护。
  lab:
    title: 电源分支线束制作及安全检查
    steps:
    - 在各适配器输出线安装 ATO 在线熔断器座，并插入 10 A ATOF 熔断器 [S24, S25]。
    - 使用 Molex Micro-Fit 3.0 连接器制作执行器及传感器连接线束 [S14]。
    - 将 OpenCR 板与各执行器以 3 个分支进行配线，并连接至各电源适配器 [S13]。
    - 通电前，使用万用表电阻模式确认各适配器输出端的绝缘状态。
    - 通电后，在电压模式确认各分支为 12 V，断开时务必拆除 3 个适配器。
    safety:
    - 维护前请物理断开 3 个电源适配器。
    - 使用万用表确认残余电压低于 1 V 后再进行部件更换。
    - 通电期间请勿将手放入工作范围内。
    - 所有连接处均需绝缘处理，焊接时佩戴护目镜。
    deliverables:
    - 制作完成的电源分支线束照片
    - 各分支测量电压记录表
    - 配线图评审确认表
  assignment:
    title: 安全配线设计报告
    deliverables:
    - 3 个电源分支的执行器分配设计案（各分支 4 台/4 台/3 台）
    - 各分支过流阻断计算书（峰值电流与熔断器额定比较）
    - 在计划停止后进行维护/接近前，物理断开 3 个电源适配器，并 계측确认各分支无电状态
    rubric:
    - 是否遵守电源独立性与分离原则？
    - 熔断器与连接器的额定值是否适合负载？
    - 电源分离及残余电压确认协议是否符合安全指南？
  quiz:
  - question: 可以将各电源适配器的 12 V 输出(+)并联连接吗？
    choices:
    - 可以，电流供给能力增加。
    - 不可以，必须维持独立分支。
    - 如果电压一致就可以。
    - 如果增加熔断器就可以。
    answer_index: 1
    explanation: 各适配器输出必须独立维护，绝对禁止并联 [S15]。
  - question: 在维护机器人手之前最优先的安全措施是？
    choices:
    - 软件转矩释放
    - 万用表电阻测量
    - 3 个电源适配器的物理断开及残余电压确认
    - 按下计划停止按钮
    answer_index: 2
    explanation: 维护前务必物理断开 3 个电源适配器，并用万用表确认各分支残余电压低于 1 V。
  - question: FSR 力传感器 ADC 电路应使用哪个电源导轨？
    choices:
    - 12 V 执行器导轨
    - 5 V 电源导轨
    - 3.3 V 传感器导轨
    - 24 V 电源导轨
    answer_index: 2
    explanation: 为保护 OpenCR 的 ADC 电路，必须使用 3.3 V 传感器导轨 [S13]。
  completion_criteria:
  - 3 个独立分支线束构成及熔断器安装完成
  - 各分支空载电压测得为 12 V
  - 物理断电后所有测量节点的残余电压均记录为低于 1 V
  - 提交并通电源安全设计报告
  source_ids:
  - S14
  - S24
  - S25
  - S7
  - S15
  - S11
  - S13
  - S26
- id: M7
  slug: firmware-development
  phase_id: P3
  title: 固件开发及控制
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - 理解 DYNAMIXEL 智能执行器通信及控制框架。
  - 实现利用 OpenCR 控制板执行器及 FSR 传感器信号采集。
  - 设计实时机器人控制状态机及闭环反馈回路。
  - 进行安全的电源管理及转矩释放序列编程。
  theory_markdown: '### 固件架构及 DYNAMIXEL 控制

    机器人手的固件在高频循环内采集传感器数据并处理执行器指令。`OpenCR 1.0` 控制器基于 216MHz ARM Cortex-M7 处理器 [S13]，无需额外桥接即可处理
    DYNAMIXEL 协议 2.0 [S11]，最小化延迟。各执行器支持电流、速度、位置模式，机器人手使用基于电流控制的转矩抓取策略。


    ### FSR 力反馈系统

    FSR 402 传感器具有与施加力成反比的电阻特性 [S12]。使用 OpenCR 的 12 位 ADC [S13]，在 3.3V 传感器导轨上构成 10kΩ
    电阻与电压分压电路。分压后的电压通过 `ADC值 = (V_in * R_fsr) / (R_fsr + R_ref)` 归一化，该值与手指的肌腱张力联动，作为抓取力反馈使用。


    ### 安全控制例程

    系统停止为安全起见分为两阶段。在软件阶段，转矩释放 (Torque Off) 立即移除物理驱动力。维护前必须物理断开 3 个独立电源适配器，并使用万用表 DC
    模式确认所有分支低于 1V。'
  worked_examples:
  - 1. 执行器目标位置/电流设定：使用 DYNAMIXEL SDK 设置 XM430 执行器的限流 (Goal Current)，并通过传感器值联动 PID
    回路更新手指关节最终位置的示例。
  - 2. FSR 电压数据滤波：为去除 ADC 采集的原始数据噪声，应用移动平均滤波器 (Moving Average Filter)，并实现归一化上限 (20N)
    和下限 (0.2N) 范围的代码 [S12]。
  lab:
    title: 机器人手集成控制及精密抓取实践
    steps:
    - 使用万用表 DC 模式确认各独立分支电压低于 1V 后开始组装。
    - 在 OpenCR 的 3.3V 传感器导轨焊接 FSR 电压分压电路并连接至 ADC 端口。
    - 使用 DYNAMIXEL SDK 扫描 11 个执行器的 ID 并设定初始位置。
    - 在无负载状态测试手指关节驱动指令，调节肌腱延伸率与张力。
    - 可视化 FSR 传感器数据并调试抓取力响应。
    safety:
    - 绝对禁止将 5V 或 12V 执行器电源用作 FSR 传感器电路的供电电源。
    - 系统通电期间绝不接近手指工作范围，使用固定夹具。
    - 绝对禁止将电源分支适配器的正极(+)端相互连接。
    - 维护/组装接近前，务必物理断开 3 个电源适配器，并测量确认所有分支低于 1V。
    deliverables:
    - 包含实时传感器数据反馈的固件源代码
    - 电压分压数据的归一化及校准数据手册
    - 执行器反馈回路正常运作日志
  assignment:
    title: 抓取状态机设计及实现
    deliverables:
    - 抓取与释放状态机流程图
    - 实现基于电流的转矩控制代码
    - 最终性能评价报告
    rubric:
    - 根据传感器值的限流范围 (0-2.3A) 是否稳定受控？
    - 当发出转矩释放指令时，物理张力是否立即消除？
    - 代码中是否明确了安全硬件隔离程序？
  quiz:
  - question: 配置 FSR 402 传感器和分压电路时，推荐的电源轨是什么？
    choices:
    - 12V 执行器电源轨
    - 5V 通用电源轨
    - OpenCR 3.3V 传感器电源轨
    - 24V 外部输入电源轨
    answer_index: 2
    explanation: 为了系统安全和 OpenCR ADC 保护，FSR 分压电路必须连接到 3.3V 传感器电源轨。
  - question: 维护机械手时，确认系统处于“无电源状态”的正确方法是什么？
    choices:
    - 通过软件发送转矩释放指令。
    - 用万用表电阻档检查接线状态。
    - 用万用表 DC 电压档测量所有分支是否低于 1V。
    - 拆除电源分支保险丝。
    answer_index: 2
    explanation: 物理断电后，必须务必使用万用表 DC 电压档直接确认所有分支的残留电压是否低于 1V。
  - question: 可以将多个独立电源适配器输出的阳极(+)端并联连接吗？
    choices:
    - 为了电流求和是必须的。
    - 绝对禁止。
    - 如果额定输出电流相同，则可以。
    - 如果安装了保险丝，则可以。
    answer_index: 1
    explanation: 由独立分支构成的电源适配器的阳极(+)输出绝对不能相互连接或合并。
  completion_criteria:
  - 利用万用表验证各分支独立供电及保险丝保护是否按照 BOM 规范配置完成
  - 通过 OpenCR ADC 确认 5 个 FSR 传感器的精密力信号获取及滤波
  - 完整执行软件转矩释放例程及物理断电后的测量程序
  - 抓取状态机按预期处理执行器及传感器数据，并提交最终报告
