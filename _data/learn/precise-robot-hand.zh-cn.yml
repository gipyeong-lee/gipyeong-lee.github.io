course:
  course_type: build_project
  slug: precise-robot-hand
  title: 构建精密的 5 级机器人手
  summary: 这是一个以项目为导向的课程，涵盖了从机器人基础到 5 级机器人手设计、运动学、电子电路、控制算法及系统集成全过程。
  outcome: 制作可独立运行的 5 级机器人手原型，掌握机构设计能力，并具备实现嵌入式控制系统的能力。
  audience: 机器人工程入门大学生及创客
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3D 打印机
  - 万用表
  - 电烙铁
  - 通用手动工具
  - PC-CF 用硬化钢喷嘴
  - 防冲击护目镜
  - 游标卡尺
  safety_summary:
  - 这是低压教育原型，并非认证的机器安全系统
  - 学习者制作的停机电路不得用作安全功能或紧急停止
  - 正常停机应通过软件扭矩释放执行。计划停机维护或接近前，必须物理断开 3 个绝缘电源适配器，并通过测量确认处于无电状态
  - 通电时请勿将手放入工作范围内，并在固定夹具上从空载开始测试
  - 在切割、钻孔或进行肌腱张力测试时，必须佩戴防冲击护目镜
  - 若发现异常发热、异味或冒烟，请勿接近。应通过危险区域外预先指定的建筑配电盘断路器或认证的上游主断路器切断 3 个适配器的供电电源后再撤离。若危险区域外没有可操作的上游断路手段，则禁止系统通电。扭矩释放不能代替电源切断
  - 在将机器人投入人员接近环境前，必须在合格安全专家的审查下，另行设计并验证双通道、手动复位、EDM（外部设备监控）和可反馈的双接触器
