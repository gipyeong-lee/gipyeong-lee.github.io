capstone:
  title: 机械手最终装配及抓取测试
  deliverables:
  - 最终装配完成的机械手
  - 控制固件源代码
  - 抓取测试数据记录
  - 最终项目报告
  rubric:
  - 机械精度及运行范围
  - 抓取成功率（针对多种物体）
  - 控制系统反应速度
  - 遵守电气及机械安全性
  safety:
  - 计划停机后，维护/接触前物理断开 3 个绝缘电源适配器，并记录各分支剩余电压在直流电压模式下低于 1 V
  - 检查各独立电源分支的 10 A 保险丝额定值及时间-电流特性
  - 在固定夹具上完成空载测试后，分阶段增加抓取负载
  - 在切割、钻孔、腱绳张力及抓取测试期间必须佩戴防冲击安全防护眼镜
