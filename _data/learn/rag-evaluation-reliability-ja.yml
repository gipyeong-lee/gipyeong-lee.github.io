- id: m1
  slug: intro-rag-architecture
  phase_id: p1
  title: RAGアーキテクチャの理解
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - RAG (Retrieval-Augmented Generation) アーキテクチャの主要構成要素を理解する。
  - 大規模言語モデル (LLM) が持つ知識の限界と、検索ベースの拡張の必要性を把握する。
  - 検索-生成パイプラインの構造的な流れを説明できるようにする。
  theory_markdown: '## RAG (Retrieval-Augmented Generation) アーキテクチャの概要


    最新の自然言語処理 (NLP) およびディープラーニングモデルは、膨大なテキストデータを学習して優れた性能を発揮しますが、モデルの学習時点に含まれていない最新情報や、特定のドメインの非公開データに対しては、ハルシネーション（幻覚）を引き起こしたり、情報を知らないといった限界があります
    [S1]。


    ### 検索を通じたLLMの限界克服

    RAGは、モデルがすべての知識をパラメータ内部に記憶させるのではなく、質問に関連する外部の信頼できるドキュメントを「適切な時点 (just-in-time)」で検索し、生成段階の入力として提供する方式です
    [S2]。


    ### 主要構成要素

    1. **検索器 (Retriever)**: ユーザーのクエリ (query) を受け取り、ベクトルデータベースなどで関連性の高いドキュメントの断片 (chunk)
    を特定します。

    2. **拡張 (Augmentation)**: 検索されたドキュメントと元の質問を組み合わせて、LLMに渡すプロンプトを構成します。

    3. **生成器 (Generator)**: 拡張された情報を基に、事実に基づいた回答を生成します。


    このような構造は、モデルの知識を最新の状態に維持し、生成された回答の根拠を追跡可能にすることで、信頼性を確保するのに寄与します。'
  worked_examples:
  - '事例 1: 従来のLLM方式 - 「今日のニュースを教えて」と質問した場合、学習データ以降の出来事を認識できず、誤った情報を生成するリスクがある。'
  - '事例 2: RAG方式 - 「今日のニュースを教えて」と質問した際、1) 外部検索エンジンやリアルタイムニュースAPIを通じて検索器 (Retriever)
    が関連記事を収集し、2) これを文脈 (context) として含めてLLMに渡すことで、正確な最新情報の回答を生成。'
  lab:
    title: RAGアーキテクチャのフロー可視化および分析
    steps:
    - Jupyter Notebookを開き、RAG基本パイプラインの3段階（入力、検索、生成）の構造を模式化する。
    - オープンライセンスのドキュメントコーパスから5個の短いテキストを抽出し、データセットのサンプルを作成する。
    - 単純なキーワードマッチングを行う検索器 (Retriever) 関数を作成し、質問に適したドキュメントを返すよう実装する。
    - 検索されたドキュメントをプロンプトテンプレートに注入する拡張段階をコードで作成する。
    safety:
    - 実際の個人情報や機密ドキュメントを、絶対にコーパスデータとして使用しないこと。
    - API使用時は呼び出し回数の制限 (Rate Limit) を確認し、テストコードにシード (seed) 値を設定して再現性を確保すること。
    deliverables:
    - RAGアーキテクチャのダイアグラム (Notebookセル内に含めること)
    - 単純なキーワードベースの検索器の実装コード
    - ドキュメント注入型プロンプトの生成結果
  assignment:
    title: RAGベースの情報検索パイプライン分析レポート
    deliverables:
    - 実装したRAGパイプラインの動作原理を説明するNotebook
    - 検索器がドキュメントの関連性を判断する際に発生しうる潜在的な失敗事例3件の記述
    rubric:
    - RAGの3段階（検索、拡張、生成）が正確に区別されて説明されているか？
    - 検索段階において、無関係なドキュメントが検索される可能性に対する分析が妥当か？
    - 非公開データのセキュリティ指針を遵守して実装したか？
  quiz:
  - question: RAGがLLMの学習方式と比較して持つ主な利点は何ですか？
    choices:
    - LLMのパラメータサイズを削減できる。
    - モデルの知識を最新の状態に維持し、根拠を提示できる。
    - モデルの学習速度を加速させる。
    - すべての質問に対して100%事実である回答を生成する。
    answer_index: 1
    explanation: RAGは外部ドキュメントを参照するため最新情報を反映でき、生成された回答の根拠をドキュメントから見つけられるため、信頼性が高いです。
  - question: 検索器 (Retriever) の役割として正しいものは何ですか？
    choices:
    - 回答を生成する役割を担う。
    - 学習データを再学習させる役割を担う。
    - 質問に関連する外部ドキュメントの断片を検索する。
    - ユーザーインターフェースを管理する。
    answer_index: 2
    explanation: 検索器は、ユーザーの質問と意味的に類似していたり関連性が高いドキュメントを、外部データソースから見つけ出す役割を担います。
  completion_criteria:
  - RAGアーキテクチャの構成要素を説明できる。
  - 実習したRAGパイプラインのコードが正常に動作し、関連ドキュメントの検索および拡張を確認できる。
  - RAGパイプラインの限界点と改善方向を分析レポートに記述する。
  source_ids:
  - S1
  - S2
- id: m2
  slug: corpus-curation
  phase_id: p1
  title: 評価用ドキュメントコーパスのキュレーション
  estimated_hours: 8.0
  prerequisites:
  - m1
  objectives:
  - RAG評価のための固定ドキュメントコーパスの重要性を理解する。
  - 評価用ドキュメントデータの品質決定要素（正確性、多様性、重複排除）を学習する。
  - 定量的な評価のためのドキュメント-質問-正解ペア (QA Pair) データセット構築戦略を習得する。
  - データ漏洩 (Data Leakage) を防止するための学習/評価データの分割方法を習得する。
  theory_markdown: '## RAG評価のためのコーパスキュレーション


    大規模言語モデル (LLM) は学習されたパラメータ内の知識に依存する場合、ハルシネーション（幻覚）のリスクが存在します。検索拡張生成 (RAG) は、モデルがリアルタイムで外部知識にアクセスできるようにすることで、このような限界を克服します
    [S2]。効果的なRAGシステムの信頼性を定量的に評価するためには、**固定され、制御可能な評価用ドキュメントコーパス (Fixed Evaluation
    Corpus)** が不可欠です。


    ### 1. コーパス品質の決定要素

    - **正確性 (Factuality):** ドキュメント内の情報は最新かつ事実である必要があります。誤った情報が含まれたコーパスは、誤った回答を生成させます。

    - **ドメイン適合性:** 評価しようとする実際のサービス環境と類似したトピックや語彙を含んでいる必要があります。

    - **重複排除 (De-duplication):** 同一情報が複数のドキュメントに重複していると、検索結果の多様性が損なわれ、評価統計に偏りを与える可能性があります。


    ### 2. QA評価データセットの構築

    ドキュメントコーパスだけでは評価は不可能です。「ドキュメント-質問-正解」ペアを構築し、検索器が関連ドキュメントを正しく持ってくるか、生成器がこれを基に正確な回答をするかを測定しなければなりません。

    - **質問生成:** LLMを使用してドキュメントから自動的に質問を生成するか、ドメイン専門家が直接作成します。

    - **正解の定義:** 回答の根拠となるドキュメント区間 (Chunk) を明確に明示しなければなりません。


    ### 3. データの分割と整合性

    評価セットの信頼性のため、**開発用 (Development Set)** と **最終評価用 (Hold-out Test Set)** を厳格に分割しなければなりません。評価セットに含まれる質問が、検索対象ドキュメントに直接含まれて露出してしまう「データ漏洩」現象を防止しなければなりません。'
  worked_examples:
  - '例 1: ドキュメントチャンキング (Chunking) 戦略。テキストを固定サイズに分割する際、文脈が切れないように段落単位や意味単位で分けるPythonスクリプトの作成方法。'
  - '例 2: 質問-回答データの構成。{ ''question'': ''...'', ''ground_truth'': ''...'', ''context_chunk_id'':
    ''...'' } 形式のJSONオブジェクト生成例。'
  lab:
    title: 評価用コーパス構築の実習
    steps:
    - 評価対象ドメインのオープンライセンステキストファイル (.txt) を確保する。
    - Pythonを使用してテキストファイルを読み込み、チャンク単位に分けるスクリプトを作成する。
    - 各チャンクに一意の識別子 (ID) を付与し、メタデータ（タイトル、ソース）を記録する。
    - 作成したチャンクの中から質問を生成し、回答の根拠となるチャンクIDを記録して50個のQAペアを構成する。
    - 全コーパスを8:2の比率で開発セットとテストセットに分割して保存する。
    safety:
    - 個人情報が含まれるドキュメントは、評価コーパスに含めないこと。
    - 外部API使用時はリクエスト回数の上限を設定して費用を制御すること。
    - 作業時に生成されたデータはGitを通じてバージョン管理を行い、再現性を確保すること。
    deliverables:
    - 構築されたドキュメントコーパスファイル (JSONL形式)
    - 質問と正解が含まれたQAデータセット (JSON形式)
    - コーパス分割記録が収められたJupyter Notebookファイル
  assignment:
    title: ドメインベースのRAGデータセット完成
    deliverables:
    - 少なくとも100問のQAデータセットファイル
    - データセット統計分析レポート（質問の長さ、チャンクの長さなど）
    - データ分割過程が含まれたPythonコード
    rubric:
    - コーパス内の重複チャンク除去の完了状況
    - テストセットと開発セットのデータ漏洩の有無確認
    - 回答の根拠となるドキュメント区間 (Chunk ID) の正確なマッピング状況
  quiz:
  - question: RAGシステムにおいて「データ漏洩 (Data Leakage)」を防止する最善の方法は何ですか？
    choices:
    - すべてのドキュメントに対して同一の質問を生成する。
    - 開発セットと最終評価用テストセットを分離して管理する。
    - 学習データに検索対象ドキュメント全体を含める。
    - 評価セットを毎回新しく生成して管理する。
    answer_index: 1
    explanation: 評価セットが学習（または開発）過程で検索対象ドキュメントに露出すると公平な評価が不可能なため、評価用テストセットを厳格に分離しなければなりません。
  - question: コーパスキュレーション過程において「重複排除」が重要な理由は何ですか？
    choices:
    - LLMの生成速度を速めるため
    - ディスクの保存容量を節約するため
    - 検索結果の多様性を確保し、統計的な偏りを防止するため
    - ドキュメントの意味論的類似度を下げるため
    answer_index: 2
    explanation: 重複した情報は、検索エンジンが特定情報に偏って検索結果を返すように仕向け、定量的な評価指標を歪曲させる恐れがあります。
  completion_criteria:
  - 評価用ドキュメントコーパス（最低100個のチャンク以上）構築完了
  - 検証可能なQAデータセット（最低100問）作成完了
  - データセット分割ポリシー遵守の確認
  - 成果物に対するピアレビューまたは自己評価チェックリストの作成完了
  source_ids:
  - S2
- id: m3
  slug: eval-set-generation
  phase_id: p1
  title: 質問-正解評価セットの構築
  estimated_hours: 8.0
  prerequisites:
  - m2
  objectives:
  - RAGシステム評価のための高品質な質問-正解 (QA) 評価セットの必要性を理解する。
  - 合成データ生成手法 (Synthetic Data Generation) を活用して評価セットを構築する原理を把握する。
  - TrueTeacherのような手法を通じ、モデルが生成した回答の事実的一貫性を評価する論理を習得する。
  - 評価セットの品質を維持しながら、ドメインの変化に堅牢なデータセットを生成するプロセスを設計する。
  theory_markdown: '## RAG評価のための質問-回答(QA)評価セットの構築


    RAG(Retrieval-Augmented Generation)システムの性能を信頼性を持って測定するためには、精巧に設計された評価セットが不可欠です。単純に人間が作成した質問と回答にのみ依存する方式は、大規模評価を行う際にコストと拡張性の面で限界があります。


    ### 合成データ生成の重要性

    最新の研究であるTrueTeacher方法論によると、LLMを活用してモデルが生成した多様な回答を注釈処理することで、合成訓練データを生成できます [S5]。この方式には以下のような利点があります:

    1. **コスト効率**: 人間が直接作成した要約や回答に依存しないため、大規模データセット(例: 1.4M例)の生成が可能です [S5]。

    2. **多言語および拡張性**: 特定の言語に限定されず、ドメイン転換(Domain-shift)に対しても頑健性を示します [S5]。

    3. **事実的一貫性評価**: 合成データを通じて学習された小型モデルは、大型LLM教師モデルの知識を成功裏に蒸留(Distillation)し、効率的な事実性評価ツールとして活用できます
    [S5]。


    ### データセット構成戦略

    評価セットを構築する際は、単に質問-回答のペアを作ることを超えて、「検索結果が回答を導き出すために必要な根拠を含んでいるか？」と「モデルが該当する根拠を歪曲なく参照しているか？」を測定できるように構成しなければなりません。このために、データセット生成時に質問の複雑度、検索結果との関連性、回答の事実的一貫性を体系的にラベリング、または検証する必要があります。'
  worked_examples:
  - '例 1: 文書コーパスから核心的な節を抽出する。与えられた文書からLLMを使用して文脈上重要な事実文を抽出し、これに基づいて「回答可能な質問」と「誤った質問(Negative
    Sample)」を生成するパイプラインを構成する。'
  - '例 2: 事実性検証プロンプトの設計。生成された質問と検索された文書をもとに、LLMに対して「検索された文書に基づいて質問に回答し、回答が事実的に一貫しているかTrue/Falseで判断せよ」と指示し、評価用正解地(Ground
    Truth)を精緻化する過程。'
  lab:
    title: 合成評価セット生成実習
    steps:
    - 準備されたオープンライセンス文書コーパスをロードし、テキストチャンク単位に分割する。
    - LLM APIを使用して、各チャンクから抽出可能な固有の質問-回答ペアを 100件以上生成する。
    - 生成された質問に対して検索システムをシミュレーションし、上位k個の文書を検索する。
    - 検索された文書と生成された回答間の事実的一貫性を判断する評価パイプラインを構築する。
    - 結果データをJSONL形式で保存し、サンプル 30件を手動で検討してデータ品質を記録する。
    safety:
    - 評価セット構築過程で外部APIを使用する場合、コスト上限(API Key Limit)を必ず設定する。
    - 生成されたデータセット内に原本文書の機密情報や個人情報が含まれていないか、正規表現でフィルタリングする。
    - モデル評価結果のみを盲信せず、標本に対する手動照合を必ず併行する。
    deliverables:
    - 構築された 100問以上の質問-回答評価セット(JSONLファイル)
    - データセット生成および検証コードが含まれたJupyter Notebook
    - 人間による検討記録が含まれた品質分析レポート
  assignment:
    title: RAG信頼性評価セット回帰レポート
    deliverables:
    - 生成された評価セットの統計的分布(質問長、回答長、文書参照頻度など)を分析したダッシュボード
    - 二つ以上のRAG設定（例：検索アルゴリズムの変更、モデルの変更）を同一の評価セットで比較した成果物
    - エラー分類表(Hallucination、Contextual Irrelevanceなど)の作成および事例分析
    rubric:
    - 評価セットが文書コーパス全体のの内容を均等に反映しているか？
    - 合成データ生成パイプラインが再現可能な形式で作成されているか？
    - エラータイプの分類が具体的で定量的な根拠を備えているか？
    - 人間による検討を通じて、自動評価指標の妥当性を立証したか？
  quiz:
  - question: TrueTeacher方法論が従来の合成データ生成方式と差別化される点は何ですか？
    choices:
    - 人間が作成した要約に全面的に依存する。
    - モデルが生成した多様な要約を注釈処理して合成データを生成する。
    - 小型モデルのみを学習用の教師として使用する。
    - データセットを手動でのみ作成して精度を高める。
    answer_index: 1
    explanation: TrueTeacherは人間が作成した要約に依存せず、LLMを使用してモデルが生成した多様な要約を注釈処理することで合成データを生成します
      [S5]。
  - question: RAG評価セット構築時、モデルの自動評価のみで事実性を確定しない理由は何ですか？
    choices:
    - モデル自動評価が人間より非常に遅いためです。
    - モデル自動評価が完璧ではなく、幻覚(Hallucination)を完全に排除できないためです。
    - 人間評価にはコストがかからないためです。
    - 事実性評価にはモデルが不要であるためです。
    answer_index: 1
    explanation: 自動化された評価ツールは効率的ですが完璧ではないため、事実性検証のために必ず標本の手動検討と出典照合を併行する必要があります。
  completion_criteria:
  - 100問以上の質問-回答評価セットデータセット構築完了
  - データセット品質分析および人間による検討記録の提出
  - RAGパイプラインの性能評価のためのノートブック実装および結果レポート作成
  - CI/CD環境で再実行可能な形式の評価パッケージ構成
  source_ids:
  - S5
- id: m4
  slug: retrieval-metrics
  phase_id: p2
  title: 検索品質指標（Recall @k, MRR, nDCG）
  estimated_hours: 8.0
  prerequisites:
  - m3
  objectives:
  - 検索拡張生成(RAG)パイプラインにおいて検索段階の重要性を理解する。
  - Recall @k, MRR, nDCG指標の概念と、RAGシステム評価における意味を学習する。
  - 検索されたコンテキストの関連性が、その後の回答生成品質に与える影響を分析する。
  theory_markdown: '### RAG検索品質評価の重要性


    RAGシステムは、外部データベースから関連情報を検索し、それをLLMに伝えて回答を生成する [S3]。そのため、検索段階で関連性が高く集中したコンテキストを特定できなければ、いかに強力なLLMであっても正確な回答を生成することは困難である
    [S3]。検索品質を評価することは、RAGアーキテクチャの全体的な性能を改善するための第一歩である。


    ### 主要検索評価指標


    1. **Recall @k（再現率）**: 検索された上位k個の結果に、実際の正解が含まれているかを測定する。つまり、必要な情報が検索システムによって捕捉されたかを確認する指標である。

    2. **MRR（平均逆順位）**: ユーザーの質問に対する正解（関連文書）が、検索結果リストの何番目に位置しているかを測定する。最も最初の位置に関連文書が登場するほどMRR値は1に近づき、高いスコアとなる。

    3. **nDCG（正規化割引累積利得）**: 検索結果の順序を考慮する指標であり、関連性の高い文書が上部に位置するほど高いスコアを付与する。単純な包含有無（Recall）よりも、検索結果の「順位精度」をより精密に評価する。


    これらの指標は、参照データ（Ground Truth）がある場合、システム改善のために必須であり、Ragasのようなフレームワークは、これらの側面を定量的に分析できるツールを提供する
    [S3, S4]。'
  worked_examples:
  - '質問に対してシステムが[DocB, DocA, DocC]の順で返却し、正解関連文書がDocAである場合？ MRR計算: DocAは 2番目なのでReciprocal
    Rankは 1/2 = 0.5である。'
  - k=3のとき、上位 3個の検索結果に正解文書が含まれていればRecall @3 = 1、含まれていなければRecall @3 = 0である。
  lab:
    title: 検索品質指標の定量測定実習
    steps:
    - 評価セット(質問、正解文書)を使用して 50個のサンプルデータを用意する。
    - 検索モジュールを実行して、各質問に対する上位k(k=3, 5, 10)個の文書を返却してもらう。
    - Recall @k, MRR, nDCG関数をPythonで直接実装するか、ライブラリを使用して計算する。
    - 質問別指標結果をデータフレームに整理して可視化する。
    safety:
    - 個人情報や非公開文書が含まれたデータセットを外部APIに伝送しない。
    - 実験時にAPIコスト制限を設定し、キャッシュを活用してリクエスト数を最適化する。
    deliverables:
    - 各質問別のRecall @k, MRR, nDCG値が含まれた結果データフレームのCSV
    - 指標分布を示すヒストグラムおよびボックスプロット画像
  assignment:
    title: 検索機(Retriever)性能比較レポート
    deliverables:
    - 二つの検索設定（例：Sparse vs Dense Retrieval）を適用した評価結果レポート
    - 性能が低い上位 5個の質問に対する原因分析(誤検索タイプ分類)
    rubric:
    - Recall @k, MRR, nDCG指標を正確に計算したか？
    - 検索性能差を統計的に有意に解釈したか？
    - 失敗タイプを体系的に分類したか？
  quiz:
  - question: RAGシステムにおいて検索段階の品質が生成段階に与える影響は何ですか？
    choices:
    - 検索品質は生成品質と無関係である。
    - 関連性の低いコンテキストはLLMの幻覚を誘発するリスクを高める。
    - 検索段階はLLMの推論能力のみを評価する。
    - 検索結果が多いほど常に生成品質が良くなる。
    answer_index: 1
    explanation: 検索段階で関連性のない情報が伝達されると、LLMはこれに基づいて誤った回答を生成したり、幻覚を起こしたりすることがあります [S3]。
  - question: MRR指標が最も高いときはいつですか？
    choices:
    - 関連文書が常に最後に出るとき
    - 関連文書が常に最も上端(1位)に位置するとき
    - 検索結果が全くないとき
    - 関連文書が常に中間に出るとき
    answer_index: 1
    explanation: MRRは正解文書の順位逆数の平均なので、1位に位置するとき値が最大(1)になります。
  completion_criteria:
  - Recall @k, MRR, nDCG計算コードを完成させ、サンプルデータに適用した。
  - 二つの検索戦略を比較し、定量的な分析結果を導き出した。
  - 検索失敗タイプを少なくとも 3種類以上分類してレポートに記載した。
  source_ids:
  - S3
  - S4
- id: m5
  slug: generation-faithfulness
  phase_id: p2
  title: 根拠忠実度評価
  estimated_hours: 8.0
  prerequisites:
  - m4
  objectives:
  - 根拠忠実度(Faithfulness)の概念を理解し、RAGシステムにおける重要性を把握する。
  - Ragasフレームワークを活用し、生成された回答が検索されたコンテキスト(Context)に基づいているか定量的に評価する。
  - 自動化された評価指標を活用して幻覚(Hallucination)リスクを分析する。
  theory_markdown: '## 根拠忠実度 (Faithfulness) 評価


    RAG(Retrieval-Augmented Generation)システムの核心は、LLMが外部知識データベースから検索された情報を活用して回答を生成することである。根拠忠実度(Faithfulness)は、生成された回答が検索されたコンテキストに記述された情報のみを忠実に反映しているかを示す指標である
    [S3]。


    ### 1. なぜ根拠忠実度を評価するのか？

    LLMは事前学習された知識に基づいて回答しようとする傾向があり、検索されたコンテキストと無関係な情報を生成したり、コンテキストを歪曲したりすることがある。これを「幻覚(Hallucination)」と呼び、根拠忠実度評価を通じてこれを定量的に測定できる
    [S4]。


    ### 2. 評価フレームワーク: Ragas

    Ragasはユーザーによる注釈がない状況でも、参照なし(reference-free)で評価が可能なフレームワークを提案する [S3]。根拠忠実度評価過程は一般的に次の段階に従う:

    - **回答から陳述の抽出**: 回答から検証可能な事実的陳述を分離する。

    - **証拠の検索**: 各陳述が検索されたコンテキストのどの部分から導き出されたか確認する。

    - **検証**: 抽出された陳述がコンテキスト情報と一致するか判断する。


    RagasはLLMを評価者として使用し、この過程を自動化する [S4]。'
  worked_examples:
  - '例 1: コンテキスト「リンゴはビタミンCが豊富だ」と回答「リンゴはビタミンCが多く免疫力に良い」がある場合、「免疫力に良い」はコンテキストにない情報なので根拠忠実度スコアが低下する。'
  - '例 2: コンテキスト「当社の創立日は 2020年 5月 1日である」と回答「当社は 2020年 5月に設立された」という情報は一致するため、高い根拠忠実度スコアを持つ。'
  lab:
    title: Ragasを活用した生成回答の根拠忠実度測定
    steps:
    - 評価データセット(質問、検索されたコンテキスト、生成された回答)を準備する。
    - Ragasライブラリをインストールし、`Faithfulness`メトリックをインポートする。
    - 準備されたデータセットをRagasのデータ構造に変換する。
    - LLMベースの評価者を構成してデータセットの根拠忠実度スコアを算出する。
    - スコアが低い回答を標本抽出し、検索されたコンテキストとの差異を人間による検討で分析する。
    safety:
    - 非公開文書や個人情報が含まれたデータセットを外部LLM APIに伝送しない。
    - APIリクエスト数制限を確認し、キャッシュ(Cache)を使用してコストを制御する。
    - 人間による検討時、標本データのセキュリティを維持する。
    deliverables:
    - データセット全体の平均根拠忠実度スコアレポート
    - 低スコアを記録した回答の分析データセット
    - 自動評価結果と人間によるレビュー結果の比較分析
  assignment:
    title: RAGパイプライン信頼性評価レポート
    deliverables:
    - 根拠忠実度評価を含むJupyter Notebook
    - エラー分類およびハルシネーション発生頻度分析レポート
    rubric:
    - 根拠忠実度メトリクスが正しく実装されているか？
    - 生成された回答のハルシネーション事例を正確に分類したか？
    - 自動評価結果と人間によるレビューの定性的一貫性が確保されているか？
  quiz:
  - question: RAGシステムにおける「根拠忠実度（Faithfulness）」とは何か？
    choices:
    - 検索されたコンテキストが質問と関連性が高い程度
    - 生成された回答が、検索されたコンテキストの情報に基づいている程度
    - LLMが事前学習済みの知識を多く活用している程度
    - ユーザーの質問に回答が正確に一致する程度
    answer_index: 1
    explanation: 根拠忠実度は、生成された回答が外部から検索されたコンテキストの事実に依存しているかを評価する指標です。
  - question: Ragasフレームワークの特徴として正しいものは？
    choices:
    - 必ず人間による注釈（Ground Truth）がなければ評価できない。
    - 参照基盤のない（reference-free）評価方式をサポートする。
    - 検索効率のみを評価し、生成品質は評価しない。
    - LLMを評価者として活用せず、統計的な方式のみを使用する。
    answer_index: 1
    explanation: Ragasは参照基盤なしで評価可能なフレームワークを目指しており、LLMを評価者として積極的に活用します [S3, S4]。
  completion_criteria:
  - Ragasライブラリを使用して、生成された回答の根拠忠実度を定量的に測定できる。
  - 評価結果から、ハルシネーションの発生タイプを少なくとも 3 種類以上分類できる。
  - 自動化された評価パイプラインの結果と実際の回答の一貫性を検証できる。
  source_ids:
  - S3
  - S4
- id: m6
  slug: citation-accuracy
  phase_id: p2
  title: 引用の正確性および出典追跡
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - RAGシステムにおいて、回答が検索されたドキュメントの内容をどれだけ忠実に反映しているかを理解する。
  - 引用（Citation）の正確性の定義と測定方法を学習する。
  - Ragasフレームワークを活用し、回答の根拠忠実度（Faithfulness）と回答関連性（Answer Relevance）を定量評価する。
  - モデルの回答における出典追跡可能性を検証するプロセスを設計する。
  theory_markdown: '## RAGシステムの引用および根拠忠実度評価


    RAG（Retrieval Augmented Generation）システムは外部知識ベースを活用してLLMのハルシネーション（Hallucination）リスクを低減させますが、生成された回答が検索されたドキュメントを正確に引用しているかを検証するプロセスが必須です
    [S4]。


    ### 1. 主要評価指標

    * **根拠忠実度（Faithfulness）：** 生成された回答が提供された検索コンテキスト（Context）から導出されているかを測定します。回答のすべての主張が検索されたドキュメントに基づいていなければならず、外部知識やモデルの事前学習知識のみで回答する場合はスコアが低くなります
    [S4]。

    * **回答関連性（Answer Relevance）：** 回答が与えられた質問とどれだけ直接的に関連しているかを評価します。これは、検索された情報が十分であっても、回答が質問の意図から逸脱している場合を特定するために使用されます。


    ### 2. 引用正確性検証プロセス

    引用正確性は、回答の特定の文章が検索されたコンテキストのどこを引用したかを識別し、その原文の事実と一致しているかを確認するプロセスです。自動評価フレームワークであるRagasは、このプロセスを実行するために、参照データ（Ground
    Truth）がなくても根拠忠実度を評価できる指標を提供します [S4]。


    ### 3. 失敗タイプ分類

    - **引用漏れ：** 回答の事実関係が検索ドキュメントに存在するにもかかわらず、引用を表示していない。

    - **虚偽引用：** 検索ドキュメントにない内容を引用したかのように表示。

    - **事実歪曲：** 引用は正しく表示されているが、原文の意味を誤解釈して生成した。'
  worked_examples:
  - 例 1：根拠忠実度スコアの計算。質問「A社の 2025 年の売上は？」に対して回答「A社の 2025 年の売上は 100 億です。」が生成され、コンテキストドキュメントに「A社は
    2025 年に 100 億の売上を記録した。」が含まれている場合、回答のすべての情報がコンテキスト内に存在するため、根拠忠実度スコアは 1.0 （最大値）と評価されます。
  - 例 2：引用正確性のエラー識別。質問「A社の創立年は？」に対して回答「A社は 1990 年に創立されました（参照：ドキュメント 1）。」が生成されたが、ドキュメント
    1 に「A社は 1995 年創立」と明示されている場合、これは「事実歪曲」の失敗タイプに分類され、引用正確性が低いと判断します。
  lab:
    title: Ragasを活用した回答の根拠忠実度自動評価実習
    steps:
    - 評価するRAGシステムの検索結果（Context）と生成された回答（Answer）のデータセットを準備します。
    - Ragasフレームワークをインストールし、回答データセットを読み込みます。
    - Ragasの `Faithfulness` 指標を使用して、データセットの各質問と回答のペアに対してスコアを計算します。
    - 根拠忠実度が 0.7 未満の回答 30 件を別途抽出します。
    - 抽出されたサンプルを人間が直接確認し、「引用漏れ」、「虚偽引用」、「事実歪曲」のいずれかの失敗タイプをタグ付けします。
    safety:
    - 評価プロセスで使用されるドキュメントコーパスに個人情報や企業機密が含まれないよう、事前に非識別化処理を完了してください。
    - 外部API呼び出し時にはコスト上限を設定し、再現性のためにシード（Seed）値を固定することで、繰り返しのAPIコスト発生を防止してください。
    deliverables:
    - 評価結果が含まれるJupyter Notebookファイル（.ipynb）
    - 根拠忠実度スコア分布の可視化チャート
    - 人間によるレビュー記録を含む失敗タイプ分類テーブル
  assignment:
    title: RAGシステム信頼性回帰評価レポートの作成
    deliverables:
    - 二つ以上のRAG設定（例：検索Top-k値の変更）に基づく根拠忠実度の統計比較結果
    - サンプル 30 件に対する人間によるレビュー対照表
    - システムの引用正確性向上のための改善提案書
    rubric:
    - 評価指標の定量的算出方式が正確に明示されているか？
    - 検索ドキュメントと生成された回答間の引用関係が論理的に追跡可能か？
    - 失敗タイプの分類が人間によるレビューデータと一致し、妥当な根拠が提示されているか？
  quiz:
  - question: Ragasフレームワークの「根拠忠実度（Faithfulness）」指標に関する説明として正しいものは？
    choices:
    - 回答が質問と関連性があるかを評価する。
    - 回答のすべての情報が提供されたコンテキストドキュメント内に存在するかを測定する。
    - 回答が文法的にどれだけ正確かを評価する。
    - 回答が外部知識ベースのすべての情報を含んでいるかを測定する。
    answer_index: 1
    explanation: 根拠忠実度は、生成された回答の主張が検索されたコンテキストに基づいているかを測定する指標です。
  - question: 引用正確性の評価時、「事実歪曲」の失敗タイプに該当するのは？
    choices:
    - 検索ドキュメントにない内容を回答に含めた場合
    - 引用表示を漏らした場合
    - 引用は正しく表示されているが、原文の事実関係を誤解釈して記述した場合
    - 回答が質問の意図と完全に異なる場合
    answer_index: 2
    explanation: 事実歪曲は、ソースドキュメントを引用したにもかかわらず、原文の情報を間違った方法で要約または変形して生成してしまった場合を指します。
  completion_criteria:
  - Jupyter Notebookを通じた自動化された評価指標の算出完了
  - 少なくとも 30 件の回答サンプルに対する人間によるレビューおよび失敗タイプ分類記録の提出
  - 評価結果と改善策が含まれる最終レポートの作成
  source_ids:
  - S4
- id: m7
  slug: automated-eval-framework
  phase_id: p2
  title: 自動評価フレームワーク（Ragas）の適用
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - RAGパイプラインの主要な評価次元（検索および生成品質）を理解する。
  - Ragasフレームワークを使用して、参照なし（reference-free）でRAG性能を自動評価する方法を習得する。
  - 定量的なメトリクスを通じてハルシネーション（hallucination）リスクを分析および緩和する。
  theory_markdown: '## RAG評価の課題とRagas


    RAGシステムは検索モジュールとLLMベースの生成モジュールで構成されます [S3, S4]。このような構造を評価することは困難な作業です。なぜなら、検索システムが関連性の高いコンテキスト（context）をどれだけうまく識別できているか、LLMが提供されたコンテキストをどれだけ忠実に（faithfully）活用できているか、そして回答の品質はどうか、これらすべてを考慮しなければならないからです
    [S4]。


    従来の評価方法は、人間が直接正解（ground truth）を作成し比較する方式に依存していましたが、これはコストがかかり時間がかかるため、迅速な反復サイクルには不向きです
    [S3, S4]。


    ### Ragasフレームワーク

    Ragas（Retrieval Augmented Generation Assessment）は、正解データセットがなくてもRAGパイプラインを評価できるフレームワークです
    [S3, S4]。Ragasは以下の重要な次元を自動評価します：


    1. **検索品質（Retrieval Quality）：** 検索されたコンテキストが質問とどれだけ関連しているか（Context Relevance）、必要な情報をすべて含んでいるか（Context
    Recall）を測定します。

    2. **生成品質（Generation Quality）：** 生成された回答が検索されたコンテキストに基づいているか（Faithfulness）、質問とどれだけ関連しているか（Answer
    Relevance）を測定します。


    これらのメトリクスは、LLMを「評価者（judge）」として活用することで、参照なしでも評価を可能にし、RAG開発サイクルを短縮することに貢献します [S3,
    S4]。'
  worked_examples:
  - 事例 1：Context Relevanceの計算。RagasはLLMを使用して、検索されたコンテキスト（Context）から質問に回答するために実際に必要な文章を抽出し、全体のコンテキストに対する必要な文章の割合を通じてスコアを計算します。
  - 事例 2：Faithfulnessの評価。生成された回答の各主張が、検索されたコンテキストで支持されているかをLLMが判断します。支持されていない主張が多いほど、ハルシネーションスコアが高くなります。
  lab:
    title: Ragasを活用したRAG性能定量評価実習
    steps:
    - 評価データセット（質問、検索されたコンテキスト、生成された回答）を準備します。
    - Python環境で `ragas` ライブラリをインストールします。
    - 評価データセットを `ragas` のDatasetオブジェクトに変換します。
    - Ragasの `evaluate` 関数を呼び出し、Context RelevanceやFaithfulnessなどのメトリクスを計算します。
    - 結果を可視化し、スコアが低いクエリを分析します。
    safety:
    - 評価に使用するドキュメントコーパスに個人情報や非公開データが含まれていないかを確認します。
    - APIの使用コストを防ぐために、テスト時にはローカルモデルやキャッシュを積極的に活用します。
    - 自動評価結果は信頼性の補助指標であり、実際のモデルの品質確定は、人間によるサンプルレビューと交差検証を並行して行います。
    deliverables:
    - メトリクススコアが含まれる評価結果のデータフレーム
    - 低スコアを受けたクエリタイプの分析ログ
  assignment:
    title: RAGパイプライン性能比較レポート
    deliverables:
    - 検索設定（k値、埋め込みモデルなど）が異なる二つのRAGパイプラインのRagas評価結果
    - 二つの設定間の性能差分析報告書
    rubric:
    - Ragasメトリクス（Context Relevance, Faithfulnessなど）が正しく実装されているか？
    - 評価結果が定量的に比較され、論理的な解釈が含まれているか？
    - ハルシネーションタイプを少なくとも 3 件以上分類し、改善案を提示したか？
  quiz:
  - question: Ragasフレームワークの最大の利点は何ですか？
    choices:
    - 人間の正解データセットが必ず必要である
    - 参照なしで（reference-free）RAGパイプラインを評価できる
    - 検索段階のみを評価し、生成段階は評価しない
    - GPUが必ず 10 台以上必要である
    answer_index: 1
    explanation: Ragasは正解データセットなしでLLMを活用し、検索および生成品質を自動評価するフレームワークです [S3, S4]。
  - question: Ragasで測定する「Faithfulness」メトリクスの定義は何ですか？
    choices:
    - 検索されたコンテキストが質問とどれだけ関連しているか
    - 質問がドキュメントコーパス内に存在するか
    - 生成された回答が検索されたコンテキストに基づいているか
    - 質問者がLLMの回答をどれだけ信頼しているか
    answer_index: 2
    explanation: Faithfulnessは、生成された回答が提供された検索コンテキストにどれだけ忠実に基づいているか（ハルシネーション防止）を測定する指標です
      [S4]。
  completion_criteria:
  - Ragasライブラリを使用して、少なくとも10件のクエリに対して4種類以上のメトリクスを計算することに成功していること
  - 実習ノートブックがGitリポジトリに定期的にコミットされていること
  - 性能比較レポート内に、少なくとも3件のエラー分類事例が含まれていること
  source_ids:
  - S3
  - S4
- id: m8
  slug: error-analysis
  phase_id: p3
  title: 失敗タイプの分類およびエラー分析
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - RAGシステムで発生する失敗タイプを識別し、分類できる。
  - 検索（Retrieval）段階と生成（Generation）段階のエラーを区別して分析できる。
  - Ragasフレームワークの指標を活用し、自動評価と人間によるレビュー結果を紐付けられる。
  - エラー分析データに基づき、RAGパイプラインの性能改善案を導出できる。
  theory_markdown: '## RAGシステムの誤差分析概要


    RAG（Retrieval Augmented Generation）アーキテクチャは、検索モジュールとLLMベースの生成モジュールで構成されます [S3]。システム性能を評価する際は、これら二つの段階を分離して分析することが重要です。誤差は大きく分けて、検索段階での問題と生成段階での問題に分類されます。


    ### 1. 失敗類型分類

    - **検索失敗（Retrieval Failure）：** 関連性がない、または焦点が合っていない文脈（context）を検索した場合 [S3]。

    - **生成失敗（Generation Failure）：** LLMが提供された文脈を忠実に利用できなかったり（Faithfulness）、質問と関連のない回答を生成したりする場合
    [S3]。


    ### 2. 自動評価と人間による検討の補完

    Ragasのようなレファレンスフリー（Reference-free）フレームワークは、人間による注釈（ground truth）がなくても検索と生成の品質を評価できるようにします
    [S3]。しかし、自動化された評価指標だけでは、システムの微細なハルシネーション（幻覚）や複合的な論理エラーをすべて捕捉することは困難です。したがって、定量的自動指標を通じて優先順位の高い失敗標本を抽出し、それに対して必ず人間による検討（Human
    Review）を併行して実際の原因を把握する必要があります。'
  worked_examples:
  - 例1：質問「モデルAの発売日は？」に対し、検索機が「モデルBの仕様」文書を取得した場合。これは「検索の失敗」に分類され、埋め込みモデルの調整や検索クエリの最適化が解決策となり得ます。
  - 例2：質問「Xについて説明せよ」に対し、検索機がXに関する正確な文書を取得したものの、LLMが文書にない情報で回答した場合。これは「生成の失敗（忠実度の不足）」に分類され、プロンプトエンジニアリングを通じて「提供された文脈のみを使用せよ」という制約を強化する必要があります。
  lab:
    title: 失敗データセットの収集およびエラー分析
    steps:
    - 少なくとも50個の質問に対し、RAGシステムの回答と検索された文脈（context）を保存する。
    - 各項目について、検索の関連性（Context Precision）と生成の忠実度（Faithfulness）をRagasで測定する。
    - 指標が低い下位20%の質問と回答のペアを抽出する。
    - 抽出されたサンプルについて、「検索エラー」、「生成エラー」、「論理エラー」のいずれかに分類する表を作成する。
    safety:
    - 個人情報や非公開データは、評価コードに絶対に含めないこと。
    - 評価プロセスで使用されるAPI呼び出し回数とコストを監視し、予算を遵守すること。
    - データ分析時はローカル環境で作業を行い、情報漏洩を防止すること。
    deliverables:
    - 分類が完了したエラー分析のCSVファイル
    - 検索および生成品質指標が可視化されたJupyter Notebook
  assignment:
    title: RAGエラー分類および改善レポートの作成
    deliverables:
    - エラー分析結果が要約された2ページ分のレポート
    - 分類された失敗タイプ別の対応戦略（検索最適化またはプロンプト改善）の提案
    rubric:
    - 失敗タイプ分類の正確性と妥当性
    - 定量的指標と人間によるレビュー結果間の相関分析能力
    - 改善戦略の論理的な妥当性
  quiz:
  - question: RAGシステムにおいて、検索モジュールが関連性のない文脈を取得した際に発生する失敗は何ですか？
    choices:
    - 生成の失敗
    - 検索の失敗
    - データベース接続エラー
    - 認証失敗
    answer_index: 1
    explanation: 検索モジュールは質問に適した文書を特定する役割を担うため、関連性のない文脈を取得することは検索段階の失敗です [S3]。
  - question: Ragasフレームワークの最大の特徴は何ですか？
    choices:
    - 大規模な人間による注釈データが必須である。
    - リファレンスフリー（Reference-free）評価が可能である。
    - LLM生成品質の評価しかできない。
    - リアルタイムストリーミングシステムにのみ適用可能である。
    answer_index: 1
    explanation: Ragasは、正解（ground truth）なしでも検索および生成の品質を評価できるリファレンスフリーな評価フレームワークです
      [S3]。
  completion_criteria:
  - 失敗タイプが含まれたエラー分類表の提出
  - Ragas指標を活用した検索および生成品質の定量分析の完了
  - エラー分析に基づいたパイプライン改善提案書の作成およびレビュー
  source_ids:
  - S3
- id: m9
  slug: human-review-validation
  phase_id: p3
  title: サンプルに対する人間によるレビューおよび照合
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - 自動化されたRAG評価指標と実際の事実性との間のギャップを理解する。
  - モデルが生成した回答の根拠としての忠実度（Factual Consistency）を人間がレビューするプロトコルを設計する。
  - LLM評価の限界を把握し、TrueTeacherのような合成データ手法の意義を分析する [S5]。
  - エラータイプを体系的に分類し、信頼性データセットを管理する方法を習得する。
  theory_markdown: '## 自動評価の限界と人間によるレビューの必要性


    検索増強生成（RAG）システムの品質を評価する際、Ragasのようなツールは定量的な指標を迅速に提供しますが、モデルが生成した回答にある微妙な事実的エラーを完全に捉えるには限界があります。特に複雑な文脈において、LLMが知識の範囲内で推論しているのか、それとも学習データに依存してハルシネーション（Hallucination）を生成しているのかを判別することは困難です。


    ### 事実的一貫性の評価


    近年の研究では、自然言語推論（NLI）モデルや大規模言語モデル（LLM）を活用して、要約や回答の事実性を評価しています。しかし、従来の手法は人間が作成した要約データセットに依存しており、実際のモデル生成物の特性とは乖離が生じる可能性があります
    [S5]。TrueTeacherのようなアプローチは、LLMを活用してモデル生成データから事実性評価のための合成データを生成することで、このような限界を克服しようとしています
    [S5]。


    ### 人間によるレビュー（Human-in-the-Loop）の役割


    自動評価パイプラインがいかに高度化しても、最終的な信頼性検証には人間によるレビューが不可欠です。人間によるレビューは次の役割を担います：

    1. **自動評価指標の検証：** 特定の回答が「関連性あり」と評価されたものの、実際には事実ではない場合を特定する。

    2. **ハルシネーションタイプの分類：** システムの構造的欠陥（検索エラー対生成モデルエラー）を診断する。

    3. **回帰テストセットの補正：** 人間が検収したデータに基づき、評価セットの品質を継続的に改善する。'
  worked_examples:
  - 例1：自動評価指標（例：Faithfulness）が0.9と高く出たが、人間によるレビューの結果、検索文書にはない内容が含まれていた場合。分析：モデルが検索された情報ではなく、内部の重みに含まれる過去の情報を使用したハルシネーションとして分類し、これをシステムエラーログに記録する。
  - 例2：TrueTeacherモデルを使用し、システムが回答の事実性を自ら評価するように設計した場合。LLMが「真」と評価した回答の一部を人間がサンプル調査し、LLM評価器のエラー率（False
    Positive）を測定して評価レポートに明記する [S5]。
  lab:
    title: サンプルに対する人間によるレビューおよびエラー分析の実施
    steps:
    - 自動評価パイプライン（Ragasなど）を通じて、100件の回答に対するFaithfulnessスコアを算出する。
    - スコアが最も低い10件、中程度の10件、高い10件を無作為に抽出し、レビューセットを作成する。
    - 回答、検索文書（Context）、正解（Ground Truth）を照合し、「検索漏れ」、「情報歪曲」、「ハルシネーション発生」の有無を手動で記録する。
    - 記録された人間の判断と自動評価スコアを比較し、相関分析を行う。
    safety:
    - レビュー対象のデータセットに実際の個人情報や機密性の高い非公開文書が含まれていないことを必ず確認する。
    - レビューが完了したデータはローカルストレージに安全に保管し、検証されていない外部APIにはアップロードしない。
    deliverables:
    - 少なくとも30件の人間によるレビュー記録が含まれたエラー分類シート（CSV/Excel）
    - 自動指標と人間による評価の一致度を分析した要約レポート
  assignment:
    title: RAG信頼性分析レポートの作成
    deliverables:
    - 人間によるレビューを通じて分類された失敗タイプの頻度表
    - 現在のシステムの主要な脆弱性（検索段階または生成段階）に関する分析レポート
    - 今後の自動評価パイプライン改善に向けた提言
    rubric:
    - エラータイプが体系的に分類されているか？
    - 自動評価指標の限界を具体的な例とともに論理的に記述しているか？
    - 人間によるレビューデータが信頼性分析の根拠として適切に活用されているか？
  quiz:
  - question: 自動化された事実性評価指標のみでシステムの信頼性を確定することが困難な主な理由は何ですか？
    choices:
    - 自動評価指標が非常に高速であるため。
    - モデル生成データは人間が作成したデータとは異なる特徴を持ち、自動評価器自体が事実的エラーをすべて捉えきれない可能性があるため [S5]。
    - 人間によるレビューデータが常に自動評価指標より正確であるため。
    - データセットの規模が小さいため。
    answer_index: 1
    explanation: 既存の要約ベースの評価データセットは、モデルが生成する実際の成果物の複雑さを十分に反映しておらず、自動評価システムは特定の状況でハルシネーションを検知できないことがあります。
  - question: TrueTeacher方式が既存の要約データセット活用法と異なる点は何ですか？
    choices:
    - 人間が作成した要約文のみに依存する。
    - モデルが生成した多様な要約を活用し、事実性評価のための合成データを生成する [S5]。
    - NLIモデルを使用しない。
    - 多言語対応が不可能である。
    answer_index: 1
    explanation: TrueTeacherは人間が作成した要約に依存せず、LLMを使用してモデル生成された多様なデータを合成的に注釈付けし、学習データを生成します
      [S5]。
  completion_criteria:
  - 少なくとも30件のデータサンプルに対する人間によるレビューログが作成されていること。
  - 自動評価結果と人間によるレビュー結果間の比較分析が含まれたレポートが提出されていること。
  - エラー分類を通じて現在のシステムの脆弱性が明確に定義されていること。
  source_ids:
  - S5
- id: m10
  slug: regression-report
  phase_id: p3
  title: 再現可能な回帰評価レポーティング
  estimated_hours: 18.0
  prerequisites:
  - m9
  objectives:
  - RAGシステムの再現可能な回帰評価フレームワークを理解する。
  - Ragasフレームワークを使用して検索および生成の品質を定量的に測定する。
  - 回帰テストを通じて、モデルアップデートや検索アルゴリズムの変更がシステム信頼性に与える影響を分析する。
  - 人間によるレビューと自動化評価の調和を図った総合的なレポーティング手法を習得する。
  theory_markdown: '### RAGシステム評価の重要な次元

    RAGアーキテクチャの評価は多面的な作業です。検索システムが質問に関連性が高く、焦点の定まった文脈を特定する能力、LLMが特定された文脈を使用して忠実に回答を生成する能力、そして最終的な生成物の品質そのものが評価対象となります
    [S3, S4]。


    ### Ragasフレームワーク

    Ragas (Retrieval Augmented Generation Assessment) は、基準データ（Ground Truth）なしでもRAGパイプラインを評価できるフレームワークです
    [S3]。Ragasは検索品質 (Retrieval quality)、生成品質 (Generation quality)、そしてハルシネーション (Hallucination)
    防止能力を測定するための一連の指標を提供します [S3]。


    ### 回帰評価の重要性

    システムの信頼性を維持するためには、変更管理 (Change Management) が不可欠です。新しい埋め込みモデルの導入、検索アルゴリズムのチューニング、またはLLMの設定変更を行う際は、既存の評価データセットを対象に回帰テストを実施しなければなりません。回帰評価レポートは、システムの改善点が実際の信頼性向上につながったのか、それとも新たな欠陥を誘発したのかを統計的に立証する資料となります。'
  worked_examples:
  - 統計的比較例：二つのRAG設定（既存モデル対新規埋め込みモデル）に対して同一の100設問評価セットを実行し、Ragas指標（Faithfulness、Answer
    Relevance）の平均値と標準偏差を比較して、有意な性能向上を検証するノートブック分析事例。
