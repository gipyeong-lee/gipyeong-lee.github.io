- id: m4
  slug: retrieval-metrics
  phase_id: p2
  title: 檢索品質指標 (召回率@k, MRR, nDCG)
  estimated_hours: 8.0
  prerequisites:
  - m3
  objectives:
  - 理解檢索增強生成 (RAG) 管線中檢索階段的重要性。
  - 學習召回率@k、MRR、nDCG 指標的概念及其在 RAG 系統評估中的意義。
  - 分析檢索到的上下文相關性對後續答案生成品質的影響。
  theory_markdown: '### RAG 檢索品質評估的重要性


    RAG 系統會從外部資料庫檢索相關資訊，並將其傳遞給 LLM 以生成答案 [S3]。因此，如果檢索階段無法識別出高相關性且集中的上下文，即使 LLM 再強大，也很難生成準確的答案
    [S3]。評估檢索品質是改進 RAG 架構整體性能的第一步。


    ### 主要檢索評估指標


    1. **Recall@k (召回率)**：衡量在前 k 個檢索結果中是否包含實際的正確答案。換句話說，此指標用於確認所需的資訊是否已被檢索系統捕獲。

    2. **MRR (Mean Reciprocal Rank，平均倒數排名)**：衡量使用者問題的正確答案（相關文件）在檢索結果列表中的位置。相關文件越早出現在列表中的第一個位置，MRR
    值就越接近 1 並獲得高分。

    3. **nDCG (normalized Discounted Cumulative Gain，歸一化折損累積增益)**：考量檢索結果順序的指標，相關性高的文件若位於頂部位置，將獲得更高的分數。相較於單純的包含與否（召回率），此指標能更精確地評估檢索結果的「排名準確性」。


    這些指標在有參考數據（Ground Truth）的情況下對於系統改進至關重要，Ragas 等框架提供了能夠定量分析這些維度的工具 [S3, S4]。'
  worked_examples:
  - 對於問題，系統依序返回 [DocB, DocA, DocC]，若正確答案相關文件為 DocA，則 MRR 計算：DocA 為第 2 個，因此倒數排名為 1/2
    = 0.5。
  - 當 k=3 時，若前 3 個檢索結果包含正確答案文件，則 Recall@3 = 1；若不包含，則 Recall@3 = 0。
  lab:
    title: 檢索品質指標定量測量實作
    steps:
    - 使用評估集（問題、正確答案文件）準備 50 個樣本數據。
    - 執行檢索模組，接收每個問題的前 k (k=3, 5, 10) 個文件。
    - 使用 Python 直接實作 Recall@k、MRR、nDCG 函數，或使用函式庫計算。
    - 將各問題的指標結果整理成資料框並視覺化。
    safety:
    - 不將包含個人資訊或非公開文件的資料集傳輸到外部 API。
    - 實驗時設定 API 費用限制並利用快取優化請求數量。
    deliverables:
    - 包含各問題 Recall@k、MRR、nDCG 值的結果資料框 CSV
    - 顯示指標分佈的長條圖及箱形圖圖片
  assignment:
    title: 檢索器(Retriever)性能比較報告
    deliverables:
    - 應用兩種檢索設定（例如：Sparse vs Dense Retrieval）的評估結果報告
    - 對性能較低的上位 5 個問題進行原因分析（錯誤檢索類型分類）
    rubric:
    - 是否準確計算 Recall@k、MRR、nDCG 指標？
    - 是否對檢索性能差異進行了統計學上顯著的解釋？
    - 是否系統地分類了失敗類型？
  quiz:
  - question: RAG 系統中檢索階段的品質對生成階段有何影響？
    choices:
    - 檢索品質與生成品質無關。
    - 相關性低的上下文會增加 LLM 產生幻覺的風險。
    - 檢索階段僅評估 LLM 的推理能力。
    - 檢索結果越多，生成品質總是越好。
    answer_index: 1
    explanation: 檢索階段若傳遞不相關的資訊，LLM 可能會基於此生成錯誤的答案或產生幻覺 [S3]。
  - question: MRR 指標最高時為何時？
    choices:
    - 相關文件總是在最後出現時
    - 相關文件總是位於最頂端（第 1 位）時
    - 當沒有任何搜尋結果時
    - 當相關文件總是在中間出現時
    answer_index: 1
    explanation: MRR是正確文件排名倒數的平均值，因此當位於1上方時，其值達到最大(1)。
  completion_criteria:
  - 完成了Recall@k、MRR、nDCG的計算程式碼並應用於樣本資料。
  - 比較了兩種搜尋策略並得出了定量分析結果。
  - 分類了至少3種搜尋失敗類型並記載於報告中。
  source_ids:
  - S3
  - S4
- id: m5
  slug: generation-faithfulness
  phase_id: p2
  title: 證據忠實度評估
  estimated_hours: 8.0
  prerequisites:
  - m4
  objectives:
  - 理解證據忠實度(Faithfulness)的概念，並掌握其在RAG系統中的重要性。
  - 利用Ragas框架，定量評估生成的答案是否基於檢索到的上下文(Context)。
  - 利用自動化評估指標，分析幻覺(Hallucination)風險。
  theory_markdown: '## 證據忠實度 (Faithfulness) 評估


    RAG(Retrieval-Augmented Generation)系統的核心是LLM利用從外部知識資料庫中檢索到的資訊來生成答案。證據忠實度(Faithfulness)是指生成的答案是否忠實地反映了檢索到的上下文中所描述的資訊
    [S3]。


    ### 1. 為何評估證據忠實度？

    LLM傾向於根據預先學習的知識來回答，這可能會生成與檢索到的上下文無關的資訊，或扭曲上下文。這被稱為「幻覺(Hallucination)」，透過證據忠實度評估可以定量測量它
    [S4]。


    ### 2. 評估框架：Ragas

    Ragas提出了一個即使在沒有使用者註釋的情況下，也能在無參考基礎上(reference-free)進行評估的框架 [S3]。證據忠實度評估過程通常遵循以下步驟：

    - **從答案中提取陳述**：從答案中分離出可驗證的事實陳述。

    - **檢索證據**：確認每個陳述是從檢索到的上下文的哪個部分得出的。

    - **驗證**：判斷提取的陳述是否與上下文資訊一致。


    Ragas使用LLM作為評估者來自動化此過程 [S4]。'
  worked_examples:
  - 範例1：若上下文為「蘋果富含維生素C」，而答案為「蘋果富含維生素C，對免疫力有益」，則「對免疫力有益」是上下文中沒有的資訊，因此證據忠實度分數會降低。
  - 範例2：若上下文為「我們公司的創立日是2020年5月1日」，而答案為「本公司成立於2020年5月」，則資訊一致，因此具有較高的證據忠實度分數。
  lab:
    title: 利用Ragas測量生成答案的證據忠實度
    steps:
    - 準備評估資料集（問題、檢索到的上下文、生成的答案）。
    - 安裝Ragas庫並匯入`Faithfulness`指標。
    - 將準備好的資料集轉換為Ragas的資料結構。
    - 組態基於LLM的評估器，計算資料集的證據忠實度分數。
    - 抽樣分析低分答案，並透過人工審查分析其與檢索到的上下文的差異。
    safety:
    - 不將包含非公開文件或個人資訊的資料集傳輸到外部LLM API。
    - 確認API請求次數限制，並使用快取(Cache)來控制成本。
    - 在人工審查時保持樣本資料的安全性。
    deliverables:
    - 整個資料集的平均證據忠實度分數報告
    - 針對低分答案的分析資料集
    - 自動評估結果與人工審查結果的比較分析
  assignment:
    title: RAG管線可靠性評估報告
    deliverables:
    - 包含證據忠實度評估的Jupyter Notebook
    - 錯誤分類及幻覺發生頻率分析報告
    rubric:
    - 證據忠實度指標的實現是否正確？
    - 是否準確分類生成答案中的幻覺案例？
    - 是否確保了自動評估結果與人工審查的定性一致性？
  quiz:
  - question: 在 RAG 系統中，事實性（Faithfulness）是指什麼？
    choices:
    - 檢索到的上下文與問題的相關程度
    - 生成的答案基於檢索到的上下文資訊的程度
    - LLM 利用預訓練知識的程度
    - 答案與用戶問題準確匹配的程度
    answer_index: 1
    explanation: 事實性是評估生成答案是否依賴於從外部檢索到的上下文中的事實的指標。
  - question: Ragas 框架的特點是什麼？
    choices:
    - 評估必須有人工註釋（Ground Truth）才能進行。
    - 支援無參考（reference-free）的評估方法。
    - 只評估檢索效率，不評估生成品質。
    - 不使用 LLM 作為評估者，只使用統計方法。
    answer_index: 1
    explanation: Ragas 的目標是建立一個無需參考即可評估的框架，並積極利用 LLM 作為評估者 [S3, S4]。
  completion_criteria:
  - 能夠使用 Ragas 函式庫定量測量生成答案的事實性。
  - 在評估結果中，能夠分類至少 3 種幻覺發生類型。
  - 能夠驗證自動化評估管道的結果與實際答案的一致性。
  source_ids:
  - S3
  - S4
- id: m6
  slug: citation-accuracy
  phase_id: p2
  title: 引用準確性與來源追溯
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - 理解 RAG 系統中答案如何忠實地反映檢索到的文件內容。
  - 學習引用（Citation）準確性的定義和測量方式。
  - 利用 Ragas 框架定量評估答案的事實性（Faithfulness）和答案相關性（Answer Relevance）。
  - 設計一個驗證模型答案來源追溯性的流程。
  theory_markdown: '## RAG 系統的引用與事實性評估


    RAG（Retrieval Augmented Generation）系統利用外部知識庫來降低 LLM 的幻覺（Hallucination）風險，但驗證生成的答案是否準確引用了檢索到的文件是必不可少的過程
    [S4]。


    ### 1. 主要評估指標

    * **事實性 (Faithfulness):** 測量生成的答案是否源於提供的檢索上下文（Context）。答案的所有主張都應基於檢索到的文件，如果僅憑外部知識或模型的預訓練知識回答，則分數會較低
    [S4]。

    * **答案相關性 (Answer Relevance):** 評估答案與給定問題的直接相關程度。這用於識別即使檢索到的資訊足夠，答案卻與問題意圖不符的情況。


    ### 2. 引用準確性驗證流程

    引用準確性是識別答案中特定句子引用了檢索上下文中哪一部分，並確認其是否與原始文本的事實一致的過程。自動化評估框架 Ragas 提供指標，即使沒有參考數據（Ground
    Truth）也能評估事實性 [S4]。


    ### 3. 失敗類型分類

    - **引用缺失:** 答案的事實關係存在於檢索文件中，但未標示引用。

    - **虛假引用:** 標示引用了檢索文件中不存在的內容。

    - **事實扭曲:** 引用標示正確，但錯誤地解釋了原文的意義而生成。'
  worked_examples:
  - 範例 1：事實性分數計算。針對問題「A 公司 2025 年的銷售額是多少？」，生成了答案「A 公司 2025 年的銷售額是 100 億。」，並且上下文文件包含「A
    公司在 2025 年錄得 100 億銷售額。」。由於答案的所有資訊都存在於上下文中，因此事實性分數被評估為 1.0（最大值）。
  - '範例 2: 識別引用準確度錯誤。針對問題「A公司創立於何年？」，若產生回答「A公司創立於1990年（參見文件1）。」，但文件1中明確指出「A公司創立於1995年」，則此為「事實扭曲」失敗類型，並判斷其引用準確度較低。'
  lab:
    title: 使用 Ragas 自動評估答案忠實度實作
    steps:
    - 準備用於評估 RAG 系統的搜尋結果 (Context) 和生成的答案 (Answer) 資料集。
    - 安裝 Ragas 框架並載入答案資料集。
    - 使用 Ragas 的 `Faithfulness` 指標，計算資料集中每個問題-答案對的分數。
    - 單獨提取忠實度低於 0.7 的 30 個答案。
    - 人工審查提取的樣本，並標記為「引文遺漏」、「虛假引文」、「事實扭曲」中的相應失敗類型。
    safety:
    - 評估過程中使用的文件語料庫，請務必事先完成去識別化處理，以避免包含個人資訊或企業機密。
    - 呼叫外部 API 時，請設定費用上限，並固定種子 (Seed) 值以確保重現性，防止產生重複的 API 費用。
    deliverables:
    - 包含評估結果的 Jupyter Notebook 檔案 (.ipynb)
    - 忠實度分數分佈視覺化圖表
    - 包含人工審查記錄的失敗類型分類表
  assignment:
    title: RAG 系統可靠性回歸評估報告撰寫
    deliverables:
    - 兩種以上 RAG 設定（例如：搜尋 Top-k 值變更）的忠實度統計比較結果
    - 30 個樣本的人工審查對照表
    - 提高系統引文準確度的改進方案建議書
    rubric:
    - 評估指標的定量產出方式是否準確明確？
    - 搜尋文件與生成答案之間的引文關係是否具有邏輯可追溯性？
    - 失敗類型分類是否與人工審查資料一致，並提供合理的依據？
  quiz:
  - question: 關於 Ragas 框架的「忠實度 (Faithfulness)」指標，下列敘述何者正確？
    choices:
    - 評估答案是否與問題相關。
    - 衡量答案的所有資訊是否都存在於提供的上下文文件中。
    - 評估答案的語法準確性。
    - 衡量答案是否包含外部知識庫的所有資訊。
    answer_index: 1
    explanation: 忠實度是衡量生成的答案主張是否基於檢索到的上下文的指標。
  - question: 在引文準確度評估中，屬於「事實扭曲」失敗類型的情況為何？
    choices:
    - 在答案中包含了搜尋文件中沒有的內容
    - 遺漏了引文標記
    - 引文標記正確，但錯誤地解釋了原文的事實關係進行敘述
    - 答案完全偏離了問題的意圖
    answer_index: 2
    explanation: 事實扭曲是指即使引用了來源文件，卻以錯誤的方式摘要或修改原文資訊而生成的情況。
  completion_criteria:
  - 透過 Jupyter Notebook 完成自動化評估指標產出
  - 提交至少 30 個答案樣本的人工審查及失敗類型分類記錄
  - 撰寫包含評估結果和改進方案的最終報告
  source_ids:
  - S4
- id: m7
  slug: automated-eval-framework
  phase_id: p2
  title: 自動評估框架 (Ragas) 應用
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - 理解 RAG 管道的核心評估維度（檢索和生成質量）。
  - 學習使用 Ragas 框架進行無參考（reference-free）的 RAG 性能自動評估方法。
  - 通過定量指標分析並緩解幻覺（hallucination）風險。
  theory_markdown: '## RAG 評估的挑戰與 Ragas


    RAG 系統由檢索模塊和基於 LLM 的生成模塊組成 [S3, S4]。評估這種結構是一項具有挑戰性的任務，因為需要同時考量檢索系統識別相關上下文（context）的程度、LLM
    利用所提供上下文的忠實度（faithfulness），以及回答的質量 [S4]。


    傳統的評估方式依賴於人工編寫標準答案（ground truth）並進行比較，但這不僅成本高昂且耗時，不適合快速反覆運算週期 [S3, S4]。


    ### Ragas 框架

    Ragas（Retrieval Augmented Generation Assessment）是一個無需標準答案數據集即可評估 RAG 管道的框架 [S3,
    S4]。Ragas 會自動評估以下核心維度：


    1. **檢索質量（Retrieval Quality）：** 測量檢索到的上下文與問題的相關性（Context Relevance），以及是否包含所有必要信息（Context
    Recall）。

    2. **生成質量（Generation Quality）：** 測量生成的回答是否基於檢索到的上下文（Faithfulness），以及與問題的相關性（Answer
    Relevance）。


    這些指標利用 LLM 作為「評委（judge）」，實現了無需參考數據的評估，並有助於縮短 RAG 開發週期 [S3, S4]。'
  worked_examples:
  - 案例 1：Context Relevance 計算。Ragas 利用 LLM 從檢索到的上下文（Context）中提取回答問題實際所需的句子，並通過必要句子佔總上下文的比例來計算分數。
  - 案例 2：Faithfulness 評估。由 LLM 判斷生成回答中的每個主張是否得到檢索到的上下文支持。不被支持的主張越多，幻覺分數就越高。
  lab:
    title: 利用 Ragas 進行 RAG 性能定量評估實作
    steps:
    - 準備評估數據集（問題、檢索到的上下文、生成的回答）。
    - 在 Python 環境中安裝 `ragas` 庫。
    - 將評估數據集轉換為 `ragas` 的 Dataset 對象。
    - 調用 Ragas 的 `evaluate` 函數來計算 Context Relevance、Faithfulness 等指標。
    - 將結果視覺化並分析分數較低的查詢。
    safety:
    - 確認評估所用的文檔語料庫中不包含個人隱私或非公開數據。
    - 為避免 API 使用成本，測試時請積極使用本地模型或快取。
    - 自動評估結果僅為可靠性的輔助指標，實際模型品質確認應與人工抽樣審查及交叉驗證並行。
    deliverables:
    - 包含指標分數的評估結果資料框（Dataframe）
    - 低分查詢類型分析日誌
  assignment:
    title: RAG 管道性能比較報告
    deliverables:
    - 兩種具有不同檢索設置（k值、嵌入模型等）的 RAG 管道的 Ragas 評估結果
    - 兩種設置之間的性能差異分析報告
    rubric:
    - Ragas 指標（Context Relevance、Faithfulness 等）是否正確實現？
    - 評估結果是否進行了定量比較並包含了邏輯解釋？
    - 是否至少分類了 3 種以上的幻覺類型並提出了改進方案？
  quiz:
  - question: Ragas 框架最大的特徵是什麼？
    choices:
    - 必須要有人工標準答案數據集
    - 能夠無需參考(reference-free)即可評估 RAG 管道
    - 僅評估檢索階段，不評估生成階段
    - 必須至少需要 10 個 GPU
    answer_index: 1
    explanation: Ragas 是一個利用 LLM 在沒有標準答案資料集的情況下自動評估檢索和生成品質的框架 [S3, S4]。
  - question: Ragas 中測量的「Faithfulness」指標的定義是什麼？
    choices:
    - 檢索到的上下文與問題的相關程度為何？
    - 問題是否存在於文檔語料庫中？
    - 生成的答案是否基於檢索到的上下文？
    - 提問者對 LLM 的回答有多信任？
    answer_index: 2
    explanation: Faithfulness 是一項指標，用於衡量生成的答案在多大程度上忠實地基於提供的檢索上下文（防止幻覺）[S4]。
  completion_criteria:
  - 使用 Ragas 函式庫成功計算至少 10 個查詢的 4 種以上指標
  - 實踐筆記本定期提交到 Git 儲存庫
  - 效能比較報告包含至少 3 個錯誤分類案例
  source_ids:
  - S3
  - S4
- id: m8
  slug: error-analysis
  phase_id: p3
  title: 失敗類型分類與錯誤分析
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - 能夠識別和分類 RAG 系統中發生的失敗類型。
  - 能夠區分和分析檢索（Retrieval）階段和生成（Generation）階段的錯誤。
  - 能夠利用 Ragas 框架的指標連接自動評估和人工審查結果。
  - 能夠基於錯誤分析數據，為 RAG 管道的效能改進提出方案。
  theory_markdown: '## RAG 系統的錯誤分析概述


    RAG（Retrieval Augmented Generation）架構由檢索模組和基於 LLM 的生成模組組成 [S3]。評估系統效能時，重要的是要將這兩個階段分開分析。錯誤主要分為檢索階段的問題和生成階段的問題。


    ### 1. 失敗類型分類

    - **檢索失敗 (Retrieval Failure):** 檢索到不相關或不聚焦的上下文時 [S3]。

    - **生成失敗 (Generation Failure):** LLM 無法忠實利用提供的上下文（Faithfulness）或生成與問題無關的答案時 [S3]。


    ### 2. 自動評估與人工審查的互補

    像 Ragas 這樣的無參考（Reference-free）框架，無需人工註釋（ground truth）即可評估檢索和生成品質 [S3]。然而，僅憑自動評估指標，難以完全捕捉系統細微的幻覺（hallucination）或複雜的邏輯錯誤。因此，應通過量化自動指標提取優先級高的失敗樣本，並結合人工審查（Human
    Review）來確定實際原因。'
  worked_examples:
  - 範例 1：對於問題「模型 A 的發布日期是什麼？」檢索器檢索到「模型 B 的規格」文件。這被歸類為「檢索失敗」，解決方案可能是調整嵌入模型或優化檢索查詢。
  - 範例 2：對於問題「請解釋 X」，檢索器檢索到關於 X 的準確文件，但 LLM 回答了文件中沒有的資訊。這被歸類為「生成失敗（忠實度不足）」，必須透過提示工程（prompt
    engineering）來加強「僅使用提供的上下文」的約束。
  lab:
    title: 收集失敗數據集與錯誤分析
    steps:
    - 儲存 RAG 系統的答案和檢索到的上下文（context），針對至少 50 個問題。
    - 針對每個項目，使用 Ragas 測量檢索相關性（Context Precision）和生成忠實度（Faithfulness）。
    - 提取指標分數最低的 20% 問題-答案對。
    - 為提取的樣本創建分類表，劃分為「檢索錯誤」、「生成錯誤」或「邏輯錯誤」之一。
    safety:
    - 絕不將個人資訊或私有數據包含在評估程式碼中。
    - 監控評估過程中使用的 API 呼叫次數和費用，以符合預算。
    - 在本地環境中執行資料分析，以防止資訊洩露。
    deliverables:
    - 已完成分類的錯誤分析 CSV 檔案
    - 搜尋和生成品質指標可視化的 Jupyter Notebook
  assignment:
    title: RAG 錯誤分類與改進報告撰寫
    deliverables:
    - 錯誤分析結果摘要的 2 頁報告
    - 針對分類的失敗類型提出應對策略（搜尋優化或提示改進）建議
    rubric:
    - 失敗類型分類的準確性和合理性
    - 定量指標與人工審查結果之間的相關性分析能力
    - 改進策略的邏輯合理性
  quiz:
  - question: 在 RAG 系統中，當搜尋模組檢索到不相關的上下文時，會發生哪種失敗？
    choices:
    - 生成失敗
    - 搜尋失敗
    - 資料庫連接錯誤
    - 認證失敗
    answer_index: 1
    explanation: 搜尋模組負責識別與問題相關的文件，因此檢索到不相關的上下文是搜尋階段的失敗 [S3]。
  - question: Ragas 框架的最大特點是什麼？
    choices:
    - 必須需要大量的人類註釋資料。
    - 可以進行無參考（Reference-free）評估。
    - 只能評估 LLM 生成品質。
    - 只能應用於即時串流系統。
    answer_index: 1
    explanation: Ragas 是一個無參考評估框架，即使沒有真實數據（ground truth），也能評估搜尋和生成品質 [S3]。
  completion_criteria:
  - 提交包含失敗類型的錯誤分類表
  - 完成使用 Ragas 指標進行搜尋和生成品質的定量分析
  - 撰寫並審查基於錯誤分析的管道改進建議書
  source_ids:
  - S3
- id: m9
  slug: human-review-validation
  phase_id: p3
  title: 樣本人工審查與對照
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - 了解自動化 RAG 評估指標與實際事實性之間的差距。
  - 設計人工審查模型生成答案的事實一致性 (Factual Consistency) 的協議。
  - 了解 LLM 評估的局限性，並分析 TrueTeacher 等合成資料方法的意義 [S5]。
  - 學習如何系統地分類錯誤類型並管理可靠性資料集。
  theory_markdown: '## 自動化評估的局限與人工審核的必要性


    評估檢索增強生成 (RAG) 系統的品質時，像 Ragas 這樣的工具雖然能快速提供量化指標，但在完美捕捉模型生成回答中細微的事實錯誤方面仍有局限。特別是在複雜的語境中，很難區分
    LLM 是在知識範圍內進行推論，還是依賴已學習的數據產生幻覺 (Hallucination)。


    ### 事實一致性評估


    近期的研究利用自然語言推論 (NLI) 模型或大型語言模型 (LLM) 來評估摘要或回答的事實性。然而，傳統方法依賴人類撰寫的摘要數據集，這可能與實際模型生成結果的特性產生差異
    [S5]。像 TrueTeacher 這樣的途徑，試圖透過利用 LLM 從模型生成的數據中產出合成的事實性評估數據，藉此克服上述限制 [S5]。


    ### 人工審核 (Human-in-the-Loop) 的角色


    無論自動評估管線進化到何種程度，最終的可靠性驗證仍需人工審核。人工審核執行以下角色：

    1. **自動評估指標的驗證：** 識別特定回答雖被評估為「相關」但實際上並非事實的情況。

    2. **幻覺類型分類：** 診斷系統的結構性缺陷（檢索錯誤 vs. 生成模型錯誤）。

    3. **回歸測試集的校準：** 根據人類審核過的數據，持續改善評估集的品質。'
  worked_examples:
  - 範例 1：自動評估指標 (例如：Faithfulness) 顯示 0.9 為高分，但人工審核結果發現包含檢索文件中未提及的內容。分析：將其分類為模型未使用檢索到的資訊，而是使用了內部權重中包含的過往資訊所產生的幻覺，並將此記錄於系統錯誤日誌中。
  - 範例 2：設計由系統使用 TrueTeacher 模型自行評估回答事實性的情況。由人工抽樣調查 LLM 評估為「真」的回答中之部分內容，以測量 LLM 評估器的錯誤率
    (False Positive)，並將其標示於評估報告中 [S5]。
  lab:
    title: 執行抽樣人工審核及錯誤分析
    steps:
    - 透過自動評估管線 (Ragas 等) 推導出 100 件回答的 Faithfulness 分數。
    - 隨機抽取分數最低的 10 件、中間水準的 10 件及分數最高的 10 件，建立審核集。
    - 比對回答、檢索文件 (Context) 與正確答案 (Ground Truth)，手動記錄是否存在「檢索遺漏」、「資訊扭曲」或「生成幻覺」。
    - 比較記錄到的人工判斷與自動評估分數，執行相關性分析。
    safety:
    - 務必確認審核對象數據集未包含實際個人資訊或敏感的非公開文件。
    - 審核完成的數據須安全地存放在本地儲存空間，不得上傳至未經驗證的外部 API。
    deliverables:
    - 包含至少 30 件人工審核紀錄的錯誤分類表 (CSV/Excel)
    - 分析自動指標與人工評估之間一致性的摘要報告
  assignment:
    title: 撰寫 RAG 可靠性分析報告
    deliverables:
    - 透過人工審核分類出的失敗類型頻率表
    - 關於目前系統主要弱點（檢索階段或生成階段）的分析報告
    - 針對未來自動評估管線改善的建議
    rubric:
    - 錯誤類型是否已系統性分類？
    - 是否結合具體範例，合乎邏輯地論述了自動評估指標的局限性？
    - 人工審核數據是否適當地作為可靠性分析的依據被運用？
  quiz:
  - question: 僅憑自動化事實性評估指標難以確認系統可靠性的主要原因為何？
    choices:
    - 因為自動評估指標非常快速。
    - 因為模型生成的數據具有與人類撰寫數據不同的特徵，且自動評估器本身可能無法捕獲所有事實錯誤 [S5]。
    - 因為人工審核數據總是比自動評估指標更精準。
    - 因為數據集的規模很小。
    answer_index: 1
    explanation: 現有的摘要基礎評估數據集無法充分反映模型生成實際結果的複雜性，自動評估系統在特定情況下可能無法檢測出幻覺。
  - question: TrueTeacher 方法與現有摘要數據集的使用方式有何不同？
    choices:
    - 僅依賴人類編寫的摘要。
    - 利用模型生成的各種摘要來生成用於事實性評估的合成數據 [S5]。
    - 不使用 NLI 模型。
    - 無法支援多語言。
    answer_index: 1
    explanation: TrueTeacher 不依賴人類編寫的摘要，而是使用 LLM 對模型生成的各種數據進行合成註釋，從而生成訓練數據 [S5]。
  completion_criteria:
  - 必須編寫至少 30 個數據樣本的人類審查日誌。
  - 必須提交包含自動評估結果與人類審查結果對比分析的報告。
  - 必須通過錯誤分類明確定義當前系統的弱點。
  source_ids:
  - S5
- id: m10
  slug: regression-report
  phase_id: p3
  title: 可重現的迴歸評估報告
  estimated_hours: 18.0
  prerequisites:
  - m9
  objectives:
  - 理解 RAG 系統的可重現迴歸評估框架。
  - 使用 Ragas 框架定量測量檢索與生成的品質。
  - 透過迴歸測試分析模型更新或檢索算法變更對系統可靠性的影響。
  - 習得結合人類審查與自動化評估的綜合報告方式。
  theory_markdown: '### RAG 系統評估的核心維度

    評估 RAG 架構是一項多面性的任務。檢索系統識別與問題高度相關且聚焦之上下文的能力、LLM 使用所識別上下文忠實生成答案的能力，以及最終生成物本身的品質，均為評估對象
    [S3, S4]。


    ### Ragas 框架

    Ragas (Retrieval Augmented Generation Assessment) 是一個無需標準數據 (Ground Truth) 即可評估
    RAG 管道的框架 [S3]。Ragas 提供了一系列指標，用於測量檢索品質 (Retrieval quality)、生成品質 (Generation quality)
    以及防範幻覺 (Hallucination) 的能力 [S3]。


    ### 迴歸評估的重要性

    為了維持系統可靠性，變更管理 (Change Management) 至關重要。在引入新的嵌入模型、調整檢索算法或更改 LLM 設定時，必須針對現有的評估數據集執行迴歸測試。迴歸評估報告是統計證明系統改進是否真正帶來可靠性提升，還是誘發了新缺陷的依據文件。'
  worked_examples:
  - 統計對比範例：針對兩種 RAG 設定（現有 vs 新型嵌入模型）執行相同的 100 個問題評估集，並比較 Ragas 指標（Faithfulness, Answer
    Relevance）的平均值與標準差，以驗證顯著性能提升的筆記本分析案例。
  - 錯誤類型分類範例：對系統「答案相關性」得分較低的 30 個案例進行採樣，並手動分類其為檢索階段失敗（未檢索到相關文檔）還是生成階段失敗（忽略上下文），並將其記錄在管道日誌中的方法。
  lab:
    title: RAG 管道迴歸測試自動化
    steps:
    - 準備用於最終驗證的評估數據集（100 個問題），格式為 JSON。
    - 定義兩種不同的 RAG 管道設定（版本 A、版本 B）。
    - 使用 Ragas 框架對每個管道執行自動評估並儲存結果。
    - 使用 Pandas 將兩個結果集的指標分佈視覺化並計算統計差異。
    - 針對評估分數急劇下降的後 10% 案例，對照其參考上下文與模型響應。
    safety:
    - 務必確認評估數據集中未包含個人資訊或公司機密文件。
    - 呼叫外部 API 時設定費用上限，並在本地環境測試時使用快取，以防止盲目的請求。
    - 切勿盲目迷信模型評估結果，必須同步進行人類審核(Human-in-the-loop)以檢查樣本。
    deliverables:
    - 包含回歸評估執行結果的 Jupyter Notebook
    - 兩組 RAG 設定間的性能比較視覺化圖表（箱線圖或散點圖）
    - 包含錯誤類型分類與人類審核記錄的最終報告
  assignment:
    title: 撰寫 RAG 可靠性改進報告
    deliverables:
    - 包含系統可靠性指標的技術報告 PDF
    - 用於建構可重現 CI 環境的設定檔 (e.g., pipeline.yaml)
    - 針對評估數據集的回歸測試腳本
    rubric:
    - 是否定量測量了檢索與生成的品質指標？
    - 回歸測試方法論是否已說明且具備可重現性？
    - 自動評估結果與人類審核結果之間的分析是否恰當？
    - 是否明確提出了性能變化的原因與未來改進方向？
  quiz:
  - question: Ragas 框架最大的特色為何？
    choices:
    - 評估必須要有人類編寫的標準答案數據集 (Ground Truth)。
    - 即便沒有基準數據，也能評估 RAG 管道品質的框架。
    - 僅測量 LLM 生成物的品質，不測量檢索品質。
    - 為了評估，必須重新訓練學習模型。
    answer_index: 1
    explanation: Ragas 是為了解決在沒有基準數據的情況下評估 RAG 管道所設計的框架 [S3, S4]。
  - question: 在 RAG 系統中執行回歸測試的主要目的為何？
    choices:
    - 為了美化系統設計
    - 為了在物理上改善伺服器的回應速度
    - 為了分析系統變更（演算法、數據等）對既有可靠性的影響並防止缺陷
    - 為了自動收集使用者的個人隱私資訊
    answer_index: 2
