modules:
- id: m1
  slug: intro-rag-architecture
  phase_id: p1
  title: 理解 RAG 架構
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - 理解 RAG (Retrieval-Augmented Generation) 架構的核心組成部分。
  - 識別大型語言模型 (LLM) 的知識限制以及基於檢索增強的必要性。
  - 能夠解釋檢索-生成管道的結構流程。
  theory_markdown: '## RAG (Retrieval-Augmented Generation) 架構概述


    最新自然語言處理 (NLP) 和深度學習模型透過學習海量文本數據展現卓越性能，但對於模型訓練時未包含的最新資訊或特定領域的非公開數據，則會出現幻覺 (hallucination)
    或不了解資訊的限制 [S1]。


    ### 透過檢索克服 LLM 的限制

    RAG 是一種方法，它不是讓模型將所有知識記憶在參數 (parameter) 內部，而是在「適當的時機 (just-in-time)」檢索與問題相關的外部可信文件，並將其作為生成階段的輸入
    [S2]。


    ### 核心組成部分

    1. **檢索器 (Retriever)**：接收使用者的查詢 (query)，並從向量資料庫等中識別出相關性高的文件片段 (chunk)。

    2. **增強 (Augmentation)**：將檢索到的文件與原始問題組合，建構要傳遞給 LLM 的提示 (prompt)。

    3. **生成器 (Generator)**：基於增強的資訊生成事實基礎的響應。


    這種結構有助於保持模型的知識更新，並使生成答案的依據可追溯，從而確保可靠性。'
  worked_examples:
  - '案例 1: 傳統 LLM 方式 - 當詢問「告訴我今天的新聞」時，模型可能無法識別訓練數據之後的事件，從而有產生錯誤資訊的風險。'
  - '案例 2: RAG 方式 - 當詢問「告訴我今天的新聞」時，1) 檢索器 (Retriever) 透過外部搜尋引擎或即時新聞 API 收集相關報導，2)
    並將其作為上下文 (context) 包含在內傳遞給 LLM，從而生成準確的最新資訊回應。'
  lab:
    title: RAG 架構流程視覺化與分析
    steps:
    - 打開 Jupyter Notebook 並繪製 RAG 基本管道的 3 階段（輸入、檢索、生成）結構圖。
    - 從開放授權文件語料庫中提取 5 個短文本，建立資料集樣本。
    - 編寫一個簡單的關鍵字匹配檢索器 (Retriever) 函數，使其返回符合問題的文件。
    - 編寫程式碼實現增強階段，將檢索到的文件注入提示模板。
    safety:
    - 絕不將實際個人資訊或機密文件用作語料庫數據。
    - 使用API時，請檢查呼叫次數限制（Rate Limit），並在測試程式碼中設定種子（seed）值以確保再現性。
    deliverables:
    - RAG 架構圖（包含在 Notebook 單元格內）
    - 簡易關鍵字搜尋器實作程式碼
    - 文件注入型提示生成結果
  assignment:
    title: RAG 資訊檢索管道分析報告
    deliverables:
    - 說明所實作 RAG 管道運作原理的 Notebook
    - 說明搜尋器判斷文件相關性時可能發生的潛在失敗案例 3種
    rubric:
    - RAG 的 3個階段（檢索、增強、生成）是否被準確區分並說明？
    - 在檢索階段，關於檢索到不相關文件的可能性分析是否合理？
    - 是否遵循非公開數據安全指南進行實作？
  quiz:
  - question: RAG 相較於 LLM 學習方式的主要優點是什麼？
    choices:
    - 可以減少 LLM 的參數大小。
    - 可以讓模型的知識保持最新狀態並提供依據。
    - 加速模型的學習速度。
    - 對所有問題生成 100% 事實的答案。
    answer_index: 1
    explanation: RAG 透過參考外部文件，能夠反映最新資訊，並且可以從文件中找到生成答案的依據，因此可靠性較高。
  - question: 檢索器 (Retriever) 的正確角色是什麼？
    choices:
    - 負責生成答案。
    - 負責重新訓練學習數據。
    - 檢索與問題相關的外部文件片段。
    - 管理使用者介面。
    answer_index: 2
    explanation: 檢索器負責從外部數據源中查找與使用者問題語義相似或相關性高的文件。
  completion_criteria:
  - 能夠說明 RAG 架構的組成要素。
  - 確認實作的 RAG 管道程式碼正常運作，能夠檢索和增強相關文件。
  - 在分析報告中說明 RAG 管道的局限性與改進方向。
  source_ids:
  - S1
  - S2
- id: m2
  slug: corpus-curation
  phase_id: p1
  title: 評估用文件語料庫策展
  estimated_hours: 8.0
  prerequisites:
  - m1
  objectives:
  - 理解 RAG 評估固定文件語料庫的重要性。
  - 學習評估用文件數據的品質決定因素（準確性、多樣性、重複資料移除）。
  - 掌握用於定量評估的文件-問題-答案配對（QA Pair）數據集建構策略。
  - 學習防止數據洩漏（Data Leakage）的訓練/評估分割方法。
  theory_markdown: '## 用於 RAG 評估的語料庫策劃


    大型語言模型 (LLM) 在依賴其學習參數內的知識時存在幻覺的風險。檢索增強生成 (RAG) 透過允許模型即時存取外部知識來克服這些限制 [S2]。為了定量評估有效的
    RAG 系統的可靠性，**固定且可控的評估文件語料庫 (Fixed Evaluation Corpus)** 至關重要。


    ### 1. 語料庫品質決定因素

    - **準確性 (Factuality)：** 文件中的資訊必須是最新的且真實的。包含錯誤資訊的語料庫會導致生成錯誤的答案。

    - **領域適用性：** 應包含與要評估的實際服務環境相似的主題和詞彙。

    - **重複資料刪除 (De-duplication)：** 如果相同資訊在多個文件中重複，會損害檢索結果的多樣性，並可能對評估統計數據造成偏差。


    ### 2. 構建 QA 評估資料集

    僅憑文件語料庫無法進行評估。必須構建「文件-問題-答案」對，以測量檢索器是否檢索相關文件，以及生成器是否基於這些文件提供準確的答案。

    - **問題生成：** 使用 LLM 自動從文件中生成問題，或由領域專家直接撰寫。

    - **答案定義：** 必須明確指定作為答案依據的文件區段 (Chunk)。


    ### 3. 資料分割與完整性

    為了評估集的可靠性，必須嚴格分割**開發用 (Development Set)** 和**最終評估用 (Hold-out Test Set)**。必須防止評估集中包含的問題直接包含在檢索目標文件中而導致的「資料洩漏」現象。'
  worked_examples:
  - 範例 1：文件分塊 (Chunking) 策略。撰寫 Python 腳本的方法，以段落或語義單位分割文本，以避免在固定大小分割時上下文中斷。
  - '範例 2：問題-答案資料結構。''{ ''question'': ''...'', ''ground_truth'': ''...'', ''context_chunk_id'':
    ''...'' }'' 格式的 JSON 物件生成範例。'
  lab:
    title: 評估語料庫建置實作
    steps:
    - 取得要評估領域的開放授權文字檔 (.txt)。
    - 使用 Python 編寫一個腳本，用於讀取文字檔並將其分塊。
    - 為每個塊分配一個唯一識別碼 (ID)，並記錄元數據 (標題、來源)。
    - 從所編寫的塊中生成問題，並記錄作為答案依據的塊 ID，以構成 50 個 QA 對。
    - 將整個語料庫以 8:2 的比例分割成開發集和測試集，並儲存。
    safety:
    - 評估語料庫中不應包含個人資訊的文件。
    - 使用外部 API 時，設定請求數量上限以控制成本。
    - 工作時產生的資料透過 Git 進行版本管理，以確保可重現性。
    deliverables:
    - 已建置的文件語料庫檔案 (JSONL 格式)
    - 包含問題和正確答案的 QA 資料集 (JSON 格式)
    - 包含語料庫分割記錄的 Jupyter Notebook 檔案
  assignment:
    title: 完成基於領域的 RAG 資料集
    deliverables:
    - 至少 100 個問題的 QA 資料集檔案
    - 資料集統計分析報告 (問題長度、塊長度等)
    - 包含資料分割過程的 Python 程式碼
    rubric:
    - 語料庫中重複塊的去除完成情況
    - 測試集和開發集的資料洩漏檢查
    - 答案依據的文件區段 (Chunk ID) 的準確映射情況
  quiz:
  - question: 在 RAG 系統中，防止「資料洩漏 (Data Leakage)」的最佳方法是什麼？
    choices:
    - 對所有文件生成相同的問題。
    - 分離管理開發集和最終評估用測試集。
    - 將整個檢索目標文件包含在訓練資料中。
    - 每次都重新生成評估集進行管理。
    answer_index: 1
    explanation: 評估集若在學習（或開發）過程中暴露於搜尋文件，則無法進行公正評估，因此必須嚴格區分用於評估的測試集。
  - question: 在語料庫策劃過程中，「去除重複」為何重要？
    choices:
    - 為了提高 LLM 的生成速度
    - 為了節省磁碟儲存空間
    - 為了確保搜尋結果的多樣性並防止統計偏差
    - 為了降低文件的語義相似度
    answer_index: 2
    explanation: 重複資訊會導致搜尋引擎將搜尋結果傾向於特定資訊，並可能扭曲量化評估指標。
  completion_criteria:
  - 建立評估用文件語料庫（至少 100 個 chunk）完成
  - 生成可驗證的 QA 資料集（至少 100 個問題）完成
  - 確認遵守資料集分割政策
  - 完成關於結果的同行審查或自我評估檢查清單
  source_ids:
  - S2
- id: m3
  slug: eval-set-generation
  phase_id: p1
  title: 建立問題-答案評估集
  estimated_hours: 8.0
  prerequisites:
  - m2
  objectives:
  - 理解為 RAG 系統評估建立高品質問題-答案（QA）評估集的必要性。
  - 掌握利用合成資料生成技術（Synthetic Data Generation）建立評估集的原理。
  - 學習透過 TrueTeacher 等方法論評估模型生成答案的事實一致性之邏輯。
  - 設計一個能在保持評估集品質的同時，生成對領域變更具備穩健性的資料集之流程。
  theory_markdown: "## 為 RAG 評估建立問題-答案（QA）評估集\n\n為了可靠地衡量 RAG（檢索增強生成）系統的效能，精心設計的評估集是必不可少的。僅依賴人類編寫的問題和答案，在大規模評估時，在成本和可擴展性方面存在局限。\
    \ \n\n### 合成資料生成的必要性\n根據最新的研究，TrueTeacher 方法論指出，可以利用 LLM 來生成模型產生的各種答案，並進行註釋以創建合成訓練資料\
    \ [S5]。此方法具有以下優點：\n1. **成本效益**: 無需依賴人類直接編寫的摘要或答案，即可生成大規模資料集（例如：1.4M 範例）[S5]。\n\
    2. **多語言與可擴展性**: 不限於特定語言，並且對領域轉換（Domain-shift）表現出穩健性 [S5]。\n3. **事實一致性評估**: 通過合成資料訓練的小型模型，可以成功地將大型\
    \ LLM 教師模型的知識進行蒸餾（Distillation），並用作高效的事實性評估工具 [S5]。\n\n### 資料集構成策略\n在建立評估集時，不應僅僅創建問題-答案對，還應構建能夠衡量「檢索結果是否包含推導答案所需的依據？」以及「模型是否無偏差地引用了這些依據？」的評估集。為此，在生成資料集時，必須系統地標記或驗證問題的複雜度、與檢索結果的相關性以及答案的事實一致性。"
  worked_examples:
  - 範例 1：從文件語料庫中提取關鍵片段。構成一個管線，該管線使用 LLM 從給定文件中提取語境上重要的事實句子，並以此為基礎生成「可回答的問題」和「虛假問題（Negative
    Sample）」。
  - 範例 2：事實性驗證提示設計。一個精煉評估用真實值（Ground Truth）的過程，該過程指示 LLM 根據檢索到的文件回答問題，並判斷答案是否在事實上一致（True/False），此判斷基於生成的問題和檢索到的文件。
  lab:
    title: 合成評估集生成實踐
    steps:
    - 載入準備好的開放授權文件語料庫，並將其分割為文字區塊。
    - 使用 LLM API 為每個區塊生成至少 100 組獨特的問答對。
    - 針對生成的問句，模擬搜尋系統以檢索前 k 個文件。
    - 建立一個評估管線，用於判斷檢索到的文件與生成的答案之間的事實一致性。
    - 將結果數據以 JSONL 格式儲存，並手動審查樣本 30 件以記錄數據品質。
    safety:
    - 在建立評估集過程中，使用外部 API 時必須設定費用上限（API Key Limit）。
    - 利用正規表達式過濾生成的數據集中是否包含原始文件的敏感資訊或個人資訊。
    - 不盲目相信模型評估結果，務必同時進行樣本的手動比對。
    deliverables:
    - 已建立 100 題以上的問答評估集 (JSONL 檔案)
    - 包含數據集生成與驗證程式碼的 Jupyter Notebook
    - 包含人工審查記錄的品質分析報告
  assignment:
    title: RAG 可靠性評估集迴歸報告
    deliverables:
    - 分析生成評估集的統計分佈（問題長度、答案長度、文件參考頻率等）的儀表板
    - 以相同評估集比較兩種以上 RAG 設定（例如：檢索演算法變更、模型變更）的結果
    - 錯誤分類表（幻覺、上下文不相關等）撰寫與案例分析
    rubric:
    - 評估集是否均勻反映了整個文件語料庫的內容？
    - 合成數據生成管線是否以可重現的形式撰寫？
    - 錯誤類型分類是否具備具體且定量的依據？
    - 是否透過人工審查證明了自動評估指標的有效性？
  quiz:
  - question: TrueTeacher 方法論與現有合成數據生成方式的區別為何？
    choices:
    - 完全依賴人工撰寫的摘要。
    - 透過註釋模型生成的各種摘要來生成合成數據。
    - 僅使用小型模型作為訓練教師。
    - 僅透過手動撰寫數據集來提高準確性。
    answer_index: 1
    explanation: TrueTeacher 不依賴人工撰寫的摘要，而是透過使用大型語言模型（LLM）註釋模型生成的各種摘要來生成合成數據 [S5]。
  - question: 在建立 RAG 評估集時，為何不單獨依靠模型自動評估來確定事實性？
    choices:
    - 因為模型自動評估比人工慢太多。
    - 因為模型自動評估不完美，無法完全過濾掉幻覺（Hallucination）。
    - 因為人工評估不需要成本。
    - 因為事實性評估不需要模型。
    answer_index: 1
    explanation: 自動化評估工具雖然效率高，但並不完美，因此為了驗證事實性，務必同時進行樣本人工審查和來源比對。
  completion_criteria:
  - 100 題以上問答評估集數據集建立完成
  - 提交數據集品質分析及人工審查記錄
