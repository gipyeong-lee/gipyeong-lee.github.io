  objectives:
  - 耐量子暗号(PQC)実験のための隔離されたローカル開発環境の構成原理と必須ツール(liboqs, oqs-provider)の役割を理解する。
  - TLS 1.3 などのプロトコルにおいて、KEMパフォーマンスがハンドシェイク遅延時間に与える影響を分析する。
  - Dockerコンテナを使用して、依存関係が固定された再現可能な実験環境を設計し構築する。
  theory_markdown: '### 隔離されたPQC実験環境の必要性

    量子コンピュータの脅威から既存の公開鍵暗号(RSA, ECDHなど)を保護するために、NISTはML-KEM(Kyberベース)およびML-DSA(Dilithiumベース)のような耐量子アルゴリズムを標準化した。これらのアルゴリズムのパフォーマンスとセキュリティをローカル環境で評価するには、**暗号アジリティ(Crypto-agility)**を備えた再現可能な環境が不可欠である
    [S2]。


    #### 1. 主要構成要素

    *   **liboqs**: PQCアルゴリズムをC言語で実装したライブラリであり、様々なKEMおよび署名アルゴリズムをテストできる基盤を提供する。

    *   **oqs-provider**: OpenSSL 3 のプロバイダーアーキテクチャを使用して、PQCアルゴリズムを既存のTLSインフラに統合可能にするインターフェースである。

    *   **ハイブリッドモード**: 既存の古典暗号(ECDH)とPQCアルゴリズムを結合し、PQCライブラリの潜在的な脆弱性にもかかわらず既存のセキュリティレベルを維持する移行期の戦略である
    [S2]。


    #### 2. 実験環境の鍵: 隔離および再現性

    実験は運用環境と完全に分離されるべきである。Dockerなどのコンテナ技術を使用して依存関係バージョンを固定(Locking)すれば、研究者間での実行結果の差異を減らし、アルゴリズム最適化(例:
    AVX-512 活用)の効果を正確に測定できる [S2]。ハンドシェイクパフォーマンス評価時には、固定されたハードウェアと隔離されたネットワークを使用して、遅延時間の不確実性を最小限に抑える必要がある。'
  worked_examples:
  - '例 1: Dockerfileを活用したoqs-providerベースの環境構築。各ライブラリのバージョンを明示してビルド再現性を確保する方式の説明。'
  - '例 2: OpenSSL CLIを利用したハイブリッドTLSハンドシェイクテスト。''openssl s_server'' と ''s_client''
    を使用して ML-KEM-768 をサポートするハイブリッドTLS 1.3 接続シミュレーションの方法。'
  lab:
    title: 隔離されたPQCテストベッドの構築
    steps:
    - 実験用Dockerコンテナイメージベース(Ubuntu 22.04 LTS以上)を準備。
    - liboqsおよびoqs-providerのソースコードを複製(clone)し、特定のコミットハッシュをチェックアウトしてバージョンを固定。
    - 'CMakeを使用してliboqsコンパイル時、最適化レベル(例: AVX2)を設定しビルドを実行。'
    - OpenSSL 3.x 環境設定およびoqs-providerの有効化。
    - ローカルネットワークインターフェースに固定されたループバック接続を通じて、基本TLS 1.3 ハンドシェイクパフォーマンス基準を測定。
    safety:
    - 実験用環境は必ずローカル隔離されたコンテナ内でのみ実行すること。
    - 運用環境の証明書、実際の秘密鍵、顧客データは決してコンテナ内に持ち込まないこと。
    - コンパイルおよび実行過程で生成された測定値は公開テストデータと見なし、実際のセキュリティポリシーとは無関係であることに留意すること。
    - 実際のハードウェアや電力モニタリング時、製造元が明示した定格電流および電圧範囲を遵守すること。
    deliverables:
    - 依存関係バージョンが固定されたDockerfileおよびビルドログ。
    - OpenSSLでPQCアルゴリズムリストを正常に読み込めたことを示すターミナルキャプチャ。
    - 環境設定が完了した隔離された開発環境のチェックサム(SHA-256)。
  assignment:
    title: PQCテストベッドの文書化および評価
    deliverables:
    - 構築したテストベッドの構成図および選択したアルゴリズムバージョン明細書。
    - テストベッド環境での古典アルゴリズムとハイブリッドML-KEMアルゴリズムのハンドシェイク時間比較データCSV。
    - 隔離された環境維持のためのセキュリティポリシーレポート。
    rubric:
    - 依存関係バージョンの固定およびビルド再現の可能性 (30%)
    - 隔離された実験環境でのハイブリッドTLSハンドシェイク成功可否 (40%)
    - アルゴリズム構成および測定手順の明確さとセキュリティ遵守 (30%)
  quiz:
  - question: oqs-providerの主な役割は何ですか？
    choices:
    - PQCアルゴリズムをハードウェアレベルで加速する。
    - OpenSSL 3 で耐量子アルゴリズムをTLSプロトコルなどに使用できるように接続するインターフェースの役割を果たす。
    - 運用環境のセキュリティ証明書を自動的に更新する。
    - 量子コンピュータの攻撃ベクトルを遮断する。
    answer_index: 1
    explanation: oqs-providerはOpenSSLのプロバイダーアーキテクチャを使用してPQCアルゴリズムを標準ライブラリに統合し、それによって既存のアプリケーションがPQCアルゴリズムを使用できるようにします。
  - question: 隔離された実験環境でバージョンを固定(Locking)すべき理由は何ですか？
    choices:
    - 最新バージョンが常に高速であるためである。
    - 再現性を保証し、研究者間での実行環境の差異による測定誤差を減らすためである。
    - 運用セキュリティを強化するためである。
    - ビルド時間を短縮するためである。
    answer_index: 1
    explanation: バージョン固定は同一環境を再現可能にし、パフォーマンス測定値の整合性と研究の客観性を確保するために不可欠です。
  completion_criteria:
  - Dockerベースの隔離されたビルド環境構成に成功。
  - oqs-providerを通じたML-KEMハイブリッドモードのデモンストレーション完了。
  - 実験データ測定およびセキュリティポリシーが含まれたレポート提出。
  source_ids:
  - S2
- id: m5
  slug: liboqs-integration
  phase_id: p2
  title: OQSおよびoqs-provider統合
  estimated_hours: 8.0
  prerequisites:
  - m4
  objectives:
  - Open Quantum Safe(OQS)アーキテクチャとoqs-providerの役割を理解する。
  - TLS 1.3 でPQ(Post-Quantum)アルゴリズムが統合される方式を把握する。
  - ローカル環境でハイブリッド(Hybrid) TLSハンドシェイクを構成および検証する。
  - KEM実装の最適化(AVX-512など)が実際のハンドシェイクパフォーマンスに与える影響を考察する。
  theory_markdown: '## OQSおよびoqs-provider統合理論


    量子コンピュータの脅威から既存のデータ転送を保護するために、NIST標準に基づく耐量子アルゴリズム(PQC)をTLS 1.3 のような既存プロトコルに統合することが不可欠である。OQS(Open
    Quantum Safe)プロジェクトは、これらの統合を加速させる主要フレームワークを提供する [S2]。


    ### 1. liboqsとoqs-provider

    - **liboqs**: PQCアルゴリズム(ML-KEM, ML-DSAなど)のC言語実装を含むコアライブラリである。多様なアルゴリズムに対して統一されたAPIを提供する。

    - **oqs-provider**: OpenSSL 3 のプロバイダー構造を活用して、OpenSSLアプリケーション(例: `s_client`, `s_server`)がliboqsのPQCアルゴリズムをネイティブに使用できるよう支援する中間レイヤーである。これにより修正を加えることなく、既存のTLSツールでPQC機能をテストできる。


    ### 2. TLS 1.3 のPQ統合方式

    TLS 1.3 ハンドシェイク過程において、PQC KEMは既存の鍵交換(例: ECDH)を代替または補完する。

    - **PQ-onlyモード**: PQC KEMのみを使用して鍵を交換する。

    - **ハイブリッド(Hybrid)モード**: 既存の古典アルゴリズム(ECDH)とPQCアルゴリズムを結合する。これは耐量子安全性を確保しつつ古典的なセキュリティ保証も維持するものであり、アルゴリズム実装エラーや将来的な脆弱性から保護するための戦略である。


    ### 3. パフォーマンスの考慮事項

    PQC KEMは既存のアルゴリズムよりも鍵サイズや計算量が多くなる可能性があり、ハンドシェイクパフォーマンスに直接的な影響を与える [S2]。最新のハードウェア命令セット(AVX-512など)を使用して多項式乗算やモジュラ縮小などを最適化することで、ハンドシェイク速度を向上させることができる
    [S2]。'
  worked_examples:
  - '例 1: oqs-providerがOpenSSLにロードされているかを確認するには `openssl list -providers` コマンドを実行する。出力結果に
    ''oqs'' プロバイダーが含まれている必要がある。'
  - '例 2: ハイブリッドハンドシェイク実行時、 `openssl s_client -groups kyber768_x25519...` のようにコマンド引数を通じて鍵交換グループを指定する。これは
    ML-KEM(Kyber)と古典的な Curve25519 を結合したハイブリッドグループである。'
  lab:
    title: ローカル環境におけるハイブリッドTLSテスト
    steps:
    - 隔離されたDockerコンテナ内でliboqsおよびoqs-providerをビルドしインストールする。
    - OpenSSL設定ファイル(`openssl.cnf`)を修正し、oqsプロバイダーを有効化する。
    - 二つのターミナルを開き、一方は `openssl s_server` を、もう一方は `openssl s_client` をハイブリッドモードで実行する。
    - Wiresharkを使用して ClientHello パケットにおいて、共有鍵グループ(Key Share)がどのように送信されるかをキャプチャおよび分析する。
    - ハンドシェイク成功可否とセッション暗号化アルゴリズム情報を確認する。
    safety:
    - 実験は必ず隔離されたローカル仮想環境内でのみ実行すること。
    - 運用サービスに使用される証明書や鍵は決して使用しないこと。
    - Wiresharkキャプチャ時、実際のサービストラフィックが含まれないよう注意すること。
    deliverables:
    - oqs-provider有効化確認スクリーンショット
    - ハイブリッドハンドシェイクログファイル
    - Wiresharkキャプチャパケットの共有鍵グループ分析レポート
  assignment:
    title: 暗号アジリティベースの移行分析レポート
    deliverables:
    - TLSハンドシェイクパフォーマンス測定結果データ(CSV)
    - ハイブリッドモード使用理由とパフォーマンス低下に関する分析エッセイ
    - 優先順位ベースの耐量子移行ロードマップ
    rubric:
    - OQSツールチェーンのビルドおよび実行の成功可否
    - パケット分析を通じてハイブリッドモードの動作を正確に説明しているか
    - パフォーマンス測定データが実験環境とバージョン情報を含み再現可能か
    - 暗号アジリティの概念に基づき移行ロードマップが論理的に作成されているか
  quiz:
  - question: oqs-providerがOpenSSLで担当する中核的な役割は何ですか？
    choices:
    - ネットワークパケットを暗号化するハードウェアアクセラレータ
    - OpenSSLがliboqsのPQCアルゴリズムを呼び出せるようにするレイヤー
    - インターネットで公開鍵証明書を発行するサービス
    - 量子コンピュータの攻撃を検知するIDSツール
    answer_index: 1
    explanation: oqs-providerはOpenSSLのプロバイダー構造を通じてliboqsのアルゴリズムをOpenSSLアプリケーションから直接使用できるように接続します。
  - question: TLS 1.3 で「ハイブリッドモード」鍵交換を使用する主な理由は何ですか？
    choices:
    - パフォーマンスを 100 倍以上に高めるため
    - 単一アルゴリズムの実装エラーや将来的な脆弱性に備えてセキュリティを保証するため
    - すべての既存クライアントをサポートするため
    - 量子コンピュータを使用してハンドシェイクを行うため
    answer_index: 1
    explanation: ハイブリッドモードは古典的なアルゴリズムとPQCアルゴリズムを結合し、実装上の欠陥や未知の脆弱性に備える多層防御戦略です。
  completion_criteria:
  - oqs-providerベースのローカルテスト環境ビルド完了
  - ハイブリッドTLSハンドシェイク成功およびパケットキャプチャ検証完了
  - 実験結果と分析が含まれたレポート作成完了
  - 耐量子移行ロードマップ策定完了
  source_ids:
  - S2
- id: m6
  slug: performance-benchmarking
  phase_id: p3
  title: パフォーマンス評価およびベンチマーク
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - 耐量子暗号アルゴリズム(ML-KEM)のパフォーマンス評価指標(時間、メモリ、処理能力)を理解する。
  - TLS 1.3 ハンドシェイク過程においてKEM演算がパフォーマンスに与える影響を分析する。
  - Liboqsおよびoqs-providerフレームワークを活用してハイブリッド暗号モードのパフォーマンスをベンチマークする。
  theory_markdown: '## パフォーマンス評価およびベンチマーク


    耐量子暗号(PQC)への移行は、単にアルゴリズムを交換するだけでなく、既存のネットワークプロトコル(例: TLS 1.3)のパフォーマンスに直結する問題である。特にKEM(Key
    Encapsulation Mechanism)演算は、ハンドシェイクの遅延時間(latency)とサーバーの秒間接続処理数(handshakes per
    second)に直接的な影響を与える [S2]。


    ### パフォーマンス指標

    1. **演算時間(Computation Time):** 鍵生成(KeyGen)、カプセル化(Encaps)、逆カプセル化(Decaps)のそれぞれに要するCPUサイクルまたは時間(ms)。

    2. **データサイズ:** 公開鍵およびカプセル化されたテキスト(ciphertext)のサイズ。これはネットワーク帯域幅消費と断片化発生の可能性を決定する。

    3. **スループット(Throughput):** 秒間処理可能なハンドシェイク数。最適化された実装(例: AVX-512 活用)はポリノミアル乗算およびモジュラ演算速度を高め、処理能力を大幅に改善できる
    [S2]。


    ### ハイブリッドモード

    移行期には従来のアルゴリズム(ECDH)とPQC(ML-KEM)を併用するハイブリッドアプローチが推奨される。これはPQCの潜在的な脆弱性に備えつつ、PQCのセキュリティ利点を確保するためである。ハイブリッドモードは演算複雑度が増加するため、パフォーマンス低下を綿密に評価しなければならない
    [S2]。'
  worked_examples:
  - '例 1: Liboqsを使用した単一KEM演算ベンチマーク

    Pythonスクリプトを通じて `ML-KEM-768` の `keypair`, `encaps`, `decaps` 動作時間を `timeit` モジュールで測定し、結果をCSVとして保存する方法である。'
  - '例 2: ハイブリッドTLS 1.3 ハンドシェイク処理能力測定

    oqs-providerが適用されたローカルサーバー/クライアント環境にて `s_client` と `s_server` を使用し、100回接続時に要する合計時間を測定して秒間ハンドシェイク数(TPS)を算出する分析手順である。'
  lab:
    title: PQCパフォーマンスベンチマーク実習
    steps:
    - 隔離された開発環境にてliboqsおよびoqs-providerをインストールし、環境設定を確認する。
    - ベンチマーク用Pythonスクリプトを作成し、ML-KEMアルゴリズムの演算時間を測定する。
    - Wiresharkを実行してTLSハンドシェイクパケットをキャプチャし、ハイブリッドモード時のデータサイズ変化を分析する。
    - 測定されたデータに基づき、演算時間および処理能力指標をグラフ化する。
    safety:
    - 実験はローカル隔離環境内でのみ実行し、実際の運用環境の証明書や鍵を絶対に使用しないこと。
    - ベンチマーク過程で高いCPU負荷が発生する可能性があるため、システムリソースをモニタリングすること。
    - 実際の秘密値や鍵データをキャプチャファイルに含めないよう注意すること。
    deliverables:
    - 演算パフォーマンス測定スクリプト(.py)
    - 測定結果CSVデータ
    - アルゴリズム別パフォーマンス比較分析レポート(.mdまたは.ipynb)
  assignment:
    title: 暗号アジリティベースのパフォーマンス評価レポート
    deliverables:
    - アルゴリズム選択理由およびセキュリティ/パフォーマンスのトレードオフ分析
    - ベンチマークデータ視覚化資料
    - パフォーマンス結果に基づいた移行ロードマップ修正案
    rubric:
    - ベンチマークデータが再現可能であり、独立した環境で測定されているか？
    - パフォーマンス低下の技術的原因(鍵サイズ、演算複雑度)を正確に分析しているか？
    - ハイブリッドモードの利点とコストをバランスよく議論しているか？
  quiz:
  - question: TLS 1.3 ハンドシェイクパフォーマンスにおいて最も重要なPQCアルゴリズム関連要素は？
    choices:
    - 対称鍵暗号アルゴリズムのブロックサイズ
    - KEMの鍵生成およびカプセル化演算時間
    - ハッシュアルゴリズムの種類
    - サーバーのオペレーティングシステムの種類
    answer_index: 1
    explanation: TLS 1.3 ハンドシェイクパフォーマンスは、KEMアルゴリズムの演算効率に大きく左右されます [S2]。
  - question: パフォーマンス評価時にハイブリッドモードを使用する主な理由は？
    choices:
    - 伝統的なアルゴリズムよりも常に高速であるため
    - PQCのセキュリティ脅威に備えつつセキュリティ性を維持するため
    - ネットワーク帯域幅を減らすため
    - 演算リソースを最小化するため
    answer_index: 1
    explanation: ハイブリッドモードはPQCの未来のセキュリティ性と、伝統的アルゴリズムの検証済みのセキュリティ性を結合し、段階的な移行を可能にします。
  completion_criteria:
  - ベンチマークスクリプトの実行および結果データ確保完了
  - パフォーマンス評価レポート提出および通過
  - TLSハイブリッドモードパフォーマンス分析完了
