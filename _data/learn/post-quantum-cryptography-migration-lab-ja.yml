- id: m7
  slug: hybrid-tls-analysis
  phase_id: p3
  title: Hybrid TLSハンドシェイク分析
  estimated_hours: 8.0
  prerequisites:
  - m6
  objectives:
  - 量子脅威環境下におけるTLS 1.3 の脆弱性を説明する。
  - ML-KEMベースのハイブリッド(Hybrid) TLSハンドシェイク構造を理解する。
  - OQS(Open Quantum Safe)ベースのローカル環境にてハイブリッドモードパフォーマンスを測定する。
  - パケットキャプチャを通じて、既存アルゴリズムとPQアルゴリズムが結合されたハンドシェイクプロセスを分析する。
  theory_markdown: '### ハイブリッドTLSハンドシェイク理論


    現行のTLS 1.3 はECDH(Elliptic Curve Diffie-Hellman)のような古典的な公開鍵暗号に依存しており、これは十分な性能の量子コンピュータが登場した場合、攻撃の脅威にさらされる
    [S2]。これへの対応として、NIST標準であるML-KEM(Module-Lattice-Based Key-Encapsulation Mechanism)のような耐量子暗号(PQC)を統合する研究が活発である
    [S2]。


    #### ハイブリッドモードのセキュリティ仮定

    完全なPQC移行前に運用安定性を確保するため、古典的アルゴリズムとPQアルゴリズムを結合した「ハイブリッド(Hybrid)モード」を使用する。この方式は、両アルゴリズムの共有秘密(Shared
    Secret)を結合し、両アルゴリズムのいずれか一方が安全であれば通信の秘密性を保証するように設計されている。


    #### パフォーマンスの考慮事項

    TLS 1.3 ハンドシェイクパフォーマンスはKEMの計算コストに直接的に依存する [S2]。特に鍵生成(Key Generation)、カプセル化(Encapsulation)、逆カプセル化(Decapsulation)段階における演算効率が、ハンドシェイク全体の速度を決定する。近年ではAVX-512のような命令セット最適化を通じて、多項式乗算およびモジュラ縮小プロセスを加速し、ハンドシェイクパフォーマンスを高める手法が適用されている
    [S2]。'
  worked_examples:
  - '例 1: ハイブリッド鍵交換プロセス - クライアントは古典的共有秘密値とPQCカプセル化結果値をサーバーに送信します。サーバーは逆カプセル化の後、二つの共有秘密をKDF(Key
    Derivation Function)に結合してセッションキーを生成します。'
  - '例 2: ハンドシェイク遅延分析 - PQアルゴリズム適用時、追加的な鍵サイズ(Key Size)が増加するに従い、ネットワーク転送時間が増える現象を比較分析します。パフォーマンス最適化(例:
    AVX-512 使用)適用前後でのハンドシェイク当たりの処理量(Handshakes per second)の差を数値化します [S2]。'
  lab:
    title: OQSベースのハイブリッドTLSハンドシェイク再現実験
    steps:
    - 隔離されたDocker環境にてliboqsおよびoqs-providerが統合されたOpenSSL 3 ビルド環境を構築する。
    - '既存ECDHモードとML-KEMベースのハイブリッドモード(例: secp256r1_mlkem768)を設定する。'
    - ローカルループバック(Loopback)インターフェースを使用して、両モード間でTLS 1.3 ハンドシェイクを実行する。
    - Wiresharkを使用して ClientHello および ServerHello メッセージ内の鍵交換データフィールドをパケットキャプチャする。
    - 実行時間測定スクリプトを使用して 100 回以上のハンドシェイク平均時間を測定し、ハイブリッドモードのオーバーヘッドを記録する。
    safety:
    - 本実験はローカル環境の隔離されたループバックインターフェースでのみ実行し、外部ネットワークトラフィックを生成しないこと。
    - 実際の証明書、秘密鍵、ユーザーデータなどの運用セキュリティ資産を絶対に使用しないこと。
    - 学習用OQSライブラリは実験的なツールであるため、実際の運用セキュリティサービスには使用しないこと。
    - 実験終了時、生成されたすべての臨時鍵とローカル測定データを削除すること。
    deliverables:
    - 設定および実行ログファイル
    - Wiresharkパケットキャプチャファイル(.pcapng)および鍵交換フィールド分析ノート
    - ハンドシェイクパフォーマンス比較測定CSVデータ
  assignment:
    title: TLS 1.3 ハイブリッド移行パフォーマンス分析レポート
    deliverables:
    - ハンドシェイク遅延時間比較分析グラフおよびデータ視覚化
    - ハイブリッドモードパケット分析および鍵交換アルゴリズム特徴のまとめ
    - 運用環境適用時に予想されるパフォーマンスおよびセキュリティ考慮事項の意思決定表
    rubric:
    - 実験の再現可能性(環境設定およびスクリプト明示の有無)
    - パケット分析の正確性(鍵交換フィールドの識別)
    - パフォーマンス測定データの論理的解釈
    - 理論的なセキュリティ仮定と実験結果の関連性
  quiz:
  - question: ハイブリッドTLSハンドシェイクの主なセキュリティ上の利点は何ですか？
    choices:
    - ハンドシェイクステップを劇的に減らして速度を高める。
    - 古典的アルゴリズムとPQCアルゴリズムのいずれか一方が安全であれば秘密性を維持する。
    - ネットワーク転送コストを完全に排除する。
    - 証明書管理の複雑度を下げる。
    answer_index: 1
    explanation: ハイブリッドモードは既存のアルゴリズムとPQCアルゴリズムの結果を結合し、両アルゴリズムのいずれか一方が安全であればセキュリティが維持されるように設計された移行期の戦略です。
  - question: TLS 1.3 ハンドシェイクパフォーマンスに最も大きな影響を与えるPQアルゴリズム要素は何ですか？
    choices:
    - ネットワークレイテンシのみを考慮する。
    - KEM（鍵カプセル化メカニズム）の鍵生成、カプセル化、逆カプセル化の計算コスト
    - サーバーのディスクI/O速度
    - クライアントのブラウザバージョン
    answer_index: 1
    explanation: KEMアルゴリズムの計算コストは、TLS 1.3 ハンドシェイクのパフォーマンスに直結するため、これを最適化することが性能改善の鍵となります[S2]。
  completion_criteria:
  - ローカル環境でのliboqsベースのハイブリッドTLSハンドシェイクの再現成功
  - Wireshark分析を通じたハイブリッド鍵交換メッセージの確認
  - 性能測定データに基づく結果分析レポートの提出
  - 安全上の制約事項（データ分離、運用鍵の不使用）の遵守確認
  source_ids:
  - S2
- id: m8
  slug: migration-roadmap
  phase_id: p3
  title: 移行優先順位レポートの作成
  estimated_hours: 8.0
  prerequisites:
  - m7
  objectives:
  - 耐量子計算機暗号（PQC）移行のためのリスクおよびビジネス影響分析フレームワークの理解
  - 暗号資産インベントリデータに基づく移行優先順位の決定
  - 暗号アジリティ（Cryptographic Agility）確保のための技術戦略の策定
  - 最終移行ロードマップおよび検証レポートの構造化
  theory_markdown: '### 移行優先順位戦略 (Migration Prioritization Strategy)


    NIST耐量子標準（ML-KEM、ML-DSA）への移行は、システム全体の暗号資産評価から始まります。移行の優先順位は、単にアルゴリズムの老朽化度だけでなく、データの寿命（Data
    Shelf Life）、暗号露出のリスク、そしてシステムの戦略的重要度に応じて決定されます [S1]。


    #### 1. 暗号資産評価基準 (Assessment Criteria)

    移行の緊急度を判断するために、次の基準を活用します：

    - **データセキュリティ寿命：** 暗号化されたデータが将来の量子コンピュータによって解読された場合に及ぼす影響（例：10年以上機密保持が必要なデータ）。

    - **システムアジリティ：** 現在実装されている暗号がハードコーディングされているか、構成ファイル（Config）を通じてアルゴリズムの交換が可能か否か。

    - **技術的負債：** 当該暗号モジュールを使用する依存関係（Dependency）およびメンテナンスの可否。


    #### 2. 暗号アジリティの確保

    移行ロードマップの鍵は、アルゴリズム交換時のコード変更を最小限に抑えることです。抽象化レイヤー（Abstraction Layer）を使用してビジネスロジックと暗号エンジンを分離し、ハイブリッド鍵交換方式を通じて既存アルゴリズムの安定性とPQCの量子耐性を同時に確保する戦略が推奨されます。'
  worked_examples:
  - 例 1：データライフサイクルに基づく優先順位算出 - 20年保存される個人情報データベースは、5年保存されるログデータよりもPQC移行の優先順位が高く評価される。
  - 例 2：ハイブリッドTLS構成事例 - 既存のECDHとML-KEMを組み合わせ、両アルゴリズムのいずれか一方が安全であれば通信機密性が維持されるように設計するハイブリッドモデルの分析。
  lab:
    title: 移行ロードマップシミュレーション
    steps:
    - 前のモジュールで作成したインベントリCSVデータを読み込みます。
    - 各資産に対して[リスク * 重要度 * 寿命]スコアを算出するPythonスクリプトを作成します。
    - 優先順位上位3個の資産に対するハイブリッド実装計画を立てます。
    - 移行時に発生し得る互換性の問題と対応策（フォールバック戦略）を記述します。
    safety:
    - すべての計算および分析は、独立した隔離仮想環境でのみ行います。
    - 運用サーバーの実際の暗号構成は変更しません。
    - 実際の鍵素材が含まれないよう、分析ノートブックを確認します。
    deliverables:
    - 優先順位付けされたインベントリCSV分析版
    - 移行計画を含む技術意思決定表
  assignment:
    title: PQC移行優先順位レポート
    deliverables:
    - 暗号アジリティ分析レポート（PDF）
    - リスク等級に基づく移行ロードマップ（表を含む）
    rubric:
    - データ寿命および露出リスクに基づく妥当な優先順位論理
    - ハイブリッド暗号体系導入を通じた暗号アジリティの考慮
    - 移行計画の段階的な実行可能性
    - 実験結果およびデータインベントリとの整合性
  quiz:
  - question: 暗号移行の優先順位を決定する際、最も考慮すべきデータ特性は何ですか？
    choices:
    - データが使用されるプログラミング言語
    - データのセキュリティ必要寿命（Data Shelf Life）
    - システムの開発者数
    - 最新データストレージの容量
    answer_index: 1
    explanation: 量子脅威はデータが将来解読されるリスクを内包しているため、長期間機密が維持されるべきデータが最も優先的にPQC移行を必要とします。
  - question: 暗号アジリティ（Cryptographic Agility）のために推奨されるソフトウェア設計方式は何ですか？
    choices:
    - ハードコーディングされた暗号アルゴリズムの使用
    - 暗号モジュールとビジネスロジックの抽象化分離
    - 単一アルゴリズムのみを使用するクローズド構造
    - OSレベルの暗号ライブラリの直接参照
    answer_index: 1
    explanation: 暗号エンジンとロジックを分離し、アルゴリズム交換時のコード変更を最小限に抑える構造が、暗号アジリティ確保の鍵です。
  completion_criteria:
  - 移行優先順位が明記されたインベントリ分析ファイルの提出
  - 暗号アジリティの考慮事項が含まれた移行ロードマップレポートの作成
  - すべての実習コードおよび測定値が含まれた再現パッケージの完了
  source_ids:
  - S1
