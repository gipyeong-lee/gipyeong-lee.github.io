modules:
- id: mod-1
  slug: robotics-intro
  phase_id: phase-1
  title: 로봇 공학의 이해
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - 로봇 공학의 정의와 구성을 이해한다.
  - 로봇의 기구학적 설정(configuration)이 자유도와 어떻게 연관되는지 파악한다.
  - 로봇 프로젝트의 필수 안전 프로토콜과 전력 관리 원칙을 숙지한다.
  - 5지 로봇손 제작을 위한 BOM과 부품 사양을 분석한다.
  theory_markdown: "## 로봇 공학 입문\n\n로봇 공학은 기계, 전자, 소프트웨어를 통합하여 환경과 상호작용하는 시스템을 설계하는\
    \ 학문입니다. 로봇의 '구성(configuration)'은 로봇의 모든 점들의 위치에 대한 명세입니다[S1]. 로봇의 링크가 강체이고 형상이\
    \ 알려져 있다면, 로봇의 구성을 나타내는 데는 비교적 적은 수의 수치만이 필요합니다[S1]. 현대 로봇 공학은 이러한 기초 위에 제어, 센서\
    \ 피드백, 그리고 시스템 통합을 더하여 발전하고 있습니다[S2].\n\n### 시스템 전력 관리 원칙\n\n본 프로젝트는 11대의 DYNAMIXEL\
    \ XM430-W350-T 액추에이터를 사용합니다. 액추에이터당 스톨 전류는 2.3 A이므로[S14], 총 피크 전류는 25.3 A에 달합니다.\
    \ 이를 관리하기 위해 138 W(11.5 A) 정격의 절연형 데스크톱 전원 어댑터 3대를 독립적으로 사용합니다[S16]. \n\n**핵심\
    \ 안전 규칙:** 모든 전원 어댑터의 양(+) 출력은 독립된 분기로 유지하며, **절대 단일 버스로 통합하거나 합치지 않습니다**. 3개의\
    \ 분기에 각각 액추에이터를 4대, 4대, 3대씩 배분하여 과부하를 방지합니다. 각 분기마다 10 A ATOF 퓨즈를 장착하여 개별적인 과전류\
    \ 보호를 수행합니다[S25].\n\n### 제어 및 센서 통합\n\n로봇 제어는 OpenCR 1.0 보드를 통해 수행됩니다[S15]. 손끝\
    \ 힘 감지는 FSR(Force Sensing Resistor) 402를 사용하며, 0.2 N에서 20 N까지의 힘을 측정합니다[S6]. 센서\
    \ 데이터는 OpenCR의 3.3 V 센서 전원 레일과 10 kΩ 저항을 사용하는 전압 분압 회로를 통해 12비트 ADC로 읽어 들입니다[S15,\
    \ S26]. 모든 아날로그 신호는 0~3.3 V 범위를 초과하지 않도록 회로를 구성합니다."
  worked_examples:
  - '예제 1: 분기 전류 계산. 액추에이터 4대가 한 분기에 연결된 경우 최대 피크 전류는 4 * 2.3 A = 9.2 A입니다. 이는 어댑터의
    11.5 A 용량 이내이며, 10 A 퓨즈를 사용하면 적절하게 보호됩니다.'
  - '예제 2: 센서 분압 회로 설계. 3.3 V 전원을 FSR(가변 저항)과 10 kΩ 고정 저항에 분압합니다. FSR 저항이 0 Ω(이상적)에
    가까워질수록 ADC 입력 전압은 3.3 V에 근접하고, FSR 저항이 매우 커질수록 0 V에 근접하여 힘을 판별합니다.'
  lab:
    title: '실습: 안전한 벤치 전원 구성 및 센서 분압 확인'
    steps:
    - 각 절연형 어댑터의 12 V 분기 출력이 독립되어 있음을 멀티미터로 확인한다.
    - 각 어댑터 출력에 0AFH0001Z 홀더와 10 A ATOF 퓨즈를 직렬로 연결하여 개별 퓨즈 분기를 구성한다[S24, S25].
    - 전원 인가 전, 각 퓨즈 이후의 전압이 어댑터 전압과 일치하는지 DC 전압 모드에서 측정한다.
    - OpenCR 보드의 3.3 V 센서 레일과 10 kΩ 저항을 사용하여 FSR 분압 회로를 구성한다.
    - FSR 센서를 눌렀을 때 ADC 값이 0~4095 범위 내에서 변화하는지 확인한다.
    safety:
    - 항상 보안경을 착용한다.
    - 작업 전후에 3개 전원 어댑터를 물리적으로 분리하고, 각 분기의 전압이 1 V 미만임을 계측 확인한 후 접근한다.
    - 전원 인가 중에는 절대로 회로를 변경하거나 손을 가동 범위에 넣지 않는다.
    - 퓨즈는 비상정지 장치가 아니며 과전류 보호용임을 인지한다.
    deliverables:
    - 각 분기별 독립 배선도
    - 측정된 무부하 전압 및 ADC 힘 응답 로그
  assignment:
    title: 로봇 전원 분기 설계 보고서
    deliverables:
    - 액추에이터 분기 배분 표(4대/4대/3대)
    - 각 분기별 최대 전류 및 퓨즈 선정 근거 계산서
    rubric:
    - 각 어댑터 출력이 독립적으로 관리되는지 확인
    - 퓨즈 정격이 피크 전류(9.2 A)보다 크고 어댑터 정격(11.5 A)보다 작은지 확인
    - 전력 공급 방식에 있어 독립된 분기 운영 원칙 준수 여부
  quiz:
  - question: 3개의 독립적인 12V 어댑터 분기를 구성할 때 가장 올바른 조치는 무엇입니까?
    choices:
    - 모든 어댑터의 양(+) 출력을 하나로 묶어 전압 안정성을 높인다.
    - 각 어댑터를 독립적으로 운용하고 퓨즈를 통해 개별 분기를 보호한다.
    answer_index: 1
    explanation: 독립된 어댑터의 출력을 묶는 것은 위험하며, 항상 각 분기를 물리적으로 분리하여 운영해야 합니다.
  - question: FSR 402 센서를 OpenCR에 연결할 때 적절한 전원은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    answer_index: 1
    explanation: OpenCR의 센서 전압 입력 범위(0-3.3V)를 맞추기 위해 반드시 3.3 V 레일을 사용해야 합니다.
  - question: 계획 정지 후 정비를 위해 회로 접근 시 가장 안전한 상태 확인 방법은?
    choices:
    - 연속성(도통) 테스트 모드로 회로 확인
    - 멀티미터를 DC 전압 모드에 두고 모든 분기 전압이 1 V 미만인지 측정
    answer_index: 1
    explanation: 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
  completion_criteria:
  - 각 분기별 독립 전원 및 퓨즈 구성 확인 완료
  - FSR 센서를 이용한 ADC 힘 신호 취득 성공
  - 안전 규칙 준수 및 벤치 전원 관리 보고서 제출
  source_ids:
  - S1
  - S2
  - S14
  - S16
  - S25
  - S15
  - S6
  - S26
  - S24
- id: mod-2
  slug: hardware-intro
  phase_id: phase-1
  title: 하드웨어 제어 입문
  estimated_hours: 10.0
  prerequisites:
  - mod-1
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 제어 원리와 통신 프로토콜을 이해한다.
  - OpenCR 제어기에서 센서 데이터 취득 및 액추에이터 명령 처리 방식을 습득한다.
  - FSR 센서를 이용한 전압 분압 회로를 구성하고 ADC 신호를 변환한다.
  - 실습 환경의 전기적 안전 규정을 준수하며 독립 전원 분기를 구성한다.
  theory_markdown: '### 하드웨어 제어 구조

    로봇 손의 핵심 제어 시스템은 `OpenCR 1.0` 제어기와 `XM430-W350-T` 액추에이터로 구성됩니다 [S14, S15]. OpenCR은
    액추에이터 통신(RS-485/TTL)과 센서 입력을 단일 보드에서 처리하여 시스템 지연을 최소화합니다 [S15].


    ### 힘 센서 인터페이스

    `FSR 402` 센서는 압력에 따라 저항값이 감소하는 고분자 필름 센서입니다 [S6]. 이를 전압 값으로 변환하기 위해 10 kΩ 저항을
    사용하는 분압 회로를 OpenCR의 3.3 V 센서 전원 레일에 연결합니다 [S15, S26]. ADC(12-bit)는 0~3.3 V 입력을
    0~4095 값으로 변환합니다 [S15].


    ### 전원 분기 및 안전

    본 시스템은 3개의 독립된 `GST160A12-R7B` 전원 어댑터를 사용하여 액추에이터를 3개 그룹(4대/4대/3대)으로 분리 공급합니다
    [S16]. 각 어댑터 출력은 10 A `ATOF` 퓨즈와 인라인 홀더를 통해 보호됩니다 [S24, S25]. 각 전원 라인은 전기적으로 완벽히
    격리되어야 하며, 절대 양(+) 단자를 병렬로 연결하지 않습니다. 시스템 정비 전 모든 어댑터를 물리적으로 분리하고, 멀티미터 DC 모드로
    1 V 미만임을 계측 확인한 후 접근합니다.'
  worked_examples:
  - '예제 1: FSR ADC 출력 계산. 센서 저항이 10 kΩ이고 분압 저항이 10 kΩ일 때, OpenCR ADC(3.3 V 기준) 전압은
    1.65 V입니다. 12-bit ADC는 4095 * (1.65/3.3) ≈ 2047의 디지털 값을 출력합니다 [S15, S26].'
  - '예제 2: 퓨즈 용량 결정. XM430-W350-T 스톨 전류는 2.3 A입니다 [S14]. 4대 분기 시 최대 부하 9.2 A는 10 A
    퓨즈 정격 미만이므로 적절하며, 배선 및 어댑터 부하를 보호합니다 [S14, S25].'
  lab:
    title: OpenCR 기반 액추에이터 및 FSR 센서 연동
    steps:
    - 모든 전원 어댑터를 벽면 콘센트에서 물리적으로 제거합니다.
    - OpenCR 3.3 V 센서 레일에 FSR 402와 10 kΩ 저항으로 분압 회로를 구성합니다 [S15, S26].
    - 각 액추에이터 그룹별 독립 퓨즈 홀더와 커넥터를 배선도에 따라 조립합니다 [S7, S24].
    - 멀티미터를 DC 전압 모드로 설정하고 전원 분기 회로의 절연 상태를 계측합니다.
    - 안전 교육에 따라 전원을 순차 인가하고 DYNAMIXEL Wizard 2.0으로 액추에이터 응답을 확인합니다 [S14, S15].
    safety:
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
    - 전원 인가 중에는 절대로 로봇 손 가동 범위에 손을 넣지 않습니다.
    - 퓨즈는 과전류 보호용이며 계획 정지 수단이 아님을 명심합니다.
    - 작업 중 충격 방지 보안경을 항상 착용합니다.
    deliverables:
    - 전압 분압 회로 배선 사진
    - OpenCR ADC 센서 데이터 취득 로그
    - 절연 전원 분기 전압 측정 기록
  assignment:
    title: 제어 시스템 분석 보고서
    deliverables:
    - 구성된 전원 분기별 부하 전류 합산 계산서
    - 센서 힘에 따른 ADC 값 상관관계 그래프
    - 시스템 안전 정지 절차 설명서
    rubric:
    - 전원 격리 원칙 준수 여부(병렬 연결 금지 등)
    - OpenCR ADC 회로 구성의 정확성
    - 액추에이터 스톨 전류 대비 퓨즈 정격의 적절성
  quiz:
  - question: FSR 센서의 저항이 증가하면 분압 회로의 OpenCR ADC 입력 전압은 어떻게 변하는가?
    choices:
    - 상승한다
    - 하강한다
    - 변화 없다
    answer_index: 1
    explanation: FSR 저항이 증가하면 분압 회로에서 센서 측 전압 강하가 커져 OpenCR 입력 전압은 하강합니다.
  - question: 시스템 정비 전 안전한 접근 방법은 무엇인가?
    choices:
    - 소프트웨어로 모터를 정지시킨다.
    - 3개 절연 전원 어댑터를 물리적으로 분리하고 멀티미터로 1 V 미만 확인 후 접근한다.
    - 퓨즈를 뽑아 전원을 차단한다.
    answer_index: 1
    explanation: 물리적 전원 분리와 계측 확인만이 무전원 상태를 보장하는 안전 절차입니다.
  completion_criteria:
  - 3개 독립 전원 분기의 퓨즈 회로 조립 완료
  - OpenCR ADC를 통한 FSR 값 취득 성공
  - 모든 실습 시 안전 계측 절차 준수 확인
  source_ids:
  - S5
  - S15
  - S14
  - S6
  - S26
  - S16
  - S24
  - S25
  - S7
- id: mod-3
  slug: mechanical-design
  phase_id: phase-2
  title: 로봇손 기구 설계
  estimated_hours: 12.0
  prerequisites:
  - mod-2
  objectives:
  - 로봇손 기구 설계의 기본 원리와 언더액추에이티드(underactuated) 메커니즘을 이해한다.
  - 텐던 구동 방식의 강점과 설계 고려 사항을 파악한다.
  - CAD 도구를 활용하여 로봇손의 링크 및 프레임을 설계하고 최적화한다.
  - 무급유 슬리브 베어링과 고강도 텐던을 활용한 기구학적 설계를 적용한다.
  theory_markdown: "## 로봇손 기구 설계 기초\n\n정교한 5지 로봇손 설계는 기능적 효율성과 기계적 복잡성 사이의 균형을 맞추는\
    \ 과정입니다. 최근 연구에 따르면, 언더액추에이티드(underactuated) 메커니즘은 적은 수의 액추에이터로도 복잡한 형상의 물체를 효과적으로\
    \ 파지할 수 있게 합니다 [S3, S4].\n\n### 1. 언더액추에이티드 메커니즘\n언더액추에이티드 손은 관절의 자유도보다 구동기의 수가\
    \ 적은 구조입니다. 이는 기구학적 차동(differential) 메커니즘을 통해 손가락의 순응적(adaptive) 파지를 가능하게 하며,\
    \ 물체의 형상에 따라 손가락이 자동으로 정렬되도록 합니다 [S3, S4].\n\n### 2. 텐던 구동(Tendon-Driven) 방식\n\
    텐던 구동은 모터의 회전 운동을 장력으로 변환하여 손가락 마디에 전달합니다. \n- **설계 시 주의사항:** 텐던은 반복적인 굽힘에도 변형이\
    \ 적어야 하므로 Dyneema SK78과 같은 고강도 저신율 섬유가 사용됩니다 [S17].\n- **유지관리:** 마찰을 최소화하기 위해\
    \ 캡스턴 모서리를 라운딩 처리해야 하며, 무급유 폴리머 슬리브 베어링(예: JSM-0810-10)을 활용하여 유격과 마찰을 관리합니다 [S18].\n\
    \n### 3. 소재 및 체결\nFDM 3D 프린팅을 사용하는 경우, 탄소섬유가 함유된 PC 필라멘트(PC-CF)는 높은 강성과 치수 안정성을\
    \ 제공합니다 [S20]. 반복적인 분해 조립이 필요한 위치에는 황동 열압입 인서트(예: HTBI-M3-BR)를 사용하여 플라스틱 소재의 내구성을\
    \ 보완합니다 [S22]."
  worked_examples:
  - '예제 1: 텐던 구동의 자유도 계산

    - 관절 수(n)가 3개이고 구동기 수(m)가 1개인 경우, 자유도 f = n - m = 2입니다. 이는 1개의 텐던으로 전체 관절이 굽혀지되,
    순응적 파지가 가능함을 의미합니다.'
  - '예제 2: 인서트 너트 체결 설계

    - PC-CF 출력물에 HTBI-M3-BR 인서트를 삽입할 때, 권장 구멍 지름은 4mm입니다 [S22]. 따라서 CAD 설계 시 해당 구멍의
    지름을 4.0mm로 설정해야 합니다.'
  lab:
    title: 로봇손 링크 CAD 설계 및 조립
    steps:
    - CAD 소프트웨어를 사용하여 5지 로봇손의 손가락 링크와 손바닥 프레임을 모델링한다.
    - 무급유 베어링 JSM-0810-10이 들어갈 하우징의 내경을 10mm로 설계한다 [S18].
    - 열압입 인서트 HTBI-M3-BR을 위한 4mm 파일럿 홀을 배치한다 [S22].
    - Dyneema SK78 텐던이 통과할 캡스턴 모서리에 라운딩 처리(최소 R 0.5mm)를 적용한다 [S17].
    - 출력물 슬라이싱 후 탄소섬유 PC 필라멘트로 3D 프린팅을 수행한다(경화강 노즐 필수) [S20].
    safety:
    - 경화강 노즐 및 고온 베드 사용 시 화상 주의(최대 110℃) [S20].
    - 3D 프린팅 후 출력물 가공(드릴, 샌딩) 시 충격 방지 보안경 반드시 착용.
    - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다.
    deliverables:
    - 설계 완료된 링크 및 프레임 CAD 파일
    - 조립도 및 체결 부위(M3 캡스크루 위치) 도면
    - 최종 출력물의 중량 및 치수 검증 기록
  assignment:
    title: 로봇손 기구 설계 보고서
    deliverables:
    - 설계 의도가 포함된 기구 설계서
    - 부품 목록(BOM) 및 설계 근거
    - 텐던 장력 전달 경로 분석 도면
    rubric:
    - 언더액추에이티드 원리에 대한 이해도 및 기구 설계 반영 여부
    - 지정된 표준 부품(베어링, 인서트, 나사 등)의 정확한 적용 여부
    - 제작 가능한 공차와 체결 방식의 합리성
  quiz:
  - question: 언더액추에이티드 로봇손의 핵심적인 장점은 무엇입니까?
    choices:
    - 각 관절마다 모터를 배치하여 정밀도를 극대화한다.
    - 적은 수의 액추에이터로 형상에 순응하는 파지가 가능하다.
    answer_index: 1
    explanation: 언더액추에이티드 메커니즘은 차동 기구 등을 통해 적은 모터 수로도 물체 형상에 순응하는 파지를 수행합니다.
  - question: 텐던 구동 로봇손 설계 시 캡스턴 모서리 처리가 중요한 이유는?
    choices:
    - 텐던의 마찰 및 손상을 줄이기 위해서이다.
    - 텐던의 장력을 인위적으로 높이기 위해서이다.
    answer_index: 0
    explanation: 텐던은 반복 굽힘과 마찰에 노출되므로, 날카로운 모서리는 텐던의 조기 파단을 유발할 수 있습니다.
  completion_criteria:
  - 로봇손 기구 설계 CAD 데이터 및 조립도 제출
  - 지정된 BOM 부품(베어링, 인서트 등)이 포함된 설계 확인
  - 설계 보고서의 기구학적 분석 타당성 검토 완료
