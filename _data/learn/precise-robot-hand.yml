- id: m10
  slug: final-report
  phase_id: p3
  title: 최종 보고서 작성
  estimated_hours: 10.0
  prerequisites:
  - m9
  objectives:
  - 로봇 손 개발 프로젝트의 성과를 종합적으로 정리하고 기술적 의사결정을 문서화한다.
  - 구조, 제어, 전자 하드웨어 시스템의 통합 검증 결과를 분석한다.
  - 기술 문서 작성 표준을 준수하여 엔지니어링 리포트를 완성한다.
  theory_markdown: '## 기술 문서화의 중요성 및 구성

    엔지니어링 프로젝트의 최종 보고서는 시스템의 설계 의도, 구현 과정, 성능 검증 및 개선 방향을 담는 핵심 산출물입니다. Ruka-v2와 같은
    오픈소스 로봇 손 프로젝트에서, 최종 보고서는 시스템 복제 가능성(Reproducibility)을 확보하는 데 필수적입니다 [S9].


    ### 1. 설계 의도 및 변경 이력

    설계의 각 단계에서 수행된 선택의 근거를 기술합니다. 예를 들어, 텐던 시스템의 경우 LIROS Dyneema SK78과 같은 고강도 섬유를
    선택한 이유(파단 하중 230 daN, 작동 신율 1% 미만)를 명시하여 재현성을 보장합니다 [S16].


    ### 2. 하드웨어 통합 및 안전 관리

    시스템의 핵심인 전원 분기 및 제어 보드 통합 내용을 정리합니다. 3개의 MEAN WELL GST160A12-R7B 어댑터를 이용해 11.5
    A 독립 분기를 구성하고, 각 분기마다 10 A ATOF 퓨즈를 사용하여 과전류 보호를 수행한 과정을 명시합니다 [S15, S24]. OpenCR
    1.0 제어 보드를 사용하여 RS-485/TTL 통신을 통합하고, 12 V 액추에이터 전원과 센서 회로를 물리적으로 분리한 구조를 명확히 기술해야
    합니다 [S13].


    ### 3. 검증 데이터 분석

    손끝 힘 감지 센서(FSR 402)를 이용한 파지 피드백 데이터와 로봇 제어 정책의 성능 평가 결과를 포함합니다 [S12]. 통계적 유의성을
    바탕으로 이전 버전(Ruka) 대비 개선된 성능(작업 시간 51.3% 단축 등)을 보고합니다 [S9].'
  worked_examples:
  - '예시 1 (데이터 요약): ''본 프로토타입은 총 11개의 XM430-W350-T 액추에이터를 사용하였으며, 3개의 분리된 12 V 전원
    분기를 통해 총 25.3 A의 스톨 전류 요구사항을 안전하게 만족함. 각 분기별 10 A ATOF 퓨즈와 Littelfuse 0AFH0001Z
    홀더를 적용하여 전기적 보호를 완료함 [S11, S15, S23, S24].'''
  - '예시 2 (설계 근거): ''구조 프레임 제작에 사용된 Prusament PC-CF 필라멘트는 285°C의 노즐 온도와 110°C의 베드
    온도 환경에서 제작되었으며, 4.4×5.8 mm 규격의 M3 황동 열압입 인서트를 통해 반복 조립의 내구성을 확보함 [S19, S21].'''
  lab:
    title: 최종 시스템 통합 검증 및 문서화 실습
    steps:
    - 각 액추에이터 분기(4대/4대/3대)의 DC 전압이 12 V임을 멀티미터로 측정 확인한다.
    - 모든 하드웨어 체결 상태(M3 캡스크루 등)와 텐던 장력을 최종 점검한다.
    - 시스템의 구동 시험(무부하)을 통해 제어 명령 전달 및 센서 피드백을 기록한다.
    - 수집된 성능 지표를 바탕으로 최종 보고서 초안을 작성한다.
    safety:
    - 비상시 3개의 절연 전원 어댑터를 물리적으로 분리하고, 멀티미터 DC 전압 모드로 모든 분기가 1 V 미만임을 확인한 후 접근한다.
    - 전원 인가 중에는 가동 범위에 절대 손을 넣지 않으며, 반드시 고정 지그에서 시험한다.
    - 충격 방지 작업용 보안경을 착용한다.
    deliverables:
    - 시스템 통합 검증 체크리스트
    - 최종 성능 시험 데이터 테이블
    - 완성된 프로젝트 최종 보고서
  assignment:
    title: 5지 로봇 손 프로젝트 최종 보고서 제출
    deliverables:
    - 프로젝트 설계 문서(CAD, BOM, 배선도 포함)
    - 제어 펌웨어 및 알고리즘 소스 코드
    - 성능 검증 보고서(파지 시험, 내구 시험 결과)
    - 최종 로봇 손 프로토타입 영상 및 기술 요약
    rubric:
    - BOM 항목이 시스템 Truth와 정확히 일치하며 사양이 기술되었는가?
    - 전원 및 안전 분기 구성이 권장 지침을 준수하였는가?
    - 설계 의도와 검증 데이터가 논리적이고 정량적으로 기술되었는가?
  quiz:
  - question: 로봇 손의 각 액추에이터 전원 분기를 구성할 때 퓨즈 사용에 대한 올바른 지침은 무엇인가?
    choices:
    - 분기별로 10 A ATOF 퓨즈를 사용하여 과전류를 방지한다.
    - 모든 분기의 양(+) 출력을 하나로 연결하여 퓨즈 하나로 통합 관리한다.
    - 퓨즈는 전기적 보호가 아닌 계획 정지 장치로 활용한다.
    - 전원 어댑터 자체에 퓨즈가 있으므로 별도의 분기 퓨즈는 불필요하다.
    answer_index: 0
    explanation: 각 액추에이터 분기는 독립적으로 퓨즈 보호되어야 하며, 10 A ATOF 퓨즈가 적절한 규격입니다. 양(+) 출력의
      통합은 절대 금지됩니다.
  - question: 시스템 안전을 위해 기기 접근 전 확인해야 할 가장 중요한 절차는 무엇인가?
    choices:
    - 멀티미터의 저항 모드로 도통을 확인한다.
    - 소프트웨어적으로 모터를 정지시킨 후 즉시 접근한다.
    - 3개의 어댑터를 물리적으로 분리하고, 멀티미터 DC 전압 모드로 1 V 미만임을 확인한다.
    - 계획 정지 버튼을 누르고 접근한다.
    answer_index: 2
    explanation: 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
      반드시 물리적 분리 후 DC 전압 측정으로 에너지가 없음을 확인해야 합니다.
  completion_criteria:
  - 최종 보고서가 요구된 모든 항목(설계, 제작, 검증)을 포함하여 제출됨.
  - 모든 하드웨어 사양 및 B1-B10, B-SHAFT, B-FASTENER, B-WIRING-FUSE-HOLDER, B-SENSOR-RESISTOR
    부품 항목이 BOM 시스템 Truth와 일치함.
  - 실험 기록과 데이터가 안전 수칙을 준수하여 작성되었음.
