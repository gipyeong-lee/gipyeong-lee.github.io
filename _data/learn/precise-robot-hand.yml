modules:
- id: M1
  slug: intro-robotics-foundations
  phase_id: P1
  title: 로봇 공학 개론 및 수학적 기초
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - 로봇 공학의 정의 및 산업적 중요성을 이해한다.
  - 로봇 메커니즘을 설명하는 수학적 기초(좌표계 및 회전 변환)를 습득한다.
  - 로봇 제어의 핵심 이론인 기구학(Kinematics)과 동역학(Dynamics)의 기본 개념을 파악한다.
  - 로봇 시스템 설계 시 고려해야 할 안전 표준(ISO 10218)의 개념을 이해한다.
  theory_markdown: '## 로봇 공학 개론


    로봇 공학(Robotics)은 기계공학, 전기공학, 컴퓨터 공학, 인공지능이 융합된 다학제적 분야로, 자동화된 작업을 자율 또는 반자율적으로
    수행하는 기계를 설계, 제작, 제어하는 학문이다 [S3]. 산업용 로봇은 1960년대 등장 이후 [S1], 현대 제조업에서 생산성 향상, 정밀도
    제고, 비용 절감을 실현하는 핵심 요소가 되었다 [S3].


    ### 로봇의 구성과 동작

    로봇은 주로 베이스(Base)와 이와 연결된 관절(Joint) 및 링크(Link)로 구성된 매니퓰레이터(Manipulator) 형태를 취한다
    [S13]. 로봇의 동작을 제어하기 위해서는 다음의 수학적 도구들이 필수적이다 [S1]:


    1. **공간 변환(Spatial Transformations):** 로봇의 각 링크와 대상 물체의 위치 및 방향을 기술하기 위해 좌표계(Frame)를
    설정하고, 하나의 좌표계에서 다른 좌표계로의 이동 및 회전을 행렬 연산으로 정의한다 [S1].

    2. **기구학(Kinematics):** 로봇의 관절 각도(Joint Angles)를 기반으로 끝단장치(End-effector)의 위치와
    방향을 계산하는 **순기구학(Forward Kinematics)**과, 원하는 끝단 위치를 달성하기 위한 관절 각도를 계산하는 **역기구학(Inverse
    Kinematics)**으로 나뉜다 [S1, S7].

    3. **동역학(Dynamics):** 로봇의 움직임을 유발하는 힘과 토크, 그리고 그 결과인 가속도 사이의 관계를 뉴턴-오일러 또는 라그랑주
    방정식을 통해 해석한다 [S1, S15].


    ### 로봇 안전 표준

    산업 현장에서 로봇과 인간의 상호작용이 증가함에 따라 **ISO 10218**은 필수적인 안전 표준으로 자리 잡았다. 이는 로봇 설계(Part
    1)와 시스템 통합(Part 2)에 대한 지침을 제공하며, 협동 로봇(Cobot) 운영 시의 안전 요구사항을 포함한다 [S33, S34].'
  worked_examples:
  - '**예제 1: 2차원 회전 행렬 계산**

    좌표계 {B}가 좌표계 {A}에 대해 z축으로 θ=30° 회전되어 있을 때, {B}에서 정의된 점 P^B = [1, 2]^T를 {A}로 변환하라.

    *풀이:* 회전 행렬 R_B^A = [[cosθ, -sinθ], [sinθ, cosθ]] = [[0.866, -0.5], [0.5, 0.866]].

    P^A = R_B^A * P^B = [[0.866, -0.5], [0.5, 0.866]] * [1, 2]^T = [-0.134, 2.232]^T.'
  - '**예제 2: 산업용 로봇의 비용 효과성 분석**

    로봇 도입 비용이 10% 감소하고 인간 노동 비용이 5% 증가할 때, 로봇 자동화로 전환되는 공정의 비율 추이를 정성적으로 분석하시오.

    *풀이:* 로봇의 가용성과 효과성(정밀도, 속도)이 비용과 함께 개선될 때, 자동화는 경제적 합리성을 갖게 된다. 특히 반복 작업이 많은 용접이나
    재료 처리 분야에서 로봇의 정량적 효율성(1990년대 기준)이 증가하며 성장을 견인하였다 [S1].'
  lab:
    title: 로봇좌표계 설정 및 기본 동작 시뮬레이션
    steps:
    - CAD 소프트웨어를 사용하여 5지 로봇손의 링크 길이와 관절 위치를 설계한다.
    - 설계된 좌표계에 따라 순기구학 방정식(Forward Kinematics)을 코드로 구현한다.
    - DYNAMIXEL 스마트 액추에이터의 제어 테이블(Control Table)을 확인하고 RS-485 통신을 설정한다 [S36].
    - 시뮬레이션을 통해 특정 관절 각도에서의 끝단 위치를 검증한다.
    safety:
    - 실습 중 끼임 방지를 위해 로봇 작동 반경 내 신체 부위 접근을 엄격히 제한한다 [S36].
    - 전원 공급 시 보안경을 착용하고, 비상 정지 버튼을 항상 근처에 배치한다.
    - 저전압 벤치 전원을 사용하고 전류 제한 설정을 확인하여 과전류를 방지한다.
    deliverables:
    - 좌표계 정의가 포함된 로봇 설계 CAD 도면
    - 순기구학 구현 Python 코드
    - 시뮬레이션 결과 보고서
  assignment:
    title: 로봇 공학 기초 설계 보고서
    deliverables:
    - 로봇 손가락의 3개 관절에 대한 순기구학 행렬 계산식
    - 설계된 로봇의 자유도(DOF) 분석 보고서
    - ISO 10218 안전 표준을 준수하기 위한 안전 대책 기구 기술서
    rubric:
    - 수학적 모델링(좌표 변환 및 기구학)의 정확성
    - 설계 보고서의 논리적 구조 및 기술적 용어 사용의 적절성
    - 안전 표준 준수를 위한 설계 반영의 현실성
  quiz:
  - question: 로봇 공학에서 순기구학(Forward Kinematics)이 수행하는 역할은 무엇인가?
    choices:
    - 끝단장치의 위치를 알 때 관절 각도를 계산한다.
    - 관절 각도를 알 때 끝단장치의 위치와 방향을 계산한다.
    - 로봇의 동역학적 힘을 계산한다.
    - 로봇의 경로를 최적화한다.
    answer_index: 1
    explanation: 순기구학은 관절 변수(각도)를 입력으로 하여 끝단장치의 위치와 방향(Pose)을 계산하는 과정입니다.
  - question: ISO 10218 표준이 다루는 주된 내용은 무엇인가?
    choices:
    - 로봇 프로그래밍 언어의 표준화
    - 인공지능 알고리즘의 최적화
    - 산업용 로봇의 설계 및 시스템 통합 안전 요구사항
    - 로봇 소프트웨어의 배포 방법
    answer_index: 2
    explanation: ISO 10218은 산업용 로봇의 안전한 설계(Part 1)와 통합(Part 2)에 대한 국제 표준입니다 [S33,
      S34].
  - question: 로봇 매니퓰레이터의 설계 시 관절(Joint)과 링크(Link)의 기하학적 배치를 결정하는 데 활용되는 수학적 도구는?
    choices:
    - 통계학적 회귀 분석
    - 확률론적 모델링
    - 공간 좌표 변환(행렬 연산)
    - 미분 방정식의 수치 해석
    answer_index: 2
    explanation: 로봇 링크와 관절의 위치 및 방향을 기술하기 위해서는 회전 및 이동 행렬을 사용한 공간 좌표 변환이 핵심적입니다 [S1].
  completion_criteria:
  - 로봇 공학 기초 수학적 개념 이해도 평가 통과
  - 순기구학 모델링 연습문제 80% 이상 정답
  - 실험 데이터 분석 및 결과 보고서 제출 완료
  - ISO 10218 표준의 핵심 조항에 대한 퀴즈 통과
  source_ids:
  - S1
  - S2
- id: M2
  slug: spatial-transformations
  phase_id: P1
  title: 공간 변환 및 기구학
  estimated_hours: 8.0
  prerequisites:
  - M1
  objectives:
  - 공간상에서 물체의 위치와 방향을 나타내는 수학적 표현(좌표계와 회전 행렬)을 이해한다.
  - 동차 변환 행렬(Homogeneous Transformation Matrix)을 사용하여 다물체 시스템의 관계를 기술한다.
  - 로봇 관절의 기구학적 구조와 자유도(DOF)의 개념을 학습한다.
  - 산업용 로봇 핸드의 손가락 좌표계 할당 및 변환 과정을 실습한다.
  theory_markdown: '### 1. 공간 변환의 기초

    로봇 공학에서 모든 물체(링크, 공구, 환경)의 위치와 방향은 3차원 공간 내에서 정의되어야 합니다 [S2, S9]. 위치는 3차원 벡터(x,
    y, z)로, 방향은 3x3 회전 행렬(Rotation Matrix) R로 표현합니다.


    ### 2. 동차 변환 행렬 (Homogeneous Transformation Matrix)

    회전과 평행 이동을 하나의 4x4 행렬로 통합한 것이 동차 변환 행렬 T입니다 [S2].

    \[ T = \begin{bmatrix} R & P \\ 0 & 1 \end{bmatrix} \]

    여기서 R은 3x3 회전 행렬, P는 3x1 위치 벡터입니다 [S2]. 이 행렬은 좌표계 간의 변환을 연쇄적으로 곱하여 계산할 수 있어 로봇
    기구학 해석에 필수적입니다 [S9].


    ### 3. 자유도와 기구학적 체인

    로봇 핸드는 다수의 링크가 관절로 연결된 기구학적 체인입니다. 로봇의 자유도(Degrees of Freedom, DOF)는 로봇의 모든 부품이
    독립적으로 움직일 수 있는 독립적 좌표의 수입니다 [S13]. 인간형 로봇 손은 대개 다수의 관절을 가지며, 이를 효과적으로 제어하기 위해
    텐션(Tendon) 구동 및 언더액추에이션(Underactuation) 기술이 사용됩니다 [S12, S13].'
  worked_examples:
  - '예제 1: 2차원 평면에서 좌표계 {B}가 {A}를 기준으로 x축으로 2, y축으로 3만큼 이동하고 90도 회전했을 때의 변환 행렬을 구하시오.
    R = [0 -1 0; 1 0 0; 0 0 1], P = [2, 3, 0]이므로 T = [0 -1 0 2; 1 0 0 3; 0 0 1 0;
    0 0 0 1]입니다.'
  - '예제 2: 텐션 구동 손가락의 관절 위치 해석. 만약 손가락이 3개의 관절을 가진다면, 각 관절의 각도 \(\theta_1, \theta_2,
    \theta_3\)에 따른 최종 말단(tip) 좌표를 T_0^3 = T_0^1 * T_1^2 * T_2^3 행렬 곱으로 계산합니다.'
  lab:
    title: 로봇 핸드 모델링 및 좌표계 설정 실습
    steps:
    - 제공된 로봇 핸드 CAD 모델을 분석하여 각 관절(MCP, PIP, DIP)의 위치를 확인한다.
    - 각 링크에 대해 DH(Denavit-Hartenberg) 파라미터를 사용하여 국부 좌표계를 할당한다.
    - Python을 사용하여 각 관절의 동차 변환 행렬을 계산하는 스크립트를 작성한다.
    - 작성한 코드를 검증하여 특정 관절 각도에서의 손가락 끝 위치를 시뮬레이션한다.
    safety:
    - 납땜 인두 사용 시 화상 주의 (보안경 착용)
    - 전동 공구 사용 시 끼임 방지 설계 확인
    - 벤치 전원 사용 시 전류 제한 설정 필수
    deliverables:
    - 좌표계 할당 도면
    - 변환 행렬 계산 Python 스크립트 코드
    - 시뮬레이션 결과 보고서
  assignment:
    title: 5지 로봇 핸드 기구학 해석 프로젝트
    deliverables:
    - 선택한 로봇 핸드 구조에 대한 DH 파라미터 테이블
    - 전체 핸드의 기구학적 모델링 보고서 (변환 행렬 포함)
    - Python 기반 시뮬레이션 결과
    rubric:
    - 좌표계 할당의 적절성 (30%)
    - DH 파라미터 추출의 정확성 (30%)
    - 변환 행렬 도출 및 코드 구현 (30%)
    - 보고서의 논리적 구성 및 시각화 (10%)
  quiz:
  - question: 동차 변환 행렬(Homogeneous Transformation Matrix)의 크기는 무엇인가?
    choices:
    - 2x2
    - 3x3
    - 4x4
    - 6x6
    answer_index: 2
    explanation: 동차 변환 행렬은 회전(3x3)과 이동(3x1)을 포함하여 4x4 행렬로 정의됩니다.
  - question: 로봇 핸드 설계 시 '언더액추에이션(Underactuation)'의 장점은?
    choices:
    - 제어가 매우 복잡해진다.
    - 제어 시스템의 복잡도를 낮추고 비용을 절감한다.
    - 관절의 개수가 항상 무한하다.
    - 항상 모든 관절을 독립적으로 제어해야 한다.
    answer_index: 1
    explanation: 언더액추에이션은 액추에이터의 수를 자유도보다 적게 사용하여 구조를 단순화하고 비용을 절감하는 기술입니다.
  completion_criteria:
  - 각 관절에 대한 좌표계 할당을 완료함.
  - 변환 행렬 도출 과정을 이해하고 계산함.
  - 제출된 Python 스크립트가 정상적으로 작동함.
  source_ids:
  - S2
  - S9
- id: M3
  slug: dynamics-control-intro
  phase_id: P1
  title: 동역학 및 제어 시스템 개요
  estimated_hours: 8.0
  prerequisites:
  - M2
  objectives:
  - 로봇 공학의 정의와 산업용 매니퓰레이터의 기본 구조를 이해한다 [S2, S3].
  - 강체 변환(Spatial Transformations)과 순운동학(Forward Kinematics)의 개념을 파악한다 [S2, S10].
  - 로봇 동역학(Dynamics)의 기본 원리와 제어 시스템의 역할을 설명할 수 있다 [S1, S8].
  - 정교한 로봇손 구현을 위한 언더액추에이션(Underactuation)과 촉각 센서의 통합 필요성을 인식한다 [S12, S14].
  theory_markdown: '## 1. 로봇 공학 개요

    로봇 공학은 기계 공학, 전자 공학, 컴퓨터 과학이 융합된 분야로, 자율적 또는 반자율적으로 작업을 수행하는 기계를 설계, 구성 및 운용하는
    것을 목적으로 한다 [S3]. 산업용 로봇은 반복적인 용접이나 조립 작업에서 인간보다 높은 정밀도와 반복성을 제공하며, 최근에는 인공지능과
    결합하여 복잡한 환경에서의 지능적 작업으로 그 영역이 확장되고 있다 [S2, S3].


    ## 2. 매니퓰레이터의 역학 및 제어

    로봇 매니퓰레이터의 해석은 크게 다음과 같은 단계로 구성된다 [S7, S8]:

    1. **공간 변환 (Spatial Transformations):** 로봇 링크의 위치와 방향을 3차원 공간 내에서 수학적으로 기술한다 [S2].

    2. **운동학 (Kinematics):** 관절의 각도와 위치를 기반으로 로봇 말단(End-effector)의 위치를 계산한다(순운동학)
    [S2]. 반대로 원하는 위치를 얻기 위한 관절 각도를 계산하는 것이 역운동학이다 [S2, S10].

    3. **동역학 (Dynamics):** 힘, 토크, 질량, 가속도 간의 관계를 다루며, 로봇의 움직임을 생성하거나 제어하기 위해 필요한 힘을
    계산한다 [S1, S9].

    4. **제어 (Control):** 원하는 궤적을 추종하거나 특정 힘을 인가하기 위한 알고리즘을 설계한다 [S2, S10].


    ## 3. 정교한 로봇손 설계의 도전

    인간의 손은 매우 복잡한 구조로, 다수의 자유도(DOF)를 갖는다 [S13]. 이를 기술적으로 완벽히 모사하는 것은 비용과 복잡성 면에서 어렵다.
    따라서 최신 연구에서는 **언더액추에이션(Underactuation)** 기법을 사용하여 최소한의 액추에이터로 인간과 유사한 파지 적응성을
    구현한다 [S12, S14]. 또한, 촉각 센서(Tactile Sensing)를 통합하여 물체의 미끄러짐을 감지하고 파지력을 능동적으로 제어함으로써
    Dexterous Manipulation(능숙한 조작)을 구현하는 것이 핵심 과제이다 [S12, S15, S19].'
  worked_examples:
  - '예제 1: 2차원 회전 행렬 계산. 관절 각도가 θ일 때, 좌표계 회전을 기술하는 행렬 R을 유도하시오. R = [[cos θ, -sin
    θ], [sin θ, cos θ]]. 이는 로봇 팔의 방향을 기술하는 가장 기초적인 변환이다 [S2].'
  - '예제 2: 단순 동역학. 질량이 m인 강체가 가속도 a로 운동할 때 필요한 힘 F를 뉴턴의 제2법칙(F=ma)으로 계산하시오. 로봇 관절의
    토크는 이 식을 확장한 동역학 모델(τ = M(q)q'''' + V(q,q'') + G(q))을 통해 계산된다 [S1, S9].'
  lab:
    title: 로봇 매니퓰레이터 모델링 및 제어 입문
    steps:
    - 제공된 로봇 팔 시뮬레이터(또는 키트)의 각 관절 위치와 링크 길이를 측정하여 CAD 모델을 확인한다.
    - DH(Denavit-Hartenberg) 파라미터를 사용하여 각 링크의 좌표계를 설정한다.
    - 간단한 순운동학 코드를 작성하여 관절 각도 입력에 따른 끝점 위치를 계산한다.
    - 입력 전압에 따른 모터 토크 변화를 멀티미터로 측정하고 제어 코드를 통해 위치를 제어해 본다.
    safety:
    - 항상 보안경을 착용한다.
    - 저전압 벤치 전원을 사용하고 전류 제한을 설정하여 회로 과부하를 방지한다.
    - 모터 구동 중 회전 부위에 손가락이 끼이지 않도록 주의한다.
    - 비상 전원 차단 장치를 항상 손이 닿는 곳에 둔다.
    deliverables:
    - 순운동학 계산서 및 시뮬레이션 결과 데이터
    - 실습 중 측정한 모터 토크 데이터 및 제어 소스 코드
    - 안전 수칙 준수 서명지
  assignment:
    title: 로봇 매니퓰레이터의 동역학 및 제어 설계 계획서
    deliverables:
    - 로봇 매니퓰레이터의 기구학적 구조(DH 파라미터 포함)를 기술한 보고서
    - 선택한 액추에이터의 사양(Torque, RPM 등)에 대한 정당성 검토서
    - 간단한 궤적 계획(Trajectory Planning)을 위한 제어 알고리즘 설계 초안
    rubric:
    - 기구학적 해석의 정확성 및 논리적 타당성 (40%)
    - 선택한 부품(액추에이터, 센서) 사양의 목적 부합성 (30%)
    - 제어 알고리즘의 구성 및 적용 가능성 (30%)
  quiz:
  - question: 로봇 매니퓰레이터에서 순운동학(Forward Kinematics)이 의미하는 바는 무엇입니까?
    choices:
    - 끝점의 위치를 기반으로 관절 각도를 계산하는 것
    - 관절 각도를 기반으로 로봇 끝점의 위치와 방향을 계산하는 것
    - 로봇의 가속도를 제어하는 알고리즘
    - 센서 데이터를 수집하는 과정
    answer_index: 1
    explanation: 순운동학은 입력된 관절 변수(각도)를 바탕으로 로봇 말단의 공간 내 위치와 방향을 계산하는 기구학적 과정입니다.
  - question: 로봇손 설계에서 '언더액추에이션(Underactuation)'을 사용하는 주요 이유는 무엇입니까?
    choices:
    - 모든 관절에 모터를 부착하여 정밀도를 최대화하기 위해
    - 제어 시스템의 복잡도를 높여 높은 가격을 유지하기 위해
    - 최소한의 액추에이터로 인간의 손과 유사한 파지 적응성을 구현하기 위해
    - 로봇의 무게를 증가시키기 위해
    answer_index: 2
    explanation: 언더액추에이션은 적은 수의 모터로 복잡한 손 구조를 제어하여 비용과 무게를 줄이면서도 물체에 대한 적응적인 파지(Adaptive
      Grasping)를 가능하게 합니다.
  - question: 로봇 동역학에서 주로 다루는 요소가 아닌 것은 무엇입니까?
    choices:
    - 질량 (Mass)
    - 힘과 토크 (Force and Torque)
    - 가속도 (Acceleration)
    - 프로그래밍 언어의 구문 (Programming Syntax)
    answer_index: 3
    explanation: 동역학은 힘, 토크, 질량, 관성, 가속도 간의 물리적 관계를 다루며, 프로그래밍 언어의 구문은 제어 시스템 구현을
      위한 수단일 뿐 동역학적 요소는 아닙니다.
  completion_criteria:
