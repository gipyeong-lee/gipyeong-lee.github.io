  - S25
  - S26
- id: M8
  slug: final-validation
  phase_id: PH3
  title: 파지 성능 시험 및 최종 보고
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - 로봇손의 파지 성능을 정량적으로 측정하는 시험 절차를 이해한다.
  - 힘 감지 센서(FSR)와 액추에이터 데이터를 활용하여 파지 안정성을 분석한다.
  - 실험 데이터 기반의 최종 결과 보고서 작성 능력을 함양한다.
  - 전원 분기별 독립성을 유지하며 안전하게 시스템을 종료 및 분해한다.
  theory_markdown: '로봇손의 성능 검증은 설계된 메커니즘이 실제 환경에서 목표한 파지 기능을 수행하는지 확인하는 필수 과정이다 [S2].
    파지 성능 시험은 주로 파지력의 일관성, 객체 분류 정확도, 동작 반복성을 평가한다 [S2]. 본 프로젝트의 5지 로봇손은 손끝의 FSR 402
    센서를 통해 접촉력을 실시간으로 피드백받으며, 이는 0.2 N에서 20 N까지 측정 가능하다 [S7].


    전기적 측면에서 검증 시, 액추에이터인 DYNAMIXEL XM430-W350-T의 동작 전류를 모니터링하여 시스템 부하를 확인해야 한다. 각
    액추에이터는 12 V 전압에서 2.3 A의 스톨 전류를 가지므로 [S3], 11대 전체의 피크 전류는 25.3 A에 달한다. 따라서 시스템은
    3개의 독립적인 GST160A12-R7B 전원 어댑터(분기당 11.5 A 정격)로 분산되어 공급되며, 각 분기는 10 A ATOF 퓨즈로 과전류
    보호가 이루어진다 [S16, S26]. 총 34.5 A의 어댑터 정격은 25.3 A의 시스템 피크 전류를 충분히 수용한다.'
  worked_examples:
  - '예제 1: FSR 출력 전압 계산. FSR 402 센서가 10 kΩ 분압 저항과 연결되어 있을 때, 센서 저항이 5 kΩ으로 감소하면 ADC
    입력 전압은 V_adc = V_ref * (R_fixed / (R_fsr + R_fixed)) = 3.3 V * (10 kΩ / (5 kΩ
    + 10 kΩ)) = 2.2 V가 된다. 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격
    있는 안전 전문가의 별도 검토가 필요하다 [S14, S27].'
  - '예제 2: 전원 분기 안정성 확인. 4대, 4대, 3대로 구성된 3개 전원 분기의 최대 부하 전류는 각각 9.2 A, 9.2 A, 6.9
    A이다. 각 분기는 10 A 퓨즈를 통과하므로 정상 동작 시 전류는 퓨즈 정격 미만으로 유지된다 [S3, S26].'
  lab:
    title: 로봇손 파지 시험 및 안전 종료
    steps:
    - 고정 지그에 로봇손을 장착하고 시험 대상 물체를 파지할 준비를 한다.
    - 각 전원 어댑터의 상태를 점검하고 3개 분기를 모두 연결하여 전원을 인가한다.
    - 제어 코드를 실행하여 5지 파지 동작을 수행하고, FSR 센서 데이터를 5초간 샘플링한다.
    - 측정된 힘 데이터와 액추에이터 전류 피드백을 기록하여 파지 성능을 평가한다.
    - 시험 종료 후 시스템을 안전하게 종료한다.
    safety:
    - 작업 시 반드시 보안경을 착용한다.
    - 전원 인가 중에는 손을 가동 범위에 넣지 않는다.
    - 시스템 종료 시 3개의 절연 전원 어댑터를 벽면 콘센트에서 물리적으로 모두 분리한다.
    - 멀티미터를 DC 전압 모드로 설정하여 3개 분기의 전압이 1 V 미만으로 떨어졌는지 확인한 후 조립체에 접촉한다.
    deliverables:
    - 파지 시험 데이터 로그
    - 전력 계측 기록
    - 교정 기록 및 최종 성능 요약 보고서
  assignment:
    title: 최종 프로젝트 결과 보고서 작성
    deliverables:
    - 최종 로봇손 조립 CAD 파일 및 도면
    - 최종 BOM 및 교정 기록
    - 제어 펌웨어 소스 코드
    - 파지 시험 및 내구 시험 결과 보고서
    rubric:
    - BOM과 실제 조립된 시스템의 부품 및 퓨즈 규격 일치성
    - 파지 시험 데이터의 정량적 분석 타당성
    - 안전 절차 준수 및 시스템 구성의 무결성
    - 최종 보고서의 기술적 상세함
  quiz:
  - question: 로봇손 시스템의 안전한 종료 방법으로 옳은 것은?
    choices:
    - 제어기 소프트웨어 종료 명령 후 즉시 손을 조립체에 넣는다.
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터로 1 V 미만임을 확인한다.
    - 퓨즈를 제거하여 전원을 차단한다.
    - 전원 분기 스위치만 끄면 무전원 상태로 간주한다.
    answer_index: 1
    explanation: 본 교과과정에서는 3개의 독립된 절연 전원 어댑터를 물리적으로 분리하고, 전압을 계측하여 1 V 미만인 경우에만 안전한
      상태로 판단합니다.
  - question: 시스템의 피크 전류 25.3 A를 고려한 전원 설계로 적절한 것은?
    choices:
    - 12 V 전원 어댑터 1개를 사용한다.
    - 3개의 12 V 어댑터를 병렬로 연결하여 정격을 높인다.
    - 독립된 3개의 12 V 어댑터를 각각 10 A 퓨즈가 장착된 독립 분기로 사용한다.
    - 분기 없이 하나의 퓨즈로 전체 전류를 보호한다.
    answer_index: 2
    explanation: 병렬 연결은 금지되며, 각 분기는 독립적으로 퓨즈 보호되어야 합니다. 3개의 어댑터는 각각 별도의 퓨즈 분기를 구성합니다.
  completion_criteria:
  - 최종 결과 보고서 제출 및 80점 이상의 평가 획득
  - 시험 결과 데이터의 유효성 검증 완료
  - 시스템 안전 분해 및 무전원 상태 계측 완료
