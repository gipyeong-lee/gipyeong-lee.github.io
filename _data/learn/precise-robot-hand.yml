  title: 제어 알고리즘 구현
  estimated_hours: 12.0
  prerequisites:
  - M3
  - M7
  objectives:
  - DYNAMIXEL 통신 프로토콜 2.0의 구조와 데이터 패킷 형식을 이해한다 [S82].
  - 로봇 손의 각 관절 위치와 속도를 제어하는 PID 제어 이론을 습득한다 [S79].
  - 적응형 구동을 위한 비선형 역학 제어의 기본 개념을 파악한다 [S79].
  - DYNAMIXEL SDK를 사용하여 다축 동기화 제어 코드를 작성한다 [S82].
  theory_markdown: '### 제어 알고리즘 개요

    로봇 손의 정교한 움직임은 서보 모터의 위치, 속도, 토크를 실시간으로 제어함으로써 구현됩니다 [S82]. 제어 시스템의 핵심은 원하는 목표
    지점(Setpoint)과 현재 상태(Process Variable) 사이의 오차를 최소화하는 것입니다 [S79].


    ### PID 제어와 프로토콜

    대부분의 정밀 액추에이터는 내부적으로 PID(Proportional-Integral-Derivative) 제어를 사용하여 구동됩니다 [S79].
    DYNAMIXEL 프로토콜 2.0을 사용하면 모터의 PID 게인(Gain) 값을 원격으로 설정하여 동작 특성을 변경할 수 있습니다 [S82].


    - **P(비례):** 현재 오차에 비례하여 제어량을 결정합니다.

    - **I(적분):** 누적된 오차를 보정하여 정상 상태 오차를 제거합니다.

    - **D(미분):** 오차의 변화율을 이용하여 제어량을 예측하고 진동을 억제합니다.


    ### 시스템 통합

    다축 시스템에서는 각 모터의 명령을 동기화하는 것이 필수적입니다 [S82]. DYNAMIXEL SDK의 `SyncWrite` 명령을 사용하면
    여러 관절의 위치를 단일 패킷으로 동시에 전송하여 관절 간의 간섭을 최소화하고 매끄러운 동작을 구현할 수 있습니다 [S82]. 비선형 역학이
    포함된 अंडर액추에이티드(Underactuated) 시스템의 경우, 에너지 성형(Energy-shaping) 기법을 통해 보다 유연하고 효율적인
    제어가 가능합니다 [S79].'
  worked_examples:
  - '**사례 1: DYNAMIXEL SDK를 이용한 단일 모터 위치 설정**

    DYNAMIXEL SDK를 사용하여 1번 ID를 가진 모터에 위치(Goal Position) 1024를 전송하는 기본 코드 구조를 확인합니다.
    [S82] 패킷에는 헤더, ID, 길이, 명령어, 데이터, 체크섬이 포함되어야 합니다.'
  - '**사례 2: SyncWrite를 이용한 5지 관절 동기화**

    각 손가락 관절의 목표 위치를 리스트로 저장한 뒤, `SyncWrite` 핸들러를 구성하여 5개의 서보 모터에 위치 값을 동시에 명령합니다.
    이는 손가락 전체를 자연스럽게 펴거나 쥐는 동작을 가능하게 합니다 [S82].'
  lab:
    title: 다축 로봇 손 제어 및 튜닝 실험
    steps:
    - 벤치 전원 장치를 12V로 설정하고 전류 제한을 2A로 제한한다.
    - DYNAMIXEL Wizard 2.0을 사용하여 각 모터의 ID를 중복되지 않게 설정한다 [S82].
    - SDK 예제 코드를 사용하여 각 손가락 모터의 가동 범위를 측정하고 하드웨어 제한(Limit) 값을 프로그래밍한다.
    - PID 게인을 단계적으로 조정하여 핑거가 과도한 떨림 없이 목표 지점에 도달하도록 튜닝한다.
    - SyncWrite 함수를 사용하여 5지 전체를 동시에 움직이는 통합 제어 루프를 구현한다.
    safety:
    - 실험 중 보안경을 항상 착용할 것.
    - 모터가 동작 중일 때 손가락이 끼이지 않도록 주의할 것.
    - 비상 정지 버튼을 항상 손이 닿는 곳에 둘 것.
    - 전류 제한 값을 준수하여 모터 과열 및 단락 사고를 방지할 것.
    deliverables:
    - 통합 제어 펌웨어 소스 코드
    - PID 튜닝 결과 데이터(응답 곡선)
    - 다축 동기화 동작 영상 기록
  assignment:
    title: 로봇 손 동작 제어 분석 보고서
    deliverables:
    - 제어 알고리즘 구조도 및 흐름도
    - PID 파라미터 튜닝 최적화 논리 설명
    - 통신 패킷 오류율 테스트 기록
    rubric:
    - 제어 알고리즘의 논리적 타당성 (30%)
    - 다축 제어 패킷의 효율적 구성 (30%)
    - 튜닝 데이터에 기반한 문제 해결 능력 (20%)
    - 안전 가이드라인 준수 및 보고서 완성도 (20%)
  quiz:
  - question: DYNAMIXEL Protocol 2.0에서 다축 제어를 위해 가장 효율적인 패킷 전송 방식은 무엇인가?
    choices:
    - ReadData
    - SyncWrite
    - Ping
    - Factory Reset
    answer_index: 1
    explanation: SyncWrite는 여러 모터에 데이터를 동시에 전송할 수 있어 다축 제어 동기화에 필수적입니다 [S82].
  - question: PID 제어에서 D(미분) 게인의 주요 역할은 무엇인가?
    choices:
    - 정상 상태 오차 제거
    - 현재 오차에 대한 반응 속도 조절
    - 오차 변화율을 이용한 진동 억제
    - 모터 최대 속도 제한
    answer_index: 2
    explanation: D 제어는 오차의 변화율을 계산하여 제어 시스템의 응답을 안정화하고 과도한 진동을 억제합니다 [S79].
  completion_criteria:
  - 제어 코드 실습을 통한 모터 동작 확인
  - PID 튜닝 데이터 및 테스트 보고서 제출
  - 최종 제어 시스템 통합 성공(5축 동기화)
  source_ids:
  - S79
  - S82
- id: M9
  slug: testing-validation
  phase_id: P3
  title: 성능 검증 및 내구 시험
  estimated_hours: 8.0
  prerequisites:
  - M8
  objectives:
  - 로봇손의 성능 지표를 정의하고 정량화할 수 있다.
  - 텐션 기반 구동 시스템의 히스테리시스 및 마찰 오차를 분석한다.
  - 태엽 및 인장 시스템의 장기 신뢰성 평가 방법을 습득한다.
  - 인간-로봇 협업 환경에서의 안전 인증 및 검증 프레임워크를 이해한다.
  theory_markdown: '### 로봇손 성능 검증의 핵심


    정교한 5지 로봇손의 성능 검증은 단순한 가동 범위를 넘어, **접촉 불확실성(Contact Uncertainty)**을 다루는 적응형 지능의
    평가가 핵심입니다 [S4]. 텐션 기반 구동 구조에서는 마찰, 히스테리시스, 캘리브레이션 드리프트가 반복 재현성을 저해하는 주요 요인입니다
    [S4].


    #### 1. 주요 성능 오차원

    - **히스테리시스(Hysteresis):** 구동 케이블의 비선형 탄성과 마찰로 인해 동일 제어 입력에 대해서도 전진과 후진 경로의 위치가
    달라지는 현상입니다.

    - **캘리브레이션 드리프트(Calibration Drift):** 시간 경과 및 사용에 따른 텐션 변화로, 초기에 설정된 관절 위치 정보가
    틀어지는 현상을 의미합니다.


    #### 2. 검증 프레임워크

    실제 하드웨어 배포를 위해서는 다음과 같은 다차원 평가가 필수적입니다:

    - **태크타일 및 멀티모달 인지 평가:** 슬립 감지, 접촉 상태 추정, 질감 인식 등 인지 알고리즘의 Robustness를 검증합니다 [S4].

    - **안전 엔벨로프(Safety Envelope):** 인간 공유 공간에서의 안전성을 평가하기 위해 소프트/컴플라이언트 엔드 이펙터의 변형량을
    측정합니다 [S4].

    - **장기 신뢰성(Long-horizon Reliability):** 연속 반복 동작 시의 기계적 마모와 제어 정밀도 유지력을 확인해야 합니다
    [S4].'
  worked_examples:
  - '예제 1: 텐션 구동 로봇손의 반복 정밀도 계산. 100회 왕복 동작 후 목표 지점과의 오차 표준편차를 구하고, 드리프트(Drift) 값을
    산출하여 캘리브레이션 보정 계수를 유도하는 과정입니다.'
  - '예제 2: 히스테리시스 루프 분석. 케이블 장력을 단계적으로 높였다 낮추며 출력 위치를 기록하고, 입력-출력 곡선 사이의 면적(에너지 손실량)을
    계산하여 구동 시스템의 마찰 수준을 정량화합니다.'
  lab:
    title: 로봇손 장기 신뢰성 및 정밀도 시험
    steps:
    - 초기 교정 값을 기록하고 로봇손의 위치 정확도를 0점 확인합니다.
    - 비상 정지 장치(E-stop)가 정상 동작하는지 테스트합니다.
    - 1,000회 반복 동작 자동화 스크립트를 실행합니다.
    - 매 100회마다 마커 기반 비전 시스템을 활용하여 관절 위치 오차를 로그에 기록합니다.
    - 작업 종료 후 최종 오차값과 텐션 변화량을 분석합니다.
    safety:
    - '보안경 착용 필수: 케이블 파손 시 튀는 파편 대비.'
    - '동작 구역 내 손가락 접촉 금지: 끼임 사고 주의.'
    - 비상 전원 차단 장치를 손 근처에 배치하고 상시 점검.
    deliverables:
    - 반복 시험 데이터 로그(CSV)
    - 위치 정확도 및 히스테리시스 루프 그래프
    - 교정 기록 및 성능 분석 보고서
  assignment:
    title: 로봇손 신뢰성 및 안전 성능 평가 보고서
    deliverables:
    - 성능 시험 결과 분석 보고서(PDF)
    - 내구 시험 비디오 데이터
    - 최종 성능 평가 요약 발표 슬라이드
    rubric:
    - 히스테리시스 및 드리프트 분석의 정밀성
    - 장기 신뢰성 데이터 처리 및 그래프의 명확성
    - 인간-로봇 안전 기준 적용의 타당성
    - 발견된 문제점에 대한 개선 방향 제시 수준
  quiz:
  - question: 텐션 기반 구동 시스템에서 반복 재현성을 가장 심각하게 저해하는 요인은 무엇입니까?
    choices:
    - 소프트웨어 응답 속도
    - 마찰, 히스테리시스, 캘리브레이션 드리프트
    - 통신 프로토콜 대역폭
    - 3D 프린팅 재료의 강성
    answer_index: 1
    explanation: 리뷰된 연구들에 따르면 텐션 구동 시스템의 정밀도를 저해하는 핵심은 마찰, 히스테리시스 및 드리프트 현상입니다 [S4].
  - question: 인간과의 협업 환경에서 소프트/컴플라이언트 엔드 이펙터의 주요 이점은 무엇입니까?
    choices:
    - 세밀한 조작 정확도 증가
    - 안전 엔벨로프(Safety Envelope) 확대
    - 전력 소비 감소
    - 히스테리시스 제거
    answer_index: 1
    explanation: 부드럽고 순응성 있는 엔드 이펙터는 인간 공유 설정에서 안전 범위를 넓히는 데 기여합니다 [S4].
  completion_criteria:
  - 로봇손의 히스테리시스 루프 데이터 및 드리프트 분석을 포함한 최종 결과 보고서 제출.
  - 반복 시험을 통해 로봇손의 장기 신뢰성 데이터 확보 및 기록.
  - 모든 성능 검증 시험 과정에서 안전 수칙 준수 완료.
  source_ids:
  - S4
- id: M10
  slug: safety-certification
  phase_id: P3
  title: 로봇 안전 표준 적용
  estimated_hours: 7.0
  prerequisites:
  - M6
  objectives:
  - IEC 60204-1 표준의 핵심 전기 안전 요구사항을 이해한다.
  - 로봇 시스템에 대한 전력 구동 시스템(PDS) 및 비상 정지 회로 설계 원칙을 습득한다.
  - 전기적 위험 요소 평가를 통해 시스템의 보호 접지 및 과전류 차단 설계를 검증한다.
  theory_markdown: '### 로봇 전기 안전 설계: IEC 60204-1 개요


    산업용 로봇 및 복합 기계 시스템의 전기 안전은 국제 표준인 **IEC 60204-1**에 의해 규정됩니다 [S60]. 이 표준은 기계의 전원
    연결 지점부터 전기적 장비 및 제어 회로 전반에 걸친 요구사항을 다룹니다 [S60].


    #### 1. 주요 안전 설계 원칙

    - **과전류 보호:** 모든 제어 회로 및 전력 회로는 단락이나 과부하로부터 보호되어야 하며, 차단기의 정격은 부하의 특성과 케이블 허용
    전류를 고려하여 결정합니다 [S60].

    - **보호 접지(Protective Bonding):** 금속 프레임 등 모든 비전도성 외부 인클로저는 고장 시 전위 상승을 막기 위해 저임피던스
    경로로 접지되어야 합니다 [S60].

    - **비상 정지(Emergency Stop):** 비상 정지 장치는 작동 시 제어 시스템이 기계적 운동을 즉시 안전하게 멈추도록 해야 하며,
    PDS(Power Drive Systems)의 경우 **Safe Torque Off(STO)** 기능을 구현하여 모터로의 에너지 공급을 차단합니다
    [S60].

    - **EMC (전자파 적합성):** 제어 회로와 고전력 회로 사이의 간섭을 최소화하기 위해 차폐 및 배선 분리를 수행해야 합니다 [S60].'
  worked_examples:
  - '예제 1: 5지 로봇손의 비상 정지 회로 설계

    문제: 시스템 내 로봇 손의 모터 전원이 PDS를 통해 공급될 때, 비상 정지 버튼(E-Stop)이 눌리면 어떤 단계로 동작해야 하는가?

    해석: IEC 60204-1의 최신 개정본에 따라, E-Stop 신호는 제어기를 거쳐 PDS의 STO 회로를 활성화해야 합니다. 이는 모터의
    토크 발생을 강제 중단(Safe Torque Off)시켜 관성만 남은 상태로 정지하게 하며, 제어 신호가 차단되어도 안전한 상태를 유지합니다
    [S60].'
  - '예제 2: 보호 접지 임피던스 계산

    문제: 로봇 핸드 프레임과 접지 단자 사이의 허용 저항값 결정 기준은?

