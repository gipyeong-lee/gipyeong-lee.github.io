- id: M10
  slug: grasp-validation
  phase_id: P3
  title: 파지 성능 시험 및 내구도 검증
  estimated_hours: 5.0
  prerequisites:
  - M9
  objectives:
  - 로봇손의 정적 파지 성능을 정량적으로 측정하고 평가할 수 있다.
  - 반복적인 파지 동작을 통해 로봇손의 하드웨어 내구도를 검증할 수 있다.
  - IEC 60204-1 표준을 참고하여 전기적 안전성과 기구적 신뢰성의 상관관계를 이해한다.
  - 실험 데이터 분석을 통해 성능 보완점을 도출하고 보고서를 작성할 수 있다.
  theory_markdown: '### 로봇 파지 성능 검증 및 내구도 평가


    로봇손의 파지 성능은 단순한 토크 출력을 넘어, 접촉력의 정밀한 제어와 유지 능력에 의해 결정됩니다. 본 모듈에서는 FSR(Force Sensing
    Resistor) 센서 피드백을 활용하여 파지력을 정량화하고, 반복적인 사이클 시험을 통해 시스템의 피로도를 평가합니다.


    #### 1. 정적 파지 성능 평가

    로봇손은 파지 시 [SEN-01] FSR 센서를 통해 얻은 압력 데이터를 기반으로 목표 접촉력에 도달해야 합니다. 파지 성능은 0.2N에서
    20N 사이의 정밀한 제어 정확도와 안정성으로 정의됩니다 [S12]. 파지 시 액추에이터는 12V 전원 분기에서 공급되는 에너지를 활용하며,
    스톨 전류인 2.3A를 넘지 않도록 [ACT-01] DYNAMIXEL 스마트 액추에이터의 전류 피드백을 활용합니다 [S11].


    #### 2. 내구도 및 신뢰성 검증

    내구도 시험은 반복 하중을 통해 기구부와 텐던의 마모를 평가합니다. Dyneema SK78 소재의 [TRN-01] 텐던은 작동 신율이 1%
    미만으로 우수한 치수 안정성을 보이나 [S16], 반복적인 굴곡과 장력 발생 시 텐던의 긴장도가 변화할 수 있습니다. 이는 시스템의 위치 제어
    정밀도 저하를 야기하므로 정기적인 장력 보정 알고리즘이 필수적입니다.


    #### 3. 안전한 실험 환경

    산업용 자동화 장비의 안전 요구사항을 준수하는 것은 필수적입니다 [S6]. 본 프로토타입은 인증된 기계 안전 시스템이 아니므로, [PWR-01]
    전원 어댑터의 독립 분기별 물리적 분리 수단을 사용하여 [S7] 안전 표준의 격리 원칙을 준수합니다. 실험 중에는 반드시 10A [SAF-01]
    ATOF 퓨즈를 통해 과전류를 방지해야 합니다 [S24].'
  worked_examples:
  - '예제 1: 파지력 데이터 분석. 5개의 손끝 센서에서 [CON-01] OpenCR 12비트 ADC를 통해 취득한 전압값(0~3.3V)을 힘(N)으로
    변환할 때, 분압 저항 10kΩ[SEN-02]에 따른 비선형 곡선을 보정하여 목표 파지력(예: 5N) 대비 오차를 계산한다. 오차가 10%를
    초과할 경우 DYNAMIXEL의 전류 한계치를 재설정한다.'
  - '예제 2: 전류 소모량 검토. 11대 액추에이터의 스톨 전류 합계는 25.3A이다. 3개의 독립된 12V 11.5A 분기 어댑터[PWR-01]를
    배분할 때, [SAF-01] 10A 퓨즈를 거쳐 각각 4대/4대/3대 액추에이터를 배분함으로써 각 분기가 9.2A(스톨 피크)를 넘지 않도록
    보호하는 설계 수치를 산출한다.'
  lab:
    title: 로봇손 파지 및 내구도 통합 실습
    steps:
    - 각 액추에이터 분기(3개)의 독립 퓨즈 상태와 배선을 멀티미터로 점검한다.
    - 실험용 고정 지그에 로봇손을 장착하고 [CON-01] OpenCR의 ADC 입력 신호가 0-3.3V 범위 내에 있는지 확인한다.
    - 무부하 상태에서 손가락의 가동 범위를 점검하고 텐던 장력을 확인한다.
    - '파지 시험: 목표 힘(1N, 5N, 10N)별로 10회 반복하여 [SEN-01] 센서의 출력값을 기록한다.'
    - '내구도 시험: 100회 파지 사이클을 수행하며 액추에이터의 온도와 [TRN-01] 텐던의 풀림 현상을 관찰한다.'
    safety:
    - 실험 전 3개 전원 어댑터를 물리적으로 분리하고, 각 분기마다 DC 전압이 1V 미만임을 멀티미터로 반드시 확인한다.
    - 절단 및 텐던 파손 방지를 위해 충격 방지 보안경을 착용한다.
    - 전원 인가 중에는 절대로 가동 범위 내에 손을 넣지 않는다.
    - 퓨즈는 비상 정지 장치가 아니므로 실험 중 과열 감지 시 즉시 전원 어댑터를 뽑는다.
    deliverables:
    - 파지력 보정 곡선 데이터
    - 반복 시험 전/후 텐던 긴장도 변화 로그
    - 이상 발열 및 오작동 기록서
  assignment:
    title: 로봇손 검증 보고서 작성
    deliverables:
    - 실험 결과 요약 보고서(PDF)
    - 성능 보완을 위한 펌웨어 제어 파라미터 개선안
    - 내구 시험 결과 분석 데이터
    rubric:
    - 파지력 정밀도 분석의 논리적 타당성
    - 데이터 분석을 통한 시스템 신뢰성 검증
    - 안전 수칙 준수 기록의 충실함
  quiz:
  - question: FSR 402 센서를 활용한 힘 측정 회로 구성 시 OpenCR의 ADC 입력 전압 범위는 얼마입니까?
    choices:
    - 0 ~ 5V
    - 0 ~ 3.3V
    - 0 ~ 12V
    - 0 ~ 24V
    answer_index: 1
    explanation: OpenCR의 센서 전원은 3.3V이며, 아날로그 입력 신호는 0~3.3V 범위를 초과해서는 안 됩니다.
  - question: 3개의 12V 독립 전원 어댑터를 사용하여 액추에이터 분기를 구성할 때 주의사항은 무엇입니까?
    choices:
    - 양(+) 출력 단자를 병렬로 연결하여 전류 용량을 키운다.
    - 양(+) 출력 단자를 서로 독립적으로 유지하고 별도로 퓨즈를 설치한다.
    - 하나의 어댑터에 모든 액추에이터를 연결하고 나머지는 예비로 둔다.
    - 3개 어댑터의 접지 단자만 연결하고 출력은 무시한다.
    answer_index: 1
    explanation: 본 시스템에서는 전원 분기별 독립성을 유지하고 양(+) 출력 병렬 연결을 절대 금지합니다.
  - question: 실험 중 시스템을 안전하게 정지하는 올바른 방법은 무엇입니까?
    choices:
    - 코드를 통해 모든 모터를 정지시킨다.
    - 퓨즈를 뽑는다.
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터로 1V 미만임을 확인한다.
    - 컨트롤러의 리셋 버튼을 누른다.
    answer_index: 2
    explanation: 벤치 프로토타입의 정지 방식은 3개 어댑터를 물리적으로 분리하고 DC 전압을 확인하는 것입니다.
  completion_criteria:
  - 실험 결과 보고서 제출 및 통과
  - 100회 파지 사이클 동안 시스템 오작동 없음
  - 정격 전압 및 전류 분배 원칙 준수 확인
