- id: M5
  slug: power-safety-wiring
  phase_id: PH2
  title: 안전 전력망 및 배선 구축
  estimated_hours: 12.0
  prerequisites:
  - M4
  objectives:
  - 로봇손의 전력 요구 사항을 정확히 계산하고 안전한 분기 회로를 설계한다.
  - 절연형 전원 어댑터의 독립적 사용 원칙을 이해하고 퓨즈를 활용한 과전류 보호 회로를 구현한다.
  - OpenCR 제어기의 전원 체계와 센서(FSR) 분압 회로의 올바른 연결법을 학습한다.
  - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다.
  theory_markdown: '### 안전한 로봇 전력망 구축


    정교한 5지 로봇손은 다수의 액추에이터를 사용하므로 총 피크 전력 요구량을 충족하면서도 개별 회로를 안전하게 보호하는 전력망 설계가 필수적입니다.
    본 프로토타입은 총 11개의 DYNAMIXEL XM430-W350-T 액추에이터를 구동하며, 각 액추에이터는 2.3 A의 스톨 전류를 가집니다
    [S10].


    #### 1. 독립 전원 분기와 보호

    여러 대의 액추에이터를 하나의 전원 공급원에 집중시키면 단일 고장이 시스템 전체의 위험으로 확산될 수 있습니다. 이를 방지하기 위해 11.5
    A 출력의 절연형 12 V 전원 어댑터 3개를 독립적으로 운영합니다 [S13]. 액추에이터 부하는 4대, 4대, 3대 단위로 분배하여 각 분기의
    최대 부하가 전원 정격을 초과하지 않도록 설계합니다. 반드시 각 전원 어댑터의 양(+) 출력은 서로 연결되지 않도록 전기적으로 절연 상태를
    유지해야 합니다.


    #### 2. 과전류 보호(Overcurrent Protection)

    배선 고장 시 화재 예방을 위해 각 12 V 분기에는 10 A ATOF 퓨즈를 인라인 홀더를 통해 장착합니다 [S21, S22]. 이 퓨즈는
    액추에이터 4대의 스톨 전류 합계(9.2 A)를 통과시키면서도, 배선 단락 등의 비정상 상태에서 11.5 A 어댑터의 정격을 넘기 전 전원을
    차단하는 역할을 합니다 [S13, S22].


    #### 3. 센서 신호의 안전한 취득

    OpenCR 제어기는 다양한 입력을 지원하지만, FSR 402와 같은 아날로그 센서를 위한 전압 분압 회로는 반드시 제어기의 3.3 V 센서
    레일을 사용해야 합니다 [S11, S12]. 12 V 액추에이터 전원과 센서 회로를 물리적으로 분리하여 고전압 유입으로 인한 제어기 ADC
    손상을 방지하십시오 [S12].'
  worked_examples:
  - '예제 1: 분기별 전류 계산. 액추에이터 4대를 포함하는 분기의 최대 피크 전류는 2.3 A * 4 = 9.2 A입니다. 사용하는 10 A
    퓨즈는 9.2 A 이하의 부하에서 정상 동작하며, 단락 발생 시 시간-전류 곡선에 따라 대응하여 시스템을 보호합니다 [S10, S22].'
  - '예제 2: 전압 분압기 설계. FSR 402 센서와 10 kΩ 분압 저항을 사용하여 전압 분압기를 구성합니다 [S11, S23]. OpenCR의
    3.3 V 전원을 공급받아 ADC 신호를 0~3.3 V 범위 내로 제어함으로써 최대 정밀도를 확보합니다 [S12].'
  lab:
    title: 분기 전원망 구현 및 계측 실습
    steps:
    - 각 전원 어댑터 출력 라인에 10 A 퓨즈 홀더를 납땜하여 인라인 퓨즈를 구성합니다.
    - 각 분기별로 액추에이터를 배분하여 전원을 연결하고, 각 분기의 양(+) 단자가 서로 연결되지 않았음을 멀티미터로 확인합니다.
    - OpenCR의 3.3 V 센서 레일과 10 kΩ 저항, FSR 402를 사용하여 5개의 전압 분압 회로를 구성합니다.
    - 전원 인가 전 각 회로의 단락 여부를 멀티미터 저항 모드로 검사합니다.
    - 전원 인가 후 각 전원 어댑터 출력 단자에서 12 V DC가 정확히 출력되는지 측정합니다.
    safety:
    - 실험 중 모든 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고, 각 회로의 전압이 1 V 미만임을 멀티미터 DC-전압 모드로 반드시
      확인한 뒤 접근하십시오.
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
    - 전원 인가 중 로봇손의 가동 범위에 손을 넣지 마십시오.
    - 납땜 시 보안경을 착용하고 환기 상태를 유지하십시오.
    deliverables:
    - 각 분기 전압 측정 기록(정상 범위 12 V ±5% 확인)
    - 센서 회로 배선 검사 리포트
    - 비상시 물리적 전원 분리 절차 숙지 증빙
  assignment:
    title: 전력 설계 검증 및 안전 보고서
    deliverables:
    - 시스템 전체 부하 시나리오별 전류 소모 계산서
    - 퓨즈 및 전원 공급원 구성이 포함된 최종 배선도
    - 기계 안전 전문가 검토가 필요한 기능(EDM, 이중 채널 등) 목록 기술
    rubric:
    - 액추에이터 분기 전류 계산의 정확성 및 어댑터 정격 준수 여부
    - 독립 전원 분리 원칙 위반 여부 확인
    - ADC 입력 전압 제한(3.3 V) 설계 준수
    - 안전 지침 및 물리적 분리 절차의 명확한 기술
  quiz:
  - question: 다음 중 독립 전원 분기를 운영할 때 절대 해서는 안 되는 동작은?
    choices:
    - 각 전원 어댑터의 12 V 양(+) 출력 라인을 하나로 병합하는 것
    - 액추에이터 대수를 분기별로 나누어 배분하는 것
    - 각 분기에 10 A 퓨즈를 장착하는 것
    - 각 분기별로 독립된 퓨즈 홀더를 사용하는 것
    answer_index: 0
    explanation: 독립된 전원 어댑터의 양(+) 출력을 서로 연결하면 전류의 역류나 과부하로 인해 어댑터가 손상될 수 있습니다. 반드시
      각 분기는 전기적으로 절연된 상태를 유지해야 합니다.
  - question: FSR 센서와 OpenCR 제어기 연결 시 권장되는 전압은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - 3.3 V 센서 전원
    - 24 V 입력 전원
    answer_index: 2
    explanation: OpenCR의 ADC 입력은 3.3 V 체계입니다. 전압 분압 회로는 반드시 3.3 V 센서 레일을 사용해야 제어기
      손상을 방지할 수 있습니다.
  - question: 벤치 프로토타입 작업 중 무전원 상태를 확인하는 올바른 방법은?
    choices:
    - 회로의 저항값을 측정하여 무한대인지 확인한다
    - 부저가 울리지 않는 연속성 모드를 사용한다
    - 모든 전원을 물리적으로 분리하고 멀티미터 DC 전압 모드로 1 V 미만인지 측정한다
    - 퓨즈를 제거하고 전원 코드를 꽂아둔다
    answer_index: 2
    explanation: 전압 측정만이 유일한 안전 확인 방법입니다. 저항 모드나 연속성 모드는 전압이 존재하는 상태에서 오작동하거나 신뢰할
      수 없는 값을 보여줄 수 있습니다.
  completion_criteria:
  - 각 분기의 독립 전원 구성 및 전압 측정값 완료
  - 과전류 보호를 위한 퓨즈 장착 배선도 작성 및 검토
  - FSR 센서 신호 취득 회로 구현 및 ADC 전압 범위 정상 확인
  - 제시된 벤치 프로토타입 안전 지침 준수 서약
