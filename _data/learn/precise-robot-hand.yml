  - S1
  - S2
- id: M5
  slug: fabrication-assembly
  phase_id: P2
  title: 3D 프린팅 및 물리 조립
  estimated_hours: 15.0
  prerequisites:
  - M4
  objectives:
  - 탄성 구동식(Tendon-driven) 로봇손의 3D 프린팅 공정 최적화 이해
  - 복합 기구의 정밀 조립을 위한 허용 오차 관리 및 조립 순서 설계
  - 로봇손의 구동을 위한 텐션 시스템 구축 및 마찰 최소화 기법 습득
  theory_markdown: '## 3D 프린팅 및 물리 조립 이론


    로봇손과 같은 고정밀 기구 조립에서 3D 프린팅 부품의 품질은 전체 성능을 결정하는 핵심 요소입니다. 특히 텐션 기반 구동 시스템은 마찰에
    극도로 민감하므로 프린팅 방향과 서포트 구조의 선택이 중요합니다 [S80].


    ### 1. 3D 프린팅 공정 및 적층 방향

    강도가 요구되는 손가락 마디는 적층 방향에 따른 이방성을 고려해야 합니다. 하중이 집중되는 관절 핀(Pin) 부위는 하중 방향과 수직으로 적층하여
    층간 분리를 방지합니다. 또한, 내부 마찰을 줄이기 위해 슬라이서 설정에서 ''Horizontal Expansion'' 또는 ''XY Size
    Compensation''을 사용하여 공차를 정밀 제어해야 합니다.


    ### 2. 허용 오차 및 조립 인터페이스

    Ruka-v2와 같은 다자유도 시스템은 부품 간 정밀한 간격(Clearance) 확보가 필수적입니다 [S80]. 기계적 공차는 일반적으로 0.1mm~0.2mm를
    목표로 하며, 이는 프린터의 출력 정밀도와 재질의 수축률에 따라 조정됩니다. 조립 시 마찰 저항을 줄이기 위해 관절 부위에는 PTFE 기반
    윤활제를 권장합니다.


    ### 3. 텐션 기반 구동 시스템의 이해

    로봇손의 제어 성능은 텐던(Tendon)의 마찰에 의해 제한됩니다. 텐던이 통과하는 가이드 경로(Path)의 곡률을 최소화하고, 내부 마찰
    계수가 낮은 튜브(예: Teflon)를 활용하여 정밀도를 확보합니다. 조립 시 각 텐던의 초기 장력을 균일하게 설정하는 것이 다자유도 제어의
    첫 번째 단계입니다.'
  worked_examples:
  - '예시 1: 관절 마찰 저항 측정. 조립된 손가락 마디에 텐던을 연결하기 전, 핀 회전 시 토크를 멀티미터와 연결된 로드셀로 측정하여 목표
    토크(예: < 0.05Nm) 이하인지 확인합니다.'
  - '예시 2: 슬라이서 공차 보정. 0.1mm 차이로 조립되지 않는 관절 커넥터의 경우, ''Hole Horizontal Expansion''
    설정을 0.05mm 단계로 조절하여 출력물을 최적화합니다.'
  lab:
    title: 로봇손 핵심 부품 출력 및 관절 조립 실습
    steps:
    - 손가락 마디(Finger links) 및 관절 핀 출력 및 후가공
    - 관절 부위의 공차 확인(0.1mm~0.2mm) 및 샌딩을 통한 마찰 조정
    - 관절 핀 조립 및 동작성 확인(끼임 방지 테스트)
    - 텐던 가이드 튜브 고정 및 텐던 경로 확인
    - 최종 조립 상태에서 멀티미터를 활용한 전자 부품 연결부 도통 테스트
    safety:
    - 3D 프린터 동작 중 뜨거운 노즐 접촉 주의(화상 위험)
    - 니퍼 및 칼 사용 시 보안경 착용
    - 조립 과정 중 손가락 끼임 방지 가이드라인 준수
    - 전자 부품 납땜 시 환기 시설 가동 및 전류 제한된 전원 사용
