modules:
- id: M1
  slug: robot-mechanics-intro
  phase_id: P1
  title: 로봇 기구학 및 역학 기초
  estimated_hours: 15.0
  prerequisites: []
  objectives:
  - 강체 변환(Rigid-body transformations)의 수학적 기초를 이해한다.
  - 순기구학(Forward Kinematics)과 역기구학(Inverse Kinematics)의 기본 개념을 파악한다.
  - 로봇 메커니즘의 야코비안(Jacobian)과 자유도(Degree of Freedom) 개념을 정의한다.
  - 로봇 손과 같은 조작기(Manipulator) 설계 시 고려해야 할 기구학적 제약 조건을 분석한다.
  theory_markdown: "## 1. 개요\n로봇 공학은 기계공학, 컴퓨터 과학, 제어 이론의 융합체입니다 [S1]. 정교한 5지 로봇손을\
    \ 설계하기 위해서는 먼저 로봇의 운동을 수학적으로 기술하는 기구학(Kinematics) 기초가 확립되어야 합니다.\n\n## 2. 강체 변환\n\
    로봇의 각 관절은 좌표계(Coordinate Frame)로 표현됩니다. 한 좌표계에서 다른 좌표계로의 위치와 방향 변화는 회전 행렬(Rotation\
    \ Matrix)과 이동 벡터(Translation Vector)로 구성된 동차 변환 행렬(Homogeneous Transformation\
    \ Matrix)을 사용하여 기술합니다 [S1].\n\n## 3. 순기구학 및 역기구학\n* **순기구학(Forward Kinematics):**\
    \ 관절의 각도($\\theta$)로부터 로봇 끝단(End-effector)의 위치와 방향을 계산합니다. \n* **역기구학(Inverse\
    \ Kinematics):** 로봇 끝단이 목표 위치에 도달하기 위해 필요한 각 관절의 각도를 역산합니다. 다관절 로봇손에서는 해가 유일하지\
    \ 않거나(Redundancy) 없을 수 있어 최적화 기법이 필수적입니다 [S1].\n\n## 4. 야코비안과 자유도\n로봇의 관절 속도와\
    \ 끝단 속도 사이의 관계를 나타내는 행렬이 **야코비안(Jacobian)**입니다. 이는 로봇의 정밀한 제어와 힘 제어(Force Control)\
    \ 방법론을 구축하는 핵심 도구입니다 [S1]. 자유도(DOF)는 로봇이 독립적으로 움직일 수 있는 최소 변수 개수를 의미하며, 5지 로봇손은\
    \ 손가락별 복합 관절로 인해 고차원적인 기구학 해석이 필요합니다 [S14]."
  worked_examples:
  - '예제 1: 2차원 평면 내 2-링크 로봇의 순기구학 계산

    링크 길이를 $l_1, l_2$, 관절 각도를 $\theta_1, \theta_2$라 할 때, 끝단 위치 $(x, y)$는 다음과 같다.

    $x = l_1 \cos(\theta_1) + l_2 \cos(\theta_1 + \theta_2)$

    $y = l_1 \sin(\theta_1) + l_2 \sin(\theta_1 + \theta_2)$

    이는 삼각함수의 덧셈 정리를 활용한 전형적인 순기구학 모델이다 [S1].'
  - '예제 2: 자유도 정의

    5지 로봇손에서 각 손가락이 3개의 관절(DOF)을 가지고 있고 손바닥이 1개의 DOF를 가진다면, 총 자유도는 $5 \times 3 + 1
    = 16$이 된다. 이 시스템을 제어하려면 최소 16개의 독립적인 액추에이터 신호가 필요함을 의미한다 [S14].'
  lab:
    title: 로봇 관절 기구학 시뮬레이션 및 분석
    steps:
    - CAD 소프트웨어를 사용하여 5지 로봇손의 단일 손가락 관절 모델을 생성한다.
    - 각 관절의 회전 중심축을 설정하고 DH 파라미터(Denavit-Hartenberg)를 표로 작성한다.
    - '파이썬(Python) 라이브러리(예: NumPy)를 사용하여 순기구학 계산 함수를 구현한다.'
    - 관절 각도 변화에 따른 끝단의 궤적을 3D 그래프로 시각화한다.
    safety:
    - 실습 중 3D 프린터나 구동 모듈의 끼임 주의.
    - 전기 회로 구성 시 벤치 전원의 전류 제한 설정을 확인하여 과전류 방지.
    - 보안경 착용 필수.
    deliverables:
    - 작성된 DH 파라미터 테이블
    - 순기구학 구현 소스 코드
    - 궤적 시각화 결과 이미지
  assignment:
    title: 로봇 손의 기구학 모델링 보고서
    deliverables:
    - 5지 로봇손의 전체 자유도 분석 보고서
    - 임의의 손가락 관절에 대한 순기구학 행렬 계산식
    - 역기구학 해결 시 발생할 수 있는 특이점(Singularity)에 대한 고찰
    rubric:
    - 좌표계 설정의 논리적 타당성 (30%)
    - 순기구학 행렬 계산의 정확성 (40%)
    - 자유도 분석의 포괄성 및 창의적 고찰 (30%)
  quiz:
  - question: 순기구학(Forward Kinematics)이 구하는 대상은 무엇인가?
    choices:
    - 관절의 각도
    - 로봇 끝단의 위치와 방향
    - 모터의 소모 전류
    - 야코비안 행렬의 역행렬
    answer_index: 1
    explanation: 순기구학은 관절 변수(각도)로부터 끝단(End-effector)의 공간적 위치와 방향을 계산하는 과정입니다 [S1].
  - question: 로봇 시스템에서 야코비안(Jacobian) 행렬의 주요 용도는?
    choices:
    - 관절의 물리적 강도 계산
    - 끝단 속도와 관절 속도 간의 관계 기술
    - 3D 모델의 텍스처 렌더링
    - 로봇의 전체 무게 추정
    answer_index: 1
    explanation: 야코비안은 관절 공간의 속도와 작업 공간(끝단)의 속도를 연결하는 선형 변환 행렬입니다 [S1].
  completion_criteria:
  - 로봇 기구학의 핵심 이론(변환 행렬, 야코비안)을 설명할 수 있음.
  - 단일 손가락에 대한 순기구학 모델을 수학적으로 유도함.
  - 제시된 과제에서 5지 로봇손의 자유도를 정확히 분석함.
  source_ids:
  - S1
  - S14
- id: M2
  slug: design-dexterous-hand
  phase_id: P1
  title: 로봇손 기구 설계
  estimated_hours: 15.0
  prerequisites:
  - M1
  objectives:
  - 로봇손 기구학(Kinematics)의 기본 원리를 이해한다.
  - 텐션 구동(Tendon-driven) 메커니즘의 특성과 설계 요소를 파악한다.
  - 언더액추에이티드(Underactuated) 손가락 구조의 장점과 동작 원리를 학습한다.
  - 자유도(DOF)와 손의 기능성 간의 상관관계를 분석한다.
  theory_markdown: '### 로봇손 기구 설계의 기초


    정교한 로봇손을 설계하기 위해서는 인체의 해부학적 구조를 모방함과 동시에 로봇공학적 최적화를 고려해야 합니다. 주요 설계 고려사항은 다음과
    같습니다.


    #### 1. 텐션 구동(Tendon-driven) 메커니즘

    텐션 구동 방식은 액추에이터를 손가락 끝이 아닌 손바닥이나 손목 근처에 배치할 수 있게 하여 로봇손의 질량을 줄이고 유연한 움직임을 가능하게
    합니다 [S3]. 와이어(텐션)를 통해 힘을 전달하며, 이는 인체의 힘줄 구조와 유사합니다 [S4]. 설계 시 와이어의 장력(Preload)
    조절과 마찰 최소화가 핵심입니다 [S4].


    #### 2. 언더액추에이티드(Underactuated) 구조

    언더액추에이티드 설계는 액추에이터의 수보다 제어 가능한 자유도가 많은 시스템을 의미합니다 [S3]. 이는 적은 수의 모터로도 다양한 물체를
    안정적으로 감싸 쥐는 적응형 그립(Adaptive Grasping)을 가능하게 합니다 [S3].


    #### 3. 자유도와 기능성(Degrees of Freedom, DOF)

    로봇손의 기능성은 자유도에 따라 결정됩니다. 단순히 손가락의 굴곡뿐만 아니라, 손목의 회전과 손가락의 내전/외전(Adduction/Abduction)
    기능을 추가하면 좁은 공간에서의 정밀 작업 및 복잡한 조작(예: 물체 회전)이 가능해집니다 [S15]. 최신 연구인 Ruka-v2는 2자유도
    평행 손목과 손가락 내전 기능을 도입하여 조작 성공률을 21.2% 향상시켰습니다 [S15].'
  worked_examples:
  - '예제 1: 텐션 구동 자유도 계산. 11자유도(손가락당 2자유도, 엄지 3자유도)를 가진 로봇손 설계 시, 모터 배치를 위해 요구되는 텐션
    경로를 도출하시오. 텐션 경로는 굴절 시 와이어의 길이를 일정하게 유지하도록 경로점(Pulleys)을 배치해야 합니다.'
  - '예제 2: 적응형 그립의 원리. 언더액추에이티드 메커니즘에서 물체와 접촉 시 와이어가 어떻게 힘을 배분하는지 분석하시오. 외부 저항에 의해
    한 관절이 멈추면, 텐션 메커니즘이 나머지 관절로 힘을 계속 전달하여 물체를 감싸게 됩니다 [S3].'
  lab:
    title: 로봇 손가락 메커니즘 프로토타이핑
    steps:
    - CAD 소프트웨어를 사용하여 3D 출력 가능한 단일 손가락 관절 구조를 설계한다.
    - 텐션 와이어가 지날 수 있는 내부 채널을 포함하고 와이어 고정점을 확보한다.
    - FDM 3D 프린터로 관절 부품을 출력한다.
    - 와이어를 관절에 통과시키고 끝단을 액추에이터 시뮬레이터에 연결한다.
    - 와이어를 당겨 관절의 굴곡 움직임이 부드러운지 확인한다.
    safety:
    - 납땜 인두 및 수공구 사용 시 보안경을 반드시 착용한다.
    - 움직이는 관절부에 손가락이 끼이지 않도록 주의한다.
    - 저전압 벤치 전원을 사용할 때 전류 제한 설정을 확인한다.
    - 비상 전원 차단 장치를 실습대에 준비한다.
    deliverables:
    - 로봇 손가락 3D CAD 모델 파일
    - 와이어 장력 테스트 데이터
    - 설계 과정 및 문제 해결 내용이 담긴 실습 보고서
  assignment:
    title: Dexterous Hand 설계 기획서 작성
    deliverables:
    - 로봇손 기구 구조 설계 도면(PDF)
    - 사용될 액추에이터 사양 및 BOM
    - 설계한 로봇손의 자유도 계산 및 그립 메커니즘 설명 보고서
    rubric:
    - 기구적 자유도의 합리적 선정 및 설명
    - 텐션 구동 경로 설계의 실현 가능성
    - 언더액추에이티드 원리의 정확한 기술
  quiz:
  - question: 텐션 구동 방식의 주요 장점이 아닌 것은?
    choices:
    - 손가락 질량 감소
    - 액추에이터 배치 유연성
    - 제어 복잡성 증가
    - 인체 힘줄 메커니즘 유사성
    answer_index: 2
    explanation: 텐션 구동은 구조를 가볍게 만들지만, 제어가 복잡해질 수 있다는 점은 설계 시 해결해야 할 과제이며 장점이 아닙니다.
  - question: 언더액추에이티드(Underactuated) 손가락 구조의 특징은?
    choices:
    - 모터 개수와 자유도가 1:1로 일치함
    - 적응형 그립(Adaptive Grasping)이 가능함
    - 모든 관절을 독립적으로 제어해야 함
    - 텐션 사용을 최소화함
    answer_index: 1
    explanation: 언더액추에이티드 구조는 적은 액추에이터로도 물체 형상에 따라 유연하게 감싸 쥐는 적응형 그립이 가능합니다 [S3].
  completion_criteria:
  - 로봇손 기구 설계 기획서 제출
  - 손가락 관절 메커니즘 프로토타입 시연
  - 이론 퀴즈 100% 정답 도달
  source_ids:
  - S3
  - S4
  - S15
- id: M3
  slug: actuator-assembly
  phase_id: P2
  title: 구동부 제작 및 배치
  estimated_hours: 20.0
  prerequisites:
  - M2
  objectives:
  - 로봇 구동기(Actuator)의 기본 원리와 DYNAMIXEL X 시리즈의 통신 사양을 이해한다.
  - 로봇손의 각 관절에 필요한 토크와 속도를 계산하여 적합한 구동기를 선정한다.
  - 구동기를 로봇 프레임에 견고하게 배치하고 기계적 간섭을 최소화하는 조립 기술을 습득한다.
  - 통신 브리지(U2D2 등)를 사용하여 구동기를 제어 환경에 연결한다.
  theory_markdown: "### 구동기 선정 및 기계적 통합\n\n로봇손의 성능은 구동기의 출력 특성에 직결됩니다. 5지 로봇손 설계 시\
    \ 가장 중요한 단계는 각 관절이 감당해야 할 정적/동적 부하를 계산하는 것입니다.\n\n1. **DYNAMIXEL X 시리즈 사양 분석**:\
    \ \n로봇 관절용 서보 모터로 널리 사용되는 DYNAMIXEL XM430-W350은 고성능 기어 감속기와 위치, 속도, 전류 기반 제어를\
    \ 제공합니다 [S17]. 통신은 DYNAMIXEL Protocol 2.0을 사용하며 [S17], 이는 실시간 위치 피드백과 상태 모니터링을\
    \ 가능하게 합니다.\n\n2. **부하 분석 및 선정**:\n관절의 토크 계산식: $\\tau = F \\times d \\times \\\
    sin(\\theta)$\n($\\tau$: 토크, $F$: 말단부 작용력, $d$: 회전축으로부터의 거리, $\\theta$: 각도).\n\
    손가락의 각 관절은 말단으로 갈수록 요구 토크가 낮아지지만, 기초 관절(MCP)은 최대 부하를 받으므로 이를 기준으로 모터를 선정해야 합니다.\n\
    \n3. **배치 전략**:\n로봇손의 공간 제약으로 인해 모터를 손바닥이나 팔뚝에 배치하는 케이블 구동(Tendon-driven) 방식을\
    \ 고려해야 합니다. 이때 모터 간의 간섭과 케이블의 마찰을 최소화하는 배치가 핵심입니다."
  worked_examples:
  - '사례 1: MCP 관절의 필요 토크 계산. 무게 0.5kg의 물체를 0.1m 떨어진 거리에서 지지할 때 필요한 토크 $\tau = 0.5kg
    \times 9.8m/s^2 \times 0.1m = 0.49 Nm$. 선정된 XM430-W350의 사양을 비교하여 안전율 1.5 적용 시
    0.735 Nm 이상의 토크가 보장되는지 확인합니다.'
  - '사례 2: DYNAMIXEL ID 설정. 여러 개의 모터를 동일한 통신 버스에 연결할 때, ''DYNAMIXEL Wizard 2.0''을
    사용하여 각 모터에 고유 ID를 할당하고 보레이트(Baud Rate)를 설정하는 과정을 수행합니다 [S17].'
  lab:
    title: DYNAMIXEL 제어 환경 구축 및 테스트
    steps:
    - U2D2와 PC를 연결하고 DYNAMIXEL Wizard 2.0을 실행합니다.
    - 각 관절용 모터의 고유 ID를 순차적으로 설정합니다.
    - 3D 프린팅된 테스트 핑거 프레임에 모터를 조립합니다.
    - 벤치 전원을 사용하여 모터에 전원을 인가하고 토크를 측정합니다.
    - 간단한 위치 제어 코드를 작성하여 모터의 회전 범위를 확인합니다.
    safety:
    - 보안경을 반드시 착용합니다.
    - 전류 제한 회로를 구현하여 모터 과부하 시 전원을 즉시 차단합니다.
    - 움직이는 관절부에 손가락이 끼이지 않도록 주의합니다.
    - 저전압(12V~24V) 벤치 전원만을 사용합니다.
    deliverables:
    - 조립된 관절 프레임 사진
    - 각 모터의 ID 및 통신 설정 기록표
    - 모터 구동 테스트 영상
  assignment:
    title: 5지 로봇손 구동 배치 설계서
    deliverables:
    - CAD 도면 (모터 배치 및 케이블 경로 표시)
    - 관절별 부하 계산서
    - BOM(Bill of Materials) 및 부품 사양서
    rubric:
    - 부하 계산의 정확성 (40%)
    - 기구학적 간섭 발생 여부 및 최적화 (30%)
    - 문서의 표준화된 형식 준수 (30%)
  quiz:
  - question: DYNAMIXEL X 시리즈에서 제공하는 주요 제어 방식이 아닌 것은?
    choices:
    - 위치 제어
    - 전류(토크) 제어
    - 자기장 직접 제어
    - 속도 제어
    answer_index: 2
    explanation: DYNAMIXEL X 시리즈는 위치, 속도, 전류 기반 제어를 제공하며 자기장을 직접 제어하는 방식은 제공하지 않습니다
      [S17].
  - question: 관절 배치 시 케이블 구동(Tendon-driven) 방식을 사용하는 주된 이유는?
    choices:
    - 모터의 무게를 손가락 끝으로 이동시켜 힘을 증폭하기 위해
    - 손가락의 무게와 부피를 줄이기 위해
    - 모터의 통신 속도를 빠르게 하기 위해
    - 모터의 수명을 늘리기 위해
    answer_index: 1
    explanation: 모터를 손가락이 아닌 손바닥이나 팔뚝에 배치하여 손가락 자체의 부피와 관성을 줄이기 위함입니다.
  completion_criteria:
  - 모든 모터의 통신이 성공적으로 확인됨.
  - 관절 부하 계산서가 사양 범위 내에 있음을 검증함.
  - 제출된 CAD 도면에서 기구학적 간섭이 없음을 입증함.
  source_ids:
  - S17
- id: M4
  slug: structure-and-fastening
  phase_id: P2
  title: 골격 제작 및 체결
  estimated_hours: 15.0
  prerequisites:
  - M2
  objectives:
  - 로봇손 제작을 위한 고성능 필라멘트(PC-CF)의 특성을 이해하고 최적의 출력 조건을 설정한다.
  - 로봇 골격 구조의 기계적 강도와 내구성을 극대화하기 위한 체결 원리를 학습한다.
  - 산업용 표준 스테인리스 스틸 체결 부품의 규격과 선택 기준을 파악한다.
  - FDM 3D 프린팅 시 노즐 보호 및 품질 확보를 위한 유지관리 요령을 익힌다.
  theory_markdown: '### 1. 로봇 골격 소재: PC-CF의 물성

    로봇손의 골격은 높은 강도와 내열성, 그리고 치수 안정성이 필수적입니다. 탄소 섬유(Carbon Fiber)가 충진된 PC(Polycarbonate)
    블렌드 소재인 PC-CF는 일반적인 PC 소재보다 인장 강도가 높고 치수 안정성이 뛰어나 정밀한 로봇 파트 제작에 적합합니다 [S23].


    ### 2. 고성능 체결 부품의 선정

    로봇손의 관절부는 반복적인 하중을 견뎌야 하므로, 부식 저항성이 높고 피로 강도가 우수한 스테인리스 스틸(SUS 304/316) 규격 볼트와
    너트 사용을 권장합니다 [S24]. 체결 시에는 소재의 압축 강도를 고려하여 과도한 토크를 가하지 않도록 주의해야 합니다.


    ### 3. FDM 3D 프린팅의 기술적 요구사항

    탄소 섬유는 연마성이 강해 일반 황동 노즐을 빠르게 마모시킵니다. 따라서 경화강(Hardened Steel) 노즐 사용이 필수적이며, 적정
    출력 온도(약 285°C)와 베드 온도(약 110°C)를 엄격히 준수해야 합니다 [S23].'
  worked_examples:
  - '사례 1: 로봇손 관절부 베어링 하우징 설계 시, PC-CF 소재의 수축률을 반영하여 치수를 보정하고, 조립 후 스테인리스 볼트와 너트를
    사용하여 체결력을 균등하게 분배하는 방법.'
  - '사례 2: 탄소 섬유 필라멘트 출력 시 노즐 막힘 현상을 방지하기 위한 퍼지(Purge) 타워 설정 및 베드 접착력 확보(Satin 시트
    사용 및 Glue Stick 활용) 과정 [S23].'
  lab:
    title: PC-CF 골격 출력 및 체결 테스트
    steps:
    - 경화강 노즐을 장착하고 FDM 프린터를 영점 조절합니다.
    - 테스트용 관절 시편을 PC-CF 필라멘트로 출력합니다 [S23].
    - 출력물의 표면 상태를 확인하고, 스테인리스 스틸 볼트를 사용하여 체결부 공차를 검증합니다.
    - 멀티미터를 이용해 체결부 주변의 간섭 여부와 기계적 결합 상태를 확인합니다.
    safety:
    - 베드 온도 110°C는 화상을 유발할 수 있으므로 보호장갑을 반드시 착용합니다 [S23].
    - 경화강 노즐 교체 시 보안경을 착용하고 전원을 차단합니다.
    - 끼임 방지를 위해 움직이는 관절부 주변에 손을 가까이하지 않습니다.
    deliverables:
    - PC-CF 출력 시편
    - 체결부 공차 검증 보고서
    - 경화강 노즐 마모 확인 기록
  assignment:
    title: 골격 설계 및 BOM 작성
    deliverables:
    - 로봇손 상세 골격 CAD 파일
    - 적용된 체결부 사양서(BOM)
    - 구조 체결 해석 보고서
    rubric:
    - 구조적 강도와 경량화의 적절한 균형 유지
    - 표준화된 스테인리스 스틸 규격 부품 사용 여부
    - FDM 출력 공차를 고려한 설계 최적화
  quiz:
  - question: PC-CF 필라멘트 출력 시 일반 황동 노즐 대신 경화강 노즐을 사용해야 하는 이유는 무엇입니까?
    choices:
    - 열 전도율이 더 높아서
    - 탄소 섬유의 연마성으로 인한 노즐 마모 방지
    - 필라멘트의 녹는점이 낮아서
    - 출력물의 색상을 선명하게 하기 위해
    answer_index: 1
    explanation: 탄소 섬유는 매우 연마성이 강해 황동 노즐을 빠르게 마모시키므로 경화강 노즐 사용이 필수입니다 [S23].
  - question: 로봇손 관절부 체결 부품으로 스테인리스 스틸을 추천하는 주요 이유는 무엇입니까?
    choices:
    - 전기 전도성이 매우 낮아서
    - 부식 저항성과 피로 강도 우수
    - 가격이 가장 저렴해서
    - 열팽창 계수가 0이라서
    answer_index: 1
    explanation: 스테인리스 스틸은 부식 저항성이 뛰어나며 기계적 하중을 견디는 피로 강도가 우수하여 산업용 체결에 적합합니다 [S24].
  completion_criteria:
  - PC-CF 필라멘트를 이용한 시편 출력 성공
  - 스테인리스 스틸 체결 규격 부품을 포함한 로봇손 조립 도면 작성
  - 모든 안전 수칙 준수 하에 실험 완료
  source_ids:
  - S13
  - S23
  - S24
- id: M5
  slug: wiring-and-integration
  phase_id: P2
  title: 배선 및 하드웨어 통합
  estimated_hours: 15.0
  prerequisites:
  - M3
  - M4
  objectives:
  - 로봇손 내부 배선의 물리적 레이아웃 설계 능력을 습득한다.
  - 커넥터 사양(Micro-Fit 3.0 및 SH 커넥터)을 이해하고 용도에 맞게 선정한다.
  - 정격 전류 및 전압을 고려한 안전한 배선 통합 방식을 익힌다.
  - 전류 제한 회로를 포함한 전원 통합 기술을 습득한다.
  theory_markdown: "## 로봇손 하드웨어 통합 개요\n5지 로봇손과 같은 다관절 로봇은 좁은 공간 내부에 많은 액추에이터와 센서 배선이\
    \ 밀집됩니다. 따라서 신뢰성 높은 커넥터 선택과 체계적인 배선 관리가 필수적입니다. \n\n### 커넥터 사양 선정\n배선 통합 시 가장\
    \ 먼저 고려할 점은 신호의 성격과 전류량입니다. \n- **전원부:** 모터 구동을 위한 대전류 전달이 필요합니다. Molex Micro-Fit\
    \ 3.0 커넥터는 3.00mm 피치에 최대 8.5A 전류 정격을 제공하며, TPA(Terminal Position Assurance) 기능을\
    \ 통해 단자 이탈을 방지하여 신뢰성을 높입니다 [S9].\n- **제어 및 센서부:** 공간이 협소한 관절부 센서나 통신선에는 JST SH\
    \ 커넥터와 같이 1.0mm 피치의 초소형 커넥터를 사용하여 밀도를 최적화합니다. SH 커넥터는 정격 전류 1.0A(AWG #28 기준)로\
    \ 신호 전달에 적합하며, 독특한 접점 설계를 통해 소형화된 환경에서도 안정적인 연결을 보장합니다 [S10].\n\n### 배선 안전 설계\n\
    - **전류 제한:** 하드웨어 통합 시에는 반드시 전류 제한 회로를 구성하여 오작동 시 액추에이터와 배선이 타버리는 것을 방지해야 합니다.\n\
    - **극성 및 격리:** 커넥터는 역삽입을 방지하기 위해 반드시 극성(Polarization)이 보장된 하우징을 선택해야 하며, 단자 간\
    \ 단락을 방지하기 위해 완전히 격리된 단자 구조를 사용하는 것이 좋습니다 [S9]."
  worked_examples:
  - '사례 1: 모터 전원 배선 설계. 로봇손 모터 5개가 최대 1.5A씩 소비할 경우, 총 전류는 7.5A입니다. Micro-Fit 3.0은
    최대 8.5A까지 허용하므로 메인 전원 커넥터로 적합합니다 [S9].'
  - '사례 2: 손가락 끝 센서 통신. 배선 공간이 5mm 이하로 극히 제한적인 경우, 1.0mm 피치의 SH 커넥터를 사용하여 배선 폭을 최소화하고
    28 AWG 와이어를 사용하여 유연성을 확보합니다 [S10].'
  lab:
    title: 로봇손 제어기 및 액추에이터 배선 통합
    steps:
    - 제공된 설계 도면에 따라 액추에이터와 센서의 위치를 확인한다.
    - 전원부에는 Micro-Fit 3.0 커넥터를, 센서부에는 SH 커넥터를 압착 및 조립한다.
    - 멀티미터를 사용하여 각 커넥터의 단자 간 도통 상태와 절연 저항을 확인한다.
    - 전류 제한 저항 및 회로를 포함하여 메인 컨트롤러와 전원 공급 장치를 연결한다.
    safety:
    - 압착기(Crimping tool) 사용 시 손가락 끼임에 주의한다.
    - 저전압 벤치 전원을 사용하여 쇼트 테스트를 진행한다.
    - 납땜 인두 사용 시 화상 방지 보안경을 반드시 착용한다.
    deliverables:
    - 완성된 배선 시스템의 도통 테스트 결과 보고서
    - 전류 제한 회로가 포함된 최종 배선도
  assignment:
    title: 로봇손 전원 통합 설계 및 BOM 작성
    deliverables:
    - 5지 로봇손의 모든 모터와 센서가 포함된 배선도
    - 각 노드별 최대 소비 전류 계산이 포함된 부품 명세서(BOM)
    rubric:
    - 커넥터 선정 근거가 사양서(S9, S10)에 기반하여 타당한가?
    - 전류 정격이 시스템 전체 소비 전력을 안전하게 수용하는가?
    - 배선도가 역삽입 방지 및 정리 상태를 명확히 표현하고 있는가?
  quiz:
  - question: Molex Micro-Fit 3.0 커넥터의 특징으로 옳은 것은?
    choices:
    - 최대 1.0A의 전류만 허용한다.
    - TPA 기능을 통해 단자 이탈을 방지할 수 있다.
    - 1.0mm 피치의 초소형 커넥터이다.
    - 오직 전원용으로만 사용 가능하다.
    answer_index: 1
    explanation: Micro-Fit 3.0은 최대 8.5A를 허용하며, TPA(Terminal Position Assurance) 기능을
      지원하여 단자 이탈을 방지합니다 [S9].
  - question: 1.0mm 피치의 JST SH 커넥터의 주된 용도는 무엇인가?
    choices:
    - 고전류 모터 전원 공급
    - 소형 센서 및 신호 전달
    - 기계 구조용 지지대
    - AC 전원 변환
    answer_index: 1
    explanation: SH 커넥터는 1.0mm 피치의 초소형 crimp 스타일 커넥터로, 좁은 공간에서 센서나 신호를 전달하는 데 최적화되어
      있습니다 [S10].
  completion_criteria:
  - 제출된 배선도가 모든 액추에이터와 센서의 전원을 올바르게 나타내고 있음.
  - BOM에 명시된 커넥터가 정격 전류 및 전압 규격을 준수함.
  - 랩실습에서 도통 테스트가 성공적으로 완료되어 오배선이 없음을 증명함.
