modules:
- id: mod-1
  slug: intro-robotics
  phase_id: phase-1
  title: 로봇 공학 기초 및 운동학
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 공학의 정의와 기계적 조작의 기본 원리를 이해한다.
  - 강체 변환(Rigid-body transformation)과 로봇 운동학의 기초를 학습한다.
  - 자유도(DOF)와 관절 구성이 로봇의 작업 공간에 미치는 영향을 분석한다.
  - DYNAMIXEL 액추에이터의 사양과 안전한 전원 분기 구성 원리를 익힌다.
  theory_markdown: '### 로봇 공학 개요 및 운동학 기초

    로봇 공학은 기계 공학, 컴퓨터 과학, 제어 이론의 융합 학문으로, 기계적 조작기(Manipulator)를 통해 물리적 작업을 수행합니다 [S1].
    정교한 로봇손 구축을 위해서는 먼저 기구학적 설계가 필수적입니다.


    #### 1. 강체 변환 (Rigid-body Transformation)

    로봇의 각 관절과 링크의 위치를 표현하기 위해 3차원 공간에서의 회전과 이동을 정의합니다. 동차 변환 행렬(Homogeneous Transformation
    Matrix)을 사용하여 한 좌표계에서 다른 좌표계로의 관계를 기술합니다.


    #### 2. 자유도 (Degrees of Freedom, DOF)

    로봇손의 5지 구성은 각 손가락의 관절 수에 따라 결정됩니다. 각 관절은 제어 가능한 자유도를 제공하며, 액추에이터는 이를 구동하는 핵심 부품입니다.
    본 과정에서는 정밀 제어를 위해 `DYNAMIXEL XM430-W350-T`를 사용합니다.


    #### 3. 전력 시스템 사양 분석

    본 로봇손은 11개의 액추에이터를 사용합니다. 각 액추에이터의 스톨 전류는 2.3 A입니다 [S12]. 총 피크 전류는 11 * 2.3 A
    = 25.3 A입니다. 전원 안정성을 위해 본 설계는 3개의 `GST160A12-R7B` 어댑터를 독립 분기로 사용하며, 각 어댑터는 11.5
    A를 공급하므로 총 34.5 A의 용량을 확보하여 피크 전류 25.3 A를 안전하게 커버합니다 [S16].'
  worked_examples:
  - '예제 1: 관절 자유도 계산. 손가락 하나가 3개의 회전 관절을 가질 때, 5개 손가락의 총 자유도는 15 DOF입니다. 각 관절마다 액추에이터가
    1:1로 매핑되므로 최소 15개의 제어 채널이 필요하나, 본 설계는 주요 관절 11개에 집중합니다.'
  - '예제 2: 전원 분기 계산. 총 피크 전류가 25.3 A일 때, 11.5 A 정격 어댑터 2개만 사용할 경우 23 A로 부족합니다. 따라서
    3개의 어댑터를 병렬 분기(각각 독립 퓨즈 적용)하여 34.5 A의 안전 마진을 확보합니다.'
  lab:
