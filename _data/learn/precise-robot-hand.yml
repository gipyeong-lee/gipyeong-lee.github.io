modules:
- id: M1
  slug: intro-robotics
  phase_id: PH1
  title: 로봇 공학 입문
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - 로봇 공학의 기본 개념과 매니퓰레이터 설계의 핵심 요소를 이해한다.
  - 정교한 로봇손 시스템을 구성하는 주요 부품인 액추에이터, 제어기, 센서의 역할을 학습한다.
  - 로봇 시스템의 전원 분기 구성과 안전한 실험 환경 구축 방법을 습득한다.
  theory_markdown: '### 로봇 공학의 기초

    로봇은 환경을 인지(Sense)하고, 판단(Think)하며, 물리적으로 작용(Act)하는 시스템이다 [S1]. 본 프로젝트에서 다루는 5지
    로봇손은 인간의 손을 모사한 매니퓰레이터로, 정밀한 위치 제어와 힘 피드백이 핵심이다.


    ### 시스템 핵심 부품

    1. **액추에이터(Actuator):** DYNAMIXEL XM430-W350-T와 같은 스마트 액추에이터는 모터, 감속기, 제어기, 네트워크
    통신을 하나의 패키지로 통합하여 정밀한 토크 및 위치 제어를 가능하게 한다 [S10].

    2. **제어기(Controller):** OpenCR 1.0은 216MHz CPU를 탑재하여 액추에이터 제어뿐만 아니라 센서 데이터 처리
    및 안전 상태기계를 실행할 수 있는 고성능 임베디드 제어기이다 [S12].

    3. **센서(Sensor):** FSR 402는 압력에 따라 저항이 변하는 박막형 센서로, 손가락 끝의 파지력을 측정하여 피드백 제어에 활용한다
    [S11].


    ### 전원 분기 및 안전 구성

    로봇 시스템의 안정적인 구동을 위해 전원 분기 구성은 필수적이다. GST160A12-R7B와 같은 절연형 전원 어댑터를 사용하여 액추에이터
    그룹별로 전원을 분리하고, 각 분기마다 10 A ATOF 퓨즈를 배치하여 과전류로부터 시스템을 보호한다 [S14, S24]. **절대 주의:**
    여러 독립적인 전원 어댑터의 양(+)극 출력 단자를 전기적으로 연결(병렬)하지 않아야 한다. 각 어댑터는 지정된 액추에이터 분기에만 사용한다
    [S14].'
  worked_examples:
  - '**예제 1: 시스템 전원 설계**

    11대의 액추에이터를 구동하기 위해 3개의 독립적인 전원 어댑터를 사용한다. 4대/4대/3대로 액추에이터를 나누어 각 그룹별로 10 A 퓨즈를
    통해 전원을 공급함으로써, 특정 라인의 과전류 고장이 전체 시스템으로 확산되는 것을 방지한다 [S14].'
  - '**예제 2: 힘 감지 센서 전압 분압기 설계**

    FSR 402와 10 kΩ 고정 저항을 사용하여 분압 회로를 구성한다. OpenCR의 3.3 V 센서 전원을 기준으로, FSR에 가해지는 힘에
    따라 변화하는 저항값을 전압 신호(0~3.3 V)로 변환하여 ADC로 읽어들인다 [S11, S12, S25].'
  lab:
    title: 로봇 시스템 기초 배선 및 안전 점검
    steps:
    - 각 절연형 전원 어댑터 출력 단자와 퓨즈 홀더를 결선한다.
    - OpenCR 제어기와 스마트 액추에이터를 연결한다.
    - FSR 센서와 10 kΩ 저항을 사용하여 전압 분압 회로를 구성하고 OpenCR의 ADC 포트에 연결한다.
    - 멀티미터를 사용하여 각 분기별 전압이 12 V임을 DC 전압 모드에서 확인한다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고 무전원 상태를 계측 확인한다.
    - 전원 인가 중에는 손을 액추에이터 가동 범위에 넣지 않는다.
    - 충격 방지 작업용 보안경을 항시 착용한다.
    - 절대로 5 V 또는 12 V 액추에이터 레일을 ADC 전원으로 사용하지 않는다.
    deliverables:
    - 완성된 시스템 배선도
    - 각 분기별 DC 전압 측정 기록지
  assignment:
    title: 로봇 시스템 설계 및 안전 전략 보고서
    deliverables:
    - 시스템 블록 다이어그램
    - 전원 분기 및 퓨즈 보호 설계안
    - 안전 실험 운영 절차서
    rubric:
    - 독립 전원 분기 구성의 정확성
    - 전압 분압 회로의 올바른 설계 및 전압 범위(0-3.3V) 준수
    - 안전 수칙의 포괄적이고 정확한 명시
  quiz:
  - question: 로봇 시스템에서 여러 독립적인 전원 어댑터의 양(+)극 출력 단자를 전기적으로 연결하면 안 되는 주된 이유는 무엇인가?
    choices:
    - 전압이 낮아지기 때문이다.
    - 전기적 고립이 파괴되어 시스템 안전성이 저해되기 때문이다.
    - 전원 장치가 즉시 파손되기 때문이다.
    - 통신 속도가 느려지기 때문이다.
    answer_index: 1
    explanation: 독립적인 전원 어댑터는 시스템의 안전한 전원 분기를 위해 사용되며, 이를 전기적으로 연결하면 분기별 고장 보호 기능이
      상실되고 시스템 안정성이 저해됩니다.
  - question: FSR 센서의 분압 회로 구성 시 OpenCR 제어기의 전원 전압 범위로 적절한 것은?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원 레일
    - 5 V 전원
    - 직접적인 24 V 공급
    answer_index: 1
    explanation: OpenCR의 ADC 입력 신호는 0~3.3 V 범위를 초과하지 않아야 하며, 이를 위해 3.3 V 센서 전원 레일을
      사용해야 합니다.
  completion_criteria:
  - 로봇 공학의 기본 개념을 정리한 이론 보고서 제출
  - 각 전원 분기의 전압이 정상 범위(12 V)임을 멀티미터로 검증 완료
  - 안전 수칙을 준수하며 시스템 배선을 성공적으로 완료
  source_ids:
  - S1
  - S10
  - S12
  - S11
  - S14
  - S24
  - S25
- id: M2
  slug: actuators-mechanisms
  phase_id: PH1
  title: 액추에이터 및 메커니즘
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 로봇 시스템의 핵심 구성 요소인 액추에이터(DYNAMIXEL)의 동작 원리와 사양을 분석한다.
  - 힘 감지 센서(FSR)와 전압 분압 회로를 이용한 물리량 측정 원리를 이해한다.
  - 제어 보드(OpenCR)의 전기적 호환성과 전원 분기 관리의 중요성을 학습한다.
  - 시스템 전력 수요를 계산하고 적절한 안전 보호 회로(퓨즈)를 설계한다.
  theory_markdown: '### 1. 로봇 액추에이터와 제어

    로봇의 관절을 구동하는 스마트 액추에이터는 모터, 감속기, 제어기, 센서가 통합된 장치입니다. DYNAMIXEL XM430-W350-T는 12
    V 전압을 기준으로 4.1 N·m의 스톨 토크를 제공하며, 스톨 전류는 2.3 A입니다 [S10]. 이 전류값은 여러 액추에이터가 동시에 구동될
    때의 피크 전류를 결정하는 핵심 요소입니다.


    ### 2. 센서 인터페이스: FSR 402

    박막형 힘 센서(FSR)는 가해지는 압력에 따라 저항값이 변하는 Piezoresistive 소자입니다 [S11]. 이를 마이크로컨트롤러(OpenCR)에서
    인식하기 위해서는 저항을 이용한 전압 분압 회로(Voltage Divider)가 필요합니다 [S11, S25]. OpenCR의 12비트 ADC는
    0~3.3 V 입력을 받으므로, 센서 회로의 전원은 3.3 V 센서 레일에서 공급받아야 합니다 [S12].


    ### 3. 안전 및 전원 설계

    로봇의 정교한 동작을 위해 전원은 안정적으로 공급되어야 합니다. 3개의 12 V 절연형 데스크톱 전원 어댑터(각 11.5 A 출력)를 사용하여
    액추에이터 분기를 독립적으로 구성합니다 [S14]. 전체 액추에이터(11대)의 스톨 전류 합계는 25.3 A이므로, 분기별 최대 4대의 액추에이터를
    10 A ATOF 퓨즈로 보호하여 과전류 발생 시 배선을 안전하게 분리할 수 있습니다 [B3, B10, S24]. 어댑터 양(+) 출력은 병렬로
    절대 연결하지 않으며 물리적으로 분리된 분기를 유지해야 합니다.'
  worked_examples:
  - '예제 1: 시스템 최대 전력 수요 계산. 11대의 XM430 액추에이터가 동시 스톨 상태일 때, 전체 전류 수요는 11대 × 2.3 A =
    25.3 A입니다. 이는 각 어댑터의 11.5 A 출력 용량 내에 있으며, 10 A 퓨즈 분기 설계를 통해 보호됩니다 [S10, S14].'
  - '예제 2: FSR 센서 전압 분압 계산. 10 kΩ 저항을 풀다운으로 사용하고 FSR의 저항이 R_fsr일 때, ADC 입력 전압 V_adc는
    V_adc = 3.3 V * (10 kΩ / (R_fsr + 10 kΩ))입니다. 3.3 V 센서 전원을 사용하여 ADC 입력을 0~3.3
    V 범위로 유지합니다 [S12, S25].'
  lab:
    title: 전원 분기 구성 및 센서 회로 시험
    steps:
    - 각 어댑터 출력선에 10 A ATOF 인라인 퓨즈 홀더를 납땜 및 수축 튜브로 마감합니다 [B3, B10, B-WIRING-FUSE-HOLDER].
    - 각 분기마다 멀티미터를 사용하여 출력 전압이 12 V DC인지 확인하고, 절연 상태를 계측합니다.
    - OpenCR의 3.3 V 센서 레일에서 10 kΩ 저항을 사용하여 FSR 402의 전압 분압 회로를 브레드보드상에 구축합니다 [B4, B11,
      S12].
    - 센서에 힘을 가하며 ADC 수치 변화를 측정하여 회로가 0~3.3 V 범위 내에서 정상 작동함을 확인합니다.
    safety:
    - 절대로 전원 어댑터의 양(+) 단자를 병렬로 연결하지 마십시오.
    - 실험 전후 항상 멀티미터를 DC 전압 모드로 설정하여 각 분기의 전압이 1 V 미만인지 확인하고 접근하십시오.
    - 충격 방지 작업용 보안경을 항시 착용하십시오.
    - 전원 인가 상태에서 손을 가동 범위 내에 절대 넣지 마십시오.
    deliverables:
    - 분기별 전압 측정 데이터 기록
    - 센서 동작 범위별 ADC 출력 그래프
    - 전원 인가 전후 절연 상태 측정 결과
  assignment:
    title: 로봇손 전원 및 센서 회로 설계 보고서
    deliverables:
    - 분기별 액추에이터 배치 및 퓨즈 용량 타당성 분석서
    - FSR 전압 분압 회로 배선도
    - 전원 물리적 분리 수단에 대한 기술적 설명
    rubric:
    - 액추에이터 배치 시 분기별 스톨 전류 합계가 퓨즈 정격(10 A)을 초과하지 않음
    - 전압 분압 회로가 3.3 V 센서 전원을 올바르게 사용함
    - 어댑터 출력의 병렬 금지 원칙이 명시됨
  quiz:
  - question: FSR 센서 회로의 전원으로 적합하지 않은 것은 무엇인가?
    choices:
    - OpenCR 3.3 V 센서 레일
    - 액추에이터용 12 V 전원 분기
    - 분압기 회로의 저항 소자
    - 절연된 3.3 V 제어기 출력
    answer_index: 1
    explanation: OpenCR의 ADC는 0~3.3 V 범위를 가지며, 12 V는 허용 범위를 초과하여 보드를 손상시킬 수 있습니다 [S12].
  - question: 분기형 전원 구성에서 금지된 행위는 무엇인가?
    choices:
    - 분기별 퓨즈 장착
    - 독립된 어댑터 사용
    - 양(+) 출력의 병렬 연결
    - 전원 분리 수단 확보
    answer_index: 2
    explanation: 독립형 어댑터의 양(+) 출력을 병렬 연결하면 어댑터 간 전압 차로 인한 고전류가 발생할 수 있어 절대 금지됩니다 [B3].
  - question: 액추에이터 과전류 보호를 위해 선택된 퓨즈는?
    choices:
    - 10 A ATOF 퓨즈
    - 25 A ATOF 퓨즈
    - 5 A ATOF 퓨즈
    - 15 A ATOF 퓨즈
    answer_index: 0
    explanation: 전원 분기의 정격 11.5 A 이하이면서 액추에이터 피크 전류를 견딜 수 있는 10 A 퓨즈를 선택합니다 [B3, B10].
  completion_criteria:
  - 분기별 전원 전압이 12 V DC로 측정됨
  - FSR 센서 ADC 데이터가 0~3.3 V 범위 내에서 변화함
  - 전원 안전 수칙(물리적 분리 및 전압 측정)을 준수함
  - 퓨즈 장착 배선도 작성 완료
