- id: mod-3
  slug: structure-fabrication
  phase_id: phase-2
  title: 구조 제작
  estimated_hours: 15.0
  prerequisites:
  - mod-2
  objectives:
  - FDM 3D 프린팅의 기술적 매개변수를 이해하고 구조용 필라멘트(PC-CF)를 최적화하여 출력한다.
  - 정밀 조립을 위해 열압입 나사산 인서트의 원리와 올바른 매립 공정을 습득한다.
  - 무급유 폴리머 베어링과 정밀 샤프트의 기구적 끼임새(Fit)와 조립 허용 오차를 관리한다.
  - 텐던(Dyneema)의 기계적 특성을 이해하고 로봇 손 관절에 장착하는 절차를 수행한다.
  theory_markdown: '## 구조 제작의 기술적 고려사항


    5지 로봇 손과 같은 정밀 메커니즘을 제작할 때는 강성(Stiffness)과 내구성(Durability)을 동시에 확보해야 합니다. 본 교과과정에서는
    FDM 3D 프린팅 기술과 엔지니어링 필라멘트를 사용하여 구조를 제작합니다.


    ### 1. 엔지니어링 필라멘트와 프린팅 공정

    구조물 제작에는 Prusament PC-CF(탄소섬유 보강 폴리카보네이트)를 사용합니다 [S18]. 이는 강성이 높고 치수 안정성이 우수하여
    정밀 부품 제작에 적합합니다 [S18]. 탄소섬유는 마모성이 매우 강하므로, 노즐 손상을 방지하기 위해 반드시 경화강 노즐을 사용해야 합니다
    [S18]. 프린팅 시 적정 베드 온도(110°C)와 노즐 온도(285°C) 준수는 출력물의 층간 결합력과 강도를 결정하는 핵심 요소입니다
    [S18].


    ### 2. 열압입 인서트(Heat-set Insert)를 이용한 체결

    3D 출력물인 플라스틱은 반복적인 나사 조립에 취약합니다. 이를 보완하기 위해 황동 열압입 인서트(HTBI-M3-BR)를 사용합니다 [S20].
    인서트를 매립할 때는 4mm 파일럿 홀이 가공된 출력물에 인서트를 위치시키고 열을 가해 매립합니다 [S20]. 이때 나사산 중심이 하우징과
    수직을 유지해야 조립 재현성을 확보할 수 있습니다.


    ### 3. 무급유 베어링과 샤프트의 공차 관리

    igus JSM-0810-10 폴리머 슬리브 베어링은 무급유 환경에서 최적의 마찰 계수를 제공합니다 [S16]. 이 베어링은 압입(Press-fit)
    방식이므로, 출력물 하우징의 보어(Bore) 치수가 베어링의 외경(10mm)과 적절한 압입 허용 오차를 가지도록 설계되어야 합니다 [S16].
    또한, 베어링 내경(8mm)에 대응하는 정밀 알루미늄 샤프트(AWMP-08)를 사용하여 축의 유격을 최소화해야 합니다 [S16, S17].'
  worked_examples:
  - '예제 1: 인서트 매립 깊이 설정. 사용 중인 인서트 모델의 길이(5.8mm)를 확인하여 하우징의 깊이를 설계합니다. 매립 시 인서트 상단이
    출력물 표면과 일치하도록 열압입 온도를 조절하여 과도한 변형을 방지합니다.'
  - '예제 2: 베어링 압입 공차 계산. 베어링 외경 10mm에 대해 하우징 보어는 압입 후 내경이 8mm 정밀 샤프트와 적절히 결합되도록 0.02~0.05mm
    정도의 간섭 끼임을 고려한 9.95~9.98mm 수준으로 모델링합니다 [S16].'
  lab:
    title: 로봇 손 프레임 및 관절 조립 실습
    steps:
    - 1. FDM 프린터와 경화강 노즐을 사용하여 구조물을 출력하고, 출력 후 4mm 파일럿 홀을 확인합니다.
    - 2. 설정된 온도에서 열압입 인서트를 구조물 하우징에 수직으로 매립합니다.
    - 3. 8mm 정밀 알루미늄 샤프트를 베어링 내경에 맞게 절단 후 끝단 모따기를 수행합니다 [S17].
    - 4. JSM-0810-10 베어링을 하우징 보어에 압입하고, 준비된 샤프트를 삽입하여 회전 원활성을 점검합니다 [S16].
    - 5. 텐던(Dyneema SK78)을 각 관절의 캡스턴에 장착하고, 반복 굽힘 시험을 통해 텐던 장력 및 유격을 조정합니다 [S15].
    safety:
    - 모든 기계 가공 및 조립 시 충격 방지 작업용 보안경을 반드시 착용합니다.
    - 열압입 인서트 작업 시 인두기 끝단의 고온에 주의합니다.
    - 출력물 클리닝을 위한 IPA 사용 시 화기를 멀리하고 충분히 환기합니다 [S18].
    - 베어링 압입 시 과도한 힘을 가하지 않으며 도구 사용 시 손 끼임에 유의합니다.
    deliverables:
    - 완성된 로봇 손 구조체 CAD 도면 및 실제 출력물의 치수 측정 기록.
    - 베어링 회전 저항 및 샤프트 정렬 점검 기록.
    - 텐던 장력 조정 완료 및 관절 구동 영상.
  assignment:
    title: 정밀 조립 공정 설계 및 보고서 작성
    deliverables:
    - 조립 공정 개선 설계서 (CAD 및 공차 데이터 포함).
    - 반복 조립 시험 완료 보고서.
    - 최종 조립 품질 검증 체크리스트.
    rubric:
    - 인서트 매립의 수직도 및 하우징 변형 여부 (30%)
    - 베어링과 샤프트의 끼임새 관리 및 회전 마찰 적절성 (40%)
    - 제시된 부품 사양을 준수한 설계 도면의 정밀도 (30%)
  quiz:
  - question: PC-CF(탄소섬유 보강 폴리카보네이트) 출력 시 반드시 필요한 도구는 무엇인가요?
    choices:
    - 황동 노즐
    - 경화강 노즐
    answer_index: 1
    explanation: 탄소섬유는 마모성이 매우 강하여 표준 황동 노즐을 빠르게 손상시킵니다. 따라서 내마모성이 우수한 경화강 노즐을 사용해야
      합니다 [S18].
  - question: JSM-0810-10 베어링의 설치 방법은 무엇인가요?
    choices:
    - 압입(Press-fit) 방식
    - 접착제 사용 방식
    answer_index: 0
    explanation: iglide J 베어링은 하우징 보어에 압입하여 고정하는 방식이며, 압입 후 내경이 규격대로 조정됩니다 [S16].
  - question: 로봇 손 관절의 텐던으로 적절한 Dyneema SK78의 특징은 무엇인가요?
    choices:
    - 작동 신율이 높고 신축성이 우수함
    - 작동 신율이 낮고 높은 파단 하중을 가짐
    answer_index: 1
    explanation: Dyneema SK78은 매우 낮은 작동 신율(1% 미만)과 높은 파단 하중을 가져 정밀한 장력 전달에 적합합니다 [S15].
  completion_criteria:
  - 구조체 출력 및 하우징 치수가 설계 허용 오차 이내임이 확인됨.
  - 모든 인서트가 수직으로 매립되어 나사 체결이 원활함.
  - 베어링이 압입된 관절이 샤프트와 결합되어 유격 없이 회전함.
  - 조립 완료 후 텐던 장력 시험을 통해 관절 구동이 성공적으로 검증됨.
  source_ids:
  - S8
  - S18
  - S20
  - S16
  - S17
  - S15
- id: mod-4
  slug: actuation-assembly
  phase_id: phase-2
  title: 구동부 조립
  estimated_hours: 15.0
  prerequisites:
  - mod-3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 물리적 장착 및 텐던 구동 메커니즘을 이해한다.
  - 정밀 기구 조립을 위한 황동 인서트 및 나사 체결 기법을 습득한다.
  - 액추에이터 전원 분기 구성과 물리적 배선 안전 수칙을 준수하여 조립한다.
  - 손가락 구조와 텐던 장력 전달 경로를 정밀하게 정렬하고 고정한다.
  theory_markdown: "## 5지 로봇손 구동부 조립 원리\n\n5지 로봇손의 구동은 DYNAMIXEL XM430-W350-T 액추에이터의\
    \ 회전 운동을 Dyneema SK78 텐던을 통해 손가락 관절의 굴곡 운동으로 변환하는 방식입니다 [S2, S15]. \n\n### 1.\
    \ 액추에이터와 텐던 구동\nXM430-W350-T는 스톨 토크 4.1 N·m의 고성능 액추에이터로, 캡스턴(회전 풀리)에 텐던을 감아 관절을\
    \ 당깁니다 [S2]. 텐던은 신율이 1% 미만인 Dyneema SK78 소재를 사용하여 정밀한 위치 제어가 가능하도록 합니다 [S15].\
    \ 액추에이터 11개를 3개의 독립적인 12 V 전원 분기로 나누어 배분함으로써 시스템의 안정성을 확보합니다 [S14].\n\n### 2.\
    \ 정밀 기구 조립\nPC-CF 필라멘트로 제작된 구조물은 강성이 매우 높습니다 [S18]. 반복적인 조립 및 분해를 위해 M3 황동 열압입\
    \ 인서트를 사용합니다 [S20]. 이는 PC-CF 부품 내부에 암나사를 형성하여 나사 체결 시 파손을 방지합니다. 8 mm 정밀 알루미늄\
    \ 샤프트와 igus JSM-0810-10 폴리머 베어링은 관절 회전의 마찰과 유격을 최소화합니다 [S16, S17].\n\n### 3. 전기\
    \ 안전 및 배선\n전원 공급은 3개의 절연형 데스크톱 어댑터(GST160A12-R7B)를 사용하며, 각 분기는 10 A ATOF 퓨즈로 보호됩니다\
    \ [S14, S24]. 액추에이터 11대의 총 피크 전류는 25.3 A이므로, 3개 분기에 나누어 배분하여 전원 정격을 충분히 확보합니다\
    \ [S2, S14]. 배선 시에는 진동에 강한 Molex Micro-Fit 3.0 커넥터를 사용하여 모듈성을 높입니다 [S13]."
  worked_examples:
  - '예시 1: 액추에이터 전원 분기 할당. 11대의 액추에이터를 3개 분기에 4대/4대/3대로 배분합니다. 각 액추에이터의 스톨 전류는 2.3
    A이므로, 4대 배분 시 피크 전류 합계는 9.2 A입니다 [S2]. 이는 각 분기용 10 A 퓨즈의 정격 범위 내에 있습니다 [S24].'
  - '예시 2: 황동 인서트 열압입. PC-CF 부품의 4.0 mm 파일럿 홀에 M3 황동 인서트를 수직으로 삽입합니다 [S20]. 납땜 인두를
    사용하여 인서트 주변을 가열하고, 구조물과 인서트 윗면이 일치할 때까지 천천히 압입합니다.'
  lab:
    title: 5지 로봇손 구동부 정밀 조립 실습
    steps:
    - PC-CF 출력물의 파일럿 홀을 정리하고 M3 황동 인서트를 열압입합니다.
    - igus JSM-0810-10 베어링을 관절 하우징에 장착합니다.
    - 11대의 XM430-W350-T 액추에이터를 손바닥 프레임에 고정합니다.
    - Dyneema SK78 텐던을 캡스턴에 고정하고 손가락 링크를 따라 연결합니다.
    - Micro-Fit 3.0 커넥터를 사용하여 3개 독립 전원 분기를 구성하고 퓨즈 홀더를 장착합니다 [S13, S23].
    - 각 분기별 DC 전압을 멀티미터로 측정하여 12 V 정상 출력과 무전원 상태를 확인합니다.
    safety:
    - 인두 사용 시 화상 방지를 위해 보호 장갑을 착용합니다.
    - 충격 방지 작업용 보안경을 항시 착용합니다.
    - 전원 인가 시험 전 모든 액추에이터를 고정 지그에 장착하고 부하를 제거합니다.
    - 정비 및 부품 접근 전에는 반드시 3개의 절연 전원 어댑터를 물리적으로 분리하고 1 V 이하임을 계측 확인합니다.
    deliverables:
    - 조립 완료된 5지 로봇손 기구부 사진
    - 각 분기별 퓨즈 연결 및 배선도 확인서
    - 관절 운동 범위 및 텐던 장력 정렬 시험 로그
  assignment:
    title: 구동부 설계 보고서 작성
    deliverables:
    - 최종 조립 기구 및 배선 사진
    - 액추에이터 분기별 전류 계산 및 안전 퓨즈 선정 근거 보고서
    rubric:
    - 액추에이터 배분 및 퓨즈 보호 설계의 타당성
    - 황동 인서트 및 나사 체결의 정밀도
    - 독립 전원 분기의 분리 원칙 준수 여부
  quiz:
  - question: XM430-W350-T 액추에이터 11대를 3개 분기로 배분할 때, 한 분기에 4대를 연결하면 예상되는 피크 전류 합계는
      얼마입니까?
    choices:
    - 4.6 A
    - 9.2 A
