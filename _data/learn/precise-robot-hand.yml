- id: M5
  slug: actuator-integration
  phase_id: P2
  title: 액추에이터 통합
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 전기적 사양과 통신 인터페이스를 이해한다.
  - OpenCR 제어기의 전원 분기 및 센서 신호 처리 방식을 익힌다.
  - 독립 전원 분기를 활용하여 로봇손의 액추에이터 구동 시스템을 구성한다.
  - FSR 센서를 이용한 전압 분압 회로의 설계 및 측정 원리를 습득한다.
  theory_markdown: '### 액추에이터 구동 및 센서 인터페이스


    DYNAMIXEL XM430-W350-T는 12V 전압에서 동작하며, 스톨 전류는 2.3A로 정의된다 [S11]. 시스템 전체 피크 전류는
    액추에이터 11대의 스톨 전류 합계인 25.3A를 고려해야 한다 [S11]. 안정적인 전원 공급을 위해 138W(12V, 11.5A) 정격의
    절연형 데스크톱 어댑터 3개를 사용하며, 각 어댑터는 독립적인 분기로 할당된다 [S15]. 어댑터의 출력에는 10A ATOF 퓨즈를 인라인
    홀더를 통해 장착하여 과전류로부터 배선을 보호한다 [S23, S24].


    ### 힘 센서(FSR) 분압 회로 설계


    FSR 402 센서는 인가된 힘이 증가함에 따라 저항값이 감소하는 특성을 가진다 [S12]. OpenCR 제어기에서 센서 값을 읽기 위해 분압
    회로(Voltage Divider)를 구성한다. 3.3V 센서 전원 레일에 10kΩ 고정 저항(R_fix)을 직렬로 연결하고, FSR 센서(R_FSR)를
    접지에 연결할 경우 출력 전압(V_out)은 다음과 같이 계산된다 [S13, S25]:


    V_out = V_ref × (R_FSR / (R_FSR + R_fix))


    이 회로를 통해 힘이 가해질 때 FSR 저항이 낮아지면 ADC 입력 전압이 증가하여 0~3.3V 범위의 데이터를 취득할 수 있다 [S13].'
  worked_examples:
  - '전류 부하 계산: 액추에이터 4개를 포함하는 단일 전원 분기의 피크 전류는 4 * 2.3A = 9.2A이다. 사용 중인 어댑터의 정격 출력은
    11.5A이므로 분기당 충분한 용량을 확보하고 있으며, 10A 퓨즈를 통해 배선을 안전하게 보호할 수 있다 [S11, S15, S24].'
  - 'FSR 분압 설계 예시: 3.3V 공급 전압(V_ref) 환경에서 10kΩ 저항을 사용 시, 센서에 아무런 힘이 가해지지 않아 저항이 매우
    클 때(약 1MΩ 이상) 출력 전압은 약 3.26V에 가깝게 유지되며, 최대 힘(20N)이 가해져 저항이 낮아질수록 0V 방향으로 전압이 변화하여
    힘을 측정할 수 있다 [S12, S13, S25].'
  lab:
    title: 액추에이터 및 센서 통합 회로 구축
    steps:
    - 각 전원 어댑터의 출력에 퓨즈 홀더를 연결하고 10A 퓨즈를 삽입한다.
    - 전원 분기를 액추에이터 그룹별로 할당하여 커넥터를 통해 연결한다.
    - OpenCR 보드의 3.3V 센서 전원 레일에 FSR 센서와 10kΩ 저항을 연결하여 분압 회로를 구성한다.
    - 멀티미터를 DC 전압 모드로 설정하여 각 전원 분기 어댑터가 12V를 출력하는지 확인한다.
    - OpenCR 제어기를 PC에 연결하고 DYNAMIXEL Wizard 2.0을 통해 액추에이터 통신 상태를 점검한다 [S11, S13].
    safety:
    - 모든 전원 작업 시 반드시 3개의 독립 어댑터를 분리하고 전압을 확인한다.
    - 전원 인가 중 손가락 가동 범위에 신체 부위를 넣지 않는다.
    - 절단 작업 및 장력 시험 시 보안경을 상시 착용한다.
    - 3.3V 센서 레일과 12V 액추에이터 전원을 절대 혼용하지 않는다.
    - 벤치 전원은 저전압 프로토타입용이며, 안전 전문가의 검토 없는 현장 배치는 금지된다.
    deliverables:
    - 구성된 하드웨어 시스템 사진
    - 각 전원 분기의 출력 전압 측정 결과
    - 센서 입력 데이터 시각화 로그
  assignment:
    title: 전원 시스템 설계 및 검증 보고서
    deliverables:
    - 최종 배선도 설계안
    - 부하 분산 계산 근거가 포함된 전원 분석 보고서
    - FSR 데이터 시트 기반의 예상 출력 곡선 분석
    rubric:
    - 각 전원 분기의 독립성 유지 여부
    - 퓨즈 및 배선 정격의 적절성
    - ADC 입력 신호의 전기적 규격 준수 여부
  quiz:
  - question: FSR 402 센서와 10kΩ 저항을 사용하는 분압 회로에서, 힘이 가해질 때 센서 저항이 낮아지면 ADC 입력 전압은 어떻게
      변하는가?
    choices:
    - 전압이 낮아진다
    - 전압이 높아진다
    - 전압이 일정하게 유지된다
    - 전압이 0V가 된다
    answer_index: 1
    explanation: FSR이 접지에 연결되어 있고 10kΩ 저항이 3.3V에 연결된 분압기에서 FSR 저항이 낮아지면, 전체 회로 내에서
      FSR에 걸리는 전압 분배 비율이 작아지므로 ADC 입력(센서와 10kΩ 사이)은 상대적으로 높아집니다.
  - question: 본 시스템에서 12V 액추에이터 전원 분기와 3.3V 센서 전원 레일을 반드시 분리해야 하는 이유는 무엇인가?
    choices:
    - 전력 소비를 줄이기 위해
    - 노이즈를 방지하고 ADC 보호를 위해
    - 액추에이터 속도를 높이기 위해
    - 통신 속도 향상을 위해
    answer_index: 1
    explanation: 액추에이터 구동 시 발생하는 큰 전류와 노이즈가 민감한 센서 회로 및 ADC 입력부에 영향을 주는 것을 방지하고, 12V가
      ADC 입력으로 유입되어 OpenCR을 파손하는 것을 막기 위해서입니다.
  - question: 액추에이터 4대를 구동하는 전원 분기에 10A 퓨즈를 사용하는 가장 적절한 이유는?
    choices:
    - 퓨즈가 계획 정지 장치 역할을 하기 때문에
    - 스톨 전류 합계인 9.2A를 허용하면서 배선의 고장 보호를 제공하기 때문에
    - 전원 어댑터보다 더 낮은 전류를 허용하기 때문에
    - 전원 분기 효율을 높이기 때문에
    answer_index: 1
    explanation: 액추에이터 피크(스톨) 전류 합계인 9.2A보다 퓨즈 정격이 높아야 동작 중 차단을 막을 수 있고, 11.5A 어댑터
      출력 내에서 과전류 발생 시 배선을 보호하기에 적절합니다.
  completion_criteria:
  - 모든 전원 분기의 독립적인 12V 출력 확인
  - 독립 전원 분기 구성 및 퓨즈 보호 구현 완료
  - FSR 센서값의 ADC 데이터 수신 성공
  - 안전 지침 준수 및 모든 실습 과정 결과물 제출
  source_ids:
  - S11
  - S15
  - S23
  - S24
  - S12
  - S13
  - S25
- id: M6
  slug: tendon-routing
  phase_id: P2
  title: 텐션 케이블 라우팅
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 텐던 구동 로봇손의 케이블 라우팅 원리와 마찰 저항의 관계를 이해한다.
  - Dyneema SK78 고강도 섬유를 이용한 텐던의 물리적 특성과 유지보수 전략을 습득한다.
  - 관절 구동 시 케이블 경로의 최적화 기법을 학습한다.
  - 텐션 라우팅 과정에서의 마찰 관리와 기구적 신뢰성 확보 방법을 익힌다.
  theory_markdown: "## 텐션 케이블 라우팅의 기초\n\n로봇손의 손가락은 액추에이터의 회전 운동을 선형 장력으로 변환하여 구동됩니다.\
    \ 이때 텐던(Tendon)이라 불리는 고강도 섬유 케이블은 액추에이터의 토크를 관절 링크로 전달하는 핵심 요소입니다 [S16]. \n\n\
    ### 텐던의 재료 선택\n본 시스템은 `Dyneema SK78`을 텐던 재료로 사용합니다. 이 소재는 지름 1.5 mm에서 파단 하중 230\
    \ daN을 견딜 수 있으며, 작동 신율이 1% 미만으로 매우 낮아 고정밀 제어에 적합합니다 [S16]. 금속 케이블과 달리 유연성이 높지만,\
    \ 캡스턴(Capstan)이나 링크 통과부에서의 마찰에 의한 마모가 발생할 수 있습니다.\n\n### 라우팅 전략 및 마찰 관리\n1. **라운딩\
    \ 처리**: 케이블이 통과하는 링크의 모서리는 반드시 라운딩 처리를 하여 응력 집중과 마찰 마모를 줄여야 합니다. \n2. **마찰의 최소화**:\
    \ 케이블 경로 상의 접촉점은 텐션 유지에 큰 영향을 미칩니다. 경로의 굴곡을 최소화하고 매끄러운 가이드를 사용하는 것이 필수입니다.\n3.\
    \ **텐션 제어**: 액추에이터(XM430-W350-T)의 전류 피드백을 활용하면 텐던의 장력을 간접적으로 제어할 수 있습니다 [S11].\
    \ 케이블 라우팅이 원활하지 않으면 모터 전류가 실제 부하보다 높게 측정되어 제어 성능을 저하시킵니다."
  worked_examples:
  - '예제 1: 텐던 신율 계산. 1.5mm Dyneema 텐던이 200mm 경로를 따라 라우팅될 때, 1% 미만의 신율 하에서 최대 늘어나는
    길이는 2mm 이하임을 확인합니다. 이는 제어 소프트웨어의 위치 보정 값으로 활용됩니다.'
  - '예제 2: 캡스턴 곡률 반경 최적화. 액추에이터 회전축 캡스턴의 반지름을 8mm로 설계할 경우, 케이블의 굽힘 응력을 허용 범위 내로 유지하고
    반복적인 굽힘 시험을 통해 수명 예측 데이터를 확보합니다 [S16].'
  lab:
    title: 텐던 장착 및 라우팅 실습
    steps:
    - 손가락 링크 출력물의 케이블 통과 구멍에 이물질이 없는지 확인하고 필요 시 리머로 다듬는다.
    - 텐던 케이블을 각 링크의 경로대로 삽입하고 끝단을 고정한다.
    - 액추에이터 XM430-W350-T의 캡스턴에 케이블을 감고 장력을 조절한다 [S11].
    - 멀티미터를 이용해 3개의 절연 전원 분기 어댑터(GST160A12-R7B)가 각각 12V를 출력하는지 확인한다 [S15].
    - 고정 지그에 로봇손을 장착하고 무부하 상태에서 초기 텐션을 확인한다.
    safety:
    - 전원 인가 전에는 반드시 무부하 상태에서 손가락이 가동 범위 내에 장애물이 없는지 확인한다.
    - 케이블 절단 및 장력 조절 중에는 충격 방지 작업용 보안경을 반드시 착용한다.
    - 3개의 독립 전원 어댑터는 절대 양(+) 출력을 병렬로 연결하지 않는다 [S15].
    - 실험 중 정지는 3개 어댑터를 물리적으로 분리하고, 각 분기마다 DC 전압 모드에서 1V 미만임을 확인한 후 접근한다.
    - 본 프로토타입은 인증된 기계 안전 시스템이 아니므로, 실물 투입 전 기계 안전 전문가의 이중 채널 설계 및 검증이 필수적이다.
    deliverables:
    - 최적화된 케이블 경로가 포함된 CAD 파일
    - 텐션 장착 후 반복 운동 동영상 및 마찰 마모 검사 보고서
  assignment:
    title: 텐던 라우팅 효율성 평가
    deliverables:
    - 텐던 라우팅에 따른 마찰 저항 분석 보고서
    - 케이블 경로 개선 CAD 모델링 파일
    - 최종 로봇손 조립 및 작동 시연 데이터
    rubric:
    - 케이블 라우팅이 부드럽고 마찰 저항을 최소화하도록 설계되었는가?
    - Dyneema SK78 텐던의 특성을 반영한 적절한 인장 설계가 이루어졌는가?
    - 안전 지침을 준수하며 정지 회로를 물리적으로 분리하는 절차를 올바르게 수행하였는가?
    - 액추에이터 전류 피드백을 이용해 실제 장력을 제어하는 로직이 기술되었는가?
  quiz:
  - question: 본 교육 과정에서 사용하는 텐던(Dyneema SK78)의 특징으로 옳은 것은?
    choices:
    - 지름 대비 낮은 파단 하중을 가진다.
    - 작동 신율이 1% 미만으로 매우 낮다.
    - 반복적인 굽힘에 매우 취약하여 즉시 파손된다.
    - 금속 와이어보다 무겁다.
    answer_index: 1
    explanation: Dyneema SK78은 매우 낮은 신율(1% 미만)과 높은 강도를 가져 정밀한 텐션 구동에 적합합니다 [S16].
  - question: 실험 중 전원을 안전하게 차단하는 올바른 방법은 무엇인가?
    choices:
    - 퓨즈를 뽑아서 전원을 끈다.
    - 전원 스위치만 끄고 바로 손을 넣는다.
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터로 1V 미만인지 확인한다.
    - 지그에서 로봇손을 분리하지 않고 저항 모드로 측정한다.
    answer_index: 2
    explanation: 물리적 분리 후 DC 전압 모드로 잔류 전압을 확인하는 것이 유일한 안전 확보 방법입니다.
  - question: DYNAMIXEL XM430-W350-T 액추에이터의 기준 전압은 얼마인가?
    choices:
    - 5V
    - 12V
    - 24V
    - 3.3V
    answer_index: 1
    explanation: 해당 액추에이터의 기준 전압은 12V입니다 [S11].
  completion_criteria:
  - 텐던 장착 실습 단계에서 마찰 저항이 10% 이내로 유지됨을 데이터로 증명함.
  - 3개 독립 전원 어댑터의 전기적 분리 절차를 완벽하게 기술하고 준수함.
  - 텐던 신율 계산 예제를 이해하고 실제 로봇손 보정 값에 적용함.
  - 보안경 착용 및 1V 미만 검측 절차를 준수하여 실습을 완료함.
  source_ids:
  - S16
  - S11
  - S15
- id: M7
  slug: electronics-power-wiring
  phase_id: P2
  title: 전원 및 제어 배선
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - DYNAMIXEL 스마트 액추에이터 구동을 위한 12 V 전원 분기 배선 설계 및 구현
  - OpenCR 제어기와 FSR 힘 센서를 위한 3.3 V 센서 전원 회로 구성
  - 회로 보호를 위한 ATOF 퓨즈 설치 및 독립 전원 분기의 절연 원칙 숙지
  - Molex Micro-Fit 3.0 커넥터를 활용한 모듈별 탈착식 하네스 제작
  theory_markdown: '### 로봇손 전원 시스템 설계 원칙

    본 로봇손은 DYNAMIXEL XM430-W350-T 액추에이터 11개를 구동하기 위해 12 V 전원 어댑터 3개를 사용합니다 [S11, S15].
    각 어댑터는 11.5 A의 정격 출력을 가지며, 전체 액추에이터 피크 전류 25.3 A를 충분히 수용합니다 [S11, S15]. 시스템 안정성을
    위해 각 어댑터의 양(+) 출력은 독립적인 분기로 관리되어야 하며, 절대 서로 연결(병렬 결합)해서는 안 됩니다 [S15].


    ### 분기 보호 회로

    전원 분기마다 10 A ATOF 퓨즈를 인라인 홀더(0AFH0001Z)를 사용하여 설치합니다 [S23, S24]. 이는 배선 고장 시 과전류를
    차단하여 화재를 방지합니다. 퓨즈는 정격 전류 10 A로, 액추에이터 스톨 전류 합계가 가장 큰 분기에서도 안정적인 전력을 공급하면서도 배선
    손상을 방지하는 안전 구간을 형성합니다 [S11, S24].


    ### 센서 인터페이스

    OpenCR 제어기는 3.3 V 센서 전원 레일을 제공합니다 [S13]. FSR 402 센서와 10 kΩ 저항을 사용한 분압 회로는 반드시
    이 3.3 V 레일에서 전원을 공급받아야 하며, 액추에이터의 12 V 레일과는 완전히 분리되어야 합니다 [S12, S13, S25]. 12
    V가 센서 입력(ADC)으로 직접 유입될 경우 OpenCR 제어기가 영구적으로 손상될 수 있습니다.'
  worked_examples:
  - '예제 1: 4대 액추에이터 분기 전류 계산

    액추에이터 1대당 스톨 전류는 2.3 A이므로 4대 점유 분기의 최대 전류는 9.2 A입니다 [S11]. 10 A 퓨즈는 9.2 A를 상시
    통과시키고 고장 상황에서 차단하므로 적합합니다 [S24].'
  - '예제 2: 전원 분리 상태 확인

    전원 어댑터 어댑터-A와 어댑터-B의 양(+) 출력 단자가 물리적으로 연결되어 있는지 확인합니다. 멀티미터의 DC 전압 모드를 사용하여 각
    단자의 전압을 측정하고, 각 어댑터가 독립적인 액추에이터 분기를 담당함을 확인합니다 [S15].'
  lab:
    title: 전원 분기 및 센서 배선 실습
    steps:
    - 각 데스크톱 전원 어댑터 출력선에 ATO 인라인 퓨즈 홀더를 납땜하여 연결합니다 [S15, S23].
    - 각 분기마다 10 A ATOF 퓨즈를 홀더에 삽입합니다 [S24].
    - Molex Micro-Fit 3.0 커넥터를 사용하여 손가락 모듈별 전원 하네스를 제작합니다 [S14].
    - FSR 센서 1개당 10 kΩ 저항을 사용하여 전압 분압 회로를 구성하고, OpenCR의 3.3 V 센서 레일과 ADC 핀에 연결합니다
      [S12, S13, S25].
    safety:
    - 작업 전 모든 전원 어댑터를 물리적으로 콘센트에서 분리하고, 멀티미터 DC 모드로 분기 전압이 1 V 미만인지 반드시 확인합니다.
    - 액추에이터 12 V 전원과 센서 3.3 V 전원이 절대 섞이지 않도록 배선 색상을 구분합니다.
    - 납땜 인두 사용 시 화상 주의 및 충분한 환기를 실시합니다.
    deliverables:
    - 완성된 독립 3분기 전원 배선도
    - 분기별 전압 무부하 측정치
    - FSR 센서별 초기 저항 및 전압 분압값 교정 기록
  assignment:
    title: 로봇손 배선 안전 보고서 작성
    deliverables:
    - 로봇손 전체 배선도 (전원 분기, 퓨즈 위치, 접지 포함)
    - 전원 분기별 부하 배분 분석 (액추에이터 4대/4대/3대 배분 이유)
    - 비상시 전원 차단 절차 매뉴얼
    rubric:
    - 각 분기가 독립적으로 설계되고 퓨즈가 정격에 맞게 배치되었는가?
    - 3.3 V 센서 회로와 12 V 액추에이터 회로가 명확히 분리되었는가?
    - 물리적 차단 방식이 안전하게 명시되었는가?
  quiz:
  - question: FSR 힘 센서의 전압 분압 회로에 적합한 전원 레일은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원 레일
    - 3.3 V OpenCR 센서 레일
    - 5 V 전원 레일
    - 배터리 직접 연결
    answer_index: 1
    explanation: OpenCR의 ADC는 0~3.3 V 범위에서 작동하며 센서 회로는 3.3 V 센서 레일에서 공급받아야 합니다 [S13].
  - question: 전원 어댑터의 양(+) 출력을 병렬로 연결하는 것은 어떤 위험을 초래합니까?
    choices:
    - 전압 안정성 향상
    - 전류 공급 용량 증대
    - 절연 파괴 및 심각한 전기적 고장
    - 액추에이터 토크 증가
    answer_index: 2
    explanation: 독립 절연 전원 어댑터의 출력을 임의로 연결하면 역전류 또는 전압 불균형으로 인해 절연이 파괴될 수 있으므로 엄격히
      금지됩니다 [S15].
  completion_criteria:
  - 모든 3개 전원 분기의 물리적 분리 및 퓨즈 정상 설치 확인
  - FSR 센서 전압 분압 회로가 3.3 V 레일에 올바르게 연결되어 있음을 계측 확인
  - 전원 인가 전 각 분기별 단락 여부를 멀티미터(비저항 모드 지양, 전압 확인 후)로 최종 점검 완료
  source_ids:
  - S13
  - S14
  - S15
  - S11
  - S23
  - S24
  - S12
  - S25
- id: M8
  slug: controller-firmware-dev
  phase_id: P3
  title: 펌웨어 개발
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - OpenCR 제어 보드의 아키텍처와 DYNAMIXEL 제어 프로토콜 2.0 이해
  - STM32 기반 펌웨어 환경에서 실시간 액추에이터 상태 모니터링 및 명령 루프 구현
  - FSR 센서의 아날로그 전압 신호를 ADC로 취득하고 힘 데이터로 변환하는 알고리즘 작성
  - 비상 상황 및 과전류 발생 시 액추에이터 동작을 제어하는 안전 상태기계 설계
  theory_markdown: '### OpenCR 제어 보드와 DYNAMIXEL 2.0 프로토콜

    OpenCR 1.0은 216 MHz 주파수로 동작하는 STM32F7 기반 제어기로, 별도의 통신 브리지 없이 DYNAMIXEL 스마트 액추에이터와
    직접 통신합니다 [S13]. DYNAMIXEL Protocol 2.0은 고속 직렬 통신을 통해 위치, 속도, 부하(전류), 온도 등의 데이터를
    실시간으로 주고받습니다. 액추에이터 `XM430-W350-T`는 12 V 전압에서 구동되며 최대 2.3 A의 스톨 전류를 가집니다 [S11].


    ### FSR 센서 신호 처리

    FSR 402 센서는 가해진 힘이 증가함에 따라 저항이 감소하는 특성을 가집니다 [S12]. OpenCR의 ADC(12비트 해상도)를 활용하여
    정밀한 힘 데이터를 취득하기 위해 10 kΩ 분압 저항을 사용하여 전압 분배 회로를 구성합니다 [S13, S25]. 센서 전압은 반드시 OpenCR의
    3.3 V 센서 전원 레일에서 공급받아야 하며, 절대 12 V 액추에이터 전원과 혼용해서는 안 됩니다 [S13].


    ### 안전 상태기계(Safety State Machine)

    펌웨어는 단순히 명령을 수행하는 것뿐만 아니라 로봇손의 현재 상태를 감시해야 합니다. 과부하(전류 스톨), 고온, 통신 오류 시 액추에이터를
    정지시키거나 안전 모드로 전환하는 로직을 구현합니다. 본 프로토타입은 인증된 하드웨어 비상정지 회로를 포함하지 않으므로, 펌웨어 수준의 예외
    처리는 기구적 과부하 방지 목적입니다.'
  worked_examples:
  - '액추에이터 전류 읽기: XM430 액추에이터의 현재 부하 데이터를 Protocol 2.0 패킷으로 요청하여, 2.3 A 스톨 전류 한계치
    내에 있는지 확인하는 실시간 피드백 루프 예제.'
  - 'FSR 전압 변환 예제: 12비트 ADC 값(0~4095)을 읽어, 3.3 V 기준의 전압 값으로 변환하고 이를 다시 센서 데이터시트의 저항-힘
    관계식을 참고하여 뉴턴(N) 단위로 스케일링하는 알고리즘.'
  lab:
    title: OpenCR 펌웨어 실습 및 FSR 센서 데이터 취득
    steps:
    - OpenCR 1.0에 12 V 분기 전원과 DYNAMIXEL 액추에이터를 연결합니다.
    - Arduino IDE 환경에서 OpenCR 라이브러리를 통해 액추에이터 통신 테스트를 진행합니다.
    - FSR 센서와 10 kΩ 저항을 사용하여 분압 회로를 구성하고, 3.3 V 센서 레일에 연결합니다.
    - ADC 값을 읽어 시리얼 플로터로 힘 입력에 따른 신호 변화를 확인합니다.
    - '특정 힘(예: 5 N) 이상 감지 시 액추에이터가 멈추는 간단한 안전 루프를 작성합니다.'
    safety:
    - 실험 전 3개 독립 절연 전원 어댑터를 물리적으로 분리하고, 멀티미터 DC 전압 모드로 각 분기의 전압이 1 V 미만인지 확인합니다.
    - 전원 인가 중에는 절대로 로봇손의 가동 범위 내에 손을 넣지 않습니다.
    - FSR 센서 회로 구성 시 5 V나 12 V 레일과 연결하지 않도록 주의합니다. 반드시 3.3 V 센서 레일만 사용합니다.
    - 납땜 인두 사용 시 보안경을 착용합니다.
    deliverables:
    - FSR 센서 데이터 취득 및 액추에이터 제어 펌웨어 소스 코드
    - 힘 입력에 따른 ADC 출력 데이터 변환 교정 기록
    - 과부하 감지 및 정지 동작 시험 영상
  assignment:
    title: 안전 상태기계가 통합된 로봇손 펌웨어 구현
    deliverables:
    - 로봇손 제어 및 FSR 피드백 펌웨어(.ino)
    - 펌웨어 구조 및 상태기계 순서도(PDF)
    - 단위별 기능 검증 최종 보고서
    rubric:
    - Protocol 2.0을 통해 액추에이터 데이터가 정확히 취득되는가?
    - FSR 센서 값이 물리적인 힘(N)으로 적절히 변환되는가?
    - 비정상적 힘 감지 시 액추에이터가 즉시 대응하는가?
    - 모든 회로가 3.3 V 센서 레일 및 12 V 액추에이터 전원으로 분리되어 설계되었는가?
  quiz:
  - question: FSR 센서의 전압 분압 회로에 공급해야 하는 전압은 얼마인가요?
    choices:
    - 12 V
    - 5 V
    - 3.3 V
    - 24 V
    answer_index: 2
    explanation: OpenCR의 ADC는 0~3.3 V 범위를 사용하며, FSR 센서의 전압 분압 회로는 반드시 3.3 V 센서 레일에서
      공급받아야 합니다.
  - question: 액추에이터 XM430-W350-T의 기준 전압은 얼마인가요?
    choices:
    - 12 V
    - 24 V
    - 5 V
    - 3.3 V
    answer_index: 0
    explanation: XM430-W350-T 액추에이터는 12 V 전원 입력을 기준으로 합니다.
  completion_criteria:
  - 제출한 펌웨어가 5개 FSR 센서 데이터를 정상적으로 수신하고 액추에이터를 제어함.
  - 실습 중 3개 절연 전원 어댑터의 물리적 분리 및 DC 전압 측정 확인을 완료함.
  - 힘 센서 교정 데이터와 펌웨어 코드의 일관성이 검증됨.
  source_ids:
  - S5
  - S13
  - S11
  - S12
  - S25
- id: M9
  slug: sensor-calibration
  phase_id: P3
  title: 센서 보정
  estimated_hours: 5.0
  prerequisites:
  - M8
  objectives:
  - FSR 402 센서의 압력-저항 특성을 이해한다.
  - OpenCR ADC 입력을 활용하여 힘 신호를 전압으로 변환하는 분압 회로를 설계한다.
  - 센서 데이터를 보정하여 디지털값에서 실제 힘(N) 단위로 매핑하는 과정을 익힌다.
  theory_markdown: '### FSR 센서의 동작 원리

    FSR(Force Sensing Resistor) 402는 압력에 따라 저항값이 감소하는 박막형 센서입니다 [S12]. 이 센서는 힘이 가해지지
    않았을 때 매우 큰 저항(수 MΩ 이상)을 가지며, 최대 20N의 힘이 가해질 때까지 저항이 비선형적으로 감소합니다 [S12].


    ### 전압 분압 회로 설계

    OpenCR 보드의 ADC(아날로그-디지털 변환기)는 0~3.3 V 범위의 전압을 12비트 해상도로 디지털화합니다 [S13]. FSR을 ADC에
    연결하려면 고정된 10 kΩ 저항 [S25]을 사용하여 전압 분압 회로를 구성해야 합니다. 회로의 출력 전압 $V_{out}$은 다음과 같이
    정의됩니다:

    $$V_{out} = V_{ref} \times \frac{R_{fixed}}{R_{FSR} + R_{fixed}}$$

    여기서 $V_{ref}$는 3.3 V 센서 전원이며, $R_{fixed}$는 10 kΩ입니다. 이를 통해 센서의 저항 변화를 전압 신호로 취득할
    수 있습니다 [S25].'
  worked_examples:
  - '예제 1: 센서 저항이 10 kΩ일 때 ADC 전압 계산. $V_{out} = 3.3V \times (10k / (10k + 10k)) =
    1.65V$. 12비트 ADC 값은 약 2048(0~4095)입니다 [S13].'
  - '예제 2: 힘 증가에 따른 저항 감소. FSR 저항이 2 kΩ으로 낮아지면 $V_{out} = 3.3V \times (10k / (2k +
    10k)) = 2.75V$. ADC 값은 약 3413입니다 [S13].'
  lab:
    title: 손끝 FSR 데이터 수집 및 보정 실습
    steps:
    - OpenCR의 3.3 V 센서 레일과 GND를 사용하여 FSR 402와 10 kΩ 저항으로 전압 분압 회로를 구성합니다 [S13, S25].
    - 분압된 전압 노드를 OpenCR의 ADC 입력 핀에 연결합니다 [S13].
    - 제어 코드를 실행하여 무부하 상태의 ADC 초기값을 기록합니다.
    - 알려진 무게(표준 분동)를 센서에 가하여 힘(N)과 ADC 값의 상관관계를 표로 작성합니다.
    - 비선형 보간법을 사용하여 ADC 데이터를 힘(N)으로 변환하는 보정 함수를 작성합니다.
    safety:
    - 모든 전원 분기는 반드시 10 A ATOF 퓨즈를 통과해야 합니다 [S24].
    - 전원 인가 전 멀티미터를 사용하여 3.3 V 센서 레일이 다른 전원과 단락되지 않았는지 확인합니다.
    - 테스트 중 전원 공급장치 3개를 물리적으로 분리한 후 1 V 미만임을 확인하기 전까지 손을 가동 범위에 넣지 않습니다.
    - 실험 중 보안경을 필수로 착용합니다.
    deliverables:
    - 보정 전후의 힘-ADC 값 비교 그래프
    - 센서 보정 보정 상수 파라미터 테이블
    - FSR-ADC 데이터 취득 코드
  assignment:
    title: FSR 데이터 보정 보고서
    deliverables:
    - 최종 센서 보정 알고리즘 소스 코드
    - 힘 측정 오차 분석 보고서
    - 보정 함수의 선형성 개선 방안
    rubric:
    - 분압 회로의 전기적 연결이 명세와 일치하는가
    - 보정 함수의 힘 단위 변환 정밀도가 만족스러운가
    - 안전 수칙을 준수하여 계측하였는가
  quiz:
  - question: FSR 402 센서를 OpenCR에 연결할 때 권장하는 아날로그 전원 전압은 무엇입니까?
    choices:
    - 12 V
    - 5 V
    - 3.3 V
    - 0 V
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3 V를 기준으로 하며, 센서 회로는 3.3 V 센서 전원을 사용해야 합니다 [S13].
  - question: 분압 회로에서 FSR에 가해지는 힘이 증가하면 출력 전압은 어떻게 변합니까?
    choices:
    - 증가한다
    - 감소한다
    - 변하지 않는다
    - 0 V가 된다
    answer_index: 0
    explanation: FSR은 힘이 증가하면 저항이 감소하여 $V_{out} = V_{ref} \times (R_{fixed} / (R_{FSR}
      + R_{fixed}))$ 식에 따라 $V_{out}$이 증가합니다.
  completion_criteria:
  - ADC 전압 신호가 0~3.3 V 범위 내에 있음을 확인
  - 5개 손끝 센서 모두 0.2 N~20 N 범위에서 정상 작동 확인
  - 데이터 보정 완료 및 최종 보고서 제출
