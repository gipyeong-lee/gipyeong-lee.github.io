- id: m10
  slug: testing-validation
  phase_id: phase-3
  title: 검증 및 내구 시험
  estimated_hours: 5.0
  prerequisites:
  - m9
  objectives:
  - 로봇손의 성능 검증을 위한 정량적 시험 프로토콜을 이해한다.
  - 텐던 구동 로봇손의 내구 시험을 위한 반복 하중 시험 설계를 수행한다.
  - 시스템 안전을 위한 비상 차단(E-stop) 회로의 동작을 검증한다.
  - FSR 센서 데이터를 활용한 파지력 제어 정밀도를 평가한다.
  theory_markdown: '로봇손의 최종 검증은 설계 사양의 만족 여부를 확인하는 핵심 단계이다. 텐던 구동 방식의 경우, 기구학적 정확도뿐만
    아니라 텐던의 반복 하중 하에서의 신율 변화와 마찰 특성이 성능에 큰 영향을 미친다 [S10]. Dyneema SK78 소재의 텐던은 작동
    신율이 1% 미만으로 정밀도 유지에 유리하지만, 반복적인 관절 굽힘에 따른 피로 누적을 고려해야 한다 [S16].


    전기 시스템 검증에서는 각 액추에이터의 스톨 전류 합계가 시스템의 전력 공급 능력을 초과하지 않는지 확인해야 한다 [S12, S15]. 본
    시스템은 11대의 액추에이터를 3개의 독립 분기로 배분하여 구동하며, 각 분기마다 10 A ATOF 퓨즈를 통해 과전류를 방지한다 [S15,
    S28]. 전체 시스템 피크 전류인 25.3 A를 수용하기 위해, 3개의 독립 11.5 A 출력 전원 어댑터를 개별 분기에 할당하여 병렬 연결
    없이 각각 안전하게 운용한다 [S15]. 비상 정지 시스템은 A22E 버튼, G7SA 안전 릴레이, G2R 코일 제어 릴레이 및 EV200
    접촉기를 계층적으로 구성하여 독립 전원 분기를 동시에 차단하도록 설계되어야 한다 [S23, S24, S25, S26].'
  worked_examples:
  - '사례 1: 분기별 전류 계산. 액추에이터 4대(스톨 전류 각 2.3 A)가 배치된 분기의 총 피크 전류는 9.2 A이다. 이는 10 A 퓨즈의
    정격 이내이며 11.5 A 전원 어댑터의 용량을 만족한다 [S12, S15, S28].'
  - '사례 2: 비상 정지 동작 검증. 비상 정지 버튼(A22E)을 누르면 NC 접점이 개방되어 G7SA 안전 릴레이의 코일 전원이 차단된다 [S25].
    이로 인해 3개의 NO 접점이 열리며 각 G2R 코일 릴레이의 전원이 차단되고, 결과적으로 EV200 코일이 비전원화되어 고전류 모터 분기가
    차단된다 [S23, S24, S26].'
  lab:
    title: 로봇손 시스템 검증 및 안전 시험
    steps:
    - 각 독립 전원 분기의 전압이 12 V인지 멀티미터로 확인한다 [S15].
    - 비상 정지 버튼을 작동하여 3개 EV200 접촉기가 동시에 개방되고 모터 전원이 차단되는지 확인한다 [S26].
    - 각 손가락의 텐던에 10,000회 반복 굽힘을 수행하여 조기 마모나 신율 변화를 기록한다.
    - FSR 센서에 표준 질량을 인가하여 힘-ADC 출력 곡선을 작성하고 교정 기록을 작성한다 [S13, S14].
    safety:
    - 반드시 보안경을 착용한다.
    - 모든 회로 검증은 저전압 벤치 전원 환경에서 수행한다.
    - 모터 구동 중에는 끼임 방지를 위해 로봇손 동작 범위에 손을 넣지 않는다.
    - 전원 차단 시험 시에는 반드시 독립 퓨즈 분기가 모두 정상인지 확인한다.
    deliverables:
    - 비상 차단 검증 체크리스트
    - FSR 센서 교정 곡선 데이터
    - 10,000회 내구 시험 결과 보고서
  assignment:
    title: 로봇손 시스템 신뢰성 분석 보고서
    deliverables:
    - 시스템 분기별 전류 분포 및 퓨즈 보호 타당성 분석
    - 텐던 피로 하중 시험의 신율 측정 데이터 그래프
    - 비상 정지 동작 단계별 타임라인 분석
    rubric:
    - 전원 분기 독립성 및 퓨즈 보호 설계의 타당성 (30%)
    - FSR 센서 교정 데이터의 정밀도 분석 (30%)
    - 비상 정지 회로의 논리적 계층 검증 결과 (40%)
  quiz:
  - question: 본 시스템에서 3개의 12 V 전원 어댑터 출력을 병렬 연결하면 안 되는 이유는 무엇입니까?
    choices:
    - 전압 강하가 발생하여 모터 토크가 저하되기 때문
    - 독립된 퓨즈 분기 및 안전 차단 체계를 유지하기 위해
    - 어댑터 간의 전압 차이로 인한 역전류 발생 위험
    - 케이블 단면적이 부족하기 때문
    answer_index: 1
    explanation: 각 분기는 독립적인 안전 차단과 과전류 보호를 위해 분리되어 운용되어야 하며, 이를 위해 병렬 연결은 절대 금지됩니다
      [S15].
  - question: EV200AAANA 접촉기의 코일 돌입전류를 스위칭하기 위해 권장되는 제어 순서는?
    choices:
    - A22E 직접 연결
    - G7SA 접점 직접 구동
    - G7SA NO 접점 -> G2R 릴레이 -> EV200 코일
    - OpenCR 직접 구동
    answer_index: 2
    explanation: EV200 코일의 돌입 전류는 A22E나 G7SA 접점 허용치를 초과할 수 있으므로, 검증된 G2R 중계 릴레이를 거쳐
      제어해야 합니다 [S24, S26].
  - question: FSR 402 센서 신호를 OpenCR ADC로 읽을 때 적절한 전원은?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    - 24 V 입력 전원
    - 5 V USB 전원
    answer_index: 1
    explanation: OpenCR의 ADC 사양과 센서 보호를 위해 3.3 V 전압 분압 회로를 사용해야 합니다 [S14].
  completion_criteria:
  - 모든 독립 전원 분기의 퓨즈 및 차단 동작 검증 완료
  - FSR 센서 교정 및 정밀도 데이터 보고서 제출
  - 비상 정지 시험 시 회로 차단 시간 및 안전성 확인
