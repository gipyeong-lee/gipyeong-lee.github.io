    - 센서 신호 처리의 현실적 구현 가능성
  quiz:
  - question: 시각-촉각 융합이 시각-전용 제어보다 유리한 주요 이유는 무엇인가?
    choices:
    - 시각 정보의 해상도를 높여주기 때문에
    - 접촉 불확실성과 슬립 상황을 실시간으로 감지할 수 있기 때문에
    - 로봇 손의 모터 속도를 빠르게 해주기 때문에
    - 로봇 손의 배터리 소모를 줄여주기 때문에
    answer_index: 1
    explanation: 시각은 전체적인 환경 파악에 유리하나, 접촉 시 발생하는 미세한 슬립이나 접촉 불확실성 대응에는 촉각이 훨씬 빠르고
      정확합니다.
  - question: 로봇 손에서 강성(Stiffness)을 추론하기 위해 필요한 데이터는 무엇인가?
    choices:
    - 물체의 색상과 크기
    - 접촉 면적과 인가된 힘의 변화율
    - 손가락 모터의 전류값
    - 손가락의 최종 위치
    answer_index: 1
    explanation: 강성은 물체가 힘을 받았을 때 얼마나 변형되는지를 측정해야 하므로 인가된 힘과 그에 따른 접촉 면적의 변화를 측정해야
      합니다.
