- id: M2
  slug: mechanical-design
  phase_id: P1
  title: 로봇 손 기구 설계
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 5지 로봇손의 기구학적 요구사항을 정의하고 인간 손 구조와의 차이점을 이해한다.
  - 텐던 구동(Tendon-driven) 메커니즘의 기본 원리와 기계적 장점을 분석한다.
  - 3D 프린팅 가능한 탄소섬유 복합체(PC-CF)를 활용한 설계 최적화 기법을 습득한다.
  - 관절축(Bearing)과 열압입 나사산 인서트(Insert)의 공차 설계를 통한 조립 재현성을 확보한다.
  theory_markdown: '### 로봇 손의 기구학적 설계


    로봇 손은 인간의 파지 능력을 모사하는 정밀 기구입니다. 특히 텐던(Tendon) 구동 방식은 모터를 손바닥이나 팔뚝에 배치하여 손가락의 질량을
    최소화하고, 이를 통해 관성력을 낮추어 빠른 반응속도와 정밀한 조작을 가능하게 합니다 [S4, S12].


    #### 1. 텐던 구동 메커니즘

    텐던 구동 로봇 손은 섬유를 통해 토크를 전달합니다. `Dyneema SK78`과 같은 고강도 저신율(작동 신율 < 1%) 소재를 사용하여
    장력 전달 시 유격을 방지하고 신뢰성 있는 위치 제어를 수행합니다 [S19]. 텐던이 통과하는 경로의 캡스턴(Capstan) 곡률은 마찰 손실을
    최소화하도록 설계해야 합니다.


    #### 2. 재료 및 구조 최적화

    구조체 제작을 위해서는 `Prusament PC Blend Carbon Fiber`를 사용합니다 [S22]. 이는 높은 강성과 치수 안정성을
    제공하며, 반복 조립을 위해 `M3 황동 열압입 인서트(HTBI-M3-BR)`를 사용하여 체결 부위의 마모를 방지합니다 [S24].


    #### 3. 회전축 설계

    관절의 마찰과 유격 관리는 제어 성능에 직결됩니다. 무급유 `igus JSM-0810-10` 베어링은 `8 mm 정밀 알루미늄 샤프트(AWMP-08)`와
    최적의 공차를 유지하여 부드러운 움직임을 보장합니다 [S20, S21].'
  worked_examples:
  - '예제 1: 텐던 장력 계산. 액추에이터의 스톨 토크가 4.1 N·m이고 캡스턴 반경이 10 mm일 때, 텐던에 인가되는 이론적 최대 장력(F
    = T/r)은 410 N입니다. Dyneema SK78의 파단 하중이 230 daN(약 2300 N)이므로 안전율은 충분합니다 [S14, S19].'
  - '예제 2: 인서트 설계. 4.4 mm 외경의 인서트를 삽입하기 위해 PC-CF 출력물에 4.0 mm 파일럿 홀을 설계합니다. 이는 열압입
    과정에서 수지가 연화되어 인서트 주위로 적절히 충진되도록 돕습니다 [S22, S24].'
  lab:
    title: 관절 유격 시험 및 텐던 마찰 측정
    steps:
    - PC-CF로 출력된 링크에 베어링을 삽입하고 8 mm 샤프트를 조립하여 회전 부드러움을 확인합니다.
    - 열압입 인서트를 4 mm 파일럿 홀에 삽입하고 M3 볼트로 조립하여 체결력을 시험합니다.
    - 텐던 라인을 캡스턴에 감고 멀티미터를 사용하여 텐던 정지 마찰력을 측정합니다.
    - 전원 인가 전 3개 전원 분기의 절연 상태를 멀티미터로 확인합니다.
    safety:
    - 절단 작업 시 보안경을 반드시 착용하십시오.
    - 텐던 장력 시험 중에는 장력이 급격히 해제될 수 있으므로 손을 가동 범위에 두지 마십시오.
    - 전원 공급 전 모든 회로를 무전원 상태로 계측(1 V 이하) 확인하십시오.
    deliverables:
    - 회전축 공차 측정 결과 보고서
    - 인서트 열압입 전후 체결력 비교 데이터
    - 텐던 마찰 시험 영상 및 장력 손실 분석
  assignment:
    title: 로봇 손 기구 상세 설계안 제출
    deliverables:
    - 5지 로봇 손 CAD 모델링 파일(STEP)
    - 텐던 경로를 포함한 상세 도면
    - BOM 및 부품별 조립 사양 기술서
    rubric:
    - 관절축(Bearing)과 샤프트의 물리적 공차 설계 적절성
    - 텐던 구동 경로의 간섭 최소화 및 마찰 감소 설계
    - 모든 체결 부위의 인서트 사용 여부 및 표준 규격 준수
    - 전원 분기 구조의 BOM 명시 내용 포함 여부
  quiz:
  - question: 텐던 구동 로봇 손에서 Dyneema SK78을 사용하는 주된 이유는 무엇입니까?
    choices:
    - 높은 전기 전도성을 위해
    - 작동 신율이 낮고 높은 파단 하중을 갖기 위해
    - 열팽창 계수가 매우 높기 때문에
    - 가격이 가장 저렴해서
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 매우 낮고 파단 하중이 높아 텐던 구동 시 정밀한 힘 전달에 적합합니다
      [S19].
  - question: PC-CF 출력물에 열압입 인서트를 사용할 때 파일럿 홀의 역할은 무엇입니까?
    choices:
    - 구조적 강도를 극대화하기 위해 구멍을 최대한 크게 뚫기 위함
    - 열압입 시 수지가 연화되어 인서트 주위를 적절히 충진하게 하기 위함
    - 나사 조임 토크를 줄이기 위함
    - 베어링 유격을 조정하기 위함
    answer_index: 1
    explanation: 파일럿 홀(4 mm)은 인서트(4.4 mm)의 외경보다 작게 설계되어, 열압입 시 주변 수지가 연화되어 인서트의 널링(knurling)
      사이로 유입되도록 합니다 [S22, S24].
  - question: 시스템 검증 중 무전원 상태를 확인하는 올바른 방법은 무엇입니까?
    choices:
    - 멀티미터의 저항 모드로 도통 확인
    - 회로의 퓨즈가 제거되었는지 눈으로 확인
    - 멀티미터의 DC 전압 모드로 각 분기별 1 V 이하임을 확인
    - 전원을 끈 후 5초 대기
    answer_index: 2
    explanation: 안전을 위해 저항이나 도통 모드가 아닌, 반드시 DC 전압 모드로 실제 잔류 전압이 1 V 미만임을 계측해야 합니다.
  completion_criteria:
  - 5지 로봇 손의 상세 기구 설계 도면 및 CAD 파일 제출
  - 부품 공차 및 인서트 설계의 기술적 타당성 확인
  - 모든 실습 안전 수칙 준수 및 기록 작성
  - 이론 퀴즈 100% 정답 도달
