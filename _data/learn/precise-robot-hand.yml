- id: m10
  slug: final-report
  phase_id: p3
  title: 최종 보고서 작성
  estimated_hours: 5.0
  prerequisites:
  - m9
  objectives:
  - 로봇손 제작 전 과정의 데이터를 체계적으로 기록하고 분석합니다.
  - 기술적 의사결정과 문제 해결 과정을 보고서 형식으로 문서화합니다.
  - 정교한 5지 로봇손 프로젝트의 설계, 제작, 검증 결과를 기술 표준에 맞춰 요약합니다.
  - 프로젝트 성과를 정량적 데이터(파지력, 신뢰성, 성능 지표 등)로 입증합니다.
  theory_markdown: '## 엔지니어링 기술 보고서의 구성과 중요성


    공학적 프로젝트의 성공은 완성된 하드웨어뿐만 아니라, 그 개발 과정을 입증하는 기술 보고서의 완결성으로 결정됩니다 [S10]. 기술 보고서는
    프로젝트의 설계 의도, 사용된 구성 요소의 사양, 시행착오를 통한 문제 해결 과정, 그리고 최종적인 성능 검증 결과를 기록한 공식적인 기술
    자산입니다.


    ### 보고서의 핵심 구성 요소

    1. **개요(Abstract/Summary):** 프로젝트의 목표, 주요 성능 지표(KPI), 도달한 결과를 요약합니다.

    2. **시스템 설계 및 사양:** 시스템 아키텍처, 회로도, BOM(Bill of Materials) 등을 포함합니다 [S10]. 모든 부품
    사양(예: 액추에이터 스톨 토크 4.1 N·m [S12], 센서 감지 범위 0.2-20 N [S13])은 데이터시트와 일치해야 합니다.

    3. **제작 및 구현:** 3D 프린팅 설정(PC-CF 재료 물성 [S20]), 배선 구성(전원 분기 및 퓨즈 보호 [S16, S26]),
    소프트웨어 제어 로직을 다룹니다.

    4. **검증 및 분석:** 파지 시험 결과, 내구 시험 데이터, 제어 응답성을 분석하여 설계 목표 대비 달성도를 확인합니다.


    ### 데이터 기반 분석

    정교한 로봇손 개발에서는 정량적 데이터가 필수입니다. 11개의 액추에이터(XM430-W350-T [S12])를 사용하는 본 프로젝트에서는 각
    분기별 전류 소모량을 확인하여, 설계한 10 A 퓨즈 [S26]가 정격 내에서 안전하게 작동하는지 검증해야 합니다. 또한, 텐던 장력 전달에
    사용된 Dyneema SK78 [S17]의 신율 및 파단 하중 데이터를 기록하여 로봇손의 내구성을 예측할 수 있습니다.'
  worked_examples:
  - '예시 1: 성능 지표 요약 - Ruka-v2 논문 [S10]에 따르면, 이전 모델 대비 파지 작업 완료 시간 51.3% 단축 및 성공률 21.2%
    증가를 달성했습니다. 이와 같이 본인의 로봇손 프로젝트에서도 설계 목표치(예: 파지력, 반복 위치 정밀도) 대비 성과를 데이터로 도표화하여
    제시하십시오.'
  - '예시 2: 구성 요소 사양 일치 확인 - 최종 보고서 내 BOM 섹션 작성 시, 부품 사양은 항상 Datasheet 기반으로 기록합니다.
    예: ''손끝 FSR은 Interlink FSR 402를 사용하였으며, 이는 0.2~20 N의 접촉력을 감지할 수 있어 미세한 물체 파지에
    적합함 [S13]'''
  lab:
    title: 최종 프로젝트 데이터 검증 및 보고서 작성
    steps:
    - 프로젝트 전체 기간 동안 수집된 파지 시험 데이터 및 내구 시험 결과를 정리합니다.
    - 사용된 하드웨어 구성의 BOM을 기술된 사양(전압, 전류, 강도 등)과 일치하게 최종 검토합니다.
    - 각 분기별 절연형 전원 어댑터 [S16]의 전압이 12 V로 유지되는지 계측 기록을 확인합니다.
    - 기술 보고서 초안을 작성하고, 설계 의도와 구현 결과 간의 차이를 분석합니다.
    safety:
    - 정비 및 접근 전 3개 절연 전원 어댑터를 물리적으로 분리하고 DC 전압 모드에서 1 V 미만임을 계측 확인하십시오.
    - 절대 저항/연속성 모드를 전원 차단 확인의 증거로 사용하지 마십시오.
    - 보고서 작성 중 펌웨어 최신화 또는 제어 코드 시험을 병행할 경우, 반드시 무부하 상태에서 고정 지그를 사용하십시오.
    deliverables:
    - 최종 로봇손 프로젝트 기술 보고서 (PDF)
    - 최종 수정된 CAD 파일 및 도면집
    - 검증 데이터 및 시험 성적서(파지 시험, 내구 시험 포함)
    - 펌웨어 소스 코드 및 제어 알고리즘 설명서
  assignment:
    title: 최종 프로젝트 성과 분석 및 결과물 제출
    deliverables:
    - 최종 기술 보고서
    - 최종 BOM 및 배선도
    - 성능 시험 결과 데이터
    rubric:
    - 보고서 내 모든 부품 사양은 공급된 사양 및 데이터시트와 일치해야 함
    - 파지 및 내구 시험 결과가 정량적 데이터로 제시되어야 함
    - 전원 분기 및 과전류 보호(퓨즈 사용) 원칙이 기술되어야 함
    - 안전 지침 준수 및 계측 기록이 문서에 포함되어야 함
  quiz:
  - question: 로봇손 최종 기술 보고서에서 부품 사양을 작성할 때 올바른 태도는?
    choices:
    - 경험적인 수치를 추측하여 작성한다.
    - 제공된 데이터시트 및 BOM 사양을 정확히 참조하여 작성한다.
    answer_index: 1
    explanation: 기술 보고서의 신뢰성을 위해 모든 부품 사양(전압, 전류, 토크, 저항 등)은 공식 데이터시트 및 시스템 설계 문서에
      기반해야 합니다.
  - question: 시스템 안전을 위해 최종 검증 전 반드시 수행해야 할 계측은?
    choices:
    - 회로의 저항을 측정하여 단락 여부 확인
    - 전원 물리적 분리 후 DC 전압 모드에서 1 V 미만인지 확인
    answer_index: 1
    explanation: 저항이나 연속성 모드는 전원 인가 상태를 정확히 판단할 수 없으므로, 반드시 전원을 물리적으로 분리한 후 DC 전압
      모드로 1 V 미만임을 계측해야 합니다.
  completion_criteria:
  - 프로젝트 전체 성과를 담은 최종 기술 보고서가 완성됨
  - 최종 하드웨어 조립 상태가 제출된 BOM 및 배선도와 일치함
  - 모든 성능 시험 및 검증 데이터가 정량적으로 정리되어 제출됨
  - 제시된 모든 안전 절차 준수 기록이 보고서에 포함됨
