modules:
- id: M1
  slug: robotic-hand-theory
  phase_id: PH1
  title: 인공 손의 기구학 및 설계 원리
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 인공 손의 기구학적 설계 기본 원리를 이해하고 구조를 파악한다.
  - 손가락 구동을 위한 액추에이터의 역할과 텐던(tendon) 구동 방식을 학습한다.
  - 정밀한 파지를 위한 힘 센서(FSR)와 피드백 제어의 중요성을 파악한다.
  theory_markdown: '## 인공 손의 기구학 및 설계 원리


    인공 손(Robotic Hand) 설계의 핵심은 인간 손의 복잡한 기구학적 구조와 유연한 구동 능력을 모방하는 것입니다. 인간의 손은 기구학적
    관점에서 많은 자유도(DoF)를 가지며, 이를 효과적으로 모방하기 위해 로봇 공학에서는 다양한 액추에이터와 텐던 구동 방식을 적용합니다 [S1].


    ### 1. 기구학적 구조와 자유도

    로봇 손 설계 시 손가락의 관절은 모터의 회전력을 전달받아 움직입니다. 이때 각 손가락 링크의 길이는 전체 손의 파지 성능에 직접적인 영향을
    미칩니다 [S1]. 적절한 기구학적 모델링을 통해 제어 변수를 설정하고, 주성분 분석(PCA) 등을 활용해 고차원적인 손의 움직임을 저차원
    공간에서 효율적으로 제어하는 시너지(synergy) 기반 제어 방식이 널리 연구되고 있습니다 [S2].


    ### 2. 구동 시스템 (Actuation System)

    본 과정에서는 DYNAMIXEL XM430-W350-T 스마트 액추에이터를 사용합니다. 이 액추에이터는 12V 전압에서 동작하며, 위치, 속도,
    전류 피드백을 통합 제공하여 정밀한 구동이 가능합니다 [S4]. 텐던 구동 방식은 모터를 손가락 내부가 아닌 손바닥이나 손목 부근에 배치하여
    인공 손의 무게와 크기를 줄이는 데 효과적이며, 이때 Dyneema SK78과 같은 고강도 섬유를 사용해 높은 파단 하중과 낮은 신율을 확보합니다
    [S15].


    ### 3. 피드백 제어와 센싱

    로봇 손이 정밀한 파지력을 유지하기 위해서는 손끝에 작용하는 힘을 실시간으로 감지해야 합니다. FSR(Force Sensing Resistor)
    402 센서는 압력이 가해질수록 전기적 저항이 감소하는 박막형 센서로, 손끝 패드 아래 배치되어 0.2N에서 20N 범위의 접촉력을 측정할
    수 있습니다 [S11]. 이 신호는 전압 분압 회로를 통해 OpenCR 제어 보드의 ADC(Analog-to-Digital Converter)
    입력으로 전달되어 파지 제어 알고리즘에 피드백됩니다 [S12].'
  worked_examples:
  - '예제 1: 텐던 신율 계산. 길이가 200mm인 Dyneema 텐던이 최대 작동 하중을 받을 때 신율이 1% 미만이라면, 최대 늘어나는 길이는
    200mm * 0.01 = 2mm 미만입니다. 이는 정밀 위치 제어에 충분히 안정적인 범위입니다 [S15].'
  - '예제 2: FSR 분압 회로 설계. OpenCR의 3.3V 센서 전원과 FSR 센서, 10kΩ 고정 저항을 직렬로 연결하여 전압 분압기를
    구성합니다. FSR의 저항값이 변화함에 따라 ADC 단자로 입력되는 전압이 0~3.3V 범위 내에서 변동하게 되어, 이를 통해 힘의 크기를
    디지털 값으로 변환할 수 있습니다 [S11, S12, S27].'
  lab:
    title: 인공 손 기구학 파라미터 측정 및 FSR 센서 테스트
    steps:
    - 손가락 3D 모델링 설계 데이터를 확인하여 각 링크의 길이를 측정합니다.
    - FSR 센서와 10kΩ 저항을 브레드보드에서 분압 회로로 구성합니다.
    - OpenCR 보드에 전원을 연결하고 ADC 값을 읽는 예제 코드를 실행합니다.
    - FSR 센서에 가하는 힘을 변화시키며 ADC 출력값이 선형적으로 변하는지 확인합니다.
    safety:
    - 모든 회로 구성 시 반드시 3.3V 전원 레일을 사용하며 5V나 12V 전원을 혼용하지 마십시오.
    - 납땜 및 전원 인가 시 보안경을 착용합니다.
    - 회로 구성 후 멀티미터로 전원 단자와 접지 사이의 단락 여부를 먼저 확인하십시오.
    deliverables:
    - 각 손가락 링크의 기구학적 파라미터가 정리된 표
    - FSR 센서 힘-ADC 출력 값 변환 그래프
    - 실험 과정 및 결과 보고서
  assignment:
    title: 5지 로봇손 설계 제안서 작성
    deliverables:
    - 선정한 액추에이터의 사양과 배치 이유가 포함된 설계 제안서
    - 텐던 구동을 고려한 손가락 관절 모델 CAD 스케치
    rubric:
    - 기구학적 링크 길이와 자유도(DoF)가 로봇 손의 파지 목적에 부합하게 설계되었는가?
    - 액추에이터의 스톨 토크와 텐던 강도가 충분히 고려되었는가?
    - FSR 센서를 활용한 힘 피드백 구조가 적절하게 반영되었는가?
  quiz:
  - question: 인공 손의 텐던 구동 방식에서 Dyneema SK78 섬유를 사용하는 가장 큰 이유는 무엇입니까?
    choices:
    - 가격이 매우 저렴하기 때문
    - 매우 높은 파단 하중과 낮은 신율을 가지고 있기 때문
    - 신축성이 뛰어나서 관절의 움직임을 자유롭게 하기 때문
    - 전기를 잘 통하게 하기 때문
    answer_index: 1
    explanation: Dyneema SK78은 높은 파단 하중과 1% 미만의 낮은 작동 신율을 가져 텐던 구동의 정밀도를 높여줍니다 [S15].
  - question: OpenCR 제어 보드에서 FSR 센서 회로를 구성할 때 전원 전압으로 적절한 것은?
    choices:
    - 12V 액추에이터 전원
    - 5V 전원
    - 3.3V 센서 전원
    - 24V 전원
    answer_index: 2
    explanation: OpenCR 보드에서 아날로그 입력 신호의 안전한 취득을 위해 3.3V 센서 전원 사용을 명시하고 있습니다 [S12].
  - question: FSR 402 센서의 특징으로 옳지 않은 것은?
    choices:
    - 압력이 증가하면 전기적 저항이 감소한다.
    - 인장력을 측정하는 센서이다.
    - 접촉력을 측정할 수 있다.
    - 박막형(PTF) 구조를 가진다.
    answer_index: 1
    explanation: FSR 센서는 힘(압력)을 측정하는 센서이며, 인장력을 측정하는 것은 스트레인 게이지 등의 다른 유형입니다 [S11].
  completion_criteria:
  - 5지 로봇손 설계 제안서의 제출 및 승인
  - FSR 센서 ADC 출력 테스트 결과의 정상 범주 확인
  - 인공 손 기구학 및 구동 원리 퀴즈 80점 이상 획득
  source_ids:
  - S1
  - S2
  - S4
  - S15
  - S11
  - S12
  - S27
- id: M2
  slug: system-architecture
  phase_id: PH1
  title: 시스템 아키텍처 및 BOM 정의
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 로봇 시스템의 전력 분배 및 안전 아키텍처를 이해한다.
  - 다양한 부품의 사양을 종합하여 BOM(Bill of Materials)을 정의하는 법을 익힌다.
  - 전기적 안전 표준(비상 정지, 과전류 보호)을 로봇 설계에 적용하는 방법을 습득한다.
  - 액추에이터, 컨트롤러, 센서 등 각 요소 간의 호환성 및 인터페이스를 분석한다.
  theory_markdown: "## 시스템 아키텍처 설계의 원칙\n정교한 5지 로봇손 시스템 설계는 기구적 성능과 전기적 신뢰성, 안전을 동시에\
    \ 고려해야 합니다. 특히 본 설계에서는 액추에이터 구동을 위한 전원 분기와 제어용 신호 체계를 독립적으로 구성하여 안전성을 확보합니다 [S8,\
    \ S9].\n\n### 1. 전력 분배 및 과전류 보호\n시스템은 12V 전원 어댑터 3개를 사용하여 독립적인 분기를 구성합니다 [B3,\
    \ S14]. 각 분기는 액추에이터 4대/4대/3대로 배분하며, 독립 퓨즈(10 A ATOF)를 통해 과전류로부터 회로를 보호합니다 [B3,\
    \ B-SAFETY-FUSE, S26]. \n- **중요:** 각 전원 어댑터의 양(+) 출력은 전기적으로 절대 독립되어야 하며, 서로 병렬로\
    \ 연결해서는 안 됩니다 [B3].\n\n### 2. 안전 제어 루프 (E-Stop Chain)\n비상 정지(E-Stop)는 래칭 비상정지\
    \ 버튼(A22E) -> 안전 릴레이(G7SA) -> 중계 릴레이(G2R) -> 고전류 접촉기(EV200) 순의 계층형 체인을 통해 구현됩니다\
    \ [B-SAFETY-ESTOP, B-SAFETY-RELAY, B-SAFETY-COIL-RELAY, B10].\n- **작동 원리:** A22E의\
    \ NC 접점이 개방되면 G7SA 코일이 무전원화되고, G7SA의 NO 접점들이 G2R 릴레이들의 코일 전원을 차단하여 최종적으로 EV200\
    \ 접촉기를 개방합니다 [B-SAFETY-ESTOP, B-SAFETY-RELAY, B-SAFETY-COIL-RELAY, B10].\n- **핵심:**\
    \ 이 계층 구조는 비상 시 고돌입 전류가 발생하는 액추에이터 분기를 안전하게 차단하며, 저전류 제어부와 고전류 구동부를 물리적으로 분리합니다\
    \ [B10, S24].\n\n### 3. 센서 신호 취득\n손끝 힘 감지 센서(FSR 402)는 OpenCR 제어 보드의 ADC 포트를 사용합니다\
    \ [B2, B4, S11, S12]. 10 kΩ 저항을 사용하여 전압 분압 회로를 구성하며, 반드시 3.3 V 센서 전원 레일에서 전력을\
    \ 공급받아야 합니다 [B2, B-SENSOR-RESISTOR, S27]."
  worked_examples:
  - '예제 1: 전원 분기별 부하 전류 계산. 총 11대의 XM430-W350-T 액추에이터 중 4대가 연결된 분기의 피크 전류는 4 * 2.3
    A = 9.2 A입니다 [B1, S4]. 10 A 퓨즈는 9.2 A보다 높으므로 정상 운전 시 끊어지지 않으며, 단락 발생 시 퓨즈 응답 곡선에
    따라 보호됩니다 [B1, B-SAFETY-FUSE, S26].'
  - '예제 2: EV200 코일 제어 안전 설계. EV200의 코일 돌입 전류는 최대 3.8 A입니다 [B10, S24]. 따라서 직접 비상정지
    버튼으로 스위칭하면 버튼이 손상되므로, 정격 전류 5 A를 지원하는 G2R-1-SND 릴레이를 중계하여 제어합니다 [B-SAFETY-COIL-RELAY,
    S22, S23].'
  lab:
    title: 전력 시스템 정격 검증 및 안전 계층 설계
    steps:
    - 각 액추에이터 분기의 최대 소비 전류를 계산하여 퓨즈 정격과 비교 확인.
    - 안전 제어 체인(A22E->G7SA->G2R->EV200)의 도면을 작성하고 전류 경로별 정격을 검토.
    - 멀티미터를 사용하여 독립적인 3개 전원 분기의 양(+) 단자 간 단락이 없음을 검증.
    - OpenCR 제어 보드의 3.3 V 센서 레일과 FSR 분압 회로의 결선 구조 확인.
    safety:
    - 반드시 저전압 벤치 전원을 사용하여 개별 모듈 단위로 사전 검증할 것.
    - 모든 전원 연결 전 멀티미터로 회로 간 단락 여부를 확인할 것.
    - 비상 정지 버튼을 조작하여 고전류 접촉기가 물리적으로 개방되는 소리를 확인할 것.
    - 보안경을 필히 착용하고 회로 구성 중 금속 도구로 인한 쇼트에 주의할 것.
    deliverables:
    - 전원 분기 부하 계산서
    - 안전 제어 체인 정격 검토서
    - 분기별 전압 독립성 검증 기록(멀티미터 데이터)
    - 시스템 배선도 초안
  assignment:
    title: 시스템 아키텍처 및 BOM 최적화
    deliverables:
    - 정확한 수량이 포함된 최종 BOM
    - 독립 전원 분기 설계 보고서
    - 비상 정지 체인 계층 설계 도면
    rubric:
    - BOM 정의의 정확성 (필수 부품 누락 여부)
    - 전원 분기별 독립성 및 과전류 보호 설계의 적절성
    - 안전 계층 구조가 사양과 일치하는지 여부
  quiz:
  - question: 로봇손 시스템에서 비상 정지 시 EV200 접촉기를 직접 구동하기 위해 사용되는 장치는 무엇입니까?
    choices:
    - A22E 비상정지 버튼
    - G7SA 안전 릴레이
    - G2R-1-SND 릴레이
    - OpenCR 제어 보드
    answer_index: 2
    explanation: EV200 코일은 높은 돌입 전류를 발생시키므로, A22E와 G7SA를 거쳐 최종적으로 G2R-1-SND 릴레이의 접점으로
      스위칭됩니다.
  - question: FSR 402 센서를 OpenCR 제어 보드에 연결할 때 주의해야 할 사항은 무엇입니까?
    choices:
    - 12V 액추에이터 전원을 분압 회로의 전원으로 사용한다.
    - 반드시 3.3 V 센서 전원 레일에서 전력을 공급받아야 한다.
    - 별도의 전원 없이 센서만 연결하면 된다.
    - 5 V 전원 레일을 사용해야 한다.
    answer_index: 1
    explanation: OpenCR ADC 입력 보호와 정확한 측정을 위해 FSR 전압 분압 회로는 반드시 3.3 V 센서 전원 레일을 사용해야
      합니다.
