- id: m5
  slug: actuator-integration
  phase_id: phase-2
  title: 액추에이터 및 구동부 통합
  estimated_hours: 12.0
  prerequisites:
  - m4
  objectives:
  - DYNAMIXEL XM430-W350-T 액추에이터의 전력 소요와 동작 특성을 이해한다.
  - 안전한 전원 분기 구성과 각 분기의 과전류 보호 원리를 학습한다.
  - 비상정지 회로 및 고전류 접촉기 제어 계층을 설계하고 구현한다.
  - OpenCR 제어기를 사용하여 액추에이터 및 센서 신호를 안전하게 통합한다.
  theory_markdown: '### 액추에이터 통합 및 시스템 전력 설계


    정교한 5지 로봇손은 총 11개의 DYNAMIXEL XM430-W350-T 액추에이터를 사용하며, 각 유닛은 스톨 시 2.3 A의 전류를 소모합니다
    [S12]. 전체 시스템의 피크 전류는 25.3 A에 달하므로 전원 분리 및 과전류 보호가 필수적입니다.


    #### 1. 독립 전원 분기 설계

    MEAN WELL GST160A12-R7B 어댑터 3개를 사용하여 액추에이터 전력을 4대/4대/3대 분기로 나눕니다 [S15]. 각 분기에는
    ATOF 10 A 퓨즈와 EV200AAANA DC 접촉기를 직렬로 배치하여 독립적인 과전류 보호와 전원 차단 기능을 확보합니다 [S15, S26,
    S28]. 절대 각 어댑터의 양(+) 출력을 병렬로 연결하지 마십시오. 이는 위험한 단락을 유발할 수 있습니다.


    #### 2. 안전 제어 계층 (E-stop)

    비상정지 버튼(A22E)은 직접 EV200 코일을 제어하지 않습니다 [S25]. 대신 다음 순서의 계층을 거칩니다:

    1. **A22E NC 접점**이 G7SA-3A1B 안전 릴레이의 코일(30 mA)을 개방 [S23, S25].

    2. G7SA NO 접점이 G2R-1-SND 릴레이 코일(43.2 mA) 3개를 개방 [S23, S24].

    3. G2R NO 접점이 EV200 코일(돌입 3.8 A)을 개방하여 최종적으로 12 V 액추에이터 분기를 무전원화합니다 [S24, S26].


    #### 3. 센서 통합

    FSR 402 센서는 10 kΩ 저항과 분압 회로를 구성하여 OpenCR의 3.3 V 센서 전원 레일에 연결합니다 [S13, S14, S29].
    절대 12 V 액추에이터 전원을 센서 회로에 사용하지 마십시오.'
  worked_examples:
  - '액추에이터 피크 전류 계산: 11개 액추에이터 × 2.3 A = 25.3 A. 이를 3개 분기로 나누면 최대 4대인 분기는 9.2 A를 소모하므로,
    11.5 A 정격의 어댑터와 10 A 퓨즈가 적절함 [S12, S15, S28].'
  - '비상정지 시 제어 회로 흐름: 버튼 누름 → A22E NC 개방 → G7SA 코일 전류 차단 → G7SA 접점 개방 → G2R 코일 전류
    차단 → EV200 코일 전원 차단 → 모터 전원 분리 [S23, S24, S25, S26].'
