- id: M6
  slug: electrical-wiring
  phase_id: P2
  title: 회로 제작 및 배선
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - DYNAMIXEL 스마트 액추에이터 및 센서 시스템의 올바른 전원 배분 원리를 이해한다.
  - 회로 안정성을 위한 독립 퓨즈 분기 구성 방법을 학습한다.
  - OpenCR 제어기와 FSR 센서 간의 안전한 전압 분압 회로를 설계하고 구현한다.
  - 진동 환경에서 하네스 이탈을 방지하기 위한 잠금형 커넥터 체결법을 익힌다.
  theory_markdown: '### 전원 배분 및 회로 보호 원리

    5지 로봇손 시스템은 고출력 액추에이터(12 V)와 정밀 센서(3.3 V)를 동시에 사용하므로 전원 분리가 필수적입니다. 본 시스템은 3개의
    독립된 절연 전원 어댑터(Mean Well GST160A12-R7B)를 사용하여 시스템을 3개의 분기로 나눕니다 [S18]. 각 분기는 11.5
    A의 정격 출력을 가지며 [S18], 액추에이터 4대/4대/3대씩 나누어 배분합니다. 액추에이터의 스톨 전류는 대당 2.3 A이므로 [S14],
    최대 4대가 동시에 스톨 상태가 되어도 분기당 필요한 전류는 9.2 A로, 어댑터의 11.5 A 정격 내에 안전하게 존재합니다.


    각 분기에는 10 A ATOF 퓨즈를 인라인 홀더(0AFH0001Z)를 통해 배치합니다 [S26, S27]. 퓨즈는 단락이나 과전류 고장 발생
    시 배선을 보호하며, 9.2 A 피크 부하를 상회하면서 11.5 A 출력 제한 내에서 작동하도록 설계되었습니다 [S18, S27].


    ### 센서 데이터 취득 회로

    FSR 402 센서는 압력에 따라 저항이 변하는 수동 소자입니다 [S15]. OpenCR 보드의 ADC 기능을 활용하려면 전압 분압 회로가
    필요합니다 [S16]. 3.3 V 센서 전원 레일과 FSR, 10 kΩ 저항을 직렬로 연결하여 분압기를 구성합니다 [S28]. 이때 반드시
    3.3 V 센서 전원을 사용해야 하며, 12 V 액추에이터 레일을 사용하면 OpenCR 보드의 ADC 입력을 초과하여 보드가 영구적으로 손상될
    수 있습니다 [S16].'
  worked_examples:
  - '분기 설계: 11개의 XM430-W350-T 액추에이터 [B1]를 3개 전원 분기에 할당 시, 각 분기의 최대 전류를 계산합니다. 분기 A(4대):
    2.3 A * 4 = 9.2 A. 10 A 퓨즈 [B10]는 9.2 A에서 연속 작동하며, 단락 시 전원을 신속하게 차단합니다.'
  - '전압 분압 계산: FSR 센서가 가압되어 저항이 1 kΩ으로 감소할 때, 10 kΩ 저항을 사용한 분압 회로의 ADC 전압은 V_out =
    3.3 V * (10 kΩ / (1 kΩ + 10 kΩ)) = 3.0 V가 되어, OpenCR의 0~3.3 V 입력 범위를 안정적으로 준수합니다
    [S16, S28].'
  lab:
    title: 전원 분기 구성 및 배선
    steps:
    - 각 액추에이터 분기에 10 A 퓨즈를 포함한 인라인 홀더를 설치하고 배선도에 따라 결선합니다.
    - 각 손가락 모듈을 Molex Micro-Fit 3.0 커넥터를 사용하여 제어 보드 및 전원 분기에 연결합니다 [S17].
    - 각 FSR 센서와 10 kΩ 저항으로 전압 분압 회로를 납땜하고 OpenCR ADC 핀에 연결합니다 [S16, S28].
    - 모든 배선 완료 후, 전원 인가 전 멀티미터를 사용하여 퓨즈 분기 및 센서 전원 레일의 단락 여부를 확인합니다.
    safety:
    - 본 프로토타입은 인증된 기계 안전 시스템이 아니며 학습용 저전압 장치입니다.
    - 실험 중에는 3개의 절연 전원을 물리적으로 분리한 상태에서 DC 전압 모드로 1 V 미만임을 확인하고 작업합니다.
    - 전원 인가 중 손가락 작동 범위 내에 손을 넣지 않으며, 고정 지그에서 무부하부터 가동 시험을 합니다.
    - 모든 배선 작업은 보안경을 착용하고 진행합니다.
    deliverables:
    - 구성 완료된 3개 전원 분기 사진
    - 각 분기별 퓨즈 무결성 확인 기록
    - OpenCR ADC 핀 전압 측정 기록(무부하 및 가압 시)
  assignment:
    title: 시스템 배선 최적화 보고서
    deliverables:
    - 배선도(전원 분기 및 센서 인터페이스 포함)
    - 시스템 전류 예산 계산서
    - 커넥터 체결 상태 및 진동 방지 처리 사진
    rubric:
    - 3개의 독립 전원 분기가 회로적으로 완벽히 격리되었는가?
    - 퓨즈와 커넥터가 명시된 정격 사양을 준수하는가?
    - FSR 센서 회로가 3.3 V 레일을 사용하여 ADC 입력을 초과하지 않는가?
  quiz:
  - question: FSR 센서 신호를 OpenCR ADC로 읽을 때 반드시 준수해야 하는 전압원은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    - 5 V 공통 전원
    - 절연되지 않은 외부 전원
    answer_index: 1
    explanation: OpenCR의 ADC는 3.3 V 로직을 기반으로 하므로, 3.3 V 센서 레일을 사용해야 안전합니다 [S16].
  - question: 본 시스템에서 액추에이터 전원 분기를 위해 권장되는 물리적 조치는 무엇입니까?
    choices:
    - 모든 12 V 전원의 (+) 단자를 병렬 연결
    - 3개의 독립된 어댑터 출력을 물리적으로 분리하여 사용
    - 어댑터 1개에 모든 액추에이터 연결
    - 퓨즈를 제거하고 직접 연결
    answer_index: 1
    explanation: 독립된 분기를 유지하여 각 퓨즈가 해당 구간의 과전류를 보호하도록 설계해야 합니다.
  completion_criteria:
  - 3개 전원 분기 구성 완료 및 단락 없음 확인
  - 퓨즈 사양(10 A) 확인 완료
  - FSR 센서의 3.3 V 전압 분압 회로 정상 작동 확인
  - 모든 하드웨어 연결 및 안전 수칙 준수 서약
