modules:
- id: M1
  slug: robotic-hand-mechanics
  phase_id: PH1
  title: 로봇손 기구학 및 설계
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇손의 기구학적 요구사항과 구동 원리를 이해한다.
  - 텐던 구동 메커니즘의 설계 원리와 관절 운동 범위를 해석한다.
  - BOM에 명시된 스마트 액추에이터와 기구 부품을 활용한 설계 개념을 수립한다.
  - 안전한 전원 분기 및 보호 회로의 중요성을 학습한다.
  theory_markdown: '## 로봇손 기구학 및 설계 기초


    ### 1. 언더액추에이티드(Underactuated) 메커니즘

    로봇손은 인간의 손을 모사하기 위해 다수의 관절을 갖추어야 하지만, 모든 관절을 개별 모터로 구동하는 것은 무게와 복잡도 측면에서 비효율적이다.
    언더액추에이티드 설계는 적은 수의 액추에이터로 다수의 관절을 구동하며, 텐던(Tendon)을 통한 장력 전달을 사용한다 [S1, S2].


    ### 2. 텐던 구동 시스템

    텐던은 고강도 섬유(Dyneema SK78)를 사용하여 관절에 토크를 전달한다 [B6]. 이 시스템은 액추에이터의 회전 운동을 선형 장력으로
    변환하며, 캡스턴(Capstan)과 풀리(Pulley)를 통해 힘의 크기와 방향을 조절한다 [S2]. 텐던의 신율은 1% 미만으로 관리되어야
    하며, 반복적인 굽힘 시험을 통해 내구성을 확보해야 한다 [B6].


    ### 3. 하드웨어 구성 및 안전 설계

    - **구동부:** DYNAMIXEL XM430-W350-T는 전류 피드백을 통해 정밀한 파지 제어를 지원한다 [B1].

    - **전원 분기:** 3개의 독립 전원 어댑터(GST160A12-R7B)를 사용하여 시스템을 4/4/3대 액추에이터 분기로 나누고, 각 분기별로
    10 A 퓨즈를 배치하여 과전류 발생 시 독립적으로 보호한다 [B3, B11, B-WIRING-FUSE-HOLDER].

    - **안전 차단:** 각 전원 분기에는 비상 차단 접촉기(EV200)가 직렬로 배치되며, 이는 래칭 비상정지 푸시버튼(A22E-M-12-EMO)의
    NC 접점에 의해 제어된다 [B10, B-SAFETY-CUTOFF].'
  worked_examples:
  - '예제 1: 텐던 장력 계산. 액추에이터의 스톨 토크가 4.1 N·m이고 텐던이 감기는 풀리의 반지름이 0.01 m일 때, 텐던에 가해지는
    이론적 최대 인장력은 F = T / r = 4.1 / 0.01 = 410 N이다. Dyneema SK78의 파단 하중(230 daN ≈ 2300
    N)을 고려하면 안전율은 2300 / 410 ≈ 5.6으로 충분하다 [B1, B6].'
  - '예제 2: 전원 분기 부하 분석. 한 분기에 4대의 액추에이터를 배치할 경우 피크 스톨 전류 합계는 2.3 A * 4 = 9.2 A이다.
    전원 어댑터 정격 11.5 A와 퓨즈 정격 10 A를 고려하면, 정상 작동 범위 내에서 분기당 피크 부하를 수용할 수 있으며 고장 시 퓨즈가
    먼저 차단된다 [B1, B3, B11].'
  lab:
    title: 로봇손 기구 조립 및 전원 분기 회로 구성
    steps:
    - FDM 3D 프린터와 경화강 노즐을 사용하여 PC-CF 링크 및 프레임 부품을 출력한다 [B7].
    - 각 출력물의 파일럿 홀에 황동 인서트(HTBI-M3-BR)를 열압입하여 나사산을 형성한다 [B9].
    - 무급유 베어링(JSM-0810-10)과 8 mm 알루미늄 샤프트를 활용하여 손목 관절을 조립한다 [B8, B-SHAFT].
    - 3개의 독립 전원 어댑터 출력 회로에 ATO 인라인 퓨즈 홀더와 10 A 퓨즈를 각각 장착한다 [B11, B-WIRING-FUSE-HOLDER].
    - 비상 차단 접촉기(EV200)를 각 독립 분기 양(+) 경로에 직렬로 연결하고, 제어 회로를 비상 정지 버튼(A22E-M-12-EMO)
      NC 접점에 연결한다 [B10, B-SAFETY-CUTOFF].
    safety:
    - 전원 어댑터의 (+) 출력을 병렬로 연결하지 마십시오. 반드시 독립 분기로 분리하십시오.
    - 납땜 작업 시 보안경을 착용하고 환기 장치를 가동하십시오.
    - 비상 정지 버튼이 모든 분기의 전원을 차단하는지 멀티미터로 반드시 확인하십시오.
    - 회로 연결 전 모든 배선이 BOM에 명시된 전류 정격을 준수하는지 재확인하십시오.
    deliverables:
    - 조립된 로봇손 기구물
    - 전원 분기 및 비상 차단 회로도
    - 회로 저항 및 도통 시험 기록
  assignment:
    title: 로봇손 설계 사양서 작성
    deliverables:
    - 전체 로봇손 CAD 도면
    - BOM 및 부품 선택 근거 기술서
    - 전원 분기별 부하 배분도
    rubric:
    - BOM 부품의 전기적, 기구적 정격이 정확히 명시되었는가?
    - 전원 분리 및 퓨즈 보호 회로가 독립적으로 설계되었는가?
    - 텐던 라우팅이 기구적 간섭 없이 설계되었는가?
  quiz:
  - question: 본 로봇손 설계에서 전원 분기를 독립적으로 구성하고 퓨즈를 배치하는 이유는 무엇인가?
    choices:
    - 전원 공급 장치의 출력 전압을 높이기 위해
    - 각 분기의 액추에이터를 독립적으로 보호하고 고장 발생 시 시스템 전체의 안전성을 확보하기 위해
    - 전류를 합산하여 더 큰 토크를 얻기 위해
    - 전원 장치의 개수를 줄이기 위해
    answer_index: 1
    explanation: 독립 분기 구성은 하나의 액추에이터 고장으로 인한 과전류가 시스템 전체 전원 경로에 영향을 주는 것을 방지하기 위함입니다.
      전원 병렬 연결은 절대 금지되어 있습니다.
  - question: 비상 정지 버튼이 제어하는 장치는 무엇인가?
    choices:
    - 주 모터 전류를 직접 차단
    - 액추에이터의 제어 신호(RS-485)
    - 3개 독립 분기의 DC 접촉기(EV200) 코일
    - 전원 어댑터의 입력 AC 전원
    answer_index: 2
    explanation: 비상 정지 버튼은 저전류 NC 제어 회로를 통해 EV200 접촉기의 코일을 해제하여, 3개의 독립 액추에이터 분기를
      물리적으로 동시 차단합니다.
  completion_criteria:
  - 로봇손 기구물 조립 완료 및 정상 작동 확인
  - 전원 분기 및 안전 차단 회로 구성 및 도통 시험 통과
  - 설계 사양서 및 BOM 사양 검증 완료
  source_ids:
  - S1
  - S2
- id: M2
  slug: actuator-selection
  phase_id: PH1
  title: 구동기 및 센서 선정
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 로봇손 구동을 위한 고성능 액추에이터 및 센서의 기술적 사양 분석
  - 입력 전압, 스톨 전류, 토크 등 핵심 파라미터 기반 시스템 가용성 평가
  - 독립 전원 분기 구성 및 과전류 보호 회로의 원리 이해
  - FSR 402 센서를 활용한 접촉력 피드백 취득 회로 설계
  theory_markdown: '### 1. 고성능 액추에이터의 이해

    정교한 5지 로봇손은 위치, 속도, 전류 피드백을 실시간으로 통합 제어하는 스마트 액추에이터가 필수적입니다. [B1] DYNAMIXEL XM430-W350-T는
    12 V 전압에서 4.1 N·m의 스톨 토크를 제공하며, [S3] 2.3 A의 스톨 전류가 필요합니다. [B1] 제어기 OpenCR 1.0은
    이러한 액추에이터 11개를 직접 연결 가능한 TTL/RS-485 포트를 내장하여, 통신 브리지 추가로 인한 신호 지연과 접점 불량 요인을 제거합니다.
    [B2]


    ### 2. 독립 분기 전원 설계와 안전

    시스템의 안정성은 각 분기의 독립성에 의존합니다. [B3] 3개의 138 W 어댑터를 사용하여 전체 액추에이터 피크 전류 25.3 A를 3개의
    독립 분기(4대/4대/3대)로 나누어 공급합니다. [B3] 각 분기는 10 A ATOF 퓨즈를 통해 과전류로부터 보호되며, [B11] 비상
    정지 입력 시 EV200 접촉기가 코일 회로를 즉시 개방하여 3개 독립 DC 분기를 동시에 차단합니다. [B3, B10, B23] 이때, 각
    전원 장치의 양(+) 단자들을 합치는 것은 절대 금지이며, 각 독립 분기는 전기적으로 완벽히 격리된 상태로 운영해야 합니다. [B3]


    ### 3. 힘 센서 신호 처리

    손끝의 접촉력은 FSR 402 센서를 통해 측정됩니다. [B4] FSR은 압력이 증가함에 따라 저항이 감소하는 특성을 가지며, [S11] 10
    kΩ 분압 저항과 연결하여 OpenCR의 12비트 ADC로 전압 변화를 읽어들입니다. [B2, B4, B26]'
  worked_examples:
  - '예제 1: 분기별 전류 계산. 액추에이터 4대가 장착된 분기의 최대 전류는 2.3 A × 4 = 9.2 A입니다. [B1] 분기 퓨즈 정격
    10 A는 9.2 A보다 크고, [B11] 전원 어댑터 정격 11.5 A보다 작아 배선 보호에 적합합니다. [B3]'
  - '예제 2: FSR 전압 분압기. 공급 전압 5 V, FSR 저항 R_fsr, 고정 저항 R_fixed = 10 kΩ일 때, 출력 전압 V_out
    = 5 V * (R_fixed / (R_fsr + R_fixed))로 계산됩니다. [B26] 힘이 가해져 R_fsr이 작아지면 V_out은
    증가하여 ADC값이 커집니다.'
  lab:
    title: 전원 분기 구성 및 센서 피드백 테스트
    steps:
    - 12 V 어댑터 1개의 출력단에 ATO 퓨즈 홀더와 10 A 퓨즈를 직렬 연결합니다. [B3, B11, B24]
    - 멀티미터를 사용하여 퓨즈 양단 전압을 측정하여 단선 여부와 전원 공급 상태를 확인합니다.
    - FSR 402와 10 kΩ 저항으로 전압 분압 회로를 구성하고 OpenCR ADC 핀에 연결합니다. [B4, B26]
    - OpenCR 제어 코드를 작성하여 센서에 가해지는 힘에 따른 ADC 값 변화를 시리얼 모니터로 관찰합니다.
    safety:
    - 벤치 전원 사용 시 전류 제한(Current Limit) 설정을 필수적으로 확인하십시오.
    - 독립 분기의 양(+) 단자들을 절대 합치거나 연결하지 마십시오. [B3]
    - 납땜 작업 시 반드시 보안경을 착용하고 환기 장치를 가동하십시오.
    - 비상 정지 버튼의 NC 접점 동작을 테스트하여 전원 차단 기능을 검증하십시오. [B10, B23]
    deliverables:
    - 구성된 독립 전원 분기의 배선 사진
    - 분기별 전압 측정값 기록
    - 센서 힘(N) 대 ADC 값 변환 데이터 그래프
    - 안전 차단 테스트 성공 기록
  assignment:
    title: 액추에이터 분기 설계 및 힘 피드백 알고리즘 분석
    deliverables:
    - 전체 액추에이터 분기 구성도 (3개 전원 분기 및 퓨즈 배치 포함)
    - 최대 토크 시 분기별 전류 부하 계산서
    - FSR 데이터 시트 기반 ADC 입력 범위 최적화 보고서
    rubric:
    - 전원 독립성 준수 여부 (병렬 연결 금지 위반 시 감점)
    - 퓨즈 및 비상 차단 장치의 정격 적합성 분석
    - 힘 센서 신호 처리의 논리적 타당성
  quiz:
  - question: 로봇손 액추에이터 분기 구성 시 반드시 지켜야 할 안전 원칙은 무엇인가?
    choices:
    - 모든 전원 장치의 양(+) 출력단을 하나로 연결하여 안정성을 높인다.
    - 각 전원 장치의 독립 분기를 유지하고 양(+) 단자 연결을 절대 금지한다.
    - 전원 분기를 더 작게 나누기 위해 퓨즈를 제거한다.
    - 비상정지 버튼은 모터 전류를 직접 차단하도록 고전류 회로에 배치한다.
    answer_index: 1
    explanation: 각 전원 분기는 독립적으로 운영되어야 하며, 출력 전압이 미세하게 다를 경우 과전류가 발생할 수 있으므로 병렬 연결(합산)은
      절대 금지됩니다. [B3]
  - question: FSR 402 센서가 힘을 감지하는 원리는 무엇인가?
    choices:
    - 압력이 증가함에 따라 전기 용량이 증가한다.
    - 압력이 증가함에 따라 저항이 감소한다.
    - 압력이 증가함에 따라 유도 기전력이 발생한다.
    - 온도 변화를 통해 압력을 간접 측정한다.
    answer_index: 1
    explanation: FSR(Force Sensing Resistor)은 압력이 가해지면 내부 저항값이 감소하는 폴리머 센서입니다. [S11]
  - question: 분기 퓨즈(10 A) 선정의 근거로 가장 적절한 것은?
    choices:
    - 액추에이터 4대의 합산 스톨 전류(9.2 A)보다 높고 전원 정격(11.5 A)보다 낮아야 한다.
    - 무조건 높은 전류 정격을 사용하여 퓨즈 단선을 방지해야 한다.
    - 전원 정격보다 훨씬 높은 50 A를 사용하여 안전을 확보한다.
    - 분기당 액추에이터 개수와 관계없이 항상 30 A를 사용한다.
    answer_index: 0
    explanation: 퓨즈는 정상 작동 전류(9.2 A)를 통과시키되 전원 공급 능력(11.5 A)이나 배선 허용 전류를 초과하는 고장 상황을
      방어해야 합니다. [B11]
  completion_criteria:
  - 독립 전원 분기 구성 완료 및 안전 검증 테스트 통과
  - FSR 센서 피드백을 이용한 ADC 데이터 취득 및 분석 완료
  - 분기별 전원 보호 체계 설계 보고서 제출
