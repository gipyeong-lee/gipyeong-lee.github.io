- id: m9
  slug: validation
  phase_id: phase-3
  title: 최종 검증 및 실험
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - 로봇손 시스템의 성능을 정량적으로 평가하기 위한 검증 절차를 이해한다.
  - 센서 피드백을 활용한 정밀 파지 제어의 정확성을 분석한다.
  - 하드웨어 내구성과 텐던 구동 시스템의 안정성을 검증한다.
  - 실험 데이터 분석을 통해 로봇손의 작업 능력을 평가하고 보고서를 작성한다.
  theory_markdown: "## 시스템 검증의 중요성\n로봇손 개발의 마지막 단계는 설계된 시스템이 목표 사양을 충족하는지 확인하는 검증(Validation)\
    \ 과정이다. 본 프로젝트에서 로봇손은 DYNAMIXEL XM430-W350-T 액추에이터[S9]와 Dyneema SK78 텐던[S14]을\
    \ 사용하여 구동되며, FSR 402 센서[S10]를 통해 손끝 접촉력을 피드백받는다. \n\n### 파지 정밀도 평가\n파지 정밀도는 제어\
    \ 시스템이 목표한 위치와 힘에 얼마나 정확하게 도달하는지를 측정한다. OpenCR 1.0 제어기[S11]의 12비트 ADC를 사용하여 FSR로부터\
    \ 얻은 힘 신호를 처리하며, 0~3.3V 범위를 유지하여 신호 무결성을 확보해야 한다. 센서 값의 선형성을 분석하여 정밀한 힘 제어가 가능한지\
    \ 평가한다.\n\n### 내구성 및 안전성 검증\n로봇손의 구조물은 탄소섬유 강화 PC 필라멘트(PC-CF)[S17]로 제작되어 높은 강성을\
    \ 가지지만, 텐던의 반복적인 장력은 시스템에 피로를 유발한다. 반복 가동 시험을 통해 텐던의 신율이 1% 이하[S14]로 유지되는지 확인한다.\
    \ 또한, 전원 시스템은 12V 어댑터 3개를 분기별로 나누어 독립적으로 공급하며, 각 분기는 10A ATOF 퓨즈[S23]로 보호된다. 모든\
    \ 전기적 검증은 전원을 물리적으로 분리한 상태에서 DC 전압계를 사용하여 1V 이하임을 확인한 뒤 수행한다."
  worked_examples:
  - '예제 1: FSR 출력 전압 계산 - 센서 저항이 10kΩ이고 분압 저항이 10kΩ인 경우, 3.3V 센서 전원 하에서 분압기 출력은 1.65V가
    된다. 이는 OpenCR ADC 입력 범위(0~3.3V) 내에 있으므로 적절하다[S11, S24].'
  - '예제 2: 전원 분기 부하 분석 - 액추에이터 4대가 한 분기에 연결된 경우, 스톨 전류 합계는 9.2A(2.3A * 4)이다[S9]. 이는
    10A 퓨즈 정격 미만이며[S23], 11.5A 공급 능력 내에 있어 안정적이다[S13].'
  lab:
    title: 로봇손 파지 및 내구성 성능 평가
    steps:
    - 각 전원 어댑터의 출력을 물리적으로 분리하고, 멀티미터를 사용하여 1V DC 미만임을 확인한다.
    - 로봇손을 고정 지그에 장착하고 각 손가락 모듈의 텐던 장력을 초기화한다.
    - OpenCR 제어기에 연결된 FSR 센서의 무부하 출력값을 측정하여 영점을 교정한다.
    - 다양한 크기와 경도의 물체를 파지하며 센서 피드백 데이터와 실제 파지력의 상관관계를 기록한다.
    - 1,000회 반복 파지 시험을 수행하며 텐던의 풀림이나 구조물의 유격 변화를 관찰한다.
    safety:
    - 실험 중 로봇손 가동 범위에 절대 손을 넣지 않는다.
    - 실험 전후 항상 3개의 전원 어댑터를 분리하고 전압을 확인한다.
    - 보안경을 반드시 착용하고 텐던 파단 시험 시 비산물에 주의한다.
    - 전원 인가 상태에서 절대로 퓨즈를 교체하거나 배선을 수정하지 않는다.
    deliverables:
    - FSR 센서 교정 곡선 그래프
    - 파지 정밀도 시험 데이터 분석 보고서
    - 반복 시험 전후 구조물 치수 비교 기록
  assignment:
    title: 로봇손 종합 성능 검증 최종 보고서
    deliverables:
    - 시스템 설계 사양 대 측정 성능 비교표
    - 파지 제어 알고리즘 및 센서 데이터 분석 결과
    - 내구성 시험을 통해 도출된 유지보수 계획
    rubric:
    - 시스템 사양 및 측정 데이터의 정량적 비교 충실도
    - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
    - 데이터 분석 결과의 논리적 타당성
  quiz:
  - question: 로봇손의 전기적 안전을 위해 전원을 분리한 후 측정해야 하는 전압 값은 얼마인가?
    choices:
    - 1V 미만
    - 5V 미만
    - 12V 미만
    - 24V 미만
    answer_index: 0
    explanation: 작업 전 감전 방지를 위해 모든 분기에서 1V DC 미만임을 멀티미터로 반드시 확인해야 합니다.
  - question: FSR 힘 감지 센서 전압 분압 회로에 적절한 전원 전압은 무엇인가?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    - 5V 제어기 전원
    - 24V 외부 전원
    answer_index: 1
    explanation: OpenCR의 ADC 신호 무결성과 센서 회로 분리를 위해 3.3V 센서 전원을 사용해야 합니다.
  - question: DYNAMIXEL XM430-W350-T 액추에이터의 스톨 전류는 얼마인가?
    choices:
    - 1.5A
    - 2.3A
    - 4.1A
    - 10A
    answer_index: 1
    explanation: 데이터시트에 따르면 해당 모델의 스톨 전류는 2.3A입니다.
  completion_criteria:
  - 모든 검증 실험 절차를 안전 수칙에 따라 완료하였음.
  - 최종 성능 평가 보고서에 측정 데이터가 정량적으로 포함되었음.
  - 시스템 사양과 실제 성능 간의 차이를 분석하고 보완점을 제시하였음.
