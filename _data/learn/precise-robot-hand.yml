- id: m4
  slug: printing-assembly
  phase_id: phase-2
  title: 3D 프린팅 및 부품 가공
  estimated_hours: 15.0
  prerequisites:
  - m3
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)의 물성 이해 및 FDM 프린팅 최적화 조건 습득
  - 열압입 인서트의 원리와 정밀 기계 부품 체결 기법 숙지
  - 정밀 조립을 위한 베어링과 샤프트의 공차 관리 및 조립 절차 수행
  - 안전 시스템을 포함한 독립 전원 분기 구성 및 배선 표준 준수
  theory_markdown: '### FDM 3D 프린팅과 엔지니어링 소재

    고강도 로봇 손 구조물 제작에는 강성과 내열성이 우수한 탄소섬유 보강 폴리카보네이트(PC-CF)가 사용됩니다. PC-CF는 일반 PC에 비해
    치수 안정성이 뛰어나며 뒤틀림이 적습니다 [S19]. 노즐은 탄소섬유의 마모성을 견디기 위해 경화강 노즐을 필수적으로 사용해야 합니다 [S19].
    출력 시 베드 온도는 110 °C, 노즐 온도는 285 °C 내외가 권장됩니다 [S19].


    ### 반복 조립을 위한 인서트 및 베어링 관리

    플라스틱 출력물에 나사산을 직접 내는 것은 내구성이 낮습니다. M3 황동 열압입 인서트를 4.0 mm 파일럿 홀에 열압입하여 체결 재현성을
    확보합니다 [S21]. 회전축에는 유지보수가 필요 없는 폴리머 슬리브 베어링(JSM-0810-10)을 사용하며, 이는 8 mm 정밀 샤프트와
    결합하여 낮은 마찰 계수를 제공합니다 [S17, S18]. 베어링은 하우징에 압입 시 내경이 조정되므로, 공차 관리가 중요합니다 [S17].


    ### 시스템 전기 안전 및 독립 분기 구성

    전원 어댑터(GST160A12-R7B)의 12 V 출력은 독립적으로 유지되어야 합니다 [S15]. 어댑터별 독립 퓨즈(10 A)와 별도 접촉기(EV200AAANA)를
    배치하여 과전류 보호 및 비상정지 시 무전원화를 수행합니다 [S26, S28]. 제어 체인은 비상정지 스위치(A22E) → 안전 릴레이(G7SA)
    → 중계 릴레이(G2R) → 접촉기(EV200) 순서로 구성하여 저전류로 고전류 분기를 제어합니다 [S23, S24, S25, S26]. 모든
    신호 배선은 탈착이 용이한 Micro-Fit 3.0 커넥터를 사용합니다 [S7].'
  worked_examples:
  - '예제 1: PC-CF 출력물의 인서트 홀 계산 - Accu 인서트 HTBI-M3-BR의 외경은 4.4 mm이므로, 권장 파일럿 홀 지름 4.0
    mm를 CAD 설계에 반영하여 압입 후 파손을 방지합니다 [S21].'
  - '예제 2: 전원 분기 퓨즈 선정 - 액추에이터 4대 스톨 전류 합계 9.2 A(2.3 A * 4)와 퓨즈 정격 10 A를 비교하여, 정상
    작동 시 끊어지지 않으면서 배선 보호가 가능한 10 A ATOF 퓨즈를 선정합니다 [S12, S28].'
  lab:
    title: 로봇 손 프레임 프린팅 및 구동부 조립
    steps:
    - 경화강 노즐이 장착된 프린터로 PC-CF 필라멘트를 사용하여 손가락 링크와 손바닥 프레임 출력
    - 출력물에 4.0 mm 파일럿 홀 확인 후 열압입 도구로 M3 황동 인서트 삽입
    - 8 mm 정밀 샤프트를 손목 축 길이에 맞게 절단 및 모따기 가공
    - 슬리브 베어링(JSM-0810-10)을 프레임의 하우징 보어에 압입
    - Micro-Fit 3.0 커넥터를 사용하여 12 V 액추에이터 및 신호 하네스 제작
    - 독립 전원 분기마다 10 A 퓨즈 홀더 및 EV200 접촉기를 배선도에 따라 조립
    safety:
    - 285 °C 이상의 노즐 및 110 °C 고온 베드 사용 시 화상 주의
    - PC-CF 출력물 미세먼지 방지를 위한 보안경 및 환기 장치 사용
    - 전원 공급 전 모든 접촉기 분기 배선에 대한 멀티미터 도통 시험 필수
    - 전원 연결 후에는 전류 제한 벤치 전원을 사용하여 쇼트 여부 사전 확인
    deliverables:
    - 최종 치수 공차 측정 기록서
    - 조립 완료된 5지 로봇 손 프레임 사진
    - 전원 분기 배선 도통 및 절연 저항 시험 결과
  assignment:
    title: 전원 시스템 설계 및 조립 정밀도 평가
    deliverables:
    - 독립 전원 분기 구성 배선도(릴레이 제어 체인 포함)
    - 부품별(인서트, 베어링) 허용 오차 관리표
    - 비상정지 동작 시 3개 독립 분기 전압 측정 데이터
    rubric:
    - 전원 분기의 독립성 유지 여부 (병렬 연결 금지 준수)
    - 비상정지 제어 릴레이 체인(A22E-G7SA-G2R-EV200)의 정확한 구성
    - 조립 후 관절의 유격 및 마찰 최적화 정도
  quiz:
  - question: PC-CF 필라멘트 출력 시 경화강 노즐을 사용해야 하는 이유는 무엇입니까?
    choices:
    - 탄소섬유의 마모성으로 인해 일반 황동 노즐이 빠르게 손상되기 때문
    - PC-CF의 융점이 일반 노즐 정격보다 높기 때문
    - 더 빠른 출력 속도를 내기 위해서
    - 필라멘트 색상을 유지하기 위해서
    answer_index: 0
    explanation: 탄소섬유는 매우 abrasive(마모성)한 소재로 황동 노즐을 빠르게 손상시키므로 반드시 경화강 노즐을 사용해야 합니다
      [S19].
  - question: 로봇 손의 12 V 전원 공급 방식 중 올바른 것은 무엇입니까?
    choices:
    - 세 어댑터의 양(+) 출력을 하나로 묶어 전압을 안정화한다
    - 각 어댑터 출력은 독립 분기로 사용하며 양(+) 출력은 분리한다
    - 어댑터 하나로 모든 액추에이터에 연결한다
    - 전압을 24 V로 높여서 배선 저항을 줄인다
    answer_index: 1
    explanation: 독립 전원 분기 구성을 위해 양(+) 출력을 병렬로 묶는 것은 금지되며, 각각 독립적으로 사용해야 합니다 [S15].
  completion_criteria:
  - PC-CF 출력물을 규격에 맞게 성공적으로 제작함
  - 인서트 및 베어링 조립 후 구동부 유격이 설계치 이내임
  - 독립 전원 분기 3개 회로의 배선과 안전 릴레이 동작 시험 통과
  - 실습 결과물에 대한 모든 요구 배선도 및 검증 데이터 제출
