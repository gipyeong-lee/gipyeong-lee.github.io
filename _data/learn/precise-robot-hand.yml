- id: M1
  slug: robotic-fundamentals
  phase_id: PH1
  title: 로봇 공학 기초 및 텐션 드라이브 이론
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 공학의 기초 제어 시스템 개념과 언더액추에이티드(Underactuated) 시스템의 기본 이해
  - 텐션 드라이브(Tension Drive) 메커니즘의 역학적 원리와 로봇손 관절 구동 원리 습득
  - DYNAMIXEL 스마트 액추에이터의 제어 인터페이스 및 토크 제어 기본 이해
  - 안전한 로봇 시스템 설계를 위한 저전압 분기 전원 관리 및 과전류 보호 원리 학습
  theory_markdown: '### 로봇 공학 기초와 텐션 드라이브


    로봇 공학에서 시스템은 자유도(Degree of Freedom)와 액추에이터의 수를 기준으로 완전 구동(Fully-actuated)과 언더액추에이티드(Underactuated)
    시스템으로 구분됩니다 [S11]. 5지 로봇손과 같이 좁은 공간에 많은 자유도를 구현해야 하는 경우, 텐션 드라이브(케이블 구동 방식)는 액추에이터를
    손가락 관절에서 분리하여 손바닥이나 손목에 배치할 수 있게 해주는 필수적인 설계 전략입니다 [S11].


    #### 텐션 드라이브의 원리

    텐션 드라이브는 고강도 섬유 텐던(예: Dyneema SK78, [S17])을 사용하여 액추에이터의 회전 운동을 관절의 회전 토크로 변환합니다.
    이때 고려해야 할 핵심 요소는 다음과 같습니다:

    1. **인장 강도와 신율**: Dyneema SK78과 같은 소재는 파단 하중(230 daN)이 높고 작동 신율이 1% 미만으로 정밀한 위치
    제어에 유리합니다 [S17].

    2. **마찰 및 마모**: 케이블이 경로를 따라 굽혀질 때 발생하는 마찰과 캡스턴에서의 접촉 마모를 최소화해야 합니다.


    #### 액추에이터 및 제어

    본 프로젝트는 DYNAMIXEL XM430-W350-T 액추에이터를 사용합니다 [S3]. 이 액추에이터는 12 V 전압에서 동작하며 스톨 토크
    4.1 N·m, 스톨 전류 2.3 A의 사양을 갖습니다 [S3]. 정밀한 힘 제어를 위해 OpenCR 1.0 제어기를 사용하며, 이는 TTL
    통신 포트를 내장하여 브리지 회로 없이 안정적인 제어가 가능합니다 [S14].


    #### 시스템 안전 및 전원 관리

    - **독립 분기 전원**: 각 12 V 어댑터(MeanWell GST160A12-R7B)는 독립적인 분기로 사용되며, 양(+) 출력의 병렬
    연결은 절대 금지됩니다 [S16].

    - **과전류 보호**: 각 분기에는 10 A ATOF 퓨즈(Littelfuse 0287010.U)를 인라인 홀더(0AFH0001Z)에 장착하여
    액추에이터 군집의 피크 전류 발생 시 시스템을 보호합니다 [S25, S26].

    - **계획 정지**: 본 프로토타입은 인증된 계획 정지이 없으므로, 실험 중 정지는 3개의 전원 어댑터를 물리적으로 분리하고, 멀티미터로
    각 분기 전압이 1 V 미만임을 확인한 후 접근해야 합니다 [S16].'
  worked_examples:
  - '예제 1: 분기 전류 계산

    분기 A에 4대의 DYNAMIXEL XM430 액추에이터가 할당되었습니다. 한 대의 스톨 전류가 2.3 A이므로 피크 전류 합은 2.3 A
    × 4 = 9.2 A입니다 [S3]. 사용되는 10 A ATOF 퓨즈는 정격 전류가 10 A로, 9.2 A 피크를 수용하면서 과부하를 보호하는
    안전한 설계입니다 [S26].'
  - '예제 2: 텐던 선택

    Dyneema SK78 텐던을 사용할 때 고려할 하중은 액추에이터 토크와 캡스턴 반경에 의해 결정됩니다. 4.1 N·m 토크를 지름 10 mm
    캡스턴(반경 5 mm)으로 구동하면 이론적 장력은 T = 4.1 / 0.005 = 820 N (약 83.6 daN)입니다. 230 daN 파단
    하중을 갖는 1.5 mm D-Pro 텐던은 충분한 안전율을 제공합니다 [S17].'
  lab:
    title: 저전압 분기 전원 구성 및 계측 실습
    steps:
    - 각 MEAN WELL GST160A12-R7B 어댑터 출력 단자를 확인하고, 독립 분기 구성임을 확인합니다 [S16].
    - 각 분기의 (+) 라인에 Littelfuse 0AFH0001Z 인라인 퓨즈 홀더를 연결하고 10 A 퓨즈를 삽입합니다 [S25, S26].
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기 출력단 전압이 12 V 임을 측정합니다.
    - 전원 분리 수단을 사용하여 물리적으로 전원을 차단하고, 각 분기에서 1 V 미만 DC 전압이 측정되는지 확인합니다.
    safety:
    - 절대 전원 어댑터 출력의 (+)를 병렬로 연결하지 마십시오.
    - 전원 공급 중에는 손가락 조립체나 텐던 가동 영역에 손을 넣지 마십시오.
    - 정지 확인은 무전원 상태를 멀티미터로 계측하여 수행하십시오.
    - 보안경을 필히 착용하십시오.
    deliverables:
    - 독립 분기 전원 배선도
    - 전원 분리 전후 분기별 전압 측정 데이터 기록
  assignment:
    title: 로봇 시스템 설계 요구사항 정의
    deliverables:
    - 선택된 액추에이터의 토크와 텐던 파단 하중 비교 분석서
    - 사용되는 전원 분기별 액추에이터 할당 도표
    - 안전 정책 요약 보고서
    rubric:
    - 전원 분기 독립성 설계의 정확성
    - 과전류 보호 장치(퓨즈)의 정격 적절성
    - 시스템 안전 정지 절차에 대한 올바른 이해 및 기술
  quiz:
  - question: 본 프로젝트에서 12 V 액추에이터 전원 분기를 관리하는 올바른 방법은 무엇입니까?
    choices:
    - 전류 용량을 늘리기 위해 3개의 전원 어댑터 (+) 출력을 모두 병렬로 연결한다.
    - 각 전원 어댑터의 출력을 독립적인 분기로 유지하며 별도의 퓨즈를 사용한다.
    - 하나의 전원 어댑터에 11개의 액추에이터를 모두 연결한다.
    - 5 V 전원 라인을 사용하여 액추에이터를 구동한다.
    answer_index: 1
    explanation: 독립형 전원 어댑터는 분기별로 독립 사용하여야 하며, 양(+) 출력의 병렬 연결은 금지됩니다 [S16].
  - question: DYNAMIXEL XM430-W350 액추에이터의 스톨 전류는 몇 A입니까?
    choices:
    - 2.3 A
    - 4.1 A
    - 12 A
    - 10 A
    answer_index: 0
    explanation: 데이터시트에 명시된 스톨 전류(Stall Current)는 2.3 A입니다 [S3].
  - question: 실험 중 계획 정지가 필요할 때 적절한 조치는 무엇입니까?
    choices:
    - 회로의 저항 모드를 사용하여 회로가 끊어졌는지 확인한다.
    - 퓨즈를 손으로 잡아 뽑아 정지시킨다.
    - 3개의 절연 전원 어댑터를 물리적으로 분리하고 멀티미터로 DC 전압을 확인한다.
    - 연속성 모드(Continuity)를 사용하여 도통 여부를 확인한다.
    answer_index: 2
    explanation: 저항이나 연속성 모드는 안전한 정지 상태를 보장하지 않습니다. 물리적 분리와 DC 전압 측정 확인이 필수입니다.
  completion_criteria:
  - 각 액추에이터 액추에이터 전원 분기 배선도 제출
  - 실습 중 무전원 상태 확인 데이터 기록 완료
  - 텐션 드라이브 역학 계산 및 부품 적합성 분석 완료
