- id: mod-6
  slug: controller-setup
  phase_id: phase-3
  title: 제어기 설정 및 펌웨어 기초
  estimated_hours: 10.0
  prerequisites:
  - mod-5
  objectives:
  - OpenCR 제어기 하드웨어 구성과 DYNAMIXEL 프로토콜 통신 기초를 이해한다.
  - 센서 데이터를 수집하기 위한 전압 분압 회로 구성 및 ADC 읽기 원리를 학습한다.
  - 안전 상태기계 실행을 위한 기본적인 펌웨어 구조를 설계한다.
  - 하드웨어 인터페이스와 제어 루프의 초기 통합을 수행한다.
  theory_markdown: '## 제어기 설정 및 펌웨어 기초


    ### OpenCR 1.0 하드웨어 아키텍처

    OpenCR 1.0은 216MHz 주파수의 CPU를 기반으로 하며 [S12], DYNAMIXEL 스마트 액추에이터와의 직접 통신을 위한 전용
    포트를 내장하고 있습니다. 별도의 통신 브리지 없이 액추에이터 제어 명령을 처리하고 센서 피드백을 수집할 수 있어 복잡한 하드웨어 구성을 단순화합니다.


    ### 센서 데이터 취득: 전압 분압 회로

    FSR 402 센서는 압력에 따라 저항이 변하는 가변 저항기입니다. 힘을 측정하기 위해 전압 분압 회로를 구성해야 합니다. OpenCR 1.0의
    ADC 핀에 3.3V 센서 전원을 공급하고 FSR과 10kΩ 저항을 직렬로 연결합니다. 이 회로의 출력 전압은 다음 식을 따릅니다:


    $$V_{out} = V_{in} \times \frac{R_{fixed}}{R_{FSR} + R_{fixed}}$$


    여기서 $V_{in}$은 3.3V입니다. ADC 입력 신호가 0~3.3V 범위를 초과하지 않도록 회로를 반드시 3.3V 센서 전원 레일에서
    구성하십시오.


    ### 안전 상태기계 (Safety State Machine)

    로봇 시스템의 비정상 종료를 방지하기 위해 펌웨어 수준에서 안전 상태기계를 실행합니다. 정상 가동(RUN), 경고(WARN), 비상 정지(ESTOP)
    상태로 구분하며, ESTOP 상태 진입 시 즉시 모든 액추에이터 토크를 비활성화하고 접촉기를 차단해야 합니다.'
  worked_examples:
  - '예제 1: 10kΩ 저항을 사용한 FSR 분압 전압 계산. FSR 저항이 5kΩ일 때, $V_{out} = 3.3V \times (10k
    / (5k + 10k)) = 2.2V$. 이는 OpenCR 12비트 ADC 해상도 내에서 안전하게 읽을 수 있는 값입니다.'
  - '예제 2: 12V 액추에이터 전원과 3.3V 센서 전원 분리 확인. 회로 설계 시 12V 라인이 ADC 핀으로 직접 유입되지 않도록 격리되었는지
    확인하는 절차를 수행합니다.'
  lab:
    title: OpenCR 인터페이스 연결 및 초기 전원 시험
    steps:
    - OpenCR 1.0 제어기에 PC를 연결하고 DYNAMIXEL Workbench를 활용하여 통신 정상 여부를 확인합니다.
    - 브레드보드상에 10kΩ 저항과 FSR 402를 사용하여 3.3V 센서 전원 기반 분압 회로를 구성합니다.
    - ADC 핀에 멀티미터를 연결하여 압력을 가했을 때 전압이 0~3.3V 사이에서 안정적으로 변화하는지 측정합니다.
    - 안전 상태기계 코드를 작성하여 비상 정지 입력 트리거 시 루프가 즉시 중단되는지 시뮬레이션합니다.
    safety:
    - 모든 회로 구성은 전원 차단 상태에서 진행하십시오.
    - 12V 액추에이터 전원과 3.3V 센서 전원은 절대 혼용하지 마십시오.
    - 멀티미터를 사용하여 ADC 입력 단자의 전압이 3.3V를 초과하지 않는지 확인한 후 전원을 인가하십시오.
    - 비상 정지 버튼을 조작하여 각 전원 분기의 DC 접촉기 개방을 즉시 확인하십시오.
    deliverables:
    - 분압 회로 설계도 (PDF)
    - ADC 신호 값 변화 데이터 (측정 기록)
    - 안전 상태기계 코드 스크린샷
  assignment:
    title: 안전 펌웨어 설계 보고서
    deliverables:
    - 시스템 안전 상태기계 설계 문서
    - FSR 센서 ADC 입력 변환 알고리즘 코드
    - 전압 분압 회로 구성 및 안전성 검토 의견서
    rubric:
    - 안전 상태기계 로직의 명확성 및 ESTOP 처리 방식의 적절성
    - 전압 분압 회로의 3.3V 센서 전원 사용 준수 여부
    - ADC 입력 범위 보호 설계의 논리적 타당성
  quiz:
  - question: FSR 센서 전압 분압 회로 구성 시 3.3V 센서 전원을 사용해야 하는 이유는 무엇입니까?
    choices:
    - 12V 액추에이터 전원을 사용하면 전류 효율이 좋아지기 때문입니다.
    - ADC 입력 신호 범위가 0~3.3V 이내여야 제어기 손상을 방지할 수 있기 때문입니다.
    - 12V 전원은 3.3V 전원보다 노이즈가 적기 때문입니다.
    - OpenCR의 ADC는 반드시 12V 입력을 받아야 하기 때문입니다.
    answer_index: 1
    explanation: OpenCR의 ADC 입력 신호는 0~3.3V 범위를 준수해야 합니다. 12V 전원을 직접 연결하면 제어기가 파손됩니다.
  - question: 비상 정지(ESTOP) 입력 시 가장 먼저 수행해야 할 작업은 무엇입니까?
    choices:
    - 소프트웨어 로그를 파일로 저장합니다.
    - 액추에이터의 토크를 즉시 비활성화하고 DC 접촉기를 차단하여 전원을 차단합니다.
    - 현재 동작 중인 모션을 속도를 낮춰서 정지합니다.
    - 제어기를 재부팅합니다.
    answer_index: 1
    explanation: 비상 정지는 물리적 동력을 즉시 차단하여 기계적 위험을 제거하는 것이 핵심입니다.
  completion_criteria:
  - FSR 센서의 ADC 값이 0~3.3V 사이에서 정상적으로 출력됨을 확인.
  - 하드웨어 결선이 3.3V 센서 전원과 12V 액추에이터 전원으로 명확히 분리됨을 증명.
  - 안전 상태기계 논리도가 설계 문서에 포함되고 구현됨.
  source_ids:
  - S12
- id: mod-7
  slug: sensor-integration
  phase_id: phase-3
  title: 촉각 센서 인터페이스 구현
  estimated_hours: 10.0
  prerequisites:
  - mod-6
  objectives:
  - FSR 402 센서의 작동 원리와 저항-압력 특성을 이해한다.
  - OpenCR 제어기에서 전압 분압 회로를 구성하여 ADC 신호를 취득하는 방법을 학습한다.
  - 센서 데이터를 보정하고 로봇손 파지력 제어에 활용하는 로직을 구현한다.
  theory_markdown: '## 촉각 센서 인터페이스 이론


    ### FSR 402의 특성

    FSR(Force Sensing Resistor) 402는 인가되는 힘의 크기에 따라 저항값이 감소하는 압력 민감성 고분자 필름 센서입니다
    [S11]. 0.2N에서 20N 범위의 하중을 측정할 수 있으며, 반복적인 압력 입력에 적합한 구조를 가집니다 [S11].


    ### 전압 분압 회로 (Voltage Divider)

    OpenCR 제어기의 ADC는 0~3.3V 범위의 전압을 디지털 값으로 변환합니다 [S12]. FSR은 자체적으로 저항값이 변하므로, 이를
    전압으로 변환하기 위해 고정된 값의 저항(10 kΩ)과 직렬로 연결하여 전압 분압 회로를 구성합니다 [S26].


    회로 구성:

    1. 3.3V 센서 전원 → FSR → ADC 포트

    2. ADC 포트 → 10 kΩ 고정 저항 → GND


    이때 ADC 입력 전압 V_out은 다음과 같이 계산됩니다:

    V_out = V_in * (R_fixed / (R_FSR + R_fixed))


    이 방식은 FSR의 저항 변화를 0V~3.3V 사이의 아날로그 전압 신호로 변환하여 제어기가 힘을 감지하게 합니다 [S26].'
  worked_examples:
  - '예시 1: FSR에 힘이 가해지지 않아 R_FSR이 100 kΩ일 때, V_out = 3.3V * (10k / (100k + 10k)) ≈
    0.3V. 힘 감지 전 신호값 확인.'
  - '예시 2: FSR에 적절한 힘이 가해져 R_FSR이 10 kΩ이 되었을 때, V_out = 3.3V * (10k / (10k + 10k))
    = 1.65V. 중간 압력 상태.'
  - '예시 3: FSR에 강한 힘이 가해져 R_FSR이 1 kΩ이 되었을 때, V_out = 3.3V * (10k / (1k + 10k)) ≈
    3.0V. 최대 압력 상태.'
  lab:
    title: FSR 센서 ADC 인터페이스 테스트
    steps:
    - OpenCR의 3.3V 센서 레일과 GND를 확인한다.
    - 브레드보드에 FSR 402와 10 kΩ 저항으로 전압 분압 회로를 구성한다.
    - ADC 입력 신호를 OpenCR의 아날로그 입력 포트에 연결한다.
    - 제어 코드를 실행하여 FSR에 가하는 힘에 따른 ADC 원시 데이터(Raw Data) 변화를 모니터링한다.
    safety:
    - OpenCR의 3.3V 센서 레일만 사용하고, 5V 또는 12V 전원을 센서 회로에 직접 연결하지 않는다.
    - 납땜 시 보안경을 착용하고 환기가 잘 되는 곳에서 작업한다.
    - 전원 연결 전 단락(short) 여부를 멀티미터로 반드시 확인한다.
    deliverables:
    - 회로 배선도
    - 힘 인가량 대비 ADC 출력값 데이터 시트
    - 센서 데이터 로그 파일
  assignment:
    title: 촉각 센서 보정 및 파지력 제어 구현
    deliverables:
    - 센서 보정 로직이 포함된 펌웨어 코드
    - 힘-전압 변환 그래프가 포함된 보고서
    rubric:
    - ADC 신호가 0~3.3V 범위를 준수하는가?
    - 물체 접촉 시 센서값이 유의미하게 변화하는가?
    - 코드에서 노이즈 필터링 로직이 구현되었는가?
  quiz:
  - question: FSR 402 인터페이스를 위해 전압 분압 회로를 사용할 때, 고정 저항은 어디에 연결해야 합니까?
    choices:
    - FSR과 12V 전원 사이
    - ADC 입력과 GND 사이
    - FSR과 5V 전원 사이
    - ADC 입력과 12V 사이
    answer_index: 1
    explanation: ADC 입력과 GND 사이에 고정 저항을 연결해야 FSR 저항 변화에 따른 전압 분압이 올바르게 이루어져 ADC가 전압을
      읽을 수 있습니다.
  - question: OpenCR의 센서 전원 레일 사양으로 올바른 것은 무엇입니까?
    choices:
    - 5 V
    - 12 V
    - 3.3 V
    - 24 V
    answer_index: 2
    explanation: OpenCR의 FSR 분압 회로는 3.3V 센서 전원 레일만 사용하여 ADC 입력 신호 범위를 0~3.3V로 제한해야
      합니다.
  completion_criteria:
  - FSR 전압 분압 회로가 OpenCR의 3.3V 레일에 정상적으로 구성됨.
  - ADC 원시 데이터가 FSR에 가해지는 힘에 따라 0~3.3V 범위 내에서 변동됨.
  - 센서 보정 로직이 정상 작동하고 파지력 피드백이 펌웨어에 기록됨.
  source_ids:
  - S11
  - S26
- id: mod-8
  slug: firmware-control
  phase_id: phase-3
  title: 손가락 제어 알고리즘 구현
  estimated_hours: 10.0
  prerequisites:
  - mod-7
  objectives:
  - 텐던 구동 로봇손의 동역학적 특성을 이해한다.
  - XM430 액추에이터의 피드백 데이터를 활용한 위치 및 전류 제어 로직을 설계한다.
  - 손끝 FSR 센서 신호를 처리하여 접촉력을 추정하고 이를 제어 루프에 통합한다.
  - 안전 상태기계(Safety State Machine)를 통한 비상 상황 대응 알고리즘을 구현한다.
  theory_markdown: '## 텐던 구동 시스템의 동역학

    텐던 구동 로봇손은 유연한 섬유(Dyneema SK78)를 통해 액추에이터의 회전력을 관절로 전달합니다 [S8]. 이 시스템은 강결합 구조와
    달리 텐던의 탄성, 마찰, 히스테리시스로 인해 비선형적인 동역학을 가집니다. 정확한 제어를 위해서는 단순한 위치 명령을 넘어 텐던의 장력을
    고려한 폐루프 피드백이 필수적입니다.


    ## XM430 제어 및 피드백

    XM430-W350-T 액추에이터는 위치, 속도, 전류(토크) 데이터를 실시간으로 제공합니다. 제어 알고리즘은 관절 각도 제어 시 위치 피드백을,
    파지력 제어 시 전류 기반 토크 피드백을 복합적으로 사용해야 합니다. 12 V 전원 분기를 통해 안정적인 토크를 출력하며, 스톨 전류 2.3
    A를 초과하지 않도록 펌웨어 수준에서 제어 루프를 구성해야 합니다 [S10].


    ## 힘 제어 알고리즘

    손끝에 배치된 FSR 402 센서는 접촉력을 전기적 저항 변화로 변환합니다 [S11]. OpenCR 보드의 ADC(12-bit)를 사용하여
    0~3.3 V 범위 내의 신호를 읽어들입니다. 이때 10 kΩ 저항을 사용한 분압 회로를 구성하여 센서 입력 전압을 3.3 V 센서 전원 레일에
    안전하게 맞춥니다 [S12, S26]. 제어기는 ''위치기반 접근'' 후 ''힘기반 유지'' 단계를 갖는 하이브리드 제어 알고리즘을 사용하여
    정교한 파지를 구현합니다 [S8].


    ## 안전 상태기계

    로봇손은 비정상적인 전류 급증이나 E-stop 신호 수신 시 즉시 정지해야 합니다. EV200 접촉기 제어 회로와 연동하여 하드웨어 차단과
    소프트웨어 제어를 병행합니다 [S23]. 소프트웨어는 매 루프마다 전류와 위치 오류를 감시하며, 임계값 초과 시 모터 출력을 0으로 설정하고
    비상 정지 상태로 전환합니다.'
  worked_examples:
  - '예제 1: 텐던 신율 보상 제어. 텐던의 작동 신율이 1% 미만임을 감안하여, 관절 위치 목표값(Goal Position) 계산 시 이전
    측정 각도와 현재 텐던 장력 데이터를 결합한 필터를 적용하여 위치 편차를 최소화합니다 [S15].'
  - '예제 2: FSR 힘 데이터 변환. OpenCR ADC에서 읽은 12-bit 값(0-4095)을 전압으로 환산한 후, FSR 데이터시트의
    로그 스케일 곡선을 근사하여 접촉력(N)으로 변환하는 알고리즘을 구현합니다 [S11, S12].'
  lab:
    title: 손가락 파지 알고리즘 실험
    steps:
    - OpenCR 보드와 XM430 모터를 통신 연결하고 전원을 인가합니다.
    - FSR 전압 분압 회로를 3.3 V 센서 레일에 연결하고 ADC 데이터를 확인합니다.
    - 모터를 저속으로 회전시키며 파지 위치에 따른 전류 피드백 값을 기록합니다.
    - '힘 제어 루프를 구현하여 특정 힘(예: 2 N)에 도달하면 모터를 정지시키는 알고리즘을 테스트합니다.'
    - 비상 정지 버튼을 조작하여 EV200 접촉기가 해제되고 모터 분기 전압이 차단되는지 확인합니다.
    safety:
    - 모든 전원 연결은 독립 분기 퓨즈(10 A)가 장착된 상태여야 합니다 [S25].
    - 실험 중 로봇손 사이에 손가락이 끼지 않도록 주의합니다.
    - 비상 정지 버튼은 항상 손이 닿는 곳에 비치합니다.
    - 절대 12 V 액추에이터 전원과 3.3 V 센서 회로를 혼용하지 마십시오 [S12].
    deliverables:
    - FSR 센서 교정 데이터 시트
    - 전류 및 위치 제어 로직 펌웨어 소스 코드
    - 비상 정지 작동 확인 동영상
  assignment:
    title: 지능형 파지 제어 알고리즘 보고서
    deliverables:
    - 위치 및 힘 제어 상태기계 다이어그램
    - 제어 알고리즘 소스 코드
    - 파지 시험 결과 및 오차 분석 보고서
    rubric:
    - 하이브리드 제어 알고리즘의 논리적 타당성
    - 비상 상황 시 전류 차단 응답 시간 확인
    - FSR 데이터의 노이즈 처리 및 필터링 효율
    - 전원 분기 보호 규정 준수 여부
  quiz:
  - question: FSR 센서 신호 취득을 위해 분압 회로를 구성할 때 권장되는 전원은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - OpenCR의 3.3 V 센서 레일
    - 5 V 전원 레일
    - 외장 배터리 직결
    answer_index: 1
    explanation: OpenCR의 센서 회로 보호와 ADC 신호 범위(0~3.3 V) 준수를 위해 반드시 3.3 V 센서 레일을 사용해야
      합니다 [S12].
  - question: 텐던 구동 로봇손의 비상 정지 시 전원 차단 방식에 대한 설명으로 옳은 것은?
    choices:
    - 비상 정지 버튼으로 액추에이터 모터 전원선을 직접 단락(short)시킨다.
    - 모든 액추에이터 전원을 하나로 묶어 소프트웨어적으로만 차단한다.
    - 비상 정지 신호를 통해 독립 분기별 EV200 접촉기를 개방하여 물리적으로 분리한다.
    - 퓨즈를 강제로 태워 전원을 차단한다.
    answer_index: 2
    explanation: 전원 분기마다 1개씩 직렬 배치된 EV200 접촉기를 비상 정지 입력 시 코일 해제를 통해 물리적으로 분리하는 것이
      안전합니다 [S23].
  completion_criteria:
  - 펌웨어 구현을 통해 손가락 관절의 정밀 위치 제어 성공
  - FSR 데이터를 이용한 특정 접촉력 유지 파지 성공
  - 비상 정지 버튼 작동 시 3개 독립 분기의 전압 차단 확인
  - 제어 로직 내 모든 전류 및 전압 사용이 BOM 사양을 준수함을 입증
  source_ids:
  - S8
- id: mod-9
  slug: verification
  phase_id: phase-4
  title: 파지 시험 및 성능 검증
  estimated_hours: 5.0
  prerequisites:
  - mod-8
  objectives:
  - 파지 시험(Grasping Test)의 정량적 지표 이해 및 측정 방법 습득
  - FSR 센서와 로봇 제어 시스템을 이용한 접촉력 피드백 데이터 분석
  - 실제 로봇손의 작업 성공률 및 효율성 평가를 통한 성능 검증
  - 안전 비상 정지 시스템의 동작 무결성 확인
  theory_markdown: "## 파지 시험과 성능 검증\n\n로봇손의 성능은 단순한 기계적 동작을 넘어, 물체를 안정적으로 파지하고 조작하는\
    \ 능력으로 평가됩니다. [S8]에 따르면, 손가락별로 독립적인 제어가 가능한 로봇손은 그렇지 않은 모델 대비 작업 성공률이 유의미하게 높습니다.\
    \ \n\n### 1. 파지 시험 지표 (Grasping Metrics)\n- **작업 성공률 (Success Rate):** 정해진 시간\
    \ 내에 목표 물체를 지정된 위치로 옮기거나 파지하는 성공 횟수의 비율 [S8].\n- **작업 완료 시간 (Completion Time):**\
    \ 물체 접촉부터 파지 완료까지 소요되는 시간의 평균값으로, 제어 시스템의 응답 속도와 직결됩니다 [S8].\n- **접촉력 일관성 (Contact\
    \ Force Consistency):** FSR 402 센서를 통해 측정된 힘이 파지 과정에서 얼마나 일정하게 유지되는지 확인하는 지표입니다.\
    \ [S11]\n\n### 2. 안전성 검증\n로봇 성능 검증의 핵심은 신뢰성입니다. 특히 액추에이터 제어 시스템과 비상 차단 장치(EV200\
    \ 접촉기)의 동작은 물리적 사고 방지를 위해 필수적으로 점검해야 합니다. 시스템은 각 액추에이터 분기별로 독립적인 퓨즈(10 A)와 비상\
    \ 정지 회로를 통해 과전류로부터 보호되어야 합니다. [S14, S23, S25]"
  worked_examples:
  - '예제 1: FSR 출력 데이터의 힘 변환 (ADC to Force)

    OpenCR의 12-bit ADC 입력값(0-4095)을 3.3V 기준으로 변환하고, FSR 데이터시트의 저항-힘 곡선을 참조하여 뉴턴(N)
    단위로 매핑하는 수식을 도출합니다. 저항 분압(10kΩ 저항 사용)을 통해 얻은 전압값을 힘으로 변환하는 교정 곡선을 작성합니다. [S11,
    S26]'
  - '예제 2: 비상 정지(E-stop) 반응 시간 측정

    비상 정지 버튼을 누른 후, EV200 접촉기 코일의 NC 접점이 개방되어 액추에이터에 공급되던 12V 전원이 차단되기까지의 시간을 멀티미터와
    오실로스코프로 측정하여 설계 안전 기준을 확인합니다. [S14, S22, S23]'
  lab:
    title: 로봇손 파지 및 안전 시스템 검증 실습
    steps:
    - 1. 독립된 3개의 12V 전원 분기에 액추에이터와 10A 퓨즈, EV200 접촉기가 올바르게 연결되었는지 멀티미터로 도통 시험을 수행합니다.
    - 2. FSR 402 센서를 3.3V 센서 전원 레일에 연결하고, ADC 분압 회로를 확인합니다.
    - 3. 로봇 제어 시스템을 가동하여 손가락 5개를 개별적으로 움직이며 텐던 장력을 확인합니다.
    - 4. 실제 물체(직경 30mm 실린더)를 파지하며 FSR 센서의 실시간 힘 데이터를 기록합니다.
    - 5. 정상 동작 중 비상 정지 버튼을 작동시켜 3개 분기 전원이 즉시 차단되는지 확인합니다.
    safety:
    - 모든 회로 점검 시 반드시 저전압 벤치 전원을 사용하십시오.
    - 회로 변경 시 전원 분리 상태를 유지하고, 보안경을 반드시 착용하십시오.
    - 비상 정지 장치의 강제 개방 접점(NC)이 올바르게 동작하는지 확인하십시오.
    - 액추에이터 고전류 통전 시험 시 반드시 10A 퓨즈가 장착되어 있는지 재확인하십시오.
    deliverables:
    - 파지 시험 중 획득한 FSR 센서 힘-시간 데이터 로그
    - 작업 성공률 및 완료 시간 분석 보고서
    - 비상 정지 시스템 동작 시험 결과 기록서
  assignment:
    title: 로봇손 최종 성능 분석 보고서 작성
    deliverables:
    - 파지 시험 데이터 분석 차트 (시간 vs 접촉력)
    - 성능 지표(성공률, 완료 시간) 요약 표
    - 비상 정지 동작 무결성 확인 및 교정 기록
    rubric:
    - '데이터 분석의 정확성: FSR 신호 변환 및 힘 데이터의 타당성'
    - '안전 검증 결과의 신뢰성: 회로 차단 시험의 체계적인 수행'
    - '보고서의 전문성: 기술적 지표에 기반한 성능 논의'
  quiz:
  - question: 파지 시험에서 작업 성공률을 높이기 위해 권장되는 로봇손의 특성은 무엇입니까?
    choices:
    - 모든 손가락을 하나의 액추에이터로 동시에 구동
    - 손가락별 독립적인 제어 가능
    - 텐던의 장력을 사용하지 않고 직접 구동
    - FSR 센서 제거
    answer_index: 1
    explanation: 독립적인 제어는 다양한 물체 형상에 대한 유연한 파지를 가능하게 하여 작업 성공률을 향상시킵니다 [S8].
  - question: 본 시스템에서 FSR 402 센서 전압 분압 회로의 공급 전압으로 적절한 것은?
    choices:
    - 12 V
    - 5 V
    - 3.3 V
    - 24 V
    answer_index: 2
    explanation: OpenCR의 ADC 입력 보호 및 신호 범위를 위해 3.3V 센서 전원 레일만을 사용해야 합니다.
  - question: 비상 정지 동작 시 EV200 접촉기의 역할은 무엇입니까?
    choices:
    - 전원 공급장치 자체를 물리적으로 파괴
    - 액추에이터 분기 전원을 독립적으로 차단
    - ADC 신호를 증폭
    - 텐던의 장력을 자동 복구
    answer_index: 1
    explanation: EV200 접촉기는 비상 정지 NC 제어 회로에 연결되어 독립적인 액추에이터 전원 분기를 안전하게 차단합니다 [S23].
  completion_criteria:
  - 파지 시험을 통해 정량적 데이터(성공률, 완료 시간)를 획득하고 보고서 제출
  - 비상 정지 시스템의 전원 차단 기능이 시험 절차에 따라 확인됨
  - FSR 데이터 변환 교정 기록이 포함된 최종 성능 분석 보고서 완성
  source_ids:
  - S8
- id: mod-10
  slug: reporting
  phase_id: phase-4
  title: 최종 보고서 및 데이터 정리
  estimated_hours: 5.0
  prerequisites:
  - mod-9
  objectives:
  - 로봇 시스템 개발 프로젝트의 성과를 객관적 데이터로 정량화하고 문서화하는 능력을 함양한다.
  - 기술적 난제와 해결 과정을 논리적으로 서술하는 보고서 작성법을 습득한다.
  - 시스템 성능 검증 결과(파지 시험, 내구 시험)를 분석하여 시각화하는 방법을 익힌다.
  theory_markdown: "## 기술 문서화와 시스템 검증의 중요성\n로봇 공학 프로젝트에서 최종 보고서는 설계부터 검증까지의 모든 과정을\
    \ 입증하는 핵심 자산입니다. 특히 Ruka-v2와 같은 텐던 구동 로봇손은 정밀도와 내구성이 중요하므로, 데이터 기반의 검증이 필수적입니다\
    \ [S8].\n\n### 데이터 정리 및 분석\n데이터는 단순한 나열이 아닌, 설계 목표와 대비하여 해석되어야 합니다. \n- **정량적\
    \ 평가:** 파지 성공률(Success Rate), 작업 완료 시간(Completion Time) 등 핵심 성능 지표(KPI)를 설정하고,\
    \ 이전 모델(Ruka v1)과의 비교를 통해 기술적 진보를 입증합니다 [S8].\n- **오류 및 문제 해결 기록:** 개발 과정에서 마주한\
    \ 하드웨어 이슈(예: 텐던 신율, 기구적 유격)와 이를 해결하기 위한 설계 변경 내용을 상세히 기록하여 기술적 노하우를 확보합니다.\n\n\
    ### 보고서 구성 요소\n1. **서론:** 프로젝트 배경 및 해결하고자 한 문제 정의.\n2. **시스템 설계:** BOM 기반의 하드웨어\
    \ 사양, 제어기(OpenCR 1.0) 설정 및 배선 구조 요약.\n3. **실험 및 결과:** 파지 시험(FSR 402 센서 데이터 활용)\
    \ 및 내구 시험 결과의 시각화.\n4. **결론:** 성과 분석 및 향후 개선 방향 제시."
  worked_examples:
  - '예시 1: 작업 완료 시간 비교 - ''Ruka-v2는 Ruka-v1 대비 텔레오퍼레이션 작업 완료 시간을 51.3% 단축시켰으며, 이는
    손목 2-DOF의 추가에 의한 기동성 향상 결과로 분석됨 [S8].'''
  - '예시 2: 데이터 시각화 - ''X축은 시험 횟수, Y축은 파지력을 나타내는 선 그래프를 생성하여, 100회 반복 시험 동안 FSR 센서값이
    5% 이내의 오차를 유지함을 입증.'''
  lab:
    title: 최종 성능 검증 및 기록
    steps:
    - 파지 시험 장비를 구성하고, FSR 402 센서를 활용하여 표준 물체 파지 데이터를 20회 이상 취득한다.
    - 내구 시험을 통해 텐던(Dyneema SK78) 및 구조물(PC-CF)의 마모도를 관찰하고 사진으로 기록한다.
    - 취득한 데이터를 정리하여 파지력 안정성과 작업 성공률 지표를 계산한다.
    - 실험 데이터를 바탕으로 결론 섹션을 작성하고 성과물 목록을 최종 취합한다.
    safety:
    - 비상 정지 장치(EV200 접촉기 연동)가 작동하는지 시험 전 확인한다.
    - 데이터 취득 중 로봇손의 강제 구동 시 끼임 방지를 위해 보호구를 착용한다.
    - 전원 분기별 독립 퓨즈(10 A)가 올바르게 배치되었는지 확인한다.
    deliverables:
    - 최종 성능 검증 데이터셋(CSV)
    - 성능 분석 시각화 차트
    - 최종 시스템 사양 및 기술 보고서 PDF
  assignment:
    title: 로봇손 프로토타입 최종 보고서 작성
    deliverables:
    - 완성된 최종 기술 보고서(PDF)
    - 모든 CAD 파일 및 펌웨어 소스 코드 저장소 링크
    - 시스템 조립 도면 및 배선도
    rubric:
    - BOM 및 배선 사양이 프로젝트 요구사항과 일치하는가?
    - 성능 데이터(파지 성공률, 완료 시간)가 정량적으로 기술되었는가?
    - 문제 해결 과정이 기술적 근거를 바탕으로 논리적으로 서술되었는가?
    - 비상 차단 시스템의 안전성 검증 결과가 포함되었는가?
  quiz:
  - question: 로봇 프로젝트 최종 보고서에서 성능을 평가할 때 가장 적절한 방법은?
    choices:
    - 개발자의 주관적인 느낌을 상세히 서술한다.
    - 목표 성능 지표(KPI)를 설정하고 데이터 기반으로 비교 분석한다.
    - 성공한 결과만 기재하고 실패 과정은 삭제한다.
    - 기존 문헌의 데이터를 그대로 복사하여 사용한다.
    answer_index: 1
    explanation: 기술 보고서는 객관적인 데이터와 정량적 지표를 통해 설계의 진보성을 입증해야 합니다.
  - question: 본 프로젝트에서 사용된 FSR 402 센서와 10kΩ 저항을 사용한 회로의 목적은?
    choices:
    - 액추에이터 전압을 12V로 유지하기 위해
    - 손끝의 힘을 ADC가 읽을 수 있는 전압 신호로 변환하기 위해
    - 비상 정지 신호를 제어기로 전달하기 위해
    - 배선의 전류를 제한하기 위해
    answer_index: 1
    explanation: FSR은 압력에 따라 저항이 변하는 소자로, 10kΩ 저항과 분압 회로를 구성하여 전압 변화를 ADC로 측정합니다.
  completion_criteria:
  - 최종 기술 보고서가 형식 요건을 갖추어 제출됨.
  - 성능 검증 데이터(파지 시험, 내구 시험)가 분석되어 포함됨.
  - 시스템 설계 사양 및 BOM이 Truth 테이블과 대조되어 일치함.
  source_ids:
  - S8
