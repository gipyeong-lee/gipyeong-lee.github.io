- id: M1
  slug: robot-kinematics-basics
  phase_id: P1
  title: 로봇 기구학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 기구학의 기본 개념인 강체 변환(Spatial Transformations)을 이해한다.
  - 순기구학(Forward Kinematics)을 사용하여 로봇 손가락의 위치와 자세를 수학적으로 모델링한다.
  - 로봇 작업공간(Workspace)의 개념을 파악하고 최적화의 필요성을 학습한다.
  - 좌표계 변환과 회전 행렬을 적용하여 다관절 시스템을 해석한다.
  theory_markdown: '## 로봇 기구학 기초


    로봇 기구학은 로봇의 기계적 구조를 기하학적 관점에서 해석하는 학문으로, 힘이나 토크를 고려하지 않고 위치, 속도, 가속도 사이의 관계를 다룹니다
    [S1, S2].


    ### 1. 공간 변환 (Spatial Transformations)

    로봇 손의 각 관절 위치는 좌표계(Coordinate Frame)의 조합으로 표현됩니다. 관절 $i$와 관절 $i+1$ 사이의 상대적 관계는
    회전 행렬 $R$과 위치 벡터 $P$를 포함하는 동차 변환 행렬(Homogeneous Transformation Matrix) $T$로 정의됩니다
    [S2].


    $$T = \begin{bmatrix} R & P \\ 0 & 1 \end{bmatrix}$$


    ### 2. 순기구학 (Forward Kinematics)

    순기구학은 관절 각도(Joint Variables)가 주어졌을 때, 로봇 끝단(End-effector, 예: 손끝)의 공간상 위치와 자세를
    계산하는 과정입니다 [S2]. 로봇 손가락 모델링 시, 각 링크의 길이와 관절의 회전 각도를 사용하여 전체 좌표계에서의 손끝 위치를 산출합니다.


    ### 3. 작업공간 (Workspace)

    로봇이 도달할 수 있는 모든 공간의 집합을 작업공간이라 합니다 [S2]. 5지 로봇손의 경우, 각 손가락 관절의 가동 범위 제한에 의해 작업공간이
    결정되며, 이는 기계 설계 시 최적화되어야 하는 핵심 요소입니다 [S2].'
  worked_examples:
  - '예제 1: 2차원 평면에서 1자유도 링크(길이 $L=100$ mm, 각도 $\theta=30^\circ$)의 끝단 좌표 $(x, y)$ 계산.
    $x = L \cos(\theta) = 100 \times \cos(30^\circ) \approx 86.6$ mm, $y = L \sin(\theta)
    = 100 \times \sin(30^\circ) = 50.0$ mm.'
  - '예제 2: 3차원 공간에서 $z$축 기준으로 $90^\circ$ 회전하는 회전 행렬 $R_z(90^\circ)$ 구성. $R_z = \begin{bmatrix}
    \cos(90^\circ) & -\sin(90^\circ) & 0 \\ \sin(90^\circ) & \cos(90^\circ) & 0 \\
    0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 1
    \end{bmatrix}$.'
  lab:
    title: 좌표계 모델링 및 손가락 관절 해석 실습
    steps:
    - OpenCR 제어기에 연결된 DYNAMIXEL XM430-W350-T의 통신 상태를 DYNAMIXEL Wizard 2.0으로 확인한다 [S11,
      S13].
    - 로봇 손가락의 링크 길이를 버니어 캘리퍼스로 측정하여 기록한다.
    - 측정한 값을 바탕으로 각 관절의 회전 중심을 기준으로 좌표계를 설정한다.
    - 설정된 좌표계를 바탕으로 로봇 손가락의 순기구학 수식을 작성한다.
    - 실제 액추에이터를 회전시켜 계산된 손끝 위치와 실제 위치의 오차를 멀티미터로 센서 전압을 확인하며 간접 검증한다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터(GST160A12-R7B)를 물리적으로 분리하고 멀티미터로 각 분기 전압이 1 V 미만인지 DC-voltage
      모드에서 반드시 확인한다 [S15].
    - 절대 양(+) 출력 단자를 병렬로 연결하지 않는다.
    - 전원 인가 중 가동 범위 내에 손이나 이물질을 절대 넣지 않는다.
    - 모든 회로는 퓨즈(10 A ATOF)가 포함된 독립 분기로 구성하며 직접 구성한 정지 회로를 안전 기능으로 신뢰하지 않는다 [S24].
    deliverables:
    - 작성된 로봇 손가락 기구학 모델 보고서
    - 관절 각도에 따른 손끝 좌표 계산 결과 표
    - 안전 확인 실측 기록
  assignment:
    title: 로봇 손가락 기구학 설계 및 분석
    deliverables:
    - 손가락 1개에 대한 순기구학 방정식 유도 자료
    - 작업공간 도식화 결과물 (CAD 또는 그래프)
    - 좌표계 설정이 포함된 설계 도면
    rubric:
    - 순기구학 방정식이 관절 각도와 링크 길이를 적절히 반영하는가?
    - 좌표계 설정이 D-H 파라미터 또는 표준 방식에 부합하는가?
    - 작업공간 분석이 물리적 한계를 고려했는가?
  quiz:
  - question: 순기구학(Forward Kinematics)의 정의로 올바른 것은?
    choices:
    - 끝단의 위치를 알 때 관절 각도를 계산하는 과정
    - 관절 각도를 알 때 끝단의 위치와 자세를 계산하는 과정
    - 로봇의 동역학적 힘을 분석하는 과정
    - 센서 데이터를 보정하는 과정
    answer_index: 1
    explanation: 순기구학은 조인트 변수(관절 각도)로부터 작업 공간 내의 위치와 자세를 도출하는 과정입니다 [S2].
  - question: 로봇 시스템에서 작업공간(Workspace)을 제한하는 주요 요인은?
    choices:
    - 링크의 길이와 관절의 가동 범위
    - 제어기의 CPU 클럭 속도
    - 액추에이터의 통신 프로토콜
    - 퓨즈의 정격 전류
    answer_index: 0
    explanation: 로봇의 작업공간은 기하학적 형상(링크 길이)과 관절의 회전 한계에 의해 결정됩니다 [S2].
  completion_criteria:
  - 순기구학 수식 유도 보고서 제출 및 통과
  - 작업공간 도식화 및 설계 도면 완료
  - 안전 절차를 준수하여 실습 수행 및 기록 완료
  source_ids:
  - S1
  - S2
  - S11
  - S13
  - S15
  - S24
- id: M2
  slug: underactuated-design-principles
  phase_id: P1
  title: 저구동 손 설계 원리
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 저구동(Underactuated) 로봇손의 기구학적 설계 원리를 이해한다.
  - 텐던 구동 메커니즘을 통한 관절 간 연동 제어 방식을 학습한다.
  - 하드웨어 강성과 제어 복잡도 간의 상충 관계를 분석한다.
  theory_markdown: '### 저구동 로봇손의 설계 원리


    저구동 시스템은 구동기(Actuator)의 개수가 제어해야 할 자유도(DOF)보다 적은 시스템을 의미한다 [S8]. 로봇손 설계에서 저구동
    방식은 손가락 전체에 개별 모터를 배치하는 대신, 단일 액추에이터로 여러 관절을 순차적 혹은 기구학적 구속에 의해 구동하도록 하여 무게와 복잡도를
    획기적으로 낮춘다 [S3].


    #### 1. 텐던 구동 메커니즘

    텐던(Dyneema SK78)은 액추에이터의 회전 운동을 관절의 굽힘으로 전달하는 매개체이다 [S16]. 이때 관절마다 적절한 모멘트 암(Moment
    arm)을 설계함으로써, 액추에이터 하나로 손가락의 다양한 마디를 순차적으로 굽히거나 특정 형태의 파지(Grasp) 패턴을 구현할 수 있다
    [S3].


    #### 2. 기구학적 시너지

    손가락의 시너지는 관절 간의 좌표적 연동 패턴을 의미하며, 이를 기구학적으로 구현하면 제어 소프트웨어를 복잡하게 설계하지 않아도 자연스러운
    파지 형태를 형성할 수 있다 [S3]. 저구동 설계는 물체의 형상에 맞게 순응적으로(Compliant) 적응하는 능력을 가지며, 이는 정교한
    감각 제어 없이도 안정적인 파지를 가능하게 한다 [S3].


    #### 3. 설계 시 고려사항

    - **강성 및 재료**: PC-CF 필라멘트를 사용하여 구조적 강성을 확보하고, 무급유 폴리머 베어링(JSM-0810-10)을 사용하여 마찰을
    최소화해야 한다 [S17, S19].

    - **제어 보드**: OpenCR 제어기를 사용하여 텐던 구동 액추에이터(XM430-W350-T)의 위치, 속도, 전류를 실시간 피드백 받아
    제어한다 [S11, S13].'
  worked_examples:
  - '예제 1: 텐던 구동의 모멘트 암 설계 - 손가락의 근위 지절(Proximal phalanx)과 원위 지절(Distal phalanx)에
    가해지는 장력을 조절하기 위해 캡스턴 모서리를 라운딩 처리하여 마찰을 줄이고, 각 마디의 모멘트 암 길이를 1:0.8 비율로 설계하여 근위
    마디가 먼저 굽혀지도록 구성을 설계한다.'
  - '예제 2: 전류 피드백을 활용한 파지력 추정 - OpenCR ADC 포트에 FSR 402를 10 kΩ 저항과 함께 분압 회로로 연결하여 0~3.3
    V 신호를 취득하고, 액추에이터의 전류 피드백 값과 상관관계를 분석하여 물체 접촉 시 멈춤 제어 알고리즘을 수립한다 [S11, S12, S13,
    S25].'
  lab:
    title: 저구동 관절 움직임 및 텐던 장력 실습
    steps:
    - PC-CF 출력물과 JSM-0810-10 베어링, 8 mm 샤프트를 사용하여 손가락 마디 관절을 조립한다 [S17, S18, S19].
    - Dyneema 텐던을 관절 캡스턴에 통과시키고 고정점마다 장력을 부여하여 움직임을 확인한다 [S16].
    - 각 독립 분기 전원(GST160A12-R7B)을 10 A ATOF 퓨즈가 장착된 인라인 홀더(0AFH0001Z)를 통해 액추에이터에 연결한다
      [S15, S23, S24].
    - OpenCR 제어기와 액추에이터를 통신 연결하고 무부하 상태에서 관절 굽힘각을 측정한다 [S11, S13].
    safety:
    - 전원 인가 전 3개 절연 전원 어댑터의 출력을 각각 DC 전압 모드로 측정하여 1 V 미만인지 반드시 확인한다.
    - 실험 중 정지는 3개 절연 전원 어댑터를 벽면 소켓에서 물리적으로 분리하여 수행한다.
    - 텐던 장력 시험 및 관절 구동 중에는 파편 방지를 위해 반드시 보안경을 착용한다.
    - 절대 12 V 액추에이터 전원을 OpenCR의 3.3 V 센서 전원이나 아날로그 입력 회로와 혼용하지 않는다.
    deliverables:
    - 조립된 관절 가동 범위 측정값(도 단위)
    - 텐던 장력에 따른 관절 연동 패턴 사진 및 분석
    - 독립 분기 전압 측정 교정 기록지
  assignment:
    title: 저구동 로봇손 설계서 작성
    deliverables:
    - CAD 설계 파일(관절 모듈 및 캡스턴 형상)
    - 텐던 라우팅 및 퓨즈 분기 포함 배선도
    - 설계 최종 보고서
    rubric:
    - 기구학적 연동 원리가 저구동 설계에 적절하게 적용되었는가?
    - 전원 공급 및 분기 퓨즈 구성이 안전 규정을 준수하는가?
    - 부품 목록(BOM)이 BOM_SYSTEM_TRUTH와 일치하는가?
  quiz:
  - question: 저구동(Underactuated) 로봇손 설계의 주요 장점은 무엇인가?
    choices:
    - 모든 관절을 독립적으로 제어하여 정확도가 극대화된다.
    - 구동기 수를 줄여 무게와 시스템 복잡도를 낮추고 순응적 파지가 가능하다.
    - 제어 소프트웨어가 극도로 복잡해지지만 강성이 강화된다.
    - 전원 분기가 필요 없어 비용이 매우 저렴하다.
    answer_index: 1
    explanation: 저구동 설계는 구동기를 줄여 시스템 효율성을 높이고, 기구학적으로 물체에 순응하는 파지 능력을 제공합니다.
  - question: OpenCR 제어기 사용 시 FSR 402 센서 전원 공급에 대한 설명으로 옳은 것은?
    choices:
    - 12 V 액추에이터 레일을 사용하여 ADC 신호를 강화한다.
    - 5 V 전원 단자를 사용하여 센서의 정밀도를 높인다.
    - 3.3 V 센서 전원을 사용하며 ADC 입력이 0~3.3 V 범위를 초과하지 않도록 한다.
    - 외부 전원을 반드시 사용하며 OpenCR 전원과는 연결하지 않는다.
    answer_index: 2
    explanation: OpenCR 사양에 따라 FSR 전압 분압 회로는 반드시 3.3 V 센서 전원을 사용해야 하며, ADC 신호 범위는
      0~3.3 V 이내여야 합니다 [S13].
  - question: 본 실습에서 안전한 전원 차단 방법은 무엇인가?
    choices:
    - 소프트웨어적으로 모터 출력을 0으로 설정한다.
    - 계획 정지 버튼(실습용)을 누른다.
    - 3개의 독립 전원 어댑터를 물리적으로 분리하고 DC 전압을 측정하여 1 V 미만임을 확인한다.
    - 멀티미터의 저항 모드로 전원선 단락을 확인한다.
    answer_index: 2
    explanation: 이 실습에서는 물리적 전원 분리와 DC 전압 측정이 유일한 안전 확인 방법입니다.
