modules:
- id: m1
  slug: robot-kinematics-intro
  phase_id: p1
  title: 로봇 기구학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 기구학의 기본 개념을 이해하고 자유도(DOF)를 정의할 수 있다.
  - 순기구학(Forward Kinematics)과 역기구학(Inverse Kinematics)의 차이를 설명할 수 있다.
  - DYNAMIXEL 스마트 액추에이터의 피드백 데이터를 활용하여 위치 제어 원리를 파악한다.
  - 로봇 손의 텐던 구동 메커니즘이 기구학적 요구사항에 미치는 영향을 분석한다.
  theory_markdown: '### 로봇 기구학의 개요

    로봇 기구학은 힘이나 토크를 고려하지 않고 로봇의 기하학적 구조를 이용하여 위치와 방향을 수학적으로 해석하는 학문입니다 [S8]. 5지 로봇
    손과 같이 고자유도 시스템을 제어하기 위해서는 각 관절의 각도($q$)와 손끝의 위치($x$) 사이의 관계를 규명해야 합니다.


    ### 기구학적 해석

    1. **순기구학(Forward Kinematics):** 관절의 각도 입력을 통해 로봇 손끝(End-effector)의 위치와 방향을 계산합니다.
    $x = f(q)$로 표현됩니다.

    2. **역기구학(Inverse Kinematics):** 원하는 로봇 손끝의 위치에 도달하기 위해 필요한 각 관절의 목표 각도를 계산합니다.
    $q = f^{-1}(x)$로 표현되며, 해가 없거나 여러 개 존재할 수 있는 비선형 문제의 특성을 가집니다.


    ### 스마트 액추에이터와 피드백

    본 설계에서 사용하는 XM430-W350-T 액추에이터는 스톨 토크 4.1 N·m를 제공하며 [S11], 위치, 속도, 전류 피드백을 실시간으로
    제공합니다. 이는 로봇 제어에서 상태 관측기(State Observer) 역할을 수행하여 텐던 장력 전달 중 발생하는 오차를 보정하는 데 핵심적인
    역할을 합니다. 특히 텐던 구동 방식은 모터의 회전을 관절의 굽힘으로 변환하므로, 액추에이터의 정밀 피드백은 텐던의 신율과 마찰로 인한 위치
    오차를 줄이는 데 필수적입니다.'
  worked_examples:
  - '예제 1: 관절 각도 계산 - 1자유도 손가락 관절에서 액추에이터가 90도 회전할 때, 반지름 $r=20$ mm인 캡스턴에 감긴 텐던의 이동
    거리를 계산하시오. (풀이: $s = r \theta = 20 \times (90 \times \pi/180) \approx 31.4$ mm)'
  - '예제 2: 전류 피드백 활용 - 액추에이터의 스톨 전류가 2.3 A일 때 [S11], 제어기 OpenCR의 ADC 입력 신호가 전류값과 비례한다면,
    전류 제한치를 스톨 전류의 50%로 설정하기 위한 제어 로직을 설명하시오. (답: 최대 입력 전압 내에서 1.15 A를 초과하지 않도록 전류
    제한 피드백 루프를 프로그래밍함.)'
  lab:
    title: 액추에이터 통신 및 위치 피드백 확인
    steps:
    - OpenCR 제어 보드와 XM430-W350-T 액추에이터를 12 V 액추에이터 전원 분기에 연결한다.
    - DYNAMIXEL SDK 예제를 실행하여 액추에이터의 ID를 식별하고 통신 상태를 확인한다.
    - 목표 위치(Goal Position)를 0, 1024, 2048 단계로 설정하여 회전 동작을 검증한다.
    - 실시간 위치(Present Position) 피드백 데이터를 PC 화면으로 출력하여 기록한다.
    safety:
    - 실험 전 3개 절연 전원 어댑터를 물리적으로 분리하고 멀티미터로 1 V 미만인지 확인한다.
    - 전원 인가 중 손가락을 액추에이터 가동 범위에 넣지 않는다.
    - 보안경을 필히 착용하고 고정 지그를 사용하여 무부하 시험부터 시작한다.
    deliverables:
    - 액추에이터 통신 확인 스크린샷
    - 목표 위치 대 실제 피드백 위치 데이터 표
    - 실험 중 확인된 안전 점검 체크리스트
  assignment:
    title: 로봇 손 기구학 설계 보고서
    deliverables:
    - 각 손가락의 텐던 경로가 포함된 기구학적 설계 도면
    - 순기구학 기반 손가락 끝 이동 거리 계산 수식
    - 사용된 XM430-W350-T의 전압 및 전류 동작 특성 요약
    rubric:
    - 기구학 공식의 물리적 타당성
    - 액추에이터 사양 기반 동작 가능성 검토
    - 안전 수칙 준수 및 실험 기록의 정확성
  quiz:
  - question: 순기구학의 정의로 옳은 것은?
    choices:
    - 손끝 위치에서 각 관절의 각도를 구하는 과정
    - 관절 각도에서 손끝의 위치와 방향을 구하는 과정
    - 액추에이터의 전류를 힘으로 변환하는 과정
    - 텐던의 장력을 계산하는 과정
    answer_index: 1
    explanation: 순기구학은 관절 파라미터(각도)를 입력으로 하여 공간상의 위치(손끝)를 산출하는 과정입니다.
  - question: XM430-W350-T 액추에이터의 기준 전압은 무엇인가?
    choices:
    - 5 V
    - 12 V
    - 24 V
    - 3.3 V
    answer_index: 1
    explanation: 공식 데이터시트에 명시된 XM430-W350-T의 기준 입력 전압은 12 V입니다 [S11].
  completion_criteria:
  - 액추에이터의 위치 피드백 데이터 취득 성공
  - 기구학 설계 보고서 내의 물리적 수식 타당성 확보
  - 모든 실험 과정에서 안전 절차를 준수하고 무전원 상태 확인 완료
  source_ids:
  - S8
  - S11
- id: m2
  slug: tendon-design
  phase_id: p1
  title: 텐던 구동 메커니즘 설계
  estimated_hours: 10.0
  prerequisites:
  - m1
  objectives:
  - 텐던 구동 메커니즘의 기본 역학을 이해하고 로봇 손의 자유도를 분석한다.
  - Dyneema SK78 텐던의 특성을 이해하고 적절한 장력 설계 방식을 습득한다.
  - DYNAMIXEL 스마트 액추에이터와 텐던 인터페이스를 구현하는 하드웨어 설계 원리를 파악한다.
  theory_markdown: '### 텐던 구동 메커니즘의 기초

    텐던 구동 시스템은 생물학적 근육과 힘줄의 작동 원리를 모방한 것으로, 모터와 같이 구동원이 직접 관절에 위치하지 않고 원격에서 장력을 전달하여
    구동하는 방식입니다 [S9]. 이 방식은 관절 부위의 무게를 획기적으로 줄여 로봇 손의 민첩성과 조작성을 높입니다 [S9].


    ### 텐던 재료와 설계 요구사항

    텐던은 인장 하중을 관절로 전달하는 핵심 요소입니다. `Dyneema SK78` 섬유는 높은 파단 하중(230 daN)과 낮은 신율(< 1%)을
    제공하여 정밀한 제어를 가능하게 합니다 [S16]. 설계 시 텐던의 경로(path)는 캡스턴(capstan) 모서리에서의 반복적인 굽힘과 마찰을
    견뎌야 하므로, 캡스턴의 설계와 라운딩 처리가 필수적입니다 [S16].


    ### 기구적 이점과 자유도

    텐던 구동식 손은 손가락 하나당 다중 자유도를 독립적으로 구현할 수 있게 하며, 손목 회전 및 손가락의 내전/외전 동작을 결합하여 복잡한 파지
    작업과 도구 사용이 가능해집니다 [S9]. 이는 인공지능 기반의 학습 제어에서 필수적인 물리적 유연성을 제공합니다 [S9, S10].'
  worked_examples:
  - '예제 1: 텐던 장력 전달 분석. 모터 스톨 토크가 4.1 N·m인 DYNAMIXEL XM430-W350-T [S11]를 사용하여 텐던을
    구동할 때, 캡스턴 반지름이 10 mm라면 이론적 최대 장력은 T = Torque / Radius = 4.1 N·m / 0.01 m = 410
    N입니다. Dyneema SK78의 파단 하중이 230 daN(약 2300 N)이므로 안전율은 충분합니다 [S16].'
  - '예제 2: 텐던 경로 설계. 손가락 링크의 마찰을 줄이기 위해 링크 간의 굽힘 지점을 라운딩 처리해야 합니다. 1.5 mm 지름의 Dyneema
    라인을 사용할 때 곡률 반경은 라인 지름의 최소 5배 이상을 확보해야 마모를 방지할 수 있습니다 [S16].'
  lab:
    title: 텐던 텐셔닝 및 마찰 측정 실습
    steps:
    - 제작된 로봇 손가락 모듈을 전용 고정 지그에 장착하고 Dyneema SK78 텐던을 캡스턴에 연결한다.
    - 멀티미터를 사용하여 독립된 12 V 전원 분기 전압이 12 V임을 확인하고 액추에이터를 연결한다.
    - 소프트웨어를 통해 액추에이터에 단계적으로 위치 명령을 주며 텐던의 장력을 인가한다.
    - 손끝의 마찰을 제거한 상태에서 액추에이터 전류를 모니터링하여 구동 마찰력을 측정한다.
    safety:
    - 시험 중에는 반드시 충격 방지 작업용 보안경을 착용한다.
    - 액추에이터 구동 시 손가락 가동 범위 내에 절대 손을 넣지 않는다.
    - 시스템 정지는 3개의 독립 전원 어댑터를 물리적으로 분리하고, 멀티미터로 각 분기 전압이 1 V 미만임을 확인 후 접근한다.
    deliverables:
    - 텐던 장력 인가에 따른 액추에이터 전류 소모량 데이터 그래프
    - 텐던 경로 내 마찰 및 마모 여부 관찰 기록지
  assignment:
    title: 텐던 경로 최적화 설계
    deliverables:
    - 텐던 경로를 최적화한 손가락 링크의 CAD 도면
    - 장력 전달 과정에서 텐던 신율을 최소화하는 설계 보고서
    rubric:
    - 텐던 경로의 굽힘 반경이 텐던 지름(1.5 mm)의 5배 이상 확보되었는가?
    - Dyneema SK78의 물성치를 설계 계산에 반영하였는가?
    - 액추에이터 설치 위치와 텐던 연결부의 동역학적 합리성이 설명되었는가?
  quiz:
  - question: 텐던 구동 시스템에서 Dyneema SK78 섬유를 사용하는 가장 큰 이유는 무엇입니까?
    choices:
    - 높은 전기 전도성
    - 낮은 신율과 높은 파단 하중
    - 금속보다 저렴한 가격
    - 자동 윤활 기능
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 매우 낮고 파단 하중이 높아 정밀한 텐던 구동에 적합합니다 [S16].
  - question: 로봇 손 시험 중 계획 정지가 필요한 경우 가장 안전한 방법은 무엇입니까?
    choices:
    - 소프트웨어 강제 종료
    - 퓨즈를 강제로 제거
    - 3개 독립 전원 어댑터를 물리적으로 분리하고 멀티미터로 전압 확인
    - 액추에이터 전원선만 절단
    answer_index: 2
    explanation: 이 프로토타입은 전문적인 안전 시스템이 없으므로, 물리적 전원 분리와 전압 측정이 유일한 안전 확인 방법입니다.
  completion_criteria:
  - 텐던 텐셔닝 실습에서 마찰 측정 데이터를 성공적으로 취득하였는가?
  - 설계 과제에서 요구되는 CAD 도면과 보고서를 모두 제출하였는가?
  - 모든 안전 수칙을 준수하고 실습 과정에서 사고가 없었는가?
  source_ids:
  - S9
  - S10
  - S16
  - S11
- id: m3
  slug: cad-modeling
  phase_id: p1
  title: 로봇 손 CAD 모델링
  estimated_hours: 10.0
  prerequisites:
  - m2
  objectives:
  - 로봇 손의 기구학적 설계 요구사항을 이해하고 CAD 도구를 활용하여 모델링한다.
  - FDM 3D 프린팅을 위한 설계 가이드라인을 습득하고 출력물 강성을 최적화한다.
  - 부품 조립을 위한 나사산 인서트 체결 및 슬리브 베어링의 공차 설계를 실습한다.
  - 텐던 구동 메커니즘에서 캡스턴과 링크 간의 간섭을 검토한다.
  theory_markdown: '### CAD 기반 로봇 손 모델링 설계 원리


    로봇 손의 설계는 기능적 강성 확보와 출력 가능성(Printability) 사이의 균형이 필수적입니다. 탄소섬유 보강 폴리카보네이트(PC-CF)는
    높은 강성과 치수 안정성을 제공하지만, FDM 방식의 이방성(Anisotropy)을 고려해야 합니다 [S19].


    #### 1. 나사산 및 체결 설계

    직접적인 나사산 체결은 FDM 출력물의 적층 방향에 따라 전단 강도가 약하므로, M3 황동 열압입 인서트(HTBI-M3-BR) 사용이 권장됩니다
    [S21]. 이는 4.4 mm 외경을 가지며, 이를 위해 모델링 시 4.0 mm 파일럿 홀을 배치해야 합니다 [S21].


    #### 2. 회전축 공차 설계

    손목 및 관절부의 저마찰 회전을 위해 iglide J 슬리브 베어링(JSM-0810-10)을 사용합니다 [S17]. 해당 베어링은 8 mm
    내경의 샤프트를 지지하며, 하우징 보어는 10 mm 규격을 적용해야 합니다 [S17]. 실제 조립 시 하우징 보어와 샤프트 지름 사이의 공차는
    베어링의 압입 특성을 고려하여 설계해야 하며, 이는 조립 후 내경이 일시적으로 변형될 수 있음을 포함합니다 [S17].


    #### 3. 텐던 경로 설계

    Dyneema SK78 고강도 섬유 텐던(D-Pro 1.5mm)은 230 daN의 높은 파단 하중과 1% 미만의 작동 신율을 제공하여 정밀한
    구동이 가능합니다 [S16]. 캡스턴 설계 시 텐던의 반복적인 마찰에 의한 마모를 방지하기 위해 모든 굽힘 모서리는 충분한 라운딩(Rounding)
    처리가 되어야 합니다 [S16].'
  worked_examples:
  - '예제 1: 인서트 홀 배치 - 외경 4.4 mm 황동 인서트를 위해 4.0 mm 파일럿 홀을 모델링에 반영하십시오. 모델의 층 두께가 0.2
    mm일 때, 인서트가 조립될 면의 벽 두께는 최소 1.5 mm 이상 확보하여 조립 시의 열 팽창과 압력으로 인한 균열을 방지합니다.'
  - '예제 2: 베어링 하우징 설계 - 8 mm 알루미늄 샤프트(AWMP-08)와 JSM-0810-10 베어링 조립을 위해 하우징에 10.0 mm
    보어를 생성하십시오 [S17, S18]. 베어링 압입을 고려하여 0.05 mm의 간섭(Interference)을 적용한 보어 설계를 권장합니다.'
  lab:
    title: 로봇 손 부품 모델링 및 조립 간섭 검토
    steps:
    - CAD 도구를 사용하여 손가락 링크와 손바닥 프레임의 3D 모델을 생성합니다.
    - 황동 인서트 체결용 4.0 mm 파일럿 홀을 설계 도면에 배치합니다.
    - 슬리브 베어링(JSM-0810-10)이 장착될 하우징 보어를 10 mm 규격으로 모델링합니다.
    - 텐던 경로의 모든 모서리에 1 mm 이상의 R(곡률)값을 적용하여 라운딩 처리합니다.
    - 간섭 체크(Interference check) 기능을 사용하여 고정 나사(M3×10)와 내부 부품 간의 조립 오류를 점검합니다.
    safety:
    - 모든 설계 단계에서 전원 분리 상태를 유지합니다(벤치 프로토타입은 전원 인가 없이 CAD 단계부터 시작).
    - 실제 제작된 출력물을 다룰 때는 날카로운 모서리에 주의하고, 후가공 시 보안경을 착용합니다.
    - 이 과정은 교육용 프로토타입 제작을 위한 것이며, 사람 접근 환경의 안전 인증 시스템이 아님을 인지합니다.
    deliverables:
    - 설계된 손가락 링크 및 손바닥 프레임 CAD 파일 (STEP 또는 STL 형식)
    - 나사산 인서트 홀과 베어링 하우징의 치수가 포함된 2D 설계도면
    - 조립 간섭 체크 결과 보고서
  assignment:
    title: 로봇 손 구조 최적화 설계 과제
    deliverables:
    - 로봇 손 손가락 링크 CAD 모델 및 조립도
    - 인서트 및 베어링 배치 치수가 기입된 설계 요약 보고서
    rubric:
    - 황동 인서트 홀 규격(4.0 mm) 및 위치 적절성
    - 슬리브 베어링(10 mm 보어) 및 샤프트 공차 설계 정확도
    - 텐던 경로 모서리 라운딩 적용 여부
    - 3D 프린팅 가공성을 고려한 설계 적합성
  quiz:
  - question: M3 황동 열압입 인서트(외경 4.4 mm)를 조립하기 위해 모델링 시 확보해야 할 파일럿 홀의 지름은 얼마입니까?
    choices:
    - 4.4 mm
    - 4.0 mm
    - 3.0 mm
    - 5.0 mm
    answer_index: 1
    explanation: 데이터시트에 명시된 권장 구멍 지름은 4 mm입니다 [S21].
  - question: JSM-0810-10 슬리브 베어링의 외경을 수용하기 위해 하우징에 필요한 보어 지름은 무엇입니까?
    choices:
    - 8 mm
    - 10 mm
    - 12 mm
    - 9 mm
    answer_index: 1
    explanation: 해당 베어링의 외경은 10 mm이므로 하우징 보어는 이에 맞춰 설계해야 합니다 [S17].
  - question: Dyneema SK78 텐던을 사용할 때 모서리 처리가 중요한 이유는 무엇입니까?
    choices:
    - 텐던의 신율을 높이기 위해
    - 텐던의 마모를 방지하기 위해
    - 파단 하중을 낮추기 위해
    - 지름을 줄이기 위해
    answer_index: 1
    explanation: 텐던의 반복적인 마찰에 의한 마모를 방지하여 내구성을 확보해야 합니다 [S16].
  completion_criteria:
  - 모든 부품의 CAD 파일이 10 mm 보어 및 4.0 mm 파일럿 홀 치수를 준수하여 생성됨.
  - 간섭 체크 보고서에서 부품 간 조립 오류가 없음을 확인.
  - 텐던 경로의 모든 모서리가 라운딩 처리됨을 도면으로 증명함.
  source_ids:
  - S9
  - S19
  - S21
  - S17
  - S16
  - S18
- id: m4
  slug: printing-assembly
  phase_id: p2
  title: 3D 프린팅 및 조립
  estimated_hours: 10.0
  prerequisites:
  - m3
  objectives:
  - 3D 프린팅의 기술적 특성과 로봇 부품 제작 시 고려사항을 이해한다.
  - 탄소섬유 보강 PC 필라멘트의 재질 특성과 출력 설정(노즐 온도, 베드 온도)을 숙지한다.
  - 열압입 인서트(Threaded Inserts)를 활용한 반복 조립 구조를 설계하고 구현한다.
  - 로봇 손 프레임 및 링크 조립 시 정밀 공차 관리와 베어링 삽입 기법을 습득한다.
  theory_markdown: '## 3D 프린팅과 로봇 구조 제작


    로봇 손과 같은 정밀 메커니즘을 3D 프린팅으로 제작할 때는 강성, 치수 안정성, 반복 조립 가능성이 핵심입니다. 본 과정에서는 구조적 강도가
    높은 **탄소섬유 보강 PC(PC-CF) 필라멘트**를 사용합니다 [S19].


    ### 재질 특성 및 출력 가이드

    PC-CF 필라멘트는 열저항성과 인장 강도가 우수하여 로봇 링크와 같이 하중을 받는 부품에 적합합니다 [S19].

    - **노즐**: 탄소섬유는 마모성이 매우 강하므로 반드시 **경화강 노즐**을 사용해야 합니다. 황동 노즐은 즉시 손상됩니다 [S19].

    - **온도 설정**: 노즐 온도는 약 285°C, 히트베드 온도는 약 110°C를 유지하여 적절한 층간 접착력을 확보합니다 [S19].


    ### 반복 조립을 위한 설계 기법

    출력물에 직접 나사를 체결하면 재질 마모로 인해 반복 조립이 불가능해집니다. 이를 방지하기 위해 **열압입 인서트(Heat-set Insert)**를
    사용합니다 [S21].

    - **인서트 규격**: M3 황동 인서트(외경 4.4mm, 길이 5.8mm)를 사용하며, 출력 설계 시 **4.0mm 직경의 파일럿 홀**을
    미리 확보해야 합니다 [S21].

    - **조립**: 인서트를 가열하여 출력물 홀에 삽입하면 고강도의 암나사가 형성되어 M3 캡스크루와 안정적으로 결합됩니다 [S20, S21].


    ### 조립 정밀도 유지

    - **베어링 삽입**: 무급유 폴리머 베어링(JSM-0810-10)은 압입식(press-fit)으로 설계되었습니다 [S17]. 베어링 하우징
    보어는 베어링 외경(10mm)과 일치하도록 정밀하게 출력되어야 회전축(8mm 샤프트)의 유격을 최소화할 수 있습니다 [S17, B-SHAFT].'
  worked_examples:
  - '예시 1: 열압입 인서트 홀 설계. M3 인서트 모델 HTBI-M3-BR을 사용할 때, 출력물 설계 파일에 깊이 6mm 이상의 4mm 지름
    홀을 배치하여 인서트가 튀어나오지 않고 완벽히 매립되도록 한다 [S21].'
  - '예시 2: PC-CF 출력물의 적정 환경 확보. 대형 모델 출력 시 수축(Warpage) 방지를 위해 챔버가 없는 경우에도 베드 온도를 110°C로
    유지하고 노즐 온도 285°C를 준수하여 층간 결합력을 높인다 [S19].'
  lab:
    title: 로봇 손 모듈 조립 실습
    steps:
    - 경화강 노즐을 장착하고 Prusament PC-CF 필라멘트를 사용하여 손가락 링크와 손바닥 프레임을 출력한다 [S19].
    - 출력물 표면의 서포트를 제거하고, 인서트 홀 내부에 남은 잔여물을 다듬는다.
    - 인두기를 사용하여 M3 열압입 인서트를 지정된 홀에 수직으로 가열 삽입한다 [S21].
    - JSM-0810-10 슬리브 베어링을 관절 하우징에 압입한다 [S17].
    - 알루미늄 샤프트를 베어링 내경에 맞춰 절단 후 모따기하고 관절을 조립한다 [B-SHAFT].
    - M3 캡스크루를 사용하여 링크와 브래킷을 체결한다 [B-FASTENER].
    safety:
    - 노즐 온도(285°C)와 베드 온도(110°C)는 심각한 화상을 유발할 수 있으므로 절대 직접 만지지 않는다 [S19].
    - 납땜 인두를 이용한 인서트 작업 시 화상을 방지하기 위해 작업용 장갑과 보안경을 착용한다.
    - 탄소섬유 가루가 발생할 수 있는 후가공 작업 시 마스크와 보안경을 필히 착용한다.
    deliverables:
    - 조립 완료된 로봇 손 프레임
    - 베어링 유격 확인서(자체 체크리스트)
    - 열압입 인서트 삽입 정밀도 사진
  assignment:
    title: 3D 프린팅 구조물 강도 및 정밀도 보고서
    deliverables:
    - 조립된 링크의 마찰 저항 측정 데이터
    - PC-CF 출력물 조립 상태 확인 사진
    - 반복 조립 테스트 결과 보고서
    rubric:
    - PC-CF 재질 특성을 고려한 출력 설정(온도/노즐) 준수 여부(30%)
    - 열압입 인서트의 수직 삽입 정확도 및 고정력(40%)
    - 베어링과 샤프트 조립 시 유격 없는 매끄러운 동작 구현(30%)
  quiz:
  - question: PC-CF 필라멘트로 출력할 때 경화강 노즐을 사용해야 하는 주된 이유는 무엇인가?
    choices:
    - 열 전도율이 더 높기 때문에
    - 탄소섬유가 황동 노즐을 마모시키기 때문에
    - 더 높은 온도에서 출력이 가능하기 때문에
    - 층간 접착력이 강화되기 때문에
    answer_index: 1
    explanation: 탄소섬유는 매우 연마성이 강한 재료이므로 황동 노즐을 빠르게 마모시켜 출력 품질을 저하시킵니다 [S19].
  - question: M3 열압입 인서트(외경 4.4mm) 사용 시 적절한 출력물 파일럿 홀 지름은?
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.8mm
    answer_index: 1
    explanation: 공식 데이터시트에 따라 인서트 삽입을 위한 권장 구멍 지름은 4mm입니다 [S21].
  - question: JSM-0810-10 베어링 조립 방식에 대한 설명으로 옳은 것은?
    choices:
    - 접착제로 고정한다.
    - 헐거운 끼워맞춤(Clearance fit)으로 출력한다.
    - 압입식(Press-fit)으로 하우징 보어에 고정한다.
    - 나사로 조여서 고정한다.
    answer_index: 2
    explanation: iglide J 베어링은 압입식(press-fit) 베어링으로, 적절한 공차의 하우징 보어에 압입하여 내경을 조정합니다
      [S17].
  completion_criteria:
  - 모든 부품이 BOM 사양에 따라 정확히 3D 프린팅되었음.
  - 관절축이 유격 없이 베어링과 원활하게 조립되었음.
  - 열압입 인서트가 출력물과 수평을 이루며 단단히 고정되었음.
  - 안전 수칙을 준수하여 조립을 완료하고 검증 보고서를 제출함.
  source_ids:
  - S19
  - S21
  - S20
  - S17
- id: m5
  slug: actuator-integration
  phase_id: p2
  title: 액추에이터 및 트랜스미션 통합
  estimated_hours: 10.0
  prerequisites:
  - m4
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 물리적 통합 및 고정 원리를 이해한다.
  - 텐던 기반 구동 시스템에서 Dyneema 라인의 장력 전달 매커니즘을 학습한다.
  - 시스템 전원 분기 구성과 물리적 절연 및 과전류 보호 원리를 습득한다.
  - OpenCR 제어기와 액추에이터 간 직접 연결 배선 및 신호 무결성을 확인한다.
  theory_markdown: '### 액추에이터 통합의 핵심 원리

    로봇 손의 정교한 움직임은 스마트 액추에이터(XM430-W350-T)가 제공하는 고정밀 위치 및 전류 피드백에 의존합니다 [S11]. 각 액추에이터는
    12 V 전원과 DYNAMIXEL Protocol 2.0을 통한 통신을 필요로 하며, 4.1 N·m의 스톨 토크를 활용하여 텐던을 당깁니다
    [S11].


    ### 텐던 메커니즘과 Dyneema

    Dyneema SK78 섬유는 1.5 mm 지름에서 230 daN의 높은 파단 하중을 견디며, 작동 신율이 1 % 미만으로 매우 낮아 구동
    응답성이 우수합니다 [S16]. 이 텐던은 손가락 관절의 마찰을 줄이기 위해 igus JSM-0810-10 슬리브 베어링과 함께 조립되며,
    반복적인 굽힘 시험을 거쳐야 합니다 [S17, S18].


    ### 전원 분기 및 안전 절연

    본 시스템은 3개의 독립적인 GST160A12-R7B 12 V 어댑터를 사용하여 전체 액추에이터 부하를 분산합니다 [S15]. 각 어댑터는
    10 A ATOF 퓨즈를 포함하는 독립 분기로 구성되며, 이는 배선 고장 시 과전류로부터 시스템을 보호합니다 [S15, S23, S24].
    **중요:** 각 전원 어댑터의 양(+) 출력은 병렬 연결이 절대 금지되며, 각 액추에이터 그룹별로 독립적으로 할당되어야 합니다 [S15].


    ### 데이터 수집 및 센서 통합

    손끝 힘 감지(FSR 402)는 10 kΩ 저항을 활용한 분압 회로를 통해 OpenCR 보드의 ADC 포트로 전달됩니다 [S12, S25].
    이때 3.3 V 센서 전원 레일만을 사용하여 신호 범위를 0~3.3 V로 제한해야 ADC를 안전하게 보호할 수 있습니다 [S13].'
  worked_examples:
  - '액추에이터 전원 분기 설계: 총 11개의 XM430-W350-T 액추에이터(스톨 전류 합계 25.3 A)를 3개의 11.5 A 어댑터에 4/4/3대씩
    배분합니다. 어댑터 1당 최대 4대 액추에이터 소비 피크는 9.2 A이며, 이는 10 A 퓨즈 정격과 11.5 A 공급 용량 범위 내에 안전하게
    배치됩니다 [S11, S15, S24].'
  - 'FSR 전압 분압 계산: FSR 센서가 압력을 받아 저항이 1 kΩ이 되었을 때, 10 kΩ 분압 저항과 함께 3.3 V 입력 전원을 사용하면
    OpenCR ADC로 입력되는 전압은 Vout = 3.3 * (10 / (1 + 10)) = 약 3 V입니다. 이는 3.3 V 범위를 초과하지
    않아 안전하게 신호 취득이 가능합니다 [S12, S13, S25].'
  lab:
    title: 액추에이터 통합 및 배선 실습
    steps:
    - 각 12 V 전원 어댑터 출력선에 0AFH0001Z 인라인 퓨즈 홀더와 10 A ATOF 퓨즈를 납땜하여 퓨즈 분기를 구성합니다 [S23,
      S24].
    - 액추에이터 4대/4대/3대 단위로 전원 하네스를 Micro-Fit 3.0 커넥터로 제작합니다 [S14].
    - 각 분기별 어댑터 출력을 물리적으로 분리한 상태에서 커넥터를 결합합니다.
    - OpenCR 보드에 액추에이터 통신선을 연결하고, 3.3 V 센서 레일에서 FSR 분압 회로를 구성합니다 [S13].
    - 전원 인가 전, 각 3개의 독립 전원 어댑터 출력단이 12 V DC인지 멀티미터로 개별 측정합니다.
    safety:
    - 모든 작업은 전원 어댑터가 AC 콘센트에서 분리된 상태에서 진행합니다.
    - 각 분기 어댑터 양(+) 출력 간의 절대적 절연을 확인하고 병렬 연결하지 않습니다 [S15].
    - 절단 작업 시 반드시 충격 방지 보안경을 착용합니다.
    - 실험 중 정지는 3개 어댑터를 물리적으로 분리한 후 1 V 미만 DC 확인 후에만 수행합니다.
    - 전원이 인가된 상태에서 로봇 손 관절 범위에 손을 넣지 않습니다.
    deliverables:
    - 분기별 전원 결선 사진 및 전압 측정 기록지
    - FSR 센서 ADC 값 출력 확인 로그
    - 독립 전원 분기 확인을 포함한 배선도
  assignment:
    title: 액추에이터 시스템 통합 분석
    deliverables:
    - 전력 분기 배선 설계 도면
    - 텐던 장력 전달 분석서
    - 과전류 보호 논리 기술서
    rubric:
    - 전원 분기 4/4/3대 할당 및 독립 퓨즈 구성 준수 여부
    - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
    - Dyneema 텐던 규격 및 조립 재현성 확보 노력
    - 독립 전원 절연 준수 및 병렬 금지 원칙 준수 여부
  quiz:
  - question: 본 시스템에서 액추에이터 전원 분기를 구성할 때 올바른 방법은?
    choices:
    - 3개 어댑터의 모든 양(+) 출력을 하나의 버스로 묶어 공급한다.
    - 각 어댑터를 4대/4대/3대의 액추에이터 그룹에 독립적으로 연결한다.
    - 어댑터 1개를 전체 액추에이터에 사용하고 나머지는 예비로 둔다.
    - 전원 어댑터 출력 사이에 다이오드를 배치하여 서로 연결한다.
    answer_index: 1
    explanation: 각 액추에이터 그룹은 독립적으로 퓨즈가 분기된 전원 어댑터에 연결되어야 하며, 출력을 결합하거나 병렬로 연결하는 것은
      절대 금지됩니다 [S15].
  - question: OpenCR 보드에 FSR 센서를 연결할 때 지켜야 할 사항은?
    choices:
    - 12 V 액추에이터 전원을 사용하여 ADC 전압을 확보한다.
    - FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다.
    - 3.3 V 센서 레일만을 사용하여 ADC 신호가 3.3 V를 초과하지 않게 한다.
    - 별도의 브리지를 추가하여 전압을 24 V로 승압한다.
    answer_index: 2
    explanation: OpenCR의 ADC 보호를 위해 3.3 V 센서 전원 레일을 사용하고 입력 신호가 0~3.3 V 범위를 넘지 않도록
      해야 합니다 [S13].
  - question: Dyneema 텐던 사용 시 적절한 태도는?
    choices:
    - 지름과 파단 하중이 명시된 추적 가능한 제품을 사용한다.
    - 어떤 나일론 끈이든 굵기만 맞으면 사용 가능하다.
    - 반복 굽힘 시험은 시간이 부족하므로 생략한다.
    - 작동 신율이 10 % 이상인 탄성 끈을 사용하여 장력을 자동 조절한다.
    answer_index: 0
    explanation: 구동 응답성과 안전을 위해 실지름, 파단 하중, 신율이 명시된 규격 제품을 사용하고 반복 굽힘 시험을 거쳐야 합니다
      [S16].
  completion_criteria:
  - 각 전원 어댑터 분기가 액추에이터 그룹별로 독립적으로 배선되었음을 멀티미터로 검증
  - 모든 전원 분기 어댑터 출력에서 1 V 미만 무전원 상태를 계측 확인
  - FSR 센서와 ADC 간 분압 회로가 3.3 V 레일에서 올바르게 동작함 확인
  - 모든 배선과 조립이 규격 부품(Micro-Fit, ATOF 퓨즈 등)을 사용하여 문서대로 완료됨
