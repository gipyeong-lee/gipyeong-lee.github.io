modules:
- id: m1
  slug: intro-robotics
  phase_id: phase-1
  title: 로봇 공학 입문
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 공학의 정의와 매니퓰레이터 시스템의 핵심 구성 요소를 이해한다.
  - 다이나믹셀 스마트 액추에이터의 피드백 제어 원리를 파악한다.
  - 로봇 시스템의 안전한 전원 설계 및 독립 분기 구조의 중요성을 학습한다.
  - 힘 감지 센서(FSR)를 이용한 파지력 측정 인터페이스의 기본 원리를 이해한다.
  theory_markdown: '### 로봇 공학 및 매니퓰레이터 기초

    로봇 공학은 기계, 전자, 제어 이론의 융합 학문으로, 매니퓰레이터(Manipulator) 시스템은 인간의 팔과 손의 기능을 모사하여 외부
    환경과 상호작용하는 시스템을 의미합니다 [S1]. 본 프로젝트에서는 **DYNAMIXEL XM430-W350-T** 스마트 액추에이터를 핵심
    구동기로 사용합니다 [S9]. 이 액추에이터는 위치, 속도, 전류 피드백을 실시간으로 통합하여 정밀한 제어를 가능하게 합니다 [S9].


    ### 시스템 전원 설계의 안전성

    본 시스템은 12V 전원 분기 구조를 채택합니다. MEAN WELL **GST160A12-R7B** 전원 어댑터는 11.5A 정격 전류를 제공하며,
    각 분기는 독립적인 10A ATOF 퓨즈로 보호됩니다 [S13, S23]. 다수의 전원 어댑터 사용 시, 각 양(+) 단자는 전기적으로 절연되어야
    하며, 절대 병렬로 연결해서는 안 됩니다. 이는 과전류 및 전원 장치 간의 전위차로 인한 사고를 방지하기 위함입니다.


    ### 데이터 취득 및 인터페이스

    손끝의 접촉력은 **FSR 402** 박막형 센서를 통해 측정됩니다 [S10]. 이는 인가되는 힘에 따라 저항값이 감소하는 압전 저항(Piezoresistive)
    특성을 활용합니다 [S10]. OpenCR 컨트롤러의 ADC(12bit)를 통해 정확한 데이터를 취득하기 위해, 3.3V 센서 전원 레일과
    10kΩ 분압 저항을 이용한 전압 분압 회로를 구성해야 합니다 [S11, S24].'
  worked_examples:
  - '시스템 전원 용량 계산: XM430-W350-T 액추에이터는 스톨 전류가 2.3A입니다 [S9]. 총 11대의 액추에이터를 4대/4대/3대로
    3개 분기에 할당합니다. 가장 많은 부하가 실리는 분기는 4대이므로 피크 전류는 4 × 2.3A = 9.2A입니다. 이는 분기별 10A 퓨즈와
    11.5A 전원 공급 장치의 사양 내에 안전하게 포함됩니다 [S13, S23].'
  - 'FSR 전압 분압기 계산: FSR 센서와 10kΩ 고정 저항을 직렬 연결하여 3.3V 전원에 연결할 경우, 센서의 저항이 무한대(접촉 없음)일
    때 ADC 입력은 0V이며, 센서 저항이 0Ω(최대 힘)에 가까워질 때 ADC 입력은 3.3V에 근접합니다. 이는 OpenCR ADC 사양을
    만족합니다 [S10, S11, S24].'
  lab:
    title: 기초 전원 구성 및 센서 인터페이스 실습
    steps:
    - 각 MEAN WELL GST160A12-R7B 전원 어댑터의 독립 분기 구성을 확인하고, 멀티미터 DC 모드를 통해 12V 출력을 개별
      확인한다.
    - 각 분기마다 10A ATOF 퓨즈를 삽입하여 과전류 보호 회로를 구축한다.
    - FSR 402 센서의 양단을 OpenCR의 3.3V 센서 전원 레일과 ADC 입력 핀에 10kΩ 저항과 함께 분압 회로 형태로 연결한다.
    - 전원을 차단한 상태에서 각 퓨즈 분기의 연결 상태를 DC 전압 모드로 확인하여 전원이 완전히 제거되었는지 확인한다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고, 멀티미터를 사용하여 모든 분기에서 1V 미만의 전압을 확인한다.
    - 절대로 독립된 3개 전원 공급 장치의 양(+) 출력을 합치지 않는다.
    - 충격 방지 작업용 보안경을 반드시 착용한다.
    - 비상시 전원 차단은 모든 전원 어댑터의 콘센트를 물리적으로 분리한다.
    deliverables:
    - 분기별 전압 측정 데이터 기록지
    - 전압 분압 회로 배선도
    - 센서 입력값 변화 확인 로그
  assignment:
    title: 로봇 시스템 설계 요구사항 정의
    deliverables:
    - 시스템 전원 분기 배선도
    - 센서-컨트롤러 연결 회로도
    - 부품별 안전 동작 사양서(정격 전류/전압 기준)
    rubric:
    - 독립 분기 전원 구성의 원리가 정확히 설명되었는가?
    - FSR 전압 분압기 회로가 OpenCR 사양(3.3V) 내에서 설계되었는가?
    - 전원 안전 수칙 및 절차가 명확히 포함되었는가?
  quiz:
  - question: 시스템 전원 설계 시 3개의 독립형 어댑터 양(+) 출력은 어떻게 처리해야 하는가?
    choices:
    - 전류 합산을 위해 모두 병렬로 연결한다.
    - 각 분기는 전기적으로 완전히 절연된 상태를 유지해야 한다.
    - 전압 안정화를 위해 2개씩만 묶어서 사용한다.
    - 접지 단자만 공통으로 연결하면 된다.
    answer_index: 1
    explanation: 본 시스템에서는 전원 공급 장치 간의 전위차와 과전류 사고를 방지하기 위해 모든 12V 전원 분기는 독립적으로 운영해야
      합니다.
  - question: OpenCR의 ADC를 통해 FSR 402 센서 신호를 취득할 때 권장되는 전원은 무엇인가?
    choices:
    - 12V 액추에이터 전원
    - 별도의 외부 5V 공급기
    - OpenCR의 3.3V 센서 전원 레일
    - 배터리 직접 연결
    answer_index: 2
    explanation: 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의
      별도 검토가 필요하다.
  completion_criteria:
  - 각 분기별 독립 전원 구성의 올바른 배선도 제출
  - FSR 센서의 동작 원리와 회로 설계의 이해도 확인
  - 안전 사고 방지 프로토콜(계획 정지 및 전원 분리 절차) 준수 실습 완료
  source_ids:
  - S1
  - S6
  - S9
  - S13
  - S23
  - S10
  - S11
  - S24
- id: m2
  slug: kinematics
  phase_id: phase-1
  title: 로봇 기구학 및 텐던 모델링
  estimated_hours: 10.0
  prerequisites:
  - m1
  objectives:
  - 로봇 손가락의 자유도와 관절 기구학을 이해한다.
  - 텐던 구동 방식의 동역학적 특성을 파악한다.
  - 액추에이터의 토크와 텐던 장력 간의 관계를 수식화한다.
  - 정밀 제어를 위한 텐던 시스템 모델링 역량을 확보한다.
  theory_markdown: '## 1. 로봇 기구학 기초

    로봇 손가락은 인체의 손가락 구조를 모방하여 다수의 관절로 구성된다. 기구학 모델링은 관절 각도($\theta$)와 손끝 위치($x$)의 관계를
    정의한다. 5지 로봇 손 프로젝트에서 각 손가락은 일반적으로 2개의 자유도를 가지며, 텐던을 통해 구동된다 [S7]. 관절은 회전 중심을 기준으로
    기하학적 제약 조건을 가진다.


    ## 2. 텐던 구동 동역학

    텐던 구동 방식은 모터의 회전 운동을 장력으로 변환하여 멀리 떨어진 관절을 구동한다. 모터의 회전 토크($\tau$)와 텐던 장력($T$)의
    관계는 캡스턴 반지름($r$)에 의해 결정된다:

    $$\tau = T \cdot r$$

    텐던은 고강도 섬유인 Dyneema SK78을 사용하여 신율을 1% 미만으로 제한해야 한다 [S14]. 높은 장력 하에서도 유연성을 유지하기
    위해 캡스턴의 마찰 최소화와 라운딩 처리가 필수적이다.


    ## 3. 정밀 제어 모델링

    정밀한 파지를 위해 손끝의 힘($F_{tip}$)을 센싱하고 피드백 루프를 구성한다. FSR(Force Sensing Resistor) 센서는
    0.2 N에서 20 N 범위의 힘을 측정할 수 있다 [S10]. 센서 저항 값($R_{FSR}$)은 가해지는 힘에 반비례하며, 10 kΩ 고정
    저항과의 분압 회로를 통해 OpenCR 제어기에서 전압($V_{out}$)으로 변환된다 [S11, S24].

    $$V_{out} = V_{ref} \cdot \frac{R_{fixed}}{R_{fixed} + R_{FSR}}$$

    이 시스템은 3.3 V 센서 전원을 사용하여 안전하고 정확한 ADC 범위를 확보한다 [S11].'
  worked_examples:
  - '예제 1: 텐던 장력 계산. 모터가 0.5 N·m의 토크를 발생시키고 캡스턴 반지름이 0.01 m라면, 텐던에 걸리는 장력은 $T = 0.5
    / 0.01 = 50 N$이다.'
  - '예제 2: 전압 분압 계산. 센서 전원 3.3 V, 10 kΩ 고정 저항, FSR의 힘 인가 시 저항이 10 kΩ일 때, OpenCR ADC가
    읽는 전압은 $V_{out} = 3.3 \cdot (10k / (10k + 10k)) = 1.65 V$이다.'
  lab:
    title: 텐던 구동 효율 및 힘 센서 특성 분석
    steps:
    - OpenCR 제어기에서 3.3 V 센서 레일 전압을 멀티미터로 측정하여 검증한다.
    - FSR 402 센서와 10 kΩ 저항으로 분압 회로를 브레드보드에 구성한다.
    - 다양한 무게의 분동을 FSR에 올려 ADC 값을 기록하고, 힘-전압 특성 곡선을 도출한다.
    - DYNAMIXEL 액추에이터를 무부하 상태에서 회전시켜 텐던 장력 전달 구조를 관찰한다.
    safety:
    - 전원 인가 전 모든 배선 결합 상태를 멀티미터(저항 모드)로 확인한다.
    - 모든 정지 및 측정은 3개 독립 절연 전원 어댑터를 물리적으로 분리한 후 수행한다 [S13].
    - 전원 공급 분기별 전압이 12 V임을 확인하고, 1 V 미만 상태에서 접근한다.
    - 회전 중인 모터 및 텐던 장력 시험 시 충격 방지 보안경을 착용한다.
    deliverables:
    - FSR 힘-ADC 전압 특성 곡선
    - 실습 과정 및 데이터 측정 기록
    - 텐던 장력 계산 모델링 리포트
  assignment:
    title: 로봇 손가락의 기구학 모델링 설계
    deliverables:
    - 손가락 2-DOF 기구학 모델 도면
    - 액추에이터 토크와 손끝 힘의 상관관계 모델링
    - 텐던 구동 시 발생할 수 있는 손실 요인 분석 리포트
    rubric:
    - 기구학적 위치 결정 정밀도 평가
    - 텐던 장력 모델링의 수식 타당성
    - 안전 전압 규정 준수 및 회로 설계의 정확성
  quiz:
  - question: 텐던 구동 방식에서 텐던의 작동 신율은 몇 % 미만이어야 하는가?
    choices:
    - 0.1%
    - 1%
    - 5%
    - 10%
    answer_index: 1
    explanation: Dyneema SK78 텐던은 작동 신율 1% 미만을 요구한다 [S14].
  - question: FSR 힘 센서 분압 회로에 권장되는 센서 전압은 얼마인가?
    choices:
    - 3.3 V
    - 5 V
    - 12 V
    - 24 V
    answer_index: 0
    explanation: OpenCR의 센서 안정성과 ADC 범위를 위해 3.3 V 센서 레일을 사용해야 한다 [S11].
  - question: DYNAMIXEL 액추에이터 전원 분기를 위해 권장되는 물리적 조치는 무엇인가?
    choices:
    - 모든 전원의 양(+) 단자 결합
    - 독립 분기 합산 정격 확인 및 퓨즈 보호
    - 저항 측정으로 전원 차단 확인
    - 전원 분리 없이 통신선 탈거
    answer_index: 1
    explanation: 각 어댑터 출력은 독립적으로 유지하고 독립 퓨즈를 장착하여 보호해야 한다 [S13].
  completion_criteria:
  - 텐던 동역학 계산 모델 수립 및 검증
  - FSR 힘 센서 ADC 데이터 취득 및 특성 곡선 도출
  - 전원 안전 규정(분리 및 전압 측정 확인)을 완벽히 준수
  source_ids:
  - S7
  - S8
  - S14
  - S10
  - S11
  - S24
  - S13
- id: m3
  slug: design-cad
  phase_id: phase-1
  title: 3D 설계 및 부품 선정
  estimated_hours: 10.0
  prerequisites:
  - m2
  objectives:
  - 로봇손 설계를 위한 기계적 강성과 치수 안정성의 중요성을 이해한다.
  - FDM 3D 프린팅 공정에서 탄소섬유 충진 필라멘트(PC-CF)의 특성을 파악한다.
  - 열압입 인서트(Heat-set insert)의 체결 원리와 공차 설계를 배운다.
  - 정밀 회전축을 위한 무급유 베어링과 알루미늄 샤프트의 조립 요구사항을 습득한다.
  theory_markdown: '### 3D 설계와 재료의 역학적 이해


    정교한 5지 로봇손을 제작하기 위해서는 강성(Stiffness)과 경량화의 균형이 필수적입니다. 본 설계에서는 고강도 엔지니어링 필라멘트인
    `Prusament PC Blend Carbon Fiber`를 사용하여 구조를 제작합니다. 이는 일반 PC 소재보다 인장 강도가 우수하며 탄소섬유
    충진으로 인해 출력 시 치수 안정성이 높습니다 [S17].


    #### 조립 공차 및 체결 요소

    1. **열압입 인서트(Heat-set Insert):** 반복적인 분해·조립이 필요한 프레임 결합부에는 황동 인서트를 사용합니다. 나사 체결력의
    재현성을 높이기 위해 M3 인서트 외경(4.4mm)에 맞춘 4.0mm 파일럿 홀 설계가 필수적입니다 [S19].

    2. **회전축 설계:** `JSM-0810-10` 슬리브 베어링은 무급유 운전이 가능하며 오염에 강합니다 [S15]. 베어링 내경 8mm에
    대응하는 `AWMP-08` 정밀 알루미늄 샤프트를 사용하여 회전 유격을 최소화해야 합니다 [S15, S16].


    #### 기구적 구동 원리

    손가락 관절은 텐던 구동 방식을 채택합니다. `Dyneema SK78` 섬유는 지름 1.5mm로 파단 하중 230daN을 견디며, 작동 신율이
    1% 미만으로 정밀한 위치 제어에 적합합니다 [S14]. 캡스턴 설계 시 모서리를 라운딩 처리하여 텐던의 반복 피로 파손을 방지해야 합니다
    [S14].'
  worked_examples:
  - '**예제 1: 베어링 끼움 맞춤 계산**

    질문: `JSM-0810-10` 베어링을 10mm 구멍에 압입할 때, 외경 공차를 고려한 설계 방법은?

    풀이: 슬리브 베어링은 압입 후 내경이 수축하므로, 조립 전 하우징 내경 보어를 공차(H7 등)에 맞춰 설계해야 합니다. 베어링 외경(d2)
    10mm에 대해 하우징 보어를 10.00mm ~ 10.05mm로 확보하여 압입 후 원활한 축 회전을 보장합니다 [S15].'
  - '**예제 2: 텐던 장력 전달 계산**

    질문: 텐던으로 인한 인장력 100N 작용 시 파단 위험성은?

    풀이: `Dyneema SK78`의 파단 하중은 230daN(약 2300N)입니다 [S14]. 안전율을 고려해도 100N은 파단 하중의 5%
    미만이므로 안정적입니다. 단, 텐던 통로의 마찰력 계산 시 안전율을 높게 잡아야 합니다.'
  lab:
    title: 3D 출력물 조립 및 베어링 장착 실습
    steps:
    - PC-CF 필라멘트를 경화강 노즐이 장착된 3D 프린터에 로드하고 구조물을 출력합니다 [S17].
    - 열압입 인서트 삽입기를 이용하여 4mm 홀에 `HTBI-M3-BR` 인서트를 수직으로 안착시킵니다 [S19].
    - '`JSM-0810-10` 베어링을 프레임 보어에 압입하고, 8mm 알루미늄 샤프트가 유격 없이 회전하는지 확인합니다 [S15, S16].'
    - M3 캡스크루를 사용하여 조립부의 체결력을 테스트합니다 [S18].
    safety:
    - 경화강 노즐 가열 온도(285°C)와 베드 온도(110°C)에 의한 화상 주의
    - 인서트 열압입 시 황동 부품 고온 주의 및 보안경 착용
    - 정밀 조립 도구 사용 시 손가락 끼임 방지
    deliverables:
    - 완성된 손가락 링크 CAD 데이터 및 실물 조립체
    - 베어링 회전 유격 측정 기록지
  assignment:
    title: 로봇손 기구 설계 및 강성 분석 보고서
    deliverables:
    - 링크 조립도(배선/텐던 경로 포함)
    - 부품별 BOM(수량 및 사양 포함)
    - 기구부 구조 해석 결과물
    rubric:
    - BOM이 시스템 truth 사양과 일치하는가?
    - 베어링과 샤프트의 공차 설계가 기술 자료에 근거하는가?
    - 텐던 경로 설계 시 굴곡 반경을 충분히 확보했는가?
  quiz:
  - question: PC-CF 필라멘트 출력 시 반드시 갖추어야 할 노즐 사양은?
    choices:
    - 일반 황동 노즐
    - 경화강 노즐
    - 루비 노즐
    - 테플론 코팅 노즐
    answer_index: 1
    explanation: PC-CF에 함유된 탄소섬유는 매우 연마성이 강하여 일반 황동 노즐을 빠르게 손상시키므로 경화강 노즐이 필수입니다 [S17].
  - question: Dyneema SK78 텐던의 주요 특징으로 옳은 것은?
    choices:
    - 높은 신율로 인한 충격 흡수
    - 1% 미만의 낮은 작동 신율
    - 전기 전도성
    - 금속보다 무거운 무게
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 매우 낮아 정밀한 위치 제어용 텐던으로 적합합니다 [S14].
  - question: 무급유 슬리브 베어링(JSM-0810-10)의 올바른 조립 방법은?
    choices:
    - 구리스를 충분히 도포한 후 조립
    - 하우징 보어에 압입하여 내경 공차를 확보
    - 망치로 강하게 타격하여 삽입
    - 접착제로 완전히 고정
    answer_index: 1
    explanation: 해당 베어링은 무급유 사양이며, 하우징에 압입한 후 고유의 내경 공차를 가지도록 설계되었습니다 [S15].
  completion_criteria:
  - PC-CF 출력물을 사용하여 구조물 조립 완료
  - 모든 회전 관절이 유격 없이 작동함을 검증
  - 조립 완료된 파트의 부품 번호와 사양이 BOM truth와 일치함 확인
  source_ids:
  - S17
  - S19
  - S15
  - S16
  - S14
  - S18
- id: m4
  slug: actuator-integration
  phase_id: phase-2
  title: 구동기 및 구조물 통합
  estimated_hours: 15.0
  prerequisites:
  - m3
  objectives:
  - DYNAMIXEL XM430-W350 스마트 액추에이터의 사양과 통신 특성을 이해한다.
  - 로봇 시스템의 전원 분기 및 보호 회로(퓨즈) 설계 원리를 학습한다.
  - FSR 센서와 분압 회로를 이용한 힘 피드백 시스템의 하드웨어 통합 방법을 습득한다.
  - 구조용 부품(PC-CF) 제작과 베어링/샤프트 체결 공차를 고려한 조립 정밀도를 확인한다.
  theory_markdown: '## 구동기 통합 및 전원 분기 이론


    ### 1. DYNAMIXEL 스마트 액추에이터

    5지 로봇손의 각 관절은 `XM430-W350` 액추에이터로 구동된다. 이 모델은 12 V 전압에서 동작하며 스톨 토크 4.1 N·m, 스톨
    전류 2.3 A를 가진다 [S9]. 시스템에 사용되는 총 11개의 액추에이터가 동시에 스톨 상태가 될 경우 피크 전류 합계는 25.3 A에
    달한다. 따라서 전원 공급 시스템은 이 부하를 감당하도록 설계되어야 한다.


    ### 2. 독립 전원 분기 및 보호

    총 3개의 `GST160A12-R7B` 전원 어댑터(개별 11.5 A 출력)를 사용하여 시스템을 4대/4대/3대 단위의 독립 분기로 나눈다
    [S13]. 각 분기에는 10 A `ATOF` 퓨즈를 장착하여 과전류 발생 시 물리적 고장을 방지한다 [S22, S23].

    * **주의:** 각 전원 어댑터의 양(+) 출력은 서로 연결하거나 합치지 않는다. 각 분기는 독립적으로 운영되어야 한다 [S13].


    ### 3. 센서 통합

    `FSR 402` 센서는 힘에 따라 저항이 감소하는 압력 센서로 [S10], `OpenCR`의 3.3 V 센서 전원을 사용하여 10 kΩ 저항과
    전압 분압 회로를 구성한다 [S11, S24]. ADC는 이를 0~3.3 V 신호로 취득한다 [S11].'
  worked_examples:
  - '**분기 전류 용량 검증:** 4대 액추에이터 분기의 최대 피크 전류는 4 * 2.3 A = 9.2 A이다. 이는 사용된 10 A 퓨즈의
    정격(9.2 A < 10 A < 11.5 A) 내에 있으므로 안전하다 [S9, S13, S23].'
  - '**전압 분압기 설계:** FSR의 저항이 무한대일 때 ADC 입력은 3.3 V * (10k / (무한대 + 10k)) = 0 V, FSR
    저항이 0 Ω일 때 3.3 V * (10k / 10k) = 3.3 V가 된다. 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며,
    사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다 [S11, S24].'
  lab:
    title: 액추에이터 및 전원 분기 조립 실습
    steps:
    - 각 분기별 액추에이터 배분(4/4/3)에 맞춰 전원 하네스를 제작하고 마킹한다.
    - 각 독립 분기의 양(+) 배선에 `ATO` 퓨즈 홀더와 10 A 퓨즈를 직렬로 연결한다 [S22, S23].
    - 전원 인가 전, 각 독립 분기의 단자에서 DC 전압 12 V를 멀티미터로 개별 측정한다.
    - OpenCR의 3.3 V 센서 레일과 FSR 분압 회로를 연결하고 ADC 값을 모니터링한다 [S11].
    safety:
    - 실습 중에는 보안경을 반드시 착용한다.
    - 계획 정지 시 3개의 전원 어댑터를 벽면 콘센트에서 물리적으로 분리한다.
    - '무전원 상태 확인: 멀티미터 DC 전압 모드로 각 분기 전압이 1 V 미만인지 확인 후 접근한다.'
    - 전원 인가 중에는 손을 가동 범위에 넣지 않으며, 고정 지그에서 무부하부터 가동 시험한다.
    deliverables:
    - 분기별 전압 측정 데이터 및 퓨즈 연결 배선도
    - FSR 센서 ADC 출력값 정렬 테스트 결과 보고서
  assignment:
    title: 시스템 설계 최적화 보고서
    deliverables:
    - 설계된 전원 배선도 (독립 분기 표기)
    - 관절별 액추에이터 사양 요약 표
    rubric:
    - 전원 어댑터 독립 분기 원칙 준수 여부
    - 총 피크 전류 및 퓨즈 용량 계산의 정확성
    - OpenCR 센서 전압 분압 회로 구성의 타당성
  quiz:
  - question: 로봇손 시스템에서 사용되는 11개 액추에이터의 총 피크 전류는 얼마입니까?
    choices:
    - 20.3 A
    - 25.3 A
    - 34.5 A
    - 138 A
    answer_index: 1
    explanation: XM430-W350의 스톨 전류는 2.3 A이며, 11대 사용 시 11 * 2.3 A = 25.3 A입니다 [S9].
  - question: 독립된 12 V 전원 어댑터 출력들의 연결 규칙으로 옳은 것은?
    choices:
    - 양(+) 단자를 모두 연결하여 대용량 전원을 만든다.
    - 양(+) 단자 간 전압을 24 V로 높인다.
    - 양(+) 단자들을 절대 연결하지 않고 독립적으로 분리한다.
    - 음(-) 단자를 모두 연결하고 양(+) 단자도 병렬로 연결한다.
    answer_index: 2
    explanation: 각 어댑터 출력은 독립 분기로 유지해야 하며, 양(+) 출력의 결합은 금지됩니다 [S13].
  - question: FSR 센서 전압 분압 회로에서 OpenCR이 제공해야 하는 적절한 전압 레일은?
    choices:
    - 12 V
    - 5 V
    - 3.3 V
    - 24 V
    answer_index: 2
    explanation: OpenCR의 센서 전원은 3.3 V이며, ADC 신호의 안전 범위를 위해 반드시 이 레일을 사용해야 합니다 [S11].
  completion_criteria:
  - 각 분기별 물리적 전원 분리 상태 확인 완료
  - 독립 분기 전압 12 V 출력 측정 및 정상 확인
  - FSR ADC 데이터의 실시간 변화 관측 성공
  source_ids:
  - S9
  - S13
  - S22
  - S23
  - S10
  - S11
  - S24
- id: m5
  slug: transmission
  phase_id: phase-2
  title: 텐던 기반 전송 시스템 구축
  estimated_hours: 10.0
  prerequisites:
  - m4
  objectives:
  - 텐던 기반 전송 시스템의 구동 원리 및 기계적 이득 이해
  - Dyneema SK78 고강도 섬유의 물리적 특성 및 텐던 체결 기술 습득
  - 액추에이터 장력 전달 과정의 마찰 손실 관리 및 베어링 활용법 숙지
  - 텐던 시스템의 초기 장력 설정 및 반복 신율 관리 기법 학습
  theory_markdown: '## 텐던 기반 전송 시스템 (Tendon-driven Transmission System)


    로봇손의 유연성과 정밀한 제어를 위해 텐던(Tendon) 시스템은 액추에이터의 회전 운동을 관절의 선형 운동으로 변환한다. 이 시스템은 유연한
    고강도 섬유를 이용해 동력을 원격으로 전달하며, 구조를 경량화하는 데 필수적이다.


    ### 1. 텐던 재료: Dyneema SK78

    본 시스템에서는 파단 하중 230 daN과 작동 신율 1% 미만을 보장하는 `Dyneema SK78` 섬유를 사용한다 [S14]. 금속 케이블을
    대체하여 반복적인 굽힘에도 높은 피로 저항성을 제공하며, 치수 안정성이 뛰어나 정밀한 위치 제어가 가능하다.


    ### 2. 마찰 및 동력 전달

    액추에이터(XM430-W350-T)의 회전력을 손가락 관절로 전달할 때 캡스턴(Capstan)의 마찰은 중요하다. 캡스턴 모서리는 텐던의 마모를
    방지하기 위해 라운딩 처리가 필수적이다. 또한, 회전축에서의 마찰을 최소화하기 위해 무급유 폴리머 슬리브 베어링(JSM-0810-10)을 사용하며,
    이는 알루미늄 샤프트(AWMP-08)와 결합하여 고하중 환경에서도 매끄러운 동작을 보장한다 [S15, S16].


    ### 3. 시스템 효율 고려사항

    텐던은 시스템 구축 시 초기 장력(Pre-tension) 설정이 중요하다. 과도한 초기 장력은 베어링과 액추에이터의 마찰 부하를 증대시켜 에너지
    효율을 저하시키고 액추에이터의 과열을 유발할 수 있다. 반대로 부족한 장력은 제어 응답성을 떨어뜨린다.'
  worked_examples:
  - '예제 1: 텐던 파단 하중 계산. 파단 하중 230 daN인 Dyneema 라인 1가닥을 사용하는 관절에서, 액추에이터의 최대 스톨 토크(4.1
    N·m)를 텐던 장력으로 변환 시 안전 계수 검토. 캡스턴 반지름이 10 mm일 때 발생하는 장력은 F = T/r = 4.1 Nm / 0.01
    m = 410 N (약 41.8 daN)으로, 파단 하중 230 daN 대비 충분한 안전 여유(약 5.5배)를 가짐 [S9, S14].'
  - '예제 2: 베어링 선정. 8 mm 축을 지지하기 위해 내경 8 mm, 외경 10 mm인 JSM-0810-10 베어링을 사용할 때, 하우징
    보어 공차 관리. 폴리머 베어링은 압입(Press-fit) 시 내경이 정밀해지므로, 반드시 적정 보어 공차를 가진 프레임에 조립해야 함 [S15].'
  lab:
    title: 텐던 시스템 구축 및 마찰 측정
    steps:
    - 프레임에 JSM-0810-10 베어링을 압입하고 알루미늄 샤프트를 삽입하여 회전축 구성
    - Dyneema SK78 라인을 액추에이터 출력부와 손가락 관절 링크에 고정
    - 텐던 장력계를 사용하여 초기 장력(Pre-tension)을 설계 사양에 맞게 조정
    - 무부하 상태에서 액추에이터 구동 시 관절의 마찰 저항 변화 측정
    safety:
    - 텐던 장력 시험 중 텐던이 파단될 경우를 대비하여 보안경 필수 착용
    - 구동부 가동 범위 내에 절대 손가락을 넣지 않음
    - 실험 중 전원 분리는 물리적으로 전원 어댑터 3개를 콘센트에서 분리하고 측정 후 접근
    - 전원 인가 시 액추에이터 스톨(Stall) 조건이 발생하지 않도록 주의
    deliverables:
    - 텐던 초기 장력 측정 기록지
    - 관절 회전 마찰 측정 보고서
    - 텐던 고정 및 정렬 조립 도면
  assignment:
    title: 텐던 전송 효율 및 내구성 분석
    deliverables:
    - 시스템 조립 CAD 모델 파일 및 도면
    - 텐던 반복 굽힘 시험 1,000회 수행 후 파손 여부 기록
    - 최종 효율 분석 보고서
    rubric:
    - 텐던 고정이 견고하고 탈착이 용이하게 설계되었는가?
    - 베어링과 샤프트의 유격 없이 정밀한 회전축이 구현되었는가?
    - 반복 시험을 통해 텐던의 신율과 내구성이 검증되었는가?
  quiz:
  - question: 텐던 시스템의 마찰을 줄이기 위해 권장되는 방법은?
    choices:
    - 모든 캡스턴 모서리를 날카롭게 가공하여 마찰을 집중시킨다
    - 무급유 폴리머 슬리브 베어링을 사용하여 회전 마찰을 관리한다
    - 초기 장력을 무제한으로 높여 관절의 떨림을 제거한다
    - Dyneema 대신 신율이 매우 높은 고무줄을 사용한다
    answer_index: 1
    explanation: 무급유 폴리머 슬리브 베어링은 마찰을 최소화하고 유지보수가 쉬워 로봇손 관절에 적합하다 [S15].
  - question: 본 교육 과정에서 안전한 실험 종료 방법은?
    choices:
    - 소프트웨어적으로 모터를 정지시킨 후 바로 접근한다
    - 퓨즈를 제거하여 전원을 차단한다
    - 3개 독립 전원 어댑터를 물리적으로 분리하고 계측기로 전압 확인 후 접근한다
    - 저항 측정 모드로 전원이 차단되었는지 확인한다
    answer_index: 2
    explanation: 저전압 벤치 프로토타입에서 안전한 접근은 독립된 전원 어댑터를 물리적으로 분리하고, DC 전압 모드에서 1 V 미만임을
      계측기로 확인한 후 진행해야 한다.
  completion_criteria:
  - 텐던 고정 장치가 설계 사양에 맞게 체결됨
  - 반복 굽힘 시험을 통해 텐던의 신율이 허용 범위 이내임을 확인
  - 모든 조립 과정에서 안전 수칙을 준수하고 측정 기록을 완료
  source_ids:
  - S14
  - S15
  - S16
  - S9
- id: m6
  slug: electronics-safety
  phase_id: phase-2
  title: 전자 회로 및 비상 안전 체인
  estimated_hours: 10.0
  prerequisites:
  - m5
  objectives:
  - DYNAMIXEL 액추에이터의 전원 요구사항과 소비 전류 특성을 이해한다.
  - 분기별 전원 설계 및 과전류 보호를 위한 퓨즈 선정 원리를 학습한다.
  - ADC 전압 분압 회로를 사용하여 FSR 센서 데이터를 안전하게 취득한다.
  - 로봇 시스템의 전기적 절연 유지 및 무전원 상태 확인 절차를 익힌다.
  theory_markdown: '### 로봇 전원 시스템 설계

    로봇 매커니즘은 고부하 구동 시 순간적인 큰 전류를 소비하므로, 안정적인 전원 공급이 필수적이다. 본 시스템은 12 V 전원을 사용하며, DYNAMIXEL
    XM430-W350-T 액추에이터는 스톨 상태에서 최대 2.3 A를 소비한다 [S9]. 총 11개의 액추에이터가 사용되므로, 피크 전류 합계는
    약 25.3 A에 달한다. 이를 위해 3개의 독립된 12 V 절연 어댑터(각 11.5 A)를 사용하며, 액추에이터를 4대, 4대, 3대로 분산
    배치한다 [S13].


    ### 과전류 보호 및 안전

    각 전원 어댑터 출력은 독립적인 퓨즈 분기로 구성되어야 한다. 전원 어댑터의 정격인 11.5 A보다 낮고 액추에이터 최대 부하보다 높은 10
    A ATOF 퓨즈를 사용하여 배선을 보호한다 [S22, S23]. 퓨즈는 전원 분리 후 물리적 차단 수단과 함께 사용되며, 이는 기계적 안전을
    확보하기 위한 기초적인 전기적 보호 조치이다 [S20].


    ### 센서 인터페이스

    FSR 402 센서는 가해지는 힘에 반비례하여 저항이 감소하는 특성을 가진다 [S10]. 이를 OpenCR 제어기에서 측정하기 위해 10 kΩ
    고정 저항과 전압 분압 회로를 구성한다 [S24]. OpenCR의 ADC 입력은 3.3 V 레퍼런스를 기준으로 하므로, 센서 전원 분압기 또한
    반드시 3.3 V 센서 전원 레일에 연결하여 신호 범위를 0~3.3 V 이내로 유지해야 한다 [S11].'
  worked_examples:
  - '퓨즈 용량 계산: 한 분기당 액추에이터 4대(스톨 합계 9.2 A)가 배치된 경우, 10 A 퓨즈를 사용하면 정격 전류 이내에서 보호가 가능하다.
    퓨즈의 냉간 저항은 7.70 mΩ으로 매우 낮아 전압 강하를 최소화한다 [S23].'
  - '전압 분압 계산: FSR 센서 저항이 $R_{fsr}$, 고정 저항이 $R_{fix} = 10\text{k}\Omega$일 때, ADC 입력
    전압 $V_{adc} = 3.3\text{V} \times \frac{R_{fix}}{R_{fsr} + R_{fix}}$이다. 힘이 가해지지
    않았을 때 $R_{fsr}$은 매우 커서 $V_{adc}$는 0 V에 수렴하고, 최대 힘이 가해졌을 때 신호 범위를 확인하여 ADC 해상도
    12-bit를 효율적으로 사용한다 [S11, S24].'
  lab:
    title: 전기 회로 구성 및 무전원 검증 실습
    steps:
    - 각 액추에이터 분기(4대/4대/3대)를 독립적인 퓨즈 홀더와 연결한다.
    - FSR 센서와 10 kΩ 저항을 사용하여 분압 회로를 구성하고, 3.3 V 센서 레일에 연결한다.
    - 모든 전원을 분리하고 멀티미터를 DC 전압 모드로 설정하여 각 분기별 잔류 전압이 1 V 미만인지 측정한다.
    - 모든 배선의 연결 상태와 극성을 확인한 후, 액추에이터 전원 어댑터를 개별적으로 연결하여 시스템을 기동한다.
    safety:
    - 작업 중 반드시 충격 방지 작업용 보안경을 착용한다.
    - 실험 중 전원 인가 전에는 항상 고정 지그를 사용하여 로봇손을 무부하 상태로 둔다.
    - 회로 수정이나 접근이 필요한 경우 3개 전원 어댑터를 모두 물리적으로 분리하고 1 V 미만임을 확인한다.
    - 절대 두 개 이상의 양(+) 출력 단자를 병렬로 연결하지 않는다.
    deliverables:
    - 분기별 전압 측정값 기록지
    - FSR 센서 분압 회로 배선도
    - 안전 검증 체크리스트
  assignment:
    title: 시스템 전원 및 보호 설계 보고서
    deliverables:
    - 액추에이터 배치에 따른 분기별 최대 소비 전류 계산서
    - 분압 회로의 신호 범위(0~3.3 V) 분석 데이터
    - 배선도 및 안전 체인 구상안
    rubric:
    - 분기별 최대 전류가 퓨즈 정격(10 A) 내에 포함되어야 함
    - ADC 입력 신호가 0~3.3 V 범위를 초과하지 않음을 명확히 기술해야 함
    - 전원 절연 및 비연결 상태 확인 절차의 논리적 타당성
  quiz:
  - question: FSR 센서 분압 회로에 권장되는 전원 공급 전압은 무엇입니까?
    choices:
    - 12 V 액추에이터 레일
    - 3.3 V 센서 레일
    - 5 V 공통 레일
    - 24 V 입력 레일
    answer_index: 1
    explanation: OpenCR의 ADC는 3.3 V 해상도를 사용하며, 센서 신호를 안전하게 0~3.3 V 내로 유지하기 위해 반드시
      3.3 V 센서 전원 레일을 사용해야 합니다.
  - question: 로봇 실습 중 안전한 정지 상태를 확인하는 올바른 방법은 무엇입니까?
    choices:
    - 멀티미터 저항 모드로 측정
    - 퓨즈 분리 후 육안 확인
    - 3개 절연 전원 어댑터를 물리적으로 분리하고 DC 전압 모드로 1 V 미만 측정
    - 제어 소프트웨어에서 '정지' 명령 전송
    answer_index: 2
    explanation: 전원 어댑터를 물리적으로 분리하고, 무전원 상태를 멀티미터의 DC 전압 모드로 계측하여 확인하는 것이 유일한 안전 절차입니다.
  - question: 본 시스템에서 3개의 12 V 전원 어댑터 사용 원칙은 무엇입니까?
    choices:
    - 모든 전원을 병렬로 연결하여 전류 증대
    - 각 분기마다 10 A 퓨즈를 장착하고 독립적으로 운용
    - 1개 어댑터에 11개 액추에이터 모두 연결
    - 분기별 전원 순서대로 연결
    answer_index: 1
    explanation: 각 어댑터는 독립적인 퓨즈 분기로 운용되어야 하며, 양(+) 출력을 병렬 연결하는 것은 절대 금지됩니다.
  completion_criteria:
  - 분기별 과전류 보호를 위한 퓨즈 설계가 완료되어야 함.
  - 모든 센서 인터페이스가 3.3 V 레일 기준 설계되어야 함.
  - 무전원 상태 검증 절차를 실습을 통해 기록해야 함.
  source_ids:
  - S11
  - S12
  - S20
  - S9
  - S13
  - S22
  - S23
  - S10
  - S24
- id: m7
  slug: controller-firmware
  phase_id: phase-3
  title: 제어기 펌웨어 및 통신
  estimated_hours: 15.0
  prerequisites:
  - m6
  objectives:
  - DYNAMIXEL 액추에이터 제어 프로토콜 이해 및 펌웨어 구현
  - OpenCR 제어 보드를 활용한 센서 데이터 취득 및 처리
  - 실시간 시스템을 위한 안전 상태 기계(State Machine) 설계 및 적용
  - 힘 피드백(FSR) 기반 파지 알고리즘 로직 구현
  theory_markdown: "### 제어기 펌웨어 및 통신 기초\n\n로봇손의 정교한 움직임은 액추에이터와 제어기 간의 빠르고 정확한 통신에\
    \ 의존합니다. 본 시스템에서는 **DYNAMIXEL Protocol 2.0**을 사용하여 다수의 액추에이터를 정밀 제어합니다 [S9]. OpenCR\
    \ 제어 보드는 216MHz의 고성능 CPU를 탑재하여 복잡한 운동학 계산과 안전 로직을 실시간으로 처리할 수 있습니다 [S11].\n\n\
    #### 1. 데이터 취득: FSR 전압 분압\nFSR 402 센서는 가해진 힘에 반비례하여 저항이 감소하는 특성을 갖습니다 [S10]. 이를\
    \ 10kΩ 저항과 함께 전압 분압 회로로 구성하여 OpenCR의 12비트 ADC 입력으로 받습니다 [S11, S24]. \n- **주의:**\
    \ FSR 분압 회로는 반드시 3.3V 센서 전원 레일에서 전력을 공급받아야 하며, ADC 입력 신호가 0~3.3V 범위를 초과하지 않도록\
    \ 설계해야 합니다 [S11].\n\n#### 2. 통신 시스템\nOpenCR은 DYNAMIXEL TTL 및 RS-485 포트가 내장되어 있어\
    \ 추가적인 브리지 회로 없이 안정적인 통신을 지원합니다 [S11]. 펌웨어는 각 액추에이터의 전류, 속도, 위치 값을 주기적으로 폴링(Polling)하거나\
    \ 피드백 데이터를 처리하여 파지력을 조정합니다.\n\n#### 3. 안전 상태 기계 (State Machine)\n펌웨어 수준에서의 안전은\
    \ 시스템 오작동을 방지하는 핵심입니다. \n- **초기화 상태:** 통신 확인 및 관절 중립.\n- **정상 운전 상태:** 명령 처리 및\
    \ FSR 피드백 제어.\n- **안전 정지 상태:** 과전류 혹은 센서 범위 이탈 감지 시 모터 토크 해제.\n\n*프로토타입 안전 안내:\
    \ 본 펌웨어는 독립적인 하드웨어 E-stop을 대신하지 않으며, 전원 단 분리만이 유일한 안전 정지 수단입니다.*"
  worked_examples:
  - '예제 1: FSR ADC 값의 힘(N) 변환. 12비트 ADC 해상도를 사용하여 0~4095 범위를 3.3V 기준으로 변환하고, FSR 데이터시트의
    힘-저항 곡선을 활용하여 로직상 파지력(N)으로 매핑합니다.'
