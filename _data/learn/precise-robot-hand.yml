- id: m8
  slug: firmware-development
  phase_id: p3
  title: 펌웨어 제어 개발
  estimated_hours: 10.0
  prerequisites:
  - m6
  - m7
  objectives:
  - 로봇 제어 보드(OpenCR 1.0)의 아키텍처와 DYNAMIXEL 액추에이터 통신 방식을 이해한다.
  - 센서 데이터(FSR) 취득을 위한 전압 분압 회로 구성 및 ADC 처리 원리를 학습한다.
  - 로봇의 상태기계(State Machine) 구조를 설계하고 구현한다.
  - 안전한 전원 관리와 통신 프로토콜 구현을 통해 로봇 손 제어 펌웨어를 작성한다.
  theory_markdown: '### 로봇 펌웨어 제어 아키텍처

    로봇 손의 제어는 고속 실시간성이 요구되는 액추에이터 제어와 입력 데이터 처리를 동시에 수행해야 합니다. 사용되는 `OpenCR 1.0` 제어기는
    216MHz의 CPU 주파수를 지원하여 복잡한 상태기계와 통신 처리를 효율적으로 수행할 수 있습니다 [S13].


    ### 통신 및 액추에이터 제어

    `XM430-W350-T` 액추에이터는 `DYNAMIXEL Protocol 2.0`을 기반으로 위치, 속도, 전류 피드백을 제공합니다 [S11].
    제어기는 별도의 브리지 회로 없이 내장된 DYNAMIXEL TTL/RS-485 포트를 통해 직접 명령을 전달하여 통신 안정성과 재현성을 확보합니다
    [S13].


    ### 센서 데이터 처리 (FSR)

    `FSR 402` 센서는 가해진 힘에 비례하여 저항이 감소하는 특성을 갖습니다 [S12]. 이를 전압 값으로 변환하기 위해 10kΩ 고정 저항과
    전압 분압 회로를 구성합니다 [S25].

    - **회로 구성:** 3.3V 센서 전원 → FSR → ADC 입력 핀 → 10kΩ 저항 → GND

    교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
    [S13]. 12V 액추에이터 전원과 센서 회로를 물리적으로 엄격히 분리하십시오 [S13].'
  worked_examples:
  - '예제 1: DYNAMIXEL 액추에이터의 현재 위치 및 전류 값을 읽어오는 함수 구현. DYNAMIXEL SDK를 활용하여 프로토콜 패킷을
    생성하고 응답 패킷에서 피드백 데이터를 추출하는 과정을 설명합니다.'
  - '예제 2: FSR 센서 전압값에서 힘(N)으로 변환하는 수식 설계. ADC로부터 읽은 12bit 데이터(0-4095)를 전압으로 변환하고,
    분압 회로의 특성에 맞게 힘으로 사상(mapping)하는 알고리즘을 구현합니다 [S12, S13].'
  lab:
    title: 로봇 손 펌웨어 통합 실습
    steps:
    - 각 액추에이터의 ID를 중복 없이 설정하고 통신 상태를 확인합니다.
    - OpenCR의 3.3V 센서 레일에 FSR 센서 전압 분압 회로를 연결합니다.
    - ADC 값을 읽어 모니터링하고 FSR의 접촉력에 따른 데이터 변화를 확인합니다.
    - 로봇 손 상태기계(대기, 파지, 해제, 오류)를 구현하고 각 상태 전환 조건을 프로그래밍합니다.
    safety:
    - 절연형 12V 어댑터 3개를 완전히 분리한 상태에서 배선 작업을 수행하십시오 [S15].
    - 전원 인가 전 반드시 멀티미터 DC 전압 모드로 각 분기 단자의 전압이 0V인지 확인하십시오.
    - 프로그래밍 된 로봇 손은 반드시 고정 지그에 장착하고 무부하 상태에서 가동 범위 동작을 시험하십시오.
    - 전원 인가 중에는 가동 범위 내에 손을 넣지 마십시오.
    deliverables:
    - 액추에이터 통신 테스트 결과 로그
    - FSR 센서 데이터 교정 기록 및 데이터시트 기반 변환 공식
    - 작성된 펌웨어 소스 코드(로봇 제어 상태기계 포함)
  assignment:
    title: 로봇 손 제어 시스템 최종 통합
    deliverables:
    - 통합 제어 펌웨어 소스 코드
    - 파지 및 해제 동작 성공 영상
    - 최종 로봇 손 제어 시스템 기술 보고서
    rubric:
    - DYNAMIXEL 통신 패킷 전송 및 피드백 수신 성공 여부
    - FSR 센서값의 노이즈 필터링 및 안정적인 힘 값 도출 여부
    - 상태기계 구현의 논리적 오류 없음 및 안전 상태 복귀 가능 여부
    - 전압 분리 및 센서 회로 설계 준수 여부
  quiz:
  - question: OpenCR 1.0 보드에서 FSR 센서 회로를 전원 공급하기에 적합한 전압은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원 레일
    - 3.3 V 센서 전원 레일
    - 5 V 디지털 I/O 전원
    - 24 V 입력 전원
    answer_index: 1
    explanation: OpenCR 1.0은 ADC 회로와 센서 전압 분압을 위해 3.3V 센서 전원 사용을 권장하며, 아날로그 신호를 0-3.3V
      범위 내로 유지해야 합니다 [S13].
  - question: DYNAMIXEL XM430-W350-T의 스톨 전류는 몇 암페어(A)입니까?
    choices:
    - 1.5 A
    - 2.3 A
    - 4.1 A
    - 11.5 A
    answer_index: 1
    explanation: 데이터시트에 명시된 XM430-W350-T의 스톨 전류는 2.3 A입니다 [S11].
  completion_criteria:
  - 모든 액추에이터와 통신 및 명령 수행 성공
  - FSR 센서값 ADC 입력 처리 정상 확인
  - 상태기계 구현 후 벤치 테스트에서 의도된 동작 수행
  - 제출 과제물에서 전기적 안전 수칙 준수 명시
  source_ids:
  - S13
  - S11
  - S12
  - S25
  - S15
- id: m9
  slug: testing-calibration
  phase_id: p3
  title: 교정 및 파지 시험
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - DYNAMIXEL 액추에이터의 전류 피드백 데이터를 활용한 정밀 제어 원리 이해
  - FSR 힘 센서의 분압 회로 구성 및 ADC 신호 교정 실습
  - 로봇 손 프로토타입의 파지력 측정 및 기계적 내구성 검증 절차 습득
  - 절연 전원 분기 및 과전류 보호 시스템의 안전한 운용
  theory_markdown: '## 5지 로봇 손의 성능 검증 및 교정


    ### 1. 전류 피드백 제어

    로봇 손의 각 관절은 `XM430-W350-T` 스마트 액추에이터를 사용하며, 이는 내부 전류 피드백을 통해 토크를 정밀하게 제어할 수 있습니다
    [S11]. 정격 전압 12V 환경에서 스톨 전류는 2.3A에 달하므로 [S11], 시스템 통합 시 총 피크 전류를 고려한 전원 분기 설계가
    필수적입니다. 본 프로토타입은 총 11대의 액추에이터를 3개의 독립 절연 분기(4대/4대/3대)로 나누어 전력을 공급하며, 전체 합산 피크
    전류 25.3A를 대응하기 위해 각 분기는 11.5A 정격 어댑터 3개를 사용하여 총 34.5A 용량을 확보합니다 [S15].


    ### 2. FSR 힘 센서 교정

    `FSR 402` 센서는 압력에 따라 저항이 감소하는 특성을 가집니다 [S12]. 이를 `OpenCR 1.0` 제어기의 ADC(12비트 해상도)로
    취득하기 위해 10kΩ 저항을 사용한 전압 분압 회로를 구성합니다 [S13, S25]. 센서 전원은 `OpenCR`의 3.3V 센서 레일을
    사용해야 하며, ADC 입력 신호가 0~3.3V 범위를 벗어나지 않도록 주의해야 합니다 [S13]. 실제 파지력은 표준 분동을 사용하여 센서
    출력값(0~4095)과 실제 힘(N) 사이의 비선형 곡선을 회귀 분석하여 교정합니다.


    ### 3. 전기 안전 시스템

    각 12V 전원 분기는 `0287010` 10A ATOF 퓨즈를 통해 과전류를 방지합니다 [S24]. 퓨즈는 정격 전류 이상의 부하 발생 시
    시간-전류 특성 곡선에 따라 회로를 개방합니다. 벤치 테스트 중 시스템 정지 시, 반드시 3개의 전원 어댑터를 물리적으로 분리하고 멀티미터
    DC 전압 모드로 각 분기 전압이 1V 미만임을 확인한 후 장비에 접근해야 합니다 [S15, S23].'
  worked_examples:
  - '예제 1: 액추에이터 분기별 부하 계산. 4대 액추에이터 분기의 스톨 전류 합계는 2.3A × 4 = 9.2A입니다. 이는 10A ATOF
    퓨즈의 정격 범위 내에 있으며, 전원 어댑터 분기 정격 11.5A보다 낮아 안전합니다 [S11, S15, S24].'
  - '예제 2: FSR ADC 변환. 3.3V 전원과 10kΩ 저항 분압을 사용하여 FSR 저항이 10kΩ일 때 ADC 값은 2048(12비트
    해상도의 절반)이 됩니다 [S13, S25]. 센서 응답 범위(0.2N~20N)에 맞춰 출력 곡선을 설정합니다 [S12].'
  lab:
    title: 로봇 손 파지력 측정 및 전기 시스템 검증
    steps:
    - 각 액추에이터 분기의 전원을 차단하고 물리적 분리 상태를 계측 확인합니다.
    - FSR 센서의 3.3V 전원 분압 회로를 OpenCR ADC 포트에 연결합니다.
    - 독립된 3개의 12V 전원 어댑터를 개별 퓨즈 홀더를 통해 각 분기에 연결합니다.
    - 무부하 상태에서 각 손가락을 가동하여 텐던 장력을 확인합니다.
    - 표준 분동을 활용하여 FSR 센서의 출력값-힘(N) 교정 데이터를 기록합니다.
    safety:
    - 실험 중 전원 차단은 3개 어댑터의 물리적 분리가 필수입니다.
    - 접근 전 모든 분기의 DC 전압이 1V 미만인지 멀티미터로 반드시 확인합니다.
    - 절단·텐던 장력 시험 시 반드시 충격 방지 보안경을 착용합니다.
    - 인가된 회로가 계획 정지 기능을 대신할 수 없음을 유념합니다.
    deliverables:
    - FSR 센서 교정 곡선 데이터(Raw ADC vs. N)
    - 액추에이터 관절별 전류 및 토크 피드백 기록
    - 분기별 전압 측정 검증서
  assignment:
    title: 로봇 손 최종 성능 평가 보고서
    deliverables:
    - 교정 데이터를 포함한 파지력 정밀도 분석 보고서
    - 텐던 반복 굽힘 시험 후 마모 상태 사진
    - 전기 계통 절연 저항 확인 및 분기별 부하 배분 기록
    rubric:
    - FSR 교정 곡선의 선형성 및 재현성 확보 여부
    - 독립 전원 분기 및 퓨즈 보호 설계의 기술적 타당성
    - 실험 안전 절차 준수 및 계측을 통한 전원 분리 상태 확인
  quiz:
  - question: 본 시스템에서 4대 액추에이터 분기에 10A 퓨즈를 사용하는 이유는 무엇입니까?
    choices:
    - 분기당 스톨 전류 합계 9.2A를 보호하면서 전원 어댑터 한계 내에서 작동하기 위해
    - 회로의 전체 전류를 10A로 제한하여 동작 속도를 높이기 위해
    - 계획 정지 장치로서 즉각적인 회로 차단을 위해
    - 퓨즈의 저항을 이용해 전압을 강하시키기 위해
    answer_index: 0
    explanation: 스톨 전류 합계 9.2A는 10A 퓨즈 보호 범위에 적합하며, 11.5A 어댑터 출력 용량을 넘지 않아 안전합니다.
  - question: 실험 중 장비에 손을 대기 전 무전원 상태를 확인하는 올바른 방법은?
    choices:
    - 멀티미터 저항 모드로 전원 단자 확인
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기 1V 미만 확인
    - 제어 소프트웨어의 전원 차단 명령 확인
    - 퓨즈가 연결되어 있는지 확인
    answer_index: 1
    explanation: DC 전압 측정만이 직접적인 에너지가 제거되었음을 보증하는 방법입니다. 저항 모드는 사용하지 않습니다.
  - question: FSR 센서를 OpenCR에 연결할 때 올바른 전원 공급 방법은?
    choices:
    - 12V 액추에이터 전원 분기 활용
    - 3.3V 센서 전원 레일 활용
    - 5V 외부 전원 공급
    - 전원 없이 센서만 연결
    answer_index: 1
    explanation: OpenCR의 ADC 사양과 센서 전압 보호를 위해 반드시 3.3V 센서 전원 레일을 사용해야 합니다.
  completion_criteria:
  - 각 액추에이터 분기의 물리적 분리 및 무전원 상태 계측 완료
  - FSR 센서 교정 곡선 작성을 통한 힘 피드백 시스템 검증
  - 안전 사양을 준수하는 전기 회로 구성 및 측정 결과 제출
  - 최종 실험 결과 보고서 제출 및 통과
