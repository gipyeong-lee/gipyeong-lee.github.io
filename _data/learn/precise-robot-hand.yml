- id: m6
  slug: wiring-safety
  phase_id: phase-2
  title: 전력 배선 및 안전 회로 구성
  estimated_hours: 10.0
  prerequisites:
  - m5
  objectives:
  - DYNAMIXEL 스마트 액추에이터와 OpenCR 컨트롤러의 전력 분배 원리를 이해한다.
  - IEC 60204-1에 기초한 산업용 기계 안전 전력 차단 회로를 설계한다 [S22].
  - 비상정지 버튼, 강제 유도 안전 릴레이, 고전류 DC 접촉기를 활용한 안전 사슬을 구성한다 [S23, S25, S26].
  - 독립 전원 분기 및 과전류 보호(퓨즈)를 위한 배선 규격을 선정하고 배치한다 [S7, S27, S28].
  theory_markdown: '### 로봇 전력 아키텍처 및 안전 설계


    정교한 5지 로봇손 시스템은 고출력 액추에이터 구동을 위해 다수의 독립 전원 분기를 사용한다. 시스템의 안정성과 기계 안전을 보장하기 위해
    액추에이터 전원(12 V)은 ADC 및 제어 신호 회로와 전기적으로 분리되어야 하며, 각 분기는 독립적인 퓨즈와 차단 장치를 가져야 한다 [S14,
    S15].


    #### 1. 독립 전원 분기 구성

    부하 균형을 위해 총 11개의 DYNAMIXEL XM430-W350-T 액추에이터를 3개의 독립 12 V 전원 분기에 배분한다 [S12, S15].
    각 전원 어댑터의 출력은 병렬 연결을 절대 금지하며, 독립적인 퓨즈(10 A ATOF)와 고전류 접촉기(EV200AAANA)를 통해 제어된다
    [S15, S26, S28].


    #### 2. 다층 안전 회로(Safety Chain)

    비상정지(E-stop) 시스템은 검증 가능한 저전류 제어 계층을 통해 고전류 접촉기를 무전원화한다 [S23, S26].

    - **제어 계층 1 (입력):** A22E 비상정지 버튼의 강제 개방 NC 접점이 안전 릴레이(G7SA-3A1B)의 코일을 제어한다 [S23,
    S25].

    - **제어 계층 2 (중계):** G7SA의 NO 접점이 고전류 릴레이(G2R-1-SND) 코일을 구동하여 EV200 접촉기의 대용량 코일
    돌입전류를 분리한다 [S24, S26].

    - **최종 차단:** EV200은 액추에이터 전원 분기를 물리적으로 개방하여 모든 전원을 즉시 차단한다 [S26].'
  worked_examples:
  - '예제 1: 분기 퓨즈 정격 산정

    액추에이터 4대 분기의 최대 스톨 전류 합계는 2.3 A × 4 = 9.2 A이다 [S12]. 사용되는 10 A ATOF 퓨즈는 9.2 A
    피크 부하를 연속으로 견디며 배선 고장 시 차단 보호를 제공한다 [S28].'
  - '예제 2: 릴레이 체인 전류 분석

    A22E 비상정지 버튼 접점은 30 mA의 G7SA 코일 전류만 제어하므로 버튼의 접점 정격을 초과하지 않는다 [S23, S25]. G2R
    릴레이 접점은 3.8 A 이하의 EV200 돌입전류를 안전하게 스위칭한다 [S24, S26].'
  lab:
    title: 전력 분기 및 E-stop 회로 구현
    steps:
    - 각 독립 12 V 전원 분기에 인라인 퓨즈 홀더(0AFH0001Z)와 10 A 퓨즈를 배치한다 [S27, S28].
    - A22E NC 접점과 G7SA 코일을 연결하여 제어 계층을 구성한다 [S23, S25].
    - G7SA NO 접점 3개를 각각 G2R-1-SND 코일과 연결한다 [S23, S24].
    - G2R NO 접점 3개를 각각 EV200AAANA 코일과 연결한다 [S24, S26].
    - 각 분기의 전원을 EV200 접촉기를 거쳐 액추에이터 분기 하네스에 연결한다 [S26].
    safety:
    - 모든 AC 전원 연결 시 전원을 분리하고 보안경을 착용한다.
    - 독립 전원 분기의 양(+) 출력 절대 병렬 연결 금지.
    - 비상정지 작동 확인 전 액추에이터 무부하 상태 확인.
    deliverables:
    - 완성된 전원 배선도 (독립 분기 및 퓨즈 확인)
    - 비상정지 테스트 시 각 분기 전압 Fall 기록 (멀티미터 데이터)
    - G7SA-G2R-EV200 동작 시퀀스 검증 보고서
  assignment:
    title: 안전 회로 설계 및 오류 분석
    deliverables:
    - 배선도 및 분기 전력 계산서
    - 비상정지 회로의 단계별 전류 경로 분석 보고서
    rubric:
    - 독립 전원 분기의 독립성 유지 및 퓨즈 규격 적절성
    - 강제 유도 접점 체인(A22E-G7SA-G2R-EV200)의 논리적 순서 구현
    - 전력 소비 모델링 및 분기 부하 배분 적절성
  quiz:
  - question: 다음 중 전력 배선 안전 원칙에 가장 부합하는 설명은?
    choices:
    - 전원 효율을 높이기 위해 3개의 12 V 어댑터 출력을 병렬 연결한다.
    - 각 12 V 액추에이터 분기는 독립적으로 퓨즈 처리하고 출력 isolated를 유지한다.
    - EV200 코일은 A22E 비상정지 버튼 NC 접점에 직접 연결하여 신뢰성을 높인다.
    - ADC 전압 분압회로는 12 V 액추에이터 전원과 같은 라인을 사용한다.
    answer_index: 1
    explanation: 독립 전원 분기를 사용하고 병렬 연결을 금지하는 것이 전기적 안전 원칙이며, 액추에이터 전원과 센서/ADC 전원은 분리되어야
      한다.
  - question: EV200AAANA 접촉기 코일 구동 회로의 올바른 구성은?
    choices:
    - A22E NC -> EV200 코일 직접 연결
    - A22E NC -> G2R 접점 -> EV200 코일
    - A22E NC -> G7SA NO 접점 -> G2R 코일 -> G2R 접점 -> EV200 코일
    - G7SA NC -> EV200 코일
    answer_index: 2
    explanation: 비상정지 버튼과 고돌입 전류 접촉기 사이에 저전류 중계 릴레이(G7SA, G2R) 체인을 구성하여 보호해야 한다.
  completion_criteria:
  - 각 액추에이터 분기별 독립 전원 및 퓨즈 배선 완료
  - 비상정지 버튼 입력 시 모든 액추에이터 전원 분기의 EV200 차단 확인
  - 모든 센서 전압 분압 회로가 3.3 V 센서 레일에서 공급됨 확인
