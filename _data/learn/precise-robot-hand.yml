- id: M6
  slug: electrical-wiring
  phase_id: P2
  title: 전력 및 배선 설계
  estimated_hours: 8.0
  prerequisites:
  - M2
  objectives:
  - 로봇 시스템을 위한 안전한 전력 분배 네트워크를 설계할 수 있다.
  - 커넥터 사양(Molex Micro-Fit 3.0)을 해석하고 적절한 케이블링을 수행할 수 있다.
  - 산업용 전원 어댑터(Mean Well GST160A)의 사양을 이해하고 적절한 전압 및 전류 용량을 산정할 수 있다.
  - 로봇 하드웨어의 배선 오류를 방지하기 위한 표준 절차를 숙지한다.
  theory_markdown: "### 로봇 전력 및 배선 설계 기초\n\n로봇 손과 같은 정밀 메커니즘을 구동하기 위해서는 신뢰할 수 있는 전원\
    \ 공급과 체계적인 배선이 필수적입니다. 부적절한 배선은 전압 강하(Voltage Drop), 노이즈, 혹은 화재와 같은 안전 사고를 유발할\
    \ 수 있습니다.\n\n#### 1. 전원 공급 장치 선정\n로봇 시스템의 총 전력 소비를 계산한 후, 충분한 마진을 가진 어댑터를 선택해야\
    \ 합니다. 예를 들어, Mean Well GST160A 시리즈는 최대 160W를 공급하며, 과전압, 과부하, 과온 보호 기능이 내장된 신뢰성\
    \ 높은 장치입니다 [S85]. 출력 전압(예: 12V)과 정격 전류(예: 11.5A)를 계산하여 로봇의 모터 및 제어기 사양과 일치시켜야\
    \ 합니다 [S85].\n\n#### 2. 커넥터와 케이블링\nMolex Micro-Fit 3.0과 같은 산업용 커넥터 시스템은 신호 및 전력\
    \ 전달에 안정성을 제공합니다 [S31]. 3.0mm 피치와 최대 8.5A 정격 전류를 지원하며, 오결선을 방지하는 편광(Polarization)\
    \ 하우징 구조를 가지고 있습니다 [S31]. \n\n- **TPA(Terminal Position Assurance):** 터미널이 하우징에서\
    \ 이탈하는 것을 방지하는 필수 안전 기능입니다 [S31].\n- **배선 시 고려 사항:** 전류 부하에 적합한 AWG(American Wire\
    \ Gauge) 규격의 전선을 사용하고, 진동이 많은 로봇 관절 부위에는 스트레인 릴리프(Strain Relief)를 반드시 적용해야 합니다.\n\
    \n#### 3. 전력 분배 설계\n로봇 내부의 제어기와 모터 드라이버는 전압 요구 사항이 다를 수 있습니다. 따라서 주 전원 입력단에서 분배\
    \ 보드(Power Distribution Board)를 구성하고, 각 회로마다 적절한 퓨즈를 배치하여 국부적 고장이 전체 시스템으로 확산되지\
    \ 않도록 방어해야 합니다."
  worked_examples:
  - '예제 1: 시스템 전력 요구 사항 산정

    로봇 손의 5개 손가락 모터가 각각 피크 시 2A를 소모하고, 제어기가 0.5A를 소모할 때 필요한 총 전원을 계산하십시오.

    풀이: 총 전류 = (5 * 2A) + 0.5A = 10.5A. 12V 시스템 기준 총 전력 = 12V * 10.5A = 126W. GST160A12-R7B
    모델(160W/11.5A)은 충분한 마진(약 20%)을 제공하므로 적합함 [S85].'
  - '예제 2: Molex Micro-Fit 커넥터 사양 확인

    사용하려는 모터 배선 전류가 7A인 경우 Micro-Fit 3.0을 사용할 수 있는지 판단하십시오.

    풀이: Micro-Fit 3.0 커넥터 시스템의 최대 정격 전류는 8.5A입니다 [S31]. 7A는 8.5A 이내이므로 허용 가능합니다.'
  lab:
    title: 로봇 손 전력 분배 보드 제작 및 통전 시험
    steps:
    - 전원 공급 장치(GST160A)의 출력 전압을 멀티미터로 측정하여 12V가 정상 출력되는지 확인한다.
    - Molex Micro-Fit 3.0 터미널을 적절한 AWG 규격 전선에 압착 도구를 사용하여 연결한다.
    - TPA(터미널 위치 보장) 장치를 장착하고 하우징에 터미널을 삽입한다.
    - 전력 분배 보드에 각 모터 드라이버로 향하는 커넥터들을 결선한다.
    - 최종 결선 전, 멀티미터의 도통 모드로 각 배선 간의 쇼트(Short) 유무를 검사한다.
    safety:
    - 반드시 보안경을 착용하십시오.
    - 납땜 인두 사용 시 화상에 주의하고 통풍이 잘되는 곳에서 작업하십시오.
    - 전원 공급 장치는 단락 보호 기능이 확인된 벤치 전원을 우선 사용하십시오.
    - 끼임 방지를 위해 모터를 물리적으로 고정하거나 동력을 분리한 상태에서 시험하십시오.
    deliverables:
    - 배선도(Wiring Diagram)
    - 멀티미터 측정 기록(전압 및 도통 검사)
    - 제작된 전력 분배 보드 사진
  assignment:
    title: 로봇 손 전원 시스템 설계 보고서
    deliverables:
    - 전력 요구 사항 산정 시트(Excel)
    - 커넥터 및 케이블 사양서(BOM)
    - 최종 배선 시스템 회로도
    rubric:
    - 전력 계산의 정확성(피크 부하 고려 여부)
    - 사용한 커넥터 및 전선 규격의 타당성(Molex 사양 준수)
    - 회로도 내 안전 장치(퓨즈 등) 설계 포함 여부
  quiz:
  - question: Molex Micro-Fit 3.0 시스템에서 'TPA'의 주된 역할은 무엇입니까?
    choices:
    - 전압을 강하시키는 변압 기능
    - 터미널이 하우징에서 뒤로 빠지는 것을 방지
    - 통신 신호를 증폭하는 기능
    - 커넥터의 냉각을 돕는 기능
    answer_index: 1
    explanation: TPA는 Terminal Position Assurance의 약자로, 터미널이 커넥터 하우징에 완전히 장착되어 빠지지
      않도록 보조적으로 잠그는 역할을 합니다 [S31].
  - question: GST160A12-R7B 모델을 사용할 때의 정격 전류는 얼마입니까?
    choices:
    - 160A
    - 12A
    - 11.5A
    - 8.5A
    answer_index: 2
    explanation: GST160A12 모델의 정격 전류는 사양서에 따라 11.5A입니다 [S85].
  completion_criteria:
  - 전력 시스템 설계 보고서 제출
  - 제작된 분배 보드의 도통 검사 통과
  - 이론 퀴즈 100% 정답
  source_ids:
  - S85
  - S31
- id: M7
  slug: firmware-basics
  phase_id: P3
  title: 임베디드 펌웨어 기초
  estimated_hours: 10.0
  prerequisites:
  - M6
  objectives:
  - ESP-IDF 프레임워크의 기본 구조와 동작 원리를 이해한다.
  - RTOS 기반의 태스크(Task) 관리 및 우선순위 개념을 학습한다.
  - GPIO 제어 및 PWM 생성을 통해 서보 모터를 구동하는 펌웨어를 작성한다.
  - 인터럽트(Interrupt)와 큐(Queue)를 활용한 비동기 데이터 처리를 구현한다.
  theory_markdown: '## 임베디드 펌웨어와 ESP-IDF


    로봇손과 같은 정교한 시스템은 실시간성(Real-time)이 보장된 제어를 필요로 합니다. ESP-IDF는 Espressif SoC를 위한
    공식 개발 프레임워크로, FreeRTOS를 기반으로 하여 다중 태스크 처리와 하드웨어 자원의 효율적인 관리를 지원합니다 [S84].


    ### 1. FreeRTOS 태스크 구조

    임베디드 소프트웨어는 보통 `main` 함수에서 시스템을 초기화한 후, 여러 개의 태스크를 생성하여 실행합니다. 태스크는 독립적인 스택을 가지며,
    OS 스케줄러에 의해 시분할 방식으로 CPU 자원을 공유합니다. 우선순위가 높은 태스크가 실행되면 낮은 태스크는 중단(Preemptive)됩니다.


    ### 2. 하드웨어 추상화 계층(HAL)

    직접 레지스터를 제어하는 대신 ESP-IDF의 API를 사용하면 코드의 이식성과 안전성이 높아집니다. 예를 들어, `ledc` API는 서보
    모터 제어에 필수적인 고해상도 PWM 신호를 생성하는 데 사용됩니다.


    ### 3. 이벤트 기반 처리

    모터 위치 명령이나 센서 값을 처리할 때, 메인 루프에서 폴링(Polling)하는 대신 큐(Queue)와 세마포어(Semaphore)를 사용하여
    태스크 간 데이터를 안전하게 주고받고 인터럽트를 처리하는 것이 정교한 제어의 핵심입니다.'
  worked_examples:
  - '서보 모터 PWM 제어 예시: `ledc_timer_config`로 주파수를 설정하고 `ledc_channel_config`를 통해 50Hz
    PWM 신호를 생성하여 서보 각도를 변경하는 구조.'
  - '태스크 간 데이터 공유 예시: `xQueueCreate`로 생성된 큐를 통해 센서 입력 태스크에서 모터 제어 태스크로 목표 위치 값을 전달하는
    비동기 통신 설계.'
  lab:
    title: 서보 모터 제어 및 태스크 통신 실습
    steps:
    - ESP-IDF 환경 구성 및 프로젝트 빌드 시스템(`CMakeLists.txt`) 확인.
    - LED Blink 예제를 기반으로 FreeRTOS 태스크 생성 코드 작성.
    - LEDC API를 활용하여 50Hz PWM 신호 생성 및 서보 모터 연결.
    - 큐(Queue)를 사용하여 시리얼 입력에 따라 서보 각도를 조정하는 펌웨어 통합.
    - 멀티미터를 이용한 출력 전압 확인 및 오실로스코프(사용 가능 시)로 PWM 파형 검증.
    safety:
    - 벤치 전원의 전류 제한을 500mA 이하로 설정하여 과전류 방지.
    - 모터 구동 시 손가락 끼임 주의.
    - 보안경 착용 필수.
    - 배선 수정 전 반드시 전원 차단.
    deliverables:
    - 작성된 펌웨어 소스 코드 (.c, .h)
    - 태스크 구조를 나타내는 순서도
    - 실험 결과 파형 사진 또는 전압 측정 기록
  assignment:
    title: 5지 로봇손용 멀티 서보 제어기 구현
    deliverables:
    - 5개 서보 모터를 독립적으로 제어하는 소스 코드
    - 제어 인터페이스 설계 보고서 (API 및 데이터 구조)
    - 로봇손 동작 시연 영상
    rubric:
    - 코드의 가독성 및 주석의 명확성 (20%)
    - FreeRTOS 태스크 및 큐 활용의 적절성 (40%)
    - 서보 모터 동작의 부드러움 및 정밀도 (30%)
    - 제출 기한 준수 및 보고서 내용 충실도 (10%)
  quiz:
  - question: FreeRTOS에서 태스크가 우선순위가 높은 태스크에 의해 중단되는 현상을 무엇이라 하는가?
    choices:
    - Polling
    - Preemption
    - Interrupting
    - Buffering
    answer_index: 1
    explanation: 우선순위가 높은 태스크가 실행 준비 상태가 되면 현재 실행 중인 낮은 우선순위 태스크를 일시 중지하고 CPU를 점유하는
      것을 Preemption(선점)이라고 합니다.
  - question: 서보 모터 제어를 위해 ESP32에서 주로 사용되는 API는 무엇인가?
    choices:
    - GPIO
    - LEDC
    - ADC
    - I2C
    answer_index: 1
    explanation: LEDC(LED Control) 모듈은 PWM 신호를 생성하는 기능을 제공하여 서보 모터의 위치 제어에 주로 사용됩니다.
  - question: 펌웨어 개발 시 '큐(Queue)'를 사용하는 주된 이유는 무엇인가?
    choices:
    - 메모리 절약
    - 태스크 간 안전한 데이터 전달
    - CPU 속도 향상
    - 인터럽트 무시
    answer_index: 1
    explanation: 큐는 멀티태스킹 환경에서 여러 태스크 간에 데이터를 안전하게 주고받기 위한 표준 동기화 기법입니다.
  completion_criteria:
  - 실습 Lab을 완료하고 제어 펌웨어가 5개 서보 모터를 독립적으로 동작시킴을 확인.
  - 과제 Assignment의 소스 코드와 보고서 제출.
  - 퀴즈에서 3문제 중 2문제 이상 정답.
  source_ids:
  - S84
