- id: M11
  slug: grasping-validation
  phase_id: P4
  title: 파지 시험 및 성능 검증
  estimated_hours: 8.0
  prerequisites:
  - M10
  objectives:
  - 로봇손 파지 성능 평가를 위한 정량적 지표 이해
  - 파지 시험 프로토콜 설계 및 실행 방법 습득
  - 실험 데이터 분석을 통한 로봇손의 강인성 및 적응성 검증
  - 실패 모드 분석(FMA)을 통한 기구적/제어적 개선점 도출
  theory_markdown: '## 파지 성능 검증 이론


    로봇손의 파지(grasping) 성능은 단순히 물체를 잡는 능력을 넘어, **강인성(Robustness)**, **적응성(Adaptability)**,
    그리고 **작업 효율성(Efficiency)**을 종합적으로 평가해야 합니다. [S14]


    ### 1. 주요 평가 지표

    *   **성공률(Success Rate):** 특정 환경 및 물체 세트에 대해 파지에 성공한 횟수의 비율. [S12]

    *   **파지력(Grip Force):** 액추에이터가 물체에 가하는 최대 힘으로, DYNAMIXEL XM430-W350 기준 정격 토크
    대비 전달 효율로 계산됩니다. [S36, S38]

    *   **슬립 저항성(Slip Resistance):** 외부 교란(disturbance)이나 하중 변화에 대해 파지 상태를 유지하는 능력.
    [S12]


    ### 2. 파지 Taxonomy 기반 평가

    Feix taxonomy는 인간 손의 다양한 파지 형태를 분류한 표준으로, 로봇손이 이를 얼마나 구현할 수 있는지 평가합니다. [S14, S17]
    특히 Underactuated(비완전 구동) 메커니즘을 사용하는 경우, 복잡한 제어 없이 물체의 형상에 적응하는 **수동적 순응성(Passive
    Compliance)**이 파지 성능의 핵심 요소입니다. [S12, S13]


    ### 3. 실험 설계의 원리

    실험은 반복 가능(Repeatable)하고 재현 가능(Reproducible)해야 합니다. 이를 위해 물체의 형상(큐보이드, 구, 실린더 등),
    크기, 재질, 질량을 변수로 설정하고, 각 조건에서의 성공 여부를 기록합니다. [S14]'
  worked_examples:
  - '예제 1: 파지력 계산. 액추에이터 출력 토크 $T = 4.1 \text{Nm}$ (12V 기준)이고, tendon-driven 메커니즘의
    손실률이 20%일 때, 실제 손가락 끝에 전달되는 유효 토크를 계산하시오. 해답: $T_{eff} = T \times (1 - 0.20) =
    4.1 \times 0.8 = 3.28 \text{Nm}$. [S36, S38]'
  - '예제 2: 성공률 산출. 10회의 시도 중 8회 성공하고, 2회는 물체 이탈 발생. $Success Rate = (8/10) \times
    100 = 80\%$. [S12]'
  lab:
    title: 로봇손 파지 안정성 및 내구 시험
    steps:
    - 파지 시험대(Grasp Validation Stand)를 설치하고 카메라 및 센서 데이터 로깅 시스템을 동기화합니다.
    - 표준화된 물체 세트(구, 큐보이드, 실린더)를 파지 시험대에 배치합니다.
    - 제어 코드를 사용하여 로봇손이 각 물체를 파지하도록 하고, 성공 여부를 20회 반복 측정합니다.
    - 각 물체에 가해지는 최대 힘(Load)을 증가시키며 파지력을 측정합니다.
    - 장시간 연속 파지 시험(내구 시험, 1000 cycle 이상)을 수행하여 기구부 파손 및 와이어 풀림 여부를 확인합니다.
    safety:
    - 실험 중 로봇손 작동 범위 내에 신체 부위를 절대 넣지 마십시오(끼임 방지).
    - 보안경을 필히 착용하고 작업을 진행하십시오.
    - 전원 공급장치에 비상 차단 버튼을 항상 가까이 두십시오.
    - 전류 제한(Current Limit)을 설정하여 모터 과부하 및 기구적 파손을 방지하십시오.
    deliverables:
    - 시험 결과 데이터 기록 시트
    - 파지 성공률 분석 보고서
    - 내구 시험 후 기구적 마모 상태 사진 자료
    - 최종 성능 요약 보고서
  assignment:
    title: 로봇손 성능 최적화 보고서
    deliverables:
    - 파지 실험 데이터 분석 결과물(그래프 포함)
    - Feix taxonomy 파지 구현 가능 형태 요약
    - 실패 모드 분석(FMA) 표
    - 성능 향상을 위한 기구적 또는 제어적 제안서
    rubric:
    - 데이터 수집의 정확성과 통계적 타당성 (30%)
    - 파지 분류 체계 이해 및 결과 적용 능력 (30%)
    - 실패 원인 분석의 논리적 타당성 (20%)
    - 기술적 제안의 실현 가능성 및 창의성 (20%)
  quiz:
  - question: Underactuated(비완전 구동) 메커니즘을 사용하는 로봇손의 주요 장점은 무엇입니까?
    choices:
    - 높은 위치 제어 정확도
    - 단순한 구조와 물체 형상에 대한 순응성
    - 각 관절의 독립적인 제어 가능
    - 초고속 반응 속도
    answer_index: 1
    explanation: 비완전 구동 로봇손은 모터 개수를 줄여 제어 시스템의 복잡도를 낮추고, 수동적 순응성을 통해 다양한 물체 형상에 자연스럽게
      적응하는 능력이 뛰어납니다.
  - question: 로봇손 파지 성능을 평가할 때 Feix taxonomy가 활용되는 주된 이유는?
    choices:
    - 모터 토크 계산을 위해
    - 표준화된 인간 손 파지 형태를 벤치마킹하기 위해
    - 제어 알고리즘의 실행 시간을 측정하기 위해
    - 배터리 소모량을 산출하기 위해
    answer_index: 1
    explanation: Feix taxonomy는 인간의 손이 사용하는 다양한 파지 형태를 분류한 표준으로, 로봇손이 인간과 유사한 dexterous
      manipulation을 수행할 수 있는지 평가하는 척도로 사용됩니다.
  - question: 내구 시험(내구 시험)의 핵심 목적은 무엇입니까?
    choices:
    - 최대 파지력을 측정하기 위해
    - 시스템의 소프트웨어 버그를 찾기 위해
    - 반복적인 작동 시 기구부의 마모 및 결함 발생 여부를 확인하기 위해
    - 데이터 통신 속도를 확인하기 위해
    answer_index: 2
    explanation: 내구 시험은 로봇손을 반복적으로 작동시켜 실제 환경에서 발생할 수 있는 부품 마모, 와이어 풀림 등 잠재적 결함을 사전에
      탐지하고 안정성을 검증하는 데 목적이 있습니다.
  completion_criteria:
  - 실험 데이터가 포함된 파지 성능 분석 보고서 제출
  - 주어진 물체 세트에 대한 파지 성공률 80% 이상 달성
  - 실패 모드 분석을 통해 도출된 적절한 개선 대책 포함
  - 실험 시 발생한 기술적 문제점과 해결 과정을 명확히 기술
