- id: mod3
  slug: structure-fabrication
  phase_id: phase2
  title: 구조물 제작 및 조립
  estimated_hours: 15.0
  prerequisites:
  - mod2
  objectives:
  - 탄소섬유 보강 PC 필라멘트의 물성과 FDM 3D 프린팅 특성을 이해한다.
  - 정밀 로봇 관절 조립을 위한 베어링 공차 관리 및 열압입 인서트 체결법을 습득한다.
  - 동적 하중을 견디는 고강도 Dyneema 텐던의 올바른 장착과 고정 원리를 학습한다.
  - 정밀 조립 과정에서의 공차 누적과 구조적 안정성을 검증하는 방법을 배운다.
  theory_markdown: '## 구조용 고성능 필라멘트와 FDM 공정

    5지 로봇손과 같은 정밀 구조물 제작에는 높은 강성과 내열성을 갖춘 엔지니어링 필라멘트가 필수적입니다. 탄소섬유가 보강된 PC(Polycarbonate)
    필라멘트(PC-CF)는 치수 안정성이 우수하며 열팽창 계수가 낮아 정밀 조립에 적합합니다 [S20]. FDM 출력 시 경화강 노즐을 사용하여
    마모를 방지해야 하며, 적정 베드 온도(110 °C)와 노즐 온도(285 °C)를 준수하여 층간 결합력을 확보해야 합니다 [S20].


    ## 베어링과 샤프트의 공차 최적화

    회전축은 로봇 손의 정밀도와 직결됩니다. 무급유 폴리머 슬리브 베어링(JSM-0810-10)은 8 mm 정밀 샤프트와 호환되도록 설계되었습니다
    [S18, S19]. 이러한 베어링은 압입(Press-fit) 방식으로 하우징에 장착되며, 장착 후 내경이 조절되므로 하우징 보어의 정밀한
    공차 관리가 중요합니다 [S18].


    ## 열압입 인서트와 체결

    반복적인 분해와 조립이 필요한 구조에는 황동 열압입 나사산 인서트를 사용합니다. M3 규격의 인서트를 PC-CF 출력물에 체결할 때는 4.0
    mm 파일럿 홀이 필요하며, 열을 가해 인서트를 삽입함으로써 출력물과의 견고한 기계적 결합을 형성합니다 [S22].


    ## 고강도 텐던 구동 원리

    Dyneema SK78 섬유는 매우 낮은 작동 신율(<1%)과 높은 파단 하중(230 daN)을 제공하여 강철 케이블의 우수한 대체재입니다
    [S17]. 정밀한 텐던 장력을 유지하려면 액추에이터의 캡스턴 모서리를 라운딩 처리하여 마찰에 의한 파손을 방지해야 합니다.'
  worked_examples:
  - '예제 1: PC-CF 출력물에 인서트 장착. 4.0 mm 직경의 파일럿 홀을 CAD로 설계하고, 5.8 mm 길이의 황동 인서트를 열압입하여
    캡스크루 체결 시 나사산이 뭉개지지 않는지 확인한다 [S21, S22].'
  - '예제 2: 베어링과 샤프트의 공차 계산. JSM-0810-10 베어링은 8 mm 샤프트와 조립 시, 하우징에 장착된 후 내경이 정상적인 회전을
    수행할 수 있도록 조립 상태의 유격을 멀티미터(물리적 치수 측정 도구 대체)를 사용하여 확인한다 [S18, S19].'
  lab:
    title: 로봇 관절 정밀 조립 및 정렬 실습
    steps:
    - FDM 프린터로 출력된 손가락 링크와 손바닥 프레임의 서포트를 제거하고 표면을 정돈한다.
    - 4.0 mm 파일럿 홀에 열압입 인서트를 수직으로 삽입한다.
    - 폴리머 슬리브 베어링을 8 mm 샤프트와 함께 조립하여 회전축 유격을 점검한다.
    - Dyneema SK78 텐던을 액추에이터 캡스턴에 감고 정격 텐션으로 고정한다.
    - M3 캡스크루를 사용하여 링크와 센서 브래킷을 체결한다.
    safety:
    - 경화강 노즐 작업 및 인서트 열압입 시 고온 화상에 주의하고 장갑을 착용한다.
    - 절단 작업 시 반드시 보안경을 착용한다.
    - 전원 인가 전 모든 전원 어댑터 분리를 확인하고 무전원 상태를 멀티미터로 검측한다.
    - 전원 공급 분기별 독립 퓨즈 장착 상태를 반드시 확인한다.
    deliverables:
    - 조립 완료된 5지 로봇손 구조물
    - 베어링 회전 유격 및 인서트 체결 검증 사진
    - 텐던 장력 고정 및 정렬 기록서
  assignment:
    title: 로봇 구조 설계 및 조립 정밀도 평가
    deliverables:
    - 완성된 로봇 손의 조립 정밀도를 분석한 기술 보고서
    - 최종 CAD 파일 및 조립 도면
    - 텐던 장력 유지 및 구조 강성 시험 결과서
    rubric:
    - PC-CF 출력물의 품질과 파일럿 홀 규격 준수 여부(40%)
    - 인서트와 캡스크루 체결의 견고성 및 정렬 상태(30%)
    - 회전축 베어링의 유격 관리 및 텐던 장력 유지 성능(30%)
  quiz:
  - question: PC-CF 소재 출력 시 경화강 노즐이 권장되는 이유는 무엇입니까?
    choices:
    - 탄소섬유의 연마성으로 인해 황동 노즐이 쉽게 마모되기 때문
    - PC-CF 필라멘트의 녹는점이 황동의 녹는점보다 높기 때문
    - 경화강 노즐이 필라멘트의 강도를 더 높여주기 때문
    - PC-CF 필라멘트의 유동성을 개선하기 때문
    answer_index: 0
    explanation: 탄소섬유는 연마성이 강해 황동 노즐을 마모시키므로, 내마모성이 있는 경화강 노즐 사용이 필수적입니다 [S20].
  - question: Dyneema SK78 텐던의 주요 특징으로 옳은 것은?
    choices:
    - 높은 신율(10% 이상)로 충격 흡수에 유리하다
    - 파단 하중이 낮아 저하중용으로만 사용된다
    - 낮은 작동 신율(<1%)과 높은 파단 하중을 가진다
    - 반복적인 구부림에 매우 약해 일회성으로 사용된다
    answer_index: 2
    explanation: Dyneema SK78은 낮은 신율과 매우 높은 파단 하중을 갖추어 기술적 구동 텐던으로 적합합니다 [S17].
  - question: 무급유 폴리머 슬리브 베어링(JSM-0810-10)의 조립 원리로 올바른 것은?
    choices:
    - 하우징에 압입하면 베어링의 내경이 조절되어 샤프트와 맞춰진다
    - 하우징을 베어링보다 크게 설계하여 헐거운 상태로 유지한다
    - 사용 전 베어링 내부를 오일로 완벽하게 윤활해야 한다
    - 샤프트의 직경을 베어링 내경보다 1 mm 크게 설계해야 한다
    answer_index: 0
    explanation: 이 베어링은 압입 방식으로 조립하며, 하우징 보어에 맞게 장착되면서 내경이 조절되는 구조입니다 [S18].
  completion_criteria:
  - 구조물 조립 완료 및 인서트 체결 성공
  - 회전축 유격 시험을 통해 베어링 작동 적절성 확인
  - 텐던 구동 정렬 확인 및 장력 고정 완료
  - 조립 정밀도 평가 보고서 제출
  source_ids:
  - S20
  - S21
  - S22
  - S18
  - S19
  - S17
- id: mod4
  slug: transmission-assembly
  phase_id: phase2
  title: 전달계 및 베어링
  estimated_hours: 10.0
  prerequisites:
  - mod3
  objectives:
  - 로봇 손의 기구적 동력을 효율적으로 전달하기 위한 텐던 구동 원리를 이해한다.
  - 베어링과 샤프트의 공차 해석 및 조립을 통해 회전 마찰을 최소화하는 설계 기술을 습득한다.
  - 고강도 Dyneema 섬유 텐던의 물리적 특성과 정밀 절단 및 고정 기법을 학습한다.
  theory_markdown: '### 1. 텐던 구동 원리

    5지 로봇 손과 같이 소형 공간에 구동기를 배치해야 하는 경우, 모터의 회전력을 텐던(Tendon, 인공 힘줄)을 통해 원격지의 관절로 전달하는
    방식이 필수적입니다 [S17]. 텐던은 반복적인 인장 하중을 견뎌야 하며, 신율(stretch)이 낮아야 제어 정밀도를 유지할 수 있습니다.
    본 설계에서는 Dyneema SK78 고강도 섬유를 사용하며, 작동 신율이 1% 미만으로 매우 안정적인 전달 특성을 가집니다 [S17].


    ### 2. 마찰과 베어링 선정

    로봇 관절의 회전 효율은 마찰력에 의해 결정됩니다. 무급유 폴리머 슬리브 베어링(JSM-0810-10)은 자기 윤활 특성이 있어 별도의 오일링
    없이도 낮은 마찰 계수를 유지하며, 먼지가 많은 환경에서도 오염을 최소화할 수 있습니다 [S18]. 베어링 조립 시에는 내경(8mm)과 샤프트(AWMP-08,
    8mm) 사이의 공차를 고려하여, 프레스 핏(press-fit) 후 내경이 규격대로 유지되도록 설계해야 합니다 [S18, S19].


    ### 3. 구조적 강성 확보

    로봇 손의 프레임과 링크는 PC-CF(탄소섬유 보강 폴리카보네이트)를 사용하여 높은 강성과 치수 안정성을 확보합니다 [S20]. 특히 나사
    체결부에는 황동 인서트(HTBI-M3-BR)를 열압입하여, 반복적인 분해 조립에도 나사산이 뭉개지지 않도록 설계합니다 [S22].'
  worked_examples:
  - '예제 1: 텐던의 파단 하중 계산. Dyneema SK78(1.5mm) 라인의 파단 하중이 230 daN(약 230kgf)입니다 [S17].
    안전율을 5로 설정할 경우, 텐던에 가할 수 있는 최대 인장력은 46 daN(약 46kgf) 이내로 제한해야 합니다.'
  - '예제 2: 베어링 끼움 맞춤. JSM-0810-10 베어링은 내경이 8mm인 샤프트와 호환됩니다 [S18]. 조립 시 샤프트의 절단 길이
    공차(+/- 1mm)를 감안하여 관절 하우징의 깊이를 최소 12mm 이상 여유 있게 확보해야 축의 간섭을 방지할 수 있습니다 [S19].'
  lab:
    title: 전달계 조립 및 마찰 시험
    steps:
    - PC-CF 출력물 하우징에 M3 황동 인서트를 인두기로 열압입하여 장착합니다 [S22].
    - JSM-0810-10 베어링을 관절 하우징에 프레스 핏으로 압입합니다 [S18].
    - 8mm 정밀 알루미늄 샤프트를 관절 축에 삽입하여 베어링과의 유격(play)을 멀티미터의 도통 시험이 아닌 물리적 움직임으로 확인합니다
      [S19].
    - Dyneema 텐던 라인을 캡스턴에 감고 적절한 텐션을 부여하여 관절의 가동 범위를 확보합니다 [S17].
    safety:
    - 인두기 사용 시 화상 주의 및 화재 방지를 위해 보안경을 착용합니다.
    - 텐던 장력 시험 중 라인이 파단되어 튀어 오를 수 있으므로 반드시 작업용 보안경을 착용합니다.
    - 전원 인가 전 모든 기계적 조립을 완료하고, 무부하 상태에서만 구동 시험을 수행합니다.
    deliverables:
    - 조립된 손가락 관절 유닛
    - 베어링-샤프트 유격 측정 결과 데이터
    - 텐던 장력 시험 결과 보고서
  assignment:
    title: 로봇 손 전달계 설계 및 검증
    deliverables:
    - 조립 도면 및 부품 리스트(BOM)
    - 관절 마찰 감소를 위한 베어링 장착 상세 단면도
    - 반복 동작에 따른 텐던 신율 측정 최종 보고서
    rubric:
    - 전달계 조립 도면의 규격이 명시된 부품 사양과 일치하는가?
    - 베어링과 샤프트의 공차 처리가 기술 문서의 가이드를 따르는가?
    - 텐던 고정 방식이 파단 하중을 고려하여 적절히 설계되었는가?
  quiz:
  - question: Dyneema SK78 텐던 라인의 주요 특징은 무엇인가?
    choices:
    - 높은 신율과 유연성
    - 1% 미만의 낮은 신율과 고강도
    - 금속보다 높은 마찰 계수
    - 습기 흡수율이 높음
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 매우 낮고 인장 강도가 높아 정밀한 전달이 가능합니다 [S17].
  - question: JSM-0810-10 슬리브 베어링의 장점으로 옳은 것은?
    choices:
    - 지속적인 오일 주입 필요
    - 고하중 환경에서만 사용 가능
    - 무급유 구조로 유지보수 용이
    - 금속 샤프트와 전기적 도통 상태 유지
    answer_index: 2
    explanation: igus사의 iglide J 베어링은 무급유 운전이 가능하며 자기 윤활 특성을 가져 유지보수가 쉽습니다 [S18].
  - question: PC-CF 출력물에 반복 체결이 가능하도록 돕는 부품은?
    choices:
    - 일반 나사 직접 체결
    - 황동 열압입 인서트
    - 접착제
    - 금속 링
    answer_index: 1
    explanation: 황동 인서트를 열압입하면 반복적인 분해 조립에도 강한 나사산 체결력을 유지할 수 있습니다 [S22].
  completion_criteria:
  - 5지 로봇 손의 관절 유닛 조립이 기구 도면과 일치함.
  - 베어링 회전축의 유격이 기술 가이드 범위를 벗어나지 않음을 확인.
  - 텐던의 장력 시험을 완료하고 안전율이 준수됨을 보고서로 제출함.
  source_ids:
  - S17
  - S18
  - S19
  - S20
  - S22
- id: mod5
  slug: wiring-power
  phase_id: phase2
  title: 전원 및 배선 시스템
  estimated_hours: 10.0
  prerequisites:
  - mod4
  objectives:
  - DYNAMIXEL 스마트 액추에이터 구동을 위한 독립 전원 분기 회로 설계 원리를 이해한다.
  - 과전류 보호를 위한 ATOF 퓨즈 적용과 안전한 배선 분리 방법을 습득한다.
  - OpenCR 제어 보드를 활용하여 센서 및 액추에이터 전원 도메인을 안전하게 격리한다.
  - FSR 402 센서 신호 취득을 위한 3.3V 분압 회로 설계 및 조립 방식을 배운다.
  theory_markdown: '### 전원 도메인 격리와 배선 원리

    로봇 손 시스템은 12V 고전류 액추에이터 구동 도메인과 3.3V 저전류 센서·제어 도메인으로 나뉩니다 [S14]. 11개의 XM430-W350-T
    액추에이터는 스톨 상태에서 합계 약 25.3A의 피크 전류를 소비하므로 [S12], 단일 전원 공급은 위험합니다. 시스템은 3개의 독립적인
    12V 11.5A 절연형 전원 어댑터를 활용하여 4대/4대/3대씩 전력을 분산 공급합니다 [S16].


    ### 분기별 과전류 보호 (OCP)

    각 전원 분기에는 10A ATOF 퓨즈를 배치하여 [S25], 배선 결함 발생 시 과전류로부터 시스템을 보호합니다 [S24]. 퓨즈는 11.5A
    전원 공급 한도 내에서 동작하며, 정상 운전 시의 피크 합계인 9.2A 이하에서 안정적으로 동작하도록 설계되었습니다 [S16, S25].


    ### 센서 데이터 취득 회로

    FSR 402는 압력에 따라 저항이 감소하는 박막 센서입니다 [S13]. 이를 OpenCR의 12비트 ADC로 측정하기 위해 10kΩ 저항을
    사용하는 전압 분압 회로를 구성합니다 [S14, S26]. 이때 회로는 반드시 OpenCR의 3.3V 센서 전원 레일에서 공급받아야 하며,
    액추에이터의 12V 전원과 전기적으로 분리되어야 합니다 [S14].'
  worked_examples:
  - '퓨즈 정격 계산: 1개 분기(4대 액추에이터)의 피크 전류는 4 * 2.3A = 9.2A입니다 [S12]. 10A ATOF 퓨즈 정격은 9.2A보다는
    크고 전원 어댑터 출력 한계인 11.5A보다는 낮아, 과부하 방지 및 배선 보호에 적합합니다 [S16, S25].'
  - '센서 전압 계산: FSR 저항이 Rs일 때, OpenCR ADC 입력 전압 Vout = 3.3V * (10kΩ / (Rs + 10kΩ))입니다
    [S14, S26]. 센서 저항이 변함에 따라 0~3.3V 범위 내에서 전압이 변화하여 신호를 취득합니다.'
  lab:
    title: 전원 분기 및 센서 인터페이스 조립
    steps:
    - 각 전원 어댑터의 양(+) 출력선에 ATOF 인라인 퓨즈 홀더를 납땜하고 10A 퓨즈를 삽입한다 [S24, S25].
    - 각 어댑터 분기별로 Micro-Fit 3.0 커넥터를 사용하여 액추에이터 하네스를 연결한다 [S15].
    - OpenCR의 3.3V 센서 단자와 10kΩ 저항, FSR 402를 사용하여 분압 회로를 브레드보드 또는 전용 PCB에 구현한다 [S14,
      S26].
    - 멀티미터를 사용하여 각 퓨즈 분기 및 센서 전원 단자가 독립적으로 격리되었는지 확인한다.
    safety:
    - 작업 중 반드시 충격 방지 보안경을 착용한다.
    - 전원 인가 전 3개의 어댑터 출력이 절대 병렬 연결되지 않았는지 물리적으로 확인한다.
    - 정비 또는 접근 전 3개의 전원 어댑터를 물리적으로 분리하고, 멀티미터 DC 전압 모드로 각 분기가 1V 이하임을 확인한다.
    - 절대 저항 또는 연속성(비프음) 모드를 무전원 상태 확인 목적으로 사용하지 않는다.
    deliverables:
    - 각 전원 분기별 전압 측정 결과 기록
    - 센서 분압 회로 조립 사진
    - 독립 분기 배선도
  assignment:
    title: 배선 안전성 검증 보고서
    deliverables:
    - 시스템 배선도 (전원 분기, 퓨즈 위치, 액추에이터 할당 포함)
    - 전원 차단 확인 프로토콜 절차서
    rubric:
    - 전원 도메인 분리 원리가 배선도에 명확히 표현되었는가?
    - 퓨즈 정격 선정 근거가 스톨 전류 사양을 바탕으로 제시되었는가?
    - 안전 수칙에 명시된 무전원 계측 절차가 포함되었는가?
  quiz:
  - question: 각 전원 어댑터의 12V 양(+) 출력을 병렬로 연결하는 것은 왜 금지되는가?
    choices:
    - 전압 효율이 저하되기 때문이다.
    - 절연 분기 시스템의 과전류 보호 및 고장 격리 기능을 상실하기 때문이다.
    answer_index: 1
    explanation: 독립 분기는 각 회로의 과전류 보호와 고장 격리를 보장하며, 출력을 합치면 한쪽 회로의 과전류가 전체 시스템으로 파급될
      위험이 있습니다.
  - question: OpenCR 제어기에서 FSR 센서 전원을 공급받을 때 적절한 전압 레일은 무엇인가?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    answer_index: 1
    explanation: OpenCR의 ADC는 0-3.3V 범위에서 동작하며, 센서 정밀도와 제어기 보호를 위해 반드시 3.3V 센서 전원을
      사용해야 합니다.
  completion_criteria:
  - 전원 분기 조립 완료 및 각 출력 전압 12V 내외 확인
  - 센서 분압 회로 구성 및 OpenCR ADC 신호 변화 확인
  - 전원 분리 확인 절차 숙지 및 보고서 제출
  source_ids:
  - S15
  - S16
  - S24
  - S14
  - S12
  - S25
  - S13
  - S26
- id: mod6
  slug: controller-setup
  phase_id: phase3
  title: 제어기 및 센서 인터페이스
  estimated_hours: 15.0
  prerequisites:
  - mod5
  objectives:
  - OpenCR 제어 보드의 아키텍처와 DYNAMIXEL 인터페이스를 이해한다.
  - FSR 402 센서를 활용한 전압 분압 회로를 설계하고 OpenCR ADC로 힘 데이터를 취득한다.
  - 정밀 파지 제어를 위한 센서 데이터 필터링 기초를 습득한다.
  theory_markdown: '### 제어기 아키텍처: OpenCR

    본 프로젝트의 핵심 제어기인 OpenCR 1.0은 216MHz의 고속 CPU를 탑재하여 액추에이터 명령과 센서 데이터를 동시에 처리합니다 [S14].
    특히, 별도의 통신 브리지 없이 DYNAMIXEL TTL 및 RS-485 포트를 내장하고 있어 통신 지연을 최소화하고 시스템 재현성을 높입니다
    [S14].


    ### FSR 센서와 전압 분압 회로

    FSR(Force Sensing Resistor) 402는 가해지는 힘이 증가함에 따라 저항이 감소하는 압력 가변 저항 센서입니다 [S13].
    이 센서를 디지털 제어기에서 읽기 위해 전압 분압 회로를 사용합니다.


    OpenCR의 ADC는 0~3.3V 범위를 지원합니다 [S14]. FSR 센서의 저항($R_{FSR}$)과 기준 저항($R_{FIX} = 10k\Omega$
    [S26])을 조합하여 다음과 같이 전압을 분압합니다:

    $$V_{out} = V_{ref} \times \frac{R_{FIX}}{R_{FSR} + R_{FIX}}$$

    여기서 $V_{ref}$는 OpenCR의 3.3V 센서 전원 레일입니다. 이 신호는 12비트 ADC를 통해 0~4095의 디지털 값으로 변환됩니다
    [S14].'
  worked_examples:
  - '예제 1: OpenCR ADC값 계산. FSR에 5N의 힘이 가해져 $R_{FSR}$이 2kΩ이 되었다면, $V_{out} = 3.3V \times
    (10k\Omega / (2k\Omega + 10k\Omega)) = 2.75V$가 출력됩니다. 이를 12비트 ADC로 변환하면 $2.75V
    / 3.3V \times 4095 \approx 3412$의 값이 측정됩니다.'
  - '예제 2: 안전 설계 확인. FSR 전압 분압 회로는 반드시 3.3V 센서 전원 레일에 연결되어야 합니다. 12V 액추에이터 전원이나 5V
    전원을 사용할 경우 ADC 입력 범위를 초과하거나 제어기가 손상될 수 있으므로 주의해야 합니다.'
  lab:
    title: FSR 힘 센서 인터페이스 구축
    steps:
    - OpenCR 보드의 3.3V 센서 전원 핀을 확인합니다.
    - FSR 402 센서의 한쪽 단자와 10kΩ 저항을 연결하고, 저항의 나머지 단자를 GND에 연결합니다.
    - FSR과 저항이 만나는 지점(분압점)을 OpenCR의 ADC 핀에 연결합니다.
    - 멀티미터를 DC 전압 모드로 설정하고 연결부의 전압이 0~3.3V 범위 내에 있는지 측정합니다.
    - PC를 연결하여 OpenCR의 ADC 데이터 스트리밍 코드를 실행하고 힘 변화에 따른 값을 확인합니다.
    safety:
    - 모든 회로 수정은 3개의 독립 전원 어댑터를 물리적으로 분리한 무전원 상태에서 수행합니다.
    - 회로 연결 완료 후 반드시 멀티미터 DC 전압 모드로 측정하여 3.3V 라인에 12V가 유입되지 않았는지 확인합니다.
    - 배선 접근 전 모든 전원 분기 전압이 1V 미만임을 반드시 계측기로 확인합니다.
    deliverables:
    - 회로 연결도
    - 센서 힘-ADC값 데이터 표(최소 5개 지점)
    - 측정된 센서 분압점의 DC 전압값 기록
  assignment:
    title: 센서 데이터 필터링 알고리즘 설계
    deliverables:
    - FSR 센서 데이터를 노이즈로부터 보호하기 위한 단순 이동 평균(SMA) 필터 구현 코드
    - 필터 적용 전후의 데이터 파형을 비교한 최종 보고서
    rubric:
    - 필터링 알고리즘이 샘플 데이터를 정상적으로 처리하는가?
    - 3.3V 센서 전원 및 회로 격리 원칙을 준수했는가?
    - 데이터 표와 측정이 정확하게 작성되었는가?
  quiz:
  - question: OpenCR 1.0에서 FSR 센서의 전압 분압 회로를 위해 반드시 사용해야 하는 전원 레일은 무엇입니까?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    - 5V 전원
    - AC 220V
    answer_index: 1
    explanation: OpenCR의 ADC 입력은 3.3V를 기준으로 동작하며, 12V나 5V는 회로 손상을 유발합니다.
  - question: FSR 센서와 함께 사용되는 10kΩ 저항의 역할은 무엇입니까?
    choices:
    - 전류를 무한대로 제한
    - 전압 분압 회로의 기준 저항
    - 액추에이터 속도 제어
    - 통신 종단 저항
    answer_index: 1
    explanation: FSR은 저항값만 변하므로, 전압 신호로 변환하기 위해 10kΩ 고정 저항과 직렬로 연결하여 전압을 분압합니다.
  completion_criteria:
  - OpenCR과 FSR 센서의 물리적 인터페이스 구축 완료
  - ADC 핀에서 0~3.3V 범위의 전압 신호 정상 측정
  - 실습 안전 지침을 준수하며 각 전원 어댑터별 무전원 상태 계측 완료
  source_ids:
  - S13
  - S14
  - S26
- id: mod7
  slug: actuator-integration
  phase_id: phase3
  title: 액추에이터 통합
  estimated_hours: 10.0
  prerequisites:
  - mod6
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 하드웨어 특성과 제어기 연결 방식을 이해한다.
  - OpenCR 제어 보드와 액추에이터 간의 통신 및 전원 분리 구조를 숙지한다.
  - FSR 센서와 분압 회로를 사용하여 정밀한 힘 피드백 시스템을 구성한다.
  - 전기 회로의 안전한 배선 및 과전류 보호 장치(퓨즈)의 역할을 확인한다.
  theory_markdown: '### 액추에이터와 제어기 통합

    본 로봇손은 ROBOTIS DYNAMIXEL XM430-W350 스마트 액추에이터 11대를 기반으로 구동됩니다[S12]. 각 액추에이터는 12
    V 전압에서 작동하며, 스톨 전류는 2.3 A입니다[S12]. 통합 제어를 위해 OpenCR 1.0 제어 보드를 사용하며, 이는 DYNAMIXEL과
    직접 통신할 수 있는 TTL 및 RS-485 포트를 내장하고 있어 별도의 브리지 회로 없이 안정적인 제어가 가능합니다[S14].


    ### 전원 분기 및 보호

    11대 액추에이터의 피크 전류 합계는 약 25.3 A에 달합니다. 이를 위해 138 W 정격의 절연형 12 V 전원 어댑터 3개를 사용하며,
    각각 액추에이터를 4대, 4대, 3대로 분산 배치합니다[S16]. 각 어댑터의 양(+) 출력 단자에는 10 A ATOF 퓨즈를 인라인 홀더와
    함께 배치하여 과전류 발생 시 회로를 보호합니다[S24, S25]. 어댑터 출력 간의 전위차로 인한 사고를 방지하기 위해, 각 출력 분기는
    절연 상태를 유지하며 절대 서로 연결하지 않습니다.


    ### 센서 인터페이스

    손끝 힘 감지를 위해 FSR 402 센서를 사용하며, 센서의 저항은 인가되는 압력에 따라 감소합니다[S13]. 이를 디지털 값으로 변환하기
    위해 10 kΩ 저항을 사용하여 전압 분압 회로를 구성합니다[S26]. OpenCR 보드의 ADC 포트는 0~3.3 V 범위의 전압을 인식하므로,
    FSR 회로 구동 시 반드시 보드의 3.3 V 센서 레일 전원을 사용해야 합니다[S14].'
  worked_examples:
  - '액추에이터 피크 전류 계산: 액추에이터 1대당 스톨 전류가 2.3 A이므로, 4대 분기 시 최대 피크 전류는 9.2 A입니다. 이는 10
    A 퓨즈의 정격 내에 있으므로 안전합니다[S12, S25].'
  - 'FSR 분압 회로 설계: FSR 센서와 10 kΩ 분압 저항을 직렬 연결하고 3.3 V 전원을 인가합니다. FSR 저항이 0이 될 때 출력
    전압은 최대 3.3 V가 되어 ADC의 입력 범위를 초과하지 않고 정밀한 취득이 가능합니다[S13, S14].'
  lab:
    title: 로봇손 액추에이터 및 센서 통합
    steps:
    - OpenCR 보드와 DYNAMIXEL 액추에이터를 통신 케이블로 연결합니다.
    - 12 V 전원 어댑터 3개를 4대, 4대, 3대 액추에이터 분기에 각각 배선합니다.
    - 각 분기의 (+) 라인에 ATO 인라인 퓨즈 홀더를 사용하여 10 A 퓨즈를 설치합니다.
    - FSR 402 센서를 OpenCR 보드의 3.3 V 센서 레일 및 ADC 핀에 연결하여 전압 분압 회로를 구성합니다.
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기의 전압이 12 V(±0.5 V 이내)인지 확인합니다.
    safety:
    - 실습 중 보안경을 반드시 착용합니다.
    - 전원 인가 전 모든 회로의 극성과 단락 여부를 멀티미터로 반드시 확인합니다.
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
    - 전원이 연결된 상태에서 회로를 변경하거나 액추에이터 단자를 만지지 않습니다.
    - 모든 배선 작업은 전원을 완전히 차단하고 1 V 이하의 잔류 전압임을 확인한 후 수행합니다.
    deliverables:
    - 각 분기별 전압 측정 데이터 기록
    - 센서-제어기 배선 완료 사진
    - 정상 작동 확인을 위한 펌웨어 통신 테스트 결과
  assignment:
    title: 액추에이터 통합 설계 및 안전 검토
    deliverables:
    - 3개 전원 분기의 배분 설계도
    - FSR 센서와 ADC 연결 회로도
    - 과전류 보호를 위한 퓨즈 정격 선정 근거 보고서
    rubric:
    - 전원 분리 및 퓨즈 보호 규정을 BOM 시스템 사양에 맞게 준수하였는가?
    - FSR 센서 구동 전압이 3.3 V 레일로 명확히 설계되었는가?
    - 독립적인 전원 어댑터 배선이 병렬 연결 없이 올바르게 구성되었는가?
  quiz:
  - question: DYNAMIXEL XM430-W350 액추에이터의 스톨 전류는 얼마입니까?
    choices:
    - 1.0 A
    - 2.3 A
    - 4.1 A
    - 10.0 A
    answer_index: 1
    explanation: 데이터시트에 명시된 XM430-W350의 스톨 전류는 2.3 A입니다[S12].
  - question: OpenCR ADC 회로 구성 시 FSR 센서 구동 전원으로 적절한 것은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - 3.3 V 센서 전원 레일
    - 외부 24 V 전원
    answer_index: 2
    explanation: OpenCR의 ADC는 0~3.3 V 입력을 지원하므로 3.3 V 센서 레일을 사용해야 합니다[S14].
  - question: 각 전원 분기에 10 A 퓨즈를 사용하는 주된 목적은?
    choices:
    - 전압을 12 V로 유지하기 위해
    - 액추에이터의 스톨 토크를 높이기 위해
    - 과전류 발생 시 회로 배선을 보호하기 위해
    - 통신 속도를 향상시키기 위해
    answer_index: 2
    explanation: 퓨즈는 과전류 발생 시 전류를 차단하여 배선 및 부품의 물리적 손상을 방지하기 위해 사용됩니다[S24, S25].
  completion_criteria:
  - 각 전원 분기의 12 V 출력 상태를 확인하고 기록을 완료함
  - FSR 센서가 OpenCR ADC를 통해 올바른 범위의 힘 데이터를 출력함
  - 3개 전원 분기가 물리적으로 분리되어 있음을 확인 완료함
  source_ids:
  - S12
  - S14
  - S16
  - S24
  - S25
  - S13
  - S26
- id: mod8
  slug: firmware-control
  phase_id: phase3
  title: 펌웨어 개발 및 제어 알고리즘
  estimated_hours: 10.0
  prerequisites:
  - mod7
  objectives:
  - DYNAMIXEL Protocol 2.0을 이해하고 C++ 기반 제어기를 작성한다.
  - OpenCR ADC를 사용하여 FSR로부터 힘 데이터를 수집하고 정규화한다.
  - 센서 피드백을 기반으로 한 간단한 파지 알고리즘을 구현한다.
  - 실시간 제어 루프에서 안전한 상태 기계(State Machine)를 운영한다.
  theory_markdown: '### 펌웨어 아키텍처 및 제어 루프

    로봇 손의 펌웨어는 실시간으로 액추에이터 상태를 읽고, 센서 입력을 처리하며, 명령을 실행하는 유한 상태 기계(FSM) 구조를 가져야 합니다.
    본 프로젝트의 제어기는 DYNAMIXEL Protocol 2.0을 사용하여 11개의 `XM430-W350-T` 액추에이터와 통신합니다 [S12].
    OpenCR은 216MHz의 CPU 주파수를 활용하여 제어 루프를 고속으로 유지할 수 있습니다 [S14].


    ### 센서 데이터 취득 및 신호 처리

    손끝에 배치된 `FSR 402`는 누르는 힘에 따라 저항이 변하는 비선형 소자입니다 [S13]. 이를 3.3V 센서 전원과 10kΩ 저항을
    사용한 전압 분압 회로로 연결하여 OpenCR의 12비트 ADC 입력을 통해 전압으로 취득합니다 [S14, S26]. 취득된 값은 노이즈 제거를
    위한 이동 평균 필터를 거친 뒤, 보정치를 적용하여 실제 파지력(0~20N)으로 변환해야 합니다 [S13].


    ### 파지 제어 알고리즘

    언더액추에이티드(Underactuated) 시스템에서는 텐던의 장력이 전체 관절의 모멘트를 결정합니다 [S9, S17]. 파지 명령 발생 시,
    액추에이터는 위치 제어 모드에서 전류(토크) 기반 제한 모드로 전환하여 대상물을 부드럽게 감싸야 합니다. 전류 피드백을 모니터링하여 설정된
    임계치 도달 시 파지를 정지하는 로직은 기계적 과부하를 방지합니다.'
  worked_examples:
  - 'DYNAMIXEL 위치 제어 예시: `dxl_sdk`를 사용하여 액추에이터 ID 1번에 목표 위치 `512`를 전송합니다. 이때 `Operating
    Mode`가 `Position Control`로 설정되어 있어야 합니다.'
  - 'FSR 전압 분압 계산: 3.3V 전원에서 분압 저항 `10kΩ`을 사용했을 때, ADC값 `v` (0-4095)는 `V_out = (v
    / 4095) * 3.3`으로 계산됩니다. 이 값을 센서 데이터시트의 저항-힘 곡선과 매핑하여 뉴턴(N) 단위로 환산합니다.'
  lab:
    title: 힘 피드백 기반 파지 구현 실습
    steps:
    - OpenCR 1.0 전원을 분리하고, 각 분기 전원 3개가 독립적으로 절연되어 있는지 멀티미터 DC 전압 모드로 확인합니다.
    - FSR 402 센서와 10kΩ 저항을 사용하여 분압 회로를 구성하고 OpenCR ADC 핀에 연결합니다.
    - 실시간 시리얼 모니터를 통해 FSR 출력값이 안정적인지 확인하고, 보정(Calibration)을 통해 접촉 없음 상태의 ADC 기준값을
      설정합니다.
    - 단일 손가락 액추에이터를 무부하 상태에서 토크 제어 모드로 구동하며 전류 변화를 모니터링합니다.
    safety:
    - 전원 인가 중 손을 로봇 손 가동 범위에 넣지 마십시오.
    - 모든 조작은 PC 제어 명령 혹은 고정 지그 위에서 수행하십시오.
    - 계측 및 접근 전 3개의 절연 전원 어댑터를 물리적으로 분리하고, DC 전압 모드에서 각 branch가 1V 미만인지 확인해야 합니다.
    - 충격 방지 작업용 보안경을 착용하십시오.
    deliverables:
    - FSR 센서 보정 결과 보고서
    - 전류 제한 파지 알고리즘 소스 코드
    - ADC 힘 데이터 취득 그래프
  assignment:
    title: 5지 로봇손 파지 제어 프로젝트
    deliverables:
    - 최종 펌웨어 소스 코드
    - 파지 시험 결과 및 데이터 로그
    - 최종 로봇 공학 보고서
    rubric:
    - 펌웨어 구조가 상태 기계로 명확히 분리되었는가?
    - ADC 정규화 과정에서 힘 센서 보정치가 올바르게 적용되었는가?
    - 다양한 물체에 대해 파지 임계치 기반 제어가 안정적으로 작동하는가?
    - 실시간 제어 루프에서 안전(과전류 시 토크 해제) 코드가 포함되었는가?
  quiz:
  - question: FSR 402 센서의 신호를 OpenCR ADC로 읽기 위해 필요한 회로 구성은 무엇입니까?
    choices:
    - 풀업 저항을 연결한 디지털 입력 회로
    - 10kΩ 저항을 사용한 전압 분압 회로
    - 액추에이터 12V를 직접 연결한 회로
    - 전압을 5V로 높여주는 증폭 회로
    answer_index: 1
    explanation: FSR은 저항 변화 소자이므로, 3.3V 센서 전원과 고정 저항(10kΩ)을 이용해 전압 분압기를 구성하여 ADC로
      측정해야 합니다 [S14, S26].
  - question: DYNAMIXEL XM430 액추에이터 제어 시 가장 권장되는 안전 정지 방법은 무엇입니까?
    choices:
    - 전원 어댑터의 퓨즈를 뽑음
    - 소프트웨어적으로 토크 해제(Torque Disable) 명령을 보냄
    - 통신 케이블을 즉시 분리함
    - 멀티미터를 저항 모드로 측정함
    answer_index: 1
    explanation: 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
  completion_criteria:
  - 로봇 손이 피드백을 받아 물체를 잡고 임계치에서 멈춤 확인
  - 펌웨어 코드 내 안전 정지 및 토크 해제 루틴 검증
  - 전원 분기별 독립성 및 무전원 상태 확인(1V 미만) 계측 기록 제출
  source_ids:
  - S9
  - S12
  - S14
  - S13
  - S26
  - S17
- id: mod9
  slug: safety-validation
  phase_id: phase4
  title: 안전 점검 및 파지 시험
  estimated_hours: 5.0
  prerequisites:
  - mod8
  objectives:
  - 5지 로봇손 프로토타입의 전기 안전 수칙을 숙지하고 무전원 상태 확인 절차를 실행한다.
  - 분기별 독립 전원 시스템의 구조와 퓨즈 보호 원리를 이해한다.
  - FSR 센서와 OpenCR 제어기 간의 전압 분압 회로를 올바르게 구성한다.
  - 로봇손의 물리적 동작 및 파지 성능을 안전하게 시험하는 절차를 수행한다.
  theory_markdown: '### 전기 안전 및 시스템 구성

    5지 로봇손 프로토타입은 총 11개의 XM430-W350-T 스마트 액추에이터를 사용하며, 스톨 전류 합계는 25.3 A에 달합니다 [S12].
    시스템 보호를 위해 3개의 독립적인 12 V 전원 분기를 구성하고, 각 분기마다 10 A ATOF 퓨즈를 장착하여 과전류를 방지합니다 [S16,
    S24, S25].


    **중요:** 각 분기의 양(+) 출력은 절대 서로 연결하지 않아야 합니다. 각 전원 어댑터는 할당된 액추에이터 그룹에만 전력을 공급하도록
    물리적으로 분리합니다.


    ### 센서 데이터 취득

    손끝 접촉력 측정을 위해 FSR 402 센서를 사용합니다 [S13]. OpenCR 제어기의 3.3 V 센서 전원 레일을 사용하여 10 kΩ
    저항과 전압 분압 회로를 구성합니다 [S14, S26]. 센서 저항은 가해진 힘에 반비례하며 [S13], 분압된 전압값은 OpenCR의 12-bit
    ADC를 통해 힘 데이터로 변환됩니다 [S14]. 아날로그 신호는 반드시 0~3.3 V 범위 내에 있어야 합니다 [S14].


    ### 안전 시험 원칙

    본 프로토타입은 인증된 산업용 안전 시스템이 아니며, 학습자가 구현한 정지 회로를 실제 안전 장치로 사용해서는 안 됩니다 [S6]. 계획된
    정비나 손을 접근해야 하는 모든 상황에서는 3개의 모든 전원 어댑터를 물리적으로 분리해야 합니다. 멀티미터의 DC 전압 모드를 사용하여 각
    분기가 1 V 미만임을 확인하기 전까지는 부품에 접근하지 마십시오.'
  worked_examples:
  - '예제 1: 분기별 전류 계산. 분기 A에는 액추에이터 4대가 할당되어 있습니다. 스톨 전류 2.3 A * 4 = 9.2 A입니다. 10 A
    퓨즈를 선택하면 9.2 A 피크 동작을 안정적으로 수용하고 과전류 발생 시 배선을 보호할 수 있습니다 [S12, S25].'
  - '예제 2: FSR ADC 변환. 3.3 V 전원에서 10 kΩ 분압 저항과 FSR을 직렬 연결합니다. FSR 저항이 10 kΩ일 때 ADC
    입력은 1.65 V가 되며, 이는 12-bit ADC(0~4095)에서 약 2048의 값을 출력하게 됩니다 [S14, S26].'
  lab:
    title: 안전 확인 및 파지 시험 실습
    steps:
    - 모든 전원 어댑터를 전원에서 분리하고, 각 분기의 커넥터 전압을 멀티미터 DC 전압 모드로 측정하여 1 V 미만인지 확인한다.
    - FSR 센서 5개를 3.3 V 센서 레일 및 ADC 핀에 10 kΩ 저항과 함께 분압 회로로 연결한다.
    - 전원 어댑터 3개를 개별 콘센트에 연결하여 시스템을 기동한다.
    - 무부하 상태에서 소프트웨어 명령을 통해 로봇손의 가동 범위를 점검한다.
    - 시험 지그에 로봇손을 고정하고 안전 보안경을 착용한 후 물체를 파지하며 센서 피드백을 확인한다.
    safety:
    - 반드시 충격 방지 보안경을 착용한다.
    - 전원 인가 중 가동 범위 내에 손을 넣지 않는다.
    - 계측기 연결 시 저항 모드나 연속성 모드를 전원 확인용으로 사용하지 않는다.
    - 이상 발열이나 냄새 발생 시 즉시 모든 어댑터를 물리적으로 분리한다.
    deliverables:
    - 무전원 상태 확인 데이터 (측정 전압)
    - FSR 센서 응답 값 기록
    - 안전 시험 완료 점검표
  assignment:
    title: 안전 설계 보고서 및 파지 실험
    deliverables:
    - 분기별 전력 배분 및 퓨즈 보호 설계 근거 보고서
    - FSR 센서 보정 곡선 데이터 및 파지 성공률 분석
    rubric:
    - 각 전원 분기가 독립적으로 유지되고 병렬 연결되지 않았음을 배선도로 증명해야 함
    - 무전원 상태 확인 절차가 안전 프로토콜에 따라 기록되어야 함
    - FSR 센서 전압 분압 회로가 3.3 V 레일에서만 공급됨을 명시해야 함
  quiz:
  - question: 3개의 12 V 전원 어댑터 분기 출력 전선을 병렬로 연결해도 됩니까?
    choices:
    - 가능하다.
    - 절대 연결해서는 안 된다.
    answer_index: 1
    explanation: 독립된 전원 어댑터의 출력은 병렬로 연결할 수 없으며, 각 분기는 물리적으로 절연된 상태로 유지해야 합니다.
  - question: 로봇손의 전기적 안전 상태를 확인하기 위한 멀티미터 설정으로 올바른 것은?
    choices:
    - DC 전압 모드
    - 연속성(비프음) 모드
    - 저항 모드
    answer_index: 0
    explanation: 안전한 전원 분리를 확인하려면 반드시 DC 전압 모드를 사용하여 전압이 1 V 미만임을 직접 측정해야 합니다.
  - question: FSR 센서 분압 회로 구성 시 권장되는 전원 레일은?
    choices:
    - 12 V 액추에이터 전원
    - OpenCR 3.3 V 센서 레일
    answer_index: 1
    explanation: FSR 아날로그 신호는 3.3 V 센서 전원을 사용하여 OpenCR ADC 입력 범위(0~3.3 V) 내에 머물러야
      합니다.
  completion_criteria:
  - 모든 전원 분기의 무전원 상태 측정값이 1 V 미만임을 확인하여 보고서 제출
  - FSR 센서를 이용한 5개 손가락의 힘 피드백 신호 취득 성공
  - 안전 점검표 작성 완료
