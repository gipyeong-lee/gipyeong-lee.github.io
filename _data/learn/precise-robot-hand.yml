- id: m7
  slug: sensor-integration
  phase_id: phase-2
  title: 센서 장착 및 신호 처리
  estimated_hours: 8.0
  prerequisites:
  - m6
  objectives:
  - FSR 402 센서의 작동 원리와 전압 분압 회로 설계 방법을 이해한다.
  - OpenCR ADC 인터페이스를 통해 힘 데이터를 신뢰성 있게 취득한다.
  - 센서 신호의 노이즈를 제거하고 물리적 힘으로 변환하는 교정 절차를 익힌다.
  - 3.3 V 센서 전원을 독립적으로 사용하여 액추에이터 전압 분기와의 전기적 간섭을 방지한다.
  theory_markdown: '## 힘 감지 센서(FSR) 통합 이론


    FSR(Force Sensing Resistor) 402는 압력에 따라 저항이 감소하는 폴리머 후막 센서입니다 [S13]. 이 센서는 0.2
    N에서 20 N까지의 접촉력을 측정할 수 있으며 [S13], 로봇손의 파지력 피드백을 구현하는 데 핵심적인 역할을 합니다.


    ### 1. 전압 분압 회로 (Voltage Divider)

    OpenCR과 같은 마이크로컨트롤러의 ADC는 전압을 읽습니다. FSR은 가변 저항이므로, 10 kΩ 고정 저항과 FSR을 직렬 연결하여 분압기를
    구성해야 합니다 [S29].

    - **회로 구성**: 3.3 V 센서 전원 --- FSR --- ADC 입력 핀 --- 10 kΩ 저항 --- GND

    - **주의**: OpenCR의 ADC 입력은 반드시 0~3.3 V 범위 내에 있어야 합니다 [S14]. 따라서 5 V나 12 V 액추에이터
    전원을 센서 회로의 전원으로 사용하는 것은 절대 금지되며, 반드시 OpenCR의 3.3 V 센서 전원을 사용해야 합니다 [S14].


    ### 2. 신호 변환 및 교정

    FSR의 저항-힘 관계는 비선형적입니다. 정밀한 파지 제어를 위해서는 다음 과정을 거쳐야 합니다:

    - **데이터 취득**: ADC 값(0-4095)을 읽어 전압으로 변환.

    - **교정**: 알려진 무게의 물체를 손끝에 가하고 ADC 값을 기록하여, ADC 값과 실제 힘(N) 사이의 대응표(Look-up table)를
    작성합니다 [S13].

    - **필터링**: 접촉 시 발생하는 고주파 노이즈를 제거하기 위해 이동 평균 필터(Moving Average Filter)를 적용하는 것이
    일반적입니다.'
  worked_examples:
  - '예제 1: 3.3 V 전원 공급 시 FSR에 5 N의 힘이 가해져 저항이 5 kΩ으로 변했을 때, ADC 핀에 입력되는 전압 계산.

    V_out = V_in * (R_fixed / (R_fsr + R_fixed)) = 3.3 * (10 / (5 + 10)) = 2.2 V.
    12비트 ADC(0-4095)에서 읽히는 예상값은 (2.2 / 3.3) * 4095 = 2730입니다 [S14, S29].'
  - '예제 2: FSR 응답 속도 최적화.

    FSR은 물리적 압력에 대해 즉각 반응하지만 센서 패드 소재의 점탄성으로 인해 이력 현상(Hysteresis)이 발생합니다. 반복 측정 시에는
    동일한 속도로 파지하여 측정 오차를 최소화합니다 [S13].'
  lab:
    title: 손끝 힘 센서 제작 및 신호 취득
    steps:
    - OpenCR 3.3 V 센서 레일과 GND를 브레드보드에 연결합니다 [S14].
    - FSR 402와 10 kΩ 저항을 사용하여 전압 분압 회로를 구성합니다 [S13, S29].
    - ADC 핀에 회로의 중간 지점을 연결하고, 멀티미터로 3.3 V 레일이 유지되는지 확인합니다.
    - OpenCR에 ADC 취득 코드를 업로드하고 센서에 힘을 가하며 Serial Plotter로 신호 변화를 확인합니다.
    - 다양한 무게의 분동을 사용하여 센서 값을 기록하고 교정 데이터를 확보합니다.
    safety:
    - 액추에이터용 12 V 전원과 센서용 3.3 V 전원은 절대로 섞이지 않도록 분리합니다 [S14].
    - 브레드보드 작업 시 단락 여부를 멀티미터로 반드시 확인합니다.
    - 보안경을 착용하고 전원 인가 전 배선도를 재확인합니다.
    deliverables:
    - 완성된 5개 손가락용 FSR 회로 배선 사진
    - 분동 실험을 통해 도출된 힘-ADC 값 교정 데이터 시트
    - 노이즈가 제거된 안정적인 센서 신호 취득 결과물
  assignment:
    title: 힘 센서 파지력 피드백 프로그래밍
    deliverables:
    - 센서 입력 기반 파지력 자동 제어 코드
    - 교정 데이터가 포함된 최종 기술 보고서
    rubric:
    - 3.3 V 전원만 사용하여 ADC 입력을 3.3 V 이하로 유지하였는가?
    - 이동 평균 필터를 적용하여 노이즈를 효과적으로 제거했는가?
    - 센서의 물리적 한계치(0.2 N - 20 N)를 고려한 제어 로직을 구현했는가?
  quiz:
  - question: FSR 402 분압 회로를 구성할 때 전원 공급원으로 올바른 것은?
    choices:
    - 12 V 액추에이터 전원
    - OpenCR 3.3 V 센서 전원
    - 5 V USB 전원
    - 별도의 9 V 배터리
    answer_index: 1
    explanation: OpenCR의 ADC 신호 범위는 0~3.3 V이므로, 반드시 3.3 V 센서 레일을 사용해야 합니다 [S14].
  - question: FSR 402의 저항과 가해지는 힘의 관계는 어떠한가?
    choices:
    - 힘이 증가하면 저항이 증가한다.
    - 힘이 증가하면 저항이 감소한다.
    - 힘과 저항은 아무런 관계가 없다.
    - 힘이 일정하면 저항도 무한대가 된다.
    answer_index: 1
    explanation: FSR은 힘(압력)이 증가할수록 저항이 감소하는 특성을 가집니다 [S13].
  - question: 분압 회로에서 10 kΩ 고정 저항의 역할은 무엇인가?
    choices:
    - FSR 보호 및 전압 분배
    - 전압을 12 V로 승압
    - 액추에이터 전류 제한
    - 통신 신호 필터링
    answer_index: 0
    explanation: 가변 저항인 FSR로부터 마이크로컨트롤러가 읽을 수 있는 전압 값을 얻기 위한 필수 부품입니다 [S29].
  completion_criteria:
  - 손가락별 FSR 회로 제작 완료 및 동작 확인
  - ADC 전압 범위가 0~3.3 V 이내임을 멀티미터로 검증
  - 교정 실험을 통한 힘-데이터 변환 테이블 작성 완료
  - 모든 배선이 안전 규정에 따라 독립적으로 분기됨을 최종 보고
  source_ids:
  - S13
  - S29
  - S14
- id: m8
  slug: controller-firmware
  phase_id: phase-3
  title: 펌웨어 개발 및 제어기 통신
  estimated_hours: 12.0
  prerequisites:
  - m7
  objectives:
  - OpenCR 제어기의 구조와 DYNAMIXEL 통신 프로토콜을 이해한다.
  - 실시간 안전 상태기계(Safety State Machine)를 펌웨어 수준에서 설계한다.
  - FSR 힘 센서의 ADC 데이터를 전압 분압 원리로 변환하여 처리한다.
  - 비상정지 회로와 액추에이터 전원 차단 시스템의 통합 로직을 구현한다.
  theory_markdown: '### 1. DYNAMIXEL 통신과 OpenCR 제어

    OpenCR 1.0은 216MHz ARM Cortex-M7 프로세서를 기반으로 하며, DYNAMIXEL 액추에이터와 직접 통신할 수 있는 내장
    TTL 및 RS-485 포트를 갖추고 있습니다 [S14]. 통신 브리지 없이 직접 연결하여 지연 시간을 최소화하고 재현성을 확보합니다. 로봇
    펌웨어는 ''명령 실행-피드백 수신-안전 상태 판단''의 루프를 실시간으로 반복합니다 [S14].


    ### 2. 센서 데이터 처리 및 FSR 분압 회로

    FSR 402 센서는 인가되는 힘이 증가함에 따라 저항이 감소하는 특성을 가집니다 [S13]. 이를 10kΩ 저항과 함께 직렬 전압 분압기로
    구성하여 OpenCR의 12비트 ADC에 연결합니다 [S13, S14, S29]. ADC 입력 전압은 반드시 0~3.3V 범위를 유지해야 하며,
    5V나 12V 액추에이터 전원과는 전기적으로 분리되어야 합니다 [S14].


    ### 3. 안전 상태기계와 전원 차단 로직

    비상정지(E-Stop) 입력은 A22E 버튼의 NC 접점을 통해 G7SA 안전 릴레이의 DC12 코일을 제어합니다 [S23, S25]. G7SA의
    NO 접점들은 각 전원 분기의 G2R-1-SND 릴레이 코일을 개별 스위칭하며, 최종적으로 EV200 접촉기가 12V 액추에이터 전원 분기를
    무전원화합니다 [S24, S26, S27]. 이 체인은 저전류 제어 신호로 고전류 부하를 안전하게 차단하는 계층 구조를 가집니다 [S26].'
  worked_examples:
  - '예제 1: FSR ADC 값의 힘 변환

    FSR 센서가 10kΩ 저항과 분압기를 형성할 때, ADC 12비트 값(0~4095)을 읽어 힘(N)으로 매핑합니다. 전압 $V_{out}
    = V_{ref} \times (R_{fsr} / (R_{fsr} + R_{fixed}))$. 정밀한 힘 제어를 위해 센서의 데이터시트 비선형
    곡선을 룩업 테이블(LUT)이나 다항식 근사법으로 소프트웨어 보정합니다 [S13, S29].'
  - '예제 2: 안전 릴레이 체인 전류 계산

    A22E 버튼 NC 접점이 구동할 G7SA 코일 전류는 30mA입니다 [S23]. G7SA의 NO 접점이 제어할 G2R 릴레이 코일 전류는
    43.2mA입니다 [S24]. 따라서 A22E와 G7SA는 EV200의 3.8A 돌입전류를 직접 스위칭하지 않으며, 이 계층적 배선은 제어
    회로의 내구성을 보장합니다 [S24, S26].'
  lab:
    title: 안전 제어 로직 구현 및 센서 데이터 수집
    steps:
    - OpenCR에 3.3V 센서 전원을 FSR 분압 회로에 연결하고 ADC 값을 펌웨어로 수신한다 [S14, S29].
    - 비상정지 버튼과 릴레이 체인(A22E → G7SA → G2R → EV200)을 배선도에 따라 결선한다 [S23, S24, S25, S26].
    - 펌웨어에서 비상정지 신호 모니터링 기능을 활성화하고, 상태 변경 시 로그를 기록한다.
    - 실제 전원 차단 테스트를 위해 각 분기의 전압 변화를 멀티미터로 측정한다.
    safety:
    - 모든 회로 결선 후 멀티미터로 단락 여부를 반드시 점검한다.
    - 액추에이터 전원 분기(+)는 절대로 서로 병렬 연결하거나 결합하지 않는다 [S15].
    - 비상정지 테스트 시 로봇손의 움직임으로 인한 끼임 사고에 주의한다.
    - 전류 제한 기능이 있는 벤치 전원을 사용하여 과전류를 방지한다.
    deliverables:
    - FSR 데이터 보정 공식이 포함된 소스 코드
    - 안전 상태기계 실행 로그
    - 비상정지 동작 전후의 분기별 전압 측정 데이터
  assignment:
    title: 로봇손 펌웨어 안전 기능 설계
    deliverables:
    - 안전 상태기계 순서도(Flowchart)
    - 비상정지 로직이 포함된 OpenCR 펌웨어 소스 코드
    - 센서 데이터 기반 파지력 제어 구현 보고서
    rubric:
    - 비상정지 시 릴레이 체인 및 EV200 전원 차단 논리 구현 정확성
    - ADC 데이터를 FSR 입력 범위(0.2~20N)에 맞게 올바르게 보정했는지 여부 [S13]
    - 제어기 전원 회로가 센서 회로와 전기적으로 분리되어 설계되었는지 여부 [S14]
    - 강제 유도 릴레이와 돌입 전류 고려한 릴레이 계층 구성 확인
  quiz:
  - question: OpenCR 제어기에서 FSR 힘 센서 전원을 공급하기 위해 권장되는 전압원은 무엇인가?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    - 5V 범용 전원
    - EV200 코일 전원
    answer_index: 1
    explanation: FSR 분압 회로는 3.3V 센서 전원을 사용해야 하며, ADC 신호가 0~3.3V 범위를 초과하지 않도록 해야 합니다
      [S14].
  - question: 비상정지 입력 시 EV200 접촉기를 직접 스위칭하지 않고 중계 릴레이를 사용하는 이유는?
    choices:
    - 부품 단가를 높이기 위해
    - 액추에이터의 피크 전류를 높이기 위해
    - 비상정지 버튼과 G7SA 접점의 저전류 정격을 보호하기 위해
    - 통신 속도를 향상시키기 위해
    answer_index: 2
    explanation: EV200AAANA 코일은 최대 3.8A의 돌입전류를 발생시키므로, 저전류 안전 릴레이(G7SA, G2R)를 계층적으로
      사용하여 보호해야 합니다 [S23, S24, S26].
  completion_criteria:
  - 비상정지 버튼 작동 시 3개 독립 분기의 EV200 접촉기가 모두 차단됨을 확인(검증 기록 필수).
  - FSR 센서에서 입력되는 0~20N 범위의 힘 데이터를 펌웨어에서 정확히 수신.
  - 모든 배선이 제공된 안전 규격과 단락 방지 원칙을 준수함.
  source_ids:
  - S14
  - S13
  - S29
  - S23
  - S25
  - S24
  - S26
  - S27
  - S15
- id: m9
  slug: grasp-control
  phase_id: phase-3
  title: 파지 제어 알고리즘 구현
  estimated_hours: 8.0
  prerequisites:
  - m8
  objectives:
  - FSR 센서 신호 처리 및 힘 측정 알고리즘을 이해한다.
  - 폐루프 제어를 위한 힘 피드백 루프를 설계한다.
  - 안정적인 파지를 위한 임계값 기반 제어 로직을 구현한다.
  - 센서 신호 노이즈 필터링 및 안정성 확보 방법을 습득한다.
  theory_markdown: "## 파지 제어 원리\n\n파지 제어는 센서에서 들어오는 힘 데이터를 바탕으로 액추에이터의 위치나 전류를 조절하여\
    \ 물체를 안정적으로 잡는 과정입니다. 본 프로젝트에서는 FSR 402 센서를 사용하여 접촉력을 감지합니다 [S13].\n\n### 센서 신호\
    \ 처리\nFSR 센서는 압력이 증가할수록 저항이 감소하는 특성을 가집니다 [S13]. OpenCR 보드의 ADC(12비트)를 사용하여 신호를\
    \ 읽기 위해 10 kΩ 저항을 사용하는 전압 분압 회로를 구성합니다 [S14, S29]. \n\n- 출력 전압 $V_{out} = V_{in}\
    \ \\times \\frac{R_{FSR}}{R_{FSR} + R_{fixed}}$\n- 여기서 $V_{in}$은 3.3 V 센서 전원 레일입니다\
    \ [S14].\n\n### 제어 루프\n안정적인 파지는 다음 단계를 거칩니다.\n1. **입력 취득**: 각 손가락 FSR에서 ADC 값\
    \ 읽기.\n2. **필터링**: 고주파 노이즈 제거를 위한 이동 평균(Moving Average) 필터 적용.\n3. **상태 판단**:\
    \ 측정된 힘이 목표 범위 내인지 확인.\n4. **액추에이터 명령**: DYNAMIXEL XM430-W350-T의 전류 기반 토크 제어 또는\
    \ 위치 제어를 사용하여 텐던 장력 조절 [S12].\n\n### 안전 및 안정성\n절대적인 안전을 위해 하드웨어 기반 비상정지 회로(A22E,\
    \ G7SA, EV200 체인)가 우선합니다 [S25, S23, S26]. 제어 알고리즘은 센서 신호가 범위를 벗어날 경우(케이블 단선 등)\
    \ 즉시 모터의 토크를 0으로 설정하는 안전 모드를 내장해야 합니다."
  worked_examples:
  - '예제 1: 단순 임계값 파지. 센서값이 300(약 2 N) 이상일 때 액추에이터 위치 유지 명령을 내리고, 그 이하일 때 위치를 전진시키는
    로직 구현.'
  - '예제 2: 이동 평균 필터 구현. 최근 5회 샘플의 합을 나누어 노이즈가 심한 FSR 신호 처리하기.'
  lab:
    title: FSR 기반 파지 제어 실습
    steps:
    - OpenCR ADC 핀에 FSR 분압 회로 연결 (3.3 V 센서 레일 사용 확인) [S14].
    - 시리얼 모니터를 통해 FSR 압력에 따른 ADC 데이터 변화 관찰.
    - 간단한 PID 또는 임계값 제어 코드를 작성하여 DYNAMIXEL 액추에이터 구동.
    - 물체를 잡았을 때 센서 신호가 안정되는지 확인하고 필요 시 이동 평균 윈도우 크기 조정.
    safety:
    - 저전압 벤치 전원 사용 및 전류 제한 설정 필수.
    - 끼임 방지를 위해 제어 시작 전 모터 토크 제한 설정.
    - 실습 중 이상 동작 시 즉시 물리적 비상정지 버튼 조작.
    - 보안경 착용.
    deliverables:
    - FSR ADC 데이터 획득 로그.
    - 작성된 파지 제어 펌웨어 코드.
    - 물체 파지 시 센서 피드백 반응 그래프.
  assignment:
    title: 힘 피드백 기반 자동 파지 제어기 구현
    deliverables:
    - 힘 제어 펌웨어 소스 코드.
    - 시스템 안전 상태기계(State Machine) 정의서.
    - 파지 및 해제 성능 시험 보고서.
    rubric:
    - FSR 신호가 노이즈 없이 안정적으로 처리되는가?
    - 물체의 강도에 따라 적절한 힘 제어 반응을 보이는가?
    - 센서 단선 등의 오류 상황에서 모터가 안전하게 멈추는가?
    - 코드의 가독성과 안전 로직의 명확성.
  quiz:
  - question: FSR 센서와 OpenCR ADC를 연결할 때 올바른 전원 레일은?
    choices:
    - 12 V 액추에이터 레일
    - 3.3 V 센서 레일
    - 5 V 외부 전원
    - USB 전원
    answer_index: 1
    explanation: OpenCR의 ADC 입력은 3.3 V를 기준으로 하며, 데이터시트 및 시스템Truth에 따라 3.3 V 센서 레일
      사용이 필수입니다 [S14].
  - question: FSR 신호에 노이즈가 많을 때 사용하는 효과적인 소프트웨어 기법은?
    choices:
    - 가중치 없는 이동 평균 필터
    - 무한 루프 제거
    - 직접적인 전압 강화
    - 센서 교체
    answer_index: 0
    explanation: 이동 평균 필터는 간단하면서도 고주파 신호 노이즈를 효과적으로 제거할 수 있는 방법입니다.
  completion_criteria:
  - FSR 기반 힘 피드백 제어 코드가 성공적으로 빌드됨.
  - 물체 파지 시 센서 신호에 반응하여 모터 동작이 조절됨을 확인.
  - 안전 상태기계가 오류 상황을 탐지하고 제어 루프를 정상적으로 정지함.
