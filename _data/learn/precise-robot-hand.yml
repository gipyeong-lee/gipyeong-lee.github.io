- id: M3
  slug: structural-fabrication
  phase_id: PH2
  title: 3D 프린팅 및 부품 가공
  estimated_hours: 15.0
  prerequisites:
  - M2
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)의 물성과 FDM 3D 프린팅 공정 변수를 이해한다.
  - 로봇 손 구조물의 강성과 조립 정밀도를 확보하기 위한 설계 및 가공 기법을 학습한다.
  - 황동 열압입 인서트(Heat-fix insert)를 이용한 반복 분해·조립 가능한 체결 구조를 설계한다.
  - 무급유 폴리머 베어링과 정밀 축을 활용한 회전축 마찰 및 유격 제어 방법을 익힌다.
  theory_markdown: '### 1. FDM 3D 프린팅과 PC-CF 복합재

    고강성 로봇 손 구조 제작을 위해 탄소섬유가 함유된 PC(Polycarbonate) 필라멘트를 사용한다. PC-CF는 일반 PC보다 열변형
    온도가 높고 치수 안정성이 우수하여 정밀 기구 제작에 적합하다 [S20]. 탄소섬유의 연마성으로 인해 FDM 프린터에는 반드시 경화강(Hardened
    steel) 노즐을 사용해야 하며, 일반 황동 노즐은 빠르게 마모된다 [S20].


    ### 2. 반복 체결을 위한 열압입 인서트(Heat-fix Insert)

    3D 프린팅 출력물은 재질 특성상 나사산을 직접 내는 것이 취약하다. 이를 보완하기 위해 황동 인서트를 가열하여 삽입한다 [S22]. 인서트
    외경과 파일럿 홀 지름의 공차 관리는 매우 중요하며, 권장되는 4.0 mm 파일럿 홀을 CAD 설계 시 엄격히 준수해야 체결 강도를 확보할
    수 있다 [S22].


    ### 3. 회전축의 마찰 및 유격 제어

    로봇 손의 회전부는 마찰이 최소화되어야 제어 효율이 올라간다. 무급유 폴리머 슬리브 베어링(JSM-0810-10)은 별도의 윤활제 없이 마찰을
    줄이고 진동을 감쇄하는 역할을 한다 [S18]. 이 베어링은 하우징에 압입될 때 내경이 팽창하므로, 반드시 정밀 8 mm 샤프트를 사용하여
    유격을 관리해야 한다 [S18, S19].'
  worked_examples:
  - '예제 1: 인서트 홀 직경 계산. 설계한 링크 부품의 M3 인서트 외경이 4.4 mm일 때, 인서트가 적절한 유지력을 갖기 위한 권장 파일럿
    홀 지름은 얼마인가? 답: 데이터시트 [S22]에 명시된 4.0 mm를 적용해야 한다. 더 큰 구멍은 인서트가 헛돌게 하며, 더 작은 구멍은
    출력물 내부에 과도한 응력을 발생시켜 크랙을 유발한다.'
  - '예제 2: 노즐 관리. 50시간의 PC-CF 출력 작업을 마친 후 기존 황동 노즐과 경화강 노즐의 상태를 비교 분석하시오. 분석: 황동 노즐은
    탄소섬유 입자에 의해 마모되어 노즐 구경이 넓어지고 압출 품질이 급격히 저하된다. 반면, 경화강 노즐은 형상을 유지하여 정밀한 출력 치수를
    보장한다 [S20].'
  lab:
    title: 로봇 손 구조 부품 제작 및 정밀 조립
    steps:
    - 경화강 노즐을 장착한 FDM 프린터의 베드 온도를 110 °C로 예열하고 필라멘트를 건조 상태로 준비한다 [S20].
    - 슬라이서 소프트웨어에서 파일럿 홀 지름이 4.0 mm로 출력되도록 치수 보정(XY-offset)을 수행한다 [S22].
    - 링크 부품 출력 후 4.0 mm 홀에 인서트를 가열 삽입하고, 완전히 냉각될 때까지 대기한다 [S22].
    - 8 mm 알루미늄 샤프트와 폴리머 베어링을 조립하여 링크의 회전 유격을 측정하고, 필요시 공차를 수정한다 [S18, S19].
    safety:
    - FDM 프린터 예열 시 베드 온도가 110 °C에 도달하므로 화상 방지를 위해 반드시 내열 장갑을 착용한다 [S20].
    - 황동 인서트 삽입 작업 시 가열된 인두와 인서트로부터 손을 보호한다.
    - 모든 절단 및 조립 작업 시 파편으로부터 눈을 보호하기 위해 보안경을 착용한다.
    - 전원 인가 작업이 불필요한 공정이므로, 전기 기기 조작 시 항상 전원을 차단한 상태를 유지한다.
    deliverables:
    - 인서트 삽입이 완료된 손가락 링크 세트(PC-CF 재질)
    - 베어링-샤프트 조립 유격 확인 및 고정 완료 기록지
    - 표준 체결을 위한 M3 캡스크루 조립 결과물 [S21]
  assignment:
    title: 로봇 손 부품 설계 및 치수 공차 보고서
    deliverables:
    - 인서트 삽입 홀 및 베어링 하우징 설계 도면
    - PC-CF 출력물 중량 및 치수 측정 데이터 분석 결과
    - 반복 조립 시험 후 인서트 체결 토크 유지력 기록
    rubric:
    - 권장 파일럿 홀 지름(4.0 mm)과 베어링 공차(8 mm)의 준수 여부
    - 열압입 인서트 삽입 시 출력물의 변형 및 파손 방지 수준
    - 조립된 링크의 마찰 없는 부드러운 구동 여부
  quiz:
  - question: PC-CF 필라멘트를 FDM 프린터로 출력할 때 노즐 재질을 경화강으로 변경해야 하는 이유는 무엇입니까?
    choices:
    - 열 전도율이 더 높아서 출력 속도를 높일 수 있기 때문
    - 탄소섬유의 연마성에 의해 일반 황동 노즐이 빠르게 마모되기 때문
    - PC-CF의 융점이 일반 PC보다 낮아서 황동 노즐이 녹기 때문
    - 경화강 노즐이 필라멘트와의 접착력이 더 좋기 때문
    answer_index: 1
    explanation: 탄소섬유는 입자가 단단하여 금속을 깎아내는 연마성을 가집니다. 따라서 일반 황동 노즐은 출력 중 빠르게 마모되어 품질
      저하를 유발하므로 경화강 노즐을 사용해야 합니다 [S20].
  - question: 황동 열압입 인서트를 조립할 때 적절한 파일럿 홀 크기를 유지하는 것이 중요한 이유는 무엇입니까?
    choices:
    - 홀이 너무 작으면 인서트가 아예 들어가지 않고, 너무 크면 체결 강도가 약해지기 때문
    - 파일럿 홀 크기는 출력 속도와 관계가 있기 때문
    - 인서트의 전기 전도도를 높이기 위해서
    - 홀 크기가 작을수록 냉각 시간이 단축되기 때문
    answer_index: 0
    explanation: 권장 홀 크기(4.0 mm)는 인서트 유지력과 출력물의 응력 균형을 최적화하기 위해 설계된 값입니다 [S22].
  completion_criteria:
  - 권장 재질(PC-CF) 및 부품(JSM-0810-10 등)을 사용하여 5지 로봇 손의 관절 링크 제작 완료.
  - 모든 회전 관절이 유격 없이 부드럽게 구동함을 육안 및 촉각으로 검증.
  - 반복 분해/조립이 가능한 M3 나사산 체결 환경이 성공적으로 구현됨.
  source_ids:
  - S20
  - S22
  - S18
  - S19
  - S21
- id: M4
  slug: actuator-integration
  phase_id: PH2
  title: 액추에이터 및 트랜스미션 조립
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 물리적 구동 특성과 전원 분기 시스템을 이해한다.
  - 고강도 텐던(Dyneema SK78)을 활용한 관절 전동 시스템의 장력 조절 원리를 파악한다.
  - 힘 감지 센서(FSR 402)를 활용한 피드백 회로를 설계하고 OpenCR 제어기와 인터페이스한다.
  - 분기별 독립 전원 시스템의 과전류 보호 회로 구성 및 안전한 조립 절차를 습득한다.
  theory_markdown: '## 액추에이터 통합 및 전동 시스템 기초


    5지 로봇손의 핵심 구동기는 DYNAMIXEL XM430-W350-T로, 위치·속도·전류 피드백을 통합한 스마트 액추에이터입니다 [S3].
    이는 정격 12 V 전압에서 4.1 N·m의 스톨 토크를 제공하며, 효율적인 열 관리를 위해 알루미늄 케이스를 채택하였습니다 [S4].


    ### 전원 분기 및 보호 시스템

    본 프로젝트는 3개의 절연형 12 V 전원 어댑터(GST160A12-R7B)를 사용하여 시스템을 3개의 독립 분기로 나눕니다 [S16]. 각
    어댑터는 11.5 A의 정격 전류를 제공하며, 액추에이터 4대/4대/3대로 부하를 분산합니다 [PWR1].

    * **안전 원칙**: 각 어댑터의 양(+) 출력은 독립된 분기로 유지되어야 하며, 절대 전기적으로 병합하거나 연결해서는 안 됩니다. 각 분기에는
    10 A ATOF 퓨즈를 장착하여 과전류 상황에서 배선 및 부품을 보호합니다 [SAF1, WIR2].


    ### 텐던 전동과 베어링

    손가락 관절은 Dyneema SK78 텐던으로 구동됩니다. 이 소재는 지름 1.5 mm에서 230 daN의 파단 하중과 1% 미만의 작동 신율을
    가져 정밀한 장력 전달에 유리합니다 [TRN1, S17]. 회전축에는 무급유 폴리머 슬리브 베어링(JSM-0810-10)을 사용하여 유지보수를
    최소화하고 반복 조립의 내구성을 확보합니다 [BRG1, S18].


    ### 센서 인터페이스

    손끝 접촉력은 FSR 402 센서로 측정합니다 [SEN1]. OpenCR 제어기에서 신호를 취득하기 위해 10 kΩ 저항과 전압 분압 회로를
    구성합니다 [SEN2]. FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다 [CTR1].'
  worked_examples:
  - '분기별 전류 계산: 1분기에 액추에이터 4대가 장착된 경우, 스톨 전류 합계는 2.3 A × 4 = 9.2 A입니다 [ACT1]. 선택된
    10 A ATOF 퓨즈는 9.2 A보다 크고 어댑터 정격인 11.5 A보다 낮아 적절한 보호를 수행합니다 [SAF1].'
  - '전압 분압 설계: FSR 402의 저항이 무한대일 때(힘 없음), ADC 입력 전압은 0 V입니다. 센서 저항이 10 kΩ(10 kΩ 분압
    저항과 동일)일 때, ADC 전압은 3.3 V × (10 kΩ / (10 kΩ + 10 kΩ)) = 1.65 V가 되어 ADC 범위(0-3.3
    V) 내에 안정적으로 위치합니다 [CTR1, SEN2].'
  lab:
    title: 액추에이터 및 전동 하네스 조립 실습
    steps:
    - 각 액추에이터의 텐던 연결부와 캡스턴 라운딩 상태를 육안 검사합니다.
    - OpenCR 제어기와 액추에이터를 TTL 포트에 연결하고 전원 분기별로 배선합니다.
    - FSR 402 센서와 10 kΩ 저항으로 전압 분압 회로를 구성하고 3.3 V 센서 레일에 연결합니다.
    - 각 전원 어댑터 출력부에 인라인 퓨즈 홀더와 10 A 퓨즈를 삽입합니다 [WIR2, SAF1].
    - 전원 인가 전 멀티미터를 사용하여 모든 독립 분기의 단락 여부를 검사합니다.
    safety:
    - 전원 인가 중 손을 액추에이터 가동 범위에 절대 넣지 마십시오.
    - 시스템 벤치 정지 시 3개의 전원 어댑터를 물리적으로 AC 소켓에서 분리하십시오.
    - 분리 후 반드시 각 분기 전압을 DC 전압 모드에서 1 V 미만으로 측정 확인 후 조립하십시오.
    - 텐던 장력 시험 시 파단에 의한 충격 대비 보안경을 반드시 착용하십시오.
    deliverables:
    - 조립된 5지 로봇손 액추에이터 모듈 사진
    - 분기별 전압 측정 교정 기록
    - FSR 센서 캘리브레이션 데이터 표
  assignment:
    title: 전원 분기 시스템 설계 보고서
    deliverables:
    - 전원 분기 및 퓨즈 보호 설계 회로도
    - 부하 분산 계산서(액추에이터 개수별 전류 합계)
    rubric:
    - 전원 분기 간 전기적 독립성 보장 여부
    - 분기 퓨즈 정격의 적절성(스톨 전류 기준)
    - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
  quiz:
  - question: FSR 402 센서의 전압 분압 회로에 권장되는 전원은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원 레일
    - OpenCR 3.3 V 센서 전원 레일
    - 5 V USB 전원 레일
    - 어댑터 출력 분기 직접 연결
    answer_index: 1
    explanation: 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의
      별도 검토가 필요하다 [CTR1].
  - question: 3개의 12 V 절연 전원 어댑터를 사용할 때 가장 중요한 안전 규칙은 무엇입니까?
    choices:
    - 양(+) 출력을 모두 하나로 묶어 전력을 극대화한다.
    - 하나의 어댑터에 11대 액추에이터를 모두 연결한다.
    - 각 어댑터의 출력을 독립적인 분기로 유지하며 절대 연결하지 않는다.
    - 퓨즈 대신 소프트웨어 전류 제한을 사용한다.
    answer_index: 2
    explanation: 각 절연 어댑터의 출력은 독립적으로 유지되어야 하며, 임의로 합치면 전원 장치 파손 및 위험한 전류 흐름이 발생할 수
      있습니다 [PWR1].
  - question: 텐던 소재로 Dyneema SK78을 사용하는 주된 이유는 무엇입니까?
    choices:
    - 매우 낮은 신율(1% 미만)과 높은 파단 하중
    - 전기 전도성이 높아 센서로 활용 가능
    - 저렴한 가격과 쉽게 구할 수 있는 범용성
    - 고온에서 녹아 관절을 고정하는 기능
    answer_index: 0
    explanation: Dyneema SK78은 신율이 1% 미만으로 낮아 정밀한 위치 제어에 적합한 장력 전달 특성을 가집니다 [TRN1,
      S17].
  completion_criteria:
  - 각 액추에이터 모듈이 독립 전원 분기에 안전하게 연결됨
  - 모든 분기에서 퓨즈 홀더를 통한 과전류 보호 장치 구성 완료
  - FSR 센서 신호가 OpenCR ADC에서 0-3.3 V 범위 내로 출력됨
  - 모든 전원 분리 절차를 완료하고 1 V 미만 무전원 상태를 3회 이상 기록
  source_ids:
