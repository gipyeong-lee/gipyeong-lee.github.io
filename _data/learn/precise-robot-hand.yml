modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: 로봇 기구학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 기구학의 기본 정의와 강체 변환(Rigid-body transformation)의 개념을 이해한다.
  - 좌표계 변환과 회전 행렬을 사용하여 로봇의 위치와 방향을 수학적으로 기술하는 방법을 익힌다.
  - 5지 로봇손 설계를 위한 기구학적 기초 이론을 습득하고 해석적 접근법을 익힌다.
  theory_markdown: '## 로봇 기구학의 기초


    로봇 기구학은 로봇의 운동을 힘이나 토크를 고려하지 않고 위치, 속도, 가속도 측면에서 다루는 학문입니다 [S1]. 로봇손과 같은 매니퓰레이터
    설계의 출발점은 각 관절의 상태를 공간상의 좌표로 기술하는 것입니다.


    ### 1. 강체 변환 (Rigid-body Transformation)

    로봇의 각 링크는 강체로 간주되며, 하나의 좌표계에서 다른 좌표계로의 변환은 회전(Rotation)과 이동(Translation)의 조합으로
    나타납니다. 3차원 공간에서 회전 행렬(Rotation Matrix) $R$은 직교 행렬이며, 이를 통해 두 좌표계 간의 방향을 정의합니다
    [S1].


    ### 2. 순기구학 (Forward Kinematics)

    순기구학은 관절의 변수(각도 또는 위치)를 알고 있을 때, 로봇 끝단(End-effector)의 위치와 방향을 계산하는 과정입니다. 5지 로봇손에서는
    손가락 관절 각도($\theta_1, \theta_2, \dots, \theta_n$)를 통해 손끝의 위치를 구합니다.


    ### 3. 역기구학 (Inverse Kinematics)

    역기구학은 원하는 손끝의 위치를 목표값으로 설정했을 때, 이를 달성하기 위한 각 관절 변수를 구하는 과정입니다. 비선형 방정식으로 구성되어
    있어 해가 존재하지 않거나 다중 해가 발생할 수 있습니다 [S1].'
  worked_examples:
  - '예제 1: 2차원 평면에서 1개의 회전 관절(Rotation Joint)을 가진 로봇 링크의 끝단 위치 $(x, y)$를 구하시오. 관절
    각도가 $\theta$이고 링크 길이가 $L$일 때, $x = L \cos(\theta)$, $y = L \sin(\theta)$이다 [S1].'
  - '예제 2: $x$축에 대해 $\theta$만큼 회전하는 2차원 회전 행렬 $R$을 기술하시오. $R = \begin{bmatrix} \cos(\theta)
    & -\sin(\theta) \\ \sin(\theta) & \cos(\theta) \end{bmatrix}$ 이다 [S1].'
  lab:
    title: 좌표계 변환 시뮬레이션 및 기초 기구학 해석
    steps:
    - 기구학 해석 소프트웨어를 사용하여 2링크 평면 매니퓰레이터 모델을 생성한다.
    - 관절 각도를 변화시키며 끝단 위치의 궤적을 확인한다.
    - 역기구학 계산식을 수기로 유도하고 시뮬레이션 결과와 비교한다.
    safety:
    - 컴퓨터 작업 시 화면 밝기를 조절하고 주기적으로 휴식한다.
    - 본 실습은 시뮬레이션 기반이므로 하드웨어 통전은 요구하지 않음.
    deliverables:
    - 기구학 해석 과정이 포함된 요약 보고서
    - 궤적 시뮬레이션 결과 이미지
  assignment:
    title: 5지 로봇손 관절 구조 기구학 모델링
    deliverables:
    - 로봇 손가락 1개에 대한 순기구학 방정식 유도 결과물
    - 관절 각도 변화에 따른 손끝 위치 변화 예측 데이터
    rubric:
    - 회전 행렬의 수학적 정확성
    - 순기구학 방정식의 물리적 타당성
    - 보고서의 논리적 구성
  quiz:
  - question: 로봇 기구학에서 힘이나 토크를 고려하지 않고 운동만을 기술하는 학문은 무엇인가?
    choices:
    - 동역학(Dynamics)
    - 기구학(Kinematics)
    - 제어 이론(Control Theory)
    - 재료 역학(Material Mechanics)
    answer_index: 1
    explanation: 기구학은 힘과 토크를 제외한 위치, 속도, 가속도 중심의 운동론입니다 [S1].
  - question: 3차원 공간에서 두 좌표계 간의 방향을 정의하는 행렬은?
    choices:
    - 회전 행렬(Rotation Matrix)
    - 질량 행렬(Mass Matrix)
    - 강성 행렬(Stiffness Matrix)
    - 감쇠 행렬(Damping Matrix)
    answer_index: 0
    explanation: 회전 행렬은 두 좌표계 간의 방향을 수학적으로 변환하는 직교 행렬입니다 [S1].
  completion_criteria:
  - 이론 강좌 학습 완료
  - 기구학 해석 결과 보고서 제출
  - 이론 퀴즈 100점 달성
  source_ids:
  - S1
- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: 텐던 구동 메커니즘 설계
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 텐던 구동 메커니즘의 기본 역학 구조와 관절 모사 원리를 이해한다.
  - 정교한 로봇 손을 위한 텐던 재료(Dyneema SK78)의 특성을 학습한다.
  - 텐던의 장력 전달 경로와 캡스턴 설계 시 마찰 및 마모 방지법을 익힌다.
  - 액추에이터의 스톨 토크와 텐던 구동 시의 기계적 이득을 계산한다.
  theory_markdown: '## 텐던 구동 메커니즘의 기초


    텐던 구동(Tendon-driven) 시스템은 원격지에 위치한 액추에이터에서 인장력을 텐던(줄)을 통해 관절로 전달하여 구동하는 방식이다 [S9].
    생물학적 손가락의 힘줄 구조를 모사하여 액추에이터를 손바닥이나 팔뚝으로 이동시킴으로써, 손가락 자체의 질량을 줄이고 정교한 움직임을 구현할
    수 있다 [S10].


    ### 1. 텐던의 선택 및 장력 전달

    본 설계에서는 고강도 저신율 섬유인 Dyneema SK78을 사용한다 [S16]. 이 재료는 지름 1.5 mm에서 230 daN(약 230
    kgf)의 파단 하중을 가지며, 작동 신율이 1% 미만으로 정밀한 위치 제어에 적합하다 [S16].


    ### 2. 기계적 이득과 구동기 선정

    XM430-W350-T 스마트 액추에이터는 스톨 토크 4.1 N·m를 제공한다 [S11]. 텐던은 회전축에서 캡스턴 반경을 통해 힘을 변환하므로,
    액추에이터의 토크 출력은 텐던의 장력으로 치환된다. 전체 시스템은 11대의 액추에이터를 사용하며, 피크 전류 합계는 약 25.3 A에 도달할
    수 있다 [S11]. 퓨즈와 부하·전원 정격의 비교만으로 안전성이나 동작 순서를 보장하지 않는다. 퓨즈 제조사 시간-전류 곡선과 전원 OCP
    특성을 함께 검토해 보호 협조를 확인한다 [S15, S24, S25].


    ### 3. 안전 및 보호 설계

    각 12 V 전원 분기는 독립적인 퓨즈를 통해 운용된다 [S15, S24]. 3개의 전원 어댑터는 각각 11.5 A 정격으로, 합산 전류 용량은
    34.5 A에 달하여 시스템 피크 전류인 25.3 A를 충분히 수용한다 [S11, S15]. 분기 합산 정격이 액추에이터 총 피크 전류를 상회하도록
    설계하여 운용 안전성을 확보한다.'
  worked_examples:
  - '예제 1: 텐던 구동 시의 장력 계산

    액추에이터 토크(τ)가 1 N·m이고 캡스턴 반경(r)이 0.01 m일 때, 텐던 장력(T)은 T = τ/r = 1/0.01 = 100 N이다.
    Dyneema SK78의 파단 하중 230 daN(약 2300 N) 대비 안전율을 고려하여 설계한다 [S16].'
  - '예제 2: 전원 분기 분배 및 보호

    전체 액추에이터 11대의 스톨 전류 합계는 25.3 A이다 [S11]. 이를 3개 분기에 4대, 4대, 3대로 배분하면 각 분기의 최대 부하는
    각각 9.2 A, 9.2 A, 6.9 A이다. 퓨즈와 부하·전원 정격의 비교만으로 안전성이나 동작 순서를 보장하지 않는다. 퓨즈 제조사 시간-전류
    곡선과 전원 OCP 특성을 함께 검토해 보호 협조를 확인한다. 퓨즈 제조사 시간-전류 곡선과 어댑터 OCP 특성을 함께 검토해 보호 협조를
    확인한다 [S24, S25].'
  lab:
    title: 텐던 장력 및 관절 마찰 측정 실습
    steps:
    - 제공된 링크와 베어링을 사용하여 손가락 관절 모델을 조립한다.
    - 텐던을 연결하고 텐셔너를 사용하여 초기 장력을 설정한다.
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기의 12 V 전원 어댑터 출력을 물리적으로 분리하여 확인한다.
    - 전원 인가 전 관절의 회전 마찰력을 수동으로 측정하여 기록한다.
    safety:
    - 정비·접근 전 3개 절연 전원 어댑터를 물리적으로 분리하고 멀티미터로 1 V 미만 DC 전압을 확인한다.
    - 전원 인가 중에는 절대로 손가락의 가동 범위에 접근하지 않는다.
    - 충격 방지 작업용 보안경을 반드시 착용한다.
    deliverables:
    - 관절 회전 각도에 따른 텐던 장력 측정 데이터
    - 마찰력 분석 보고서
    - 최종 안전 계측 기록
  assignment:
    title: 5지 로봇손 텐던 경로 설계
    deliverables:
    - 로봇 손가락 텐던 경로 CAD 도면
    - 텐던 마찰 및 손실 계산서
    - 분기별 전원 부하 배분 및 퓨즈 보호 설계도
    rubric:
    - 텐던 경로가 굴곡부 마찰을 최소화하도록 설계되었는가?
    - Dyneema SK78의 물리적 특성이 고려되었는가?
    - 3개 전원 분기의 부하 배분이 액추에이터 스톨 전류를 적절히 반영하였는가?
    - 퓨즈 및 전원 단락 방지 설계가 BOM 사양을 준수하는가?
  quiz:
  - question: Dyneema SK78 텐던을 사용할 때의 주요 이점은 무엇인가?
    choices:
    - 높은 신율로 인한 충격 흡수
    - 매우 낮은 작동 신율과 높은 파단 하중
    - 금속보다 가벼운 무게와 낮은 인장 강도
    - 전기 전도성
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 매우 낮아 위치 제어의 정밀도를 높이고, 매우 높은 파단 하중을 가진
      고성능 섬유이다 [S16].
  - question: 3개의 12 V 전원 어댑터(각 11.5 A)를 사용하는 이유로 적절한 것은?
    choices:
    - 모든 액추에이터를 하나의 전원으로 구동하기 위해
    - 전압을 36 V로 증폭하여 토크를 높이기 위해
    - 액추에이터의 총 피크 전류를 분산 수용하고 개별 분기 퓨즈로 보호하기 위해
    - 전원 노이즈를 제거하기 위해
    answer_index: 2
    explanation: 퓨즈와 부하·전원 정격의 비교만으로 안전성이나 동작 순서를 보장하지 않는다. 퓨즈 제조사 시간-전류 곡선과 전원 OCP
      특성을 함께 검토해 보호 협조를 확인한다 [S11, S15, S25].
  completion_criteria:
  - 모든 실습 데이터와 도면이 최종 보고서에 포함되어야 한다.
  - 물리적 전원 분리 후 3개 분기의 DC 전압이 1 V 미만임을 계측으로 입증해야 한다.
  - 텐던 경로 설계에서 캡스턴 마찰을 고려한 해석이 포함되어야 한다.
  source_ids:
  - S9
  - S10
  - S16
  - S11
  - S15
  - S24
  - S25
