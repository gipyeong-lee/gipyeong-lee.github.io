- id: M3
  slug: cad-modeling-hand
  phase_id: P1
  title: 로봇손 CAD 설계
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - 로봇손 설계를 위한 CAD 툴 활용 및 기구학적 파라미터 적용 능력 함양
  - FDM 3D 프린팅의 기계적 물성을 고려한 최적 설계 전략 수립
  - 조립 공차 및 열압입 인서트 설계를 통한 반복 조립 정밀도 확보
  - 텐던 구동 로봇손의 링크 및 관절부 설계 핵심 원리 이해
  theory_markdown: '### 로봇손 CAD 설계 핵심 원리


    정교한 5지 로봇손 설계는 기구학적 운동 범위와 텐던 구동을 위한 최적의 동력 전달 경로를 확보하는 것이 핵심이다 [S9].


    #### 1. FDM 3D 프린팅 설계 전략

    사용되는 PC-CF(탄소섬유 보강 PC) 필라멘트는 강성과 치수 안정성이 우수하지만 [S19], 층간 결합력과 적층 방향에 따른 강도 차이가
    존재한다. 따라서 주요 응력을 받는 링크 부품은 적층 방향이 하중 방향과 수직이 되도록 설계해야 한다.


    #### 2. 체결 및 조립 정밀도

    반복적인 조립과 분해가 필요한 부위에는 M3 황동 열압입 인서트(HTBI-M3-BR)를 사용한다 [S21]. 인서트 장착을 위해 출력물 설계
    시 4.0 mm 직경의 파일럿 홀을 명시하여야 하며 [S21], 이는 인서트와 출력물 사이의 적절한 체결력을 보장한다.


    #### 3. 관절 및 회전축 최적화

    손목 및 관절부 회전축에는 무급유 폴리머 슬리브 베어링(JSM-0810-10)을 사용한다 [S17]. 베어링은 압입 시 내경이 조정되므로 하우징
    설계 시 적절한 공차를 반영해야 하며 [S17], 축은 규격화된 8 mm 정밀 알루미늄 샤프트를 선택하여 기계적 유격을 최소화한다 [S18].


    #### 4. 텐던 구동 기구학

    텐던은 Dyneema SK78(D-Pro 1.5mm)을 사용하며, 파단 하중 230 daN의 고강도와 1% 미만의 신율 특성을 가진다 [S16].
    설계 시 텐던이 이동하는 모서리는 반드시 곡면 처리(fillet)하여 마찰에 의한 단선을 방지해야 한다 [S16].'
  worked_examples:
  - '예제 1: 열압입 인서트 홀 설계. M3 인서트 외경이 4.4 mm일 때, 4.0 mm 파일럿 홀을 CAD에 배치하여 인서트 체결 시 소재
    변형을 최소화하고 보존력을 확보하는 설계 예시.'
  - '예제 2: 텐던 마찰 최소화 설계. 액추에이터의 캡스턴에서 손가락 관절로 이어지는 경로에서 텐던이 접촉하는 모든 모서리에 1.5 mm 이상의
    반지름을 가진 라운딩 처리를 적용하여 하중 분산 및 마모 방지 기법 적용.'
  lab:
    title: 로봇손 핑거 링크 설계 및 공차 검증
    steps:
    - 최신 CAD 소프트웨어를 사용하여 핑거 링크의 3D 형상 모델링.
    - 열압입 인서트용 4.0 mm 파일럿 홀 설계 및 M3 캡스크루 호환성 확인.
    - 슬리브 베어링(JSM-0810-10) 장착을 위한 하우징 보어 설계.
    - 모델링된 부품의 슬라이싱 프로그램 적용 및 PC-CF 출력 설정 확인.
    - 샘플 링크 출력 후 인서트 장착 및 M3 스크루 조립을 통한 공차 검증.
    safety:
    - FDM 프린터 동작 중 고온의 노즐(285 °C)과 베드(110 °C) 접촉 주의 [S19].
    - 인서트 장착을 위한 납땜 인두 사용 시 화상 주의 및 보안경 착용.
    - 절단 작업 시 충격 방지 작업용 보안경 필수 착용.
    - 실험 중 장치 정지는 3개 독립 절연 전원(GST160A12-R7B)을 물리적으로 분리하고, 멀티미터로 각 분기의 DC 전압이 1 V 미만임을
      확인한 후 접근.
    deliverables:
    - 핑거 링크 CAD 파일(STEP 포맷)
    - 열압입 및 베어링 장착 공차 측정 기록지
    - 샘플 출력물의 조립 상태 사진
  assignment:
    title: 5지 로봇손 전체 기구부 CAD 설계 및 설계 검토
    deliverables:
    - 손바닥 프레임 및 5개 손가락 링크가 포함된 전체 CAD 조립도
    - 주요 하중 부위(손목, 관절)의 부품별 재질 및 조립 사양서
    - 텐던 구동 경로 및 간섭 검토 보고서
    rubric:
    - 기구적 간섭 없이 5지 로봇손 전체 동작 범위 구현 여부
    - 사용된 모든 부품(인서트, 베어링, 샤프트)의 BOM 규격 일치성
    - 설계 보고서의 기구학적 분석 타당성
  quiz:
  - question: PC-CF 필라멘트를 사용하는 로봇손 설계 시 인서트 체결을 위해 권장되는 파일럿 홀 지름은 얼마인가?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 4.4 mm
    - 5.0 mm
    answer_index: 1
    explanation: HTBI-M3-BR 인서트의 권장 구멍 지름은 4 mm입니다 [S21].
  - question: 본 교육과정에서 사용하는 Dyneema SK78 텐던의 작동 신율 특성으로 옳은 것은?
    choices:
    - 1% 이상
    - 1% 미만
    - 5% 이상
    - 10% 미만
    answer_index: 1
    explanation: Dyneema SK78 텐던(D-Pro)은 작동 신율이 1% 미만으로 매우 낮아 정밀 제어에 적합합니다 [S16].
  - question: 슬리브 베어링(JSM-0810-10)의 내경과 외경 규격으로 옳은 것은?
    choices:
    - 내경 6 mm, 외경 8 mm
    - 내경 8 mm, 외경 10 mm
    - 내경 10 mm, 외경 12 mm
    - 내경 12 mm, 외경 14 mm
    answer_index: 1
    explanation: JSM-0810-10 베어링은 내경 8 mm, 외경 10 mm입니다 [S17].
  completion_criteria:
  - 5지 로봇손 전체 CAD 모델링 제출
  - 부품별 치수 및 공차 검증 보고서 작성
  - 설계 사양과 BOM 시스템 일치성 확인
  source_ids:
  - S9
  - S19
  - S21
  - S17
  - S18
