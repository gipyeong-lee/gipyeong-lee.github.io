- id: M6
  slug: controller-programming
  phase_id: P3
  title: 임베디드 제어 프로그래밍
  estimated_hours: 15.0
  prerequisites:
  - M5
  objectives:
  - ESP-IDF 프레임워크 기반의 임베디드 제어 환경 이해
  - 실시간 제어를 위한 태스크(Task) 스케줄링 및 큐(Queue) 활용법 습득
  - 서보 모터 제어를 위한 PWM 신호 생성 및 설정
  - 로봇손 관절 피드백을 위한 센서 데이터 수집 및 처리
  theory_markdown: '## 임베디드 제어 프로그래밍 개요

    로봇손의 정교한 동작을 위해서는 고성능 MCU(ESP32 등)와 이를 지원하는 공식 개발 프레임워크인 ESP-IDF를 활용해야 합니다 [S19].
    ESP-IDF는 FreeRTOS를 기반으로 하여 다중 태스크 환경을 효율적으로 지원합니다.


    ### 1. 태스크 관리 및 인터럽트

    로봇손은 여러 손가락의 움직임을 동시에 제어해야 하므로, 각 손가락을 별도의 태스크로 분리하여 스케줄링합니다. `xTaskCreate`를 사용하여
    태스크를 생성하고, `vTaskDelay`를 통해 CPU 점유율을 최적화합니다.


    ### 2. PWM 기반 모터 제어

    서보 모터는 PWM(Pulse Width Modulation) 신호의 펄스 폭(Pulse Width)에 따라 각도가 결정됩니다. ESP32의
    LEDC(LED Control) 주변장치는 고해상도 PWM 신호를 생성하는 데 최적화되어 있습니다.


    ### 3. 데이터 교환

    센서 데이터(위치, 압력)와 모터 명령은 큐(Queue)를 통해 태스크 간 안전하게 전달됩니다. 이는 데이터 레이스(Race Condition)를
    방지하고 실시간성을 확보하기 위한 핵심 설계 패턴입니다.'
  worked_examples:
  - '서보 모터 PWM 제어 예제: LEDC를 설정하고 0도에서 180도까지 서보 각도를 변경하는 코드를 작성합니다. 주파수는 50Hz, 분해능은
    16비트로 설정하여 미세한 각도 제어를 가능하게 합니다.'
  - '태스크 간 큐 통신 예제: 센서 태스크에서 측정한 로봇손의 현재 상태 데이터를 큐에 넣고, 제어 태스크가 이를 받아 모터 출력을 결정하는
    Producer-Consumer 패턴 구현 예제를 분석합니다.'
  lab:
    title: 로봇손 서보 제어 및 센서 데이터 피드백 구현
    steps:
    - ESP-IDF 개발 환경을 설정하고 서보 모터 PWM 설정을 위한 LEDC API를 분석합니다.
    - 서보 모터 1개를 벤치 전원에 연결하고, 0도와 90도 위치로 주기적으로 이동시키는 펌웨어를 업로드합니다.
    - 가변 저항(Potentiometer)을 ADC 핀에 연결하여 모터의 위치 값을 읽어들입니다.
    - 센서 값을 읽어 목표 위치와 비교하고, 오차를 줄이는 제어 알고리즘을 추가합니다.
    safety:
    - 저전압 벤치 전원 사용 시 출력 전압을 5V~6V로 제한합니다.
    - 모터 구동 시 과전류로 인한 보드 손상을 방지하기 위해 전류 제한 기능을 활성화합니다.
    - 움직이는 관절부 주위에 손가락 끼임 주의합니다.
    - 납땜 시 보안경을 착용합니다.
    deliverables:
    - 제어 펌웨어 소스 코드 (.c 및 .h)
    - PWM 파형 측정 데이터 (멀티미터 혹은 오실로스코프)
    - 센서 데이터가 올바르게 전송되는 것을 보여주는 시리얼 모니터 로그
  assignment:
    title: 5지 로봇손 동시 제어 알고리즘 구현
    deliverables:
    - 5개 손가락 서보 모터 동시 제어 소스 코드
    - 각 손가락별 센서 값 기반 폐루프(Closed-loop) 제어 구현서
    - 비상 정지(Emergency Stop) 및 전원 차단 로직 설명
    rubric:
    - 5개 모터의 개별적인 제어가 성공적으로 구현되었는가?
    - 센서 데이터 기반의 오차 보정 알고리즘이 안정적으로 작동하는가?
    - 임베디드 태스크 스케줄링이 적절히 배치되어 시스템 지연이 없는가?
    - 비상 정지 로직이 즉각적으로 반영되는가?
  quiz:
  - question: ESP-IDF에서 태스크 간 데이터를 안전하게 주고받기 위해 권장되는 방법은 무엇입니까?
    choices:
    - 전역 변수 직접 사용
    - 큐(Queue) 사용
    - 파일 쓰기
    - 메모리 포인터 직접 전달
    answer_index: 1
    explanation: ESP-IDF는 다중 태스크 환경에서 데이터 안전성을 위해 큐(Queue) 사용을 권장합니다.
  - question: 서보 모터의 회전 각도를 결정하는 핵심 신호 방식은?
    choices:
    - GPIO 디지털 신호
    - 아날로그 전압
    - PWM 펄스 폭
    - UART 시리얼 데이터
    answer_index: 2
    explanation: 서보 모터는 PWM 신호의 펄스 폭에 의해 회전 각도가 결정됩니다.
  completion_criteria:
  - 서보 모터 5개를 독립적으로 제어하는 펌웨어 작성 완료
  - 센서 데이터를 활용한 위치 제어 루프 정상 작동 검증
  - 임베디드 제어 코드의 메모리 및 태스크 할당 최적화 확인
  source_ids:
  - S19
- id: M7
  slug: sensor-calibration
  phase_id: P3
  title: 센서 데이터 처리 및 교정
  estimated_hours: 10.0
  prerequisites:
  - M6
  objectives:
  - FSR(Force Sensing Resistor)의 물리적 동작 원리와 압력-저항 관계를 이해한다.
  - 로봇손의 접촉 제어를 위해 FSR 데이터를 전압 신호로 변환하는 회로를 설계한다.
  - 센서 출력 데이터의 비선형성을 보정하는 교정 알고리즘을 구현한다.
  - 정밀한 파지력을 확보하기 위한 센서 데이터 필터링 기법을 습득한다.
  theory_markdown: '### 1. FSR(Force Sensing Resistor)의 원리

    FSR은 인가되는 압력에 따라 저항값이 감소하는 압저항(Piezoresistive) 특성을 가진 고분자 후막 센서입니다 [S18]. Interlink
    Electronics의 FSR 402 모델과 같은 장치는 인가된 힘이 증가할수록 전도성 층이 기판에 더 많이 접촉하여 회로의 총 저항을 낮추는
    구조를 가집니다 [S18]. 이 센서는 0.2N에서 20N 사이의 힘을 측정할 수 있어 [S18] 로봇손의 손끝 접촉력 제어에 적합합니다.


    ### 2. 신호 변환 및 분압 회로

    FSR은 자체적으로 저항값이 변화하는 수동 소자이므로, 마이크로컨트롤러가 읽을 수 있는 전압 신호로 변환해야 합니다. 가장 흔한 방법은 고정
    저항(Reference Resistor)과 함께 분압 회로(Voltage Divider)를 구성하는 것입니다.


    $$V_{out} = V_{cc} \cdot \frac{R_{FSR}}{R_{fixed} + R_{FSR}}$$


    여기서 $R_{FSR}$은 센서의 저항, $R_{fixed}$는 고정 저항값입니다. 이 회로를 통해 힘이 가해질수록 $V_{out}$이 특정
    방향으로 변화하게 됩니다.


    ### 3. 비선형성 보정 및 데이터 처리

    FSR의 응답은 로그(log) 특성을 보이며 비선형적입니다. 정밀한 제어를 위해서는 다음과 같은 교정 단계가 필요합니다:

    1. **데이터 수집(Calibration Curve):** 표준 분동을 사용하여 힘(N) 대 ADC 출력(V) 데이터를 수집합니다.

    2. **커브 피팅(Curve Fitting):** 멱함수($F = a \cdot R^b$)나 다항식 근사를 통해 저항값을 힘의 단위로 변환합니다.

    3. **노이즈 필터링:** 센서 신호는 진동에 민감하므로, 이동 평균 필터(Moving Average Filter)나 지수 가중 이동 평균(EWMA)을
    적용하여 신호를 안정화합니다.'
  worked_examples:
  - '문제: FSR 402 센서가 $V_{cc}=5V$이고 $R_{fixed}=10k\Omega$인 분압 회로에 연결되어 있습니다. FSR 저항이
    $2k\Omega$일 때 ADC 출력 전압을 계산하세요. 해결: $V_{out} = 5 \cdot (2000 / (10000 + 2000))
    = 5 \cdot (2000 / 12000) \approx 0.833V$.'
  - '문제: 센서 데이터에 노이즈가 많을 때 EWMA 필터 가중치 $\alpha=0.1$을 적용하는 코드 논리를 세우세요. 해결: $y_{filtered}[n]
    = \alpha \cdot x[n] + (1 - \alpha) \cdot y_{filtered}[n-1]$. 매 주기마다 현재 입력값에 0.1,
    이전 출력값에 0.9를 곱해 더합니다.'
  lab:
    title: FSR 신호 응답 테스트 및 교정 실습
    steps:
    - 분압 회로(FSR + 10k옴 저항)를 브레드보드에 구성하고 멀티미터로 전압 변화를 확인합니다.
    - 마이크로컨트롤러(Arduino/ESP32)의 ADC 핀에 연결하여 힘을 가하지 않을 때와 최대 압력을 가할 때의 Raw 데이터를 기록합니다.
    - 정확한 무게를 가진 물체를 사용하여 5개 이상의 구간에서 힘(N) vs ADC 값 데이터를 수집합니다.
    - 수집된 데이터를 바탕으로 교정 계수를 계산하고, 코드에 적용하여 실제 힘(Newton) 단위로 출력되도록 수정합니다.
    safety:
    - 벤치 전원 사용 시 쇼트 방지를 위해 전류 제한 회로를 반드시 적용하십시오.
    - 회로 연결 시 전원 분리 상태에서 배선 상태를 재확인하십시오.
    - 센서 보호를 위해 너무 날카로운 물체로 직접 누르지 마십시오.
    deliverables:
    - 측정 데이터 로그 파일 (CSV)
    - 힘(N)으로 변환된 최종 제어 코드
    - 센서 응답 곡선 그래프
  assignment:
    title: 로봇손 5지 파지력 균형 조정 과제
    deliverables:
    - 각 손가락별 센서 교정 계수 보고서
    - 파지력 보정 알고리즘 소스 코드
    - 물체 파지 시 안정성 테스트 결과서
    rubric:
    - FSR 센서의 비선형성을 보정하는 물리적 근거를 논리적으로 설명하였는가?
    - 다양한 물체에 대해 파지력이 일관되게 작용하도록 알고리즘이 설계되었는가?
    - 센서 데이터의 노이즈 처리 방법이 적절하게 구현되었는가?
  quiz:
  - question: FSR 센서의 압력-저항 특성에 대한 설명으로 옳은 것은?
    choices:
    - 압력이 증가하면 저항이 증가한다.
    - 압력이 증가하면 저항이 감소한다.
    - 압력과 저항은 아무런 상관이 없다.
    - 압력이 증가하면 전압이 항상 0이 된다.
    answer_index: 1
    explanation: FSR은 압력을 가할수록 센서의 저항값이 감소하는 압저항 센서입니다 [S18].
  - question: 분압 회로에서 FSR을 사용하여 힘을 측정할 때 고정 저항의 역할은 무엇인가?
    choices:
    - 전압을 무한대로 증폭하기 위해
    - 회로의 전류를 완전히 차단하기 위해
    - 센서 저항 변화를 전압 신호로 변환하기 위해
    - 센서를 보호하는 퓨즈 역할
    answer_index: 2
    explanation: FSR은 가변 저항이므로 고정 저항과 함께 분압기를 구성하여 저항 변화를 전압으로 변환해야 ADC가 값을 읽을 수 있습니다.
  completion_criteria:
  - FSR 데이터 수집 및 물리 단위 변환 성공
  - 교정된 알고리즘을 통한 로봇손 파지력의 정밀한 제어 수행
  - 노이즈 필터링이 적용된 센서 데이터 출력 확인
  source_ids:
  - S18
- id: M8
  slug: performance-testing
  phase_id: P3
  title: 시스템 검증 및 성능 시험
  estimated_hours: 15.0
  prerequisites:
  - M7
  objectives:
  - 로봇 시스템 검증의 기본 개념과 산업 안전 표준(IEC 60204-1)의 의의를 이해한다.
  - 로봇손의 성능 지표인 반복 정밀도와 최대 파지력을 측정하고 분석한다.
  - 내구 시험을 통해 기구학적 설계의 신뢰성을 검증한다.
  - 시스템 전기적 안전성 및 비상 정지 메커니즘을 평가한다.
  theory_markdown: '## 시스템 검증의 중요성

    로봇 시스템의 최종 단계는 설계된 기능이 실제 환경에서 의도대로 작동하는지 입증하는 ''검증(Verification)''과 ''타당성 확인(Validation)''입니다.
    본 모듈에서는 정교한 5지 로봇손의 성능을 기계적, 전기적 측면에서 검증합니다.


    ### 1. 기계적 성능 지표

    - **반복 정밀도(Repeatability):** 동일한 명령을 반복했을 때 목표 위치에 도달하는 오차 범위. 주로 5회 이상 반복 측정하여
    표준편차를 구합니다.

    - **최대 파지력(Grip Force):** 액추에이터가 낼 수 있는 최대 힘을 측정하며, 센서(로드셀 등)를 사용하여 손가락 끝단에서의
    힘을 정량화합니다.

    - **내구 시험(Durability Test):** 정해진 시간 동안 연속적으로 움직였을 때 관절부의 유격 발생이나 재료 피로 현상을 확인합니다.


    ### 2. 전기적 안전 표준(IEC 60204-1)

    IEC 60204-1은 기계의 전기 장비에 대한 일반 요구사항을 정의합니다 [S25]. 본 로봇손 설계 시 다음을 준수해야 합니다:

    - **과전류 보호:** 시스템 과부하 시 전원 차단.

    - **비상 정지(Emergency Stop):** 시스템 이상 감지 시 즉각적으로 동력을 차단하는 안전 회로(Safe Torque Off
    등) [S25].

    - **전자기 적합성(EMC):** 제어 신호가 노이즈로부터 보호되도록 접지 및 배선 설계 [S25].'
  worked_examples:
  - '예제 1: 반복 정밀도 측정 계산. 5회 측정값 [10.1mm, 9.9mm, 10.0mm, 10.2mm, 9.8mm]의 평균은 10.0mm,
    표준편차는 약 0.158mm. 허용 오차 이내인지 확인.'
  - '예제 2: 전류 제한 회로 설계. 액추에이터 정격 전류가 1.5A일 때, 시스템 보호를 위해 1.8A에서 전원을 차단하는 퓨즈나 전자식 차단기
    용량 산정.'
  lab:
    title: 로봇손 종합 성능 시험
    steps:
    - 벤치 전원 장치를 통해 전압을 인가하고 초기 전류 소모량 확인.
    - 각 손가락을 제어하여 목표 위치 이동 후 오차 측정.
    - 로드셀을 이용하여 각 손가락의 파지력 데이터 수집.
    - 1,000회 연속 작동 내구 시험 수행.
    - 비상 정지 버튼 작동 시 모터 동력 차단 여부 확인.
    safety:
    - 보안경 착용 필수.
    - 모든 테스트는 저전압 벤치 전원 사용.
    - 움직이는 손가락 관절 사이에 손가락 끼임 주의.
    - 비상 전원 차단 장치 손 근처 배치.
    deliverables:
    - 반복 정밀도 데이터 시트
    - 파지력 측정 그래프
    - 내구 시험 후 기구부 마모 사진
    - 안전 표준 준수 확인서
  assignment:
    title: 최종 검증 보고서 작성
    deliverables:
    - 설계 사양과 측정 성능 비교표
    - 시스템 안전 기능 설명서
    - 성능 향상을 위한 개선 계획
    rubric:
    - 측정 데이터의 신뢰성과 통계적 분석의 정확성
    - IEC 60204-1 안전 요구사항 준수 여부
    - 결론의 논리성과 데이터 기반의 개선 방안 제시
  quiz:
  - question: IEC 60204-1 표준이 다루는 주된 내용은 무엇입니까?
    choices:
    - 기계의 기구학적 설계 방식
    - 기계의 전기 장비에 대한 일반 안전 요구사항
    - 로봇 제어 알고리즘의 최적화
    - 3D 프린팅 재료의 강도 측정
    answer_index: 1
    explanation: IEC 60204-1은 기계의 전기적, 전자적 장비 및 시스템에 대한 안전 요구사항을 다루는 국제 표준입니다 [S25].
  - question: 반복 정밀도를 평가하는 가장 적절한 통계 지표는 무엇입니까?
    choices:
    - 측정값의 총합
    - 최대값과 최소값의 차이
    - 표준편차(Standard Deviation)
    - 측정 횟수
    answer_index: 2
    explanation: 반복 정밀도는 데이터가 평균값으로부터 얼마나 흩어져 있는지를 나타내는 표준편차를 통해 평가합니다.
  completion_criteria:
