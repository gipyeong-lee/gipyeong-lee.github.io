- id: m3
  slug: cad-modeling
  phase_id: p1
  title: 3D CAD 모델링
  estimated_hours: 15.0
  prerequisites:
  - m2
  objectives:
  - 3D CAD 모델링의 설계 제약 사항과 제조 프로세스(FDM)를 이해한다.
  - 구조적 강성을 높이는 PC-CF 필라멘트 활용 기법을 학습한다.
  - 열압입 인서트와 베어링 공차를 고려한 정밀 조립 설계를 수행한다.
  theory_markdown: '### 3D CAD 모델링과 제조 설계


    정교한 5지 로봇손 제작을 위해서는 FDM 방식의 적층 제조 특성을 고려한 설계(Design for Additive Manufacturing,
    DfAM)가 필수적입니다. 탄소섬유가 함유된 PC-CF 필라멘트는 기계적 강성과 치수 안정성이 우수하여 정밀 링크 제작에 적합합니다 [S21].


    #### 핵심 설계 고려 사항

    1. **공차 관리 및 베어링 장착**: 8mm 정밀 알루미늄 샤프트와 igus JSM-0810-10 베어링 사용 시, 하우징 보어 공차를
    설계에 반영해야 합니다. 베어링은 압입(Press-fit) 방식으로 고정되므로, 보어 내경은 베어링 외경(10mm)보다 미세하게 작게 설계하여
    견고한 조립을 유도합니다 [S19, S20].

    2. **체결 부품 설계**: PC-CF 출력물은 나사산을 직접 내기에 부적합합니다. 반복적인 분해 조립의 재현성을 위해 HTBI-M3-BR
    황동 열압입 나사산 인서트를 사용합니다. 이를 위해 설계 시 4mm 직경의 파일럿 홀을 배치해야 합니다 [S23].

    3. **구조 최적화**: 텐던 구동 방식에서는 장력에 의해 링크가 변형될 수 있습니다. 응력이 집중되는 관절 부위는 벽 두께를 확보하고,
    적층 방향이 인장 강도에 유리하도록 모델을 배치합니다.


    ### 시스템 통합 및 안전

    본 프로젝트의 전기적 시스템은 3개의 독립적인 12V 전원 분기로 구성됩니다. 액추에이터 구동 시 과전류 보호를 위해 분기마다 10A ATOF
    퓨즈를 반드시 장착해야 하며, 액추에이터는 4/4/3대 비율로 분배하여 피크 전류를 관리합니다 [S17, S26]. 센서 신호 취득 시 FSR
    402 센서는 3.3V 센서 전원 레일에서 분압 저항을 통해 ADC 입력값을 생성해야 하며, 12V 액추에이터 전원과 완전히 분리되어야 합니다
    [S15, S16, S27].'
  worked_examples:
  - '**인서트 홀 설계**: Accu-components의 M3 인서트 외경이 4.4mm이므로, 3D CAD에서 출력물에 4.0mm의 파일럿
    홀을 모델링합니다 [S23]. 출력 후 인서트를 가열하여 삽입하면 황동 소재가 플라스틱 내부에 안착되어 견고한 M3 암나사가 형성됩니다.'
  - '**베어링 하우징 공차**: igus 베어링 JSM-0810-10을 사용할 때, 10mm 하우징 보어는 압입 후 내경이 8mm 정밀 샤프트와
    유격 없이 밀착되도록 설계합니다. 너무 넓으면 축 유격이 발생하고, 너무 좁으면 베어링이 파손되므로 시험 출력을 통해 공차를 조정합니다 [S19,
    S20].'
  lab:
    title: 정밀 링크 설계 및 조립 검증
    steps:
    - 제공된 텐던 경로와 관절 메커니즘을 3D CAD로 설계하고 시뮬레이션한다.
    - PC-CF 필라멘트를 FDM 프린터에 로드하고 경화강 노즐을 사용하여 시편을 출력한다 [S21].
    - 출력물에 4mm 파일럿 홀을 확인한 후 열압입 인서트를 삽입한다 [S23].
    - 8mm 알루미늄 샤프트와 베어링을 조립하여 링크의 회전 자유도를 확인하고 유격을 측정한다 [S19, S20].
    - 멀티미터를 사용하여 독립적인 3개 전원 분기의 퓨즈 홀더 연결 상태를 확인하고, 통전 전 퓨즈가 정상적으로 장착되었는지 검사한다 [S25,
      S26].
    safety:
    - 충격 방지 작업용 보안경을 항시 착용한다.
    - 열압입 작업 시 화상에 주의하고 통풍이 잘되는 곳에서 작업한다.
    - 전원 인가 시 반드시 고정 지그를 사용하고, 회전 부위에 손을 절대 넣지 않는다.
    - 시스템을 정비하거나 접근할 때는 반드시 3개의 전원 어댑터를 물리적으로 분리하고 멀티미터로 1V 미만임을 확인한다.
    deliverables:
    - 로봇손 전체 조립 3D CAD 모델링 파일
    - 인서트 및 베어링 공차 조정을 포함한 설계 검증 보고서
    - 전원 분기별 독립 연결 상태 및 퓨즈 장착 검사 사진
  assignment:
    title: 로봇손 기구 설계 및 통합 배선 계획
    deliverables:
    - 모든 링크와 관절이 포함된 상세 3D CAD 설계 파일
    - BOM과 설계 일치성 확인 보고서
    - 3개 독립 분기 및 퓨즈 배치도가 포함된 배선도
    rubric:
    - 3D 설계가 적층 제조 공차와 황동 인서트 규격(4.4mm OD)을 준수하는가?
    - 베어링 하우징과 샤프트 간의 유격이 적절한가?
    - 전기 배선도에서 12V 액추에이터 전원과 센서 회로가 분리되었으며, 각 분기마다 10A 퓨즈가 설계되었는가?
  quiz:
  - question: PC-CF 필라멘트로 출력된 모델에 나사산이 필요한 경우 가장 적절한 방법은?
    choices:
    - 출력 시 나사산을 직접 모델링하여 출력한다.
    - 황동 열압입 인서트를 가열하여 삽입한다.
    answer_index: 1
    explanation: PC-CF 소재에 직접 나사산을 모델링하는 것보다 반복 조립 재현성을 위해 황동 열압입 인서트를 사용하는 것이 권장됩니다
      [S23].
  - question: 3개의 독립적인 12V 전원 분기를 구성할 때 주의사항은?
    choices:
    - 어댑터의 양(+) 출력을 병렬로 연결하여 전류 용량을 늘린다.
    - 각 분기는 독립적인 10A 퓨즈를 통해 과전류를 보호한다.
    answer_index: 1
    explanation: 독립 전원 어댑터의 양(+) 출력은 병렬 연결이 금지되며, 각 분기별로 독립 퓨즈를 장착하여 보호해야 합니다 [S17,
      S26].
  - question: FSR 힘 감지 센서 구동을 위한 전압원은 무엇을 사용해야 하는가?
    choices:
    - OpenCR의 3.3V 센서 전원 레일
    - 12V 액추에이터 전원 레일
    answer_index: 0
    explanation: FSR 분압 회로는 반드시 3.3V 센서 전원 레일에서 전력을 공급받아야 하며, 액추에이터 전원과 분리되어야 합니다
      [S16].
  completion_criteria:
  - 3D CAD 설계 파일이 인서트와 베어링 규격에 맞춰 정확히 작성되었음.
  - 배선도에서 3개의 독립 전원 분기와 퓨즈 구성이 확인되었음.
  - 설계 및 검증 보고서를 포함한 과제물이 제출되고 기준 루브릭을 통과하였음.
  source_ids:
  - S12
  - S21
  - S19
  - S20
  - S23
  - S17
  - S26
  - S15
  - S16
  - S27
  - S25
- id: m4
  slug: electronics-fundamentals
  phase_id: p2
  title: 전자 회로 기초
  estimated_hours: 12.0
  prerequisites:
  - m3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 전기적 특성과 전원 시스템 이해
  - FSR 402 센서를 활용한 전압 분압 회로 설계 및 ADC 신호 취득
  - 시스템 과전류 보호를 위한 퓨즈 기반 전원 분기 설계
  - 전기 회로의 절연 및 물리적 안전 분리 원칙 숙지
  theory_markdown: 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream
    master disconnect로 3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이
    없으면 시스템 통전을 금지한다. 토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만
    수행한다 [S14] [S17] [S26, S25] [S26] [S15] [S27] [S16]
  worked_examples:
  - '예제 1: 분기 전원 전류 합계 계산. 한 분기에 4대의 액추에이터(스톨 전류 각 2.3 A)가 할당된 경우, 최대 이론 전류는 9.2 A입니다.
    이는 10 A 퓨즈의 정격 이내이며, 어댑터의 11.5 A 출력 한도를 초과하지 않아 안전하게 구동 가능합니다 [S14, S17, S26].'
  - '예제 2: FSR 분압기 출력 계산. FSR에 힘이 가해져 센서 저항이 10 kΩ이 되었을 때, 분압 노드의 전압은 3.3 V * (10
    kΩ / (10 kΩ + 10 kΩ)) = 1.65 V가 됩니다. 이는 OpenCR 12비트 ADC의 유효 범위 내에 있으므로 정밀한 힘 피드백이
    가능합니다 [S15, S16, S27].'
  lab:
    title: 전원 분기 구성 및 센서 입력 시험
    steps:
    - 각 MEAN WELL 어댑터 출력선에 0AFH0001Z 인라인 홀더와 10 A ATOF 퓨즈를 직렬로 설치합니다 [S17, S25, S26].
    - 각 분기의 12 V 전압이 정상 범위인지 멀티미터로 측정합니다.
    - OpenCR 3.3 V 핀과 10 kΩ 저항, FSR 402를 사용하여 분압 회로를 브레드보드에 구성합니다 [S16, S27].
    - 센서 전압이 0~3.3 V 범위 내에 있는지 확인하고 힘을 가할 때 전압 변화를 관찰합니다.
    safety:
    - 정비 및 접근 전 3개 전원 어댑터를 물리적으로 분리한 뒤, 각 분기의 DC 전압이 1 V 미만인지 멀티미터로 반드시 확인합니다.
    - 회로 구성 중 전원 인가 금지. 전압 측정은 모든 결선 완료 후 고정 지그 상태에서 수행합니다.
    - 충격 방지 작업용 보안경을 항시 착용합니다.
    - 액추에이터 전원(12 V)과 센서 전원(3.3 V)을 절대로 혼선하지 않습니다.
    deliverables:
    - 회로별 전압 측정 데이터 시트
    - FSR 힘 센서의 힘-전압 반응 곡선 플롯
    - 과전류 보호를 위한 분기별 퓨즈 결선 사진
  assignment:
    title: 전원 배분 및 센서 데이터 수집 설계
    deliverables:
    - 액추에이터 분기별 전력 할당 계획서
    - OpenCR ADC 회로도를 포함한 배선도
    - 퓨즈 정격 선정 논리 보고서
    rubric:
    - 전원 분기 합산 전류가 각 어댑터의 허용 범위를 준수함
    - FSR 회로가 3.3 V 센서 레일에만 연결됨
    - 퓨즈가 과전류 보호를 적절히 수행할 수 있는 정격으로 선정됨
  quiz:
  - question: 다음 중 전원 분기 구성 시 금지되는 행위는 무엇인가?
    choices:
    - 분기별로 10 A 퓨즈를 직렬로 설치하는 것
    - 독립된 어댑터의 양(+) 단자들을 병렬로 연결하는 것
    - 액추에이터를 4:4:3으로 배분하는 것
    - FSR 센서를 3.3 V 레일에 연결하는 것
    answer_index: 1
    explanation: 각 어댑터 출력은 독립적인 분기로 사용해야 하며, 전원 어댑터 출력 간 병렬 연결은 시스템 고장 및 화재 위험을 초래할
      수 있어 절대 금지됩니다.
  - question: FSR 402 센서 전압 분압 회로 구성 시 주의사항으로 옳은 것은?
    choices:
    - 12 V 액추에이터 전원 레일을 사용해야 한다.
    - 5 V 전원을 사용하여 ADC 해상도를 높여야 한다.
    - OpenCR의 3.3 V 센서 전원을 사용해야 한다.
    - 저항 없이 FSR만 연결해야 한다.
    answer_index: 2
    explanation: FSR 센서의 전압 신호는 OpenCR ADC 입력 범위(0~3.3 V)를 넘지 않아야 하므로, 반드시 3.3 V 센서
      전원을 사용해야 합니다.
  completion_criteria:
  - 모든 전원 분기 회로의 전압이 1 V 미만으로 물리적 분리됨을 멀티미터로 입증
  - 퓨즈 장착 및 3.3 V 전원 분압 회로 구성 완료
  - FSR 센서 신호가 OpenCR ADC에서 0~3.3 V 내에서 정상적으로 취득됨을 확인
  source_ids:
  - S6
  - S9
  - S14
  - S17
  - S26
  - S25
  - S15
  - S27
  - S16
- id: m5
  slug: actuators-sensors
  phase_id: p2
  title: 액추에이터 및 센서 통합
  estimated_hours: 13.0
  prerequisites:
  - m4
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 제어 신호와 전원 배분 구조를 이해한다.
  - FSR(힘 감지 저항) 센서의 동작 원리를 파악하고 OpenCR 제어기에서 전압 분압 회로를 설계한다.
  - 액추에이터 전원 분기 및 개별 퓨즈 보호의 중요성을 습득한다.
  - 텐던 구동 시스템의 기구적 특성과 전자 제어 피드백의 연동 방법을 익힌다.
  theory_markdown: 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream
    master disconnect로 3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이
    없으면 시스템 통전을 금지한다. 토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만
    수행한다 [S14] [S16] [S17] [S15] [S27] [S26]
  worked_examples:
  - '예제 1: 액추에이터 분기별 최대 부하 계산. 1개 액추에이터 스톨 전류 2.3 A인 경우[S14], 4대 액추에이터가 배치된 분기의 최대
    피크 전류는 4 * 2.3 A = 9.2 A이다. 이는 10 A 퓨즈의 정격 이내이며[S26], 11.5 A 어댑터 출력 사양을 초과하지 않아
    안전하다[S17].'
  - '예제 2: FSR 분압 회로의 ADC 전압 산출. 센서 저항을 R_fsr, 고정 저항을 R_fixed(10 kΩ)라고 할 때, ADC 입력
    전압 V_adc = 3.3V * (R_fixed / (R_fsr + R_fixed))이다[S16, S27]. 접촉력이 없을 때(무한대 저항)
    V_adc는 0 V, 최대 접촉 시 센서 저항이 고정 저항보다 작아지면 V_adc는 3.3 V에 가까워지며 힘 데이터를 디지털화한다.'
  lab:
    title: 액추에이터 및 FSR 센서 통합 시험
    steps:
    - 각 어댑터 출력단에 ATO 인라인 퓨즈 홀더를 연결하고 10 A 퓨즈를 삽입한다[S25, S26].
    - DYNAMIXEL 액추에이터 하네스를 퓨즈 이후의 전원 분기에 연결한다[S9].
    - FSR 센서와 10 kΩ 저항을 사용하여 전압 분압 회로를 구성하고 OpenCR의 3.3 V ADC 포트에 연결한다[S16, S27].
    - 멀티미터를 DC 전압 모드로 설정하고 각 분기의 출력 전압이 12 V인지 확인한다.
    - 소프트웨어로 액추에이터를 저속 무부하 회전시키며 통신 상태를 점검한다.
    safety:
    - 정비 전 3개의 전원 어댑터를 물리적으로 분리한 후 1 V 미만인지 측정하여 무전원 상태를 확인한다.
    - 전원 인가 중에는 손을 액추에이터 가동 범위에 넣지 않는다.
    - 회로 시험 시 보안경을 반드시 착용한다.
    - 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream master
      disconnect로 3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이 없으면
      시스템 통전을 금지한다. 토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만
      수행한다
    deliverables:
    - 분기별 전압 측정 교정 기록지
    - FSR 센서 압력-ADC값 특성 곡선 그래프
    - 정상 작동 상태의 로봇손 하네스 사진 및 배선도
  assignment:
    title: 전원 시스템 설계 및 피드백 로직 구현
    deliverables:
    - 액추에이터 분기별 부하 배분 및 퓨즈 보호 계산서
    - FSR 센서 데이터를 이용한 파지력 제어 알고리즘(의사 코드)
    - 최종 배선 및 전원 통합 설계 보고서
    rubric:
    - 12 V 액추에이터와 3.3 V 센서 레일이 올바르게 분리되었는가?
    - 분기별 최대 피크 전류가 퓨즈 정격을 초과하지 않는가?
    - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다?
    - 안전 수칙에 따른 전원 물리 분리 절차를 이해하였는가?
  quiz:
  - question: FSR 전압 분압 회로의 공급 전원으로 적절한 것은?
    choices:
    - 12 V 액추에이터 전원
    - OpenCR 3.3 V 센서 전원
    answer_index: 1
    explanation: FSR 센서의 ADC 신호는 OpenCR의 3.3 V 센서 레일을 사용해야 하며, 12 V 액추에이터 전원과는 전기적으로
      완전히 분리되어야 한다.
  - question: 분기별 퓨즈 보호의 주된 목적은 무엇인가?
    choices:
    - 전압을 12 V로 강제 고정하기 위해
    - 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream master
      disconnect로 3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이 없으면
      시스템 통전을 금지한다. 토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만
      수행한다
    answer_index: 1
    explanation: 각 분기에 배치된 10 A 퓨즈는 액추에이터 피크 전류를 허용하면서 배선 쇼트 등 고장 발생 시 과전류로부터 시스템을
      보호한다.
  - question: 절연형 전원 어댑터의 독립된 양(+) 출력끼리 연결해도 되는가?
    choices:
    - 분기 전류 합산을 위해 반드시 연결해야 한다
    - 절대 금지하며 각 분기를 독립적으로 유지해야 한다
    answer_index: 1
    explanation: 독립형 분기 구조를 위해 양(+) 출력 병렬 연결은 절대 금지되며, 각 출력은 물리적으로 분리된 전원 하네스로 운영되어야
      한다.
  completion_criteria:
  - 각 액추에이터 분기에서 12 V 전압이 정상적으로 계측됨을 확인하였다.
  - FSR 센서 데이터를 제어기로 정상 취득하고, 접촉력 변화에 따른 ADC값 변화를 입증하였다.
  - 시스템 전원을 물리적으로 차단하고 1 V 미만인 상태에서 안전하게 정비 접근을 수행할 수 있다.
  - 모든 실습 과제 및 안전 준수 서약서를 제출하였다.
