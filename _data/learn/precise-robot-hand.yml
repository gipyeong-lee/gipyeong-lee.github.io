- id: mod-1
  slug: intro-robot-mechanics
  phase_id: phase-1
  title: 로봇 기구학 및 손 설계 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 인체 손의 해부학적 구조와 로봇 공학적 설계 모델 간의 관계를 이해한다.
  - 텐던 구동(Tendon-driven) 메커니즘의 기본 원리와 장단점을 분석한다.
  - 로봇 손 설계 시 고려해야 할 기구학적 구속 조건과 자유도(DOF)를 정의한다.
  - 안전한 전력 분기 설계 및 비상 정지 시스템의 전기적 통합 원리를 습득한다.
  theory_markdown: '### 로봇 손의 기구학적 설계

    인체 손은 복잡한 다중 관절 시스템으로, 다양한 파지(Grasping) 및 조작(Manipulation) 작업을 수행한다. 로봇 손 설계의
    핵심은 인체의 정교한 기능을 단순화된 기구학적 모델로 모사하는 것이다 [S1]. 이를 위해 주로 텐던(Tendon) 구동 방식을 채택하며,
    이는 액추에이터를 손가락과 분리된 곳에 배치하여 무게를 줄이고 민첩성을 높이는 이점을 가진다 [S1, S7].


    ### 기구학적 구속과 UNDERACTUATION

    로봇 설계 시 완전 구동(Fully-actuated) 방식은 제어가 명확하나 구조가 무거워지며, 부족 구동(Underactuated) 방식은
    적은 액추에이터로도 인체와 유사한 적응형 파지를 가능하게 한다 [S7]. 본 교과과정에서는 정밀 제어를 위해 액추에이터를 다수 배치하되, 텐던의
    신율이 낮은 Dyneema SK78을 사용하여 정밀도를 확보한다. 신율이 1% 미만인 텐던은 제어 응답성을 극대화한다.


    ### 시스템 안전 및 전력 설계

    로봇 손 제어 보드(OpenCR)와 고출력 액추에이터는 독립된 전원 분기를 가져야 한다. 액추에이터 전원(12 V)은 반드시 분리된 3개의
    절연 어댑터와 10 A 퓨즈 분기를 통해 공급하며, 양(+) 출력 단자를 병렬로 연결하는 것은 절대 금지된다 [S14, S25]. 비상 정지
    장치는 래칭 푸시버튼이 접촉기(EV200)의 제어 코일 회로를 개방하도록 설계하여, 전력 공급을 물리적으로 차단한다 [S22, S23].'
  worked_examples:
  - '예제 1: 텐던 구동 시스템의 토크 계산

    액추에이터 스톨 토크가 4.1 N·m이고 캡스턴 반지름이 0.01 m일 때, 이론적 최대 인장력은 F = T / r = 4.1 / 0.01
    = 410 N이다. Dyneema SK78(230 daN ≈ 2300 N)은 이 하중을 충분히 견딜 수 있다 [S10, S15].'
  - '예제 2: 전원 분기 부하 검토

    액추에이터 11개를 4, 4, 3대로 분산 배치한다. 한 분기에 4대 배치 시 피크 전류는 2.3 A × 4 = 9.2 A이다. 이는 10
    A 분기 퓨즈의 보호 범위 내에 있으며, 독립 전원(11.5 A)보다 낮아 안전하다 [S10, S14, S25].'
  lab:
    title: 로봇 손 기구 및 비상 정지 회로 기초 실습
    steps:
    - FDM 3D 프린터와 경화강 노즐을 사용하여 PC-CF 링크 출력물을 제작하고 M3 인서트를 삽입한다.
    - 8 mm 알루미늄 샤프트를 베어링 규격에 맞춰 절단 및 모따기 가공한다.
    - 독립된 3개의 12 V 전원 어댑터 출력 각각에 ATO 인라인 퓨즈 홀더를 직렬 연결한다.
    - 비상 정지 NC 회로를 구성하여 EV200 접촉기 코일의 전원을 연결하고 스위치 조작 시 차단 여부를 멀티미터로 확인한다.
    safety:
    - PC-CF 출력 시 고온 노즐 및 베드 주의(285°C/110°C).
    - 전원 분기 작업 시 반드시 퓨즈를 삽입하고 양(+) 단자 병렬 연결 금지.
    - 비상 정지 시험 시 액추에이터 전원 분기를 안전한 부하 상태에서 측정.
    - 회전체 조립 시 반드시 전원을 분리하고 보안경 착용.
    deliverables:
    - 조립된 손가락 관절 모듈(회전 공차 확인).
    - 전원 분기별 전압 강하 측정 기록.
    - 비상 정지 스위치 작동 및 접촉기 차단 검증 영상.
  assignment:
    title: 기구학 및 전기 안전 설계 보고서
    deliverables:
    - 로봇 손 기구 모델 설계 CAD 도면.
    - 액추에이터 및 전원 부하 배분 전기 회로도.
    - 안전 설계 준수 요약표.
    rubric:
    - 기구학적 링크 설계가 자유도와 적절한 베어링 사용을 반영하였는가?
    - 전원 분기 배분이 BOM 사양 및 퓨즈 용량과 일치하는가?
    - 비상 정지 회로가 독립 전원 분기를 동시에 차단하도록 설계되었는가?
  quiz:
  - question: DYNAMIXEL XM430 액추에이터 분기 설계 시 올바른 조치는?
    choices:
    - 전원 공급 능력을 높이기 위해 3개 어댑터의 (+) 출력을 병렬 연결한다.
    - 각 분기는 10 A 퓨즈를 사용하여 독립적으로 보호한다.
    - 퓨즈는 생략하고 제어 보드 내부 보호 기능만 사용한다.
    - 5 V 센서 레일을 액추에이터 전원과 공유한다.
    answer_index: 1
    explanation: 독립된 분기 사용과 분기당 퓨즈 설치는 필수적인 안전 요구사항입니다. (+) 출력 병렬 연결은 금지됩니다 [S14,
      S25].
  - question: 비상 정지 장치(EV200)의 올바른 사용법은?
    choices:
    - 주 모터 전류 라인을 직접 절단한다.
    - 비상 정지 푸시버튼으로 접촉기의 코일 전원을 차단하여 간접 제어한다.
    - 저항을 사용하여 전류를 제한한다.
    - 사용하지 않아도 펌웨어로 차단이 가능하다.
    answer_index: 1
    explanation: 비상 정지 스위치는 제어 회로의 코일을 개방하여 안전하게 독립 분기를 차단하는 용도로 사용합니다 [S22, S23].
  completion_criteria:
  - 모든 기구적 조립 단계(베어링, 텐던, 프레임)가 완료되었는가?
  - 전원 분기당 10 A 퓨즈 및 EV200 접촉기 회로가 구성되었는가?
  - 멀티미터로 각 분기별 독립성 및 비상 정지 작동 확인을 완료했는가?
  source_ids:
  - S1
  - S7
- id: mod-2
  slug: cad-modeling
  phase_id: phase-1
  title: 로봇 손 CAD 설계
  estimated_hours: 15.0
  prerequisites:
  - mod-1
  objectives:
  - 로봇 손 설계의 핵심 요소인 자유도(DOF)와 운동학적 구조를 이해한다.
  - 'CAD 도구(예: Fusion 360, SolidWorks)를 사용하여 강성 및 경량화된 로봇 손 링크를 모델링한다.'
  - 텐던 구동 로봇 손에서 캡스턴 및 텐던 경로의 최적 설계 원리를 파악한다.
  - FDM 3D 프린팅을 위한 출력 방향성 및 조립 공차(Tolerance) 관리법을 익힌다.
  theory_markdown: '### 로봇 손 설계의 핵심 원리


    로봇 손(Dexterous Hand) 설계는 인체 구조를 모방하면서도, 제한된 크기 안에 구동기(Actuator)와 전달 기구(Transmission)를
    배치해야 하는 고난도 작업입니다. Ruka-v2와 같은 텐던 구동 로봇 손은 구동기를 손바닥 내부 혹은 팔뚝에 배치하고, 텐던(Dyneema
    SK78)을 통해 장력을 원격 전달하여 손가락을 제어합니다 [S8].


    #### 1. 운동학적 설계와 자유도(DOF)

    로봇 손의 정밀도는 자유도 배분에 달려 있습니다. 손가락별 2개 자유도와 엄지의 추가 자유도를 설계할 때, 캡스턴(Capstan) 설계가 중요합니다.
    텐던은 회전축에서 일정한 모멘트 암(Moment arm)을 유지하며 움직여야 하며, 이를 위해 텐던 경로가 굽힘 시에도 꼬이거나 풀리지 않도록
    가이드 경로를 설계해야 합니다 [S8].


    #### 2. 재료 역학 및 설계 고려사항

    FDM 방식을 사용할 때, 적층 방향(Build orientation)은 부품의 파손 강도에 큰 영향을 줍니다. PC-CF 필라멘트와 같은
    엔지니어링 소재를 사용할 때, 하중이 인가되는 방향으로 적층 레이어가 수직이 되도록 설계하여 층간 분리 현상을 방지해야 합니다 [S18].
    또한, 나사 체결부의 반복 조립성을 위해 M3 황동 열압입 인서트를 활용한 하우징 설계가 필수적입니다 [S20].


    #### 3. 조립 공차 관리

    슬리브 베어링(JSM-0810-10)을 사용할 경우, 축(8 mm)과 하우징 보어 사이의 공차를 고려해야 합니다. 일반적으로 정적/동적 상태에서의
    부드러운 회전을 위해 제조사의 권장 공차를 CAD 설계 시 반영해야 하며, 이는 조립 완성도와 직결됩니다 [S16, S17].'
  worked_examples:
  - '예제 1: 텐던 모멘트 암 계산. 구동기 스톨 토크 4.1 N·m를 활용하여 손가락 끝에 필요한 최소 파지력을 계산할 때, 텐던의 경로 반경을
    10 mm로 설정하면 계산되는 장력은 T = Torque / Radius = 4.1 N·m / 0.01 m = 410 N입니다. 이는 텐던의
    파단 하중 230 daN(약 2300 N)을 충분히 견딜 수 있는 설계임을 시사합니다 [S10, S15].'
  - '예제 2: 인서트 설계. M3 황동 열압입 인서트(외경 4.4 mm)를 사용하기 위해, CAD 설계에서 파일럿 홀 지름을 4.0 mm로 설정하여
    압입 시 플라스틱이 충분히 유동하여 고정되도록 설계합니다 [S20].'
  lab:
    title: 로봇 손 링크 및 손바닥 프레임 모델링
    steps:
    - 제공된 로봇 손 운동학 다이어그램을 바탕으로 각 링크의 중심축과 회전 중심을 CAD에 스케치한다.
    - 슬리브 베어링 규격(JSM-0810-10)을 적용하여 축 하우징 보어를 10 mm로 모델링한다.
    - 나사 체결부에 열압입 인서트(HTBI-M3-BR)용 파일럿 홀(4.0 mm)을 배치한다.
    - 링크 설계 시 하중 집중 부위에 리브(Rib) 구조를 추가하여 강성을 보강한다.
    - 부품 조립 환경(Assembly)에서 축과 베어링, 나사의 간섭(Interference)을 확인한다.
    safety:
    - CAD 작업 중 장시간 스크린 응시로 인한 피로를 주의한다.
    - 3D 프린팅 후 출력물 제거 시 날카로운 스크래퍼 사용으로 인한 절상 주의.
    - 열압입 인서트 작업 시 인두기 고온(약 285°C)에 의한 화상 주의.
    deliverables:
    - 로봇 손 전체 CAD 조립 파일
    - 각 파트별 단품 도면(PDF)
    - 부품별 치수 및 공차 명시서
  assignment:
    title: 로봇 손 파지 기구 최적화 설계
    deliverables:
    - 최적화된 손가락 링크 CAD 파일
    - 텐던 경로 시뮬레이션 결과 보고서
    - 부품 목록(BOM) 및 재료 명세서
    rubric:
    - CAD 모델이 정해진 베어링 및 나사산 규격과 정확히 일치하는가?
    - 3D 프린팅 적층 방향과 강성 고려가 적절하게 반영되었는가?
    - 텐던 경로가 간섭 없이 자연스럽게 구성되었는가?
  quiz:
  - question: FDM 방식의 PC-CF 소재 출력물에서 반복 조립성을 확보하기 위한 가장 적절한 방법은?
    choices:
    - 플라스틱에 직접 M3 나사산 내기
    - M3 황동 열압입 나사산 인서트 사용
    - 접착제로 나사를 고정하기
    - 구멍을 나사 지름보다 작게 설계하기
    answer_index: 1
    explanation: PC-CF 출력물은 직접 나사를 체결할 경우 마모되기 쉬우므로, 열압입 인서트를 사용하여 반복적인 조립 및 분해를 보장해야
      합니다 [S20].
  - question: 텐던 구동 시스템에서 구동기의 스톨 토크와 모멘트 암의 관계는?
    choices:
    - 모멘트 암이 길수록 텐던 장력은 커진다.
    - 모멘트 암이 길수록 텐던 장력은 작아진다.
    - 스톨 토크와 관계없이 장력은 일정하다.
    - 스톨 전류가 높을수록 모멘트 암은 작아져야 한다.
    answer_index: 1
    explanation: T = Torque / Radius 관계식에 의해, 구동 토크가 일정할 때 반지름(모멘트 암)이 길어지면 텐던에 걸리는
      장력은 작아집니다.
  - question: 슬리브 베어링 JSM-0810-10의 명칭에서 내경 규격은?
    choices:
    - 10 mm
    - 8 mm
    - 18 mm
    - 10.8 mm
    answer_index: 1
    explanation: 데이터시트에 따르면 JSM-0810-10은 내경(d1) 8 mm, 외경(d2) 10 mm를 의미합니다 [S16].
  completion_criteria:
  - 로봇 손 CAD 모델의 모든 조립부 유격 확인 완료
  - 파일럿 홀 및 베어링 하우징 공차 설계 완료
  - BOM 수량 및 규격의 일관성 확인
  - 모든 퀴즈 정답 통과
  source_ids:
  - S8
- id: mod-3
  slug: 3d-printing-assembly
  phase_id: phase-2
  title: 구조 부품 출력 및 기구 조립
  estimated_hours: 20.0
  prerequisites:
  - mod-2
  objectives:
  - FDM 3D 프린팅의 기술적 매개변수를 이해하고 구조용 소재를 안전하게 다룬다.
  - 정밀 기구 조립을 위한 나사산 인서트 삽입 및 베어링 장착 공정을 숙달한다.
  - 기계적 조립 공차의 중요성을 이해하고 물리적 재현성을 확보한다.
  theory_markdown: '### 3D 프린팅 및 기구 조립 이론


    #### 1. FDM 소재와 노즐 기술

    고강도 탄소섬유 필라멘트(PC-CF)는 치수 안정성과 강성이 우수하여 로봇 구조물 제작에 필수적이다 [S18]. PC-CF는 연마성이 강해
    일반 황동 노즐을 빠르게 마모시키므로, 반드시 경화강 노즐을 사용해야 한다 [S18]. 베드 온도는 110 °C로 유지하여 초기 접착력을 확보하고
    뒤틀림을 방지한다 [S18].


    #### 2. 기구 조립의 재현성: 열압입 인서트

    PC-CF 출력물에 나사 체결을 반복하면 출력물이 손상될 수 있다. 이를 방지하기 위해 열압입 황동 인서트(4.4 mm 외경)를 사용하여 M3
    암나사를 형성한다 [S20]. 이는 반복적인 분해 조립에도 일정한 토크와 정렬을 유지하게 한다.


    #### 3. 마찰 관리: 슬리브 베어링

    로봇 손목과 관절에는 8×10×10 mm 무급유 폴리머 슬리브 베어링을 사용하여 마찰을 최소화한다 [S16]. 이 베어링은 8 mm 정밀 알루미늄
    샤프트와 조립될 때 최적의 공차를 유지해야 하며, 급유 없이도 매끄러운 회전 성능을 제공한다 [S16, S17].'
  worked_examples:
  - '예제 1: PC-CF 출력물 파일럿 홀 계산. M3 인서트 외경 4.4 mm에 대해 CAD 설계 시 4.0 mm 파일럿 홀을 지정하여 적절한
    압입 간섭을 확보한다 [S20].'
  - '예제 2: 텐던 캡스턴 설계. Dyneema SK78 텐던을 사용할 때 모서리 라운딩 처리를 하여 파단 하중 230 daN을 유지하도록 설계한다
    [S15].'
  lab:
    title: 구조 부품 출력 및 기구 조립 실습
    steps:
    - 경화강 노즐이 장착된 FDM 프린터에 PC-CF 필라멘트를 로드한다 [S18].
    - 베드 온도를 110 °C로 설정하고 기계 부품을 출력한다 [S18].
    - 출력물의 파일럿 홀(4.0 mm)에 황동 인서트를 열압입한다 [S20].
    - 슬리브 베어링(8×10×10 mm)을 하우징에 장착하고 8 mm 샤프트를 조립하여 회전 유격을 확인한다 [S16, S17].
    - M3 캡스크루를 사용하여 링크와 센서 브래킷을 조립한다 [S19].
    safety:
    - 고온 노즐(285 °C) 및 베드(110 °C) 화상 주의 [S18].
    - 인서트 삽입 시 납땜 인두 사용에 따른 화상 방지 보안경 착용.
    - 조립 부품의 핀치 포인트(끼임 부위)에 손가락 주의.
    deliverables:
    - 완성된 손가락 링크 및 손바닥 프레임 출력물.
    - 열압입 인서트 및 베어링 조립 부품.
    - 조립 공차 및 정렬 상태 점검 기록.
  assignment:
    title: 기구 조립 재현성 및 내구성 분석
    deliverables:
    - 조립 공정 CAD 도면 및 설계 변경 사유서.
    - 반복 조립 시험 후 인서트 체결 강도 유지 확인서.
    rubric:
    - 인서트 열압입의 수직도 및 정렬 정확도.
    - 베어링 샤프트의 매끄러운 회전 및 유격 관리 여부.
    - 부품 간 체결 안정성 및 규격 준수 정도.
  quiz:
  - question: PC-CF 소재를 3D 프린팅할 때 황동 노즐을 사용하지 않는 이유는 무엇인가?
    choices:
    - 열 전도율이 낮아서
    - 탄소섬유의 연마성으로 인한 노즐 마모 방지
    - 비용이 너무 비싸서
    - 필라멘트 녹는점이 너무 높아서
    answer_index: 1
    explanation: 탄소섬유는 연마성이 매우 강하여 황동 노즐을 빠르게 손상시키므로 경화강 노즐 사용이 필수적이다 [S18].
  - question: 열압입 인서트를 사용하는 주된 이유는 무엇인가?
    choices:
    - 외관을 아름답게 하기 위해
    - 출력물 무게를 줄이기 위해
    - 반복 분해 조립 시 나사산의 내구성을 확보하기 위해
    - 나사 조임 토크를 무제한으로 높이기 위해
    answer_index: 2
    explanation: 출력물에 직접 나사를 체결하면 반복적인 힘에 의해 재료가 손상되므로, 황동 인서트를 통해 나사산의 내구성을 높인다 [S20].
  completion_criteria:
  - 모든 기구 부품의 3D 프린팅 완료.
  - 열압입 인서트와 슬리브 베어링의 완벽한 조립.
  - 각 관절의 유격 확인 및 동작 점검 보고서 제출.
  source_ids:
  - S18
- id: mod-4
  slug: actuator-installation
  phase_id: phase-2
  title: 구동기 및 변속 기구 설치
  estimated_hours: 15.0
  prerequisites:
  - mod-3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 기계적 설치 및 고정 방법을 이해한다.
  - 텐던(Dyneema SK78) 구동 시스템의 텐션 조절 및 설치 원리를 익힌다.
  - 구동기 하네스 배선 및 분기 커넥터(Micro-Fit 3.0) 조립 기술을 습득한다.
  - 비상 정지 회로와 독립 전원 분기의 안전한 배선 설계를 검증한다.
  theory_markdown: '### 구동기 설치 및 동력 전달 시스템


    5지 로봇손의 정밀 제어는 구동기(DYNAMIXEL XM430-W350-T)의 정확한 배치와 텐던(Dyneema SK78)의 장력 유지에 달려
    있습니다. 액추에이터는 12 V 전원 분기를 통해 구동되며, 각 액추에이터는 위치·속도·전류 피드백을 실시간으로 OpenCR 제어 보드에 전달합니다
    [S10].


    #### 텐던 구동 원리

    텐던은 Dyneema SK78 1.5 mm 섬유 라인을 사용합니다. 이 재질은 파단 하중이 230 daN에 달하며 작동 신율이 1% 미만으로
    매우 낮아 [S15], 로봇 관절의 즉각적인 응답성을 보장합니다. 텐던 설치 시 캡스턴 모서리에 마찰이 발생하지 않도록 라운딩 처리를 수행해야
    합니다.


    #### 전원 시스템 및 안전 분기

    본 시스템은 3개의 독립된 12 V 전원 분기를 사용합니다. 각 분기는 MEAN WELL GST160A12-R7B 어댑터로부터 11.5 A
    정격 출력을 제공받으며 [S14], 각 분기마다 10 A ATOF 퓨즈가 직렬로 연결되어 과전류를 방지합니다 [S25]. 비상 정지 장치는
    EV200 접촉기를 통해 3개의 전원 분기 코일을 동시에 차단하여, 단 한 번의 조작으로 전체 동력을 안전하게 차단합니다 [S23]. 전원
    분기 간 양(+) 출력은 전기적으로 절대로 통합하지 않으며, 각 독립 분기를 분리하여 사용합니다.'
  worked_examples:
  - '예제 1: 분기당 퓨즈 용량 계산. 액추에이터 4대의 스톨 전류 합계는 9.2 A입니다 (2.3 A × 4). 10 A ATOF 퓨즈의 냉간
    저항은 7.70 mΩ으로, 정상 작동 시 전압 강하가 거의 없으며 9.2 A 전류를 안전하게 통과시키고 과전류 발생 시 즉시 차단합니다 [S25].'
  - '예제 2: 커넥터 부하 검토. Micro-Fit 3.0 커넥터는 접점당 최대 8.5 A를 허용합니다 [S13]. 구동기 분기당 스톨 전류가
    9.2 A인 경우, 전원 라인을 복수 핀으로 분산 배치하여 단일 접점 부하가 8.5 A를 초과하지 않도록 배선합니다.'
  lab:
    title: 로봇손 구동기 및 텐던 설치 실습
    steps:
    - FDM 출력물(PC-CF)에 M3 황동 인서트를 열압입한다 [S20].
    - XM430-W350-T 액추에이터를 구조물에 고정하고 Micro-Fit 3.0 커넥터 하네스를 제작한다 [S10, S13].
    - Dyneema 텐던을 캡스턴에 감고 관절 말단에 연결하여 초기 장력을 설정한다 [S15].
    - 독립된 3개의 12 V DC 전원 분기 회로에 퓨즈 홀더와 10 A 퓨즈를 장착한다 [S24, S25].
    - 비상 정지 버튼을 EV200 접촉기 제어 회로와 연결하고 통전 시험을 수행한다 [S22, S23].
    safety:
    - 모든 전기 작업은 전원을 완전히 차단한 상태에서 진행한다.
    - 독립된 12 V 분기 간 양(+) 단자 접촉을 절대 금지한다.
    - 구동기 작동 시 손가락 끼임 사고에 주의한다.
    - 비상 정지 회로 시험 시 부하를 연결하지 않고 동작 검증부터 수행한다.
    deliverables:
    - 액추에이터 고정 및 하네스 배선 사진
    - 텐던 장력 및 초기 위치 교정 기록
    - 독립 분기별 전압 측정값 보고서
  assignment:
    title: 동력 시스템 및 배선 설계 검증
    deliverables:
    - 독립 전원 분기 및 퓨즈 보호 설계도
    - 텐던 굽힘 반경 및 마찰 방지 설계안
    - 최종 설치 및 장력 시험 보고서
    rubric:
    - 독립 전원 분기의 분리 원칙 준수 여부(병렬 연결 금지 준수)
    - 비상 정지 장치에 의한 전체 동력 차단 기능의 확실성
    - Dyneema 텐던의 경로 확보 및 고정의 견고함
  quiz:
  - question: 본 시스템에서 3개의 독립 12 V 전원 분기를 병렬로 연결해야 하는가?
    choices:
    - 네, 전류 용량을 높이기 위해 반드시 병렬로 연결해야 합니다.
    - 아니오, 각 분기는 독립적으로 사용해야 하며 양(+) 출력 병렬 연결은 절대 금지됩니다.
    answer_index: 1
    explanation: 각 액추에이터 분기는 전원 공급 장치의 독립된 채널로서 관리되어야 하며, 출력 전압 간의 전위차에 의한 사고를 예방하기
      위해 병렬 연결은 금지됩니다.
  - question: Dyneema SK78 텐던의 주요 특징은 무엇인가?
    choices:
    - 높은 신율(10% 이상)과 낮은 파단 하중을 가짐.
    - 낮은 신율(1% 미만)과 높은 파단 하중(230 daN)을 가짐.
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 낮아 정밀한 힘 전달이 가능하며, 1.5 mm 지름에서 230 daN의
      높은 파단 하중을 견딥니다 [S15].
  - question: 분기 퓨즈(10 A)를 사용하는 이유로 적절한 것은?
    choices:
    - 전압을 12 V로 유지하기 위해 사용함.
    - 배선 및 액추에이터의 고장 시 과전류로부터 회로를 보호하기 위해 사용함.
    answer_index: 1
    explanation: 10 A 퓨즈는 액추에이터 스톨 전류 합계(9.2 A)를 고려하여, 비정상적인 과전류로부터 배선과 장비를 보호하는 안전
      장치입니다 [S25].
  completion_criteria:
  - 모든 11개의 액추에이터가 구조물에 견고하게 설치되었는가?
  - 3개의 독립 전원 분기가 병렬 연결 없이 분리되어 배선되었는가?
  - 비상 정지 장치 작동 시 EV200 접촉기가 모든 액추에이터 분기 전원을 차단하는가?
  - 텐던의 초기 장력이 관절의 유격을 제거하고 원활하게 작동하는가?
  source_ids:
  - S10
  - S15
- id: mod-5
  slug: wiring-safety
  phase_id: phase-2
  title: 배선 및 안전 시스템 통합
  estimated_hours: 10.0
  prerequisites:
  - mod-4
  objectives:
  - 로봇 시스템의 전력 분기 설계를 이해하고 과전류 보호를 위한 퓨즈를 선정한다.
  - 비상 정지 회로의 논리를 이해하고 접촉기를 활용한 다중 전원 차단 시스템을 구현한다.
  - 전기적 노이즈를 방지하기 위해 액추에이터 전원과 제어 신호 회로를 분리한다.
  theory_markdown: '### 로봇 전력 시스템의 안정성과 비상 차단


    정교한 5지 로봇손은 총 11개의 DYNAMIXEL XM430-W350-T 액추에이터를 사용하며, 스톨 전류는 각각 2.3 A입니다. 전체
    시스템의 최대 피크 전류는 11 × 2.3 A = 25.3 A에 달합니다. 안전을 위해 시스템은 3개의 독립적인 12 V 전원 분기로 나누어
    구성되며, 각 분기는 Meanwell GST160A12-R7B(정격 11.5 A) 어댑터를 사용하여 전력을 공급합니다 [S14].


    #### 과전류 보호 및 비상 차단

    독립 분기 합산 정격은 34.5 A로 전체 피크 25.3 A를 초과하여 충분한 마진을 가집니다. 각 분기는 10 A ATOF 퓨즈 [S25]와
    0AFH0001Z 인라인 홀더 [S24]를 통해 과전류를 방지합니다. 비상 정지(E-stop) 기능은 EV200 DC 접촉기 [S23] 3개를
    활용합니다. 비상정지 푸시버튼 [S22]의 NC(Normally Closed) 회로가 차단되면 3개의 접촉기 코일 전원이 동시에 끊어지며,
    액추에이터 분기를 물리적으로 개방하여 비상 정지를 수행합니다. 모든 전력 분기는 전기적으로 독립 유지되어야 하며, 양(+) 출력 단자를 연결하지
    않습니다.'
  worked_examples:
  - '예제 1: 11개 액추에이터 분기 배분. 11대 액추에이터를 전원 어댑터당 4대, 4대, 3대로 분산 배치한다. 전원 1번(4대, 피크 9.2
    A), 2번(4대, 피크 9.2 A), 3번(3대, 피크 6.9 A)으로 분리하여 각 퓨즈(10 A)가 정상 작동하도록 설계한다.'
