modules:
- id: M1
  slug: intro-robotics
  phase_id: PH1
  title: 로봇 공학 기초 및 텐던 구조 이론
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 텐던 구동 언더액추에이티드(underactuated) 로봇손의 기본 원리를 이해한다.
  - 텐던 장력과 관절 토크 사이의 관계를 기술한다.
  - DYNAMIXEL 스마트 액추에이터를 활용한 위치 및 전류 제어 개념을 파악한다.
  - 전력 시스템 구성 시 독립 분기 회로와 퓨즈 보호의 중요성을 인식한다.
  theory_markdown: '### 텐던 구동 로봇손의 원리

    언더액추에이티드(underactuated) 메커니즘은 자유도보다 적은 수의 액추에이터를 사용하여 기계적 복잡도를 줄이고 생체 모방적인 파지
    동작을 구현한다 [S3]. 로봇손은 모터(DYNAMIXEL XM430-W350-T [B1])의 회전 운동을 텐던(Dyneema SK78 [B6])의
    직선 장력으로 변환하여 손가락 관절을 굽힌다.


    ### 기구학 및 구동

    텐던 장력은 캡스턴(capstan) 구조를 통해 관절 토크로 변환된다. 관절 토크 $\tau$는 텐던 장력 $F$와 모멘트 암(moment
    arm) $r$의 곱으로 정의된다 ($\tau = F \times r$). 본 시스템은 위치·속도·전류 피드백을 제공하는 스마트 액추에이터를
    사용하여 정밀한 제어가 가능하다 [B1].


    ### 전력 및 안전 시스템

    본 벤치 프로토타입은 3개의 독립형 12 V 전원 어댑터(Mean Well GST160A12-R7B [B3])를 사용하여 액추에이터 분기를
    구성한다. 액추에이터의 스톨 전류는 개당 2.3 A이므로 [B1], 최대 4대가 할당된 분기에는 10 A ATOF 퓨즈를 사용하여 과전류로부터
    배선을 보호한다 [B3, B10].


    **경고:** 시스템은 인증된 기계 안전 장치가 아니며, 학습자가 제작한 정지 회로를 비상 정지로 사용하지 않는다. 실험 시 전원 어댑터를
    물리적으로 분리하여 무전원 상태를 멀티미터 DC 전압 모드로 확인해야 한다 [B3].'
  worked_examples:
  - '분기 용량 계산: 한 분기에 4대의 액추에이터가 배치될 경우, 이론적 스톨 전류 합계는 2.3 A × 4 = 9.2 A이다. 사용하는 10
    A 퓨즈는 [B10] 9.2 A의 피크 부하를 감당하면서 배선 고장 시 적절한 보호를 제공한다.'
  - '센서 분압 회로 설계: FSR 402 센서와 10 kΩ 저항을 사용하여 분압기를 구성한다 [B4, B-SENSOR-RESISTOR]. OpenCR
    제어기의 3.3 V 센서 레일에서 전원을 공급하여 [B2] ADC 입력 신호가 0~3.3 V 범위를 유지하도록 한다.'
  lab:
    title: 로봇손 구동 회로 기초 시험
    steps:
    - 각 독립 분기 어댑터의 출력을 멀티미터로 측정하여 12 V가 출력되는지 확인한다.
    - ATO 퓨즈 홀더 [B-WIRING-FUSE-HOLDER]를 사용하여 각 분기에 10 A 퓨즈 [B10]를 장착한다.
    - OpenCR 제어기 [B2]의 전원 입력과 액추에이터 통신 라인을 연결한다.
    - FSR 센서 [B4]와 10 kΩ 저항 [B-SENSOR-RESISTOR]으로 전압 분압 회로를 브레드보드에 구성한다.
    - 전원 인가 전, 모든 액추에이터가 무부하 상태인지 확인하고 각 전원 어댑터를 연결한다.
    safety:
    - 실험 중 전원 차단 시 반드시 3개 전원 어댑터를 벽면 콘센트에서 물리적으로 제거한다.
    - 회로 접근 전 멀티미터 DC 전압 모드로 각 분기 전압이 1 V 미만임을 확인한다.
    - 보안경을 상시 착용하고 가동 범위 내에 신체 부위를 두지 않는다.
    - 양(+) 출력 분기는 절대 결합(병렬 연결)하지 않는다 [B3].
    deliverables:
    - 회로 조립 사진 및 계측 데이터(각 분기별 전압 측정값)
    - 전압 분압 회로의 FSR 응답 시험 결과
  assignment:
    title: 로봇손 구동 시스템 설계 기술서 작성
    deliverables:
    - 시스템 배선도 (전원 분기, 퓨즈 위치, 접지 포함)
    - 텐던 파단 하중 및 관절 토크 계산서
    - 안전 운영 절차서(SOP) 초안
    rubric:
    - 독립 분기 배선 설계의 정확성 (병렬 결합 금지 준수)
    - 전류 및 전압 사양 기반 퓨즈 보호 설계의 타당성
    - 기술적 정밀도 및 안전 규정 준수 여부
  quiz:
  - question: 본 시스템에서 3개의 독립 전원 어댑터 출력부를 어떻게 처리해야 하는가?
    choices:
    - 전류 용량을 높이기 위해 모두 병렬로 연결한다.
    - 각 분기를 전기적으로 완전히 독립된 상태로 유지한다.
    - 제어기의 공통 접지(GND)를 통해 출력단을 하나로 합친다.
    - 퓨즈를 제거하고 직접 연결하여 효율을 높인다.
    answer_index: 1
    explanation: 본 시스템은 각 전원 어댑터의 양(+) 출력을 병렬 연결하는 것을 절대 금지하며, 독립적인 퓨즈 분기로 사용해야 합니다
      [B3].
  - question: FSR 센서 신호 취득을 위해 사용할 수 있는 올바른 전압원은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - OpenCR의 3.3 V 센서 레일
    - 외부 24 V 배터리
    answer_index: 2
    explanation: OpenCR의 ADC 입력 보호 및 신호 범위를 위해 3.3 V 센서 전원 레일만 사용해야 합니다 [B2].
  - question: 회로 정지 후 안전 확인 방법으로 올바른 것은?
    choices:
    - 멀티미터의 저항 모드로 도통을 확인한다.
    - 멀티미터의 DC 전압 모드로 1 V 미만인지 확인한다.
    - 전원 LED가 꺼진 것만 확인하고 즉시 작업한다.
    - 퓨즈가 장착되어 있는지 확인한다.
    answer_index: 1
    explanation: 저항이나 도통 모드는 전원이 차단된 상태를 증명할 수 없으며, 반드시 DC 전압 모드로 1 V 미만임을 측정해야 합니다.
  completion_criteria:
  - 모든 실험 단계에서 안전 규정을 준수하고 계측 기록을 완료함
  - 독립 분기 전원 시스템 설계 배선도를 정확히 작성함
  - 과제물의 논리적 타당성 및 퓨즈 보호 설계의 적절성을 통과함
  source_ids:
  - S2
  - S3
  - S7
- id: M2
  slug: hand-design
  phase_id: PH1
  title: 5지 로봇손 CAD 설계
  estimated_hours: 12.0
  prerequisites:
  - M1
  objectives:
  - 5지 텐던 구동 메커니즘의 기구학적 설계 원리를 이해한다.
  - 'CAD 도구(예: Fusion 360 또는 유사 도구)를 활용하여 로봇손의 링크 및 손바닥 구조를 모델링한다.'
  - 열압입 인서트 및 베어링 등 표준 부품을 고려한 조립 공차 설계 방식을 습득한다.
  - 실제 텐던 경로와 관절 가동 범위를 고려한 하우징 설계 역량을 확보한다.
  theory_markdown: "### 텐던 구동 로봇손 설계 기초\n텐던 구동 로봇손은 액추에이터를 손가락과 분리하여 배치함으로써 손 구조를\
    \ 경량화하고 인간과 유사한 파지력을 구현하는 방식입니다 [S4, S8]. \n\n#### 1. 텐던 역학 및 라우팅\n텐던(Dyneema\
    \ SK78)은 파단 하중이 높고 신율이 1% 미만으로 정밀 제어에 적합합니다 [S15]. 텐던이 관절을 통과할 때 마찰은 시스템의 응답성을\
    \ 저하시키므로, 모든 텐던 경로 모서리는 라운딩 처리하여 마찰을 최소화해야 합니다 [S15].\n\n#### 2. 기구학 및 CAD 설계\n\
    로봇손의 자유도는 인간의 손 기능을 모사하기 위해 손가락별 굴신 2-DOF 및 엄지 손가락의 내전/외전 기능을 포함합니다 [S8]. CAD\
    \ 설계 시 다음 요소를 고려합니다:\n- **공차 관리:** 3D 프린팅의 제작 오차를 고려하여 조립 부품(예: M3 나사, 8 mm 샤프트)과\
    \ 하우징 간 적정 간격(clearance)을 확보합니다 [S17, S19].\n- **열압입 인서트:** 반복 조립을 위해 M3 황동 인서트를\
    \ 사용하며, 출력물 설계 시 4.0 mm 파일럿 홀을 반드시 확보해야 합니다 [S20].\n- **구조 강성:** PC-CF 필라멘트를 사용하여\
    \ 손가락 링크의 구조적 강성을 높이고, 변형을 최소화합니다 [S18].\n\n#### 3. 조립 및 정밀도\n베어링(JSM-0810-10)은\
    \ 무급유 폴리머 소재로, 오염을 방지하고 유격을 제어하는 데 효과적입니다 [S16]. 축 설계 시 8 mm 정밀 샤프트를 기준으로 베어링\
    \ 보어 공차를 설계하여 마찰 없는 회전을 구현합니다 [S16, S17]."
  worked_examples:
  - '예제 1: M3 황동 열압입 인서트 홀 설계. Accu HTBI-M3-BR 규격에 따라, 파일럿 홀 지름을 4.0 mm로 CAD에서 설계하고,
    인서트가 삽입되는 깊이만큼 하우징 설계를 진행한다 [S20].'
  - '예제 2: 무급유 베어링 장착용 하우징 설계. igus JSM-0810-10 외경 10 mm에 맞춰 하우징 보어를 10 mm로 설계하고,
    조립 후 압입에 의해 내경이 조정되는 점을 고려한다 [S16].'
  lab:
    title: 5지 로봇손 CAD 링크 모델링 실습
    steps:
    - 각 손가락 링크의 3D 모델을 설계하고 관절 회전축 중심점을 확정한다.
    - 텐던이 통과하는 경로를 스케치하고 모서리에 0.5 mm 이상의 라운딩을 적용한다.
    - 표준 부품(M3 인서트, JSM-0810-10 베어링)의 외형을 고려하여 하우징에 맞춤형 삽입구(recess)를 설계한다.
    - 설계된 모델의 간섭 체크 및 조립 시뮬레이션을 수행한다.
    safety:
    - CAD 작업 중 시각적 피로를 방지하기 위해 정기적인 휴식을 취한다.
    - 3D 프린팅 설정 시 경화강 노즐 사용 여부와 온도를 다시 확인한다 [S18].
    - 설계 도면 도출 후, 하드웨어 물리적 접근 시에는 반드시 보안경을 착용한다.
    - 비상시 3개의 전원 어댑터 물리 분리 외의 별도 안전회로(E-Stop)를 임의 구성하지 않는다.
    deliverables:
    - 손가락 링크 및 손바닥 프레임 CAD 파일 (Step/STL 형식)
    - 관절 부품 및 인서트 배치 상세 치수 도면
    - 조립 간섭 체크 리포트
  assignment:
    title: 로봇손 링크 구조 및 조립 설계 제안서
    deliverables:
    - 선정한 링크 설계의 기구학적 근거와 텐던 라우팅 방식 기술서
    - 표준 부품(인서트, 베어링, 나사)의 사용처를 명시한 설계 도면 [S16, S19, S20]
    rubric:
    - 텐던 경로의 마찰 방지 설계가 반영되었는가?
    - 열압입 인서트 및 베어링 장착을 위한 표준 규격 홀 설계가 정확한가?
    - 실제 제작 가능한 수준의 치수 및 공차 설계가 고려되었는가?
  quiz:
  - question: 3D 프린팅 구조물에 M3 황동 열압입 인서트를 사용할 때 적절한 파일럿 홀 지름은?
    choices:
    - 2.5 mm
    - 3.0 mm
    - 4.0 mm
    - 5.0 mm
    answer_index: 2
    explanation: 인서트 규격(HTBI-M3-BR) 데이터시트에 따르면 4.0 mm 파일럿 홀을 권장합니다 [S20].
  - question: 텐던 구동 로봇손에서 텐던의 반복 마찰을 줄이기 위한 설계 조치로 적절한 것은?
    choices:
    - 모서리를 직각으로 설계
    - 모서리 라운딩(fillet) 처리
    - 텐던 표면을 강하게 압박
    - 금속 텐던 사용
    answer_index: 1
    explanation: 텐던은 모서리와 접촉할 때 마찰을 최소화하기 위해 라운딩 처리가 필수적입니다 [S15].
  - question: igus 무급유 폴리머 베어링(JSM-0810-10)의 올바른 특징은?
    choices:
    - 반드시 오일을 주유해야 함
    - 고하중 환경에서 금속 베어링보다 성능이 우수함
    - 압입 후 내경이 조정되는 구조임
    - 내경이 10 mm임
    answer_index: 2
    explanation: 해당 베어링은 압입 후 하우징 보어에 맞춰 내경이 조정되는 구조입니다 [S16].
