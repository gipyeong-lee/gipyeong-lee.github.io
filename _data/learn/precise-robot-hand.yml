- id: M2
  slug: mechanical-design
  phase_id: PH1
  title: 로봇손 기구 설계 및 CAD
  estimated_hours: 15.0
  prerequisites:
  - M1
  objectives:
  - 로봇손 기구학의 기본 원리를 이해하고 텐던 구동 방식의 특성을 파악한다.
  - CAD 소프트웨어를 활용하여 로봇손의 링크, 조인트, 손바닥 프레임을 설계한다.
  - 부품 데이터시트와 사양을 바탕으로 베어링, 나사산 인서트, 텐던의 최적 배치 및 조립 공차를 산출한다.
  - 정교한 로봇손 구현을 위한 기구적 구속 조건과 안정적인 작동 환경을 설계한다.
  theory_markdown: '### 로봇손 기구 설계 이론


    #### 1. 텐던 구동(Tendon-Driven) 방식

    텐던 구동 방식은 액추에이터를 손바닥이나 팔뚝에 배치하여 무게 중심을 본체 쪽으로 옮기고 손가락 끝의 질량을 줄여 정밀하고 민첩한 움직임을
    가능하게 한다 [S12]. 텐던은 `Dyneema SK78`과 같이 작동 신율이 1% 미만인 고강도 섬유를 사용해야 힘 전달의 지연을 최소화할
    수 있다 [S17].


    #### 2. 링크 구조와 자유도(DOF)

    로봇손의 각 손가락은 인체와 유사한 움직임을 위해 관절당 최소 2개의 자유도를 확보해야 하며, 필요 시 손가락 내전/외전 기능을 추가한다 [S12].
    설계 시 `M3` 소켓 헤드 캡스크루와 호환되는 황동 열압입 나사산 인서트를 사용하여 조립의 재현성과 반복 정밀도를 보장한다 [S21, S22].


    #### 3. 마찰 및 공차 관리

    손목 및 고하중 회전축은 `igus JSM-0810-10`과 같은 무급유 폴리머 베어링을 사용하여 마찰을 줄이고 유지보수 효율을 높인다 [S18].
    정밀 알루미늄 샤프트(`AWMP-08`)를 사용하여 베어링 내경(8mm)과의 유격을 관리하고 조립 정확도를 높여야 한다 [S19].


    #### 4. 구조 제작 재질

    `PC-CF(탄소섬유 강화 폴리카보네이트)`는 강성과 치수 안정성이 우수하여 정교한 로봇 링크 제작에 적합하다 [S20]. FDM 출력 시
    노즐 마모 방지를 위해 반드시 경화강 노즐을 사용하여야 한다 [S20].'
  worked_examples:
  - '예제 1: 텐던 장력 전달 계산 - 액추에이터의 스톨 토크가 4.1 N·m일 때 [S3], 텐던 연결 지점의 캡스턴 반지름이 0.01 m라면,
    텐던이 전달할 수 있는 이론적 당김 힘은 F = τ / r = 4.1 / 0.01 = 410 N이다. 텐던의 파단 하중(230 daN ≈ 2300
    N)을 고려할 때 텐던은 충분히 안전하다 [S17].'
  - '예제 2: 인서트 설계 공차 - M3 황동 인서트의 권장 파일럿 홀 지름은 4.0 mm이다 [S22]. 3D 프린팅 시 수축률을 고려하여
    슬라이서 설정에서 구멍 크기를 보정해야 하며, 파일럿 홀은 인서트의 외경(4.4 mm)보다 작고 인서트가 삽입 시 부풀어 오르는 효과를 감안하여
    4.0 mm로 지정한다.'
  lab:
    title: 로봇손 기구부 CAD 설계 및 공차 실습
    steps:
    - 각 손가락 링크와 손바닥 프레임의 CAD 설계를 진행한다.
    - 무급유 베어링(JSM-0810-10)이 삽입될 구멍의 공차를 설계하고 8mm 축과의 체결을 확인한다 [S18, S19].
    - M3 열압입 인서트가 들어갈 4.0 mm 파일럿 홀을 배치한다 [S22].
    - 텐던이 지나갈 경로의 모서리를 라운딩 처리하여 마찰에 의한 마모를 방지한다.
    - 설계 도면을 바탕으로 PC-CF 필라멘트를 이용한 테스트 출력을 진행한다 [S20].
    safety:
    - FDM 프린터 예열 시 고온에 주의한다 [S20].
    - 출력물 가공 시 파편이 발생할 수 있으므로 보안경을 착용한다.
    - 공구 사용 시 날카로운 모서리에 찔리지 않도록 주의한다.
    deliverables:
    - 로봇손 전체 조립 CAD 파일 (.step)
    - 부품별 치수 상세 도면
    - PC-CF 출력물 테스트 보고서
  assignment:
    title: 로봇손 기구 설계 최종 보고서
    deliverables:
    - 설계 사양서 (자유도 및 주요 기구적 특징 포함)
    - BOM과 사양 및 데이터시트 일치 여부 보고서
    - 설계 공차 산출 근거 및 CAD 렌더링 이미지
    rubric:
    - 기구적 자유도 설계의 적절성 (40%)
    - 데이터시트를 바탕으로 한 부품 치수 및 공차 반영의 정확성 (40%)
    - 설계 근거의 논리적 타당성 (20%)
  quiz:
  - question: 텐던 구동 로봇손 설계 시 텐던의 작동 신율은 몇 % 미만이어야 하는가?
    choices:
    - 0.1%
    - 1%
    - 5%
    - 10%
    answer_index: 1
    explanation: Dyneema SK78을 기반으로 하는 텐던은 작동 신율이 1% 미만이어야 힘 전달 효율과 정밀도를 확보할 수 있다
      [S17].
  - question: 무급유 폴리머 베어링 사용 시 권장되는 특징은 무엇인가?
    choices:
    - 정기적인 오일 급유 필요
    - 금속 샤프트와 반드시 동일 재질 사용
    - 무급유 운용 및 유지보수 효율 증대
    - 고하중 환경에서 금속 베어링보다 성능 우수
    answer_index: 2
    explanation: 폴리머 슬리브 베어링은 무급유 운용이 가능하여 오염을 줄이고 유지보수를 간소화한다 [S18].
  - question: PC-CF 출력 시 반드시 요구되는 사항은 무엇인가?
    choices:
    - 황동 노즐 사용
    - 경화강 노즐 사용
    - PEI 표면 사용 금지
    - 별도의 서포트 없이 출력 가능
    answer_index: 1
    explanation: 탄소섬유 필라멘트는 매우 연마성이 강해 황동 노즐을 마모시키므로 반드시 경화강 노즐을 사용하여야 한다 [S20].
  completion_criteria:
  - 로봇손의 전체 기구 설계를 완료하고 CAD 파일 제출
  - 사용한 베어링 및 나사산 인서트의 사양을 도면에 반영하고 검증 완료
  - 설계 사양과 데이터시트의 일치 여부를 보고서로 제출
