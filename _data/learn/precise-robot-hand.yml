- id: m2
  slug: hand-anatomy
  phase_id: phase-1
  title: 해부학 기반 로봇손 기구학
  estimated_hours: 10.0
  prerequisites:
  - m1
  objectives:
  - 인간 손의 해부학적 구조와 로봇 손 기구학의 관계 이해
  - 생체 모방형 손가락 아키텍처(4 DoF, 2 액추에이터)의 원리 파악
  - 로봇 손 파지 안정성을 위한 기구적 구속 및 자유도 감소 이론 습득
  - 텐던 구동 방식의 동력 전달 효율 및 기구학적 특성 분석
  theory_markdown: '인간의 손은 20개 이상의 자유도(DoF)를 가지며 정교한 조작을 수행하는 놀라운 구조를 가지고 있습니다 [S1].
    하지만 모든 자유도를 독립적으로 구동하는 것은 복잡성과 무게 문제를 야기하므로, 로봇 공학에서는 생체 모방적 시너지(Biological Synergies)를
    활용하여 효율성을 극대화합니다 [S1, S2].


    ### 1. 해부학적 매핑

    인간 손의 뼈 구조를 단순화하여 로봇 손의 핑거 링크 아키텍처를 설계합니다. 본 과정에서는 인간 손가락의 특징적인 운동 패턴을 반영하여, 4
    DoF를 2개의 액추에이터로 제어하는 최적화된 기구학적 모델을 채택합니다 [S1]. 이를 통해 액추에이터 복잡성과 조작 자유도 사이의 균형을
    유지합니다.


    ### 2. 기구학적 모델링

    손가락 링크 기구는 DYNAMIXEL XM430-W350 액추에이터와 Dyneema SK78 텐던을 사용하여 구동됩니다 [S12, S16].
    텐던은 반복 굽힘과 하중 전달에 강하며, 신율(working stretch)이 1% 미만으로 정밀 제어에 적합합니다 [S16]. 각 관절의
    회전축에는 유지보수가 필요 없는 무급유 폴리머 슬리브 베어링(JSM-0810-10)을 사용하여 마찰과 유격을 최소화합니다 [S17].


    ### 3. 파지 및 조작 원리

    손가락 끝에는 FSR 402 센서를 배치하여 접촉력을 피드백받습니다 [S13]. 이 센서는 저항 기반의 아날로그 신호를 출력하며, OpenCR
    보드의 ADC를 통해 0~3.3 V 범위 내에서 힘 신호를 취득합니다 [S14].'
  worked_examples:
  - '사례 1: 텐던 장력 전달 분석. 1.5mm 지름의 Dyneema SK78은 230 daN(약 2255 N)의 파단 하중을 가집니다 [S16].
    액추에이터의 스톨 토크가 4.1 N·m일 때 [S12], 관절의 회전 반경과 텐던의 레버 암 거리를 계산하여 손가락 끝 파지력을 산출합니다.'
  - '사례 2: 분압 회로 설계. FSR 402 센서와 10 kΩ 저항을 사용하여 분압기를 구성합니다 [S13, S29]. FSR의 저항 변화에
    따른 ADC 출력 전압(V_out)을 V_out = V_cc * (R_fixed / (R_fixed + R_fsr)) 공식을 통해 도출하고,
    0~3.3 V 센서 레일 내에서 센싱 범위(0.2N~20N)가 최적으로 매핑되는지 검증합니다.'
  lab:
    title: 로봇 손 관절 및 텐던 구동 테스트
    steps:
    - OpenCR 제어기를 3.3V 센서 레일에 연결하고 ADC 동작을 멀티미터로 검증한다.
    - PC-CF 출력물과 igus 베어링을 사용하여 관절 조립을 완성한다.
    - Dyneema 텐던을 캡스턴에 체결하고 액추에이터 위치 제어를 통해 장력을 인가한다.
    - FSR 센서를 손끝에 부착하고 힘 입력에 따른 ADC 출력 변화를 기록한다.
    safety:
    - 액추에이터 구동 시 끼임 방지를 위해 항상 저전류 모드(전류 제한)를 사용한다.
    - 납땜 및 조립 시 보안경을 착용한다.
    - 비상 정지 버튼의 상태를 사전에 반드시 확인한다.
    - 배선 작업 시에는 항상 전원을 차단한다.
    deliverables:
    - 조립된 손가락 링크 기구 사진 및 CAD 모델 일치성 검토서
    - FSR 센서의 힘-전압 데이터 교정 기록
    - 텐던 장력 전달 분석 및 파지력 계산 보고서
  assignment:
    title: 5지 로봇손 기구학 최적화 설계
    deliverables:
    - 완성된 5지 로봇손 기구 CAD 파일 (Step/Parasolid)
    - 관절별 자유도 및 액추에이터 매핑 도면
    - 텐던 배치 및 장력 보상 메커니즘 설명서
    rubric:
    - 인간 손의 해부학적 기구 매핑이 기술적으로 정확한가?
    - 텐던 구동 방식에서 마찰 및 유격 저감 설계가 적절한가?
    - 센서와 제어기의 전기적 인터페이스 구성(3.3V 전용 레일 준수)이 안전한가?
  quiz:
  - question: 로봇 손 설계 시 Dyneema SK78 텐던을 사용하는 주요 이유로 옳지 않은 것은?
    choices:
    - 1% 미만의 낮은 작동 신율
    - 높은 파단 하중 대비 작은 지름
    - 금속 텐던 대비 높은 전기 전도성
    - 반복 굽힘 시험에 대한 높은 내구성
    answer_index: 2
    explanation: Dyneema는 섬유 소재로 전기 전도성이 낮아 로봇 손의 전기적 절연 유지에 유리하며, 고강도와 낮은 신율이 주요
      장점입니다.
  - question: OpenCR 제어기를 사용할 때 FSR 402 센서 전압 분압 회로를 연결하는 안전한 방법은?
    choices:
    - 12 V 액추에이터 전원 라인 사용
    - 5 V 시스템 전원 라인 사용
    - 3.3 V 전용 센서 전원 라인 사용
    - 별도의 고전압 릴레이 출력 사용
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3V 입력 범위를 준수해야 하며, 3.3V 센서 전원 레일 사용이 원칙입니다.
  completion_criteria:
  - 5지 로봇손 기구 설계 CAD 데이터 제출 완료
  - 관절 구동 시 마찰 및 유격이 허용 공차 범위 내임을 증명
  - FSR 센서가 0~3.3V 범위에서 힘 신호를 정상적으로 출력함
  - 전기 회로 설계 시 모든 센서 라인이 3.3V 전용 레일로 구성됨을 확인
  source_ids:
  - S1
  - S2
  - S12
  - S16
  - S17
  - S13
  - S14
  - S29
- id: m3
  slug: cad-design
  phase_id: phase-1
  title: CAD 설계 및 시뮬레이션
  estimated_hours: 12.0
  prerequisites:
  - m2
  objectives:
  - 로봇 손 기구 설계를 위한 CAD 환경 구성 및 표준 부품 라이브러리 활용법 이해
  - FDM 3D 프린팅 공정 고려사항(PC-CF 필라멘트, 열압입 인서트)을 반영한 기구 설계
  - 슬리브 베어링(JSM-0810-10) 및 8 mm 알루미늄 샤프트를 활용한 회전축 설계 최적화
  - 텐던 구동 로봇 손의 자유도(DoF)와 텐던 경로에 따른 운동학적 시뮬레이션 기반 검토
  theory_markdown: '## CAD 설계 및 시뮬레이션 이론


    정교한 로봇 손 설계의 핵심은 기구학적 요구사항을 물리적 한계 내에서 구현하는 것입니다. Ruka-v2와 같은 텐던 구동 로봇 손은 11자유도를
    구현하며, 텐던 경로(Tendon Routing)의 마찰 최소화와 강성 확보가 설계 품질을 결정합니다 [S10].


    ### 1. 설계 고려사항

    - **열압입 인서트(Heat-fix Inserts):** PC-CF와 같은 고강도 엔지니어링 필라멘트는 반복 조립 시 나사산 손상이 발생하기
    쉽습니다. M3 황동 열압입 인서트(HTBI-M3-BR)를 사용하여 하우징의 반복적인 분해 조립에도 치수 안정성을 유지해야 합니다 [S21].
    구멍 지름은 제조사 권장값인 4.0 mm를 엄격히 준수합니다 [S21].

    - **회전축 관리:** IGUS 무급유 베어링(JSM-0810-10)은 8 mm 샤프트와 결합하여 사용됩니다 [S17, S18]. 베어링은
    압입(Press-fit) 방식이므로 하우징 보어 설계 시 공차를 고려하여야 하며, 무급유 운용을 위해 축의 거칠기와 정밀도가 중요합니다 [S17,
    S18].


    ### 2. 재료 및 제조 공정

    - **PC-CF 필라멘트 활용:** Prusament PC-CF는 높은 강성과 내열성을 제공하지만, 탄소섬유 성분으로 인해 황동 노즐을 마모시키므로
    반드시 경화강 노즐을 사용해야 합니다 [S19].

    - **텐던 다이내믹스:** Dyneema SK78 텐던(D-Pro 1.5 mm)은 작동 신율이 1% 미만으로 정밀 위치 제어에 적합합니다
    [S16]. 캡스턴 설계 시 텐던이 통과하는 모서리는 반드시 라운딩 처리하여 마찰에 의한 파단 위험을 방지해야 합니다 [S16].'
  worked_examples:
  - '예제 1: 베어링 하우징 공차 계산. JSM-0810-10 베어링 외경이 10 mm일 때, 압입 효과를 극대화하기 위한 하우징 보어의 권장
    공차를 계산하고 CAD 모델링에 반영하는 과정.'
  - '예제 2: FSR 센서 배치 설계. 손끝 FSR 402 센서(12.7 mm 지름)를 고려하여, 텐던 경로와 간섭이 없고 힘 전달이 효율적인
    패드 구조를 설계하는 방법 [S13].'
  lab:
    title: 손가락 관절 CAD 모델링 및 텐던 경로 시뮬레이션
    steps:
    - 손가락 링크와 텐던 통로를 포함한 CAD 모델링 수행
    - 베어링과 샤프트의 조립 공차(Fit) 설정 확인
    - 텐던이 통과하는 관절 회전 중심부의 라운딩 처리 및 마찰 저항 검토
    - 간섭 체크(Interference Check) 도구를 활용한 조립 오류 사전 검증
    safety:
    - PC-CF 출력물은 고온(285°C)에서 제작되므로 작업 시 화상 주의
    - 경화강 노즐 교체 작업 시 열원 차단 확인
    - 절삭 도구 및 일반 수공구 사용 시 베임 사고 예방
    deliverables:
    - 최종 로봇 손 CAD 파일 세트(STEP 및 STL 형식)
    - 베어링-샤프트 조립도 및 간섭 체크 검증 보고서
    - 텐던 경로 최적화 설계 노트
  assignment:
    title: 텐던 구동 로봇 손 기구 최적화 설계 과제
    deliverables:
    - 손바닥 프레임 및 5개 손가락 링크의 CAD 도면
    - 열압입 인서트가 배치된 하우징 단면 상세도
    - 부품 목록(BOM)과 체결부 규격 대응표
    rubric:
    - 열압입 인서트홀 설계 규격 준수 여부(4.0 mm 파일럿 홀 포함)
    - IGUS 베어링 및 8 mm 샤프트 조립 호환성 설계
    - 텐던 경로에서의 모서리 라운딩 및 마찰 관리 설계
    - 재료 물성치(PC-CF)를 고려한 구조적 강성 평가
  quiz:
  - question: PC-CF 필라멘트를 FDM 프린터로 출력할 때 필수적으로 요구되는 장비는 무엇인가요?
    choices:
    - 황동 노즐
    - 경화강 노즐
    - 알루미늄 베드
    - 수냉식 헤드
    answer_index: 1
    explanation: PC-CF 필라멘트에 포함된 탄소섬유는 연마성이 강해 황동 노즐을 마모시키므로 반드시 경화강 노즐을 사용하여야 합니다
      [S19].
  - question: JSM-0810-10 베어링과 함께 사용하는 적절한 샤프트 지름은 얼마인가요?
    choices:
    - 6 mm
    - 8 mm
    - 10 mm
    - 12 mm
    answer_index: 1
    explanation: 'JSM-0810-10 베어링은 내경 8 mm 규격이므로 8 mm 샤프트(예: AWMP-08)와 호환됩니다 [S17,
      S18].'
  - question: M3 열압입 인서트(HTBI-M3-BR) 사용 시 권장되는 파일럿 홀 지름은 무엇인가요?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 4.4 mm
    - 5.8 mm
    answer_index: 1
    explanation: 데이터시트에 명시된 HTBI-M3-BR 모델의 권장 구멍 지름은 4 mm입니다 [S21].
  completion_criteria:
  - 로봇 손 전체 CAD 조립도 완성
  - 간섭 체크 시 물리적 충돌 항목 없음
  - 제시된 BOM의 주요 부품(베어링, 샤프트, 인서트) 규격 반영 확인
  - 설계 상세 보고서 제출 및 기술적 타당성 통과
