modules:
- id: mod1
  slug: intro-robotics
  phase_id: phase1
  title: 로봇 공학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 공학의 기본 개념과 5지 로봇손 시스템의 구성 요소를 이해한다.
  - 로봇의 기구학(Kinematics) 및 제어 시스템의 기초 원리를 파악한다.
  - BOM에 명시된 액추에이터와 전원 분기 구조의 전기적 안전 규격을 습득한다.
  - 로봇 시스템의 설계, 제작, 검증 과정을 체계화한다.
  theory_markdown: '## 로봇 공학 기초와 시스템 개요


    로봇 공학은 기구학(Kinematics), 동역학(Dynamics), 제어(Control), 감지(Sensing)가 결합된 학문 분야입니다
    [S1, S2]. 5지 로봇손은 인간의 손을 모사하여 정교한 파지(Grasping)와 조작을 수행하는 시스템으로, 다수의 액추에이터와 센서,
    제어기로 구성됩니다.


    ### 1. 구동기 및 제어 시스템

    로봇손의 각 관절은 DYNAMIXEL 스마트 액추에이터(XM430-W350-T)를 사용하여 제어합니다 [S12]. 이 모델은 12 V 전압에서
    스톨 토크 4.1 N·m, 스톨 전류 2.3 A의 성능을 제공합니다 [S12]. 총 11개의 액추에이터가 사용되므로, 최대 피크 전류는 11
    × 2.3 A = 25.3 A에 도달할 수 있습니다. 이를 지원하기 위해 총 3개의 절연형 12 V 전원 어댑터(각 11.5 A)를 사용하여
    3개의 독립된 전기 분기(4대/4대/3대 배분)를 구성하며, 각 분기는 10 A ATOF 퓨즈로 과전류 보호를 수행합니다 [S16, S24,
    S25].


    ### 2. 제어 보드와 센서 인터페이스

    OpenCR 1.0 제어 보드는 216 MHz CPU와 DYNAMIXEL 전용 인터페이스를 내장하여 시스템의 통합 제어를 담당합니다 [S14].
    손끝 접촉력은 FSR 402 센서와 10 kΩ 저항을 사용한 전압 분압 회로를 통해 측정합니다 [S13, S26]. FSR 회로는 반드시 OpenCR의
    3.3 V 센서 전원을 사용하여 ADC 입력을 0~3.3 V 범위 내로 유지해야 합니다 [S14].'
  worked_examples:
  - '예제 1: 전원 분기별 전류 계산. 분기 A(4대)의 최대 전류는 4 × 2.3 A = 9.2 A입니다. 10 A 퓨즈는 9.2 A를 충분히
    수용하면서 단락 시 과전류 보호를 수행합니다 [S12, S25].'
  - '예제 2: FSR 센서 전압 분압. 3.3 V 센서 레일과 10 kΩ 고정 저항을 사용하여 분압기를 구성하면, FSR 저항 변화에 따른 전압을
    OpenCR ADC로 읽어 힘을 추정할 수 있습니다 [S14, S26].'
  lab:
    title: 로봇 제어 시스템 안전 점검 및 회로 구축
    steps:
    - 각 12 V 어댑터 출력에 0AFH0001Z 인라인 퓨즈 홀더와 10 A ATOF 퓨즈를 연결합니다 [S24, S25].
    - 각 분기별로 액추에이터를 4대/4대/3대 할당하여 배선합니다.
    - FSR 센서와 10 kΩ 저항을 사용하여 분압 회로를 구성하고 OpenCR 3.3 V 센서 단자에 연결합니다 [S14, S26].
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기의 출력 전압이 12 V인지 확인합니다.
    safety:
    - 절대 3개의 12 V 전원 어댑터 양(+) 출력을 병렬 연결하거나 합치지 마십시오.
    - 정비나 접근 전, 반드시 3개의 어댑터를 물리적으로 전원에서 분리하십시오.
    - DC 전압 모드 멀티미터로 각 분기 전압이 1 V 미만임을 확인하기 전에는 회로에 손대지 마십시오.
    - 충격 방지 작업용 보안경을 항시 착용하십시오.
    deliverables:
    - 각 분기별 전압 측정 데이터가 포함된 실습 로그
    - FSR 센서 전압 분압 회로 사진
  assignment:
    title: 로봇 시스템 설계 요구사항 정의
    deliverables:
    - 시스템 최대 전력 소모량 계산서
    - 5지 로봇손의 자유도(DOF) 설계 도면
    - 전원 분기 및 제어 보드 배선도
    rubric:
    - 최대 전류 계산이 25.3 A 기준을 정확히 반영했는가
    - 3개 분기 구조의 독립성이 유지되었는가
    - FSR 센서의 3.3 V 전원 사용이 명시되었는가
  quiz:
  - question: 로봇손 액추에이터의 총 피크 전류를 감당하기 위해 필요한 총 어댑터 정격은 얼마입니까?
    choices:
    - 분기당 11.5 A 어댑터 3개로 총 34.5 A 공급
    - 어댑터 1개로 충분
    - 어댑터 5개로 병렬 연결
    answer_index: 0
    explanation: 총 피크 전류 25.3 A를 3개의 독립 분기로 나누어 공급하므로, 어댑터당 11.5 A 정격 3개를 사용하는 것이
      적절합니다.
  - question: FSR 센서 회로의 올바른 전원 연결 방법은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원 사용
    - OpenCR의 3.3 V 센서 레일 사용
    - 5 V 전원 사용
    answer_index: 1
    explanation: FSR 분압 회로는 반드시 OpenCR의 3.3 V 센서 전원을 사용하여 ADC 입력을 보호해야 합니다.
  completion_criteria:
  - 시스템 최대 전류 계산 및 전원 분기 할당 계획서 제출
  - 전기적 안전 확인 실습(무전원 확인) 완료 및 기록
  - 기초 로봇 기구학 이론 평가 80점 이상 획득
  source_ids:
  - S1
  - S2
  - S12
  - S16
  - S24
  - S25
  - S14
  - S13
  - S26
- id: mod2
  slug: mechanism-design
  phase_id: phase1
  title: 로봇 기구학 설계
  estimated_hours: 10.0
  prerequisites:
  - mod1
  objectives:
  - 로봇 기구학의 기초 원리를 이해하고 5지 로봇손의 자유도를 설계할 수 있다.
  - 텐던 구동 방식의 동역학적 특성을 이해하고 기구 설계에 적용할 수 있다.
  - 손가락 관절의 기하학적 배치를 통해 파지 안정성을 최적화할 수 있다.
  - 로봇 기구 설계 시 부품 공차와 마찰력을 고려한 베어링 선택 및 샤프트 설계를 수행할 수 있다.
  theory_markdown: '## 5지 로봇손의 기구학 기초


    로봇 손의 설계는 인간 손의 자유도와 운동성을 모방하는 것에서 시작합니다. 5지 로봇손은 각 손가락에 필요한 자유도를 부여하여 물체 파지 및
    조작 능력을 결정합니다 [S10]. 텐던 구동(Tendon-driven) 시스템은 구동기(액추에이터)를 관절에서 분리하여 손가락 무게를 줄이고
    조밀한 배치를 가능하게 합니다. 텐던 장력은 관절의 회전 토크를 생성하며, 이는 텐던의 경로와 캡스턴(Capstan) 반지름의 함수로 정의됩니다.


    ### 자유도와 관절 배치

    각 손가락의 관절은 굴곡(Flexion)과 신전(Extension) 운동을 수행하며, 엄지손가락은 별도의 외전(Abduction) 자유도를
    추가하여 복잡한 파지 형태를 구현합니다 [S10]. 관절 회전 중심의 정밀한 설계는 텐던의 신율을 최소화하고 일관된 제어를 가능하게 합니다
    [S17].


    ### 정밀 구동기 특성

    본 프로젝트는 DYNAMIXEL XM430-W350-T 액추에이터를 사용하여 정밀한 위치 및 전류 피드백을 제공합니다 [S12]. 이 구동기는
    스톨 토크 4.1 N·m를 제공하여 텐던 장력을 충분히 제어할 수 있습니다 [S12].


    ### 베어링과 마찰력 관리

    관절 회전축에는 유지보수가 필요 없는 iglide J 슬리브 베어링(JSM-0810-10)을 사용하여 마찰을 최소화하고 진동을 억제합니다 [S18].
    알루미늄 정밀 샤프트(AWMP-08)와 조합하여 치수 공차를 엄격히 관리함으로써 기구적 유격을 방지합니다 [S19].'
  worked_examples:
  - '예제 1: 텐던 토크 계산. 캡스턴 반지름이 10mm이고 텐던 장력이 50N일 때 발생하는 토크를 계산합니다. τ = r * F = 0.01m
    * 50N = 0.5 N·m. 이 토크가 관절을 구동하는 데 충분한지 확인합니다.'
  - '예제 2: 관절 자유도 배치. 손가락 굴곡 운동에 2자유도를 부여할 경우, 각 관절의 회전 반경을 기하학적으로 배치하여 텐던 장력 변화가
    1% 이내로 유지되도록 설계합니다 [S17].'
  - '예제 3: 하중 지지 설계. 8mm 샤프트와 베어링을 사용하여 조립할 때, 샤프트 공차(±1mm)와 하우징 보어 공차를 확인하여 억지 끼움
    상태가 아닌 회전 가능한 최적 공차를 계산합니다 [S18, S19].'
  lab:
    title: 로봇 관절 기구 조립 및 장력 시험
    steps:
    - 관절 부품(손가락 링크)을 FDM 3D 프린터로 제작하고 서포트를 제거합니다 [S20].
    - 베어링 하우징에 M3 황동 열압입 인서트를 장착합니다 [S22].
    - 슬리브 베어링(JSM-0810-10)을 관절 링크에 삽입하고 8mm 알루미늄 샤프트를 통과시켜 회전 유격을 점검합니다 [S18, S19].
    - Dyneema SK78 텐던을 캡스턴에 감고 관절 말단에 연결하여 장력을 인가합니다 [S17].
    - 멀티미터를 사용하여 액추에이터의 전류를 모니터링하며 텐던 장력에 따른 전류 변화를 기록합니다.
    safety:
    - 모든 조립 작업 시 보안경을 착용합니다.
    - 텐던 장력 시험 중에는 손가락이 가동 범위에 들어가지 않도록 고정 지그를 사용합니다.
    - 전원 인가 중에는 하드웨어 접근을 절대 금지하며, 물리적 전원 차단 후 3개 어댑터를 모두 분리합니다.
    - 각 전원 분기의 양(+) 출력을 병렬 연결하지 않도록 엄격히 배선도를 준수합니다.
    deliverables:
    - 관절 회전 유격 측정 보고서
    - 텐던 장력-전류 상관관계 그래프
    - 조립 완료된 5지 로봇손 관절 기구 사진
  assignment:
    title: 로봇 손 기구 설계 도면 및 해석
    deliverables:
    - 5지 로봇손 조립 CAD 데이터 및 설계 근거 보고서
    - 액추에이터 배치 및 텐던 경로가 포함된 기구 도면
    - 관절 회전 자유도와 운동학적 배치 설명서
    rubric:
    - 5지 각각의 자유도가 기구적으로 구현되었는가?
    - 텐던 경로가 간섭 없이 설계되었는가?
    - 베어링과 샤프트의 공차 설정이 적절한가?
    - 사용된 부품 사양(BOM)이 실제 구현 가능한 데이터인가?
  quiz:
  - question: 본 프로젝트에서 텐던 장력 전달을 위해 사용하는 Dyneema SK78 텐던의 핵심 물리적 특성은 무엇입니까?
    choices:
    - 높은 신율과 낮은 강도
    - 1% 미만의 작동 신율과 매우 높은 파단 하중
    - 낮은 내마모성과 높은 습도 흡수
    - 금속 텐던보다 무거운 무게
    answer_index: 1
    explanation: Dyneema SK78은 매우 높은 파단 하중과 1% 미만의 낮은 작동 신율을 가져 정밀 제어에 적합합니다 [S17].
  - question: 관절 회전축 설계 시 iglide J 베어링과 함께 알루미늄 샤프트를 사용하는 주요 이유는 무엇입니까?
    choices:
    - 유급유 방식으로 정기적인 기름칠이 필요하기 때문에
    - 높은 압력을 견디기 위해 금속 강성이 필요해서
    - 무급유 동작과 저마찰/저유격 관리를 위해서
    - 전기적 도통을 원활하게 하기 위해서
    answer_index: 2
    explanation: iglide J 베어링은 무급유 구조로 마찰을 줄이고 오염을 방지하며, 정밀 샤프트와 결합하여 유격을 최소화합니다 [S18,
      S19].
  - question: 로봇 제어 보드 OpenCR 1.0과 액추에이터 전원 설계 시 안전을 위한 핵심 원칙은 무엇입니까?
    choices:
    - 모든 액추에이터의 양(+) 출력을 하나의 큰 분기로 통합한다.
    - 12V 액추에이터 전원은 센서/ADC 회로와 물리적으로 분리하여 구성한다.
    - 5V 레일을 액추에이터 전원으로 공유한다.
    - 전원 분기별 퓨즈를 생략하고 소프트웨어적인 과전류 차단만 수행한다.
    answer_index: 1
    explanation: 12V 액추에이터 전원은 센서 및 제어기 ADC 회로와 분리하여 노이즈를 방지하고 시스템 안전을 확보해야 합니다 [S14].
