  - 각 독립 전원 분기의 10 A 퓨즈 정격과 시간-전류 특성을 점검
  - 고정 지그에서 무부하 시험 후 단계적으로 파지 하중을 증가
  - 절단·드릴·텐던 장력 및 파지 시험 중 충격 방지 작업용 보안경 착용
