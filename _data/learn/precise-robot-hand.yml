- id: M7
  slug: sensor-integration
  phase_id: PH3
  title: 센서 피드백 알고리즘
  estimated_hours: 12.0
  prerequisites:
  - M6
  objectives:
  - FSR 402 센서의 저항 변화 특성을 이해하고 전압 분압 회로를 설계할 수 있다.
  - OpenCR 보드의 ADC(Analog-to-Digital Converter) 입력을 사용하여 센서 데이터를 취득할 수 있다.
  - 데이터 필터링을 통해 불안정한 센서 신호를 로봇 제어에 활용 가능한 수준으로 정규화할 수 있다.
  theory_markdown: '### 힘 감지 센서(FSR)와 전압 분압 회로

    FSR 402는 가해지는 압력이 증가함에 따라 저항이 감소하는 박막형 센서입니다 [S11]. 이 센서는 직접적으로 전압을 출력하지 않으므로,
    제어 보드에서 이를 읽기 위해서는 전압 분압(Voltage Divider) 회로를 구성해야 합니다 [S11, S23].


    #### 전압 분압기 설계

    센서(R_FSR)와 고정 저항(R_fixed)을 직렬로 연결하고 양단에 3.3 V 전원을 인가합니다. OpenCR의 ADC 입력은 이 두 저항
    사이의 전압(V_out)을 측정합니다 [S12].

    \[ V_{out} = V_{in} \times \frac{R_{fixed}}{R_{FSR} + R_{fixed}} \]

    여기서 10 kΩ 저항을 사용하면 [S23], FSR의 저항 변화에 따른 전압 변화를 ADC가 해석할 수 있는 0~3.3 V 범위 내로 유지할
    수 있습니다 [S12, S23].


    #### ADC 취득과 정규화

    OpenCR의 ADC는 12비트 해상도를 제공하므로 0~4095의 디지털 값을 출력합니다 [S12]. 취득된 원시 데이터는 노이즈를 포함하므로,
    이동 평균 필터(Moving Average Filter)를 적용하여 신호를 안정화한 뒤, 0.2 N~20 N 범위의 힘으로 매핑하는 정규화
    과정을 거쳐 제어기에 전달합니다 [S11, S12].'
  worked_examples:
  - '예제 1: 10 kΩ 분압 저항 선택 이유. FSR이 0.2 N에서 수 MΩ, 20 N에서 수백 Ω의 저항을 가질 때, 10 kΩ은 측정
    범위 전반에서 ADC 입력이 3.3 V 센서 전원 레일을 초과하지 않게 하고, 유효한 전압 스윙을 보장합니다 [S11, S12, S23].'
  - '예제 2: 12비트 ADC 값 계산. V_in=3.3 V, R_fixed=10 kΩ일 때, FSR 저항이 10 kΩ(압력 가해짐)이면 V_out=1.65
    V가 됩니다. ADC 값은 (1.65/3.3) * 4095 ≈ 2047이 출력됩니다 [S12, S23].'
  lab:
    title: FSR 센서 신호 취득 및 필터링 실습
    steps:
    - OpenCR의 3.3 V 센서 레일과 GND를 이용해 브레드보드에 10 kΩ 분압 회로를 구성한다 [S12, S23].
    - FSR 402 센서를 손끝 프레임에 안착시키고 회로에 연결한다 [S11].
    - OpenCR ADC 핀을 분압기 출력에 연결하여 데이터를 읽는다 [S12].
    - 무부하 상태에서 10 N 정도의 압력을 가하며 시리얼 플로터로 ADC 값을 관찰한다.
    - 이동 평균 필터를 구현하여 시리얼 플로터상에서 신호의 떨림을 제거한다.
    safety:
    - 실험 중 전원을 인가하기 전, 멀티미터의 DC 전압 모드로 센서 단자의 전압이 3.3 V를 넘지 않는지 확인한다.
    - 절대로 12 V 액추에이터 전원을 센서 회로와 공유하지 않는다 [B2, B3].
    - 회로 수정이 필요할 때는 반드시 전원을 물리적으로 분리하고, 각 분기 전압이 1 V 미만으로 방전된 것을 확인한 후 접근한다.
    - 납땜 및 회로 구성 시 보안경을 착용한다.
    deliverables:
    - 센서 취득 및 필터링이 적용된 소스 코드
    - 필터 적용 전후의 센서 출력 데이터 비교 그래프
    - 측정된 힘(N)과 ADC 값의 선형 상관관계 기록
  assignment:
    title: 손끝 접촉 피드백 루프 구현
    deliverables:
    - 센서 정규화 알고리즘 보고서
    - DYNAMIXEL 전류 피드백과 FSR 힘 데이터의 통합 제어 코드
    - 파지 시험 결과 및 데이터 기록
    rubric:
    - ADC 신호가 이동 평균 필터를 통해 안정적으로 출력되는가?
    - FSR 데이터가 0~20 N 범위로 정확히 매핑되는가?
    - 액추에이터 구동 중 센서 신호가 3.3 V 안전 범위 내에서 유지되는가?
  quiz:
  - question: OpenCR 보드에서 FSR 센서를 위한 ADC 입력 회로로 가장 적절한 것은?
    choices:
    - FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다
    - 3.3 V 센서 전원 분압
    answer_index: 1
    explanation: OpenCR의 ADC 입력은 3.3 V 레퍼런스를 기준으로 동작하며, 12 V 전원 사용 시 보드가 파손될 수 있으므로
      반드시 3.3 V 센서 전원을 사용해야 합니다 [B2, S12].
  - question: FSR 402 센서의 저항은 압력이 증가할 때 어떻게 변하는가?
    choices:
    - 저항이 증가한다.
    - 저항이 감소한다.
    answer_index: 1
    explanation: FSR(Force Sensing Resistor)은 압력이 가해지면 내부 도전성 레이어의 접촉 면적이 늘어나 저항이
      감소하는 특성을 가집니다 [S11].
  - question: 센서 데이터 취득 시 이동 평균 필터를 사용하는 주요 이유는?
    choices:
    - ADC 해상도를 높이기 위해
    - 센서의 신호 노이즈를 줄이고 데이터를 안정화하기 위해
    answer_index: 1
    explanation: FSR 신호는 접촉 환경이나 전기적 노이즈에 의해 떨림이 발생할 수 있으므로, 이동 평균 필터를 통해 신호의 변동성을
      완화하여 제어의 안정성을 확보합니다.
  completion_criteria:
  - FSR 센서의 전압 분압 회로를 올바르게 구성하고 ADC 입력을 성공적으로 취득하였다.
  - 이동 평균 필터를 적용하여 센서 노이즈를 10% 이하로 감소시켰다.
  - 안전 규정을 준수하여 12 V 액추에이터 전원과 센서 전원을 물리적으로 격리하여 운용하였다.
  source_ids:
  - S11
  - S23
  - S12
- id: M8
  slug: validation-calibration
  phase_id: PH3
  title: 성능 교정 및 최종 검증
  estimated_hours: 13.0
  prerequisites:
  - M7
  objectives:
  - DYNAMIXEL 액추에이터의 전류 및 위치 피드백 데이터를 활용한 정밀 교정 절차 이해
  - FSR 센서의 분압 회로 출력을 물리적 힘(N)으로 변환하는 교정 모델 수립
  - 로봇손의 기구학적 한계 및 장력 시스템의 안정성을 확인하는 최종 검증 시험 수행
  - 시스템 전력 분기 관리 및 계획 정지 후 DC 전압 측정 확인을 통한 안전 실습 습득
  theory_markdown: "### 시스템 검증 및 교정 이론\n로봇손의 정밀도는 제어기의 명령과 실제 물리적 출력 사이의 오차를 최소화하는\
    \ 데 달려 있습니다. \n\n#### 1. 액추에이터 전류 및 위치 교정\nXM430-W350-T 액추에이터는 내부적으로 전류와 위치 피드백을\
    \ 제공합니다 [S10]. 전류 피드백은 텐던의 장력과 직접적인 상관관계가 있으며, 이를 통해 로봇손의 파지력을 간접적으로 측정할 수 있습니다.\
    \ 각 관절의 제로 위치(Zero position)는 기구학적 조립 후 소프트웨어적으로 보정하여 오프셋을 설정해야 합니다.\n\n#### 2.\
    \ FSR 힘 센서 교정\nFSR 402는 압력에 따라 저항이 감소하는 Piezoresistive 특성을 가집니다 [S11]. OpenCR의\
    \ 12bit ADC 입력을 사용하여 3.3 V 센서 레일에서 10 kΩ 분압 저항과 구성된 전압 분압 회로의 전압 값을 읽어들입니다 [S12,\
    \ S23]. 힘(F)과 저항(R)의 비선형 관계를 파악하기 위해, 공인된 중량을 사용하여 0.2 N에서 20 N 범위의 출력을 기록하고 데이터\
    \ 회귀 모델을 수립합니다 [S11].\n\n#### 3. 최종 성능 검증\n구조물은 PC-CF 필라멘트를 사용하였으며 강성이 우수합니다 [S17].\
    \ 텐던으로 사용하는 Dyneema SK78은 신율이 1% 미만으로 매우 안정적이지만 [S14], 반복적인 장력 인가 시 유격이 발생할 수\
    \ 있으므로 최종 내구 시험이 필수적입니다. 또한, 액추에이터 11개를 3개의 독립 전원 분기로 나누어 운용하며, 각 분기는 10 A ATOF\
    \ 퓨즈로 보호됩니다 [S10, S22]."
  worked_examples:
  - '예제 1: FSR ADC 값을 힘으로 변환하기. ADC에서 읽은 12bit 값(0~4095)을 분압 공식을 통해 전압으로 변환하고, 미리
    수립된 실험 곡선을 사용하여 5 N의 파지력을 낼 때의 ADC 기준치를 도출합니다.'
  - '예제 2: 전류 제한 설정. DYNAMIXEL의 Goal Current 파라미터를 조정하여 텐던이 끊어지지 않도록 최대 장력을 제한합니다.
    XM430의 스톨 전류 2.3 A를 기준으로 배선 안전을 확보합니다 [S10].'
  lab:
    title: 로봇손 센서 교정 및 전력 안전 시험
    steps:
    - 모든 전원 어댑터 분리 및 OpenCR 제어기 무전원 상태 확인
    - 각 액추에이터 분기(4/4/3대)의 12 V 출력 단자에서 멀티미터로 1 V 미만 DC 전압 확인
    - FSR 센서에 표준 중량을 순차적으로 인가하며 ADC 출력 데이터 수집
    - 전원 인가 후 각 관절의 회전 범위와 장력 상태 확인
    - 계획 정지 후 정비 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다
    safety:
    - 절대 3개 전원 어댑터의 양(+) 단자를 병렬로 연결하지 말 것
    - 반드시 10 A 퓨즈가 장착된 독립 분기 회로를 사용할 것
    - 실험 중 정지는 전원을 물리적으로 차단하고 전압을 계측하여 확인
    - 충격 방지용 보안경 및 정전기 방지 조치 필수
    deliverables:
    - FSR 센서 힘-ADC 출력 교정 곡선 데이터
    - 액추에이터 관절 오프셋 교정 보고서
    - 전원 차단 후 각 분기별 잔류 전압 측정 기록
  assignment:
    title: 로봇손 최종 성능 및 안전 보고서
    deliverables:
    - 정밀 파지 시험 결과 보고서
    - 최종 교정된 제어 펌웨어 및 파라미터 값
    - 전력 분기별 부하 전류 및 퓨즈 보호 상태 기록
    rubric:
    - FSR 교정 모델의 R-squared 값이 0.95 이상일 것
    - 모든 액추에이터 분기가 독립적으로 관리되고 있음을 확인
    - 안전 수칙 준수 및 계획 정지 절차의 정확한 수행 기록
  quiz:
  - question: 로봇손의 전원 구성 중 절대 금지되는 사항은 무엇입니까?
    choices:
    - 독립된 전원 어댑터의 양(+) 출력 단자를 병렬로 연결
    - 각 관절에 10 A 퓨즈를 개별 적용
    - OpenCR의 3.3 V 센서 레일을 FSR 센서에 공급
    - 전원 분리 후 멀티미터로 전압 확인
    answer_index: 0
    explanation: 각 액추에이터 분기는 독립적으로 운영되어야 하며, 어댑터의 양(+) 단자를 병렬 연결하는 것은 금지됩니다.
  - question: FSR 402 센서를 OpenCR에 연결할 때 권장되는 전원은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    - 5 V 전원
    - 24 V 입력 전원
    answer_index: 1
    explanation: FSR 402 전압 분압 회로는 3.3 V 센서 전원을 사용해야 하며, ADC 신호가 3.3 V를 초과하지 않아야 합니다.
  - question: 실험 중 전원을 차단한 후 안전을 확인하는 방법은 무엇입니까?
    choices:
    - 퓨즈가 연결되어 있는지 확인
    - 멀티미터의 저항 모드로 측정
    - 물리적으로 전원을 분리하고 DC 전압 모드로 1 V 미만 확인
    - 제어 소프트웨어를 종료
    answer_index: 2
    explanation: 전원 차단 후 멀티미터의 DC 전압 모드를 통해 1 V 미만임을 계측하여 무전원 상태를 물리적으로 검증해야 합니다.
  completion_criteria:
  - FSR 센서 교정 데이터가 포함된 최종 보고서 제출
  - 모든 전원 분기 및 액추에이터 상태가 BOM 규격과 일치함을 확인
  - 안전 절차를 준수하여 전원 측정 및 차단 시험 완료
