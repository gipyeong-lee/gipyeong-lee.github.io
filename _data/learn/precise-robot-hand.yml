- id: M4
  slug: structure-fabrication
  phase_id: P2
  title: 구조물 제작 및 조립
  estimated_hours: 10.0
  prerequisites:
  - M3
  objectives:
  - 3D 프린팅된 부품의 조립 공차와 열압입 인서트(Heat-set insert) 체결 원리를 이해합니다.
  - 정밀 기계 축과 베어링 결합을 위한 올바른 정렬 및 고정 방법을 습득합니다.
  - 텐던 구동 시스템의 마찰을 최소화하고 적절한 장력을 조절하는 조립 전략을 학습합니다.
  - 독립 전원 분기 구성과 물리적 안전 수칙을 준수하여 로봇손 하드웨어를 조립합니다.
  theory_markdown: '## 구조물 제작 및 조립 이론


    ### 1. 열압입 인서트 체결 (Heat-set Inserts)

    PC-CF(탄소섬유 폴리카보네이트)와 같은 고강도 필라멘트는 반복적인 나사 체결 시 마모되기 쉽습니다. M3 황동 열압입 인서트(HTBI-M3-BR)는
    플라스틱을 국부적으로 용융시켜 나사산을 형성함으로써 체결 강도를 확보합니다 [S21]. 구멍은 설계 시 반드시 인서트 외경(4.4 mm)보다
    작은 파일럿 홀(4.0 mm)로 설계하여 삽입 후 황동 널링(knurling)이 플라스틱에 충분히 맞물리도록 합니다.


    ### 2. 베어링과 샤프트의 정밀 공차

    본 로봇손은 무급유 폴리머 슬리브 베어링(JSM-0810-10)을 사용합니다 [S17]. 베어링은 하우징에 압입(press-fit)될 때 내경이
    수축하며, 이 과정에서 정밀 샤프트(AWMP-08)와 적절한 구름 공차를 형성합니다 [S17, S18]. 샤프트 절단 시 모따기(chamfering)를
    수행하여 베어링 삽입 시 폴리머 내부 표면이 긁히지 않도록 주의해야 합니다.


    ### 3. 하드웨어 전원 안전 분기

    본 프로토타입은 총 11개의 XM430-W350-T 액추에이터를 사용하며, 각 액추에이터의 스톨 전류는 2.3 A입니다 [S11]. 3개의
    독립된 절연 전원 어댑터(GST160A12-R7B)를 사용하여 4대/4대/3대씩 전원을 분기합니다 [S15]. **양(+) 출력 단자를 서로
    연결하거나 병렬로 합치는 행위는 절대 금지됩니다.** 각 분기는 ATO 인라인 퓨즈 홀더(0AFH0001Z)와 10 A ATOF 퓨즈(0287010.U)를
    사용하여 과전류로부터 배선을 보호합니다 [S23, S24].'
  worked_examples:
  - '예제 1: 퓨즈 용량 계산. 1개 분기에 액추에이터 4대를 할당할 경우 피크 스톨 전류 합계는 2.3 A × 4 = 9.2 A입니다 [S11].
    따라서 10 A 퓨즈는 정격 범위 내에서 안전한 과전류 차단을 제공합니다 [S24].'
  - '예제 2: 인서트 체결 검증. PC-CF 부품에 4.0 mm 구멍이 정확히 가공되었는지 디지털 캘리퍼스로 확인한 후, 인서트 깊이가 부품
    표면과 평탄하게 조립되었는지 확인합니다 [S19, S21].'
  lab:
    title: 로봇손 하드웨어 정밀 조립
    steps:
    - 각 손가락 링크 부품에 M3 열압입 인서트를 규정 깊이로 삽입합니다.
    - JSM-0810-10 베어링을 손목 및 관절 하우징에 정렬하여 압입합니다.
    - 알루미늄 정밀 샤프트를 규격에 맞춰 절단 및 모따기한 후 관절을 결합합니다.
    - 3개 전원 분기 회로에 인라인 퓨즈 홀더를 장착하고 10 A 퓨즈를 삽입합니다.
    - 각 분기 어댑터 양(+) 단자를 개별 테스트 포인트로 확보하고 독립성을 멀티미터로 검증합니다.
    safety:
    - 열압입 인서트 작업 시 화상 주의 및 충분한 환기 환경에서 작업하십시오.
    - 모든 전원은 물리적으로 분리(코드 뽑음)된 상태에서 조립을 진행하십시오.
    - 금속 가공(절단·모따기) 시 충격 방지 작업용 보안경을 반드시 착용하십시오.
    - 전원 인가 후에는 퓨즈 단자함 내부에 직접 접촉하지 마십시오.
    deliverables:
    - 조립 완료된 5지 로봇손 기구 프레임
    - 전원 분기별 독립성 검증(DC 전압 계측) 기록지
    - 관절별 자유로운 회전 범위 확인 영상
  assignment:
    title: 로봇손 기구 설계 및 전원 분기 분석 보고서
    deliverables:
    - 열압입 인서트 삽입 공정에서의 치수 공차 보고서
    - 전원 분기별 전압 측정값 및 독립성 입증 데이터
    - 조립 과정 중 발생한 마찰 문제 해결 사례 기술
    rubric:
    - 열압입 인서트가 평면도 내에 정확히 조립되었는가?
    - 베어링과 샤프트 결합부의 유격이 적절한가?
    - 3개의 전원 어댑터가 물리적으로 분리되어 각각의 분기를 담당하는가?
    - 과전류 보호를 위한 퓨즈 사양과 배선이 BOMtruth와 일치하는가?
  quiz:
  - question: PC-CF 부품에 M3 열압입 인서트를 사용할 때 파일럿 홀의 올바른 크기는?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 5.0 mm
    - 6.0 mm
    answer_index: 1
    explanation: 인서트 외경 4.4 mm에 맞물리도록 공식 권장 홀 크기인 4.0 mm를 사용해야 합니다 [S21].
  - question: 전원 분기 구성 시 금지된 행위는 무엇입니까?
    choices:
    - 개별 퓨즈 장착
    - 어댑터 출력 전압 측정
    - 3개 전원 어댑터의 양(+) 출력 단자 병렬 연결
    - 분기별 독립 전원 유지
    answer_index: 2
    explanation: 독립형 전원 어댑터의 출력 단자를 서로 연결하거나 병렬로 구성하는 것은 시스템 안정성에 치명적이며 금지됩니다.
  - question: 액추에이터 4대를 포함하는 분기에 적절한 퓨즈 용량은?
    choices:
    - 2 A
    - 5 A
    - 10 A
    - 20 A
    answer_index: 2
    explanation: 4대의 스톨 전류 합계 9.2 A보다 크고, 어댑터 정격 11.5 A보다 작은 10 A 퓨즈가 적절합니다 [S11,
      S15, S24].
  completion_criteria:
  - 5개 손가락 링크가 베어링을 통해 부드럽게 작동함
  - 모든 열압입 인서트가 이탈 없이 견고하게 고정됨
  - 3개의 전원 분기가 서로 전기적으로 독립되어 있음을 멀티미터로 확인 완료
  - 독립 분기 배선 시 10 A 퓨즈가 정격에 맞춰 정상 설치됨
  source_ids:
  - S19
  - S21
