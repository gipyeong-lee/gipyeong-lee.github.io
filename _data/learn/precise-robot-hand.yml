- id: M3
  slug: structural-fabrication
  phase_id: PH2
  title: 3D 모델링 및 구조 제작
  estimated_hours: 20.0
  prerequisites:
  - M2
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)의 기계적 특성과 FDM 출력 환경 이해
  - 열압입 인서트(Heat-set Insert)를 이용한 반복 조립 가능한 기구 구조 설계
  - 로봇 손가락 링크와 손바닥 프레임 제작을 위한 적층 제조 공정 최적화
  theory_markdown: "### FDM 고기능 소재 공정 이론\n정교한 5지 로봇손 제작에는 강성과 내열성이 우수한 탄소섬유 보강 PC\
    \ 필라멘트(Prusament PC Blend Carbon Fiber)가 사용됩니다 [S18]. PC-CF는 순수 PC에 비해 치수 안정성이\
    \ 높고 변형이 적어 정밀 부품 제작에 적합합니다 [S18]. \n\n#### 1. FDM 출력 핵심 설정\n고기능 소재를 다루기 위해서는\
    \ 다음과 같은 환경 제어가 필수적입니다:\n- **노즐**: 탄소섬유는 연마성이 매우 강하므로 황동 노즐이 아닌 반드시 **경화강(Hardened\
    \ Steel) 노즐**을 사용해야 합니다 [S18].\n- **온도 조건**: 베드 온도는 110 °C로 유지하여 수축을 방지하고, 노즐\
    \ 온도는 285 °C 부근에서 소재의 적절한 유동성을 확보해야 합니다 [S18].\n- **표면 처리**: PC-CF는 접착력이 강하므로\
    \ PEI 시트 보호를 위해 필요시 접착제(Glue stick)를 도포합니다 [S18].\n\n#### 2. 기구 조립의 정밀도 향상\n반복적인\
    \ 분해와 조립이 필요한 로봇 관절부에는 나사산을 직접 내는 대신 **열압입 나사산 인서트**를 사용합니다 [S20].\n- **인서트 규격**:\
    \ M3 열압입 인서트(HTBI-M3-BR)는 외경 4.4 mm, 길이 5.8 mm 사양을 가집니다 [S20].\n- **파일럿 홀(Pilot\
    \ Hole)**: 설계 시 인서트 압입을 위해 지름 4.0 mm의 홀을 미리 형성해야 합니다 [S20].\n- **조립 공정**: 인서트를\
    \ 가열하여 압입함으로써 플라스틱 내부에 견고한 금속 암나사를 형성하여 반복 조립 시 나사산 뭉개짐을 방지합니다 [S20]."
  worked_examples:
  - '예제 1: 관절 하우징의 파일럿 홀 설계. M3 인서트 외경이 4.4 mm이지만, 제조사 권장 홀 크기는 4.0 mm입니다 [S20]. CAD
    설계 시 이 치수를 정확히 적용해야 압입 후 변형 없이 견고하게 고정됩니다.'
  - '예제 2: 출력 설정 최적화. PC-CF는 수축율이 작지만 대형 손바닥 프레임 출력 시 층간 결합력 강화를 위해 인클로저 사용을 권장하며,
    냉각 팬 속도를 낮추어 층간 박리를 예방해야 합니다 [S18].'
  lab:
    title: PC-CF 관절 링크 출력 및 인서트 압입 실습
    steps:
    - 경화강 노즐이 장착된 FDM 프린터에 PC-CF 필라멘트를 로드하고 베드 온도를 110 °C로 예열합니다 [S18].
    - 관절 링크와 손바닥 프레임 모델을 준비하고, 인서트 압입용 4.0 mm 파일럿 홀이 설계에 반영되었는지 확인합니다 [S20].
    - 출력 완료된 파트의 서포트를 제거하고, 인서트 압입 홀 주변의 거친 표면을 정리합니다.
    - 인서트 압입 도구(인두기 팁)를 이용하여 HTBI-M3-BR 인서트를 홀에 수직으로 압입합니다 [S20].
    - 냉각 후 M3 캡스크루를 체결하여 나사산 결합이 견고한지 확인합니다 [S19].
    safety:
    - 285 °C 노즐과 110 °C 베드는 화상을 유발할 수 있으므로 반드시 주의합니다 [S18].
    - 가열된 인서트 취급 시 전용 도구를 사용하고 인두기 화상에 유의합니다.
    - 탄소섬유 미세 입자가 발생할 수 있으므로 출력 파트 가공 시 보안경과 마스크를 착용합니다.
    deliverables:
    - 최종 출력된 관절 링크 및 손바닥 프레임 파트
    - 인서트 압입 품질 사진
    - M3 캡스크루 체결 검증 데이터
  assignment:
    title: 로봇 손 구조 설계 보고서
    deliverables:
