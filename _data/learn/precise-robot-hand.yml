- id: mod-6
  slug: control-system
  phase_id: phase-3
  title: 제어 시스템 구축
  estimated_hours: 15.0
  prerequisites:
  - mod-5
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 동작 원리와 프로토콜 이해
  - OpenCR 제어기를 통한 액추에이터 명령 전송 및 상태 피드백 구현
  - FSR 힘 센서를 활용한 전압 분압 회로 설계 및 ADC 데이터 변환
  - 실시간 제어 루프를 통한 로봇손 파지 상태기계(FSM) 구축
  theory_markdown: '## 제어 시스템 아키텍처

    정교한 5지 로봇손 제어 시스템은 통신 효율과 실시간성을 최우선으로 설계합니다. OpenCR 1.0은 216MHz CPU를 탑재하여 외부 브리지
    없이 액추에이터와 직접 통신하며, DYNAMIXEL Protocol 2.0을 통해 위치·속도·전류 피드백을 수신합니다 [S12].


    ### 전원 분기 및 안전

    로봇손은 11개의 액추에이터를 구동하며, 각 어댑터는 12 V, 11.5 A의 정격 출력을 가집니다 [S14]. 전원 회로는 3개의 독립된
    분기로 구성되며, 각 분기는 ATOF 10 A 퓨즈로 과전류 보호를 수행합니다 [S24]. 모든 양(+) 출력은 전기적으로 격리되어야 하며,
    독립적으로 유지하여 시스템 안전성을 확보합니다. [주의] 양(+) 출력 간의 물리적 결합은 시스템 고장을 유발하므로 엄격히 금지합니다.


    ### 센서 데이터 취득

    손끝 힘 감지 센서(FSR 402)는 압력에 따라 저항이 변하는 Piezoresistive 특성을 가집니다 [S5]. 10 kΩ 분압 저항과
    함께 전압 분압 회로를 구성하여 OpenCR의 12비트 ADC 입력을 통해 0~3.3 V 신호로 변환합니다 [S12, S25]. FSR의 감지
    범위는 0.2 N ~ 20 N이며, 이를 정밀하게 디지털화하여 제어 로직에 피드백합니다 [S5].'
  worked_examples:
  - '예제 1: OpenCR과 액추에이터 통신 설정 - DYNAMIXEL XM430-W350의 위치 모드 제어를 위해 ID를 설정하고, `Present
    Position` 레지스터를 호출하여 실시간 관절 각도를 0.088도 단위로 읽어오는 루프 구현.'
  - '예제 2: FSR 센서 ADC 변환식 - FSR 데이터시트와 분압 회로 특성을 기반으로, ADC 값(0-4095)을 물리적인 힘(N)으로
    변환하는 선형 보간 알고리즘 구현. 10 kΩ 저항과 FSR의 저항 변화비를 전압식으로 도출.'
  lab:
    title: 로봇손 제어기 배선 및 센서 데이터 취득 실습
    steps:
    - OpenCR 1.0 전원 입력단과 12 V 액추에이터 전원 분기를 물리적으로 완전히 격리하여 배치합니다.
    - 각 FSR 402 센서와 10 kΩ 분압 저항을 사용하여 전압 분압기를 구성하고 OpenCR의 ADC 핀에 연결합니다.
    - 독립된 3개의 전원 어댑터 분기를 각 퓨즈 홀더를 통해 액추에이터에 연결합니다.
    - OpenCR에 제어 코드를 업로드하고 시리얼 모니터를 통해 FSR 압력을 가했을 때의 ADC 값 변화를 확인합니다.
    - 시험 종료 후 모든 전원 어댑터를 물리적으로 분리하고, 멀티미터 DC 전압 모드로 각 퓨즈 단자에서 1 V 이하임을 계측 확인합니다.
    safety:
    - 전원 인가 전 모든 결선 상태를 멀티미터 도통 모드로 확인하지 말고, 육안과 배선도로 검증합니다.
    - 작업 중 전원 인가 시 손을 액추에이터 가동 범위 내에 넣지 않습니다.
    - 이상 발열·냄새·연기 감지 시 접근하지 말고 소프트웨어 토크 해제를 우선 수행하며, 화재 위험 시 즉시 대피한다. 전원 분리는 계획 정지
      후 정비·접근 전에만 수행한다.
    - 무전원 상태 확인 시 반드시 DC 전압 측정 모드를 사용하며, 1 V 미만일 때만 접근합니다.
    deliverables:
    - 배선 결선도 수정본
    - FSR 센서 압력 데이터 그래프
    - 전원 분기별 무전원 확인 측정 로그
  assignment:
    title: 로봇손 운전 상태기계(FSM) 설계 및 구현
    deliverables:
    - 파지 제어 알고리즘 코드 (C++)
    - 5지 로봇손 상태기계 설계 문서
    - 최종 성능 시험 보고서
    rubric:
    - DYNAMIXEL 통신 성공 및 위치 피드백 정확도
    - FSR 데이터 보정 및 파지력 임계값 구현
    - 상태기계의 논리적 오류 유무
    - 전원 안전 지침 준수 및 계측 기록의 충실성
  quiz:
  - question: FSR 402 센서 신호를 OpenCR로 취득할 때 올바른 전압 분압 회로 구성은 무엇입니까?
    choices:
    - FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다
    - FSR을 3.3 V 센서 레일과 ADC 사이에 배치하고, ADC와 GND 사이에 10 kΩ 저항 배치
    - FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다
    - ADC 신호 라인에 저항 없이 FSR을 직접 연결
    answer_index: 1
    explanation: OpenCR의 센서 전원은 3.3 V 레일을 사용해야 하며, ADC 입력을 0~3.3 V 범위로 맞추기 위해 FSR과
      10 kΩ 저항을 사용하는 분압 회로가 필요합니다.
  - question: 액추에이터 전원 분기를 구성하는 Meanwell 어댑터 분기 사용 시 가장 중요한 안전 사항은 무엇입니까?
    choices:
    - 모든 어댑터의 출력 단자를 서로 연결하여 전류를 극대화한다.
    - 3개 어댑터의 출력은 반드시 독립 분기로 유지하고 절대 양(+) 출력을 결합하지 않는다.
    - 퓨즈는 제어기 보호를 위해 제어 보드 내부에만 설치한다.
    - 어댑터 하나로 11대 액추에이터를 모두 감당할 수 있으므로 분기할 필요 없다.
    answer_index: 1
    explanation: 각 어댑터 출력은 독립적인 분기로 관리되어야 하며, 양(+) 출력의 병렬 연결은 금지됩니다. 퓨즈는 분기별 과전류 보호를
      위해 필수적입니다.
  completion_criteria:
  - OpenCR과 액추에이터 간 통신 및 명령 제어 성공
  - 5개 손가락 FSR 센서 데이터 취득 및 ADC 정상 동작 확인
  - 전원 분리 후 각 분기 전압이 1 V 미만임을 계측한 기록 제출
  - 상태기계 구현을 통해 로봇손의 파지 및 토크 해제 시나리오 검증
  source_ids:
  - S12
  - S14
  - S24
  - S5
  - S25
- id: mod-7
  slug: firmware-coding
  phase_id: phase-3
  title: 펌웨어 및 제어 코드
  estimated_hours: 10.0
  prerequisites:
  - mod-6
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 동작 원리와 제어 프로토콜(Protocol 2.0)을 이해한다.
  - OpenCR 제어기의 통신 포트 구성과 센서 데이터를 처리하는 펌웨어 아키텍처를 설계한다.
  - FSR 센서의 아날로그 신호를 OpenCR ADC로 취득하여 디지털 힘 피드백으로 변환한다.
  - 액추에이터 제어 및 상태 모니터링을 포함한 로봇손 운전 상태기계를 구현한다.
  theory_markdown: '### 로봇 펌웨어 아키텍처 및 제어 원리


    5지 로봇손의 펌웨어는 고성능 마이크로컨트롤러인 OpenCR [S12] 상에서 구동되는 실시간 제어 시스템입니다. 핵심은 DYNAMIXEL
    Protocol 2.0을 통한 스마트 액추에이터의 정밀 제어입니다 [S2].


    #### 1. 액추에이터 제어

    XM430-W350-T 액추에이터는 위치, 속도, 전류 피드백을 실시간으로 제공합니다 [S2]. 펌웨어는 각 손가락 관절의 상태를 주기적으로
    읽고, 목표 위치(Goal Position)를 전송하여 정밀한 파지 동작을 수행합니다.


    #### 2. 센서 데이터 취득 (FSR)

    손끝에 배치된 FSR 402 센서는 접촉 시 저항이 감소합니다 [S5]. 이를 10 kΩ 저항 [S25]과 결합하여 전압 분압 회로를 구성합니다.
    OpenCR의 12-bit ADC [S12]는 이 전압 신호를 디지털 값으로 변환하여 힘 피드백으로 사용합니다. 주의: 분압 회로는 반드시
    OpenCR의 3.3 V 센서 전원을 사용해야 하며, 아날로그 신호 범위는 0~3.3 V를 초과해서는 안 됩니다 [S12].


    #### 3. 상태기계 설계

    펌웨어는 다음 상태를 순환합니다:

    - **초기화(Init):** 통신 포트 설정 및 액추에이터 연결 확인.

    - **대기(Idle):** 명령 대기 및 센서 데이터 주기적 모니터링.

    - **파지(Grasp):** 목표 위치로 액추에이터 구동 및 힘 피드백을 통한 토크 조절.

    - **오류(Error):** 과전류(스톨 전류 2.3 A 초과) [S2] 발생 시 안전 모드 전환.


    #### 4. 전원 관리

    시스템은 3개의 독립적인 12 V 전원 분기를 사용하며, 각 분기는 10 A ATOF 퓨즈 [S24]로 보호됩니다. 각 어댑터 출력의 양(+)
    단자를 물리적으로 결합하거나 통신하여 연결해서는 안 되며, 독립된 분기로 운용해야 합니다 [S14].'
  worked_examples:
  - '예제 1: DYNAMIXEL 목표 위치 전송. Protocol 2.0의 `SyncWrite` 명령을 사용하여 11개 액추에이터의 목표 위치를
    동시에 업데이트하여 부드러운 손동작을 구현합니다 [S2].'
  - '예제 2: ADC 기반 힘 계산. FSR 전압 분압 회로에서 읽은 ADC 값(0~4095)을 0~20 N 범위의 힘(N)으로 매핑합니다 [S5,
    S12].'
  lab:
    title: 로봇손 펌웨어 컴파일 및 구동 시험
    steps:
    - OpenCR 보드를 PC에 연결하고 펌웨어 개발 환경을 구성합니다 [S12].
    - 각 액추에이터의 ID를 할당하고 통신 상태를 확인합니다 [S2].
    - FSR 센서 분압 회로를 OpenCR ADC 입력에 연결합니다 [S12, S25].
    - 상태기계 코드를 업로드하고 무부하 상태에서 각 손가락의 동작 범위를 확인합니다.
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다 [S14].
    - 멀티미터로 각 전원 분기의 DC 전압이 1 V 미만임을 확인합니다.
    safety:
    - 전원 인가 중 가동 범위 내에 손을 넣지 마십시오.
    - 계측 시 절연형 데스크톱 전원 어댑터의 물리적 분리를 먼저 수행하십시오 [S14].
    - ADC 입력 신호가 3.3 V를 초과하지 않도록 회로를 검증하십시오 [S12].
    - 전류 제한 및 10 A 퓨즈 보호가 올바르게 작동하는지 확인하십시오 [S24].
    - 오류 발생 시 즉시 전원을 차단하십시오.
    deliverables:
    - 최종 펌웨어 소스 코드
    - 센서 데이터 로그 파일
    - 동작 시험 결과 보고서
  assignment:
    title: 힘 피드백 기반 파지 알고리즘 구현
    deliverables:
    - 파지 제어 로직 기술 문서
    - 센서값-힘 환산 계수 교정 데이터
    - 파지 시험 영상 및 데이터
    rubric:
    - 모든 관절이 명령에 따라 0.5초 이내에 반응하는가?
    - ADC 데이터가 노이즈를 필터링하고 정확하게 힘으로 변환되는가?
    - 액추에이터 과전류 보호(2.3 A)가 소프트웨어 수준에서 구현되었는가? [S2]
    - 모든 전원 분기 연결 및 분리 절차가 안전하게 수행되었는가?
  quiz:
  - question: FSR 센서 전압 분압 회로에 권장되는 공급 전압은 무엇입니까?
    choices:
    - 12 V
    - 5 V
    - 3.3 V
    - 24 V
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3 V 신호를 처리하며, 센서 전압 분압 회로는 3.3 V 센서 전원을 사용해야 안전합니다
      [S12].
  - question: XM430-W350-T 액추에이터의 정격 스톨 전류는 얼마입니까?
    choices:
    - 1.0 A
    - 2.3 A
    - 10.0 A
    - 11.5 A
    answer_index: 1
    explanation: 데이터시트에 명시된 스톨 전류는 2.3 A입니다 [S2].
  - question: 전원 어댑터 출력의 올바른 사용법은 무엇입니까?
    choices:
    - 3개 어댑터의 (+) 출력을 병렬 연결하여 전류 용량을 늘린다.
    - 독립적인 분기로 사용하며 (+) 출력 결합을 절대 금지한다.
    - 하나의 어댑터에 11개 액추에이터를 모두 연결한다.
    - AC 단자를 직접 분기하여 사용한다.
    answer_index: 1
    explanation: 어댑터 양(+) 출력 병렬 연결은 금지되며, 독립 분기로 사용하여 퓨즈 보호를 수행해야 합니다 [S14].
  completion_criteria:
  - 컴파일된 펌웨어가 OpenCR 제어기에 성공적으로 업로드됨.
  - 모든 11개 액추에이터가 제어 명령에 반응함.
  - FSR 센서 5개 모두가 ADC 값을 통해 힘 데이터를 출력함.
  - 전원 분리 및 전압 측정 절차를 완료하여 안전함을 증명함.
  source_ids:
  - S2
  - S12
  - S5
  - S25
  - S24
  - S14
- id: mod-8
  slug: validation-testing
  phase_id: phase-3
  title: 검증 및 평가
  estimated_hours: 10.0
  prerequisites:
  - mod-7
  objectives:
  - 로봇손의 성능 검증을 위한 정량적 시험 지표를 이해한다.
  - 정밀 파지 시험을 통해 액추에이터 제어 및 힘 감지 피드백의 정확도를 평가한다.
  - 전원 분기 및 보호 회로의 안정성을 물리적으로 측정하고 기록한다.
  - 로봇 시스템의 최종 성능 검증 보고서 작성 방법을 익힌다.
  theory_markdown: '### 로봇손 검증의 중요성

    로봇 공학에서 시스템 검증은 설계의 의도와 실제 물리적 성능 사이의 간극을 확인하는 필수 과정입니다 [S10]. 특히 텐던 구동 방식은 마찰,
    탄성, 신율 등 비선형 요소가 많아 정밀한 교정과 평가가 요구됩니다.


    ### 파지 시험(Grasping Test)의 지표

    파지 성공률은 로봇손의 신뢰성을 보여주는 핵심 척도입니다. 본 프로젝트에서는 FSR 402 센서를 사용하여 손끝 접촉력을 측정하고, [S5]
    정해진 대상물을 파지할 때의 힘 제어 정확도를 평가합니다. 성공률(Success Rate)은 총 시도 횟수 대비 안정적인 파지 성공 횟수의
    비율로 정의하며, [S10] 파지 시간은 제어 알고리즘의 효율성을 나타냅니다.


    ### 전기 시스템 안전 검증

    본 프로토타입은 12 V 전원 어댑터 [S14] 3개를 분리하여 사용합니다. 각 분기는 독립된 10 A ATOF 퓨즈 [S24]를 통해 과전류로부터
    보호됩니다. 검증 시 각 전원 어댑터의 부하를 개별 측정하며, 모든 전원 공급 장치는 물리적으로 독립된 단자를 유지하여 출력단의 결합을 방지해야
    합니다.


    ### 안전 준수 지침

    - **물리적 차단:** 정비 및 측정 전 3개 전원 어댑터를 벽면 콘센트에서 물리적으로 제거합니다.

    - **무전원 확인:** 멀티미터의 DC 전압 측정 모드를 사용하여, 전원 분리 후 각 분기의 잔류 전압이 1 V 미만임을 반드시 확인합니다
    [S10]. 절대 저항 모드로 검증하지 않습니다.

    - **보안경:** 모든 물리적 시험 과정에서 파편 비산 방지를 위해 보안경을 착용합니다.'
  worked_examples:
  - '예시 1: 파지 성공률 계산. 20회 반복 실험 중 16회 성공 시, 성공률 = (16/20) * 100 = 80%.'
  - '예시 2: 분기별 전류 측정. DYNAMIXEL 4대(스톨 합계 9.2 A)가 포함된 분기에 10 A 퓨즈가 장착되었는지 확인하고, 가동
    중 실제 소비 전류가 정격 범위 내인지 멀티미터로 측정.'
  lab:
    title: 로봇손 기능 및 전기 안전 검증
    steps:
    - 각 액추에이터 분기에 10 A 퓨즈가 0AFH0001Z 홀더에 올바르게 장착되었는지 확인합니다.
    - 3개의 절연 전원 어댑터를 각기 다른 전원 분기에 연결합니다.
    - 전원 인가 후, OpenCR 제어기를 통해 초기 위치 제어 명령을 보냅니다.
    - FSR 센서가 0~3.3 V 범위 내에서 힘 데이터를 정상적으로 출력하는지 ADC 값을 모니터링합니다.
    - 파지 시험을 수행하고 각 손가락의 텐던 장력 전달 여부를 기록합니다.
    - 시험 종료 후 전원을 차단하고, 각 분기의 DC 전압이 1 V 이하인지 멀티미터로 측정합니다.
    safety:
    - 반드시 보안경을 착용합니다.
    - 전원 인가 중 가동 범위 내에 손을 넣지 않습니다.
    - 정비 전 3개 전원 어댑터를 모두 물리적으로 분리합니다.
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
    deliverables:
    - 파지 시험 성공률 및 데이터 기록지
    - 각 전원 분기의 가동 전류 측정 기록
    - 최종 성능 검증 보고서
  assignment:
    title: 로봇손 검증 최종 보고서 작성
    deliverables:
    - 파지 성공률 데이터 및 분석 보고서
    - 교정 기록을 포함한 센서 응답 그래프
    - 전기 안전 측정 기록(전압 확인 과정 포함)
    rubric:
    - 정량적 시험 데이터를 포함하고 있는가?
    - 전기 안전 검증 절차(1 V 미만 확인 등)가 명시되어 있는가?
    - 결과 분석 및 향후 개선 방향이 논리적인가?
  quiz:
  - question: 시스템 검증 시 정비 전 무전원 상태 확인을 위해 가장 적절한 방법은?
    choices:
    - 멀티미터 저항 모드 사용
    - 멀티미터 DC 전압 모드 사용
    - 퓨즈의 단선 여부 확인
    - 제어 소프트웨어의 토크 해제 명령
    answer_index: 1
    explanation: 반드시 멀티미터의 DC 전압 측정 모드를 사용해 실제 잔류 전압이 1 V 미만임을 확인해야 합니다. 저항이나 연속성
      모드는 안전을 보장하는 측정법이 아닙니다.
  - question: 파지 시험에서 성공률을 정의하는 정량적 방법은?
    choices:
    - 총 시도 횟수 대비 성공 횟수의 비율
    - 로봇손의 총 가동 시간
    - 사용된 액추에이터의 전체 개수
    - 센서의 최대 입력 전압
    answer_index: 0
    explanation: 성공률(Success Rate)은 신뢰성을 평가하는 지표로, 성공한 시행 횟수를 총 시도 횟수로 나눈 값입니다.
  - question: 본 시스템의 전기 안전을 위해 12 V 전원 어댑터 출력단을 어떻게 구성해야 하는가?
    choices:
    - 출력 효율 향상을 위해 양(+) 출력을 모두 병렬로 연결
    - 각 어댑터를 독립 분기로 유지하고 병렬 연결 금지
    - 3개 어댑터를 2개와 1개로 나누어 2개를 병렬 연결
    - 퓨즈 대신 소프트웨어적 전류 제한 사용
    answer_index: 1
    explanation: 모든 양(+) 출력은 독립적으로 유지되어야 하며, 상호 병렬 연결은 금지됩니다. 각 분기는 독립 퓨즈를 통해 과전류로부터
      보호받아야 합니다.
  completion_criteria:
  - 파지 시험을 성공적으로 수행하고 결과 데이터를 제출함.
  - 모든 전기 시스템 안전 점검 기록을 제출함.
  - 최종 성능 검증 보고서의 모든 필수 항목을 충족함.
  source_ids:
  - S10
  - S5
  - S14
  - S24
