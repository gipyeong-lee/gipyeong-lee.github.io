- id: M3
  slug: hand-design
  phase_id: PH1
  title: 로봇손 기구 설계 최적화
  estimated_hours: 12.0
  prerequisites:
  - M2
  objectives:
  - 인간 손의 파지 능력을 정량화하는 '손가락 상호작용(IF, Interactivity of Fingers)' 지표를 이해한다.
  - 로봇손 기구학적 구조 최적화 과정에서 유전 알고리즘의 역할을 파악한다.
  - 텐던 구동 로봇손 설계 시 강성, 마찰, 텐던 동역학의 상충 관계를 분석한다.
  - 정밀 파지를 위한 손가락 링크 배치와 엄지손가락 안장 관절(saddle joint) 위치 결정의 중요성을 습득한다.
  theory_markdown: "## 로봇손 기구 설계 및 최적화 이론\n\n### 1. 손가락 상호작용 (Interactivity of Fingers,\
    \ IF)\n인간의 손은 엄지와 다른 손가락들이 유기적으로 상호작용하며 복잡한 파지 작업을 수행한다. 로봇손 설계에서 '손가락 상호작용(IF)'은\
    \ 다지 정밀 파지 능력을 정량화하는 핵심 지표이다 [S3]. IF 지표는 기구학적 모델의 최적화를 위한 목적 함수로 활용되며, 이를 최대화할\
    \ 때 로봇손은 인간과 유사한 파지 성능을 얻을 수 있다 [S3].\n\n### 2. 기구학적 최적화\n로봇손 설계의 최적화는 유전 알고리즘(Genetic\
    \ Algorithm)과 같은 메타휴리스틱 기법을 통해 수행된다 [S3]. 특히, 엄지손가락의 안장 관절 위치와 손가락의 방향성(orientation)은\
    \ 파지 영역을 결정짓는 결정적 변수이다 [S3]. 최적화된 설계는 기존 모델 대비 IF 지표를 대폭(최대 5배 이상) 향상시킬 수 있다 [S3].\n\
    \n### 3. 텐던 구동 동역학\n텐던 구동 방식은 모터의 동력을 섬유 텐던(예: Dyneema SK78)을 통해 원거리의 관절로 전달한다\
    \ [S8, S15]. \n- **텐던 특성:** 1.5mm 지름의 Dyneema SK78은 230daN의 높은 파단 하중과 1% 미만의 작동\
    \ 신율을 가져 정밀 제어에 적합하다 [S15].\n- **설계 고려사항:** 관절의 마찰을 줄이기 위해 무급유 폴리머 베어링(JSM-0810-10)을\
    \ 사용하며, 텐던이 꺾이는 모서리는 라운딩 처리하여 마모를 방지해야 한다 [S15, S16].\n\n### 4. 구조적 완성도\n탄소섬유\
    \ 보강 PC 필라멘트(PC-CF)는 높은 강성과 치수 안정성을 제공하여 손가락 링크와 프레임 제작에 최적이다 [S18]. 반복 조립의 신뢰성을\
    \ 위해 M3 열압입 인서트(HTBI-M3-BR)를 사용해야 한다 [S20]."
  worked_examples:
  - '예제 1: IF 지표 기반 최적화 모델 평가. 특정 설계안의 IF 값이 이전 버전보다 3배 향상되었다면, 이는 유전 알고리즘의 교차 및 돌연변이
    연산을 통해 엄지손가락의 안장 관절 위치가 최적해 부근으로 수렴했음을 의미한다 [S3].'
  - '예제 2: 텐던 장력 전달 분석. 11.5A 정격의 12V 어댑터를 사용하고, 액추에이터(XM430-W350-T)의 피크 전류를 고려할 때,
    3개 분기로의 전력 배분(4대/4대/3대)은 각 어댑터의 부하를 정격 범위 내로 유지하며 과전류를 방지한다 [S10, S14].'
  - '예제 3: 열압입 인서트 홀 설계. HTBI-M3-BR 인서트를 위해 PC-CF 출력물에 4.0mm 파일럿 홀을 구성하는 것은 조립 후 나사산의
    반복 인장력을 확보하는 필수 과정이다 [S20].'
  lab:
    title: 로봇손 링크 최적화 및 텐던 마찰 실험
    steps:
    - 최적화된 CAD 데이터를 기반으로 PC-CF 필라멘트를 사용하여 손가락 링크를 3D 프린팅한다 [S18].
    - 출력물에 4.0mm 홀을 확인하고 M3 열압입 인서트를 조립한다 [S20].
    - 관절축에 JSM-0810-10 베어링과 8mm 알루미늄 샤프트를 결합하여 회전 유격을 측정한다 [S16, S17].
    - Dyneema SK78 텐던을 링크에 연결하고, 반복 굽힘 시험을 통해 텐던 장력 유지력을 평가한다 [S15].
    - OpenCR 제어기를 사용하여 텐던에 인가되는 전류와 손끝 FSR 센서 신호의 상관관계를 분석한다 [S11, S12].
    safety:
    - 실험 중 절단이나 장력 시험 시 반드시 충격 방지 작업용 보안경을 착용한다.
    - 전원 인가 전, 반드시 3개 독립 전원 어댑터가 물리적으로 분리되어 있는지 확인한다.
    - 분기별 전원 회로에는 반드시 10A ATOF 퓨즈를 장착하여 과전류를 보호한다 [S10, S24].
    - 모든 정밀 측정은 무전원 상태에서 멀티미터를 DC 전압 모드로 설정하여 1V 미만임을 확인 후 진행한다.
    - 사람 접근 환경이 아닌 고정 지그에서 무부하 가동부터 단계적으로 시험한다.
    deliverables:
    - 최적화된 기구학적 설계 CAD 파일
    - 링크 강성 및 반복 조립 시험 결과 보고서
    - 텐던 장력에 따른 FSR 힘 피드백 응답 그래프
    - 전원 분기별 독립 전압 확인 결과 기록
  assignment:
    title: 5지 로봇손 설계 제안서 작성
    deliverables:
    - 최적화 IF 지표가 반영된 5지 로봇손 설계서
    - 사용 액추에이터 및 전원 부품의 BOM 및 사양 검토서
    - 독립 분기 전원 배선도
    - 텐던 동역학 모델 제어 전략 기술서
    rubric:
    - IF 지표를 설계에 반영하고 최적화 논리를 적절히 기술하였는가?
    - BOM에 명시된 부품의 전기적, 기구적 정격이 설계 사양과 일치하는가?
    - 독립 분기 전원 구성 및 과전류 보호(퓨즈) 설계가 안전 규정을 준수하는가?
    - 텐던 동역학 모델과 제어 전략이 대학원 수준의 이론적 근거를 갖추었는가?
  quiz:
  - question: 로봇손의 정밀 파지 능력을 정량화하기 위해 사용되는 성능 지표는 무엇인가?
    choices:
    - 강성 지수 (Stiffness Index)
    - 손가락 상호작용 (Interactivity of Fingers, IF)
    - 마찰 계수 (Friction Coefficient)
    - 텐던 신율 (Tendon Stretch)
    answer_index: 1
    explanation: IF 지표는 다지 정밀 파지 능력을 정량화하며, 기구학적 모델 최적화의 핵심 목적 함수로 활용된다 [S3].
  - question: Dyneema SK78 텐던이 정밀 제어에 적합한 주된 이유는 무엇인가?
    choices:
    - 높은 가격과 광택
    - 1% 미만의 낮은 작동 신율
    - 50% 이상의 높은 신율
    - 금속 텐던보다 무거운 무게
    answer_index: 1
    explanation: Dyneema SK78은 매우 높은 파단 하중과 함께 1% 미만의 낮은 작동 신율을 가져 장력 전달의 정확도가 높다
      [S15].
  - question: 이 프로젝트에서 3개의 12V 어댑터를 사용하는 올바른 전원 구성 방식은?
    choices:
    - 모든 출력의 양(+) 단자를 병렬로 연결하여 전류 용량을 합산한다.
    - 각 어댑터를 4대/4대/3대 액추에이터 분기에 독립적으로 사용하고 물리적으로 분리한다.
    - AC 단자를 직렬로 연결하여 전압을 높인다.
    - 어댑터 출력에 퓨즈를 설치하지 않아도 된다.
    answer_index: 1
    explanation: 독립 분기를 구성하고 양(+) 출력 병렬 연결은 절대 금지하며, 각 분기는 독립 퓨즈를 사용하여 과전류를 보호해야 한다
      [S14, B3, S24].
  completion_criteria:
  - IF 지표를 기반으로 한 로봇손 기구 설계서 작성 완료
  - BOM상 명시된 부품을 기반으로 한 재현성 있는 3D 조립도와 배선도 제출
  - 제시된 안전 가이드라인에 따라 무전원 상태에서 3개 분기 전압 확인 결과 기록
  - 실험 과정에서 보안경 착용 및 적절한 전류 제한 조치를 포함한 최종 보고서 제출
