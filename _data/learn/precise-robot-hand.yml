- id: M6
  slug: wiring-and-integration
  phase_id: PH2
  title: 배선 및 하드웨어 통합
  estimated_hours: 10.0
  prerequisites:
  - M4
  - M5
  objectives:
  - 5지 로봇손의 전원 분기 구조와 안전 회로를 이해하고 설계한다.
  - Micro-Fit 3.0 커넥터를 활용한 모듈형 배선 하네스를 제작한다.
  - 독립 전원 분기 및 DC 접촉기를 활용한 비상 차단 시스템을 구현한다.
  - ADC 분압 회로를 구성하여 손끝 힘 센서 신호를 처리한다.
  theory_markdown: '### 5지 로봇손 하드웨어 통합 원리


    로봇 하드웨어 통합의 핵심은 안정적인 전원 공급과 신호 전달, 그리고 포괄적인 안전 조치입니다. 본 시스템은 11개의 XM430-W350-T
    액추에이터를 3개의 독립된 12 V 전원 분기로 나누어 운용합니다 [B1, B3].


    #### 1. 독립 전원 분기 및 보호

    각 분기는 11.5 A 정격의 절연형 전원 어댑터로부터 전력을 공급받으며, 과전류 방지를 위해 10 A ATOF 퓨즈가 장착됩니다 [B3,
    B11, B-WIRING-FUSE-HOLDER]. 각 분기의 출력은 전기적으로 완전히 격리되며, 양(+) 출력의 결합은 전압 불균형 및 화재
    위험을 초래하므로 엄격히 금지됩니다 [B3]. 시스템의 비상 차단은 비상정지 버튼이 NC 회로를 통해 3개의 EV200 DC 접촉기 코일을
    동시에 해제함으로써 3개 분기 모두를 물리적으로 차단하는 방식으로 구현됩니다 [B10, B-SAFETY-CUTOFF].


    #### 2. 신호 처리 및 인터페이스

    손끝의 FSR 402 센서는 10 kΩ 저항과 함께 전압 분압 회로를 구성하여 OpenCR 제어 보드의 ADC 입력으로 힘 데이터를 전달합니다
    [B4, B-SENSOR-RESISTOR]. 하네스는 Micro-Fit 3.0 커넥터를 사용하여 진동 환경에서도 안정적인 연결과 탈착 편의성을
    제공합니다 [B5, S13].'
  worked_examples:
  - '예제 1: 분기당 액추에이터 부하 계산. 4대의 XM430-W350-T를 한 분기에 할당할 경우, 피크 스톨 전류 합계는 9.2 A입니다
    (2.3 A * 4) [B1]. 이는 10 A 퓨즈 정격 내에 있으며, 11.5 A 전원 어댑터 출력 허용 범위 내에 위치하여 안전합니다 [B3,
    B11].'
  - '예제 2: 전압 분압 센서 계산. FSR 402 센서와 10 kΩ 저항을 사용한 분압기에서, OpenCR의 12-bit ADC(0~4095)를
    통해 센서 저항 변화에 따른 전압을 디지털 값으로 변환하여 손끝 힘을 측정합니다 [B2, B4, B-SENSOR-RESISTOR].'
  lab:
    title: 로봇손 하네스 제작 및 비상 정지 회로 검증
    steps:
    - 각 액추에이터 분기별 배선 하네스를 제작하고 Micro-Fit 3.0 커넥터를 압착합니다 [B5, S13].
    - 각 12 V 어댑터 출력단에 인라인 퓨즈 홀더를 직렬로 연결합니다 [B3, B-WIRING-FUSE-HOLDER].
    - 비상정지 버튼과 EV200 DC 접촉기 코일을 NC 회로로 구성하여 연결합니다 [B10, B-SAFETY-CUTOFF].
    - 멀티미터를 사용하여 각 독립 분기 간의 절연 상태를 확인합니다.
    - 비상정지 버튼 동작 시 3개 DC 접촉기가 동시에 개방되는지 확인합니다.
    safety:
    - 벤치 전원 사용 시 전류 제한을 필수적으로 설정합니다.
    - 납땜 작업 시 보안경을 착용하고 환기 장치를 가동합니다.
    - 각 독립 분기의 양(+) 출력을 절대로 서로 연결하지 마십시오.
    - 구동부 조립 시 끼임 방지 조치를 취하십시오.
    deliverables:
    - 제작된 로봇손 배선 하네스 사진
    - 비상정지 회로 동작 검증 기록지
    - 멀티미터를 이용한 분기별 절연 저항 측정치
  assignment:
    title: 전원 시스템 및 센서 인터페이스 설계 문서화
    deliverables:
    - 3개 독립 전원 분기의 배선도 및 퓨즈 보호 설계도
    - 손끝 힘 센서와 ADC 입력을 연결하는 전압 분압 회로 도면
    - 시스템 전체 통합 배선도
    rubric:
    - 독립 전원 분기 구조의 타당성(결합 금지 확인)
    - 비상정지 회로의 안전 제어 로직 구현
    - 센서 분압 회로의 전기적 정격 부합 여부
    - 도면의 가독성 및 표준 준수
  quiz:
  - question: 각 전원 분기의 12 V 어댑터 출력(양(+) 단자)을 서로 결합하면 안 되는 이유는 무엇입니까?
    choices:
    - 신호 간섭이 발생하여 통신 속도가 저하되기 때문
    - 전압 불균형으로 인한 과전류 및 화재 위험 때문
    - 액추에이터의 텐던이 파손되기 때문
    - ADC 해상도가 12-bit로 제한되기 때문
    answer_index: 1
    explanation: 독립적인 전원 분기를 물리적으로 결합하면 전압 차에 의해 역전류가 발생하거나 과전류 상태가 되어 화재 위험이 발생합니다.
  - question: 본 프로젝트에서 XM430-W350-T 액추에이터의 스톨 전류 합계가 10 A 퓨즈 정격을 넘지 않도록 하기 위한 최대 액추에이터
      개수는?
    choices:
    - 2대
    - 3대
    - 4대
    - 6대
    answer_index: 2
    explanation: 스톨 전류가 2.3 A이므로, 4대 연결 시 9.2 A가 되어 10 A 퓨즈 정격 이내로 보호가 가능합니다.
  completion_criteria:
  - 모든 독립 배선 하네스 제작 완료 및 멀티미터 도통 시험 통과
  - 비상정지 버튼을 통한 EV200 DC 접촉기 3개 동시 차단 동작 확인
  - 센서 분압 회로를 통한 힘 감지 데이터 정상 취득
  source_ids:
  - S13
  - S24
- id: M7
  slug: firmware-control
  phase_id: PH3
  title: 펌웨어 개발 및 제어 알고리즘
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - DYNAMIXEL Protocol 2.0 기반의 액추에이터 통신 체계 이해
  - 실시간 제어 루프(Real-time Control Loop) 설계 및 펌웨어 최적화
  - 센서 피드백을 활용한 폐루프 제어(Closed-loop Control) 구현
  - 시스템 안전을 위한 상태기계(State Machine) 설계
  theory_markdown: '## 펌웨어 구조 및 실시간 제어

    로봇손의 펌웨어는 고성능 제어기인 OpenCR 1.0의 216MHz CPU를 활용하여 정밀한 제어 루프를 실행합니다 [S12]. DYNAMIXEL
    XM430-W350-T 액추에이터는 Protocol 2.0을 사용하여 위치, 속도, 전류 피드백을 실시간으로 제공하며, 제어 보드는 별도의
    브리지 없이 이를 직접 통신합니다 [S12].


    ### 제어 루프 설계

    안정적인 파지 성능을 위해서는 제어 주기가 일정해야 합니다. 펌웨어는 다음과 같은 순서로 실행됩니다:

    1. **데이터 취득:** 5개 FSR 센서로부터 12-bit ADC 값을 읽어 접촉력을 산출합니다.

    2. **상태 업데이트:** 액추에이터의 현재 위치와 부하 전류를 쿼리합니다.

    3. **제어 연산:** 위치 제어와 전류 제한을 조합한 알고리즘을 수행합니다 [S7].

    4. **명령 전송:** 계산된 목표값을 액추에이터에 동기화(Sync Write)하여 전송합니다.


    ### 상태기계(State Machine) 기반 안전 관리

    시스템은 비상정지 입력을 상시 모니터링합니다. 비상정지 버튼은 EV200 접촉기의 코일 제어 회로(NC)를 차단하여, 하드웨어적으로 3개의
    독립 액추에이터 분기를 즉시 비활성화합니다 [B10, B-SAFETY-CUTOFF].'
  worked_examples:
  - '예제 1: DYNAMIXEL 위치 제어 주기 산출. 11대의 액추에이터를 Protocol 2.0으로 50Hz 제어 루프 내에서 처리하기 위해,
    통신 속도를 2Mbps로 설정하여 각 패킷 전송 시간을 최소화합니다.'
  - '예제 2: FSR 센서 전압 분압 계산. 10 kΩ 저항을 사용하여 FSR 402와 분압 회로를 구성할 때, 센서 저항이 0.2N 접촉 시
    약 100 kΩ에서 20N 접촉 시 1 kΩ까지 변함에 따라 12-bit ADC 입력 범위를 최대로 활용하도록 오프셋을 설정합니다 [B4,
    B-SENSOR-RESISTOR].'
  lab:
    title: 펌웨어 통합 및 안전 동작 검증
    steps:
    - OpenCR 1.0 보드와 11대 액추에이터를 개별 퓨즈 분기에 연결합니다.
    - 비상정지 버튼의 NC 접점이 EV200 코일 회로에 올바르게 결선되었는지 멀티미터로 도통 시험을 수행합니다.
    - 단일 손가락 펌웨어를 업로드하여 통신 및 위치 제어 동작을 확인합니다.
    - 11대 액추에이터 전체를 대상으로 Sync Write 기능을 활성화합니다.
    - 비상정지 푸시버튼 조작 시 모든 전원 분기가 차단되는지 멀티미터로 확인합니다.
    safety:
    - 반드시 벤치 전원의 전류 제한을 설정 후 배선하십시오.
    - 배선 작업 시에는 전원을 차단하고, 최종 검증 시 보안경을 착용하십시오.
    - 비상정지 버튼 테스트는 액추에이터가 부착되지 않은 상태에서 1차 수행하십시오.
    deliverables:
    - 전체 펌웨어 코드 베이스
    - 비상정지 차단 시간 측정 기록
    - 실시간 제어 루프 주기 로그
  assignment:
    title: 제어 알고리즘 최적화 및 보고서
    deliverables:
    - 파지력 피드백을 포함한 제어 알고리즘 설계서
    - 펌웨어 소스 코드
    - 상태기계 다이어그램
    rubric:
    - Sync Write를 통한 동기화 제어 구현 여부
    - ADC 데이터를 활용한 FSR 보정 및 파지력 제어 알고리즘의 정확성
    - 비상정지 회로 및 안전 상태기계 로직의 무결성
  quiz:
  - question: 로봇손 펌웨어에서 사용되는 제어 통신 규격은 무엇입니까?
    choices:
    - DYNAMIXEL Protocol 1.0
    - DYNAMIXEL Protocol 2.0
    - Standard RS-232
    - EtherCAT
    answer_index: 1
    explanation: OpenCR 1.0과 XM430-W350-T 액추에이터 조합은 DYNAMIXEL Protocol 2.0을 통해 정밀한
      피드백을 제공합니다.
  - question: 시스템 안전을 위해 비상정지 버튼이 직접적으로 제어하는 장치는 무엇입니까?
    choices:
    - 모든 액추에이터의 전원(+) 회로
    - EV200 접촉기의 코일 제어 회로
    - OpenCR 보드의 메인 CPU 전원
    - FSR 센서의 신호선
    answer_index: 1
    explanation: 비상정지 버튼은 직접 모터 전류를 차단하지 않고, EV200 접촉기의 NC 코일 회로를 개방하여 안전하게 차단합니다.
  - question: ADC 해상도가 12-bit일 때 표현 가능한 값의 범위는 무엇입니까?
    choices:
    - 0 ~ 255
    - 0 ~ 1023
    - 0 ~ 4095
    - 0 ~ 65535
    answer_index: 2
    explanation: 12-bit 해상도는 2^12인 4096개의 단계를 가지며, 0부터 4095까지의 값을 표현합니다.
  completion_criteria:
  - 전체 11대 액추에이터의 실시간 위치 피드백 확인
  - FSR 센서를 이용한 접촉력 데이터 정상 수신
  - 비상정지 푸시버튼 동작 시 모든 전원 분기의 하드웨어 차단 검증 완료
  source_ids:
  - S12
  - S7
- id: M8
  slug: calibration-testing
  phase_id: PH3
  title: 교정 및 파지 성능 테스트
  estimated_hours: 15.0
  prerequisites:
  - M7
  objectives:
  - 5지 로봇손의 텐던 장력 및 관절 가동 범위 교정법을 이해한다.
  - 손끝 힘 센서(FSR)를 활용한 폐루프 파지력 피드백 구현 원리를 학습한다.
  - 정적인 파지 시험 및 동적인 내구 시험을 통해 하드웨어 신뢰성을 검증한다.
  theory_markdown: '## 교정 및 성능 검증 이론


    ### 텐던 구동 시스템의 교정

    텐던 구동 로봇손은 모터의 회전 각도와 텐던의 실제 인장 길이 간의 상관관계를 정확히 매핑해야 한다. 텐던은 반복된 사용으로 인해 신율(stretch)이
    발생할 수 있으며, 이는 정밀도 저하의 주원인이 된다 [S8]. 초기 교정 시 각 액추에이터의 위치 영점(Zeroing)을 설정하고, 텐던이
    이완되지 않도록 최소 장력(Pre-tension)을 확보하는 과정이 필수적이다. 특히 Dyneema SK78과 같은 소재는 신율이 1% 미만으로
    작지만, 캡스턴 직경과 경로의 마찰을 고려한 보정이 필요하다 [B6].


    ### 파지력 피드백 (FSR 활용)

    FSR(Force Sensitive Resistor)은 물리적 압력에 비례하여 저항이 감소하는 특성을 가진다 [B4]. OpenCR 보드의
    12비트 ADC를 사용하여 이를 전압 신호로 변환한다 [B2]. 이때 10 kΩ 분압 저항을 사용하여 센서 저항 변화에 따른 출력 전압 범위를
    ADC 입력값 범위 내로 제한한다 [B-SENSOR-RESISTOR]. 파지 시 로봇손은 센서의 입력값을 임계치(Threshold)와 비교하여,
    대상 물체의 변형을 막으면서 안정적인 접촉력을 유지하는 폐루프 제어를 수행한다.


    ### 시스템 안전성 및 검증

    로봇손 검증은 기능적 동작 시험과 비상 상황 대응 시험으로 나뉜다. 액추에이터의 피크 전류 합계(25.3 A)를 고려하여 독립적으로 구성된
    3개 전원 분기의 퓨즈 및 차단기가 의도대로 동작하는지 확인해야 한다 [B3, B-SAFETY-CUTOFF, B11]. 비상정지(EMO) 버튼
    조작 시 3개 독립 분기의 접촉기가 즉시 NC 회로를 통해 차단되는지 멀티미터로 연속성을 확인한다 [B10, B-SAFETY-CUTOFF].'
  worked_examples:
  - '예제 1: 텐던 팽팽함 보정. 모터가 관절을 완전히 굽혔음에도 손가락이 헐거우면, 텐던 고정 나사를 풀어 장력을 조정하고 다시 팽팽하게 묶은
    후 모터 각도 Offset을 0으로 재설정한다.'
  - '예제 2: ADC 값 변환. 12 V 입력 전원 하에서 FSR이 가벼운 터치로 10 kΩ이 되고 분압 저항도 10 kΩ이면, 분압기 중앙
    노드의 전압은 절반이 된다. OpenCR ADC 출력은 약 2048(12비트 범위의 중간값)이 되어야 하며, 이를 통해 센서 입력을 물리적인
    힘(N)으로 매핑한다.'
  lab:
    title: 관절 영점 교정 및 힘 센서 테스트
    steps:
    - 각 11개 액추에이터의 통신 주소를 확인하고, 위치 모드에서 관절의 최대/최소 가동 범위를 물리적 하드웨어 제한(기구적 스토퍼) 내에서
      기록한다.
    - 모든 손가락을 완전히 펼친 상태를 영점으로 설정하여 제어기에 저장한다.
    - FSR 센서 5개를 손끝에 배치하고 10 kΩ 저항을 사용하여 분압 회로를 구성한다.
    - 비상정지 회로를 가동하고 멀티미터로 3개 액추에이터 분기의 전원 경로가 정상 통전되는지 확인한다.
    - 손끝을 가볍게 눌러 시리얼 모니터에서 ADC값이 변하는지 확인하여 힘 피드백 경로를 검증한다.
    safety:
    - 벤치 전원 사용 시 전류 제한을 액추에이터 사양에 맞게 설정한다.
    - 구동부 작동 중 손가락 끼임 사고에 주의하며, 항상 EMO 버튼 위치를 파악한다.
    - 납땜 작업 시 보안경을 착용하고 환기를 확보한다.
    - 전원 공급 전 배선도와 실제 연결 상태를 2회 이상 멀티미터로 점검한다.
    deliverables:
    - 각 액추에이터의 교정된 영점 오프셋 테이블
    - 힘 센서 압력-ADC 데이터 기록 파일
    - 비상 차단 시험 결과 보고서
  assignment:
    title: 로봇손 파지 성능 검증 보고서
    deliverables:
    - 파지 시험 결과 데이터
    - 내구 시험(반복 동작) 보고서
    - 최종 성능 검증 보고서
    rubric:
    - 텐던 장력 및 관절 교정의 정확성 평가
    - FSR 힘 피드백을 이용한 파지력 제어 알고리즘의 안정성
    - 안전 차단 시스템(EMO, 퓨즈)의 정상 동작 여부 검증
  quiz:
  - question: Dyneema SK78 텐던의 특징으로 옳은 것은?
    choices:
    - 신율이 매우 크다
    - 신율이 1% 미만으로 작다
    - 금속보다 무겁다
    - 신율이 높아야 정밀도가 높다
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 작아 로봇 텐던 구동에 적합한 소재이다.
  - question: FSR을 위한 전압 분압 회로에 대한 설명으로 옳은 것은?
    choices:
    - 10 kΩ 분압 저항을 사용한다
    - 저항이 없어도 ADC를 쓸 수 있다
    - ADC 해상도는 중요하지 않다
    - 직렬로 저항을 2개 연결한다
    answer_index: 0
    explanation: 센서 저항 변화를 전압 신호로 변환하기 위해 10 kΩ 분압 저항을 사용한다.
  - question: 액추에이터 전원 분기 구성 시 금지된 사항은?
    choices:
    - 분기별 독립 퓨즈 사용
    - NC 접촉기 사용
    - 양(+) 출력 병렬 연결
    - 개별 전원 어댑터 사용
    answer_index: 2
    explanation: 각 어댑터 출력은 독립적으로 유지되어야 하며 양(+) 출력 병렬 연결은 절대 금지된다.
  completion_criteria:
  - 모든 11개 액추에이터의 위치 교정이 완료되어야 함
  - 5개 힘 센서의 ADC 피드백 데이터가 정상적으로 수집되어야 함
  - 비상정지 버튼을 눌러 3개 독립 분기가 즉시 차단됨을 멀티미터로 확인해야 함
  source_ids:
  - S8
  - S9
