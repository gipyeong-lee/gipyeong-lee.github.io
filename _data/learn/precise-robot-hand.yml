- id: m6
  slug: transmission-tendons
  phase_id: phase2
  title: 구동 및 텐던 시스템 구축
  estimated_hours: 10.0
  prerequisites:
  - m5
  objectives:
  - 로봇손의 구동을 위한 텐던(Tendon) 시스템의 역학적 원리를 이해한다.
  - Dyneema SK78 고강도 섬유의 물리적 특성과 파단 하중, 신율을 고려한 텐던 선정 기준을 학습한다.
  - 텐던 구동 메커니즘에서 발생하는 마찰과 텐션 전달 효율을 최적화하는 설계 기법을 습득한다.
  - 스마트 액추에이터(XM430-W350-T)를 활용한 정밀 장력 제어 및 텐던 장착 방법을 익힌다.
  theory_markdown: '## 텐던 기반 로봇손 구동 원리


    텐던 구동 시스템은 원격 구동(Remote Actuation)을 통해 손가락의 질량과 관성을 최소화하여 민첩한 움직임을 구현하는 기술입니다
    [S13]. 액추에이터에서 생성된 토크는 텐던을 통해 관절로 전달되며, 이는 인간의 근육-힘줄 구조와 유사한 기구학적 특성을 가집니다.


    ### 텐던 재료와 물리적 요구사항

    텐던은 지속적인 인장 하중, 반복적인 굽힘, 그리고 캡스턴(Capstan) 위에서의 마찰을 견뎌야 합니다. 고강도 폴리에틸렌인 Dyneema
    SK78은 매우 낮은 작동 신율(<1%)과 높은 파단 하중(230 daN)을 제공하여 정밀한 제어 성능을 보장합니다 [S18]. 특히 1.5
    mm 지름의 사양은 소형 로봇 관절 내 마찰을 최소화하면서도 충분한 기계적 강도를 제공합니다 [S18].


    ### 기구학적 고려사항

    1. **마찰 제어**: 텐던이 경로를 따라 굽혀질 때 발생하는 마찰은 구동 효율을 저하시킵니다. 이를 방지하기 위해 경로상의 모서리는 모두
    라운딩 처리되어야 합니다 [S18].

    2. **신율 관리**: 작동 중 텐던이 늘어나면 관절의 위치 오차가 발생합니다. SK78과 같은 저신율 재료 사용과 함께, 시스템 구축 시
    초기 장력을 확보하는 장치(Tensioner) 설계가 중요합니다.

    3. **캡스턴 직경**: 텐던이 감기는 캡스턴의 지름은 액추에이터의 토크 출력과 선속도 간의 변속비를 결정합니다. [S13] 참조 시, 반복적인
    굽힘 시험은 내구성을 확인하는 필수 과정입니다 [S18].'
  worked_examples:
  - '예제 1: 텐던의 필요 강도 산출. XM430-W350-T 액추에이터의 스톨 토크가 4.1 N·m입니다 [bom]. 캡스턴 반경이 0.01
    m일 때, 텐던에 가해지는 최대 인장력(T)은 T = 토크 / 반경 = 4.1 / 0.01 = 410 N입니다. 파단 하중 230 daN(약
    2300 N)을 가진 SK78 텐던 [S18]은 410 N 대비 안전율이 약 5.6으로 충분한 내구성을 확보합니다.'
  - '예제 2: 텐던 굽힘 시 유효 마찰 추정. 텐던이 90도 굽힘 구간을 통과할 때, 굽힘 반경이 작을수록 마찰 손실이 급격히 증가합니다. 설계를
    위해 굽힘 반경을 텐던 지름(1.5 mm)의 최소 10배 이상(15 mm)으로 유지하도록 CAD를 수정하여 마찰력을 최소화합니다 [S18].'
  lab:
    title: 텐던 장착 및 액추에이터 구동 테스트
    steps:
    - FDM 출력된 손가락 링크와 관절부에 슬리브 베어링(JSM-0810-10)을 삽입합니다 [bom].
    - Dyneema SK78 텐던을 캡스턴 모서리 라운딩 확인 후 장착합니다 [S18].
    - 액추에이터(XM430-W350-T)에 텐던을 감고 초기 텐션을 조절합니다 [bom].
    - 벤치 전원을 통해 12 V 전원 분기를 독립적으로 연결하고 전류 제한을 설정합니다 [bom].
    - 제어 코드를 실행하여 텐던이 꼬이거나 이탈하지 않는지 확인하며 가동 범위를 시험합니다.
    safety:
    - 작업 시 보안경을 반드시 착용하십시오.
    - 액추에이터 전원 분기마다 10 A 퓨즈가 장착되었는지 반드시 확인하십시오 [bom].
    - 텐던 테스트 중 손가락 끼임 방지를 위해 비상 전원 차단 장치 근처에서 작업하십시오.
    - 절대 두 개 이상의 어댑터 출력(+) 단자를 병렬로 연결하지 마십시오 [bom].
    deliverables:
    - 텐던 구동 메커니즘 CAD 최적화 보고서
    - 텐던 장착 과정 사진 및 텐션 교정 기록
    - 제어기를 통한 위치 피드백 데이터 로그
  assignment:
    title: 텐던 시스템 설계 분석 및 검증
    deliverables:
    - 최적화된 텐던 경로 CAD 도면
    - 텐던 안전율 계산 및 근거 서류
    - 실제 구동 시 관절 위치 정밀도 측정 데이터
    rubric:
    - 텐던 경로의 굽힘 반경이 권장치(지름의 10배 이상)를 충족하는가?
    - Dyneema SK78을 선정하고 하중 계산을 명확히 수행하였는가?
    - 전원 배선이 3개 독립 분기로 안전하게 분리 및 퓨즈 보호되었는가?
  quiz:
  - question: Dyneema SK78 텐던의 작동 신율이 로봇손 제어에 중요한 이유는 무엇입니까?
    choices:
    - 신율이 낮을수록 텐던이 더 유연하게 움직이기 때문입니다.
    - 작동 신율이 낮을수록 관절의 정밀한 위치 제어가 가능하기 때문입니다.
    - 신율이 높아야 액추에이터의 부하를 줄일 수 있기 때문입니다.
    - 신율과 제어 정밀도는 아무런 관련이 없습니다.
    answer_index: 1
    explanation: 작동 신율이 높으면 액추에이터가 회전하더라도 관절에 힘이 전달되기 전 텐던이 늘어나 위치 오차를 발생시킵니다. 따라서
      저신율 재료를 사용해야 정밀 제어가 가능합니다 [S18].
  - question: 텐던 시스템 설계 시 캡스턴 모서리를 라운딩 처리해야 하는 이유는 무엇입니까?
    choices:
    - 텐던의 지름을 줄이기 위해서입니다.
    - 캡스턴의 질량을 줄이기 위해서입니다.
    - 텐던의 마찰 마모를 방지하고 효율을 유지하기 위해서입니다.
    - 액추에이터의 전력을 줄이기 위해서입니다.
    answer_index: 2
    explanation: 텐던이 모서리에 닿을 때 마찰력이 커지며 이는 마모를 촉진하고 에너지 전달 효율을 떨어뜨립니다. 따라서 둥근 라운딩
      처리가 필수입니다 [S18].
  - question: XM430-W350-T 액추에이터를 구동하기 위한 전원 구성의 원칙으로 옳은 것은?
    choices:
    - 12 V 액추에이터 전원은 3개 독립 분기로 나누어 공급한다.
    - 전력을 더 확보하기 위해 모든 12 V 양(+) 출력 단자를 하나로 병렬 연결한다.
    - 액추에이터 전원 분기에 퓨즈는 장착하지 않아도 된다.
    - 센서 분압 회로를 12 V 액추에이터 전원에 연결한다.
    answer_index: 0
    explanation: 독립 전원 분기를 사용하고 병렬 연결은 금지되며, 각 분기마다 퓨즈를 통해 과전류를 방지해야 합니다 [bom].
  completion_criteria:
  - 텐던 구동 메커니즘의 마찰 손실을 최소화한 설계안 제출
  - Dyneema SK78 텐던이 안전 하중 범위 내에 있음을 계산으로 증명
  - XM430 액추에이터 구동 시 독립 분기 전원 시스템의 정전류 보호 기능 확인
  source_ids:
  - S13
  - S18
- id: m7
  slug: actuator-control
  phase_id: phase3
  title: 액추에이터 제어
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - DYNAMIXEL 통신 프로토콜 2.0의 구조와 데이터 패킷 처리 이해
  - 위치, 속도, 전류 제어 루프의 동작 원리 파악
  - OpenCR 제어기를 이용한 안전한 액추에이터 제어 시스템 구성
  - 힘 센서 신호를 ADC로 처리하여 폐루프 피드백 제어 구현
  theory_markdown: '### 액추에이터 제어 기초


    DYNAMIXEL XM430-W350-T는 내장된 PID 제어기를 통해 위치, 속도, 전류를 정밀하게 제어한다 [S14]. 통신은 Protocol
    2.0을 사용하며, ID 기반 패킷 통신으로 데이지 체인 연결을 지원한다 [S5].


    #### 제어 루프

    - **위치 제어:** 목표 위치까지의 오차를 PID 알고리즘으로 보상하여 구동한다.

    - **전류 제어:** 관절에 가해지는 토크를 전류를 통해 직접 제어하여 파지력을 조절한다.


    #### 데이터 처리 및 안전

    OpenCR 보드는 216MHz 클럭으로 동작하며 [S16], 12bit ADC를 통해 FSR 센서의 0~3.3V 신호를 변환한다. 모든 센서
    회로는 3.3V 센서 전원 레일에서 분리되어 공급받아야 하며, 12V 액추에이터 전원과 전기적으로 분리(Isolation) 상태를 유지하여
    노이즈를 방지한다.


    #### 전원 및 비상 차단 시스템

    시스템은 3개의 독립적인 12V 전원 분기를 사용한다 [S17]. 각 분기는 10A 퓨즈 [S28]와 EV200 접촉기를 직렬 배치한다 [S26].
    비상 정지 버튼 [S25]은 접촉기의 NC 코일 회로를 개방하여 모든 전원을 즉시 차단하는 안전 설계 방식을 따른다.'
  worked_examples:
  - '목표 위치 설정: XM430 제어를 위해 Packet 구조(Header, ID, Length, Instruction, Parameters,
    Checksum)를 생성한다. 예: `ID 1`에게 `Goal Position` 2048을 전송하는 패킷을 작성한다.'
  - 'ADC 변환 예시: FSR 센서가 분압기 회로를 통해 1.5V를 출력할 때, 12bit ADC(최대 3.3V) 값은 `(1.5 / 3.3)
    * 4095 = 1861`로 계산된다.'
  lab:
    title: 액추에이터 제어 및 힘 피드백 통합 실습
