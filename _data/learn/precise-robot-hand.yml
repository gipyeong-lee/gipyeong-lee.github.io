- id: M3
  slug: frame-printing
  phase_id: PH2
  title: 구조물 출력 및 가공
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - FDM 3D 프린팅의 기술적 특성과 PC-CF 필라멘트의 물성을 이해한다.
  - 정밀 기구 조립을 위한 황동 열압입 인서트 설치 기법을 습득한다.
  - 슬리브 베어링과 정밀 샤프트 간의 공차 및 결합 원리를 학습한다.
  - 구조적 강성을 확보하기 위한 적층 방향 및 내부 채움 전략을 설계한다.
  theory_markdown: '### FDM 기반 로봇 구조물 제작


    로봇손의 프레임과 링크는 높은 강성과 치수 안정성이 요구됩니다. 본 프로젝트에서는 탄소섬유가 함유된 PC(Polycarbonate) 필라멘트인
    `Prusament PC Blend Carbon Fiber`를 사용합니다 [S18]. 탄소섬유 강화재는 순수 PC 대비 강도와 강성을 향상시키며,
    열 변형 저항력이 뛰어나 정밀한 구동 기구에 적합합니다 [S18].


    #### 핵심 제작 요소

    1. **하드웨어 인터페이스**: FDM 출력물의 경우 나사 체결부의 반복 조립 강도가 낮습니다. 이를 보완하기 위해 M3 규격의 황동 열압입
    인서트(`HTBI-M3-BR`)를 사용합니다 [S20]. 이는 출력물 내부의 4.0 mm 파일럿 홀에 열을 가해 삽입하여 M3 암나사를 형성함으로써
    나사산 탈락을 방지합니다 [S19, S20].

    2. **회전축 정밀도**: 고하중이 가해지는 손목 및 관절부에는 igus 사의 `JSM-0810-10` 폴리머 슬리브 베어링을 적용합니다
    [S16]. 이 베어링은 8 mm 정밀 알루미늄 샤프트(`AWMP-08`)와 결합하여 낮은 마찰 계수를 유지하며, 무급유 방식으로 동작하여
    로봇 구동부의 오염을 최소화합니다 [S16, S17].

    3. **출력 환경**: PC-CF는 마모성이 강해 경화강(Hardened Steel) 노즐이 필수적이며, 출력 안정성을 위해 베드 온도를
    110 °C로 유지해야 합니다 [S18].'
  worked_examples:
  - '예제 1: 인서트 홀 치수 계산 - 사용하려는 인서트의 외경이 4.4 mm인 경우 [S20], 제조사가 권장하는 4.0 mm 파일럿 홀을
    CAD 설계에 반영하여 삽입 후 출력물의 팽창으로 인한 파손을 방지합니다.'
  - '예제 2: 축-베어링 공차 설정 - 8 mm 샤프트를 위한 베어링 하우징 보어는 베어링의 외경(10 mm)과 압입 시 발생하는 변형을 고려하여
    최적의 압입 공차를 갖도록 설계합니다 [S16].'
  lab:
    title: 로봇손 프레임 제작 및 베어링-인서트 실습
    steps:
    - 제공된 CAD 도면을 바탕으로 PC-CF 필라멘트를 사용하여 구조물을 출력합니다 (노즐 온도 285 °C, 베드 온도 110 °C) [S18].
    - 출력물에 설계된 파일럿 홀(4.0 mm)의 치수를 캘리퍼스로 확인합니다 [S20].
    - 열압입 인서트를 홀 중앙에 위치시킨 후 인두기를 사용하여 황동 인서트가 출력물 표면과 일치할 때까지 열을 가해 삽입합니다.
    - 삽입된 인서트가 완전히 냉각된 후, M3 캡스크루를 사용하여 조립 시험을 수행합니다 [S19].
    - 슬리브 베어링을 관절 하우징에 압입하고, 8 mm 샤프트를 삽입하여 회전 유격이 없는지 확인합니다 [S16, S17].
    safety:
    - 경화강 노즐로 교체 시 노즐 온도가 높으므로 반드시 화상 방지 장갑을 착용합니다.
    - 열압입 작업 시 발생하는 흄을 흡입하지 않도록 환기 장치를 가동합니다.
    - 베드 온도가 110 °C로 매우 높으므로 인쇄 직후 베드를 직접 만지지 않도록 주의합니다 [S18].
    - 보안경을 필수로 착용하여 제작 과정 중 발생할 수 있는 파편으로부터 눈을 보호합니다.
    deliverables:
    - 최종 출력된 손가락 링크 및 손바닥 프레임
    - 열압입 인서트 삽입 및 캡스크루 조립 시험 기록
    - 베어링-샤프트 유격 측정 데이터
  assignment:
    title: 제작 결과물 검증 및 프레임 설계 보고서
    deliverables:
    - 설계한 CAD 파일(프레임 및 링크)
    - 제작된 로봇 구조물의 사진 및 주요 치수 실측 보고서
    - 인서트 삽입 시 문제점과 해결 방안을 포함한 제작 일지
    rubric:
    - 도면 치수와 출력물의 치수 편차가 0.2 mm 이내인가?
    - 열압입 인서트가 수직으로 삽입되어 나사 체결이 원활한가?
    - 슬리브 베어링과 샤프트의 결합이 부드럽게 동작하며 유격이 최소화되었는가?
  quiz:
  - question: PC-CF 필라멘트 출력 시 경화강 노즐을 사용하는 주된 이유는 무엇인가?
    choices:
    - 탄소섬유의 마모성으로 인해 일반 황동 노즐이 손상되기 때문이다
    - 출력물의 열 전도율을 높이기 위해
    - 노즐 온도를 300 °C 이상으로 올리기 위해
    - 필라멘트의 색상을 선명하게 하기 위해
    answer_index: 0
    explanation: 탄소섬유는 연마성이 강하여 일반적인 황동 노즐을 빠르게 마모시키므로 반드시 경화강 노즐을 사용해야 합니다 [S18].
  - question: 황동 열압입 인서트 설치 시 가장 중요한 고려 사항은?
    choices:
    - 인서트를 망치로 두들겨 박아야 한다
    - 권장 홀 지름을 준수하여 삽입 후 출력물 파손을 방지한다
    - 접착제를 사용하여 고정한다
    - 인서트를 200 °C 이상 가열하여 삽입한다
    answer_index: 1
    explanation: 권장 홀 지름을 지키지 않으면 삽입 과정에서 출력물이 팽창하거나 파손될 위험이 있습니다 [S20].
  completion_criteria:
  - 출력물 치수 오차가 설계 대비 0.2 mm 미만일 것.
  - 모든 열압입 인서트가 수직으로 정확히 안착되었을 것.
  - 모든 관절축의 베어링과 샤프트가 무급유 상태에서 부드럽게 회전할 것.
  source_ids:
  - S18
  - S20
  - S19
  - S16
  - S17
- id: M4
  slug: transmission-assembly
  phase_id: PH2
  title: 구동부 및 텐던 조립
  estimated_hours: 12.0
  prerequisites:
  - M3
  objectives:
  - Dyneema SK78 고강도 섬유 텐던의 물리적 특성과 정밀 로봇손 구동 메커니즘을 이해한다.
  - 무급유 폴리머 슬리브 베어링(JSM-0810-10)의 올바른 조립 공차와 샤프트 장착 방법을 익힌다.
  - 구동기-텐던-관절 간 장력 전달 경로를 설계하고 조립하여 정밀한 위치 제어 기초를 마련한다.
  - 로봇손의 구동부 분해 및 조립 재현성을 보장하는 열압입 인서트 설치 기술을 습득한다.
  theory_markdown: '### 텐던 구동 로봇손의 기구학 기초

    5지 로봇손은 DYNAMIXEL 스마트 액추에이터(XM430-W350-T)의 회전 토크를 고강도 섬유 텐던(Dyneema SK78)을 통해
    각 관절로 전달합니다 [S10, S15]. Dyneema SK78은 1.50 mm 지름에서 230 daN의 높은 파단 하중을 가지며, 작동
    신율이 1% 미만으로 정밀한 위치 제어에 적합합니다 [S15].


    ### 기계 요소 조립 및 정밀도 관리

    구동축의 마찰과 유격을 최소화하기 위해 igus JSM-0810-10 무급유 폴리머 슬리브 베어링을 사용합니다 [S16]. 이 베어링은 8
    mm 알루미늄 샤프트(AWMP-08)와 결합되며, 베어링의 외경은 10 mm로 설계되어 하우징 보어에 적절한 간섭 피팅(press-fit)이
    필요합니다 [S16, S17]. 반복적인 분해와 조립이 요구되는 구조물에는 M3 황동 열압입 인서트(HTBI-M3-BR)를 사용하며, 4.0
    mm 파일럿 홀에 열을 가해 설치하여 PC-CF 소재 출력물의 나사산 내구성을 확보합니다 [S18, S20].'
  worked_examples:
  - '예제 1: 텐던 장력 전달 경로 설계. 액추에이터의 캡스턴(회전체)에서 텐던이 이탈하지 않도록 라운딩 처리된 가이드 경로를 설계하십시오.
    SK78 텐던은 파단 하중 230 daN이므로, 구조 설계 시 고정 지점에서 텐던이 꺾이는 반경을 최소 5 mm 이상 확보하여 응력 집중을
    방지합니다 [S15].'
  - '예제 2: 열압입 인서트 설치 계산. PC-CF 출력물의 파일럿 홀이 4.0 mm일 때 [S20], 인서트 외경이 4.4 mm라면, 설치
    전 홀 주변부 온도를 인서트 융점 부근으로 제어하여 인서트 외경의 널링(knurling)이 소재와 완전히 맞물리도록 하십시오 [S18, S20].'
  lab:
    title: 구동부 및 텐던 조립 실습
    steps:
    - PC-CF 출력물에 지정된 위치의 4.0 mm 파일럿 홀을 확인합니다 [S18, S20].
    - 열압입 인서트 설치 도구를 사용하여 HTBI-M3-BR 인서트를 홀에 수직으로 압입합니다 [S20].
    - JSM-0810-10 베어링을 관절 하우징에 장착하고, 8 mm 알루미늄 샤프트를 삽입하여 유격 여부를 확인합니다 [S16, S17].
    - Dyneema SK78 텐던을 액추에이터 캡스턴에 고정하고 관절까지의 경로를 따라 장착합니다 [S15].
    - 손끝 센서(FSR 402)를 패드 아래에 배치하고 10 kΩ 분압 저항과 연결하여 회로를 구성합니다 [S11, S25].
    safety:
    - 실습 중 전원 차단 상태를 반드시 확인합니다. 3개의 독립 절연 전원 어댑터를 물리적으로 분리한 후 멀티미터의 DC 전압 측정 모드로 각
      분기의 전압이 1 V 미만임을 확인하고 조립을 시작합니다 [S14].
    - 인서트 열압입 시 고온의 인두를 사용하므로 화상 방지를 위해 작업용 장갑을 착용합니다.
    - 텐던 장력 시험 중에는 반드시 충격 방지 작업용 보안경을 착용합니다.
    - 전원 인가 시험 전, 로봇손을 반드시 고정 지그에 장착하여 무부하 상태에서 작동 여부를 검증합니다.
    deliverables:
    - 조립된 로봇손 구동부 하드웨어
    - 텐던 장력 시험 결과 기록
    - FSR 센서 ADC 출력값 검증 데이터
  assignment:
    title: 5지 로봇손 구동 하드웨어 완성 및 검증
    deliverables:
    - 구동 메커니즘 조립 보고서
    - Dyneema 텐던 교체 및 장력 재현성 시험 결과
    - 관절별 자유도 및 유격 측정 기록
    rubric:
    - 열압입 인서트가 이탈 없이 견고하게 고정되었는가?
    - 베어링과 샤프트의 유격이 설계 범위를 만족하는가?
    - 텐던 구동 경로에서 비정상적인 마찰이 발생하지 않는가?
  quiz:
  - question: Dyneema SK78 텐던의 주요 특징으로 옳은 것은?
    choices:
    - 신율이 10% 이상으로 매우 유연하다.
    - 작동 신율이 1% 미만으로 정밀 제어에 적합하다.
    - 금속 와이어보다 강도가 낮아 정밀 로봇손에 부적합하다.
    - 수분 흡수율이 높아 장기 실외 사용에 최적화되어 있다.
    answer_index: 1
    explanation: Dyneema SK78은 1% 미만의 작동 신율을 가져 위치 정밀도가 중요한 로봇손 텐던으로 적합합니다 [S15].
  - question: 열압입 인서트(HTBI-M3-BR) 사용 목적은?
    choices:
    - 구조물의 전체 무게를 줄이기 위해.
    - PC-CF 출력물에 반복 조립이 가능한 나사산을 형성하기 위해.
    - 절연 성능을 향상시키기 위해.
    - 나사 체결 토크를 강제로 낮추기 위해.
    answer_index: 1
    explanation: 열압입 인서트는 PC-CF 같은 엔지니어링 플라스틱 소재에 견고한 금속 나사산을 제공하여 반복적인 분해 조립 시 재현성을
      높입니다 [S18, S20].
  - question: 실습 중 무전원 상태를 검증하는 가장 안전한 방법은?
    choices:
    - 전원 케이블이 연결되어 있는지 육안으로 확인한다.
    - 퓨즈를 제거하면 무전원 상태임이 확실하다.
    - 독립 전원 어댑터를 분리하고 멀티미터의 DC 전압 모드로 각 분기가 1 V 미만임을 확인한다.
    - 회로의 저항값을 측정하여 전원이 꺼졌는지 확인한다.
    answer_index: 2
    explanation: 반드시 물리적 분리 후 DC 전압 모드로 무전원 상태(1 V 미만)를 계측해야 합니다. 저항이나 도통 모드는 전원이
      연결된 상태에서 사용하면 안 됩니다.
  completion_criteria:
