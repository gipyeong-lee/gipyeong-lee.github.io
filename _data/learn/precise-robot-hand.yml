- id: M3
  slug: structure-fabrication
  phase_id: PH2
  title: 구조물 제작 및 조립
  estimated_hours: 15.0
  prerequisites:
  - M2
  objectives:
  - FDM 3D 프린팅의 기술적 특성과 PC-CF 소재 물성을 이해한다.
  - 열압입 인서트(Heat-fix insert)의 원리와 정확한 설치 기법을 습득한다.
  - 로봇 구조물의 치수 정밀도를 유지하기 위한 하드웨어 조립 프로세스를 설계한다.
  theory_markdown: '### 구조물 제작과 치수 안정성

    로봇손의 구조는 동적인 힘을 전달하므로 반복적인 부하와 환경 변화에 대응하는 강성이 필수적입니다. 본 프로젝트에서는 Prusament PC
    Blend Carbon Fiber(PC-CF)를 사용하여 [S18], 고온에서의 변형이 적고 높은 인장 강도를 확보합니다. PC-CF는 일반
    PC 소재보다 치수 안정성이 우수하지만 [S18], 출력 조건(노즐 온도 285°C, 베드 온도 110°C)을 엄격히 준수해야 합니다 [S18].


    ### 열압입 나사산 기술

    반복적인 분해와 재조립이 필요한 로봇손 모듈에서 플라스틱에 직접 나사를 체결하는 것은 나사산 뭉개짐(Stripping) 문제를 야기합니다.
    이를 방지하기 위해 M3 황동 열압입 인서트(OD 4.4 mm)를 [B9, S20] 전용 파일럿 홀(4.0 mm)에 매립합니다 [S20].
    설치 시 인서트가 플라스틱 내부에서 수직을 유지하도록 정밀하게 가압하는 것이 핵심입니다.


    ### 조립 정밀도 유지

    조립의 정밀도는 베어링과 샤프트의 공차 관리에서 나옵니다. igus JSM-0810-10 베어링과 8 mm 샤프트를 [B8, B-SHAFT]
    결합할 때, 샤프트 표면 상태와 베어링 하우징의 보어(Bore) 정밀도가 구동 부하를 결정합니다. 체결용 M3×10 캡스크루는 규격(JIS
    B 1176) [S19]을 준수하여 조립 공구를 고정하고, 구조적 견고함을 확보합니다.'
  worked_examples:
  - '인서트 삽입 깊이 계산: 인서트 길이 5.8 mm [S20]를 고려하여 링크 출력물 내부 인서트 홀 깊이를 6.0 mm 이상으로 모델링하여
    하부 간섭을 예방한다.'
  - '나사 조립 토크 관리: M3 캡스크루 [B-FASTENER] 사용 시 과도한 토크는 인서트의 이탈을 유발하므로, 인서트 안착 후 나사산이
    완전히 맞물리는 지점에서 1/8 회전만큼만 추가 조여 견고함을 유지한다.'
  lab:
    title: 구조 모듈 정밀 조립 실습
    steps:
    - FDM 출력물의 서포트 잔여물을 제거하고 파일럿 홀이 4.0 mm 인지 검증한다.
    - 인서트 매립 도구에 인서트를 고정하고 적정 온도로 가열하여 수직으로 압입한다.
    - 베어링 하우징에 JSM-0810-10 베어링을 삽입하고 유격 여부를 확인한다.
    - 8 mm 알루미늄 샤프트를 적정 길이로 절단하고 끝단 모따기를 수행한다.
    - 구성된 모듈을 M3 캡스크루로 체결하고 관절의 자유로운 회전 범위를 검증한다.
    safety:
    - 가열된 인서트 압입 도구 취급 시 화상 방지용 보호장갑 착용.
    - 샤프트 절단 시 금속 가루 비산 방지를 위한 보안경 필참.
    - 전원 공급 전 배선 상태를 멀티미터로 확인하여 쇼트 여부 검증.
    deliverables:
    - 인서트 삽입 상태 검사 기록표
    - 베어링-샤프트 회전 토크 측정치
    - 완성된 로봇손 링크 모듈
  assignment:
    title: 로봇손 링크 하드웨어 설계 보고서
    deliverables:
    - 조립 공차 분석 보고서(샤프트/베어링 간극 수치 포함)
    - 열압입 인서트 정렬 상태 유지 전략서
    rubric:
    - 기술 문서 내 하드웨어 규격(BOM 기준) 명시 여부
    - 조립 과정 중 발생 가능한 오차 관리 전략의 논리성
    - 안전 수칙 준수 및 기록의 상세함
  quiz:
  - question: PC-CF 소재를 FDM으로 출력할 때 필수적인 장비 조건은 무엇입니까?
    choices:
    - 일반 황동 노즐
    - 경화강 노즐
    - 노즐 온도 150°C 이하
    - 수냉식 냉각 장치
    answer_index: 1
    explanation: PC-CF 소재는 탄소섬유가 함유되어 마모성이 강하므로 경화강 노즐 사용이 필수입니다 [S18].
  - question: M3 열압입 인서트 삽입을 위한 권장 구멍 지름은 얼마입니까?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 5.0 mm
    - 5.8 mm
    answer_index: 1
    explanation: 데이터시트에 따르면 HTBI-M3-BR 인서트를 위한 권장 구멍 지름은 4 mm입니다 [S20].
  completion_criteria:
  - 로봇손 모든 관절 모듈의 인서트 매립 완료.
  - 8 mm 샤프트와 베어링 조립 후 구속 없는 부드러운 작동 확인.
  - 모든 조립 과정의 공차 검증 기록 제출.
  source_ids:
  - S18
  - S19
  - S20
- id: M4
  slug: transmission-cabling
  phase_id: PH2
  title: 구동기 및 힘 전달 시스템 구축
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 물리적 구동 특성과 제어기 연결 방식을 이해한다.
  - Dyneema SK78 고강도 섬유를 이용한 텐던 기반의 동력 전달 메커니즘을 설계한다.
  - 독립 전원 분기 구조의 전기적 안전성을 확보하고 비상 차단 회로를 구축한다.
  - 부품 데이터시트에 기반한 적정 토크 및 장력 사양을 도출하고 재현성을 확보한다.
  theory_markdown: "## 구동기 및 힘 전달 시스템 이론\n\n로봇손의 정밀한 파지는 액추에이터의 피드백 제어와 텐던의 동력 전달\
    \ 효율에 의존합니다. \n\n### 1. 스마트 액추에이터 기반 구동\n본 프로젝트는 `XM430-W350-T` 스마트 액추에이터를 사용합니다.\
    \ 이 구동기는 12 V 전압에서 작동하며 4.1 N·m의 스톨 토크를 제공합니다 [S10]. 위치, 속도, 전류 피드백을 통해 로봇손 관절의\
    \ 상태를 실시간 제어하며, `OpenCR 1.0` 제어기에 직접 연결되어 통신 브리지 없이도 안정적인 응답성을 확보합니다 [S12].\n\n\
    ### 2. 텐던 기반 동력 전달\n`Dyneema SK78` 섬유는 파단 하중이 230 daN으로 매우 높으며, 작동 신율이 1 % 미만으로\
    \ 낮아 정밀한 위치 제어에 적합합니다 [S15]. 텐던은 캡스턴과 관절 사이를 이동하며 장력을 전달하므로, 경로상의 모서리를 반드시 라운딩\
    \ 처리하여 마찰과 조기 파단을 방지해야 합니다.\n\n### 3. 전기적 독립 분기 및 안전\n총 11대의 액추에이터는 정격 138 W의\
    \ 12 V 전원 어댑터 3대를 통해 각각 분리 공급됩니다 [S14]. 각 분기는 10 A 퓨즈와 `EV200` 접촉기를 포함하여 과전류 보호\
    \ 및 비상 차단을 수행합니다 [S23, S25]. **주의: 각 어댑터의 양(+) 출력은 독립적으로 유지되어야 하며, 절대 병렬로 연결해서는\
    \ 안 됩니다.** 비상 정지 버튼을 누르면 모든 독립 접촉기가 NC 제어 회로에 의해 동시 해제되어 안전을 보장합니다."
  worked_examples:
  - '예제 1: 텐던 장력 계산. 관절 토크가 1 N·m이고 관절의 유효 반경이 0.02 m라면, 요구되는 텐던의 장력은 T = 토크 / 반경
    = 1 N·m / 0.02 m = 50 N입니다. 이는 Dyneema SK78 파단 하중 2300 N(230 daN)의 약 2.2 % 수준으로,
    충분한 안전율을 갖습니다 [S15].'
  - '예제 2: 전원 용량 검증. 1개 분기에 액추에이터 4대가 할당될 때 스톨 전류 합계는 2.3 A * 4 = 9.2 A입니다. 이는 10
    A 퓨즈의 정격 이내이며 전원 어댑터 정격 11.5 A의 80 % 부하로 안전하게 작동합니다 [S14, S25].'
  lab:
    title: 액추에이터 분기 및 텐던 전달 테스트
    steps:
    - 각 액추에이터 그룹을 전원 분기 퓨즈 홀더 및 접촉기에 배선한다.
    - 멀티미터를 사용하여 각 독립 분기의 양(+) 출력이 타 분기와 절연되어 있는지 확인한다.
    - 텐던을 관절 관통 경로에 배치하고, 라운딩된 캡스턴에 감아 액추에이터 회전판에 고정한다.
    - OpenCR 제어기를 연결하여 액추에이터의 초기 위치를 보정한다.
    safety:
    - 벤치 전원 사용 시 전류 제한을 스톨 전류 이하로 설정할 것.
    - 작동 중인 구동부에 손가락이 끼이지 않도록 주의할 것.
    - 비상 전원 차단 스위치의 정상 작동 여부를 사전에 테스트할 것.
    deliverables:
    - 독립 분기별 절연 저항 측정 기록
    - 텐던 장력 변화에 따른 관절 응답 피드백 영상
    - 비상 차단 회로 구동 시 전류 차단 확인서
  assignment:
    title: 힘 전달 시스템 정량 분석 보고서
    deliverables:
    - 텐던 경로에서의 마찰 손실 추정 보고서
    - 독립 전원 분기 배선도
    - 액추에이터 부하별 소비 전류 데이터 그래프
    rubric:
    - 독립 전원 분기 구조의 전기적 독립성이 BOM과 배선도에 정확히 반영되었는가?
    - 텐던 사양(SK78)과 요구 장력에 대한 안전율 계산이 타당한가?
    - 비상 차단 시스템의 설계가 지정된 안전 부품 사양을 준수하는가?
  quiz:
  - question: 각 전원 어댑터의 독립 분기에 대한 설명으로 옳은 것은?
    choices:
    - 전류 합산을 위해 양(+) 출력 단자를 서로 연결한다.
    - 각 분기는 독립적으로 운영하며 양(+) 출력을 절대로 연결하지 않는다.
    - 전원 용량이 부족할 때 어댑터 3개를 병렬로 결합한다.
    - 하나의 퓨즈로 3개 분기를 통합하여 보호한다.
    answer_index: 1
    explanation: 각 액추에이터 분기는 독립적인 12 V 전원 공급을 위해 전기적으로 분리되어야 하며, 독립 분기 간 양(+) 출력 연결은
      절대 금지됩니다.
  - question: Dyneema SK78 텐던의 사용 목적과 특징으로 옳지 않은 것은?
    choices:
    - 낮은 신율로 정밀한 제어를 가능하게 한다.
    - 높은 파단 하중으로 안전한 부하 전달을 지원한다.
    - 금속 와이어보다 강성이 낮아 인장 강도를 무시할 수 있다.
    - 반복 굽힘 시험을 통해 안전성을 확보해야 한다.
    answer_index: 2
    explanation: Dyneema SK78은 높은 파단 하중과 낮은 신율을 가져 정밀한 제어에 적합한 소재입니다. 낮은 강성이 아니라 높은
      인장 성능이 요구됩니다.
  completion_criteria:
  - 3개의 독립 분기가 전기적으로 절연됨을 멀티미터로 검증 완료
  - 액추에이터 11대 각각의 정상 통신 및 위치 피드백 확인
  - 텐던 기반 관절 구동 메커니즘이 원활하게 동작하고 조립 공차 준수
  - 비상 차단 스위치 동작 시 전체 모터 전원이 즉시 차단됨을 확인
  source_ids:
  - S15
  - S16
  - S17
- id: M5
  slug: power-distribution
  phase_id: PH2
  title: 전원 분배 및 안전 시스템
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - DYNAMIXEL 스마트 액추에이터 구동을 위한 12 V 전원 분기 시스템의 설계 원리 이해
  - 독립적인 전원 어댑터의 안전한 활용과 과전류 보호 회로 구성
  - 비상 정지(Emergency Stop) 회로를 이용한 시스템 전체 전원 제어 및 차단 구현
  - IEC 60204-1 표준에 따른 기계 안전 요구사항 숙지
  theory_markdown: '## 12 V 전원 분기 및 분리 원리

    5지 로봇손은 총 11대의 DYNAMIXEL XM430-W350-T 액추에이터를 사용하며, 대당 최대 2.3 A의 스톨 전류를 소비합니다 [B1].
    전체 피크 전류는 약 25.3 A에 달합니다. 안전하고 신뢰성 있는 전원 공급을 위해 단일 대용량 어댑터 대신 3대의 독립적인 절연형 데스크톱
    전원 어댑터(GST160A12-R7B)를 분할하여 사용합니다 [B3].


    각 어댑터는 독립적인 12 V 전원 분기를 구성하며, 어댑터 간 양(+) 출력 단자를 연결하는 것은 절대 금지됩니다. 각 분기마다 10 A
    정격의 ATOF 퓨즈를 직렬로 배치하여 과전류 발생 시 특정 분기를 보호합니다 [B11].


    ## 안전 및 비상 정지 시스템

    기계 안전 표준 IEC 60204-1에 따라, 비상 정지 기능을 구현해야 합니다 [S21]. 본 시스템은 래칭 비상정지 푸시버튼(A22E-M-12-EMO)의
    NC 접점을 통해 3개의 고전류 DC 비상 차단 접촉기(EV200) 코일을 제어합니다 [B10, B23]. 비상 정지 버튼이 눌리면 3개 분기의
    코일이 동시에 해제되어 12 V 전원이 차단됩니다 [B23].'
  worked_examples:
  - '전류 분기 설계: 총 11대의 액추에이터를 4대, 4대, 3대로 분산 배치합니다. 4대 구동 분기의 최대 스톨 전류 합은 9.2 A입니다.
    따라서 10 A 정격 퓨즈를 사용하여 9.2 A 피크 부하에서 안전하게 동작하도록 구성합니다 [B1, B11].'
  - '전원 정격 검증: 각 어댑터(11.5 A)는 할당된 액추에이터의 스톨 전류 합(9.2 A)을 충분히 공급할 수 있습니다. 3개 분기 전체
    합산 전류 용량은 34.5 A로, 시스템 전체 피크 25.3 A를 상회하여 안전합니다 [B3].'
