- id: mod-5
  slug: fabrication
  phase_id: phase-2
  title: 부품 출력 및 가공
  estimated_hours: 15.0
  prerequisites:
  - mod-4
  objectives:
  - FDM 3D 프린팅의 기술적 매개변수를 이해하고 탄소섬유 강화 필라멘트(PC-CF)를 최적으로 출력한다.
  - 열압입 인서트(Heat-set Insert)를 사용하여 기계적 체결 안정성을 확보하는 조립법을 익힌다.
  - 부품 조립 시 베어링 및 샤프트의 정밀한 공차 관리를 수행한다.
  theory_markdown: '### FDM 3D 프린팅과 탄소섬유 복합재

    탄소섬유가 첨가된 PC(Polycarbonate) 필라멘트는 일반적인 PC 대비 향상된 강성과 치수 안정성을 제공합니다 [S20]. 탄소섬유
    강화재는 출력 시 노즐 마모를 유발하므로 반드시 경화강(Hardened Steel) 노즐을 사용해야 합니다 [S20]. PC-CF의 권장 노즐
    온도는 285°C, 베드 온도는 110°C 수준으로, 고온 환경에서의 안정적인 압출과 베드 밀착이 핵심입니다 [S20].


    ### 기계적 체결 시스템: 열압입 인서트

    로봇손 프레임은 반복적인 조립과 분해가 가능해야 합니다. 이를 위해 열압입(Heat-set) 인서트를 사용합니다. M3 규격의 황동 인서트는
    외경 4.4mm를 가지며, PC-CF 출력물에 4.0mm 직경의 파일럿 홀을 미리 설계하여 장착합니다 [S22]. 열압입 과정에서 인서트가
    플라스틱 내부로 매끄럽게 삽입되어 냉각 후 강한 인발 강도를 확보합니다.


    ### 정밀 회전축 조립

    회전 관절은 IGUS사의 무급유 폴리머 슬리브 베어링(JSM-0810-10)을 사용합니다 [S18]. 내경 8mm, 외경 10mm 규격에 맞춰
    8mm 정밀 알루미늄 샤프트를 사용함으로써 마찰력을 최소화하고 기구적 유격을 방지합니다 [S18, S19]. 조립 시 베어링은 하우징 보어에
    압입되며, 이 과정을 통해 내경이 최종 치수로 조정됩니다 [S18].'
  worked_examples:
  - '예제 1: PC-CF 출력물의 인서트 홀 직경 계산. 설계값 4.0mm 홀에 4.4mm 외경 인서트를 삽입하기 위해 슬라이서 설정에서 XY
    치수 보정을 확인하고, 실제 출력물이 4.0mm +/- 0.05mm 내외인지 버니어 캘리퍼스로 측정하십시오 [S22].'
  - '예제 2: 회전축 베어링 압입 공차 해석. JSM-0810-10 베어링은 하우징 보어 압입 후 내경이 최적화되도록 설계되었습니다 [S18].
    따라서 보어 직경을 10.0mm(H7 공차 권장)로 설계하여 베어링이 이탈하지 않도록 구성합니다 [S18].'
  lab:
    title: 로봇손 프레임 출력 및 관절 조립 실습
    steps:
    - 경화강 노즐을 장착하고 PC-CF 필라멘트를 사용하여 손가락 링크와 손바닥 프레임 출력물을 제작한다 [S20].
    - 출력물에서 서포트를 제거하고, 인서트가 들어갈 4.0mm 파일럿 홀 내부를 정리한다 [S22].
    - 납땜 인두를 사용하여 황동 인서트를 4.0mm 파일럿 홀에 열압입한다 [S22].
    - JSM-0810-10 베어링을 관절 하우징에 압입한다 [S18].
    - 8mm 알루미늄 샤프트를 규격에 맞춰 절단하고 모따기하여 베어링과 결합한다 [S19].
    safety:
    - 110°C 베드와 285°C 노즐을 사용하므로 화상 방지를 위해 장갑과 주의가 필요하다 [S20].
    - 출력물 가공 시 발생하는 미세 파편 흡입 방지를 위해 환기 장치와 보안경을 필히 착용한다 [S20].
    - 납땜 인두는 고온 장비이므로 사용 전후 거치대에 안전하게 배치한다.
    - 충격 방지 작업용 보안경은 모든 기구 가공 및 조립 단계에서 상시 착용한다.
    deliverables:
    - 출력 완료된 5지 로봇손 구조물
    - 인서트 및 베어링 압입이 완료된 관절 하우징
    - 치수 측정 기록이 포함된 실습 결과물
  assignment:
    title: 로봇손 기구 조립 최종 보고서
    deliverables:
    - 조립된 프레임의 CAD 치수와 실제 측정값 비교표
    - 인서트 압입 후 인발 시험 결과 요약
    - 회전축 마찰력 측정 기록
    rubric:
    - 프레임 출력물이 설계 규격의 +/- 0.1mm 오차 범위 내에 있는가?
    - 열압입된 인서트가 수직도를 유지하며 튼튼하게 고정되었는가?
    - 회전 관절이 유격 없이 부드럽게 동작하는가?
  quiz:
  - question: PC-CF 필라멘트 출력 시 일반 황동 노즐 대신 경화강 노즐을 사용해야 하는 이유는 무엇입니까?
    choices:
    - 탄소섬유가 황동 노즐보다 열전도율이 낮기 때문에
    - 탄소섬유가 고도로 연마성(Abrasive)이 강하여 황동 노즐을 마모시키기 때문에
    answer_index: 1
    explanation: 탄소섬유는 매우 단단하여 일반 황동 노즐을 빠르게 마모시키므로 경화강 노즐이 필수적입니다 [S20].
  - question: 열압입 인서트 장착을 위해 미리 설계해야 하는 파일럿 홀의 권장 직경은 얼마입니까?
    choices:
    - 4.0 mm
    - 5.8 mm
    answer_index: 0
    explanation: HTBI-M3-BR 인서트의 권장 파일럿 홀 직경은 4.0mm입니다 [S22].
  - question: 폴리머 슬리브 베어링(JSM-0810-10)의 내경은 어떤 조건에서 최적으로 조정됩니까?
    choices:
    - 압입 전 측정 시
    - 하우징 보어에 압입된 후
    answer_index: 1
    explanation: 이 베어링은 압입 후 하우징의 압력에 의해 내경이 최종 치수로 조정되도록 설계되었습니다 [S18].
  completion_criteria:
  - 모든 5지 프레임 파츠를 PC-CF 필라멘트로 출력 완료
  - 회전 관절에 베어링 및 샤프트가 정확히 장착되어 유격 없이 구동됨
  - 모든 기구 조립 단계에서의 안전 지침 준수 및 보고서 제출 완료
  source_ids:
