modules:
- id: M1
  slug: intro-robotics
  phase_id: PH1
  title: 로봇 공학 입문
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 시스템의 액추에이터, 제어기, 센서 간의 상호작용 원리를 이해한다.
  - 정밀 로봇 손 제작을 위한 주요 부품의 사양과 호환성을 파악한다.
  - 로봇 시스템의 안전한 전원 설계 및 과전류 보호 개념을 학습한다.
  - 전압 분압 회로를 이용한 힘 감지 센서 신호 취득 원리를 습득한다.
  theory_markdown: '## 1. 로봇 손 시스템 구조

    정밀 5지 로봇 손은 액추에이터(XM430-W350-T), 제어기(OpenCR 1.0), 센서(FSR 402)를 통합한 복합 제어 시스템입니다
    [S6, S14, S15]. 액추에이터는 텐던을 통해 관절을 구동하며, 토크와 위치 제어를 위해 12V 전원을 사용합니다 [S6].


    ## 2. 전력 분배 및 안전 보호

    시스템은 3개의 독립된 12V 138W 어댑터를 사용하여 액추에이터 그룹별로 전력을 공급합니다 [S17]. 각 분기는 10A ATOF 퓨즈를
    통해 과전류로부터 보호됩니다 [S27]. **양(+) 전원 출력은 절대 병렬로 결합하지 않으며, 독립된 분기로 유지해야 합니다.** 이는 시스템의
    전기적 안정성을 유지하고 사고를 방지하기 위함입니다.


    ## 3. 센서 신호 취득 (전압 분압 회로)

    FSR 402 센서는 가해지는 힘에 따라 저항이 감소하는 특성을 갖습니다 [S14]. OpenCR의 ADC 입력(12비트 분해능)을 활용하기
    위해 10kΩ 저항을 사용하는 전압 분압 회로를 구성합니다 [S15, S28]. 이 회로는 반드시 3.3V 센서 전원 레일을 사용해야 하며,
    ADC 신호 전압은 0~3.3V 범위를 초과해서는 안 됩니다 [S15].'
  worked_examples:
  - '예제 1: 분기별 전류 계산. 액추에이터 4대가 장착된 분기의 피크 전류는 4 * 2.3A = 9.2A입니다 [S6]. 전원 어댑터의 정격
    11.5A보다 작으므로 안전하며, 10A 퓨즈는 9.2A 작동 시 통전하고 단락 시 차단하여 회로를 보호합니다 [S6, S17, S27].'
  - '예제 2: FSR 센서 전압 분압. 센서 저항을 R_fsr, 고정 저항 R_fixed = 10kΩ이라 할 때, 출력 전압 V_out = 3.3V
    * (R_fixed / (R_fsr + R_fixed))로 계산됩니다. 힘이 증가하면 R_fsr이 작아져 V_out이 증가하여 더 큰 힘을
    ADC 값으로 해석할 수 있습니다 [S14, S28].'
  lab:
    title: 전기 계통 조립 및 기본 안전 점검
    steps:
    - 각 12V 전원 어댑터의 출력단에 인라인 퓨즈 홀더를 사용하여 10A 퓨즈를 장착한다 [S26, S27].
    - 각 독립 분기의 양(+) 출력과 전원 제어기를 개별 커넥터(Micro-Fit 3.0)로 연결한다 [S16].
    - FSR 센서와 10kΩ 저항을 이용하여 전압 분압 회로를 구성하고 OpenCR의 ADC 핀에 연결한다 [S15, S28].
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기의 출력 전압이 12V인지 측정한다.
    safety:
    - 실험 중 정지 시 3개 절연 전원 어댑터를 물리적으로 완전히 분리한다.
    - 전원 인가 전 반드시 멀티미터 DC 전압 모드로 각 분기에서 1V 미만인지 확인하고 접근한다.
    - 퓨즈는 안전 장치가 아니며 과전류 차단용임을 인지한다.
    - 전원이 연결된 상태에서 손을 가동 범위 내에 절대 넣지 않는다.
    deliverables:
    - 전원 분기별 전압 측정 데이터
    - 완성된 배선 사진
    - 전기 안전 점검 체크리스트
  assignment:
    title: 로봇 손 시스템 구성 설계서
    deliverables:
    - 시스템 블록 다이어그램 (전원 및 신호 경로 포함)
    - 부품 목록(BOM) 및 액추에이터 분기 배정표
    - 전압 분압 회로 해석 보고서
    rubric:
    - 전원 분기 결합 금지 규칙 준수 여부
    - 센서 전원(3.3V) 및 ADC 전압(0~3.3V) 범위 준수 여부
    - 퓨즈 용량 및 분기 배정의 논리적 타당성
  quiz:
  - question: 각 전원 분기의 양(+) 출력을 결합하면 안 되는 이유는 무엇인가?
    choices:
    - 전압이 낮아지기 때문
    - 독립된 회로 보호 및 전기적 안정성 유지를 위해
    answer_index: 1
    explanation: 각 분기는 별도의 퓨즈로 보호되며, 출력을 결합하는 행위는 보호 기능을 무력화하고 위험한 과전류를 유발할 수 있습니다.
  - question: FSR 센서와 함께 사용하는 분압 저항의 전원 레일은 무엇인가?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    answer_index: 1
    explanation: ADC 입력을 보호하고 3.3V 이하의 신호 전압을 유지하기 위해 반드시 3.3V 센서 전원을 사용해야 합니다.
  completion_criteria:
  - 전체 11개 액추에이터에 대한 전원 및 통신 계통 설계 완료
  - 3개 전원 분기의 전기적 절연성 및 정상 전압 측정 완료
  - 안전 점검 절차를 준수하여 모든 계측 보고서를 제출함
  source_ids:
  - S11
  - S6
  - S14
  - S15
  - S17
  - S27
  - S28
  - S26
  - S16
- id: M2
  slug: system-design
  phase_id: PH1
  title: 로봇손 시스템 설계
  estimated_hours: 15.0
  prerequisites:
  - M1
  objectives:
  - 로봇손의 구동기(액추에이터), 제어기, 센서 간의 통합 아키텍처를 이해한다.
  - 텐던 구동 방식의 기구적 특성과 토크 및 전력 요구사항을 계산한다.
  - 액추에이터의 피크 전류와 정격 전류를 기반으로 안전한 전력 분기 시스템을 설계한다.
  - 오픈 루프 시스템과 폐루프 제어 환경에서의 하드웨어 배선 및 안전 요구사항을 파악한다.
  theory_markdown: '## 로봇손 시스템 아키텍처

    정교한 5지 로봇손은 다수의 자유도를 가지며, 각 자유도는 복잡한 제어 입력을 요구한다 [S3]. 시스템 효율은 액추에이터의 수와 배치에 따라
    결정되는데, 텐던 구동 방식은 모터의 무게를 손가락에서 손바닥 또는 손목 영역으로 이동시켜 로봇손의 관성을 획기적으로 줄일 수 있다 [S12].


    ### 전력 및 통신 분기 설계

    본 시스템은 11개의 XM430-W350-T 액추에이터를 사용하며, 각 액추에이터는 스톨 전류 2.3 A를 가진다 [S6]. 전체 액추에이터
    피크 전류 합계는 약 25.3 A에 달한다. 시스템 안정성을 위해 3개의 절연형 12 V 전원 어댑터(GST160A12-R7B)를 활용하여
    4대/4대/3대 단위로 전력을 분기 공급한다 [S17]. 각 분기는 독립적인 10 A ATOF 퓨즈로 보호되며, 이는 어댑터의 11.5 A
    정격 내에서 과전류를 차단한다 [S17, S26, S27].


    ### 센서 데이터 취득

    손끝 힘 감지는 FSR 402 센서를 활용하며, 전압 분압 회로를 통해 구현된다 [S14]. OpenCR 1.0 제어기의 3.3 V 센서 전원을
    분압기 공급원으로 사용해야 하며, ADC는 0~3.3 V 범위를 입력받아야 한다 [S15]. 10 kΩ 분압 저항은 FSR의 저항 변화에 따른
    전압 출력을 최적화한다 [S14, S28].'
  worked_examples:
  - '예제 1: 전력 분기 용량 검증. 4대 액추에이터 분기의 피크 전류는 4 × 2.3 A = 9.2 A이다. 해당 분기에 적용된 10 A 퓨즈의
    정격은 9.2 A보다 높으므로 정상 운전 시 퓨즈 단선이 없으며, 단락 발생 시 11.5 A 출력 정격보다 낮은 10 A 퓨즈가 선제적으로
    보호 기능을 수행한다 [S6, S17, S27].'
  - '예제 2: 전압 분압 회로 설계. FSR 402와 10 kΩ 저항을 3.3 V 전원에 연결할 때, 센서가 완전히 눌려 저항이 0 Ω에 가까워지면
    출력 전압은 3.3 V에 수렴한다. ADC 해상도가 12 bit이므로, 측정 가능한 힘 범위에서 0~3.3 V 신호를 최대 4095 단계로
    세분화하여 힘 피드백을 구현한다 [S14, S15, S28].'
  lab:
    title: 로봇손 전원 분기 및 센서 인터페이스 구현
    steps:
    - 3개의 독립된 12 V 전원 어댑터 각각에 ATO 인라인 퓨즈 홀더와 10 A 퓨즈를 연결한다.
    - 멀티미터를 사용하여 각 분기의 양(+)단과 음(-)단이 서로 절연되어 있는지 확인한다.
    - OpenCR 1.0의 3.3 V 센서 레일과 GND를 사용하여 FSR 402 및 10 kΩ 저항으로 전압 분압 회로를 프로토보드에 구성한다.
    - 구성된 회로의 출력 전압이 0~3.3 V 이내인지 멀티미터로 측정하며 FSR을 가압한다.
    safety:
    - 전원 인가 전 모든 배선이 올바른지 멀티미터의 저항 모드로 검증한다.
    - 전원 인가 중에는 절대로 퓨즈나 전원 배선을 임의로 변경하지 않는다.
    - 실험 종료 시 3개의 전원 어댑터를 물리적으로 분리하고, 각 분기의 전압이 1 V 미만으로 떨어졌음을 계측 확인한 후 다음 작업을 진행한다.
    - 충격 방지 작업용 보안경을 항시 착용한다.
    deliverables:
    - 각 전원 분기별 전압 측정 데이터
    - FSR 센서 압력에 따른 전압 출력값 측정 기록
    - 배선도 검증 사진
  assignment:
    title: 로봇손 시스템 통합 설계 보고서
    deliverables:
    - 시스템 블록 다이어그램 (전원, 제어기, 액추에이터, 센서 연결)
    - 전체 전류 요구사항 계산서
    - 퓨즈 및 배선 정격 근거가 포함된 전원 설계 사양
    rubric:
    - 전원 분기 시스템의 독립성과 안전한 정격 준수 여부
    - FSR 센서의 3.3 V 전압 인터페이스 구현 논리
    - 전체 전류 계산식의 정확성
  quiz:
  - question: 본 로봇손 설계에서 액추에이터 전원 분기를 위해 반드시 준수해야 하는 안전 사항은 무엇인가?
    choices:
    - 모든 어댑터의 양(+) 출력을 하나로 묶어 전압을 안정화한다.
    - 각 전원 분기를 독립적으로 유지하고 양(+) 출력을 병렬로 연결하지 않는다.
    answer_index: 1
    explanation: 독립된 분기는 서로 전기적으로 분리되어야 하며, 임의로 전원을 병렬로 결합하는 것은 허용되지 않습니다.
  - question: FSR 402 센서를 OpenCR 1.0에 연결할 때 사용해야 하는 센서 전원 레일은 무엇인가?
    choices:
    - 12 V 액추에이터 전원 레일
    - 3.3 V 센서 레일
    answer_index: 1
    explanation: OpenCR의 ADC는 0~3.3 V 입력을 지원하므로 3.3 V 레일을 사용해야 안전합니다.
  - question: 분기당 액추에이터 4대를 구성할 때 10 A ATOF 퓨즈를 사용하는 이유는 무엇인가?
    choices:
    - 스톨 전류 합계인 9.2 A를 보호하고, 전원 어댑터 출력 정격인 11.5 A 이내에서 안전하게 차단하기 위해서이다.
    - 퓨즈가 무한정 많은 전류를 통과시킬 수 있기 때문이다.
    answer_index: 0
    explanation: 퓨즈는 과전류 발생 시 배선을 보호하기 위해 사용되며, 정상 동작 전류보다 높고 어댑터 한계보다 낮은 적절한 용량을
      선택해야 합니다.
  completion_criteria:
  - 시스템 블록 다이어그램과 전원 분기 배선도를 포함한 설계 보고서 제출
  - 전원 분기별 절연 확인 및 FSR 전압 출력 측정 실습 완료
  - 모든 전기적 인터페이스가 사양(3.3 V, 12 V 분리)을 만족함을 확인
  source_ids:
  - S3
  - S12
  - S6
  - S17
  - S26
  - S27
  - S14
  - S15
  - S28
- id: M3
  slug: structural-fabrication
  phase_id: PH2
  title: 구조 제작 (3D 프린팅)
  estimated_hours: 20.0
  prerequisites:
  - M2
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)의 기계적 특성과 FDM 프린팅 공정 변수를 이해한다.
  - 정밀 조립을 위한 열압입 인서트(Heat-set insert) 설계 및 시공법을 익힌다.
  - 구조적 강성과 치수 정밀도를 확보하기 위한 슬리브 베어링 하우징 공차 개념을 습득한다.
  - 로봇손 프레임 제작 시 안전한 공구 사용 및 후처리 절차를 수행한다.
  theory_markdown: '### FDM 구조 제작의 기초

    정교한 5지 로봇손 제작을 위해 선택된 **Prusament PC Blend Carbon Fiber(PC-CF)**는 고강성 및 열안정성을
    제공하는 공학용 소재입니다. PC-CF는 높은 인장 강도를 가지며 치수 안정성이 우수하여 정밀한 기구 부품에 적합합니다 [S21].


    #### 1. 공정 변수와 경화강 노즐

    탄소섬유는 연마성이 강해 황동 노즐을 빠르게 마모시킵니다. 반드시 경화강 노즐을 사용해야 하며, 노즐 온도 285°C 및 베드 온도 110°C
    환경을 준수해야 합니다 [S21]. 적절한 온도 관리는 탄소섬유 층간 결합력을 높여 구조적 결함을 방지합니다.


    #### 2. 열압입 나사산 인서트(Heat-set Inserts)

    반복적인 분해 조립이 필요한 로봇손 구조물에는 **HTBI-M3-BR** 황동 인서트를 사용합니다 [B-FASTENER-INSERT]. 4.0
    mm 파일럿 홀에 열을 가해 인서트를 삽입하면, PC-CF 소재가 냉각되면서 황동 인서트를 견고하게 고정합니다 [S23]. 이는 직접 나사산을
    내는 방식보다 높은 내구성과 재현성을 보장합니다.


    #### 3. 베어링 하우징 설계

    **JSM-0810-10** 폴리머 슬리브 베어링은 8 mm 축과 10 mm 하우징 보어 규격을 가집니다 [B8, S19]. 압입 후 내경은
    소재의 탄성에 의해 미세하게 조절되므로, 하우징 설계 시 10 mm 공차 보어 설계가 필수적입니다 [S19].'
  worked_examples:
  - '예제 1: 인서트 홀 설계. 4.4 mm 외경을 가진 HTBI-M3-BR 인서트를 위해 CAD 설계 시 4.0 mm 파일럿 홀을 배치하고,
    깊이는 인서트 길이 5.8 mm보다 1~2 mm 깊게 설계하여 과잉 융용 소재가 밀려날 공간을 확보한다 [S23].'
  - '예제 2: 출력물 공차 계산. 8 mm 알루미늄 샤프트[B-SHAFT]가 JSM-0810-10 베어링[B8]을 통해 회전할 때, 슬리브 베어링의
    특성상 압입 후 내경이 미세 수축함을 고려하여 하우징 구멍의 공차를 설계에 반영한다 [S19].'
  lab:
    title: 로봇손 프레임 출력 및 인서트 조립
    steps:
    - 경화강 노즐 장착 후 FDM 프린터의 베드를 정밀 레벨링하고 110°C로 예열한다 [S21].
    - PC-CF 필라멘트를 사용하여 손바닥 프레임 및 링크를 출력한다 [B7, S21].
    - 출력물에서 서포트 소재를 수공구로 안전하게 제거하고 표면을 정리한다.
    - 4.0 mm 파일럿 홀에 HTBI-M3-BR 인서트를 배치하고 납땜 인두로 가열하여 수직으로 압입한다 [S23].
    - 압입 후 냉각되어 소재가 경화될 때까지 대기하고, 볼트로 인서트 결합 강도를 확인한다.
    safety:
    - 110°C 베드 및 285°C 노즐 화상 방지를 위해 작업용 장갑 및 보안경을 착용한다 [S21].
    - 출력물 후처리 시 날카로운 도구 사용에 유의하고, 탄소섬유 분진 흡입 방지를 위해 환기 설비를 가동한다.
    - 열압입 인서트 삽입 시 가열된 금속부에 직접 접촉하지 않도록 주의한다.
    deliverables:
    - 인서트가 수직으로 정확히 안착된 3D 프린팅 구조물
    - 조립된 링크와 손바닥 프레임의 치수 정밀도 검사 기록지
  assignment:
    title: 로봇손 구조 최적화 및 조립 보고서
    deliverables:
    - 프린팅 출력 설정(온도, 속도, 서포트) 및 사후 처리 기록
    - 인서트 삽입 직후의 파손 여부와 조립 정밀도를 포함한 검사 결과
    - 베어링 하우징의 압입 공차 설계 및 측정값 비교표
    rubric:
    - 경화강 노즐 사용 및 적정 온도 설정을 준수하였는가?
    - 인서트가 출력물 중심에 수직으로 정확히 배치되었는가?
    - CAD 설계값과 실물 출력물의 공차가 허용 오차 범위 내인가?
  quiz:
  - question: PC-CF 소재를 3D 프린팅할 때 반드시 필요한 조치는 무엇인가?
    choices:
    - 황동 노즐 사용
    - 경화강 노즐 사용
    answer_index: 1
    explanation: 탄소섬유는 연마성이 강해 황동 노즐을 마모시키므로 반드시 경화강 노즐을 사용해야 합니다 [S21].
  - question: HTBI-M3-BR 인서트를 위해 설계해야 할 파일럿 홀의 크기는?
    choices:
    - 3.0 mm
    - 4.0 mm
    answer_index: 1
    explanation: 데이터시트에 따르면 권장 구멍 지름은 4 mm입니다 [S23].
  - question: JSM-0810-10 베어링의 하우징 규격은 어떻게 되는가?
    choices:
    - 내경 8 mm, 외경 10 mm
    - 내경 10 mm, 외경 8 mm
    answer_index: 0
    explanation: JSM-0810-10은 d1(내경) 8 mm, d2(외경) 10 mm를 가집니다 [S19].
  completion_criteria:
  - 출력된 PC-CF 구조물의 외관 검사 통과
  - 모든 열압입 인서트가 이탈 없이 결합됨
  - 제출한 조립 보고서가 요구된 치수 정밀도와 조립 결과를 포함함
  source_ids:
  - S21
  - S23
  - S19
- id: M4
  slug: actuator-assembly
  phase_id: PH2
  title: 구동부 조립
  estimated_hours: 20.0
  prerequisites:
  - M3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 기계적·전기적 사양 이해
  - 독립 전원 분기 구성 및 과전류 보호 원리 습득
  - 액추에이터 구동부의 텐던 장력 전달 구조 조립
  - 안전한 저전압 벤치 시험 절차 및 장비 제어 숙달
  theory_markdown: '## 구동 시스템 설계 기초


    5지 로봇손의 구동부는 DYNAMIXEL XM430-W350-T 액추에이터 11개를 활용하여 정밀한 위치 및 전류 제어를 수행합니다 [S5].
    각 액추에이터는 스톨 전류 2.3 A를 요구하며 [S6], 전체 시스템의 총 피크 전류 수요는 25.3 A에 달합니다. 이를 안정적으로 지원하기
    위해 3개의 절연형 12 V 데스크톱 전원 어댑터(각 11.5 A 정격)를 독립 분기로 구성합니다 [S17].


    ### 전원 분기 및 보호

    전원 공급은 3개 분기로 나누어 관리하며, 총 정격 전류는 34.5 A로 시스템 피크 수요를 상회합니다. 각 분기는 독립된 10 A ATOF
    퓨즈를 통해 과전류로부터 배선을 보호하며 [S27], 퓨즈 홀더를 사용하여 안전한 연결을 제공합니다 [S26]. **양(+) 출력의 병렬 연결은
    절대 금지**하며, 각 전원 어댑터는 할당된 액추에이터 그룹(4대/4대/3대)에 독립적으로 전력을 공급해야 합니다.


    ### 텐던 구동 메커니즘

    액추에이터의 회전 운동은 1.5 mm Dyneema SK78 고강도 텐던을 통해 손가락 관절로 전달됩니다 [S18]. 해당 텐던은 파단 하중
    230 daN 및 작동 신율 1% 미만의 우수한 기계적 물성을 가지며 [S18], 반복적인 굴곡과 장력을 견딜 수 있도록 설계되었습니다. 조립
    시 캡스턴 부의 라운딩 처리를 통해 마찰을 최소화하는 것이 중요합니다.'
  worked_examples:
  - '분기 용량 계산: 피크 전류 25.3 A를 어댑터 3개로 분산 시 분기당 최대 9.2 A가 발생합니다. 퓨즈는 정격과 시간-전류 곡선에 따라
    회로를 개방하며 비상정지 기능을 대신하지 않는다 [S17] [S27].'
  - '토크 전달 해석: XM430-W350-T 액추에이터는 4.1 N·m의 스톨 토크를 제공합니다 [S6]. 텐던 구동 시 모터 회전 반지름과
    손가락 레버 암비를 고려하여 최종 파지 토크를 계산하고, Dyneema 텐던의 파단 하중 230 daN(약 234 kgf) 범위 내에서 작동하도록
    장력을 설정합니다 [S18].'
  lab:
    title: 액추에이터 구동부 및 전원 분기 조립
    steps:
    - 각 액추에이터에 텐던을 연결하고 마찰이 없는지 확인하며 관절 링크에 고정합니다.
    - 12 V 전원 어댑터 3개의 독립적인 출력 라인에 ATO 인라인 퓨즈 홀더를 연결합니다 [S26].
    - 각 퓨즈 홀더에 10 A ATOF 퓨즈를 삽입하여 분기별 보호 회로를 완성합니다 [S27].
    - 분기별 액추에이터(4대/4대/3대)를 배선도에 따라 할당된 커넥터에 연결합니다 [S16].
    - 멀티미터를 사용하여 각 독립 분기의 양단 전압이 12 V임을 확인합니다.
    safety:
    - 전원 인가 전 반드시 멀티미터로 퓨즈 하단부 및 배선 회로를 확인합니다.
    - 액추에이터 고동 시 손을 가동 범위에 절대 넣지 않으며, 반드시 고정 지그에서 시험합니다.
    - 실험 종료 시 3개의 전원 어댑터를 물리적으로 분리한 후, 각 분기 전압이 1 V 미만인지 멀티미터(DC 전압 모드)로 확인합니다.
    - 납땜 및 조립 시 충격 방지 보안경을 필수 착용합니다.
    deliverables:
    - 조립 완료된 11개 액추에이터 구동 유닛
    - 3개 독립 전원 분기 및 퓨즈 보호 회로
    - 분기별 전압 측정 교정 기록지
  assignment:
    title: 시스템 전류 부하 분석 및 배선 보고서
    deliverables:
    - 시스템 총 피크 전류 계산식
    - 분기별 액추에이터 배분 논리 보고서
    - 퓨즈 정격 선택 근거 및 배선도
    rubric:
    - 독립 전원 분기의 분리 원칙 준수 여부
    - 액추에이터 스톨 전류 기반 용량 산출의 정확성
    - 배선도 내 퓨즈 보호 회로의 올바른 표기
  quiz:
  - question: 3개의 12 V 전원 어댑터 출력단을 병렬로 연결해도 됩니까?
    choices:
    - 네, 전류 공급량을 늘리기 위해 필요합니다.
    - 아니오, 절대 금지되며 독립 분기로 운영해야 합니다.
    answer_index: 1
    explanation: 각 어댑터는 독립적인 분기로 사용해야 하며, 양(+) 출력의 결합은 전원 어댑터의 고장 및 화재 위험을 초래합니다.
  - question: 분기별 10 A 퓨즈의 선택 근거로 올바른 것은?
    choices:
    - 분기별 액추에이터 스톨 전류 합계(최대 9.2 A)보다 높고 전원 정격(11.5 A)보다 낮아 안전함
    - 액추에이터의 최대 토크를 제어하기 위함
    answer_index: 0
    explanation: 퓨즈는 정상 작동 전류(스톨 합계)는 통과시키고 과전류/단락 시 배선을 보호해야 하므로 적절한 정격 선택이 필수입니다.
  - question: 실험 중 전원을 차단하는 가장 안전한 방법은?
    choices:
    - 소프트웨어 명령으로 액추에이터 정지
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터로 1 V 미만 전압 확인
    answer_index: 1
    explanation: 물리적 분리와 전압 측정을 통한 무전원 상태 확인만이 안전한 접근을 보장합니다.
  completion_criteria:
  - 모든 액추에이터 구동 유닛 조립 완료 및 텐던 장력 확인
  - 3개 독립 전원 분기의 물리적 분리 및 퓨즈 보호 회로 검증
  - 각 분기별 1 V 미만의 무전원 상태를 멀티미터로 최종 확인
  source_ids:
  - S5
  - S6
  - S17
  - S27
  - S26
  - S18
  - S16
- id: M5
  slug: electrical-wiring
  phase_id: PH2
  title: 전기 배선 및 과전류 보호 회로
  estimated_hours: 15.0
  prerequisites:
  - M4
  objectives:
  - 로봇 시스템의 전력 분배 아키텍처 이해
  - 독립 전원 분기 구성과 과전류 보호의 원리 습득
  - OpenCR 제어기 및 액추에이터 전원 분리 설계
  - FSR 센서와 ADC를 이용한 아날로그 신호 취득 회로 설계
  theory_markdown: "## 로봇 전원 시스템 설계 원리\n정교한 5지 로봇손은 고출력 액추에이터와 정밀 센서를 동시에 사용하므로, 안정적인\
    \ 전력 분배가 필수적입니다. [S17] 본 시스템은 138 W 급 절연 전원 어댑터 3개를 사용하여 독립적인 전원 분기를 구성합니다. [S17]\
    \ 액추에이터는 피크 전류를 소비할 때 전압 강하가 발생할 수 있으므로, 제어기(OpenCR) 및 센서 회로와 반드시 물리적으로 전원을 분리해야\
    \ 합니다. [S15, S17] 각 분기에는 10 A ATOF 퓨즈를 배치하여 배선 고장 시 과전류를 차단합니다. [S27] \n\n## 센서\
    \ 인터페이스와 ADC 분압 회로\n손끝 힘 감지 센서인 FSR 402는 누르는 힘에 따라 저항이 감소하는 특성을 갖습니다. [S14] OpenCR\
    \ 1.0 보드의 12-bit ADC를 사용하여 신호를 읽기 위해서는, 10 kΩ 저항과 FSR을 이용한 전압 분압기(Voltage Divider)를\
    \ 구성해야 합니다. [S15, S28] 이때 반드시 OpenCR의 3.3 V 센서 전원 레일을 사용해야 하며, 신호 전압이 0-3.3 V\
    \ 범위를 넘지 않도록 설계하여 보드를 보호해야 합니다. [S15]"
  worked_examples:
