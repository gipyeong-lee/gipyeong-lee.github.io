- id: m5
  slug: structure-fabrication
  phase_id: p2
  title: 구조 제작
  estimated_hours: 15.0
  prerequisites:
  - m2
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)를 사용한 로봇 구조 제작 기법 이해
  - 열압입 인서트 너트를 이용한 반복 조립 가능한 체결 구조 설계
  - 텐던 구동 로봇손의 마찰 저항을 줄이기 위한 베어링 및 샤프트 조립 노하우 습득
  - 독립 전원 분기 구성과 물리적 분리를 통한 정밀 로봇 시스템의 안전한 구조 제작
  theory_markdown: "### 정교한 로봇 구조 제작론\n\n정교한 5지 로봇손의 구조 제작은 강성, 치수 안정성, 그리고 조립 재현성의\
    \ 삼박자가 맞아야 합니다. 본 모듈에서는 구조용 탄소섬유 PC(PC-CF)를 사용하여 제작합니다. PC-CF는 높은 인장 강도와 온도 저항성을\
    \ 제공하며, 대형 모델 출력 시 수축을 최소화합니다 [S20]. \n\n#### 1. 적층 제조와 기계적 강성\nPC-CF 필라멘트는 연마성이\
    \ 강하므로 반드시 경화강 노즐을 사용하여 출력해야 합니다 [S20]. 조립 시 나사산의 마모를 방지하고 유지보수를 용이하게 하기 위해 M3\
    \ 황동 열압입 인서트 너트를 사용합니다 [S22]. 이는 출력물의 파일럿 홀(4.0 mm)에 열과 압력을 가해 매립하는 방식으로, 일반 나사\
    \ 체결보다 월등한 반복 조립 안정성을 제공합니다 [S22].\n\n#### 2. 마찰과 회전 정밀도\n텐던 구동 방식은 마찰 제어가 핵심입니다.\
    \ 손목 및 고하중 회전축에는 유지보수가 필요 없는 iglide J 폴리머 슬리브 베어링(8x10x10 mm)을 채택합니다 [S18]. 이\
    \ 베어링은 무급유 운전 시 낮은 마찰 계수를 보이며 진동 감쇄 효과가 뛰어납니다 [S18]. 베어링과 결합되는 샤프트는 8 mm 정밀 알루미늄\
    \ 샤프트(AWMP-08)를 사용하며, 조립 길이에 맞춰 정확히 절단하고 모따기해야 합니다 [S19].\n\n#### 3. 전원 분기와 구조\
    \ 안전\n로봇 손의 전기 구조는 액추에이터 11대의 피크 전류를 감당해야 합니다. 시스템은 3개의 독립된 절연 12 V 전원 분기를 사용하며,\
    \ 각 분기는 독립적으로 10 A 퓨즈 보호를 받습니다 [S16, S26]. 11대의 XM430 액추에이터 스톨 전류 합계(25.3 A)는\
    \ 3개 분기의 합산 정격(34.5 A) 내에 존재하여 안전합니다 [S12, S16, S26]."
  worked_examples:
  - '예제 1: 인서트 매립 계산. PC-CF 부품의 파일럿 홀 지름이 4.0 mm일 때, HTBI-M3-BR 인서트(외경 4.4 mm)의 열압입
    가능성 판단. 4.0 mm 구멍은 4.4 mm 인서트를 단단히 고정하기 위한 적정 공차 규격이며, 인서트 길이 5.8 mm에 맞춰 6 mm
    이상의 깊이를 설계해야 합니다 [S22].'
  - '예제 2: 전원 분기 퓨즈 정격 검토. 1개 분기에 액추에이터 4대를 배정할 때, 스톨 전류 합계는 4 × 2.3 A = 9.2 A입니다
    [S12]. 10 A ATOF 퓨즈는 9.2 A 피크 부하를 통과시키면서, 배선 단락 시 안전하게 작동할 수 있는 최적의 과전류 보호 부품입니다
    [S26].'
  lab:
    title: 로봇손 구조 모듈 제작 실습
    steps:
    - 경화강 노즐이 장착된 3D 프린터로 PC-CF 손가락 링크와 손바닥 프레임 출력
    - 출력물 파일럿 홀에 인두기를 사용하여 HTBI-M3-BR 인서트 매립
    - 손목 및 관절 부위에 JSM-0810-10 베어링 압입
    - AWMP-08 샤프트를 조립 길이에 맞춰 절단하고 모따기 후 조립
    - 3개 전원 분기별 퓨즈 홀더와 커넥터를 연결하여 액추에이터 전원 하네스 구성
    safety:
    - PC-CF 출력 시 고온 노즐(285 °C)과 베드(110 °C) 주의
    - 인서트 매립 시 발생하는 미세 먼지와 흄을 방지하기 위해 환기 및 보안경 착용
    - 전원 인가 전 3개 독립 절연 전원을 물리적으로 분리한 상태 유지
    - 절연 상태를 멀티미터 DC 전압 모드로 각 분기에서 1 V 미만임을 확인 후 접근
    - 절대로 정지 회로를 계획 정지 대신 사용하지 말 것
    deliverables:
    - 인서트 매립이 완료된 로봇손 구조물
    - 전원 분기별 독립 배선 완료 하네스
    - 조립 공차 및 마찰 확인 보고서
  assignment:
    title: 구조 강성 및 안전 설계 리포트
    deliverables:
    - 열압입 인서트 매립 치수 검증 도면
    - 로봇손 액추에이터 11대 대상 전원 분기 할당 및 퓨즈 계산서
    - 베어링-샤프트 유격 측정 데이터
    rubric:
    - 인서트 규격에 맞는 홀 직경 준수 여부
    - 독립 분기 전원 구성 및 퓨즈 정격의 시스템 요구사항 일치 여부
    - 베어링 마찰 감쇄 성능 분석의 타당성
  quiz:
  - question: PC-CF 필라멘트를 사용할 때 경화강 노즐이 필수인 이유는 무엇입니까?
    choices:
    - 필라멘트의 녹는점이 구리 노즐보다 높기 때문
    - 탄소섬유가 고도로 연마성이 강하여 일반 노즐을 마모시키기 때문
    answer_index: 1
    explanation: 탄소섬유는 연마성이 강해 황동 노즐을 빠르게 손상시키므로 경화강 노즐이 필수적입니다 [S20].
  - question: 로봇 손의 11대 액추에이터 전원 분기를 구성할 때 양(+) 출력을 병렬로 연결하는 것은 어떤 결과가 발생합니까?
    choices:
    - 전류 공급 능력이 향상되어 좋다
    - 독립 분기 구성을 위반하며 절연된 안전을 저해하므로 절대 금지된다
    answer_index: 1
    explanation: 독립 분기를 구성하는 이유는 안전한 과전류 보호와 시스템 간 전기적 격리를 위함이며, 병렬 연결은 시스템 Truth
      정의에 의해 절대 금지됩니다.
  - question: M3 인서트 너트 매립을 위해 PC-CF 출력물에 권장되는 홀 지름은 얼마입니까?
    choices:
    - 3.0 mm
    - 4.0 mm
    answer_index: 1
    explanation: M3 HTBI-M3-BR 인서트(외경 4.4 mm)의 경우 권장 홀 사이즈는 4.0 mm입니다 [S22].
  completion_criteria:
  - 모든 손가락 구조와 프레임이 인서트 너트를 사용하여 조립 완료됨
  - 전원 분기별 독립 전원 및 퓨즈 구성이 1 V 미만 전압을 유지함을 계측함
  - 3D 모델과 실제 조립품의 공차 측정치가 요구사항 내에 존재함
  source_ids:
  - S7
  - S20
  - S21
  - S22
  - S18
  - S19
  - S16
  - S26
  - S12
- id: m6
  slug: power-wiring
  phase_id: p2
  title: 전원 배선 및 과전류 보호 회로
  estimated_hours: 10.0
  prerequisites:
  - m3
  objectives:
  - DYNAMIXEL 12V 전원 분기 및 독립 퓨즈 보호 원리 이해
  - 회로 설계 시 액추에이터 스톨 전류 합계를 고려한 전원 용량 계산
  - OpenCR 제어기의 센서 전원 분리와 전압 분압 회로 구성법 습득
  - 안전한 저전압 DC 회로 배선 및 측정 절차 숙지
  theory_markdown: "### 전원 배선 및 보호 설계 원리\n로봇 공학 시스템에서 전원 설계는 구동부와 제어부를 전기적으로 분리하여\
    \ 노이즈를 방지하고 고장 시 영향을 최소화하는 것이 핵심입니다. \n\n#### 1. 전류 부하 계산 및 퓨즈 보호\n로봇 핸드에 사용되는\
    \ 11개의 XM430-W350-T 액추에이터는 개당 2.3A의 스톨 전류를 가집니다 [S12]. 전체 시스템 피크 전류는 25.3A에 달하므로,\
    \ 하나의 전원 경로로 전체를 구동하는 것은 부적합합니다. 따라서 3개의 독립된 138W(11.5A) 어댑터를 분기하여 전력을 공급합니다 [S16].\
    \ 각 분기는 최대 4개의 액추에이터를 담당하며, 예상 최대 전류는 약 9.2A입니다. 10A ATOF 퓨즈는 11.5A 어댑터의 보호와 9.2A\
    \ 피크 전류 허용 범위를 적절히 절충하여 배선 손상을 방지합니다 [S26]. \n\n#### 2. 센서 데이터 취득 회로\nFSR 402\
    \ 센서는 압력에 따라 저항이 변하는 소자입니다 [S13]. 이를 10kΩ 저항과 분압 회로로 구성하여 OpenCR의 12bit ADC로 읽습니다\
    \ [S14, S27]. 이때 센서 전원은 반드시 OpenCR의 3.3V 센서 전원 레일을 사용해야 하며, 액추에이터의 12V 전원과는 물리적으로\
    \ 분리되어야 합니다 [S14]."
  worked_examples:
  - '예제 1: 전원 분기별 퓨즈 적합성 검증. 4개의 액추에이터가 1개 분기에 연결될 때, 총 스톨 전류는 4 × 2.3A = 9.2A입니다.
    사용된 10A ATOF 퓨즈는 9.2A의 피크 전류를 허용하면서, 11.5A 용량의 어댑터 출력 범위를 벗어나는 단락 사고 시 배선을 보호할
    수 있습니다 [S12, S16, S26].'
  - '예제 2: 전압 분압 회로 계산. 10 kΩ 풀다운 분압기는 $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$를
    사용한다. 이는 OpenCR 3.3V ADC 입력 범위 내에서 안전하게 취득됩니다 [S13, S14, S27].'
  lab:
    title: 독립 전원 분기 및 ADC 신호 검증
    steps:
    - 각 MEAN WELL 12V 어댑터에 ATO 인라인 퓨즈 홀더를 연결하고 10A 퓨즈를 삽입합니다 [S16, S25, S26].
    - 액추에이터 배분(4대/4대/3대)에 맞춰 Micro-Fit 3.0 커넥터로 독립 분기 전원 하네스를 제작합니다 [S15].
    - OpenCR의 3.3V 센서 전원 레일을 사용하여 FSR 402 전압 분압 회로를 납땜합니다 [S14, S27].
    - 퓨즈 제조사 데이터시트의 정격과 시간-전류 곡선 검토 기록.
    - 각 어댑터를 개별 콘센트에 연결하고, 전원 분기 출력(12V)과 센서 전원(3.3V)을 DC 전압 모드로 측정합니다.
    safety:
    - 모든 회로 수정은 3개 전원 어댑터가 완전히 물리적으로 분리된 상태에서 수행합니다.
    - 전원 인가 전 반드시 보안경을 착용합니다.
    - 측정 시 멀티미터가 DC 전압 모드인지 확인하고, 1V 미만임을 계측 확인 후 회로를 만집니다.
    - 전원 어댑터 출력을 병렬로 결선하지 마십시오.
    deliverables:
    - 독립 퓨즈 분기 배선도
    - FSR 전압 분압 회로 측정값
    - 분기별 전압 측정 검증서
  assignment:
    title: 전원 분기 용량 및 신호 보호 보고서
    deliverables:
    - 시스템 전체 피크 전류 계산식
    - 분기별 퓨즈 선정 근거 보고서
    - FSR-ADC 신호 처리 회로도
    rubric:
    - 전원 용량 계산의 정확성
    - 독립 분기 배선 설계의 안전성
    - 센서 전원과 액추에이터 전원의 격리 설계 명시
  quiz:
  - question: 3개 어댑터의 12V 양(+) 출력을 병렬로 연결하면 안 되는 이유는 무엇입니까?
    choices:
    - 전압이 36V로 상승하기 때문에
    - 독립 전원 분기·퓨즈·물리적 전원 분리 절차를 문서화한다
    - 전류가 감소하기 때문에
    answer_index: 1
    explanation: 독립된 전원 어댑터 출력을 병렬로 결선하면 내부 피드백 회로 간 충돌 및 순환 전류로 인한 손상 위험이 있습니다.
  - question: OpenCR 제어기에서 FSR 전압 분압 회로에 권장되는 전원 레일은 무엇입니까?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    - 5V 레일
    answer_index: 1
    explanation: OpenCR의 센서 전원은 3.3V이며, 액추에이터 전원과의 전기적 격리를 위해 3.3V 센서 레일 사용이 필수입니다
      [S14].
  - question: 퓨즈를 분기 회로에 사용하는 주된 목적은 무엇입니까?
    choices:
    - 전압을 낮추기 위해
    - 회로의 과전류 발생 시 배선 소손을 방지하기 위해
    - 데이터 통신 속도를 높이기 위해
    answer_index: 1
    explanation: 퓨즈는 정격 이상의 과전류가 흐를 때 물리적으로 회로를 차단하여 화재나 배선 파손을 방지합니다 [S26].
  completion_criteria:
  - 모든 독립 분기 전압이 12V ± 0.5V 범위 내임을 계측 완료
  - FSR 센서 값이 3.3V 센서 레일을 통해 안정적으로 ADC 입력됨을 확인
  - 전원 분리 및 퓨즈 설치가 배선도와 일치함을 검증
  source_ids:
  - S6
  - S8
  - S15
  - S16
  - S25
  - S26
  - S12
  - S13
  - S14
  - S27
- id: m7
  slug: firmware-dev
  phase_id: p3
  title: 펌웨어 개발
  estimated_hours: 10.0
  prerequisites:
  - m3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 동작 원리 및 통신 규약을 이해한다.
  - OpenCR 제어기의 구조와 센서 인터페이스(ADC) 사용법을 익힌다.
  - 텐던 기반 구동 시스템의 힘 피드백 제어 알고리즘을 설계한다.
  - 안전한 전원 관리와 물리적 계측 절차를 숙지한다.
  theory_markdown: '## DYNAMIXEL 스마트 액추에이터 제어

    로봇손의 구동은 12 V 전원 기반의 DYNAMIXEL XM430-W350-T를 사용합니다 [S12]. 이 액추에이터는 위치, 속도, 전류
    피드백을 실시간으로 제공하며, DYNAMIXEL Protocol 2.0을 통해 제어 명령을 수신합니다 [S12]. 각 액추에이터는 독립적인
    12 V 전원 분기를 통해 구동되며, 이는 정격 전류(2.3 A)를 고려한 안전한 전력 배분 방식입니다 [S12].


    ## OpenCR 제어기 및 데이터 수집

    OpenCR 1.0 보드는 216 MHz CPU를 탑재하여 액추에이터 명령과 센서 데이터를 처리합니다 [S14]. 특히 FSR 402 센서를
    활용한 손끝 힘 감지는 12비트 ADC를 통해 이루어지며, 3.3 V 센서 레일 전원과 10 kΩ 저항을 사용한 분압 회로를 구성하여 0~3.3
    V 범위 내 신호를 얻습니다 [S13, S14, S27]. 절대 5 V나 12 V 전원을 ADC 센서 레일에 직접 연결하지 않도록 주의해야
    합니다 [S14].


    ## 안전 및 계측 원칙

    전원 인가 상태에서 손가락 모듈을 직접 다루지 않으며, 반드시 소프트웨어적으로 토크 해제 후 물리적 전원 분리를 수행합니다. 접근 전 멀티미터를
    DC 전압 모드로 설정하여 모든 분기 전압이 1 V 이하임을 계측해야 합니다 [S16].'
  worked_examples:
  - '예제 1: FSR 분압 회로 설계. 10 kΩ 고정 저항과 FSR 402를 직렬 연결하고, 중간 노드를 OpenCR ADC 핀에 연결합니다.
    센서가 0.2 N에서 20 N 사이의 힘을 받을 때, 분압 원리에 의해 0~3.3 V 사이의 ADC 값이 출력되도록 계산 및 회로를 검증합니다
    [S13, S14, S27].'
  - '예제 2: DYNAMIXEL 액추에이터 통신. 11대의 액추에이터는 분기당 최대 4대씩 배분되며, 스톨 전류 합계가 퓨즈 정격(10 A)을
    초과하지 않도록 제어 코드를 작성하여 동시 고토크 발생 시 안전을 보장합니다 [S12, S26].'
  lab:
    title: 로봇손 펌웨어 운용 및 센서 데이터 검증
    steps:
    - 각 절연 전원 어댑터 3개를 분리한 상태에서 퓨즈 홀더와 커넥터 배선이 올바른지 멀티미터로 검토합니다.
    - OpenCR 제어기에 펌웨어를 업로드하고, FSR 센서 전압 분압 회로를 3.3 V 센서 레일에 연결합니다.
    - 전원을 인가하기 전, 각 분기의 물리적 연결을 확인하고 보안경을 착용합니다.
    - 전원 인가 후 각 액추에이터와 센서가 시리얼 모니터상에서 정상 통신되는지 확인합니다.
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
    safety:
    - 절대 12 V 액추에이터 전원과 3.3 V 센서 전원을 혼용하지 마십시오.
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
    - 회로 접근 전 멀티미터로 DC 전압 1 V 미만 확인은 필수 절차입니다.
    - 시험 운전 시 손을 가동 범위에 넣지 않도록 고정 지그를 사용하십시오.
    deliverables:
    - FSR 센서의 접촉력에 따른 ADC 수치 출력 로그
    - 액추에이터 개별 ID 설정 및 통신 응답 확인서
    - 전원 분기별 무부하 시 전압 측정 기록
  assignment:
    title: 로봇손 제어 및 데이터 수집 보고서
    deliverables:
    - 센서-펌웨어 통합 제어 코드
    - 전원 분기별 전류 배분 계산서
    - 최종 운용 및 안전 계측 보고서
    rubric:
    - FSR 데이터의 노이즈 없는 취득 여부
    - 액추에이터 분기별 정격 전류 관리의 적절성
    - 물리적 안전 계측 절차의 준수 및 기록
  quiz:
  - question: OpenCR 제어기에서 FSR 힘 센서의 전원을 공급하기 위해 사용해야 하는 올바른 전압 레일은?
    choices:
    - 12 V 액추에이터 레일
    - 3.3 V 센서 레일
    answer_index: 1
    explanation: OpenCR의 ADC 입력은 3.3 V를 초과하지 않아야 하며, 규정에 따라 3.3 V 센서 레일만을 사용해야 합니다
      [S14].
  - question: 정비 및 접근을 위해 시스템을 완전히 비활성화한 상태임을 어떻게 확인합니까?
    choices:
    - 소프트웨어적으로 모터를 정지시킨다.
    - 3개 전원 어댑터를 물리적으로 분리한 후 멀티미터 DC 모드로 1 V 이하를 확인한다.
    answer_index: 1
    explanation: 저항이나 연속성 모드는 전원 유무를 판단하는 증거가 될 수 없으며, 물리적 분리 후 DC 전압 측정이 필수입니다.
  - question: 각 분기 퓨즈(10 A)의 역할은 무엇입니까?
    choices:
    - 액추에이터의 고토크 작업을 보조한다.
    - 배선 고장 발생 시 과전류를 제한하여 시스템을 보호한다.
    answer_index: 1
    explanation: 퓨즈는 배선 고장 보호를 위한 것으로, 10 A 퓨즈는 분기당 액추에이터의 스톨 전류 합계를 고려하여 선정되었습니다
      [S26].
  completion_criteria:
  - FSR 센서 데이터를 정상적으로 시리얼 통신을 통해 확인 완료.
  - 모든 12 V 전원 분기가 독립적으로 구성되고 10 A 퓨즈가 장착됨.
  - 전원 물리적 분리 및 전압 측정 절차를 포함한 펌웨어 운용 보고서 제출.
  source_ids:
  - S5
  - S14
  - S12
  - S13
  - S27
  - S16
  - S26
- id: m8
  slug: sensing-integration
  phase_id: p3
  title: 센싱 및 제어
  estimated_hours: 10.0
  prerequisites:
  - m6
  - m7
  objectives:
  - FSR 402 센서와 분압 회로의 원리 이해 및 구성
  - OpenCR 제어기의 ADC 기능 활용 방법 습득
  - 센서 데이터 취득 시 신호 안정화 및 보정법 이해
  - 손끝 접촉력 데이터를 활용한 제어 로직 구현 기초 습득
  theory_markdown: "### 힘 감지 센서(FSR) 원리\nFSR(Force Sensing Resistor) 402는 압력이 증가함에\
    \ 따라 저항이 감소하는 고분자 두께 막(PTF) 센서입니다 [S13]. 이 센서는 접촉력을 연속적인 아날로그 값으로 변환할 수 있어 로봇손의\
    \ 파지력 피드백에 필수적입니다 [S13].\n\n### 분압 회로(Voltage Divider) 구성\nFSR은 단독으로 전압을 출력하지\
    \ 않습니다. 따라서 OpenCR 제어기에서 읽을 수 있는 0~3.3 V 범위의 전압 신호로 변환해야 합니다. \n- 센서와 10 kΩ 고정\
    \ 저항 [B-SENSOR-RESISTOR]을 직렬로 연결하여 전압 분압기를 구성합니다.\n- OpenCR의 3.3 V 센서 전원 레일을 사용하며,\
    \ 센서에서 출력된 전압은 OpenCR의 12비트 ADC를 통해 디지털 값으로 변환됩니다 [S14].\n\n### ADC 취득 및 신호 처리\n\
    OpenCR의 ADC는 최대 12비트 해상도를 제공하므로 0~4095의 디지털 값을 갖습니다 [S14]. 측정된 신호는 환경 노이즈나 기계적\
    \ 진동으로 인해 불안정할 수 있으므로, 이동 평균 필터 등을 사용하여 신호를 안정화해야 합니다."
  worked_examples:
  - '1. 전압 분압 계산: 3.3 V 공급 환경에서 FSR 저항이 10 kΩ, 고정 저항이 10 kΩ일 때 분압 전압 V_out = 3.3 *
    (10k / (10k + 10k)) = 1.65 V.'
  - '2. ADC 값 변환: 12비트 ADC에서 1.65 V는 (1.65 / 3.3) * 4095 = 2047.5, 즉 약 2048의 디지털 값으로
    취득됨.'
  lab:
    title: FSR 센서 인터페이싱 및 데이터 취득
    steps:
    - 1. FSR 402 센서의 단자 두 곳을 각각 OpenCR의 3.3 V 센서 전원과 아날로그 입력핀에 연결한다 [S13].
    - 2. 아날로그 입력핀과 GND 사이에 10 kΩ 저항을 배치하여 분압 회로를 구성한다 [B-SENSOR-RESISTOR].
    - 3. OpenCR의 ADC 입력값을 실시간으로 시리얼 모니터링한다 [S14].
    - 4. 센서 표면에 점진적으로 힘을 가하며 ADC 데이터 변화량을 관찰한다.
    safety:
    - 모든 회로 구성 전 전원 어댑터가 물리적으로 분리되어 있는지 확인한다.
    - OpenCR의 아날로그 핀에 3.3 V 이상의 전압이 인가되지 않도록 주의한다.
    - 납땜 시 보호용 보안경을 착용하고 환기가 되는 환경에서 작업한다.
    - 전원 인가 후에는 배선 연결 부위의 과열 여부를 멀티미터로 확인한다.
    deliverables:
    - 회로 구성 사진
    - ADC 데이터 수치 기록지
    - 힘 변화에 따른 ADC 응답 그래프
  assignment:
    title: 파지력 피드백 제어 로직 설계
    deliverables:
    - 센서 보정 함수 및 코드
    - 목표 접촉력 설정에 따른 텐던 구동 로직 보고서
    rubric:
    - 분압 회로의 정확한 결선 및 ADC 신호의 안정적 취득 여부
    - 센서 데이터의 선형성 또는 비선형성 보정 능력
    - 접촉력 피드백을 통해 텐던 장력을 제어하는 로직의 적절성
  quiz:
  - question: FSR 402 센서의 특징으로 올바른 것은 무엇입니까?
    choices:
    - 압력이 증가하면 저항이 증가한다.
    - 압력이 증가하면 저항이 감소한다.
    - 전압을 직접 출력하는 액티브 센서이다.
    - 정해진 하중 이상에서는 저항이 변하지 않는다.
    answer_index: 1
    explanation: FSR은 압력이 가해질수록 저항이 낮아지는 특성을 가집니다 [S13].
  - question: OpenCR 제어기에서 FSR 신호를 읽기 위해 전압 분압 회로를 구성할 때 사용해야 하는 센서 전원 레일은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - 3.3 V 센서 전원
    - 직접 외부 전원
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3 V까지 허용하며, 센서 전용 레일인 3.3 V 사용을 권장합니다.
  - question: 12비트 ADC를 사용하는 경우 출력될 수 있는 최대 디지털 값은 얼마입니까?
    choices:
    - '1023'
    - '2047'
    - '4095'
    - '8191'
    answer_index: 2
    explanation: 12비트 해상도는 2^12 = 4096개 값을 가지며, 0부터 4095까지 표시됩니다.
  completion_criteria:
  - 모든 센서 인터페이싱 회로의 정상 동작 확인
  - ADC 데이터의 노이즈 없는 취득 및 정량화 완료
  - 센서 피드백을 반영한 파지력 제어 구현 완료
  source_ids:
  - S13
  - S27
  - S14
- id: m9
  slug: testing-validation
  phase_id: p3
  title: 성능 시험 및 내구성 검증
  estimated_hours: 5.0
  prerequisites:
  - m8
  objectives:
  - 5지 로봇손의 성능 시험 방법과 내구성 검증 절차를 이해합니다.
  - 텐던 구동 시스템의 장력 유지 특성과 기계적 신뢰성을 평가합니다.
  - 실험 데이터를 바탕으로 시스템의 한계치와 유지보수 주기를 결정합니다.
  - 정밀 기계 시스템에서 안전한 정지 및 계측 확인 절차를 숙달합니다.
  theory_markdown: "### 5지 로봇손의 성능 및 내구성 검증 이론\n\n로봇손의 신뢰성은 기구적 강성, 액추에이터의 응답성, 그리고\
    \ 텐던(tendon)의 내마모성에 의해 결정됩니다. \n\n1. **성능 지표:** 로봇손의 핵심 성능은 반복 정밀도(repeatability)와\
    \ 최대 파지력입니다. 11개의 XM430-W350-T 액추에이터는 각각 최대 4.1 N·m의 스톨 토크를 제공하며[S12], 이를 통해 손가락\
    \ 끝에서 FSR 402 센서가 측정하는 파지력을 확보합니다[S13].\n\n2. **텐던 내구성:** Dyneema SK78 섬유는 매우\
    \ 낮은 신율(< 1%)과 높은 파단 하중(230 daN)을 가져 장기 반복 구동에 적합합니다[S17]. 그러나 캡스턴(capstan)과의\
    \ 마찰로 인한 국부 마모가 발생할 수 있으므로, 주기적인 장력 확인과 열화(degradation) 모니터링이 필수적입니다.\n\n3. **전력\
    \ 및 보호:** 시스템은 총 11대의 액추에이터를 3개의 독립적인 12 V 전원 분기로 나누어 운용합니다[S16]. 각 분기는 10 A ATOF\
    \ 퓨즈로 보호되며[S26], 이는 분기당 액추에이터들의 스톨 전류 합계(최대 9.2 A)를 고려한 설계입니다. 과전류 발생 시 퓨즈는 정격\
    \ 시간-전류 곡선에 따라 회로를 차단합니다[S26].\n\n4. **안전 절차:** 모든 기계적 접근 전, 3개 전원 어댑터를 물리적으로\
    \ 분리하고 각 분기의 DC 전압이 1 V 미만임을 멀티미터로 확인해야 합니다[S16]."
  worked_examples:
  - '예제 1: 액추에이터 11대의 스톨 전류 합계는 2.3 A × 11 = 25.3 A입니다. 3개의 12 V 전원 어댑터(각 11.5 A)를
    4대/4대/3대로 분배하면, 각 분기별 피크 전류는 9.2 A, 9.2 A, 6.9 A가 됩니다. 10 A 퓨즈는 각 분기의 정상 운전 범위를
    수용하면서 고장 전류를 보호할 수 있습니다[S12, S16, S26].'
  - '예제 2: FSR 402 센서와 10 kΩ 저항을 분압기로 사용할 때, ADC 값이 최대 3.3 V(OpenCR 센서 전원) 내에 들어오도록
    설정합니다. 이는 센서의 저항 변화에 따른 전압 출력을 안정적으로 취득하기 위함입니다[S13, S14, S27].'
  lab:
    title: 로봇손 내구성 및 기능 검증 실습
    steps:
    - 각 액추에이터의 전류 피드백을 기록하며 5지 로봇손을 무부하 상태에서 1,000회 왕복 구동합니다.
    - 텐던 장력을 측정하고, 1% 이상의 신율 변화나 육안상 손상 여부를 확인합니다.
    - FSR 센서에 표준 부하를 인가하여 ADC 신호의 선형성과 반복 정밀도를 검증합니다.
    - 모든 시험이 종료되면 3개 전원 어댑터를 물리적으로 분리하고, 멀티미터를 사용하여 1 V 미만의 잔류 전압을 확인합니다.
    safety:
    - 모든 구동 시험은 고정 지그에서 수행하며 가동 범위 내에 손을 넣지 않습니다.
    - 기계적 조립 및 시험 중 충격 방지 보안경을 필수 착용합니다.
    - 전원 인가 중에는 하드웨어 접근을 절대 금지하며, 물리적 분리 후 계측으로만 안전 상태를 판단합니다.
    deliverables:
    - 1,000회 구동 사이클 전류 데이터 로그
    - 텐던 마모 상태 점검 보고서
    - FSR 파지력 검증 데이터
    - 최종 내구성 검증 결과서
  assignment:
    title: 5지 로봇손 시스템 내구성 평가 보고서
    deliverables:
    - 성능 시험 및 내구성 검증 결과 데이터시트
    - 텐던 유지보수 주기 산정 제안서
    - 실험 중 관찰된 기구적 취약점 분석
    rubric:
    - 성능 시험 절차의 안전 규정 준수 여부(30%)
    - 데이터 취득의 정확성 및 해석의 타당성(40%)
    - 내구성 검증 기반 유지보수 계획의 구체성(30%)
  quiz:
  - question: 시스템 점검을 위해 로봇손에 접근하기 전 가장 먼저 수행해야 할 안전 절차는 무엇입니까?
    choices:
    - 제어 소프트웨어의 토크 해제 명령
    - 3개 전원 어댑터의 물리적 분리 및 전압 측정
    - 계획 정지 버튼 누름
    - 퓨즈 제거
    answer_index: 1
    explanation: 반드시 3개의 독립 전원 어댑터를 물리적으로 분리하고, 멀티미터로 각 분기의 잔류 전압이 1 V 미만인지 DC 전압
      모드에서 확인해야 합니다.
  - question: Dyneema SK78 텐던의 물리적 특징으로 올바른 것은?
    choices:
    - 높은 신율과 낮은 파단 하중
    - 낮은 신율(1% 미만)과 높은 파단 하중
    - 고온에서 급격한 물성 변화
    - 금속 텐던보다 낮은 강도
    answer_index: 1
    explanation: Dyneema SK78은 1% 미만의 낮은 작동 신율과 230 daN의 높은 파단 하중을 가져 장기 정밀 구동에 적합합니다.
  - question: 액추에이터 4대를 포함하는 분기에 적절한 퓨즈 정격은?
    choices:
    - 5 A
    - 10 A
    - 15 A
    - 20 A
    answer_index: 1
    explanation: 액추에이터 4대의 스톨 전류 합계(최대 9.2 A)를 고려할 때, 10 A 퓨즈는 정상 운전 범위를 허용하며 과전류로부터
      회로를 적절히 보호합니다.
