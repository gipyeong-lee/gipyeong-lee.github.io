- id: M3
  slug: control-theory
  phase_id: P1
  title: 제어 이론 기초
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 제어 시스템의 피드백 루프 원리와 PID 제어의 역할을 이해한다.
  - 로봇 시스템에서 사용되는 DYNAMIXEL 스마트 액추에이터의 제어 인터페이스를 학습한다.
  - 힘 감지 센서(FSR)를 이용한 힘 제어 루프를 설계하고 구현하는 방법을 습득한다.
  - 안전한 저전압 시스템 구성 및 전원 분기 관리 원칙을 체득한다.
  theory_markdown: "### 제어 시스템 기초 및 로봇 손 응용\n\n제어 시스템은 입력된 목표값(Setpoint)을 추종하도록 시스템의\
    \ 출력을 조절하는 과정이다 [S11]. 5지 로봇손에서 관절의 위치 제어와 손끝의 접촉력 제어는 핵심 과제이다. \n\n#### 1. PID\
    \ 제어 원리\n로봇 제어에는 주로 PID(비례-적분-미분) 제어기가 사용된다. \n- **비례(P) 제어**: 목표치와 현재값의 오차에 비례하여\
    \ 제어량을 결정한다. 오차가 클수록 강력하게 구동한다.\n- **적분(I) 제어**: 오차의 누적값을 제거하여 정상 상태 오차(Steady-state\
    \ error)를 보상한다.\n- **미분(D) 제어**: 오차 변화율에 반응하여 오버슈트를 억제하고 응답을 안정화한다.\n\n#### 2.\
    \ DYNAMIXEL 액추에이터 제어\n본 시스템은 11개의 XM430-W350-T 스마트 액추에이터를 사용한다 [B1]. 각 액추에이터는\
    \ 위치, 속도, 전류 피드백을 실시간으로 제공하며, DYNAMIXEL Protocol 2.0을 통해 OpenCR 제어기와 통신한다 [B1,\
    \ B2]. 각 액추에이터의 스톨 전류는 2.3 A이며 [B1], 11개 전체 피크 부하 시 전류 요구량은 설계 안전 마진을 고려하여 3개의\
    \ 독립된 12 V 전원 분기에 분산 공급되어야 한다 [B3].\n\n#### 3. FSR 힘 센서 인터페이스\n손끝에 배치된 FSR 402는\
    \ 가해지는 힘에 따라 저항이 변하는 센서이다 [B4, S15]. OpenCR의 ADC(12-bit)를 활용하여 정밀한 힘 데이터를 얻으려면\
    \ 10 kΩ 저항을 사용한 분압 회로를 구성해야 한다 [B-SENSOR-RESISTOR, B2]. 이 회로는 반드시 OpenCR의 3.3\
    \ V 센서 전원 레일에 연결되어야 하며, ADC 입력 전압이 0~3.3 V 범위를 넘지 않도록 설계해야 한다 [B2]."
  worked_examples:
  - '예제 1: 11개 액추에이터 전류 합계 계산. 각 액추에이터 스톨 전류가 2.3 A이므로 [B1], 전체 액추에이터가 동시에 스톨 상태일
    때 필요한 피크 전류는 11 * 2.3 A = 25.3 A이다. 이를 3개의 독립 분기(각 11.5 A 정격)에 배분하면, 4대/4대/3대씩
    나누어 배분 시 분기별 최대 9.2 A를 사용하게 되어 어댑터 허용 전류 범위 이내에서 안전하게 운용 가능하다 [B3].'
  - '예제 2: FSR 센서 전압 분압기 설계. FSR 402와 10 kΩ 저항을 직렬 연결하여 OpenCR ADC 포트에 연결한다. 센서 전압(V_out)은
    V_out = 3.3 V * (R_FSR / (R_FSR + 10 kΩ))으로 계산된다. 힘이 가해지지 않을 때 R_FSR은 매우 높으므로
    V_out은 3.3 V에 가깝고, 힘이 최대(20 N)일 때 R_FSR은 낮아져 V_out은 0 V에 가까워진다 [S15, S28].'
  lab:
    title: 힘 제어 루프 기초 실험
    steps:
    - 각 독립 분기의 전원 어댑터 출력과 액추에이터 퓨즈 블록 연결 상태를 멀티미터로 검증한다.
    - OpenCR의 3.3 V 전원을 이용하여 FSR 전압 분압 회로를 브레드보드에 구성한다.
    - 멀티미터를 사용하여 FSR 출력 전압이 0~3.3 V 이내임을 확인한다.
    - OpenCR을 통해 액추에이터 위치 명령을 보내고 센서값에 따른 피드백 제어 코드를 작성한다.
    - 무부하 상태에서 로봇손의 가동 범위를 시험하고 관절의 이동을 확인한다.
    safety:
    - 실험 전 반드시 보안경을 착용한다.
    - 전원 인가 중 손을 로봇손의 가동 범위에 넣지 않는다.
    - 실험 중 정지는 3개의 절연 전원 어댑터를 물리적으로 분리하고, 모든 분기에서 1 V 미만의 DC 전압이 측정됨을 확인한 후 접근한다.
    - 절대 전원 어댑터의 positive 출력들을 서로 연결하지 않는다.
    deliverables:
    - FSR 전압 출력 측정 데이터 보고서
    - PID 위치 제어 코드 및 결과 그래프
    - 무부하 동작 시험 결과 기록
  assignment:
    title: 로봇손 힘 제어 알고리즘 설계
    deliverables:
    - 제어 알고리즘 설계 문서
    - 소스 코드(C++ 기반)
    - 힘 제어 성능 시험 분석 보고서
    rubric:
    - PID 제어 루프의 정상 동작 여부
    - FSR 데이터의 ADC 변환 정확도
    - 독립 분기 전원 시스템의 안전 설계 준수 여부
    - 보고서의 데이터 해석 및 기술적 논리성
  quiz:
  - question: 로봇손 전체 액추에이터(11대)의 스톨 전류 합계는 얼마인가?
    choices:
    - 2.3 A
    - 25.3 A
    - 11.5 A
    - 34.5 A
    answer_index: 1
    explanation: 각 액추에이터의 스톨 전류가 2.3 A이므로 11대를 곱하면 25.3 A가 됩니다 [B1].
  - question: FSR 센서 회로를 구성할 때 OpenCR에서 권장되는 공급 전압은 무엇인가?
    choices:
    - 12 V
    - 5 V
    - 3.3 V
    - 24 V
    answer_index: 2
    explanation: FSR 전압 분압 회로는 OpenCR의 3.3 V 센서 레일에서 공급되어야 하며 0~3.3 V 범위를 유지해야 합니다
      [B2].
  - question: 전원 어댑터 출력의 (+) 단자를 병렬로 연결해도 되는가?
    choices:
    - 가능하다.
    - 절대 금지된다.
    answer_index: 1
    explanation: 독립 분기로 구성된 전원 어댑터의 positive 출력들을 병렬로 연결하는 것은 절대 금지되며, 각 어댑터는 할당된
      분기에서 독립적으로 사용되어야 합니다 [B3].
  completion_criteria:
  - 실험 데이터 및 소스 코드가 포함된 최종 결과 보고서 제출
  - 모든 실습 과정에서 전원 분리 및 전압 측정 안전 수칙 준수 기록
  - 퀴즈에서 80% 이상 득점
  source_ids:
  - S11
  - S15
  - S28
- id: M4
  slug: 3d-printing
  phase_id: P2
  title: 구조물 제작
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)의 물성 이해 및 FDM 3D 프린팅 최적화 조건 습득
  - 열압입 인서트(Heat-set Insert)를 활용한 반복 조립 가능한 기구 구조 설계
  - 슬리브 베어링과 정밀 샤프트를 활용한 저마찰 회전 관절 구현
  - 적층 제조 공정의 안전 수칙 및 엔지니어링 소재 취급법 숙지
  theory_markdown: '## 엔지니어링 소재와 적층 제조


    5지 로봇손과 같은 고부하 로봇 구조물은 높은 강성과 내열성, 치수 안정성이 요구됩니다. 탄소섬유가 보강된 PC(폴리카보네이트) 필라멘트(PC-CF)는
    뛰어난 인장 강도와 열변형 온도를 제공하여 이러한 요구사항을 만족시킵니다 [S22].


    ### FDM 공정의 핵심 요소

    - **노즐 선택**: 탄소섬유는 고도로 마모성이 강하여 일반 황동 노즐을 빠르게 손상시킵니다. 반드시 경화강(Hardened steel)
    노즐을 사용해야 합니다 [S22].

    - **온도 제어**: PC-CF는 높은 용융점(권장 노즐 온도 285 °C)과 베드 온도(110 °C)를 필요로 합니다 [S22]. 충분한
    예열과 적절한 안착 환경이 치수 정확도를 결정합니다.


    ### 반복 조립과 기구 연결

    로봇손은 정비와 부품 교체를 위해 반복적인 분해 조립이 필수적입니다. 출력물에 직접 나사를 체결하는 방식은 소재를 깎아내어 유격을 발생시킵니다.
    이를 방지하기 위해 황동 열압입 인서트(M3 HTBI-M3-BR)를 사용합니다 [S24].

    - **설계 원칙**: 인서트 외경(4.4 mm)보다 약간 작은 파일럿 홀(권장 4.0 mm)을 설계하여 인서트가 플라스틱 내부에 견고하게
    고정되도록 합니다 [S24].


    ### 저마찰 관절 설계

    로봇 관절의 마찰과 유격 관리는 제어 성능에 직결됩니다. 무급유 폴리머 슬리브 베어링(JSM-0810-10)은 무급유 운용 환경에서 낮은 마찰
    계수를 유지하며, 정밀 가공된 8 mm 알루미늄 샤프트와 조합하여 안정적인 회전 성능을 제공합니다 [S20, S21].'
  worked_examples:
  - '예제 1: PC-CF 출력물 나사산 설계. M3 열압입 인서트(외경 4.4 mm)를 조립하기 위한 파일럿 홀 지름을 4.0 mm로 설계하고,
    깊이는 인서트 길이 5.8 mm보다 0.5 mm 깊게 설계하여 인서트가 튀어나오지 않도록 함 [S24].'
  - '예제 2: 관절 공차 관리. 8 mm 샤프트를 JSM-0810-10 베어링에 사용할 때, 하우징 보어 공차를 베어링 외경 10 mm에 맞춰
    설계하여 압입 시 내경이 규정 공차 내로 확보되도록 함 [S20].'
  lab:
    title: 로봇손 관절 링크 제작 및 시험
    steps:
    - 경화강 노즐을 장착하고 FDM 프린터 베드를 110 °C로 예열한다 [S22].
    - 제공된 CAD 도면을 바탕으로 PC-CF 필라멘트를 사용하여 손가락 링크와 프레임을 출력한다 [S22].
    - 출력물의 파일럿 홀(4.0 mm)에 황동 인서트를 인두기로 열압입한다 [S24].
    - 제작된 링크 하우징에 JSM-0810-10 베어링을 압입한다 [S20].
    - 8 mm 정밀 샤프트를 관절 축으로 사용하여 링크를 조립하고 유격과 부드러운 회전을 확인한다 [S21].
    safety:
    - 출력물 제거 및 인두기 사용 시 화상 방지를 위해 장갑을 착용한다.
    - 경화강 노즐 교체 및 조립 시 수공구 취급에 주의한다.
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고 무전원 상태를 멀티미터로 계측하여 확인한다.
    - 부품 조립 및 시험 시 보안경을 상시 착용한다.
    deliverables:
    - 제작된 로봇손 링크 및 프레임 완성품
    - 인서트 압입 상태 및 샤프트 결합 정밀도 측정 기록
    - 관절 회전 마찰 및 유격 확인 보고서
  assignment:
    title: 로봇손 부품 정밀 설계 및 BOM 검토
    deliverables:
    - 로봇손 기구물 조립 도면 및 부품 리스트(BOM)
    - 열압입 인서트 및 베어링 체결 설계 검토 보고서
    rubric:
    - BOM에 명시된 사양과 부품(M3 인서트, 8 mm 샤프트 등)이 설계 도면에 정확히 반영되었는가?
    - 열압입 인서트 파일럿 홀 규격(4.0 mm)이 설계에 준수되었는가?
    - PC-CF 필라멘트 특성을 고려한 출력물 설계 보강이 이루어졌는가?
  quiz:
  - question: PC-CF 필라멘트 출력 시 경화강 노즐을 사용해야 하는 이유는 무엇입니까?
    choices:
    - 열 전도율이 황동보다 훨씬 높기 때문
    - 탄소섬유가 황동 노즐을 마모시키기 때문
    - 출력물의 색상을 검정색으로 유지하기 위해
    - 더 높은 용융 온도를 견디기 위해서
    answer_index: 1
    explanation: 탄소섬유는 연마성이 강해 황동 노즐을 빠르게 마모시키므로 반드시 경화강 노즐을 사용해야 합니다 [S22].
  - question: JSM-0810-10 베어링과 함께 사용할 때 가장 권장되는 샤프트 소재와 규격은?
    choices:
    - 10 mm 황동 샤프트
    - 8 mm 스테인리스 샤프트
    - 8 mm 정밀 알루미늄 샤프트
    - 7 mm 폴리머 샤프트
    answer_index: 2
    explanation: JSM-0810-10 베어링은 내경 8 mm 규격이며, 이와 호환되는 정밀 알루미늄 샤프트(AWMP-08) 사용이 권장됩니다
      [S20, S21].
  - question: 열압입 인서트 조립 시 적절한 파일럿 홀 설계 방법은?
    choices:
    - 인서트 외경보다 2 mm 크게 설계
    - 인서트 외경보다 약간 작게(4.0 mm) 설계
    - 나사산 지름보다 크게 설계
    - 홀 없이 출력 후 드릴로 관통
    answer_index: 1
    explanation: 열압입 인서트는 외경(4.4 mm)보다 약간 작은 홀(4.0 mm)에 열을 가해 조립하여 견고하게 고정되도록 합니다
      [S24].
  completion_criteria:
  - PC-CF 필라멘트를 사용한 링크 구조물 조립 완료
  - 정밀 샤프트와 베어링을 통한 부드러운 관절 구동 검증
  - 안전 절차 준수 및 계측을 통한 무전원 상태 확인
  source_ids:
  - S10
  - S22
  - S24
  - S20
  - S21
- id: M5
  slug: actuator-integration
  phase_id: P2
  title: 액추에이터 및 동력 전달
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - DYNAMIXEL XM430-W350-T 액추에이터의 동작 원리와 통신 사양을 이해한다.
  - 로봇 손 구동을 위한 텐던 구동 시스템의 기계적 이점을 파악한다.
  - 독립 전원 분기 구성과 안전한 액추에이터 통합 방식을 설계한다.
  - OpenCR 제어기를 이용한 액추에이터 제어 및 전원 관리 기법을 학습한다.
  theory_markdown: '## 액추에이터와 텐던 구동 시스템


    ### DYNAMIXEL XM430-W350-T

    로봇 손의 정밀한 제어를 위해 토크, 위치, 전류 피드백을 통합적으로 제공하는 DYNAMIXEL XM430-W350-T를 사용한다. 이 액추에이터는
    12V 전압에서 동작하며, 스톨 전류는 2.3A, 스톨 토크는 4.1N·m에 달한다 [S14]. 로봇의 안정적인 운영을 위해서는 액추에이터의
    정격 스톨 전류 합계가 전체 공급 전류 능력을 초과하지 않도록 설계해야 한다 [B3].


    ### 텐던(Tendon) 기반 동력 전달

    인간의 손 구조를 모방한 로봇 손은 링크를 직접 구동하기보다 Dyneema SK78 고강도 섬유 텐던(지름 1.5mm, 파단 하중 230daN)을
    사용하여 원격 구동한다 [B6, S19]. Dyneema 소재는 신율이 1% 미만으로 매우 낮아 정밀한 위치 제어가 가능하며 [S19], 반복적인
    구동에 강하다. 텐던은 회전축에서 링크 끝단까지 힘을 전달하며, 이때 마찰을 최소화하기 위해 igus사의 무급유 폴리머 슬리브 베어링(JSM-0810-10)을
    사용한다 [B8, S20].


    ### 독립 전원 분기 및 안전 설계

    전원 공급은 Meanwell GST160A12-R7B 어댑터를 활용하며, 11.5A 정격의 독립된 세 개 분기로 구성된다 [B3, S18].
    분기별로 10A ATOF 퓨즈를 장착하여 과전류 발생 시 배선을 보호한다 [B10, S27]. 각 전원 어댑터는 전기적으로 독립되어 있으므로
    양(+) 출력을 합치지 않고 할당된 액추에이터 그룹별로 개별 공급해야 한다 [B3].'
  worked_examples:
  - '예제 1: 전원 용량 산정. XM430-W350-T 액추에이터 11개를 사용할 경우, 전체 스톨 전류는 11 * 2.3A = 25.3A이다
    [B1]. 우리가 사용하는 3개의 전원 어댑터 합계 전류는 11.5A * 3 = 34.5A이므로, 25.3A의 피크 전류를 충분히 수용할 수
    있다 [B3].'
  - '예제 2: 퓨즈 정격 선정. 각 분기당 액추에이터가 최대 4대일 경우 피크 전류 합계는 4 * 2.3A = 9.2A이다. 따라서 10A ATOF
    퓨즈는 정격 동작 시에는 작동하지 않으나, 치명적인 과전류 발생 시 퓨즈 시간-전류 곡선에 따라 배선을 안전하게 보호할 수 있다 [B10,
    S27].'
  lab:
    title: 액추에이터 통합 및 저전압 전원 분기 검증
    steps:
    - 각 12V 절연 어댑터 출력에 퓨즈 홀더와 10A 퓨즈를 순차적으로 배선한다 [B3, B-WIRING-FUSE-HOLDER].
    - 멀티미터를 DC 전압 모드로 설정하고, 분리된 각 분기의 전압이 12V DC인지 확인한다.
    - OpenCR 제어기 포트에 액추에이터를 연결하고 DYNAMIXEL Wizard 2.0 소프트웨어를 통해 각 액추에이터의 ID를 할당하고
      통신 상태를 확인한다 [S14, S16].
    - 전원 인가 전 손가락 모듈을 고정 지그에 장착하고 무부하 상태에서 초기 텐던 장력을 설정한다.
    safety:
    - 반드시 충격 방지 작업용 보안경을 착용한다.
    - 전원 인가 상태에서는 절대 배선을 변경하거나 단자를 만지지 않는다.
    - 실험 정지 시 3개의 전원 어댑터를 물리적으로 분리한 후 멀티미터 DC 전압 모드로 1V 미만임을 확인하고 접근한다.
    - 전원 합선 방지를 위해 분기 간의 (+) 출력은 절대 전기적으로 연결하지 않는다.
    deliverables:
    - 분기별 전압 측정 데이터 기록
    - 액추에이터 통신 테스트 결과 스크린샷
    - 텐던 장력 설정 및 기구적 간섭 체크 리포트
  assignment:
    title: 로봇 손 전원 및 액추에이터 배선 설계도 작성
    deliverables:
    - 11대 액추에이터의 3개 분기 배분도(4/4/3 배치)
    - OpenCR 제어기 및 퓨즈 보호 회로가 포함된 통합 배선도
    - 사용된 부품의 수량과 안전 사양 검증 보고서
    rubric:
    - 독립 전원 분기 원칙 준수 여부(전원 어댑터 출력 병렬 금지)
    - 퓨즈 정격 및 액추에이터 스톨 전류 합계에 대한 적절한 설계
    - 배선도의 명확성 및 부품 규격 일치성
  quiz:
  - question: DYNAMIXEL XM430-W350-T 액추에이터의 스톨 전류는 얼마인가?
    choices:
    - 1.5 A
    - 2.3 A
    - 4.1 A
    - 11.5 A
    answer_index: 1
    explanation: XM430-W350-T의 스톨 전류는 2.3 A입니다 [B1, S14].
  - question: 절연형 전원 어댑터 GST160A12-R7B의 3개 출력은 어떻게 관리해야 하는가?
    choices:
    - 전류 용량 증대를 위해 모두 병렬로 연결한다.
    - 하나의 메인 버스에 연결하여 관리한다.
    - 독립된 분기로 유지하며 각기 다른 액추에이터 그룹에 공급한다.
    - 전압을 낮추기 위해 직렬로 연결한다.
    answer_index: 2
    explanation: 전원 어댑터의 (+) 출력은 병렬 연결이 절대 금지되며, 각 출력은 독립된 분기로 사용하여 안전하게 배분해야 합니다
      [B3].
  - question: 분기 회로 보호를 위해 사용하는 퓨즈의 정격은 얼마인가?
    choices:
    - 5 A
    - 10 A
    - 15 A
    - 20 A
    answer_index: 1
    explanation: 액추에이터의 피크 전류를 보호하기 위해 10 A ATOF 퓨즈를 사용합니다 [B10, S27].
  completion_criteria:
  - 각 액추에이터 그룹이 독립된 퓨즈 분기에 의해 안전하게 전원을 공급받음이 입증됨.
  - 모든 액추에이터가 제어기와 통신 가능하며 위치 제어 시험을 통과함.
  - 안전 검증 절차(무전원 측정 등)를 준수하여 실습이 수행됨.
  source_ids:
