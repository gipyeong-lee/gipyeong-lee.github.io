    - 멀티미터 저항 모드로 도통 확인
    - 퓨즈가 연결되어 있는지 육안 확인
    - 3개 전원을 물리적으로 분리하고 멀티미터 DC 전압 모드로 1V 미만 확인
    - 비상정지 버튼을 눌렀는지 확인
    answer_index: 2
    explanation: 저항 모드는 도통 확인에 부적합합니다. 반드시 전원을 분리한 후 DC 전압 모드로 잔류 전압을 확인해야 합니다.
