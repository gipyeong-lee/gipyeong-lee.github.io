- id: mod10
  slug: final-evaluation
  phase_id: phase4
  title: 최종 검증 및 프로젝트 마무리
  estimated_hours: 5.0
  prerequisites:
  - mod9
  objectives:
  - 5지 로봇손 하드웨어 및 펌웨어 통합 검증 방법을 이해한다.
  - 정전류 보호 및 하드웨어 안전 절차를 실습한다.
  - 파지 성능 및 반복 정밀도를 정량적으로 평가한다.
  - 문제 해결을 위한 시스템 로그 분석 및 보정 절차를 익힌다.
  theory_markdown: '### 시스템 검증 및 성능 최적화

    로봇손 프로젝트의 마지막 단계는 하드웨어와 소프트웨어의 통합 안정성을 확보하는 것입니다. 정밀한 파지 작업을 위해서는 액추에이터의 상태 정보(위치,
    속도, 부하 전류)와 센서의 피드백(힘)이 실시간으로 동기화되어야 합니다. 로봇 제어 보드인 OpenCR은 216MHz의 클럭 주파수로 펌웨어를
    실행하며, 각 액추에이터의 상태를 실시간으로 제어합니다 [S14].


    #### 시스템 전원 안정성

    전원 분기는 액추에이터의 피크 전류를 안전하게 감당하기 위해 필수적입니다. 11개의 XM430-W350-T 액추에이터는 각각 최대 2.3 A의
    스톨 전류를 발생시킬 수 있으며 [S12], 총 피크 부하를 고려하여 3개의 독립적인 12 V 전원 분기를 구성합니다. 각 분기는 10 A
    ATOF 퓨즈로 과전류 보호를 수행하여 배선 고장 시 화재 위험을 방지합니다 [S24, S25]. 전원 분기 어댑터의 양(+) 단자를 병렬로
    연결하는 것은 절대 금지이며, 각 독립된 어댑터가 지정된 액추에이터 그룹에만 전력을 공급해야 합니다.


    #### 데이터 피드백 및 센서 교정

    FSR 402 센서는 0.2 N에서 20 N 사이의 힘을 감지합니다 [S13]. 10 kΩ 분압 저항을 사용하여 [S26] 3.3 V 센서
    전원을 기준으로 전압 분압 회로를 구성하고, OpenCR의 12-bit ADC 입력으로 읽어 들입니다 [S14]. 측정 데이터는 기계적 변형이나
    온도 변화에 따라 편차가 발생할 수 있으므로, 주기적인 기준값(Offset) 교정이 필요합니다.'
  worked_examples:
  - '예제 1: 시스템 무전원 확인 절차. 전원 어댑터 3개를 콘센트에서 분리하고 5분 대기 후, 각 분기 전원 커넥터 양단 전압이 1 V 미만인지
    멀티미터 DC 전압 모드로 측정하여 안전 상태를 확인한다.'
  - '예제 2: 퓨즈 부하 계산. 1개 분기에 4대의 액추에이터가 배치된 경우, 최대 스톨 전류 합계는 9.2 A입니다 [S12]. 이 경우 10
    A 퓨즈는 정격 범위 내에서 안전하게 보호 기능을 수행합니다 [S25].'
  lab:
    title: 로봇손 무부하 통합 구동 및 센서 교정
    steps:
    - 모든 전원 연결을 분리한 상태에서 커넥터 체결 상태를 확인한다.
    - 소프트웨어 제어기로 각 액추에이터의 통신 연결을 확인한다.
    - 안전 보안경을 착용하고, 고정 지그에 장착된 로봇손에 독립된 전원을 순차적으로 인가한다.
    - 무부하 상태에서 각 손가락의 텐던 장력을 초기화하고 관절의 가동 범위를 점검한다.
    - FSR 센서가 미압착 상태일 때의 ADC 기준값을 기록하여 오프셋을 보정한다.
    safety:
    - 전원 인가 중에는 절대로 손을 로봇손의 가동 범위 내에 넣지 않는다.
    - 모든 정비 및 접근 작업 전 3개 전원 어댑터를 물리적으로 분리하고 1 V 미만인지 확인한다.
    - 퓨즈는 과전류 보호용이므로 비상 정지 용도로 절대 사용하지 않는다.
    - 이 프로토타입은 기계 안전 인증을 받지 않았으므로 사람 접근 환경에 절대 사용하지 않는다.
    deliverables:
    - 관절 가동 범위별 액추에이터 전류 피드백 로그
    - FSR 센서 오프셋 교정 데이터 테이블
    - 시스템 무부하 구동 최종 검토 보고서
  assignment:
    title: 최종 프로젝트 완료 보고서
    deliverables:
    - 최종 CAD 도면 및 펌웨어 소스 코드
    - 파지 시험 결과 및 내구 시험 기록
    - 시스템 배선도 및 안전 절차 준수 확인서
    rubric:
    - 하드웨어 조립 및 배선이 BOM과 배선도에 부합하는가?
    - 모든 퓨즈 분기 및 센서 회로가 규정된 전압/전류 정격을 준수하는가?
    - 제어 펌웨어가 5지 파지 동작을 재현성 있게 수행하는가?
    - 안전 절차(무전원 계측 확인 등)를 정확하게 수행하였는가?
  quiz:
  - question: 1개 분기에 4대의 액추에이터가 할당되었을 때 퓨즈가 보호할 수 있는 최대 스톨 전류는 얼마입니까?
    choices:
    - 4.6 A
    - 9.2 A
    - 15 A
    - 32 A
    answer_index: 1
    explanation: 각 액추에이터(XM430-W350-T)의 스톨 전류는 2.3 A이므로, 4대 구동 시 합계는 2.3 * 4 = 9.2
      A입니다 [S12].
  - question: 로봇손의 전원을 차단하고 안전하게 접근하는 방법으로 옳은 것은 무엇입니까?
    choices:
    - 소프트웨어로 토크를 해제한 뒤 즉시 접근한다.
    - 인라인 퓨즈를 뽑고 접근한다.
    - 전원 어댑터 3개를 모두 물리적으로 분리한 뒤, 멀티미터로 각 전원 분기의 전압이 1 V 미만임을 측정한다.
    - 멀티미터의 저항 모드로 회로가 끊어졌는지 확인하고 접근한다.
    answer_index: 2
    explanation: 가장 안전한 방법은 모든 전원을 물리적으로 분리하고 전압 모드로 잔류 전압이 1 V 미만인지 직접 확인하는 것입니다.
  completion_criteria:
  - 통합 무부하 구동 시험에서 11개 액추에이터가 정상 작동함을 확인.
  - 모든 센서 오프셋이 교정되어 0~20 N 범위의 힘 측정이 가능함.
  - 최종 프로젝트 보고서 제출 및 기술 검토 완료.
  - 안전 절차를 완벽히 이해하고 수행했음을 입증하는 로그 제출.
