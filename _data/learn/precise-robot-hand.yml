- id: M3
  slug: frame-printing
  phase_id: PH2
  title: 3D 프린팅 및 구조 제작
  estimated_hours: 15.0
  prerequisites:
  - M2
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)의 물성 이해
  - FDM 3D 프린터의 기술적 제약과 공정 변수 최적화 학습
  - 경화강 노즐 사용 및 장비 유지보수의 중요성 이해
  - 로봇 구조물의 강성과 치수 안정성을 확보하는 출력 전략 설계
  theory_markdown: "### 3D 프린팅 구조물 설계 및 제작\n\n정교한 5지 로봇손 제작을 위해 사용되는 **Prusament PC\
    \ Blend Carbon Fiber(PC-CF)** 필라멘트는 일반 PC 소재에 탄소섬유를 첨가하여 강성과 치수 안정성을 극대화한 엔지니어링\
    \ 소재입니다 [S20]. \n\n#### 1. 재료 특성 및 공정 조건\nPC-CF는 일반적인 PLA나 PETG와 달리 높은 출력 온도를\
    \ 요구합니다. 공식 권장 노즐 온도는 **285°C**, 베드 온도는 **110°C**입니다 [S20]. 탄소섬유는 소재에 강성을 부여하지만,\
    \ 동시에 마모성이 매우 높습니다. 따라서 일반 황동 노즐을 사용할 경우 노즐 내경이 빠르게 마모되어 정밀한 치수 출력이 불가능해지므로 반드시\
    \ **경화강(Hardened Steel) 노즐**을 사용해야 합니다 [S20].\n\n#### 2. 설계 및 출력 전략\n로봇손의 링크와\
    \ 프레임은 동적인 하중을 견뎌야 하므로 구조적 강성이 중요합니다. \n- **방향성(Anisotropy):** FDM 출력물은 적층 방향에\
    \ 따라 인장 강도가 다릅니다. 주 응력이 가해지는 방향이 적층 평면과 일치하도록 부품 배향을 결정해야 합니다.\n- **치수 관리:** PC-CF는\
    \ 수축률이 낮아 치수 안정성이 좋지만, 인서트 너트나 베어링이 삽입되는 부분은 설계 시 공차를 고려해야 합니다. M3 열압입 인서트는 외경이\
    \ 4.4 mm이므로, 출력물에는 **4.0 mm 파일럿 홀**을 설계하여 최적의 끼움맞춤을 확보합니다 [S22].\n- **표면 마감:**\
    \ 경화강 노즐은 열전도율이 낮으므로 노즐 온도를 일정하게 유지하는 것이 중요하며, 출력 시 팬 속도를 제어하여 층간 접착력을 높여야 합니다."
  worked_examples:
  - '사례 1: 인서트 홀 설계. M3 열압입 인서트(HTBI-M3-BR) 사용 시 설계 프로그램에서 파일럿 홀 지름을 4.0 mm로 설정하여
    인서트가 중심에 위치하도록 설계한다 [S22].'
  - '사례 2: 적층 배향. 손가락 링크의 인장 강도를 높이기 위해, 텐던이 작용하는 주 하중 방향이 프린팅의 Z축(적층 방향)이 아닌 XY 평면과
    평행하게 출력되도록 부품을 눕혀서 배치한다 [S20].'
  lab:
    title: 로봇 프레임 출력 및 조립 준비
    steps:
    - FDM 프린터에 경화강 노즐을 장착하고 올바르게 체결되었는지 확인한다 [S20].
    - 슬라이서 소프트웨어에서 소재 물성치에 맞춰 노즐 온도 285°C, 베드 온도 110°C를 설정한다 [S20].
    - 손가락 링크와 손바닥 프레임 모델을 출력한다.
    - 출력물 냉각 후 버니어 캘리퍼스로 주요 치수(베어링 삽입부, 파일럿 홀)를 측정하여 설계값과 비교한다 [S18, S22].
    - 인서트 홀에 열압입 인서트를 조심스럽게 가열하여 삽입하고 수직도를 확인한다 [S22].
    safety:
    - 베드 온도가 110°C로 매우 높으므로 화상에 주의하고 냉각 후 접근한다 [S20].
    - 경화강 노즐 교체 시 가열된 노즐에 의한 화상 위험이 있으므로 보호 장갑을 착용한다.
    - 후가공(서포트 제거) 시 보안경을 반드시 착용하여 파편으로부터 눈을 보호한다.
    deliverables:
    - 출력된 5지 로봇손 프레임 세트
    - 치수 측정 기록이 포함된 작업 일지
    - 열압입 인서트 삽입 품질 검증 사진
  assignment:
    title: 로봇손 구조 설계 및 공정 보고서 작성
    deliverables:
    - 설계된 부품의 적층 배향 결정 근거를 기술한 보고서
    - 파일럿 홀과 베어링 하우징 공차 측정 데이터 시트
    - 최적화된 출력 프로파일 스크린샷
    rubric:
    - 적층 배향의 이유가 로봇손의 동적 하중 관점에서 논리적인가?
    - 파일럿 홀 크기가 인서트 규격과 일치하여 조립성이 확보되었는가?
    - 경화강 노즐 사용 및 소재 물성에 따른 온도 설정이 올바른가?
  quiz:
  - question: PC-CF 필라멘트 출력 시 반드시 경화강 노즐을 사용해야 하는 주된 이유는 무엇인가?
    choices:
    - 열전도율이 황동보다 훨씬 높아서
    - 탄소섬유의 높은 마모성으로 황동 노즐이 빠르게 손상되기 때문에
    - 경화강 노즐이 더 저렴해서
    - PC-CF는 황동 노즐에서 출력되지 않기 때문에
    answer_index: 1
    explanation: 탄소섬유는 매우 연마성이 강한 재료이므로 일반 황동 노즐을 사용하면 내경이 빠르게 마모되어 출력 정밀도가 떨어집니다
      [S20].
  - question: 설계 시 M3 열압입 인서트(HTBI-M3-BR)를 위한 파일럿 홀의 적절한 크기는?
    choices:
    - 3.0 mm
    - 4.4 mm
    - 4.0 mm
    - 5.8 mm
    answer_index: 2
    explanation: 공식 데이터시트에 명시된 권장 홀 지름은 4.0 mm입니다 [S22].
  completion_criteria:
  - 실습 단계의 모든 프레임 부품 출력 완료
  - 치수 측정 결과가 오차 범위 이내임을 확인
  - 열압입 인서트의 조립이 성공적으로 수행됨
  - 구조 설계 및 공정 보고서 제출
  source_ids:
  - S20
  - S22
  - S18
- id: M4
  slug: assembly
  phase_id: PH2
  title: 관절 및 베어링 조립
  estimated_hours: 10.0
  prerequisites:
  - M3
  objectives:
  - DYNAMIXEL XM430-W350-T 액추에이터의 기구적 특성과 조립 정밀도 이해
  - igus JSM-0810-10 폴리머 베어링과 8 mm 정밀 샤프트의 올바른 결합 방식 습득
  - M3 황동 열압입 인서트(HTBI-M3-BR)를 이용한 PC-CF 출력물의 반복 조립 구조 설계
  - 텐던(Dyneema SK78) 경로와 캡스턴 장력 관리의 중요성 학습
  theory_markdown: '## 정밀 관절 조립 이론


    로봇손 관절 조립은 공차 관리와 재현성이 핵심입니다. 특히 FDM 3D 프린팅된 PC-CF(탄소섬유 강화 폴리카보네이트) 파트는 높은 강성을
    가지지만, 금속 부품과의 조립에서 열팽창 및 치수 정밀도에 유의해야 합니다 [S20].


    ### 1. 베어링과 샤프트의 결합

    Igus JSM-0810-10 폴리머 슬리브 베어링은 무급유 운전이 가능하며, 8 mm 정밀 알루미늄 샤프트(AWMP-08)와 결합하여 유격을
    최소화합니다 [S18, S19]. 압입 시 하우징 보어 공차가 베어링 내경에 직접 영향을 미치므로, 설계된 공차 범위 내에서 조립하는 것이
    필수적입니다 [S18].


    ### 2. 열압입 인서트(Heat-Set Inserts)

    플라스틱 출력물에 반복적인 분해 조립이 필요한 경우, M3 황동 인서트(HTBI-M3-BR)를 사용합니다 [B9, S22]. 인서트를 가열하여
    삽입하면 플라스틱이 연화되어 나사산 주위를 감싸며, 냉각 후 높은 풀아웃 강도를 제공합니다 [S22].


    ### 3. 텐던 장력 관리

    Dyneema SK78(1.5 mm) 텐던은 신율이 1% 미만인 고강도 섬유로, 관절 구동력을 전달하는 핵심 요소입니다 [S17]. 장력이
    불균형하면 손가락이 비정상적인 궤적을 그리거나 액추에이터에 과부하를 초래합니다 [S17]. 캡스턴 설계 시 모서리 라운딩 처리를 통해 마찰
    마모를 방지해야 합니다 [S17].'
  worked_examples:
  - '예제 1: M3 황동 인서트 삽입 깊이 계산. 인서트 길이 5.8 mm를 고려하여 PC-CF 파트의 파일럿 홀 깊이가 최소 6.0 mm 이상인지
    확인하고, 인두기 온도를 사용하여 인서트 외경(4.4 mm)과 호환되는 4 mm 구멍에 수직으로 압입합니다 [S22].'
  - '예제 2: 텐던 신율 보상. Dyneema SK78의 작동 신율이 1% 미만이므로, 200 mm 길이의 텐던에서 예상되는 최대 신율은 2
    mm 이하입니다. 초기 장력 세팅 시 이를 고려하여 액추에이터의 0점 위치를 오프셋합니다 [S17].'
  lab:
    title: 관절 및 구동축 조립 실습
    steps:
    - PC-CF 출력물 파일럿 홀(4.0 mm)에 M3 황동 인서트를 수직으로 열압입합니다 [B9, S22].
    - JSM-0810-10 베어링을 관절 하우징에 장착하고 8 mm 알루미늄 샤프트를 삽입하여 유격이 없는지 확인합니다 [S18, S19].
    - XM430-W350-T 액추에이터를 손바닥 프레임에 고정하고 텐던을 캡스턴에 감아 관절과 연결합니다 [B1, S12].
    - 텐던 장력을 조절하여 손가락 관절의 부드러운 움직임을 확인합니다.
    safety:
    - 납땜 인두 사용 시 화상 주의 및 충분한 환기
    - 열압입 중 황동 인서트의 고온 노출 주의
    - 전원 인가 전 모든 기계적 간섭 확인 및 무부하 상태에서 작동 확인
    - 보안경 필수 착용
    deliverables:
    - 조립된 5지 로봇손 프레임 및 액추에이터 모듈
    - 관절 가동 범위 및 유격 측정 기록지
  assignment:
    title: 로봇손 관절 조립 보고서
    deliverables:
    - 관절 조립 공차 분석 보고서
    - 텐던 장력 및 액추에이터 부하 테스트 결과
    rubric:
    - 인서트 압입의 수직도 및 결합 강도 적절성
    - 베어링과 샤프트 결합 시의 유격 최소화 수준
    - 텐던 경로의 마찰 방지 설계 구현 여부
  quiz:
  - question: PC-CF 출력물에 황동 인서트를 삽입하기 위한 권장 파일럿 홀 크기는 얼마입니까?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 5.0 mm
    - 6.0 mm
    answer_index: 1
    explanation: HTBI-M3-BR 인서트의 권장 구멍 지름은 4.0 mm입니다 [S22].
  - question: 텐던 소재인 Dyneema SK78의 특징으로 옳은 것은?
    choices:
    - 높은 신율(10% 이상)
    - 신율 1% 미만의 고강도
    - 금속 텐던보다 낮은 파단 강도
    - 자외선에 취약함
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 매우 낮고 파단 강도가 높은 고성능 섬유입니다 [S17].
  completion_criteria:
  - 모든 손가락 관절이 기계적 간섭 없이 가동 범위 내에서 움직임
  - 모든 나사 체결부가 인서트를 통해 견고하게 고정됨
  - 텐던 장력이 고르게 세팅되어 제어 가능한 상태임
  - 조립 실습 보고서 제출 및 통과
  source_ids:
  - S18
  - S19
  - S21
  - S20
  - S22
  - S17
  - S12
- id: M5
  slug: tendon-routing
  phase_id: PH2
  title: 텐던 구동 및 구동계 구성
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - Dyneema SK78 섬유 텐던의 물성과 로봇 손 구동 메커니즘을 이해한다.
  - 캡스턴과 텐던 배선의 마찰을 최소화하는 경로 설계 원리를 학습한다.
  - 텐던 구동계의 장력 유지와 관절 자유도 구현을 위한 하드웨어 조립 방법을 익힌다.
  theory_markdown: '### 텐던 구동계 기초


    로봇 손의 텐던 구동은 사람의 근육-인대 구조를 모방한 방식으로, 액추에이터를 손바닥이나 팔뚝에 배치하고 텐던을 통해 원격으로 관절을 구동하여
    손가락의 무게와 관성을 줄입니다 [S11]. 본 모듈에서 사용하는 `Dyneema SK78` 텐던은 지름 1.50 mm로 파단 하중이 230
    daN에 달하며, 작동 신율이 1% 미만으로 매우 정밀한 위치 제어를 가능하게 합니다 [S17].


    ### 텐던 경로 설계의 핵심


    1. **마찰 감소**: 텐던이 통과하는 모서리나 가이드 지점은 마찰을 최소화하기 위해 충분한 곡률 반경(라운딩)을 가져야 합니다. 마찰은
    텐던 장력 손실과 조기 마모의 주원인입니다.

    2. **텐션 제어**: 구동계는 텐던의 초기 장력을 적절히 설정해야 합니다. 장력이 너무 낮으면 관절의 유격(Backlash)이 발생하고,
    너무 높으면 액추에이터의 부하가 증가하여 수명이 단축됩니다 [S12].

    3. **물성 유지**: Dyneema는 반복적인 굽힘에 강하지만, 예리한 모서리와의 접촉은 피해야 합니다 [S17]. 설계된 모든 경로가
    PC-CF 재질의 출력물 내에서 매끄럽게 가공되었는지 확인해야 합니다 [S20].'
  worked_examples:
  - '예제 1: 텐던 파단 하중 계산. 특정 관절에서 예상되는 최대 하중이 500 N일 때, SK78 텐던(파단 하중 230 daN ≈ 2300
    N)의 안전율을 계산하시오. 풀이: 안전율 = 2300 N / 500 N = 4.6. 이는 기계적 안정성을 확보하기에 충분한 수치입니다 [S17].'
  - '예제 2: 텐던 경로 설계. 90도 회전이 필요한 경로에서 마찰을 줄이기 위해 권장되는 곡률 반경을 결정하시오. 풀이: 텐던의 지름(1.5
    mm)의 최소 10배인 15 mm 이상의 반지름을 가진 가이드를 배치하여 굽힘 응력을 분산시킵니다.'
  lab:
    title: 텐던 하네스 제작 및 관절 조립
    steps:
    - 손가락 링크 프레임을 PC-CF로 3D 프린팅하고, 모든 텐던 통과 구멍의 날카로운 모서리를 사포로 연마합니다 [S20].
    - M3 열압입 인서트를 손가락 링크와 베어링 하우징에 배치합니다 [S22].
    - 8 mm 알루미늄 샤프트와 IGUS 슬리브 베어링을 사용하여 관절 회전축을 조립합니다 [S18, B-SHAFT].
    - 텐던의 한쪽 끝을 캡스턴에 고정하고, 가이드를 통과시켜 손가락 끝단에 연결합니다.
    - 액추에이터(XM430-W350-T)의 초기 위치를 설정하고 텐던에 적절한 장력을 가하며 고정합니다 [S12].
    safety:
    - 텐던 장력 시험 중에는 반드시 충격 방지 작업용 보안경을 착용합니다.
    - 텐던 절단 시 날카로운 칼이나 가위 사용에 주의합니다.
    - 동력을 인가하기 전에 고정 지그에 로봇 손을 배치하고 무부하 상태에서 작동을 점검합니다.
    - 전원 분기 어댑터 3개(각 138 W)를 개별적으로 독립된 퓨즈 분기에 할당하여 사용하며, 양(+) 출력 단자를 서로 연결하지 않습니다
      [S16, S25, S26].
    deliverables:
    - 텐던 장력이 올바르게 유지되는 조립된 5지 로봇 손 프로토타입
    - 관절 회전부의 유격 및 마찰 점검 기록
  assignment:
    title: 텐던 구동계 설계 보고서
    deliverables:
    - 텐던 경로 내의 곡률 반경 분석도
    - 텐던 장력 고정 장치(Capstan)의 설계 도면 및 하중 계산서
    - 조립 과정 중 발생한 유격 해결 방안 기록
    rubric:
    - 텐던 경로 설계의 물리적 타당성 (곡률 반경 준수 여부)
    - 텐던 고정 방식의 재현성 및 정비 용이성
    - 안전 지침 및 전원 분기 독립성 준수 기록
  quiz:
  - question: Dyneema SK78 텐던의 주요 특징으로 옳은 것은?
    choices:
    - 높은 신율로 인한 충격 흡수
    - 1% 미만의 낮은 작동 신율
    - 금속 와이어보다 무거운 무게
    - 내화학성이 전혀 없음
    answer_index: 1
    explanation: SK78은 신율이 1% 미만으로 매우 낮아 위치 제어에 유리합니다 [S17].
  - question: 텐던 경로 설계 시 마찰을 줄이기 위한 핵심 요소는?
    choices:
    - 날카로운 모서리 유지
    - 적절한 곡률 반경(라운딩) 적용
    - 텐던의 지름을 5 mm 이상으로 증가
    - 마찰이 큰 재질의 가이드 사용
    answer_index: 1
    explanation: 가이드의 곡률 반경을 키워야 텐던의 마찰과 마모가 줄어듭니다.
  - question: 액추에이터 XM430-W350-T의 전원 인가 시 안전 사항으로 옳은 것은?
    choices:
    - 모든 전원 어댑터의 양극을 병렬로 연결하여 전력을 합산한다.
    - 3개 전원 어댑터는 독립적인 퓨즈 분기로 관리한다.
    - 전원 인가 중 손을 항상 구동 범위 내에 둔다.
    - 퓨즈를 계획 정지 장치로 사용한다.
    answer_index: 1
    explanation: 전원 어댑터는 독립적으로 분리 관리해야 하며 병렬 연결은 절대 금지합니다 [S16, B3].
  completion_criteria:
  - 5지 로봇 손의 모든 관절이 텐던을 통해 정상적으로 회전함
  - 텐던 경로 내에서 마찰로 인한 걸림 현상이 발견되지 않음
  - 모든 전기적 하네스가 규격에 맞게 퓨즈와 커넥터를 통해 독립 분기 구성됨
  source_ids:
  - S11
  - S17
