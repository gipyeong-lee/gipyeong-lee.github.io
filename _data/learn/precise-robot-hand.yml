modules:
- id: m1
  slug: robotics-fundamentals
  phase_id: phase1
  title: 로봇공학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇공학의 정의와 시스템 구성요소(기구부, 액추에이터, 센서, 제어기)를 이해한다.
  - 로봇 시스템의 동적 거동과 제어 루프의 기본 개념을 파악한다.
  - 정교한 로봇손 구현을 위한 하드웨어 설계 원칙을 학습한다.
  theory_markdown: '## 로봇공학 기초


    로봇은 감지(sensing), 계산(computation), 작용(actuation)을 수행하여 물리적 환경과 상호작용하는 시스템입니다 [S1].
    성공적인 로봇 설계는 메커니즘, 역학, 그리고 제어의 통합적 접근을 요구합니다 [S2].


    ### 1. 주요 구성요소

    - **기구부(Mechanism):** 로봇의 골격과 자유도(DoF)를 정의합니다. 링크와 관절로 구성되며, 정교한 로봇손에서는 텐던(tendon)
    구동 방식을 통해 가벼운 링크 구조를 구현합니다.

    - **액추에이터(Actuator):** 전기 에너지를 기계적 운동으로 변환합니다. 정밀 제어를 위해 위치, 속도, 전류 피드백이 가능한 스마트
    액추에이터(예: DYNAMIXEL XM430)를 사용합니다 [BOM: actuator-01].

    - **센서(Sensor):** 환경 정보를 제어기로 전달합니다. 로봇손에서는 접촉력을 측정하는 FSR(Force Sensitive Resistor)
    등을 사용하여 파지력을 제어합니다 [BOM: sensor-01].

    - **제어기(Controller):** 센서 데이터를 처리하고 액추에이터에 명령을 내립니다. 안전을 위해 실시간 처리가 가능한 전용 보드(예:
    OpenCR)를 사용합니다 [BOM: controller-01].


    ### 2. 설계 원칙

    로봇 시스템은 안전이 최우선입니다. 특히 전원 구성 시 독립된 분기 회로를 유지하여 과전류를 방지하고, 비상 시 즉각적으로 전원을 차단할 수
    있는 시스템을 구축해야 합니다 [BOM: safety-01, safety-02]. 3.3 V 센서 전원과 12 V 액추에이터 전원은 회로적으로
    분리되어야 합니다 [BOM: controller-01].'
  worked_examples:
  - '액추에이터 전력 요구량 계산: XM430-W350-T 1대의 스톨 전류는 2.3 A입니다 [BOM: actuator-01]. 전체 10대의
    액추에이터가 동시에 스톨 상태가 되면 23 A의 전류가 필요합니다. 이를 위해 11.5 A 출력 어댑터 2대를 독립된 분기로 배치하여 전원을
    공급합니다 [BOM: power-01].'
  - '센서 전압 분압 계산: FSR 402 센서와 10 kΩ 저항을 사용하여 분압 회로를 구성합니다 [BOM: sensor-01, B-SENSOR-RESISTOR].
    3.3 V 전원을 인가할 때, 센서 저항이 변화함에 따라 ADC 입력단은 0 ~ 3.3 V 사이의 신호를 얻게 되어 OpenCR 보드에서 안전하게
    측정됩니다 [BOM: controller-01].'
  lab:
    title: 로봇 시스템 안전 전원 및 기본 제어 구성
    steps:
    - '각 12 V 전원 어댑터 출력에 10 A 퓨즈 홀더를 설치하고 10 A 퓨즈를 장착한다 [BOM: B-WIRING-FUSE-HOLDER].'
    - '비상정지 버튼을 EV200 접촉기의 코일 회로와 직렬로 연결하여 비상 시 코일 전원이 차단되도록 한다 [BOM: safety-01, safety-02].'
    - '3.3 V 센서 레일을 사용하여 FSR 분압 회로를 구성하고 OpenCR 보드 ADC 포트에 연결한다 [BOM: controller-01].'
    - '독립된 전원 분기 3개를 구성하고 액추에이터를 분기별로 배분하여 연결한다 [BOM: power-01].'
    safety:
    - 모든 전원 연결 전 멀티미터로 극성과 단락 여부를 반드시 확인한다.
    - 보안경을 착용하고 전원 작업 시 긴급 비상 차단 버튼을 즉시 조작 가능한 거리에 둔다.
    - 12 V 액추에이터 전원과 3.3 V 센서 전원을 절대 혼용하지 않는다.
    deliverables:
    - 정상적으로 전압이 출력되는 독립 퓨즈 분기 회로 측정 기록
    - 비상정지 동작 시 접촉기 차단 확인 로그
    - FSR 센서 입력값이 0~3.3 V 범위 내임을 확인한 데이터
  assignment:
    title: 로봇 시스템 구성 및 안전 설계 보고서
    deliverables:
    - BOM 기반 시스템 배선도
    - 액추에이터 피크 전류 대비 퓨즈 및 차단 장치 적합성 계산서
    - 전원 분기 및 안전 시스템 설계 근거
    rubric:
    - 전원 분기 회로의 독립성이 전기적으로 보장됨
    - BOM 시스템 진실(system truth)에 명시된 부품 정격과 안전 부품 사양의 일치
    - 비상 시 전원 차단 로직의 명확한 설계
  quiz:
  - question: 정교한 5지 로봇손 설계 시 12 V 액추에이터 전원과 3.3 V 센서 전원의 관계는?
    choices:
    - 두 전원은 반드시 하나의 전원에서 공급받아야 한다.
    - 회로적으로 전기적 격리가 필수적이다.
    - 센서 전원은 액추에이터 전원에서 전압 강하를 통해 얻는다.
    - 상관없다.
    answer_index: 1
    explanation: '액추에이터의 높은 전류와 노이즈로부터 센서 회로의 정밀도를 보호하기 위해 전기적으로 분리되어야 합니다 [BOM: controller-01].'
  - question: 비상정지 버튼의 적절한 설치 방법은?
    choices:
    - 모터 전류를 직접 차단한다.
    - 배터리의 (+)단자를 직접 끊는다.
    - EV200 접촉기의 코일 회로를 제어하여 DC 분기를 동시에 차단한다.
    - 제어기의 전원을 차단한다.
    answer_index: 2
    explanation: '저전류 비상정지 스위치로 대전류 DC 분기를 안전하게 차단하기 위해 접촉기 코일 회로를 제어합니다 [BOM: safety-01,
      safety-02].'
  completion_criteria:
  - 안전 전원 분기 및 비상 차단 시스템 구성 완료
  - FSR 센서의 3.3 V ADC 입력 측정 및 검증 완료
  - BOM 시스템 진실과 일치하는 안전 설계 보고서 제출
  source_ids:
  - S1
  - S2
- id: m2
  slug: underactuated-mechanisms
  phase_id: phase1
  title: 언더액추에이티드 메커니즘 연구
  estimated_hours: 10.0
  prerequisites:
  - m1
  objectives:
  - 언더액추에이티드(Underactuated) 메커니즘의 정의와 로봇 그리퍼에서의 장점을 이해한다.
  - 구동기 수보다 관절 자유도가 많은 시스템에서의 상태 제어 기초를 학습한다.
  - 텐던 구동 로봇손에서 기구적 제약(Mechanical Constraint)이 어떻게 파지 형상을 결정하는지 분석한다.
  - 에너지 기반 제어 개념을 통해 언더액추에이티드 시스템의 안정성을 고찰한다.
  theory_markdown: '### 언더액추에이티드 메커니즘의 개요

    언더액추에이티드 시스템은 제어 가능한 입력(Actuator)의 수가 시스템의 자유도(Degree of Freedom)보다 적은 시스템을 의미합니다
    [S11]. 로봇손 설계에서 이는 모든 관절을 개별적으로 구동하지 않고, 하나의 액추에이터가 텐던(Tendon)을 통해 여러 관절을 순차적으로
    구동하도록 설계하여 기구적 복잡성과 중량을 줄이는 전략으로 사용됩니다 [S3].


    ### 기구적 적응성 (Mechanical Adaptability)

    언더액추에이티드 그리퍼는 물체의 형상에 기구적으로 적응합니다. 구동기가 텐던을 당기면, 첫 번째 관절부터 물체에 닿을 때까지 회전하며, 닿은
    이후에는 장력이 다른 관절로 전달되어 순차적으로 물체를 감싸게 됩니다 [S3]. 이 과정은 명시적인 제어 알고리즘 없이도 물체의 형상을 따라
    파지하는 ''기구적 지능''을 제공합니다 [S11].


    ### 텐던 기반 힘 전달

    본 프로젝트의 `Dyneema SK78` 텐던은 반복적인 굽힘에도 높은 파단 강도(230 daN)와 낮은 신율(<1%)을 유지하여 정밀한 힘
    전달을 보장합니다 [BOM: transmission-01]. 이러한 물리적 특성은 언더액추에이티드 시스템에서 각 관절의 위치를 예측 가능하게
    만들어, 전체적인 파지 안정성을 높이는 데 기여합니다.'
  worked_examples:
  - '예제 1: 텐던 구동 링크의 토크 분석. 단일 `XM430-W350-T` 액추에이터가 4.1 N·m의 스톨 토크를 제공할 때 [BOM: actuator-01],
    텐던이 감기는 캡스턴의 반지름을 10 mm라고 가정하면, 손가락 끝에 인가되는 이론적 견인력은 $F = \tau / r = 4.1 / 0.01
    = 410$ N입니다. 실제 마찰 손실을 20%로 가정하면 유효 힘은 328 N이 됩니다.'
  - '예제 2: 관절 수와 자유도 관계. 3개의 관절이 1개의 텐던으로 연결된 경우, 제어 입력은 1개(모터)이지만 관절 자유도는 3개입니다.
    물체와 접촉 시 힘 평형 방정식은 각 관절의 마찰과 스프링 강성에 의해 결정되며, 이는 물체와의 접촉 지점에 따라 결정적인 파지 자세를 형성합니다
    [S11].'
  lab:
    title: 언더액추에이티드 손가락 모듈 기구학 및 텐던 장력 시험
    steps:
    - 'FDM 3D 프린터로 출력한 PC-CF 손가락 링크를 8 mm 정밀 알루미늄 샤프트에 조립합니다 [BOM: structure-01, B-SHAFT].'
    - '무급유 폴리머 슬리브 베어링(JSM-0810-10)을 각 관절에 삽입하여 마찰을 최소화합니다 [BOM: bearing-01].'
    - 'Dyneema 텐던을 캡스턴에 고정하고 손가락 관절 경로를 따라 연결합니다 [BOM: transmission-01].'
    - 저전압 벤치 전원을 사용하여 액추에이터에 단계적으로 전압을 인가하고 관절의 순차적 굽힘을 관찰합니다.
    - '멀티미터를 사용하여 `OpenCR` 보드의 3.3 V 센서 레일을 확인하고 FSR 402 센서를 연결하여 압력 변화에 따른 ADC 값을
      측정합니다 [BOM: controller-01, sensor-01, B-SENSOR-RESISTOR].'
    safety:
    - 반드시 보안경을 착용하고 실험에 임하십시오.
    - '액추에이터 전류 제한을 2.3 A 미만으로 설정하여 과부하 시 부품 파손을 방지하십시오 [BOM: actuator-01].'
    - '실험 중 비상 전원 차단 시스템을 즉시 사용할 수 있도록 손 근처에 두십시오 [BOM: B-SAFETY-CUTOFF].'
    - 손가락 기구부 사이에 손가락이 끼지 않도록 주의하십시오.
    deliverables:
    - 관절별 구동 순서 기록
    - 텐던 장력에 따른 손끝 힘(FSR) 데이터
    - 기구적 마찰로 인한 구동 지연 보고서
  assignment:
    title: 언더액추에이티드 로봇손 파지 메커니즘 해석
    deliverables:
    - 텐던 경로와 관절 토크 전달 다이어그램 (CAD 및 도면)
    - 언더액추에이티드 메커니즘의 파지 안정성 수식 유도 리포트
    - 물체 형상에 따른 접촉 지점 변화 분석 보고서
    rubric:
    - 텐던 경로의 기하학적 설계가 관절 구동 순서를 적절히 반영하였는가?
    - 언더액추에이티드 메커니즘의 정의를 물리적 수식으로 정확히 표현하였는가?
    - 마찰과 텐던 신율이 파지력 피드백에 미치는 영향을 논리적으로 분석하였는가?
  quiz:
  - question: 언더액추에이티드 시스템에서 구동기의 수와 시스템의 자유도 관계는 무엇입니까?
    choices:
    - 구동기의 수 > 자유도
    - 구동기의 수 = 자유도
    - 구동기의 수 < 자유도
    - 상관관계 없음
    answer_index: 2
    explanation: 언더액추에이티드(Underactuated)는 제어 가능한 입력(구동기)의 수가 시스템의 자유도보다 적은 상태를 의미합니다
      [S11].
  - question: 텐던 구동 로봇손에서 물체의 형상에 맞게 파지 자세가 결정되는 주된 이유는 무엇입니까?
    choices:
    - 모든 관절에 개별 모터가 있기 때문
    - 기구적 제약과 장력 분배에 의한 순차적 적응 때문
    - 매번 카메라로 물체를 스캔하기 때문
    - 제어 소프트웨어가 모든 관절을 독립 제어하기 때문
    answer_index: 1
    explanation: 텐던 기반 언더액추에이티드 그리퍼는 물체와 먼저 닿는 관절부터 회전하며, 장력이 나머지 관절로 전달되어 기구적으로 물체를
      감싸게 됩니다 [S3].
  - question: 본 프로젝트에서 사용되는 Dyneema SK78 텐던의 특징은 무엇입니까?
    choices:
    - 높은 신율로 장력 유지
    - 낮은 파단 강도
    - 낮은 신율과 높은 파단 강도
    - 고무 재질로 탄성 복원
    answer_index: 2
    explanation: 'Dyneema SK78 텐던은 파단 하중이 230 daN으로 높고, 작동 신율이 1% 미만으로 낮아 정밀한 힘 전달에
      적합합니다 [BOM: transmission-01].'
  completion_criteria:
  - 언더액추에이티드 메커니즘 정의 학습 완료
  - 텐던 구동 손가락 기구학 설계 도면 제출
  - 실험실 단계별 안전 수칙 준수 확인
  - 퀴즈 3문제 이상 정답률 100% 달성
  source_ids:
  - S3
  - S11
- id: m3
  slug: hand-design
  phase_id: phase1
  title: 로봇손 기구 설계
  estimated_hours: 10.0
  prerequisites:
  - m2
  objectives:
  - 인간 손의 메커니즘을 로봇손 기구학으로 변환하는 원리 이해
  - 텐던 구동 로봇손에서 관절 자유도와 액추에이터 효율 간의 상충 관계 분석
  - FDM 3D 프린팅 및 열압입 나사산 인서트를 활용한 로봇손 모듈 설계 방법 습득
  - 내구성과 정밀도를 고려한 기구부 조립 및 베어링 배치 설계
  theory_markdown: '### 로봇손 기구 설계 기초

    인간의 손은 약 20개 이상의 자유도(DoF)를 가지며 정교한 조작이 가능합니다 [S4]. 로봇 공학에서는 이 복잡성을 줄이기 위해 생체 모방(biomimetic)
    시너지를 활용하여 적은 수의 액추에이터로도 유사한 기능을 수행하도록 설계합니다 [S4].


    #### 1. 텐던 구동 방식

    로봇손의 구동은 `DYNAMIXEL XM430-W350-T`와 같은 액추에이터가 `Dyneema SK78` 텐던을 당겨 관절을 회전시키는 방식으로
    구현됩니다. 텐던 구동은 액추에이터를 손가락 끝에서 멀리 떨어진 손바닥이나 팔뚝에 배치할 수 있어 손가락의 소형화에 유리합니다 [S12].
    이때 텐던의 신율이 1% 미만이어야 제어 정밀도가 보장됩니다 [S18].


    #### 2. 모듈식 구조 설계

    각 손가락은 독립적으로 조립 및 교체 가능한 모듈식 구조로 설계합니다. `JSM-0810-10` 폴리머 베어링과 `8 mm 정밀 알루미늄 샤프트`를
    사용하여 기구부의 마찰을 줄이고 유격을 관리합니다 [S19, S20]. 또한 `M3 황동 열압입 인서트`를 `PC-CF(탄소섬유 PC)` 출력물에
    사용하여 반복적인 조립에도 치수 안정성을 유지합니다 [S21, S23].'
  worked_examples:
  - '예제 1: 텐던 배치 최적화 - 손가락 끝에 작용하는 힘이 20 N일 때, 텐던의 파단 하중(230 daN)과 안전율을 고려한 배치 설계.
    daN 단위를 N으로 변환하면 2300 N이며, 20 N의 부하는 1% 미만의 부하로 안전함을 확인.'
  - '예제 2: 인서트 너트 체결 설계 - PC-CF 소재의 구멍 지름을 `4.0 mm`로 설정하여 `HTBI-M3-BR` 인서트(외경 4.4
    mm)를 열압입하는 과정. 적정 가열 온도를 통해 소재 변형 없이 안정적인 나사산을 형성하는 기하학적 설계 분석.'
  lab:
    title: 손가락 링크 모듈 조립 및 기구적 유격 시험
    steps:
    - PC-CF로 출력된 손가락 링크 부품을 준비하고 서포트를 제거합니다.
    - 4.0 mm 파일럿 홀에 M3 열압입 인서트를 가열하여 정확히 수직으로 삽입합니다.
    - 8 mm 베어링을 링크 하우징에 끼우고, 8 mm 샤프트를 조립하여 회전 유격을 확인합니다.
    - Dyneema 텐던을 캡스턴에 감고 조립하여 텐던 경로에 마찰이 없는지 테스트합니다.
    safety:
    - 열압입 작업 시 화상 방지를 위해 장갑을 착용하고 보안경을 씁니다.
    - FDM 출력물 제거 시 날카로운 공구에 주의하십시오.
    - 기구부 조립 후 손가락 사이에 손가락이 끼이지 않도록 주의하십시오.
    deliverables:
    - 조립 완료된 5개 손가락 링크 모듈
    - 베어링 회전 유격 측정 기록지
  assignment:
    title: 손가락 관절 메커니즘 설계 CAD 및 기술 사양서 작성
    deliverables:
    - 손가락 관절부 CAD 모델링 데이터
    - 조립 조감도 및 분해 조립도
    - 선택한 베어링과 나사산 인서트가 포함된 부품 리스트(BOM)
    rubric:
    - 기구적 자유도(DoF)가 요구사양을 충족하는가
    - 열압입 인서트의 조립 공간과 파일럿 홀 규격이 정확한가
    - 베어링 및 샤프트 규격이 BOM과 일치하는가
  quiz:
  - question: 텐던 구동 로봇손에서 텐던의 신율(stretch)은 제어 정밀도에 어떤 영향을 미치는가?
    choices:
    - 신율이 클수록 제어 정밀도가 향상된다.
    - 신율이 낮을수록 텐던 구동의 응답성과 정밀도가 보장된다.
    - 신율은 제어와 무관하다.
    - 신율이 높아야 장력을 조절하기 쉽다.
    answer_index: 1
    explanation: 텐던의 신율이 낮아야 액추에이터의 움직임이 관절에 정확하게 전달되어 제어 정밀도를 유지할 수 있습니다 [S18].
  - question: PC-CF 구조물에 M3 황동 열압입 인서트를 사용할 때 적절한 파일럿 홀 지름은?
    choices:
    - 2.0 mm
    - 3.0 mm
    - 4.0 mm
    - 5.0 mm
    answer_index: 2
    explanation: 사용되는 HTBI-M3-BR 인서트의 권장 홀 규격은 4.0 mm입니다 [S23].
  - question: JSM-0810-10 폴리머 베어링과 함께 사용할 샤프트의 권장 지름은?
    choices:
    - 6 mm
    - 8 mm
    - 10 mm
    - 12 mm
    answer_index: 1
    explanation: 해당 베어링의 내경(d1)은 8 mm이므로 8 mm 샤프트를 사용해야 합니다 [S19, S20].
  completion_criteria:
  - 손가락 링크 모듈 조립 완료
  - 기구 설계 CAD 모델 제출
  - 조립 유격 측정 및 기록 완료
  - 퀴즈 전 문항 정답 제출
  source_ids:
  - S4
  - S12
- id: m4
  slug: 3d-printing-struct
  phase_id: phase2
  title: 구조물 제작
  estimated_hours: 10.0
  prerequisites:
  - m3
  objectives:
  - FDM 3D 프린팅을 위한 탄소섬유 충진 PC 필라멘트(PC-CF)의 물리적 특성 및 출력 설정 이해
  - 경화강 노즐 사용의 필요성과 엔지니어링 소재의 치수 안정성 학습
  - 로봇손 구조물을 위한 적층 방향과 강성 설계 기법 습득
  - 열압입 인서트 너트를 활용한 기계적 조립 안정성 확보
  theory_markdown: '## 엔지니어링 필라멘트: PC-CF의 이해


    5지 로봇손의 프레임과 손가락 링크는 반복적인 구동 부하와 장력을 견뎌야 하므로 높은 강성과 치수 안정성이 요구됩니다. `Prusament
    PC Blend Carbon Fiber(PC-CF)`는 폴리카보네이트에 탄소섬유를 충진하여 순수 PC Blend보다 강도, 인성, 내열성이
    향상된 소재입니다 [S21].


    ### 주요 물성 및 인쇄 조건

    - **내열성:** 높은 유리전이온도로 기술적 부품 제작에 적합합니다 [S21].

    - **노즐 요구사항:** 탄소섬유는 마모성이 매우 강하므로 일반 황동 노즐 대신 반드시 **경화강(Hardened Steel) 노즐**을
    사용해야 합니다 [S21].

    - **인쇄 온도:** 권장 노즐 온도 285°C(±10°C), 베드 온도 110°C(±10°C)를 준수해야 최적의 층간 접착력을 얻을 수
    있습니다 [S21].

    - **베드 관리:** 너무 강한 접착력을 가질 수 있으므로 PEI 시트 보호를 위해 필요시 풀(Glue stick)을 얇게 도포합니다 [S21].


    ### 기계적 결합 설계

    반복적인 분해와 조립을 위해 출력물에 M3 황동 열압입 인서트를 배치합니다 [B-FASTENER, S23]. 설계 시 인서트 외경(4.4 mm)을
    고려하여 4.0 mm 파일럿 홀을 CAD에 미리 설계해야 합니다 [S23]. 이는 직접 나사를 체결하는 것보다 훨씬 우수한 반복 조립 재현성을
    제공합니다 [S23].'
  worked_examples:
  - '예제 1: PC-CF 소재를 사용할 때 황동 노즐을 쓰면 안 되는 이유와 경화강 노즐의 기술적 근거

    - 탄소섬유는 소재 자체가 단단하고 연마성(Abrasive)이 강해 연질인 황동 노즐 내부를 빠르게 마모시킵니다. 경화강 노즐은 고경도 열처리
    소재로 이를 방지하여 압출량의 일관성을 유지합니다 [S21].'
  - '예제 2: 열압입 인서트 설계 공차 계산

    - 삽입 대상: M3 황동 열압입 인서트(OD 4.4 mm).

    - 설계 적용: 4.0 mm 파일럿 홀 설계 시 소재의 수축률을 감안하여 인서트가 살짝 타이트하게 고정되도록 하여 열압입 시 녹아든 소재가
    널링(Knurls) 사이로 흐르며 강한 기계적 고정력을 얻습니다 [S23].'
  lab:
    title: PC-CF 구조물 적층 실습 및 인서트 조립
    steps:
    - 경화강 노즐이 장착된 FDM 프린터의 베드를 110°C로 예열하고 IPA로 표면을 세척합니다 [S21].
    - 슬라이서에서 노즐 온도 285°C로 설정하여 손가락 링크 테스트 조각을 출력합니다 [S21].
    - 출력물의 치수를 측정하여 CAD 설계 값과 일치하는지 확인합니다.
    - 인서트 홀에 열압입 인서트를 배치하고, 납땜 인두기를 사용하여 인서트가 구조물 표면과 평탄해질 때까지 가압 삽입합니다 [S23].
    - M3 캡스크루를 체결하여 반복 조립 재현성을 테스트합니다 [B-FASTENER, S23].
    safety:
    - 베드 온도 110°C는 화상을 유발할 수 있으므로 절대 직접 만지지 않습니다 [S21].
    - 납땜 인두를 이용한 열압입 시 보안경을 착용하고 연기를 직접 흡입하지 않도록 환기를 합니다.
    - 경화강 노즐 교체 및 실습 시 뜨거운 노즐에 주의합니다.
    deliverables:
    - 출력물 품질 사진 및 치수 측정 기록
    - 열압입 인서트가 체결된 손가락 링크 모듈
    - 작업 안전 점검 리스트 제출
  assignment:
    title: 로봇손 링크 구조 설계 및 출력 계획서
    deliverables:
    - 로봇손 손가락 링크 CAD 파일
    - 슬라이서 설정값 캡처 및 탄소섬유 PC 필라멘트 출력 전략 설명서
    - 인서트 너트 배치 설계가 포함된 도면
    rubric:
    - PC-CF 물성을 고려한 인쇄 온도 및 베드 온도 설정의 정확성
    - 경화강 노즐 사용에 대한 기술적 이해도 및 설계 반영
    - M3 열압입 인서트 홀의 규격(4.0 mm) 및 배치 적절성
    - 반복 조립을 고려한 공차 설계의 타당성
  quiz:
  - question: PC-CF 필라멘트 인쇄 시 반드시 경화강 노즐을 사용해야 하는 주된 이유는 무엇입니까?
    choices:
    - 더 높은 용융 온도를 견디기 위해
    - 탄소섬유의 연마성으로 인한 황동 노즐의 마모 방지
    - 압출 속도를 2배 높이기 위해
    - 전기 전도성을 확보하기 위해
    answer_index: 1
    explanation: 탄소섬유는 매우 연마성이 강해 황동 노즐을 빠르게 마모시키므로 경화강 노즐을 사용해야 합니다 [S21].
  - question: M3 열압입 인서트(외경 4.4mm) 체결을 위한 권장 파일럿 홀 크기는 얼마입니까?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 4.4 mm
    - 5.0 mm
    answer_index: 1
    explanation: 데이터시트에 명시된 권장 구멍 지름은 4.0 mm입니다 [S23].
  - question: PC-CF 소재로 출력할 때 권장되는 히트베드 온도는 얼마입니까?
    choices:
    - 60°C
    - 80°C
    - 110°C
    - 150°C
    answer_index: 2
    explanation: PC-CF 필라멘트의 권장 베드 온도는 110°C입니다 [S21].
  completion_criteria:
  - 경화강 노즐을 장착하여 PC-CF로 3D 모델을 성공적으로 출력함
  - 열압입 인서트가 구조물에 평탄하게 고정됨을 확인함
  - 인쇄 설정 및 안전 수칙을 준수하는 보고서 제출
  source_ids:
  - S21
- id: m5
  slug: assembly-bearings-fasteners
  phase_id: phase2
  title: 조립 및 베어링/패스너 활용
  estimated_hours: 10.0
  prerequisites:
  - m4
  objectives:
  - 베어링과 열압입 인서트의 기계적 원리를 이해하고 조립 공차를 관리한다.
  - 정밀 샤프트와 슬리브 베어링 조립 시 유격 제어 방법을 익힌다.
  - PC-CF 출력물에 최적화된 열압입 인서트 고정 기법을 습득한다.
  - 표준 패스너의 규격을 활용하여 재현성 있는 로봇 구조를 조립한다.
  theory_markdown: '### 정밀 로봇 조립의 기초: 베어링과 패스너


    정밀 로봇 손의 관절은 마찰 저항을 최소화하고 구조적 강성을 유지해야 합니다. 슬리브 베어링(JSM-0810-10)은 무급유 운용이 가능하여
    유지보수가 쉽고, 정밀 샤프트(AWMP-08)와 조합하여 매끄러운 회전축을 구성합니다 [S19, S20]. 조립 시 가장 중요한 요소는 **공차
    관리**입니다. Igus 사의 슬리브 베어링은 하우징에 압입(press-fit)될 때 내경이 설계된 치수로 조정되므로, 반드시 권장되는 하우징
    구멍 지름을 준수해야 합니다 [S19].


    FDM 3D 프린터로 제작된 PC-CF(탄소섬유 강화 폴리카보네이트) 부품에 나사를 직접 체결하면 소재의 연성으로 인해 반복 조립 시 나사산이
    마모됩니다. 이를 방지하기 위해 황동 열압입 인서트(HTBI-M3-BR)를 사용합니다 [S23]. 열압입 과정에서 과도한 온도는 플라스틱 모재의
    강도를 저하시키므로, 인서트가 모재에 균일하게 매립될 수 있는 적정 온도와 파일럿 홀(4.0 mm) 규격을 엄격히 지켜야 합니다 [S23].


    또한, 모든 패스너는 JIS B 1176 표준 규격을 따르는 M3 캡스크루를 사용하여 조립 재현성을 확보합니다 [S22]. 이는 CAD 설계
    시 구멍 공차와 일치하여 부품 교체 시 발생하는 오류를 최소화합니다.'
  worked_examples:
  - '예제 1: 8mm 정밀 샤프트와 베어링 간 유격 계산. JSM-0810-10 베어링의 내경은 8 mm이며 [S19], 8 mm 정밀 샤프트(AWMP-08)와
    조립 시, 정적 환경에서 베어링 내경과 샤프트 지름이 일치하도록 모따기(chamfer)된 샤프트 끝단을 주의 깊게 삽입하여 축 방향 이동 시
    마찰이 없음을 확인합니다 [S20].'
  - '예제 2: 열압입 인서트 삽입 깊이 조절. PC-CF 출력물의 파일럿 홀이 4.0 mm일 때 [S23], 인서트(OD 4.4 mm)를 삽입하기
    위해 인두기 끝 온도를 출력물의 유리전이 온도에 맞춰 설정하고, 수직으로 압력을 가하여 인서트 상단이 출력물 표면과 동일 평면(Flush)이
    되도록 조절하여 체결 강도를 확보합니다.'
  lab:
    title: 관절 회전축 및 모듈 조립 실습
    steps:
    - PC-CF 출력물을 준비하고 파일럿 홀에 이물질이 없는지 확인한다.
    - 인두기를 사용하여 M3 열압입 인서트를 지정된 위치에 수직으로 삽입한다.
    - 슬리브 베어링을 하우징 보어에 압입하고, 내경 변형이 없는지 8 mm 샤프트로 확인한다.
    - M3 캡스크루와 적절한 토크 드라이버를 사용하여 관절 링크를 고정한다.
    safety:
    - 인두기 사용 시 화상 방지를 위해 보안경과 내열 장갑을 반드시 착용한다.
    - 열압입 중 발생하는 미세 플라스틱 가스를 흡입하지 않도록 환기 장치를 가동한다.
    - 조립된 관절부에 손가락이 끼지 않도록 주의한다.
    deliverables:
    - 조립이 완료된 손가락 관절 모듈
    - 베어링의 회전 자유도와 유격 측정 로그
    - 열압입 인서트 삽입 상태 사진
  assignment:
    title: 정밀 조립 도면 및 유지보수 계획 작성
    deliverables:
    - 사용된 베어링과 패스너의 목록이 포함된 조립 설계도(BOM 포함)
    - 열압입 인서트 삽입 온도와 시간 관리 기록
    - 관절 부위 마찰 테스트 보고서
    rubric:
    - 모든 패스너가 명시된 사양(M3 캡스크루 등)에 부합하는가?
    - 베어링이 권장 압입 방식으로 올바르게 설치되었는가?
    - 열압입 인서트가 모재와 수평을 이루고 충분한 강도를 확보했는가?
    - 회전축의 유격이 설계 오차 범위 내에 있는가?
  quiz:
  - question: 슬리브 베어링(JSM-0810-10)의 내경이 설계된 치수가 되기 위해 필요한 조치는?
    choices:
    - 하우징 보어에 압입한다
    - 순간접착제로 고정한다
    - 내경을 드릴로 확장한다
    - 냉각 후 조립한다
    answer_index: 0
    explanation: 이 베어링은 하우징 보어에 압입된 후에 내경이 최종 치수로 조정됩니다 [S19].
  - question: M3 열압입 인서트 삽입 시 권장되는 파일럿 홀 지름은?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 5.0 mm
    - 5.8 mm
    answer_index: 1
    explanation: 데이터시트에 따르면 HTBI-M3-BR 인서트의 권장 구멍 지름은 4 mm입니다 [S23].
  - question: 로봇 손 조립 시 표준 패스너(M3 캡스크루)를 사용하는 주된 이유는?
    choices:
    - 저렴한 비용
    - 외관상의 아름다움
    - 조립 재현성 및 부품 호환성
    - 더 큰 나사산 힘
    answer_index: 2
    explanation: 표준 규격을 고정함으로써 CAD 설계와 실제 조립 간의 일치도를 높여 재현성을 확보합니다 [S22].
  completion_criteria:
  - 조립 실습을 통해 모든 관절 모듈이 부드럽게 작동함을 검증함
  - 조립 설계도와 BOM이 제공된 BOM 시스템 사양과 일치함
  - 조립 시 안전 수칙을 완벽히 준수하고 비상정지 체계 이해함
