- id: M10
  slug: safety-validation
  phase_id: PH4
  title: 안전한 전원 분리 검증 및 최종 보고
  estimated_hours: 8.0
  prerequisites:
  - M9
  objectives:
  - 절연형 전원 분기의 독립성을 이해하고 검증한다.
  - 멀티미터를 사용하여 무전원 상태를 물리적으로 확인하는 절차를 익힌다.
  - 과전류 보호를 위한 ATOF 퓨즈의 역할을 이해한다.
  - 로봇 시스템의 최종 안전 점검 및 보고서 작성 요령을 습득한다.
  theory_markdown: '## 안전한 로봇 시스템 운영과 전원 관리


    로봇 시스템의 안전한 운영은 하드웨어와 제어기의 전기적 독립성 보장에서 시작됩니다. 본 프로토타입은 3개의 독립된 절연형 데스크톱 전원 어댑터(GST160A12-R7B)를
    사용하여 액추에이터 전원 분기를 구성합니다 [S14]. 각 어댑터는 독립적인 10 A ATOF 퓨즈를 통해 과전류로부터 보호되며 [S24],
    이들 양(+) 출력은 서로 연결되지 않도록 완전히 절연되어야 합니다. 이는 시스템의 특정 분기에서 발생한 결함이 전체 시스템으로 확산되는 것을
    방지하기 위함입니다.


    ### 무전원 상태의 물리적 검증

    로봇 작업 환경에서 ''안전''은 무전원 상태의 확신에서 비롯됩니다. 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각
    분기의 잔류 전압이 1 V 미만임을 확인한다. 학습자는 반드시 멀티미터를 DC 전압 측정 모드로 설정하고, 각 분기 커넥터(Micro-Fit
    3.0)의 출력에서 1 V DC 미만의 잔류 전압을 물리적으로 확인해야 합니다 [S13, S14].


    ### 표준 준수의 중요성

    본 프로젝트는 교육용 벤치 프로토타입이며, 산업용 안전 표준(IEC 60204-1)을 완벽히 구현한 시스템이 아닙니다 [S21]. 실제 사람과
    공존하는 산업 환경에 투입하기 위해서는 자격 있는 안전 전문가가 이중 채널 직접 개방형 회로, 수동 리셋, EDM, 이중 접촉기를 포함한 안전
    시스템을 재설계하고 검증해야 합니다 [S22].'
  worked_examples:
  - '예제 1: 전원 분기별 부하 계산. 11개의 액추에이터(XM430-W350-T)의 합계 스톨 전류는 25.3 A입니다 [S10]. 어댑터별
    11.5 A 출력에 4대/4대/3대로 분배하면, 분기당 최대 스톨 전류는 4대 기준 9.2 A입니다. 이는 10 A ATOF 퓨즈로 충분히
    보호 가능합니다 [S10, S14, S24].'
  - '예제 2: 무전원 상태 확인 절차. 전원 어댑터 플러그를 벤치에서 분리한 후, 멀티미터 전압계를 각 분기 하네스 커넥터에 연결한다. 0.3
    V DC가 측정되면 정상적으로 차단된 상태로 간주하여 작업을 진행한다.'
  lab:
    title: 전원 분리 검증 실습
    steps:
    - 모든 전원 어댑터를 물리적으로 AC 콘센트에서 분리한다.
    - 각 액추에이터 분기별로 Micro-Fit 커넥터를 분리한다.
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기 전원선의 양(+)과 음(-) 단자 사이의 전압을 측정한다.
    - 모든 측정치가 1 V DC 미만임을 확인하고 측정 기록지에 서명한다.
    safety:
    - 반드시 충격 방지 작업용 보안경을 착용한다.
    - 비상시 3개 어댑터를 즉시 분리할 수 있는 상태를 유지한다.
    - 전압이 1 V DC 이상일 경우 즉시 보고하고 작업을 중단한다.
    - 멀티미터의 측정 범위를 사전에 확인한다.
    deliverables:
    - 분기별 무전원 전압 측정 기록표
    - 전원 분기 및 퓨즈 상태 검사 사진
    - 안전 검증 체크리스트 완료본
  assignment:
    title: 로봇손 최종 성능 및 안전 보고서
    deliverables:
    - 최종 제작된 로봇손의 CAD 설계 데이터
    - 전원 분리 및 검증 절차를 포함한 운영 매뉴얼
    - 독립 전원 분기·퓨즈·물리적 전원 분리 절차를 문서화한다
    rubric:
    - 3개 분기 독립 전원 배선이 올바르게 구현되었는가?
    - 무전원 상태 검증 절차가 매뉴얼에 명확히 기술되었는가?
    - 액추에이터 분배와 퓨즈 사양이 설계에 반영되었는가?
    - 산업용 안전 시스템에 대한 이해가 보고서에 포함되었는가?
  quiz:
  - question: 무전원 상태를 확인하는 가장 올바른 방법은 무엇입니까?
    choices:
    - 회로의 저항을 측정한다.
    - 회로의 도통을 확인한다.
    - 멀티미터를 DC 전압 모드로 설정하여 1 V 미만인지 측정한다.
    - 퓨즈를 제거했으므로 무조건 전원이 차단되었다고 가정한다.
    answer_index: 2
    explanation: 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
      반드시 DC 전압 모드로 잔류 전압을 확인해야 합니다.
  - question: 11개의 액추에이터를 3개의 분기로 나누는 이유는 무엇입니까?
    choices:
    - 전선 개수를 줄이기 위해서
    - 독립적인 퓨즈 보호와 전원 분기의 부하 관리를 위해서
    - 액추에이터 속도를 높이기 위해서
    - 프로토타입 제작 비용을 줄이기 위해서
    answer_index: 1
    explanation: 각 분기를 독립적으로 보호하고, 단일 분기 고장 시 전체 시스템에 영향을 주는 것을 방지하기 위함입니다.
  - question: 본 프로젝트에서 3개의 전원 어댑터 출력선을 연결하는 것은 어떤 상태인가요?
    choices:
    - 더 많은 전력을 위해 권장되는 방법
    - 시스템 안정성을 높이는 방법
    - 절대 금지된 위험한 행위
    - 단순히 비효율적인 방법
    answer_index: 2
    explanation: 독립된 분기의 전원 어댑터 출력을 연결하면 결함이 확산되고 사고 위험이 커지므로 절대 금지됩니다.
  completion_criteria:
  - 3개 독립 분기의 무전원 상태 측정값이 모두 1 V DC 미만으로 확인됨.
  - 독립 퓨즈가 설계에 따라 각 분기에 올바르게 설치되었음을 확인.
  - 최종 성능 및 안전 보고서가 지정된 항목을 모두 포함하여 제출됨.
