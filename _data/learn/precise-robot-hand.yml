- id: M9
  slug: control-programming
  phase_id: P3
  title: 제어 코드 구현 및 프로그래밍
  estimated_hours: 10.0
  prerequisites:
  - M8
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 제어 모드와 데이터 구조를 이해한다.
  - Python을 활용하여 DYNAMIXEL 모터의 위치 및 속도를 제어하는 코드를 작성한다.
  - Arduino Mega 2560과 스마트 액추에이터 간의 통신 프로토콜을 설정한다.
  - 로봇손의 정교한 움직임을 위한 프로파일 제어 및 피드백 모니터링을 구현한다.
  theory_markdown: '## DYNAMIXEL 제어 및 시스템 프로그래밍


    정교한 5지 로봇손의 구현을 위해서는 모터의 위치, 속도, 전류를 실시간으로 제어할 수 있는 스마트 액추에이터 시스템이 필수적입니다. 본 모듈에서는
    ROBOTIS DYNAMIXEL XM430 시리즈 액추에이터를 중심으로 제어 프로그래밍을 다룹니다 [S36, S38, S40].


    ### 1. DYNAMIXEL 제어 구조

    DYNAMIXEL은 모터, 컨트롤러, 드라이버, 센서, 감속기가 통합된 지능형 액추에이터입니다 [S38, S40]. 제어는 **Control
    Table**이라 불리는 데이터 구조를 통해 이루어지며, 이는 RAM과 EEPROM 영역으로 나뉩니다 [S36, S41].

    - **RAM 영역:** 전원을 끄면 초기화되는 휘발성 데이터로, 현재 위치(`Present Position`), 목표 위치(`Goal Position`),
    토크 활성화(`Torque Enable`) 등의 제어/모니터링 데이터가 저장됩니다 [S36, S41].

    - **EEPROM 영역:** 전원이 꺼져도 유지되는 비휘발성 데이터로, 모터 ID, 통신 속도(Baud Rate), 동작 모드(`Operating
    Mode`) 등의 설정값이 저장됩니다 [S36, S41].


    ### 2. 주요 제어 모드

    로봇손의 손가락 관절 제어를 위해 주로 활용되는 모드입니다 [S38, S40]:

    - **Position Control Mode:** 특정 각도(0°~360°)로 이동하여 고정합니다. 관절 위치 제어에 핵심적입니다 [S38,
    S41].

    - **Current-based Position Control Mode:** 위치 제어와 함께 출력 전류(토크) 제한을 걸어, 물체를 잡을
    때 과도한 힘이 가해지지 않도록 합니다 [S38, S41].

    - **Profile Control:** 이동 시 가속도와 속도를 부드럽게 조절하여 급격한 움직임으로 인한 로봇손의 파손이나 떨림을 방지합니다
    [S36, S40].


    ### 3. 하드웨어 연동 및 통신

    본 프로젝트에서는 메인 제어기로 Arduino Mega 2560을 사용합니다 [S42, S44]. DYNAMIXEL의 디지털 패킷 통신(TTL
    또는 RS-485)은 직렬 통신 프로토콜을 따르며, DYNAMIXEL SDK를 통해 Python 혹은 C++ 환경에서 라이브러리 형태로 손쉽게
    제어할 수 있습니다 [S36, S40, S41].'
  worked_examples:
  - '### 예제 1: DYNAMIXEL 위치 제어 활성화 (Python)

    Python DYNAMIXEL SDK를 사용하여 모터의 토크를 활성화하고 특정 위치로 이동시키는 기본 로직입니다.

    ```python

    # Torque Enable

    packetHandler.write1ByteTxRx(portHandler, DXL_ID, ADDR_TORQUE_ENABLE, 1)


    # Goal Position 설정 (0~4095)

    packetHandler.write4ByteTxRx(portHandler, DXL_ID, ADDR_GOAL_POSITION, 2048)

    ```'
  - '### 예제 2: 실시간 데이터 피드백 모니터링

    모터의 현재 위치와 온도를 읽어와 로봇손의 상태를 확인합니다.

    ```python

    # Present Position 읽기

    present_pos, _, _ = packetHandler.read4ByteTxRx(portHandler, DXL_ID, ADDR_PRESENT_POSITION)


    # Present Temperature 읽기

    present_temp, _, _ = packetHandler.read1ByteTxRx(portHandler, DXL_ID, ADDR_PRESENT_TEMPERATURE)


    print(f"Position: {present_pos}, Temperature: {present_temp}C")

    ```'
