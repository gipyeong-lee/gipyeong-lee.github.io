- id: M12
  slug: final-project-reporting
  phase_id: P4
  title: 최종 보고서 및 결과 발표
  estimated_hours: 8.0
  prerequisites:
  - M11
  objectives:
  - 로봇 시스템 개발 프로젝트의 체계적인 기록 방법 이해
  - 공학적 설계 및 제작 과정을 기술 문서화하는 기법 습득
  - 최종 결과 발표를 위한 효과적인 데이터 시각화 및 발표 전략 수립
  theory_markdown: '### 공학 보고서와 기술 문서화의 중요성

    공학 프로젝트에서 기술 보고서는 연구의 완성도를 결정짓는 핵심 요소입니다. 로봇 시스템과 같이 기계, 전자, 소프트웨어가 융합된 복잡한 시스템에서는
    각 파트 간의 통합 과정과 문제 해결 전략을 논리적으로 기술해야 합니다. 기술 문서는 단순히 결과를 나열하는 것이 아니라, 설계 의도(Design
    Intent), 기술적 선택의 근거, 실험적 검증 결과 및 한계를 명확히 전달해야 합니다[S1, S3].


    ### 효과적인 결과 발표 전략

    결과 발표는 청중의 이해 수준에 맞춘 시각적 정보 전달이 핵심입니다. 특히 5지 로봇손과 같은 물리적 시스템은 기구학적 동작, 센서 데이터의
    실시간 응답성, 전체적인 제어 시스템의 루프 성능을 영상과 그래프로 요약하는 것이 효과적입니다[S12, S13]. 발표 자료에는 다음 항목이
    필수적으로 포함되어야 합니다:

    1. **문제 정의 및 요구사항**: 로봇손이 해결하고자 하는 구체적인 작업(예: 정교한 파지, 원격 조작) 기술.

    2. **시스템 아키텍처**: 기구부, 제어기(예: XM430-W350), 센서 통합 구조의 개략도.

    3. **성능 검증**: 정량적 데이터(파지력, 응답 시간, 내구 시험 결과)를 기반으로 한 검증.

    4. **결론 및 향후 과제**: 연구의 성과와 기술적 한계점, 개선 방안 제시.


    ### 프로젝트 관리 및 기록

    최종 보고서는 프로젝트 시작부터 종료까지의 모든 변경 사항을 추적할 수 있어야 합니다. 설계 변경 기록(Design Iteration)은 향후
    유사 프로젝트 진행 시 시행착오를 줄이는 귀중한 데이터베이스가 됩니다[S14, S21].'
  worked_examples:
  - '사례 1: 파지력 실험 데이터의 그래프화. 엑셀이나 매트랩을 사용하여 시간 대 파지력(N)을 시각화하고, 목표 수치(예: 10N) 도달 여부를
    통계적으로 증명하는 방법.'
  - '사례 2: 기구학적 간섭 발생 해결 기록. 3D 프린팅 후 관절 간 간섭 발생 시 CAD 설계를 수정하고(예: 필렛 반경 변경), 이를 보고서의
    ''설계 변경 이력'' 섹션에 명시하는 방법.'
  lab:
    title: 최종 검증 데이터 정리 및 시연 준비
    steps:
    - 지금까지 수집된 모든 실험 데이터(파지 시험, 내구 시험, 제어 루프 응답)를 정리합니다.
    - '로봇손의 주요 동작(예: 물체 파지, 손가락별 제어)을 시연할 영상 자료를 촬영하고 편집합니다.'
    - 시스템 다이어그램(배선도, 회로도, 펌웨어 블록도)을 최종본으로 업데이트합니다.
    - 최종 발표를 위한 프레젠테이션 슬라이드를 구성합니다.
    safety:
    - 배선 정리 중 전원 차단 필수
    - 날카로운 절단면 처리
    - 보안경 착용
    deliverables:
    - 정리된 실험 데이터셋
    - 최종 프레젠테이션 파일
    - 최종 기술 보고서 PDF
  assignment:
    title: 정교한 5지 로봇손 완성 최종 보고서
    deliverables:
    - 최종 기술 보고서 (제한된 페이지 내 요약)
    - 발표 자료 (시연 영상 포함)
    - BOM 및 모든 소스 코드 리포지토리 링크
    rubric:
    - 설계 목적과 요구사항의 달성 정도
    - 기술 문서의 논리적 흐름 및 정확성
    - 데이터 기반의 객관적 성능 분석 여부
    - 발표 내용의 명확성과 질문에 대한 기술적 대응 능력
  quiz:
  - question: 공학 보고서에서 설계 변경 이력(Design Iteration)을 기록하는 주된 이유는 무엇인가?
    choices:
    - 보고서 분량을 늘리기 위해서
    - 향후 프로젝트의 시행착오를 줄이고 재현성을 높이기 위해서
    - 특허 출원을 위해서만 필요하므로
    - 지도 교수의 요구사항을 충족하기 위해서
    answer_index: 1
    explanation: 설계 변경 기록은 과거의 기술적 선택과 문제 해결 과정을 문서화하여, 유사한 난관 발생 시 빠르게 대응하고 프로젝트의
      재현성을 확보하는 데 필수적입니다.
  - question: 기술 결과 발표 시 정량적 데이터(Quantitative Data)의 중요성에 대한 설명으로 적절한 것은?
    choices:
    - 데이터는 발표를 지루하게 만들므로 생략하는 것이 좋다
    - 성능을 객관적으로 입증하여 신뢰성을 확보하는 근거가 된다
    - 데이터는 해석하기 어려우므로 결과에 대한 직관적 설명만 포함한다
    - 정성적인 설명보다 정량적인 데이터는 전혀 중요하지 않다
    answer_index: 1
    explanation: 공학 프로젝트에서 정량적 데이터는 시스템의 실제 성능을 객관적으로 입증하는 가장 강력한 수단이며 신뢰성을 부여합니다.
  completion_criteria:
  - 최종 기술 보고서 제출
  - 최종 결과 발표회 완료
  - 정리된 프로젝트 아카이브 제출
