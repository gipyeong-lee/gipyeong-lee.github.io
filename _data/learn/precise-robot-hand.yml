- id: M4
  slug: frame-assembly
  phase_id: PH2
  title: 구조 제작 및 조립
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 5지 로봇손 프레임의 조립 공차와 정밀 체결 원리 이해
  - PC-CF 탄소섬유 강화 필라멘트의 물성 및 조립 주의사항 숙지
  - 반복 조립 가능한 나사산 인서트 설계 및 열압입 기술 습득
  - 텐던 구동 장치의 핵심인 샤프트-베어링 계열 조립 및 유격 관리 수행
  theory_markdown: '### 로봇 구조 조립의 정밀도와 신뢰성


    로봇손의 구조적 성능은 부품 간의 조립 정밀도에 크게 의존합니다. 본 과정에서는 탄소섬유가 강화된 PC-CF 필라멘트를 사용하여 강성과 치수
    안정성을 확보합니다 [S18]. 조립의 재현성을 극대화하기 위해 직접 나사 체결 방식 대신 황동 열압입 인서트를 채택합니다 [S20].


    #### 1. 열압입 인서트(Heat-Press Insert) 기술

    PC-CF 출력물은 고강도이지만 열경화성 수지처럼 재나사 조립에 취약할 수 있습니다. 이를 보완하기 위해 M3 황동 인서트를 4.0 mm 파일럿
    홀에 열압입하여 안정적인 암나사를 생성합니다 [S20]. 이 과정에서 인서트 외경(4.4 mm)과 파일럿 홀 규격 준수는 구조적 무결성을 보장하는
    핵심입니다 [S20].


    #### 2. 회전축과 베어링 시스템

    손목 및 관절의 구동축은 iglide JSM-0810-10 베어링과 8 mm 알루미늄 샤프트를 사용합니다 [S16, S17]. 무급유 베어링은
    마찰을 최소화하고 유지보수를 간소화합니다 [S16]. 이때 베어링은 압입(Press-fit) 설계이며, 하우징 보어 규격에 따른 간섭량을 관리하여
    유격을 최소화해야 합니다 [S16].


    #### 3. 조립 안전 및 관리

    구조물 조립 시 사용되는 모든 M3 캡스크루는 JIS B 1176 표준 규격을 따르며, 일관된 체결 토크를 유지하여 나사 풀림을 방지해야 합니다
    [S19]. 또한, 구조 제작 단계에서의 모든 전원 연결은 전원이 완벽히 차단된 상태에서 이루어져야 하며, 물리적 전원 분리를 통한 무전원
    상태 확인이 필수적입니다.'
  worked_examples:
  - '예시 1: 8 mm 베어링 하우징 보어 설계

    JSM-0810-10 베어링(외경 10 mm)을 위해 10 mm 하우징 보어를 확보하십시오. 압입 시 베어링 외경이 2% 수준으로 압축되며
    내경이 미세하게 조정되므로, 조립 후 8 mm 축이 매끄럽게 회전하는지 확인해야 합니다 [S16].'
  - '예시 2: 황동 인서트 열압입

    4.0 mm 파일럿 홀이 출력된 PC-CF 부품에 4.4 mm 외경의 황동 인서트를 열압입합니다 [S20]. 인서트의 측면 돌기(Knurls)가
    충분히 녹아들어 PC-CF 모재와 결합하도록 정밀한 가열이 필요합니다. 과도한 가열은 출력물을 변형시키므로 주의하십시오 [S18].'
  lab:
    title: 손바닥 프레임 및 관절 모듈 조립
    steps:
    - PC-CF로 출력된 프레임 부품의 파일럿 홀 규격(4 mm)을 멀티미터와 캘리퍼스로 확인합니다.
    - 열압입 인서트를 설정된 온도로 가열하여 프레임 파일럿 홀에 수직으로 장착합니다.
    - 8 mm 슬리브 베어링을 손목 하우징에 압입하고, 8 mm 알루미늄 샤프트를 삽입하여 정렬을 확인합니다.
    - M3 캡스크루를 사용하여 링크와 센서 브래킷을 체결하되, 과도한 토크로 나사산이 뭉개지지 않도록 주의합니다.
    - 각 조립부의 유격 및 회전 마찰을 계측하여 기준값 이내인지 확인합니다.
    safety:
    - 납땜 인두 또는 열압입 공구 사용 시 화상 방지를 위해 보호장갑을 착용하십시오.
    - 고온의 노즐 및 열압입 공구 주변의 가연성 물질을 제거하십시오.
    - 조립 완료 후 무전원 상태에서 멀티미터를 DC 전압 모드로 설정하여, 잔류 전압이 1 V 미만임을 확인한 후 손을 접근하십시오.
    - 기계적 압입 과정에서 핀치 포인트(손 끼임)가 발생할 수 있으니 장갑 및 안전 보호구 착용이 필수입니다.
    deliverables:
    - 조립이 완료된 로봇손 프레임 사진
    - 각 회전축의 마찰력 측정 기록
    - 조립 공차 관리 체크리스트
  assignment:
    title: 프레임 조립 구조 및 공차 보고서
    deliverables:
    - 조립 완료된 프레임 CAD 파일 및 실제 측정 치수 비교표
    - 베어링 압입력과 회전 저항의 상관관계에 대한 분석 보고서
    - 반복 분해·조립 후 인서트 나사산의 내구 상태 기록
    rubric:
    - 인서트 장착 시 수직도와 정밀도가 설계 도면과 일치하는가?
    - 베어링과 샤프트 간의 유격이 회전 운동에 적절한 수준으로 관리되는가?
    - 조립된 프레임이 지정된 강성을 유지하며 변형이 없는가?
  quiz:
  - question: PC-CF 구조물에 M3 황동 인서트를 사용해야 하는 주된 이유는 무엇입니까?
    choices:
    - 필라멘트 절약
    - 반복 분해·조립 시 나사산 손상 방지 및 결합력 향상
    - 전기적 도통 확보
    - 무게를 줄이기 위해
    answer_index: 1
    explanation: PC-CF 소재에 직접 나사를 체결하는 것보다 황동 열압입 인서트를 사용하면 나사산의 기계적 내구성이 높아져 반복적인
      조립이 가능해집니다 [S20].
  - question: JSM-0810-10 베어링 압입 시 가장 주의해야 할 사항은 무엇입니까?
    choices:
    - 윤활유를 충분히 도포해야 한다
    - 하우징 보어의 규격 공차를 준수하여 적정 압입량을 유지해야 한다
    - 망치로 강하게 때려 박아야 한다
    - 냉각 상태에서 조립해야 한다
    answer_index: 1
    explanation: iglide 베어링은 압입형 베어링이므로, 하우징 보어 규격이 적절해야 압입 후 내경이 규격대로 유지되어 원활한 회전이
      가능합니다 [S16].
  completion_criteria:
  - 로봇손 5지 프레임 전체 조립 완료
  - 모든 회전축의 유격 및 마찰력 정상 범위 내 확인
  - 전원 분리 상태에서 1 V 미만 DC 잔류 전압 확인 완료
  - 최종 조립 공차 보고서 제출 및 승인
