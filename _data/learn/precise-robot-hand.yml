modules:
- id: M1
  slug: robotics-kinematics-basics
  phase_id: PH1
  title: 로봇 기구학 기초
  estimated_hours: 12.0
  prerequisites: []
  objectives:
  - 로봇손 기구학 모델링을 위한 강체 변환 행렬 이해
  - 텐던 구동 로봇손의 자유도(DOF)와 운동학적 제약 조건 분석
  - DYNAMIXEL 스마트 액추에이터의 피드백 데이터를 이용한 위치 제어 기초 학습
  theory_markdown: '### 로봇 기구학 기초

    로봇손의 제어는 각 관절의 각도와 위치를 정확히 계산하는 기구학(Kinematics)에서 시작됩니다. 5지 로봇손은 다수의 관절을 가진 고자유도
    시스템으로, 각 링크의 위치는 동차 변환 행렬(Homogeneous Transformation Matrix)을 사용하여 표현합니다 [S7].


    #### 텐던 구동 시스템

    텐던 구동은 액추에이터를 손가락 끝단이 아닌 손바닥이나 팔뚝에 배치하여 로봇손의 질량을 줄이고 민첩성을 높입니다. 텐던 장력 $T$는 관절
    토크 $\tau$와 캡스턴 반지름 $r$의 관계식 $\tau = T \times r$을 통해 결정됩니다. 텐던 구동기 설계 시 Dyneema
    SK78과 같은 고강도 저신율 섬유를 사용하여 위치 정밀도를 확보합니다 [S14].


    #### 액추에이터 및 제어

    본 시스템은 11개의 DYNAMIXEL XM430-W350-T 액추에이터를 사용하여 구동합니다 [B1]. 각 액추에이터는 12V 전압에서 동작하며
    스톨 전류 2.3A를 가집니다 [B1, S10]. OpenCR 컨트롤러는 이 액추에이터와 직접 통신하며, 시스템의 안전을 위해 각 액추에이터
    분기를 독립적으로 퓨즈 보호해야 합니다 [B2, B3, B10].'
  worked_examples:
  - '관절 토크 계산: 액추에이터 스톨 토크가 4.1 N·m이고 캡스턴 반지름이 0.01 m일 때, 이론적인 텐던 최대 장력은 $T = \tau
    / r = 4.1 / 0.01 = 410 N$입니다 [B1].'
  - '전류 부하 산정: 11개의 액추에이터가 동시에 스톨 전류를 발생시킬 때 전체 피크 전류는 $11 \times 2.3 A = 25.3 A$입니다
    [B1]. 이를 3개의 독립 퓨즈 분기로 나누어 배분하면 분기당 최대 약 9.2 A(4대 배분 시)가 되어 10 A 퓨즈 보호 하에 안전하게
    동작합니다 [B3, B10].'
  lab:
    title: 로봇손 링크 설계 및 텐던 장력 측정 실험
    steps:
    - FDM 프린터를 사용하여 PC-CF 필라멘트로 손가락 링크 출력
    - 8 mm 샤프트와 무급유 베어링을 사용하여 관절 조립
    - Dyneema 텐던을 액추에이터 캡스턴에 연결하고 초기 장력 설정
    - 멀티미터를 DC 전압 모드로 설정하여 전원 분기별 12V 안정성 확인
    - DYNAMIXEL Wizard를 통해 액추에이터 위치 피드백 데이터 수집
    safety:
    - 실험 중 전원 인가 시 손가락 가동 범위에 신체 부위 진입 금지
    - 모든 정비 및 접근 전 3개의 12V 어댑터를 물리적으로 분리하고 멀티미터로 1V 미만 잔류 전압 확인
    - PC-CF 출력물 조립 및 텐던 장력 시험 중 충격 방지 보안경 필수 착용
    - 배선 분기에는 반드시 지정된 10 A 퓨즈를 장착하고 메인 전원 버스 병렬 연결 절대 금지
    deliverables:
    - 관절 가동 범위 측정 데이터
    - 텐던 장력 조절 기록
    - 전원 분기별 잔류 전압 측정 로그
  assignment:
    title: 5지 로봇손 운동학 모델링 및 전류 분석 보고서
    deliverables:
    - 5지 로봇손 각 관절에 대한 Denavit-Hartenberg 파라미터 테이블
    - 11개 액추에이터의 총 피크 전류를 고려한 3개 전원 분기 구성도
    - FSR 센서 신호 처리를 위한 3.3V 분압 회로 설계도
    rubric:
    - 운동학 모델의 정확성(좌표계 설정 적절성)
    - BOM에 명시된 퓨즈 정격 및 액추에이터 스톨 전류를 고려한 전원 분기 설계 적절성
    - 안전 수칙 준수 명시 및 무전원 검증 절차 이해도
  quiz:
  - question: 본 시스템에서 11개의 액추에이터를 3개의 전원 분기로 나누어 사용하는 주된 이유는 무엇입니까?
    choices:
    - 전원 분기별 퓨즈를 통해 과전류로부터 배선을 보호하기 위해
    - 액추에이터의 통신 속도를 높이기 위해
    answer_index: 0
    explanation: 각 액추에이터 분기는 10A 퓨즈와 독립적인 물리적 분리 수단을 갖추어 과전류 사고로부터 보호되어야 합니다 [B3,
      B10].
  - question: OpenCR 보드에서 FSR 힘 센서를 사용할 때 올바른 전원 공급 방식은 무엇입니까?
    choices:
    - 12V 액추에이터 전원 라인 사용
    - 3.3V 전용 센서 rail 사용
    answer_index: 1
    explanation: 센서 신호의 ADC 정밀도와 안전을 위해 반드시 3.3V 센서 전원 rail만 사용해야 합니다 [B2].
  completion_criteria:
  - 5지 로봇손의 운동학 모델링 보고서 제출
  - 전원 분기별 퓨즈 보호 및 무전원 검증 절차 이해 확인
  - 실습 실험 데이터(가동 범위 및 전압 측정) 기록 완료
  source_ids:
  - S7
  - S14
  - S10
- id: M2
  slug: tendon-system-design
  phase_id: PH1
  title: 텐션 구동 메커니즘 설계
  estimated_hours: 12.0
  prerequisites:
  - M1
  objectives:
  - 텐션 구동 로봇손의 동역학 기초와 텐던 라우팅 원리를 이해한다.
  - 고강도 텐던 소재인 Dyneema SK78의 물리적 특성과 기구학적 요구사항을 분석한다.
  - 액추에이터 토크가 텐던 장력으로 변환되는 효율적인 전달 경로를 설계한다.
  - 구동 시스템의 마찰 관리 및 기구적 백래시(backlash) 최소화 전략을 학습한다.
  theory_markdown: "## 텐던 기반 구동 메커니즘\n\n텐션(Tendon) 구동 시스템은 원격 구동기(actuator)의 회전 운동을\
    \ 유연한 케이블을 통해 손가락 관절로 전달하는 방식입니다. 이는 무거운 액추에이터를 손바닥이나 손목으로 분산 배치하여 손가락을 경량화할 수\
    \ 있는 핵심 기술입니다 [S8]. \n\n### 텐던 동역학 및 재료 선택\n텐던은 인장 하중을 전달하는 매개체로, 초기 장력(pre-tension)\
    \ 설정과 신율(stretch) 관리가 정밀 제어의 핵심입니다. Dyneema SK78과 같은 초고분자량 폴리에틸렌(UHMWPE) 섬유는 파단\
    \ 하중이 230 daN으로 매우 높으며, 작동 신율이 1% 미만으로 정밀한 위치 제어에 적합합니다 [S14]. 신율이 낮은 소재를 사용함으로써\
    \ 시스템의 기구적 히스테리시스를 줄이고 제어 대역폭을 확보할 수 있습니다.\n\n### 기구학적 설계 원리\n텐던은 관절의 회전 중심을 지나는\
    \ 경로(라우팅)를 따라 이동해야 합니다. 만약 라우팅 경로가 회전 중심에서 벗어날 경우, 관절 각도 변화에 따라 텐던 길이가 변하는 결합(coupling)\
    \ 현상이 발생합니다. 이를 최소화하기 위해 회전축 주위에 캡스턴(capstan) 구조를 배치하여 곡률 반경을 유지하고 마찰 손실을 줄여야\
    \ 합니다 [S14]. 또한, 반복적인 굽힘에 따른 피로 파괴를 방지하기 위해 캡스턴 모서리는 반드시 라운딩 처리되어야 합니다."
  worked_examples:
  - '예제 1: 텐던 파단 하중 검증. 로봇손 액추에이터가 4.1 N·m의 스톨 토크 [S10]를 출력할 때, 반경 10 mm 캡스턴에 작용하는
    장력 T를 계산하시오. T = Torque / Radius = 4.1 N·m / 0.01 m = 410 N. 410 N은 약 41.8 daN이며,
    이는 사용된 Dyneema SK78의 파단 하중 230 daN [S14] 대비 약 18% 수준으로 충분한 안전율을 확보하고 있음을 알 수 있습니다.'
  - '예제 2: 텐던 신율에 따른 오차. 전체 텐던 길이가 300 mm일 때 작동 신율이 1% [S14]라면 최대 오차 변위는 3 mm입니다.
    위치 제어 정밀도가 0.5 mm 이하로 요구되는 경우, 초기 장력 조절을 통해 작동 범위 내 탄성 변형을 최소화해야 함을 이론적으로 이해할
    수 있습니다.'
  lab:
    title: 텐던 마찰 및 라우팅 시험
    steps:
    - FDM 프린터로 출력한 손가락 링크와 캡스턴 모델에 Dyneema SK78 텐던을 배치한다.
    - 멀티미터를 DC 전압 모드로 설정하고, 독립 분기 전원 3개를 분리한 후 모든 배선의 전압이 1 V 미만인지 확인한다.
    - 텐던 한쪽 끝에 5 N의 정하중을 걸고 다른 쪽에서 힘 센서를 사용하여 전달된 장력을 측정한다.
    - 다양한 곡률을 가진 캡스턴 샘플을 교체하며 마찰 손실을 비교 데이터로 기록한다.
    safety:
    - 전원 공급 장치와 분리된 무전원 상태를 멀티미터로 반드시 확인 후 작업한다.
    - 텐던 장력 시험 중 절단 및 인장 부하로 인한 비산 방지를 위해 보안경을 착용한다.
    - 액추에이터 가동 시험 시 손을 가동 범위 내에 절대 넣지 않는다.
    deliverables:
    - 텐던 곡률별 장력 손실 효율 그래프
    - 마찰 최소화를 위한 캡스턴 설계 수정 사항
    - 실험 안전 점검 기록
  assignment:
    title: 5지 로봇손 텐던 라우팅 CAD 설계
    deliverables:
    - 텐던 경로가 포함된 손가락 링크 CAD 파일
    - 텐던 장력 전달 분석 보고서
    rubric:
    - 캡스턴의 라운딩 처리가 마찰을 최소화하도록 설계되었는가?
    - 텐던 경로가 관절 회전 중심과 기구학적으로 일관성이 있는가?
    - 사용된 부품의 사양(Dyneema SK78)이 명시되었는가?
  quiz:
  - question: Dyneema SK78 텐던을 사용할 때 얻을 수 있는 주요 이점은 무엇입니까?
    choices:
    - 높은 신율로 인한 충격 완화
    - 높은 파단 하중과 1% 미만의 낮은 신율 [S14]
    answer_index: 1
    explanation: SK78은 신율이 매우 낮아 정밀한 위치 제어에 유리합니다 [S14].
  - question: 텐던 라우팅 시 캡스턴 모서리를 라운딩 처리해야 하는 이유는 무엇입니까?
    choices:
    - 마찰을 줄이고 반복 굽힘에 따른 피로 파괴를 방지하기 위해 [S14]
    - 텐던의 지름을 늘리기 위해
    answer_index: 0
    explanation: 날카로운 모서리는 텐던의 마찰을 증가시키고 조기 파단을 유발합니다 [S14].
  - question: 실험 중 안전을 위해 비전원 상태를 확인하는 올바른 방법은 무엇입니까?
    choices:
    - 저항 모드로 회로의 연결을 확인한다
    - DC 전압 모드로 각 전원 분기의 전압이 1 V 미만임을 측정한다
    answer_index: 1
    explanation: 비전원 상태는 멀티미터의 전압 측정으로만 검증해야 하며 저항이나 도통 모드는 사용할 수 없습니다.
  completion_criteria:
  - 텐던 라우팅 효율 시험을 통해 80% 이상의 장력 전달 효율을 달성함을 검증
  - 제출된 CAD 모델이 텐던의 기구학적 경로를 준수함을 확인
  - 모든 실습 과정에서 전압 계측을 통한 안전 프로토콜 준수 확인
  source_ids:
  - S8
  - S9
  - S14
  - S10
- id: M3
  slug: structure-fabrication
  phase_id: PH2
  title: 구조 부품 출력 및 조립
  estimated_hours: 15.0
  prerequisites:
  - M2
  objectives:
  - 3D 프린팅된 구조 부품과 액추에이터를 정밀하게 조립하는 기법을 습득한다.
  - 열압입 인서트(Heat-set Insert)를 사용하여 플라스틱 하우징의 나사산을 생성하는 올바른 방법을 익힌다.
  - 텐션 기반 구동 시스템의 텐던 라우팅 및 텐션 조절 원리를 이해한다.
  - 독립적인 전력 분기 시스템의 안전한 물리적 구성과 배선 정리를 실습한다.
  theory_markdown: "## 구조 부품 출력 및 조립 이론\n\n### 1. FDM 3D 프린팅의 치수 관리\n본 프로젝트에서는 탄소섬유가\
    \ 첨가된 PC(Polycarbonate) 필라멘트(`B7`)를 사용합니다. PC-CF는 높은 강성과 치수 안정성을 제공하지만, 출력물의 수축률(Shrinkage)에\
    \ 따른 공차 관리가 중요합니다. 조립 시 베어링(`B8`)이나 샤프트(`B-SHAFT`)가 들어가는 구멍은 설계 시 부여된 공차와 실제 출력물의\
    \ 오차를 고려해야 합니다. \n\n### 2. 열압입 인서트의 원리\n반복적인 분해와 조립이 필요한 구조물에서는 플라스틱 나사산을 직접 사용하지\
    \ 않고 황동 열압입 인서트(`B9`)를 사용합니다. 인서트를 가열된 납땜 인두로 가압하면 주위의 PC-CF가 국부적으로 용융되어 인서트의\
    \ 널링(Knurling) 구조 안으로 흐릅니다. 냉각 후에는 높은 인발 강도(Pull-out strength)를 가지며, M3 나사(`B-FASTENER`)를\
    \ 반복적으로 체결해도 나사산이 뭉개지지 않습니다. 권장 구멍 지름 4.0 mm를 반드시 준수해야 과도한 응력이 발생하지 않습니다 [S19].\n\
    \n### 3. 액추에이터 및 전원 배선의 독립성\n시스템의 안정성을 위해 DYNAMIXEL 액추에이터(`B1`) 전원은 3개의 독립적인 절연\
    \ 전원 어댑터(`B3`)로 분기됩니다. 각 분기는 독립적인 10 A ATOF 퓨즈(`B10`)와 인라인 홀더(`B-WIRING-FUSE-HOLDER`)를\
    \ 거칩니다. **각 어댑터의 양(+) 출력은 서로 전기적으로 병렬 연결되지 않도록 절대 분리하여 관리해야 합니다.** 이는 과전류 발생 시\
    \ 퓨즈가 적절히 동작하여 배선을 보호하고, 전체 시스템의 돌발적 쇼트 사고를 방지하기 위함입니다 [S13, S21]."
  worked_examples:
  - '예제 1: 열압입 인서트 삽입 깊이 조절 - M3 황동 인서트의 길이는 5.8 mm입니다(`B9`). 출력물의 파일럿 홀 깊이가 최소 6.0
    mm 이상인지 확인하고, 인두기 온도를 필라멘트 유리전이 온도 이상으로 설정하여 수직으로 가볍게 압입합니다. 수평이 틀어지면 나사 체결 시
    링크가 기울어질 수 있으므로 주의합니다.'
  - '예제 2: 퓨즈 분기 및 부하 계산 - 한 개의 전원 분기에 액추에이터 4대를 연결하는 경우, 스톨 전류 합계는 2.3 A × 4 = 9.2
    A입니다(`B1`). 사용되는 10 A 퓨즈(`B10`)는 9.2 A보다 높고 11.5 A 어댑터 출력보다 낮아 적절한 보호 범위를 제공합니다.
    만약 5대를 연결하면 11.5 A가 되어 퓨즈가 단락될 가능성이 높으므로 반드시 규격 내 분기 배분을 지켜야 합니다.'
  lab:
    title: 로봇손 구조 모듈 제작 및 독립 분기 배선 실습
    steps:
    - 손가락 링크 및 손바닥 프레임 출력물의 서포트를 제거하고 공차면을 다듬는다.
    - 4.0 mm 파일럿 홀에 M3 황동 열압입 인서트를 수직으로 압입한다.
    - igus 슬리브 베어링(`B8`)을 하우징에 압입하고 8 mm 샤프트(`B-SHAFT`)를 삽입하여 회전 유격을 확인한다.
    - Dyneema 텐던(`B6`)을 캡스턴에 감고 관절 말단에 고정하여 초기 장력을 형성한다.
    - 3개 전원 어댑터 분기별로 10 A 퓨즈 홀더를 연결하고, Micro-Fit 3.0 커넥터(`B5`)를 사용하여 각 손가락 모듈과 하네스를
      구성한다.
    safety:
    - 열압입 작업 시 발생하는 흄(Fume) 흡입을 방지하기 위해 환기가 잘 되는 곳에서 작업하고 보안경을 착용한다.
    - 텐던 장력 시험 중 텐던이 파단될 경우를 대비하여 보안경을 필수 착용한다.
    - 전원 배선 완료 후, 전원 인가 전 반드시 멀티미터로 각 분기 단자 간 쇼트 여부를 저항 모드로 확인한다.
    - 본 실습의 계획 정지는 3개 어댑터를 물리적으로 분리하는 것이며, 액세스 전 1 V DC 미만임을 계측기로 확인한다.
    deliverables:
    - 인서트가 수직으로 조립된 출력물 사진
    - 베어링-샤프트 간 마찰이 최소화된 회전 영상
    - 각 독립 분기별 배선 및 퓨즈 구성 확인 보고서
  assignment:
    title: 구조 조립 정밀도 및 퓨즈 보호 설계 보고서
    deliverables:
    - 조립된 로봇손 프레임의 CAD 설계 치수와 실측 치수 비교표
    - 독립 전원 분기 3곳의 배선도와 각 분기별 예상 부하 합계 데이터
    - 반복 동작 시 베어링 마모 및 텐던 신율 관리 계획
    rubric:
    - 열압입 인서트가 수직으로 정밀하게 매립되었는가?
    - 3개의 전원 어댑터가 독립적인 독립 분기로 전기적으로 격리되었는가?
    - 액추에이터 분기별 부하 합계가 10 A 퓨즈 정격을 준수하는가?
    - 텐던 장력 전달 구조에서 캡스턴 라운딩 처리가 올바르게 수행되었는가?
  quiz:
  - question: PC-CF 소재에 M3 열압입 인서트를 삽입할 때 가장 적절한 파일럿 홀 지름은 무엇입니까?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 5.0 mm
    - 6.0 mm
    answer_index: 1
    explanation: 데이터시트(`B9`)에 따르면 권장 구멍 지름은 4.0 mm입니다. 이보다 작으면 플라스틱이 변형되고 크면 인서트가
      헛돌게 됩니다.
  - question: 로봇손 액추에이터 전원 시스템의 안전을 위해 반드시 지켜야 할 사항은 무엇입니까?
    choices:
    - 모든 액추에이터의 12 V 라인을 하나의 메인 버스에 연결한다.
    - 독립된 3개의 어댑터 출력을 전기적으로 병렬 연결하여 전력을 합산한다.
    - 각 전원 분기는 독립적인 퓨즈를 통하며, 양(+) 출력을 병렬 연결하지 않는다.
    - 전원 분리 없이 퓨즈만 교체하면 안전하다.
    answer_index: 2
    explanation: 각 어댑터 출력은 독립적으로 유지해야 하며 병렬 연결은 시스템 쇼트 사고를 유발할 수 있습니다(`B3`).
  - question: Dyneema SK78 텐던(`B6`)을 사용할 때 가장 중요하게 고려해야 할 사양은 무엇입니까?
    choices:
    - 저항값
    - 최대 전압
    - 파단 하중 및 작동 신율
    - 통신 프로토콜
    answer_index: 2
    explanation: 텐던은 액추에이터의 장력을 전달하는 부품이므로 파단 하중(230 daN)과 작동 신율(1% 미만)이 정밀 제어의 핵심
      요소입니다.
  completion_criteria:
  - 모든 구조 부품이 설계 도면에 따라 유격 없이 조립되어야 함.
  - 3개의 독립 전원 분기가 전기적으로 완전히 격리되었음이 확인되어야 함.
  - 각 액추에이터 분기별 퓨즈 장착 및 정상 도통이 계측기로 확인되어야 함.
  - 로봇손 동작 시 간섭 없이 텐던이 원활하게 구동되어야 함.
  source_ids:
  - S17
  - S19
  - S13
  - S21
- id: M4
  slug: actuator-integration
  phase_id: PH2
  title: 액추에이터 및 베어링 시스템
  estimated_hours: 12.0
  prerequisites:
  - M3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 동작 원리와 물리적 결합 방식을 이해한다.
  - 정밀 텐던 구동을 위한 무급유 슬리브 베어링의 배치와 마찰 관리 이론을 익힌다.
  - OpenCR 제어기의 하드웨어 아키텍처와 독립 전원 분기 시스템의 안전한 구성 원리를 습득한다.
  - 열압입 인서트를 이용한 반복 조립 가능한 기구 구조 설계 기법을 학습한다.
  theory_markdown: '### 1. 액추에이터 통합

    로봇손의 구동은 DYNAMIXEL XM430-W350-T를 활용하며, 이는 위치, 속도, 전류 피드백을 실시간으로 제공하여 정밀한 텐던 장력
    제어를 가능하게 한다 [S10]. 각 액추에이터는 12 V 전원 분기를 사용하며, 시스템 안전을 위해 절연형 데스크톱 전원 어댑터 3개를 사용하여
    액추에이터 11개를 4대/4대/3대로 배분하고 각각 독립 퓨즈 분기로 구성해야 한다 [S13].


    ### 2. 베어링 및 기구 구조

    손목 및 고하중 회전축에는 유지보수가 필요 없는 igus JSM-0810-10 무급유 폴리머 슬리브 베어링을 사용한다 [S15]. 이는 8
    mm 정밀 알루미늄 샤프트와 조합되어 저마찰 및 진동 감쇠 특성을 제공한다 [S16]. 반복 분해 조립이 필요한 부분에는 황동 열압입 나사산
    인서트를 PC-CF 출력물에 삽입하여 체결 강도를 확보한다 [S17, S19].


    ### 3. 제어 아키텍처

    OpenCR 1.0 제어 보드는 별도의 브리지 회로 없이 액추에이터를 직접 연결할 수 있어 재현성과 안전성이 높다 [S12]. 손끝 힘 감지를
    위한 FSR 402 센서는 3.3 V 센서 전원 레일과 10 kΩ 저항을 활용하여 ADC 입력 전압을 0~3.3 V 범위 내로 유지하도록 설계해야
    한다 [S11, S12, S23].'
  worked_examples:
  - '액추에이터 전원 분기 계산: 액추에이터 XM430-W350-T의 스톨 전류는 2.3 A이다 [S10]. 4대 단위의 퓨즈 분기에서 발생하는
    피크 전류는 9.2 A이며, 이는 10 A ATOF 퓨즈의 정격 범위 내에 포함되어 과전류로부터 배선을 안전하게 보호한다 [S10, S22].'
  - 'FSR 전압 분압기 설계: FSR과 10 kΩ 저항을 이용한 전압 분압 회로에서, OpenCR의 12-bit ADC는 3.3 V 센서 레일을
    기준으로 힘에 따른 저항 변화를 전압으로 변환하여 취득한다 [S11, S12, S23].'
  lab:
    title: 액추에이터 하네스 제작 및 시스템 기초 통전 시험
    steps:
    - 각 12 V 전원 어댑터 출력단에 ATO 인라인 퓨즈 홀더를 사용하여 10 A 퓨즈를 장착한다 [S13, S21, S22].
    - Micro-Fit 3.0 커넥터를 사용하여 각 액추에이터 그룹별 전원 하네스를 제작한다 [S5].
    - 정밀 알루미늄 샤프트를 적정 길이로 절단하고 모따기하여 베어링 장착 부위를 준비한다 [S16].
    - PC-CF 출력물에 4.0 mm 파일럿 홀을 확인하고 열압입 인서트를 삽입한다 [S17, S19].
    - 각 전원 분기를 독립적으로 연결하고 멀티미터를 사용하여 12 V 전압을 측정한다.
    safety:
    - 실험 중 계획 정지는 3개의 독립 전원 어댑터를 물리적으로 분리하는 것을 원칙으로 한다.
    - 전원 인가 전 반드시 멀티미터의 DC 전압 모드로 각 분기 전압이 12 V 내외인지 확인한다.
    - 납땜 인두 및 인서트 열압입 작업 시 화상 방지를 위해 보안경을 착용한다.
    - 전원 인가 중에는 로봇손의 가동 범위에 손을 넣지 않는다.
    deliverables:
    - 독립 분기 전압 측정 기록(멀티미터 스크린샷 포함)
    - 액추에이터별 통신 및 모션 정상 작동 확인서
    - 열압입 인서트 삽입 및 베어링 회전 유격 검사 보고서
  assignment:
    title: 액추에이터 전원 분기 설계 보고서
    deliverables:
    - 액추에이터 그룹별 배선도(퓨즈 위치 및 커넥터 명시)
    - 피크 전류 계산식 및 퓨즈 선택 타당성 보고서
    rubric:
    - 독립 전원 분기 구성의 물리적 절연 원칙 준수 여부
    - 퓨즈 정격과 액추에이터 스톨 전류 합계의 정량적 근거 제시
    - 데이터시트에 명시된 규격에 기반한 부품 선정의 정확성
  quiz:
  - question: DYNAMIXEL XM430-W350-T 액추에이터의 정격 전압은 얼마입니까?
    choices:
    - 5 V
    - 12 V
    - 24 V
    - 3.3 V
    answer_index: 1
    explanation: XM430-W350-T 액추에이터의 기준 입력 전압은 12 V입니다 [S10].
  - question: FSR 402 센서와 OpenCR 제어기 연결 시 권장되는 센서 전원 전압은?
    choices:
    - 12 V
    - 5 V
    - 3.3 V
    - 24 V
    answer_index: 2
    explanation: OpenCR의 ADC 입력 보호와 정확한 측정을 위해 FSR 분압 회로는 3.3 V 센서 레일을 사용해야 합니다 [S12].
  - question: 12 V 전원 어댑터 출력단을 병렬로 연결하는 것이 허용됩니까?
    choices:
    - 허용됨
    - 절대 금지
    answer_index: 1
    explanation: 시스템 안전과 액추에이터 보호를 위해 각 전원 어댑터의 출력은 독립 분기로 사용해야 하며 병렬 연결은 절대 금지합니다
      [S13].
  completion_criteria:
  - 각 액추에이터 독립 분기 전압이 12 V 정상 범위를 유지함
  - 모든 텐던 구동 액추에이터가 OpenCR을 통해 제어 가능함
  - 하드웨어 조립 보고서 및 안전 준수 확인서를 제출함
  source_ids:
