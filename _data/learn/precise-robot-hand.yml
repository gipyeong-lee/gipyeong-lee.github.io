  - 설계 최종 보고서 제출 및 평가 점수 70점 이상 획득
  - 기구부 조작 확인 영상 제출
  source_ids:
  - S12
  - S13
- id: M5
  slug: fdm-3d-printing-design
  phase_id: P2
  title: FDM 3D 프린팅 설계 가이드
  estimated_hours: 8.0
  prerequisites:
  - M4
  objectives:
  - FDM(Fused Deposition Modeling) 3D 프린팅의 기본 원리와 공정 매개변수를 이해한다.
  - 로봇손 부품 제작에 적합한 기하학적 설계 규칙(벽 두께, 공차, overhang 등)을 익힌다.
  - 적층 방향(Orientation)이 부품의 기계적 강도에 미치는 이방성(Anisotropy) 영향을 해석한다.
  - FDM 장비의 한계를 고려한 효율적인 부품 분할 및 조립 전략을 수립한다.
  theory_markdown: '## FDM 3D 프린팅의 기구적 원리

    FDM은 열가소성 필라멘트를 노즐에서 녹여 층(layer) 단위로 적층하는 방식이다 [S73]. 노즐의 궤적은 CAD 모델의 슬라이싱 결과를
    따르며, 이는 노즐 직경과 층 높이에 의해 최소 형상 정밀도가 결정된다 [S75].


    ### 설계 고려사항

    1. **벽 두께(Wall Thickness)**: FDM 부품은 최소 1.2mm 이상의 벽 두께를 확보해야 구조적 강성을 유지할 수 있다
    [S74]. 얇은 벽은 층간 결합력 저하로 파손 위험이 크다 [S75].

    2. **이방성(Anisotropy)**: FDM 부품은 출력 방향에 따라 강도가 달라진다. 수평 방향(XY 평면) 강도가 수직 방향(Z축)보다
    50~75% 높으므로, 하중 경로를 고려한 출력 방향 설정이 필수적이다 [S75].

    3. **공차(Tolerance) 및 조립**: FDM은 CNC 가공보다 정밀도가 낮으므로(일반적 ±0.3mm 수준), 조립되는 부품 사이에는
    최소 0.5mm의 간격(Clearance)을 설계해야 한다 [S76, S77].

    4. **Overhang과 서포트**: 45도 이상의 기울기를 가진 형상은 서포트가 필요하며, 적절한 챔퍼(Chamfer) 설계를 통해 서포트
    사용을 최소화할 수 있다 [S74].


    ### 최적화 전략

    복잡한 로봇손 부품은 전체를 한번에 출력하기보다 기능별로 분할(Sectioning)하여 출력한 후 조립하는 것이 설계 자유도와 출력 신뢰성을
    높인다 [S73].'
  worked_examples:
  - '예제 1: 로봇 손가락 관절의 벽 두께 결정. 하중을 받는 부품이므로 최소 1.5mm의 벽 두께와 3개 이상의 외곽선(Perimeter)을
    설정하여 강성을 극대화한다.'
  - '예제 2: 적층 방향 최적화. 손가락 마디를 Z축으로 세워서 출력하면 층간 분리 현상으로 쉽게 부러진다. 이를 평면(XY)에 눕혀 출력하여
    층 결합력이 응력 방향과 평행하게 설계한다 [S75].'
  lab:
    title: 로봇 손가락 마디 출력 및 파지 시험
    steps:
    - 제공된 로봇 손가락 마디 CAD 파일을 슬라이싱 소프트웨어에서 적층 방향을 다르게 설정하여 3종 출력한다.
    - 출력된 시편의 치수를 버니어 캘리퍼스로 측정하여 설계값과의 공차를 확인한다.
    - 각 시편을 벤치 바이스에 고정하고 손가락 끝에 점진적 하중을 가하여 파손 지점을 기록한다.
    - 가장 강도가 높았던 출력 방향과 실패 사례를 비교 분석하여 최종 조립 부품의 출력 전략을 세운다.
    safety:
    - 3D 프린터 노즐 고온(200°C 이상) 주의, 출력물 제거 시 장갑 착용 필수.
    - 하중 시험 시 부품 파손으로 인한 파편 비산 방지를 위해 보안경 착용.
    - 비상 전원 차단 버튼 위치 확인.
    deliverables:
    - 출력 전략에 따른 출력물 3종
    - 공차 측정 데이터 시트
    - 적층 방향별 하중 시험 비교 분석 보고서
  assignment:
    title: 5지 로봇손 부품 설계 최적화
    deliverables:
    - 최적화된 손가락 마디 CAD 데이터(STL 및 원본)
    - 서포트 최소화 설계 근거 보고서
    - 조립부 간격(Clearance) 분석서
    rubric:
    - 설계 규칙(벽 두께 1.2mm 이상, 챔퍼 적용) 준수 여부
    - 출력 방향 고려를 통한 강성 확보 전략의 타당성
    - 조립 정밀도 확보를 위한 공차 설계 적절성
  quiz:
  - question: FDM 3D 프린팅의 강도 특성인 이방성(Anisotropy)에 대한 설명으로 옳은 것은?
    choices:
    - 모든 방향에서 동일한 강도를 갖는다.
    - 수평 방향(XY) 강도가 수직 방향(Z)보다 일반적으로 높다.
    - 수직 방향(Z) 강도가 수평 방향(XY)보다 항상 높다.
    - 적층 높이와는 무관하다.
    answer_index: 1
    explanation: FDM은 층을 쌓아 올리는 방식이므로 층간 결합력의 한계로 인해 Z축 방향의 인장 강도가 XY 평면보다 낮습니다 [S75].
  - question: 조립되는 부품 사이의 간격(Clearance) 설계 시 권장되는 최소값은?
    choices:
    - 0.01 mm
    - 0.1 mm
    - 0.5 mm
    - 2.0 mm
    answer_index: 2
    explanation: FDM 장비의 치수 정밀도를 고려할 때, 움직이는 조립 부품 사이에는 최소 0.5mm의 간격을 설계해야 부품끼리 융착되는
      것을 방지할 수 있습니다 [S76, S77].
  - question: 서포트 사용을 최소화하기 위한 설계 방법으로 옳지 않은 것은?
    choices:
    - 출력 방향을 변경하여 overhang 각도를 줄인다.
    - 복잡한 형상은 여러 부품으로 분할하여 출력한다.
    - 가능한 모든 곳에 sharp edge를 사용하여 날카롭게 설계한다.
    - chamfer를 활용하여 서포트 없는 경사를 만든다.
    answer_index: 2
    explanation: Sharp edge는 FDM 출력 시 노즐의 라운딩 특성으로 인해 정확하게 출력되기 어렵고, 서포트 문제와 무관하게
      설계 시 기하학적 정밀도를 떨어뜨립니다 [S77].
  completion_criteria:
  - 실습 결과물 3종 이상 제출
  - 설계 규칙 준수 CAD 데이터 제출
  - 강도 분석 및 공차 분석 보고서 승인
  source_ids:
  - S73
  - S74
- id: M6
  slug: assembly-manufacturing
  phase_id: P2
  title: 로봇손 제작 및 조립
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - 로봇손의 기구학적 설계 도면을 실제 3D 프린팅 부품으로 제조할 수 있다.
  - 언더액추에이티드(Underactuated) 메커니즘을 고려한 조립 순서와 텐던(Tendon) 배치 원리를 이해한다.
  - 전기 액추에이터와 기구부의 물리적 연결 및 교정을 수행할 수 있다.
  - 제작된 로봇손의 기구적 완성도와 제어 응답성을 검증할 수 있다.
  theory_markdown: '### 로봇손 제작의 핵심 원리


    로봇손 제작은 기구학적 설계가 물리적 실체로 구현되는 과정입니다. 특히 5지 로봇손과 같은 고자유도 시스템은 **언더액추에이티드(Underactuated)
    메커니즘**을 활용하여 액추에이터 수를 줄이면서도 복잡한 파지 동작을 가능하게 합니다 [S12].


    #### 1. 텐던 구동 메커니즘 (Tendon-driven Mechanism)

    텐던(와이어)은 모터의 동력을 손가락 마디로 전달하는 핵심 요소입니다. 텐던 배치 시 고려사항은 다음과 같습니다:

    - **agonist-antagonist 배치:** 텐던은 손가락을 굽히는 작용(agonist)과 펴는 길항(antagonist) 동작을 위해
    짝을 이루어 배치됩니다 [S12, S21].

    - **마찰 관리:** 와이어 경로상의 마찰은 로봇손의 응답성과 정밀도를 저하시킵니다 [S15]. 곡선 경로 설계와 저마찰 소재 사용이 필수적입니다.


    #### 2. 적층 제조와 기구부 설계

    3D 프린팅을 통한 로봇손 제조 시에는 다음 원칙을 준수해야 합니다:

    - **출력 방향(Orientation):** FDM 프린팅 시 Z축 강도는 XY 평면보다 약 50-75% 낮을 수 있습니다 [S75]. 텐던
    장력이 가해지는 주 응력 방향을 고려하여 출력 방향을 결정해야 합니다 [S74].

    - **공차(Tolerance):** 3D 프린터의 분해능과 수축률(Shrinkage)을 고려하여 회전 관절부에 0.3~0.5mm의 여유 간격(Clearance)을
    확보해야 합니다 [S74, S77].


    #### 3. 전기적 통합

    액추에이터(예: DYNAMIXEL XM430-W350)를 조립할 때 케이블 Stress가 발생하지 않도록 hollow back case 구조를
    활용해야 합니다 [S36, S41].'
  worked_examples:
  - '예제 1: 텐던 장력 설정. 손가락 마디가 완전 개방되지 않을 때, antagonist 텐던의 사전 장력(Pre-tension)을 0.5N씩
    증가시키며 초기 위치를 교정하는 과정입니다.'
  - '예제 2: 출력 공차 계산. 관절 핀(Pin) 직경 3.0mm, 하우징 홀 직경 3.4mm로 설계하여 0.2mm의 동심 간격을 확보함으로써
    마찰 없는 조립을 달성하는 사례입니다.'
  lab:
    title: 로봇손 기구부 조립 및 동작 교정
    steps:
    - 3D 프린팅 부품의 서포트 제거 및 결합부 평탄화 작업 수행.
    - 각 마디에 텐던 와이어를 라우팅하고, antagonist 텐던을 먼저 연결하여 정렬 확인.
    - 액추에이터(XM430)의 ID를 설정하고 관절 축에 결합.
    - 펌웨어를 통해 초기 영점(Home Position)을 0도로 설정.
    - 텐던 장력을 서서히 가하며 손가락의 움직임이 꼬임 없이 원활한지 확인.
    safety:
    - 납땜 및 수공구 사용 시 반드시 보안경 착용.
    - 전원 인가 전 멀티미터로 텐던 구동 모터의 단락(Short) 여부 확인.
    - 로봇손 동작 중 손가락 끼임 주의, 비상 전원 차단 장치 근접 배치.
    - 벤치 전원 사용 시 전류 제한(Current Limit)을 모터 정격 이하로 설정.
    deliverables:
    - 조립 완료된 5지 로봇손 사진 및 영상
    - 관절 동작 범위(ROM) 측정표
    - 텐던 장력 교정 기록지
  assignment:
    title: 로봇손 기구학 성능 검증
    deliverables:
    - 제작된 로봇손의 파지 성능 시험 결과(다양한 물체 5종 적용)
    - 텐던 장력에 따른 손가락 굽힘 응답성 보고서
    - 기구적 결함 및 해결 방안(자유 서술)
    rubric:
    - 기구학적 동작 범위가 설계 의도와 일치하는가?
    - 텐던 라우팅이 적절하여 꼬임이나 과도한 마찰이 없는가?
    - 실제 물체를 안정적으로 파지할 수 있는가?
    - 제작 공정에서의 문제점과 그에 대한 논리적 분석이 포함되었는가?
  quiz:
  - question: FDM 프린팅된 부품의 강도가 출력 방향에 따라 다른 주된 이유는 무엇입니까?
    choices:
    - 소재의 열전도율 차이
    - 층간 결합력(Layer bonding)의 이방성(Anisotropy)
    - 프린터 노즐의 크기
    - 필라멘트의 색상
    answer_index: 1
    explanation: FDM은 층을 쌓아 제조하므로 층간 결합력이 필라멘트 자체의 강도보다 약하며, 이로 인해 Z축 방향 강도가 평면 방향보다
      현저히 낮아집니다 [S75].
  - question: 로봇손 관절부 조립 시 공차를 설계하는 이유로 가장 적절한 것은?
    choices:
    - 출력물의 수축률과 마찰을 고려하여 부드러운 움직임을 확보하기 위해
    - 3D 프린터의 노즐 크기가 항상 일정하기 때문에
    - 모터의 토크를 무한정 높이기 위해
    - 텐던의 길이를 늘리기 위해
    answer_index: 0
    explanation: 프린팅 부품은 수축률이 존재하며, 관절이 서로 맞물려 동작하려면 적절한 간격(Clearance)이 필수적입니다 [S74,
      S77].
  - question: 텐던 구동 로봇손에서 antagonist 텐던의 역할은 무엇입니까?
    choices:
    - 손가락을 더 강하게 굽히기 위함
    - 물체를 잡고 있는 시간을 늘리기 위함
    - 손가락을 펴는 복원 동작(Reset)과 정밀 제어를 위함
    - 손가락의 무게를 줄이기 위함
    answer_index: 2
    explanation: antagonist 텐던은 수동적인 탄성체 대신 능동적으로 손가락을 펴거나 특정 마디의 정밀한 위치 제어를 가능하게
      합니다 [S12, S21].
  completion_criteria:
  - 실습 결과물로 5지 로봇손이 조립 및 구동되어야 함.
  - 모든 관절 동작이 텐던 간섭 없이 정해진 범위 내에서 움직여야 함.
  - 제작 및 검증 과정이 포함된 최종 보고서를 제출하여 통과해야 함.
  source_ids:
  - S12
  - S21
- id: M7
  slug: smart-actuator-integration
  phase_id: P3
  title: 스마트 액추에이터 및 제어
  estimated_hours: 10.0
  prerequisites:
  - M6
  objectives:
  - DYNAMIXEL XM430-W350 스마트 액추에이터의 제어 테이블 구조와 동작 모드를 이해한다.
  - 로봇 손 구동을 위한 통신 프로토콜 및 패킷 구조를 익힌다.
  - PID 제어 파라미터가 액추에이터의 반응성 및 안정성에 미치는 영향을 분석한다.
  - 실제 환경에서 액추에이터 상태 모니터링 및 제어를 구현한다.
  theory_markdown: '## 스마트 액추에이터 제어의 기초


    정교한 로봇 손 제작을 위해서는 고성능 스마트 액추에이터 제어가 필수적입니다. 본 모듈에서 다루는 DYNAMIXEL XM430-W350은 모터,
    컨트롤러, 드라이버, 센서, 감속기가 통합된 지능형 모듈입니다 [S36, S37].


    ### 1. 제어 테이블 (Control Table) 구조

    스마트 액추에이터는 제어 테이블을 통해 내부 상태를 관리합니다 [S36].

    - **EEPROM 영역:** 전원을 차단해도 설정값이 유지되는 비휘발성 메모리(예: ID, Baud Rate, 모드 설정)입니다. Torque
    Enable이 0일 때만 수정 가능합니다 [S36].

    - **RAM 영역:** 전원 재설정 시 초기화되는 휘발성 메모리(예: Goal Position, Present Position, 실시간 제어
    파라미터)입니다 [S36].


    ### 2. 주요 동작 모드

    XM430은 6가지 주요 제어 모드를 지원합니다 [S36, S38, S40]:

    - **Position Control Mode:** 0°~360° 범위 내에서 특정 위치를 유지합니다.

    - **Extended Position Control Mode:** 멀티턴 제어가 가능합니다.

    - **Current-based Position Control Mode:** 위치 제어와 동시에 최대 전류(토크) 제한을 설정하여 물리적 충돌
    시 안전을 보장합니다.


    ### 3. 통신 및 피드백

    RS-485 또는 TTL 프로토콜을 사용하며 패킷 단위로 통신합니다 [S36, S40]. 컨트롤러는 읽기/쓰기 패킷을 통해 실시간 위치, 속도,
    전류, 온도, 입력 전압을 피드백받아 폐루프 제어를 구현합니다 [S36, S38].'
  worked_examples:
  - '예제 1: 스마트 액추에이터 동작 모드 변경 방법. Torque Enable(64)을 0으로 설정한 후, 운영 모드(11) 주소에 원하는
    모드값(예: 3: Position Control Mode)을 쓰기 패킷으로 전송하여 변경합니다 [S36, S40].'
  - '예제 2: 목표 위치(Goal Position) 전송 시 주소 116번을 사용합니다. 해상도는 4096(0.088°/step)이므로 90°
    이동 시 패킷에 전송할 데이터는 `90 / 0.088 ≈ 1024`로 설정합니다 [S36, S37, S40].'
  lab:
    title: DYNAMIXEL 스마트 액추에이터 제어 실습
    steps:
    - 벤치 전원 장치를 12V로 설정하고 전류 제한을 1.0A로 설정하여 액추에이터에 연결합니다.
    - U2D2 인터페이스를 사용하여 PC와 액추에이터를 연결합니다.
    - DYNAMIXEL Wizard 2.0 소프트웨어를 사용하여 액추에이터 ID 및 펌웨어를 확인합니다.
    - 운영 모드를 Position Control Mode로 변경하고 토크를 활성화합니다.
    - 목표 위치값을 변경하며 실제 회전 각도를 측정합니다.
    - 실시간 피드백 데이터(위치, 온도, 부하)를 추출하여 시리얼 모니터로 확인합니다.
    safety:
    - 전원 연결 전 극성을 반드시 확인하십시오 [S36].
    - 전류 제한을 설정하여 예기치 못한 과전류 사고를 방지하십시오 [S36].
    - 보안경을 착용하고 구동 중 손가락이 끼이지 않도록 주의하십시오 [S36].
    - 비상 전원 차단 장치를 항상 확보하십시오.
    deliverables:
    - 실습 중 측정한 실시간 데이터 로그(CSV 형식)
    - 액추에이터 제어 성공을 입증하는 동작 영상
    - 제어 파라미터(PID 값) 설정 변경에 따른 동작 변화 비교 분석 보고서
  assignment:
    title: 스마트 로봇 손 제어 알고리즘 구현
    deliverables:
    - Python 기반 제어 코드(통신 라이브러리 사용)
    - 제어 시스템 성능 분석 최종 보고서
    rubric:
    - 액추에이터가 0~180도 범위에서 정확히 제어되는가? (40점)
    - 실시간 상태 피드백(온도, 위치)이 시스템에 정상적으로 반영되는가? (30점)
    - PID 파라미터 튜닝을 통해 오버슈트를 최소화했는가? (20점)
    - 코드의 가독성 및 문서화 수준은 적절한가? (10점)
  quiz:
  - question: DYNAMIXEL XM430-W350 제어 테이블의 EEPROM 영역을 수정하기 위한 필수 조건은 무엇입니까?
    choices:
    - Torque Enable을 1(ON)로 설정
    - Torque Enable을 0(OFF)으로 설정
    - 운영 모드를 전류 제어 모드로 변경
    - 통신 속도를 4.5Mbps로 설정
    answer_index: 1
    explanation: 제어 테이블의 EEPROM 영역 데이터는 Torque Enable이 0(OFF)인 경우에만 안전하게 수정할 수 있습니다
      [S36].
  - question: XM430 모델의 제어 해상도는 4096(pulse/rev)입니다. 180도 회전을 위해 Goal Position에 입력해야
      할 대략적인 값은 무엇입니까?
    choices:
    - '1024'
    - '2048'
    - '4096'
    - '8192'
    answer_index: 1
    explanation: 해상도가 4096 step/rev이므로, 180도는 전체의 절반인 2048 step에 해당합니다 [S36, S37].
  - question: 스마트 액추에이터 제어 시 'Closed-loop' 제어가 가능한 이유는 무엇입니까?
    choices:
    - 모터 자체에 내장된 센서로 위치, 전류, 온도 등의 실시간 피드백을 받을 수 있기 때문
    - 외부의 카메라만을 사용해서 로봇의 위치를 보정하기 때문
    - 단순히 목표값만 전송하면 액추에이터가 알아서 계산하기 때문
    - PID 제어가 필요 없기 때문
    answer_index: 0
    explanation: 스마트 액추에이터는 내장된 센서를 통해 현재 상태를 제어기에 보고하므로 정밀한 폐루프(Closed-loop) 제어가
      가능합니다 [S36, S38].
  completion_criteria:
  - 실습 결과 보고서 제출 완료
  - 로봇 손 구동 제어 코드 작성 및 정상 동작 확인
  - 모든 실습 시 안전 규정 준수 확인
  source_ids:
  - S36
  - S37
- id: M8
  slug: tactile-sensing
  phase_id: P3
  title: 촉각 센서 통합
  estimated_hours: 8.0
  prerequisites:
  - M7
  objectives:
  - 로봇손을 위한 촉각 센서 기술의 원리와 장단점 이해
  - FDM 3D 프린팅을 이용한 통합형 촉각 센서 설계 및 제작 방식 습득
  - 센서 데이터 기반의 접촉 상태 및 미끄러짐(slip) 검출 알고리즘 분석
  - 로봇손 제어 시스템에 촉각 피드백을 효과적으로 통합하는 방법 학습
  theory_markdown: '### 촉각 센싱의 중요성 및 기술 개요

    로봇 손이 인간의 손처럼 정교하고 적응력 있게 물체를 조작하기 위해서는 물리적인 환경과의 상호작용을 인지해야 합니다. 이를 위해 사용되는 촉각
    센서는 접촉 상태, 미끄러짐, 표면 거칠기, 곡률, 질량 등을 측정하여 로봇의 지능과 안전성을 높입니다 [S19].


    #### 촉각 센서 기술 분류

    - **시각 기반 촉각 센서**: 카메라를 사용하여 내부 구조의 변위를 관찰하는 방식(예: TacTip)으로, 최근 카메라의 소형화와 컴퓨터
    비전 기술의 발전으로 주목받고 있습니다 [S21, S25].

    - **물리적 접촉 센서**: 정전용량식, 압전저항식, 압전식 센서 등이 있으며, 구조가 비교적 간단하지만 분산된 다영역 센싱 구현 시 통합
    공정이 복잡할 수 있습니다 [S19].


    #### 3D 프린팅 기반 통합 설계

    과거의 센서 통합 방식은 센서를 제작한 후 로봇 부품에 부착하는 방식이었으나, 최근에는 다중 재료 3D 프린팅을 활용해 센서를 로봇 손 부품
    내부에 직접 출력(monolithic 3D printing)하는 방식이 도입되고 있습니다 [S12, S17]. 이 방식은 조립 공정을 단순화하고
    내구성을 향상시킵니다 [S12, S21]. 특히 투명한 지지 재료와 유연 재료를 혼합하여 내부 구조를 직접 설계하면, 별도의 센서 조립 없이도
    손가락 끝에서 고해상도의 tactile 데이터를 수집할 수 있습니다 [S21].


    #### 센서 데이터 처리 및 제어 통합

    획득된 촉각 이미지는 실시간으로 분석되어 접촉 위치, 힘의 세기, 미끄러짐 여부를 판별합니다 [S12, S21]. 추출된 데이터는 로봇의 제어
    루프에 입력되어, 물체를 놓치거나 파손하지 않도록 모터의 토크나 위치를 조절하는 폐루프(closed-loop) 제어에 활용됩니다 [S12,
    S17].'
  worked_examples:
  - '사례 1: TacTip 기반 시각 촉각 센서의 좌표 변환. TacTip 센서 이미지 내의 마커 중심 좌표를 추적하여 변위 벡터(u, v)를
    구하고, 이를 접촉 위치(x, y)와 수직 힘(Fn)으로 매핑하는 선형 회귀 모델 적용 예시.'
  - '사례 2: 3D 프린팅 센서의 감도 최적화. 센서 챔버 벽 두께를 1.25mm에서 1.0mm로 조정하였을 때, 동일 입력 압력(Ps)에 대한
    내부 챔버의 변형률 증가폭 분석 및 민감도 향상 효과 계산.'
  lab:
    title: 3D 프린팅 촉각 센서 통합 및 미끄러짐 감지 실험
    steps:
    - 제공된 CAD 도면을 바탕으로 TacTip 스타일의 촉각 센서가 통합된 로봇 손가락 3D 모델 출력
    - '센서 공동(cavity) 내부에 마커(예: 검은색 구형 비즈)를 적절히 배치하고 유연 소재(실리콘 또는 TPU)로 밀봉'
    - 손가락 끝에 내장된 카메라와 조명 시스템을 연결하여 고해상도 tactile 이미지 획득 환경 구축
    - 알려진 힘과 위치에서 로봇 손가락을 제어하여 접촉 데이터 수집
    - 수집된 데이터를 기반으로 미끄러짐을 감지하는 Python 제어 스크립트 실행 및 결과 검증
    safety:
    - 납땜 인두 사용 시 화상 주의
    - FDM 프린터 고온 노즐 및 베드 접촉 방지
    - 구동부 작동 시 손가락 끼임 방지
    - 실험 중 보안경 착용 및 비상 전원 차단 스위치 위치 확인
    deliverables:
    - 제작된 촉각 센서 통합 손가락 하드웨어
    - 수집된 접촉 데이터 로그 파일
    - 미끄러짐 감지 정확도 평가 보고서
  assignment:
    title: 촉각 센서 데이터 기반의 그립 제어 로직 구현
    deliverables:
    - Python 기반의 센서 데이터 분석 코드
    - 미끄러짐 발생 시 로봇 액추에이터의 재조정 제어 알고리즘 설계도
    - 최종 로봇손 그립 성능 검증 보고서
    rubric:
    - 센서 이미지 분석 코드의 정확성(40%)
    - 미끄러짐 감지 후 액추에이터 반응 속도(30%)
    - 전체 제어 로직의 안정성 및 적응력(20%)
    - 결과 보고서의 논리적 구성 및 분석 완성도(10%)
  quiz:
  - question: 로봇 손에서 3D 프린팅 기반 모놀리식(Monolithic) 센서 통합의 주요 장점은 무엇입니까?
    choices:
    - 센서의 해상도를 무한대로 높일 수 있음
    - 별도의 센서 조립 공정이 필요 없고 내구성이 향상됨
    - 비용이 가장 비싸지만 가장 정밀함
    - 모든 종류의 소재를 출력할 수 있음
    answer_index: 1
    explanation: 통합형 설계는 복잡한 조립 공정을 단순화하고 내구성을 높이며 제작 효율을 향상시킵니다.
  - question: 시각 기반 촉각 센서에서 카메라를 이용해 접촉을 인지하는 방식은?
    choices:
    - 피부 표면의 온도 변화 측정
    - 금속 챔버 내부의 전기저항 변화 측정
    - 투명 챔버 내부의 마커 변위 관찰
    - 레이저를 이용한 표면 스캐닝
    answer_index: 2
    explanation: 시각 기반 센서는 내부의 구조적 변위(마커 등)를 시각적으로 추적하여 정보를 획득합니다.
  - question: 촉각 피드백이 로봇 손 제어에 미치는 가장 큰 영향은 무엇입니까?
    choices:
    - 로봇 손의 무게가 가벼워짐
    - 외부 환경의 불확실성에 대응한 폐루프 제어 가능
    - 동력 없이 물체를 잡을 수 있음
    - 로봇의 처리 속도가 100배 빨라짐
    answer_index: 1
    explanation: 촉각 피드백은 물체 조작 시 미끄러짐이나 압력을 감지하여 실시간으로 힘을 조절하는 폐루프 제어를 가능하게 합니다.
  completion_criteria:
  - 실험실에서 3D 프린팅 센서 통합 손가락 제작 완료
  - 제공된 실습 과제 코드를 실행하여 미끄러짐 감지 알고리즘 검증
  - 최종 결과 보고서 제출 및 승인
