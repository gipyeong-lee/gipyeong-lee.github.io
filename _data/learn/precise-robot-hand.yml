  title: 구동기 및 제어기 선정
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - DYNAMIXEL XM430-W350-T 액추에이터의 정격 전압, 전류 및 통신 특성을 이해한다.
  - OpenCR 1.0 제어기의 DYNAMIXEL 포트 구성 및 12V 전원 분리 구조를 숙지한다.
  - FSR 402 센서와 10kΩ 저항을 이용한 전압 분압 회로를 설계한다.
  - 시스템 전력 요구사항을 계산하고 독립 분기 퓨즈 보호 설계를 수립한다.
  theory_markdown: '### 구동기 및 제어기 시스템 설계 이론


    #### 1. 액추에이터 선정 및 전력 특성

    로봇 손의 정밀 구동을 위해 DYNAMIXEL XM430-W350-T를 사용한다. 이 액추에이터는 12V 정격 전압에서 작동하며, 스톨(Stall)
    전류는 2.3A이다 [S11]. 전체 로봇 손은 11개의 액추에이터로 구성되므로, 전체 스톨 전류 합계는 약 25.3A에 달한다. 따라서 안정적인
    구동을 위해 독립적인 전원 공급 체계가 필요하다.


    #### 2. 제어기 아키텍처

    OpenCR 1.0은 216MHz ARM Cortex-M7 프로세서를 탑재하여 실시간 제어에 적합하다 [S13]. 이 제어기는 12V 액추에이터
    전원과 로직/센서 전원을 물리적으로 분리할 수 있는 구조를 지원한다. FSR 센서와 같은 아날로그 입력은 0~3.3V 범위 내에서 처리해야
    하므로, 센서 전압 분압 회로는 반드시 OpenCR의 3.3V 센서 레일에서 공급받아야 한다 [S13].


    #### 3. 과전류 보호 및 전원 분기 설계

    138W 출력의 MEAN WELL GST160A12-R7B 어댑터 3개를 사용한다 [S15]. 각 어댑터의 정격 전류는 11.5A이며, 이를
    통해 독립적인 12V 분기를 3개 생성한다. 각 분기에는 10A ATOF 퓨즈를 인라인으로 장착하여 과전류 발생 시 회로를 보호한다 [S24,
    S25]. 퓨즈는 정격 전류 11.5A보다 낮게 설정하여 보호 협조를 달성한다.


    #### 4. 센서 신호 취득

    FSR 402는 압력이 증가하면 저항이 감소하는 특성을 가진다 [S12]. 이를 10kΩ 고정 저항과 전압 분압기로 연결하여 힘의 변화를 전압
    신호로 변환하고 OpenCR의 12bit ADC 포트로 입력한다 [S12, S13, S26].'
  worked_examples:
  - '예제 1: 분기당 최대 전류 확인. 분기 하나에 4개의 XM430 액추에이터를 연결할 경우, 스톨 전류의 합은 4 * 2.3A = 9.2A이다.
    이는 어댑터의 11.5A 정격 및 인라인 퓨즈의 10A 정격을 만족하며 안전한 범위를 유지한다 [S11, S15, S25].'
  - '예제 2: FSR 분압 회로 전압 계산. 3.3V 공급 전압 하에서 FSR 저항이 R_fsr일 때, ADC 입력 전압 V_adc = 3.3
    * (10k / (10k + R_fsr)) V가 된다. 센서 범위(0.2N~20N)에 따라 저항 변화를 확인하여 0~3.3V 범위를 넘지 않도록
    보정한다 [S12, S13, S26].'
  lab:
    title: 전원 분기 구성 및 ADC 센서 인터페이스 실습
    steps:
    - 각 MEAN WELL 어댑터 출력에 0AFH0001Z 퓨즈 홀더를 연결하고 0287010 10A 퓨즈를 삽입한다.
    - 멀티미터를 DC 전압 모드로 설정하여 각 분기의 전압이 안정적인 12V인지 확인한다.
    - OpenCR의 3.3V 센서 레일에 10kΩ 저항과 FSR 402를 사용하여 분압 회로를 구성한다.
    - 비전원 상태에서 분압 회로의 출력 전압이 0~3.3V 범위 내에 있는지 확인한다.
    safety:
    - 작업 시작 전 3개 어댑터의 AC 전원을 물리적으로 차단하고 멀티미터로 0V임을 확인한다.
    - 충격 방지 작업용 보안경을 항시 착용한다.
    - 전원 인가 중에는 절대로 회로를 변경하거나 배선을 만지지 않는다.
    - 퓨즈는 과전류 차단용이며 계획 정지 수단이 아님을 명시한다.
    deliverables:
    - 각 분기별 12V 출력 측정값 기록지
    - FSR 분압 회로 조립 완료 사진
    - 구성된 배선도
  assignment:
    title: 전원 분기 및 보호 설계 검토
    deliverables:
    - 전체 로봇 손의 전류 분기 배분 표(각 분기별 액추에이터 할당)
    - 선정한 퓨즈가 액추에이터 스톨 전류를 보호하면서 어댑터 용량을 초과하지 않음을 증명하는 계산서
    rubric:
    - 독립 퓨즈가 각 분기에 정확히 배치되었는가?
    - 액추에이터 분기 배분이 4/4/3으로 규정에 부합하는가?
    - 센서 전원이 12V가 아닌 3.3V 센서 레일에서 공급되는가?
  quiz:
  - question: FSR 402 센서와 10kΩ 저항을 사용한 분압 회로의 올바른 전원 연결은?
    choices:
    - 12V 액추에이터 전원
    - OpenCR 3.3V 센서 레일
    - 5V 범용 전원
    - OpenCR 12V 출력
    answer_index: 1
    explanation: OpenCR의 ADC 입력은 3.3V를 기준으로 동작하므로 전압 분압 회로는 반드시 3.3V 센서 레일에서 전원을 공급받아야
      합니다 [S13].
  - question: XM430-W350-T 액추에이터의 스톨 전류값은?
    choices:
    - 1.0A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: 데이터시트에 따르면 해당 액추에이터의 스톨 전류는 2.3A입니다 [S11].
  - question: 전원 분기 설계에서 절대 금지된 행동은?
    choices:
    - 각 어댑터 출력에 퓨즈 장착
    - 어댑터의 양(+) 출력 병렬 연결
    - 분기당 10A 퓨즈 사용
    - 절연형 어댑터 사용
    answer_index: 1
    explanation: 어댑터의 양(+) 출력은 독립적인 분기로 유지해야 하며, 병렬 연결은 절대 금지됩니다 [B3].
  completion_criteria:
  - 실습에서 3개 독립 분기의 12V 전압을 멀티미터로 검증 완료
  - FSR 402 센서 분압 회로의 배선과 ADC 입력 전압 범위 확인 완료
  - 전원 분기 및 보호 설계 보고서 제출 및 통과
  source_ids:
  - S4
  - S5
  - S11
  - S13
  - S15
  - S24
  - S25
  - S12
  - S26
- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D 프린팅 및 부품 가공
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 탄소섬유 보강 PC 필라멘트(PC-CF)를 사용한 부품 제작 및 출력 설정 최적화 이해
  - 열압입 인서트(Heat-set insert) 및 슬리브 베어링의 정밀 조립 공차 관리 습득
  - 텐던 구동 메커니즘을 위한 Dyneema 라인 취급 및 캡스턴 설계 구조 이해
  - 로봇 구조물의 치수 안정성과 강성 확보를 위한 가공 및 체결 기법 숙지
  theory_markdown: '### 3D 프린팅 및 부품 가공 이론


    #### 탄소섬유 강화 엔지니어링 소재 (PC-CF)

    PC(Polycarbonate)는 고강성과 내열성이 뛰어나며, 여기에 탄소섬유가 첨가된 PC-CF 필라멘트는 강성을 극대화하여 구조용 부품
    제작에 적합합니다 [S19]. 다만, 탄소섬유의 마모성으로 인해 반드시 경화강 노즐을 사용하여야 하며 [S19], 285°C 내외의 고온 출력이
    필요합니다 [S19].


    #### 정밀 조립을 위한 인서트 및 체결

    플라스틱 출력물에 반복적인 조립·분해를 가능하게 하기 위해 열압입 나사산 인서트를 사용합니다 [S21]. M3 인서트의 경우 4.0mm 직경의
    파일럿 홀을 CAD 설계 시 미리 배치하여 정확한 위치에 안착시켜야 합니다 [S21]. 또한, 무급유 폴리머 슬리브 베어링(iglide J)은
    8mm 알루미늄 샤프트와 조립될 때 압입 후 내경이 최적의 유격을 갖도록 설계되어 있으며 [S17], 축 지름 8mm와의 공차 관리가 필수입니다
    [S17, S18].


    #### 텐던 구동 구조

    Dyneema SK78 섬유는 1.5mm 지름에서 230 daN의 높은 파단 하중과 1% 미만의 신율을 보여 [S16], 강철 케이블의 우수한
    대체재입니다. 텐던은 회전축에서 굽힘이 반복되므로, 캡스턴 모서리를 라운딩 처리하여 마찰에 의한 단선을 방지하는 구조 설계가 중요합니다.'
  worked_examples:
  - '예제 1: PC-CF 필라멘트 노즐 선택 - 탄소섬유의 높은 마모도를 고려할 때, Brass(황동) 노즐은 빠르게 마모되어 출력 품질 저하와
    노즐 막힘을 유발하므로 반드시 경화강(Hardened steel) 노즐을 선택해야 함을 확인 [S19].'
  - '예제 2: 인서트 홀 설계 - Accu HTBI-M3-BR 인서트의 외경이 4.4mm이나 공식 권장 구멍 지름은 4.0mm이므로 [S21],
    CAD 설계 시 구멍 직경을 4.0mm로 고정하여 열압입 시 플라스틱이 인서트 널링(knurling) 사이로 충분히 파고들도록 함 [S21].'
  lab:
    title: 손가락 구조물 제작 및 조립 실습
    steps:
    - 경화강 노즐을 장착한 FDM 3D 프린터로 탄소섬유 PC 필라멘트 출력 환경 설정 [S19].
    - 손가락 링크와 손바닥 프레임 출력 후 서포트 제거 및 표면 정리.
    - 4.0mm 파일럿 홀에 열압입 인서트를 핫툴로 수직 안착 [S21].
    - IGUS 정밀 알루미늄 샤프트를 베어링 규격에 맞춰 절단 및 끝단 모따기 [S18].
    - 슬리브 베어링을 하우징에 압입 후 샤프트를 삽입하여 유격 확인 [S17].
    - M3 캡스크루로 구조물 및 센서 브래킷 체결 [S20].
    safety:
    - 고온의 노즐(285°C) 및 베드(110°C)에 의한 화상 주의 [S19].
    - 출력물 후가공 및 모따기 시 보안경 착용 필수.
    - 인서트 가열 시 연기 발생 가능성이 있으므로 환기 시설 가동.
    - 전원 인가 전 모든 기계적 체결 상태 확인.
    deliverables:
    - 제작된 5지 로봇손 구조물(링크, 손바닥).
    - 열압입 인서트 수직도 및 베어링 유격 측정 기록.
    - 최종 체결부 육안 검사 완료 보고서.
  assignment:
    title: 로봇손 제작 정밀도 검증
    deliverables:
    - 완성된 구조물의 CAD 데이터와 실제 치수 측정 비교표
    - 조립 공차 관리 계획서
    - 텐던 라우팅 구조의 마찰 감소 설계 설명서
    rubric:
    - 열압입 인서트의 수직 안착 여부 (상/중/하)
    - 샤프트-베어링 조립 후 부드러운 회전 운동 여부 (합격/불합격)
    - BOM에 명시된 부품 정격 및 모델 규격 준수 여부 [B10, B11, B12, B13, B14]
  quiz:
  - question: PC-CF 필라멘트 사용 시 경화강 노즐을 사용해야 하는 주된 이유는?
    choices:
    - 탄소섬유의 마모성으로 인한 황동 노즐의 급격한 마모 방지
    - 필라멘트 녹는점이 낮아 일반 노즐로는 출력 불가
    - 출력물의 표면 광택을 증대시키기 위해
    - 압출 속도를 높이기 위해
    answer_index: 0
    explanation: 탄소섬유는 매우 높은 마모성을 가지며 일반 황동 노즐을 빠르게 파손시키므로 경화강 노즐이 필수적입니다 [S19].
  - question: M3 열압입 인서트(Accu HTBI-M3-BR) 사용 시 권장되는 파일럿 홀 지름은?
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: 공식 데이터시트에서 권장하는 구멍 지름은 4.0mm입니다 [S21].
  completion_criteria:
  - 모든 구조용 부품이 FDM 3D 프린터로 제작 완료됨 [B10]
  - 열압입 인서트가 모든 지정된 구멍에 정확히 안착됨 [B14]
  - 알루미늄 샤프트와 슬리브 베어링의 조립 유격이 기준치를 만족함 [B11, B12]
  - 체결 시 명시된 M3 규격의 캡스크루가 올바르게 사용됨 [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: 베어링 및 체결 부품 설치
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 정밀 로봇손 제작을 위한 베어링 및 샤프트의 기계적 공차와 설치 원리를 이해한다.
  - 열압입 인서트(Heat-set insert)를 사용하여 엔지니어링 플라스틱 부품의 체결 강도를 확보하는 방법을 습득한다.
  - 적절한 토크와 체결 규격을 사용하여 조립 유격을 최소화한다.
  theory_markdown: '### 베어링과 샤프트의 공차 관리

    정밀 로봇 관절의 부드러운 움직임과 강성 확보를 위해 iglide® J 슬리브 베어링(JSM-0810-10)과 8 mm 알루미늄 정밀 샤프트(AWMP-08)를
    사용한다. 슬리브 베어링은 하우징에 압입(press-fit)될 때 내경이 조정되도록 설계되었으며, 하우징의 권장 내경 공차를 준수하는 것이
    핵심이다 [S17, S18]. 유격이 발생하면 관절의 정밀도가 떨어지고, 반대로 너무 좁으면 마찰력이 증가하여 구동기(DYNAMIXEL XM430)의
    전류 효율을 저하시킨다.


    ### 열압입 인서트 설치

    PC-CF(탄소섬유 보강 PC) 출력물은 금속 나사를 직접 체결할 경우 재질의 특성상 나사산이 마모되기 쉽다. 이를 방지하기 위해 황동 재질의
    열압입 인서트(HTBI-M3-BR)를 사용한다 [S21]. 인서트는 4.0 mm 파일럿 홀에 삽입 후 열을 가해 주변 수지를 녹여 체결함으로써,
    반복적인 분해 조립에도 높은 기계적 강도를 유지한다 [S21]. 이때 인서트가 기울어지면 조립된 링크의 정렬이 어긋나므로 수직 유지가 필수적이다.'
  worked_examples:
  - '예시 1: 하우징 내경 확인 - iglide® JSM-0810-10 베어링의 외경은 10 mm이다. 따라서 하우징 보어는 10 mm에 맞게
    설계되어야 하며, 인서트 삽입 시 파일럿 홀 4.0 mm를 지키지 않으면 인서트가 헛돌거나 하우징이 파손될 수 있다 [S17, S21].'
  - '예시 2: M3 나사 조립 - M3x10 캡스크루는 2.5 mm 육각 렌치를 사용하여 체결하며, 과도한 토크는 인서트 주변 수지에 크랙을
    유발할 수 있으므로 ''더 이상 돌아가지 않는 시점''에서 최소한의 힘으로 고정한다 [S20].'
  lab:
    title: 로봇손 관절 정밀 조립
    steps:
    - 1. PC-CF 출력물 하우징에 4.0 mm 파일럿 홀이 깨끗한지 확인하고 인서트를 수직으로 정렬한다.
    - 2. 인두기를 적정 온도로 가열하여 인서트를 수직으로 천천히 눌러 하우징 표면과 평행하게 압입한다.
    - 3. iglide® 베어링을 보어에 압입하고, 8 mm 알루미늄 샤프트를 삽입하여 유격과 저항을 확인한다.
    - 4. M3 나사를 사용하여 링크 간 체결을 완료하고, 관절을 움직여 마찰이 균일한지 검증한다.
    safety:
    - 인두기는 고온이므로 화상에 주의하고 가열 후 즉시 거치대에 놓는다.
    - 인서트 압입 시 발생하는 미세 먼지는 흡입하지 않도록 환기를 철저히 한다.
    - 보안경을 필히 착용하고 작업을 진행한다.
    - 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream master
      disconnect로 3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이 없으면
      시스템 통전을 금지한다. 토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만
      수행한다
    deliverables:
    - 관절별 마찰 시험 로그
    - 인서트 수직 정렬 확인 사진
    - 조립된 링크의 자유도 및 유격 측정 기록
  assignment:
    title: 조립 공차 및 체결력 분석 보고서
    deliverables:
    - 관절 조립 순서 및 토크 관리 계획서
    - 유격 발생 시 해결 방안(Shim 사용 또는 공차 수정) 기술
    - 조립 완료된 로봇손 링크의 파지 시험 예비 데이터
    rubric:
    - 인서트 삽입의 수직도가 명확하게 기술되었는가?
    - 베어링과 샤프트의 공차 개념을 올바르게 설명했는가?
    - 조립 단계에서의 안전 수칙을 준수했는가?
  quiz:
  - question: iglide® J 베어링이 하우징에 압입된 후 내경이 조정되는 이유는 무엇인가?
    choices:
    - 베어링 재질의 탄성 때문에 압입 시 내경이 자동으로 늘어난다.
    - 압입 과정에서 베어링 내경이 하우징 보어의 공차에 맞춰 정밀하게 조정되도록 설계되었기 때문이다.
    - 압입 전의 내경은 항상 기준치보다 작게 제작되기 때문이다.
    answer_index: 1
    explanation: iglide® 슬리브 베어링은 압입 전 기준치보다 큰 상태로 제작되며, 올바른 하우징 보어에 압입되었을 때 설계된 공차
      내의 내경을 갖도록 설계되었습니다 [S17].
  - question: PC-CF 출력물에 황동 열압입 인서트를 사용할 때 적절한 파일럿 홀 크기는?
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: 데이터시트에 따르면 HTBI-M3-BR 인서트의 권장 파일럿 홀 크기는 4.0 mm입니다 [S21].
  completion_criteria:
  - 조립된 5개 손가락 관절의 마찰 저항이 균일함을 확인하고 측정 기록 제출.
  - 모든 인서트가 PC-CF 하우징과 수평을 이루는지 육안 및 치수 검사 완료.
  - 조립 중 안전 수칙을 준수했음을 서약하고 작업 기록부 제출.
  source_ids:
  - S17
  - S18
  - S20
  - S21
- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: 배선 및 안전한 전원 분리 구축
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - 액추에이터 구동을 위한 독립적 12 V 전원 분기 구성 방법을 이해한다.
  - 과전류 보호를 위한 ATOF 퓨즈의 역할과 선정 원리를 학습한다.
  - 안전한 전원 관리 및 물리적 차단 프로토콜을 습득한다.
  - OpenCR 제어기 및 FSR 센서의 안전한 전압 분압 회로를 구성한다.
  theory_markdown: '## 안전한 배선 및 전원 분리 원리


    5지 로봇손 시스템은 다수의 고토크 액추에이터를 사용하므로 효율적이고 안전한 전원 분배가 필수적입니다. 본 프로젝트는 전원 어댑터 11개를
    사용하여 액추에이터를 4대/4대/3대 단위로 분리 배치하며, 이는 각 분기의 전류 부하를 분산하고 전원 안정성을 높이기 위함입니다 [S15].


    ### 1. 전원 독립성 확보

    각 어댑터의 양(+) 출력은 독립적인 분기로 유지되어야 하며, 임의로 합치거나 묶는 행위는 절대 금지됩니다. [S15]에 명시된 어댑터의 정격
    출력 전류(11.5 A) 내에서 액추에이터 피크 전류(XM430-W350-T 1대당 2.3 A)를 수용하도록 설계합니다 [S11]. 4대 단위
    분기의 피크 전류 합계는 9.2 A로, 어댑터의 연속 출력 허용 범위 내에 있습니다.


    ### 2. 과전류 보호 (Protection Coordination)

    분기마다 10 A ATOF 퓨즈를 배치하여 배선이나 액추에이터 오류 시의 과전류로부터 시스템을 보호합니다 [S25]. 퓨즈와 부하·전원 정격의
    비교만으로 안전성이나 동작 순서를 보장하지 않는다. 퓨즈 제조사 시간-전류 곡선과 전원 OCP 특성을 함께 검토해 보호 협조를 확인한다. 단,
    퓨즈 선정은 반드시 제조사가 제공하는 ''Time-Current Curve''를 참조해야 하며, 부하 전류가 낮다고 해서 안전이 보장되는 것은
    아닙니다 [S25].


    ### 3. 제어 회로 분리

    DYNAMIXEL 포트 내장형 OpenCR 제어 보드를 사용하여 복잡한 외부 브리지 회로를 제거함으로써 재현성을 높입니다 [S13]. FSR
    힘 센서는 ADC 입력으로 전압을 변환하기 위해 3.3 V 센서 레일로부터 공급되는 분압 회로를 사용하며, 12 V 액추에이터 전원과는 전기적으로
    분리되어야 합니다 [S13].


    ### 4. 작업 안전 수칙

    벤치 프로토타입은 인증된 기계 안전 시스템이 아니므로, 정비나 수정 작업 전에는 반드시 3개 전원 어댑터를 물리적으로 분리하고, 각 분기의
    잔류 전압이 1 V 미만임을 멀티미터 DC 전압 모드로 계측 확인해야 합니다 [S7].'
  worked_examples:
  - 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream master disconnect로
    3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이 없으면 시스템 통전을 금지한다.
    토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만 수행한다 [S11] [S25]
  - '예제 2: FSR ADC 회로 전압 - OpenCR의 3.3 V 센서 레일을 사용해 10 kΩ 분압 저항과 FSR 402를 연결합니다 [S13,
    S26]. 센서 신호 전압은 0~3.3 V 범위 내에 있어야 하며, 이 회로는 12 V 액추에이터 전원 회로와 물리적/전기적으로 분리하여 보호합니다.'
  lab:
    title: 전원 분기 하네스 제작 및 안전 점검
    steps:
    - 각 어댑터 출력 라인에 ATO 인라인 퓨즈 홀더를 납땜하고, 10 A ATOF 퓨즈를 삽입합니다 [S24, S25].
    - Molex Micro-Fit 3.0 커넥터를 사용하여 액추에이터 및 센서 연결 하네스를 제작합니다 [S14].
    - OpenCR 보드와 각 액추에이터를 3개 분기로 배분하여 배선하고 각 전원 어댑터로 연결합니다 [S13].
    - 전원 인가 전, 각 어댑터 출력 단자의 절연 상태를 멀티미터 저항 모드로 확인합니다.
    - 전원 인가 후, 전압 모드에서 각 분기가 12 V임을 확인하고, 차단 시 반드시 3개 어댑터를 모두 제거합니다.
    safety:
    - 정비 전 3개 전원 어댑터를 물리적으로 분리할 것.
    - 잔류 전압이 1 V 미만임을 멀티미터로 확인한 후 부품을 교체할 것.
    - 전원 인가 중 가동 범위 내에 손을 넣지 말 것.
    - 모든 결선부는 절연 처리하고, 납땜 시 보안경을 착용할 것.
    deliverables:
    - 제작된 전원 분기 하네스 사진
    - 각 분기별 측정 전압 기록지
    - 배선도 검토 확인서
  assignment:
    title: 안전 배선 설계 보고서
    deliverables:
    - 3개 전원 분기의 액추에이터 할당 설계안 (분기당 4대/4대/3대)
    - 각 분기별 과전류 차단 계산서 (피크 전류와 퓨즈 정격 비교)
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다
    rubric:
    - 전원 독립성과 분리 원칙을 준수했는가?
    - 퓨즈와 커넥터의 정격이 부하에 적절하게 선정되었는가?
    - 전원 분리 및 잔류 전압 확인 프로토콜이 안전 지침을 따르는가?
  quiz:
  - question: 각 전원 어댑터의 12 V 출력(+)을 병렬로 연결해도 되는가?
    choices:
    - 가능하다, 전류 공급 능력이 높아진다.
    - 불가능하다, 독립 분기로 유지해야 한다.
    - 전압이 일치하면 가능하다.
    - 퓨즈를 추가하면 가능하다.
    answer_index: 1
    explanation: 각 어댑터 출력은 독립적으로 유지되어야 하며, 병렬 연결은 절대 금지됩니다 [S15].
  - question: 로봇손 유지보수 전 가장 우선해야 할 안전 조치는 무엇인가?
    choices:
    - 소프트웨어 토크 해제
    - 멀티미터 저항 측정
    - 3개 전원 어댑터의 물리적 분리 및 잔류 전압 확인
    - 계획 정지 버튼 누름
    answer_index: 2
    explanation: 정비 전에는 반드시 3개 전원 어댑터를 물리적으로 분리하고, 각 분기의 잔류 전압이 1 V 미만임을 멀티미터로 확인해야
      합니다.
  - question: FSR 힘 센서 ADC 회로에 사용해야 하는 전원 레일은?
    choices:
    - 12 V 액추에이터 레일
    - 5 V 전원 레일
    - 3.3 V 센서 레일
    - 24 V 전원 레일
    answer_index: 2
    explanation: OpenCR의 ADC 회로 보호를 위해 3.3 V 센서 레일을 사용해야 합니다 [S13].
  completion_criteria:
  - 3개 독립 분기 하네스 구성 및 퓨즈 장착 완료
  - 각 분기별 무부하 시 전압이 12 V로 측정됨
  - 전원 물리적 분리 후 모든 측정 노드의 잔류 전압이 1 V 미만임을 기록함
  - 배선 안전 설계 보고서 제출 및 통과
  source_ids:
  - S14
  - S24
  - S25
  - S7
  - S15
  - S11
  - S13
  - S26
- id: M7
  slug: firmware-development
  phase_id: P3
  title: 펌웨어 개발 및 제어
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - DYNAMIXEL 스마트 액추에이터 통신 및 제어 프레임워크 이해
  - OpenCR 제어 보드를 활용한 액추에이터 및 FSR 센서 신호 취득 구현
  - 실시간 로봇 제어 상태기계 및 폐루프 피드백 루프 설계
  - 안전한 전원 관리 및 토크 해제 시퀀스 프로그래밍
  theory_markdown: '### 펌웨어 아키텍처 및 DYNAMIXEL 제어

    로봇 손의 펌웨어는 고속 루프 내에서 센서 데이터를 취득하고 액추에이터 명령을 처리합니다. `OpenCR 1.0` 제어기는 216MHz ARM
    Cortex-M7 프로세서를 기반으로 [S13], 별도의 브리지 없이 DYNAMIXEL 프로토콜 2.0을 처리하여 [S11] 지연 시간을 최소화합니다.
    각 액추에이터는 전류, 속도, 위치 모드를 지원하며, 로봇 손은 전류 제어를 통한 토크 기반 파지 전략을 사용합니다.


    ### FSR 힘 피드백 시스템

    FSR 402 센서는 가해진 힘에 반비례하는 저항 특성을 가집니다 [S12]. OpenCR의 12비트 ADC를 사용하여 [S13] 3.3V
    센서 레일에서 10kΩ 저항과 전압 분압 회로를 구성합니다. 분압된 전압은 `ADC값 = (V_in * R_fsr) / (R_fsr + R_ref)`를
    통해 정규화되며, 이 값은 손가락의 텐던 장력과 연동되어 파지력 피드백으로 사용됩니다.


    ### 안전한 제어 루틴

    시스템 정지는 안전을 위해 두 단계로 나뉩니다. 소프트웨어 단계에서는 액추에이터 토크를 해제(Torque Off)하여 물리적 구동력을 즉시
    제거합니다. 정비 전 반드시 3개 독립 전원 어댑터의 전원을 물리적으로 분리한 뒤, 멀티미터 DC 모드를 사용하여 모든 분기에서 1V 미만임을
    확인해야 합니다.'
  worked_examples:
  - '1. 액추에이터 목표 위치/전류 설정: DYNAMIXEL SDK를 사용하여 XM430 액추에이터의 전류 제한(Goal Current)을 설정하고,
    센서값에 따른 PID 루프를 통해 손가락 관절의 최종 위치를 업데이트하는 예제.'
  - '2. FSR 전압 데이터 필터링: ADC에서 수집된 원시 데이터의 노이즈를 제거하기 위해 이동 평균 필터(Moving Average Filter)를
    적용하고, 상한(20N)과 하한(0.2N) 범위를 정규화하는 코드 구현 [S12].'
  lab:
    title: 로봇 손 통합 제어 및 정밀 파지 실습
    steps:
    - 각 독립 분기의 전압이 1V 미만인지 멀티미터 DC 모드로 확인한 후 조립을 시작한다.
    - OpenCR의 3.3V 센서 레일에 FSR 전압 분압 회로를 납땜하고 ADC 포트에 연결한다.
    - DYNAMIXEL SDK를 사용하여 11개 액추에이터의 ID를 스캔하고 초기 위치를 설정한다.
    - 무부하 상태에서 손가락 관절 구동 명령을 테스트하며 텐던 신율과 장력을 조절한다.
    - FSR 센서 데이터를 시리얼 모니터로 시각화하며 파지력 응답을 튜닝한다.
    safety:
    - 절대 5V 또는 12V 액추에이터 전원을 FSR 센서 회로의 공급 전원으로 사용하지 않는다.
    - 시스템 통전 중에는 절대 손가락 가동 범위에 접근하지 않으며 고정 지그를 사용한다.
    - 전원 분기 어댑터의 양(+) 단자를 절대 서로 연결하지 않는다.
    - 정비·조립 접근 전, 반드시 3개의 전원 어댑터를 물리적으로 분리하고 모든 분기에서 1V 미만임을 계측 확인한다.
    deliverables:
    - 실시간 센서 데이터 피드백이 포함된 펌웨어 소스 코드
    - 전압 분압 데이터의 정규화 및 교정 데이터시트
    - 액추에이터 피드백 루프 정상 작동 로그
  assignment:
    title: 파지 상태기계 설계 및 구현
    deliverables:
    - 파지 및 파지 해제 상태기계 다이어그램
    - 전류 기반 토크 제어 구현 코드
    - 최종 성능 평가 보고서
    rubric:
    - 센서값에 따른 전류 제한 범위(0-2.3A)가 안정적으로 제어되는가?
    - 토크 해제 명령 시 물리적 장력이 즉시 제거되는가?
    - 코드 내에 안전한 하드웨어 분리 절차가 명시되어 있는가?
  quiz:
  - question: FSR 402 센서와 전압 분압 회로 구성 시 권장되는 전원 레일은 무엇입니까?
    choices:
    - 12V 액추에이터 전원 레일
    - 5V 범용 전원 레일
    - OpenCR 3.3V 센서 레일
    - 24V 외부 입력 레일
    answer_index: 2
    explanation: 시스템 안전과 OpenCR ADC 보호를 위해 FSR 분압 회로는 반드시 3.3V 센서 전원 레일에 연결해야 합니다.
  - question: 로봇 손 정비 시 시스템이 '무전원 상태'임을 확인하는 올바른 방법은 무엇입니까?
    choices:
    - 소프트웨어로 토크 해제 명령을 보낸다.
    - 멀티미터 저항 모드로 배선 상태를 확인한다.
    - 멀티미터 DC 전압 모드로 모든 분기에서 1V 미만인지 계측한다.
    - 전원 분기 퓨즈를 제거한다.
    answer_index: 2
    explanation: 물리적 전원 분리 후 반드시 멀티미터 DC 전압 모드로 모든 분기의 잔류 전압이 1V 미만인지 직접 확인해야 합니다.
  - question: 여러 독립 전원 어댑터 출력의 양(+) 단자를 병렬로 연결해도 됩니까?
    choices:
    - 전류 합산을 위해 필요하다.
    - 절대 금지된다.
    - 정격 출력 전류가 같으면 가능하다.
    - 퓨즈를 장착하면 가능하다.
    answer_index: 1
    explanation: 독립 분기로 구성된 전원 어댑터의 양(+) 출력은 서로 연결하거나 통합해서는 절대 안 됩니다.
