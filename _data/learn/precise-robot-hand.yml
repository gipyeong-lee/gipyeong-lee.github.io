    - 조립 후 관절 유격 및 견고성 평가
  quiz:
  - question: PC-CF 소재를 출력할 때 노즐 선택 시 주의사항은 무엇입니까?
    choices:
    - 황동 노즐을 사용해야 소재와의 접착력이 좋습니다.
    - 탄소섬유의 마모성 때문에 반드시 경화강 노즐을 사용해야 합니다.
    - 알루미늄 노즐만 사용 가능합니다.
    - 노즐 온도는 상관없습니다.
    answer_index: 1
    explanation: 탄소섬유는 연마성이 강해 황동 노즐을 쉽게 손상시키므로 경화강 노즐이 필수입니다 [S18].
  - question: M3 열압입 인서트(외경 4.4 mm)를 위해 설계해야 할 파일럿 홀의 지름은 얼마입니까?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 4.4 mm
    - 5.0 mm
    answer_index: 1
    explanation: 제조사 사양에 따라 M3 인서트의 권장 구멍 지름은 4.0 mm입니다 [S20].
  completion_criteria:
  - PC-CF 소재 특성을 고려한 출력 설정 기록 확인
  - 관절 링크와 손바닥 프레임이 실물로 제작되어 조립됨
  - 인서트 압입 위치의 정확도 검증 완료
