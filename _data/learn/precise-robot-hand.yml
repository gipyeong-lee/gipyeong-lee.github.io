modules:
- id: mod-1
  slug: robotics-foundations
  phase_id: phase-1
  title: 로봇 공학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 공학의 정의와 시스템 모델링의 기초 이해
  - 개방형 루프 및 폐루프 제어 시스템의 차이 습득
  - DYNAMIXEL 스마트 액추에이터와 OpenCR 제어기 기반의 하드웨어 구성 원리 파악
  - 데이터시트 기반의 전기적 안전 설계 및 전력 분배 원칙 숙지
  theory_markdown: '### 로봇 공학 기초와 제어 이론


    로봇은 감지(sensing), 사고(thinking), 구동(acting)의 과정을 거쳐 환경과 상호작용하는 시스템입니다 [S9]. 대학 수준에서
    로봇의 구동기는 물리적 힘을 전달하는 핵심 요소이며, 정밀한 파지 제어를 위해서는 위치, 속도, 전류 피드백이 통합된 스마트 액추에이터를 사용합니다
    [S2].


    #### 1. 전력 분배 및 안전 설계

    안전하고 재현성 있는 실험을 위해 각 액추에이터 분기는 전력을 독립적으로 분리해야 합니다. 시스템 내의 DYNAMIXEL XM430-W350-T
    액추에이터는 12 V 전압에서 스톨 전류 2.3 A를 요구하며 [S2], 총 11대의 액추에이터를 구동하기 위해 3개의 독립적인 12 V 전원
    어댑터(각 11.5 A 출력)를 사용합니다 [S14]. 이 출력들은 절대로 병렬로 합치지 않으며, 각 어댑터는 독립적인 10 A 퓨즈 보호
    회로를 통해 액추에이터 분기에 연결됩니다 [S14, S24].


    #### 2. 센서 데이터 취득

    손끝의 접촉력을 측정하는 FSR 402 센서는 저항 가변형 센서로 [S5], OpenCR 보드의 ADC 포트를 통해 3.3 V 전원에서 10
    kΩ 분압 저항과 함께 사용되어 0~3.3 V 범위의 전압 신호로 변환됩니다 [S12, S25].'
  worked_examples:
  - '예제 1: 전원 분기 부하 계산 - 시스템에 11대의 액추에이터가 있고 분기별 4대, 4대, 3대로 나누어 전원을 공급합니다. 한 분기에
    4대의 액추에이터를 할당할 경우 스톨 전류의 합은 4 × 2.3 A = 9.2 A입니다 [S2]. 어댑터 정격 11.5 A 내에 위치하며,
    10 A 퓨즈는 9.2 A 피크보다 높아 정상 운전이 가능합니다 [S14, S24].'
  - '예제 2: FSR 센서 신호 전압 계산 - 센서 저항이 R_fsr이고 분압 저항이 10 kΩ일 때, 3.3 V 전압에서 ADC 입력 전압은
    V_adc = 3.3 V × [10 kΩ / (R_fsr + 10 kΩ)] 공식으로 계산됩니다 [S25]. 센서가 압력을 받지 않을 때 R_fsr은
    매우 커서 V_adc는 0 V에 가까워지고, 강하게 압박할수록 R_fsr이 작아져 3.3 V에 가까워집니다 [S5].'
  lab:
    title: 전력 분배 구성 및 센서 인터페이스 실습
    steps:
    - 각 독립 12 V 전원 어댑터 출력에 10 A ATO 퓨즈와 홀더를 직렬로 연결하여 독립 분기를 구성합니다 [S14, S23, S24].
    - 멀티미터를 DC 전압 모드로 설정하고 각 전원 어댑터 출력단의 전압이 12 V 인지 측정합니다.
    - OpenCR 보드 3.3 V 센서 레일과 GND 사이에 FSR 402와 10 kΩ 저항을 연결하여 전압 분압 회로를 만듭니다 [S5, S12,
      S25].
    - 전압을 측정하여 0~3.3 V 범위 내에서 정상적으로 센서 입력이 변화하는지 확인합니다.
    safety:
    - 액추에이터 전원(12 V)과 ADC 센서 전원(3.3 V)을 엄격히 분리하여 12 V가 OpenCR ADC 핀에 직접 유입되지 않도록 합니다
      [S12].
    - 전원 인가 전 모든 배선 결선을 육안으로 확인하고 단락 여부를 계측합니다.
    - 배선 접근이나 수정을 계획할 때는 3개 어댑터를 모두 물리적으로 분리한 후 1 V 미만인지 멀티미터로 측정하여 무전원 상태를 확인합니다.
    - 회로 작업 시 보안경을 항상 착용합니다.
    deliverables:
    - 완성된 전원 분기 및 센서 인터페이스 배선도
    - 각 전원 분기 출력 전압 계측 기록표
    - 센서 출력 전압의 정지/압박 시 변화값 데이터 로그
  assignment:
    title: 로봇 시스템 하드웨어 분석 및 설계
    deliverables:
    - BOM 기반 전력 부하 계산 보고서
    - FSR 데이터 취득을 위한 회로 설계 CAD 파일
    - 안전 규정 준수 체크리스트
    rubric:
    - 전력 분기 부하가 각 어댑터 정격 이내로 설계되었는가?
    - 액추에이터 전원과 센서 전원이 물리적으로 분리되었는가?
    - FSR 분압 회로가 3.3 V 센서 레일을 사용하였는가?
    - 모든 안전 계측 단계를 설계 문서에 명시하였는가?
  quiz:
  - question: 시스템에서 가장 권장되는 안전 정지 방법은 무엇입니까?
    choices:
    - 소프트웨어 토크 해제 후 3개의 12 V 전원 어댑터를 물리적으로 분리
    - 퓨즈는 정격과 시간-전류 곡선에 따라 회로를 개방하며 비상정지 기능을 대신하지 않는다
    - OpenCR의 전원 스위치를 끔
    - 계획 정지 버튼을 눌러 회로를 개방
    answer_index: 0
    explanation: 정상 정지는 소프트웨어 토크 해제로 수행하고, 전원 분리는 계획 정지 후 정비·접근 전에만 수행한다
  - question: OpenCR ADC 포트에 FSR 402 센서를 연결할 때 적절한 전원 전압은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 레일
    - 5 V 전원
    - 제어기 외부의 별도 24 V 전원
    answer_index: 1
    explanation: OpenCR의 ADC 입력 범위는 0~3.3 V이므로, FSR 전압 분압 회로는 반드시 3.3 V 센서 레일에서 공급받아야
      합니다.
  - question: 하나의 전원 분기에서 감당할 수 있는 액추에이터의 최대 개수는 몇 대입니까?
    choices:
    - 11대 전체
    - 8대
    - 4대
    - 1대
    answer_index: 2
    explanation: 분기당 액추에이터 4대의 스톨 전류 합계는 9.2 A로, 10 A 퓨즈 및 11.5 A 어댑터 정격 내에서 안전하게
      운용 가능합니다.
  completion_criteria:
  - 각 전원 분기의 독립성을 계측하여 무전원 상태 확인 완료
  - FSR 센서와 OpenCR ADC 연결 및 전압 변화 데이터 획득
  - 배선 안전 가이드라인에 따른 전력 배선 및 퓨즈 구성 완료
  - 모든 실습 과제 및 최종 보고서 제출
  source_ids:
  - S9
  - S2
  - S14
  - S24
  - S5
  - S12
  - S25
  - S23
- id: mod-2
  slug: hand-design
  phase_id: phase-1
  title: 로봇손 기구 설계
  estimated_hours: 15.0
  prerequisites:
  - mod-1
  objectives:
  - 로봇손 기구 설계의 핵심 요소인 자유도(DOF)와 구동 방식의 이해
  - 텐던 구동 로봇손에서 텐던 장력과 관절 토크의 관계 해석
  - 탄소섬유 보강 PC 필라멘트(PC-CF)를 활용한 강성 설계 기초 습득
  - DYNAMIXEL XM430-W350-T 액추에이터의 사양과 구동 특성 파악
  theory_markdown: '## 로봇손 기구 설계 이론


    ### 1. 텐던 구동 시스템 (Tendon-Driven System)

    로봇손의 구동은 액추에이터의 회전 운동을 텐던(힘줄)의 인장력으로 변환하여 관절을 굴절시키는 방식입니다 [S10]. 텐던으로 **Dyneema
    SK78**과 같이 신율이 1% 미만인 고강도 섬유를 사용하여 위치 제어의 재현성을 확보합니다 [S15]. 캡스턴(Capstan) 설계 시
    모서리를 라운딩 처리하여 반복적인 굽힘 하중에서도 텐던의 피로 파단을 방지해야 합니다.


    ### 2. 구조 재료 및 기구 강성

    손가락 링크와 손바닥 프레임은 고강성 구조가 필요하며, FDM 방식의 **PC-CF(탄소섬유 함유 PC)** 필라멘트를 사용합니다 [S18].
    탄소섬유는 재료의 인장 강도를 높이고 치수 안정성을 개선하지만, 제작 시 경화강 노즐을 필수적으로 사용해야 합니다 [S18]. 조립부에는 M3
    황동 열압입 인서트를 사용하여 반복적인 분해·조립 시에도 나사산의 마모를 방지하고 체결 재현성을 유지합니다 [S20].


    ### 3. 구동 유닛 선정

    **DYNAMIXEL XM430-W350-T**는 위치, 속도, 전류 피드백을 통합 제공하여 복잡한 로봇 제어 시스템 구축에 적합합니다 [S2].
    각 액추에이터는 12 V 전압에서 동작하며, 스톨 전류는 2.3 A입니다 [S2]. 시스템 전체 전원 설계 시 액추에이터의 피크 전류 합계(최대
    25.3 A)를 고려하여 12 V 분기별로 독립적인 전원 공급 및 10 A 퓨즈 보호를 수행해야 합니다 [S2, S14, S24].'
  worked_examples:
  - '예제 1: 텐던 장력 계산 - 관절에 필요한 최대 토크가 4 N·m이고 캡스턴 반지름이 0.01 m일 때, 요구되는 텐던의 최소 인장력은
    F = T / r = 4 N·m / 0.01 m = 400 N입니다. D-Pro 1.5 mm 텐던의 파단 하중은 230 daN(약 2255
    N)이므로 [S15], 안전 계수를 고려할 때 충분한 강도를 가짐을 확인할 수 있습니다.'
  - '예제 2: 전원 분기별 퓨즈 선정 - 총 11대의 액추에이터를 4대, 4대, 3대로 분리합니다 [S14]. 4대 액추에이터 분기의 스톨 전류
    합계는 2.3 A × 4 = 9.2 A입니다 [S2]. 10 A ATOF 퓨즈는 9.2 A를 상회하고 전원 어댑터 정격 11.5 A 이하이므로
    과전류 보호에 적절합니다 [S14, S24].'
  lab:
    title: 로봇손 기구 조립 및 예비 시험
    steps:
    - CAD 설계를 바탕으로 3D 프린터(PC-CF 필라멘트 및 경화강 노즐 사용)로 링크와 프레임을 출력합니다 [S18].
    - 출력물의 파일럿 홀(4.0 mm)에 황동 열압입 인서트를 삽입합니다 [S20].
    - 손목 및 관절축에 JSM-0810-10 폴리머 베어링을 삽입하고 8 mm 정밀 알루미늄 샤프트를 결합합니다 [S16, S17].
    - DYNAMIXEL XM430-W350-T를 프레임에 장착하고 텐던을 연결하여 구동 여부를 점검합니다 [S2].
    - 전원 공급 없이 물리적으로 모든 관절을 움직여 마찰이나 끼임이 없는지 확인합니다.
    safety:
    - 전원 인가 전에는 반드시 고정 지그를 사용하여 로봇손을 고정합니다.
    - 충격 방지 작업용 보안경을 항시 착용합니다.
    - 가동 중인 관절 범위 내에 손가락을 넣지 않습니다.
    - 실습 종료 후 3개의 12 V 전원 어댑터를 물리적으로 분리하고, 각 분기마다 DC 전압을 측정하여 1 V 미만임을 확인한 후 정비에 접근합니다.
    - 절대 각 전원 어댑터의 양(+) 단자를 전기적으로 연결하지 않습니다.
    deliverables:
    - 로봇손 기구 조립체 (사진 포함)
    - 관절 마찰 및 간섭 확인 보고서
    - 사용된 M3 나사 및 인서트 체결 목록
  assignment:
    title: 로봇손 자유도 분석 및 기구 설계 문서 작성
    deliverables:
    - 설계한 로봇손의 자유도(DOF) 도표
    - 텐던 경로를 표시한 CAD 스크린샷
    - 사용된 액추에이터 분기별 배선도 (퓨즈 포함)
    rubric:
    - 전체 자유도가 11 DOF 이상 확보되었는가?
    - 텐던 경로가 캡스턴 모서리 간섭 없이 설계되었는가?
    - 전원 분기당 액추에이터 구성이 사양을 준수하였는가?
    - 퓨즈와 전원 어댑터의 보호 등급이 명확히 명시되었는가?
  quiz:
  - question: DYNAMIXEL XM430-W350-T 액추에이터의 스톨 전류값은 얼마입니까?
    choices:
    - 1.5 A
    - 2.3 A
    - 4.1 A
    - 11.5 A
    answer_index: 1
    explanation: 데이터시트에 따르면 XM430-W350-T의 스톨 전류는 2.3 A입니다 [S2].
  - question: 로봇손 구조 제작에 탄소섬유 보강 PC 필라멘트를 사용할 때 필수적인 장비는 무엇입니까?
    choices:
    - 황동 노즐
    - 경화강 노즐
    - 알루미늄 베드
    - 저전력 레이저 절단기
    answer_index: 1
    explanation: 탄소섬유는 마모성이 매우 강하므로 일반 황동 노즐이 아닌 경화강 노즐을 사용하여야 합니다 [S18].
  - question: 로봇손 전원 공급 및 안전에 대한 설명으로 옳은 것은?
    choices:
    - 모든 12 V 전원 어댑터의 양(+) 단자는 합쳐서 사용하여야 한다.
    - 정비 전에는 퓨즈를 뽑으면 전원 분리가 완료된다.
    - 독립 분기별로 물리적 전원 분리 수단을 확인하고 DC 전압 측정으로 1 V 미만임을 확인한 뒤 정비한다.
    - FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다.
    answer_index: 2
    explanation: 안전을 위해 독립 전원 공급을 유지하고, 반드시 계측을 통해 무전원 상태를 확인 후 정비에 접근해야 합니다.
  completion_criteria:
  - 모든 기구 조립 완료 및 정상적인 물리적 동작 확인
  - 자유도 및 텐던 경로 분석이 포함된 기구 설계 보고서 제출
  - 독립 전원 분기 및 퓨즈 보호 배선도가 포함된 설계 자료 검토 완료
  - 안전 수칙(전원 물리 분리 및 전압 확인) 준수
