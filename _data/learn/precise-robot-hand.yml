- id: m7
  slug: firmware-control
  phase_id: p3
  title: 펌웨어 및 제어
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 작동 원리와 제어 프로토콜(Protocol 2.0)을 이해한다.
  - OpenCR 제어기의 구조를 파악하고 센서 및 액추에이터 인터페이스를 구성한다.
  - FSR 전압 분압 회로를 설계하고 ADC 신호 처리 과정을 구현한다.
  - 상태기계(State Machine)를 활용하여 로봇손의 파지 및 제어 로직을 펌웨어로 작성한다.
  theory_markdown: "## DYNAMIXEL 스마트 액추에이터 제어\n로봇손의 각 관절은 XM430-W350-T 액추에이터를 사용하여\
    \ 구동된다 [S14]. 이 액추에이터는 위치, 속도, 전류 피드백을 실시간으로 제공하며 DYNAMIXEL Protocol 2.0을 통해 제어된다\
    \ [S14]. 제어기인 OpenCR 1.0은 216MHz ARM Cortex-M7 프로세서를 탑재하여 별도의 통신 브리지 없이 직접 액추에이터와\
    \ 통신한다 [S16].\n\n## ADC 및 센서 인터페이스\n손끝의 접촉력은 FSR 402 센서를 사용하여 측정한다 [S15]. FSR은\
    \ 인가된 힘이 증가함에 따라 저항이 감소하는 특성을 갖는다 [S15]. OpenCR의 ADC 입력 해상도는 12비트이며 [S16], 3.3V\
    \ 센서 전원 레일을 사용하여 전압 분압 회로를 구성한다 [S16, S27]. \n\n10 kΩ 풀다운 분압기는 $V_{out}=V_{ref}\\\
    frac{R_{fixed}}{R_{FSR}+R_{fixed}}$를 사용한다\n\n여기서 $R_{fixed}$는 10kΩ 저항을 사용한다 [S27].\
    \ 안전을 위해 모든 아날로그 신호는 0-3.3V 범위를 초과하지 않도록 설계되어야 한다 [S16].\n\n## 펌웨어 구조\n로봇손의 제어\
    \ 시스템은 '대기', '파지 수행', '파지 유지', '해제'의 상태기계로 구현한다. 펌웨어는 루프 내에서 센서 값을 주기적으로 폴링하고,\
    \ 액추에이터의 전류 및 위치 데이터를 분석하여 안정적인 파지력을 유지한다."
  worked_examples:
  - '예제 1: FSR ADC값 정규화. FSR 센서가 OpenCR ADC에 연결되어 0~4095(12비트) 범위의 값을 출력할 때, 이를 0.0~1.0의
    힘 비율로 변환하는 코드를 작성하라. (식: `normalized = adc_value / 4095.0`)'
  - '예제 2: XM430 위치 제어 명령. DYNAMIXEL SDK를 사용하여 1번 관절을 2048(중앙값)로 이동시키는 명령을 구성하라. `packetHandler->write2ByteTxRx(portHandler,
    1, ADDR_GOAL_POSITION, 2048, &error);`와 같은 호출 체계를 사용한다.'
  lab:
    title: 로봇손 펌웨어 구현 및 센서 보정
    steps:
    - OpenCR 1.0 보드를 PC와 USB로 연결하고 기본 통신 환경을 설정한다 [S16].
    - 각 손가락에 연결된 FSR 분압 회로를 OpenCR의 3.3V 센서 전원 레일에 납땜하여 연결한다 [S16, S27].
    - 멀티미터를 사용하여 FSR 무부하 시와 가압 시 전압이 0-3.3V 범위 내에 있는지 확인한다.
    - 펌웨어에서 센서 값을 읽어 시리얼 모니터에 출력하고, 물리적 접촉 시 변화를 확인한다.
    - 단일 액추에이터를 고정 지그에 연결하고 제어 코드를 통해 정밀 이동을 시험한다.
    safety:
    - 절대 5V 또는 12V 액추에이터 전원 레일을 ADC 센서 회로에 직접 연결하지 않는다 [S16].
    - 전원 인가 전 배선도를 재확인하고 단락 여부를 멀티미터로 확인한다.
    - 액추에이터 무부하 상태에서 초기 가동 시험을 수행한다.
    - 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream master
      disconnect로 3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이 없으면
      시스템 통전을 금지한다. 토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만
      수행한다 [S17]
    - 접근 전 3개 전원 어댑터를 물리적으로 분리한 뒤, DC 전압 모드에서 각 분기의 전압이 1V 미만임을 확인한다.
    deliverables:
    - 센서 데이터 출력 시리얼 로그
    - 작동 시험 및 보정 완료된 펌웨어 소스 코드
    - ADC 정규화 수식 정의서
  assignment:
    title: 5지 로봇손 시스템 통합 제어 보고서
    deliverables:
    - 상태기계 설계도 및 로직 상세 기술서
    - 전체 11개 액추에이터 및 5개 센서 통합 제어 펌웨어
    - 동작 검증 동영상 및 파지력 분석 그래프
    rubric:
    - 상태기계가 안전하게 파지 및 해제 루프를 수행하는가?
    - 센서 데이터가 노이즈 없이 안정적으로 취득되는가?
    - 전원 분기별 설계가 BOM의 독립 분기 원칙을 준수하는가?
    - 안전 수칙(물리적 전원 분리 등)을 준수하고 기록하였는가?
  quiz:
  - question: OpenCR 제어기에서 FSR 전압 분압 회로를 위해 사용해야 하는 전원 레일은?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    - 5V 전원
    - USB 5V
    answer_index: 1
    explanation: OpenCR 매뉴얼과 호환성 기준에 따라 FSR 전압 분압은 3.3V 센서 전원 레일만을 사용해야 한다 [S16].
  - question: 액추에이터 전원 분기 어댑터가 3개인 상황에서 올바른 전원 연결 방법은?
    choices:
    - 3개 어댑터의 양(+) 출력을 병렬로 연결하여 전류 용량을 늘린다.
    - 각 어댑터를 독립된 분기로 구성하고 퓨즈를 통과시킨다.
    - 1개 어댑터에 모든 액추에이터를 연결하고 나머지는 예비로 둔다.
    - 어댑터의 출력을 조합하여 36V로 승압하여 사용한다.
    answer_index: 1
    explanation: 양(+) 출력의 병렬 연결은 금지되며, 각 어댑터는 독립된 분기로 유지하고 퓨즈를 통해 과전류를 보호해야 한다 [S17].
  - question: 로봇손 시스템의 정비 또는 접근 전 수행해야 할 필수 단계는?
    choices:
    - 소프트웨어 토크 해제 명령만 내린다.
    - 퓨즈를 제거한다.
    - 3개 전원을 물리적으로 분리하고, 멀티미터로 각 분기 1V 미만 전압을 확인한다.
    - 제어기의 Reset 버튼을 누른다.
    answer_index: 2
    explanation: 토크 해제는 전원 차단을 대신할 수 없으며, 반드시 3개 어댑터를 분리하고 DC 전압 계측으로 확인해야 한다.
  completion_criteria:
  - 통합 제어 펌웨어가 5지 로봇손의 파지 동작을 루프 내에서 수행함.
  - 모든 센서가 ADC 신호를 0-3.3V 범위 내에서 정상 취득함.
  - 모든 전기적 연결이 퓨즈를 포함한 독립 분기 설계 기준을 충족함.
  - 안전 검토 보고서에 무전원 계측 확인 기록이 포함됨.
  source_ids:
  - S16
  - S14
  - S15
  - S27
  - S17
- id: m8
  slug: testing-validation
  phase_id: p3
  title: 시험 및 검증
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - 로봇손의 구동 시스템 성능을 평가하기 위한 체계적인 시험 절차를 수립한다.
  - 데이터 기반의 정밀 검증을 위해 센서 데이터와 액추에이터 피드백을 분석한다.
  - 로봇손의 기구적 내구성 및 반복 정밀도를 검증한다.
  - 시스템 통합 후 안전한 운영을 위한 운용 가이드라인을 작성한다.
  theory_markdown: '### 1. 로봇손 성능 평가의 핵심 지표

    로봇손의 성능 검증은 기구적 설계의 충실도와 제어 알고리즘의 효과를 입증하는 과정입니다 [S1]. 주요 평가 지표는 다음과 같습니다.

    - **반복 정밀도(Repeatability):** 동일한 목표 위치에 도달할 때의 오차 범위로, `XM430-W350-T` 액추에이터의 고해상도
    엔코더 피드백을 통해 계산됩니다 [S14].

    - **파지 안정성(Grasp Stability):** `FSR 402` 센서로 측정되는 접촉력 분포를 분석하여 물체를 미끄러짐 없이 파지하는지
    평가합니다 [S15].

    - **내구성(Durability):** 텐던(`Dyneema SK78`) 및 링크(`PC-CF`) 구조의 피로 파괴 여부를 확인하기 위해
    반복 부하 시험을 수행합니다 [S18, S21].


    ### 2. 데이터 취득 및 분석

    `OpenCR` 제어 보드의 ADC를 통해 FSR 데이터를 실시간 수집합니다. 3.3 V 센서 전원을 사용하여 0~3.3 V 범위 내에서 최대
    12-bit 해상도로 힘 신호를 변환합니다 [S16]. 데이터 취득 시, 노이즈를 줄이기 위해 이동 평균 필터 등을 적용하여 파지력의 변화를
    평활화합니다.


    ### 3. 전기적 안전 검증

    각 액추에이터 그룹은 독립된 `12 V` 어댑터 분기로 구성되며, `10 A` ATOF 퓨즈로 과전류 보호됩니다 [S17, S26]. 시스템의
    무전원 상태 확인은 항상 DC-전압 모드(1 V 미만)로 계측하여 수행합니다.'
  worked_examples:
  - '**예제 1: 반복 정밀도 오차 분석**

    목표 지점 50도에서 100회 반복 이동 후 엔코더 값을 수집한 결과, 평균 50.02도, 표준편차 0.05도로 확인되었습니다. 이는 요구되는
    정밀도 범위 이내입니다.'
  - '**예제 2: FSR 기반 파지력 보정**

    압력이 없을 때 ADC 값이 50, 최대 파지(20 N) 시 3800인 경우, 선형 보간식을 사용하여 ADC 값으로부터 힘(N)을 실시간 추정합니다
    [S15].'
  lab:
    title: 로봇손 가동 범위 및 파지력 검증
    steps:
    - 각 독립 분기의 전원 어댑터 연결부에서 전압이 12 V임을 확인한다.
    - 소프트웨어 토크 해제 상태에서 로봇손의 링크 간섭이 없는지 기구적으로 점검한다.
    - 무부하 상태에서 각 손가락의 가동 범위를 점진적으로 확인한다.
    - FSR 센서에 가해지는 압력을 단계별(0.5 N, 1 N, 5 N)로 인가하며 ADC 신호를 로깅한다.
    - 통전 검사를 종료한 뒤, 모든 전원 어댑터를 물리적으로 분리한다.
    - 멀티미터를 사용하여 3개 분기의 전압이 1 V 미만으로 방전되었음을 확인한다.
    safety:
    - 정비 및 접근 전 3개 절연 전원 어댑터를 물리적으로 분리하고 무전원 상태를 계측 확인한다.
    - 전원 인가 중에는 절대로 손을 가동 범위에 넣지 않고 고정 지그에서 시험한다.
    - 이상 발열·냄새·연기 감지 시 접근하지 말고, 위험 구역 밖에서 사전 지정된 건물 분전반 차단기 또는 인증된 upstream master
      disconnect로 3개 어댑터의 공급 전원을 차단한 뒤 대피한다. 위험 구역 밖에서 작동 가능한 upstream 차단 수단이 없으면
      시스템 통전을 금지한다. 토크 해제는 전원 차단을 대신하지 않는다. 정비·접근은 계획 정지 후 물리적 분리 및 무전원 계측 확인 뒤에만
      수행한다
    - 작업 시 충격 방지 작업용 보안경을 반드시 착용한다.
    deliverables:
    - 가동 범위 및 파지력 시험 로깅 데이터 파일
    - 반복 정밀도 통계 분석 보고서
    - 전원 분기별 계측 안전 확인서
  assignment:
    title: 최종 성능 검증 보고서 작성
    deliverables:
    - 시스템 통합 검증 보고서(PDF)
    - 성능 지표 수치 데이터 및 시각화 그래프
    - 운영 가이드라인 및 문제 해결 절차서
    rubric:
    - 가동 범위 및 반복 정밀도 측정 데이터의 일관성 확인
    - FSR 센서 데이터를 활용한 힘 제어 알고리즘의 유효성 검증
    - 기구적 내구성 시험을 통한 파손 여부 및 조립 안정성 평가
    - 안전 가이드라인 준수 및 절차적 타당성
  quiz:
  - question: 시스템 안전 정비 절차 중 옳지 않은 것은?
    choices:
    - 소프트웨어 토크 해제를 수행한다.
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
    - DC 전압 모드로 각 분기가 1 V 미만임을 계측 확인한다.
    answer_index: 2
    explanation: 저항 모드는 통전 중인 회로를 측정하거나 방전되지 않은 커패시터에 의해 장비 손상 및 오독을 유발할 수 있습니다. 무전원
      상태 확인은 반드시 DC-전압 모드를 사용해야 합니다.
  - question: FSR 402 센서와 OpenCR 보드를 활용한 회로 구성 시 주의할 점은?
    choices:
    - FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다.
    - FSR 분압 회로는 3.3 V 센서 전원만 사용해야 한다.
    answer_index: 1
    explanation: OpenCR의 ADC 입력은 0~3.3 V 범위를 초과해서는 안 되므로, 반드시 안정적인 3.3 V 센서 전원을 사용해야
      합니다.
  completion_criteria:
  - 시험 및 검증 단계의 모든 실험 데이터를 제출하고 로그 분석을 완료할 것.
  - 3개 독립 전원 분기의 물리적 분리 및 안전 전압 계측 절차를 준수할 것.
  - 반복 정밀도와 파지력에 대한 정량적 평가 지표가 목표 범위를 달성할 것.
  - 모든 기구 부품과 전자 회로가 안전하게 동작함을 최종 보고서로 입증할 것.
