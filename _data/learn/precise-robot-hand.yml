- id: mod-6
  slug: assembly
  phase_id: phase-2
  title: 조립 및 하드웨어 구성
  estimated_hours: 10.0
  prerequisites:
  - mod-5
  objectives:
  - 5지 로봇손의 하드웨어 조립 절차와 핵심 구성요소의 역할을 이해한다.
  - 정밀 기계 조립에서 베어링과 샤프트의 공차 관리 중요성을 학습한다.
  - 독립 전원 분기 구성과 물리적 하네스 연결의 안전 규칙을 습득한다.
  theory_markdown: '### 하드웨어 구성 핵심 원리

    5지 로봇손 조립은 기계적 정밀도와 전기적 안전성이 결합된 과정입니다. 핵심은 구조물 간의 유격 최소화와 전원 공급의 안정성 확보입니다.


    #### 1. 기계적 조립과 공차

    본 프로젝트의 관절 회전축은 8 mm 정밀 샤프트 [B-SHAFT]와 무급유 폴리머 슬리브 베어링 [bear-01]을 사용합니다. 베어링은
    하우징에 압입(press-fit)될 때 내경이 설계 치수로 조정되므로, 권장 보어 공차를 엄격히 준수해야 합니다 [S18]. 조립 시 M3
    황동 열압입 인서트 [B-FASTENER-INSERT]를 사용하여 PC-CF 출력물의 나사산 내구성을 확보하고, M3 소켓 헤드 캡스크루 [fast-01]를
    체결합니다 [S21, S22].


    #### 2. 독립 전원 분기 및 보호

    전체 시스템은 12 V 액추에이터 11대(XM430-W350-T)를 구동하기 위해 3개의 독립적인 절연 전원 어댑터 [pwr-01]를 사용합니다
    [S14, S16]. 각 어댑터는 4대, 4대, 3대씩 액추에이터를 할당받으며, 어댑터의 양(+) 출력은 독립적으로 유지해야 합니다. 어떠한
    경우에도 두 어댑터의 출력 단자를 서로 연결하지 마십시오. 각 분기에는 10 A ATOF 퓨즈 [safe-01]가 인라인 퓨즈 홀더 [B-WIRING-FUSE-HOLDER]를
    통해 장착되어 과전류로부터 배선을 보호합니다 [S24, S25].


    #### 3. 텐던 장력 전달

    구동계의 핵심인 텐던 [trans-01]은 1.5 mm Dyneema SK78 섬유를 사용하여 장기 신율이 1 % 미만으로 제어됩니다 [S17].
    캡스턴 모서리의 라운딩 처리를 통해 텐던의 마모를 방지하는 것이 조립의 핵심입니다.'
  worked_examples:
  - '예시 1: 퓨즈 용량 산정. 액추에이터 4대의 스톨 전류 합계는 2.3 A × 4 = 9.2 A입니다 [S14]. 10 A 퓨즈 [safe-01]는
    피크 전류 9.2 A를 견디며, 배선 고장 시 11.5 A 정격의 전원 분기 어댑터 [pwr-01]보다 먼저 반응하여 안전하게 분기를 차단합니다
    [S16, S25].'
  - '예시 2: 인서트 압입 깊이 설정. 황동 인서트 [B-FASTENER-INSERT]는 5.8 mm 길이입니다 [S22]. 4 mm 파일럿
    홀에 삽입 시, 출력물 표면과 일치하도록 열을 가하여 압입하고, 냉각 후 스크루 [fast-01]를 체결하여 유격이 없는 결합을 확인합니다
    [S21].'
  lab:
    title: 5지 로봇손 모듈별 조립 및 전기 배선
    steps:
    - 각 손가락 링크의 보어에 인서트 [B-FASTENER-INSERT]를 열압입하여 나사산을 생성합니다.
    - 샤프트 [B-SHAFT]를 손목 모듈 길이에 맞게 절단 및 모따기 후 베어링 [bear-01]을 장착합니다.
    - 텐던 [trans-01]을 캡스턴에 통과시켜 액추에이터와 연결하고 적정 초기 장력을 부여합니다.
    - 각 독립 분기 어댑터 [pwr-01]에 인라인 퓨즈 홀더 [B-WIRING-FUSE-HOLDER]를 연결하고 퓨즈 [safe-01]를 장착합니다.
    - 잠금 커넥터 [wire-01]를 사용하여 손가락별 전원 하네스를 연결합니다.
    safety:
    - 전원 인가 전 반드시 멀티미터로 인접 분기 간 절연 상태를 확인하십시오.
    - 열압입 작업 시 화상 방지를 위해 장갑과 보안경을 착용하십시오.
    - 조립 완료 후 무부하 상태에서만 첫 구동 시험을 수행하십시오.
    - 정비 및 부품 교체 전, 3개 전원 어댑터를 벽면 콘센트에서 물리적으로 분리하십시오.
    - 전원 분리 후 DC 전압 모드에서 각 분기 전압이 1 V 미만임을 확인한 후 손을 접근하십시오.
    deliverables:
    - 각 관절의 유격 측정 기록
    - 각 분기별 퓨즈 단자 전압 확인 사진
    - 조립 완료된 5지 로봇손 기구 사진
  assignment:
    title: 하드웨어 검증 및 안전 정비 계획
    deliverables:
    - 기구 조립 오차 분석 보고서
    - 전기 안전 계측 결과지
    - 독립 분기 배선도
    rubric:
    - 전원 분기별 독립성 유지 여부 (병렬 연결 금지 준수)
    - 베어링과 샤프트 체결의 치수 정확도
    - 퓨즈 홀더 및 인라인 커넥터의 견고한 연결성
  quiz:
  - question: 3개의 12 V 전원 어댑터 출력 단자를 다룰 때 반드시 지켜야 할 규칙은 무엇입니까?
    choices:
    - 전압을 높이기 위해 양(+) 출력을 모두 연결한다.
    - 각 전원 분기는 독립적으로 유지하며 출력 단자를 절대로 결합하지 않는다.
    answer_index: 1
    explanation: 독립 분기 구성을 위해 각 어댑터는 전기적으로 완전히 격리되어야 합니다.
  - question: 로봇손 조립 후 정비(접근) 전 필수 확인 사항은 무엇입니까?
    choices:
    - 소프트웨어로 모터를 정지시킨다.
    - 전원을 분리하고 멀티미터 DC 전압 모드로 각 분기 1 V 미만인지 계측한다.
    answer_index: 1
    explanation: 안전을 위해 물리적 전원 차단과 DC 전압 측정이 유일한 검증 방법입니다.
  - question: 10 A ATOF 퓨즈의 주된 역할은 무엇입니까?
    choices:
    - 전압을 안정화한다.
    - 배선 고장 시 과전류로부터 분기 경로를 보호한다.
    answer_index: 1
    explanation: 퓨즈는 과전류 차단을 통한 배선 보호 장치입니다.
  completion_criteria:
  - 각 손가락 링크 조립이 공차 범위 내에 존재함
  - 독립 전원 분기가 서로 연결되지 않았음을 멀티미터로 검증함
  - 모든 분기에서 전원 차단 후 1 V 미만임을 기록함
  source_ids:
  - S18
  - S21
  - S22
  - S14
  - S16
  - S24
  - S25
  - S17
- id: mod-7
  slug: wiring-safety
  phase_id: phase-3
  title: 배선 및 안전한 전원 분리
  estimated_hours: 8.0
  prerequisites:
  - mod-6
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 전원 요구사항과 피크 전류 특성을 이해한다.
  - 절연형 데스크톱 전원 어댑터 기반의 독립적인 12 V 전원 분기 구성법을 습득한다.
  - 과전류 보호를 위한 ATOF 퓨즈의 역할과 선정 기준을 학습한다.
  - OpenCR 제어 보드와 센서 회로의 전기적 분리 및 안전한 전원 연결을 실습한다.
  theory_markdown: '### 전원 분기 및 안전 시스템 기초

    본 로봇손 시스템은 11대의 DYNAMIXEL XM430-W350-T 액추에이터를 구동하며, 각 액추에이터의 스톨 전류는 2.3 A입니다 [S14].
    시스템 전체의 피크 전류는 모든 액추에이터가 동시에 스톨 상태가 될 경우 약 25.3 A에 도달할 수 있습니다. 이를 안전하게 공급하기 위해
    3개의 독립적인 12 V 전원 분기를 구성합니다 [S16].


    #### 독립 전원 분기의 원리

    전원 어댑터의 양(+) 출력을 합치거나 연결하는 것은 절대 금지됩니다. 각 GST160A12-R7B 어댑터는 11.5 A의 정격 출력을 제공하며
    [S16], 3개 분기의 합산 전류 용량은 34.5 A로 전체 피크 부하인 25.3 A를 충분히 수용합니다. 각 분기는 10 A ATOF 퓨즈를
    통해 과전류를 방지하며, 분기당 최대 4대의 액추에이터(최대 스톨 전류 9.2 A)를 배정합니다 [S16, S25].


    #### 신호 및 제어 회로의 분리

    FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다 [S15] [S6, S15]. 액추에이터
    전원(12 V)과 ADC/센서 전원(3.3 V)을 분리함으로써 노이즈 유입을 차단하고 제어 보드를 과전압으로부터 보호합니다 [S15].'
  worked_examples:
  - '예제 1: 분기당 퓨즈 용량 계산

    액추에이터 4대 분기의 최대 스톨 전류는 4 × 2.3 A = 9.2 A입니다 [S14]. 10 A 퓨즈는 9.2 A를 통과시키면서도, 정격
    11.5 A인 전원 어댑터보다 낮은 부하에서 동작하므로 적절한 고장 보호를 제공합니다 [S16, S25].'
  - '예제 2: 전압 분배 회로

    FSR 402 센서를 10 kΩ 저항과 3.3 V 레일에 직렬로 연결하여 전압 분배기를 구성합니다 [S6, S26]. 교육용 프로토타입은 기계
    안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다 [S15].'
  lab:
    title: 전원 분기 및 배선 실습
    steps:
    - 각 GST160A12-R7B 어댑터 출력에 0AFH0001Z 인라인 퓨즈 홀더를 사용하여 10 A ATOF 퓨즈를 직렬로 연결한다 [S24,
      S25].
    - Micro-Fit 3.0은 메인 전원 경로가 아닌 손가락별 퓨즈 분기의 탈착식 커넥터로만 사용한다 [S7].
    - FSR 402와 10 kΩ 저항을 사용하여 분압 회로를 구성하고, 3.3 V 센서 레일에 연결한다 [S6, S26].
    - 전원 인가 전 멀티미터를 DC 전압 모드로 설정하고, 각 분기 출력단이 12 V를 출력하는지 확인한다.
    - 모든 분기의 전원을 물리적으로 차단한 뒤, 각 분기의 전압이 1 V 미만으로 떨어지는 것을 확인하고 접근한다.
    safety:
    - 절대 각 어댑터의 양(+) 출력을 서로 연결하거나 병렬화하지 않는다.
    - 실습 중에는 항상 충격 방지 보안경을 착용한다.
    - 정비 및 접근 전 3개의 전원 어댑터를 물리적으로 분리하고, 멀티미터 DC 모드로 전압(1 V 미만 확인)을 측정한 후에만 회로에 손을
      댄다.
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
    deliverables:
    - 구성된 독립 전원 분기 및 커넥터 배선도
    - 각 분기 출력 전압 측정 교정 기록
    - 센서 분압 회로 전압 정상 작동 확인서
  assignment:
    title: 안전 배선 설계 보고서
    deliverables:
    - 독립 분기별 부하 할당 및 퓨즈 용량 계산 근거 보고서
    - OpenCR ADC 보호를 위한 센서 회로 배선도
    rubric:
    - 각 액추에이터 분기의 독립성 유지 여부
    - ATOF 퓨즈 선정의 이론적 근거 적절성
    - 센서 회로의 3.3 V 레일 사용 및 전압 분배기 설계 정확성
    - 안전 수칙 준수 및 계측을 통한 전원 분리 확인 절차 기재 여부
  quiz:
  - question: 다음 중 전원 분기 구성 시 금지되는 사항은 무엇입니까?
    choices:
    - 분기별로 독립적인 10 A 퓨즈를 사용하는 것
    - 서로 다른 전원 어댑터의 양(+) 출력단을 서로 연결하는 것
    - 액추에이터 전원과 센서 전원을 분리하는 것
    - 물리적으로 전원 어댑터를 분리하여 정비하는 것
    answer_index: 1
    explanation: 독립된 전원 어댑터의 출력단을 연결하는 것은 부하 균형을 깨뜨리고 과전류 위험을 초래하므로 절대 금지됩니다.
  - question: FSR 센서와 OpenCR ADC 회로에 적절한 전원 전압은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    - 24 V 입력 전원
    - 어떤 전원이라도 상관없음
    answer_index: 1
    explanation: OpenCR의 ADC 입력은 3.3 V 레일에서 공급받아야 하며, 고전압(12 V 등)은 센서 회로를 손상시킬 수 있습니다.
  completion_criteria:
  - 독립 전원 분기 배선도 제출 및 설계 논리 확인
  - 전원 분기별 독립성 및 전압 측정값의 설계 사양 일치 확인
  - 안전 수칙을 준수하여 정비 전 전압을 계측하고 확인하는 절차 수행
  source_ids:
