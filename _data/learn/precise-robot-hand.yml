- id: mod-5
  slug: sensor-wiring
  phase_id: phase-2
  title: 센서 및 배선
  estimated_hours: 10.0
  prerequisites:
  - mod-4
  objectives:
  - FSR 402 센서와 10 kΩ 저항을 활용한 전압 분압 회로의 원리를 이해한다.
  - OpenCR 제어 보드의 ADC 채널을 통해 아날로그 신호를 0~3.3 V 범위 내에서 안전하게 취득한다.
  - 전원 분리 원칙에 따라 액추에이터 전원과 센서 신호 전원을 전기적으로 격리하여 배선한다.
  - Micro-Fit 3.0 커넥터와 10 A 퓨즈를 사용하여 각 전원 분기의 과전류 보호 회로를 구성한다.
  theory_markdown: '### 센서 신호 취득과 전력 격리


    5지 로봇손의 정밀한 파지 제어를 위해 각 손끝에 부착된 FSR 402 센서는 압력에 따라 저항값이 변화하는 가변 저항체입니다 [S5]. OpenCR
    보드는 12비트 ADC를 내장하고 있으며, 0~3.3 V 범위의 아날로그 입력을 처리할 수 있습니다 [S12].


    #### 전압 분압 회로

    FSR은 자체 전압원이 아니므로, 10 kΩ 고정 저항과 직렬 연결하여 전압 분압기를 구성합니다 [S25]. 센서와 저항의 접점 전압 $V_{out}$은
    다음 식으로 결정됩니다:

    $$V_{out} = V_{ref} \times \frac{R_{fixed}}{R_{FSR} + R_{fixed}}$$

    여기서 $V_{ref}$는 OpenCR의 3.3 V 센서 전원 레일입니다 [S12, S25]. FSR은 압력이 증가할수록 저항이 감소하여 $V_{out}$이
    0 V에서 3.3 V 사이로 상승합니다 [S5].


    #### 전력 격리 및 배선 사양

    안전을 위해 액추에이터 구동용 12 V 전원과 제어기 센서 전원은 물리적으로 분리합니다 [S12, S14]. 액추에이터는 11개이며 [S2],
    총 스톨 전류는 25.3 A에 달하므로 3개의 12 V 어댑터(각 11.5 A)를 사용합니다 [S2, S14]. 각 어댑터는 4대/4대/3대
    액추에이터로 분할 공급하며, 각 분기에는 10 A ATOF 퓨즈를 설치하여 과전류를 보호합니다 [S14, S24]. 퓨즈는 스톨 전류 합계인
    9.2 A(4대 기준)를 안전하게 통과시키며, 어댑터 정격인 11.5 A 이하에서 단락 보호를 수행합니다 [S2, S14, S24].'
  worked_examples:
  - '예시 1: FSR 출력 전압 계산. $V_{ref}=3.3 V$, $R_{fixed}=10 kΩ$일 때, FSR 저항이 10 kΩ(중간 압력)이라면
    $V_{out} = 3.3 \times (10 / (10 + 10)) = 1.65 V$. 이는 ADC 입력 범위 내의 안전한 값입니다.'
  - '예시 2: 전원 분기 구성. 액추에이터 11대(피크 25.3 A)를 분당 평균 8.43 A 부하가 가도록 3개 분기에 할당합니다. 분기당
    10 A 퓨즈는 9.2 A(최대 부하 시)를 연속 통과시키고 고장 시 차단합니다 [S2, S14, S24].'
  lab:
    title: 센서 분압 회로 구성 및 전원 배선 실습
    steps:
    - 멀티미터를 사용하여 3개의 12 V 어댑터가 독립적인 출력임을 확인한다.
    - 각 어댑터 양(+) 출력선에 0AFH0001Z 홀더와 10 A 퓨즈를 설치하여 독립 분기를 형성한다.
    - OpenCR의 3.3 V 센서 레일과 GND를 FSR 분압 회로에 연결한다.
    - 각 FSR 출력 신호를 OpenCR의 ADC 핀에 연결한다.
    - 모든 액추에이터 통신 및 전원 하네스를 Micro-Fit 3.0 커넥터로 조립하여 장착한다.
    safety:
    - 모든 배선 작업 전 3개 전원 어댑터의 물리적 분리를 확인한다.
    - 배선 완료 후 각 분기마다 DC 전압 모드로 1 V 미만인지 측정하여 잔류 전하를 확인한다.
    - 액추에이터는 고정 지그에 장착하고 무부하 상태에서 초기 가동한다.
    - 전원 인가 중 가동 범위 내에 손을 넣지 않는다.
    deliverables:
    - 배선 분기별 퓨즈 설치 사진
    - ADC 채널별 센서 신호 취득 데이터 로그
    - 독립 전원 분기별 전압 측정 결과표
  assignment:
    title: 배선 안전 및 센서 신호 처리 보고서
    deliverables:
    - 액추에이터 전원 분기 배선도
    - FSR 전압 분압 회로 계산서
    - 센서 신호 노이즈 분석 결과
    rubric:
    - 독립 전원 분기가 3개로 올바르게 설계되었는가?
    - 액추에이터 전원과 센서 신호가 물리적으로 격리되었는가?
    - 퓨즈 정격이 액추에이터 스톨 전류(9.2 A/분기)를 고려하여 적절히 선정되었는가?
    - FSR 분압 회로가 3.3 V 레일에서 ADC 입력 범위(0~3.3 V)를 준수하는가?
  quiz:
  - question: FSR 402 센서와 분압 저항을 이용한 회로에서, 압력이 증가하면 OpenCR ADC로 입력되는 전압은 어떻게 되는가?
    choices:
    - 감소한다
    - 증가한다
    answer_index: 1
    explanation: FSR의 저항값이 압력에 따라 감소하면 분압 회로에서 센서 측 분배 전압이 상승하여 ADC 입력 전압이 증가합니다.
  - question: 본 프로젝트에서 3개의 12 V 전원 어댑터를 독립적으로 사용하는 주된 이유는 무엇인가?
    choices:
    - 전압을 36 V로 합산하기 위해
    - 액추에이터의 전류 수요를 분산하고 전원 분기 간 전기적 독립성을 확보하기 위해
    answer_index: 1
    explanation: 전원 분기는 액추에이터의 총 부하를 분산하고 독립된 퓨즈 분기를 구성하여 시스템 안정성을 높이기 위함이며, 출력 병렬
      연결은 금지됩니다.
  - question: 배선 작업 후 정비나 접근 전, 안전한 전원 차단 여부를 확인하는 유일한 방법은 무엇인가?
    choices:
    - 멀티미터 DC 전압 모드로 각 분기가 1 V 미만인지 측정한다
    - 퓨즈를 제거한다
    answer_index: 0
    explanation: 반드시 물리적으로 전원을 분리한 뒤, 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 계측하여 확인해야
      합니다.
  completion_criteria:
  - 각 전원 분기의 독립성을 검증하는 전압 측정 기록 제출
  - 5개 손끝 센서의 ADC 신호 정상 동작 확인
  - 10 A 퓨즈가 설치된 배선 시스템의 조립 완료
