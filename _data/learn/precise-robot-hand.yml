- id: M6
  slug: actuator-controller-integration
  phase_id: PH3
  title: 스마트 액추에이터 및 제어기 통신
  estimated_hours: 20.0
  prerequisites:
  - M5
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 동작 원리와 제어 프로토콜 이해
  - OpenCR 제어기의 구조 및 DYNAMIXEL 통신 포트 활용법 습득
  - FSR 센서 신호의 아날로그 디지털 변환 및 전압 분압 회로 설계
  - 안전 릴레이 체인을 이용한 비상 정지 및 전력 차단 시스템 구현
  theory_markdown: '## 스마트 액추에이터 통신 및 제어

    DYNAMIXEL 스마트 액추에이터는 모터, 제어기, 드라이버, 센서 및 감속기가 통합된 지능형 서보 모듈입니다 [S3]. 제어 명령은 프로토콜
    2.0을 통해 패킷 형태로 송수신되며, 실시간 전류, 속도, 위치 피드백을 제공하여 정밀한 장력 제어를 가능하게 합니다 [S3, S4].


    ## 전력 및 안전 시스템 설계

    로봇손 시스템은 12 V 액추에이터 전원 분기를 사용하며, 각 분기는 독립적인 안전 회로를 갖추어야 합니다. 본 설계에서는 A22E 비상정지
    스위치 [S23], G7SA 강제 유도 안전 릴레이 [S21], G2R-1-SND 중계 릴레이 [S22], 그리고 EV200AAANA 고전류
    접촉기 [S24]로 구성된 4단계 제어 체인을 통해 안전을 확보합니다.


    ### 안전 체인 시퀀스

    1. **입력:** A22E 비상정지 스위치 (NC)가 차단됨 [S23].

    2. **분리:** G7SA 안전 릴레이 코일이 소자되며 3개의 NO 접점이 즉시 개방 [S21].

    3. **중계:** 개방된 G7SA 접점이 3개의 G2R-1-SND 릴레이 코일 전원을 차단 [S22].

    4. **차단:** EV200AAANA 접촉기가 개방되어 3개 분기의 액추에이터 전력을 차단 [S24].

    이 방식은 저전류 제어 신호로 고전류 부하를 안전하게 격리합니다.


    ## 센서 신호 처리

    FSR 402 센서는 인가된 힘에 따라 저항값이 감소하는 박막형 센서입니다 [S11]. OpenCR 제어기의 12비트 ADC 입력을 위해 10
    kΩ 저항과 분압 회로를 구성합니다 [S12, S27]. 이때 반드시 3.3 V 센서 전원을 사용하여 ADC 입력을 0~3.3 V 범위 내로
    유지해야 합니다 [S12].'
  worked_examples:
  - '**분기 전류 계산:** 액추에이터 11대의 최대 스톨 전류 합계는 25.3 A입니다. 3개 전원 분기(11.5 A 정격)를 사용하므로 분기당
    전류 부하는 약 8.43 A이며, 이는 분기별 10 A ATOF 퓨즈 규격 내에 들어옵니다 [S14, S26].'
  - '**전압 분압 설계:** FSR(R_fsr)과 10 kΩ(R_fixed) 저항을 직렬 연결 시, 출력 전압 V_out = 3.3 V * (R_fixed
    / (R_fsr + R_fixed))입니다. 3.3 V 센서 레일을 사용하므로 ADC 포화 없이 힘 데이터 취득이 가능합니다 [S11, S12,
    S27].'
  lab:
    title: 액추에이터 통신 및 안전 체인 구성
    steps:
    - OpenCR 보드와 DYNAMIXEL 액추에이터를 TTL/RS-485 포트에 연결합니다 [S12].
    - A22E NC 접점과 G7SA 코일을 연결하여 안전 릴레이 체인을 구성합니다 [S21, S23].
    - G7SA NO 접점 3개를 각각 G2R-1-SND 코일과 연결합니다 [S21, S22].
    - G2R 릴레이 접점이 EV200AAANA 코일의 전원을 제어하도록 배선합니다 [S22, S24].
    - 멀티미터를 사용하여 비상정지 작동 시 EV200 접촉기 양단이 개방되는지 확인합니다.
    safety:
    - 모든 회로 변경 전 반드시 전원을 차단합니다.
    - 보안경을 착용하고 비상 정지 시 전압 강하를 확인합니다.
    - 분기 전원은 반드시 독립적으로 운영하며 병렬 연결을 금지합니다.
    - 실제 기계 안전 시스템이 아니므로 사람 접근 시 전문가 검토가 필수입니다.
    deliverables:
    - 구성된 제어 체인 배선도
    - 비상정지 작동/복구 시 접촉기 상태 검증 로그
    - FSR 센서 ADC 출력 데이터 샘플
  assignment:
    title: 제어 시스템 통합 설계 보고서
    deliverables:
    - 통합 배선도 및 안전 체인 블록도
    - 액추에이터 전력 분배 계산서
    - FSR 센서 교정 곡선 데이터
    rubric:
    - 안전 체인 시퀀스가 정확히 준수되었는가?
    - 전력 분기가 규격에 맞게 독립적으로 할당되었는가?
    - ADC 입력이 3.3 V 범위를 초과하지 않게 설계되었는가?
  quiz:
  - question: FSR 센서 ADC 입력 전압 분압 회로를 구동하기 위한 전압 레일은?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    - 24 V 입력 전원
    - 5 V 전원
    answer_index: 1
    explanation: OpenCR의 센서 회로 안정성과 ADC 보호를 위해 반드시 3.3 V 센서 전원을 사용해야 합니다 [S12].
  - question: 비상정지 발생 시 EV200 접촉기를 제어하는 올바른 릴레이 체인은?
    choices:
    - A22E NC → EV200 코일
    - A22E NC → G7SA → G2R → EV200 코일
    - A22E NO → G2R → EV200 코일
    - G7SA NC → EV200 코일
    answer_index: 1
    explanation: A22E 저전류 NC 신호로 강제 유도 릴레이(G7SA)와 중계 릴레이(G2R)를 거쳐 EV200 코일을 제어해야 합니다
      [S21, S22, S23, S24].
  - question: 전원 분기 어댑터의 양(+) 단자를 병렬로 연결해도 됩니까?
    choices:
    - 예, 전류 용량이 늘어납니다.
    - 절대 금지입니다.
    - 퓨즈가 있다면 가능합니다.
    - 접촉기가 있다면 가능합니다.
    answer_index: 1
    explanation: 독립된 어댑터 분기는 전기적으로 반드시 격리되어야 하며 병렬 연결은 금지됩니다 [B3].
  completion_criteria:
  - 안전 체인 회로 구성 및 작동 확인
  - OpenCR-액추에이터 간 통신 성공
  - FSR 센서 데이터 측정 및 전압 분압값 검증
  - 안전 설계 통합 보고서 제출
  source_ids:
  - S3
  - S4
  - S5
  - S12
  - S23
  - S21
  - S22
  - S24
  - S11
  - S27
  - S14
  - S26
- id: M7
  slug: power-safety-circuits
  phase_id: PH3
  title: 전원 분배 및 안전 인터락 회로
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - 로봇 시스템의 안정적인 전원 분배 설계 원리를 이해한다.
  - IEC 60204-1 표준에 기반한 비상 정지 및 전원 차단 회로를 설계한다.
  - 저전류 안전 릴레이와 고전류 DC 접촉기의 체인 제어 기법을 습득한다.
  - 각 액추에이터 분기에 대한 독립적인 과전류 보호 및 차단 전략을 수립한다.
  theory_markdown: "### 전원 분배의 기본 원칙\n로봇 시스템의 신뢰성은 안정적인 전원 공급에서 시작됩니다. 본 로봇손 시스템은\
    \ 총 11개의 XM430-W350-T 액추에이터를 구동하며, 각 액추에이터의 스톨 전류는 2.3 A입니다 [B1]. 모든 액추에이터가 동시에\
    \ 스톨 상태일 때 필요한 피크 전류는 25.3 A에 달합니다. 이를 처리하기 위해 11.5 A 정격의 12 V 전원 어댑터 3개를 사용하여\
    \ 액추에이터를 4대, 4대, 3대로 나누어 독립적으로 분기 공급합니다 [B3]. 양(+) 출력은 절대 서로 연결하지 않으며, 각 분기는 전용\
    \ 10 A ATOF 퓨즈로 과전류를 방어합니다 [B3, B-SAFETY-FUSE].\n\n### 안전 인터락과 비상 정지 회로\n기계 안전을\
    \ 위해 비상 정지 버튼(A22E)을 통한 전원 차단 회로를 구성합니다 [B-SAFETY-ESTOP, S6]. \n1. **비상 정지 입력:**\
    \ A22E의 강제 유도 NC 접점은 12 V 제어 전원을 안전 릴레이(G7SA) 코일로 연결합니다 [B-SAFETY-RELAY].\n2.\
    \ **저전류 제어 계층:** G7SA 릴레이는 30 mA의 낮은 코일 전류로 동작하며, 3개의 NO 접점을 통해 후단 3개 릴레이의 코일\
    \ 회로를 제어합니다 [B-SAFETY-RELAY, S21].\n3. **고전류 차단 계층:** 3개의 G2R-1-SND 릴레이는 각각 EV200AAANA\
    \ 접촉기의 코일을 독립적으로 제어합니다 [B-SAFETY-COIL-RELAY, B-SAFETY-RELAY]. 이는 단일 고전류 접촉기가 아닌\
    \ 독립적이고 검증 가능한 체인 방식을 취합니다 [B-SAFETY-RELAY, B-SAFETY-COIL-RELAY].\n\n### 고전류 DC\
    \ 접촉기 (EV200AAANA)\nEV200AAANA는 연속 전류 500 A를 허용하는 밀폐형 접촉기입니다 [B-SAFETY-ESTOP,\
    \ S24]. 이 접촉기는 시스템 비상 정지 시 3개의 독립 액추에이터 분기를 기계적으로 분리하여 무전원화하는 최종 안전 장치입니다. 본 설계에서\
    \ EV200AAANA의 코일 돌입전류(최대 3.8 A)는 G2R 릴레이가 스위칭하며, 이 G2R 코일은 G7SA 릴레이 접점이 구동합니다\
    \ [B-SAFETY-RELAY, B-SAFETY-COIL-RELAY]."
  worked_examples:
  - '분기 용량 산출: 액추에이터 4대의 최대 전류는 4 * 2.3 A = 9.2 A입니다. 전원 어댑터(11.5 A)와 퓨즈(10 A)는 9.2
    A를 충분히 수용하면서도 비정상적인 과전류로부터 배선을 보호합니다 [B3, B-SAFETY-FUSE].'
  - '비상 정지 동작 흐름: 비상 정지 버튼을 누르면 NC 접점이 열리고, G7SA 코일이 무전원화됩니다. 즉시 G7SA의 NO 접점들이 개방되어
    3개의 G2R 릴레이 코일 전원이 차단됩니다. 최종적으로 G2R NO 접점이 개방되면서 EV200AAANA 접촉기 3개가 동시에 차단되어 모든
    액추에이터의 전원이 물리적으로 분리됩니다 [B-SAFETY-ESTOP, B-SAFETY-RELAY, B-SAFETY-COIL-RELAY].'
  lab:
    title: 안전 인터락 회로 검증
    steps:
    - 각 독립 분기의 전원 회로를 멀티미터로 확인하고, 퓨즈 정격과 배선이 도면과 일치하는지 점검한다.
    - 안전 릴레이 체인(A22E -> G7SA -> G2R -> EV200)을 조립하고 각 단계별 전압 강하를 측정한다.
    - 비상 정지 버튼을 조작하여 EV200AAANA 접촉기가 '딸깍' 소리를 내며 개방되는지 확인한다.
    - 멀티미터를 사용해 EV200 출력단에서 전압이 0 V로 즉시 하강하는지 검증한다.
    safety:
    - 작업 시 반드시 보안경을 착용한다.
    - 항상 저전압 벤치 전원을 사용하여 쇼트 사고를 예방한다.
    - 전원 연결 전에 모든 분기 접점의 독립성을 다시 확인한다.
    - 고전류 시험 전 반드시 전류 제한 회로를 구성한다.
    deliverables:
    - 회로 동작 검증 기록지
    - 비상 정지 응답 시간 측정 데이터
    - 전압 분배 및 안전 계층 구성도
  assignment:
    title: 전원 및 안전 설계 보고서
    deliverables:
    - 독립 분기별 전력 할당 상세도
    - 비상 정지 회로의 제어 계층 회로도
    - 부품 사양서 기반 안정성 분석
    rubric:
    - 각 액추에이터 분기의 독립 전원 공급 원리가 명확한가?
    - 비상 정지 회로가 체인 형식으로 안전하게 구성되었는가?
    - 퓨즈 및 접촉기 정격이 시스템 최대 전류를 초과하는가?
  quiz:
  - question: 본 시스템에서 3개의 전원 어댑터 출력(+)을 병렬로 연결하지 않는 이유는 무엇인가?
    choices:
    - 전압이 36 V로 상승하기 때문에
    - 독립된 분기별 과전류 보호와 안전 차단을 위해서
    - 어댑터의 출력이 서로 다르기 때문에
    - 비용을 절감하기 위해서
    answer_index: 1
    explanation: 독립 분기를 구성함으로써 한 분기의 사고가 전체 시스템으로 퍼지는 것을 막고, 각 분기별로 독립적인 퓨즈와 차단기를
      사용하여 기계 안전 표준을 준수합니다.
  - question: EV200AAANA 접촉기를 제어하는 G2R-1-SND 릴레이의 역할은?
    choices:
    - 고전류 돌입전류를 저전류 제어 회로에서 분리함
    - 전압을 12 V에서 24 V로 변환함
    - 액추에이터의 속도를 제어함
    - 센서 데이터를 수집함
    answer_index: 0
    explanation: EV200의 코일은 돌입전류가 높으므로 이를 직접 제어하는 대신, 저전류 접점 보호를 위해 중간 릴레이(G2R)를 사용합니다.
  completion_criteria:
  - 독립 분기 전원 구성이 BOM과 일치함을 확인
  - 비상 정지 조작 시 EV200 접촉기의 무전원화가 검증됨
  - 모든 센서 및 액추에이터 전원 분리가 도면대로 설계됨
