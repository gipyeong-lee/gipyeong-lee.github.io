- id: M10
  slug: calibration-testing
  phase_id: P4
  title: 시스템 교정 및 내구 시험
  estimated_hours: 6.0
  prerequisites:
  - M9
  objectives:
  - 로봇 시스템의 교정(Calibration) 절차를 이해하고 실습한다.
  - 로봇손의 성능 검증을 위한 내구 시험 및 환경 시험을 설계하고 수행한다.
  - 산업 표준(ISO 10218)에 따른 안전 검증을 수행한다.
  - 교정 기록과 최종 프로젝트 보고서를 작성한다.
  theory_markdown: "## 시스템 교정 및 성능 검증 이론\n\n로봇 시스템의 신뢰성을 확보하기 위해서는 제작 후 엄격한 교정과 시험\
    \ 과정이 필수적입니다. 본 모듈에서는 정교한 5지 로봇손의 제어 정확도, 내구성, 안전성을 검증합니다.\n\n### 1. 시스템 교정 (Calibration)\n\
    로봇 교정은 실제 기구학적 파라미터와 제어 모델 간의 오차를 줄이는 과정입니다. \n- **영점 교정 (Zeroing):** 액추에이터의 기준\
    \ 위치를 절대 엔코더 값과 일치시킵니다 [S36].\n- **키네마틱 교정:** 3D 프린팅의 오차로 인한 기구학적 파라미터(Link length\
    \ 등)의 변형을 측정하여 제어 알고리즘의 파라미터를 보정합니다 [S1].\n\n### 2. 내구 시험 (Durability Testing)\n\
    - **반복 동작 시험:** 특정 그리핑 동작을 10만 회 이상 반복하여 기구적 마모나 액추에이터 고장을 확인합니다 [S24].\n- **부하\
    \ 시험 (Load Bearing):** 최대 파지력(Stall Torque)을 측정하고, 정격 토크 범위 내에서 지속적인 동작 성능을 검증합니다\
    \ [S36].\n\n### 3. 안전 검증 (Safety Standards)\nISO 10218 표준은 로봇 설계와 시스템 통합에 대한 안전\
    \ 요구사항을 정의합니다 [S34].\n- **비상 정지 (Emergency Stop):** 비상시 전원 차단 시스템의 응답 시간을 측정합니다\
    \ [S34].\n- **힘 제한 검증 (PFL Mode):** 접촉 시 인체에 가해지는 힘이 허용 임계치(예: 130N 등)를 넘지 않음을\
    \ 검증합니다 [S34]."
  worked_examples:
  - '예제 1: DYNAMIXEL XM430-W350의 위치 정확도 교정. 관절 각도를 0°, 90°, 180°로 설정하고 실제 측정값과의 편차를
    계산하여 `Homing Offset` 레지스터를 보정하는 방법 [S36, S37].'
  - '예제 2: 파지력 계산. 4.1Nm의 스톨 토크(Stall Torque)를 갖는 액추에이터가 텐션 구동 메커니즘을 통해 손가락 끝에서 발휘하는
    이론적 파지력을 계산하고 실제 측정값과 비교 [S36, S38].'
  lab:
    title: 로봇손 시스템 교정 및 내구 시험 실습
    steps:
    - 각 관절 액추에이터의 영점(Zero Position)을 설정하고 교정 기록지에 기록한다.
    - 로봇손 제어 코드를 사용하여 정격 토크 및 속도 범위 내에서 1,000회 반복 동작 테스트를 수행한다.
    - 파지 시험기를 사용하여 파지력의 일관성을 10회 측정하고 평균값과 오차를 계산한다.
    - ISO 10218 기반의 안전 점검 리스트에 따라 비상 정지 장치의 정상 동작 여부를 확인한다.
    safety:
    - 반드시 보안경을 착용한다.
    - 액추에이터 구동 중 손가락 끼임에 주의한다.
    - 비상 전원 차단 장치를 실습대 옆에 비치하고 상시 사용 가능 상태로 유지한다.
    - 벤치 전원 사용 시 전류 제한(Current Limit)을 반드시 설정한다.
    deliverables:
