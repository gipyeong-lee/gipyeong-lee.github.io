- id: m3
  slug: electronics-basics
  phase_id: p1
  title: 전자 시스템 기초
  estimated_hours: 10.0
  prerequisites:
  - m1
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 전원 및 통신 요구사항 이해
  - FSR 센서와 전압 분압 회로를 이용한 힘 데이터 취득 원리 습득
  - 독립 분기 전원 시스템의 구성과 과전류 보호 개념 이해
  - OpenCR 제어기를 이용한 안전한 로봇 전자 시스템 구현
  theory_markdown: '## 전자 시스템 기초: 전원 및 센서 신호 처리


    정교한 로봇손의 전자 시스템은 액추에이터 전원 분기, 제어 통신, 그리고 센서 피드백의 세 가지 핵심 요소로 구성됩니다.


    ### 1. 전원 시스템 및 과전류 보호

    로봇의 구동을 위해 DYNAMIXEL XM430-W350-T 액추에이터는 12 V 전원을 사용하며, 최대 스톨 전류는 개당 2.3 A입니다
    [S12]. 다수의 액추에이터를 사용할 경우, 총 피크 전류를 고려하여 전력을 분배해야 합니다. 본 시스템에서는 138 W(12 V, 11.5
    A) 정격의 절연형 어댑터를 3개 사용하여 독립적인 전원 분기를 구성합니다 [S16]. 각 분기는 ATOF 10 A 퓨즈를 통해 과전류로부터
    보호되며 [S26], 액추에이터 4대/4대/3대씩 분할 배분하여 단일 분기에 부하가 집중되는 것을 방지합니다. 양(+) 출력은 서로 결합하지
    않으며, 각각 독립된 물리적 분리 수단을 갖추어 안전을 확보합니다.


    ### 2. 센서 데이터 취득 (ADC)

    손끝의 힘을 감지하기 위해 FSR 402 센서를 사용합니다 [S13]. FSR은 가해지는 힘에 반비례하여 저항값이 변하는 가변 저항체입니다.
    OpenCR 제어기의 12비트 ADC를 사용하여 정밀한 힘 값을 측정하기 위해, FSR과 10 kΩ 고정 저항을 직렬로 연결하여 전압 분압
    회로를 구성합니다 [S14, S27]. 센서 구동 전압은 반드시 OpenCR의 3.3 V 센서 전원 레일에서 공급받아야 하며, ADC 입력
    신호가 0~3.3 V 범위를 초과하지 않도록 설계해야 합니다 [S14].


    ### 3. 전자 시스템 안전

    본 프로토타입은 교육용 저전압 벤치 시스템입니다. 시스템 운용 시 전원 인가 중 가동 부위에 접근하지 않으며, 정비 시 3개의 독립 어댑터를
    물리적으로 분리한 후 멀티미터의 DC 전압 모드를 사용하여 모든 분기가 1 V 미만임을 확인한 뒤 접근합니다 [S16].'
  worked_examples:
  - '예제 1: 분기당 총 스톨 전류 계산

    분기 A에 4개의 액추에이터가 연결된 경우, 총 스톨 전류는 4 × 2.3 A = 9.2 A입니다 [S12]. 사용된 ATOF 10 A 퓨즈는
    9.2 A 부하를 견디며, 배선 고장 시 11.5 A 출력 정격 내에서 보호 기능을 수행합니다 [S16, S26].'
  - '예제 2: 전압 분압 회로 계산

    전원 3.3 V, FSR 저항 $R_{FSR}$, 고정 저항 $R_{fixed}=10\text{ k}\Omega$일 때, OpenCR ADC가
    읽는 전압 $V_{ADC} = 3.3 V \times \frac{R_{fixed}}{R_{FSR} + R_{fixed}}$입니다. FSR의
    저항 변화에 따라 0~3.3 V 범위 내에서 값이 결정됩니다 [S13, S14, S27].'
  lab:
    title: 로봇손 전원 분기 및 FSR 신호 측정
    steps:
    - 각 액추에이터 분기에 10 A 퓨즈를 장착한 인라인 홀더를 배선한다 [S25, S26].
    - 각 어댑터의 양(+) 출력이 독립적으로 분기되도록 커넥터를 구성한다 [S15, S16].
    - FSR 센서의 양 끝을 OpenCR의 3.3 V 센서 레일과 ADC 핀, 그리고 10 kΩ 저항과 연결하여 분압기를 제작한다 [S14,
      S27].
    - 멀티미터를 사용하여 모든 전원 분기 출력 전압이 12 V인지 확인한다.
    - 소프트웨어로 FSR 센서 출력 데이터를 ADC 값으로 모니터링한다.
    safety:
    - 전원 인가 전 반드시 배선도와 극성을 2회 이상 확인한다.
    - 절대 각 전원 어댑터의 (+) 출력을 병렬로 결합하지 않는다.
    - 작업 시 충격 방지 보안경을 반드시 착용한다.
    - 시스템 접근 전 3개 전원 어댑터를 물리적으로 분리하고 1 V 미만임을 DC 전압 모드로 확인한다.
    deliverables:
    - 완성된 전원 분기 및 센서 배선도
    - 각 분기 전압 측정 기록지
    - FSR 힘 인가에 따른 ADC 데이터 출력값 표
  assignment:
    title: 로봇손 전자 시스템 설계 보고서
    deliverables:
    - 액추에이터 부하 배분 및 퓨즈 선정 근거 보고서
    - 전압 분압 회로 해석 및 ADC 해상도 산출 수식
    - 안전한 전원 분리 및 계측 절차 기술서
    rubric:
    - 독립 분기 시스템 구성 원리가 정확히 설명되었는가?
    - 전류 및 전압 정격이 설계 규격에 적합한가?
    - 안전한 정비 및 계측 절차가 명시되었는가?
  quiz:
  - question: 본 시스템에서 3개의 전원 어댑터 (+) 출력을 결합하지 않는 이유는 무엇인가?
    choices:
    - 전압이 낮아지기 때문
    - 독립된 분기 유지 및 과전류 보호를 위한 안전 수칙이기 때문
    - 액추에이터 통신 규격이 바뀌기 때문
    - ADC 해상도가 떨어지기 때문
    answer_index: 1
    explanation: 각 분기는 독립적인 퓨즈를 통해 과전류로부터 보호되어야 하며, 출력 전원 간의 결합은 시스템 안전을 위협합니다.
  - question: FSR 센서와 함께 사용하는 분압 저항의 용량은 무엇인가?
    choices:
    - 100 Ω
    - 1 kΩ
    - 10 kΩ
    - 100 kΩ
    answer_index: 2
    explanation: 본 교과과정에서는 OpenCR ADC 취득을 위해 10 kΩ 저항을 사용합니다 [S27].
  - question: 전원 인가 후 유지보수를 위해 가장 먼저 수행해야 할 안전 행동은 무엇인가?
    choices:
    - 멀티미터로 저항 모드 측정
    - 퓨즈를 제거하고 전원 연결
    - 소프트웨어로 토크 해제 후 3개 어댑터를 물리적으로 분리 및 1 V 미만 확인
    - 그냥 전원 코드만 뽑음
    answer_index: 2
    explanation: 전원 어댑터를 물리적으로 분리한 뒤, DC 전압 모드로 1 V 미만임을 확인하는 것이 정석입니다.
  completion_criteria:
  - 각 액추에이터 분기에 독립 퓨즈가 장착된 배선도 작성 완료
  - FSR 센서를 이용한 0~3.3 V ADC 신호 데이터 획득 성공
  - 안전한 정비 및 계측 절차를 숙지하고 보고서 작성 제출
  source_ids:
  - S5
  - S14
  - S12
  - S16
  - S26
  - S13
  - S27
  - S25
  - S15
- id: m4
  slug: actuation-assembly
  phase_id: p2
  title: 구동부 조립
  estimated_hours: 15.0
  prerequisites:
  - m2
  - m3
  objectives:
  - 로봇손 구동부의 핵심 하드웨어인 스마트 액추에이터, 텐던 시스템, 베어링, 프레임의 조립 원리를 이해한다.
  - 분기별 독립 전원 및 퓨즈 보호 회로의 중요성과 배선 표준을 학습한다.
  - 열압입 인서트와 고강도 체결 부품을 사용하여 반복 조립이 가능한 기계 구조를 제작한다.
  theory_markdown: '## 로봇손 구동부 조립 기초


    정교한 5지 로봇손의 구동부는 높은 토크와 정밀한 제어 피드백이 필수적입니다. 본 모듈에서는 구동부 조립의 주요 구성 요소를 다룹니다.


    ### 1. 스마트 액추에이터와 텐던 시스템

    XM430-W350-T 액추에이터는 12V 전압에서 4.1 N·m의 스톨 토크를 제공하며, 전류 피드백을 통해 파지력을 제어할 수 있습니다
    [S12]. 이 회전력을 텐던(Dyneema SK78, 지름 1.5mm)을 통해 손가락 관절로 전달합니다 [S17]. 텐던은 파단 하중 230
    daN을 견딜 수 있으며 작동 신율이 1% 미만으로 정밀한 제어가 가능합니다 [S17].


    ### 2. 하드웨어 치수 정밀도 및 유지보수

    JSM-0810-10 폴리머 슬리브 베어링은 무급유 운전이 가능하여 먼지나 이물질로부터 구동부를 보호합니다 [S18]. 조립 시에는 8mm
    정밀 알루미늄 샤프트(AWMP-08)를 사용하여 유격을 최소화해야 합니다 [S19]. PC-CF(탄소섬유 강화 폴리카보네이트) 프레임에 반복적인
    체결을 보장하기 위해 M3 황동 열압입 인서트(HTBI-M3-BR)를 사용하며, 이는 구멍 지름 4.0mm에 맞춰 열압입합니다 [S20, S22].


    ### 3. 전력 분기 및 안전 보호

    전원 공급은 3개의 독립된 절연형 데스크톱 전원 어댑터(GST160A12-R7B)를 사용하여 배분합니다 [S16]. 각 어댑터는 4대/4대/3대
    단위의 액추에이터 분기로 할당하며, 양(+) 출력은 절대 하나로 묶지 않습니다. 과전류 보호를 위해 각 분기에 ATO 10A 퓨즈와 인라인
    퓨즈 홀더(0AFH0001Z)를 직렬로 연결합니다 [S25, S26].'
  worked_examples:
  - '예제 1: 분기 전원 전류 산정. 1개 액추에이터의 스톨 전류는 2.3 A입니다 [S12]. 4대 액추에이터를 1개 분기에 할당할 경우 피크
    전류는 9.2 A입니다. 이는 10 A 퓨즈의 정격 이내이므로 적절합니다 [S26].'
  - '예제 2: 인서트 홀 치수 확인. M3 황동 인서트의 권장 구멍 지름은 4.0 mm입니다 [S22]. CAD 모델 설계 시 4.0 mm 드릴링
    가이드가 반영되었는지 검증하십시오.'
  lab:
    title: 로봇손 액추에이터 및 프레임 조립
    steps:
    - 각 PC-CF 출력물에 4.0 mm 구멍을 확인하고 M3 열압입 인서트를 규정 깊이만큼 열압입합니다.
    - JSM-0810-10 베어링을 관절 하우징에 장착합니다 [S18].
    - 8 mm 알루미늄 샤프트를 길이에 맞춰 절단하고 모따기하여 베어링과 결합합니다 [S19].
    - 독립 분기별 퓨즈 홀더와 액추에이터 하네스를 배선도에 따라 결합합니다 [S25].
    - 각 전원 어댑터의 독립 출력이 혼용되지 않았는지 멀티미터로 확인합니다.
    safety:
    - 전원 인가 전에는 반드시 3개 어댑터를 물리적으로 분리합니다.
    - 모든 조립 과정에서 충격 방지 작업용 보안경을 착용합니다.
    - 전원 연결 후에는 각 독립 분기가 12 V를 출력하는지 확인하며, 절대로 양(+) 출력끼리 연결하지 마십시오.
    - 정비 전에는 전원 어댑터를 분리하고 모든 분기에서 1 V DC 미만인지 계측 확인합니다.
    deliverables:
    - 완성된 5지 로봇손 프레임 조립 사진
    - 각 분기별 퓨즈 연결 배선 확인서
    - 샤프트-베어링 유격 측정 기록
  assignment:
    title: 로봇손 하드웨어 정밀도 보고서
    deliverables:
    - 조립된 로봇손의 하드웨어 사양 준수 표
    - 분기별 독립 전원 회로도 및 퓨즈 선정 근거
    - 반복 조립 시험 기록(인서트 고정력 테스트)
    rubric:
    - 모든 부품이 BOM에 명시된 규격과 정확히 일치하는가?
    - 전원 분기별 독립성이 보장되고 안전 지침을 준수하는가?
    - 조립된 관절의 마찰과 유격이 기계적 공차 범위 내에 있는가?
  quiz:
  - question: 각 전원 어댑터 분기의 양(+) 출력 단자를 서로 연결하면 발생하는 위험은 무엇입니까?
    choices:
    - 분기당 전압이 상승하여 액추에이터 성능이 향상됩니다.
    - 독립 분기 원칙을 위반하며 예상치 못한 전류 순환과 퓨즈 단락, 손상 위험이 있습니다.
    answer_index: 1
    explanation: 본 프로토타입은 전원 어댑터별 독립적인 퓨즈 분기를 사용합니다. 양(+) 출력을 병렬 연결하면 분기 간의 전위차나 역류로
      인해 안전을 보장할 수 없으므로 절대 금지합니다.
  - question: M3 열압입 인서트(HTBI-M3-BR) 사용 시 권장되는 파일럿 홀의 지름은 얼마입니까?
    choices:
    - 3.0 mm
    - 4.0 mm
    answer_index: 1
    explanation: 데이터시트에 따르면 HTBI-M3-BR 인서트의 권장 구멍 지름은 4 mm입니다 [S22].
  - question: 로봇손의 구동부를 정비하거나 접근하기 전 가장 먼저 해야 할 일은 무엇입니까?
    choices:
    - 소프트웨어 토크 해제 후 전원 어댑터 3개를 물리적으로 분리하고 1V 미만인지 계측합니다.
    - 퓨즈를 제거하고 저항 모드로 배선 상태를 확인합니다.
    answer_index: 0
    explanation: 저항이나 연속성 모드는 전압이 인가된 상태에서 오작동하거나 오류를 일으킬 수 있습니다. 전원 어댑터를 물리적으로 분리하고
      DC 전압 모드로 전압이 1 V 미만인지 확인하는 것이 안전합니다.
  completion_criteria:
  - 하드웨어 조립 완료 및 각 독립 분기의 전압 계측 확인
  - 안전 검토가 포함된 최종 하드웨어 정밀도 보고서 제출
  - 모든 조립 단계에서 안전 지침을 준수함을 서명함
