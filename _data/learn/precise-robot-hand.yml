- id: M5
  slug: fastener-fitting
  phase_id: PH2
  title: 정밀 체결 및 조립
  estimated_hours: 8.0
  prerequisites:
  - M4
  objectives:
  - 탄소섬유 보강 PC 필라멘트 출력물에 열압입 인서트를 정확하게 체결할 수 있다.
  - 나사 조립 시 적절한 토크와 체결 전략을 이해하고 적용할 수 있다.
  - 정밀 조립 과정에서 발생할 수 있는 치수 오차와 간섭을 물리적으로 검증할 수 있다.
  - 정격 하중 및 반복 조립 환경에서의 체결 안정성을 평가할 수 있다.
  theory_markdown: '## 정밀 기계 조립과 체결 기법


    ### 1. 열압입 인서트(Heat-Set Inserts)의 원리

    열압입 인서트는 FDM 3D 프린팅된 PC-CF(탄소섬유 보강 PC) 출력물과 같이 열가소성 수지 부품에 금속 나사산을 삽입하는 가장 신뢰도
    높은 방법입니다. 인서트를 가열하여 주변 수지를 연화시킨 후 압입하면, 인서트 외곽의 널링(knurling) 형상이 수지 내부로 파고들며 강력한
    기계적 고정력을 형성합니다 [S20]. 이는 직접 나사를 나사산 없는 구멍에 체결하는 방식보다 반복적인 분해 조립에서 훨씬 높은 나사산 유지력과
    재현성을 제공합니다 [B9].


    ### 2. 체결의 역학

    체결은 단순히 나사를 조이는 행위가 아니라 부품 간의 적절한 예압(preload)을 유지하는 과정입니다. M3 소켓 헤드 캡스크루는 규격화된
    강도를 가지며 [S19], 인서트의 최대 나사산 길이 내에서 체결 깊이를 확보해야 합니다. 과도한 힘은 출력물 내부의 인서트를 파손시키거나
    PC-CF 모재의 층간 박리를 유발할 수 있으므로, 적절한 공구 선택과 체결 전략이 필수적입니다.


    ### 3. 기계적 정밀도 유지

    조립 전 4.0 mm 파일럿 홀의 치수 정밀도는 인서트 안착의 핵심입니다 [B9, S20]. 출력물의 수축이나 프린팅 오차로 인해 파일럿 홀이
    작을 경우 과도한 열이 필요하게 되어 모재 변형을 유발하고, 너무 클 경우 인서트의 고정력이 저하됩니다. 조립 시에는 항상 수직성을 유지하여
    인서트가 기울어지지 않도록 주의해야 합니다.'
  worked_examples:
  - '사례 1: PC-CF 출력물에 HTBI-M3-BR 인서트 열압입

    1. 파일럿 홀 지름 4.0 mm 확인: 캘리퍼스로 측정 [B9, S20].

    2. 인서트 온도 조절: 인두기 팁을 인서트 상단에 접촉하여 모재가 연화될 때까지만 가열.

    3. 수직 압입: 팁으로 가볍게 눌러 인서트 상단이 모재 표면과 수평이 될 때까지 정지.

    4. 냉각 및 고정: 수지가 경화되도록 약 30초간 대기 후 체결 테스트 수행.'
  - '사례 2: M3x10 캡스크루 체결

    1. 체결력 확보: M3 캡스크루와 인서트 나사산 사이의 마찰력을 활용하여 부품 간 유격 제거.

    2. 과토크 방지: 손목 힘만을 이용하여 체결하며, 나사산이 헛도는 느낌(stripping)이 발생하기 직전에 조립 완료.'
  lab:
    title: 5지 로봇손 구조 모듈의 정밀 조립 및 정렬
    steps:
    - 각 PC-CF 출력물의 파일럿 홀(4.0 mm)을 멀티미터의 도통 시험 모드가 아닌 캘리퍼스로 정밀 측정하여 치수 오차 확인.
    - 인두기를 사용하여 M3 황동 열압입 인서트를 출력물에 수직으로 안착.
    - M3x10 소켓 헤드 캡스크루를 사용하여 텐던 가이드와 관절 모듈을 프레임에 가조립.
    - 샤프트 장착 전 igus 슬리브 베어링(JSM-0810-10)의 유격을 8 mm 알루미늄 샤프트로 점검하고 하우징에 장착.
    - 최종적으로 모든 나사산을 부드럽게 끝까지 체결하여 기계적 정렬 상태를 검증.
    safety:
    - 인두기 사용 시 화상 주의, 반드시 보안경 착용.
    - 부품 가공 및 트리밍 과정에서 발생하는 파편으로부터 눈 보호.
    - 전원 인가 전 반드시 구조물 조립을 완료하고 가동 범위 내에 장애물이 없는지 확인.
    - 본 벤치 프로토타입은 계획 정지 회로가 없으므로 정지 상태 확인 시 3개 절연 전원 어댑터를 물리적으로 분리하고 DC 전압을 계측하여 1
      V 미만임을 확인 후 접근.
    deliverables:
    - 인서트 안착 수직도 및 나사 체결 정확도 기록.
    - 조립 완료된 5지 모듈의 기계적 유격 검증 보고서.
    - 체결 부위의 균열 여부 검사 결과.
  assignment:
    title: 조립 재현성 및 체결 안정성 평가
    deliverables:
    - 인서트 열압입 공정 및 조립 순서가 포함된 표준 작업 절차서(SOP).
    - 반복 조립 시험(5회) 시 발생한 나사산 유격 데이터.
    - 조립 단계별 오차 허용 범위(Tolerance) 분석 보고서.
    rubric:
    - 열압입 인서트가 모재 표면과 수평을 유지하며 정밀하게 삽입되었는가?
    - 모든 나사 체결 부위가 유격 없이 안정적으로 고정되었는가?
    - 조립 과정에서 출력물 모재의 열변형이나 균열이 없는가?
    - SOP가 재현 가능하도록 상세하게 작성되었는가?
  quiz:
  - question: PC-CF 출력물에 열압입 인서트를 사용할 때 적절한 파일럿 홀의 크기는?
    choices:
    - 2.5 mm
    - 4.0 mm
    - 5.5 mm
    - 8.0 mm
    answer_index: 1
    explanation: HTBI-M3-BR 인서트의 권장 구멍 지름은 4.0 mm입니다 [S20].
  - question: 정밀 조립 시 인두기를 이용한 열압입 과정에서 가장 주의해야 할 점은?
    choices:
    - 인서트를 최대한 깊게 박아넣어야 한다.
    - 열을 가하지 않고 망치로 두드려 삽입한다.
    - 인서트의 수직성을 유지하며 모재의 변형을 최소화한다.
    - 주변 PC-CF 수지가 완전히 녹아 없어질 때까지 가열한다.
    answer_index: 2
    explanation: 인서트가 기울어지면 체결 유격이 발생하며, 과도한 가열은 모재의 구조적 강도를 저하시킵니다.
  - question: 본 프로젝트에서 텐던 장력 및 하중을 견디는 관절 회전축으로 적합한 베어링은?
    choices:
    - 금속 볼 베어링
    - 무급유 폴리머 슬리브 베어링(JSM-0810-10)
    - 3D 프린팅 된 플라스틱 부싱
    - 일반 황동 와셔
    answer_index: 1
    explanation: 본 프로젝트는 유지보수와 오염 방지를 위해 8x10x10 mm 규격의 무급유 폴리머 베어링 사용을 명시하고 있습니다
      [B8, S16].
  completion_criteria:
  - 모든 인서트가 5개 손가락 출력물에 수평으로 정확히 안착되어야 함.
  - 조립된 관절 모듈이 유격 없이 부드럽게 회전함을 물리적으로 확인.
  - 제출된 표준 작업 절차서(SOP)가 실습 과정을 재현 가능하게 상세히 기술되어야 함.
  source_ids:
  - S19
  - S20
  - S16
- id: M6
  slug: control-hw
  phase_id: PH3
  title: 제어기 및 전원부 배선
  estimated_hours: 12.0
  prerequisites:
  - M5
  objectives:
  - DYNAMIXEL 스마트 액추에이터와 OpenCR 제어 보드의 물리적 배선 원리를 이해한다.
  - 다중 전원 분기 구성과 과전류 보호를 위한 퓨즈 설계 개념을 습득한다.
  - 센서 신호 취득을 위한 전압 분압 회로를 안전하게 구성한다.
  - 무전원 상태 확인 및 안전한 전원 인가 절차를 준수한다.
  theory_markdown: '## 제어 및 전원 시스템 아키텍처


    5지 로봇손 시스템은 고출력 액추에이터 분기와 저전력 센서/제어 분기로 나뉩니다. 각 분기의 전기적 독립성은 시스템 안정성과 안전의 핵심입니다.


    ### 1. 전원 분기 및 보호

    - **분리형 전원 아키텍처:** 138W급 절연형 전원 어댑터 3개를 사용해 11대의 액추에이터를 4대/4대/3대로 배분합니다 [S14].
    독립된 각 출력의 양(+) 단자를 절대 하나로 묶어서는 안 됩니다.

    - **과전류 보호:** 각 12V 분기는 10A ATOF 퓨즈를 통과하여 공급됩니다 [S24]. 퓨즈는 스톨 전류 합계(각 2.3A, 최대
    9.2A/분기)를 고려하여 선정되었습니다 [S10, S24]. 퓨즈는 사고 발생 시 회로를 차단하지만, 계획 정지 장치가 아님을 명시합니다.


    ### 2. 센서 신호 인터페이스

    - **전압 분압:** FSR 402 센서는 압력에 따라 저항이 변합니다 [S11]. OpenCR의 ADC(12비트)를 통해 신호를 읽기 위해
    10kΩ 저항을 사용한 분압 회로를 구성합니다 [S12, S25].

    - **전압 제한:** 분압 회로는 반드시 OpenCR의 3.3V 센서 전원 레일에 연결하며, 절대 5V나 12V 전원을 사용하지 않습니다
    [S12].'
  worked_examples:
  - '예제 1: 퓨즈 선정의 적절성 평가. 4대의 액추에이터가 동시에 스톨 상태일 때, 각 분기의 전류는 4 × 2.3A = 9.2A입니다. 선정된
    10A 퓨즈는 9.2A를 충분히 통과시키며, 단락 사고 시 회로를 보호하는 정격으로 적절합니다 [S10, S24].'
  - '예제 2: 전압 분압 회로 해석. FSR 저항($R_{FSR}$)과 10kΩ 고정 저항($R_{fixed}$)을 직렬 연결하고 3.3V 전원을
    인가할 때, ADC 입력 전압($V_{out}$)은 $V_{out} = 3.3V × (R_{fixed} / (R_{FSR} + R_{fixed}))$
    입니다. $R_{FSR}$이 무한대(힘 없음)일 때 $V_{out} = 0V$, 센서가 눌려 $R_{FSR}$이 작아지면 $V_{out}$이
    3.3V에 근접하게 됩니다 [S11, S12, S25].'
  lab:
    title: 전원 및 배선 시스템 구축 실습
    steps:
    - 각 액추에이터 분기에 독립 10A 퓨즈 홀더를 삽입하고 배선 경로를 고정한다 [S14, S23].
    - 각 12V 전원 어댑터가 독립적인지 멀티미터 DC 전압 모드로 확인한다.
    - OpenCR 제어 보드의 3.3V 센서 전원을 FSR 분압 회로에 연결한다 [S12].
    - 각 손가락 모듈을 Micro-Fit 3.0 커넥터를 통해 해당 퓨즈 분기에 연결한다 [S13].
    - 모든 전원을 분리하고 각 분기별로 무전원 상태(<1V)임을 멀티미터로 검증한다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리한 후 수행한다.
    - 무전원 상태 검증은 반드시 DC 전압 모드에서 수행하며, 저항/도통 모드를 사용하지 않는다.
    - 전원 인가 전 배선도를 반드시 다시 검토하고, 모든 양(+) 단자가 독립 분리되었는지 확인한다.
    - 보안경을 필히 착용하고 작업을 수행한다.
    deliverables:
    - 분기별 전압 측정 검증 로그
    - 최종 전원 및 신호 배선 사진
    - 안전 수칙 준수 서약서
  assignment:
    title: 시스템 배선도 및 안전 평가 보고서
    deliverables:
    - 전체 배선도 (전원, 퓨즈, OpenCR, FSR 위치 명시)
    - 각 전원 분기의 부하 분배 계산서
    - 계획 정지 절차 기술서
    rubric:
    - 배선도가 3개 독립 전원 어댑터의 분리 구성을 정확히 나타내는가?
    - 액추에이터 부하 계산이 퓨즈 정격과 일치하는가?
    - 무전원 상태 확인 절차가 안전 프로토콜에 부합하는가?
  quiz:
  - question: 3개의 12V 전원 어댑터 출력 배선에 대한 올바른 처리 방법은?
    choices:
    - 모든 양(+) 단자를 하나로 묶어 공통 전원 버스를 만든다.
    - 각 분기는 독립 퓨즈를 거쳐 서로 분리된 상태를 유지한다.
    - 하나의 어댑터 출력에 11대의 액추에이터를 모두 연결한다.
    answer_index: 1
    explanation: 독립 분기는 전기적으로 분리되어야 하며, 양(+) 단자를 병렬 연결하는 것은 금지됩니다.
  - question: FSR 힘 센서의 분압 회로 전원 공급으로 올바른 것은?
    choices:
    - 12V 액추에이터 전원
    - 5V 외부 전원
    - 3.3V OpenCR 센서 전원
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3V 기준이며, 다른 전압을 사용 시 보드가 손상될 수 있습니다.
  - question: 실험 중 전원을 차단한 후 가장 먼저 해야 할 일은?
    choices:
    - 멀티미터의 도통 모드로 회로가 끊겼는지 확인한다.
    - 멀티미터의 DC 전압 모드로 각 분기의 전압이 1V 미만인지 확인한다.
    - 즉시 손으로 회로를 만져본다.
    answer_index: 1
    explanation: 안전 확인은 전압 측정으로만 수행하며, 도통 모드는 안전 확인 도구가 아닙니다.
  completion_criteria:
  - 3개 독립 분기의 무전원 상태 확인 및 배선 검증 완료
  - 배선도 내 모든 안전 수칙 포함 및 안전 평가서 작성 완료
  - FSR 전압 분압 회로 구성 및 ADC 신호 정상 확인
  source_ids:
  - S6
  - S12
  - S13
  - S14
