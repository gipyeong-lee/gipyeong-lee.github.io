- id: mod-4
  slug: transmission-systems
  phase_id: phase-2
  title: 동력 전달 구조 설계
  estimated_hours: 10.0
  prerequisites:
  - mod-3
  objectives:
  - 로봇손의 구동력을 전달하는 텐던(tendon) 구동 원리와 효율적인 설계 방법을 이해한다.
  - Dyneema SK78 고강도 섬유 텐던의 특성과 신율 제어의 중요성을 학습한다.
  - 회전 관절과 구동기 간의 텐던 장력 전달 구조를 설계하고 베어링을 통해 마찰을 최적화한다.
  theory_markdown: '### 텐던 구동 시스템 기초


    로봇손의 손가락은 인간의 근육과 힘줄 구조를 모사한 텐던 구동 시스템을 주로 사용합니다. 이는 구동기(DYNAMIXEL XM430)를 원격지에
    배치하여 손가락 모듈 자체의 무게와 부피를 줄일 수 있는 장점이 있습니다 [S14].


    #### 텐던 특성과 선택

    텐던은 액추에이터의 토크를 관절에 전달하는 핵심 매개체입니다. Dyneema SK78과 같은 고강도 섬유는 지름 1.50 mm로도 230 daN의
    높은 파단 하중을 견딜 수 있으며, 작동 신율이 1% 미만으로 매우 낮아 정밀한 위치 제어에 적합합니다 [S17]. 신율이 높으면 제어 명령에
    대한 반응이 늦어지거나 위치 오차가 발생하므로, 반드시 추적 가능한 고성능 섬유 소재를 사용해야 합니다 [S17].


    #### 마찰 제어와 회전 구조

    구동력을 원활하게 전달하려면 텐던이 통과하는 경로의 마찰을 최소화해야 합니다. 특히 손목과 관절 회전축에는 유지보수가 필요 없는 무급유 폴리머
    슬리브 베어링(JSM-0810-10)을 사용하여 유격을 줄이고 부드러운 움직임을 확보합니다 [S18]. 베어링 조립 시 하우징 보어 공차와
    샤프트(AWMP-08)의 정밀도는 마찰 토크에 직결되므로 조립 전 치수 확인이 필수입니다 [S18, S19].


    #### 기구적 연결

    고정 부품은 M3 소켓 헤드 캡스크루와 열압입 인서트를 사용하여 제작된 프레임(PC-CF)에 단단히 체결합니다 [S20, S21, S22].
    이는 반복적인 분해 조립에도 치수 안정성을 보장하며 기계적 강성을 유지합니다 [S20].'
  worked_examples:
  - '예제 1: 텐던 선택 및 계산. 구동기의 최대 스톨 토크가 4.1 N·m일 때 [S14], 텐던이 감기는 캡스턴 반경(r)이 10 mm라면
    텐던에 가해지는 장력(T)을 계산하십시오. (계산: T = 토크 / r = 4.1 N·m / 0.01 m = 410 N). 230 daN(약
    2300 N)의 파단 하중을 가진 Dyneema SK78은 이 장력을 충분히 견딜 수 있음을 확인합니다 [S17].'
  - '예제 2: 베어링 선정. 8 mm 알루미늄 샤프트를 사용하기 위해 igus JSM-0810-10 슬리브 베어링의 내경(8 mm)과 적합한지
    확인하십시오 [S18, S19]. 해당 베어링은 10 mm 외경을 가지므로, 하우징에는 10 mm 구멍을 가공해야 최적의 압입 조립이 가능합니다
    [S18].'
  lab:
    title: 텐던 마찰 최소화 및 회전 관절 조립
    steps:
    - FDM 출력된 손가락 링크와 손바닥 프레임의 4.0 mm 파일럿 홀을 확인합니다 [S20, S22].
    - 인두기를 사용하여 M3 황동 열압입 인서트를 출력물 홀에 수직으로 정확히 압입합니다 [S22].
    - 8 mm 알루미늄 샤프트를 적절한 길이로 절단하고 끝단 모따기를 수행합니다 [S19].
    - 슬리브 베어링을 하우징 보어에 압입하고 샤프트가 부드럽게 회전하는지 확인합니다 [S18].
    - 텐던 라인을 캡스턴에 감아 장력을 조정하고, 비정상적인 마찰이나 간섭이 없는지 반복 시험합니다 [S17].
    safety:
    - 전원 인가 중에는 손을 가동 범위에 넣지 않습니다.
    - 인두기 사용 시 화상 주의 및 충분한 환기를 실시합니다.
    - 인서트 압입 시 열에 의한 출력물 변형을 방지하기 위해 정해진 시간 내에 작업합니다.
    - 보안경을 필히 착용하고 작업을 진행합니다.
    deliverables:
    - 조립된 관절의 마찰 토크 측정 결과 기록
    - 텐던 장력 시험 시 변형 및 파손 여부 확인 보고서
    - 조립된 로봇손 링크 및 샤프트의 정밀도 치수 확인서
  assignment:
    title: 5지 로봇손 전달 구조 설계 및 시뮬레이션
    deliverables:
    - 텐던 경로와 관절 회전축이 포함된 최종 CAD 파일
    - 사용된 부품의 사양과 BOM 매칭 확인서
    - 텐던 인장 강도와 예상 구동 토크 계산 보고서
    rubric:
    - CAD 설계 시 마찰을 최소화할 수 있는 텐던 경로를 확보하였는가?
    - 사용된 베어링과 샤프트의 치수 공차가 조립 가능한 수준인가?
    - 텐던의 파단 하중이 구동기의 스톨 토크 대비 충분한 안전율을 확보하였는가?
    - 열압입 인서트와 캡스크루가 정해진 표준 규격을 준수하였는가?
  quiz:
  - question: Dyneema SK78 텐던을 사용하는 주된 이유는 무엇입니까?
    choices:
    - 신율이 매우 낮아 정밀한 제어가 가능하기 때문
    - 가격이 가장 저렴하기 때문
    - 전기 전도성이 뛰어나 센서 대용으로 쓸 수 있기 때문
    - 신축성이 좋아 관절을 크게 움직일 수 있기 때문
    answer_index: 0
    explanation: Dyneema SK78은 작동 신율이 1% 미만으로 매우 낮아 구동기의 위치 정보를 관절에 정밀하게 전달할 수 있습니다
      [S17].
  - question: 슬리브 베어링(JSM-0810-10) 조립에 대한 설명으로 올바른 것은?
    choices:
    - 압입 후 내경이 더 작아지므로 하우징 설계 시 이를 고려해야 한다.
    - 접착제를 사용하여 베어링을 고정하는 것이 가장 좋다.
    - 반드시 그리스를 듬뿍 발라야 마찰이 줄어든다.
    - 8 mm 샤프트보다 10 mm 샤프트를 사용하는 것이 좋다.
    answer_index: 0
    explanation: iglide 베어링은 압입 시 내경이 조정되므로, 올바른 주행을 위해서는 하우징 보어 치수와 압입 공차를 설계 단계에서
      반영해야 합니다 [S18].
  completion_criteria:
  - 텐던 구동 구조의 마찰 측정 및 보고서 제출 완료
  - 회전축의 베어링 조립 및 원활한 동작 확인 완료
  - 설계 사양과 BOM 상의 부품 규격 일치 확인 완료
