- id: m10
  slug: calibration-testing
  phase_id: phase-3
  title: 교정 및 기능 검증
  estimated_hours: 10.0
  prerequisites:
  - m9
  objectives:
  - 로봇 손 구동기의 제어 정밀도와 FSR 센서 피드백의 상관관계를 분석한다.
  - 정격 전원 분기와 퓨즈 보호 시스템의 전기적 안전 규격을 이해하고 검증한다.
  - 텐던 기반 매커니즘의 동역학적 특성을 파악하고 교정 절차를 설계한다.
  theory_markdown: '### 정교한 로봇 손 교정 및 시스템 검증


    로봇 손의 정밀도는 구동기와 감지기 간의 통합 제어 성능에 달려 있습니다. DYNAMIXEL XM430-W350-T 액추에이터는 12 V 시스템에서
    4.1 N·m의 토크를 제공하며, 전류 및 위치 피드백을 통해 텐던 장력을 제어합니다 [S9]. FSR 402 센서는 0.2 N에서 20 N
    범위의 힘을 감지하며 [S10], 이를 OpenCR 컨트롤러의 ADC(12-bit 해상도)로 신호를 취득합니다 [S11].


    #### ADC 아날로그 신호 처리

    FSR 센서의 저항은 인가된 힘에 따라 감소합니다. OpenCR의 3.3 V 센서 전원을 기준으로, 10 kΩ 고정 저항(R_fixed)을
    사용하여 분압 회로를 구성합니다 [S24]. 출력 전압 V_out은 V_in * (R_fixed / (R_fsr + R_fixed)) 공식으로
    결정되며, 이때 V_in은 3.3 V를 절대 초과하지 않아야 ADC 입력 범위를 준수합니다. 이를 통해 얻은 전압 값을 정규화하여 실제 힘(N)으로
    변환하는 교정 곡선을 작성합니다.


    #### 전기 분기 안전

    액추에이터 11대 전체 스톨 전류 합계는 25.3 A(11 * 2.3 A)입니다 [S9]. GST160A12-R7B 어댑터 3대를 사용하여
    4대/4대/3대로 분리하여 공급합니다 [S13]. 분기당 최대 스톨 전류는 9.2 A(4대 * 2.3 A)이므로, 10 A ATOF 퓨즈를
    각 분기에 적용하여 보호합니다 [S23]. 이는 32 V DC 정격이며 [S23], 11.5 A 어댑터 출력 내에서 과전류를 효과적으로 방지합니다
    [S13].'
  worked_examples:
  - 'ADC 분압 계산: V_in이 3.3 V이고 R_fixed가 10 kΩ일 때, FSR 저항이 5 kΩ으로 감소하면 V_out = 3.3 *
    (5 / (5 + 10)) = 1.1 V입니다. 이는 0-3.3 V 범위 내에 있으므로 안전합니다.'
  - '퓨즈 보호 설계: 4개의 XM430 액추에이터가 든 분기의 피크 전류는 9.2 A입니다 [S9]. 10 A ATOF 퓨즈를 선택하면 정상
    가동 중에는 퓨즈가 단락되지 않으며, 배선 단락 시 퓨즈의 냉간 저항(7.70 mΩ) 특성에 따라 과전류 차단 시퀀스를 수행합니다 [S23].'
  lab:
    title: 로봇 손 정밀 교정 및 안전 시험
    steps:
    - 모든 전원 어댑터의 DC 출력을 물리적으로 분리하여 무전원 상태를 확인합니다.
    - 멀티미터를 DC 전압 모드로 설정하고 각 분기 퓨즈 단자에서 1 V 미만인지 확인합니다.
    - OpenCR ADC 핀에 연결된 FSR 분압 회로의 3.3 V 전원을 연결하고 전압을 측정합니다.
    - 교정 지그에 FSR을 배치하고 표준 분동을 사용하여 힘(N) 대비 ADC 값 데이터를 수집합니다.
    - 텐던 장력을 서서히 올리며 액추에이터 전류 피드백을 모니터링하여 무부하 상태에서 자유 거동을 확인합니다.
    safety:
    - 실험 중 정지 시 3개의 전원 어댑터를 물리적으로 분리하고 1 V 미만임을 반드시 확인하십시오.
    - 전원 인가 중 손을 구동기 가동 범위 내에 넣지 마십시오.
    - 반드시 보안경을 착용하여 텐던 파단 시 튕김 사고를 방지하십시오.
    - 정지 회로를 안전 장치로 사용하지 마십시오.
    deliverables:
    - FSR 교정 곡선 데이터 및 회귀 분석 그래프
    - 분기별 전압 측정 교정 기록지
    - 무부하 동작 시험 결과 보고서
  assignment:
    title: 시스템 통합 및 성능 평가 보고서
    deliverables:
    - 힘 센서 교정 데이터 시트
    - 전기 분기별 과전류 차단 설계 근거
    - 최종 로봇 손 기능 검증 보고서
    rubric:
    - FSR 전압 분압 계산식이 3.3 V 범위 내에 정확히 설계되었는가?
    - 액추에이터 11대의 피크 전류를 3개 분기가 적절히 수용하고 있는가?
    - 퓨즈 정격이 피크 전류보다 높고 어댑터 정격보다 낮은가?
  quiz:
  - question: OpenCR FSR 분압 회로 설계 시 적절한 전원 전압은 무엇인가?
    choices:
    - 5 V
    - 12 V
    - 3.3 V
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3 V 센서 레일을 사용하며 신호를 0-3.3 V 범위 내로 유지해야 안전합니다 [S11].
  - question: 액추에이터 11대를 3개 분기로 나눌 때, 한 분기당 최대 스톨 전류 합계는 얼마인가?
    choices:
    - 2.3 A
    - 9.2 A
    - 25.3 A
    answer_index: 1
    explanation: 4대의 액추에이터가 포함된 분기에서는 4 * 2.3 A = 9.2 A의 피크 전류가 발생합니다 [S9].
  - question: 벤치 프로토타입에서 실험 중 정지를 위해 가장 안전한 방법은 무엇인가?
    choices:
    - 소프트웨어 정지
    - 퓨즈 제거
    - 모든 전원 어댑터를 물리적으로 분리 후 전압 확인
    answer_index: 2
    explanation: 벤치 프로토타입은 인증된 계획 정지이 없으므로 물리적 전원 분리와 DC 전압 측정이 필수입니다.
  completion_criteria:
  - 모든 분기 회로의 전압이 1 V 미만으로 측정되는 무전원 안전 상태 입증
  - FSR 데이터의 힘 변환 교정 완료
  - 3개 독립 분기 배선 및 퓨즈 보호 시스템 검증 완료
