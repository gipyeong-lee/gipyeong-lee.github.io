- id: mod-3
  slug: structural-printing
  phase_id: phase-2
  title: 구조부 3D 프린팅
  estimated_hours: 15.0
  prerequisites:
  - mod-2
  objectives:
  - FDM 3D 프린팅의 탄소섬유 충진재(PC-CF) 특성을 이해하고 출력물을 위한 최적의 설정을 정의한다.
  - 정밀 로봇 구조물을 위한 치수 안정성 및 강성 확보 원리를 익힌다.
  - 열압입 인서트 및 베어링 조립을 위한 적정 파일럿 홀과 공차 관리 방법을 습득한다.
  - 탄소섬유 출력 과정에서의 장비 안전 및 재료 관리 절차를 수행한다.
  theory_markdown: '## 고강도 FDM 출력 전략: 탄소섬유 충진 PC (PC-CF)


    로봇손의 구조물은 높은 기계적 강성과 치수 안정성을 동시에 요구한다. Prusament PC-CF(PC Blend Carbon Fiber)는
    탄소섬유가 충진된 PC(폴리카보네이트) 기반 소재로, 강성 및 고온 내성이 우수하여 로봇 관절 부위에 적합하다 [S17].


    ### 1. 주요 물성 및 온도 관리

    - **노즐 온도(285 °C):** 고온에서 적절한 층간 결합력을 확보하여 구조적 강도를 높인다 [S17].

    - **베드 온도(110 °C):** 출력 초기 부착력 유지 및 수축 방지를 위해 필수적이다 [S17].


    ### 2. 하드웨어 요건 및 관리

    - **경화강 노즐(Hardened Steel Nozzle):** 탄소섬유는 매우 연마성이 강해 황동 노즐을 빠르게 마모시킨다 [S17].

    - **표면 접착:** 탄소섬유 충진 소재는 PEI 시트에 과도하게 접착될 수 있으므로, 보존을 위해 접착용 풀(glue stick) 사용이
    권장된다 [S17].


    ### 3. 정밀 조립을 위한 설계 요소

    - **파일럿 홀(Pilot Holes):** 열압입 나사산 인서트(M3×0.5용, 외경 4.4 mm)를 삽입하기 위해서는 4.0 mm의 정밀한
    파일럿 홀이 필요하다 [B-FASTENER][FAS-01].

    - **공차 관리:** IGUS 무급유 슬리브 베어링(JSM-0810-10)을 위한 10 mm 보어는 베어링 외경과 압입 공차를 고려하여 설계해야
    한다 [BEA-01].'
  worked_examples:
  - '예제 1: PC-CF 출력물의 인서트 홀 직경 계산. 인서트 외경이 4.4 mm이고 설계 권장 구멍이 4.0 mm라면, 프린터의 수평/수직
    수축률(보통 0.1~0.2%)을 CAD에 반영하여 실제 출력 시 4.0 mm가 나오도록 설정한다 [FAS-01].'
  - '예제 2: 출력물 강성 극대화. 로봇손 관절 링크와 같이 인장력이 집중되는 부위는 레이어 적층 방향이 응력 방향과 수직이 되도록 모델 방향을
    배치하여 층간 박리를 방지한다.'
  lab:
    title: 로봇손 프레임 출력 및 조립 준비
    steps:
    - 경화강 노즐로 교체하고 베드를 IPA로 세척한다 [S17].
    - 슬라이서에서 285 °C 노즐 온도와 110 °C 베드 온도 설정을 확인한다 [S17].
    - 손가락 링크와 손바닥 프레임 모델을 출력한다.
    - 출력물 냉각 후 4.0 mm 드릴 비트를 사용하여 나사산 인서트 홀을 정밀하게 다듬는다 [FAS-01].
    - 열압입 인서트 삽입기(또는 인두기 설정 온도 준수)를 사용하여 인서트를 삽입한다 [FAS-01].
    safety:
    - 110 °C 고온 베드에 의한 화상 주의 [S17].
    - 출력물 제거 시 날카로운 스크래퍼 사용 주의.
    - 인서트 열압입 시 유해 가스 환기 필수.
    deliverables:
    - 출력된 손가락 링크 및 손바닥 프레임.
    - 치수 정밀도 측정 기록(인서트 홀 직경).
    - 조립 완료된 인서트 체결 사진.
  assignment:
    title: 3D 프린팅 설정 및 설계 공차 분석 보고서
    deliverables:
    - 슬라이서 출력 설정 스크린샷 및 이유 설명.
    - 인서트 및 베어링 보어 치수 실측값 기록.
    - 강성 확보를 위한 적층 방향 설정 분석.
    rubric:
    - 재료 사양(온도 등) 준수 여부.
    - 정밀 측정 도구(캘리퍼스)를 활용한 치수 측정의 정확성.
    - 구조적 강성을 고려한 출력 방향 전략의 논리적 타당성.
  quiz:
  - question: PC-CF 소재 출력 시 반드시 필요한 노즐 종류는?
    choices:
    - 황동 노즐
    - 경화강 노즐
    - 스테인리스 스틸 노즐
    - 루비 노즐
    answer_index: 1
    explanation: 탄소섬유는 마모성이 매우 강하므로 일반 황동 노즐을 사용하면 즉시 마모되어 경화강 노즐이 필수적입니다 [S17].
  - question: M3 열압입 인서트(외경 4.4 mm) 삽입을 위한 권장 구멍 지름은?
    choices:
    - 3.0 mm
    - 4.0 mm
    - 4.4 mm
    - 5.0 mm
    answer_index: 1
    explanation: 공식 사양에 따르면 4.4 mm 외경 인서트를 위해 4.0 mm의 구멍 지름이 권장됩니다 [FAS-01].
  completion_criteria:
  - 로봇손 모든 구조 부품(손가락 및 손바닥) 출력 완료.
  - 모든 열압입 인서트 및 베어링 보어의 치수 측정 후 공차 내 확인.
  - 3D 프린팅 설정 및 조립 준비 보고서 제출.
  source_ids:
  - S17
- id: mod-4
  slug: assembly-mechanical
  phase_id: phase-2
  title: 기계부 조립 및 베어링
  estimated_hours: 15.0
  prerequisites:
  - mod-3
  objectives:
  - 정밀 로봇손 기계 구조의 조립 원리 이해
  - igus JSM-0810-10 베어링과 8mm 샤프트의 공차 관리 방법 습득
  - 열압입 인서트(Heat-set insert)를 이용한 반복 조립 구조 최적화
  - 텐던 구동 시스템의 마찰 최소화 및 조립 정밀도 확보
  theory_markdown: "### 정밀 기계 조립의 원리\n로봇손과 같이 복잡한 자유도를 가진 시스템에서 기계 조립의 정밀도는 제어 성능을\
    \ 결정짓는 핵심 요소입니다. \n\n#### 베어링과 샤프트의 공차 관리\n본 프로젝트에서는 Igus JSM-0810-10 폴리머 슬리브\
    \ 베어링을 사용합니다. 이는 무급유 방식으로 동작하며 [S15], 8mm 정밀 샤프트와 결합됩니다 [S16]. \n- **압입(Press-fit):**\
    \ 슬리브 베어링은 하우징 보어에 압입될 때 내경이 수축하므로, 조립 전후의 치수 공차 관리가 필수입니다 [S15].\n- **샤프트 정렬:**\
    \ 샤프트는 절단 시 +/- 1mm 공차를 가지므로 [S16], 조립 전 필요한 길이로 절단 후 끝단 모따기(Chamfer) 처리를 하여 베어링\
    \ 손상을 방지해야 합니다.\n\n#### 열압입 인서트(Heat-set inserts)\n탄소섬유 PC 필라멘트로 출력된 프레임에 나사산\
    \ 구조를 만들 때, 나사산을 직접 출력하는 대신 황동 열압입 인서트를 사용합니다 [S19].\n- **원리:** 인서트를 홀에 위치시킨 후\
    \ 인두기로 가열하여 주변 수지를 용융시켜 고정합니다.\n- **장점:** 직접 나사 체결보다 반복적인 분해·조립 시 나사산의 마모를 방지하여\
    \ 구조적 안정성을 유지합니다 [S19]."
  worked_examples:
  - '예제 1: 8mm 샤프트 조립 시, 하우징 보어 지름이 10mm인 것을 확인하고 [S15], 베어링을 수직으로 압입하여 유격 발생 여부를
    멀티미터의 깊이 측정 기능을 사용해 검증한다.'
  - '예제 2: PC-CF 출력물에 4.0mm 파일럿 홀이 생성되었는지 확인 후 [S19], 300°C로 설정된 인두기를 사용하여 HTBI-M3-BR
    인서트를 수평으로 삽입하여, 체결된 M3 캡스크루가 기울어지지 않게 고정한다 [S19].'
  lab:
    title: 손가락 관절 하우징 조립 및 베어링 압입
    steps:
    - PC-CF 출력물 프레임의 4.0mm 홀에 인두기를 이용해 M3 열압입 인서트를 삽입한다.
    - JSM-0810-10 베어링을 손가락 관절 하우징에 수직 방향으로 정렬하여 압입한다.
    - 8mm 알루미늄 샤프트를 베어링 내경에 삽입하여 마찰 저항이 없는지 확인한다.
    - M3 캡스크루를 사용하여 인서트가 삽입된 지점에 각 링크를 조립한다.
    safety:
    - 인두기 사용 시 화상 주의 (온도 300°C 내외)
    - 보안경 필수 착용
    - 압입 시 손가락 끼임 방지 설계 확인
    - 전류 제한된 벤치 전원 사용
    deliverables:
    - 조립된 손가락 링크 모듈 5개
    - 조립 공차 보고서(설계치 대비 실측치)
  assignment:
    title: 기계부 정밀 조립 및 마찰 분석
    deliverables:
    - 조립된 로봇손 기계부 전경 사진
    - 각 관절의 텐던 장력에 따른 마찰 저항 변화 측정 기록
    - 조립 과정 중 발생한 유격 문제와 해결 방안 보고서
    rubric:
    - 모든 인서트가 수평으로 정밀하게 삽입되었는가?
    - 베어링과 샤프트의 결합이 유격 없이 부드럽게 동작하는가?
    - 조립 공차 관리에 대한 이해가 보고서에 명확히 기재되었는가?
  quiz:
  - question: JSM-0810-10 베어링의 하우징 보어 설계 시 가장 중요한 사항은 무엇입니까?
    choices:
    - 베어링을 헐겁게 조립하여 마찰을 최소화한다.
    - 압입 후 내경 수축을 고려하여 권장 공차를 적용한다.
    - 베어링에 반드시 그리스를 도포한다.
    - 샤프트 지름보다 보어 지름을 2mm 크게 만든다.
    answer_index: 1
    explanation: 슬리브 베어링은 압입 시 내경이 수축하므로, 하우징 보어의 권장 공차를 준수하여 적절한 최종 내경을 확보해야 합니다
      [S15].
  - question: PC-CF 출력물에 열압입 인서트를 사용하는 주된 이유는 무엇입니까?
    choices:
    - 제작 비용을 절감하기 위해서
    - 반복적인 분해·조립 시 나사산의 내구성을 유지하기 위해서
    - 출력물의 온도를 제어하기 위해서
    - 디자인을 더 아름답게 하기 위해서
    answer_index: 1
    explanation: 열압입 인서트는 직접 출력한 나사산보다 내마모성이 강해 반복적인 조립 및 분해 과정에서 안정적인 기계적 결합을 제공합니다
      [S19].
  completion_criteria:
  - 손가락 5개 관절의 베어링 압입 완료
  - 모든 인서트의 수평 조립 확인
  - 관절 부위의 회전 마찰이 설계치 범위 내에 있음을 확인
  - 조립 완료 보고서 제출 및 승인
  source_ids:
  - S15
  - S16
  - S18
  - S19
- id: mod-5
  slug: transmission-tendon
  phase_id: phase-2
  title: 텐던 구동계 구축
  estimated_hours: 10.0
  prerequisites:
  - mod-4
  objectives:
  - Dyneema SK78 고강도 섬유 텐던의 물리적 특성과 기계적 이점을 이해한다.
  - 텐던 구동계의 캡스턴 설계 원리 및 마찰 관리 방법을 습득한다.
  - 로봇손 관절에 텐던을 올바르게 고정하고 장력을 조절하는 기법을 익힌다.
  - 텐던 구동계의 신율과 파단 하중을 고려한 안전한 운용 설계를 구현한다.
  theory_markdown: '### 텐던 구동계의 기초

    로봇손의 구동은 액추에이터의 회전 운동을 손가락 관절로 전달하는 텐던(Tendon) 시스템에 의존합니다. 고성능 로봇손 제작에는 강철 와이어
    대신 높은 인장 강도와 낮은 신율을 가진 합성 섬유 텐던이 주로 사용됩니다.


    ### Dyneema SK78의 특성

    Dyneema SK78 텐던은 극도로 낮은 작동 신율(<1%)과 높은 파단 하중(1.5mm 지름 기준 230 daN)을 제공하여 정밀한 위치
    제어에 적합합니다 [S14]. 이 소재는 우수한 내마모성과 UV 안정성을 갖추어 반복적인 캡스턴 굽힘 동작에서도 내구성을 유지합니다 [S14].


    ### 설계 고려사항

    1. **캡스턴 설계**: 텐던이 굽혀지는 모든 모서리는 라운딩 처리하여 응력 집중을 방지해야 합니다. 날카로운 모서리는 섬유 조직을 손상시켜
    파단 하중을 급격히 저하시킵니다.

    2. **마찰 관리**: 고정된 경로를 통과할 때 발생하는 마찰을 최소화하기 위해 무급유 베어링이나 저마찰 가이드 파이프를 사용하며, 텐던이
    관절 축과 간섭되지 않도록 설계합니다.

    3. **텐던 장력**: 초기 조립 시 액추에이터의 가동 범위를 고려하여 충분한 초기 장력을 확보해야 합니다. 장력 부족은 유격(Backlash)을
    유발하고, 과도한 장력은 관절의 마찰력을 높여 모터 부하를 증가시킵니다.'
  worked_examples:
  - '예제 1: 텐던 선택 기준. 11대의 XM430-W350-T 액추에이터가 4.1 N·m의 스톨 토크를 제공하므로, 관절 파손을 방지하기 위해
    텐던의 파단 하중(230 daN ≈ 2,300 N)이 액추에이터의 최대 인장력보다 충분히 높은지 확인합니다. 1.5mm Dyneema SK78은
    이 요구 조건을 안정적으로 만족합니다 [S14].'
  - '예제 2: 텐던 굽힘 응력 완화. 캡스턴 직경이 텐던 지름(1.5mm)의 최소 10배 이상이 되도록 설계하여, 반복 굽힘에 의한 피로 파괴를
    예방합니다.'
  lab:
    title: 텐던 장착 및 초기 장력 조정
    steps:
    - 모든 액추에이터 관절 링크의 모서리를 라운딩 처리한다.
    - Dyneema SK78 1.5mm 텐던을 절단하고 캡스턴 경로를 따라 통과시킨다 [S14].
    - 손가락 끝단에 텐던을 고정하고 액추에이터 캡스턴에 감는다.
    - 멀티미터를 사용하여 액추에이터의 전류를 실시간 모니터링하며 초기 장력을 조절한다.
    - 각 손가락을 0도에서 90도까지 왕복하며 텐던의 비정상적인 마찰이나 간섭이 있는지 확인한다.
    safety:
    - 작동 중인 모터에 손가락이 끼이지 않도록 주의한다.
    - 비상 정지 버튼이 상시 작동 가능한 상태인지 확인한다 [B-SAFETY-ESTOP].
    - 보안경을 필히 착용한다.
    deliverables:
    - 텐던 장착 완료 사진 및 관절 유격 측정 데이터
    - 텐던 왕복 시험 기록지
    - 마찰 간섭 제거 조치 보고서
  assignment:
    title: 텐던 시스템 내구성 설계서 작성
    deliverables:
    - 텐던 구동 경로 CAD 도면
    - 텐던 파단 하중 및 작동 신율 분석 요약
    - 마찰 방지 모서리 처리 결과 보고서
    rubric:
    - Dyneema SK78의 물리적 특성을 정확히 기술했는가?
    - 캡스턴의 곡률이 텐던의 굽힘 응력을 고려하여 설계되었는가?
    - 텐던 고정 방식이 분해 조립 가능하도록 설계되었는가?
  quiz:
  - question: Dyneema SK78 텐던을 사용하는 가장 큰 이유는 무엇입니까?
    choices:
    - 가장 저렴한 가격
    - 매우 낮은 작동 신율과 높은 파단 하중
    - 철제 와이어보다 가벼운 무게와 내식성 없음
    - 높은 전기 전도성
    answer_index: 1
    explanation: Dyneema SK78은 작동 신율이 1% 미만이며 파단 하중이 매우 높아 로봇 관절 제어의 재현성을 확보하는 데 적합합니다
      [S14].
  - question: 텐던 시스템 설계 시 캡스턴 모서리 처리가 중요한 이유는?
    choices:
    - 미관을 좋게 하기 위해
    - 응력 집중을 분산하여 섬유 피로 파괴를 방지하기 위해
    - 텐던의 마찰력을 증가시키기 위해
    - 제작 시간을 단축하기 위해
    answer_index: 1
    explanation: 모서리가 날카로우면 응력이 한 곳에 집중되어 텐던 섬유가 쉽게 끊어질 수 있으므로 라운딩 처리가 필수적입니다.
