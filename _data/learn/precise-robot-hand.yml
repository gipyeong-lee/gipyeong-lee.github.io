- id: m8
  slug: sensing-feedback
  phase_id: phase-3
  title: 센싱 및 폐루프 제어
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - FSR 402 센서와 10 kΩ 저항을 사용하여 OpenCR 3.3 V 센서 레일에 적합한 전압 분압 회로를 설계하고 구현할 수 있다.
  - 로봇 손끝에서 발생하는 접촉력을 아날로그 전압 값으로 변환하고 OpenCR의 12비트 ADC를 통해 디지털 신호로 취득하는 원리를 이해한다.
  - 측정된 힘 데이터를 기반으로 로봇 액추에이터의 전류를 제한하거나 위치를 수정하는 기초적인 폐루프 제어 로직을 구성할 수 있다.
  - 시스템 통합 과정에서의 전기적 안전을 위해 전원 분기 및 신호 절연 원칙을 준수한다.
  theory_markdown: '## 힘 감지 및 폐루프 제어 기초


    ### 1. FSR(Force Sensing Resistor) 작동 원리

    FSR 402는 압력에 따라 저항이 감소하는 고분자 박막 센서입니다 [S10]. 센서 표면에 가해지는 힘이 증가할수록 내부 전도성 층의 접촉
    면적이 넓어지며 저항이 줄어듭니다. 정밀한 로봇 손끝 제어를 위해 FSR을 전압 분압 회로(Voltage Divider)의 일부로 사용하여
    저항 변화를 전압 변화로 변환해야 합니다.


    ### 2. 전압 분압 회로 설계

    OpenCR 제어 보드의 ADC는 0~3.3 V 범위의 전압을 12비트(0~4095) 정밀도로 디지털화합니다 [S11]. 따라서 FSR 분압
    회로는 반드시 OpenCR의 **3.3 V 센서 레일**에 연결해야 합니다 [S11].

    - **공식:** `V_out = V_ref * (R_fixed / (R_fixed + R_FSR))`

    - 여기서 `R_fixed`는 10 kΩ 저항 [S24]이며, `R_FSR`은 센서 저항입니다. 12 V 액추에이터 전원과는 절대 연결하지
    마십시오.


    ### 3. 폐루프 제어 루프

    로봇 손의 폐루프 제어는 센서 피드백을 통해 동작을 수정하는 과정입니다:

    1. **센싱:** ADC를 통해 손끝 접촉력(FSR 값)을 측정합니다.

    2. **판단:** 측정된 힘이 목표치(예: 5 N)를 초과하면 액추에이터(XM430-W350-T)에 정지 명령을 내립니다 [S9].

    3. **제어:** 로봇 손의 텐던 장력을 조절하여 물체가 파손되지 않도록 정밀하게 제어합니다.


    ### 4. 안전한 전원 관리

    시스템은 3개의 독립된 12 V 어댑터 분기로 구성됩니다 [S13]. 각 분기는 ATOF 10 A 퓨즈로 보호됩니다 [S23]. **절대 양(+)
    단자를 병렬로 연결하지 마십시오.** 각 액추에이터 그룹은 할당된 독립 분기 내에서만 작동해야 합니다.'
  worked_examples:
  - '예제 1: 10 kΩ 저항을 사용한 분압 회로의 출력 전압 계산. FSR 저항이 10 kΩ일 때(중간 정도 힘이 가해짐), 출력 전압은 `3.3
    V * (10 kΩ / (10 kΩ + 10 kΩ)) = 1.65 V`가 되어 ADC의 중간 범위인 약 2048 값이 측정됩니다.'
  - '예제 2: 안전한 전원 분기 배분. 총 11개의 액추에이터를 3개 분기에 4/4/3개로 나눕니다 [S13]. 스톨 전류 합계는 분기당 최대
    9.2 A이며, 이는 10 A 퓨즈의 보호 범위를 준수합니다 [S9, S23].'
  lab:
    title: 손끝 센서 회로 구성 및 힘 측정 실습
    steps:
    - 모든 전원을 물리적으로 차단하고 멀티미터를 DC 전압 모드로 설정하여 각 퓨즈 분기 및 OpenCR 전원 단자가 1 V 미만임을 확인한다.
    - OpenCR의 3.3 V 센서 레일과 GND 핀을 브레드보드에 연결한다.
    - FSR 402 센서와 10 kΩ 저항을 사용하여 전압 분압 회로를 구성한다.
    - 분압된 신호선을 OpenCR의 아날로그 입력(ADC) 핀에 연결한다.
    - 독립된 12 V 전원 3개를 각각의 분기에 연결한다. 퓨즈 홀더가 올바르게 삽입되었는지 확인한다.
    - 제어 코드를 실행하여 손가락을 눌렀을 때 ADC 값이 0~4095 사이에서 변화하는지 확인한다.
    safety:
    - 실험 중 물리적 정지는 3개 어댑터를 분리하고 각 분기 전압이 1 V 미만임을 멀티미터로 직접 측정한 뒤 실시한다.
    - 저항 모드나 연속성 모드는 전원 인가 확인 수단이 될 수 없으므로 절대 사용하지 않는다.
    - 전원 인가 중에는 절대로 로봇의 가동 범위 내에 손을 넣지 않는다.
    - 모든 결선은 전원 차단 상태에서 수행한다.
    - 공식 인증된 안전 시스템이 아니므로 사람과 접촉하는 환경에 투입하지 않는다.
    deliverables:
    - FSR 분압 회로의 배선도
    - 힘 가함에 따른 ADC 값 변화 그래프
    - 폐루프 제어 로직 구현 코드
  assignment:
    title: 힘 피드백 기반 파지 제어 설계
    deliverables:
    - 힘 임계값을 설정하여 물체를 안전하게 잡는 제어 알고리즘 보고서
    - 3개 전원 분기의 퓨즈 용량 및 최대 부하 전류 계산서
    rubric:
    - 전압 분압 회로를 3.3 V 센서 레일에 올바르게 연결했는가?
    - 3개 분기의 전원 독립성을 유지하고 양(+)단자 결합이 없는가?
    - 힘 센서 데이터를 기반으로 액추에이터 동작이 적절히 수정되는가?
  quiz:
  - question: FSR 분압 회로 구성 시, OpenCR의 어떤 전원 레일을 사용해야 하는가?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    - 24 V 입력 전원
    - 전원과 상관없음
    answer_index: 1
    explanation: OpenCR의 ADC는 0~3.3 V 범위에서만 작동하므로 반드시 3.3 V 센서 전원 레일을 사용해야 합니다.
  - question: 3개의 독립적인 12 V 전원 어댑터 출력 단자를 다룰 때 반드시 지켜야 할 규칙은?
    choices:
    - 모든 양(+) 단자를 병렬로 연결하여 전류를 극대화한다
    - 각 분기를 독립적으로 유지하고 병렬 연결을 절대 금지한다
    - 3개 전원을 하나의 퓨즈로 합쳐서 보호한다
    - 전원 분기별로 서로 다른 전압으로 설정한다
    answer_index: 1
    explanation: 독립된 전원 어댑터의 출력 단자(양(+)극)를 병렬로 연결하는 것은 절대 금지이며, 각 분기를 전기적으로 분리하여 운영해야
      합니다.
  completion_criteria:
  - FSR 회로를 OpenCR ADC 핀에 연결하여 힘 변화에 따른 전압 변화를 검증할 것.
  - 모든 전원 분기가 독립적이며 퓨즈가 적절히 설치되었음을 보고할 것.
  - 측정된 힘 데이터를 이용하여 액추에이터의 정지 명령을 수행하는 로직을 시연할 것.
  source_ids:
