- id: M7
  slug: controller-setup
  phase_id: P3
  title: 제어기 구성
  estimated_hours: 10.0
  prerequisites:
  - M6
  objectives:
  - OpenCR 제어기의 구조와 전원 분리 원리 이해
  - DYNAMIXEL 액추에이터와 OpenCR 제어기 간의 통신 및 전원 연결 방식 파악
  - FSR(힘 감지 센서) 전압 분압 회로 설계 및 ADC 신호 취득
  - 안전한 저전압 전원 운용 및 물리적 전원 분리 절차 숙달
  theory_markdown: '## 제어기 구성 및 전원 시스템


    5지 로봇손 제어를 위해 ROBOTIS OpenCR 1.0 보드를 사용합니다 [S16]. 이 보드는 216MHz ARM Cortex-M7 CPU를
    탑재하여 복잡한 제어 알고리즘과 실시간 센서 취득을 수행합니다 [S16].


    ### 1. 전원 시스템의 분리 및 안전

    로봇손의 12V 액추에이터는 고전류(스톨 시 대당 2.3A)를 소모하며, 3개의 독립형 MEAN WELL GST160A12-R7B 전원 어댑터로
    분기 공급합니다 [B1, B3, S18]. **절대 양(+) 출력 단자를 병렬로 연결하지 마십시오.** 각 분기는 독립된 10A ATOF 퓨즈를
    통과하여 과전류로부터 배선을 보호합니다 [B3, B10, S18].


    ### 2. 센서 인터페이스

    FSR 402 센서는 압력에 따라 저항이 감소하는 특성을 가집니다 [S15]. OpenCR의 ADC(12비트 해상도)로 힘 데이터를 읽기 위해
    10kΩ 저항을 사용한 전압 분압 회로를 구성합니다 [B2, B4, B-SENSOR-RESISTOR, S15, S16, S28]. 센서 전원은
    반드시 OpenCR 보드의 3.3V 센서 전원 레일에서 인가하며, 12V 액추에이터 전원과 전기적으로 분리되어야 합니다 [B2, B3].


    ### 3. 전기적 안전

    실습 시 비상정지 회로는 Learner가 직접 설계하지 않습니다. 전원 차단이 필요할 때는 3개의 모든 전원 어댑터를 벽면 콘센트에서 물리적으로
    분리하고, 멀티미터의 DC 전압 모드를 사용하여 모든 분기에서 1V 미만임을 확인한 후 접근하십시오 [B3]. 저항이나 도통 모드는 안전 확인
    도구로 사용할 수 없습니다.'
  worked_examples:
  - '예제 1: 12V 전원 분기 배분. 11대 액추에이터(대당 2.3A 스톨)를 3개 전원 어댑터(분기당 11.5A)에 배분합니다. 4대/4대/3대씩
    나누어 배치하면 최대 부하가 각각 9.2A, 9.2A, 6.9A가 되어 분기별 10A 퓨즈와 전원 정격 내에서 안전하게 운용 가능합니다 [B1,
    B3, B10].'
  - '예제 2: FSR 분압 회로 전압 계산. FSR 저항이 R_fsr일 때, ADC 입력 전압 V_adc는 V_adc = 3.3V * (10kΩ
    / (10kΩ + R_fsr))입니다. 센서 전원은 반드시 OpenCR 3.3V 레일을 사용해야 하며, 12V 레일을 사용하면 보드 파손 및
    ADC 신호 범위를 초과합니다 [B2, B-SENSOR-RESISTOR, S16, S28].'
  lab:
    title: OpenCR 제어기 배선 및 센서 회로 구성
    steps:
    - 모든 전원 어댑터가 콘센트에서 분리되어 있는지 확인합니다.
    - OpenCR 보드에 12V 전원 하네스를 연결하고 10A 퓨즈가 홀더에 장착되었는지 확인합니다 [B3, B10, B-WIRING-FUSE-HOLDER].
    - 각 액추에이터를 정해진 3개 전원 분기에 할당하여 연결합니다 [B1, B3].
    - FSR 센서의 한쪽 단자를 OpenCR 3.3V 센서 전원 레일에, 다른 쪽 단자를 ADC 핀에 연결합니다 [B2, B4].
    - ADC 핀과 GND 사이에 10kΩ 분압 저항을 연결합니다 [B2, B-SENSOR-RESISTOR].
    - 멀티미터의 DC 전압 모드를 사용하여 전원 인가 전 배선 상태를 최종 점검합니다.
    safety:
    - 실험 전 반드시 보안경을 착용합니다.
    - 전원 인가 중에는 절대로 로봇손의 가동 범위 내에 손을 넣지 않습니다.
    - 회로 변경 시 반드시 3개 전원 어댑터를 모두 물리적으로 분리하십시오.
    - 무전원 상태 확인은 반드시 멀티미터의 DC 전압 모드를 사용하며, 1V 미만임을 확인하십시오.
    deliverables:
    - 완성된 로봇손 제어 및 센서 인터페이스 배선도
    - 각 분기별 전압 확인 측정 결과 보고서
  assignment:
    title: 제어기 시스템 구성 및 안전 분석
    deliverables:
    - 분기 전원 설계 확인서
    - FSR 분압 회로 계산서
    - 최종 구성 상태를 반영한 배선도
    rubric:
    - 전원 분기별 액추에이터 부하 배분이 10A 퓨즈 정격을 초과하지 않는가?
    - FSR 센서가 3.3V 레일에서만 인가되고 있는가?
    - 배선도에 퓨즈와 물리적 차단 수단이 명확히 표시되었는가?
  quiz:
  - question: FSR 센서 구동을 위해 OpenCR 보드에서 사용해야 하는 전원 레일은 무엇입니까?
    choices:
    - 12V 액추에이터 전원 레일
    - 3.3V 센서 전원 레일
    - 5V 범용 전원 레일
    - 전원 어댑터의 12V 양(+) 출력
    answer_index: 1
    explanation: OpenCR의 ADC는 0~3.3V 범위를 가지며, 센서 안정성과 보호를 위해 반드시 보드의 3.3V 센서 전원 레일을
      사용해야 합니다 [B2, S16].
