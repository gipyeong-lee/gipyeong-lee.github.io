    answer_index: 2
    explanation: 독립된 전원 어댑터의 양(+) 단자를 병렬로 연결하면 전원 회로가 손상되거나 비정상적인 전류 흐름이 발생할 수 있으므로
      절대 금지합니다 [B3].
