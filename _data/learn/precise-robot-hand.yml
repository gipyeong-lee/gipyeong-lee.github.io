- id: M6
  slug: firmware-basics
  phase_id: PH3
  title: 제어기 펌웨어 및 인터페이스
  estimated_hours: 12.0
  prerequisites:
  - M5
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 동작 원리와 제어 프로토콜(Protocol 2.0) 이해하기
  - OpenCR 제어기의 펌웨어 구조와 액추에이터 통신 설정 익히기
  - FSR 힘 센서의 전압 분압 원리와 ADC 취득 데이터 변환법 습득하기
  - 안전한 하드웨어 인터페이스 구축을 위한 절연 전원 분기 및 보호 설계 원리 확인하기
  theory_markdown: '### 제어 시스템 아키텍처

    로봇손의 핵심 제어 시스템은 로봇의 인지(센서), 판단(제어 알고리즘), 실행(액추에이터)을 통합합니다. OpenCR 1.0은 216MHz
    ARM Cortex-M7 프로세서를 기반으로 하며 [S12], 별도의 통신 브리지 없이 DYNAMIXEL 액추에이터와 직접 통신할 수 있는
    TTL/RS-485 인터페이스를 내장하고 있습니다 [S12]. 이는 시스템 단순화와 노이즈 감소에 효과적입니다.


    ### DYNAMIXEL Protocol 2.0

    XM430-W350-T 액추에이터는 Protocol 2.0을 사용합니다 [S10]. 각 패킷은 정해진 구조에 따라 명령(Instruction)을
    전달하며, 위치, 속도, 전류(토크) 피드백을 실시간으로 취득할 수 있습니다. 스톨 전류가 2.3A임을 감안할 때 [S10], 운전 시 과부하로
    인한 전류 급증 가능성을 제어 알고리즘에서 항상 모니터링해야 합니다.


    ### 힘 센서 인터페이스

    FSR 402는 가해진 힘에 따라 저항값이 변하는 가변 저항체입니다 [S11]. 이를 ADC로 측정하기 위해 10kΩ 고정 저항과 결합하여
    전압 분압 회로를 구성합니다 [S23]. OpenCR의 ADC 입력 신호는 반드시 0~3.3V 범위를 유지해야 하므로 [S12], 반드시 OpenCR의
    3.3V 센서 전원 레일을 사용해야 합니다. 12V 액추에이터 전원과 센서 전원을 물리적으로 분리하여 센서 신호 오염을 방지하는 것이 필수적입니다.


    ### 전원 및 안전 설계

    본 시스템은 3개의 독립된 절연 전원 어댑터(GST160A12-R7B)를 사용하여 12V 액추에이터 분기를 구성합니다 [S13]. 각 분기는
    10A ATOF 퓨즈로 보호되며 [S22], 물리적으로 독립된 전원 분리 수단을 갖추어야 합니다 [S13]. 어댑터 간 양(+) 출력을 절대로
    연결(병렬)하지 않으며, 각 어댑터는 할당된 액추에이터 그룹만 구동하도록 격리합니다 [S13].'
  worked_examples:
  - '예제 1: 전류 피드백 모니터링 - XM430-W350은 전류 피드백을 제공합니다. 제어기에서 전류 값을 읽어 스톨 전류 2.3A의 80%를
    초과할 경우, 액추에이터 출력을 제한하여 과열 및 파손을 방지하는 알고리즘의 기초를 구현합니다 [S10].'
  - '예제 2: 전압 분압 계산 - FSR 402를 10kΩ 저항과 분압 구성했을 때, OpenCR ADC(12-bit, 4096단계) 값이 읽히는
    원리를 설명합니다. V_out = V_in * (R_fixed / (R_fixed + R_FSR)). 3.3V 공급 시 V_out이 0-3.3V
    범위 내에 있는지 반드시 확인합니다 [S12, S23].'
  lab:
    title: 제어 시스템 구축 및 센서 신호 보정
    steps:
    - 각 독립 분기 어댑터의 전압을 멀티미터로 측정하여 12V DC가 정상 출력되는지 확인한다.
    - OpenCR의 3.3V 센서 전원과 GND 단자를 확인하고, FSR 전압 분압 회로를 구성한다.
    - OpenCR 펌웨어에 액추에이터 통신 패킷을 설정하고, 무부하 상태에서 회전 테스트를 수행한다.
    - 센서에 가해지는 힘을 단계적으로 변화시키며 ADC 값을 기록하여 보정 곡선을 생성한다.
    safety:
    - 실험 중 정지는 항상 3개의 어댑터 전원을 AC 단자에서 직접 분리한다.
    - 물리적 분리 후 DC 전압 모드로 각 단자가 1V 이하임을 확인하고 접근한다.
    - 전원 인가 중에는 액추에이터 구동 범위 내에 절대 손을 넣지 않는다.
    - 전류 제한 및 정격 퓨즈(10A)가 적절히 설치되었는지 반드시 확인한다.
    deliverables:
    - 제어기 통신 설정 및 테스트 코드
    - 센서 전압 보정 기록 데이터 시트
    - 전원 분기별 무전원 계측 확인표
  assignment:
    title: 제어기 펌웨어 및 인터페이스 설계 보고서
    deliverables:
    - 5지 텐션 로봇손 제어 아키텍처 블록도
    - 전류 피드백 모니터링 알고리즘 로직 흐름도
    - FSR 센서 보정 결과 보고서
    rubric:
    - 전원 격리 원칙 준수 여부(병렬 연결 금지 확인)
    - OpenCR 3.3V 센서 전원 사용 적정성
    - 스톨 전류를 고려한 과전류 방지 알고리즘 로직 정확성
    - 물리적 안전 절차 및 계측 확인 기록 명시 여부
  quiz:
  - question: OpenCR 1.0 제어기에서 FSR 센서 전압 분압 회로를 구성할 때 올바른 전원 연결은 무엇입니까?
    choices:
    - 12V 액추에이터 전원 레일
    - OpenCR 3.3V 센서 전원 레일
    - 외부 24V 전원
    - 액추에이터 통신 포트 전원
    answer_index: 1
    explanation: OpenCR의 ADC는 0~3.3V 범위를 지원하므로 반드시 3.3V 센서 전원을 사용해야 합니다 [S12].
  - question: 3개의 12V 어댑터 전원 분기를 구성할 때 필수 준수 사항은 무엇입니까?
    choices:
    - 어댑터 출력 양(+) 단자들을 병렬 연결한다.
    - 분기별로 10A 퓨즈를 설치하고 독립 분기로 격리한다.
    - 하나의 어댑터에 11대 액추에이터를 모두 연결한다.
    - 학습자가 정지 회로를 설계하거나 조립하지 않으며, 정지가 필요할 때는 3개 절연 전원 어댑터를 물리적으로 분리한 뒤 각 분기의 잔류 전압이
      DC 전압 모드에서 1 V 미만임을 확인한다.
    answer_index: 1
    explanation: 양(+) 단자 병렬 연결은 절대 금지되며, 각 분기는 독립된 퓨즈와 전원 경로로 구성해야 합니다 [S13].
  - question: 실험 중 계획 정지 상황에서 올바른 안전 조치는 무엇입니까?
    choices:
    - 퓨즈를 제거하여 전원을 차단한다.
    - 소프트웨어적으로 모터를 정지시킨다.
    - 3개 전원 어댑터를 물리적으로 분리 후 DC 전압 계측기로 1V 이하임을 확인한다.
    - 연속성(저항) 모드를 사용하여 전원 차단을 확인한다.
    answer_index: 2
    explanation: 물리적 분리 후 DC 전압 모드로 무전원 상태를 확인하는 것이 안전 조치의 핵심입니다.
  completion_criteria:
  - 제어기 펌웨어를 통한 액추에이터 제어 구현
  - FSR 센서 ADC 데이터의 선형 보정 완료
  - 독립 전원 분기 구성 및 퓨즈 보호 설계 검증 완료
  - 실습 중 안전 절차 준수 기록 제출
