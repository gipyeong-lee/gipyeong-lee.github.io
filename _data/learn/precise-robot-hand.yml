modules:
- id: m1
  slug: robotics-intro
  phase_id: phase-1
  title: 로봇학 개론 및 설계 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 시스템의 기구학적 기초와 동역학 모델링의 필요성을 이해한다.
  - 정교한 로봇손 구동을 위한 주요 구성 요소(액추에이터, 센서, 제어기)의 역할을 정의한다.
  - 로봇 제작 시 발생하는 전기적, 기계적 안전 제약 사항을 파악한다.
  - 시스템 설계 단계에서 고려해야 할 피드백 제어의 기초 원리를 습득한다.
  theory_markdown: '### 로봇학 설계의 기초

    로봇 시스템은 기구적 구조, 에너지 전달 시스템, 제어 논리의 결합체입니다. 본 과정의 5지 로봇손은 DYNAMIXEL XM430 액추에이터를
    사용하여 텐던(Tendon) 기반의 구동 방식을 채택합니다 [S9]. 이는 생체 모사 로봇손에서 주로 사용하는 방식으로, 액추에이터를 손목이나
    전완부에 배치하여 손가락의 관성 모멘트를 최소화할 수 있습니다 [S1].


    #### 액추에이터와 제어

    구동기는 정밀한 위치, 속도, 전류 피드백을 제공해야 합니다. XM430-W350-T는 스톨 토크 4.1 N·m와 스톨 전류 2.3 A를 지원하여
    정교한 파지력 제어가 가능합니다 [S9]. 제어기인 OpenCR 1.0은 216MHz 클럭으로 동작하며 내장된 DYNAMIXEL 포트를 통해
    별도 브리지 없이 직접 통신을 수행하여 시스템 재현성을 높입니다 [S11].


    #### 센싱 및 피드백

    손끝에는 FSR 402 센서를 부착하여 접촉력을 측정합니다 [S10]. 이는 저항 기반 센서로, 압력이 증가함에 따라 저항이 감소하는 특성을
    갖습니다. 이를 10 kΩ 저항과 함께 분압 회로로 구성하면 OpenCR의 12비트 ADC를 통해 0~3.3 V 범위 내에서 힘 신호를 취득할
    수 있습니다 [S10, S11, S24].


    #### 안전과 전원 배분

    시스템은 12 V 전원 어댑터 3개를 독립 분기로 사용하여 구동합니다 [S13]. 독립적인 양(+) 출력 병렬 연결은 절대 금지되며, 각 분기는
    10 A ATOF 퓨즈로 보호됩니다 [S13, S23]. 이 프로토타입은 전문적인 안전 표준(예: 이중 채널 직접 차단, EDM 등)을 포함하지
    않으므로, 인간 접근 환경 투입 전 자격 있는 안전 전문가의 검토가 필수적입니다.'
  worked_examples:
  - '예제 1: 10 A 퓨즈 분기 설계. 액추에이터 4대가 한 분기에 연결된 경우, 피크 전류 합은 2.3 A * 4 = 9.2 A입니다 [S9].
    ATOF 10 A 퓨즈는 9.2 A보다 높고 11.5 A 전원 정격보다 낮으므로, 배선 고장 시 보호 동작을 기대할 수 있습니다 [S13,
    S23].'
  - '예제 2: FSR 센서 전압 분할기 계산. OpenCR 센서 전압 3.3 V를 입력으로 사용합니다. 10 kΩ 고정 저항과 FSR을 직렬
    연결할 때, FSR 저항이 10 kΩ일 때 ADC 입력 전압은 분압 법칙에 의해 (10k / (10k + 10k)) * 3.3 V = 1.65
    V가 되어 ADC 범위(0~3.3 V) 내에 안정적으로 유지됩니다 [S11, S24].'
  lab:
    title: 전원 분기 구성 및 ADC 신호 검증
    steps:
    - 각 GST160A12-R7B 어댑터에 10 A ATOF 퓨즈와 인라인 홀더를 직렬로 연결하여 독립 분기를 구성합니다.
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기의 출력 단자에서 12 V가 출력되는지 확인합니다.
    - OpenCR의 3.3 V 센서 전원 레일과 ADC 핀 사이에 FSR 및 10 kΩ 저항으로 분압 회로를 구성합니다.
    - PC와 OpenCR을 연결하고 시리얼 모니터를 통해 FSR 압력에 따른 ADC 값 변화를 실시간 확인합니다.
    safety:
    - 실험 중 정지는 3개 어댑터를 물리적으로 분리하고 멀티미터로 각 branch가 1 V 미만임을 확인한 후 수행합니다.
    - 전원 인가 중에는 로봇손의 가동 범위 내에 손을 넣지 않으며, 고정 지그에서 무부하부터 시험합니다.
    - 납땜 및 회로 구성 시 보안경을 반드시 착용합니다.
    deliverables:
    - 분기별 전압 측정 기록(교정 기록)
    - FSR 압력-ADC값 응답 곡선
    - 구성된 회로 사진
  assignment:
    title: 로봇 시스템 설계 요구사항 정의
    deliverables:
    - '제작할 로봇손의 용도(예: 정밀 파지) 명시'
    - BOM과 호환성 검토 보고서
    - 액추에이터 배치에 따른 모멘트 계산
    rubric:
    - 독립 전원 분기 규정 준수 여부
    - BOM 내 부품만 사용한 설계 타당성
    - 센서 전압 분배 회로의 ADC 범위 준수 여부
  quiz:
  - question: FSR 402 센서와 전압 분압 회로 구성 시, 반드시 지켜야 할 사항은 무엇인가요?
    choices:
    - 12 V 액추에이터 전원을 센서 전원으로 사용한다.
    - 3.3 V 센서 전원을 사용하여 ADC 입력을 0~3.3 V로 유지한다.
    - 저항을 병렬로 연결하여 전압을 높인다.
    - 저항 없이 FSR만 ADC에 직접 연결한다.
    answer_index: 1
    explanation: OpenCR 센서 전원 레일(3.3 V)을 사용해야 ADC 입력 범위를 초과하지 않으며 안전합니다 [S11].
  - question: 본 5지 로봇손 시스템에서 독립 전원 분기의 퓨즈 사용 목적은 무엇인가요?
    choices:
    - 액추에이터의 스톨 전류를 즉시 차단하기 위해
    - 배선 고장 시 과전류 보호를 위해
    - 전원 어댑터의 전압을 증폭하기 위해
    - 계획 정지 장치(계획 정지)로 사용하기 위해
    answer_index: 1
    explanation: 학습자가 정지 회로를 설계하거나 조립하지 않으며, 정지가 필요할 때는 3개 절연 전원 어댑터를 물리적으로 분리한 뒤
      각 분기의 잔류 전압이 DC 전압 모드에서 1 V 미만임을 확인한다 [S23].
  completion_criteria:
  - 독립 3분기 전원 어댑터 배선이 완료되고 각 출력 전압이 정상 범위임
  - FSR 402 센서 ADC 데이터가 0-3.3 V 범위 내에서 정상적으로 취득됨
  - 모든 회로가 BOM 명시된 독립 퓨즈 분기 및 부품으로 구성됨
  source_ids:
  - S1
  - S2
  - S9
  - S11
  - S10
  - S24
  - S13
  - S23
- id: m2
  slug: kinematics-statics
  phase_id: phase-1
  title: 로봇 기구학 및 정역학
  estimated_hours: 10.0
  prerequisites:
  - m1
  objectives:
  - 로봇 기구학의 기본 개념과 5지 로봇손의 자유도(DoF)를 이해한다.
  - 정역학 평형 방정식을 사용하여 로봇손 관절의 토크 요구량을 계산한다.
  - DYNAMIXEL XM430 액추에이터의 사양과 물리적 구동 특성을 파악한다.
  - 텐던 구동 시스템의 기계적 이점과 신율 제어의 중요성을 학습한다.
  theory_markdown: '## 1. 로봇 기구학 기초

    로봇 기구학은 힘을 고려하지 않고 로봇의 기하학적 형상과 운동학적 제약을 다룹니다 [S1]. 5지 로봇손의 각 손가락은 다수의 자유도(DoF)를
    가지며, 이는 전체 기구학적 모델의 정밀도를 결정합니다 [S6]. 각 관절의 위치를 매핑하기 위해 Denavit-Hartenberg(D-H)
    파라미터를 사용하여 각 링크의 회전 및 이동을 수학적으로 기술합니다 [S1].


    ## 2. 정역학(Statics) 및 토크 요구량

    정역학은 로봇손이 외부 물체를 파지할 때 발생하는 힘과 모멘트의 평형을 다룹니다 [S1, S6]. 손끝에서 발생하는 접촉력 $F$는 텐던 장력
    $T$와 관절 모멘트 팔(moment arm) $r$의 곱으로 표현됩니다:

    $$\tau = \sum (T \times r)$$

    물체를 안정적으로 파지하려면 액추에이터의 스톨 토크(Stall Torque)가 최대 부하 시의 요구 토크보다 커야 합니다 [S9]. DYNAMIXEL
    XM430-W350-T는 최대 4.1 N·m의 스톨 토크를 제공하여 정밀 파지에 적합합니다 [S9].


    ## 3. 텐던 구동 시스템

    텐던 구동은 원격 구동기 배치(Remote Actuation)를 가능하게 하여 로봇손을 경량화합니다. 사용되는 Dyneema SK78 텐던은
    파단 하중 230 daN(약 2300 N)을 가지며 작동 신율이 1% 미만으로 매우 낮아 [S14] 제어의 정밀도를 높입니다.'
  worked_examples:
  - '예제 1: 관절 토크 계산

    손끝에 5 N의 접촉력이 작용하고 관절 모멘트 팔이 0.05 m라면, 관절에서 요구되는 정적 토크는 $\tau = 5 N \times 0.05
    m = 0.25 N·m$입니다. 사용된 XM430 액추에이터의 스톨 토크 4.1 N·m는 이 요구 토크의 16배 이상이므로 충분한 설계 여유를
    가집니다 [S9].'
  - '예제 2: 텐던 파단 하중 평가

    XM430의 최대 장력 발생 시 텐던에 가해지는 힘이 100 N이라고 가정할 때, Dyneema SK78 텐던의 파단 하중 230 daN(약
    2300 N)을 기준으로 보면 안전율은 $2300 / 100 = 23$으로 매우 안정적입니다 [S14].'
  lab:
    title: 관절 매커니즘 정역학 실습
    steps:
    - 각 손가락 링크의 길이를 CAD 도면상에서 측정하여 모멘트 팔 길이를 정리한다.
    - 관절 회전 범위에 따라 텐던 경로가 캡스턴에 가하는 마찰력을 분석한다.
    - 조립된 손가락 구조를 지그에 고정하고 FSR 센서를 사용하여 손끝 접촉력을 계측한다 [S10].
    - 액추에이터 전류 피드백을 통해 토크와 전류의 관계를 프로파일링한다.
    safety:
    - 실험 중에는 보안경을 착용하고 손가락의 가동 범위(Workspace)에 접근하지 않는다.
    - 시스템 제어 전 무부하 상태에서 정상 동작 여부를 확인한다.
    - 전원 인가 중에는 반드시 3개 독립 전원을 물리적으로 분리한 후 기계적 조정 작업을 수행한다.
    - 퓨즈가 없는 상태에서 액추에이터를 직접 구동하지 않는다 [S23].
    deliverables:
    - 관절별 모멘트 팔 길이 계산서
    - 전류-토크 변환 프로파일 그래프
    - 설계 안전율 계산 보고서
  assignment:
    title: 5지 로봇손의 기구학적 설계안 수립
    deliverables:
    - 로봇손의 전체 15 자유도에 대한 기구학 설계 보고서
    - 손가락별 최대 토크 요구량과 액추에이터 용량 적정성 평가표
    rubric:
    - 각 관절의 회전 범위와 기구학적 구조가 명확하게 기술되었는가?
    - 정역학 평형 방정식이 올바르게 수립되었는가?
    - 선택된 액추에이터의 스톨 토크 사양 [S9]과 비교하여 안전 여유가 적절한가?
  quiz:
  - question: 로봇 기구학에서 힘을 고려하지 않는 이유는 무엇인가?
    choices:
    - 기하학적 형상과 운동학적 제약만을 분석하기 위해
    - 힘은 제어 시스템에서만 중요하기 때문에
    - 계산의 복잡도를 높이기 위해
    answer_index: 0
    explanation: 기구학은 위치와 속도와 같은 기하학적 관계를 다루며, 동역학에서 힘과 모멘트를 고려합니다 [S1].
  - question: Dyneema SK78 텐던을 사용하는 주요 이유로 적절하지 않은 것은?
    choices:
    - 매우 높은 파단 하중
    - 1% 미만의 낮은 작동 신율
    - 높은 전기 전도성
    answer_index: 2
    explanation: Dyneema는 섬유 소재로 전기 전도성과는 관련이 없으며, 기계적 강도와 낮은 신율이 핵심 장점입니다 [S14].
  - question: 액추에이터의 스톨 토크가 중요한 이유는 무엇인가?
    choices:
    - 최대 부하를 견딜 수 있는지 판단하기 위해
    - 통신 속도를 결정하기 위해
    - 데이터시트의 오차 범위를 확인하기 위해
    answer_index: 0
    explanation: 스톨 토크는 해당 액추에이터가 낼 수 있는 최대 출력을 의미하므로 부하 토크 요구량을 충족하는지 판단하는 기준이 됩니다
      [S9].
