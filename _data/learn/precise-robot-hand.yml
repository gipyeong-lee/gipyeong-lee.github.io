- id: M8
  slug: sensor-integration
  phase_id: P3
  title: 센서 인터페이스
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - FSR 402 센서의 원리와 전압 분압 회로를 이해한다.
  - OpenCR 제어기에서 아날로그-디지털 변환(ADC)을 통해 물리량을 취득한다.
  - 센서 신호의 노이즈 처리 및 데이터를 파지 제어 알고리즘에 활용하는 방법을 배운다.
  theory_markdown: '### 힘 감지 센서(FSR) 인터페이스


    FSR 402는 인가되는 힘에 따라 저항값이 감소하는 고분자 후막 센서입니다 [S15]. 힘이 없을 때는 수 MΩ 이상의 높은 저항을 가지며,
    최대 20 N의 힘이 인가되면 수 kΩ 수준까지 저항이 낮아집니다 [S15].


    #### 전압 분압 회로

    OpenCR은 ADC(Analog-to-Digital Converter)를 사용하여 입력 전압을 디지털 값으로 변환합니다 [S16]. FSR은
    직접적인 전압원이 아니므로, 10 kΩ 고정 저항을 직렬로 연결하여 전압 분압 회로를 구성해야 합니다 [S28].


    - **회로 구성**: 3.3 V 센서 레일 - FSR - (ADC 입력 지점) - 10 kΩ 저항 - GND

    - **출력 전압**: $V_{ADC} = 3.3 V \times \frac{R_{10k}}{R_{FSR} + R_{10k}}$


    이 회로를 통해 힘이 증가하여 $R_{FSR}$이 감소하면, ADC 입력 전압($V_{ADC}$)은 0 V에서 3.3 V 사이로 상승합니다.
    OpenCR의 ADC는 12-bit 해상도를 가지므로 0~3.3 V 입력을 0~4095 사이의 디지털 값으로 매핑합니다 [S16].'
  worked_examples:
  - '예제 1: FSR 저항 계산. 특정 파지력에서 $R_{FSR}$이 5 kΩ으로 측정되었다면, $V_{ADC} = 3.3 V \times \frac{10k}{5k
    + 10k} = 2.2 V$입니다. 12-bit ADC 값은 $(2.2 / 3.3) \times 4095 \approx 2730$이 됩니다
    [S16, S28].'
  - '예제 2: 노이즈 필터링. FSR 신호는 손가락의 미세 진동으로 인해 흔들림이 발생합니다. 소프트웨어적으로는 `val_new = (val_prev
    * 0.9) + (val_raw * 0.1)`과 같은 1차 지수 이동 평균 필터를 적용하여 데이터를 안정화할 수 있습니다.'
  lab:
    title: FSR 센서 인터페이스 구성 및 신호 취득
    steps:
    - 각 절연형 전원 어댑터 전원을 분리하고 무전원 상태를 멀티미터 DC 모드로 측정(1 V 미만 확인)한다.
    - OpenCR의 3.3 V 센서 전원 레일과 FSR, 10 kΩ 저항을 사용하여 분압 회로를 브레드보드에 구성한다 [S16, S28].
    - 전원 인가 전, 멀티미터 저항 모드로 배선 연결 및 단락 여부를 검증한다.
    - 12 V 액추에이터 전원과 3.3 V 센서 전원이 별도로 유지되는지 다시 확인한다 [B2].
    - 각 분기별 어댑터 전원을 인가하고, 시리얼 플로터로 FSR에 힘을 가할 때 ADC 값이 0~4095 사이에서 변하는지 확인한다.
    safety:
    - 모든 회로 수정은 3개 어댑터를 물리적으로 분리한 무전원 상태에서 수행한다.
    - ADC 입력은 0~3.3 V 범위를 초과하지 않도록 회로를 설계하고 검증한다 [B2].
    - 보안경을 착용하고, 고정된 지그에서 무부하 상태로 초기 신호 시험을 진행한다.
    deliverables:
    - ADC 값을 포함한 데이터 취득 코드(Arduino 스케치)
    - 측정된 센서 신호의 노이즈 필터링 적용 전후 시리얼 플로터 캡처 이미지
  assignment:
    title: 파지력 피드백 구현
    deliverables:
    - 5개 손가락 FSR 센서 ADC 값을 읽어 파지력을 판단하는 로직 코드
    - 특정 ADC 임계값 도달 시 DYNAMIXEL 전류 제한 제어를 통한 파지 유지 알고리즘 보고서
    rubric:
    - 회로가 3.3 V 센서 레일을 정확히 사용하는가?
    - 센서 데이터가 필터링을 통해 안정적으로 갱신되는가?
    - 물리적인 FSR 접촉력을 ADC 값으로 성공적으로 매핑하는가?
  quiz:
  - question: OpenCR의 FSR 전압 분압 회로에서 센서 전원으로 적합한 전압은 무엇인가?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 시스템 전원
    - 3.3 V 센서 레일
    - OpenCR VIN 전원
    answer_index: 2
    explanation: OpenCR 사양에 따라 아날로그 분압 회로는 반드시 3.3 V 센서 레일을 사용해야 하며, 12 V 액추에이터 전원과
      분리해야 안전합니다 [B2].
  - question: FSR 402의 저항 특성은 어떠한가?
    choices:
    - 압력을 가할수록 저항이 증가한다.
    - 압력을 가할수록 저항이 감소한다.
    - 압력과 관계없이 저항이 일정하다.
    - 전압이 가해지면 저항이 무한대가 된다.
    answer_index: 1
    explanation: FSR(Force Sensing Resistor)은 물리적 힘이 증가할수록 내부 저항이 감소하는 특성을 가집니다 [S15].
  completion_criteria:
  - 5개 손가락의 FSR 센서가 모두 독립적으로 신호를 입력받음을 확인.
  - ADC 취득 코드에 1차 지수 이동 평균 필터가 구현됨.
  - 실험 중 어떠한 경우에도 12 V 전원이 3.3 V 센서 회로로 유입되지 않음을 계측으로 증명함.
  source_ids:
  - S15
  - S28
  - S16
- id: M9
  slug: safety-implementation
  phase_id: P3
  title: 안전 시스템 구현
  estimated_hours: 10.0
  prerequisites:
  - M6
  objectives:
  - 로봇 시스템의 전기적 안전 설계 원리를 이해한다.
  - 과전류 보호를 위한 퓨즈의 특성과 선정 방법을 학습한다.
  - 절연형 전원 어댑터의 독립 분기 구성 및 안전한 운용 절차를 익힌다.
  - 로봇 제어기 및 센서 전원의 전기적 분리 원칙을 준수한다.
  theory_markdown: '## 로봇 시스템의 전기 안전 설계


    로봇 시스템, 특히 텐던 구동 액추에이터를 사용하는 시스템은 높은 스톨 전류(stall current)를 소비하므로 과전류 보호가 필수적이다
    [S14]. 로봇의 안전은 전원 공급 장치부터 제어기, 구동기까지 이어지는 물리적 분리와 보호 회로 구성에서 시작된다.


    ### 1. 전원 분기와 과전류 보호

    정밀 로봇손 시스템은 12V 11.5A급 절연형 데스크톱 전원 어댑터 3대를 독립적으로 사용하여 총 34.5A의 공급 용량을 확보한다 [S18].
    중요한 설계 원칙은 각 어댑터의 양(+) 출력을 병렬로 연결하지 않는 것이다. 각 분기는 독립적인 퓨즈를 통해 보호되어야 하며, 이는 액추에이터의
    전체 스톨 전류인 25.3A를 상회하도록 배분된다 [S18].


    ### 2. 퓨즈 선정과 동작 특성

    ATOF 10A 퓨즈는 분기당 액추에이터 스톨 전류 합계(최대 9.2A)보다 높고 전원 공급 가능 최대 전류(11.5A)보다 낮은 정격으로
    선정한다 [S18, S27]. 퓨즈는 즉각적인 차단기가 아니며, 정격 전류를 초과하는 하중이 가해질 때 시간-전류 곡선에 따라 회로를 개방하여
    배선 손상을 방지한다 [S27].


    ### 3. 전기적 신호 및 제어 회로의 격리

    OpenCR 제어기는 액추에이터 전원(12V)과 센서/ADC 전원(3.3V)을 전기적으로 분리하여 사용해야 한다 [S16]. FSR 402
    센서를 활용한 전압 분압 회로는 반드시 OpenCR의 3.3V 센서 전원 레일을 사용하며, ADC 입력 신호가 0~3.3V 범위를 초과하지
    않도록 설계한다 [S15, S16].


    ### 4. 안전 운용 절차 (비상 조치)

    본 벤치 프로토타입은 인증된 비상 정지(E-stop) 회로를 포함하지 않는다 [S8, S9]. 실험 중 시스템 정지가 필요할 때, 절대 저항이나
    연속성 모드 계측을 정지의 증거로 삼지 않는다. 반드시 다음 절차를 따른다:

    1. 3개의 독립된 절연 전원 어댑터를 물리적으로 AC 소켓에서 제거한다.

    2. 멀티미터를 DC 전압 모드로 설정하여 모든 전원 분기 지점에서 1V 미만의 전압을 확인한다.'
  worked_examples:
  - '예제 1: 퓨즈 분기 부하 계산 - 한 분기에 4대의 XM430-W350-T 액추에이터가 배치될 경우, 스톨 전류 합계는 2.3A * 4
    = 9.2A이다. 10A ATOF 퓨즈는 이 부하를 정상 운용 범위 내에서 수용하고, 배선 단락 시 안전하게 차단할 수 있는 적절한 정격이다
    [S14, S27].'
  - '예제 2: FSR 분압기 설계 - 10kΩ 저항을 사용한 분압 회로에서 FSR 402 저항이 1kΩ으로 감소할 때 출력 전압은 3.3V *
    (10kΩ / (1kΩ + 10kΩ)) = 3.0V이다. 이는 OpenCR ADC의 3.3V 허용 범위 이내이므로 안전하다 [S15, S16,
    S28].'
  lab:
    title: 전원 분기 계측 및 안전 확인 실습
    steps:
    - 각 절연형 어댑터의 전원 분기 및 퓨즈 홀더 연결 상태를 시각적으로 점검한다.
    - 시스템을 무부하 상태로 전원 인가하여 각 분기의 전압이 12V 정상 범위인지 멀티미터로 측정한다.
    - 액추에이터를 가동하여 분기별 전류 소비를 확인하고 예상치(스톨 전류 이하)를 초과하지 않는지 모니터링한다.
    - 비상 상황을 가정하여 모든 어댑터를 물리적으로 차단하고, 1분 후 각 분기 배선 단자에서 잔류 전압이 1V 미만임을 확인한다.
    safety:
    - 전원 인가 중에는 로봇손의 가동 범위 내에 손을 넣지 않는다.
    - 충격 방지 작업용 보안경을 반드시 착용한다.
    - 비상 정지 시 멀티미터 전압 모드 외의 다른 모드(저항, 연속성)를 무전원 상태 확인용으로 사용하지 않는다.
    - 3개의 분기 전원을 동시에 전원 스트립에서 물리적으로 분리할 수 있는 위치를 사전에 확보한다.
    deliverables:
    - 분기별 전압 측정 데이터 기록지
    - 비상 정지 후 잔류 전압 확인 시험 결과
    - 독립 퓨즈 배선이 명시된 전기 구성 사진
  assignment:
    title: 로봇 전기 안전 시스템 설계 보고서
    deliverables:
    - 배선도(퓨즈, 커넥터, 전원 분기 포함)
    - 전류 부하 및 퓨즈 선정 근거 보고서
    - 비상 정지 및 전원 차단 프로토콜 매뉴얼
    rubric:
    - 전원 분기 간 양(+) 출력의 독립성이 완벽히 확보되었는가?
    - 퓨즈 용량이 액추에이터 스톨 전류를 적절히 반영하고 있는가?
    - 전원 차단 프로토콜에 물리적 분리와 전압 확인 과정이 명시되었는가?
    - 센서 전원이 제어기 3.3V 레일에서 안전하게 공급되는가?
  quiz:
  - question: 로봇 시스템에서 3개의 절연 전원 어댑터 출력 사용 방식 중 옳은 것은?
    choices:
    - 모든 양(+) 출력을 하나의 버스로 합산하여 전류 용량을 높인다.
    - 각 어댑터를 독립된 분기로 사용하여 별도로 퓨즈를 배치한다.
    - 전압을 높이기 위해 2개의 어댑터를 직렬로 연결한다.
    - 신호 안정성을 위해 전원 접지를 제어기 접지와 물리적으로 격리하지 않는다.
    answer_index: 1
    explanation: 독립 분기로 구성하고 퓨즈를 배치하여 각 회로를 보호해야 하며, 출력 병렬 연결은 금지된다.
  - question: 비상 정지 후 전원 차단 상태를 확인하는 가장 안전한 방법은?
    choices:
    - 멀티미터를 저항 모드로 설정하여 회로의 단선을 확인한다.
    - 멀티미터를 연속성(비프음) 모드로 설정하여 확인한다.
    - 멀티미터를 DC 전압 모드로 설정하여 1V 미만임을 확인한다.
    - 퓨즈의 단선 여부를 육안으로 확인한다.
    answer_index: 2
    explanation: DC 전압 모드로 실제 잔류 에너지가 1V 미만인지 확인하는 것만이 안전을 보장한다.
  - question: OpenCR 제어기에서 FSR 센서 전원 공급 시 권장되는 방식은?
    choices:
    - 12V 액추에이터 전원 라인에서 바로 가져온다.
    - 반드시 3.3V 센서 전원 레일을 사용한다.
    - 외부 5V 전원을 별도로 준비하여 연결한다.
    - ADC 입력핀 자체에서 공급되는 전원을 사용한다.
    answer_index: 1
    explanation: OpenCR의 센서 전압 레일인 3.3V를 사용하여 ADC 입력 전압을 0~3.3V 범위 내로 제한해야 한다.
