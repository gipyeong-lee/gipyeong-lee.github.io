  objectives:
  - 로봇손의 구동 시스템 성능을 정량적으로 측정하는 방법을 이해한다.
  - FSR 센서와 DYNAMIXEL 액추에이터를 통합하여 피드백 제어 시스템을 검증한다.
  - 정밀 파지 테스트를 통해 설계된 기구부의 강성과 안정성을 확인한다.
  - 엔지니어링 표준에 따른 실험 데이터 분석 및 보고서 작성 능력을 기른다.
  theory_markdown: '## 5지 로봇손 검증 시스템


    로봇손의 성공적인 파지 성능은 액추에이터의 정밀 제어, 센서의 신뢰성, 그리고 기구부의 강성에 의해 결정됩니다 [S4]. 본 모듈에서는 시스템의
    성능 지표를 정의하고 이를 측정합니다.


    ### 1. 하드웨어 강성 평가

    로봇손의 강성은 물체 파지 시 발생하는 처짐(deflection)을 통해 예측할 수 있습니다. 텐던 구동식 로봇손의 경우, 텐던 신율(working
    stretch)이 1% 미만인 고강도 섬유(Dyneema SK78)를 사용하여 [S18] 전송 효율을 극대화해야 합니다. 정적 하중 시험을
    통해 팁 로드(tip load)에 따른 변위량을 측정하여 시스템의 정적 강성(N/m)을 도출합니다 [S4].


    ### 2. 힘 피드백 시스템의 데이터 해석

    손끝에 장착된 FSR 402 센서는 0.2N에서 20N 범위의 접촉력을 감지합니다 [S14]. OpenCR 보드의 12-bit ADC를 사용하여
    [S15] 센서의 출력 전압을 디지털 데이터로 변환합니다. 분압 회로(10 kΩ 저항 사용) [S28]를 통해 센서의 저항 변화를 전압 신호로
    변환할 때, 3.3V 센서 전원 레일을 사용하여 ADC 측정 범위를 최적화해야 합니다.


    ### 3. 전기적 안정성 검증

    액추에이터(XM430-W350-T)는 2.3A의 스톨 전류를 가지며 [S6], 3개의 독립적인 12V 전원 분기 [S17]를 통해 전력을 공급받습니다.
    각 분기는 10A ATOF 퓨즈를 통해 보호되며 [S27], 이는 4대/4대/3대 액추에이터 구동 시의 피크 전류를 안전하게 수용하면서 배선
    고장 시 회로를 분리합니다 [S27].'
  worked_examples:
  - '예제 1: FSR 출력 전압 계산

    FSR이 5N의 힘을 받아 저항이 1 kΩ이 되었을 때, 분압 회로(10 kΩ 저항)의 출력 전압을 계산하시오.

    10 kΩ 풀다운 분압기는 $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$를 사용한다.

    결과: 0.3V는 OpenCR의 3.3V ADC 허용 범위 내에 있으므로 신뢰성 있는 입력이 가능합니다 [S15].'
  - '예제 2: 전원 분기 전류 부하 확인

    1개 액추에이터의 스톨 전류가 2.3A [S6]인 경우, 4대 연결된 전원 분기의 전체 스톨 전류는?

    풀이: 4대 * 2.3A = 9.2A. 10A 퓨즈 [S27]는 9.2A의 피크 전류를 연속적으로 흘리기에 적합하며, 어댑터의 11.5A 정격
    [S17] 내에서 안정적으로 동작합니다.'
  lab:
    title: 로봇손 최종 성능 검증
    steps:
    - 각 전원 분기의 DC 전압이 12V인지 멀티미터로 측정하여 확인합니다.
    - 시스템을 비활성화 상태에서 물리적 전원을 분리하고 무전원 상태를 확인합니다.
    - 손가락 모듈을 고정 지그에 장착하고 각 액추에이터의 통신 상태를 확인합니다.
    - 손끝 FSR 센서의 무부하 시 ADC 출력 값을 기록합니다.
    - 단계별 하중(0.5kg, 1kg, 2kg, 3kg)을 가하며 손끝 변위를 측정합니다.
    - 반복 파지 시험을 수행하며 텐던의 장력 유지 여부와 액추에이터 전류 피드백을 기록합니다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고 멀티미터 DC-전압 모드로 각 분기 1V 미만 확인 후 접근합니다.
    - 전원 인가 중 손을 가동 범위에 넣지 않고 고정 지그에서 무부하 시험을 우선 실시합니다.
    - 충격 방지 작업용 보안경을 항시 착용합니다.
    - 인증된 기계 안전 시스템이 아니므로 사람 접근이 없는 환경에서 시험합니다.
    deliverables:
    - 파지 시험 데이터 시트(하중 vs 변위, 파지력 vs 시간 데이터)
    - 시스템 강성 계산 결과 보고서
    - 전원 분기별 전류/전압 안정성 계측 기록
  assignment:
    title: 최종 검증 보고서 작성
    deliverables:
    - 최종 성능 검증 보고서(PDF)
    - 시험 데이터 원본(CSV)
    rubric:
    - 강성 측정 데이터가 이론적 모델과 1.0mm 오차 범위 내에 있는지 확인
    - FSR 피드백 데이터의 재현성 확보 여부
    - 전원 분기 안정성 및 퓨즈 보호 동작에 대한 기술적 분석
    - 안전 수칙 준수 기록 및 향후 산업용 안전 설계 제안 여부
  quiz:
  - question: FSR 센서 구동을 위한 최적의 전원 레일은 무엇입니까?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    - 5V 액추에이터 전원
    - 배터리 직접 연결
    answer_index: 1
    explanation: FSR 분압 회로는 ADC의 측정 범위를 보호하고 신뢰성을 위해 3.3V 센서 전원을 사용해야 합니다 [S15].
  - question: 전원 분기에서 10A ATOF 퓨즈의 역할은 무엇입니까?
    choices:
    - 계획 정지 버튼 역할
    - 액추에이터의 토크를 직접 제어
    - 배선 고장 시 독립 분기 회로 보호
    - 전압을 12V로 강제 고정
    answer_index: 2
    explanation: 퓨즈는 배선 고장 시의 과전류로부터 분기 회로를 보호하는 장치입니다. 계획 정지는 물리적 전원 분리로 수행해야 합니다.
  - question: 시스템 검증을 위해 가장 먼저 해야 할 안전 조치는 무엇입니까?
    choices:
    - 멀티미터로 저항 확인
    - 전원 공급 장치의 전류 제한 설정
    - 3개 전원 어댑터를 물리적으로 분리하고 DC 전압 확인
    - 액추에이터 통신 테스트
    answer_index: 2
    explanation: 작업자 접근 전, 물리적 전원 분리와 전압 계측을 통한 무전원 상태 확인이 가장 우선입니다.
  completion_criteria:
  - 최종 성능 검증 보고서 제출 및 통과
  - 파지 시험 결과 1.0mm 오차 범위 이내 확인
  - 전원 분기 및 안전 프로토콜 준수 확인
