- id: M5
  slug: transmission-setup
  phase_id: PH2
  title: 힘 전달 시스템(Tendon) 구축
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - Dyneema SK78 텐던의 기계적 특성과 로봇 손 힘 전달 메커니즘을 이해한다.
  - 텐던 구동 시스템의 캡스턴(Capstan) 설계 원리와 마찰력 제어 방법을 익힌다.
  - 정밀 텐던 배선 조립 및 장력 확보 절차를 숙달한다.
  - 텐던 시스템의 유지보수 및 내구성 평가 방법을 이해한다.
  theory_markdown: '### 텐던 구동 시스템 개요

    로봇 손의 관절 구동을 위해 텐던(Tendon) 구동 방식은 모터와 링크 간의 무게 중심을 원위치에서 몸체로 이동시킬 수 있어 정밀한 조작에
    필수적이다. 사용되는 `Dyneema SK78` 섬유는 1.5 mm 직경에서 230 daN의 파단 하중을 견디며, 작동 신율이 1% 미만으로
    정밀한 위치 제어에 적합하다 [S15].


    ### 캡스턴(Capstan) 이론

    텐던을 모터 축(캡스턴)에 감아 회전력을 직선 운동으로 변환할 때, 마찰력은 오일러-에이텔바인(Euler-Eytelwein) 공식 $T_{out}
    = T_{in}e^{\mu\phi}$에 의해 결정된다. 여기서 $\mu$는 접촉면 마찰 계수, $\phi$는 감긴 각도(라디안)이다. 텐던이
    미끄러지지 않도록 적절한 감김 횟수를 설계하는 것이 중요하다.


    ### 조립 및 장력 설계

    텐던은 반복적인 굽힘과 인장 하중을 받는다. 캡스턴과 링크가 연결되는 모서리는 반드시 라운딩 처리를 하여 응력 집중을 방지해야 한다 [S15].
    장력 조절은 시스템의 강성(Stiffness)과 응답 속도에 직접적인 영향을 미치므로, 초기 설치 시 텐던의 탄성을 고려한 적절한 인장력이
    요구된다.'
  worked_examples:
  - '예제 1: 텐던 파단 하중 계산. Dyneema SK78(1.5 mm)의 파단 하중이 230 daN이다. 1 daN은 약 10 N이므로,
    총 파단 하중은 2,300 N이다. 11개의 액추에이터가 4.1 N·m의 스톨 토크를 낼 때 [S10], 안전율을 5 이상으로 유지하는 것이
    권장된다.'
  - '예제 2: 캡스턴 마찰 설계. 텐던이 캡스턴에 360도($2\pi$ 라디안) 감겨있고 마찰 계수가 0.2라면, $e^{0.2 \times
    2\pi} \approx 3.51$의 하중 증폭 효과를 얻을 수 있다. 이는 모터 토크 전달의 효율을 높이는 데 기여한다.'
  lab:
    title: 텐던 루팅 및 장력 확보 실습
    steps:
    - 각 손가락 링크의 텐던 경로를 확인하고 모서리가 날카로운 부분에 라운딩 처리한다.
    - D-Pro 1.5 mm 텐던을 설계된 길이에 맞춰 절단하고 말단부를 고정한다 [S15].
    - 액추에이터 캡스턴에 텐던을 2~3회 감고 텐셔너를 사용하여 초기 장력을 가한다.
    - 멀티미터를 이용해 손가락 모듈의 전기적 분리 상태를 확인한다(비접촉 확인).
    - 무부하 상태에서 모터를 저속 구동하여 텐던이 경로를 이탈하지 않는지 확인한다.
    safety:
    - 절단 작업 시 반드시 보안경을 착용한다.
    - 전원 인가 전 텐던이 링크 사이에 끼이지 않았는지 육안으로 확인한다.
    - 텐던 장력 시험 시 손을 가동 범위 내에 절대 넣지 않는다.
    - 비상 정지 시 3개 독립 전원 어댑터를 물리적으로 분리하고, 각 분기의 DC 전압이 1 V 미만임을 멀티미터로 확인한 후 접근한다.
    - 전원이 켜진 상태에서 텐던을 손으로 당기지 않는다.
    deliverables:
    - 텐던 장력 측정 기록지
    - 경로 이탈 방지 조치 확인 사진
    - 조립 완료된 5지 로봇 손 사진
  assignment:
    title: 텐던 구동 시스템 성능 분석
    deliverables:
    - 텐던 시스템 구성 보고서
    - 마찰 및 신율 고려한 장력 조절 설계 도면
    - 반복 굽힘 시험 결과 분석 데이터
    rubric:
    - Dyneema SK78의 물성치를 정확히 인용하고 이해하였는가?
    - 캡스턴 설계 시 마찰 이론을 적용하였는가?
    - 안전 수칙을 준수하고 측정 값을 정확히 기록하였는가?
  quiz:
  - question: Dyneema SK78 텐던의 주요 특징으로 옳은 것은?
    choices:
    - 작동 신율이 5% 이상으로 탄성이 매우 크다.
    - 작동 신율이 1% 미만으로 정밀 제어에 유리하다.
    - 고온에서 강도가 급격히 상승한다.
    - 금속 와이어보다 무겁고 부식에 취약하다.
    answer_index: 1
    explanation: Dyneema SK78은 작동 신율이 1% 미만으로 매우 낮아 정밀 로봇 손의 위치 제어에 적합하다 [S15].
  - question: 텐던 시스템의 비상 정지 시 안전 조치로 옳은 것은?
    choices:
    - 저항 모드로 회로가 끊어졌는지 확인한다.
    - 퓨즈는 정격과 시간-전류 곡선에 따라 회로를 개방하며 비상정지 기능을 대신하지 않는다.
    - 3개 독립 전원 어댑터를 물리적으로 분리하고 멀티미터로 DC 전압을 확인한다.
    - 소프트웨어 제어기로 출력 전압을 0 V로 설정한다.
    answer_index: 2
    explanation: 벤치 프로토타입의 안전한 정지는 3개 독립 전원을 물리적으로 분리하고, 멀티미터의 DC 전압 모드로 각 분기가 1 V
      미만임을 확인하는 것이다.
  completion_criteria:
  - 텐던 장력 확보 실습을 완료하고 보고서를 제출함.
  - 모든 안전 수칙을 준수하며 무부하 구동 시험에 성공함.
  - 텐던 경로의 마찰 방지 조치를 검증함.
  source_ids:
  - S15
  - S10
- id: M6
  slug: actuator-integration
  phase_id: PH2
  title: 액추에이터 및 베어링 통합
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - 액추에이터(XM430-W350-T)의 기계적 설치 사양 및 토크/전류 한계 이해
  - igus JSM-0810-10 베어링과 8mm 샤프트를 활용한 고정밀 회전 관절 조립
  - 독립된 12V 전원 분기 구성과 과전류 보호(10A 퓨즈) 설계 원리 습득
  - 열압입 인서트(HTBI-M3-BR)를 활용한 반복 조립 가능한 구조 설계
  theory_markdown: '### 액추에이터 통합 및 기구 정밀도

    로봇 손의 관절은 11개의 XM430-W350-T 스마트 액추에이터를 사용하며, 스톨 토크 4.1 N·m를 발생시킵니다 [S10]. 정밀한
    구동을 위해 JSM-0810-10 폴리머 슬리브 베어링과 8mm 정밀 알루미늄 샤프트를 결합하여 마찰과 유격을 최소화합니다 [S16, S17].
    베어링은 압입 시 내부 공차를 조정하므로, 하우징 보어 공차 준수가 필수입니다 [S16].


    ### 전원 분기 및 보호 회로 설계

    총 11개 액추에이터의 스톨 전류 합계는 25.3 A (11 × 2.3 A)입니다 [S10]. 이를 위해 11.5 A 정격의 절연형 전원 어댑터
    3개를 사용하여 독립적인 분기를 구성합니다 [S14]. 3개의 분기 합산 정격은 34.5 A로, 시스템 최대 피크 전류 25.3 A를 초과하여
    안정적인 동작이 가능합니다. 각 분기는 10 A ATOF 퓨즈로 보호되며, 이는 배선 고장 시 과전류를 차단하여 시스템을 보호합니다 [S24].
    각 어댑터의 (+) 출력을 병렬 연결하는 것은 금지되며, 액추에이터는 4대/4대/3대씩 독립적으로 전원을 공급받습니다 [S14].'
  worked_examples:
  - '분기별 퓨즈 선정: 4대 액추에이터 스톨 합계 9.2 A(4 × 2.3 A)이므로, 전원 한계(11.5 A) 내에서 동작하도록 10 A 퓨즈를
    선택하여 배선 및 액추에이터 보호를 달성함 [S10, S24].'
  - '베어링 공차 확인: JSM-0810-10은 8 mm 샤프트와 호환되며, 하우징 보어는 내경 10 mm에 맞춰 설계하여 압입 시 최적의 마찰
    계수를 유지함 [S16, S17].'
  lab:
    title: 액추에이터 관절 조립 및 전원 분기 검증
    steps:
    - 손바닥 프레임 출력물에 열압입 인서트(HTBI-M3-BR)를 4.0 mm 파일럿 홀에 압입함 [S20].
    - 베어링(JSM-0810-10)을 링크 하우징에 장착하고 8 mm 알루미늄 샤프트의 정렬을 확인함 [S16, S17].
    - 각 어댑터 출력에 ATO 인라인 퓨즈 홀더(0AFH0001Z)를 연결하고 10 A 퓨즈를 장착함 [S23, S24].
    - 멀티미터를 DC 전압 모드로 설정하여 각 분기별로 12 V가 출력되는지 확인함.
    safety:
    - 전원 인가 중에는 가동 범위에 손을 넣지 말 것.
    - 모든 정비 및 조립 작업 전 3개 전원 어댑터를 물리적으로 분리하고 1 V 이하 전압 확인.
    - 퓨즈 장착 및 배선 확인 시 보안경을 착용할 것.
    - 분기된 양(+) 전원선 간의 접촉 방지 절연 조치 준수.
    deliverables:
    - 관절 회전 유격 측정 기록지
    - 분기별 전압 측정 결과 및 퓨즈 단락 시 전류 차단 기록
    - 조립 완료된 5지 로봇손 프레임 사진
  assignment:
    title: 전원 분기 및 액추에이터 부하 설계 보고서
    deliverables:
    - 액추에이터 배치에 따른 분기별 부하 전류 계산서
    - 관절 축의 베어링 및 샤프트 조립 도면(CAD)
    - 비상시 물리적 전원 차단을 포함한 시스템 조립 기술서
    rubric:
    - 분기별 전류 합계가 액추에이터 피크치를 초과하지 않는지 계산 정확성
    - 지정된 베어링 및 샤프트 규격 일치 여부
    - 독립 분기 및 퓨즈 보호 설계의 명확성
  quiz:
  - question: 3개의 12 V 전원 어댑터 출력 구성 방법으로 올바른 것은?
    choices:
    - 모든 (+) 출력을 병렬 연결하여 하나의 버스로 만든다.
    - 각 어댑터 출력을 액추에이터 4대/4대/3대 단위의 독립 분기로 배분한다.
    - 각 어댑터 출력을 직렬 연결하여 36 V를 만든다.
    - 어댑터 출력 중 하나만 사용하고 나머지는 예비로 둔다.
    answer_index: 1
    explanation: 독립 분기를 구성하여 각 퓨즈가 해당 그룹을 보호하도록 해야 하며, (+) 출력 병렬 연결은 절대 금지합니다.
  - question: JSM-0810-10 베어링과 가장 적합한 샤프트 규격은?
    choices:
    - 지름 6 mm 샤프트
    - 지름 8 mm 샤프트
    - 지름 10 mm 샤프트
    - 지름 12 mm 샤프트
    answer_index: 1
    explanation: JSM-0810-10은 내경이 8 mm이므로 8 mm 샤프트와 호환됩니다.
  - question: 10 A 퓨즈를 사용하는 주된 이유는?
    choices:
    - 전압을 12 V로 낮추기 위해
    - 배선 및 시스템 과전류 보호를 위해
    - 통신 속도를 높이기 위해
    - 액추에이터 토크를 증가시키기 위해
    answer_index: 1
    explanation: 퓨즈는 과전류 발생 시 회로를 물리적으로 차단하여 시스템 고장을 방지하는 역할을 합니다.
  completion_criteria:
  - 각 액추에이터 분기별 전압이 12 V 정상 출력됨을 확인
  - 회전 관절의 베어링 조립이 유격 없이 완료됨
  - 모든 전원 분기에 10 A 퓨즈가 적절히 설치됨
  - 조립 기술서 및 계산서 제출 완료
  source_ids:
  - S10
  - S16
  - S17
  - S14
  - S24
  - S20
  - S23
- id: M7
  slug: wiring-safety
  phase_id: PH2
  title: 배선 및 안전 시스템 구현
  estimated_hours: 8.0
  prerequisites:
  - M6
  objectives:
  - 액추에이터 전원 시스템의 독립 분기 원리를 이해하고 설계한다.
  - 과전류 보호를 위한 ATOF 퓨즈의 역할과 선정 방법을 학습한다.
  - FSR 센서의 전압 분압 회로 구성 및 OpenCR 3.3V 센서 전원 활용법을 익힌다.
  - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다.
  theory_markdown: '### 로봇 전원 시스템 설계 원리

    정교한 5지 로봇손 시스템은 다수의 DYNAMIXEL XM430-W350-T 액추에이터를 구동하기 위해 큰 피크 전류를 요구합니다. 안정적인
    구동을 위해 3개의 독립적인 GST160A12-R7B 12V 전원 어댑터를 사용하여 전류 부하를 분산합니다 [S14]. 각 어댑터는 독립적인
    분기로 관리되며, 양(+)의 출력단은 절대로 병렬로 연결하지 않습니다 [S14].


    ### 과전류 보호 및 퓨즈 선정

    각 액추에이터 분기는 배선 결함 시 화재 및 장비 손상을 방지하기 위해 10A ATOF 퓨즈로 보호됩니다 [S10, S24]. 퓨즈는 11.5A
    정격 전원 어댑터 출력보다 낮은 전류에서 동작하도록 설정하며, 액추에이터 4개 구동 시 스톨 전류 합계(9.2A)를 고려하여 선정합니다 [S10,
    S14, S24].


    ### 아날로그 센서 인터페이스

    FSR 402 센서는 압력이 증가할수록 저항이 감소하는 특성을 가집니다 [S11]. OpenCR 제어 보드의 ADC 해상도(12bit)와 안정적인
    신호 취득을 위해 10kΩ 저항을 사용하여 3.3V 센서 전원 레일에서 분압 회로를 구성합니다 [S12, S25]. 5V나 12V 액추에이터
    전원을 센서 전원으로 사용하는 것은 OpenCR ADC 입력 한계를 초과하여 보드를 손상시킬 수 있으므로 엄격히 금지됩니다 [S12].'
  worked_examples:
  - '예제 1: 10A 퓨즈 선정의 타당성 검증. 한 분기에 연결된 액추에이터가 4대이고 각각의 스톨 전류가 2.3A이므로, 최대 피크 전류는
    9.2A입니다. 10A 퓨즈는 정상 작동 전류를 허용하면서 비정상적인 과전류 상황에서 시스템을 안전하게 차단합니다 [S10, S24].'
  - '예제 2: FSR 분압 회로 설계. 3.3V 센서 전원 레일에서 FSR과 10kΩ 저항을 직렬 연결합니다. 압력이 없을 때 FSR 저항은
    매우 크므로 ADC 입력은 0V에 가깝고, 압력이 최대일 때 ADC는 3.3V 범위 내에서 전압을 출력하여 센서 데이터를 정밀하게 취득합니다
    [S11, S12, S25].'
  lab:
    title: 배선 하네스 제작 및 독립 분기 전원 검증
    steps:
    - Micro-Fit 3.0 커넥터를 사용하여 손가락별 전원 및 신호 하네스를 제작합니다 [S13].
    - 각 12V 어댑터 출력단에 ATO 인라인 퓨즈 홀더를 장착하고 10A 퓨즈를 삽입합니다 [S23, S24].
    - OpenCR 보드의 3.3V 센서 전원을 이용하여 FSR 센서용 전압 분압 회로를 구성합니다 [S12, S25].
    - 전원 인가 전, 모든 액추에이터 배선이 각각의 분기 퓨즈에 독립적으로 연결되었는지 멀티미터로 도통 시험(비전원 상태)합니다.
    - Bench Stop 절차에 따라 3개 어댑터를 개별 인가하고, 각 분기의 출력 전압이 12V(±5%) 범위 내에 있는지 측정합니다 [S14].
    safety:
    - 모든 배선 작업 전 3개 전원 어댑터의 물리적 분리를 확인합니다.
    - 학습자가 정지 회로를 설계하거나 조립하지 않으며, 정지가 필요할 때는 3개 절연 전원 어댑터를 물리적으로 분리한 뒤 각 분기의 잔류 전압이
      DC 전압 모드에서 1 V 미만임을 확인한다.
    - 전원 인가 중에는 로봇손의 가동 범위 내에 손을 넣지 마십시오.
    - 접촉 시험 시 반드시 보안경을 착용하십시오.
    deliverables:
    - 각 분기별 독립 전압 측정 기록(DC 12V 확인)
    - 하네스 배선도 및 퓨즈 분기 구성 사진
    - FSR 센서 ADC 입력값 확인 결과 보고서
  assignment:
    title: 안전 시스템 설계 및 독립 분기 최적화 보고서
    deliverables:
    - 독립 전원 분기 구성도 및 퓨즈 용량 선정 근거 기술서
    - 아날로그 센서 전압 분압 회로의 OpenCR 3.3V 신호 범위 보존 설계서
    - 로봇 시스템 Bench Stop 절차서 및 무전원 검증 체크리스트
    rubric:
    - 각 전원 분기의 독립성 및 퓨즈 용량의 적절성이 명확히 설계되었는가?
    - 센서 회로가 3.3V 레일 내에서 ADC 입력 사양을 준수하는가?
    - Bench Stop 과정에서 물리적 분리 및 전압 측정 절차가 명시되었는가?
  quiz:
  - question: 로봇 시스템에서 여러 개의 12V 전원 어댑터 출력단을 어떻게 처리해야 합니까?
    choices:
    - 전류 공급 능력을 높이기 위해 양(+) 출력을 모두 병렬로 연결한다.
    - 독립된 분기로 유지하고 절대 병렬로 연결하지 않는다.
    - 하나의 어댑터에 모두 연결하고 나머지는 예비용으로 둔다.
    - 전압을 안정화하기 위해 어댑터 출력 사이에 커패시터를 연결한다.
    answer_index: 1
    explanation: 전원 어댑터 출력단을 병렬로 연결하는 것은 출력 간의 전위차로 인해 역전류나 고장을 유발할 수 있으므로 절대 금지됩니다
      [S14].
  - question: FSR 센서 분압 회로를 구성할 때 올바른 전원 선택은 무엇입니까?
    choices:
    - 12V 액추에이터 전원
    - 5V 범용 전원
    - OpenCR 3.3V 센서 전원
    - 어떤 전원을 사용해도 무방하다.
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3V 기준이므로 센서 회로 역시 3.3V 레일을 사용해야 안전하며 정확한 데이터를 얻을 수
      있습니다 [S12].
  - question: Bench Stop 절차의 마지막 단계에서 반드시 확인해야 할 것은 무엇입니까?
    choices:
    - 멀티미터의 저항 모드로 배선 연결 확인
    - DC 전압 모드에서 각 분기 전압이 1V 미만인지 측정 확인
    - 퓨즈의 상태 확인
    - 연결된 커넥터의 견고함 확인
    answer_index: 1
    explanation: 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
  completion_criteria:
  - 각 독립 분기의 12V 전압을 멀티미터로 측정하여 정상 범위임을 확인함.
  - FSR 센서가 3.3V 레일에서 적절히 분압 회로로 연결되었음을 검증함.
  - 비전원 상태에서 독립 분기 배선이 완료되었음을 도통 시험으로 확인함.
  - 안전 수칙(Bench Stop)을 이해하고 시험 보고서에 서명함.
  source_ids:
  - S13
  - S21
  - S23
  - S24
  - S14
  - S10
  - S11
  - S12
  - S25
- id: M8
  slug: controller-firmware
  phase_id: PH3
  title: 임베디드 제어 및 펌웨어
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - DYNAMIXEL Protocol 2.0을 이해하고 임베디드 제어기(OpenCR 1.0)와 통신 구조를 파악한다.
  - FSR 402 센서를 활용한 전압 분압 회로를 구성하고 ADC 데이터를 정규화하는 알고리즘을 구현한다.
  - 로봇손의 상태 제어를 위한 비차단(non-blocking) 상태기계 패턴을 설계한다.
  - 안전한 전원 관리 및 과전류 보호 원리를 이해하고 실제 프로토타입에 적용한다.
  theory_markdown: "## 임베디드 제어 및 펌웨어 설계\n\n### 1. DYNAMIXEL 통신 아키텍처\nXM430-W350-T\
    \ 액추에이터는 DYNAMIXEL Protocol 2.0을 사용합니다 [S10]. OpenCR 1.0 제어기는 이 프로토콜을 처리하기 위한\
    \ 전용 TTL 및 RS-485 포트를 내장하고 있어 별도의 외부 브리지 없이 신뢰성 있는 고속 데이터 교환이 가능합니다 [S12]. 주파수\
    \ 216 MHz의 강력한 CPU를 통해 다축 동기 제어와 실시간 위치·전류 피드백 처리를 수행합니다 [S12].\n\n### 2. 센서 데이터\
    \ 취득 (ADC)\nFSR 402 센서는 인가된 힘에 반비례하여 저항이 감소하는 특성을 갖습니다 [S11]. 이를 10 kΩ 저항과 함께\
    \ 분압 회로로 구성하여 OpenCR의 12-bit ADC(0~3.3 V 범위)로 입력합니다 [S12, S25]. \n$$V_{ADC} =\
    \ V_{ref} \\times \\frac{R_{FSR}}{R_{FSR} + 10k\\Omega}$$\n이때, 분압기의 기준 전원($V_{ref}$)은\
    \ 반드시 3.3 V 센서 전원을 사용해야 하며, 5 V 또는 12 V 전원 사용은 제어기 손상으로 이어지므로 엄격히 금지됩니다.\n\n###\
    \ 3. 상태기계 제어\n로봇손의 펌웨어는 '대기', '파지 동작', '유지', '해제' 등의 상태를 순환하는 비차단(non-blocking)\
    \ 구조로 설계되어야 합니다. 이는 특정 동작 중에도 항상 비상 정지 상태 확인과 센서 피드백을 실시간으로 감시하기 위함입니다."
  worked_examples:
  - '예제 1: FSR 데이터 필터링. 노이즈가 많은 아날로그 데이터를 단순 평균보다 이동 평균(Moving Average) 필터를 사용하여 10
    Hz 루프에서 안정화하는 로직 구현.'
  - '예제 2: DYNAMIXEL 전류 제한. 로봇손의 텐던이 파단되지 않도록 액추에이터의 전류 피드백 값을 읽어 스톨 전류(2.3 A)의 80%를
    넘지 않도록 실시간 토크 제한 값을 제어하는 코드 구현.'
  lab:
    title: 제어기 펌웨어 및 센서 인터페이스 구성
    steps:
    - OpenCR 1.0 제어기를 PC에 연결하고 DYNAMIXEL 라이브러리를 통해 모든 액추에이터 ID와 Baudrate가 일치하는지 확인한다.
    - FSR 402 센서를 10 kΩ 저항과 브레드보드에서 분압 회로로 연결하고 멀티미터로 0~3.3 V 신호 범위 내에 있는지 측정한다.
    - 간단한 PID 제어 코드를 작성하여 단일 액추에이터의 위치와 전류 데이터를 시리얼 모니터로 시각화한다.
    - 상태기계 구조를 작성하여 손가락이 힘 임계값(0.5 N 등)에 도달하면 멈추는 파지 로직을 구현한다.
    safety:
    - 3개 전원 어댑터는 각각 독립된 전원 분기를 형성하며, 양(+) 출력 단자를 절대 결합하거나 통합하지 않는다.
    - 실험 중에는 항상 보안경을 착용하며, 텐던 장력 시험 시 손가락 동작 범위 내에 손을 넣지 않는다.
    - 배선 수정이나 센서 변경 전, 반드시 3개의 12 V 전원을 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 전압이 1 V 미만임을
      확인한다.
    - 퓨즈(ATOF 10 A)는 과전류 발생 시 배선을 보호하는 최후의 수단이며, 이를 안전 기능이나 비상 정지로 오인하지 않는다.
    deliverables:
    - 각 센서별 캘리브레이션 데이터 기록지
    - 비차단 상태기계가 포함된 제어 펌웨어 소스 코드
    - 액추에이터 실시간 전류 피드백 분석 그래프
  assignment:
    title: 로봇손 펌웨어 최종 최적화 및 문서화
    deliverables:
    - 최종 펌웨어 소스 코드 압축 파일 (.zip)
    - 제어 로직 순서도 및 상태기계 다이어그램 (.pdf)
    - 파지 시험 및 안전 성능 검증 보고서 (.pdf)
    rubric:
    - 비차단 구조 구현 여부 (40점)
    - 센서 데이터 노이즈 처리의 효율성 및 정밀도 (30점)
    - 전원 안전 지침 준수 및 시스템 구성의 무결성 (20점)
    - 제출물 문서의 명확성 및 코드 가독성 (10점)
  quiz:
  - question: OpenCR 1.0에서 FSR 전압 분압 회로의 전원으로 권장되는 전압은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - 3.3 V 센서 전원
    - 외부 24 V 전원
    answer_index: 2
    explanation: OpenCR ADC 신호는 0~3.3 V를 초과해서는 안 되며, 공식 호환성 항목에서 3.3 V 센서 전원 사용을 명시하고
      있습니다 [S12].
  - question: 3개의 독립적인 12 V 전원 어댑터의 양(+) 출력 단자를 서로 연결하면 어떻게 됩니까?
    choices:
    - 전류 용량이 증대되어 더 안전해진다.
    - 절대 금지된 행위로 전원 시스템에 위험을 초래한다.
    - 전압이 36 V로 합산되어 구동 성능이 향상된다.
    - 별다른 영향이 없다.
    answer_index: 1
    explanation: 각 어댑터는 독립적인 분기로 설계되었으며, 양(+) 출력 병렬 연결은 절대 금지되어 있습니다 [B3].
  - question: 전원 분리 후, 안전하게 작업을 시작하기 위해 필요한 계측 확인 방법은 무엇입니까?
    choices:
    - 멀티미터의 저항 모드로 도통 확인
    - 멀티미터의 연속성 모드로 회로 확인
    - 멀티미터의 DC 전압 모드로 각 분기 1 V 미만 확인
    - 전원 LED가 꺼진 것을 육안으로 확인
    answer_index: 2
    explanation: 저항이나 연속성 모드는 무전원 상태를 증명할 수 없으며, 반드시 DC 전압 모드로 실제 잔류 에너지가 1 V 미만임을
      확인해야 합니다.
  completion_criteria:
  - 실습 단계별 요구하는 전압/전류 계측을 완료하고 확인서를 제출함.
  - 제어 펌웨어 내 비차단 상태기계 로직을 구현하여 동작을 검증함.
  - 모든 센서 및 액추에이터가 3.3 V/12 V 지정 전원 분기에 안전하게 연결됨을 확인.
  - 안전 검토 항목을 포함한 최종 프로젝트 보고서를 제출함.
