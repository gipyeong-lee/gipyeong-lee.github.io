- id: mod-3
  slug: cad-printing
  phase_id: phase-2
  title: CAD 설계 및 FDM 출력
  estimated_hours: 12.0
  prerequisites:
  - mod-2
  objectives:
  - FDM 3D 프린팅을 위한 기계 부품의 CAD 설계 원칙을 이해한다.
  - 탄소섬유 보강 PC 필라멘트(PC-CF)의 물성 및 출력 설정(노즐 온도 285°C, 베드 온도 110°C)을 학습한다.
  - 적층 가공 시 발생하는 치수 오차를 고려한 끼워맞춤 설계(Tolerance Design)를 수행한다.
  - 경화강 노즐 사용 등 PC-CF 출력에 필요한 하드웨어 준비 사항을 숙지한다.
  theory_markdown: '### 3D 프린팅을 위한 기계 설계

    정교한 5지 로봇손 제작을 위해서는 부품의 기하학적 형상뿐만 아니라, FDM 적층 방식의 특성을 이해하는 설계가 필수적입니다. 탄소섬유 보강
    PC(PC-CF)는 높은 강성과 열적 안정성을 제공하지만, 수축률을 고려한 치수 공차 설계가 중요합니다 [S19].


    #### 1. PC-CF 물성과 노즐 선택

    PC-CF는 일반적인 PLA와 달리 연마성이 강하므로 반드시 경화강(Hardened Steel) 노즐을 사용해야 합니다 [S19]. 노즐 온도는
    285°C(±10°C), 히트베드 온도는 110°C(±10°C)로 설정하여 층간 접착력을 확보합니다 [S19].


    #### 2. 끼워맞춤 설계(Tolerance)

    베어링(igus JSM-0810-10)이나 캡스크루(M3)가 체결되는 부위는 출력 오차를 고려한 설계가 필요합니다 [S18, S20]. 통상적으로
    정밀 부품 조립 시 0.1~0.2mm의 오프셋(Offset)을 적용하여 사후 가공 없이도 조립이 가능하도록 설계합니다.


    #### 3. 구조 보강 설계

    로봇 손가락 링크와 같이 인장력이 집중되는 부위는 레이어 방향(Layer orientation)을 조절하여 적층 결을 따라 파단이 발생하지
    않도록 설계해야 합니다.'
  worked_examples:
  - '예시 1: 8mm 슬리브 베어링 하우징 설계. 공칭 내경 10mm 하우징 구멍 설계 시, 출력 오차 0.15mm를 추가하여 CAD에서 10.15mm로
    설계하는 방법.'
  - '예시 2: M3 인서트 너트 체결부. 나사산 손상을 방지하기 위해 인서트 홀 지름을 제조사 권장 규격보다 0.05mm 작게 설계하여 열압입(Heat-set)
    시 강한 유지력을 얻는 예시.'
  lab:
    title: PC-CF 구조 부품 출력 및 치수 교정
    steps:
    - 경화강 노즐로 교체하고 FDM 3D 프린터의 레벨링을 재수행한다.
    - 손가락 링크 샘플 모델을 설계하여 0.05mm 단위의 공차 테스트 블록을 출력한다.
    - 멀티미터를 이용해 히트베드 온도를 보정하고, 설정된 110°C가 베드 전체에 고르게 분포하는지 확인한다.
    - 출력된 시편의 실측 치수와 CAD 설계 치수를 비교하여 오프셋 보정값을 산출한다.
    safety:
    - 노즐 온도 285°C 및 베드 온도 110°C에서 화상 위험이 있으므로 반드시 보호 장갑을 착용한다.
    - FDM 출력 중 발생하는 휘발성 유기화합물 차단을 위해 환기를 실시한다.
    - 경화강 노즐 교체 시 노즐 히터 블록의 열적 안전성을 확인한다.
    deliverables:
    - 테스트 시편 실측 치수 측정 기록지
    - 공차 보정값(Offset Parameter)이 반영된 5지 로봇손 CAD 파일(STL/STEP)
  assignment:
    title: 로봇손 링크 부품 CAD 모델링
    deliverables:
    - 5지 로봇손 전체 어셈블리 CAD 모델링 파일
    - 각 링크별 공차 및 조립 인터페이스 설명서
    - 출력 조건(온도, 속도, 서포트 설정)이 명시된 G-code 리스트
    rubric:
    - 관절축(8mm)과 베어링 사이의 공차가 조립 가능한 범위 내에 있는가(0.05~0.15mm)?
    - 탄소섬유 필라멘트(PC-CF)의 특성을 고려하여 서포트 위치를 최소화하였는가?
    - 체결용 M3 나사 홀 규격이 미스미(Misumi) 표준을 준수하는가 [S20]?
  quiz:
  - question: PC-CF 필라멘트를 사용할 때 노즐 재질을 경화강(Hardened Steel)으로 변경해야 하는 이유는 무엇인가?
    choices:
    - 탄소섬유가 연마성이 강해 황동 노즐을 빠르게 마모시키기 때문
    - PC-CF의 융점이 400도 이상이기 때문
    - 경화강 노즐이 전기 전도성이 더 좋기 때문
    - 황동 노즐은 285도에서 녹기 때문
    answer_index: 0
    explanation: PC-CF 내의 탄소섬유는 매우 강한 연마 특성을 가지므로 황동과 같은 연한 재질의 노즐은 출력 중 내부 구멍이 확장되어
      품질이 저하됩니다.
  - question: 제시된 데이터에 따른 적절한 히트베드 온도는 얼마인가?
    choices:
    - 60°C
    - 110°C
    - 285°C
    - 150°C
    answer_index: 1
    explanation: 제공된 정보에 따르면 PC-CF 필라멘트의 권장 베드 온도는 110°C입니다 [S19].
  completion_criteria:
  - 출력 테스트 블록을 통해 8mm 베어링과의 끼워맞춤 공차가 0.05mm 정밀도로 구현됨을 확인
  - PC-CF의 경화강 노즐 환경 설정 완료
  - 설계한 CAD 모델이 5지 로봇손의 조립 요구사항을 충족함
  source_ids:
  - S19
- id: mod-4
  slug: actuator-assembly
  phase_id: phase-2
  title: 구동기 및 구조물 조립
  estimated_hours: 12.0
  prerequisites:
  - mod-3
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 물리적 장착 및 텐던 구동 메커니즘을 이해한다.
  - BOM 시스템 진실에 의거한 안전한 전력 분기 회로를 구성한다.
  - 슬리브 베어링과 고강도 텐던을 활용하여 마찰이 최소화된 관절 구조를 조립한다.
  - 비상 정지 회로와 고전류 차단 접촉기를 결합한 안전 시스템을 구현한다.
  theory_markdown: '### 정교한 로봇손의 구동 및 구조 설계 원리


    #### 1. 구동 메커니즘 및 텐던 시스템

    5지 로봇손의 정밀한 움직임은 DYNAMIXEL XM430-W350 액추에이터가 텐던(Spectra 1600 Denier, [S17])을 당기는
    힘에 의해 결정됩니다. 텐던은 회전력을 직선 변위로 변환하여 링크를 구동하며, 무급유 폴리머 슬리브 베어링(JSM-0810-10, [S18])을
    사용하여 회전축의 마찰 유격을 최소화합니다.


    #### 2. 전력 분기 및 안전 시스템

    본 시스템은 11개의 액추에이터가 소모하는 피크 전류 총합(약 25.3 A)을 수용하기 위해 독립된 전원 분기 구조를 채택합니다. 각 GST160A12-R7B
    어댑터(11.5 A 출력, [S16])는 3개 분기로 구성되어 총 34.5 A의 용량을 확보하며, 각 손가락 모듈은 개별 퓨즈가 포함된 독립
    분기로 연결됩니다. Micro-Fit 3.0 커넥터(8.5 A 정격, [S15])는 각 분기 내에서 사용되며, 결코 전체 액추에이터 합산 전류(25.3
    A)가 단일 커넥터를 통과하지 않도록 설계합니다.


    #### 3. 비상 안전 제어

    비상 상황 발생 시, 래칭 비상정지 버튼(A22E-M-12-EMO, [S22])이 제어 회로를 개방하여 EV200 접촉기([S23])의 코일
    전원을 차단합니다. EV200은 최대 500 A 연속 전류를 차단할 수 있는 성능을 가지며, 액추에이터 DC 버스를 즉시 분리하여 사용자의
    안전을 보장합니다.'
  worked_examples:
  - '예제 1: 전력 분기 용량 계산

    액추에이터 11개(각 피크 2.3 A)의 총 피크 전류는 25.3 A입니다. 독립된 3개의 어댑터(각 11.5 A)를 사용하므로 전체 분기
    합산 용량은 34.5 A입니다. 따라서 34.5 A >= 25.3 A로 안전 규격을 만족합니다.'
  - '예제 2: 커넥터 정격 검증

    Micro-Fit 3.0 커넥터는 접점당 8.5 A입니다. 본 설계에서는 손가락별로 전원을 분기하여 분기당 최대 액추에이터 2개(2.3 A
    * 2 = 4.6 A)만 흐르도록 설계함으로써 커넥터의 정격(8.5 A)을 초과하지 않습니다.'
  lab:
    title: 구동기 조립 및 안전 회로 검증
    steps:
    - 탄소섬유 PC 필라멘트로 출력된 프레임에 슬리브 베어링을 압입합니다.
    - 텐던을 관절 캡스턴에 통과시켜 액추에이터에 체결합니다.
    - 독립된 3개의 전원 어댑터 분기를 구성하고 멀티미터로 전압(12 V)을 측정합니다.
    - 비상 정지 회로에 래칭 버튼을 연결하고 EV200 접촉기의 온/오프 상태를 확인합니다.
    safety:
    - 반드시 보안경을 착용하고 작업을 진행합니다.
    - 벤치 전원 사용 시 전류 제한(Current Limit) 설정을 확인합니다.
    - 로봇 동작 중 끼임 사고 방지를 위해 손가락 동작 범위 내에 손을 넣지 마십시오.
    - 모든 회로 연결 후 멀티미터로 단락 여부를 사전에 검사하십시오.
    deliverables:
    - 조립된 로봇손 링크 및 액추에이터 모듈 사진
    - 전력 분기별 전압 측정 교정 기록
    - 비상 정지 동작 확인 영상
  assignment:
    title: 전력 설계 및 조립 결과 보고서
    deliverables:
    - 설계된 전원 분기 및 커넥터 전류 흐름도
    - 베어링 유격 및 텐던 장력 측정 결과 보고서
    rubric:
    - BOM에 명시된 부품 사양을 정확히 활용하였는가?
    - 전력 분기 설계가 각 분기 정격을 초과하지 않는가?
    - 안전 회로가 비상시 전원을 완전히 차단하는가?
  quiz:
  - question: 본 설계에서 단일 Micro-Fit 3.0 커넥터에 흐르는 전류를 8.5 A 정격 이하로 유지하는 방법은 무엇인가?
    choices:
    - 모든 액추에이터를 하나의 커넥터로 연결한다.
    - 손가락 단위로 전원을 독립 분기하여 커넥터당 액추에이터 수를 제한한다.
    answer_index: 1
    explanation: 커넥터 정격을 초과하지 않도록 손가락별로 부하를 분산하여 전원을 독립 분기합니다.
  - question: 비상 정지 발생 시 EV200 접촉기의 역할은 무엇인가?
    choices:
    - 액추에이터의 제어 신호를 차단한다.
    - 고전류 DC 버스를 물리적으로 차단하여 전원 공급을 끊는다.
    answer_index: 1
    explanation: EV200은 액추에이터의 고전류 DC 버스를 차단하여 안전을 확보하는 역할을 합니다.
  completion_criteria:
  - 5개 손가락 링크 조립 완료
  - 독립된 전원 분기 회로 구성 및 전압 측정 완료
  - 비상 정지 시스템 동작 검증 완료
  source_ids:
  - S12
  - S20
- id: mod-5
  slug: tendon-wiring
  phase_id: phase-2
  title: 인대 구동 시스템 및 배선
  estimated_hours: 10.0
  prerequisites:
  - mod-4
  objectives:
  - 인대 구동 로봇손의 동역학적 특성을 이해하고 텐던 경로를 설계할 수 있다.
  - Micro-Fit 3.0 커넥터 시스템을 활용한 안전한 배선 하네스 제작 능력을 습득한다.
  - 고강도 UHMWPE 섬유 텐던의 물리적 특성을 고려한 장력 조절 및 고정 기법을 익힌다.
  - 로봇손 동작 시 발생하는 텐던 마찰 및 반복 굽힘에 따른 피로 누적 문제를 분석한다.
  theory_markdown: "## 인대 구동 메커니즘과 배선 최적화\n\n로봇손의 구동은 근골격계와 유사한 인대(Tendon) 구동 방식을\
    \ 사용합니다. 텐던은 액추에이터의 회전 운동을 손가락 관절의 굴곡 운동으로 전환합니다. \n\n### 1. 텐던 동역학\n본 시스템은 `Spectra\
    \ 1600 Denier` 섬유 텐던을 사용합니다 [S17]. UHMWPE 소재는 높은 인장 강도와 낮은 신장률을 제공하여 응답성이 우수합니다.\
    \ 텐던은 캡스턴(Capstan)을 통해 연결되며, 마찰력을 최소화하기 위해 텐던 경로상에 라운딩 처리된 가이드가 필수적입니다. \n\n###\
    \ 2. 하네스 설계 및 전원 분기\n신뢰성 있는 제어를 위해 액추에이터와 MCU 사이의 통신 및 전원 분기가 중요합니다. `Micro-Fit\
    \ 3.0` 커넥터는 3.00mm 피치로 핀 밀도가 높으며 최대 8.5A 정격 전류를 지원합니다 [S15]. 다수의 핀을 사용할 때 텐던 간섭을\
    \ 피하기 위해 하네스는 구동부와 물리적으로 격리되어야 합니다. 로봇손 모듈 간 교체를 용이하게 하기 위해 잠금식 커넥터를 적용하여 진동에\
    \ 의한 탈거를 방지합니다 [S15].\n\n### 3. 전기적 안전 지침\nBOM에 명시된 액추에이터 11개와 제어 시스템은 분기별로 엄격하게\
    \ 관리되어야 합니다. 모터 피크 전류 합산값이 전원 어댑터 단일 분기 전류를 초과하지 않도록 설계하며, 비상 시 `EV200` 접촉기를 통해\
    \ DC 버스를 즉시 차단합니다 [B-SAFETY-CUTOFF]."
  worked_examples:
  - '예제 1: 텐던 장력 설정. Spectra 1600 데니어 텐던 사용 시, 최대 스톨 토크 4.1 N·m [bom-1] 환경에서 텐던 초기
    장력을 5N으로 설정하고, 구동 시 신장률을 계산하여 캡스턴 회전량을 보상하는 방법.'
  - '예제 2: Micro-Fit 3.0 커넥터 전류 용량 검증. 액추에이터 1대당 최대 전류 소모를 고려할 때, 핀당 8.5A [S15] 정격이
    커넥터 안정성에 충분한지, 단자 과열 방지를 위한 도체 굵기(AWG) 선택 최적화 방법.'
  lab:
    title: 텐던 경로 구현 및 하네스 모듈 제작
    steps:
    - 손가락 구조 링크에 폴리머 슬리브 베어링을 삽입하고 마찰력을 측정한다 [bom-8].
    - Spectra 텐던을 캡스턴에 고정하고, 경로상의 가이드 모서리에 텐던 마찰이 발생하는지 확인한다 [S17].
