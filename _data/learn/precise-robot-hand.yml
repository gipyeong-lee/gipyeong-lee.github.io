- id: mod-6
  slug: actuation-system
  phase_id: phase-3
  title: 액추에이터 및 전력 배선
  estimated_hours: 15.0
  prerequisites:
  - mod-5
  objectives:
  - DYNAMIXEL XM430-W350-T 액추에이터의 전력 특성을 이해하고 시스템 사양을 도출한다.
  - 3개 독립 전원 분기를 활용한 안전한 12V 전력 배선 구조를 설계한다.
  - 비상정지(E-Stop) 회로와 고전류 접촉기를 활용한 다중 분기 동시 차단 시스템을 구현한다.
  - FSR 힘 센서의 전압 분압 회로를 OpenCR의 3.3V 센서 전원 레일에 정확히 통합한다.
  theory_markdown: '### 전력 시스템 설계 원칙

    5지 로봇손은 다수의 고성능 액추에이터를 사용하므로 정밀한 전력 분배가 필수적입니다. 총 11개의 XM430-W350-T 액추에이터는 개당
    2.3A의 스톨 전류를 가지며, 모든 액추에이터가 동시에 최대 부하에 도달할 경우 25.3A의 피크 전류가 발생할 수 있습니다 [S9]. 이를
    위해 본 설계에서는 11.5A 정격의 12V 데스크톱 전원 어댑터 3개를 사용하여 독립적인 전원 분기를 구성합니다 [S13]. 어댑터의 양(+)
    출력은 서로 결합하지 않고 각각 독립적인 퓨즈 분기로 관리됩니다.


    ### 안전 및 보호 메커니즘

    고전류 시스템에서 안전은 최우선 사항입니다. 각 독립 분기에는 10A ATOF 퓨즈를 삽입하여 과전류를 차단합니다 [S23, S24]. 비상
    시 전체 전원을 차단하기 위해 3개의 독립 분기 전압선에 EV200 고전류 접촉기를 각각 직렬 배치하고, 비상정지 푸시버튼을 사용하여 이 접촉기들의
    코일 제어 회로를 한 번에 개방(NC 방식)하는 구조를 채택합니다 [S21, S22].


    ### 센서 인터페이스

    FSR 402 센서는 압력에 따라 저항이 변하는 가변 저항체입니다 [S10]. 10kΩ 저항을 사용하여 분압 회로를 구성하고, 반드시 OpenCR
    보드의 3.3V 센서 전원 레일에 연결하여 신호 범위를 ADC 입력 규격인 0~3.3V 이내로 제한해야 합니다 [S11, S25].'
  worked_examples:
  - '예제 1: 분기별 전류 계산. 총 11대의 액추에이터를 4대, 4대, 3대로 분배합니다. 4대 그룹의 최대 스톨 전류 합계는 4 × 2.3A
    = 9.2A입니다. 10A 퓨즈는 9.2A 이하에서 안정적이고 11.5A 전원 어댑터의 정격 범위 내에 있으므로 적절합니다 [S9, S13,
    S24].'
  - '예제 2: 비상정지 제어 회로. 비상정지 버튼이 눌리면 래칭 기구에 의해 NC 접점이 개방되고, 이는 EV200 접촉기의 코일 전류를 차단합니다.
    3개의 분기에 연결된 접촉기가 동시에 개방되어 12V 액추에이터 전원 분기를 완전히 분리합니다 [S21, S22].'
  lab:
    title: 액추에이터 전원 분기 및 제어 회로 구축
    steps:
    - 각 12V 어댑터의 양극 출력에 ATO 퓨즈 홀더를 납땜하고 10A 퓨즈를 삽입한다 [S23, S24].
    - 각 분기별로 EV200 접촉기의 주 전원 단자를 직렬 배치한다 [S22].
    - 비상정지 버튼의 NC 접점을 통해 3개 접촉기의 코일 단자를 제어 회로로 연결한다 [S21].
    - FSR 센서와 10kΩ 저항을 활용해 분압 회로를 구성하고 OpenCR 3.3V 센서 레일에 배선한다 [S25].
    - 멀티미터를 사용하여 각 분기의 독립적인 전압 출력과 비상정지 작동 시 전원 차단 여부를 검증한다.
    safety:
    - 전원 인가 전 반드시 멀티미터로 전원 분기 간 단락 여부를 확인한다.
    - 비상정지 회로는 반드시 강제 개방(NC) 방식을 사용한다.
    - 절대 3개 전원 어댑터의 양(+) 출력을 결합하지 않는다.
    - 작동 중인 전력선 작업은 금지하며, 보안경을 항상 착용한다.
    deliverables:
    - 독립 분기별 전압 측정 기록
    - 비상정지 버튼 동작에 따른 분기 차단 타임라인 기록
    - 분압 회로 출력 신호 교정 데이터
  assignment:
    title: 로봇손 전력 배선 및 안전 분석 보고서
    deliverables:
    - 독립 전원 분기 배선도
    - 비상정지 로직 제어 회로도
    - 최대 부하 시 분기별 전류 소모량 분석 데이터
    rubric:
    - 모든 액추에이터가 3개의 독립된 분기에 정확히 할당되었는가?
    - 비상정지 버튼이 3개 접촉기를 동시에 차단하도록 NC 회로로 설계되었는가?
    - FSR 센서 분압 회로가 3.3V 레일을 사용하는가?
    - 퓨즈와 접촉기 정격이 시스템 최대 전류를 보호하기에 충분한가?
  quiz:
  - question: 3개의 12V 전원 어댑터 출력 사용 방식 중 옳은 것은?
    choices:
    - 전류 공급량을 늘리기 위해 모든 양(+) 출력을 하나로 묶는다.
    - 각 어댑터를 독립적인 퓨즈 분기로 사용하여 전력 경로를 완전히 분리한다.
    - 2개의 어댑터만 사용하고 1개는 예비용으로 둔다.
    - 전압을 36V로 맞추기 위해 직렬로 연결한다.
    answer_index: 1
    explanation: 독립 분기 구성은 단일 고장 시 전체 시스템의 전력 공급 중단을 막고 안정적인 분기별 보호를 가능하게 합니다.
  - question: FSR 힘 센서의 전압 분압 회로를 OpenCR 보드에 연결할 때 주의사항은?
    choices:
    - 12V 액추에이터 전원을 분압기 공급 전원으로 사용한다.
    - 5V 레일을 센서 전원으로 사용한다.
    - 반드시 3.3V 센서 전원 레일을 사용하여 ADC 입력을 0~3.3V 범위로 제한한다.
    - 전원을 별도로 연결하지 않고 출력 신호선만 연결한다.
    answer_index: 2
    explanation: OpenCR의 ADC는 3.3V를 기준으로 하므로, 센서 전압 분압 공급 역시 3.3V 레일을 사용해야 안전합니다.
  - question: 비상정지 푸시버튼 제어 회로의 특징은?
    choices:
    - 모터의 고전류를 비상정지 버튼이 직접 차단한다.
    - 접촉기의 코일 제어 회로를 NC 방식으로 개방하여 접촉기를 동시에 차단한다.
    - 버튼을 누르면 액추에이터의 전류를 1.0A로 낮춘다.
    - 비상정지 버튼은 소프트웨어 명령만 전달하고 전원은 차단하지 않는다.
    answer_index: 1
    explanation: 비상정지 버튼은 고전류 모터 회로를 직접 차단하기엔 부적절하며, 저전류 접촉기 코일 회로의 NC 접점을 개방하는 방식이
      안전합니다.
  completion_criteria:
  - 3개의 독립 전원 분기가 회로상에서 병렬 연결되지 않고 분리됨을 멀티미터로 증명
  - 비상정지 버튼 조작 시 3개 독립 분기 전원이 동시에 차단됨을 확인
  - FSR 센서 전압 분압 회로가 3.3V 센서 레일에 올바르게 결선되었음을 확인
  - 모든 분기 회로에 10A 퓨즈가 정격에 맞게 설치됨을 문서화
  source_ids:
  - S6
  - S9
  - S12
  - S13
  - S22
  - S23
  - S24
- id: mod-7
  slug: controller-sensor-integration
  phase_id: phase-3
  title: 제어기 및 센서 통합
  estimated_hours: 15.0
  prerequisites:
  - mod-6
  objectives:
  - OpenCR 제어기 및 5지 로봇손 센서 하드웨어 인터페이스 이해
  - FSR 전압 분압 회로 설계 및 ADC 신호 취득 원리 습득
  - DYNAMIXEL 통신을 통한 액추에이터 제어 및 피드백 루프 구현
  - 안전 제어 및 비상 정지 회로 통합 방식 학습
  theory_markdown: '## 제어기 및 센서 통합 아키텍처


    로봇손의 제어 시스템은 OpenCR 1.0을 중심으로 액추에이터 구동과 감각 피드백을 통합합니다. OpenCR은 216MHz ARM Cortex-M7
    프로세서를 기반으로 DYNAMIXEL Protocol 2.0을 지원하여 정밀한 제어를 수행합니다 [S11].


    ### 센서 인터페이스: FSR 전압 분압 회로

    손끝의 힘 감지를 위해 FSR 402 센서를 사용합니다 [S10]. FSR은 압력이 증가함에 따라 저항이 감소하는 특성을 가집니다. OpenCR의
    ADC(12bit 해상도)를 이용해 힘을 측정하기 위해 전압 분압 회로를 구성합니다 [S11, S25].

    - **회로 구성**: 3.3V 센서 전원 → FSR 센서 → ADC 핀 → 10kΩ 저항 → GND

    - **원리**: 분압된 전압은 $V_{ADC} = 3.3V \times \frac{R_{fixed}}{R_{FSR} + R_{fixed}}$
    공식에 의해 산출됩니다 [S25]. 센서 전압은 반드시 OpenCR의 3.3V 센서 레일에서 공급하여 0-3.3V 범위를 유지해야 합니다 [BOM].


    ### 액추에이터 제어 및 전원 분기

    XM430-W350-T 액추에이터는 12V를 사용하며 [BOM], 이를 위해 3개의 절연형 전원 어댑터(GST160A12-R7B)를 이용해
    4/4/3대씩 독립 분기합니다 [S13]. 독립 분기는 전원 간의 전위 간섭을 방지하고 각 경로에 독립적인 10A 퓨즈를 배치하여 안전성을
    확보합니다 [BOM, S24]. 비상 정지 버튼(A22E-M-12-EMO)은 EV200 접촉기의 NC 코일 회로를 통해 3개 분기를 동시에
    차단하도록 설계되어야 합니다 [S21, S22].'
  worked_examples:
  - '예제 1: ADC 분압값 계산. FSR에 하중이 가해져 $R_{FSR}$이 5kΩ으로 변했을 때, 10kΩ 고정 저항과의 분압 전압은 $3.3V
    \times (10kΩ / (5kΩ + 10kΩ)) = 2.2V$입니다. 이는 OpenCR ADC 입력 범위(0~3.3V) 내에 안전하게 위치합니다
    [S11, S25].'
  - '예제 2: 전원 분기별 부하 검증. 분기당 액추에이터 4대 연결 시, 스톨 전류 합계는 $2.3A \times 4 = 9.2A$입니다 [BOM].
    사용된 10A 퓨즈는 9.2A 피크 부하를 통과시키고 과전류 상황에서 분기를 보호합니다 [S24].'
  lab:
    title: OpenCR 센서 인터페이스 및 안전 회로 결선
    steps:
    - OpenCR의 3.3V 센서 레일에서 5개의 FSR 402를 위한 분압 회로를 납땜한다.
    - 각 FSR에 10kΩ 저항을 직렬로 연결하여 ADC 입력 포트에 결선한다.
    - 독립된 3개의 12V 전원 분기에 10A 퓨즈 홀더를 각각 삽입한다.
    - 비상정지 스위치의 NC 접점을 EV200 접촉기의 코일 제어 회로에 연결한다.
    - 멀티미터를 사용하여 각 분기의 전원 단자 간 전기적 절연을 확인한다.
    safety:
    - 모든 배선 작업은 전원을 차단한 상태에서 수행할 것.
    - 12V 액추에이터 전원과 센서 회로는 전기적으로 완전히 분리 유지할 것.
    - 테스트 시 보안경을 착용하고 비상 정지 버튼이 정상 작동하는지 확인 후 구동할 것.
    - 양(+) 출력 단자끼리 결코 연결되지 않도록 주의할 것.
    deliverables:
    - 회로 연결 배선도
    - 각 FSR 채널별 ADC 출력값 데이터 기록
    - 전원 분기별 독립성 확인 멀티미터 측정 기록
  assignment:
    title: 통합 제어 시스템 설계 및 안전 분석
    deliverables:
    - 최종 통합 배선도 및 BOM 검증 보고서
    - FSR 센서 ADC 출력 데이터 시각화 자료
    - 비상 정지 시스템 논리 및 하드웨어 구성 보고서
    rubric:
    - 3.3V 센서 레일 사용 및 FSR 분압 회로의 올바른 구성 여부
    - 3개 전원 분기의 완전한 절연 상태 유지 및 퓨즈 용량 적정성
    - 비상 정지 회로의 하드웨어적 독립 차단 기능 구현 여부
  quiz:
  - question: OpenCR의 센서 전원 레일 사용 시 주의사항으로 올바른 것은?
    choices:
    - 12V 액추에이터 레일을 FSR 센서 전원으로 사용한다.
    - 반드시 3.3V 센서 레일을 사용하여 ADC 신호를 0-3.3V 범위 내로 제한한다.
    - 모든 FSR 센서는 5V 레일에 직접 연결한다.
    - 센서 전원은 전압 분압 없이 퓨즈를 거쳐 직접 입력한다.
    answer_index: 1
    explanation: OpenCR ADC 해상도와 보호를 위해 FSR 분압 회로는 반드시 3.3V 센서 레일을 사용해야 합니다.
  - question: 3개의 독립된 12V 전원 분기를 사용하는 주된 이유는 무엇인가?
    choices:
    - 전압을 36V로 올리기 위해
    - 액추에이터 간 전위 간섭 방지 및 독립적인 과전류 보호(퓨즈)를 위해
    - 전원 공급 장치의 총 무게를 줄이기 위해
    - 데이터 통신 속도를 높이기 위해
    answer_index: 1
    explanation: 독립 분기는 전위 간섭을 막고, 각 분기마다 독립된 퓨즈를 통해 고장 범위를 제한하여 안전성을 높입니다.
  completion_criteria:
  - 통합 제어 회로의 배선도가 BOM 및 안전 규정과 일치함
  - ADC를 통한 5개 FSR의 입력 신호 데이터가 정상 취득됨
  - 비상 정지 스위치 동작 시 3개 전원 분기의 접촉기가 즉시 차단됨
