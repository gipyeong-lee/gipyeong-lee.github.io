- id: mod-8
  slug: sensor-integration
  phase_id: phase-3
  title: 센서 신호 처리
  estimated_hours: 7.0
  prerequisites:
  - mod-7
  objectives:
  - FSR 402 센서와 전압 분압 회로의 동작 원리를 이해한다.
  - OpenCR 제어 보드의 ADC 입력을 사용하여 아날로그 힘 신호를 디지털 값으로 변환한다.
  - 센서 신호 노이즈와 데이터 범위를 분석하고 교정 과정을 실습한다.
  - 전기적으로 격리된 센서 전원과 액추에이터 전원 체계의 중요성을 숙지한다.
  theory_markdown: '### 힘 감지 센서(FSR)와 전압 분압 회로


    FSR 402는 압력이 가해지면 내부 저항이 감소하는 박막형 압저항 센서이다 [S6]. 이 센서는 직접적으로 저항값이 변하기 때문에, 마이크로컨트롤러가
    읽을 수 있는 전압 신호로 변환해야 한다. 가장 효율적인 방법은 **전압 분압(Voltage Divider)** 회로를 구성하는 것이다.


    FSR과 고정 저항(10 kΩ)을 직렬로 연결하고 전원(3.3 V)을 인가하면, FSR에 가해지는 힘에 따라 출력 전압 $V_{out}$은
    다음과 같이 계산된다 [S26]:


    $$V_{out} = V_{in} \times \frac{R_{fixed}}{R_{FSR} + R_{fixed}}$$


    여기서 $V_{in}$은 반드시 OpenCR의 3.3 V 센서 전원을 사용해야 한다. 12 V 액추에이터 전원을 이 회로에 연결하는 것은 ADC
    입력 범위를 초과하여 보드를 파괴할 수 있으므로 절대 금지한다 [S15].


    ### OpenCR ADC 데이터 처리

    OpenCR은 12-bit ADC 해상도를 지원하여 0에서 3.3 V 사이의 신호를 0에서 4095 사이의 정수 값으로 변환한다 [S15].
    힘을 직접 구하려면 센서의 저항 특성 곡선을 선형화하거나, 파지 시험 시의 출력값을 데이터화하여 매핑하는 교정(Calibration) 과정이
    필요하다 [S6].'
  worked_examples:
  - '예제 1: 3.3 V 센서 전원 분압 계산. $V_{in} = 3.3\text{ V}$, $R_{fixed} = 10\text{ kΩ}$,
    $R_{FSR} = 10\text{ kΩ}$일 때, $V_{out} = 3.3 \times (10 / (10+10)) = 1.65\text{
    V}$이다. OpenCR ADC 출력은 약 $4095 \times (1.65 / 3.3) = 2047$이 된다 [S15, S26].'
  - '예제 2: 전류 제한 및 안전. FSR 회로는 10 kΩ 저항을 사용하여 최소 저항 상태에서도 과도한 전류 흐름을 방지한다. $3.3\text{
    V} / 10\text{ kΩ} = 0.33\text{ mA}$의 매우 낮은 전류만 소비하므로 3.3 V 센서 레일의 안정성을 유지한다 [S26].'
  lab:
    title: FSR 신호 취득 및 안전 측정
    steps:
    - OpenCR 보드 전원을 차단하고 3개의 12 V 어댑터를 모두 분리한다.
    - 멀티미터를 DC 전압 모드로 설정하여 각 액추에이터 분기 커넥터에서 전압이 1 V 미만임을 확인한다.
    - FSR 402와 10 kΩ 저항을 사용하여 3.3 V 센서 레일에 전압 분압 회로를 구성한다 [S6, S26].
    - OpenCR ADC 핀에 신호선을 연결한다 [S15].
    - 전원 어댑터만 재연결하여 OpenCR 부팅 후 ADC 출력값을 시리얼 모니터로 관찰한다.
    - 손가락 패드에 힘을 가하며 ADC 출력 변화를 기록하고 데이터를 교정한다.
    safety:
    - 절대 12 V 액추에이터 전원을 ADC 회로에 연결하지 않는다 [S15].
    - 정비 및 회로 수정 전에는 반드시 3개 어댑터를 분리하고 전압을 계측한다.
    - 전원 연결 후에는 가동 범위 내에 손을 넣지 않는다.
    - 이상 발열·냄새·연기 감지 시 접근하지 말고 소프트웨어 토크 해제를 우선 수행하며, 화재 위험 시 즉시 대피한다. 전원 분리는 계획 정지
      후 정비·접근 전에만 수행한다.
    deliverables:
    - FSR 전압 분압 회로 조립 사진
    - 센서 힘(N)-ADC 출력 데이터 테이블
    - ADC 신호 노이즈 관찰 보고서
  assignment:
    title: 센서 데이터 선형화 및 파지 상태기계 구현
    deliverables:
    - ADC 값을 파지력(N)으로 변환하는 코드
    - 파지력 임계값 기반의 액추에이터 토크 제어 로직 구현
    - 최종 프로젝트 보고서 내 센서 데이터 처리 섹션
    rubric:
    - 전압 분압 회로가 3.3 V 센서 전원을 올바르게 사용하는가?
    - ADC 데이터가 0-4095 범위 내에서 안정적으로 출력되는가?
    - '센서 노이즈를 필터링하는 코드(예: 이동 평균)가 포함되었는가?'
    - 안전 수칙(전원 분리 확인)을 준수했는가?
  quiz:
  - question: OpenCR의 센서 전원 분압 회로 구성 시 가장 올바른 전원은 무엇인가?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 레일 전원
    - 5 V USB 전원
    - 어떤 전원이든 무관
    answer_index: 1
    explanation: OpenCR ADC 입력 범위를 초과하지 않기 위해 반드시 3.3 V 센서 레일을 사용해야 합니다 [S15].
  - question: 정비 또는 회로 수정 전, 보드가 무전원 상태임을 확인하는 올바른 방법은?
    choices:
    - 저항 모드로 회로 확인
    - 도통 시험(연속성 모드) 사용
    - DC 전압 모드로 3개 분기 모두 1 V 미만 확인
    - 퓨즈 분리 확인
    answer_index: 2
    explanation: 저항이나 도통 시험은 무전원 상태를 보장하지 않습니다. DC 전압 모드로 실제 전압이 제거되었는지 확인해야 합니다.
  completion_criteria:
  - 3.3 V 센서 레일 기반의 FSR 전압 분압 회로 구성 완료.
  - ADC 출력값이 파지 힘에 비례하여 0-4095 범위에서 변화함을 확인.
  - 회로 안전 절차(전압 계측 후 접촉)를 3회 이상 준수.
  - 센서 신호 취득 로직이 포함된 펌웨어 기능 구현.
  source_ids:
  - S6
  - S26
  - S15
- id: mod-9
  slug: firmware-control
  phase_id: phase-3
  title: 로봇 제어 펌웨어
  estimated_hours: 10.0
  prerequisites:
  - mod-8
  objectives:
  - DYNAMIXEL 통신 프로토콜 2.0의 구조와 데이터 패킷 형식을 이해한다.
  - OpenCR 제어기를 사용하여 스마트 액추에이터의 위치, 속도, 전류 상태를 실시간으로 제어하고 피드백받는 펌웨어를 작성한다.
  - FSR 402 센서와 분압 회로를 이용한 아날로그 힘 신호 취득 및 데이터 변환 알고리즘을 구현한다.
  - 로봇손의 전체 운전 상태기계(State Machine)를 설계하고 예외 처리를 포함한 펌웨어를 최적화한다.
  theory_markdown: '### DYNAMIXEL 제어 및 센싱 이론


    #### 1. DYNAMIXEL 통신 프로토콜 2.0

    스마트 액추에이터 XM430-W350-T는 프로토콜 2.0을 사용하며 [S14], 이는 데이터 패킷 기반의 직렬 통신을 수행합니다. 제어기(OpenCR)는
    특정 주소(Address)에 명령을 쓰거나(Write) 읽는(Read) 방식으로 액추에이터를 제어합니다. 주요 제어 항목은 Goal Position(위치),
    Goal Velocity(속도), Goal Current(전류) 등이 있으며, 각 항목은 12V 입력 전압 하에서 구동됩니다 [S14].


    #### 2. FSR 402 센서 신호 취득

    FSR 402는 가해진 힘에 따라 저항값이 변하는 가변 저항체입니다 [S6]. 이를 전압 값으로 변환하기 위해 10kΩ 고정 저항을 사용하여
    분압 회로를 구성합니다 [S26]. OpenCR의 12비트 ADC는 입력된 아날로그 전압(0~3.3V)을 0~4095의 디지털 값으로 변환합니다
    [S15]. 이때 반드시 3.3V 센서 전원 레일을 사용하여 ADC 입력을 보호해야 하며, 12V 액추에이터 전원과 전기적으로 분리하여야 합니다
    [S15].


    #### 3. 펌웨어 아키텍처

    로봇손 펌웨어는 고속 루프 내에서 상태기계를 운용합니다. ''초기화'', ''대기'', ''파지 동작'', ''힘 제어'', ''에러 복구''
    상태를 포함하며, 액추에이터의 피드백 데이터를 실시간으로 모니터링하여 과전류 발생 시 즉시 제어를 중단하는 토크 해제 알고리즘을 수행해야 합니다.'
  worked_examples:
  - '예제 1: 액추에이터 위치 제어 명령 생성. DYNAMIXEL 프로토콜을 사용하여 Goal Position 주소에 특정 값을 쓰기 위한 패킷
    구조(Header, ID, Length, Instruction, Parameter, Checksum)를 설계합니다 [S14].'
  - '예제 2: ADC 값의 힘(N) 변환. 분압 회로 이론(V_out = V_in * (R_fixed / (R_fixed + R_FSR)))을
    적용하고, FSR 402 데이터시트의 저항-힘 곡선을 근사화하여 디지털 ADC 값으로부터 0.2N~20N 범위의 힘을 계산합니다 [S6, S26].'
  - '예제 3: 계획 정지 및 상태 전환. DYNAMIXEL의 전류 피드백 값이 스톨 전류(2.3A)에 근접할 경우, 소프트웨어 토크 해제 명령을
    전송하여 하드웨어 파손을 방지하는 동작 제한 로직을 구현합니다 [S14].'
  lab:
    title: 로봇손 펌웨어 제어 및 센서 피드백 실습
    steps:
    - 퓨즈 제조사 데이터시트의 정격과 시간-전류 곡선 검토 기록.
    - 각 액추에이터의 ID를 중복되지 않게 설정하고 통신 속도를 동기화한다.
    - ADC 입력 신호를 측정하여 센서에 힘이 가해지지 않았을 때의 베이스라인 전압을 기록한다.
    - 손가락 제어 펌웨어를 업로드하고 무부하 상태에서 각 관절의 이동 범위(Limit)를 확인한다.
    - 지그(Jig)에 고정된 상태에서 프로그래밍된 파지 동작을 수행하며 시리얼 모니터로 액추에이터 피드백과 센서 힘 데이터를 로그 기록한다.
    safety:
    - 전원 인가 전 반드시 3개 독립 어댑터의 출력 전압이 각 분기에서 12V임을 멀티미터로 확인한다.
    - 로봇 가동 중에는 손가락 관절 사이에 손가락을 넣지 않으며, 반드시 보안경을 착용한다.
    - 이상 발열·냄새·연기 감지 시 접근하지 말고 소프트웨어 토크 해제를 우선 수행하며, 화재 위험 시 즉시 대피한다. 전원 분리는 계획 정지
      후 정비·접근 전에만 수행한다.
    - 정비 전 전원 분리 후 각 전원 버스에서 1V 미만임을 멀티미터로 반드시 확인한다.
    - 액추에이터 스톨 전류(2.3A)를 초과하는 지속적 부하를 금지한다 [S14].
    deliverables:
    - 정상 동작 및 에러 상황이 포함된 데이터 로그 파일
    - 관절별 위치 제어 성능 시험 결과 보고서
    - 최종 펌웨어 소스 코드
  assignment:
    title: 로봇손 제어기 펌웨어 통합 설계
    deliverables:
    - 운전 상태기계 순서도(Flowchart)
    - 위치 및 힘 제어 알고리즘 소스 코드
    - 에러 모니터링 및 안전 정지 구현 상세 보고서
    rubric:
    - 상태기계가 논리적 오류 없이 설계되었는가?
    - 액추에이터 피드백을 활용한 안전 토크 해제가 즉각적으로 구현되었는가?
    - 센서 데이터 변환 정확도가 FSR 사양을 만족하는가?
    - 제출된 코드 내 안전 지침 준수 여부(전압 확인 등)
  quiz:
  - question: OpenCR 제어기에서 FSR 402 센서를 연결할 때 올바른 전원 레일은 무엇인가?
    choices:
    - 12V 액추에이터 전원
    - 3.3V 센서 전원
    answer_index: 1
    explanation: OpenCR 사양에 따라 FSR 전압 분압 회로는 반드시 3.3V 센서 전원 레일을 사용해야 하며, 12V 전원과 전기적으로
      분리되어야 ADC를 보호할 수 있습니다 [S15].
  - question: XM430-W350-T 액추에이터의 스톨 전류(Stall Current)는 얼마인가?
    choices:
    - 2.3 A
    - 11.5 A
    answer_index: 0
    explanation: XM430-W350-T의 데이터시트에 명시된 스톨 전류는 2.3 A입니다 [S14]. 11.5 A는 전원 어댑터의 정격
      출력 전류입니다 [S16].
  - question: 로봇손의 정비나 접근 전 반드시 수행해야 할 안전 절차는 무엇인가?
    choices:
    - 소프트웨어 정지 명령만 수행
    - 전원 어댑터 분리 후 멀티미터로 모든 분기 전압이 1V 미만임을 확인
    answer_index: 1
    explanation: 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다.
  completion_criteria:
  - 모든 실습 예제 및 과제 제출
  - 상태기계 기반 펌웨어의 무부하 시 에러 없는 파지 동작 검증
  - 안전 절차에 따른 전원 분리 및 전압 측정 절차 준수 확인
  source_ids:
