modules:
- id: M1
  slug: kinematics-intro
  phase_id: P1
  title: 로봇 손 기구학 기초
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - 로봇 손의 기본 기구학적 구조를 이해한다.
  - 자유도(DoF)의 개념과 손가락 및 손바닥 동작 간의 관계를 분석한다.
  - 엄지 대립(Opposability)을 향상시키기 위한 손바닥 자유도의 역할을 파악한다.
  - 작업 공간(Workspace) 볼륨을 통해 로봇 손의 성능을 정량적으로 평가하는 방법을 배운다.
  theory_markdown: '### 로봇 손 기구학 기초


    로봇 손은 복잡한 환경에서 대상과 상호작용하기 위한 핵심 엔드 이펙터입니다. 인간의 손은 정교한 기구학적 구조를 바탕으로 파워 파악(Power
    grasp) 및 정밀 조작(Precision task)을 모두 수행할 수 있습니다 [S1].


    #### 1. 자유도(Degrees of Freedom, DoF)와 운동학

    로봇 손의 설계에서 각 손가락과 손바닥의 자유도는 전체 조작 범위와 상호작용 능력을 결정합니다. 일반적으로 엄지는 5 자유도를 가지며, 나머지
    네 손가락은 3~4 자유도를 가집니다 [S1].


    #### 2. 손바닥 자유도의 역할

    전통적인 로봇 손은 손가락 움직임에 집중했으나, 최근 연구는 손바닥 자체에 자유도를 추가하는 방식을 고려합니다. 이는 손가락 기반의 연결 범위를
    단순히 넓히는 것을 넘어, 손가락의 기저 위치를 재배치함으로써 엄지의 대립 기능을 효과적으로 개선합니다 [S1].


    #### 3. 작업 공간 분석(Overlap Workspace)

    로봇 손의 기능성을 정량적으로 평가하기 위해 ''복셀 기반 작업 공간 볼륨(Voxel-based workspace volume)'' 개념을
    사용합니다. 이는 각 손가락 끝이 도달할 수 있는 영역을 복셀로 분할하여, 엄지와 다른 손가락들이 상호작용할 수 있는 겹침(Overlap)
    공간을 계산하는 방식입니다 [S1].


    #### 4. 설계 트레이드오프

    전체 자유도가 제한된 경우, 손가락의 자유도를 손바닥으로 재배치하면 작업 공간 확장에 따른 이점과 로봇 구조의 기구학적 중복성 사이의 트레이드오프가
    발생합니다. 따라서 손바닥과 손가락 자유도는 통합적으로 설계되어야 합니다 [S1].'
  worked_examples:
  - '예제 1: 5 자유도 엄지와 3 자유도 검지를 가진 로봇 손에서 손바닥 자유도를 추가하여 엄지와 검지의 겹침 작업 공간 볼륨이 15% 증가했을
    때, 기구학적 중복성을 평가하는 방법은 무엇인가? -> 해설: 추가된 손바닥 자유도가 기저 위치를 이동시켜 작업 공간을 최적화했는지 확인하고,
    손가락 자체의 조작 범위가 줄어들지는 않았는지(기구학적 중복성 분석)를 비교 평가한다.'
  - '예제 2: 전체 자유도 20을 유지하면서 손가락 자유도를 1개 줄이고 손바닥 자유도를 1개 추가할 때 발생하는 기구학적 효과는? -> 해설:
    손가락 끝의 도달 범위는 다소 줄어들 수 있으나, 엄지 대립성이 향상되어 전체적인 파악 작업(Grasp task)의 유연성은 증대될 것으로
    예상된다 [S1].'
  lab:
    title: 로봇 손의 작업 공간 시뮬레이션 기초
    steps:
    - 제공된 로봇 손 모델 파일(.urdf 또는 .step)을 CAD 소프트웨어에서 연다.
    - 각 손가락과 손바닥의 회전 관절(Revolute joints)을 지정한다.
    - 복셀 기반 작업 공간 도구를 사용하여 각 손가락의 도달 가능 영역(Reachability)을 생성한다.
    - 손바닥 자유도를 회전시켜 겹침 작업 공간(Overlap workspace)의 볼륨 변화를 측정한다.
    safety:
    - 컴퓨터 시뮬레이션 중 전력 공급 장치(벤치 전원)는 반드시 전류 제한을 설정한다.
    - 실제 프로토타입 조립 시 끼임 방지 가이드라인을 준수한다.
    - 납땜 및 수공구 사용 시 보안경을 착용한다.
    deliverables:
    - 손바닥 자유도 유무에 따른 작업 공간 볼륨 비교 데이터 시트
    - 각 손가락 관절 구조 분석 보고서
  assignment:
    title: 5지 로봇 손의 대립 기능 향상 설계 전략
    deliverables:
    - 손바닥 자유도가 대립 기능에 미치는 영향 분석서
    - 제안된 로봇 손의 관절 배치 도면
    rubric:
    - 자유도 재배치의 기구학적 근거가 명확한가?
    - 작업 공간 볼륨 분석이 정량적인가?
    - 엄지 대립 향상에 대한 이론적 논리가 타당한가?
  quiz:
  - question: 로봇 손 설계에서 손바닥 자유도(Palm DoF)가 주로 개선하는 기능은 무엇인가?
    choices:
    - 손가락의 최대 속도
    - 엄지의 대립 기능(Opposability)
    - 손바닥의 강성
    - 전체 무게 감소
    answer_index: 1
    explanation: 손바닥 자유도는 손가락 기저 위치를 재배치하여 엄지와 다른 손가락들 간의 겹침 작업 공간을 최적화함으로써 대립 기능을
      향상시킵니다 [S1].
  - question: 작업 공간 볼륨을 정량적으로 평가하기 위해 언급된 방법론은?
    choices:
    - 복셀 기반 분석(Voxel-based analysis)
    - 유한 요소 해석(FEA)
    - 열화상 분석
    - 간섭계 분석
    answer_index: 0
    explanation: 본 연구에서는 손가락 끝 도달 가능 영역을 복셀로 분할하여 작업 공간을 평가하는 방법을 사용합니다 [S1].
  - question: 전체 자유도가 제한된 상태에서 손가락 자유도를 손바닥으로 재배치할 때 발생하는 문제점은?
    choices:
    - 배터리 효율 저하
    - 기구학적 중복성과 작업 공간 확장 사이의 트레이드오프
    - 통신 지연 증가
    - 재료의 피로도 증가
    answer_index: 1
    explanation: 자유도 재배치는 작업 공간 확장이라는 이점과 동시에 기구학적 중복성 문제와 관련된 트레이드오프를 발생시킵니다 [S1].
  completion_criteria:
  - 로봇 손 기구학 기초 모듈의 퀴즈를 80% 이상 득점한다.
  - 로봇 손의 자유도 및 작업 공간 분석 실습을 완료하고 보고서를 제출한다.
  source_ids:
  - S1
- id: M2
  slug: actuation-theory
  phase_id: P1
  title: 적응형 구동 원리
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 적응형 로봇손 구동 기구의 기본 원리 이해
  - 건 구동(Tendon-driven) 메커니즘의 정역학적 해석 능력 습득
  - 능동적 자유도(DOF)와 구동기 비율 최적화 개념 파악
  - 모멘트 암 풀리를 이용한 다축 운동 동시 제어 기법 학습
  theory_markdown: '### 적응형 구동 기구(Adaptive Actuation Mechanism)


    인간형 로봇손의 핵심은 적은 수의 구동기로 복잡한 손가락 움직임을 구현하는 것입니다. 이를 위해 **적응형 구동(Adaptive Actuation)**
    메커니즘이 사용됩니다 [S2].


    #### 1. 건 구동 시스템(Tendon-driven System)

    건 구동은 근육과 힘줄처럼 원격 위치에 있는 모터로부터 힘을 전달하는 방식입니다. 로봇손에서는 유연성과 경량화를 위해 필수적입니다.


    #### 2. 차동 및 모멘트 암(Moment Arm Pulleys)

    손가락의 중수지절(MCP) 관절에서 굴곡/신전(flexion/extension)과 외전/내전(abduction/adduction)을 동시에
    제어하기 위해 모멘트 암 풀리를 사용합니다. 이를 통해 건을 측면으로 유도하여 두 동작을 동시에 수행할 수 있습니다 [S2].


    #### 3. 정역학적 해석

    로봇 손가락의 정적 평형 상태에서 각 관절에 전달되는 건의 힘($F_{tendon}$)을 계산하는 것은 기구 설계의 필수 단계입니다. 관절의
    강성과 마찰(friction)은 구동 효율에 직접적인 영향을 미치며, 설계 시 이들에 대한 정밀한 모델링이 필요합니다 [S2].'
  worked_examples:
  - '예제 1: 5지 로봇손에서 4개의 모터로 5개의 손가락을 구동할 때, 구동기/손가락 비율(Ratio of actuators per finger)
    계산. 4개의 모터 / 5개의 손가락 = 0.8. 이 비율이 1.0 미만일 때 차동 메커니즘을 통한 적응형 제어가 필수적임을 확인 [S2].'
  - '예제 2: 특정 외전 각도(Abduction angle)를 구현하기 위한 모멘트 암 풀리의 반지름 $r$ 계산. 기하학적 관계식 $L =
    r \theta$를 활용하여 외전 시 건의 당김 길이를 산출.'
  lab:
    title: 건 구동 메커니즘 모사 및 마찰 분석
    steps:
    - 3D 프린팅된 손가락 링크와 모멘트 암 풀리를 조립한다.
    - 건(Tendon)을 경로에 맞게 라우팅하고 적절한 텐션을 설정한다.
    - 벤치 전원을 사용하여 구동기를 동작시키고 외전 및 굴곡 동작을 관찰한다.
    - 멀티미터를 이용해 모터 소비 전류를 측정하여 부하에 따른 토크 변화를 기록한다.
    safety:
    - 저전압 벤치 전원 사용 필수 (최대 12V 이내)
    - 전류 제한 회로 구성 및 준수 (모터 보호)
    - 동작 중 손가락 끼임 주의
    - 작업 시 보안경 착용
    deliverables:
    - 마찰 및 부하에 따른 구동 토크 데이터 시트
    - 외전 각도에 따른 건 변위 측정 결과
  assignment:
    title: 건 구동 로봇손 설계 파라미터 최적화 보고서
    deliverables:
    - 설계 파라미터(풀리 반지름, 링크 길이) 결정 근거가 포함된 CAD 요약본
    - 외전 및 굴곡 동시 수행 시의 정역학적 평형 방정식 유도 문서
    rubric:
    - 적응형 메커니즘의 수학적 모델링 정확성 (40%)
    - 선택된 설계 파라미터의 타당성 (30%)
    - 마찰 모델 고려 및 실험적 검증 데이터의 충실도 (30%)
  quiz:
  - question: 로봇손에서 구동기/손가락 비율이 1.0보다 작을 때 발생하는 현상은?
    choices:
    - 모든 손가락을 독립적으로 제어할 수 있다.
    - 복잡한 기구적 차동 메커니즘이 필요하다.
    - 모터 출력을 무한히 늘려야 한다.
    - 관절의 마찰이 무시된다.
    answer_index: 1
    explanation: 구동기 수가 손가락 수보다 적으므로, 힘을 배분하거나 동작을 연동하는 차동 메커니즘이 반드시 필요합니다 [S2].
  - question: 모멘트 암 풀리를 사용하는 주된 이유는 무엇인가?
    choices:
    - 손가락의 무게를 줄이기 위해
    - 건의 마찰을 제거하기 위해
    - 굴곡과 외전 동작을 동시에 제어하기 위해
    - 모터의 회전 속도를 높이기 위해
    answer_index: 2
    explanation: 모멘트 암 풀리는 건을 측면으로 유도하여 단일 건 구동으로도 다축 운동(굴곡+외전)이 가능하게 합니다 [S2].
  completion_criteria:
  - 이론 학습 완료 및 퀴즈 80% 이상 득점
  - 건 구동 메커니즘 모사 실험 완료 및 데이터 시트 제출
  - 설계 파라미터 최적화 보고서 제출 및 통과
  source_ids:
  - S2
- id: M3
  slug: sensor-fusion
  phase_id: P1
  title: 촉각 센서 및 데이터 해석
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - 촉각 센서의 물리적 원리와 로봇 손에서의 역할을 이해한다.
  - 시각-촉각 융합(Vision-Tactile Fusion)이 조작 안정성에 미치는 영향을 분석한다.
  - 접촉 상태 추정, 슬립 검출, 경도 추론의 알고리즘 원리를 학습한다.
  - 로봇 손에 적합한 최적의 촉각 센서 배치 전략을 설계한다.
  theory_markdown: '### 1. 촉각 센싱의 개요

    로봇 손의 정교한 조작(Dexterous Manipulation)을 위해 촉각 센서는 접촉 상태 추정, 슬립 검출, 물체의 질감 및 강성 추론을
    담당한다 [S4]. 이는 시각 정보만으로는 해결하기 어려운 접촉 불확실성을 해소하는 핵심 기술이다 [S4].


    ### 2. 시각-촉각 융합 (Vision-Tactile Fusion)

    시각 정보는 전체적인 물체의 위치와 자세를 파악하는 데 유리하지만, 미세한 접촉력이나 물체가 손가락에서 미끄러지는 현상을 감지하기 어렵다.
    촉각 데이터를 시각 정보와 융합하면 순수 시각 기반 제어보다 강력한 조작 안정성을 확보할 수 있다 [S4].


    ### 3. 주요 감지 기술

    - **슬립 검출(Slip Detection):** 센서 표면의 진동이나 압력 분포 변화를 실시간 분석하여 파지 물체의 이탈을 방지한다 [S4].

    - **강성 추론(Stiffness Inference):** 접촉 면적과 인가된 힘의 변화율을 측정하여 물체의 변형 정도를 계산한다 [S4].

    - **최적 배치:** 모든 손가락에 균일하게 센서를 배치하는 것보다, 조작 작업의 특성과 인간의 손 구조를 모방한 최적 배치 전략이 성능
    향상에 중요하다 [S3].'
  worked_examples:
  - '예제 1: 1D 압력 센서 데이터를 이용한 단순 경도 추론. 물체에 1N의 힘을 가했을 때 센서 접촉 면적이 2mm²에서 4mm²로 변했다면,
    이를 통해 물체의 상대적 변형률을 계산하고 강성을 추정하는 과정.'
  - '예제 2: 시각-촉각 융합 제어 루프 설계. 카메라가 물체의 위치를 10Hz로 업데이트하고, 촉각 센서가 100Hz로 슬립 신호를 검출할
    때, 슬립 발생 시 제어기가 즉시 악력(Grip Force)을 증가시키는 하이브리드 제어 로직.'
  lab:
    title: 저항식 압력 센서를 이용한 슬립 검출 테스트
    steps:
    - FSR(압력 센서)을 3D 프린팅된 로봇 손가락 끝단에 부착한다.
    - 벤치 전원 장치를 사용하여 센서 회로에 5V를 인가한다.
    - 멀티미터를 이용해 무부하 상태와 물체를 쥐었을 때의 저항 변화를 기록한다.
    - 물체를 쥐고 점진적으로 힘을 빼면서 저항값 변화를 통해 '슬립(Slip)' 시점의 신호를 검출한다.
    safety:
    - 저전압 벤치 전원 장치의 전류 제한을 반드시 500mA 이하로 설정한다.
    - 납땜 작업 시 보안경을 착용한다.
    - 동작 테스트 중 로봇 손가락 사이에 손가락이 끼이지 않도록 주의한다.
    deliverables:
    - 센서 압력-저항 데이터 그래프
    - 슬립 검출 임계값 정의서
  assignment:
    title: 5지 로봇손을 위한 촉각 센서 배치 전략 보고서
    deliverables:
    - 촉각 센서 배치 설계도(CAD 기반)
