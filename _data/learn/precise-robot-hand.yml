modules:
- id: M1
  slug: intro-robotics
  phase_id: PH1
  title: 로봇 공학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇공학의 기본 개념과 5지 로봇손 설계의 핵심 요소 이해
  - DYNAMIXEL 스마트 액추에이터의 제어 원리와 통신 프로토콜 파악
  - 하드웨어 전원 분기 구성과 안전한 전기적 연결 및 퓨즈 보호 원리 습득
  - FSR 힘 센서를 활용한 압력 데이터 취득과 전압 분압 회로 설계
  theory_markdown: '### 로봇공학 개요와 5지 로봇손 설계

    로봇공학은 기구학, 제어, 전자공학의 융합체입니다. 5지 로봇손은 인간의 손을 모사하여 복잡한 환경에서 객체를 조작하는 엔드 이펙터(End-effector)로,
    각 손가락 관절을 구동하기 위한 액추에이터 배치, 강성을 유지하는 링크 설계, 그리고 센서를 통한 피드백 제어가 필수적입니다 [S9].


    ### 스마트 액추에이터와 전원 시스템

    DYNAMIXEL XM430-W350-T는 내부에 위치, 속도, 전류 피드백을 통합하여 정밀한 위치 및 힘 제어가 가능합니다 [S12]. 구동
    시 필요한 고전류는 안정적인 전원 분배를 통해 공급되어야 합니다. 시스템은 12V 138W 절연형 어댑터 3개를 사용하여 액추에이터를 4대/4대/3대
    단위로 나누어 배분합니다 [S16]. 각 분기는 독립적인 10A ATOF 퓨즈로 보호되어 과전류로 인한 배선 손상을 방지합니다 [S26].
    **중요: 독립 전원 공급 장치의 양(+) 출력은 서로 연결하거나 합산해서는 안 됩니다.**


    ### 힘 센서와 ADC 신호 취득

    손끝의 접촉력을 감지하기 위해 FSR 402 센서를 사용합니다 [S13]. 이 센서는 가해지는 힘에 반비례하여 저항이 감소하는 특성을 갖습니다.
    OpenCR 제어 보드의 ADC 채널을 활용해 데이터를 취득하기 위해 10kΩ 저항과 함께 전압 분압 회로를 구성합니다 [S14, S27].
    이때 반드시 3.3V 센서 전원 레일을 사용해야 하며, 신호 입력 전압은 0~3.3V 범위를 초과하지 않아야 합니다 [S14].'
  worked_examples:
  - '전원 분기 계산: XM430-W350-T의 스톨 전류는 2.3A입니다 [S12]. 4대 액추에이터의 스톨 전류 합계는 9.2A입니다. 10A
    ATOF 퓨즈는 9.2A 미만의 피크 전류에서는 안정적으로 작동하고, 회로 고장 시 10A 초과 전류에서 차단되어 전체 시스템을 보호합니다
    [S26].'
  - 10 kΩ 풀다운 분압기는 $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$를 사용한다 [S27].
    센서에 힘이 가해지지 않을 때 R_FSR은 매우 높으므로 V_out은 3.3V에 가깝고, 힘이 최대일 때 R_FSR이 낮아지면 V_out은
    0V에 가까워집니다. 이 범위 내에서 12비트 ADC 해상도를 사용하여 힘을 정밀하게 측정할 수 있습니다 [S14].
  lab:
    title: 안전한 전원 분기 구성 및 센서 분압 회로 구축
    steps:
    - 3개의 독립 12V 어댑터와 10A 퓨즈 홀더를 사용하여 액추에이터용 분기를 준비합니다 [S16, S25].
    - 각 액추에이터 분기의 양(+) 출력에 10A 퓨즈를 삽입합니다 [S26].
    - FSR 센서와 10kΩ 저항을 사용하여 OpenCR 보드의 3.3V 센서 전원 레일에 전압 분압 회로를 구성합니다 [S14, S27].
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기의 출력 전압이 12V인지 확인합니다.
    - 소프트웨어를 통해 전원을 해제하고, 멀티미터로 1V 미만인지 확인한 후 배선 조립을 진행합니다.
    safety:
    - 모든 전원 작업 전 보안경을 반드시 착용하십시오.
    - 독립된 각 어댑터의 출력 단자를 절대로 병렬로 연결하지 마십시오.
    - 시스템 조립 및 정비 전 3개의 전원 어댑터를 물리적으로 분리하십시오.
    - 전원 분리 후 멀티미터를 DC 모드로 설정하여 각 분기 전압이 1V 미만임을 반드시 계측 확인하십시오.
    - 저항 모드나 연속성 모드를 전원 차단 확인 용도로 사용하지 마십시오.
    deliverables:
    - 각 전원 분기의 12V 출력 계측 사진
    - FSR 분압 회로 배선도
    - 무부하 상태에서의 전압 확인 기록
  assignment:
    title: 5지 로봇손 시스템 아키텍처 및 전력 분석 보고서
    deliverables:
    - 액추에이터 배치 및 전원 분배 설계도
    - 시스템 피크 전류 분석 계산서
    - FSR 센서 ADC 해상도 활용 전략
    rubric:
    - 전원 분기 및 독립성 원칙 준수 여부
    - 스톨 전류 및 퓨즈 용량 계산의 정확성
    - ADC 입력 범위 및 전압 분압 회로 설계의 타당성
  quiz:
  - question: 다음 중 전원 공급과 안전에 관한 설명으로 올바른 것은 무엇입니까?
    choices:
    - 독립된 12V 어댑터의 양(+) 단자는 더 높은 전류 용량을 위해 병렬로 연결해야 한다.
    - 각 전원 분기는 독립적으로 운영하며 어댑터 출력 단자를 절대 합치지 않는다.
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
    - 퓨즈는 비상시 전원을 물리적으로 차단하는 계획 정지 장치 역할을 한다.
    answer_index: 1
    explanation: 독립 전원 분기의 양(+) 단자를 병렬로 연결하는 것은 절대 금지되며, 각 분기는 독립적으로 운영해야 합니다. 전원
      차단 확인은 DC 전압 모드를 사용하며, 저항 모드는 안전 확인 수단이 아닙니다.
  - question: FSR 센서 분압 회로 구성 시 OpenCR 보드에서 사용해야 하는 전원 레일은?
    choices:
    - 12V 액추에이터 전원
    - 5V 레일
    - 3.3V 센서 전원 레일
    - 어떤 전압 레일이든 무관
    answer_index: 2
    explanation: OpenCR 제어 보드의 ADC 입력 보호와 정확한 측정을 위해 반드시 3.3V 센서 전원 레일을 사용하여야 합니다.
  completion_criteria:
  - 하드웨어 전원 분기 구축 및 계측 완료
  - FSR 힘 센서 회로 설계 및 ADC 데이터 취득 검증
  - 전원 안전 수칙을 준수한 배선 및 정지 절차 이해
  source_ids:
  - S9
  - S12
  - S16
  - S26
  - S13
  - S14
  - S27
  - S25
- id: M2
  slug: hand-design
  phase_id: PH1
  title: 로봇손 기구학 설계
  estimated_hours: 15.0
  prerequisites:
  - M1
  objectives:
  - 로봇손의 기구학적 설계 원리를 이해하고 링크 기반 기구 메커니즘을 파악한다.
  - 텐던 구동 방식의 동역학적 특성을 이해하고 설계에 반영한다.
  - CAD 도구를 활용한 로봇손 링크 및 관절 모듈 설계 방식을 습득한다.
  theory_markdown: "## 로봇손 기구학 및 텐던 설계 이론\n\n로봇손은 복잡한 환경에서의 파지 및 조작을 위해 인간의 손 구조를\
    \ 모방한다. 기구학적 설계의 핵심은 자유도(DOF, Degree of Freedom)와 텐던(Tendon) 구동 메커니즘의 동기화이다. \n\
    \n### 1. 링크 기반 기구 메커니즘\n대부분의 정교한 로봇손은 링크 기반의 메커니즘을 사용하여 좁은 공간 내에서 3자유도 이상의 손가락\
    \ 움직임을 구현한다 [S2, S3]. 각 링크는 회전 관절(Revolute joint)로 연결되며, 관절의 배치에 따라 파지 형태가 결정된다.\n\
    \n### 2. 텐던 구동 동역학\n텐던 구동은 액추에이터의 위치를 손바닥이나 손목 영역으로 이동시켜 손가락을 경량화할 수 있게 한다 [S10].\
    \ 이때 사용되는 텐던 라인(Dyneema SK78 등)은 파단 하중(230 daN)과 작동 신율(1% 미만)이 핵심 설계 지표이다 [S17].\
    \ 텐던은 반복 굽힘과 캡스턴(Capstan) 모서리와의 마찰을 견뎌야 하므로, 캡스턴 모서리의 라운딩 처리가 필수적이다 [S17].\n\n\
    ### 3. 모듈화 설계\n로봇손의 모듈화는 손가락 교체 및 정비 효율을 높인다 [S2]. 8mm 정밀 알루미늄 샤프트와 igus JSM-0810-10\
    \ 베어링을 사용하여 관절 회전축의 유격을 제어하고 마찰을 최소화한다 [S18, S19]. 또한, PC-CF 소재 출력물에 M3 황동 열압입\
    \ 인서트를 사용하여 반복 조립 시에도 재현성을 유지한다 [S20, S22]."
  worked_examples:
  - '예제 1: 텐던 라인의 파단 안전율 계산. 요구되는 최대 장력이 500 N일 때, 파단 하중 230 daN(약 2300 N)인 Dyneema
    SK78을 사용하면 안전율은 2300 / 500 = 4.6배이다 [S17].'
  - '예제 2: 관절 샤프트 공차 검토. 8mm 내경 베어링(JSM-0810-10)을 사용 시, 8mm 알루미늄 샤프트를 선택하여 유격을 최소화하되
    하우징 구멍의 치수 정밀도에 따라 베어링이 압입되도록 설계한다 [S18, S19].'
  lab:
    title: 로봇손 관절 링크 CAD 설계 및 조립 검증
    steps:
    - 선택한 액추에이터(XM430-W350-T)의 모터 고정부와 관절 회전축 치수를 측정하여 CAD 기본 스케치를 작성한다 [B1].
    - 8mm 샤프트와 JSM-0810-10 베어링이 들어갈 관절 하우징을 설계하고, 열압입 인서트(HTBI-M3-BR)를 위한 4mm 파일럿
      홀을 배치한다 [B8, B9, B-SHAFT].
    - 설계된 링크 모델을 PC-CF 필라멘트로 FDM 출력한다 (경화강 노즐 사용) [B7].
    - 출력물에 인서트를 열압입하고, 베어링과 샤프트를 조립하여 회전 유격을 검증한다.
    - 텐던 라인을 연결하여 구동 시 텐던이 통과하는 모서리 부위에 과도한 마찰이 발생하는지 육안 및 손으로 확인한다.
    safety:
    - 납땜 인두 및 인서트 열압입 도구 사용 시 화상 주의.
    - FDM 프린터 예열 시 베드 온도 110℃에 의한 화상 주의 [B7].
    - 회전체 조립 시험 시 손가락이 가동 범위에 들어가지 않도록 주의.
    - 실습 중 보안경 상시 착용.
    deliverables:
    - 로봇손 관절 링크 CAD 파일 (STL/STEP).
    - 조립된 관절 모듈의 사진 및 회전 유격 측정 기록.
    - 사용된 인서트 및 베어링 조립 부위 치수 분석 보고서.
  assignment:
    title: 5지 로봇손 설계 기획서 작성
    deliverables:
    - 로봇손의 전체 자유도 구성 도면 (손가락당 자유도 포함).
    - 텐던 구동 경로 및 액추에이터 배치 계획안.
    - 관절 모듈의 BOM 호환성 검토표 (BOM 기반 필수 부품 적용 여부).
    rubric:
    - 기구학적 구성이 5지 로봇손의 기능을 적절히 구현하는가.
    - BOM에 명시된 필수 부품(베어링, 인서트, 샤프트 등)이 설계에 반영되었는가.
    - 설계 근거가 이론적 배경(텐던 신율, 강성 등)을 바탕으로 기술되었는가.
  quiz:
  - question: 로봇손 링크 모듈 조립 시 반복 정밀도를 높이기 위해 사용하는 부품은 무엇입니까?
    choices:
    - M3 황동 열압입 나사산 인서트
    - 일반 나사 직접 체결
    - 접착제 고정
    - 압입용 플라스틱 리벳
    answer_index: 0
    explanation: PC-CF 출력물에 반복적으로 나사를 조립할 경우 내구성과 재현성을 위해 황동 열압입 인서트를 사용해야 합니다 [B9].
  - question: 텐던 라인으로 사용되는 Dyneema SK78의 주요 특성 중 설계 시 고려해야 할 핵심 요소는 무엇입니까?
    choices:
    - 높은 전기 전도성
    - 1% 미만의 낮은 작동 신율
    - 매우 높은 무게
    - 반복 굽힘 시 파단 방지 기능 없음
    answer_index: 1
    explanation: Dyneema SK78은 매우 낮은 신율(1% 미만)과 높은 파단 하중을 가져 정교한 텐던 구동에 적합합니다 [B6,
      S17].
  completion_criteria:
