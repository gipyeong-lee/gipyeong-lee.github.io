  - mod-9
  objectives:
  - 로봇 시스템의 전반적인 성능 데이터를 수집하고 분석한다.
  - 시스템의 실제 성능과 설계 목표 간의 차이를 평가한다.
  - 정량적 지표를 기반으로 로봇의 제어 알고리즘 및 구조적 안정성을 검증한다.
  - 기술 보고서 작성 형식을 통해 연구 결과를 체계적으로 문서화한다.
  theory_markdown: '### 로봇 시스템의 성능 평가 및 분석

    로봇 시스템의 최종 성능 평가는 설계 단계에서 정의된 요구사항(Requirements)과 실제 구현된 시스템의 출력 간의 상관관계를 확인하는
    필수 과정입니다 [S7]. 정교한 5지 로봇손의 경우, 액추에이터의 응답성, 센서의 정확도, 제어 시스템의 안정성이 성능을 결정하는 핵심 요소입니다
    [S12, S13].


    #### 1. 주요 성능 지표(KPI)

    - **정밀도 및 정확도**: 관절 구동 명령과 실제 출력 각도의 오차를 분석하여 시스템의 정밀도를 정량화합니다.

    - **동적 응답 특성**: 시스템이 단계적 입력(Step Input)에 대해 얼마나 신속하고 안정적으로 반응하는지(오버슈트 및 정착 시간)를
    평가합니다.

    - **파지력 피드백 성능**: `FSR 402` 센서를 통해 측정된 힘 데이터를 제어 알고리즘이 효과적으로 처리하여 파지력을 제어하고 있는지
    분석합니다 [S13].

    - **시스템 안정성**: 전력 분기 시스템(예: 3개의 `GST160A12-R7B` 어댑터 구성)의 부하 분산 상태와 비상 정지(EV200
    접촉기) 작동의 신뢰성을 확인합니다 [S16, S23].


    #### 2. 데이터 분석 방법론

    실험 데이터는 시간 영역(Time Domain)에서의 변화를 그래프로 시각화하여 분석하며, 통계적 분석(평균, 표준편차)을 통해 반복 실험에
    대한 시스템의 재현성을 검증합니다. 측정된 성능 지표가 시스템의 물리적 한계(예: 액추에이터 스톨 토크 4.1 N·m)를 초과하지 않는지 확인하는
    것은 안전 및 신뢰성 측면에서 필수적입니다 [S12].'
  worked_examples:
  - '예제 1: 파지력 센서 데이터 정규화. FSR 402 센서의 원시 데이터(ADC 값)를 0.2N에서 20N 사이의 물리적 힘 단위로 변환하는
    선형 보간 알고리즘을 적용하고, 실험값과 오차를 계산하여 그래프로 도출함 [S13].'
  - '예제 2: 전원 시스템 전류 부하 분석. 로봇손의 모든 액추에이터가 최대 부하(스톨 전류 2.3A x 11 = 25.3A)를 동시에 요청할
    때, 3개의 전원 분기 시스템(어댑터당 11.5A)이 충분한 전류를 공급하는지 계산하고, 실제 측정 전류값과 비교하여 안전 마진(Safety
    Margin)을 평가함 [S12, S16].'
  lab:
    title: 최종 통합 성능 측정 및 검증
    steps:
    - 1. 모든 하드웨어 모듈의 연결 상태 및 비상 정지 스위치 정상 작동 여부를 점검한다.
    - 2. 시스템에 전원을 공급하고 각 관절의 제로점을 보정(Calibration)한다.
    - 3. 5지 로봇손을 이용해 지정된 물체를 파지하는 테스트를 수행하며, 실시간으로 힘 데이터와 액추에이터 전류 데이터를 기록한다.
    - 4. 비상 정지 스위치를 조작하여 EV200 접촉기가 정상적으로 DC 전원을 차단하는지 확인한다 [S23].
    - 5. 수집된 데이터를 바탕으로 각 관절의 제어 성능 및 파지력 피드백 성능을 차트로 생성한다.
    safety:
    - 실험 전 반드시 보안경을 착용한다.
    - 시스템 동작 중에는 로봇의 관절부 근처에 손을 넣지 않는다.
    - 전원 공급장치는 반드시 저전압 벤치 전원을 사용하며, 전류 제한 기능을 활성화한다.
    - 비상 상황 시 즉시 비상 정지 스위치를 조작한다.
    deliverables:
    - 측정된 관절 응답 데이터 파일 (CSV)
    - 파지력 성능 측정 결과 그래프
    - 전원 시스템 안정성 평가 기록
    - 검증 및 실험 과정이 포함된 최종 성능 평가 보고서
  assignment:
    title: 최종 프로젝트 종합 보고서 작성
    deliverables:
    - 시스템 설계 목적과 최종 구현 결과 비교 분석서
    - 주요 성능 지표(KPI) 및 데이터 분석 결과 시각화 자료
    - BOM 기반의 사양 및 실제 운용 성능 비교 분석
    - 향후 연구 및 개선 방향 기술
    rubric:
    - 설계 요구사항과 실제 성능 결과가 데이터 기반으로 정량적으로 비교되었는가?
    - 성능 평가 데이터가 통계적으로 타당하게 분석되었는가?
    - 안전 장치 및 전원 시스템에 대한 분석이 기술적 근거를 바탕으로 작성되었는가?
    - 보고서의 체계적인 구성과 기술 문서 작성 기준을 준수하였는가?
  quiz:
  - question: 로봇 시스템의 성능 평가 시, 액추에이터의 스톨 전류(Stall Current)와 전원 분기 시스템의 전류 공급 능력 간의
      관계를 분석하는 주요 이유는 무엇입니까?
    choices:
    - 액추에이터의 소음을 줄이기 위해
    - 시스템의 최대 부하 상태에서 전력 공급의 안정성과 안전성을 보장하기 위해
    - 센서의 데이터를 더 정밀하게 보정하기 위해
    - 로봇의 외형 디자인을 최적화하기 위해
    answer_index: 1
    explanation: 시스템의 최대 부하 상태에서 전원 시스템이 액추에이터의 피크 전류를 충분히 수용할 수 있는지 확인하는 것은 하드웨어
      신뢰성 및 안전 사고 예방을 위해 필수적입니다 [S12, S16, S23].
  - question: FSR 402 센서를 사용하여 파지력을 측정할 때 고려해야 할 핵심 요소는 무엇입니까?
    choices:
    - 센서의 색상
    - 센서의 감지 범위(0.2N ~ 20N) 내에서 ADC 분압 회로를 통한 정밀한 데이터 변환 및 피드백
    - 센서의 가격
    - 센서의 제조 연도
    answer_index: 1
    explanation: FSR 402는 특정 힘 범위 내에서 전기적 저항이 변하며, 이를 정확하게 ADC 입력으로 변환해야 실제 파지력을 제어
      알고리즘에 반영할 수 있습니다 [S13].
  - question: 비상 정지 시스템 설계에서 '강제 개방(Forced-opening) NC 접점'을 사용하는 근본적인 목적은 무엇입니까?
    choices:
    - 시스템의 디자인을 단순화하기 위해
    - 전원 공급장치의 효율을 높이기 위해
    - 비상 정지 입력 시 전기적으로 확실하게 제어 회로를 차단하여 안전을 보장하기 위해
    - 로봇의 통신 속도를 빠르게 하기 위해
    answer_index: 2
    explanation: 비상 정지 회로는 신뢰성이 가장 중요하며, 강제 개방 구조는 기계적 고장 시에도 안전 회로가 정상적으로 동작하여 전원을
      차단할 수 있도록 보장합니다 [S22, S23].
  completion_criteria:
  - 최종 성능 평가 보고서 제출 및 통과
  - 실험 데이터 기반의 성능 지표 분석 및 정량적 근거 제시
  - 시스템 안전성 검증 절차(비상 정지 및 전원 차단 테스트) 성공적 수행 확인
  source_ids:
  - S7
  - S16
