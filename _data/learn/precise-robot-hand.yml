- id: M9
  slug: sensor-integration
  phase_id: PH3
  title: 감각 피드백 시스템 통합
  estimated_hours: 7.0
  prerequisites:
  - M8
  objectives:
  - FSR 402 센서의 압력-저항 특성을 이해하고 전압 분압 회로를 설계할 수 있다.
  - OpenCR 제어기의 ADC(아날로그-디지털 변환기)를 사용하여 힘 신호를 디지털 데이터로 변환할 수 있다.
  - 센서 데이터를 필터링하고 로봇손의 파지 제어 알고리즘에 통합할 수 있다.
  theory_markdown: '### 감각 피드백: 힘 감지 저항기(FSR)의 원리


    FSR(Force Sensing Resistor)은 인가되는 물리적 힘이 증가함에 따라 전기 저항이 감소하는 고분자 필름 센서입니다 [S11].
    손끝에 내장된 FSR 402는 0.2 N에서 20 N 범위의 힘을 측정할 수 있어 정밀한 파지력 피드백 구현에 적합합니다 [S11].


    ### 전압 분압 회로 설계

    FSR은 가변 저항기이므로, 마이크로컨트롤러가 전압을 읽을 수 있도록 전압 분압 회로를 구성해야 합니다. OpenCR 보드의 3.3 V 센서
    전원을 기준으로 10 kΩ 고정 저항(R)과 FSR(Rf)을 직렬로 연결합니다 [S12, S25].


    출력 전압(V_out)은 다음과 같이 계산됩니다:

    V_out = V_cc * (R / (R + Rf))


    OpenCR의 ADC는 12비트 해상도를 지원하여 0~3.3 V의 전압 범위를 0~4095의 디지털 값으로 분할합니다 [S12]. FSR의
    비선형적인 저항 특성 때문에 소프트웨어단에서의 비선형 매핑 또는 테이블 참조가 필요합니다 [S11].


    ### 시스템 통합 주의사항

    반드시 3.3 V 센서 레일을 사용해야 하며, 12 V 액추에이터 전원과 센서 회로는 완전히 분리되어야 합니다 [B2]. ADC 입력 신호가
    3.3 V를 초과하지 않도록 회로를 반드시 검증하십시오 [B2].'
  worked_examples:
  - '예제 1: 10 kΩ 고정 저항과 FSR을 사용하여 3.3 V 전압 분압 회로를 구성할 때, FSR의 저항이 10 kΩ일 때 ADC 입력
    전압을 계산하시오. V_out = 3.3 * (10 / (10 + 10)) = 1.65 V. ADC 데이터 값 = (1.65 / 3.3) *
    4095 = 2047.5이므로 약 2048.'
  - '예제 2: FSR 센서 신호의 노이즈를 제거하기 위해 이동 평균 필터(Moving Average Filter)를 구현할 때, 최근 5개 샘플의
    합을 5로 나누어 ADC 값을 계산하는 C++ 코드 로직을 설계하시오.'
  lab:
    title: FSR 센서 조립 및 데이터 취득 실습
    steps:
    - OpenCR 보드의 3.3 V 센서 전원 및 GND 포트를 확인합니다.
    - 10 kΩ 저항을 사용하여 FSR 402와 전압 분압 회로를 구성합니다 [B4, B11].
    - 분압된 아날로그 신호를 OpenCR의 ADC 입력 핀에 연결합니다 [B2].
    - 멀티미터를 DC 전압 모드로 설정하고, 전원 인가 전 회로의 단락 여부를 확인합니다.
    - 전원을 인가하고, 손가락 끝에 힘을 가하지 않았을 때와 가했을 때의 ADC 값을 시리얼 모니터로 확인합니다.
    - 최종적으로 각 분기별 절연 전원을 물리적으로 분리하여 무전원 상태를 멀티미터로 확인합니다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고 무전원 상태를 계측 확인합니다.
    - 절대 12 V 액추에이터 레일을 ADC 입력에 연결하지 마십시오.
    - 배선 작업 전후로 항상 멀티미터를 사용하여 1 V 이하임을 확인하십시오.
    - 전원 인가 중에는 손을 가동 범위에 넣지 마십시오.
    deliverables:
    - FSR 전압 분압 회로 배선도
    - ADC 힘 데이터 취득 코드
    - 압력에 따른 ADC 데이터 출력 로그
  assignment:
    title: 파지력 제어 구현 보고서
    deliverables:
    - FSR 센서 특성 곡선 매핑 결과 보고서
    - 파지력 피드백을 적용한 제어 알고리즘 코드
    - 최종 통합 시험 영상 및 데이터
    rubric:
    - 전압 분압 회로의 전기적 안전성 및 규격 준수
    - 데이터 취득 루프의 샘플링 속도 및 안정성
    - 센서 입력값에 따른 모터 전류 제한 제어의 논리성
  quiz:
  - question: FSR 센서와 함께 사용하는 10 kΩ 저항의 주된 목적은 무엇입니까?
    choices:
    - 전압 분압기를 구성하여 전압 신호를 생성하기 위함
    - 센서의 전류를 증폭하기 위함
    - 전압을 12 V로 낮추기 위함
    - 액추에이터의 과전류를 방지하기 위함
    answer_index: 0
    explanation: FSR은 저항 변화를 일으키는 센서이므로, 마이크로컨트롤러가 전압으로 읽을 수 있도록 고정 저항과 함께 분압 회로를
      구성해야 합니다.
  - question: OpenCR의 ADC 입력에 허용되는 최대 전압 범위는 무엇입니까?
    choices:
    - 0~5 V
    - 0~3.3 V
    - 0~12 V
    - 0~24 V
    answer_index: 1
    explanation: OpenCR의 ADC는 3.3 V 센서 레일을 사용하며 신호가 0~3.3 V 범위를 초과해서는 안 됩니다 [B2].
  completion_criteria:
  - 모든 FSR 센서가 OpenCR ADC를 통해 정상적인 힘 데이터를 출력함
  - 분기별 전원 절연 상태가 계측 결과로 확인됨
  - 힘 피드백 기반 모터 전류 제어가 논리적으로 구현됨
  source_ids:
  - S11
  - S25
  - S12
- id: M10
  slug: calibration-testing
  phase_id: PH3
  title: 교정 및 파지 성능 검증
  estimated_hours: 10.0
  prerequisites:
  - M9
  objectives:
  - 로봇손 액추에이터의 제어 루프를 이해하고 전류 및 위치 피드백 데이터를 해석한다.
  - FSR(힘 감지 저항기) 센서 분압 회로의 전기적 특성을 분석하고 올바르게 교정한다.
  - 안전한 하드웨어 조작 절차를 준수하며 시스템을 정밀하게 교정한다.
  - 파지력 제어 알고리즘의 성능을 정량적인 수치로 검증한다.
  theory_markdown: '### 정밀 로봇손의 교정 및 성능 검증 이론


    로봇손의 제어 성능은 관절 구동기와 센서 피드백 사이의 정밀한 동기화에 달려 있습니다. DYNAMIXEL XM430-W350-T는 스톨 전류
    2.3 A를 가진 정밀 액추에이터로, 이를 통해 관절의 토크와 위치를 제어합니다 [S10]. 파지 성능의 핵심인 손끝 접촉력은 FSR 402를
    통해 감지되며, 이는 인가된 힘에 따라 저항값이 변화하는 박막형 센서입니다 [S11].


    #### 1. FSR 신호 처리 회로

    FSR 402는 ADC 입력 전압 분압 회로로 연결됩니다. OpenCR 보드의 12비트 ADC 입력을 사용하며, 3.3 V 센서 레일 전원을
    사용하여 입력 신호를 0-3.3 V 범위 내로 유지해야 합니다 [S12]. 10 kΩ 분압 저항은 힘-저항 특성 곡선에 맞춰 센서의 감도 범위를
    결정합니다 [S11, S25].


    #### 2. 교정의 필요성

    액추에이터의 위치 피드백과 센서의 힘 응답은 환경 요인에 따라 오차가 발생할 수 있습니다. 교정은 다음 두 단계로 수행됩니다:

    - **위치 교정:** 액추에이터의 영점(Zero Position)을 기구적 링크의 중립 상태와 일치시킴.

    - **힘 교정:** FSR 응답을 실제 인가된 힘(0.2 N ~ 20 N)과 상관관계로 매핑 [S11].


    #### 3. 안전 및 계측 주의사항

    시스템 검증 과정에서 전기적 안전은 필수입니다. 시스템을 정지하고 접근할 때에는 3개의 독립적인 12 V 전원 어댑터를 물리적으로 분리하고,
    멀티미터를 사용하여 각 퓨즈 분기 및 제어 보드의 전압이 1 V 미만인지 확인해야 합니다. resistance 모드를 통한 확인은 금지합니다.'
  worked_examples:
  - '예제 1: FSR 출력 전압 계산. FSR 저항이 10 kΩ, 분압 저항이 10 kΩ일 때, OpenCR 3.3 V 센서 레일에서 ADC로
    입력되는 전압은 1.65 V입니다. 이는 12비트 ADC에서 약 2048의 디지털 값으로 변환됩니다.'
  - '예제 2: 전류 제한 계산. 4대의 액추에이터를 1개의 12 V 분기에 연결 시, 스톨 전류 합계는 9.2 A입니다 [S10]. 해당 분기의
    10 A ATOF 퓨즈는 정격 범위 내에 있어 과전류 보호 기능을 수행합니다 [S24].'
  lab:
    title: 로봇손 영점 교정 및 파지력 계측 실험
    steps:
    - 모든 전원을 차단하고 1 V 미만인지 확인한 후, 각 손가락 텐던 장력을 초기화합니다.
    - OpenCR 보드에 제어 코드를 업로드하고 액추에이터의 모든 관절 각도를 0으로 설정합니다.
    - 무부하 상태에서 각 액추에이터의 위치 피드백 값이 기구적 중립과 일치하는지 확인합니다.
    - 표준 분동을 사용하여 FSR 402에 0.2 N부터 5 N까지 단계적으로 힘을 인가하며 ADC 출력값을 기록합니다.
    - 기록된 힘-ADC 데이터로 선형 회귀 분석을 수행하여 교정 계수를 도출합니다.
    safety:
    - 전원 인가 중에는 로봇손의 가동 범위에 손을 넣지 마십시오.
    - 시스템 접근 전 반드시 3개 전원 어댑터를 분리하고 전압을 계측하십시오.
    - 실험 중에는 충격 방지 작업용 보안경을 반드시 착용하십시오.
    - 퓨즈는 비상 차단 장치가 아닙니다. 과전류 보호용으로만 인식하십시오.
    deliverables:
    - 각 관절의 영점 교정 기록
    - FSR 센서 힘-전압 변환 교정 곡선
    - 실험 결과에 기반한 제어기 파지력 설정값 리포트
  assignment:
    title: 로봇손 파지 성능 분석 보고서
    deliverables:
    - 파지력 반복 정밀도 시험 데이터
    - 제어 알고리즘 내 FSR 교정 계수 적용 코드
    - 최종 성능 평가 결과 보고서
    rubric:
    - FSR 교정 데이터의 선형성과 정확도 (30%)
    - 안전 수칙 준수 여부 및 계측 과정 기록의 충실도 (30%)
    - 파지력 제어 구현 및 오차 분석의 논리적 타당성 (40%)
  quiz:
  - question: FSR 402 센서 신호 취득 시 ADC 공급 전압으로 적절한 것은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 시스템 전원
    - 3.3 V 센서 레일 전원
    - OpenCR의 별도 고전압 레일
    answer_index: 2
    explanation: OpenCR ADC 신호 범위는 0-3.3 V로 제한되며, 3.3 V 센서 레일 전원을 사용해야 신호 범위를 초과하지
      않습니다.
  - question: 시스템 접근 전 수행해야 할 필수 안전 절차는?
    choices:
    - 소프트웨어 내 비상 정지 버튼 클릭
    - 3개 전원 어댑터를 물리적으로 분리 후 멀티미터로 1 V 미만 확인
    - 저항 모드로 회로의 연결 여부 확인
    - 퓨즈를 제거하여 전원 차단
    answer_index: 1
    explanation: 물리적 전원 분리와 전압 계측만이 무전원 상태를 보장합니다. 저항 모드 사용은 금지됩니다.
  - question: DYNAMIXEL XM430-W350-T 액추에이터의 스톨 전류값은?
    choices:
    - 1.0 A
    - 2.3 A
    - 4.1 A
    - 10.0 A
    answer_index: 1
    explanation: 데이터시트 기준 스톨 전류는 2.3 A입니다 [S10].
  completion_criteria:
  - 모든 관절의 영점 교정이 정상적으로 완료되었음
  - FSR 교정 데이터가 확보되어 로봇 제어 코드에 반영되었음
  - 실험 중 안전 수칙을 완벽히 준수하였음이 기록됨
  - 최종 파지 성능 검증 보고서가 제출됨
