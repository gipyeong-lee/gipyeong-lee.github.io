- id: M7
  slug: sensor-integration
  phase_id: PH3
  title: 센서 인터페이스 구축
  estimated_hours: 10.0
  prerequisites:
  - M6
  objectives:
  - FSR 402 센서의 저항 변화 특성을 이해하고 전압 분압 회로를 설계할 수 있다.
  - OpenCR 제어기의 ADC(아날로그-디지털 변환기) 사양을 확인하고 센서 신호를 안전하게 입력할 수 있다.
  - 정밀 로봇손의 손끝 접촉력 취득을 위한 하드웨어 회로를 구성하고 교정 원리를 습득한다.
  theory_markdown: '### FSR(Force Sensing Resistor) 원리 및 회로 설계

    FSR 402는 압력이 증가함에 따라 저항이 감소하는 고분자 후막 센서입니다 [S11]. 정밀 로봇손의 파지력 피드백을 위해 센서의 저항($R_{FSR}$)
    변화를 전압 신호($V_{out}$)로 변환해야 하며, 이를 위해 고정 저항($R_{fix}$)을 사용한 전압 분압 회로를 구성합니다.


    $$V_{out} = V_{ref} \cdot \frac{R_{fix}}{R_{fix} + R_{FSR}}$$


    교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
    [B2]. $R_{fix}$ 값(10 kΩ) [B-SENSOR-RESISTOR]은 OpenCR의 12비트 ADC 해상도 [B2] 내에서 센서의
    감지 범위(0.2 N~20 N) [S11]를 최대한 활용할 수 있도록 최적화된 값입니다.


    ### OpenCR ADC 인터페이스 및 안전 수칙

    OpenCR 1.0은 내부적으로 DYNAMIXEL 포트를 내장하고 있어 통신 브리지 없이 센서 데이터를 직접 취득합니다 [B2]. ADC 입력
    핀은 입력 전압 범위를 초과할 경우 보드가 손상될 수 있습니다. 따라서 분압 회로 설계 시 고정 저항과 센서의 배치 위치를 확인하여 3.3
    V 레일에서 전압을 취득하는지 반드시 검증하십시오 [B2].'
  worked_examples:
  - '예제 1: 10 kΩ 분압 저항 선정 이유. FSR 402의 압력 변화에 따른 저항 변화 범위를 고려할 때, 10 kΩ 저항은 0~3.3
    V ADC 입력 범위 내에서 최대 동적 범위를 제공하여 미세한 파지력을 정밀하게 구분할 수 있게 합니다 [S11, B-SENSOR-RESISTOR].'
  - '예제 2: 전압 측정 계산. 센서 레일 전압이 3.3 V이고 FSR 저항이 10 kΩ(압력 인가 시)일 때, $V_{out} = 3.3 V
    \cdot \frac{10 k\Omega}{10 k\Omega + 10 k\Omega} = 1.65 V$로 ADC 입력 범위(0~3.3 V)
    내에 안정적으로 유지됩니다 [B2, S25].'
  lab:
    title: FSR 센서 인터페이스 구성 및 신호 측정
    steps:
    - OpenCR 3.3 V 센서 전원 레일과 ADC 입력 핀 위치를 확인합니다 [B2].
    - 브레드보드에 FSR 402 센서와 10 kΩ 저항을 사용하여 전압 분압 회로를 구성합니다 [B-SENSOR-RESISTOR].
    - 멀티미터를 사용하여 3.3 V 공급 전압이 정확한지 측정합니다.
    - 센서에 물리적 힘을 가하면서 OpenCR ADC 입력을 멀티미터로 실시간 측정하여 전압이 0~3.3 V 범위 내에서 변화하는지 확인합니다.
    - 안전 수칙에 따라 전원을 분리하고, 멀티미터 전압 모드로 각 회로의 잔류 전압이 1 V 미만임을 확인한 후 배선을 최종 고정합니다.
    safety:
    - 전원 인가 중에는 센서 신호선과 12 V 액추에이터 전원선이 절대 접촉하지 않도록 주의합니다 [B2].
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고, 각 분기를 멀티미터 DC 전압 모드로 측정하여 1 V 미만임을 반드시 확인합니다.
    - 납땜 시 보안경을 착용하며 인두기의 화상 위험에 주의합니다.
    - 회로 구성을 변경할 때는 반드시 전원 어댑터를 분리해야 합니다.
    deliverables:
    - 전압 분압 회로 구성 배선도
    - 센서 압력(힘) 대 출력 전압 데이터 테이블
    - ADC 입력 전압 측정값의 정밀도 평가서
  assignment:
    title: 손끝 접촉력 취득 및 데이터 교정
    deliverables:
    - 손가락 모듈 센서 배치 도면 (CAD 데이터)
    - 힘 센서 교정 데이터(Load Cell 기준 비교)
    - OpenCR 제어기로 취득한 힘 신호 데이터 시각화 결과
    rubric:
    - ADC 입력 전압이 0~3.3 V 범위를 준수하고 있는가?
    - FSR 분압 회로가 데이터시트 명시 저항(10 kΩ)을 사용하여 올바르게 구성되었는가?
    - 센서 물리 배치 및 배선이 로봇손의 가동 범위를 방해하지 않는가?
    - 실험 시 전원 분리 및 잔류 전압 측정 안전 수칙을 완벽히 이행했는가?
  quiz:
  - question: OpenCR 제어기의 ADC 입력으로 FSR 센서 전원을 공급할 때 가장 올바른 전압 레일은 무엇입니까?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원 레일
    - 5 V USB 전원
    - 외부 24 V 전원
    answer_index: 1
    explanation: OpenCR의 ADC 입력 보호 및 안정적인 데이터 취득을 위해 공식 문서에서 지정한 3.3 V 센서 레일을 사용해야
      합니다 [B2].
  - question: 전압 분압 회로에서 고정 저항(10 kΩ)을 사용하는 목적은 무엇입니까?
    choices:
    - 센서의 저항 변화를 전압 신호로 변환하기 위해
    - 액추에이터의 전류를 제한하기 위해
    - 통신 속도를 높이기 위해
    - 보드의 퓨즈를 대신하기 위해
    answer_index: 0
    explanation: FSR은 저항만 변하는 센서이므로, ADC가 읽을 수 있는 전압 신호로 바꾸기 위해 고정 저항과 함께 분압 회로를 구성해야
      합니다 [S11, B-SENSOR-RESISTOR].
  - question: 실험 중 안전하게 전원을 차단하는 방법으로 올바른 것은 무엇입니까?
    choices:
    - 퓨즈를 뽑아 회로를 차단한다
    - 3개 전원 어댑터를 물리적으로 분리 후 멀티미터로 1 V 미만임을 확인한다
    - 소프트웨어로 전원을 끈다
    - 지속적인 통신으로 액추에이터를 정지시킨다
    answer_index: 1
    explanation: 벤치 프로토타입의 안전을 위해 전원 어댑터를 물리적으로 분리하고, 멀티미터 전압 측정으로 무전원 상태를 검증해야 합니다.
  completion_criteria:
  - FSR 분압 회로가 데이터시트 사양에 맞춰 구성됨
  - OpenCR ADC 입력을 통해 0~3.3 V 범위 내의 힘 신호 취득 성공
  - 안전 수칙을 준수하여 1 V 미만의 무전원 상태를 확인하고 배선 완료
  - 최종 결과물이 물리적, 전기적 안전 점검 기준을 통과함
  source_ids:
  - S11
  - S25
- id: M8
  slug: actuator-control
  phase_id: PH3
  title: 액추에이터 프로그래밍
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - DYNAMIXEL 스마트 액추에이터의 제어 모드와 데이터 패킷 구조를 이해한다.
  - OpenCR 제어 보드를 활용한 액추에이터 통신 및 상태 제어를 구현한다.
  - FSR 힘 센서의 신호를 전압 분압 회로를 통해 안정적으로 취득한다.
  - 위치, 속도, 전류 피드백을 기반으로 하는 텐던 장력 및 관절 제어 로직을 설계한다.
  theory_markdown: '## DYNAMIXEL 제어 아키텍처

    5지 로봇손의 구동은 11개의 XM430-W350-T 스마트 액추에이터에 의해 이루어집니다 [S10]. 이 액추에이터는 위치, 속도, 그리고
    전류 피드백을 실시간으로 제공하여 텐던 구동 시스템의 정밀한 장력 제어를 가능하게 합니다. 통신은 DYNAMIXEL Protocol 2.0을
    사용하여 효율적인 데이터 패킷 전송을 수행합니다 [S10].


    ## 센서 인터페이스 설계

    각 손끝에 내장된 FSR 402 센서는 0.2N에서 20N 범위의 접촉력을 감지합니다 [S11]. 이를 OpenCR 보드의 12비트 ADC로
    읽기 위해 10kΩ 저항을 사용하는 전압 분압 회로를 구성합니다 [S12, S25].


    ### 안전 수칙: 전기 회로 구성

    - 모든 FSR 분압 회로는 OpenCR의 3.3V 센서 전원 레일에 연결하십시오 [S12].

    - 절대로 12V 액추에이터 전원 라인을 센서의 아날로그 분압 회로에 연결하지 마십시오. 이는 제어기를 영구적으로 손상시킵니다 [S12].

    - 모든 아날로그 입력 신호는 0~3.3V 범위를 초과하지 않아야 합니다 [S12].


    ## 전원 배분 원칙

    전체 시스템은 3개의 독립된 12V 전원 어댑터로 구동됩니다 [S14]. 각 어댑터는 4대, 4대, 3대의 액추에이터 분기로 분할되며, 각
    분기는 10A ATOF 퓨즈로 개별 보호됩니다 [S14, S24]. 어댑터의 출력(+)단자를 서로 연결하는 행위는 엄격히 금지됩니다 [S14].'
  worked_examples:
  - '예제 1: DYNAMIXEL 전류 제어 설정. 액추에이터의 전류 피드백 값을 읽어 텐던 장력을 일정하게 유지하는 제어 루프를 작성합니다.
    전류 피드백은 스톨 전류 2.3A를 기준으로 비율 제어를 수행합니다 [S10].'
  - '예제 2: FSR 힘 변환 계산. ADC 값(0-4095)을 전압 분압 공식을 이용하여 힘(N)으로 변환하는 함수를 작성합니다. 이때 저항
    10kΩ과 센서의 가변 저항 특성을 사용합니다 [S11, S25].'
  lab:
    title: 액추에이터 프로그래밍 및 센서 데이터 취득 실습
    steps:
    - 각 절연 전원 어댑터의 출력을 물리적으로 분리한 상태에서 퓨즈 홀더를 통해 배선합니다 [S14, S23].
    - FSR 센서와 10kΩ 저항을 사용하여 전압 분압 회로를 구성하고 OpenCR의 3.3V 센서 포트에 연결합니다 [S12, S25].
    - 멀티미터를 사용하여 모든 전원 분기에서 12V가 인가되는지, 센서 레일이 3.3V인지 확인합니다.
    - DYNAMIXEL SDK를 사용하여 액추에이터 ID 스캔 및 통신 테스트를 수행합니다 [S10].
    - 단일 액추에이터에 대해 위치 명령을 전송하고 상태 패킷을 통해 피드백을 수신합니다.
    safety:
    - 실험 중 정지 시 3개 전원 어댑터를 물리적으로 분리하고 DC 전압을 확인합니다 [S14].
    - 전원 인가 중 가동 범위에 손을 절대 넣지 마십시오.
    - 모든 회로 수정은 전원이 차단된 상태에서만 수행합니다.
    - 보안경을 필수로 착용하십시오.
    deliverables:
    - 액추에이터 ID 스캔 결과 보고서
    - 센서 보정 함수 소스 코드
    - 전류 제어 루프 정상 작동 로그
  assignment:
    title: 텐던 장력 및 제어 로직 설계
    deliverables:
    - 통합 제어 펌웨어 소스 코드
    - 힘-위치 제어 로직 기술서
    rubric:
    - DYNAMIXEL 통신 패킷 처리의 효율성
    - FSR 센서 신호의 노이즈 필터링 구현 여부
    - 액추에이터 전류 피드백 활용의 정확성
    - 코드의 가독성 및 안전한 예외 처리(에러 코드 대응)
  quiz:
  - question: FSR 센서 분압 회로에 적절한 전원은 무엇입니까?
    choices:
    - 12V 액추에이터 전원
    - 3.3V OpenCR 센서 전원
    - 5V 범용 전원
    - 24V 입력 전원
    answer_index: 1
    explanation: ADC 해상도와 하드웨어 보호를 위해 3.3V 센서 레일 사용이 필수적입니다 [S12].
  - question: 시스템의 3개 전원 분기를 어떻게 관리해야 합니까?
    choices:
    - 양(+) 출력단자를 모두 연결하여 부하를 분산한다
    - 모든 전원을 하나의 공통 모선으로 합친다
    - 각 분기를 물리적으로 절연하고 독립적으로 운영한다
    - 퓨즈를 제거하고 직접 연결한다
    answer_index: 2
    explanation: 독립된 어댑터의 출력 병렬 연결은 절대 금지되며, 각 분기는 별도의 퓨즈로 분리되어야 합니다 [S14].
  - question: XM430-W350-T 액추에이터의 스톨 전류는 얼마입니까?
    choices:
    - 1.5A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: 해당 모델의 스톨 전류 정격은 2.3A입니다 [S10].
  completion_criteria:
  - DYNAMIXEL ID 스캔 및 정상 통신 확인
  - FSR 센서 ADC 입력값 정상 취득 확인
  - 독립 전원 분기별 퓨즈 장착 및 전압 확인
  - 펌웨어 구현 및 동작 테스트 완료
  source_ids:
  - S5
  - S10
  - S11
  - S12
  - S25
  - S14
  - S24
  - S23
- id: M9
  slug: testing
  phase_id: PH4
  title: 파지 및 내구 시험
  estimated_hours: 8.0
  prerequisites:
  - M8
  objectives:
  - 로봇손의 파지 성능을 정량적으로 평가할 수 있다.
  - 텐던 구동 로봇손의 내구성을 확보하기 위한 시험 절차를 수행할 수 있다.
  - DYNAMIXEL 스마트 액추에이터의 전류 및 토크 피드백 데이터를 해석할 수 있다.
  - FSR 센서를 이용한 파지력 제어 데이터의 신뢰성을 검증할 수 있다.
  theory_markdown: '### 파지 및 내구 시험 개요

    로봇손의 성능은 단순히 목표 위치에 도달하는 것뿐만 아니라, 대상 물체를 안정적으로 유지(Grasping)하고 장시간 구동 시에도 성능이 저하되지
    않는 내구성(Durability)을 필요로 한다.


    ### 1. 파지 성능 평가 (Grasp Performance)

    파지 성능은 FSR 402 센서를 사용하여 측정한다 [S11]. FSR은 인가된 힘이 증가함에 따라 저항이 감소하는 원리를 이용하며, OpenCR의
    12비트 ADC 입력을 통해 전압 값으로 변환되어 취득된다 [S12]. 파지 과정에서의 최대 힘, 힘의 균일성, 제어 응답성을 분석하여 로봇손의
    Dexterity를 평가한다.


    ### 2. 텐던 및 액추에이터 역학

    텐던 구동 방식은 Dyneema SK78 섬유를 사용하여 고강도와 낮은 신율(<1%)을 달성한다 [S15]. DYNAMIXEL XM430-W350-T
    액추에이터는 4.1 N·m의 스톨 토크를 제공하며, 정밀 전류 피드백을 통해 텐던 장력을 간접적으로 측정하거나 제어할 수 있다 [S10].
    파지 시험 시 전류 데이터를 모니터링하여 액추에이터의 부하 상태를 파악해야 한다.


    ### 3. 내구성 시험 (Durability Test)

    내구성 시험은 반복적인 파지 및 이완 동작을 통해 텐던의 마모, 구조물의 피로, 액추에이터의 열 발생을 점검한다. 특히 캡스턴 부위의 반복
    굽힘은 텐던의 수명에 직결되므로, 시험 중 장력 저하나 신율 증가 여부를 주기적으로 검사한다 [S15].'
  worked_examples:
  - '예제 1: FSR 데이터 보정. 센서 전압(V_out)과 10 kΩ 분압 저항을 사용하여 FSR 저항 R_FSR을 계산한다. FSR의 저항-힘
    관계식을 적용하여 0.2~20 N 범위의 힘을 환산한다 [S11, S25].'
  - '예제 2: 전류 제한 모니터링. DYNAMIXEL의 스톨 전류 2.3 A를 기준으로 [S10], 반복 파지 시험 중 액추에이터가 2 A를
    초과하여 지속 작동할 경우 열 발생을 예상하고 동작 주기를 재설정한다.'
  lab:
    title: 5지 로봇손 성능 검증 실습
    steps:
    - 각 독립 전원 분기를 물리적으로 분리한 상태에서 로봇손과 OpenCR 제어기의 연결을 확인한다.
    - 보안경을 착용하고, 로봇손을 고정 지그에 장착하여 무부하 동작 시험을 10회 수행한다.
    - 시험 종료 후 모든 전원 어댑터를 분리하고, 각 분기 전압이 1 V 미만임을 멀티미터로 확인한다.
    - FSR 센서의 파지 데이터 취득을 위해 정해진 물체(표준 무게추)를 파지하고 전류 피드백 데이터를 로그로 저장한다.
    - 반복 파지 시험(100회)을 통해 텐던의 물리적 변형 및 유격 변화를 관찰한다.
    safety:
    - 본 실습의 계획 정지는 3개 절연 전원 어댑터를 물리적으로 즉시 분리하는 것임.
    - 전원 인가 중 로봇손의 가동 범위 내에 손을 넣지 않음.
    - 절단 및 텐던 장력 시험 시 반드시 충격 방지용 보안경을 착용함.
    - 연속 전류 인가로 인한 액추에이터의 과열에 주의함.
    - 1 V DC 미만 확인 전까지 로봇손 구동부에 접근하지 않음.
    deliverables:
    - 파지력 측정 로그 데이터 (CSV)
    - 반복 시험 전후의 텐던 장력 및 유격 측정 기록
    - 전류 및 토크 피드백 분석 결과 보고서
  assignment:
    title: 성능 평가 최종 보고서 작성
    deliverables:
    - 파지 및 내구 시험 데이터 분석 보고서
    - FSR 데이터 보정 공식 및 결과물
    rubric:
    - FSR 데이터의 신뢰성 검증 방법론 명시 여부
    - 내구성 시험 중 관찰된 텐던 마모 현상과 대책 제안
    - 스톨 전류를 고려한 운전 주기의 적절성 평가
    - 데이터 분석의 논리적 타당성
  quiz:
  - question: FSR 402 센서의 주요 특징은 무엇인가?
    choices:
    - 인가된 힘이 증가하면 저항이 증가함
    - 인가된 힘이 증가하면 저항이 감소함
    - 온도에 따라 저항이 변하지 않음
    - 직접 5 V 전원을 인가하여 사용하여야 함
    answer_index: 1
    explanation: FSR은 인가된 힘이 증가함에 따라 저항이 감소하는 특성을 가짐 [S11].
  - question: 시험 중 전원 분리 상태 확인 방법으로 올바른 것은?
    choices:
    - 연결된 퓨즈를 확인한다.
    - 멀티미터를 사용하여 모든 분기 전압이 1 V 미만인지 DC 전압 모드로 측정한다.
    - 연결 회로를 저항 모드로 측정하여 단선 여부를 확인한다.
    - 전원 어댑터의 LED가 꺼졌으므로 즉시 접근한다.
    answer_index: 1
    explanation: 무전원 상태의 확인은 반드시 DC 전압 모드에서 1 V 미만임을 측정하여 확인해야 함.
  - question: DYNAMIXEL XM430-W350-T 액추에이터의 스톨 전류는 얼마인가?
    choices:
    - 1.5 A
    - 2.3 A
    - 4.1 A
    - 11.5 A
    answer_index: 1
    explanation: DYNAMIXEL XM430-W350-T 액추에이터의 스톨 전류는 2.3 A임 [S10].
  completion_criteria:
  - 파지 시험 및 내구성 시험 결과 데이터를 제출하였다.
  - 실험 과정에서 안전 수칙을 완벽히 준수하였다.
  - 모든 데이터 수집 및 분석 보고서가 심사를 통과하였다.
