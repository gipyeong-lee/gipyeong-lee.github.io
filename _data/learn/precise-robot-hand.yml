modules:
- id: m1
  slug: intro-robotics
  phase_id: phase-1
  title: 로봇 공학 입문 및 도구 익히기
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - 로봇 공학의 핵심 정의와 하드웨어 설계 기초를 이해한다.
  - 로봇 제어 보드(OpenCR 1.0)의 기본 사양과 통신 인터페이스를 학습한다.
  - 정밀 로봇손 제작에 필요한 도구 사용법과 안전 수칙을 익힌다.
  - 기구학적 기초와 액추에이터 통합을 위한 요구사항 분석 기법을 습득한다.
  theory_markdown: '## 로봇 공학 기초 및 시스템 설계


    현대 로봇 공학은 기구학(Kinematics), 제어 이론(Control Theory), 그리고 임베디드 전자 기술의 융합체입니다 [S9].
    정교한 5지 로봇손을 설계하기 위해서는 각 관절을 구동하는 액추에이터의 피드백 제어와 시스템 전체의 안정성을 확보하는 것이 최우선 과제입니다.


    ### 시스템 하드웨어 구성

    본 프로젝트의 핵심 제어기인 OpenCR 1.0은 216MHz 클럭의 CPU를 탑재하고 있으며, DYNAMIXEL 액추에이터와 직접 통신할
    수 있는 TTL 및 RS-485 포트를 내장하고 있습니다 [S14]. 이는 별도의 복잡한 통신 브리지 없이도 정밀한 위치·속도·전류 피드백을
    실시간으로 취득하게 합니다 [S14].


    ### 액추에이터 제어

    XM430-W350-T 스마트 액추에이터는 12V 전압을 기준으로 4.1 N·m의 스톨 토크와 2.3 A의 스톨 전류를 가집니다 [S12].
    시스템 설계 시, 다수의 액추에이터가 동시에 동작할 때 발생하는 총 전류 수요를 고려하여 전원 분기를 설계해야 하며, 이는 시스템의 안전성을
    결정짓는 핵심 지표가 됩니다.


    ### 안전 시스템 설계

    비상 정지 시스템은 A22E 래칭 버튼을 입력으로 하여 G7SA 안전 릴레이를 거쳐, 최종적으로 EV200 DC 접촉기를 차단하는 체인을 구성합니다
    [S23, S24, S25, S26]. 이때 각 계층은 전기적으로 분리되어야 하며, 특히 고전류가 흐르는 액추에이터 라인은 독립된 퓨즈와 접촉기로
    보호되어야 합니다 [S15, S26, S27, S28].'
  worked_examples:
  - '예제 1: 5지 로봇손의 총 피크 전류 계산

    총 11개의 XM430-W350-T 액추에이터를 사용하며, 각 액추에이터의 스톨 전류는 2.3 A입니다 [S12]. 전체 시스템이 동시에 스톨
    상태가 될 경우 피크 전류는 11 * 2.3 = 25.3 A입니다. 전원 분기는 4대/4대/3대로 배분하며, 각 분기는 독립된 11.5 A
    어댑터와 10 A 퓨즈를 사용하여 안전 범위를 확보합니다 [S15, S28].'
  - '예제 2: FSR 센서 전압 분압 회로 설계

    FSR 402 센서의 저항은 가해지는 힘에 따라 감소합니다 [S13]. 이를 ADC 전압으로 변환하기 위해 10 kΩ 저항을 사용한 분압 회로를
    구성합니다 [S29]. 이때 3.3 V 센서 전원을 사용하여 OpenCR의 ADC 입력이 0~3.3 V 범위를 초과하지 않도록 설계합니다 [S14].'
  lab:
    title: 도구 익히기 및 안전 환경 구축
    steps:
    - FDM 3D 프린터의 경화강 노즐 장착 및 PC-CF 필라멘트 출력 조건 설정
    - 멀티미터를 이용한 전원 어댑터 출력 전압 확인 및 독립 분기 확인
    - 비상 정지 회로(A22E-G7SA-G2R-EV200)의 전기적 연결 상태 검증
    - OpenCR 제어 보드와의 통신 테스트 및 기본 펌웨어 업로드
    safety:
    - 보안경을 상시 착용하고 납땜 작업 시 환기 유지
    - 액추에이터 전원 분기는 반드시 독립적으로 유지하고 양(+)단 병렬 연결 금지
    - 비상 정지 테스트 시 접촉기의 동작음을 확인하고 실제 전원 차단 여부 확인
    - 모든 회로 작업 전 벤치 전원의 전류 제한(Current Limit) 설정
    deliverables:
    - 안전 수칙 체크리스트
    - 기본 제어 테스트 결과 보고서
    - 도구 활용 기술 인증
  assignment:
    title: 로봇손 제어 시스템 설계 기획
    deliverables:
    - 시스템 블록 다이어그램
    - 전원 분기 및 보호 회로 배선도
    - 부품별 정격 전류 및 전압 분석 보고서
    rubric:
    - 전원 분기별 독립성 및 퓨즈 보호 설계의 정확성
    - 비상 정지 회로 체인의 논리적 오류 유무
    - 데이터시트를 참조한 각 부품 정격 수치의 정확한 기재
  quiz:
  - question: OpenCR 1.0 제어 보드에서 FSR 힘 센서 분압 회로에 전원을 공급할 때 적절한 전압원은 무엇인가요?
    choices:
    - 12 V 액추에이터 전원 레일
    - 3.3 V 센서 전원 레일
    - 5 V USB 입력 전압
    - EV200 접촉기 제어 라인
    answer_index: 1
    explanation: OpenCR 1.0의 ADC 입력 범위를 준수하고 센서의 안전한 동작을 위해 반드시 3.3 V 센서 레일을 사용해야
      합니다.
  - question: 본 프로젝트에서 독립적인 12 V 전원 어댑터의 양(+) 출력을 병렬로 연결하는 것에 대한 안전 규정은 무엇인가요?
    choices:
    - 전류 용량을 증대시키기 위해 허용된다.
    - 분기별 독립성을 위해 반드시 병렬로 연결해야 한다.
    - 절대 금지 사항이다.
    - 퓨즈를 장착하면 허용된다.
    answer_index: 2
    explanation: 시스템 안전을 위해 각 액추에이터 분기는 독립적인 전원 어댑터와 퓨즈를 통해 분리되어야 하며, 병렬 연결은 절대 금지입니다.
  completion_criteria:
  - 비상 정지 회로가 정상적으로 각 액추에이터 분기를 차단함을 검증함
  - 시스템 전원 배선도가 권장 사양(독립 분기, 퓨즈 적용)을 모두 만족함
  - 기초 제어 테스트를 통해 OpenCR과 액추에이터 간의 통신이 정상적으로 이루어짐
  source_ids:
  - S9
  - S14
  - S12
  - S23
  - S24
  - S25
  - S26
  - S15
  - S27
  - S28
  - S13
