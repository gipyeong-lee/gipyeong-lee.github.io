  phase_id: phase-1
  title: 로봇 기구학 기초
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 기구학의 기본 개념인 자유도(DOF)와 관절 공간 및 작업 공간의 관계를 이해한다.
  - DH 파라미터(Denavit-Hartenberg parameters)를 사용하여 5지 로봇손의 링크 구조를 수학적으로 모델링하는 방법을 학습한다.
  - 로봇 손가락의 순기구학(Forward Kinematics) 계산 과정을 익히고 텐던 구동 시스템의 기구적 특성을 분석한다.
  theory_markdown: '## 로봇 기구학 개요

    로봇 기구학은 힘이나 토크를 고려하지 않고 로봇의 기하학적 형상과 움직임을 연구하는 분야입니다[S1]. 5지 로봇손과 같은 다관절 시스템에서
    각 관절의 회전 각도(Joint Space)를 통해 손끝(End-effector)의 위치(Task Space)를 결정하는 것을 순기구학이라
    합니다.


    ### 자유도(Degree of Freedom, DOF)

    로봇 시스템이 공간상에서 가질 수 있는 독립적인 움직임의 수를 말합니다. 5지 로봇손은 일반적으로 각 손가락이 3~4개의 관절을 가지며, 이는
    다자유도 시스템으로서 고도의 작업 공간 제어를 요구합니다.


    ### Denavit-Hartenberg (DH) 파라미터

    임의의 복잡한 로봇 구조를 좌표계 간의 변환 행렬로 표현하기 위한 표준 기법입니다. 링크의 길이($a_i$), 링크의 뒤틀림($\alpha_i$),
    관절 거리($d_i$), 관절 각도($\theta_i$)라는 4개의 파라미터를 사용하여 인접한 두 링크 사이의 상대적인 위치와 방향을 정의합니다.


    ### 텐던 구동의 기구적 특징

    로봇손의 구동 방식에서 텐던(Tendon, Dyneema SK78 사용)은 액추에이터의 회전 운동을 관절의 굽힘 운동으로 변환합니다[S14].
    이때 텐던의 경로와 캡스턴 반지름은 관절의 유효 토크와 변위비(Transmission Ratio)를 결정하는 핵심 요소입니다.'
  worked_examples:
  - 관절 1개의 회전각 $\theta_1$에 대해 링크 길이 $L_1$인 단순 2차원 평면 로봇 손가락 끝의 좌표 $(x, y)$는 순기구학 식
    $x = L_1 \cos(\theta_1)$, $y = L_1 \sin(\theta_1)$로 결정됩니다.
  - 3관절 손가락 모델에서 DH 파라미터를 적용할 때, 인접 좌표계 간의 동차 변환 행렬 $T_i^{i-1}$을 곱하여 최종 손끝 좌표계의 행렬
    $T_3^0 = T_1^0 T_2^1 T_3^2$를 유도합니다.
  lab:
    title: 로봇손 링크 구조 모델링 및 관절 가동 범위 측정
    steps:
    - 제공된 5지 로봇손 CAD 도면을 분석하여 각 손가락 링크의 길이($L_1, L_2, L_3$)를 측정한다.
    - 각 관절의 회전 중심을 기준으로 DH 좌표계를 설정하고 테이블로 파라미터를 작성한다.
    - 멀티미터를 사용하여 DYNAMIXEL XM430-W350-T 액추에이터의 초기 영점 위치를 설정한다[bom_system_truth].
    - 실제 출력된 손가락 링크를 조립하고 수동으로 각 관절을 회전시켜 기구적 간섭이 없는 가동 범위를 기록한다.
    safety:
    - 전동기 구동 시 손가락 끼임 방지를 위해 보호 장갑을 착용하고 비상정지 버튼을 즉시 조작 가능한 위치에 배치한다.
    - 실험 중 전원은 반드시 저전압 벤치 전원을 사용하고 전류 제한 설정을 1A 이하로 유지한다.
    - 보안경을 반드시 착용하여 혹시 모를 텐던 파단 시 튀어 오르는 탄성 에너지를 방지한다.
    deliverables:
    - 작성된 DH 파라미터 테이블
    - 각 관절의 기구적 가동 범위 측정 보고서
    - 로봇손 CAD 도면과 실제 측정값 간의 오차 분석표
  assignment:
    title: 5지 로봇손 기구학 해석 보고서
    deliverables:
    - 손가락 1개에 대한 순기구학 수학적 유도식
    - MATLAB 또는 Python을 활용한 손끝 궤적 시뮬레이션 코드
    - 기구학적 특이점(Singularity)이 발생할 수 있는 관절 구성 분석
    rubric:
    - DH 파라미터가 링크 구조와 일치하는가?
    - 순기구학 행렬 유도 과정이 수학적으로 정확한가?
    - 시뮬레이션 결과가 도면의 기구적 가동 범위를 준수하는가?
  quiz:
  - question: 로봇 기구학에서 순기구학의 정의로 올바른 것은?
    choices:
    - 손끝의 위치로부터 관절 각도를 계산하는 과정
    - 관절 각도로부터 손끝의 위치를 계산하는 과정
    - 액추에이터의 소모 전력을 계산하는 과정
    - 로봇의 무게 중심을 계산하는 과정
    answer_index: 1
    explanation: 순기구학(Forward Kinematics)은 주어진 관절 변수(각도)를 기반으로 로봇의 끝단 위치와 방향을 구하는
      과정입니다.
  - question: 5지 로봇손과 같은 텐던 구동 시스템에서 Dyneema SK78을 사용하는 주된 이유는?
    choices:
    - 절연 성능이 매우 뛰어나기 때문
    - 파단 하중이 크고 작동 신율이 낮아 정밀한 위치 전달이 가능하기 때문
    - 전기를 생성하여 액추에이터 효율을 높이기 때문
    - 열팽창 계수가 매우 높기 때문
    answer_index: 1
    explanation: Dyneema SK78은 높은 파단 하중(230 daN)과 낮은 작동 신율(<1%)을 가져 텐던 구동 로봇손의 정밀
      제어에 필수적입니다[S14].
  - question: DH 파라미터 구성 시 필요한 4가지 기본 요소는?
    choices:
    - 링크 길이, 링크 뒤틀림, 관절 거리, 관절 각도
    - 링크 무게, 모터 토크, 전압, 전류
    - 링크 재질, 노즐 온도, 베드 온도, 노즐 지름
    - 센서 해상도, ADC 샘플링 속도, 저항값, 전압
    answer_index: 0
    explanation: DH 파라미터는 인접한 링크 사이의 변환을 정의하기 위해 a, alpha, d, theta의 4개 값을 사용합니다.
  completion_criteria:
  - 로봇 기구학 기초 이론 평가에서 80점 이상 획득
  - DH 파라미터 기반의 순기구학 모델링 과제 제출 및 승인
  - 손가락 1개에 대한 기구학 시뮬레이션 결과가 실제 측정값과 5% 이내의 오차를 보임
  source_ids:
  - S1
  - S7
- id: mod-2
  slug: hand-design-tendon
  phase_id: phase-1
  title: 텐던 구동 로봇손 설계
  estimated_hours: 10.0
  prerequisites:
  - mod-1
  objectives:
  - 텐던 구동 로봇손의 동역학적 특성을 이해한다.
  - 텐던 장력 전달 경로와 캡스턴(capstan) 설계의 중요성을 학습한다.
  - DYNAMIXEL XM430 액추에이터를 활용한 텐던 구동 시스템의 기구적 배치를 설계한다.
  - 안전한 전원 배분 및 비상 차단 시스템을 고려한 설계 원칙을 습득한다.
  theory_markdown: '### 텐던 구동(Tendon-Driven) 메커니즘

    텐던 구동 시스템은 원격의 액추에이터에서 발생한 장력을 유연한 케이블(텐던)을 통해 관절로 전달하여 구동하는 방식이다 [S2, S3]. 이
    방식은 액추에이터를 손바닥이나 팔뚝에 배치하여 손가락 모듈의 관성 모멘트를 최소화할 수 있는 장점이 있다 [S8].


    #### 핵심 설계 고려사항

    1. **텐던 재질 및 파단 하중**: 텐던은 반복적인 굽힘과 인장 응력을 견뎌야 한다. Dyneema SK78과 같은 고강도 폴리에틸렌 섬유는
    낮은 신율(1% 미만)과 높은 파단 하중(230 daN 이상)을 제공하여 정밀한 위치 제어를 가능하게 한다 [S14].

    2. **마찰 및 경로 설계**: 텐던이 통과하는 경로는 마찰을 최소화해야 한다. 관절부의 캡스턴 모서리는 텐던 마모를 방지하기 위해 충분한
    곡률(라운딩)을 가져야 한다 [S14].

    3. **액추에이터 배치**: DYNAMIXEL XM430-W350-T와 같은 스마트 액추에이터는 전류 피드백을 제공하여 텐던 장력을 간접적으로
    제어할 수 있게 한다 [S9].


    #### 시스템 안전 및 전원 설계

    안전은 하드웨어 설계의 최우선 순위이다. DYNAMIXEL 액추에이터 11개는 분기별 독립적인 퓨즈(10 A)와 DC 접촉기(EV200)를
    통해 차단되어야 한다 [S13, S22, S24]. 전원 어댑터의 양(+) 출력은 독립적으로 유지해야 하며, 임의로 합치지 않는다 [S13].
    OpenCR 제어기의 ADC 신호는 반드시 3.3 V 전압 레벨 내에서 관리되어야 한다 [S11].'
  worked_examples:
  - '예제 1: 텐던 파단 하중 계산. 요구되는 최대 장력이 100 daN일 때, 안전율을 2로 설정하면 200 daN 이상의 파단 하중을 가진
    텐던이 필요하다. 사용 가능한 Liros Dyneema SK78(230 daN)은 안전 기준을 충족한다 [S14].'
  - '예제 2: 전류 분기 설계. 11개의 XM430 액추에이터(각 스톨 전류 2.3 A)를 3개의 전원 어댑터(각 11.5 A)에 배분한다.
    4대/4대/3대 구성 시 최대 스톨 전류 합계는 각각 9.2 A, 9.2 A, 6.9 A이다. 각 분기에 10 A 퓨즈를 배치하면 과전류 상황에서
    시스템을 안전하게 보호할 수 있다 [S13, S24].'
  lab:
    title: 텐던 경로 설계 및 모의 조립
    steps:
    - CAD 환경에서 손가락 관절 모델에 텐던 경로를 설계하고 마찰 최소화 곡률을 적용한다.
    - 텐던 장력 전달을 위한 캡스턴 직경을 계산하고 물리적 간섭 여부를 확인한다.
    - OpenCR 보드와 FSR 402 센서를 활용한 3.3 V 전압 분압 회로를 구성한다.
    - 비상 차단 시스템(EV200)과 독립 퓨즈 분기 회로도를 작성한다.
    safety:
    - 실험 중 보안경을 반드시 착용한다.
    - 모든 전원 연결 전 멀티미터로 단락 여부를 확인한다.
    - 전원 공급 장치의 전류 제한 기능을 최소화하여 설정하고 테스트를 시작한다.
    - 모터 구동 중 손가락 끼임 사고를 예방하기 위해 정지 시 차단 기능을 반드시 테스트한다.
    deliverables:
    - 텐던 구동 경로 CAD 도면
    - 전원 및 안전 차단 배선도(BOM 포함)
    - OpenCR-FSR 센서 인터페이스 회로도
    - 설계 검토 보고서
  assignment:
    title: 5지 로봇손 하드웨어 설계안 제출
    deliverables:
    - 5지 로봇손 상세 설계 CAD 데이터
    - 전체 시스템 정격이 반영된 BOM (전원 및 퓨즈 사양 포함)
    - 동역학적 설계 타당성 보고서
    rubric:
    - 텐던 경로와 마찰 저감 설계의 타당성
    - BOM과 시스템 truth 요구사항 일치도(특히 안전 분기 구성)
    - 안전 시스템(퓨즈 및 비상 정지) 설계의 명확성
  quiz:
  - question: DYNAMIXEL XM430-W350-T 액추에이터 11개를 사용할 때 안전한 전원 공급 방법은?
    choices:
    - 모든 액추에이터의 양(+) 출력을 하나로 묶어 대용량 전원 하나에 연결한다.
    - 독립된 전원 분기를 사용하며, 각 분기는 전용 10 A 퓨즈와 접촉기로 보호한다.
    - 전원 분기 없이 모든 전원을 OpenCR 12 V 레귤레이터에 연결한다.
    - 전원 양(+) 출력을 병렬로 연결하여 전류 용량을 높인다.
    answer_index: 1
    explanation: 독립된 분기를 구성하고 전용 퓨즈 및 접촉기로 보호하는 것이 안전 설계의 기본 원칙입니다. 양(+) 출력은 절대로 병렬로
      연결하지 않습니다 [S13, S22].
  - question: OpenCR 제어기에서 FSR 힘 센서 신호를 취득할 때 지켜야 할 사항은?
    choices:
    - FSR 전압 분압 회로에 12 V 액추에이터 전원을 사용한다.
    - OpenCR의 ADC 입력 신호를 0-5 V 범위 내로 유지한다.
    - 3.3 V 센서 전원을 사용하여 ADC 입력 신호가 0-3.3 V를 초과하지 않게 한다.
    - 외부 RS-485 브리지 회로를 추가하여 전압을 변환한다.
    answer_index: 2
    explanation: OpenCR의 센서 회로는 3.3 V 레일을 사용하여 ADC 신호를 0-3.3 V 범위로 유지해야 합니다 [S11].
  completion_criteria:
  - 텐던 경로 설계 도면 작성 완료
  - 전체 BOM의 시스템 truth 준수 확인(전원 분기 및 보호 회로)
  - 퀴즈 전 문항 정답 제출
  - 설계 검토 보고서 승인
