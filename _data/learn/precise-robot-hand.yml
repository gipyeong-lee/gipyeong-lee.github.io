- id: mod-8
  slug: firmware-control
  phase_id: phase-3
  title: 펌웨어 개발 및 제어 로직
  estimated_hours: 10.0
  prerequisites:
  - mod-7
  objectives:
  - DYNAMIXEL Protocol 2.0 패킷 통신 원리 이해
  - 실시간 제어 시스템을 위한 ESP32 펌웨어 아키텍처 설계
  - 힘 센서 피드백을 활용한 정밀 파지 제어 알고리즘 구현
  - 안전 상태기계(Safety State Machine) 기반의 비상 정지 로직 구성
  theory_markdown: '### 펌웨어 아키텍처와 DYNAMIXEL 제어

    로봇손 펌웨어는 고속 직렬 통신과 실시간 센서 루프를 안정적으로 처리해야 합니다. DYNAMIXEL XM430-W350-T는 Protocol
    2.0을 통해 위치, 속도, 전류 피드백을 제공합니다 [S5]. ESP32는 240MHz 듀얼 코어를 활용하여 한 코어는 통신 및 제어 루프를,
    다른 코어는 센서 데이터 취득 및 시스템 상태 모니터링을 분담합니다 [bom-2].


    ### 센서 융합 및 파지 제어

    손끝 FSR 센서는 0.2N에서 20N까지의 접촉력을 감지합니다 [bom-4]. 펌웨어는 ADC 값을 변환하여 비선형적인 힘 데이터를 선형화한
    후, 이를 타겟 전류값으로 환산하여 액추에이터 토크를 제어합니다. 파지 시에는 전류 제한 루프를 사용하여 과부하로부터 텐던과 모터를 보호합니다.


    ### 안전 제어 로직

    시스템은 비상정지 푸시버튼 입력을 감지하는 전용 인터럽트를 가집니다 [bom-10]. 입력 발생 시, 펌웨어는 모든 DYNAMIXEL의 출력을
    즉시 차단(Torque-off)함과 동시에 EV200 고전류 접촉기 코일의 전원을 끊어 전체 DC 버스를 물리적으로 분리합니다 [bom-10,
    B-SAFETY-CUTOFF].'
  worked_examples:
  - '통신 패킷 생성 예시: DYNAMIXEL의 특정 ID에 위치 명령을 내리기 위해 ''Instruction Packet''을 구성하고 Checksum을
    계산하여 송신하는 과정.'
  - '힘 센서 맵핑 예시: FSR 센서 ADC 값을 0~4095에서 0~20N으로 매핑하고, 이를 액추에이터의 1024 스텝 토크 제한값으로 변환하는
    수식.'
  - '비상 정지 루틴: 비상 정지 인터럽트 트리거 시, `detachInterrupt()`를 통해 시스템 정지 상태를 유지하고, 재부팅 전까지
    제어 루프를 완전히 중단하는 코드 구조.'
  lab:
    title: 실시간 제어 루프 검증 및 비상 정지 시험
    steps:
    - ESP32와 DYNAMIXEL 간의 통신 확인 (Ping 패킷 테스트)
    - 힘 센서 가압 실험을 통한 ADC 피드백 안정성 확인
    - 비상 정지 버튼 구동 시 고전류 접촉기(EV200) 개방 동작 확인
    - 전류 제한 루프가 로봇손 구동 중 과부하를 감지하는지 시험
    safety:
    - 모든 테스트는 12V 저전압 벤치 전원 사용 필수 [bom-3]
    - 전류 제한 회로가 물리적으로 구성되었는지 확인 후 전원 인가
    - 로봇손 구동부 주변에 신체 접촉 금지 (끼임 방지)
    - 비상 정지 시스템 동작 검증 시 반드시 보안경 착용
    deliverables:
    - 제어 주기(주파수) 로그 데이터
    - 힘 센서-토크 변환 교정 기록
    - 비상 정지 동작 시간 측정 결과
  assignment:
    title: 지능형 파지 제어 펌웨어 구현
    deliverables:
    - 제어 펌웨어 소스 코드 (.ino/.cpp)
    - 안전 상태기계 설계 문서
    - 파지력 성능 측정 보고서
    rubric:
    - DYNAMIXEL Protocol 2.0 통신 패킷 구현 정확도
    - 센서 데이터 기반 실시간 토크 피드백 제어 안정성
    - 비상 정지 신호 인지부터 전원 차단까지의 지연 시간
    - 코드의 가독성 및 안전 로직의 논리적 완결성
  quiz:
  - question: DYNAMIXEL XM430-W350-T 액추에이터 제어에 권장되는 통신 규격은 무엇인가?
    choices:
    - Protocol 1.0
    - Protocol 2.0
    answer_index: 1
    explanation: XM430 시리즈는 DYNAMIXEL Protocol 2.0을 사용합니다 [S5].
  - question: FSR Model 402 센서의 감지 범위는?
    choices:
    - 0.2N ~ 20N
    - 1N ~ 100N
    answer_index: 0
    explanation: 해당 FSR 센서의 공식 사양은 0.2N에서 20N까지입니다 [bom-4].
  - question: 비상 정지 버튼이 EV200 코일을 제어하는 방식은?
    choices:
    - NC 접점을 통해 전원 공급 차단
    - NO 접점을 통해 직접 전류 차단
    answer_index: 0
    explanation: 비상 정지 버튼의 NC 접점은 평소에 코일 전원을 통과시키다가, 눌리면 회로를 개방하여 코일 전원을 끊습니다 [B-SAFETY-CUTOFF].
  completion_criteria:
  - 모든 테스트 단계 완료 및 안전 기록 작성
  - 비상 정지 시스템이 500ms 이내에 DC 버스를 차단함을 입증
  - 힘 센서 피드백을 활용하여 물체를 미끄러지지 않게 파지하는 코드 검증
  - 과제 제출 및 루브릭 기준 80점 이상 획득
  source_ids:
  - S5
- id: mod-9
  slug: safety-validation
  phase_id: phase-4
  title: 안전 시스템 검증 및 테스트
  estimated_hours: 8.0
  prerequisites:
  - mod-8
  objectives:
  - 기계 안전 표준(IEC 60204-1)의 핵심 개념을 이해하고 로봇 시스템에 적용한다.
  - 비상 정지(E-Stop) 회로와 전력 차단 장치(Contactors)의 연동 원리를 학습한다.
  - 실제 로봇 구동 시스템의 전류 부하를 계산하고 안전 한계치를 검증한다.
  - 시스템 고장 상황을 모의하여 안전 장치가 설계대로 동작하는지 확인한다.
  theory_markdown: '## 기계 안전 및 시스템 검증 이론


    로봇 시스템의 안전은 하드웨어와 소프트웨어의 계층적 보호 체계로 구성된다. **IEC 60204-1**은 기계의 전기 장비에 대한 일반 요구사항을
    정의하며, 본 로봇손 프로젝트는 이 표준에 기반하여 안전 시스템을 구축한다 [S21].


    ### 1. 비상 정지(Emergency Stop) 아키텍처

    비상 정지는 기계의 모든 위험한 움직임을 즉시 차단해야 한다. 제어 회로에서 버튼(예: `A22E-M-12-EMO`)은 강제 개방(Positive
    Opening) NC 접점을 사용하여 신호를 끊으며, 이는 고전류 차단 장치인 **DC 접촉기(EV200)**의 코일 회로와 직렬로 연결된다
    [S22, S23].


    ### 2. 고전류 안전 차단

    시스템의 액추에이터는 11개이며, 각각의 스톨 전류는 2.3 A이다 [bom-1]. 전체 시스템의 피크 전류는 약 25.3 A에 달한다. 따라서
    500 A 정격의 `EV200` 접촉기는 충분한 안전 여유(Safety Margin)를 제공한다 [bom-1, B-SAFETY-CUTOFF].
    안전 검증 시에는 이 접촉기가 비상 신호 입력 후 수 밀리초 내에 DC 버스를 차단하는지 멀티미터와 오실로스코프로 확인해야 한다.


    ### 3. 검증 전략

    - **연속성 시험**: 모든 안전 회로 배선의 저항이 0.1 Ω 이하인지 확인.

    - **동작 시험**: 비상 정지 입력 시 모든 모터의 전원이 즉시 차단되는지 확인.

    - **부하 시험**: 정격 전류 환경에서 차단 장치의 발열 및 이상 징후 확인.'
  worked_examples:
  - "예제 1: 시스템 전체 피크 전류 계산 및 접촉기 적합성 평가\n   - 액추에이터 수(n) = 11개, 개별 스톨 전류(I_stall)\
    \ = 2.3 A.\n   - 총 피크 전류(I_peak) = 11 * 2.3 A = 25.3 A.\n   - `EV200` 접촉기 정격 전류\
    \ = 500 A.\n   - 평가: I_peak << 500 A이므로, 해당 접촉기는 충분한 전류 차단 능력을 보유함 [bom-1, B-SAFETY-CUTOFF]."
  - "예제 2: 전원 분기 퓨즈 용량 설계\n   - 어댑터 모델 `GST160A12-R7B`는 12 V, 11.5 A (138 W) 출력 가능.\n\
    \   - 3개의 어댑터가 분기별로 동작하므로 총 가용 전력은 414 W임.\n   - 로봇손의 최대 동시 동작 전류를 고려하여 각 분기별로\
    \ 10 A 정격 퓨즈를 배치하여 보호 시스템 완성."
  lab:
    title: 비상 정지 시스템 회로 검증 및 응답 시간 측정
    steps:
    - 안전 시스템 제어 회로도 작성 및 배선 완료 (EV200 코일 연결 확인).
    - 멀티미터를 연속성 모드(Continuity)로 설정하여 비상 정지 버튼 NC 접점 확인.
    - 벤치 전원 공급 장치를 사용하여 제어 회로(12 V)에 최소 전압 인가.
    - 비상 정지 버튼을 누르고 멀티미터로 EV200의 고전류 단자 측 DC 전압 차단 여부 측정.
    - 전원 차단 후 시스템 부하 재인가 시 정상 복구 여부 확인.
    safety:
    - 반드시 보안경을 착용할 것.
    - 고전류 DC 버스 작업 전 항상 전원 코드를 분리할 것.
    - 실험 중 전류 제한 기능을 벤치 전원에 설정하여 과전류 방지.
    - 끼임 방지를 위해 로봇손과 연결된 텐던을 일시적으로 분리하고 진행.
    deliverables:
    - 검증 회로 연결 사진 및 배선도 수정본.
    - 비상 정지 입력에 따른 전원 차단 응답 시간 측정 기록.
    - 안전 시스템 동작 점검 체크리스트.
  assignment:
    title: 로봇손 안전 시스템 검증 보고서 작성
    deliverables:
    - 검증 수행 기록이 포함된 최종 보고서 (PDF)
    - 위험 요소 분석 및 개선 사항 표
    rubric:
    - 안전 표준(IEC 60204-1) 적용의 타당성 (25%)
    - 전류 부하 계산의 정확성 및 근거 제시 (25%)
    - 검증 실험 과정의 구체성 및 데이터 신뢰성 (30%)
    - 비상 정지 메커니즘의 전기적 구성 이해도 (20%)
  quiz:
  - question: IEC 60204-1 표준이 로봇 시스템 설계에서 주로 다루는 영역은 무엇인가?
    choices:
    - 기계의 전기 장비 및 제어 시스템 요구사항
    - 3D 프린팅 필라멘트의 물성치
    - 소프트웨어 코딩 컨벤션
    - 로봇손의 파지 알고리즘 설계
    answer_index: 0
    explanation: IEC 60204-1은 기계의 전기 및 제어 장비에 대한 일반 요구사항을 정의하는 국제 표준입니다 [S21].
  - question: 본 프로젝트에서 EV200 접촉기를 사용하는 주된 이유는?
    choices:
    - 모터의 위치 정밀도를 높이기 위해
    - 비상 시 고전류 DC 버스를 안전하게 차단하기 위해
    - 액추에이터에 통신 신호를 증폭하기 위해
    - 3D 프린팅 부품의 강도를 보강하기 위해
    answer_index: 1
    explanation: EV200은 고전류(500 A) 차단 정격을 가진 DC 접촉기로, 비상 정지 시 제어 회로의 신호를 받아 주 전력을
      물리적으로 차단하는 역할을 수행합니다 [B-SAFETY-CUTOFF, S23].
  completion_criteria:
  - 비상 정지 시스템의 전기적 결선 완성 및 동작 검증 완료.
  - 시스템 최대 전류 부하 분석 보고서 제출.
  - 실험 과정에서 모든 안전 수칙을 준수하고 검증 데이터를 기록함.
  source_ids:
  - S21
  - S22
  - S23
- id: mod-10
  slug: performance-analysis
  phase_id: phase-4
  title: 최종 성능 평가 및 보고
  estimated_hours: 8.0
