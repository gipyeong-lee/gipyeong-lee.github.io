- id: mod-8
  slug: safety-calibration
  phase_id: phase-3
  title: 안전 시스템 및 교정
  estimated_hours: 10.0
  prerequisites:
  - mod-7
  objectives:
  - 기계 안전 표준(IEC 60204-1)에 따른 로봇 시스템 안전 설계 원칙을 이해한다 [S20].
  - 독립적인 전원 분기 및 과전류 보호 회로를 올바르게 구성하고 검증한다 [S20].
  - 비상정지(E-Stop) 회로가 다중 액추에이터 전원 분기를 안전하게 차단하도록 설계한다 [S21].
  - 전압 분압 회로를 사용하여 FSR 센서의 ADC 신호를 안전 범위(0~3.3V) 내에서 교정한다.
  theory_markdown: '### 기계 안전 및 제어 시스템

    로봇 시스템의 안전 설계는 작업자와 장비를 보호하기 위한 최우선 과제입니다. 국제 표준인 IEC 60204-1은 제어 회로 보호, 비상정지
    장치 및 전원 분리 시스템에 대한 기술적 요구사항을 정의합니다 [S20].


    #### 1. 전원 분기와 과전류 보호

    본 로봇손은 3개의 독립적인 12V DC 전원 어댑터(GST160A12-R7B)를 사용합니다. 각 출력은 서로 분리된 퓨즈 분기로 관리되어야
    하며, 양(+) 출력 단자를 물리적으로 하나로 합치는 설계는 금지됩니다. 각 분기마다 10A ATOF 퓨즈를 배치하여 개별 액추에이터의 스톨
    전류 합계(최대 9.2A)가 초과할 경우 시스템을 안전하게 차단합니다 [S23, S24].


    #### 2. 비상정지(Emergency Stop) 아키텍처

    비상정지는 저전류 제어 회로를 통해 대전류 전원 분기를 차단하는 방식을 취합니다. 래칭 비상정지 버튼(A22E-M-12-EMO)이 조작되면,
    NC(Normal Closed) 접점이 개방되어 3개의 고전류 접촉기(EV200) 코일 전원을 동시에 차단합니다 [S21, S22]. 이 방식은
    500A 차단 정격의 접촉기가 모터 전원을 즉각 개방하게 하여 고장 시에도 확실한 전원 분리를 보장합니다.


    #### 3. 센서 신호 교정 (OpenCR ADC)

    FSR 402 센서는 10kΩ 분압 저항과 연결되어 OpenCR 제어 보드의 ADC 핀으로 신호를 보냅니다. 이때 센서 전원은 반드시 3.3V
    센서 전용 레일에서 공급받아야 하며, 어떠한 경우에도 12V 액추에이터 전원이 ADC 입력에 유입되지 않도록 설계해야 합니다. ADC 값은
    0~3.3V 범위(12bit 해상도) 내에서 정상 작동하도록 물리적 필터링과 소프트웨어 오프셋 교정을 수행합니다 [S11, S25].'
  worked_examples:
  - '예제 1: 분기 전원 합산 계산. 총 11개의 XM430-W350-T 액추에이터(분기당 3~4대)가 사용됩니다. 분기당 스톨 전류는 4.1N·m
    기준 2.3A이므로 4대일 때 최대 9.2A입니다. 10A 퓨즈는 9.2A 이하의 정상 작동 범위는 통과시키고 10A 이상의 지속적 과전류를
    차단하여 전원 어댑터(11.5A 정격)를 보호합니다.'
  - '예제 2: 비상정지 안전 동작. 비상정지 버튼을 누르면 12V 액추에이터 전원 분기 3개가 동시에 차단됩니다. 이는 전체 전류 25.3A(11개
    × 2.3A)가 흐르는 상황에서도 안전하게 동작하며, EV200 접촉기의 DC 차단 성능은 900VDC까지 보장되므로 12V 시스템에서 매우
    안정적입니다 [S22].'
  lab:
    title: 비상정지 회로 검증 및 센서 교정
    steps:
    - 각 독립 전원 분기의 퓨즈 홀더가 배선도대로 10A 퓨즈와 연결되었는지 멀티미터로 도통 시험을 실시한다.
    - 비상정지 버튼을 해제한 상태에서 접촉기의 12V 코일 전압을 측정하여 정상적으로 닫혀 있는지 확인한다.
    - 비상정지 버튼을 누르고 접촉기가 즉시 개방되어 액추에이터 전원 라인이 단락되는지 확인한다.
    - FSR 센서와 10kΩ 분압 회로를 3.3V 센서 레일에 연결하고, 하중을 가하지 않았을 때 ADC 값이 0에 가까운지, 20N 하중 시
      최대치(3.3V) 내에 있는지 확인한다 [S10, S25].
    safety:
    - 반드시 저전압 벤치 전원 및 전류 제한 모드를 사용하여 시험한다.
    - 회로 작업 시 보안경을 착용한다.
    - 비상정지 버튼은 반드시 강제 개방(NC) 구조인지 사양을 재확인한다 [S21].
    deliverables:
    - 비상정지 버튼 작동 전후의 액추에이터 전원 분기 전압 측정 데이터
    - FSR 센서 하중-ADC 출력 교정 그래프
    - 각 독립 분기의 절연 상태 확인 보고서
  assignment:
    title: 시스템 안전 평가 보고서
    deliverables:
    - 비상정지 동작 시 3개 분기 동시 차단 증명 배선도
    - 센서 전원(3.3V)과 모터 전원(12V)이 분리되었음을 보여주는 회로 설계 설명
    - 시스템 과전류 발생 시 퓨즈 작동 예측 및 보호 성능 기술 보고서
    rubric:
    - 비상정지 회로가 각 독립 전원 분기를 동시에 차단하도록 설계되었는가?
    - 센서 전압이 0~3.3V 범위를 넘지 않도록 분압 회로가 올바르게 설계되었는가?
    - 각 분기별 스톨 전류 합계가 퓨즈 정격(10A) 내에 있는가?
  quiz:
  - question: 로봇손 시스템에서 각 액추에이터 전원 분기의 양(+) 출력 단자를 병렬로 연결하는 것에 대한 안전 평가로 옳은 것은?
    choices:
    - 허용 가능, 전체 전류 효율을 높임
    - 절대 금지, 각 분기의 독립적인 퓨즈 보호 및 접촉기 차단 기능을 저해함
    - 퓨즈 용량을 30A로 올리면 가능
    - 비상정지 버튼 접점 성능이 충분하면 가능
    answer_index: 1
    explanation: 본 시스템은 독립 전원 분기를 구성하여 각 퓨즈와 접촉기가 해당 분기를 개별적으로 보호하도록 설계되었습니다. 양(+)
      출력을 합치면 보호 시스템의 작동을 방해하여 위험합니다.
  - question: OpenCR 제어 보드에서 FSR 센서 전압 분압 회로에 공급해야 하는 전압은 무엇인가?
    choices:
    - 12V (액추에이터 전원)
    - 24V (최대 입력 전압)
    - 3.3V (센서 전용 레일)
    - 5V (디지털 레일)
    answer_index: 2
    explanation: FSR 센서 및 분압 회로는 반드시 OpenCR의 3.3V 센서 전원 레일에 연결하여 ADC 입력 범위인 0~3.3V를
      준수해야 합니다 [S11].
  - question: 비상정지 발생 시 모터 전원 분기를 차단하는 핵심 부품은?
    choices:
    - 분기 퓨즈
    - 고전류 접촉기 (EV200)
    - 전압 분압 저항
    - OpenCR 디지털 출력 핀
    answer_index: 1
    explanation: 비상정지 버튼은 저전류 제어 회로를 통해 고전류 접촉기(EV200)의 코일을 차단하여 대전류 전원 분기를 개방합니다
      [S22].
  completion_criteria:
  - 비상정지 회로 시험을 통과하고, 버튼 조작 시 3개 모든 모터 전원이 즉시 개방됨을 확인.
  - FSR 센서의 하중별 ADC 출력이 0~3.3V 범위 내에서 선형적으로 데이터화됨.
  - 모든 배선이 독립 퓨즈 분기 및 접촉기를 경유하도록 결선 완료.
  - 안전 시스템 설계 보고서 제출 및 통과.
