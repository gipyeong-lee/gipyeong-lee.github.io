- id: mod-10
  slug: calibration-testing
  phase_id: phase-3
  title: 교정 및 파지 성능 검증
  estimated_hours: 10.0
  prerequisites:
  - mod-9
  objectives:
  - 로봇 손의 센서 데이터 교정 원리를 이해하고 적용한다.
  - FSR(힘 감지 센서) 데이터를 기반으로 접촉력을 정량화한다.
  - 로봇 손의 파지 성능을 검증하기 위한 측정 항목을 설계한다.
  - 시스템 통합 후 안전하게 전원을 인가하고 계측한다.
  theory_markdown: "### 센서 교정 및 힘 측정 이론\n\n로봇 손의 접촉력 피드백은 FSR 402 센서를 활용하여 구현됩니다 [S6].\
    \ FSR은 가해지는 힘이 증가함에 따라 저항값이 감소하는 특성을 가집니다 [S6]. 이를 전압 값으로 변환하기 위해 OpenCR 제어 보드의\
    \ 3.3 V 센서 전원을 기준으로 10 kΩ 분압 저항과 연결하여 분압 회로를 구성합니다 [S15, S26].\n\nADC 입력 전압(V_out)은\
    \ 다음과 같이 계산됩니다: \n10 kΩ 풀다운 분압기는 $V_{out}=V_{ref}\\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$를\
    \ 사용한다\n여기서 V_ref는 3.3 V이며, R_fix는 10 kΩ 저항입니다 [S15, S26]. 12비트 ADC 해상도를 통해 입력되는\
    \ 0~3.3 V 신호는 0~4095의 디지털 값으로 매핑됩니다 [S15].\n\n**주의:** 센서 전압 분압 회로는 반드시 3.3 V 레일을\
    \ 사용해야 하며, ADC 입력 신호는 절대 3.3 V를 초과하지 않도록 설계합니다 [S15, S26].\n\n### 파지 성능 검증\n\n\
    검증은 정지 마찰력 측정, 파지 성공률, 텐던 장력의 선형성을 포함합니다 [S12]. 반복 정밀도를 확인하기 위해 동일한 하중을 가진 물체를\
    \ 반복적으로 파지하여 센서 피드백의 일관성을 검토합니다 [S11, S12]."
  worked_examples:
  - '예제 1: OpenCR ADC 값이 2048일 때 입력 전압 계산. 12비트 ADC이므로 (2048/4095) * 3.3 V = 약 1.65
    V가 됩니다. 이는 0~3.3 V 범위를 만족합니다 [S15, S26].'
  - '예제 2: FSR 저항값이 10 kΩ으로 측정될 때, 3.3 V 기준 분압 전압은 V_out = 3.3 V * (10 kΩ / (10 kΩ
    + 10 kΩ)) = 1.65 V입니다 [S15, S26].'
  lab:
    title: 손끝 접촉력 센서 교정 및 출력 확인
    steps:
    - 각 독립 분기의 전원 어댑터가 분리된 무전원 상태에서 분압 회로 조립 상태를 멀티미터로 검토합니다.
    - OpenCR 제어 보드에 3.3 V 센서 전원을 인가하고, 각 FSR 센서의 ADC 입력 전압이 정상 범위(0~3.3 V) 내에 있는지
      멀티미터로 측정합니다 [S15].
    - 표준 분동을 사용하여 손끝 FSR에 단계적으로 힘을 가하며 ADC 출력값을 기록하여 교정 곡선을 작성합니다.
    - 데이터 취득 코드 실행 후, 힘 인가 전/후의 ADC 변화를 확인하여 센서 동작을 검증합니다.
    safety:
    - 반드시 3개의 독립 전원 어댑터를 분리하고, 멀티미터 DC 전압 모드로 모든 분기가 1 V 미만임을 확인한 후 실습에 접근합니다.
    - 실습 중 텐던 장력 시험 시 손가락 끼임에 주의하고 보안경을 착용합니다.
    - 절대 5 V 또는 12 V 액추에이터 전원을 센서 회로에 사용하지 않습니다.
    deliverables:
    - 센서별 힘-ADC 출력 교정 그래프
    - 파지 반복 시험 데이터 기록
    - 교정 결과 최종 보고서
  assignment:
    title: 파지 성능 검증 및 보고
    deliverables:
    - 설계된 파지 시험 시나리오 및 수행 절차서
    - 5지 로봇손의 파지 성공률 분석 데이터
    - 최종 성능 검증 보고서
    rubric:
    - 센서 교정 곡선의 선형성 및 반복성 확보 (40%)
    - 파지 성공률 분석의 통계적 타당성 (30%)
    - 안전 수칙 준수 및 물리적 계측 확인 절차 기록 (30%)
  quiz:
  - question: FSR 센서 분압 회로 구성 시 OpenCR 보드에서 사용해야 하는 올바른 전압 레일은?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 전원
    - 5 V 시스템 전원
    - 24 V 입력 전원
    answer_index: 1
    explanation: OpenCR 센서 전압 분압 회로는 3.3 V 레일을 사용하여 ADC 입력을 0~3.3 V 범위로 유지해야 합니다 [S15].
  - question: 교정 전 무전원 상태를 확인하는 방법으로 올바른 것은?
    choices:
    - 멀티미터 저항 모드 확인
    - 멀티미터 DC 전압 모드로 각 분기 1 V 미만 확인
    - 퓨즈 단선 확인
    - 전원 LED 꺼짐 확인
    answer_index: 1
    explanation: 반드시 물리적 전원 분리 후 멀티미터 DC 전압 모드를 통해 1 V 미만임을 확인하는 것이 유일한 안전 절차입니다.
  - question: FSR 402의 힘-저항 특성은 무엇입니까?
    choices:
    - 힘이 증가하면 저항이 증가한다.
    - 힘이 증가하면 저항이 감소한다.
    - 힘과 저항은 관계없다.
    - 힘이 증가하면 저항은 일정하다.
    answer_index: 1
    explanation: FSR은 가해지는 힘이 증가할수록 전기 저항이 감소하는 특성을 가집니다 [S6].
  completion_criteria:
  - 5개 손끝 FSR 센서의 ADC 데이터가 0~3.3 V 범위 내에서 정상 동작함을 확인
  - 교정 곡선을 통해 힘 값을 정확하게 추정 가능
  - 파지 반복 시험을 통해 90% 이상의 성공률 도출
  - 물리적 무전원 상태 확인 절차를 포함한 최종 보고서 제출
