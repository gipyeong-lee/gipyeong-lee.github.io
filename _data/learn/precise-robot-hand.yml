- id: M4
  slug: hand-design-principles
  phase_id: P2
  title: 로봇 핸드 기구 설계 원리
  estimated_hours: 8.0
  prerequisites:
  - M3
  objectives:
  - 로봇 핸드의 기본 기구학적 설계 원리를 이해한다.
  - 언더액추에이션(Underactuation) 메커니즘의 구조와 동작 원리를 파악한다.
  - 인간의 손 구조를 모사한 5지 로봇 핸드의 자유도와 구동 방식 간의 관계를 분석한다.
  - FDM 3D 프린팅을 고려한 기구부 설계 최적화 기법을 습득한다.
  theory_markdown: '## 로봇 핸드 기구 설계 원리


    로봇 핸드는 복잡한 물리적 환경에서 물체를 파지(grasping)하고 조작(manipulation)하는 말단 장치(end-effector)입니다.
    설계의 핵심은 인간의 손이 가진 높은 자유도(DOF)와 기능성을 어떻게 적은 수의 액추에이터로 구현할 것인가에 있습니다 [S12, S13].


    ### 1. 언더액추에이션 (Underactuation)

    로봇 핸드의 전체 관절 자유도보다 구동기(액추에이터)의 수가 적은 설계를 의미합니다 [S13, S14]. 이는 제어 시스템의 복잡성을 낮추고
    비용을 절감하며, 대상 물체의 형상에 맞춰 손가락이 자연스럽게 휘어지는 적응형 파지(adaptive grasping)를 가능하게 합니다 [S12,
    S14].


    ### 2. 구동 메커니즘

    주로 텐던(tendon, 와이어) 구동 방식이 널리 사용됩니다. 구동기에서 전달된 힘은 와이어를 통해 손가락 마디(phalanges)로 전달됩니다
    [S12]. 인간의 근육 구조를 모사하여 주동근(agonist)과 길항근(antagonist) 쌍을 구현하면 더 정교한 동작 제어가 가능합니다
    [S12, S15].


    ### 3. FDM 3D 프린팅 설계 고려사항

    - **벽 두께**: 구조적 강성을 위해 최소 1.2mm 이상의 두께를 권장하며, 부하가 집중되는 부위는 보강 리브(rib)를 설계해야 합니다
    [S73, S74].

    - **오버행(Overhang)**: 서포트 최소화를 위해 45도 이상의 경사면은 챔퍼(chamfer)나 필렛(fillet)을 활용하여 설계합니다
    [S74, S77].

    - **공차(Clearance)**: 맞물리는 기구부 사이에는 최소 0.5mm 이상의 간극을 두어 출력 후 간섭을 방지해야 합니다 [S73,
    S77].'
  worked_examples:
  - '예제 1: 관절 자유도와 액추에이터 선정 - 21 자유도를 가진 로봇 핸드에 12개의 액추에이터를 배치할 경우, 언더액추에이션 비율은 약
    0.57입니다. 이는 복잡한 기구 제어를 단순화하기 위한 설계 최적화의 결과입니다 [S13].'
  - '예제 2: 텐던 장력 계산 - 손가락 끝에 10N의 파지력을 가하기 위해 필요한 텐던 장력($T$)을 구하려면 손가락 마디의 길이($L$)와
    조인트 회전 중심까지의 거리($r$)를 고려하여 모멘트 평형식 $\sum M = 0$을 만족해야 합니다 [S15].'
  lab:
    title: 로봇 핸드 기구부 3D 모델링 및 적층 제조 실습
    steps:
    - 인간 손의 해부학적 구조를 참조하여 메타카포팔랑지얼(MCP) 조인트를 포함한 5지 로봇 손의 CAD 설계
    - FDM 3D 프린터의 출력 정밀도를 고려하여 조인트 간 0.5mm 간극 확보
    - '설계된 부품의 슬라이싱 프로그램(예: Cura) 최적화 (서포트 최소화 출력 설정)'
    - 3D 프린팅 수행 및 서포트 제거 후 기구적 동작(회전, 유연성) 확인
    - '와이어 및 구동 모터(예: DYNAMIXEL XM430)를 활용한 기구부 조립'
    safety:
    - 3D 프린터 노즐 고온 주의 (화상 방지)
    - 서포트 제거 시 니퍼 등 공구 취급 주의 (보안경 착용 필수)
    - 전동 공구 및 조립 중 손가락 끼임 사고 방지
    - 전기 납땜 시 환기 및 저전압 전원 규정 준수
    deliverables:
    - 로봇 핸드 CAD 설계 파일 (STEP/STL)
    - 설계 도면 (BOM 포함)
    - 조립 완료된 5지 로봇 핸드 하드웨어
    - 기구부 조작 확인 영상 (파지 시뮬레이션)
  assignment:
    title: 로봇 핸드 최적 설계 보고서
    deliverables:
    - 설계 요구사항 명세서
    - 기구학적 분석을 포함한 설계 최종 보고서
    - BOM (Bill of Materials) 및 사양서
    rubric:
    - 언더액추에이션 설계 원리 반영 정도 (30%)
    - FDM 3D 프린팅 최적화 설계 (오버행, 벽 두께 고려) (30%)
    - 기구적 기능 구현성 및 조립 정확도 (20%)
    - 보고서 논리성과 기술적 근거 제시 (20%)
  quiz:
  - question: 언더액추에이션(Underactuation) 핸드의 주된 장점은 무엇인가?
    choices:
    - 모든 관절의 완벽하고 독립적인 제어
    - 구동기 수 감소로 인한 구조 단순화 및 비용 절감
    - 인간의 손보다 훨씬 강력한 고출력 파지력
    - 센서 없이도 모든 물체의 무게를 정밀하게 측정
    answer_index: 1
    explanation: 언더액추에이션은 자유도보다 적은 수의 액추에이터를 사용하여 시스템을 단순화하고, 경제성을 높이며 적응형 파지를 구현하는
      것이 핵심 장점입니다 [S13, S14].
  - question: FDM 3D 프린팅 설계 시 맞물리는 관절 부품 간의 최소 간극(clearance) 권장값은 얼마인가?
    choices:
    - 0.1mm 이하
    - 0.5mm 이상
    - 2.0mm 이상
    - 5.0mm 이상
    answer_index: 1
    explanation: 일반적으로 FDM 출력물 간의 움직임을 보장하고 부품 간 융착을 방지하기 위해서는 최소 0.5mm 이상의 간극을 확보하는
      것이 권장됩니다 [S73, S77].
  - question: 로봇 핸드의 텐던 구동 방식에서 복원력을 구현하기 위해 가장 흔히 사용되는 요소는?
    choices:
    - 수동 탄성 요소(고무줄, 비틀림 스프링)
    - 독립적인 보조 모터
    - 자기장 반발력
    - 유압식 리셋 시스템
    answer_index: 0
    explanation: 많은 언더액추에이션 텐던 로봇 핸드는 설계 복잡성을 낮추기 위해 고무줄이나 비틀림 스프링 같은 수동 탄성 요소를 사용하여
      손가락을 원위치로 복원시킵니다 [S12, S21].
