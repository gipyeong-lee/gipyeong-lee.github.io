- id: m6
  slug: sensor-integration
  phase_id: p2
  title: 센서 데이터 수집 시스템 구성
  estimated_hours: 10.0
  prerequisites:
  - m4
  objectives:
  - FSR 402 센서의 동작 원리와 저항-압력 특성 이해
  - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
  - 3.3V 센서 전원을 사용한 정밀 분압 회로 설계 및 구현
  - 센서 노이즈 필터링 및 데이터 수집을 위한 기본 제어 알고리즘 구성
  theory_markdown: "## 센서 인터페이스 이론\n\n### FSR(Force Sensing Resistor) 원리\nFSR 402는\
    \ 박막형 고분자 후막 센서로, 압력이 가해지면 내부 도전성 입자 간의 접촉이 증가하여 저항값이 감소하는 특성을 가집니다 [S12]. 센서\
    \ 저항은 압력에 반비례하며, 0.2N에서 20N 범위에서 연속적인 아날로그 값을 출력할 수 있습니다 [S12].\n\n### 전압 분압 회로(Voltage\
    \ Divider)\n센서 자체는 수동형 가변 저항이므로, 제어기가 읽을 수 있는 전압 신호로 변환해야 합니다. OpenCR 제어기의 ADC\
    \ 입력은 0~3.3V 범위를 지원하므로, 반드시 3.3V 센서 전원 레일을 사용해야 합니다 [S13].\n\n1. 회로 구성: 3.3V 전원\
    \ - FSR - (ADC 노드) - 10kΩ 저항 - GND [S25].\n2. 출력 전압 공식: $V_{ADC} = 3.3V \\times\
    \ \\frac{R_{fixed}}{R_{FSR} + R_{fixed}}$\n   - $R_{fixed}$는 10kΩ 저항이며, 0.25W\
    \ 정격을 사용해야 합니다 [S25].\n\n### 안전 수칙\n- 12V 액추에이터 전원과 센서 회로(3.3V)는 물리적으로 분리되어야 합니다\
    \ [S13].\nFSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를 0~3.3 V 범위로 유지한다.\n- 모든 ADC\
    \ 입력 신호는 0~3.3V를 초과하지 않아야 합니다 [S13]."
  worked_examples:
  - '예제 1: 10kΩ 저항 선정 이유. FSR 402의 동작 저항 범위 내에서 ADC의 전압 변화율(Sensitivity)을 최대화하기 위해
    상용으로 흔히 쓰이는 10kΩ 저항을 사용합니다 [S25].'
  - '예제 2: 전압 측정. FSR에 10N(중간 부하)이 가해져 센서 저항이 약 10kΩ이 되었다면, 공식에 따라 $V_{ADC} = 3.3V
    \times 10k / (10k + 10k) = 1.65V$가 되어 ADC 범위(0~3.3V) 내에 안정적으로 입력됩니다.'
  lab:
    title: FSR 센서 인터페이스 구현 및 교정
    steps:
    - 벤치 전원 어댑터 전원 분리 후 멀티미터 DC 전압 모드로 모든 단자 전압이 1V 미만임을 확인합니다.
    - OpenCR 3.3V 센서 전원 핀과 ADC 핀 사이에 10kΩ 저항을 납땜합니다 [S25].
    - FSR 402 센서를 3.3V 전원과 ADC 핀 사이에 연결합니다 [S12].
    - 전원 인가 후 멀티미터로 3.3V 라인이 정상인지 확인하고, 부하 없는 상태에서 ADC 값을 시리얼 모니터로 확인합니다.
    - 교정 지그를 사용하여 센서에 가해지는 힘을 변화시키며 ADC raw 데이터를 수집합니다.
    safety:
    - 반드시 3개의 전원을 모두 물리적으로 분리하고 멀티미터로 1V 미만 확인 후 배선합니다.
    - 보안경을 착용하고 납땜 시 발생하는 흄을 환기합니다.
    - ADC 핀에 12V나 5V가 직접 접촉되지 않도록 배선 상태를 2회 확인합니다.
    deliverables:
    - 완성된 센서 회로 사진
    - ADC Raw 데이터-부하(N) 대응 교정 표
    - 측정값 노이즈 확인을 위한 시간에 따른 ADC 데이터 그래프
  assignment:
    title: 로봇 손 센서 데이터 필터링 제어기 설계
    deliverables:
    - 센서 데이터 수집 펌웨어 소스 코드
    - 데이터 필터링 알고리즘 설계 문서
    - 최종 성능 검증 보고서
    rubric:
    - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
    - 데이터 수집 및 이동 평균 필터 구현의 정확성
    - 제출된 배선도와 실제 회로의 일치성
  quiz:
  - question: FSR 센서와 ADC 인터페이스를 위해 전압 분압 회로를 구성할 때 OpenCR 제어기에서 사용해야 하는 전원 전압은 무엇입니까?
    choices:
    - 12V (액추에이터 전원)
    - 5V
    - 3.3V
    - 24V
    answer_index: 2
    explanation: OpenCR의 ADC는 0~3.3V 범위를 지원하며, 센서 보호와 정밀한 측정을 위해 3.3V 센서 전원을 사용해야
      합니다 [S13].
  - question: FSR 402의 동작 원리에 대한 설명으로 올바른 것은 무엇입니까?
    choices:
    - 압력이 증가하면 저항이 증가한다.
    - 압력이 증가하면 저항이 감소한다.
    - 전압을 가하면 압력이 발생한다.
    - 정전용량 변화를 감지한다.
    answer_index: 1
    explanation: FSR은 압력이 가해지면 도전성 입자의 접촉이 늘어나 저항이 감소하는 특성을 가집니다 [S12].
  completion_criteria:
  - 실습 단계에서 3.3V ADC 전압 범위 내 센서 신호 정상 수집 확인
  - 모든 배선에서 1V 미만 무전원 상태를 멀티미터로 검증 완료
  - 센서 데이터 수집 알고리즘이 포함된 펌웨어 기능 구현
  source_ids:
  - S12
  - S25
  - S13
- id: m7
  slug: power-circuit
  phase_id: p2
  title: 전원 회로 및 안전망 구축
  estimated_hours: 10.0
  prerequisites:
  - m5
  objectives:
  - 로봇 시스템의 액추에이터 전원 분기 구성과 안전한 전류 배분 원리를 이해한다.
  - OpenCR 제어기의 전원 체계와 센서용 전압 분압 회로 설계 원칙을 학습한다.
  - 실제 하드웨어 환경에서 절연형 전원 장치와 과전류 보호 부품의 올바른 연결 및 검증 방법을 습득한다.
  theory_markdown: '### 전원 분기 및 과전류 보호 원리

    5지 로봇손 시스템은 정밀 제어를 위해 액추에이터 구동 전원과 센서/컨트롤러 전원을 물리적으로 분리하여 구축합니다. 본 시스템에 사용된 DYNAMIXEL
    XM430 액추에이터는 12 V 전압에서 동작하며 [S11], 스톨 전류가 2.3 A에 달합니다 [S11]. 전체 11대의 액추에이터를 구동할
    때 발생 가능한 피크 전류를 고려하여, 138 W(11.5 A) 용량의 독립 절연형 어댑터 3개를 사용하여 액추에이터를 4대, 4대, 3대씩
    분할 배분합니다 [S15].


    각 분기에는 과전류로부터 배선을 보호하기 위해 10 A 정격의 ATOF 블레이드 퓨즈를 인라인 홀더를 통해 장착합니다 [S23, S24].
    이 퓨즈는 분기별 액추에이터들의 스톨 전류 합계(예: 4대일 때 9.2 A)보다는 높고, 전원 어댑터의 정격 전류(11.5 A)보다는 낮게
    설정되어 회로를 보호합니다.


    ### 센서 데이터 취득 회로

    손끝의 접촉력을 측정하는 FSR 402 센서는 압력에 따라 저항이 변하는 특성을 가집니다 [S12]. 이를 MCU에서 읽기 위해 저항 10
    kΩ을 사용하여 전압 분압 회로를 구성합니다 [S25]. 해당 센서 전원은 반드시 OpenCR의 3.3 V 센서 전원 레일을 사용해야 하며,
    12 V 액추에이터 전원과 절대 혼용해서는 안 됩니다 [S13]. ADC 입력 신호는 0~3.3 V 범위를 유지해야 합니다 [S13].'
  worked_examples:
  - '분기별 전류 설계 계산: 4대 액추에이터 분기의 스톨 전류 합계는 2.3 A × 4 = 9.2 A입니다. 전원 어댑터의 정격 출력 11.5
    A 이내이며, 10 A 퓨즈(0287010.U)는 9.2 A 피크 상태에서도 안정적으로 동작하지만, 회로 단락 시 차단 보호를 제공할 수 있는
    적정 사양입니다 [S11, S15, S24].'
  - '센서 전압 분압 계산: 3.3 V 전원에서 FSR(저항 R_fsr)과 10 kΩ(R_fixed) 저항을 사용하여 분압할 때, ADC 전압
    V_adc = 3.3 V × [R_fixed / (R_fsr + R_fsr_fixed)]로 결정됩니다. 교육용 프로토타입은 기계 안전 표준
    준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다 [S13, S25].'
  lab:
    title: 전원 분기 구축 및 계측 실습
    steps:
    - 각 MEAN WELL 어댑터 출력을 물리적으로 분리한 상태에서 멀티미터를 사용하여 12.0 V±0.5 V 출력을 확인한다.
    - 각 분기(+) 라인에 퓨즈 홀더를 납땜하고 10 A ATOF 퓨즈를 삽입한다.
    - OpenCR 3.3 V 레일에서 FSR용 전압 분압 회로를 구성하고, 12 V 전원과 신호선이 분리되었는지 최종 점검한다.
    - 무부하 상태에서 각 전원 커넥터를 액추에이터 하네스에 연결한다.
    safety:
    - 실험 중 정지 시 3개 전원 어댑터를 벽면 AC 콘센트에서 물리적으로 제거한다.
    - 전원 인가 전 반드시 멀티미터 DC 전압 모드로 각 분기의 전압이 1 V 미만임을 확인한다.
    - 납땜 시 보호 안경을 착용하고 연기 흡입기를 사용한다.
    - 액추에이터는 고정 지그에 장착하여 무부하 가동 상태부터 확인한다.
    deliverables:
    - 분기별 전압 측정 데이터 시트
    - 전원 분기 및 퓨즈 결선 사진
    - 무부하 전압 계측 로그
  assignment:
    title: 로봇 손 전원 및 안전 설계 보고서
    deliverables:
    - 전원 분기별 부하 배분 도면
    - 퓨즈 정격 선택 근거 계산서
    - 전원 절연 및 안전 분리 절차서
    rubric:
    - 각 분기별 액추에이터 부하 배분이 11.5 A 정격 이내로 설계되었는가?
    - 3.3 V 센서 레일과 12 V 액추에이터 전원이 올바르게 분리되었는가?
    - 계획 정지 절차(전원 물리 분리)가 명확히 기술되었는가?
  quiz:
  - question: 다음 중 액추에이터 12 V 전원 분기에 관한 올바른 설명은 무엇입니까?
    choices:
    - 모든 액추에이터는 하나의 전원 어댑터에 묶어야 한다.
    - 각 전원 어댑터의 (+) 출력을 서로 연결하여 용량을 증대시킨다.
    - 액추에이터 분기는 독립적으로 퓨즈 보호를 수행해야 한다.
    - FSR 센서와 같은 3.3 V 센서 레일에서 액추에이터 전원을 가져온다.
    answer_index: 2
    explanation: 액추에이터 분기는 과전류 보호를 위해 독립적인 퓨즈를 장착하고, 각 어댑터는 서로 절연된 상태를 유지해야 합니다.
  - question: FSR 센서의 ADC 신호를 취득하기 위해 전압 분압 저항으로 적절한 것은?
    choices:
    - 10 kΩ 고정 저항
    - 50 Ω 고정 저항
    - 1 MΩ 가변 저항
    - 0.1 Ω 고전류 저항
    answer_index: 0
    explanation: 본 시스템은 센서 신호 취득을 위해 10 kΩ 저항을 사용하는 분압 회로 설계를 규정합니다.
  - question: 본 프로토타입에서 실험 중 시스템 정지 시 올바른 행동은?
    choices:
    - 퓨즈를 제거하여 전원을 차단한다.
    - 멀티미터의 저항 모드로 전원 라인을 측정한다.
    - 3개 전원 어댑터를 물리적으로 분리하고 각 분기를 계측한다.
    - 소프트웨어적으로 모터 정지 명령만 수행한다.
    answer_index: 2
    explanation: 안전을 위해 모든 전원을 물리적으로 차단하고 DC 전압 모드로 무전원 상태를 확인해야 합니다.
  completion_criteria:
  - 분기별 퓨즈 홀더 및 10 A 퓨즈 설치 완료
