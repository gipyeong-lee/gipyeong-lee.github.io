- id: mod-6
  slug: controller-setup
  phase_id: phase-3
  title: 제어기 설정 및 통신
  estimated_hours: 10.0
  prerequisites:
  - mod-5
  objectives:
  - 실시간 제어 시스템을 위한 MCU 기반 하드웨어 인터페이스를 이해한다.
  - DYNAMIXEL Protocol 2.0 통신 사양을 준수하는 제어 브리지 회로를 설계한다.
  - 안전 제어 로직을 구현하여 시스템의 비상 정지 및 상태 피드백을 구축한다.
  theory_markdown: '### 제어 시스템 아키텍처와 통신 인터페이스


    5지 로봇손의 핵심 제어기는 ESP32 마이크로컨트롤러를 사용하여 240 MHz의 고속 연산 처리와 [S14] 다수의 GPIO 핀을 활용한
    실시간 센서 취득을 수행합니다. 시스템은 11개의 DYNAMIXEL XM430-W350-T 액추에이터를 [BOM-1] Protocol 2.0
    기반으로 구동하며, 각 액추에이터는 12 V 전원 라인을 공유하되 데이터 라인은 마스터 MCU와 직렬 또는 버스 형태로 통신합니다.


    #### 실시간 비상 안전 회로

    시스템의 안전은 하드웨어와 소프트웨어의 다중 레이어로 구성됩니다. 래칭 비상정지 버튼(A22E-M-12-EMO)은 EV200 고전류 접촉기의
    NC(Normally Closed) 제어 회로와 직렬로 연결됩니다 [BOM-10]. 비상정지 버튼이 작동하면 EV200의 코일 전원이 차단되어,
    액추에이터에 공급되는 12 V DC 고전류 버스가 물리적으로 차단됩니다 [B-SAFETY-CUTOFF]. 이 방식은 500 A 연속 통전이
    가능한 고전류 경로를 직접 제어기 접점에 연결하지 않고, 안전한 저전압 제어 회로를 통해 차단하는 설계 원칙을 준수합니다.


    #### 데이터 통신 브리지

    ESP32의 3.3 V 논리 레벨은 DYNAMIXEL의 통신 인터페이스와 호환되도록 적절한 레벨 시프터 또는 전용 RS-485 송수신기(Transceiver)
    IC가 필요합니다. UART 포트를 활용하여 Protocol 2.0 프레임을 생성하고, 수신된 위치, 속도, 전류 피드백 값을 통해 파지 제어
    알고리즘을 수행합니다.'
  worked_examples:
  - '예제 1: 시스템 전체 피크 전류 계산. XM430 액추에이터 11개의 스톨 전류(2.3 A/개)를 합산하면 총 25.3 A가 요구됩니다.
    3개의 GST160A12-R7B 어댑터를 병렬 사용 시 총 34.5 A 공급 능력이 확보되어 액추에이터 피크 전류 25.3 A를 안정적으로
    수용합니다 [BOM-1, BOM-3].'
  - '예제 2: 비상 차단 회로 설계. 비상 정지 버튼의 정격이 3 A이므로 [BOM-10], 12 V 코일 구동 전류가 이 범위 내에 있는지
    확인합니다. EV200 코일은 저전류를 사용하므로 해당 스위치로 제어 가능하며, 하드웨어 비상 정지 회로는 소프트웨어 멈춤 현상과 무관하게
    독립적으로 작동함을 보장합니다 [B-SAFETY-CUTOFF].'
  lab:
    title: ESP32 제어기 인터페이스 구축 및 안전 테스트
    steps:
    - ESP32 보드의 통신 UART 핀에 DYNAMIXEL 연결용 RS-485 변환 보드를 실장한다.
    - 래칭 비상 정지 버튼과 EV200 접촉기를 제어 회로도에 따라 배선한다.
    - 멀티미터를 사용하여 비상 정지 버튼 작동 시 EV200 접촉기 접점이 개방(Open)되는지 확인한다.
    - 간이 전류 제한 회로를 구성하여 단일 액추에이터를 테스트하고 상태 피드백 패킷을 수신한다.
    safety:
    - 반드시 저전압 벤치 전원을 사용하여 배선 오류 발생 시 피해를 최소화한다.
    - 전류 제한 회로를 검증하기 전까지 30 A 이상의 대전류를 직접 인가하지 않는다.
    - 제작 시 보안경을 착용하고, 회로 구성 변경 시 전원을 완전히 차단한다.
    deliverables:
    - 안전 테스트가 포함된 회로 배선도(PDF)
    - 비상 정지 시스템 작동 검증 기록(멀티미터 측정 결과)
    - 액추에이터 통신 패킷 데이터 샘플
  assignment:
    title: 5지 로봇손 하드웨어 통합 설계서
    deliverables:
    - 시스템 전체 전원 배선도 (퓨즈 및 접촉기 위치 포함)
    - 제어 브리지 회로도 (레벨 시프팅 포함)
    - 안전 회로 운영 전략 보고서
    rubric:
    - 전원 분기 및 퓨즈 용량 설계가 BOM 사양과 일치하는가?
    - 비상 정지 회로가 독립적이고 안전한 경로로 구성되었는가?
    - ESP32와 DYNAMIXEL 통신을 위한 논리 레벨 변환이 적절한가?
  quiz:
  - question: 로봇손의 전체 액추에이터 피크 전류인 25.3 A를 안전하게 공급하기 위한 전원 구성은 무엇인가?
    choices:
    - 1개의 12 V 11.5 A 어댑터
    - 3개의 12 V 11.5 A 어댑터를 병렬 분기하여 사용
    answer_index: 1
    explanation: 총 피크 전류 25.3 A를 수용하기 위해서는 11.5 A 출력 어댑터 3개를 병렬로 분기하여 구성(총 34.5 A)하여
      과부하를 방지해야 합니다 [BOM-3].
  - question: 비상 정지 버튼이 직접 액추에이터의 12 V 고전류 버스를 차단하지 않는 이유는?
    choices:
    - 부품 단가를 높이기 위해
    - 비상 정지 스위치에 고전류가 흐르는 것을 방지하고 고전류 접촉기를 통해 제어하기 위해
    answer_index: 1
    explanation: 고전류 버스 직접 차단 시 스위치의 접점 손상이 발생하므로, 제어 회로를 통해 별도의 고전류 접촉기를 구동하는 것이
      안전합니다 [B-SAFETY-CUTOFF, BOM-10].
  completion_criteria:
  - 안전 회로 구성이 완료되고 멀티미터로 물리적 전원 차단이 확인됨.
  - ESP32를 통해 액추에이터의 상태 데이터 피드백 패킷을 10회 이상 성공적으로 수신함.
  - 설계된 전원 배선도가 전체 시스템의 피크 전류 요구사항을 만족함.
