- id: m3
  slug: hand-mechanism
  phase_id: phase-1
  title: 로봇 손 기구 및 텐션 구동 이해
  estimated_hours: 10.0
  prerequisites:
  - m2
  objectives:
  - 로봇 손의 텐던 구동 원리와 기구학적 특성을 이해한다.
  - 텐던 시스템의 장력 전달 및 마찰 손실을 분석한다.
  - 정밀 로봇 손 제작을 위한 주요 기구부 부품 선정 기준을 익힌다.
  - 텐던 정렬과 조립 공차 관리의 중요성을 학습한다.
  theory_markdown: '## 텐던 구동 로봇 손 매커니즘


    텐던 구동 시스템은 원격 구동기(actuator)를 사용하여 손가락 링크의 관절을 제어하는 방식입니다. 이 시스템은 링크 내부에 모터를 직접
    배치하지 않음으로써 손가락의 무게와 관성을 대폭 줄일 수 있습니다 [S7].


    ### 1. 동력 전달 원리

    텐던은 액추에이터의 회전 운동을 관절의 굴곡(flexion)과 신전(extension)으로 변환합니다. `Dyneema SK78`과 같은 고강도
    섬유는 파단 하중이 230 daN에 달하며, 작동 신율이 1% 미만으로 정밀한 제어에 필수적입니다 [S14]. 텐던 구동기인 `DYNAMIXEL
    XM430-W350-T`는 위치와 전류 피드백을 제공하여 텐던 장력을 동적으로 제어할 수 있게 합니다 [S9].


    ### 2. 마찰과 효율

    텐던 시스템에서 발생하는 주된 오차는 경로상의 마찰입니다. 텐던이 통과하는 가이드와 캡스턴의 모서리 라운딩은 필수이며, 관절 회전축에는 유지보수가
    필요 없는 `igus JSM-0810-10` 슬리브 베어링을 사용하여 마찰을 최소화합니다 [S15]. 알루미늄 정밀 샤프트(`AWMP-08`)는
    베어링과 결합하여 회전 유격을 줄이고 치수 안정성을 제공합니다 [S16].


    ### 3. 구조적 강성

    손가락 링크 제작에는 강성과 열적 안정성이 우수한 `탄소섬유 PC 필라멘트(PC-CF)`를 사용합니다 [S17]. 체결부에는 `M3 황동 열압입
    인서트`를 사용하여 플라스틱 직접 나사 체결보다 높은 분해 조립 재현성을 확보합니다 [S19].'
  worked_examples:
  - '예제 1: 텐던 파단 하중 분석. 1.5mm Dyneema 텐던의 파단 하중이 230 daN일 때, 안전 계수 2를 적용한 최대 권장 장력은
    115 daN입니다. 이는 액추에이터의 스톨 토크(4.1 N·m)와 풀리 반경을 통해 계산된 실제 사용 장력 범위 내에 있는지 확인해야 합니다
    [S9, S14].'
  - '예제 2: 전원 분기 부하 검토. 12V 액추에이터 분기에 4대의 XM430 액추에이터를 연결할 경우, 스톨 전류 합계는 9.2 A입니다(2.3
    A × 4) [S9]. 사용하는 10 A ATOF 퓨즈는 스톨 상태에서 10 A 이하이므로 과전류를 차단하여 배선을 보호할 수 있습니다 [S23].'
  lab:
    title: 텐던 장력 및 회전축 마찰 시험
    steps:
    - 1. 3D 프린팅된 손가락 링크에 열압입 인서트를 설치하고 베어링을 장착한다.
    - 2. 텐던을 캡스턴과 링크를 따라 연결하고 장력계를 사용하여 초기 장력을 가한다.
    - 3. OpenCR 보드의 ADC 입력을 통해 FSR 센서의 출력을 모니터링한다 [S11, S24].
    - 4. 액추에이터를 정밀 제어하여 텐던 장력을 변화시키며 링크의 각도 응답을 측정한다.
    - 5. 물리적으로 전원을 분리하고 각 분기 전압이 1 V 미만인지 멀티미터로 확인한 후 관절 유격을 점검한다.
    safety:
    - 모든 전원 인가 작업 전 보안경을 착용한다.
    - 텐던 장력 시험 중 텐던의 갑작스러운 파단에 주의한다.
    - 전원 인가 중에는 손을 로봇 손의 가동 범위에 절대 넣지 않는다.
    - 계획 정지 시 3개의 전원 어댑터를 물리적으로 즉시 분리하고 잔류 전압을 확인한다.
    deliverables:
    - 텐던 장력-변위 측정 데이터 그래프
    - 관절 회전축 유격 및 마찰 시험 보고서
    - 안전 수칙 준수 서약서
  assignment:
    title: 로봇 손 기구 최적화 설계
    deliverables:
    - 최적화된 손가락 기구 CAD 도면(파일럿 홀 4.0mm 포함)
    - 텐던 경로 최적화 및 간섭 분석 보고서
    - BOM 기반 조립 부품 명세서
    rubric:
    - 기구부 구조적 강성 및 재료 물성치 반영(PC-CF 적용) 여부
    - 열압입 인서트 및 베어링 규격 호환성 확인
    - 텐던 구동 원리를 반영한 마찰 최소화 설계 수준
    - 안전한 전원 분기 및 보호 회로 설계 반영
  quiz:
  - question: Dyneema SK78 텐던의 기계적 특성으로 옳은 것은?
    choices:
    - 높은 신율로 장력 제어에 유리하다.
    - 작동 신율이 1% 미만으로 정밀 제어에 적합하다.
    - 파단 하중이 10 daN 이하이다.
    - 수분에 취약하여 건조 상태가 필수이다.
    answer_index: 1
    explanation: Dyneema SK78은 신율이 1% 미만으로 정밀한 텐던 구동 로봇 손 제어에 이상적입니다 [S14].
  - question: 텐던 구동기인 XM430-W350의 스톨 전류 합계를 고려한 퓨즈 선정 시 적절한 기준은?
    choices:
    - 스톨 전류 합계보다 낮아야 한다.
    - 전원 장치의 최대 출력 전류보다 커야 한다.
    - 스톨 전류 합계보다는 높고 전원 분기 정격보다는 낮아야 한다.
    - 퓨즈의 정격은 고려하지 않아도 된다.
    answer_index: 2
    explanation: 퓨즈는 과전류로부터 배선을 보호하기 위해 스톨 전류보다는 높게, 전원 분기 정격보다는 낮게 설정되어야 합니다 [S9,
      S23].
  - question: 로봇 손 조립 시 열압입 인서트를 사용하는 이유는?
    choices:
    - 조립 단가를 낮추기 위해
    - 반복적인 분해와 조립 시 나사산의 재현성을 확보하기 위해
    - 플라스틱의 강성을 높이기 위해
    - 무게를 줄이기 위해
    answer_index: 1
    explanation: 황동 인서트는 PC-CF 출력물에 반복 조립 시 플라스틱 나사산 마모를 방지하여 재현성을 높입니다 [S19].
  completion_criteria:
  - 기구부 CAD 도면 검토 통과
  - 텐던 구동 장력 시험 데이터 분석 보고서 제출
  - 안전 수칙 준수 서약 및 기구 조립 완수
  source_ids:
  - S7
  - S8
  - S14
  - S9
  - S15
  - S16
  - S17
  - S19
  - S23
  - S11
  - S24
- id: m4
  slug: actuation-system
  phase_id: phase-2
  title: 구동기 선정 및 동력학
  estimated_hours: 10.0
  prerequisites:
  - m3
  objectives:
  - 로봇손 구동을 위한 DYNAMIXEL 스마트 액추에이터의 전력 및 통신 특성 이해
  - 독립적인 전원 분기를 통한 시스템의 안전한 전력 분배 설계
  - FSR(힘 감지 저항기)과 OpenCR 컨트롤러를 이용한 힘 피드백 신호 취득 회로 설계
  - 과전류 보호를 위한 분기별 퓨즈 선정 및 물리적 안전 분리 원칙 습득
  theory_markdown: '### 구동기 선정 및 동력학


    정교한 5지 로봇손 제작을 위해서는 위치, 속도, 전류 피드백이 가능한 고정밀 스마트 액추에이터가 필수적입니다. DYNAMIXEL XM430-W350-T는
    12V 전압에서 동작하며, 스톨 토크 4.1 N·m와 스톨 전류 2.3 A의 성능을 제공합니다 [S9].


    #### 전원 시스템 설계 원칙

    전체 시스템은 11개의 액추에이터를 구동하기 위해 충분한 전력을 공급해야 하며, 안정성과 안전을 위해 독립적인 분기 전원 방식을 채택합니다.
    3개의 Meanwell GST160A12-R7B 어댑터(각 138 W, 11.5 A 출력)를 사용합니다 [S13].

    *   **전원 분리:** 어댑터 간의 양(+) 출력 연결은 금지하며, 각 어댑터는 4대, 4대, 3대의 액추에이터를 담당하는 독립적인 분기로
    사용합니다.

    *   **과전류 보호:** 각 분기에는 10 A ATOF 퓨즈를 인라인 홀더에 장착하여 배선 고장 시 과전류로부터 시스템을 보호합니다 [S22,
    S23].


    #### 힘 피드백 신호 취득

    손끝의 파지력을 측정하기 위해 FSR 402 센서를 사용합니다 [S10]. 센서 저항은 압력이 증가함에 따라 감소하므로, 이를 OpenCR
    컨트롤러의 ADC에서 읽을 수 있는 전압으로 변환하기 위해 10 kΩ 저항을 사용한 전압 분압 회로를 구성합니다 [S11, S24]. OpenCR의
    ADC 입력은 0~3.3 V 범위로 제한되므로, 모든 센서 분압 회로는 반드시 OpenCR의 3.3 V 센서 레일에서만 전원을 공급받아야 합니다
    [S11].'
  worked_examples:
  - '예제 1: 분기 전류 계산 - 한 분기에 4대의 XM430 액추에이터가 배치될 경우, 피크 스톨 전류 합계는 2.3 A × 4 = 9.2
    A입니다. 공급 전원의 정격 전류는 11.5 A이고 퓨즈 정격은 10 A이므로, 정상적인 동작 범위 내에서 배선 고장을 효과적으로 보호할 수
    있습니다.'
  - '예제 2: 전압 분압 회로 설계 - 센서 전원 3.3 V, 분압 저항 10 kΩ(R2), FSR 저항(Rf)일 때, ADC 입력 전압 V_adc
    = 3.3 * (R2 / (Rf + R2))입니다. FSR 센서가 가압되지 않았을 때 Rf는 매우 커서 V_adc는 0 V에 가까워지며, 강한
    압력이 가해져 Rf가 작아질수록 V_adc는 3.3 V에 근접합니다.'
  lab:
    title: 전력 분배 및 힘 센서 신호 취득 실습
    steps:
    - 각 독립 전원 분기의 퓨즈 홀더와 커넥터를 사용하여 배선도를 완성하고 퓨즈를 장착한다.
    - 멀티미터를 DC 전압 모드로 설정하고, 각 분기의 출력 전압이 12 V임을 확인한다.
    - OpenCR의 3.3 V 센서 레일과 GND를 사용하여 FSR-분압 저항 회로를 구성한다.
    - 센서에 압력을 가하며 OpenCR ADC 신호 값이 0~3.3 V 사이에서 변하는지 멀티미터로 측정한다.
    safety:
    - 실습 중 전원 분리 시 3개 전원 어댑터를 물리적으로 분리하고, 각 branch에서 1 V DC 미만임을 확인하기 전에는 회로에 접근하지
      않는다.
    - 퓨즈는 과전류 방지용이며, 시스템 정지 시에는 전원 어댑터를 직접 분리한다.
    - 멀티미터는 항상 전압 모드로 사용하여 무전원 상태를 확인한다(저항/연속성 모드 금지).
    - 보안경을 필히 착용한다.
    deliverables:
    - 분기별 전압 측정 기록지
    - FSR 센서 압력별 출력 전압 데이터 테이블
    - 회로 연결 사진
  assignment:
    title: 구동 시스템 설계 보고서
    deliverables:
    - 액추에이터 배치에 따른 분기별 부하 전류 계산서
    - FSR 신호 취득을 위한 전압 분압 회로 설계도
    - 전원 안전 조치를 포함한 최종 배선도
    rubric:
    - 독립 전원 분기 분리 및 퓨즈 보호 원칙 준수 여부
    - 교육용 프로토타입은 기계 안전 표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다
    - 전력 시스템 구성의 논리적 타당성
  quiz:
  - question: OpenCR 컨트롤러의 FSR 센서 회로 전원으로 권장되는 전압은 무엇입니까?
    choices:
    - 12 V 액추에이터 레일
    - 3.3 V 센서 레일
    - 5 V 디지털 레일
    - 어떤 전압 레일이든 상관없음
    answer_index: 1
    explanation: OpenCR의 ADC 입력 신호는 0~3.3 V 범위를 초과해서는 안 되며, 3.3 V 센서 레일에서 전원을 공급해야
      합니다.
  - question: 전원 어댑터의 양(+) 출력을 병렬로 연결하는 것에 대한 설명으로 옳은 것은?
    choices:
    - 허용됨
    - 절대 금지됨
    - 퓨즈가 있으면 허용됨
    - 어댑터 정격이 같으면 허용됨
    answer_index: 1
    explanation: 각 어댑터 출력은 독립적으로 유지해야 하며, 양(+) 출력의 병렬 연결은 절대 금지됩니다.
  - question: 다음 중 가장 안전한 전원 차단 확인 방법은 무엇입니까?
    choices:
    - 연속성 모드로 측정
    - 저항 모드로 측정
    - 멀티미터로 DC 전압 모드 측정
    - 퓨즈 제거
    answer_index: 2
    explanation: 반드시 물리적으로 전원을 분리하고, 멀티미터의 DC 전압 모드를 사용하여 1 V 미만인지 확인해야 합니다.
  completion_criteria:
  - 모든 실습 측정값의 정상 범위 확인 완료
  - 분기별 전력 배선 및 퓨즈 보호 설계 완료
  - 안전 절차를 준수한 전압 측정 기록지 제출
  source_ids:
  - S3
  - S9
  - S13
  - S22
  - S23
  - S10
  - S11
  - S24
- id: m5
  slug: controller-setup
  phase_id: phase-2
  title: 제어 보드 및 입출력 인터페이스
  estimated_hours: 10.0
  prerequisites:
  - m4
  objectives:
  - DYNAMIXEL 스마트 액추에이터와 OpenCR 제어기의 통신 아키텍처 이해
  - FSR(힘 감지 저항) 센서의 전압 분압 회로 설계 및 ADC 신호 취득 원리 습득
  - 독립 전원 분기 및 과전류 보호(퓨즈)를 포함한 안전한 전원 시스템 구성
  - 하드웨어 인터페이스 배선 및 시스템 통합 테스트 방법론 학습
  theory_markdown: '## 제어 시스템 아키텍처

    본 로봇손 제어 시스템은 [OpenCR 1.0](S11)을 중심으로 구성됩니다. 이 제어기는 [DYNAMIXEL XM430-W350-T](S9)
    액추에이터와 직접 연결 가능한 통신 포트를 내장하고 있어, 별도의 브리지 회로 없이 안정적인 제어가 가능합니다. 액추에이터는 12 V 전원
    라인을 통해 구동되며, 통신은 [Protocol 2.0](S9) 기반의 TTL 방식을 따릅니다.


    ## 힘 피드백 인터페이스

    손끝의 [FSR 402](S10) 센서는 압력에 따라 저항이 변화하는 특성을 가집니다. 이를 제어기가 인식하려면 전압 변화로 변환해야 합니다.
    이를 위해 [10 kΩ 분압 저항](S24)과 FSR을 직렬로 연결하여 전압 분압 회로를 구성합니다. OpenCR의 [12 bit ADC](S11)는
    0~3.3 V 범위의 신호를 0~4095 값으로 디지털화합니다. FSR 전압 분압기는 3.3 V 센서 전원만 사용하고 아날로그 입력 신호를
    0~3.3 V 범위로 유지한다.


    ## 전력 분배 및 안전

    시스템은 3개의 [GST160A12-R7B](S13) 어댑터를 사용하여 액추에이터 전원을 독립적으로 분기합니다. [ATOF 10 A 퓨즈](S23)와
    [인라인 홀더](S22)를 각 분기마다 배치하여 액추에이터 과전류로부터 시스템을 보호합니다. 전원 공급 시에는 독립된 분기를 유지해야 하며,
    양(+) 출력 단자를 임의로 연결하는 것은 금지됩니다.'
  worked_examples:
  - '예제 1: ADC 분압값 계산. FSR 저항이 5 kΩ일 때, OpenCR 3.3 V 레일에서의 출력 전압은 Vout = 3.3V * (10kΩ
    / (5kΩ + 10kΩ)) = 2.2 V입니다. ADC값은 (2.2 / 3.3) * 4095 ≈ 2730이 됩니다.'
  - '예제 2: 전원 분기 부하 검토. 액추에이터 4대 사용 시 피크 전류는 2.3 A * 4 = 9.2 A입니다. 10 A 퓨즈[S23]는 9.2
    A를 통과시키고 과부하 시 보호를 수행하며, 11.5 A 공급 용량[S13] 내에 부하가 위치합니다.'
  lab:
    title: 제어 보드 및 센서 회로 통합 실습
    steps:
    - OpenCR 제어기 및 12 V 전원 어댑터 연결 상태 확인
    - FSR 센서와 10 kΩ 저항을 이용한 전압 분압 회로 제작
    - 분압 회로의 출력을 OpenCR ADC 포트에 연결 (3.3 V 레일 사용 확인)
    - DYNAMIXEL 액추에이터를 OpenCR TTL 포트에 연결
    - 멀티미터를 사용하여 퓨즈 분기 및 센서 전압 측정 (DC 전압 모드)
    - 제어 예제 코드를 로드하여 액추에이터 통신 및 센서 데이터 취득 확인
    safety:
    - 모든 회로 변경 전 3개 전원 어댑터를 물리적으로 분리할 것
    - ADC 회로에 12 V 전압이 유입되지 않도록 배선 확인
    - 전원 인가 전 보안경을 착용하고 무부하 상태에서 초기 구동 확인
    - 회로 접근 전 멀티미터로 각 분기 전압이 1 V 미만인지 확인할 것
    deliverables:
    - 시스템 배선도 (전원 분기 및 센서 회로 포함)
    - ADC 신호 취득 데이터 (무부하 및 압력 인가 상태)
    - 멀티미터 측정 기록표
  assignment:
    title: 전원 및 센서 시스템 안정성 설계
    deliverables:
    - 전원 분기별 부하 배분 계획서
    - ADC 분압 회로 설계 및 노이즈 제거 방안 보고서
    rubric:
    - 독립 전원 분기 유지 여부 확인 (병렬 금지 원칙 준수)
    - FSR 전압 분압 회로의 전기적 정격 준수 여부
    - 배선도 내 퓨즈 보호 기구 및 커넥터 사양 명시 여부
  quiz:
  - question: OpenCR 제어기에서 FSR 센서 전압 분압 회로에 사용할 수 있는 올바른 전압 레일은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - 3.3 V 센서 전원
    - GND 라인
    answer_index: 2
    explanation: OpenCR ADC 입력 허용 범위는 0~3.3 V이며, 센서 회로는 3.3 V 센서 레일에서 공급받아야 합니다.
  - question: 3개의 12 V 전원 어댑터 사용 시 올바른 전원 연결 방법은?
    choices:
    - 모든 양(+) 출력을 하나로 묶어 사용
    - 각 어댑터를 독립된 퓨즈 분기로 나누어 사용
    - 어댑터 출력들을 서로 직렬로 연결하여 전압 승압
    - 한 개의 어댑터에 11대 액추에이터를 모두 연결
    answer_index: 1
    explanation: 전원 어댑터 양(+) 출력은 서로 분리하여 독립된 퓨즈 분기로 관리해야 하며 병렬 연결은 금지됩니다.
  - question: 시스템 안전을 위해 기기 접근 전 취해야 할 올바른 행동은?
    choices:
    - 멀티미터의 저항 모드로 도통 확인
    - 메인 전원 스위치만 OFF
    - 모든 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 1 V 미만 확인
    - 퓨즈를 제거
    answer_index: 2
    explanation: 물리적 분리 후 DC 전압 측정 확인만이 안전한 상태를 보장합니다.
  completion_criteria:
  - 시스템 전원 분기 및 센서 회로 배선 완료
  - OpenCR을 통한 액추에이터 데이터 송수신 성공
  - 멀티미터를 이용한 무전원 상태 확인 절차 수행
  - 실습 결과 보고서 제출 및 통과
  source_ids:
  - S4
  - S11
  - S23
  - S13
- id: m6
  slug: power-management
  phase_id: phase-2
  title: 전원 분배 및 안전 시스템
  estimated_hours: 10.0
  prerequisites:
  - m5
  objectives:
  - DYNAMIXEL 스마트 액추에이터 구동을 위한 독립 전원 분기 아키텍처 이해
  - ATOF 퓨즈와 전원 어댑터 사양을 고려한 과전류 보호 설계
  - OpenCR ADC 센서 레일과 12V 액추에이터 레일의 전기적 격리
  - 안전한 전원 인가 및 계측을 위한 벤치 프로토타입 운용 절차 습득
  theory_markdown: '### 전원 분기 아키텍처

    정교한 5지 로봇손은 다수의 액추에이터를 동시에 구동하므로 높은 피크 전류(약 25.3 A)를 요구합니다 [S9, S13]. 단일 전원 공급원의
    부하를 줄이고 고장 시 영향을 최소화하기 위해, 전체 전원을 독립적인 3개의 분기로 할당합니다. 각 분기는 12 V, 11.5 A 출력의 어댑터를
    사용하며 [S13], 액추에이터 4대/4대/3대를 배분하여 스톨 전류 합계가 어댑터 정격을 초과하지 않도록 구성합니다 [S13].


    ### 과전류 보호 및 격리

    모든 액추에이터 전원 분기에는 10 A ATOF 퓨즈를 사용하여 배선 결함 발생 시 과전류로부터 전원을 보호합니다 [S23]. 전원 어댑터
    출력의 양(+)단은 절대 결합하거나 연결하지 않으며, 각 어댑터는 자신의 독립 분기만을 담당합니다 [S13]. OpenCR 제어 보드의 3.3
    V 센서 레일은 힘 감지 센서(FSR) 분압 회로를 위해 사용하며 [S11], 이는 12 V 액추에이터 전원과 완전히 분리되어야 합니다. 센서
    아날로그 신호는 항상 0~3.3 V 범위 내에 있어야 OpenCR의 12-bit ADC 입력이 손상되지 않습니다 [S11].


    ### 기계적 안전 준수

    본 실습 장비는 저전압 벤치 프로토타입이며, 외부 장치 모니터링(EDM) 및 이중 접촉기 등이 포함된 산업용 안전 시스템이 아닙니다 [S20].
    모든 정지 절차는 3개의 독립 전원 어댑터를 물리적으로 분리하는 것으로 수행하며, DC 전압 모드 멀티미터를 통해 1 V 미만의 잔류 전압을
    확인한 후 작업에 접근해야 합니다 [S20].'
  worked_examples:
  - '액추에이터 부하 계산: XM430-W350 1대당 스톨 전류는 2.3 A입니다 [S9]. 분기당 4대를 배치할 경우 피크 전류는 9.2 A이며,
    이는 10 A ATOF 퓨즈의 보호 범위 내에 있으면서 11.5 A 어댑터 용량을 안정적으로 사용합니다 [S13, S23].'
  - 'ADC 전압 분압: FSR 402 센서와 10 kΩ 저항을 사용하여 분압기를 구성합니다 [S10, S24]. 교육용 프로토타입은 기계 안전
    표준 준수나 인증을 주장하지 않으며, 사람 접근 환경 투입 전 자격 있는 안전 전문가의 별도 검토가 필요하다 [S11].'
  lab:
    title: 독립 전원 분기 구축 및 계측 실습
    steps:
    - 각 어댑터 출력에 퓨즈 홀더와 10 A 퓨즈를 체결하여 3개의 독립 분기 회로를 구성합니다 [S22, S23].
    - 전원 인가 전, 멀티미터를 사용하여 각 분기 출력 전압이 12 V DC임을 확인합니다.
    - OpenCR 3.3 V 레일과 FSR 분압 회로를 연결하고, 정상 작동 여부를 확인하기 위해 무부하 상태에서 ADC 값을 모니터링합니다
      [S11].
    - 각 전원 어댑터를 독립적으로 물리적으로 연결하고, 각 액추에이터 분기에 전압이 정상적으로 인가되는지 개별 확인합니다.
    safety:
    - 절대 전원 어댑터의 출력 단자를 병렬로 연결하지 마십시오.
    - 퓨즈는 과전류 보호 장치일 뿐, 기계적 계획 정지 장치로 사용할 수 없습니다 [S20].
    - 실습 중 정지는 반드시 3개의 전원 플러그를 물리적으로 분리하고 1 V 이하를 확인하십시오 [S20].
    - 작업 시 충격 방지 작업용 보안경을 항시 착용하십시오.
    deliverables:
    - 분기별 전압 측정 데이터 기록
    - OpenCR 센서 레일 격리 회로도
    - 안전 정지 절차 수행 사진 및 측정치
  assignment:
    title: 전원 시스템 안전 설계 보고서
    deliverables:
    - 독립 전원 분기 아키텍처 도면
    - 퓨즈 용량 결정 근거 계산서
    - 안전 수칙 준수 서약서
    rubric:
    - 각 분기별 독립 전원 및 퓨즈 보호 체계가 설계 도면에 정확히 명시되었는가?
    - 액추에이터 피크 전류와 어댑터 정격 전력을 고려한 합리적인 분기 분배가 이루어졌는가?
    - 센서와 액추에이터 전원 레일의 분리가 이론적으로 명확히 설명되었는가?
    - 실습 안전 절차(물리적 차단 및 계측 확인)가 준수되었는가?
  quiz:
  - question: 본 로봇손 실습에서 전원 어댑터 출력 단자 연결 시 반드시 준수해야 할 규칙은 무엇인가?
    choices:
    - 출력 효율을 위해 모든 어댑터의 (+) 단자를 하나로 병렬 연결한다.
    - 각 어댑터 출력은 독립적인 분기로 사용하며 (+) 단자를 절대 연결하지 않는다.
    - 전류 합산을 위해 3개의 출력단 전체를 하나로 결합한다.
    - 하나의 퓨즈에 모든 어댑터 출력을 모아서 연결한다.
    answer_index: 1
    explanation: 독립 분기 아키텍처에서는 각 공급원의 전기적 격리가 필수적이며, 전원 출력을 결합하는 것은 전기적 사고의 원인이 됩니다
      [S13].
  - question: OpenCR의 ADC 입력 신호로 사용하기 위해 적절한 전원 전압원은 무엇인가?
    choices:
    - 12 V 액추에이터 전원
    - 3.3 V 센서 레일
    - 5 V 외부 입력 전원
    - 24 V 전원
    answer_index: 1
    explanation: OpenCR의 ADC는 3.3 V 레일을 기준으로 동작하며, 이를 초과하거나 12 V 전원과 결합 시 보드 손상이 발생할
      수 있습니다 [S11].
  - question: 실습 중 비상 상황이 발생했을 때 수행해야 할 가장 안전한 정지 절차는?
    choices:
    - 전원 제어 소프트웨어의 소프트웨어 정지만 수행한다.
    - 퓨즈를 제거한다.
    - 3개의 어댑터 전원을 모두 물리적으로 분리하고 멀티미터로 잔류 전압을 확인한다.
    - 메인 제어 보드의 전원 스위치만 끈다.
    answer_index: 2
    explanation: 벤치 프로토타입에서는 물리적 전원 분리와 전압 측정을 통한 무전원 상태 확인이 가장 안전한 정지 절차입니다 [S20].
  completion_criteria:
  - 독립 전원 분기 회로 구축 및 정상 작동 확인
  - 퓨즈 사양 결정 및 전기적 격리 원리 이해
  - 벤치 안전 정지 절차 테스트 완료 및 보고서 제출
  source_ids:
  - S5
  - S13
  - S20
  - S9
  - S23
  - S11
  - S10
  - S24
  - S22
- id: m7
  slug: sensing-implementation
  phase_id: phase-3
  title: 센서 신호 획득 및 처리
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - FSR 402 센서의 압력-저항 특성을 이해하고 전압 분압 회로를 설계할 수 있다.
  - OpenCR 제어기의 12비트 ADC를 활용하여 센서 신호를 획득하고 변환할 수 있다.
  - 데이터 취득 시 노이즈를 억제하기 위한 소프트웨어적 처리 기법을 적용할 수 있다.
  - 3.3 V 센서 전원 분리와 전기적 절연의 중요성을 실습을 통해 체득한다.
  theory_markdown: '### FSR 센서 신호 획득 원리

    FSR(Force Sensing Resistor) 402는 인가되는 힘이 증가함에 따라 저항이 감소하는 가변 저항체입니다 [S10]. 센서
    자체는 독립적인 전압을 생성하지 않으므로, MCU의 ADC(Analog-to-Digital Converter)로 측정하기 위해서는 **전압
    분압 회로(Voltage Divider)**를 구성해야 합니다 [S24].


    #### 전압 분압 회로 설계

    전압 분압 회로의 출력 전압 $V_{out}$은 다음 식으로 정의됩니다:

    $V_{out} = V_{ref} \times \frac{R_{fixed}}{R_{fixed} + R_{FSR}}$

    여기서 $V_{ref}$는 센서 전원(3.3 V), $R_{fixed}$는 고정 저항(10 kΩ)입니다 [S24].

    - **주의:** OpenCR 보드에서 FSR 센서 전원은 반드시 3.3 V 센서 전원 레일을 사용해야 합니다 [S11]. 5 V나 12 V
    액추에이터 레일을 연결하면 ADC 회로가 영구 손상될 수 있습니다.


    #### ADC 변환 및 정규화

    OpenCR의 ADC는 12비트 해상도를 지원하므로, 0 V ~ 3.3 V 범위의 전압을 0 ~ 4095의 디지털 값으로 변환합니다 [S11].
    취득된 값은 센서의 비선형성을 고려하여 힘(N) 단위로 매핑하는 교정(Calibration) 과정이 필요합니다 [S10].'
  worked_examples:
  - '예제 1: 10 kΩ 고정 저항과 FSR 402를 사용한 분압 회로에서, FSR의 현재 저항값이 5 kΩ일 때 ADC 입력 전압($V_{out}$)
    계산:

    $V_{out} = 3.3 V \times (10,000 / (10,000 + 5,000)) = 3.3 V \times 0.667 = 2.2
    V$ (ADC 값 약 2730)'
  - '예제 2: FSR 센서 신호의 노이즈 제거를 위한 이동 평균 필터(Moving Average Filter) 적용:

    최근 10개의 샘플 값을 저장하고, 매 샘플마다 합계를 10으로 나누어 출력값을 평활화하여 텐던 제어의 안정성을 높임.'
  lab:
    title: FSR 신호 측정 및 데이터 처리 실습
    steps:
    - OpenCR 3.3 V 센서 전원 및 GND 포트를 확인한다 [S11].
    - FSR 402와 10 kΩ 저항을 사용하여 전압 분압 회로를 구성한다 [S24].
    - 분압된 전압 신호를 OpenCR ADC 입력 핀에 연결한다 [S11].
    - 멀티미터를 사용하여 ADC 입력 핀의 전압이 0~3.3 V 범위 내에 있는지 확인한다.
    - 펌웨어를 업로드하여 시리얼 모니터로 FSR 데이터 값을 관찰한다.
    - 데이터 평활화를 위한 이동 평균 필터 코드를 적용하고 신호 안정성을 비교한다.
    safety:
    - 모든 회로 변경은 3개의 12 V 전원 어댑터를 물리적으로 분리한 후 진행한다.
    - 전원 연결 전 멀티미터를 DC 전압 모드로 설정하여 각 분기 전압이 1 V 미만임을 확인한다.
    - OpenCR ADC 입력에 3.3 V를 초과하는 전압이 인가되지 않도록 주의한다 [S11].
    - 납땜 작업 시 보안경을 착용하고 환기가 잘 되는 곳에서 작업한다.
    deliverables:
    - 센서 신호 획득 및 노이즈 처리 펌웨어 소스 코드
    - FSR 압력 변화에 따른 ADC Raw 데이터 및 전압 측정값 보고서
  assignment:
    title: 센서 데이터 기반 파지력 제어 구현
    deliverables:
    - FSR 데이터를 힘(N) 단위로 변환하는 교정 곡선 그래프
    - 설정한 임계값 도달 시 모터 정지 명령을 수행하는 제어 로직 코드
    - 최종 센서 처리 및 제어 시스템 구현 보고서
    rubric:
    - 전압 분압 회로의 올바른 설계 및 구현 여부 (30%)
    - ADC 샘플링 데이터의 노이즈 억제 성능 (30%)
    - 물리적 힘과 소프트웨어 출력 데이터 간의 선형성 교정 정확도 (20%)
    - 안전 수칙 준수 및 측정 데이터의 신뢰성 (20%)
  quiz:
  - question: FSR 402 센서를 사용한 전압 분압 회로에서 OpenCR 보드의 어떤 전원 레일을 사용해야 하는가?
    choices:
    - 12 V 액추에이터 레일
    - 3.3 V 센서 전원 레일
    - 5 V 범용 전원 레일
    - 24 V 입력 전원 레일
    answer_index: 1
    explanation: OpenCR의 ADC는 0~3.3 V 범위에서 작동하며, 센서 손상 방지를 위해 전용 3.3 V 센서 레일을 사용해야
      합니다 [S11].
  - question: ADC 값이 4095일 때, 12비트 ADC 시스템에서 이는 어떤 전압을 의미하는가?
    choices:
    - 0 V
    - 1.65 V
    - 3.3 V
    - 5 V
    answer_index: 2
    explanation: 12비트 ADC는 0부터 2^12-1(4095)까지의 값을 가지며, 3.3 V 기준 전압에서 최대값은 기준 전압과 같습니다
      [S11].
  completion_criteria:
  - FSR 회로를 3.3 V 레일에 올바르게 연결하고 ADC 전압이 0~3.3 V 이내임을 실측 확인
  - 이동 평균 필터를 적용하여 센서 노이즈가 유의미하게 감소된 데이터 로그 제출
  - 실습 중 12 V 전원을 분리하고 무전원 상태를 확인하는 안전 수칙을 전 과정에서 준수
  source_ids:
  - S10
  - S24
  - S11
- id: m8
  slug: firmware-development
  phase_id: phase-3
  title: 제어 펌웨어 및 로직
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - DYNAMIXEL Protocol 2.0을 이해하고 액추에이터 상태를 제어합니다.
  - OpenCR 제어기의 ADC를 활용해 힘 감지 센서(FSR) 신호를 처리합니다.
  - 운전 상태 기계(Safety State Machine) 로직을 설계하여 과전류 및 센서 이상에 대응합니다.
  - 모터 제어, 센서 취득, 동작 제한 로직이 통합된 단일 펌웨어 구조를 구축합니다.
  theory_markdown: '### 제어 시스템 아키텍처

    로봇손의 펌웨어는 실시간성과 안전성을 보장하기 위해 단일 OpenCR 제어기에서 루프를 운영합니다 [S11]. DYNAMIXEL XM430-W350-T
    액추에이터는 Protocol 2.0을 사용하여 위치, 속도, 전류 피드백을 실시간으로 제공합니다 [S9]. OpenCR은 216MHz의 CPU
    주파수를 활용하여 1ms 단위의 제어 루프를 실행하며, 12비트 ADC를 통해 0~3.3V 범위의 FSR 신호를 읽습니다 [S11].


    ### 센서 데이터 처리

    FSR 402 센서는 인가된 힘에 따라 저항이 감소하는 원리를 이용합니다 [S10]. 10 kΩ 저항과 함께 분압 회로를 구성하여 OpenCR의
    3.3V 센서 전원 레일로부터 공급받습니다 [S11, S24]. ADC 입력값은 비선형적인 힘 특성을 고려하여 구간별 선형화(Piecewise
    Linearization)를 적용합니다.


    ### 운전 상태 기계(Safety State Machine)

    펌웨어는 각 액추에이터의 전류 피드백을 모니터링합니다. 액추에이터 스톨 전류(2.3 A)를 초과하거나 급격한 과전류가 감지될 경우, 시스템은
    ''Emergency Halt'' 상태로 전이합니다 [S9]. 모든 전원 분기는 독립적으로 퓨즈 보호되지만, 펌웨어는 물리적 퓨즈 차단(10
    A) 이전에 소프트웨어적으로 토크를 제한하여 안전성을 높입니다 [S13, S23].'
  worked_examples:
  - '전류 피드백 기반 토크 제한: 액추에이터의 ''Present Current'' 레지스터 값을 읽어 2.0 A 초과 시 명령 토크(Goal
    Torque)를 0으로 설정하여 스톨 방지.'
  - 'FSR 신호 필터링: 이동 평균 필터(Moving Average Filter)를 적용하여 FSR 분압 전압의 고주파 노이즈를 제거하고 정밀한
    파지 감지 구현.'
  - '안전 모니터링 루프: 메인 루프에서 ''System OK'', ''Warning'', ''Halt'' 3단계 상태기계를 통해 액추에이터 상태
    모니터링.'
  lab:
    title: 실시간 데이터 취득 및 토크 제한 시험
    steps:
    - OpenCR에 12V 액추에이터 전원과 3.3V 센서 전원을 분리하여 연결합니다.
    - FSR 센서 1개를 OpenCR의 ADC 핀에 연결하고 멀티미터로 3.3V 레일 확인 후 무부하 시 신호 취득합니다.
    - DYNAMIXEL Protocol 2.0으로 액추에이터를 초기화하고 현재 전류(Present Current) 값을 읽어옵니다.
    - '소프트웨어적으로 전류 임계값(예: 1.5A)을 설정하고 이를 초과할 때 명령 속도를 0으로 제한하는 코드를 실행합니다.'
    - 손가락 모듈을 지그에 고정하고 부하를 가하며 토크 제한 로직이 작동하는지 시리얼 모니터로 확인합니다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하고 멀티미터를 DC 모드로 설정하여 각 분기 전압이 1V 미만임을 확인 후 접근합니다.
    - 전원 인가 중 가동 범위 내에 손을 넣지 않습니다.
    - 과전류 발생 시 즉시 전원을 분리하고 배선 단락 여부를 확인합니다.
    - ADC 회로에 12V 액추에이터 전원이 유입되지 않도록 회로 분리를 재확인합니다.
    deliverables:
    - 전류 피드백 기반 토크 제한 구현 펌웨어 코드
    - FSR 데이터 선형화 및 필터링 결과 그래프
    - 상태기계 로직 전환 시험 결과 로그
  assignment:
    title: 로봇손 펌웨어 시스템 구축 및 검증
    deliverables:
    - 모든 관절 및 센서 제어가 통합된 최종 펌웨어 소스 코드
    - 전류 및 힘 데이터 분석을 포함한 상태기계 작동 최종 보고서
    rubric:
    - Protocol 2.0을 이용한 액추에이터 제어 완결성
    - 3.3V 레일 기반 ADC 노이즈 제어 효율성
    - 운전 상태 기계의 논리적 오류 없는 구현
    - 코드 주석의 기술적 명확성
  quiz:
  - question: FSR 센서 신호 취득을 위해 사용할 OpenCR 전압 레일은?
    choices:
    - 12V 액추에이터 전원 레일
    - 3.3V 센서 전원 레일
    - 5V 범용 전원 레일
    - 외부 24V 배터리 레일
    answer_index: 1
    explanation: OpenCR의 ADC는 3.3V 기준이며, 시스템 안전과 정확도를 위해 전용 3.3V 센서 레일만 사용해야 합니다.
  - question: 액추에이터의 전류 피드백을 모니터링하는 주된 이유는?
    choices:
    - 모터 회전 방향 결정
    - 통신 속도 최적화
    - 과전류에 의한 스톨 방지 및 안전 확보
    - 펌웨어 업데이트 시간 측정
    answer_index: 2
    explanation: 스톨 전류(2.3A) 초과를 감지하고 소프트웨어적 제한을 통해 하드웨어 손상 및 사고를 예방합니다.
  - question: 실험 중 시스템을 안전하게 정지하는 올바른 절차는?
    choices:
    - 시리얼 명령으로 정지
    - 퓨즈를 뽑음
    - 어댑터 3개를 물리적으로 분리하고 DC 전압을 확인
    - 전원 스위치 하나만 끔
    answer_index: 2
    explanation: 비상 시에는 반드시 3개의 독립적인 절연 전원 어댑터를 분리하고, 멀티미터로 무전원(1V 미만) 상태임을 확인해야 합니다.
  completion_criteria:
  - 통합 제어 펌웨어 코드가 모든 관절 및 센서에 대해 정상 작동함
  - 토크 제한 임계값 시험에서 과전류 발생 전 소프트웨어 차단이 검증됨
  - 안전 정지 절차를 모든 실험 항목에서 준수함
  source_ids:
  - S9
  - S11
  - S10
  - S24
  - S13
  - S23
- id: m9
  slug: integration-assembly
  phase_id: phase-3
  title: 로봇 손 하드웨어 조립 및 배선
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - 로봇 손의 하드웨어 서브시스템을 체계적으로 조립하고 배선하는 절차를 습득한다.
  - 독립 전원 분기 구성과 퓨즈 보호를 통해 전기적 안전을 확보한다.
  - 커넥터 표준화와 하네스 제작을 통해 시스템의 유지보수성을 높인다.
  - 관절 구동부의 텐던 장력과 기계적 정렬을 최종 검증한다.
  theory_markdown: '### 하드웨어 조립의 원칙과 안전


    로봇 손 조립은 기계적 정렬과 전기적 무결성을 동시에 달성해야 하는 정밀 공정이다. 본 단계에서는 정해진 BOM 사양과 배선도를 준수하여 시스템
    안정성을 확보한다 [S12, S13].


    #### 1. 독립 전원 분기 및 보호

    전원 공급 장치(GST160A12-R7B)의 각 출력은 독립적인 분기로 간주하며, 이들의 양(+) 출력단은 절대 서로 연결(병렬 구성)해서는
    안 된다. 각 분기는 10 A ATOF 퓨즈(0287010.U)를 통해 과전류로부터 보호된다 [S13, S23]. 이는 특정 액추에이터의 고장
    시 전체 시스템의 전원 공급이 중단되거나 배선이 손상되는 것을 방지하기 위함이다.


    #### 2. 커넥터 및 배선 표준화

    Molex Micro-Fit 3.0 커넥터(피치 3.00 mm)를 사용하여 모듈화된 하네스를 제작한다 [S12]. 이 커넥터는 최대 8.5
    A를 허용하며 잠금 기구가 있어 진동 환경에서도 이탈 위험이 낮다. 모든 배선은 텐던 구동 범위와 간섭되지 않도록 정리해야 한다.


    #### 3. 기계적 체결 재현성

    M3 황동 열압입 인서트(HTBI-M3-BR)는 탄소섬유 강화 PC 출력물(Prusament PC-CF)에 반복적인 분해 조립이 가능하도록
    나사산을 형성한다 [S17, S19]. 샤프트(AWMP-08)와 무급유 베어링(JSM-0810-10)의 정밀한 결합은 로봇 손의 관절 유격을
    최소화하여 제어 성능을 극대화한다 [S15, S16].'
  worked_examples:
  - '예제 1: 독립 전원 분기 확인 - 3개의 전원 어댑터 어댑터-A(액추에이터 1-4), 어댑터-B(액추에이터 5-8), 어댑터-C(액추에이터
    9-11)를 각각 독립 퓨즈 홀더(0AFH0001Z)를 거쳐 액추에이터 전원라인에 연결하고, 멀티미터로 각 분기의 양(+)극이 완전히 절연되었는지
    확인한다 [S13, S22].'
  - '예제 2: 인서트 삽입 품질 점검 - 4.0 mm 파일럿 홀에 300도 전후로 가열된 인두를 사용하여 인서트를 삽입한다. 삽입 후 수직도가
    확보되었는지 확인하고 나사(M3×10)를 체결하여 출력물 손상 없이 체결되는지 점검한다 [S18, S19].'
  lab:
    title: 로봇 손 조립 및 전기 계측 실습
    steps:
    - 각 액추에이터(XM430-W350-T) 모듈을 손가락 링크에 고정하고 텐던(Dyneema SK78)을 연결한다 [S9, S14].
    - 전원 분기용 하네스를 제작하여 커넥터(Micro-Fit 3.0)를 통해 액추에이터에 연결한다 [S12].
    - 각 분기 어댑터의 (+) 단자에 인라인 퓨즈 홀더와 10 A 퓨즈를 장착한다 [S22, S23].
    - 전원 인가 전, 각 독립 분기의 단자 전압이 0 V 임을 멀티미터(DC 모드)로 확인한다.
    - 전원 인가 후 각 분기별로 12 V가 출력되는지 계측한다.
    safety:
    - 실험 중 정지 시 3개의 전원 어댑터를 물리적으로 분리하고, 무전원 상태를 멀티미터로 계측하여 모든 분기가 1 V 미만인지 확인한다.
    - 텐던 장력 시험 중 충격 방지용 보안경을 반드시 착용한다.
    - 전원 인가 중 로봇 손의 가동 범위 내에 손을 넣지 않는다.
    - 퓨즈는 단락 고장 방지용이며, 시스템의 계획 정지 장치로 대체될 수 없다.
    deliverables:
    - 완성된 로봇 손 하드웨어 사진
    - 전원 분기별 절연 저항 확인 기록
    - 배선 정리 상태 및 커넥터 잠금 확인 체크리스트
  assignment:
    title: 배선 효율성 및 안전 보고서 작성
    deliverables:
    - 시스템 배선도 (독립 분기 및 퓨즈 위치 포함)
    - 관절별 텐던 배치 및 장력 고정 방법 기술서
    - 전기적 안전 확인 및 전압 계측 기록지
    rubric:
    - 모든 전원 분기가 독립적으로 구성되어 있는가?
    - 액추에이터 피크 전류 합계가 각 분기 퓨즈 정격(10 A) 내에 있는가?
    - 배선이 관절 움직임과 간섭되지 않도록 정리되었는가?
    - 모든 체결부에 적절한 규격의 나사와 인서트가 사용되었는가?
  quiz:
  - question: 독립된 3개의 전원 어댑터를 사용하는 로봇 손의 안전한 배선 방식은?
    choices:
    - 전압을 높이기 위해 모든 (+) 출력을 함께 묶는다.
    - 각 전원 어댑터 출력을 별도의 퓨즈 분기로 유지하며 절대 묶지 않는다.
    - 전류를 높이기 위해 (+) 출력을 병렬 연결한다.
    - 전원 공급을 원활하게 하기 위해 전원 어댑터 출력들 사이에 점퍼 선을 연결한다.
    answer_index: 1
    explanation: 각 어댑터는 독립된 절연 전원 공급원으로 사용해야 하며, (+) 출력을 연결하는 것은 전력 공급 장치 손상 및 심각한
      안전 사고를 유발할 수 있다.
  - question: OpenCR 제어기에서 FSR 힘 센서를 위한 전압 분압 회로에 권장되는 전원 공급은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - OpenCR 3.3 V 센서 전원
    - 별도의 외부 24 V 공급원
    answer_index: 2
    explanation: OpenCR의 센서 회로 안정성과 ADC 보호를 위해 센서 전압 분압기는 3.3 V 센서 레일에서만 전원을 공급받아야
      한다.
  - question: 로봇 손 조립 시 10 A ATOF 퓨즈를 사용하는 목적은?
    choices:
    - 액추에이터의 최대 성능을 제한하기 위해
    - 전원 어댑터의 전압을 일정하게 유지하기 위해
    - 분기별 과전류 발생 시 배선 고장 및 화재를 방지하기 위해
    - 로봇의 가동 시간을 늘리기 위해
    answer_index: 2
    explanation: 각 독립 분기에 설치된 10 A 퓨즈는 액추에이터의 스톨 전류 합계가 배선 정격을 초과하거나 쇼트 고장이 발생할 때
      배선을 보호하기 위한 장치이다.
  completion_criteria:
  - 모든 하드웨어 링크가 CAD 설계치에 따라 체결됨.
  - 3개의 독립 전원 어댑터 분기가 전기적으로 완전히 격리됨을 멀티미터로 검증함.
  - 모든 분기에 적정 용량의 퓨즈가 장착됨을 확인함.
  - 로봇 손의 관절 가동 시 텐던과 배선의 간섭이 없음을 확인함.
