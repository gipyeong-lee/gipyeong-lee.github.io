- id: M4
  slug: transmission-assembly
  phase_id: PH2
  title: 텐션 기반 구동 시스템 조립
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - Dyneema SK78 텐던의 기계적 특성과 텐션 구동 메커니즘을 이해한다.
  - 텐션 구동 시스템의 마찰 관리 및 초기 장력 설정 방법을 학습한다.
  - 텐던의 반복 하중 및 굽힘에 따른 피로 성능을 평가하는 방법을 익힌다.
  theory_markdown: '### 텐션 기반 구동 시스템 기초


    텐던 구동 로봇손은 모터의 회전력을 섬유 줄(텐던)을 통해 관절로 전달하는 방식입니다. 본 프로젝트에서는 Liros사의 **Dyneema SK78**
    소재 1.5mm 텐던을 사용합니다 [S15]. SK78은 매우 높은 파단 하중(230 daN)과 1% 미만의 낮은 작동 신율을 가져 정밀한
    위치 제어에 유리합니다 [S15].


    #### 텐션 관리 및 기구학적 고려사항

    텐던은 단순히 힘을 전달하는 것이 아니라, 관절 시스템 내에서 캡스턴(Capstan)과 같은 경로를 따라 이동합니다. 이때 중요한 요소는 다음과
    같습니다:

    1. **마찰 관리**: 텐던이 통과하는 경로의 모서리는 라운딩 처리하여 마찰에 의한 조기 마모(Chafe)를 방지해야 합니다. Igus사의
    JSM-0810-10 폴리머 베어링은 무급유 운전이 가능하여 이러한 회전축 시스템에 적합합니다 [S16].

    2. **신율 및 장력**: 초기 장력 설정은 응답성에 직접적인 영향을 미칩니다. 텐던의 신율이 낮더라도 초기 장력이 부족하면 관절의 유격(Backlash)이
    발생합니다. 반복적인 장력 조절과 고정을 위해 열압입 인서트(HTBI-M3-BR)를 사용한 링크 설계를 적용합니다 [S20].

    3. **내구성**: 텐던은 반복적인 굽힘 하중을 받습니다. 반복 굽힘 시험을 통해 텐던의 교체 주기를 파악하는 것은 로봇손의 신뢰성 확보에
    필수적입니다.'
  worked_examples:
  - '예제 1: 텐던의 유효 파단 하중 계산. D-Pro 1.5mm 텐던의 파단 하중은 230 daN입니다. 안전율을 5로 설정할 경우, 텐던의
    허용 운용 하중은 46 daN(약 451 N)입니다 [S15].'
  - '예제 2: 모터 토크와 텐던 장력 변환. XM430-W350-T 액추에이터의 스톨 토크는 4.1 N·m입니다 [S4]. 캡스턴 반지름이 0.01
    m일 때, 이론상 발생하는 텐던의 인장력은 410 N입니다. 이는 텐던 허용 운용 하중(451 N) 이내에 존재함을 확인합니다.'
  lab:
    title: 텐던 장착 및 초기 장력 조절 실습
    steps:
    - 각 손가락 링크에 Igus 베어링(JSM-0810-10)을 삽입하고 8mm 정밀 샤프트를 조립합니다 [S16, B-SHAFT].
    - 손바닥 프레임에 열압입 인서트(HTBI-M3-BR)를 장착합니다 [S20].
    - Dyneema SK78 텐던을 캡스턴 경로를 따라 관절에 고정합니다 [S15].
    - 텐션 게이지를 사용하여 각 텐던의 초기 장력을 동일하게 5N으로 설정합니다.
    - 텐던의 이탈이나 과도한 마찰이 없는지 육안 및 손동작으로 확인합니다.
    safety:
    - 회전하는 부품 사이에 손가락이 끼지 않도록 주의하십시오.
    - 텐던 고정 나사 조립 시 보안경을 착용하십시오.
    - 텐던 장력 조절 중 줄이 끊어질 경우 튀어 오를 수 있으므로 손을 경로에서 멀리하십시오.
    deliverables:
    - 초기 장력 조절 기록지
    - 텐던 경로의 마찰 여부 확인서
    - 조립된 5지 로봇손 프레임 사진
  assignment:
    title: 텐던 시스템 내구성 설계 리포트
    deliverables:
    - 텐던의 허용 운용 하중 계산 과정
    - 마찰 방지를 위한 캡스턴 및 라운딩 설계 개선안
    - 반복 동작에 따른 텐던 예상 수명 계산서
    rubric:
    - SK78 소재 특성을 반영한 하중 계산의 정확성
    - 마찰과 내구성 관점에서의 기구 설계 타당성
    - 문제 해결을 위한 엔지니어링 논리 전개
  quiz:
  - question: Dyneema SK78 텐던을 사용하는 가장 큰 이유는 무엇입니까?
    choices:
    - 저렴한 가격과 쉬운 수급
    - 높은 파단 하중과 매우 낮은 신율
    - 우수한 전기 전도성
    - 높은 탄성 계수와 신장력
    answer_index: 1
    explanation: SK78은 매우 높은 파단 하중과 1% 미만의 낮은 작동 신율을 가져 정밀 제어에 적합합니다 [S15].
  - question: 텐션 구동 시스템에서 캡스턴 모서리 라운딩 처리를 하는 이유는?
    choices:
    - 부품의 중량을 줄이기 위해
    - 미관을 개선하기 위해
    - 텐던의 마찰에 의한 마모 방지
    - 조립 시간을 단축하기 위해
    answer_index: 2
    explanation: 텐던이 이동하는 모서리를 라운딩 처리하여 마찰에 의한 조기 마모(Chafe)를 방지해야 합니다.
  completion_criteria:
  - 텐던이 모든 관절 경로를 따라 부드럽게 이동함을 확인
  - 모든 초기 장력이 기준치(5N) 내에 도달함
  - 조립 상태 점검표 및 내구성 설계 리포트 제출
  source_ids:
  - S10
  - S15
  - S16
  - S20
  - S4
- id: M5
  slug: bearing-fastener-integration
  phase_id: PH2
  title: 베어링 및 고정 요소 정밀 조립
  estimated_hours: 15.0
  prerequisites:
  - M4
  objectives:
  - 로봇손의 기구적 정밀도를 결정하는 베어링과 고정 요소의 역할 이해
  - PC-CF(탄소섬유 강화 폴리카보네이트) 소재에 적합한 열압입 인서트 조립 공정 습득
  - 회전축 정렬 및 무급유 슬리브 베어링의 올바른 장착 기법 학습
  - 공차 관리를 통한 로봇 관절의 유격 및 마찰 최소화 방법 숙지
  theory_markdown: '## 정밀 기구 조립 이론


    로봇손의 제어 성능은 기구부의 정밀도에서 시작됩니다. 특히 반복적인 구동을 견뎌야 하는 관절부에서는 **베어링**, **고정 요소(Fasteners)**,
    그리고 **프레임 소재** 간의 상호작용이 시스템의 안정성을 결정합니다.


    ### 1. 무급유 슬리브 베어링 (Sleeve Bearings)

    본 시스템에서 사용하는 `JSM-0810-10`은 고성능 엔지니어링 폴리머 소재로, 무급유 운전 시 저마찰 및 진동 감쇄 특성을 가집니다 [S16].
    이 베어링은 압입(Press-fit) 방식으로 하우징에 장착되며, 하우징 보어와 결합된 후 비로소 정확한 내경 치수를 갖게 됩니다. 과도한
    압입은 내경을 좁게 하여 축 고착을 유발할 수 있으므로, 하우징 가공 정밀도가 매우 중요합니다 [S16].


    ### 2. 열압입 나사산 인서트 (Heat-set Inserts)

    PC-CF 소재는 강성과 내열성이 우수하지만, 나사산을 직접 탭핑하는 것은 반복 분해 시 마모를 유발합니다 [S18, S20]. 이를 방지하기
    위해 황동 열압입 인서트(`HTBI-M3-BR`)를 사용합니다 [S20].

    * **작동 원리:** 인서트를 가열하여 하우징에 삽입하면, 주변의 폴리머가 일시적으로 연화되어 인서트의 널링(Knurling) 구조 사이로
    파고듭니다. 냉각 후에는 높은 인발 강도를 제공합니다 [S20].

    * **핵심:** 파일럿 홀의 지름(4.0 mm)을 반드시 준수해야 합니다. 홀이 너무 크면 고정력이 저하되고, 너무 작으면 PC-CF 프레임에
    크랙이 발생할 수 있습니다 [S20].


    ### 3. 공차와 정밀 샤프트

    `AWMP-08` 정밀 알루미늄 샤프트는 무급유 베어링과 최적의 마찰 계수를 유지하도록 설계되었습니다 [S17]. 조립 시 샤프트의 끝단을
    모따기(Chamfering)하여 베어링 삽입 시 내부 라이너의 손상을 방지해야 합니다 [S17].'
  worked_examples:
  - '예제 1: M3 인서트 위치 선정

    - 질문: 4.0 mm 파일럿 홀을 뚫은 PC-CF 블록에 4.4 mm 외경의 인서트를 조립할 때 유의점은?

    - 답변: 홀 주위의 벽 두께가 최소 1 mm 이상 확보되어야 PC-CF 소재의 응력 파손을 방지할 수 있습니다. 인서트를 가열할 때 너무
    높은 온도는 탄소섬유의 결합을 깨뜨릴 수 있으므로 250-280°C 사이의 인두기 온도를 권장합니다.'
  - '예제 2: 슬리브 베어링 압입 공차

    - 질문: 8 mm 축을 사용하는 베어링 조립 시 하우징 보어의 권장 크기는?

    - 답변: 베어링의 외경이 10 mm이므로 하우징 보어는 압입 후 베어링이 8 mm 축과 적정 간극(Clearance)을 가지도록 제조사 권장
    규격인 10 mm 공차 하우징에 맞춰 가공해야 합니다 [S16].'
  lab:
    title: 로봇 관절 및 프레임 정밀 조립 실습
    steps:
    - PC-CF 프레임 출력물에서 서포트를 제거하고 파일럿 홀을 확인합니다.
    - 인두기를 사용하여 M3 황동 인서트를 하우징 홀에 수직으로 천천히 삽입합니다.
    - 인서트가 완전히 냉각될 때까지 기다린 후 나사산의 정렬 상태를 검사합니다.
    - 무급유 슬리브 베어링을 관절 하우징에 적정 도구를 사용하여 압입합니다.
    - 8 mm 알루미늄 샤프트를 적정 길이로 절단하고 모따기한 후 관절에 삽입하여 부드러운 회전을 확인합니다.
    safety:
    - 납땜 인두 사용 시 고온 화상 주의 및 보안경 착용 필수
    - PC-CF 출력물 절단 및 가공 시 발생하는 미세 먼지 흡입 방지
    - 베어링 압입 시 과도한 힘으로 인한 프레임 파손 주의
    - 비상 정지 장치(A22E)가 포함된 안전한 환경에서 수행
    deliverables:
    - 조립된 손가락 관절 모듈 5세트
    - 인서트 고정력 확인 기록
    - 샤프트 회전 마찰 측정치
  assignment:
    title: 기구적 유격 및 내구성 설계 보고서
    deliverables:
    - 관절 조립 CAD 도면 및 실제 조립 사진
    - 베어링-축 간극 및 인서트 하중 분석 데이터
    - 관절 가동 범위 및 부드러움 점검 리스트
    rubric:
    - 인서트가 프레임에 수직으로 완벽하게 조립되었는가?
    - 베어링 압입 시 프레임 손상 없이 부드러운 회전이 확보되었는가?
    - 설계된 공차 범위 내에서 조립이 완료되었는가?
  quiz:
  - question: 무급유 슬리브 베어링을 하우징에 압입한 직후 성능이 변하는 이유는 무엇입니까?
    choices:
    - 베어링 내부의 재질이 하우징 압력으로 경화되기 때문
    - 압입 과정에서 하우징 내경에 맞춰 베어링 내경이 수축되기 때문
    - 폴리머가 하우징과 반응하여 윤활유를 생성하기 때문
    - 슬리브 베어링은 압입과 상관없이 내경이 고정되어 있기 때문
    answer_index: 1
    explanation: 무급유 슬리브 베어링은 하우징 보어에 압입된 후 압축되면서 최종 내경 치수가 결정되므로, 하우징 공차 관리가 매우 중요합니다
      [S16].
  - question: PC-CF 소재에 황동 열압입 인서트를 사용할 때 적절한 파일럿 홀 조치는?
    choices:
    - 인서트 외경보다 0.5 mm 크게 뚫는다
    - 제조사 권장 지름(4.0 mm)을 정확히 유지한다
    - 나사산 탭핑을 먼저 수행한다
    - 인서트를 망치로 직접 타격하여 삽입한다
    answer_index: 1
    explanation: 인서트의 고정력은 홀 지름에 의존합니다. 너무 크면 고정되지 않고, 너무 작으면 PC-CF 소재가 파손되므로 권장 치수를
      준수해야 합니다 [S20].
