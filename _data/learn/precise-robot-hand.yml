modules:
- id: m1
  slug: haptics-intro
  phase_id: p1
  title: 로봇 손과 햅틱의 이해
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 햅틱 시스템의 기본 개념과 인간-기계 상호작용의 원리를 이해한다.
  - 로봇 손 제어를 위한 구동기(액추에이터), 센서, 제어기 간의 하드웨어 관계를 정의한다.
  - 안전한 전원 시스템 구성과 독립 분기 회로의 중요성을 학습한다.
  theory_markdown: '### 햅틱 시스템 개요

    햅틱 시스템은 인간과 가상 환경 또는 원격 로봇 사이에서 촉각 및 운동감각 피드백을 전달하는 기술이다 [S1]. 로봇 손 설계에서 햅틱 피드백은
    사용자가 로봇의 파지 상태를 실시간으로 느끼게 하여 정교한 작업을 가능하게 한다.


    ### 로봇 손 제어 하드웨어 아키텍처

    본 프로젝트의 5지 로봇 손은 다음과 같은 주요 구성요소로 이루어집니다:

    1. **구동부**: DYNAMIXEL XM430-W350-T 액추에이터는 12V 전압을 기반으로 4.1 N·m의 스톨 토크를 제공하며, 위치/속도/전류의
    통합 피드백을 수행합니다 [S12].

    2. **제어부**: OpenCR 1.0 보드는 216MHz CPU를 탑재하고 DYNAMIXEL 포트를 내장하여 브리지 회로 없이 제어 명령과
    센서 데이터를 처리합니다 [S14].

    3. **감지부**: FSR 402 센서는 0.2N에서 20N 범위의 접촉력을 감지하며, 10kΩ 저항을 사용한 전압 분압 회로를 통해 0-3.3V
    범위의 ADC 신호를 OpenCR로 전달합니다 [S13, S27].


    ### 전원 시스템 안전 설계

    안전한 동작을 위해 전원 공급 장치는 독립적으로 분리되어야 합니다. 각 액추에이터는 12V 어댑터로부터 10A ATOF 퓨즈를 통하여 개별
    분기 회로에 할당됩니다 [S16, S26]. 모든 양(+) 출력은 전기적으로 고립되어야 하며, 인위적인 결선(병렬화)은 엄격히 금지됩니다 [S16].'
  worked_examples:
  - '예제 1: 액추에이터 분기당 전류 계산. XM430-W350-T의 스톨 전류는 2.3A입니다 [S12]. 4개의 액추에이터가 1개 퓨즈 분기에
    연결된 경우, 피크 전류 합계는 9.2A입니다. 10A 퓨즈는 9.2A의 피크 전류를 허용하면서 배선 과전류 발생 시 시스템을 보호하는 적절한
    정격입니다 [S26].'
  - '예제 2: FSR 센서 전압 분압. 3.3V 센서 전원 레일을 사용하고, 10kΩ 저항과 FSR 센서를 직렬 연결하여 분압합니다 [S27].
    센서 저항이 변함에 따라 OpenCR의 ADC(12비트)로 입력되는 신호는 0~3.3V 범위 내에서 변화하여 정밀한 힘 측정이 가능합니다 [S13,
    S14].'
  lab:
    title: 안전한 전원 시스템 구성 및 계측
    steps:
    - 각 12V 전원 어댑터에 인라인 퓨즈 홀더를 결선하고 10A 퓨즈를 삽입한다 [S25, S26].
    - 각 분기의 출력을 멀티미터 DC 전압 모드로 측정하여 12V가 안정적으로 출력되는지 확인한다.
    - 모든 전원을 분리하고, 멀티미터 DC 전압 모드에서 1V 이하인지 확인한 후 배선을 진행한다.
    safety:
    - 절대 양(+) 출력 단자를 서로 연결하거나 결합하지 않는다.
    - 정비 및 배선 수정 전 반드시 3개 전원 어댑터를 물리적으로 분리한다.
    - 퓨즈를 비상 차단 스위치로 사용하지 않으며, 전원 분리는 물리적 플러그 분리(Air-Gap)로 수행한다.
    deliverables:
    - 독립된 3개 전원 분기의 배선도
    - 각 분기별 전압 측정 결과 기록
  assignment:
    title: 로봇 손 하드웨어 시스템 설계서 작성
    deliverables:
    - 하드웨어 아키텍처 블록 다이어그램
    - 전원 및 센서 신호 분기 배선도
    rubric:
    - 전원 분기 구성의 독립성이 보장되었는가?
    - 센서 신호 전압이 0-3.3V 범위 내에 있도록 설계되었는가?
    - 액추에이터 피크 전류 합계와 퓨즈 정격이 BOM 사양에 따라 적절히 계산되었는가?
  quiz:
  - question: FSR 센서와 전압 분압기를 구성할 때 권장되는 전원 레일은?
    choices:
    - 12V 액추에이터 전원 레일
    - 3.3V 센서 전원 레일
    answer_index: 1
    explanation: OpenCR의 ADC 사양과 센서의 신호 범위(0-3.3V)를 고려하여 3.3V 센서 전원 레일을 사용해야 합니다 [S14].
  - question: 전원 시스템 구성 시 주의해야 할 안전 사항은?
    choices:
    - 여러 전원 공급 장치의 양(+) 출력을 병렬 연결하여 전류 용량을 늘린다.
    - 각 전원 공급 장치의 분기를 물리적으로 분리하여 독립적인 퓨즈로 보호한다.
    answer_index: 1
    explanation: 독립된 분기 구성을 유지하는 것은 과전류 방지와 시스템 안전을 위한 필수 조건입니다 [S16].
  completion_criteria:
  - 하드웨어 아키텍처 및 배선도 제출 완료
  - 독립된 전원 분기 구성 원리 이해 및 퀴즈 통과
  - 안전 규정 및 계측 절차 준수 확인
  source_ids:
  - S1
  - S12
  - S14
  - S13
  - S27
  - S16
  - S26
  - S25
- id: m2
  slug: mechanism-design
  phase_id: p1
  title: 메커니즘 설계 원리
  estimated_hours: 10.0
  prerequisites:
  - m1
  objectives:
  - 로봇손의 구동을 위한 텐던(tendon) 구동 메커니즘의 원리를 이해한다.
  - 정교한 파지 동작을 위한 링크 설계와 자유도(DOF) 분배 방법을 학습한다.
  - 하드웨어 강성과 제어 정밀도 사이의 관계를 파악한다.
  - 안전한 전원 구성과 전기적 분기 설계를 습득한다.
  theory_markdown: '## 텐던 구동 로봇손 메커니즘


    정교한 로봇손은 인간의 손을 모방하여 유연하면서도 정밀한 힘 제어가 가능해야 합니다. 텐던 구동(Tendon-driven) 방식은 구동기(액추에이터)를
    관절 위치에서 분리하여 손 자체의 무게를 줄이고, 좁은 공간 내에서 여러 자유도를 구현할 수 있게 합니다 [S3].


    ### 1. 링크와 자유도

    로봇손의 각 손가락은 2자유도(2-DOF)를 기본으로 하며, 엄지는 3자유도를 통해 대향(opposition) 파지가 가능하도록 설계합니다
    [S10]. 각 마디는 링크(link)로 연결되며, 텐던 장력에 의해 굽힘 운동을 수행합니다. 텐던 재료로는 매우 낮은 신율(1% 미만)과
    높은 파단 하중(230 daN)을 가진 `Dyneema SK78`과 같은 고성능 섬유가 필수적입니다 [S17].


    ### 2. 구동력 전달과 정밀도

    액추에이터(예: `XM430-W350-T`)는 회전 운동을 텐던의 당김 동작으로 변환합니다 [S12]. 이때 액추에이터의 정밀한 전류 제어를
    통해 파지력을 피드백받습니다. 전원 설계 시에는 액추에이터 분기별로 독립적인 저전압 DC 전원을 구성하여 시스템 안정성을 확보해야 합니다.
    3개 분기로 액추에이터를 4대/4대/3대로 배분하고, 각 분기마다 `10 A ATOF` 퓨즈를 배치하여 과전류를 방지합니다 [S16, S26].


    ### 3. 구조 강성과 조립

    로봇손의 프레임은 FDM 3D 프린팅으로 제작하며, 강성과 치수 안정성을 위해 `PC-CF(탄소섬유 보강 폴리카보네이트)`를 사용합니다 [S20].
    반복적인 조립과 분해를 위해 M3 황동 열압입 인서트를 사용하여 나사산의 마모를 방지합니다 [S22]. 회전축에는 무급유 폴리머 슬리브 베어링을
    사용하여 마찰과 유격을 관리합니다 [S18].'
  worked_examples:
  - '예제 1: 텐던 장력 요구사항 계산. 1.5 mm Dyneema SK78 텐던이 230 daN의 파단 하중을 가질 때, 4.1 N·m 스톨
    토크를 내는 XM430-W350-T 액추에이터로 텐던을 구동할 경우 적절한 안전율 확보 방안. (해석: 파단 하중 2300 N 대비 액추에이터
    최대 토크 출력에 의한 장력은 매우 작으므로, 섬유 신율 1% 미만 유지와 캡스턴 모서리 라운딩을 통한 응력 집중 방지가 핵심임 [S12,
    S17].)'
  - '예제 2: 전원 분기 설계. 액추에이터 11대 총 피크 스톨 전류 25.3 A를 처리하기 위해 각 11.5 A 출력의 어댑터 3개를 어떻게
    배분하는가? (해석: 4대, 4대, 3대로 배분 시 분기별 최대 스톨 전류는 각각 9.2 A, 9.2 A, 6.9 A가 됨. 이는 10 A
    퓨즈 정격과 11.5 A 어댑터 출력 범위 내에 적절히 들어옴 [S16, S26].)'
  lab:
    title: 로봇손 텐던 구동 및 전기 분기 모의 조립
    steps:
    - PC-CF 재질의 손가락 링크 출력물에 4.0 mm 파일럿 홀을 확인하고 M3 열압입 인서트를 조립한다.
    - JSM-0810-10 베어링과 8 mm 샤프트를 사용하여 손가락 관절의 유격을 확인하고 텐던을 배선한다.
    - 3개의 독립 전원 분기를 위해 각 12 V 어댑터 출력에 ATO 인라인 퓨즈 홀더와 10 A 퓨즈를 장착한다.
    - OpenCR 제어기에 3.3 V 센서 전원을 사용하여 FSR 분압 회로를 구성하고, 10 kΩ 저항으로 힘 신호 취득 테스트를 수행한다.
    safety:
    - 절단·드릴링 시 반드시 충격 방지 작업용 보안경을 착용한다.
    - 모든 전원 연결 전후, 멀티미터를 사용하여 저전압 벤치 상태인지 확인한다.
    - 전원 인가 중 손을 가동 범위 내에 절대 넣지 않으며, 반드시 고정 지그를 사용한다.
    - 정비 전 3개의 모든 어댑터를 물리적으로 분리하고, 각 분기의 DC 전압이 1 V 미만임을 계측 확인한다.
    deliverables:
    - 조립된 손가락 링크 모듈 및 텐던 장착 사진
    - 전기 배선도 및 분기별 퓨즈 연결 상태 보고서
    - 멀티미터를 이용한 무전원 상태 확인 계측 기록
  assignment:
    title: 5지 로봇손 기구 설계 및 전원 분기 설계 보고서
    deliverables:
    - 텐던 구동 메커니즘 CAD 설계도(링크 길이, 텐던 경로 포함)
    - 로봇손 액추에이터 전원 분기 및 퓨즈 보호 설계도
    - 재료 물성 및 구매 부품 사양 요약표
    rubric:
    - 텐던 구동 원리와 자유도 분배가 논리적으로 기술되었는가?
    - 전원 설계에서 3개 분기가 독립적으로 구성되었고 퓨즈 정격이 피크 전류를 보호하는가?
    - 사용된 부품들이 BOM 시스템의 규격을 정확히 준수하는가?
  quiz:
  - question: 텐던 구동 로봇손에서 텐던 재료로 Dyneema SK78을 사용하는 주된 이유는 무엇입니까?
    choices:
    - 높은 전기 전도성과 낮은 저항
    - 1% 미만의 낮은 작동 신율과 높은 파단 하중
    answer_index: 1
    explanation: Dyneema SK78은 신율이 매우 낮고 강도가 높아 정밀한 장력 전달에 적합합니다 [S17].
  - question: 액추에이터 전원 분기 설계 시 올바른 조치는 무엇입니까?
    choices:
    - 양(+) 출력을 하나로 병렬 연결하여 전류 용량을 늘린다.
    - 분기별로 독립적인 어댑터를 사용하고 물리적으로 분리한다.
    answer_index: 1
    explanation: 양(+) 출력의 병렬 연결은 금지되며, 독립적인 분기 구성과 물리적 분리가 안전을 위해 필수적입니다 [BOM 시스템의
      전원 분기 규칙].
  - question: FSR 402 센서를 OpenCR 제어기에 연결할 때 올바른 전압 공급 방식은?
    choices:
    - 12 V 액추에이터 레일을 사용하여 ADC 입력을 구성한다.
    - 3.3 V 센서 전원 레일을 사용한다.
    answer_index: 1
    explanation: OpenCR 제어기에서 FSR 분압 회로는 반드시 3.3 V 센서 레일을 사용해야 합니다 [BOM 시스템].
