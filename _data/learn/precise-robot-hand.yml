modules:
- id: M1
  slug: intro-robotics
  phase_id: P1
  title: 로봇 공학 입문
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - 로봇 공학의 정의와 기계·전자·제어 융합의 기초 원리를 이해한다.
  - 로봇 손 제작에 필요한 핵심 컴포넌트의 기능을 파악한다.
  - 안전한 저전압 벤치 프로토타입 구축 및 운용 원칙을 습득한다.
  theory_markdown: '## 로봇 공학의 통합적 기초

    로봇 공학은 기계 공학, 전자 공학, 그리고 컴퓨터 과학이 융합된 다학제적 분야이다 [S1, S2]. 정교한 5지 로봇손을 구현하기 위해서는
    각 도메인의 긴밀한 협력이 필수적이다.


    ### 1. 구동 시스템 (Actuation)

    로봇손의 각 관절은 스마트 액추에이터인 DYNAMIXEL XM430-W350-T를 사용하여 구동된다 [S14]. 이 액추에이터는 12 V 전압에서
    작동하며, 최대 스톨 전류는 2.3 A이다 [S14]. 토크 제어와 위치 피드백을 통해 텐던(tendon)을 정밀하게 제어하여 파지 기능을
    수행한다 [S14].


    ### 2. 제어 아키텍처 (Control Architecture)

    OpenCR 1.0 보드는 시스템의 뇌 역할을 수행한다 [S16]. 이 제어기는 216 MHz CPU를 탑재하고 있으며, 액추에이터와 직접
    통신할 수 있는 포트를 내장하여 브리지 회로 없이 안전하고 재현성 높은 제어를 가능하게 한다 [S16].


    ### 3. 감지 및 피드백 (Sensing)

    손끝의 접촉력은 FSR 402 센서를 통해 측정된다 [S15]. FSR은 가해지는 힘에 반비례하여 저항이 감소하는 특성을 가지며, 이를 10
    kΩ 저항과 함께 분압 회로로 구성하여 OpenCR의 12비트 ADC로 읽어 들인다 [S15, S28].


    ### 4. 안전 및 전원 관리

    본 프로토타입은 3개의 독립된 MEAN WELL GST160A12-R7B 절연 전원 어댑터를 사용하여 액추에이터 전력을 공급한다 [S18].
    각 어댑터는 12 V, 11.5 A 출력을 제공하며, 액추에이터 그룹(4대/4대/3대)에 독립적으로 할당되어 배선 보호를 위해 10 A ATOF
    퓨즈를 거쳐야 한다 [S18, S27]. 양(+) 출력단은 절대 병렬로 연결하지 않는다.'
  worked_examples:
  - '예제 1: 전원 분기 전류 계산. 액추에이터 4대를 한 분기에 연결할 경우, 최대 피크 전류는 4 * 2.3 A = 9.2 A이다. 이는
    전원 어댑터 정격 11.5 A 및 퓨즈 정격 10 A 이내이므로 안전하게 운용 가능하다.'
  - '예제 2: FSR 전압 분압기 계산. 3.3 V 센서 레일에서 FSR(가변 저항 R_fsr)과 10 kΩ 저항(R_fix)을 직렬로 연결할
    때, ADC 입력 전압 V_adc = 3.3 V * (R_fix / (R_fsr + R_fix))이다. FSR 힘이 증가하여 R_fsr이 작아지면
    V_adc는 상승한다.'
  lab:
    title: 기초 전원 및 센서 시스템 구성
    steps:
    - 각 전원 어댑터 출력 단에 ATO 인라인 퓨즈 홀더를 설치하고 10 A 퓨즈를 삽입한다.
    - 멀티미터를 사용하여 각 분기 출력 전압이 12 V인지 확인한다.
    - OpenCR 보드의 3.3 V 센서 레일에 FSR 분압 회로를 납땜하고 ADC 입력 전압 변화를 관찰한다.
    safety:
    - 실험 중 정지는 3개 절연 전원 어댑터를 물리적으로 분리하는 것을 원칙으로 한다.
    - 전원 인가 상태에서 절대 퓨즈를 제거하거나 연결을 수정하지 않는다.
    - 모든 측정 시 멀티미터를 DC 전압 모드로 설정하고 1 V 미만임을 확인한 후 장비에 접촉한다.
    deliverables:
    - 독립 분기별 12 V 출력 측정 기록
    - FSR 접촉력에 따른 ADC 입력값 변화 그래프
  assignment:
    title: 로봇 시스템 설계 요구사항 정의
    deliverables:
    - 로봇 손 시스템의 기계적·전기적 요구사항 정의서
    - 부품 목록(BOM) 기반 전력 소모 및 퓨즈 용량 적절성 분석서
    rubric:
    - 컴포넌트별 사양이 시스템 요구사항과 일치하는가?
    - 전력 공급 방식이 안전 지침(독립 분기 유지)을 준수하는가?
  quiz:
  - question: 로봇손의 구동을 위해 3개의 전원 어댑터를 사용할 때 올바른 연결 방법은?
    choices:
    - 모든 어댑터의 (+) 출력을 하나로 묶어 높은 전류를 확보한다.
    - 각 어댑터를 독립된 액추에이터 분기에 할당하고 퓨즈를 통해 보호한다.
    - 어댑터 하나에 모든 액추에이터를 연결하고 나머지는 예비용으로 둔다.
    answer_index: 1
    explanation: 독립 분기를 유지해야 과전류 보호가 가능하며, 출력단을 병렬로 묶는 행위는 절연형 전원 장치의 설계 의도에 어긋나며
      위험하다.
  - question: FSR 센서 데이터를 OpenCR 보드에서 안전하게 취득하는 방법은?
    choices:
    - FSR을 12 V 액추에이터 레일에 직접 연결한다.
    - FSR을 3.3 V 센서 레일과 분압 회로로 구성하여 ADC 입력 범위 내로 유지한다.
    - FSR 데이터를 전압 브리지 없이 직접 디지털 핀에 입력한다.
    answer_index: 1
    explanation: OpenCR의 ADC는 3.3 V 기준이며, 12 V 레일은 센서 회로와 반드시 분리되어야 한다.
  completion_criteria:
  - 안전 프로토콜 준수 서약서 제출
  - 기초 전원 구성 및 센서 출력 데이터 검증 보고서 완료
  - 이론 퀴즈 100% 득점
  source_ids:
