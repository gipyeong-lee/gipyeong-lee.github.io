- id: M6
  slug: electronics
  phase_id: PH3
  title: 제어 회로 및 전원 분배
  estimated_hours: 15.0
  prerequisites:
  - M5
  objectives:
  - DYNAMIXEL 스마트 액추에이터 구동을 위한 12 V 전원 분기 회로 설계 이해
  - OpenCR 제어 보드 기반의 센서 및 제어 신호 배선 원리 습득
  - FSR 힘 센서 전압 분압 회로 구성 및 ADC 신호 범위 최적화
  - 과전류 보호를 위한 독립 퓨즈 분기 및 안전한 물리적 전원 분리 절차 숙지
  theory_markdown: '## 1. 전원 분배 시스템 구조

    로봇손의 안정적인 구동을 위해 액추에이터 전원(12 V)과 제어·센서 전원을 엄격히 분리합니다. 액추에이터 구동을 위해 3개의 독립적인 절연형
    12 V 전원 어댑터를 사용하며, 각 어댑터는 4대, 4대, 3대의 액추에이터 부하를 분담합니다 [B3]. 각 어댑터 출력단에는 ATOF 10
    A 퓨즈를 장착하여 특정 분기에서 과전류 발생 시 고장을 격리합니다 [B3, B10, B-WIRING-FUSE-HOLDER]. 각 분기의 양(+)
    출력은 서로 연결되지 않도록 독립적으로 유지해야 하며, 병렬 연결은 절대 금지합니다 [B3].


    ## 2. 센서 신호 취득 회로

    손끝 힘 감지 센서(FSR 402)는 힘이 증가함에 따라 저항이 감소하는 특성을 가집니다 [B4, S13]. 이를 MCU가 인식할 수 있도록
    전압 신호로 변환하기 위해 10 kΩ 분압 저항과 함께 전압 분압 회로를 구성합니다 [B-SENSOR-RESISTOR, S27]. 이 회로는
    반드시 OpenCR의 3.3 V 센서 전원 레일에 연결되어야 하며 [B2], ADC 신호는 0~3.3 V 범위를 유지해야 합니다 [B2].
    12 V 액추에이터 전원이나 5 V 전원 사용은 ADC 소손의 원인이 되므로 엄격히 제한합니다.


    ## 3. 제어 및 신호 연결

    OpenCR 보드는 DYNAMIXEL 액추에이터와 직접 통신 가능한 포트를 내장하여 브리지 회로 없이 안정적인 제어가 가능합니다 [B2, S14].
    각 관절의 전원 및 통신 하네스는 유지보수성을 위해 Micro-Fit 3.0 커넥터를 사용하여 탈착식으로 구성합니다 [B5, S15].'
  worked_examples:
  - '예제 1: 퓨즈 용량 결정

    액추에이터 4대가 한 분기에 연결된 경우, 스톨 전류 합계는 2.3 A × 4 = 9.2 A입니다 [B1]. 이에 따라 11.5 A 공급 능력을
    갖춘 어댑터 [B3] 하위에서, 9.2 A 피크 부하를 보호하고 정격 전류 11.5 A를 넘지 않는 10 A ATOF 퓨즈를 선정하는 것이
    적절합니다 [B10, S26].'
  - '예제 2: FSR 분압기 출력 계산

    센서가 압력을 받아 저항값이 10 kΩ이 되었을 때, 3.3 V 전원을 사용하는 10 kΩ 분압 저항과의 회로에서 ADC에 입력되는 전압은
    3.3 V × (10 kΩ / (10 kΩ + 10 kΩ)) = 1.65 V입니다. 이는 OpenCR의 ADC 허용 범위(0~3.3 V) 내에
    안전하게 포함됩니다 [B2, S14].'
  lab:
    title: 전원 시스템 구성 및 신호 점검
    steps:
    - 각 절연형 전원 어댑터 출력단에 ATO 인라인 퓨즈 홀더를 연결하고 10 A 퓨즈를 삽입합니다 [B3, B10, B-WIRING-FUSE-HOLDER].
    - 각 어댑터 분기의 (+) 출력과 액추에이터 전원 버스를 결선하고, 모든 접지는 공통 접지 포인트로 수렴시킵니다.
    - FSR 402 센서 한 개에 대해 10 kΩ 저항을 사용한 분압 회로를 OpenCR 3.3 V 및 ADC 핀에 연결합니다 [B2, B4,
      B-SENSOR-RESISTOR].
    - 전원 인가 전 멀티미터로 액추에이터 전원 레일과 제어 센서 전원 레일 간 절연 상태를 확인합니다.
    - 각 어댑터 전원을 개별적으로 인가하고 전압 모드에서 각 분기 전압이 12 V임을 측정합니다.
    safety:
    - 작업 중 반드시 충격 방지 보안경을 착용합니다.
    - 퓨즈가 장착되지 않은 전원 인가는 절대 금지합니다.
    - 배선 접근 전 3개 전원을 물리적으로 분리하고, 멀티미터 DC 전압 모드로 각 분기 전압이 1 V 미만임을 확인한 후 손을 대야 합니다.
    - 저항 모드나 연속성 모드를 전원 차단 확인용으로 사용하지 않습니다.
    deliverables:
    - 각 분기별 측정 전압 기록지
    - 센서 입력 신호 ADC 값 범위 확인 보고서
    - 독립 분기 절연 확인 기록
  assignment:
    title: 로봇손 전원 분배 및 회로 설계안 작성
    deliverables:
    - 액추에이터 11대 배분 및 3개 독립 전원 연결을 나타낸 배선도
    - FSR 전압 분압 회로 상세 설계도
    - 사용된 퓨즈, 커넥터, 저항의 정격 검토서
    rubric:
    - 배선도 내 3개 분기의 독립적 전원 경로 유지 여부
    - 액추에이터 전원과 센서 전원의 전기적 격리 준수
    - 사용 부품의 정격(전압, 전류) 및 호환성 명시 여부
  quiz:
  - question: 로봇손 시스템에서 액추에이터 전원 분기를 위해 가장 적절한 조치는 무엇입니까?
    choices:
    - 모든 액추에이터 전원 어댑터의 (+) 출력을 병렬로 연결하여 전류 용량을 합산한다.
    - 각 전원 어댑터 분기를 독립적으로 유지하고, 분기마다 10 A 퓨즈를 설치하여 보호한다.
    answer_index: 1
    explanation: 독립 분기 전원의 (+) 출력 병렬 연결은 금지되며, 각 분기는 독립적인 퓨즈를 통해 과전류로부터 보호되어야 합니다.
  - question: FSR 402 센서와 OpenCR ADC 연결 시 센서 전원 공급 방법으로 옳은 것은?
    choices:
    - 액추에이터용 12 V 전원 레일을 사용한다.
    - OpenCR의 3.3 V 센서 전원 레일을 사용한다.
    answer_index: 1
    explanation: OpenCR ADC 입력 신호는 0~3.3 V 범위를 초과해서는 안 되므로 반드시 3.3 V 센서 레일을 사용해야 합니다.
  completion_criteria:
  - 독립적인 3개 전원 분기 배선도 제출
  - 실습 단계에서 측정한 모든 분기 전압의 정상 범위 확인 기록
  - 정격 검토서에서 설계 부품의 전류/전압 제한 사항 준수 확인
  source_ids:
  - S6
  - S14
  - S15
  - S16
  - S25
  - S13
  - S27
  - S26
- id: M7
  slug: firmware
  phase_id: PH3
  title: 펌웨어 개발 및 제어 알고리즘
  estimated_hours: 10.0
  prerequisites:
  - M6
  objectives:
  - DYNAMIXEL Protocol 2.0을 사용하여 11개의 스마트 액추에이터를 제어하는 상태기계 구현
  - FSR 센서의 아날로그 신호를 3.3 V 센서 레일에서 안정적으로 취득 및 처리
  - 위치, 속도, 전류 피드백 루프를 활용한 로봇손의 파지 알고리즘 설계
  - OpenCR 제어기의 자원을 효율적으로 분배하는 멀티스레드 제어 구조 이해
  theory_markdown: "### DYNAMIXEL 제어 및 센서 피드백 시스템\n\n정교한 5지 로봇손은 11개의 XM430-W350-T\
    \ 액추에이터를 사용하며, 각 액추에이터는 12 V 전원 분기에 할당됩니다 [S12]. OpenCR 1.0은 내장된 DYNAMIXEL 포트를\
    \ 통해 별도의 통신 브리지 없이 직접 통신하며 [S14], 12 V 액추에이터 전원과 독립적으로 3.3 V 센서 레일을 관리합니다 [B2].\
    \ \n\n#### 1. 프로토콜 2.0 운용\n데이터 패킷 전송을 통해 위치, 속도, 현재 부하(전류) 상태를 실시간으로 모니터링합니다.\
    \ 11개의 액추에이터는 개별 ID를 가지며, 동기화된 명령을 통해 텐던 장력을 제어합니다 [B1].\n\n#### 2. 힘 감지 및 아날로그\
    \ 변환\n손끝에 배치된 FSR 402는 접촉 시 저항이 감소하는 원리를 이용합니다 [S13]. OpenCR의 12비트 ADC 입력을 통해\
    \ 0~3.3 V 범위를 처리하며, 이때 FSR과 10 kΩ 저항으로 구성된 전압 분배기 회로를 사용합니다 [B2, B4, B-SENSOR-RESISTOR].\
    \ 반드시 센서 전원 3.3 V 레일만을 사용해야 하며 5 V 또는 12 V 레일 사용은 금지됩니다 [B2].\n\n#### 3. 전력 관리\
    \ 및 안전\n총 11개 액추에이터의 스톨 전류 합계는 25.3 A에 달합니다 [B1]. 3개의 독립적인 11.5 A 출력 어댑터 분기를 사용하며\
    \ [B3], 각 분기는 10 A ATOF 퓨즈로 보호됩니다 [B10]. 어댑터 출력을 물리적으로 결합하는 것은 절대 금지됩니다 [B3]."
  worked_examples:
  - '예제 1: 전류 부하 계산 및 퓨즈 선정. 액추에이터 11대 사용 시 총 스톨 전류는 11 * 2.3 A = 25.3 A입니다. 3개 어댑터(분기당
    11.5 A)에 4대, 4대, 3대씩 배분하면 최대 9.2 A(4대)의 부하가 발생합니다. 선정된 10 A 퓨즈는 9.2 A 피크를 상회하며
    11.5 A 전원 한계 이내에서 배선을 보호합니다 [B1, B3, B10].'
  - '예제 2: FSR ADC 판독. 10 kΩ 분압 저항과 FSR을 사용하여 전압을 분배할 때, ADC 값이 최대 3.3 V를 넘지 않도록 설계합니다.
    OpenCR ADC는 12비트(0~4095) 정밀도를 가지므로, 0~3.3 V 입력을 4096 단계로 정밀하게 변환합니다 [B2, B-SENSOR-RESISTOR].'
  lab:
    title: 로봇손 펌웨어 배포 및 센서 교정
    steps:
    - OpenCR 제어기를 PC에 연결하고 개발 환경을 설정합니다.
    - 11개 액추에이터의 ID를 순차적으로 할당하고 통신 상태를 확인합니다.
    - FSR 센서 분압 회로를 3.3 V 레일에 결합하고 ADC 출력값을 데이터로 수집합니다.
    - 수집된 센서 데이터에 기반하여 파지력 임계값을 보정합니다.
    - 무부하 상태에서 소프트웨어 제어를 통해 11개 관절의 가동 범위를 검증합니다.
    safety:
    - 모든 정비 및 접근 전 3개 전원 어댑터를 물리적으로 분리하십시오.
    - 전원 인가 중에는 절대로 가동 범위 내에 손을 넣지 마십시오.
    - 전원 분리 후 멀티미터 DC 전압 모드로 각 Branch가 1 V 미만인지 반드시 확인하십시오.
    - 작업 중 보안경을 필히 착용하십시오.
    deliverables:
    - 각 액추에이터 통신 ID 할당 보고서
    - 센서 입력값-압력 교정 곡선 그래프
    - 관절 가동 범위 제한(Limit) 설정 코드
  assignment:
    title: 파지 제어 알고리즘 설계
    deliverables:
    - 전류 및 힘 피드백을 결합한 파지 제어 알고리즘 소스 코드
    - 임계값 도달 시 정지 명령을 수행하는 상태기계 순서도
    rubric:
    - 안전 임계값 미만에서만 동작하는 논리 구현 여부
    - 전류/힘 피드백을 활용하여 모터 과부하를 방지하는 알고리즘의 유효성
    - 계획 정지 후 정비·접근 전 3개 전원 어댑터를 물리적으로 분리하고 각 분기의 무전원 상태를 계측 확인한다
  quiz:
  - question: FSR 402 센서와 전압 분배 회로를 설계할 때 사용할 수 있는 올바른 전원 레일은?
    choices:
    - 12 V 액추에이터 전원
    - 5 V 전원
    - 3.3 V 센서 전원
    - 24 V 입력 전원
    answer_index: 2
    explanation: OpenCR 제어기에서 FSR 전압 분배 회로는 반드시 3.3 V 센서 레일을 사용해야 합니다 [B2].
  - question: 11개 액추에이터를 3개 전원 분기에 배분할 때 가장 적절한 구성은?
    choices:
    - 4대 / 4대 / 3대 분배 및 독립적 퓨즈 설치
    - 11대를 모든 어댑터에 병렬로 연결
    - 1개 분기에 11대 전부 연결
    - 모든 전원을 액추에이터가 아닌 제어기 5 V 포트에서 공급
    answer_index: 0
    explanation: 각 어댑터는 독립적으로 분기되어야 하며, 합계 25.3 A의 부하를 감당하기 위해 분기당 4대/4대/3대로 배분하고
      각각 독립적인 10 A 퓨즈로 보호해야 합니다 [B1, B3, B10].
  - question: 로봇손 정비 시 가장 우선시해야 할 안전 절차는?
    choices:
    - 소프트웨어로 모터 전류 0으로 설정
    - 멀티미터 저항 모드로 배선 상태 확인
    - 3개 전원 어댑터를 물리적으로 분리하고 1 V 미만 DC 전압 확인
    - 퓨즈를 제거하지 않고 전원 스위치만 차단
    answer_index: 2
    explanation: 반드시 3개 전원을 물리적으로 분리하고 DC 전압 모드에서 1 V 미만임을 확인해야 합니다 [안전요약].
  completion_criteria:
  - 11개 액추에이터의 ID 할당 및 통신 성공
  - FSR 힘 센서의 3.3 V ADC 입력값 정상 취득 확인
  - 제어 코드 내 과부하 방지 로직 구현 및 무부하 시험 완료
  - 정비 전 1 V 미만 계측 확인 습관화
