- id: m8
  slug: electronics-power
  phase_id: phase3
  title: 전자회로 및 전원 관리
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - 5지 로봇손의 전체 전력 요구사항을 계산하고 독립 전원 분기를 설계한다.
  - OpenCR 제어 보드와 액추에이터, 센서 간의 안전한 배선 및 접지 원칙을 이해한다.
  - 과전류 보호를 위한 퓨즈 선정 및 비상 전원 차단 시스템을 구성한다.
  - FSR 센서와 OpenCR ADC 입력을 위한 전압 분압 회로를 올바르게 연결한다.
  theory_markdown: '### 로봇손 전력 시스템 설계


    정교한 5지 로봇손의 안정적인 운용은 정확한 전력 예산 수립에서 시작됩니다. 본 로봇손은 총 10개의 XM430-W350-T 스마트 액추에이터를
    사용하며, 각 액추에이터는 12 V 전압에서 동작합니다 [S14]. 스톨 전류는 개당 2.3 A이므로 [S14], 전체 시스템의 피크 전류는
    이론상 최대 23 A에 달할 수 있습니다.


    #### 1. 전원 분기 및 보호

    전원 공급은 2개의 독립적인 12 V, 138 W(11.5 A) 어댑터(GST160A12-R7B)를 활용합니다 [S17]. 두 어댑터의 출력은
    절대 결합해서는 안 됩니다. 시스템은 안정성을 위해 액추에이터 4대/4대/3대로 분기를 나누며, 각 분기마다 10 A 퓨즈(0287010.U)를
    직렬로 배치하여 과전류 발생 시 즉시 차단되도록 설계합니다 [S17, S28].


    #### 2. 센서 및 제어 회로

    OpenCR 제어기는 3.3 V 센서 전용 레일이 내장되어 있습니다 [S16]. FSR 402 센서는 10 kΩ 저항과 함께 전압 분압 회로를
    구성하여 ADC 신호를 생성합니다 [S29]. ADC 입력은 반드시 0~3.3 V 범위 내에 있어야 하므로 [S16], 반드시 3.3 V 레일에서
    전원을 공급받아야 합니다. 12 V 액추에이터 전원은 센서 회로와 전기적으로 분리되어야 합니다 [S16].


    #### 3. 비상 차단 시스템

    비상 정지 버튼(A22E-M-12-EMO)은 직접 고전류를 차단하는 대신, 3개의 EV200 DC 접촉기 코일을 제어하는 NC(Normal
    Closed) 회로에 연결됩니다 [S25, S26]. 비상 정지 시 접촉기가 즉시 개방되어 모든 액추에이터 분기로의 전력을 차단합니다 [S26].'
  worked_examples:
  - '예제 1: 분기별 전류 계산. 액추에이터 4대를 포함하는 분기의 최대 피크 전류는 4 × 2.3 A = 9.2 A입니다. 10 A 퓨즈는
    9.2 A를 정상 운전 범위 내에서 허용하며, 단락 발생 시 신속하게 보호를 수행합니다 [S14, S28].'
  - '예제 2: FSR 센서 전압 계산. FSR 저항을 $R_f$, 분압 저항을 $R_s = 10 \text{ k\Omega}$라 할 때, 3.3
    V 전압에서의 출력 전압 $V_{out} = 3.3 \times \frac{R_s}{R_f + R_s}$입니다. FSR 센서가 눌려 저항이
    감소하면 $V_{out}$이 증가하여 ADC 측정값이 상승합니다 [S15, S29].'
  lab:
    title: 로봇손 전원 분기 및 제어 회로 실습
    steps:
    - 각 12 V 어댑터 출력선에 ATO 인라인 퓨즈 홀더를 장착하고 10 A 퓨즈를 삽입한다 [S27, S28].
    - 비상 정지 버튼의 NC 접점을 통과하도록 EV200 접촉기 코일 제어 회로를 구성한다 [S25, S26].
    - 각 전원 분기를 접촉기 상단 부하 단자에 연결하고, 액추에이터 하네스를 분기별로 배분한다.
    - OpenCR의 3.3 V 센서 레일에 FSR 센서 5개를 10 kΩ 저항과 함께 분압 회로로 연결한다 [S16, S29].
    - 멀티미터로 각 분기 전압이 12 V임을 확인하고, 비상 정지 버튼 동작 시 전원이 차단되는지 확인한다 [S17, S25].
    safety:
    - 작업 시 반드시 보안경을 착용한다.
    - 12 V 전원 어댑터 출력 간에는 절대 쇼트(병렬 연결)를 유발하지 않도록 주의한다.
    - 배선 완료 전까지 전원 어댑터를 벽면 콘센트에 꽂지 않는다.
    - 비상 전원 차단 시스템이 정상 작동하는지 최초 연결 시 필수 확인한다.
    deliverables:
    - 최종 전원 및 제어 회로 배선도
    - 분기별 전압 측정 결과 및 비상 정지 동작 교정 기록
    - 퓨즈 및 접촉기 배선 사진
  assignment:
    title: 전력 시스템 보고서 작성
    deliverables:
    - 전력 예산 산출 표(액추에이터 개수 및 피크 전류 합산)
    - 비상 정지 회로 논리 기술서
    - FSR 센서 ADC 입력 설계 사양
    rubric:
    - 액추에이터 분기 배분이 4/4/3 규정을 준수하는가?
    - 3.3 V 센서 레일과 12 V 전원 레일이 전기적으로 분리되었는가?
    - 비상 정지 버튼이 접촉기 코일을 제어하는 NC 구조인가?
    - 모든 계산 수치와 부품 사양에 BOM 및 데이터시트 근거가 제시되었는가?
  quiz:
  - question: FSR 센서와 OpenCR을 연결할 때 권장되는 전원 레일은 무엇인가?
    choices:
    - 12 V 액추에이터 레일
    - 3.3 V 센서 레일
    - 5 V 전원
    - 9 V 배터리
    answer_index: 1
    explanation: OpenCR의 ADC 입력 보호 및 신호 정확도를 위해 3.3 V 센서 레일을 사용해야 합니다 [S16].
  - question: 2개의 독립적인 12 V 전원 어댑터 출력단을 연결해도 되는가?
    choices:
    - 네, 전류를 높이기 위해 병렬로 연결합니다.
    - 아니오, 절대 결합하거나 병렬로 연결해서는 안 됩니다.
    - 네, 퓨즈를 통과하면 가능합니다.
    - 아니오, 전압이 24 V가 되어 위험합니다.
    answer_index: 1
    explanation: 각 어댑터는 독립적인 분기로 사용하며, 출력단의 병렬 연결은 절대 금지되어 있습니다 [S17].
  - question: 비상 정지 버튼이 직접적으로 수행하는 기능은 무엇인가?
    choices:
    - 모든 액추에이터의 12 V 전력을 직접 차단합니다.
    - OpenCR의 전원을 차단합니다.
    - EV200 접촉기 코일의 제어 회로를 개방합니다.
    - 퓨즈를 강제로 태웁니다.
    answer_index: 2
    explanation: 비상 정지 버튼은 NC 회로를 통해 EV200 접촉기의 코일 전원을 차단하여 간접적으로 모터 전원을 차단합니다 [S25,
      S26].
  completion_criteria:
  - 각 액추에이터 분기가 10 A 퓨즈로 보호됨을 확인
  - 비상 정지 시스템이 3개 분기를 동시에 차단함을 검증
  - FSR 센서가 3.3 V 기반 분압 회로로 OpenCR에 정상 연결됨
  - 모든 배선이 BOM에 명시된 부품과 사양을 준수함
