- id: M5
  slug: electrical-safety
  phase_id: PH2
  title: 안전 배선 및 전원 시스템 구축
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 로봇손 전원 공급을 위한 독립적 12 V 분기 회로의 개념과 필요성을 이해한다.
  - 과전류 보호를 위한 ATOF 퓨즈의 사양과 동작 원리를 학습한다.
  - 센서 신호 취득을 위한 전압 분압 회로의 설계와 OpenCR ADC 연결법을 익힌다.
  - 안전한 배선 표준과 벤치 테스트를 위한 무전원 상태 확인 절차를 숙달한다.
  theory_markdown: '## 로봇 공학 전원 시스템 안전 설계


    다자유도 로봇손은 다수의 고성능 액추에이터를 사용하므로, 시스템 전체의 안정성을 위해 전원 분기 및 과전류 보호 설계가 필수적입니다. [S16]


    ### 1. 독립 분기 전원 공급(Branch Power Distribution)

    본 시스템은 3개의 독립적인 12 V 절연 전원 어댑터를 사용하여 액추에이터 그룹을 분할 공급합니다. [S16] 각 어댑터는 독립적인 분기
    회로를 형성하며, 양(+) 출력 단자를 물리적으로 결합하거나 통합하는 것은 절대 금지됩니다. 이를 통해 특정 그룹의 과부하가 전체 시스템의
    전원 차단으로 이어지는 위험을 최소화합니다. [S16]


    ### 2. 과전류 보호(Overcurrent Protection)

    분기 회로마다 10 A ATOF 퓨즈를 인라인 홀더를 통해 장착합니다. [S25, S26] ATOF 퓨즈는 정격 전류 이상 발생 시 내부 금속
    박판이 용단되어 회로를 보호합니다. 액추에이터 XM430-W350은 스톨 전류 2.3 A를 가지므로, 4대 액추에이터 분기 기준 피크 전류
    합계인 9.2 A를 고려하여 10 A 퓨즈를 선정하는 것이 적절합니다. [S3, S26]


    ### 3. 센서 인터페이스 설계

    손끝 힘 감지(FSR 402)는 가변 저항 특성을 이용합니다. [S7] OpenCR 제어 보드의 3.3 V 센서 레일을 사용하여 FSR과 10
    kΩ 저항으로 전압 분압 회로를 구성합니다. [S14, S27] 이 신호는 0~3.3 V 범위 내에서 ADC 해상도 12-bit를 통해 정밀하게
    디지털 데이터로 변환됩니다. [S14] 5 V 또는 12 V 액추에이터 전원을 센서 회로에 직접 연결하면 과전압으로 인한 OpenCR 내부
    ADC 단자 영구 손상이 발생하므로 주의해야 합니다. [S14]'
  worked_examples:
  - '예제 1: 퓨즈 선정 검증. 4대 액추에이터가 1개 분기에 연결된 경우, 스톨 전류 합계는 4 x 2.3 A = 9.2 A입니다. [S3]
    10 A ATOF 퓨즈는 9.2 A를 연속적으로 흘릴 수 있으며, 치명적인 단락 사고 시 전류 차단 기능을 수행하여 배선 과열을 방지합니다.
    [S26]'
  - '예제 2: FSR 전압 분압기 계산. FSR 저항이 1 kΩ일 때, 10 kΩ 저항과 3.3 V 전원을 사용하는 분압 회로의 출력 전압은
    V_out = 3.3 V * (10 kΩ / (1 kΩ + 10 kΩ)) = 3.0 V가 됩니다. 이는 OpenCR ADC 입력 범위(0~3.3
    V) 내에 안전하게 포함됩니다. [S7, S14, S27]'
  lab:
    title: 안전 배선 구축 및 전압 검증
    steps:
    - 각 어댑터 출력 단자에 10 A ATOF 퓨즈가 장착된 인라인 홀더를 직렬 연결합니다. [S25, S26]
    - 4대/4대/3대 액추에이터 그룹별로 분기 커넥터를 사용하여 하네스를 연결합니다. [S15]
    - FSR 전압 분압 회로를 OpenCR의 3.3 V 센서 레일에 연결합니다. [S14, S27]
    - 3개 전원 어댑터를 물리적으로 분리하고 멀티미터 DC 전압 모드로 각 분기의 잔류 전압이 1 V 미만임을 확인한다.
    - 각 전원 어댑터를 개별 연결하고 멀티미터의 DC 전압 모드로 각 분기의 출력 전압을 측정합니다.
    safety:
    - 실험 중 모든 정지는 3개 어댑터를 물리적으로 분리한 후 수행합니다.
    - 전원 인가 상태에서 절대 손을 가동 범위에 넣지 않습니다.
    - 무전원 상태 확인은 멀티미터의 DC 전압 모드에서 1 V 이하임을 측정하여 최종 확정합니다.
    - 도통 모드나 저항 모드는 무전원 확인 수단으로 절대 사용하지 않습니다.
    deliverables:
    - 분기별 배선 사진
    - 무전원 상태 및 12 V 정상 출력 측정 기록
    - 퓨즈 및 커넥터 체결 결합 확인서
  assignment:
    title: 전원 시스템 최적화 및 안전 보고서
    deliverables:
    - 시스템 분기별 배선도(Fuse, Connector, Actuator 할당 명시)
    - 과전류 보호 설계 계산서(액추에이터 개수별 전류 정격 근거 포함)
    - 센서 전압 분압 회로 설계 및 ADC 범위 안전성 검토 보고서
    rubric:
    - 독립 분기 전원 구성의 정확성(병렬 연결 절대 금지)
    - 퓨즈 정격 선정이 시스템 전류 요구사항을 만족하는지 여부
    - 센서 전압 분압 회로가 3.3 V rail을 준수하는지 여부
    - 전원 안전 수칙(물리적 단절, 계측 확인) 명시 여부
  quiz:
  - question: 분기 회로를 구성할 때 3개 전원 어댑터의 양(+) 단자를 병렬로 연결해야 합니까?
    choices:
    - 네, 전압 안정성을 높이기 위해 필수적입니다.
    - 아니오, 절대 병렬로 연결하지 않고 독립 분기로 유지해야 합니다.
    answer_index: 1
    explanation: 출력단의 병렬 연결은 시스템의 절연을 파괴하고 사고 확산 위험을 높이므로 절대 금지합니다.
  - question: FSR 힘 센서 분압 회로에 어떤 전원 레일을 사용해야 합니까?
    choices:
    - 12 V 액추에이터 전원
    - OpenCR 3.3 V 센서 전원
    - 5 V 전원
    answer_index: 1
    explanation: OpenCR의 ADC 단자 보호를 위해 반드시 3.3 V 센서 전원을 사용해야 합니다.
  - question: 시스템의 무전원 상태를 확인하는 올바른 방법은 무엇입니까?
    choices:
    - 멀티미터 저항 모드로 도통 확인
    - 멀티미터 DC 전압 모드로 1 V 이하 확인
    - 전원 플러그를 뽑지 않고 연결부 확인
    answer_index: 1
    explanation: 저항이나 도통 모드는 신뢰할 수 없으며, 반드시 3개 전원을 물리적으로 단절하고 DC 전압 모드로 1 V 이하임을 확인해야
      합니다.
  completion_criteria:
  - 모든 독립 전원 분기의 12 V 출력이 멀티미터로 검증됨
  - 퓨즈 장착 및 배선 연결이 도면과 일치함
  - 센서 전압이 OpenCR ADC 입력 범위(0~3.3 V) 내에 있음을 확인
  - 안전 배선 구축 및 테스트 보고서 제출 및 통과
  source_ids:
  - S6
  - S15
  - S25
  - S26
