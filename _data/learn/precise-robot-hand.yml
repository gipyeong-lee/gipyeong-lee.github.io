    - 전류 제한 기능을 갖춘 벤치 전원을 사용하여 액추에이터 과전류 보호
    - 비상 정지 스위치 테스트 후 하드웨어 전원 차단 검증
    - 끼임 방지를 위해 로봇손 구동 시 손가락 경로에 장애물 제거
    deliverables:
    - 액추에이터 통신 응답 기록
    - 전원 분기별 전압 측정값 보고서
    - 비상 차단 회로 동작 영상
  assignment:
    title: 로봇손 운동학 및 전력 설계 보고서
    deliverables:
    - 5지 로봇손의 관절 운동학 모델링(좌표계 정의)
    - 전원 분기당 액추에이터 배치도 및 퓨즈 계산서
    - 피크 전류 대비 전원 용량 안전율 계산식
    rubric:
    - 운동학 모델의 좌표계 설정 정확성
    - 독립 분기 전원 구성의 물리적 타당성(전류 수치 일치)
    - 비상 정지 시스템의 안전 설계 논리
  quiz:
  - question: 본 로봇손 설계에서 액추에이터 11개의 총 피크 전류를 감당하기 위해 필요한 최소 어댑터 수는?(단, 어댑터당 정격 전류
      11.5 A)
    choices:
    - 1개
    - 2개
    - 3개
    - 4개
    answer_index: 2
    explanation: 피크 전류 25.3 A를 수용하려면 11.5 A 어댑터 최소 3개(34.5 A)가 필요합니다.
  - question: DYNAMIXEL XM430-W350-T의 기준 동작 전압은 얼마입니까?
    choices:
    - 3.3 V
    - 5 V
    - 12 V
    - 24 V
    answer_index: 2
    explanation: 데이터시트에 따른 입력 전압은 12 V입니다 [S12].
  - question: 비상 정지 버튼을 고전류 DC 버스에 직접 연결하지 않고 접촉기(EV200)를 사용하는 주된 이유는 무엇입니까?
    choices:
    - 비용 절감
    - 고전류 제어 버튼의 크기 문제
    - 저전류 제어 신호와 고전류 부하의 전기적 분리
    - 통신 속도 향상
    answer_index: 2
    explanation: 비상 정지 버튼은 제어 회로(코일)만 담당하고, 고전류는 접촉기가 차단하여 안전성을 높입니다 [S23].
  completion_criteria:
  - 총 피크 전류 25.3 A를 3개의 전원 어댑터로 분기하는 설계도 제출
  - 운동학 모델 좌표계 설정 완료
  - 실습 결과 보고서 승인
  - 전류 제한 및 비상 정지 안전 검증 통과
  source_ids:
  - S1
- id: mod-2
  slug: hand-synergy-design
  phase_id: phase-1
  title: 로봇손 메커니즘 및 시너지 설계
  estimated_hours: 10.0
  prerequisites:
  - mod-1
  objectives:
  - 로봇손 메커니즘 설계의 핵심인 '시너지(Synergy)' 개념을 이해한다.
  - 언더액추에이티드(Underactuated) 시스템의 기구학적 이점을 분석한다.
  - 파지 성능 최적화를 위한 관절 구조 및 텐던 경로 설계 원리를 학습한다.
  theory_markdown: '### 로봇손 메커니즘과 시너지 설계


    복잡한 인간의 손을 로봇으로 구현할 때 가장 큰 도전 과제는 자유도(DoF)의 증가에 따른 제어 복잡성이다. 이를 해결하기 위한 핵심 전략이
    **시너지(Synergy)** 설계이다. 시너지는 여러 관절이 하나의 명령에 따라 정해진 패턴으로 움직이도록 기구적으로 결합하는 방식을 의미하며,
    제어 입력을 줄이면서도 효과적인 파지 성능을 가능하게 한다 [S2].


    #### 1. 언더액추에이티드(Underactuated) 시스템

    언더액추에이티드 핸드는 액추에이터의 수보다 제어 가능한 자유도가 많은 시스템을 말한다. 이는 각 손가락 마디마다 모터를 배치하지 않고도 텐던(Tendon)을
    이용한 연동 구조를 통해 물체의 형상에 맞게 손가락이 굽혀지도록 유도한다 [S2]. 이는 부품 수를 줄이고 무게를 최적화하는 데 필수적이다.


    #### 2. 기구적 결합의 핵심: 텐던 및 캡스턴

    로봇손의 구동력은 `bom-6`와 같은 고강도 섬유 텐던을 통해 손가락 마디로 전달된다. 이 텐던은 관절의 마찰을 줄이기 위해 `bom-8`과
    같은 무급유 베어링을 중심으로 캡스턴 경로를 따라 배치되어야 한다. 기구학적으로 손가락 마디들이 순차적으로 굽혀지는 ''시퀀셜 굽힘(Sequential
    flexion)''을 구현하기 위해서는 관절별 스프링 상수나 텐던의 당김 경로 설계를 통해 힘의 배분을 최적화해야 한다 [S2, S4].


    #### 3. 하드웨어 치수 정밀도

    구조물의 정밀도는 구동 성능과 직결된다. `bom-7` 필라멘트를 사용하여 프린팅된 프레임은 조립 시 `bom-9` 규격 나사와 인서트 너트를
    통해 치수 유격을 관리해야 한다. 부정확한 기구 설계는 텐던의 불필요한 마찰을 유발하여 액추에이터의 부하 전류(`bom-1` 기준 2.3A
    이하 유지 필요)를 상승시킨다.'
  worked_examples:
  - '예제 1: 1개의 액추에이터로 3개의 마디(손가락)를 구동하는 경우, 텐던이 첫 번째 마디에서 두 번째 마디로 전달되는 경로의 유효 반경과
    마찰 계수를 계산하여 텐던 장력의 손실률을 설계치 5% 이내로 제어하는 방법.'
  - '예제 2: FSR 센서(`bom-4`)를 손끝에 배치할 때, 센서 압력 데이터가 0.2N~20N 범위에서 선형성을 유지하도록 댐핑 패드의
    경도를 선택하고 기구적으로 센서에 가해지는 최대 압축력을 계산하는 설계 논리.'
  lab:
    title: 로봇손 링크 시뮬레이션 및 마찰 테스트
    steps:
    - 손가락 마디 3개를 3D 프린터(`bom-7`)로 출력하고 무급유 베어링(`bom-8`)을 장착한다.
    - 텐던(`bom-6`)을 캡스턴 경로에 연결하고 텐션 조정기를 통해 초기 장력을 설정한다.
    - 멀티미터를 전류 측정 모드로 설정하고 액추에이터(`bom-1`)를 구동하여 무부하 전류와 텐던 구동 시 전류를 측정한다.
    - 손가락 끝에 2N의 하중을 가하고 액추에이터의 위치 피드백 오차를 기록한다.
    safety:
    - 모든 회로 구성 시 저전압 벤치 전원 장치를 사용하여 전류 제한을 반드시 설정한다.
    - 3D 프린팅 후 가공 시 보안경을 착용하여 파편 비산을 방지한다.
    - 기구 구동 테스트 중 손가락 끼임 사고 방지를 위해 비상정지 푸시버튼(`bom-10`)을 상시 대기시킨다.
    deliverables:
    - 3D 설계 파일(CAD) 및 어셈블리 조립 도면
    - 마찰 테스트 전류 측정 데이터 시트
    - 시너지 설계를 반영한 기구 구조 분석서
  assignment:
    title: 손가락 시너지 구동 최적화 설계
    deliverables:
    - 최적화된 텐던 경로가 포함된 CAD 파일
    - 구동 시너지 분석 보고서 (최대 5페이지)
    rubric:
    - 기구적 결합(시너지)의 물리적 구현 가능성 (40%)
    - 설계 도면과 BOM 규격(`bom-1`~`bom-10`)의 일치성 (30%)
    - 마찰 손실을 고려한 기구 효율 계산의 정확성 (30%)
  quiz:
  - question: 언더액추에이티드(Underactuated) 로봇손 설계의 주요 이점은 무엇입니까?
    choices:
    - 액추에이터를 각 마디마다 배치하여 제어 복잡성을 극대화한다.
    - 기구적 결합을 통해 제어 복잡성을 줄이고 효율적인 파지를 수행한다.
    - 모든 관절을 독립적으로 제어하여 정밀도를 확보한다.
    - 전자적 제어만을 사용하여 물리적 연동을 제거한다.
    answer_index: 1
    explanation: 언더액추에이티드 핸드는 액추에이터 수보다 자유도가 많으며, 기구적 결합을 통해 적은 입력으로도 물체의 형상에 맞게 파지할
      수 있도록 합니다.
  - question: 텐던 경로 설계 시 가장 고려해야 할 사항은 무엇입니까?
    choices:
    - 텐던의 마찰을 최대화하여 관절 고정력을 높인다.
    - 마찰을 최소화하고 굽힘 유격을 관리하여 재현성을 높인다.
    - 텐던의 지름을 무조건 굵게 하여 장력을 증대시킨다.
    - 모든 마디를 독립적인 텐던으로 연결한다.
    answer_index: 1
    explanation: 정밀한 파지를 위해서는 마찰에 의한 에너지 손실을 줄이고, 기구적 유격을 관리하여 제어 피드백의 재현성을 높이는 것이
      필수적입니다.
  - question: 로봇손 제작 시 FDM 3D 프린팅 필라멘트 선택 기준 중 옳지 않은 것은?
    choices:
    - 강성 확보를 위해 탄소섬유가 첨가된 소재를 고려한다.
    - 조립 정밀도를 위해 치수 안정성이 검증된 소재를 사용한다.
    - 베어링 하우징 공차를 무시하고 출력하여 조립 시 깎아낸다.
    - BOM에 명시된 노즐 온도 및 베드 온도 사양을 준수한다.
    answer_index: 2
    explanation: 베어링 하우징 공차를 무시하고 출력하면 정밀한 유격 관리가 불가능하여 로봇손의 부드러운 움직임을 저해합니다.
  completion_criteria:
  - 모든 랩 보고서 및 과제물을 통과점 이상으로 제출할 것.
  - 시뮬레이션을 통해 시너지 구현의 논리적 근거를 제시할 것.
  - 안전 수칙을 준수하여 로봇손 구동 기구 조립을 완료할 것.
