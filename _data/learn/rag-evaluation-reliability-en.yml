- id: m2
  slug: corpus-curation
  phase_id: p1
  title: Evaluation Document Corpus Curation
  estimated_hours: 8.0
  prerequisites:
  - m1
  objectives:
  - Understand the importance of a fixed document corpus for RAG evaluation.
  - Learn the quality determination factors (accuracy, diversity, de-duplication)
    for evaluation document data.
  - Master strategies for building Document-Question-Answer pair (QA Pair) datasets
    for quantitative evaluation.
  - Learn training/evaluation split methods to prevent data leakage.
  theory_markdown: '## Corpus Curation for RAG Evaluation


    Large Language Models (LLMs) carry a risk of Hallucination when relying on knowledge
    within learned parameters. Retrieval-Augmented Generation (RAG) overcomes this
    limitation by allowing models to access external knowledge in real-time [S2].
    A **Fixed Evaluation Corpus** that is controlled and stable is essential to quantitatively
    evaluate the reliability of an effective RAG system.


    ### 1. Corpus Quality Determination Factors

    - **Factuality:** Information within documents must be up-to-date and factual.
    A corpus containing incorrect information leads to the generation of incorrect
    answers.

    - **Domain Suitability:** It must include topics and vocabulary similar to the
    actual service environment being evaluated.

    - **De-duplication:** If identical information is duplicated across multiple documents,
    it hinders retrieval result diversity and introduces bias into evaluation statistics.


    ### 2. Building QA Evaluation Datasets

    Evaluation is impossible with only a document corpus. You must build ''Document-Question-Answer''
    pairs to measure whether the retriever brings in relevant documents and whether
    the generator provides accurate answers based on them.

    - **Question Generation:** Automatically generate questions from documents using
    an LLM, or have them written directly by domain experts.

    - **Answer Definition:** Clearly specify the document segment (Chunk) that serves
    as the evidence for the answer.


    ### 3. Data Splitting and Integrity

    For evaluation set reliability, you must strictly split the data into a **Development
    Set** and a **Hold-out Test Set**. You must prevent ''data leakage'', where questions
    in the evaluation set are directly exposed because they are contained in the retrieval
    target documents.'
  worked_examples:
  - 'Example 1: Document Chunking strategy. How to write Python scripts that divide
    text into fixed sizes, such as by paragraph or semantic unit, so context is not
    broken.'
  - 'Example 2: Question-Answer data construction. Example of generating a JSON object
    in the format { ''question'': ''...'', ''ground_truth'': ''...'', ''context_chunk_id'':
    ''...'' }.'
  lab:
    title: Evaluation Corpus Construction Practice
    steps:
    - Obtain open-license text files (.txt) in the domain to be evaluated.
    - Write a script using Python to read text files and divide them into chunk units.
    - Assign a unique identifier (ID) to each chunk and record metadata (title, source).
    - Generate questions from the created chunks and compose 50 QA pairs by recording
      the Chunk ID that serves as the evidence for the answer.
    - Divide and save the entire corpus into development and test sets in an 8:2 ratio.
    safety:
    - Do not include documents containing personal information in the evaluation corpus.
    - Control costs by setting request limits when using external APIs.
    - Manage versions of data generated during work via Git to ensure reproducibility.
    deliverables:
    - Constructed document corpus file (JSONL format)
    - QA dataset containing questions and answers (JSON format)
    - Jupyter Notebook file containing corpus split records
  assignment:
    title: Domain-based RAG Dataset Completion
    deliverables:
    - QA dataset file with at least 100 questions
    - Dataset statistical analysis report (question length, chunk length, etc.)
    - Python code including the data splitting process
    rubric:
    - Completion of duplicate chunk removal in the corpus
    - Verification of data leakage between test and development sets
    - Accurate mapping of document segments (Chunk ID) serving as evidence for answers
  quiz:
  - question: What is the best way to prevent 'Data Leakage' in a RAG system?
    choices:
    - Generate the same questions for all documents.
    - Separate and manage the development set and the final evaluation test set.
    - Include the entire set of retrieval target documents in the training data.
    - Generate and manage the evaluation set anew each time.
    answer_index: 1
    explanation: If the evaluation set is exposed to retrieval target documents during
      the training (or development) process, fair evaluation is impossible, so the
      evaluation test set must be strictly separated.
  - question: Why is 'de-duplication' important during the corpus curation process?
    choices:
    - To increase the LLM's generation speed
    - To save disk storage space
    - To ensure retrieval result diversity and prevent statistical bias
    - To lower the semantic similarity of documents
    answer_index: 2
    explanation: Duplicated information causes the search engine to return biased
      retrieval results for specific information and can distort quantitative evaluation
      metrics.
  completion_criteria:
  - Evaluation document corpus (at least 100 chunks) construction complete
  - Verifiable QA dataset (at least 100 questions) generation complete
  - Confirmation of adherence to dataset splitting policy
  - Peer review or self-evaluation checklist completed for results
  source_ids:
  - S2
- id: m3
  slug: eval-set-generation
  phase_id: p1
  title: Question-Answer Evaluation Set Construction
  estimated_hours: 8.0
  prerequisites:
  - m2
  objectives:
  - Understand the necessity of a high-quality Question-Answer (QA) evaluation set
    for RAG system evaluation.
  - Grasp the principles of building evaluation sets utilizing Synthetic Data Generation
    techniques.
  - Master the logic for evaluating the factual consistency of model-generated answers
    through methodologies like TrueTeacher.
  - Design a process for generating datasets that are robust to domain changes while
    maintaining evaluation set quality.
  theory_markdown: '## Building Question-Answer (QA) Evaluation Sets for RAG


    To reliably measure the performance of a Retrieval-Augmented Generation (RAG)
    system, an elaborately designed evaluation set is essential. Relying solely on
    human-written questions and answers has limitations in terms of cost and scalability
    for large-scale evaluation.


    ### The Importance of Synthetic Data Generation

    According to the recent TrueTeacher methodology, synthetic training data can be
    generated by annotating various model-generated answers using an LLM [S5]. This
    approach has the following advantages:

    1. **Cost Efficiency**: Since it does not rely on human-written summaries or answers,
    large-scale dataset generation (e.g., 1.4M examples) is possible [S5].

    2. **Multilingualism and Scalability**: It is not limited to a specific language
    and shows robustness against Domain-shift [S5].

    3. **Factual Consistency Evaluation**: Small models trained using synthetic data
    can successfully distill the knowledge of large LLM teacher models and be used
    as efficient factual evaluation tools [S5].


    ### Dataset Construction Strategy

    When constructing an evaluation set, it must be composed not only of question-answer
    pairs but also to measure ''Does the search result contain the evidence needed
    to derive the correct answer?'' and ''Does the model refer to that evidence without
    distortion?''. To this end, when generating the dataset, the complexity of questions,
    relevance to search results, and factual consistency of answers must be systematically
    labeled or verified.'
  worked_examples:
  - 'Example 1: Extracting core passages from a document corpus. A pipeline to extract
    factually significant sentences in context from a given document using an LLM,
    and based on this, generate ''answerable questions'' and ''negative samples''.'
  - 'Example 2: Designing a factuality verification prompt. A process to refine ground
    truth for evaluation by instructing an LLM based on generated questions and retrieved
    documents: ''Answer the question based on the retrieved document, and judge whether
    the answer is factually consistent with True/False''.'
  lab:
    title: Synthetic Evaluation Set Generation Practice
    steps:
    - Load the prepared open-license document corpus and split it into text chunks.
    - Generate 100 or more unique question-answer pairs extractable from each chunk
      using the LLM API.
    - Simulate a search system for the generated questions to retrieve the top-k documents.
    - Construct an evaluation pipeline that judges factual consistency between retrieved
      documents and generated answers.
    - Save the result data in JSONL format, and manually review 30 samples to record
      data quality.
    safety:
    - When using external APIs in the evaluation set construction process, you must
      set an API cost cap (API Key Limit).
    - Filter using regular expressions to ensure that no sensitive information or
      personal information from the original document is included in the generated
      dataset.
    - Do not blindly trust model evaluation results alone, and always perform manual
      cross-checking on samples in parallel.
    deliverables:
    - A question-answer evaluation set (JSONL file) with 100 or more items
    - Jupyter Notebook containing dataset generation and verification code
    - Quality analysis report including human review records
  assignment:
    title: RAG Reliability Evaluation Set Regression Report
    deliverables:
    - A dashboard analyzing the statistical distribution of the generated evaluation
      set (question length, answer length, document reference frequency, etc.)
    - Results comparing two or more RAG configurations (e.g., search algorithm changes,
      model changes) using the same evaluation set
    - Error classification table (Hallucination, Contextual Irrelevance, etc.) and
      case analysis
    rubric:
    - Does the evaluation set evenly reflect the content of the entire document corpus?
    - Is the synthetic data generation pipeline written in a reproducible form?
    - Is the error type classification specific and supported by quantitative evidence?
    - Has the validity of automated evaluation metrics been proven through human review?
  quiz:
  - question: What distinguishes the TrueTeacher methodology from existing synthetic
      data generation methods?
    choices:
    - It relies entirely on human-written summaries.
    - It generates synthetic data by annotating various summaries generated by a model.
    - It uses only small models as teacher models for training.
    - It increases accuracy by writing datasets only manually.
    answer_index: 1
    explanation: TrueTeacher generates synthetic data by annotating various summaries
      generated by models using an LLM, without relying on human-written summaries
      [S5].
  - question: Why is factuality not determined solely by automated model evaluation
      when constructing a RAG evaluation set?
    choices:
    - Because automated model evaluation is too slow compared to humans.
    - Because automated model evaluation is not perfect and cannot completely filter
      out hallucinations.
    - Because human evaluation does not cost money.
    - Because models are not needed for factuality evaluation.
    answer_index: 1
    explanation: Automated evaluation tools are efficient but not perfect, so sample
      human review and source verification must always be performed in parallel for
      factual verification.
  completion_criteria:
  - Completed construction of a question-answer evaluation set with 100 or more items
  - Dataset quality analysis and submission of human review records
  - Implementation of notebook for RAG pipeline performance evaluation and creation
    of result report
  - Configuration of an evaluation package in a form that can be re-executed in a
    CI/CD environment
  source_ids:
  - S5
- id: m4
  slug: retrieval-metrics
  phase_id: p2
  title: Search Quality Metrics (Recall @k, MRR, nDCG)
  estimated_hours: 8.0
  prerequisites:
  - m3
  objectives:
  - Understand the importance of the retrieval step in a Retrieval-Augmented Generation
    (RAG) pipeline.
  - Learn the concepts of Recall @k, MRR, nDCG metrics and their significance in RAG
    system evaluation.
  - Analyze the impact of retrieved context relevance on subsequent answer generation
    quality.
  theory_markdown: '### The Importance of RAG Search Quality Evaluation


    RAG systems retrieve relevant information from external databases and pass it
    to an LLM to generate answers [S3]. Therefore, if the search stage fails to identify
    highly relevant and focused context, even a powerful LLM will struggle to generate
    accurate answers [S3]. Evaluating search quality is the first step toward improving
    the overall performance of the RAG architecture.


    ### Key Search Evaluation Metrics


    1. **Recall @k**: Measures whether the actual correct answer is included in the
    top k retrieved results. In other words, it is a metric to confirm whether the
    necessary information was captured by the search system.

    2. **MRR (Mean Reciprocal Rank)**: Measures the position of the correct answer
    (relevant document) for a user query within the search result list. The more the
    relevant document appears in the first position, the closer the MRR value is to
    1, resulting in a higher score.

    3. **nDCG (normalized Discounted Cumulative Gain)**: A metric that considers the
    ranking of search results; it assigns higher scores as more relevant documents
    are positioned toward the top. It evaluates the ''ranking accuracy'' of search
    results more precisely than simple inclusion (Recall).


    These metrics are essential for system improvement when ground truth is available,
    and frameworks like Ragas provide tools to quantitatively analyze these dimensions
    [S3, S4].'
  worked_examples:
  - 'If the system returned results in the order [DocB, DocA, DocC] for a query, and
    the relevant document is DocA? MRR calculation: Since DocA is at the 2 position,
    the Reciprocal Rank is 1/2 = 0.5.'
  - When k=3, if the correct answer document is included in the top 3 search results,
    Recall @3 = 1, and if not included, Recall @3 = 0.
  lab:
    title: Quantitative Measurement of Retrieval Quality Metrics
    steps:
    - Prepare 50 sample data using an evaluation set (questions, correct answer documents).
    - Run the retrieval module to receive the top k (k=3, 5, 10) documents for each
      question.
    - Implement the Recall @k, MRR, and nDCG functions directly in Python or use a
      library to calculate them.
    - Organize and visualize the metric results per question into a dataframe.
    safety:
    - Do not send datasets containing personal information or private documents to
      external APIs.
    - Set API cost limits during experiments and utilize caching to optimize the number
      of requests.
    deliverables:
    - A result dataframe CSV containing Recall @k, MRR, and nDCG values for each query.
    - Histogram and boxplot images showing metric distribution
  assignment:
    title: Retriever Performance Comparison Report
    deliverables:
    - Evaluation result report applying two retrieval configurations (e.g., Sparse
      vs Dense Retrieval)
    - Cause analysis (mis-retrieval type classification) for the top 5 questions with
      poor performance
    rubric:
    - Were the Recall @k, MRR, and nDCG metrics calculated accurately?
    - Was the difference in retrieval performance interpreted in a statistically significant
      way?
    - Were failure types classified systematically?
  quiz:
  - question: What is the impact of retrieval step quality on the generation step
      in a RAG system?
    choices:
    - Retrieval quality is irrelevant to generation quality.
    - Context with low relevance increases the risk of LLM hallucinations.
    - The retrieval step evaluates only the LLM's reasoning ability.
    - Generation quality always improves as search results increase.
    answer_index: 1
    explanation: If irrelevant information is passed in the retrieval step, the LLM
      may generate incorrect answers or trigger hallucinations based on it [S3].
  - question: When is the MRR metric highest?
    choices:
    - When the relevant document always appears last.
    - When the relevant document is always at the very top (1 position)
    - When there are no search results at all.
    - When the relevant document always appears in the middle.
    answer_index: 1
    explanation: Since MRR is the mean of the reciprocal ranks of the relevant documents,
      the value is at its maximum (1) when it is located at the 1 position.
  completion_criteria:
  - Completed the Recall @k, MRR, and nDCG calculation code and applied it to sample
    data.
  - Derived quantitative analysis results by comparing two retrieval strategies.
  - Classified retrieval failure types into at least 3 categories and included them
    in the report.
  source_ids:
  - S3
  - S4
- id: m5
  slug: generation-faithfulness
  phase_id: p2
  title: Faithfulness Evaluation
  estimated_hours: 8.0
  prerequisites:
  - m4
  objectives:
  - Understand the concept of Faithfulness and identify its importance in RAG systems.
  - Quantitatively evaluate whether generated answers are based on the retrieved context
    using the Ragas framework.
  - Analyze the risk of hallucination using automated evaluation metrics.
  theory_markdown: '## Faithfulness Evaluation


    The core of a Retrieval-Augmented Generation (RAG) system is that an LLM generates
    answers by utilizing information retrieved from an external knowledge database.
    Faithfulness is a metric indicating whether the generated answer faithfully reflects
    only the information described in the retrieved context [S3].


    ### 1. Why evaluate Faithfulness?

    LLMs tend to answer based on pre-trained knowledge, which can lead to generating
    information irrelevant to the retrieved context or distorting the context. This
    is called ''hallucination'', and faithfulness evaluation can measure this quantitatively
    [S4].


    ### 2. Evaluation Framework: Ragas

    Ragas proposes a framework where evaluation is possible without references (reference-free)
    even when user annotations are absent [S3]. The faithfulness evaluation process
    generally follows these steps:

    - **Statement Extraction from Answer**: Separate verifiable factual statements
    from the answer.

    - **Evidence Retrieval**: Confirm which part of the retrieved context each statement
    was derived from.

    - **Verification**: Judge whether the extracted statements match the context information.


    Ragas automates this process by using an LLM as the evaluator [S4].'
  worked_examples:
  - 'Example 1: If there is context ''Apples are rich in Vitamin C'' and answer ''Apples
    are rich in Vitamin C, so they are good for immunity'', ''good for immunity''
    is information not in the context, so the faithfulness score decreases.'
  - 'Example 2: If context ''The foundation date of our company is 2020 year 5 month
    1 day'' and answer ''The company was founded in 2020 year 5 month'' match information,
    it has a high faithfulness score.'
  lab:
    title: Measuring Generated Answer Faithfulness using Ragas
    steps:
    - Prepare an evaluation dataset (questions, retrieved context, generated answers).
    - Install the Ragas library and import the `Faithfulness` metric.
    - Convert the prepared dataset into Ragas's data structure.
    - Construct an LLM-based evaluator to calculate the faithfulness score of the
      dataset.
    - Sample answers with low scores and analyze the differences with the retrieved
      context through human review.
    safety:
    - Do not send datasets containing private documents or personal information to
      external LLM APIs.
    - Check API request rate limits and use caching to control costs.
    - Maintain security of sample data during human review.
    deliverables:
    - Report on the average faithfulness scores of the entire dataset
    - Dataset analyzing responses with low scores
    - Comparative analysis between automated evaluation results and human review results
  assignment:
    title: RAG Pipeline Reliability Evaluation Report
    deliverables:
    - Jupyter Notebook including faithfulness evaluation
    - Report analyzing error classification and frequency of hallucinations
    rubric:
    - Has the faithfulness metric been implemented correctly?
    - Were hallucination cases in generated responses classified accurately?
    - Has qualitative consistency between automated evaluation results and human review
      been secured?
  quiz:
  - question: What is faithfulness in a RAG system?
    choices:
    - The degree to which retrieved context is highly relevant to the question
    - The degree to which generated responses are based on the information in the
      retrieved context
    - The degree to which an LLM utilizes its pre-trained knowledge
    - The degree to which the response accurately matches the user's question
    answer_index: 1
    explanation: Faithfulness is a metric that evaluates whether a generated response
      relies on facts from externally retrieved context.
  - question: Which of the following is a correct characteristic of the Ragas framework?
    choices:
    - Evaluation is only possible if human annotations (ground truth) are provided.
    - It supports reference-free evaluation methods.
    - It only evaluates search efficiency and does not evaluate generation quality.
    - It does not use LLMs as evaluators and only uses statistical methods.
    answer_index: 1
    explanation: Ragas aims for a framework that can evaluate without references and
      actively utilizes LLMs as evaluators [S3, S4].
  completion_criteria:
  - Can quantitatively measure the faithfulness of generated responses using the Ragas
    library.
  - Can classify at least 3 types of hallucination occurrence patterns from evaluation
    results.
  - Can verify the consistency between the automated evaluation pipeline results and
    actual responses.
  source_ids:
  - S3
  - S4
- id: m6
  slug: citation-accuracy
  phase_id: p2
  title: Citation Accuracy and Source Tracking
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - Understand how faithfully a response reflects the content of retrieved documents
    in a RAG system.
  - Learn the definition and measurement methods of citation accuracy.
  - Quantitatively evaluate the faithfulness and answer relevance of responses using
    the Ragas framework.
  - Design a process to verify the traceability of sources in model responses.
  theory_markdown: '## RAG System Citation and Faithfulness Evaluation


    RAG (Retrieval Augmented Generation) systems utilize external knowledge bases
    to reduce the risk of LLM hallucinations, but a process to verify whether generated
    responses accurately cite retrieved documents is essential [S4].


    ### 1. Key Evaluation Metrics

    * **Faithfulness:** Measures whether generated responses are derived from the
    provided retrieved context. Every claim in the response must be based on retrieved
    documents; scores are lower if responses rely solely on external knowledge or
    the model''s pre-trained knowledge [S4].

    * **Answer Relevance:** Evaluates how directly relevant the response is to the
    given question. This is used to identify cases where a response deviates from
    the intent of the question, even if retrieved information is sufficient.


    ### 2. Citation Accuracy Verification Process

    Citation accuracy is the process of identifying which part of the retrieved context
    a specific sentence in the response cites and verifying if it aligns with facts
    in the original text. The automated evaluation framework, Ragas, provides metrics
    that can evaluate faithfulness even without reference data (ground truth) for
    this process [S4].


    ### 3. Failure Type Classification

    - **Citation Omission:** Facts in the response are present in retrieved documents,
    but no citation is indicated.

    - **False Citation:** Indicates as if it cited content not found in retrieved
    documents.

    - **Fact Distortion:** Citations are correctly indicated, but generated by misinterpreting
    the meaning of the original text.'
  worked_examples:
  - 'Example 1: Faithfulness score calculation. If the question ''What is A''s revenue
    in 2025?'' generates the response ''A''s revenue in 2025 was 100 billion.'', and
    the context document includes ''A recorded 100 billion in revenue in 2025.'',
    since all information in the response exists within the context, the faithfulness
    score is evaluated as 1.0 (maximum).'
  - 'Example 2: Citation accuracy error identification. If the question ''When was
    A founded?'' generates the response ''A was founded in 1990 (Reference: Document
    1).'', but Document 1 specifies ''A was founded in 1995'', this is classified
    as a ''Fact Distortion'' failure type and is judged as having low citation accuracy.'
  lab:
    title: Automated Response Faithfulness Evaluation Practice using Ragas
    steps:
    - Prepare a dataset of search results (Context) and generated responses (Answer)
      for the RAG system to be evaluated.
    - Install the Ragas framework and load the response dataset.
    - Calculate scores for each question-answer pair in the dataset using Ragas' `Faithfulness`
      metric.
    - Separately extract 30 responses with a faithfulness score of less than 0.7.
    - 'Human-review the extracted samples and tag them with corresponding failure
      types: ''Citation Omission'', ''False Citation'', or ''Fact Distortion''.'
    safety:
    - Ensure anonymization is completed in advance so that personal information or
      corporate secrets are not included in the document corpus used during the evaluation
      process.
    - Set cost limits when calling external APIs and fix seed values for reproducibility
      to prevent repetitive API costs.
    deliverables:
    - Jupyter Notebook file (.ipynb) containing evaluation results
    - Visualization chart of faithfulness score distribution
    - Failure type classification table including human review records
  assignment:
    title: RAG System Reliability Regression Evaluation Report Writing
    deliverables:
    - Statistical comparison results of faithfulness based on two or more RAG settings
      (e.g., changing search Top-k values)
    - Human review contrast table for 30 samples
    - Proposal for improvement to enhance system citation accuracy
    rubric:
    - Is the quantitative calculation method for evaluation metrics accurately specified?
    - Is the citation relationship between retrieved documents and generated responses
      logically traceable?
    - Is the failure type classification consistent with human review data and does
      it provide valid evidence?
  quiz:
  - question: Which explanation is correct regarding the 'Faithfulness' metric in
      the Ragas framework?
    choices:
    - Evaluates whether the response is relevant to the question.
    - Measures whether all information in the response exists within the provided
      context document.
    - Evaluates how grammatically accurate the response is.
    - Measures whether the response includes all information from an external knowledge
      base.
    answer_index: 1
    explanation: Faithfulness is a metric that measures whether the claims in a generated
      response are based on retrieved context.
  - question: Which case corresponds to the 'Fact Distortion' failure type when evaluating
      citation accuracy?
    choices:
    - Cases where content not in the retrieved document is included in the response
    - Cases where citation notation is omitted
    - Cases where the citation is correctly marked but the factual relationship of
      the original text is misinterpreted and described
    - Cases where the response is completely different from the intent of the question
    answer_index: 2
    explanation: Fact distortion refers to cases where, despite citing the source
      document, the information from the original text is summarized or transformed
      in an incorrect way.
  completion_criteria:
  - Completion of automated evaluation metric calculation via Jupyter Notebook
  - Submission of human review and failure type classification records for at least
    30 response samples
  - Writing a final report containing evaluation results and improvement plans
