- id: m7
  slug: automated-eval-framework
  phase_id: p2
  title: Applying Automated Evaluation Framework (Ragas)
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - Understand the core evaluation dimensions (retrieval and generation quality) of
    a RAG pipeline.
  - Learn how to automatically evaluate RAG performance without references (reference-free)
    using the Ragas framework.
  - Analyze and mitigate hallucination risks through quantitative metrics.
  theory_markdown: '## Challenges of RAG Evaluation and Ragas


    RAG systems consist of a retrieval module and an LLM-based generation module [S3,
    S4]. Evaluating this structure is a challenging task because it must consider
    how well the retrieval system identifies relevant context, how faithfully the
    LLM utilizes the provided context, and what the quality of the response is [S4].


    Traditional evaluation methods relied on manual creation and comparison of ground
    truth, but this is costly and time-consuming, making it unsuitable for fast iteration
    cycles [S3, S4].


    ### Ragas Framework

    Ragas (Retrieval Augmented Generation Assessment) is a framework that can evaluate
    RAG pipelines even without ground truth datasets [S3, S4]. Ragas automatically
    evaluates the following core dimensions:


    1. **Retrieval Quality:** Measures how relevant the retrieved context is to the
    question (Context Relevance) and whether it contains all necessary information
    (Context Recall).

    2. **Generation Quality:** Measures whether the generated response is based on
    the retrieved context (Faithfulness) and how relevant it is to the question (Answer
    Relevance).


    These metrics utilize LLMs as ''judges'' to enable evaluation without references,
    contributing to shortening the RAG development cycle [S3, S4].'
  worked_examples:
  - 'Case 1: Context Relevance calculation. Ragas uses an LLM to extract sentences
    actually needed to answer the question from the retrieved context, and calculates
    the score through the ratio of needed sentences to the total context.'
  - 'Case 2: Faithfulness evaluation. An LLM determines whether each claim in the
    generated response is supported by the retrieved context. The more unsupported
    claims there are, the higher the hallucination score becomes.'
  lab:
    title: Practice Quantitatively Evaluating RAG Performance using Ragas
    steps:
    - Prepare an evaluation dataset (question, retrieved context, generated response).
    - Install the `ragas` library in a Python environment.
    - Convert the evaluation dataset into a `ragas` Dataset object.
    - Call Ragas' `evaluate` function to calculate metrics such as Context Relevance
      and Faithfulness.
    - Visualize the result values and analyze queries with low scores.
    safety:
    - Ensure that personal information or private data is not included in the document
      corpus used for evaluation.
    - Actively utilize local models or caching during testing to prevent API usage
      costs.
    - Automated evaluation results are supplementary indicators of reliability; cross-validate
      the confirmation of actual model quality in parallel with sample human review.
    deliverables:
    - Evaluation result dataframe containing metric scores
    - Logs analyzing query types that received low scores
  assignment:
    title: RAG Pipeline Performance Comparison Report
    deliverables:
    - Ragas evaluation results for two RAG pipelines with different search settings
      (k-value, embedding model, etc.)
    - Performance analysis report between the two settings
    rubric:
    - Were Ragas metrics (Context Relevance, Faithfulness, etc.) implemented correctly?
    - Are evaluation results quantitatively compared and interpreted logically?
    - Were hallucination types classified for at least 3 cases and were improvement
      plans suggested?
  quiz:
  - question: What is the biggest characteristic of the Ragas framework?
    choices:
    - A human answer dataset is absolutely required
    - It can evaluate RAG pipelines without references (reference-free)
    - It only evaluates the search stage and does not evaluate the generation stage
    - At least 10 GPU(s) are absolutely required
    answer_index: 1
    explanation: Ragas is a framework that automatically evaluates search and generation
      quality using LLMs without an answer dataset [S3, S4].
  - question: What is the definition of the 'Faithfulness' metric measured by Ragas?
    choices:
    - How relevant retrieved context is to the question
    - Whether the question exists within the document corpus
    - Whether the generated response is based on retrieved context
    - How much the questioner trusts the LLM's response
    answer_index: 2
    explanation: Faithfulness is a metric that measures how faithfully a generated
      response is based on the provided retrieved context (hallucination prevention)
      [S4].
  completion_criteria:
  - Successfully calculate at least 4 metrics for at least 10 queries using the Ragas
    library.
  - The lab notebook is regularly committed to the Git repository.
  - The performance comparison report includes at least 3 error classification cases.
  source_ids:
  - S3
  - S4
- id: m8
  slug: error-analysis
  phase_id: p3
  title: Failure Type Classification and Error Analysis
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - Able to identify and classify failure types occurring in RAG systems.
  - Able to distinguish and analyze errors in the retrieval stage and the generation
    stage.
  - Able to link automated evaluation and human review results by utilizing Ragas
    framework metrics.
  - Able to derive RAG pipeline performance improvement plans based on error analysis
    data.
  theory_markdown: '## Overview of RAG System Error Analysis


    The Retrieval Augmented Generation (RAG) architecture consists of a retrieval
    module and an LLM-based generation module [S3]. When evaluating system performance,
    it is important to analyze these two stages separately. Errors are broadly divided
    into issues in the retrieval stage and issues in the generation stage.


    ### 1. Classification of Failure Types

    - **Retrieval Failure:** The case where irrelevant or unfocused context is retrieved
    [S3].

    - **Generation Failure:** The case where the LLM fails to faithfully utilize the
    provided context (Faithfulness) or generates answers irrelevant to the question
    [S3].


    ### 2. Complementing Automated Evaluation with Human Review

    Reference-free frameworks such as Ragas enable the evaluation of retrieval and
    generation quality without human annotations (ground truth) [S3]. However, automated
    evaluation metrics alone find it difficult to capture all subtle hallucinations
    or complex logical errors in the system. Therefore, high-priority failure samples
    should be extracted via quantitative automated metrics, and actual causes must
    be identified by necessarily conducting a Human Review alongside them.'
  worked_examples:
  - 'Example 1: When the retriever fetches a ''Model B specifications'' document for
    the question ''What is the release date of Model A?''. This is classified as a
    ''Retrieval Failure'', and embedding model adjustment or search query optimization
    can be the solution.'
  - 'Example 2: When the retriever fetches the correct document for X for the question
    ''Explain X'', but the LLM answers with information not in the document. This
    is classified as a ''Generation Failure (lack of Faithfulness)'', and the constraint
    ''Use only the provided context'' should be reinforced through prompt engineering.'
  lab:
    title: Failure Dataset Collection and Error Analysis
    steps:
    - Save the RAG system's answers and retrieved contexts for at least 50 questions.
    - Measure Context Precision and Faithfulness for each item using Ragas.
    - Extract the bottom 20% question-answer pairs with low metrics.
    - Create a classification table for the extracted samples as one of 'Retrieval
      Error', 'Generation Error', or 'Logic Error'.
    safety:
    - Never include personal information or private data in evaluation code.
    - Monitor API call frequency and costs used during the evaluation process to comply
      with the budget.
    - Prevent information leakage by performing tasks in a local environment during
      data analysis.
    deliverables:
    - Error analysis CSV file with completed classification
    - Jupyter Notebook with visualized retrieval and generation quality metrics
  assignment:
    title: Writing RAG Error Classification and Improvement Report
    deliverables:
    - 2-page report summarizing error analysis results
    - Proposal of response strategies per classified failure type (retrieval optimization
      or prompt improvement)
    rubric:
    - Accuracy and validity of failure type classification
    - Ability to analyze the correlation between quantitative metrics and human review
      results
    - Logical validity of improvement strategies
  quiz:
  - question: What is the failure that occurs when the retrieval module fetches irrelevant
      context in a RAG system?
    choices:
    - Generation failure
    - Retrieval failure
    - Database connection error
    - Authentication failure
    answer_index: 1
    explanation: Since the retrieval module plays the role of identifying documents
      suitable for the question, fetching irrelevant context is a failure in the retrieval
      stage [S3].
  - question: What is the biggest feature of the Ragas framework?
    choices:
    - It necessarily requires large-scale human annotated data.
    - Reference-free evaluation is possible.
    - Only LLM generation quality evaluation is possible.
    - It is applicable only to real-time streaming systems.
    answer_index: 1
    explanation: Ragas is a reference-free evaluation framework that can evaluate
      retrieval and generation quality without ground truth [S3].
  completion_criteria:
  - Submission of error classification table including failure types
  - Completion of quantitative analysis of retrieval and generation quality utilizing
    Ragas metrics
  - Drafting and review of a pipeline improvement proposal based on error analysis
  source_ids:
  - S3
- id: m9
  slug: human-review-validation
  phase_id: p3
  title: Sample Human Review and Comparison
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - Understand the gap between automated RAG evaluation metrics and actual factual
    accuracy.
  - Design a protocol for humans to review the Factual Consistency of model-generated
    answers.
  - Identify the limitations of LLM evaluation and analyze the significance of synthetic
    data techniques such as TrueTeacher [S5].
  - Learn how to systematically classify error types and manage reliability datasets.
  theory_markdown: '## Limitations of Automated Evaluation and the Necessity of Human
    Review


    When evaluating the quality of Retrieval Augmented Generation (RAG) systems, tools
    like Ragas provide quantitative metrics quickly, but there are limitations in
    perfectly capturing subtle factual errors in model-generated answers. In particular,
    it is difficult to distinguish whether an LLM is reasoning within the knowledge
    or relying on learned data to generate hallucinations in complex contexts.


    ### Factual Consistency Evaluation


    Recent research utilizes Natural Language Inference (NLI) models or Large Language
    Models (LLMs) to evaluate the factuality of summaries or answers. However, existing
    methods rely on human-written summary datasets, and differences can arise from
    the characteristics of results actually generated by models [S5]. Approaches like
    TrueTeacher attempt to overcome these limitations by using LLMs to generate synthetic
    factuality evaluation data from model-generated data [S5].


    ### Role of Human-in-the-Loop


    No matter how advanced an automated evaluation pipeline becomes, human review
    is essential for final reliability verification. Human review performs the following
    roles:

    1. **Verification of automated evaluation metrics:** Identifying cases where a
    specific answer was evaluated as ''relevant'' but is not actually factual.

    2. **Hallucination type classification:** Diagnosing the structural flaws of the
    system (Retrieval Error vs. Generation Model Error).

    3. **Calibration of regression test sets:** Continuously improving the quality
    of evaluation sets based on human-verified data.'
  worked_examples:
  - 'Example 1: When an automated evaluation metric (e.g., Faithfulness) results in
    a high score of 0.9, but human review shows the inclusion of content not in the
    retrieved document. Analysis: Classify as hallucination where the model used historical
    information contained in internal weights, not retrieved information, and record
    this in system error logs.'
  - 'Example 2: When designed so the system evaluates the factuality of answers itself
    using the TrueTeacher model. Some answers evaluated as ''true'' by the LLM are
    sampled and investigated by humans to measure the error rate (False Positive)
    of the LLM evaluator and specify this in the evaluation report [S5].'
  lab:
    title: Sample Human Review and Error Analysis Execution
    steps:
    - Derive Faithfulness scores for 100 answers through an automated evaluation pipeline
      (Ragas, etc.).
    - Create a review set by randomly extracting 10 of the lowest scores, 10 of the
      middle level, and 10 of the highest.
    - Manually record the presence of 'Retrieval Omission', 'Information Distortion',
      or 'Hallucination Generation' while comparing answers, retrieved documents (Context),
      and Ground Truth.
    - Perform correlation analysis by comparing recorded human judgment and automated
      evaluation scores.
    safety:
    - Always ensure that the dataset to be reviewed does not include actual personal
      information or sensitive private documents.
    - Safely store reviewed data in local storage and do not upload to unverified
      external APIs.
    deliverables:
    - Error classification sheet (CSV/Excel) containing at least 30 human review records
    - Summary report analyzing the consistency between automated metrics and human
      evaluation
  assignment:
    title: Writing RAG Reliability Analysis Report
    deliverables:
    - Failure type frequency table classified through human review
    - Analysis report on current system's main vulnerabilities (retrieval stage or
      generation stage)
    - Suggestions for future automated evaluation pipeline improvements
    rubric:
    - Were error types systematically classified?
    - Was the limitation of automated evaluation metrics logically described with
      concrete examples?
    - Was human review data appropriately utilized as a basis for reliability analysis?
  quiz:
  - question: What is the main reason why it is difficult to determine system reliability
      only with automated factuality evaluation metrics?
    choices:
    - Because automated evaluation metrics are very fast.
    - Because model-generated data has different characteristics from human-written
      data, and the automated evaluator itself may not capture all factual errors
      [S5].
    - Because human review data is always more accurate than automated evaluation
      metrics.
    - Because the scale of the dataset is small.
    answer_index: 1
    explanation: Existing summary-based evaluation datasets do not sufficiently reflect
      the complexity of actual results generated by models, and automated evaluation
      systems may fail to detect hallucinations in specific situations.
  - question: What is the difference between the TrueTeacher method and existing summary
      dataset usage methods?
    choices:
    - It relies only on summaries written by humans.
    - It generates synthetic data for factuality evaluation utilizing various summaries
      generated by models [S5].
    - It does not use NLI models.
    - Multilingual support is impossible.
    answer_index: 1
    explanation: TrueTeacher does not rely on summaries written by humans, but instead
      utilizes LLMs to synthetically annotate various data generated by models to
      generate learning data [S5].
  completion_criteria:
  - Human review logs for at least 30 data samples must be written.
  - A report including a comparative analysis between automated evaluation results
    and human review results must be submitted.
  - The current system's vulnerabilities must be clearly defined through error classification.
  source_ids:
  - S5
- id: m10
  slug: regression-report
  phase_id: p3
  title: Reproducible Regression Evaluation Reporting
  estimated_hours: 18.0
  prerequisites:
  - m9
  objectives:
  - Understand the framework for reproducible regression evaluation of RAG systems.
  - Quantitatively measure retrieval and generation quality using the Ragas framework.
  - Analyze the impact of model updates or search algorithm changes on system reliability
    through regression tests.
  - Learn comprehensive reporting methods through the harmony of human review and
    automated evaluation.
  theory_markdown: '### Key Dimensions of RAG System Evaluation

    Evaluating RAG architecture is a multifaceted task. The ability of the search
    system to identify highly relevant and focused context to questions, the ability
    of the LLM to faithfully generate answers using the identified context, and the
    quality of the final generated product itself are subjects of evaluation [S3,
    S4].


    ### Ragas Framework

    Ragas (Retrieval Augmented Generation Assessment) is a framework that can evaluate
    RAG pipelines without Ground Truth [S3]. Ragas provides a series of metrics to
    measure Retrieval quality, Generation quality, and Hallucination prevention capabilities
    [S3].


    ### Importance of Regression Evaluation

    Change Management is essential to maintain system reliability. Regression tests
    must be performed on existing evaluation datasets when introducing new embedding
    models, tuning search algorithms, or changing LLM settings. A regression evaluation
    report serves as data statistically proving whether the system''s improvements
    lead to actual reliability enhancement or induce new defects.'
  worked_examples:
  - 'Statistical comparison example: A notebook analysis case that executes the same
    100 question evaluation set for two RAG settings (existing vs. new embedding model)
    and compares the mean and standard deviation of Ragas metrics (Faithfulness, Answer
    Relevance) to verify significant performance improvement.'
  - 'Error type classification example: A method of sampling 30 cases where the system
    resulted in low ''Answer Relevance'' scores, manually classifying whether it is
    a failure in the retrieval stage (failure to retrieve relevant documents) or the
    generation stage (ignoring context), and recording this in pipeline logs.'
  lab:
    title: RAG Pipeline Regression Test Automation
    steps:
    - Prepare a final validation evaluation dataset (100 questions) in JSON format.
    - Define two different RAG pipeline settings (Version A, Version B).
    - Perform automated evaluation for each pipeline using the Ragas framework and
      save the results.
    - Use Pandas to visualize the distribution of metrics for both result sets and
      calculate statistical differences.
    - Compare the evidence context and model responses for the bottom 10% of cases
      where evaluation scores dropped sharply.
    safety:
    - Ensure that the evaluation dataset does not contain personal information or
      internal company confidential documents.
    - Set cost limits when calling external APIs, and use caching when testing in
      a local environment to prevent excessive or redundant requests.
    - Do not rely solely on model evaluation results; always accompany them with human
      review (Human-in-the-loop) for a sample of the data.
    deliverables:
    - Jupyter Notebook containing the results of the regression evaluation.
    - Visualization graph (boxplot or scatter plot) comparing performance between
      the two RAG configurations.
    - Final report including error type classification and human review records.
  assignment:
    title: Writing a RAG Reliability Improvement Report
    deliverables:
    - Technical report PDF containing system reliability metrics.
    - Configuration files for establishing a reproducible CI environment (e.g., pipeline.yaml).
    - Regression test script for the evaluation dataset.
    rubric:
    - Have retrieval and generation quality metrics been measured quantitatively?
    - Is the regression test methodology described and reproducible?
    - Is the analysis between automatic evaluation results and human review results
      appropriate?
    - Are the causes of performance changes and future improvement directions clearly
      presented?
  quiz:
  - question: What is the most significant feature of the Ragas framework?
    choices:
    - Evaluation is only possible if there is a human-written ground truth dataset.
    - It is a framework that can evaluate the quality of RAG pipelines even without
      reference data.
    - It only measures the quality of LLM outputs and does not measure retrieval quality.
    - The learning model must be retrained for evaluation.
    answer_index: 1
    explanation: Ragas is a framework designed to evaluate RAG pipelines without reference
      data [S3, S4].
  - question: What is the primary purpose of performing regression tests in a RAG
      system?
    choices:
    - To make the system design more beautiful.
    - To physically improve the server's response speed.
    - To analyze the impact of system changes (algorithms, data, etc.) on existing
      reliability and prevent defects.
    - To automatically collect user personal information.
    answer_index: 2
    explanation: The core of regression testing is to ensure reliability by verifying
      that system changes have not caused unintended performance degradation.
  - question: Which of the following is not a multidimensional aspect that should
      be considered when evaluating a RAG system?
    choices:
    - The ability of the retrieval system to identify relevant context.
    - The ability of the LLM to faithfully use the context.
    - The quality of the generation.
    - The security level of the user's social media account.
    answer_index: 3
    explanation: The main dimensions of RAG architecture evaluation are retrieval
      quality, generation faithfulness, and the quality of the generated output itself
      [S3, S4].
  completion_criteria:
  - Design a regression test pipeline and complete a comparative analysis of at least
    2 configurations using a dataset of at least 100 items.
  - Perform quantitative evaluation using Ragas metrics.
  - Submit records of verifying automatic evaluation results through human sample
    review.
  - Write and submit a technical report.
  source_ids:
  - S3
  - S4
