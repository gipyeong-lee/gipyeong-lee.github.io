- id: m5
  slug: generation-faithfulness
  phase_id: p2
  title: 依据忠实度评估
  estimated_hours: 8.0
  prerequisites:
  - m4
  objectives:
  - 理解依据忠实度(Faithfulness)的概念及其在RAG系统中的重要性。
  - 利用Ragas框架定量评估生成的答案是否基于检索到的上下文(Context)。
  - 利用自动化评估指标分析幻觉(Hallucination)风险。
  theory_markdown: '## 依据忠实度 (Faithfulness) 评估


    RAG(检索增强生成)系统的核心在于利用LLM检索外部知识数据库中的信息来生成答案。依据忠实度(Faithfulness)是衡量生成的答案是否忠实地反映了检索到的上下文中技术信息的指标
    [S3]。


    ### 1. 为什么评估依据忠实度？

    LLM倾向于基于预训练知识进行回答，可能会生成与检索到的上下文无关的信息或扭曲上下文。这被称为“幻觉(Hallucination)”，通过依据忠实度评估可以定量衡量这一点
    [S4]。


    ### 2. 评估框架：Ragas

    Ragas提出了一种在没有用户注释的情况下，无需参考(reference-free)即可进行评估的框架 [S3]。依据忠实度评估过程通常遵循以下步骤：

    - **从答案中提取陈述**：从答案中分离出可验证的事实性陈述。

    - **证据检索**：确认每个陈述是从检索到的上下文的哪部分推导出来的。

    - **验证**：判断提取出的陈述是否与上下文信息一致。


    Ragas使用LLM作为评估者来自动化这一过程 [S4]。'
  worked_examples:
  - 示例 1：如果上下文为“苹果富含维生素C”，答案为“苹果含有大量维生素C，对免疫力有好处”，由于“对免疫力有好处”在上下文中没有信息，因此依据忠实度得分会降低。
  - 示例 2：如果上下文为“本公司成立日期为 2020 年 5 月 1 日”，答案为“本公司成立于 2020 年 5 月”，信息一致，因此具有较高的依据忠实度得分。
  lab:
    title: 利用Ragas测量生成答案的依据忠实度
    steps:
    - 准备评估数据集（问题、检索到的上下文、生成的答案）。
    - 安装Ragas库并导入 `Faithfulness` 指标。
    - 将准备好的数据集转换为Ragas的数据结构。
    - 配置基于LLM的评估者，计算数据集的依据忠实度得分。
    - 对得分较低的答案进行抽样，并通过人工审查分析其与检索到的上下文之间的差异。
    safety:
    - 不要将包含私密文档或个人隐私的数据集发送给外部LLM API。
    - 确认API请求次数限制，并使用缓存(Cache)来控制成本。
    - 进行人工审查时，保持抽样数据的安全性。
    deliverables:
    - 整个数据集的平均忠实度得分报告
    - 针对低分回答的分析数据集
    - 自动评估结果与人工评估结果的对比分析
  assignment:
    title: RAG流水线可靠性评估报告
    deliverables:
    - 包含忠实度评估的Jupyter Notebook
    - 错误分类及幻觉发生频率分析报告
    rubric:
    - 是否正确实现了忠实度指标？
    - 是否准确分类了生成回答中的幻觉案例？
    - 自动评估结果与人工评估是否具有定性一致性？
  quiz:
  - question: 在RAG系统中，什么是忠实度（Faithfulness）？
    choices:
    - 检索到的上下文与问题的相关程度
    - 生成的回答基于检索到的上下文信息的程度
    - LLM利用预训练知识的程度
    - 回答与用户问题的精确匹配程度
    answer_index: 1
    explanation: 忠实度是评估生成的回答是否依赖于外部检索到的上下文事实的指标。
  - question: 下列关于Ragas框架的描述正确的是？
    choices:
    - 必须有基准答案（Ground Truth）才能进行评估。
    - 支持无引用（reference-free）的评估方式。
    - 仅评估检索效率，不评估生成质量。
    - 不使用LLM作为评估者，仅使用统计方法。
    answer_index: 1
    explanation: Ragas的目标是实现无需基准答案即可评估，并积极利用LLM作为评估者 [S3, S4]。
  completion_criteria:
  - 能够使用Ragas库定量测量生成回答的忠实度。
  - 能够从评估结果中分类至少 3 种幻觉发生类型。
  - 能够验证自动化评估流水线的结果与实际回答的一致性。
  source_ids:
  - S3
  - S4
- id: m6
  slug: citation-accuracy
  phase_id: p2
  title: 引用准确度及来源追踪
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - 理解RAG系统中的回答在多大程度上忠实于检索到的文档内容。
  - 学习引用（Citation）准确度的定义及其测量方式。
  - 利用Ragas框架定量评估回答的忠实度（Faithfulness）和回答相关性（Answer Relevance）。
  - 设计验证模型回答中来源可追踪性的流程。
  theory_markdown: '## RAG系统的引用及忠实度评估


    RAG（检索增强生成）系统利用外部知识库来降低LLM产生幻觉（Hallucination）的风险，但验证生成的回答是否准确引用了检索到的文档是一个必要过程
    [S4]。


    ### 1. 主要评估指标

    * **忠实度 (Faithfulness)：** 衡量生成的回答是否源于提供的检索上下文（Context）。回答中的所有主张都必须基于检索到的文档，如果仅凭外部知识或模型的预训练知识进行回答，得分会降低
    [S4]。

    * **回答相关性 (Answer Relevance)：** 评估回答与给定问题之间的直接相关程度。即使检索到的信息充足，该指标也能用于识别回答偏离问题意图的情况。


    ### 2. 引用准确度验证流程

    引用准确度是指识别回答中的特定句子引用了检索上下文的哪一部分，并确认其是否与原文档的事实一致的过程。自动化评估框架Ragas为这一过程提供了无需引用数据（Ground
    Truth）即可评估忠实度的指标 [S4]。


    ### 3. 失败类型分类

    - **漏引：** 回答的事实关系虽存在于检索文档中，但未进行引用标注。

    - **虚假引用：** 将检索文档中不存在的内容标记为引用。

    - **事实扭曲：** 虽然正确标记了引用，但因误解原意而导致生成内容有误。'
  worked_examples:
  - 示例 1：忠实度得分计算。针对问题“A公司的 2025 年销售额是多少？”，生成了回答“A公司的 2025 年销售额为 100 亿。”。如果背景文档中包含“A公司在
    2025 年记录了 100 亿销售额。”，由于回答的所有信息都存在于上下文中，因此该回答的忠实度得分被评为 1.0（最高分）。
  - 示例 2：引用准确度错误识别。针对问题“A公司的成立年份是？”，生成了回答“A公司成立于 1990 年（参考：文档 1）。”，但文档 1 中明确写着“A公司成立于
    1995 年”，这被归类为“事实扭曲”失败类型，并判定为引用准确度较低。
  lab:
    title: 使用Ragas进行回答忠实度自动化评估实践
    steps:
    - 准备待评估RAG系统的检索结果（Context）和生成的回答（Answer）数据集。
    - 安装Ragas框架并加载回答数据集。
    - 使用Ragas的 `Faithfulness` 指标为数据集中的每个问答对计算得分。
    - 单独提取出忠实度低于 0.7 的 30 条回答。
    - 对提取的样本进行人工审核，并标记对应的失败类型（“漏引”、“虚假引用”、“事实扭曲”）。
    safety:
    - 在评估过程中使用的文档语料库中，请预先进行去标识化处理，以防包含个人信息或企业机密。
    - 调用外部API时请设定费用上限，并固定随机种子（Seed）值以确保可重现性，防止重复产生API费用。
    deliverables:
    - 包含评估结果的Jupyter Notebook文件（.ipynb）
    - 忠实度得分分布可视化图表
    - 包含人工审核记录的失败类型分类表
  assignment:
    title: RAG系统可靠性回归评估报告撰写
    deliverables:
    - 基于两种以上RAG设置（例如更改检索Top-k值）的忠实度统计对比结果
    - 针对 30 条样本的人工审核对照表
    - 旨在提高系统引用准确度的改进方案建议书
    rubric:
    - 是否准确说明了评估指标的定量计算方法？
    - 检索文档与生成回答之间的引用关系是否逻辑可追溯？
    - 失败类型分类是否与人工审核数据一致并提出了合理的论据？
  quiz:
  - question: 下列关于Ragas框架“忠实度（Faithfulness）”指标的解释正确的是？
    choices:
    - 评估回答与问题是否相关。
    - 测量回答中的所有信息是否都存在于提供的上下文文档中。
    - 评估回答在语法上是否正确。
    - 测量回答是否包含了外部知识库的所有信息。
    answer_index: 1
    explanation: 忠实度是测量生成的回答中主张是否有据可依（基于检索到的上下文）的指标。
  - question: 在进行引用准确度评估时，哪种情况属于“事实扭曲”失败类型？
    choices:
    - 在回答中包含了检索文档中不存在的内容。
    - 遗漏了引用标记。
    - 虽然正确标记了引用，但在描述时误解了原意导致事实关系有误。
    - 回答与问题的意图完全不同。
    answer_index: 2
    explanation: 事实扭曲是指即使引用了源文档，但在概括或转换原文档信息时产生错误的情况。
  completion_criteria:
  - 通过Jupyter Notebook完成自动化评估指标计算。
  - 提交至少 30 条回答样本的人工审核及失败类型分类记录。
  - 编写包含评估结果及改进方案的最终报告。
  source_ids:
  - S4
- id: m7
  slug: automated-eval-framework
  phase_id: p2
  title: 自动化评估框架（Ragas）应用
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - 理解RAG流水线的核心评估维度（检索及生成质量）。
  - 学习如何使用Ragas框架进行无引用（reference-free）的RAG性能自动化评估。
  - 通过定量指标分析并缓解幻觉（hallucination）风险。
  theory_markdown: '## RAG评估的挑战与Ragas


    RAG系统由检索模块和基于LLM的生成模块组成 [S3, S4]。评估这种结构是一项挑战，因为必须同时考虑检索系统识别相关上下文（context）的准确度、LLM利用所提供上下文的忠实度（faithfulness）以及回答的质量
    [S4]。


    传统的评估方式依赖于人工编写答案并进行对比，但这不仅成本高昂，而且耗时，不适合快速迭代周期 [S3, S4]。


    ### Ragas框架

    Ragas (Retrieval Augmented Generation Assessment) 是一个无需基准数据集即可评估RAG流水线的框架 [S3,
    S4]。Ragas会自动评估以下核心维度：


    1. **检索质量 (Retrieval Quality)：** 衡量检索到的上下文与问题的相关性（Context Relevance），以及是否包含所有必要信息（Context
    Recall）。

    2. **生成质量 (Generation Quality)：** 衡量生成的回答是否基于检索到的上下文（Faithfulness），以及是否与问题相关（Answer
    Relevance）。


    这些指标通过利用LLM作为“评估者（judge）”，实现了无需基准答案即可进行评估，有助于缩短RAG的开发周期 [S3, S4]。'
  worked_examples:
  - 案例 1：Context Relevance 计算。Ragas利用LLM从检索到的上下文（Context）中提取回答问题实际所需的句子，并通过所需句子占整个上下文的比例来计算得分。
  - 案例 2：Faithfulness 评估。由LLM判断生成的回答中的每一项主张是否都能在检索到的上下文中找到支撑。无法得到支撑的主张越多，幻觉得分就越高。
  lab:
    title: 使用Ragas进行RAG性能定量评估实践
    steps:
    - 准备评估数据集（问题、检索到的上下文、生成的回答）。
    - 在Python环境中安装 `ragas` 库。
    - 将评估数据集转换为 `ragas` 的 Dataset 对象。
    - 调用 Ragas 的 `evaluate` 函数来计算上下文相关性（Context Relevance）、忠实度（Faithfulness）等指标。
    - 可视化结果并分析得分较低的查询。
    safety:
    - 确认评估使用的文档语料库中不包含个人信息或非公开数据。
    - 为防止API使用成本过高，在测试时请积极使用本地模型或缓存。
    - 自动化评估结果是衡量可靠性的辅助指标，实际模型质量的确定应结合人工样本审核进行交叉验证。
    deliverables:
    - 包含指标得分的评估结果数据框（Dataframe）
    - 低分查询类型的分析日志
  assignment:
    title: RAG流水线性能对比报告
    deliverables:
    - 两种不同检索设置（k值、嵌入模型等）的RAG流水线的Ragas评估结果
    - 两种设置间的性能差异分析报告
    rubric:
    - 是否正确实现了Ragas指标（Context Relevance, Faithfulness等）？
    - 评估结果是否进行了定量对比并包含了逻辑解释？
    - 是否分类了至少 3 种幻觉类型并提出了改进方案？
  quiz:
  - question: Ragas框架最大的特点是什么？
    choices:
    - 必须拥有人工标注的答案数据集
    - 可以在无引用（reference-free）的情况下评估RAG流水线
    - 仅评估检索阶段，不评估生成阶段
    - 必须至少拥有 10 个GPU
    answer_index: 1
    explanation: Ragas是一个无需基准答案数据集，利用LLM自动评估检索和生成质量的框架 [S3, S4]。
  - question: Ragas中衡量的“Faithfulness”指标定义是什么？
    choices:
    - 检索到的上下文与问题有多大关联
    - 问题是否存在于文档语料库中
    - 生成的回答是否基于检索到的上下文
    - 提问者对LLM回答的信任程度
    answer_index: 2
    explanation: Faithfulness是衡量生成的回答在多大程度上基于提供的检索上下文（防止幻觉）的指标 [S4]。
  completion_criteria:
  - 使用 Ragas 库成功计算至少 10 个查询的 4 种以上指标
  - 定期将实操笔记本提交至 Git 仓库
  - 性能比较报告中至少包含 3 个错误分类案例
