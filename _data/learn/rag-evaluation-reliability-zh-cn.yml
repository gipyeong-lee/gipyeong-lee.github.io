modules:
- id: m1
  slug: intro-rag-architecture
  phase_id: p1
  title: 理解 RAG 架构
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - 理解 RAG (Retrieval-Augmented Generation) 架构的核心组件。
  - 识别大语言模型 (LLM) 的知识局限性以及检索增强的必要性。
  - 能够解释检索-生成流水线的结构流程。
  theory_markdown: '## RAG (Retrieval-Augmented Generation) 架构概述


    最新的自然语言处理 (NLP) 和深度学习模型通过学习海量文本数据展现出卓越性能，但在处理模型训练时未包含的最新信息或特定领域的非公开数据时，存在幻觉 (hallucination)
    或无法获知信息的局限性 [S1]。


    ### 通过检索克服 LLM 的局限性

    RAG 不是让模型在参数 (parameter) 内部死记硬背所有知识，而是在“适当时机 (just-in-time)”检索与问题相关的外部可靠文档，并将其提供给生成阶段作为输入的方案
    [S2]。


    ### 核心组件

    1. **检索器 (Retriever)**: 接收用户查询 (query)，从向量数据库等中识别相关性高的文档片段 (chunk)。

    2. **增强 (Augmentation)**: 组合检索到的文档与原始问题，构成传递给 LLM 的提示词。

    3. **生成器 (Generator)**: 基于增强后的信息生成事实依据的回答。


    这种结构有助于使模型的知识保持最新，并追踪生成答案的依据，从而在确保可靠性方面做出贡献。'
  worked_examples:
  - '案例 1: 传统 LLM 方式 - 若提问“告诉我今天的新闻”，因无法获知训练数据之后发生的事件，存在生成错误信息的风险。'
  - '案例 2: RAG 方式 - 当提问“告诉我今天的新闻”时，1) 检索器 (Retriever) 通过外部搜索引擎或实时新闻 API 收集相关报道，2)
    将其作为上下文 (context) 包含在内传递给 LLM，从而生成准确的最新信息回答。'
  lab:
    title: RAG 架构流程可视化与分析
    steps:
    - 打开 Jupyter Notebook，对 RAG 基本流水线的 3 阶段（输入、检索、生成）结构进行绘图。
    - 从开源授权文档语料库中提取 5 个短文本，制作数据集样本。
    - 编写简单的关键词匹配检索器 (Retriever) 函数，实现根据问题返回对应文档。
    - 通过代码编写将检索到的文档注入提示词模板的增强阶段。
    safety:
    - 绝不使用实际个人信息或机密文档作为语料库数据。
    - 使用 API 时确认调用次数限制 (Rate Limit)，并在测试代码中设置种子 (seed) 值以确保可重现性。
    deliverables:
    - RAG 架构图 (包含在 Notebook 单元中)
    - 简单的基于关键词的检索器实现代码
    - 文档注入型提示词生成结果
  assignment:
    title: 基于 RAG 的信息检索流水线分析报告
    deliverables:
    - 解释所实现 RAG 流水线工作原理的 Notebook
    - 检索器在判断文档相关性时可能产生的潜在失败案例 3 种技术描述
    rubric:
    - RAG 的 3 阶段（检索、增强、生成）是否被准确区分并解释？
    - 对于检索阶段可能检索到无关文档的分析是否合理？
    - 是否遵守非公开数据安全指南进行实现？
  quiz:
  - question: 与 LLM 训练方式相比，RAG 的主要优点是什么？
    choices:
    - 可以减小 LLM 的参数规模。
    - 可以让模型的知识保持最新并提出依据。
    - 可以加速模型的训练速度。
    - 可以生成 100% 事实正确的回答。
    answer_index: 1
    explanation: 由于 RAG 引用外部文档，因此可以反映最新信息，并且可以在文档中找到生成回答的依据，从而具有高可靠性。
  - question: 下列哪项是检索器 (Retriever) 的正确角色？
    choices:
    - 负责生成回答。
    - 负责重新训练学习数据。
    - 负责检索与问题相关的外部文档片段。
    - 负责管理用户界面。
    answer_index: 2
    explanation: 检索器的作用是从外部数据源中查找与用户的问题语义相似或相关性高的文档。
  completion_criteria:
  - 能够解释 RAG 架构的组件。
  - 确认实操的 RAG 流水线代码正常运行，能够检索并增强相关文档。
  - 在分析报告中描述 RAG 流水线的局限性与改进方向。
  source_ids:
  - S1
  - S2
- id: m2
  slug: corpus-curation
  phase_id: p1
  title: 评估用文档语料库策展
  estimated_hours: 8.0
  prerequisites:
  - m1
  objectives:
  - 理解用于 RAG 评估的固定文档语料库的重要性。
  - 学习评估用文档数据的质量决定因素（准确性、多样性、去重）。
  - 掌握用于定量评估的“文档-问题-正解”对 (QA Pair) 数据集的构建策略。
  - 学习防止数据泄露 (Data Leakage) 的训练/评估集划分方法。
  theory_markdown: '## 用于 RAG 评估的语料库策展


    大语言模型 (LLM) 在依赖已学习参数内的知识时，存在幻觉 (Hallucination) 风险。检索增强生成 (RAG) 通过让模型实时访问外部知识来克服这一局限
    [S2]。为了定量评估高效 RAG 系统的可靠性，必须拥有固定且可控的评估用文档语料库 (Fixed Evaluation Corpus)。


    ### 1. 语料库质量决定因素

    - **准确性 (Factuality):** 文档内的信息必须是最新且属实的。包含错误信息的语料库会导致生成错误的回答。

    - **领域契合度:** 必须包含与实际评估的服务环境相似的主题及词汇。

    - **去重 (De-duplication):** 若相同信息在多个文档中重复，会阻碍检索结果的多样性，并对评估统计造成偏差。


    ### 2. QA 评估数据集构建

    仅凭文档语料库无法进行评估。必须构建“文档-问题-正解”对，以测量检索器是否带来了相关文档，以及生成器是否基于此做出了准确回答。

    - **问题生成:** 使用 LLM 自动从文档中生成问题，或由领域专家直接编写。

    - **正解定义:** 必须明确注明作为答案依据的文档区间 (Chunk)。


    ### 3. 数据划分与完整性

    为确保评估集的可靠性，必须严格划分**开发集 (Development Set)**与**最终评估集 (Hold-out Test Set)**。必须防止评估集中包含的问题直接包含在检索目标文档中并被暴露的“数据泄露”现象。'
  worked_examples:
  - '示例 1: 文档分块 (Chunking) 策略。编写 Python 脚本，在将文本划分为固定大小时，以段落或语义单位为基础进行划分，以避免上下文断裂。'
  - '示例 2: 问题-回答数据构成。创建格式为 { ''question'': ''...'', ''ground_truth'': ''...'', ''context_chunk_id'':
    ''...'' } 的 JSON 对象示例。'
  lab:
    title: 评估用语料库构建实操
    steps:
    - 获取用于评估的目标领域的开源授权文本文件 (.txt)。
    - 使用 Python 编写读取文本文件并以分块单位进行划分的脚本。
    - 为每个分块赋予唯一标识符 (ID) 并记录元数据（标题、来源）。
    - 在编写的分块中生成问题，并记录作为答案依据的分块 ID，从而构成 50 个 QA 对。
    - 将整个语料库以 8:2 的比例划分为开发集与测试集并保存。
    safety:
    - 评估语料库中不得包含个人信息文档。
    - 使用外部 API 时设置请求次数上限以控制成本。
    - 工作过程中生成的数据通过 Git 进行版本管理，以确保可重现性。
    deliverables:
    - 构建的文档语料库文件 (JSONL 格式)
    - 包含问题与正解的 QA 数据集 (JSON 格式)
    - 包含语料库划分记录的 Jupyter Notebook 文件
  assignment:
    title: 完成基于领域的 RAG 数据集
    deliverables:
    - 至少包含 100 道题的 QA 数据集文件
    - 数据集统计分析报告（问题长度、分块长度等）
    - 包含数据划分过程的 Python 代码
    rubric:
    - 语料库内的重复分块是否已剔除
    - 是否确认测试集与开发集之间不存在数据泄露
    - 答案依据的文档区间 (Chunk ID) 是否映射准确
  quiz:
  - question: 在 RAG 系统中防止“数据泄露 (Data Leakage)”的最佳方法是什么？
    choices:
    - 针对所有文档生成相同的问题。
    - 将开发集与最终评估用的测试集分离管理。
    - 将整个检索目标文档包含在训练数据中。
    - 每次都重新生成并管理评估集。
    answer_index: 1
    explanation: 如果评估集在训练（或开发）过程中暴露在检索目标文档中，则无法进行公平评估，因此必须严格分离评估用测试集。
  - question: 在语料库策展过程中，“去重”为何很重要？
    choices:
    - 为了提高 LLM 的生成速度。
    - 为了节省磁盘存储空间。
    - 为了确保检索结果的多样性并防止统计偏差。
    - 为了降低文档的语义相似度。
    answer_index: 2
    explanation: 重复的信息会使搜索引擎返回有偏向的检索结果，并可能扭曲定量评估指标。
  completion_criteria:
  - 完成评估用文档语料库（至少 100 个分块以上）的构建
  - 完成可验证 QA 数据集（至少 100 道题）的生成
  - 确认遵守数据集划分政策
  - 完成针对结果物的同行评审或自我评估检查表编写
  source_ids:
  - S2
- id: m3
  slug: eval-set-generation
  phase_id: p1
  title: 构建问答评估集
  estimated_hours: 8.0
  prerequisites:
  - m2
  objectives:
  - 理解构建用于评估 RAG 系统的高质量问答 (QA) 评估集的重要性。
  - 掌握利用合成数据生成技术 (Synthetic Data Generation) 构建评估集的原理。
  - 通过 TrueTeacher 等方法论，掌握评估模型生成回答事实一致性的逻辑。
  - 设计在保持评估集质量的同时，能够生成对领域变化具有稳健性的数据集的流程。
  theory_markdown: '## 构建用于RAG评估的问答(QA)评估集


    为了可靠地衡量检索增强生成(RAG)系统的性能，精心设计的评估集是必不可少的。仅仅依赖人工编写的问题和答案在进行大规模评估时，在成本和可扩展性方面存在局限性。


    ### 合成数据生成的意义

    根据最新的TrueTeacher方法论，可以利用大语言模型(LLM)对模型生成的各种答案进行注释，从而生成合成训练数据 [S5]。该方法具有以下优点：

    1. **成本效益**：不依赖人工直接编写的摘要或答案，因此能够生成大规模数据集（例如：1.4M个示例） [S5]。

    2. **多语言与可扩展性**：不局限于特定语言，并且在领域迁移(Domain-shift)方面也表现出稳健性 [S5]。

    3. **事实一致性评估**：通过合成数据训练的小型模型，可以成功提炼(Distillation)大型LLM教师模型的知识，并作为高效的事实性评估工具使用
    [S5]。


    ### 数据集构建策略

    在构建评估集时，不仅要创建问答对，还必须进行结构化设计，以便衡量“检索结果是否包含得出正确答案所需的依据？”以及“模型是否在没有扭曲的情况下引用了相关依据？”。为此，在生成数据集时，需要对问题的复杂度、与检索结果的相关性以及答案的事实一致性进行系统的标注或验证。'
  worked_examples:
  - 示例 1：从文档语料库中提取关键段落。使用LLM从给定文档中提取上下文中重要的事实性句子，并以此为基础构建包含“可回答问题”和“错误问题(Negative
    Sample)”的流水线。
  - 示例 2：事实性验证提示词设计。基于生成的问题和检索到的文档，指示LLM“根据检索到的文档回答问题，并判断答案在事实层面上是否一致（True/False）”，从而细化评估用的标准答案(Ground
    Truth)的过程。
  lab:
    title: 合成评估集生成实践
    steps:
    - 加载准备好的开源文档语料库，并将其划分为文本块。
    - 使用LLM API为每个文本块生成 100 个以上的唯一问答对。
    - 针对生成的问题模拟检索系统，搜索并返回前k个文档。
    - 构建评估流水线，以判断检索到的文档与生成的答案之间的事实一致性。
    - 将结果数据保存为JSONL格式，并手动检查 30 个样本以记录数据质量。
    safety:
    - 在评估集构建过程中使用外部API时，必须设置费用上限(API Key Limit)。
    - 使用正则表达式过滤生成的数据集，确保其中不包含原始文档的敏感信息或个人隐私。
    - 不可盲目依赖模型评估结果，必须结合人工抽样核对。
    deliverables:
    - 已构建 100 条目以上的问答评估集(JSONL文件)
    - 包含数据集生成和验证代码的Jupyter Notebook
    - 包含人工审查记录的质量分析报告
  assignment:
    title: RAG可靠性评估集回归报告
    deliverables:
    - 分析评估集统计分布（问题长度、答案长度、文档引用频率等）的仪表板
    - 使用相同评估集比较两种以上RAG设置（例如：更改检索算法、更改模型）的结果
    - 错误分类表（幻觉、上下文不相关等）编写及案例分析
    rubric:
    - 评估集是否均匀反映了整个文档语料库的内容？
    - 合成数据生成流水线是否以可重现的形式编写？
    - 错误类型分类是否具体且具有定量依据？
    - 是否通过人工审查验证了自动评估指标的有效性？
  quiz:
  - question: TrueTeacher方法论与传统的合成数据生成方式有何区别？
    choices:
    - 完全依赖人工编写的摘要。
    - 通过注释模型生成的各种摘要来生成合成数据。
    - 仅使用小型模型作为学习用的教师模型。
    - 仅通过手工编写数据集来提高准确性。
    answer_index: 1
    explanation: TrueTeacher不依赖人工编写的摘要，而是利用LLM通过注释模型生成的各种摘要来生成合成数据 [S5]。
  - question: 在构建RAG评估集时，为什么不能仅通过模型自动评估来确定事实性？
    choices:
    - 因为模型自动评估比人类慢得多。
    - 因为模型自动评估并不完美，无法完全过滤掉幻觉(Hallucination)。
    - 因为人工评估不需要成本。
    - 因为事实性评估不需要模型。
    answer_index: 1
    explanation: 自动化评估工具虽然高效但并不完美，因此为了进行事实性验证，必须结合人工抽样审查和源文档核对。
  completion_criteria:
  - 完成 100 条目以上的问答评估集构建
  - 提交数据集质量分析及人工审查记录
  - 实现用于RAG流水线性能评估的Notebook并编写结果报告
  - 在CI/CD环境中配置可重执行形式的评估包
  source_ids:
  - S5
- id: m4
  slug: retrieval-metrics
  phase_id: p2
  title: 检索质量指标 (Recall, MRR, nDCG)
  estimated_hours: 8.0
  prerequisites:
  - m3
  objectives:
  - 了解检索增强生成(RAG)流水线中检索阶段的重要性。
  - 学习Recall, MRR, nDCG指标的概念及其在RAG系统评估中的意义。
  - 分析检索到的上下文相关性对后续答案生成质量的影响。
  theory_markdown: '### RAG检索质量评估的重要性


    RAG系统通过从外部数据库检索相关信息，并将其传递给LLM来生成答案 [S3]。因此，如果在检索阶段无法识别出相关性高且集中的上下文，即使是再强大的LLM也难以生成准确的答案
    [S3]。评估检索质量是改善RAG架构整体性能的第一步。


    ### 主要检索评估指标


    1. **Recall (召回率)**：衡量实际正确答案是否包含在检索到的前k个结果中。即确认所需信息是否被检索系统捕捉到的指标。

    2. **MRR (平均倒数排名)**：衡量用户问题的正确答案（相关文档）位于检索结果列表中的第几个位置。相关文档出现的位置越靠前，MRR值越接近 1，得分越高。

    3. **nDCG (归一化折损累计增益)**：考虑检索结果顺序的指标，相关性高的文档位于顶部时赋予更高的分数。比起单纯的包含与否(Recall)，它能更精确地评估检索结果的“排序准确性”。


    在有参考数据(Ground Truth)的情况下，这些指标对于系统改进至关重要，而像Ragas这样的框架提供了可以定量分析这些维度的工具 [S3, S4]。'
  worked_examples:
  - 若系统对问题的返回顺序为 [DocB, DocA, DocC]，且正确答案相关文档为DocA？MRR计算：DocA是第 2 个，因此倒数排名(Reciprocal
    Rank)为 1/2 = 0.5。
  - 当k= 3 时，如果前 3 个检索结果中包含正确文档，则 Recall @ 3 = 1；如果不包含，则 Recall @ 3 = 0。
  lab:
