  objectives:
  - 能够识别并分类 RAG 系统中出现的故障类型。
  - 能够区分并分析检索（Retrieval）阶段与生成（Generation）阶段的错误。
  - 利用 Ragas 框架的指标将自动化评估与人工审核结果相关联。
  - 基于错误分析数据提出 RAG 流水线性能改进方案。
  theory_markdown: '## RAG 系统错误分析概述


    RAG（检索增强生成）架构由检索模块和基于 LLM 的生成模块组成 [S3]。在评估系统性能时，将这两个阶段分开分析至关重要。错误主要分为检索阶段的问题和生成阶段的问题。


    ### 1. 故障类型分类

    - **检索失败 (Retrieval Failure):** 检索到不相关或重点不明确的上下文（context）[S3]。

    - **生成失败 (Generation Failure):** LLM 未能忠实地使用所提供的上下文（Faithfulness），或生成了与问题无关的回答
    [S3]。


    ### 2. 自动化评估与人工审核的互补

    Ragas 等无需参考（Reference-free）的框架可以在没有人工标注（ground truth）的情况下评估检索和生成质量 [S3]。然而，仅凭自动化评估指标很难捕捉到系统微妙的幻觉（hallucination）或复杂的逻辑错误。因此，应通过定量自动指标提取高优先级的故障样本，并必须并行进行人工审核（Human
    Review）以查明实际原因。'
  worked_examples:
  - 示例 1：针对问题“模型 A 的发布日期是？”，检索器检索到了“模型 B 的规格”文档。这被归类为“检索失败”，可以通过调整嵌入模型或优化检索查询来解决。
  - 示例 2：针对问题“解释 X”，检索器检索到了关于 X 的准确文档，但 LLM 的回答包含了文档中没有的信息。这被归类为“生成失败（忠实度不足）”，应通过提示工程（prompt
    engineering）加强“仅使用所提供的上下文”这一约束。
  lab:
    title: 故障数据集收集与错误分析
    steps:
    - 针对至少 50 个问题，保存 RAG 系统的回答及检索到的上下文（context）。
    - 使用 Ragas 测量每个项目的上下文精确度（Context Precision）和生成忠实度（Faithfulness）。
    - 提取指标得分最低的后 20% 的问题-回答对。
    - 针对提取的样本，填写包含“检索错误”、“生成错误”、“逻辑错误”的分类表。
    safety:
    - 严禁在评估代码中包含个人信息或非公开数据。
    - 监控评估过程中使用的 API 调用次数和成本，以确保符合预算。
    - 数据分析时在本地环境中进行工作，以防止信息泄露。
    deliverables:
    - 已完成分类的错误分析 CSV 文件
    - 可视化检索和生成质量指标的 Jupyter Notebook
  assignment:
    title: RAG 错误分类及改进报告撰写
    deliverables:
    - 汇总错误分析结果的 2 页报告
    - 针对分类出的不同故障类型的应对策略（检索优化或提示词改进）建议
    rubric:
    - 故障类型分类的准确性和合理性
    - 定量指标与人工审核结果之间的相关性分析能力
    - 改进策略的逻辑合理性
  quiz:
  - question: 当 RAG 系统中的检索模块检索到不相关的上下文时，会发生什么类型的失败？
    choices:
    - 生成失败
    - 检索失败
    - 数据库连接错误
    - 认证失败
    answer_index: 1
    explanation: 检索模块的作用是识别适合问题的文档，因此检索到不相关的上下文属于检索阶段的失败 [S3]。
  - question: Ragas 框架最大的特点是什么？
    choices:
    - 必须具备大规模的人工标注数据。
    - 支持无需参考（Reference-free）的评估。
    - 仅能评估 LLM 生成质量。
    - 仅适用于实时流式系统。
    answer_index: 1
    explanation: Ragas 是一种无需地面真值（ground truth）即可评估检索和生成质量的无需参考评估框架 [S3]。
  completion_criteria:
  - 提交包含故障类型的错误分类表
  - 完成利用 Ragas 指标对检索及生成质量的定量分析
  - 完成基于错误分析的流水线改进建议书的撰写及评审
  source_ids:
  - S3
- id: m9
  slug: human-review-validation
  phase_id: p3
  title: 样本人工审核与对照
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - 理解自动化 RAG 评估指标与实际事实性之间的差距。
  - 设计人工审核模型生成回答的事实一致性（Factual Consistency）的协议。
  - 识别 LLM 评估的局限性，并分析 TrueTeacher 等合成数据技术的意义 [S5]。
  - 掌握系统化分类错误类型及管理可信度数据集的方法。
  theory_markdown: '## 自动化评估的局限性与人工审核的必要性


    在评估检索增强生成（RAG）系统的质量时，Ragas 等工具虽然能快速提供定量指标，但在捕捉模型生成回答的微妙事实错误方面存在局限。特别是在复杂的语境下，很难区分
    LLM 是在知识范围内进行推理，还是依赖于学习过的数据产生了幻觉（Hallucination）。


    ### 事实一致性评估


    最近的研究利用自然语言推理（NLI）模型或大语言模型（LLM）来评估摘要或回答的事实性。然而，现有方法依赖于人工编写的摘要数据集，这可能与实际模型生成的输出特性存在差异
    [S5]。TrueTeacher 等方法试图通过利用 LLM 从模型生成数据中构建合成的事实性评估数据，来克服这些局限性 [S5]。


    ### 人工审核（Human-in-the-Loop）的作用


    无论自动化评估流水线多么先进，最终的可靠性验证仍离不开人工审核。人工审核的作用如下：

    1. **验证自动化评估指标：** 识别某些回答虽被评估为“相关”但实际上并非事实的情况。

    2. **幻觉类型分类：** 诊断系统结构性缺陷（检索错误 vs. 生成模型错误）。

    3. **校准回归测试集：** 基于人工审核的数据持续提升评估集的质量。'
  worked_examples:
  - 示例 1：自动化评估指标（如 Faithfulness）得分很高，达到 0.9，但人工审核发现回答中包含了检索文档中不存在的内容。分析：将其归类为模型使用了非检索信息（即内部权重中包含的过去信息）产生的幻觉，并记录在系统错误日志中。
  - 示例 2：设计使用 TrueTeacher 模型使系统自行评估回答的事实性。人工抽样调查 LLM 评为“正确”的部分回答，以衡量 LLM 评估器的错误率（误报率，False
    Positive），并将其在评估报告中注明 [S5]。
  lab:
    title: 样本人工审核与错误分析执行
    steps:
    - 通过自动化评估流水线（Ragas 等）导出 100 个回答的忠实度（Faithfulness）得分。
    - 随机抽取得分最低的 10 个、中等水平的 10 个及得分最高的 10 个样本，建立审核集。
    - 通过对照回答、检索文档（Context）和标准答案（Ground Truth），人工记录是否存在“检索遗漏”、“信息失真”、“幻觉生成”。
    - 对比记录的人工判断与自动化评估得分，执行相关性分析。
    safety:
    - 务必确认待审核的数据集中不包含实际个人信息或敏感的非公开文档。
    - 审核完成的数据安全保存在本地存储中，严禁上传至未经验证的外部 API。
    deliverables:
    - 包含至少 30 条人工审核记录的错误分类表（CSV/Excel）
    - 分析自动化指标与人工评估一致性的总结报告
  assignment:
    title: RAG 可信度分析报告撰写
    deliverables:
    - 通过人工审核分类出的故障类型频率表
    - 当前系统主要脆弱点（检索阶段或生成阶段）的分析报告
    - 改进未来自动化评估流水线的建议
    rubric:
    - 错误类型分类是否系统化？
    - 是否结合具体示例逻辑性地叙述了自动化评估指标的局限性？
    - 人工审核数据是否被恰当地用作可信度分析的依据？
  quiz:
  - question: 仅凭自动化事实性评估指标难以确定系统可靠性的主要原因是什么？
    choices:
    - 因为自动化评估指标速度非常快。
    - 因为模型生成数据具有与人工撰写数据不同的特征，且自动评估器本身无法捕捉所有事实错误 [S5]。
    - 因为人工审核数据总是比自动化评估指标准确。
    - 因为数据集规模太小。
    answer_index: 1
    explanation: 现有的摘要评估数据集无法充分反映模型实际生成结果的复杂性，且自动评估系统在某些情况下无法检测出幻觉。
  - question: TrueTeacher 方法与利用现有摘要数据集的方法有何不同？
    choices:
    - 仅依赖于人工编写的摘要。
    - 利用模型生成的各种摘要，合成生成用于事实性评估的数据 [S5]。
    - 不使用 NLI 模型。
    - 不支持多语言。
    answer_index: 1
    explanation: TrueTeacher 不依赖于人工编写的摘要，而是利用 LLM 对模型生成的各种数据进行合成标注，从而生成训练数据 [S5]。
  completion_criteria:
  - 需编写至少 30 个数据样本的人工审核日志。
  - 需提交包含自动化评估结果与人工审核结果比较分析的报告。
  - 需通过错误分类明确定义当前系统的脆弱点。
  source_ids:
  - S5
- id: m10
  slug: regression-report
  phase_id: p3
  title: 可重复的回归评估报告
  estimated_hours: 18.0
  prerequisites:
  - m9
  objectives:
  - 理解 RAG 系统可重复的回归评估框架。
  - 使用 Ragas 框架定量测量检索和生成质量。
  - 通过回归测试分析模型更新或检索算法变更对系统可靠性的影响。
  - 学习通过结合人工审核与自动化评估来进行综合报告撰写的方法。
  theory_markdown: '### RAG 系统评估的核心维度

    评估 RAG 架构是一项多维任务。评估对象包括检索系统识别与问题高度相关且聚焦的上下文的能力、LLM 使用所识别上下文忠实生成回答的能力，以及最终生成物的质量本身
    [S3, S4]。


    ### Ragas 框架

    Ragas（Retrieval Augmented Generation Assessment）是一个无需基准数据（Ground Truth）即可评估 RAG
    流水线的框架 [S3]。Ragas 提供了一系列指标，用于衡量检索质量（Retrieval quality）、生成质量（Generation quality）以及防止幻觉（Hallucination）的能力
    [S3]。


    ### 回归评估的重要性

    为了维持系统的可靠性，变革管理（Change Management）必不可少。在引入新的嵌入模型、微调检索算法或更改 LLM 设置时，必须针对现有的评估数据集执行回归测试。回归评估报告是统计性证明系统改进是否切实提升了可靠性，还是导致了新的缺陷的重要材料。'
  worked_examples:
  - 统计比较示例：针对两种 RAG 设置（现有 vs 新嵌入模型），运行相同的 100 个问题评估集，并比较 Ragas 指标（Faithfulness, Answer
    Relevance）的平均值和标准差，从而验证显著性能提升的笔记本分析案例。
  - 错误类型分类示例：抽取系统中“回答相关性”得分较低的 30 个样本，手动分类是检索阶段的失败（未检索到相关文档）还是生成阶段的失败（忽略上下文），并将结果记录在流水线日志中。
  lab:
    title: RAG 流水线回归测试自动化
    steps:
    - 准备用于最终验证的评估数据集（100 个问题），格式为 JSON。
    - 定义两种不同的 RAG 流水线配置（版本 A，版本 B）。
    - 使用 Ragas 框架对每个流水线进行自动化评估并保存结果。
    - 使用 Pandas 可视化两个结果集的指标分布并计算统计学差异。
    - 针对评估分数急剧下降的下层 10% 的案例，对照证据上下文和模型响应。
    safety:
    - 务必确认评估数据集中不包含个人信息或公司机密文档。
    - 调用外部 API 时设置费用上限，并在本地环境测试时使用缓存，以防止滥用请求。
    - 切勿盲目相信模型评估结果，务必并行进行样本的人工审查（Human-in-the-loop）。
    deliverables:
    - 包含回归评估执行结果的 Jupyter Notebook
    - 两个 RAG 设置间的性能比较可视化图表（箱线图或散点图）
    - 包含错误类型分类及人工审查记录的最终报告
  assignment:
    title: 编写 RAG 可靠性改进报告
    deliverables:
    - 包含系统可靠性指标的技术报告 PDF
    - 用于配置可重现 CI 环境的设置文件（例如：pipeline.yaml）
    - 针对评估数据集的回归测试脚本
    rubric:
    - 是否对检索和生成质量指标进行了定量测量？
    - 回归测试方法论是否有描述且可重现？
    - 自动评估结果与人工审查结果之间的分析是否恰当？
    - 是否明确提出了性能变化的原因及未来改进方向？
  quiz:
  - question: Ragas 框架最显著的特征是什么？
    choices:
    - 必须拥有人类编写的答案数据集（Ground Truth）才能进行评估。
    - 即使没有基准数据，也能评估 RAG 流水线质量的框架。
    - 仅测量 LLM 生成内容的质量，不测量检索质量。
    - 为了评估，必须重新训练学习模型。
    answer_index: 1
    explanation: Ragas 是专为在没有基准数据的情况下评估 RAG 流水线而设计的框架 [S3, S4]。
  - question: 在 RAG 系统中执行回归测试的主要目的是什么？
    choices:
    - 为了美化系统的设计。
    - 为了从物理上改善服务器的响应速度。
    - 为了分析系统变更（算法、数据等）对现有可靠性的影响并防止缺陷。
    - 为了自动收集用户的个人信息。
    answer_index: 2
    explanation: 回归测试的核心是通过验证系统变更是否引起了意外的性能下降来确保可靠性。
  - question: 在进行 RAG 系统评估时，不属于应考虑的多维维度的是什么？
    choices:
    - 检索系统识别相关上下文的能力。
    - LLM 忠实利用上下文的能力。
    - 生成内容的质量。
    - 用户 SNS 账户的安全水平。
    answer_index: 3
    explanation: RAG 架构评估的主要维度是检索质量、生成忠实度和生成内容本身的质量 [S3, S4]。
  completion_criteria:
  - 设计回归测试流水线，并完成至少 100 个问题的评估数据集对 2 个以上设置的对比分析。
  - 利用 Ragas 指标进行定量评估。
  - 提交通过人工样本审查验证自动评估结果的记录。
  - 撰写并提交技术报告。
