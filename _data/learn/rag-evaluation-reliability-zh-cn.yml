    explanation: 如果在检索阶段传递了不相关的信息，LLM可能会基于这些信息生成错误的答案或产生幻觉 [S3]。
  - question: MRR指标最高的情况是什么？
    choices:
    - 相关文档总是排在最后。
    - 相关文档总是位于最顶端（第 1 位）。
    - 根本没有检索结果。
