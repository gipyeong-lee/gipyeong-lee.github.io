  - 인간 검토와 자동화 평가의 조화를 통한 종합적인 리포팅 방식을 습득한다.
  theory_markdown: '### RAG 시스템 평가의 핵심 차원

    RAG 아키텍처를 평가하는 것은 다면적인 작업입니다. 검색 시스템이 질문에 관련성 높고 집중된 문맥을 식별하는 능력, LLM이 식별된 문맥을
    사용하여 충실하게 답변을 생성하는 능력, 그리고 최종 생성물의 품질 자체가 평가 대상입니다 [S3, S4].


    ### Ragas 프레임워크

    Ragas(Retrieval Augmented Generation Assessment)는 기준 데이터(Ground Truth) 없이도 RAG
    파이프라인을 평가할 수 있는 프레임워크입니다 [S3]. Ragas는 검색 품질(Retrieval quality), 생성 품질(Generation
    quality), 그리고 할루시네이션(Hallucination) 방지 능력을 측정하기 위한 일련의 지표를 제공합니다 [S3].


    ### 회귀 평가의 중요성

    시스템 신뢰성을 유지하기 위해서는 변화 관리(Change Management)가 필수적입니다. 새로운 임베딩 모델 도입, 검색 알고리즘 튜닝,
    또는 LLM 설정 변경 시 기존 평가 데이터셋을 대상으로 회귀 테스트를 수행해야 합니다. 회귀 평가 리포트는 시스템의 개선점이 실제 신뢰성
    향상으로 이어졌는지, 아니면 새로운 결함을 유발했는지를 통계적으로 입증하는 자료가 됩니다.'
  worked_examples:
  - '통계적 비교 예시: 두 가지 RAG 설정(기존 vs 신규 임베딩 모델)에 대해 동일한 100문항 평가셋을 실행하고, Ragas 지표(Faithfulness,
    Answer Relevance)의 평균값과 표준편차를 비교하여 유의미한 성능 향상을 검증하는 노트북 분석 사례.'
  - '오류 유형 분류 예시: 시스템이 ''답변 관련성'' 점수가 낮게 나온 30건을 표본 추출하여, 검색 단계의 실패(관련 문서 미검색)인지 생성
    단계의 실패(문맥 무시)인지 수동으로 분류하고 이를 파이프라인 로그에 기록하는 방법.'
