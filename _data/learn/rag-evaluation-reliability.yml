- id: m6
  slug: citation-accuracy
  phase_id: p2
  title: 인용 정확도 및 출처 추적
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - RAG 시스템에서 답변이 검색된 문서의 내용을 얼마나 충실히 반영하는지 이해한다.
  - 인용(Citation) 정확도의 정의와 측정 방식을 학습한다.
  - Ragas 프레임워크를 활용하여 답변의 근거 충실도(Faithfulness)와 답변 관련성(Answer Relevance)을 정량 평가한다.
  - 모델의 답변에서 출처 추적 가능성을 검증하는 프로세스를 설계한다.
  theory_markdown: '## RAG 시스템의 인용 및 근거 충실도 평가


    RAG(Retrieval Augmented Generation) 시스템은 외부 지식 베이스를 활용하여 LLM의 환각(Hallucination)
    위험을 줄이지만, 생성된 답변이 검색된 문서를 정확히 인용하고 있는지 검증하는 과정이 필수적이다 [S4].


    ### 1. 주요 평가 지표

    * **근거 충실도 (Faithfulness):** 생성된 답변이 제공된 검색 맥락(Context)으로부터 파생되었는지 측정합니다. 답변의
    모든 주장이 검색된 문서를 기반으로 해야 하며, 외부 지식이나 모델의 사전 학습 지식으로만 답변하는 경우 점수가 낮아집니다 [S4].

    * **답변 관련성 (Answer Relevance):** 답변이 주어진 질문에 얼마나 직접적으로 관련이 있는지 평가합니다. 이는 검색된 정보가
    충분하더라도 답변이 질문의 의도와 어긋나는 경우를 식별하는 데 사용됩니다.


    ### 2. 인용 정확도 검증 프로세스

    인용 정확도는 답변의 특정 문장이 검색된 문맥의 어느 부분을 인용했는지 식별하고, 해당 원문의 사실과 일치하는지 확인하는 과정입니다. 자동화
    평가 프레임워크인 Ragas는 이러한 과정을 위해 참조 데이터(Ground Truth) 없이도 근거 충실도를 평가할 수 있는 지표를 제공합니다
    [S4].


    ### 3. 실패 유형 분류

    - **인용 누락:** 답변의 사실 관계가 검색 문서에 존재함에도 인용을 표시하지 않음.

    - **허위 인용:** 검색 문서에 없는 내용을 인용한 것처럼 표시.

    - **사실 왜곡:** 인용은 올바르게 표시했으나 원문의 의미를 잘못 해석하여 생성함.'
  worked_examples:
  - '예제 1: 근거 충실도 점수 계산. 질문 ''A사의 2025년 매출은?''에 대해 답변 ''A사의 2025년 매출은 100억입니다.''가
    생성되었고, 맥락 문서에 ''A사는 2025년 100억 매출을 기록했다.''가 포함된 경우, 답변의 모든 정보가 맥락 내에 존재하므로 근거
    충실도 점수는 1.0(최대치)으로 평가됩니다.'
  - '예제 2: 인용 정확도 오류 식별. 질문 ''A사의 창립 연도는?''에 대해 답변 ''A사는 1990년에 창립되었습니다(참고: 문서 1).''가
    생성되었으나, 문서 1에 ''A사는 1995년 창립''이라고 명시된 경우, 이는 ''사실 왜곡'' 실패 유형으로 분류되며 인용 정확도가 낮은
    것으로 판단합니다.'
