    - 생성된 답변이 검색된 문맥에 기반하고 있는가
    - 질문자가 LLM의 답변을 얼마나 신뢰하는가
    answer_index: 2
    explanation: Faithfulness는 생성된 답변이 제공된 검색 문맥에 얼마나 충실하게 기반하여 생성되었는지(환각 방지)를 측정하는
