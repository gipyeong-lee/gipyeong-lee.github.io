- id: m8
  slug: error-analysis
  phase_id: p3
  title: 실패 유형 분류 및 오류 분석
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - RAG 시스템에서 발생하는 실패 유형을 식별하고 분류할 수 있다.
  - 검색(Retrieval) 단계와 생성(Generation) 단계의 오류를 구분하여 분석할 수 있다.
  - Ragas 프레임워크의 지표를 활용하여 자동 평가와 인간 검토 결과를 연결할 수 있다.
  - 오류 분석 데이터를 바탕으로 RAG 파이프라인 성능 개선안을 도출할 수 있다.
  theory_markdown: '## RAG 시스템의 오류 분석 개요


    RAG(Retrieval Augmented Generation) 아키텍처는 검색 모듈과 LLM 기반의 생성 모듈로 구성됩니다 [S3]. 시스템
    성능을 평가할 때는 이 두 단계를 분리하여 분석하는 것이 중요합니다. 오류는 크게 검색 단계에서의 문제와 생성 단계에서의 문제로 나뉩니다.


    ### 1. 실패 유형 분류

    - **검색 실패 (Retrieval Failure):** 관련성이 없거나 초점이 맞지 않는 문맥(context)을 검색한 경우 [S3].

    - **생성 실패 (Generation Failure):** LLM이 제공된 문맥을 충실하게 이용하지 못하거나(Faithfulness), 질문과
    관련 없는 답변을 생성하는 경우 [S3].


    ### 2. 자동 평가와 인간 검토의 보완

    Ragas와 같은 레퍼런스 프리(Reference-free) 프레임워크는 인간 주석(ground truth) 없이도 검색과 생성 품질을 평가할
    수 있게 해줍니다 [S3]. 하지만 자동화된 평가 지표만으로는 시스템의 미묘한 환각(hallucination)이나 복합적인 논리 오류를 모두
    포착하기 어렵습니다. 따라서 정량적 자동 지표를 통해 우선순위가 높은 실패 표본을 추출하고, 이에 대해 반드시 인간 검토(Human Review)를
    병행하여 실제 원인을 파악해야 합니다.'
  worked_examples:
  - '예시 1: 질문 ''모델 A의 출시일은?''에 대해 검색기가 ''모델 B의 사양'' 문서를 가져온 경우. 이는 ''검색 실패''로 분류하며,
    임베딩 모델 조정 또는 검색 쿼리 최적화가 해결책이 될 수 있습니다.'
  - '예시 2: 질문 ''X를 설명하라''에 대해 검색기가 X에 대한 정확한 문서를 가져왔으나, LLM이 문서에 없는 정보로 답변한 경우. 이는
    ''생성 실패(충실도 부족)''로 분류하며, 프롬프트 엔지니어링을 통해 ''제공된 문맥만을 사용하라''는 제약을 강화해야 합니다.'
  lab:
    title: 실패 데이터셋 수집 및 오류 분석
    steps:
    - 최소 50개의 질문에 대해 RAG 시스템의 답변과 검색된 문맥(context)을 저장합니다.
    - 각 항목에 대해 검색 관련성(Context Precision)과 생성 충실도(Faithfulness)를 Ragas로 측정합니다.
    - 지표가 낮은 하위 20%의 질문-답변 쌍을 추출합니다.
    - 추출된 표본에 대해 '검색 오류', '생성 오류', '논리 오류' 중 하나로 분류 표를 작성합니다.
    safety:
    - 개인정보나 비공개 데이터는 절대 평가 코드에 포함하지 않습니다.
    - 평가 과정에서 사용되는 API 호출 횟수와 비용을 모니터링하여 예산을 준수합니다.
    - 데이터 분석 시 로컬 환경에서 작업을 수행하여 정보 유출을 방지합니다.
    deliverables:
    - 분류가 완료된 오류 분석 CSV 파일
    - 검색 및 생성 품질 지표가 시각화된 Jupyter Notebook
  assignment:
    title: RAG 오류 분류 및 개선 보고서 작성
    deliverables:
    - 오류 분석 결과가 요약된 2페이지 분량의 보고서
    - 분류된 실패 유형별 대응 전략(검색 최적화 또는 프롬프트 개선) 제안
    rubric:
    - 실패 유형 분류의 정확성과 타당성
    - 정량적 지표와 인간 검토 결과 간의 상관관계 분석 능력
    - 개선 전략의 논리적 타당성
  quiz:
  - question: RAG 시스템에서 검색 모듈이 관련 없는 문맥을 가져왔을 때 발생하는 실패는 무엇인가요?
    choices:
    - 생성 실패
    - 검색 실패
    - 데이터베이스 연결 오류
    - 인증 실패
    answer_index: 1
    explanation: 검색 모듈은 질문에 적합한 문서를 식별하는 역할을 하므로, 관련 없는 문맥을 가져오는 것은 검색 단계의 실패입니다 [S3].
  - question: Ragas 프레임워크의 가장 큰 특징은 무엇인가요?
    choices:
    - 반드시 대규모의 인간 주석 데이터가 필요하다.
    - 레퍼런스 프리(Reference-free) 평가가 가능하다.
    - LLM 생성 품질 평가만 가능하다.
    - 실시간 스트리밍 시스템에만 적용 가능하다.
    answer_index: 1
    explanation: Ragas는 지면진실(ground truth) 없이도 검색과 생성 품질을 평가할 수 있는 레퍼런스 프리 평가 프레임워크입니다
      [S3].
  completion_criteria:
  - 실패 유형이 포함된 오류 분류표 제출
  - Ragas 지표를 활용한 검색 및 생성 품질 정량 분석 완료
  - 오류 분석을 바탕으로 한 파이프라인 개선 제안서 작성 및 검토
  source_ids:
  - S3
- id: m9
  slug: human-review-validation
  phase_id: p3
  title: 표본 인간 검토 및 대조
  estimated_hours: 10.0
  prerequisites:
  - m8
  objectives:
  - 자동화된 RAG 평가 지표와 실제 사실성 간의 간극을 이해한다.
  - 모델이 생성한 답변의 근거 충실도(Factual Consistency)를 인간이 검토하는 프로토콜을 설계한다.
  - LLM 평가의 한계를 파악하고, TrueTeacher와 같은 합성 데이터 기법의 의의를 분석한다 [S5].
  - 오류 유형을 체계적으로 분류하고 신뢰성 데이터셋을 관리하는 방법을 익힌다.
  theory_markdown: '## 자동화 평가의 한계와 인간 검토의 필요성


    검색 증강 생성(RAG) 시스템의 품질을 평가할 때 Ragas와 같은 도구는 정량적 지표를 빠르게 제공하지만, 모델이 생성한 답변의 미묘한
    사실적 오류를 완벽히 포착하는 데는 한계가 있습니다. 특히 복잡한 맥락에서 LLM이 지식 내에서 추론하는지, 혹은 학습된 데이터에 의존하여
    환각(Hallucination)을 생성하는지 구분하기 어렵습니다.


    ### 사실적 일관성 평가


    최근 연구는 자연어 추론(NLI) 모델이나 대형 언어 모델(LLM)을 활용하여 요약이나 답변의 사실성을 평가합니다. 그러나 기존 방식은 인간이
    작성한 요약 데이터셋에 의존하며, 이는 실제 모델이 생성하는 결과물의 특성과 차이가 발생할 수 있습니다 [S5]. TrueTeacher와 같은
    접근법은 LLM을 활용하여 모델 생성 데이터에서 합성적인 사실성 평가 데이터를 생성함으로써 이러한 한계를 극복하려 합니다 [S5].


    ### 인간 검토(Human-in-the-Loop)의 역할


    자동 평가 파이프라인이 아무리 고도화되더라도, 최종적인 신뢰성 검증은 인간의 검토가 필수적입니다. 인간 검토는 다음 역할을 수행합니다:

    1. **자동 평가 지표의 검증:** 특정 답변이 ''관련 있음''으로 평가되었으나 실제로는 사실이 아닌 경우를 식별.

    2. **환각 유형 분류:** 시스템의 구조적 결함(검색 오류 vs. 생성 모델 오류)을 진단.

    3. **회귀 테스트 셋의 보정:** 인간이 검수한 데이터를 바탕으로 평가셋의 품질을 지속적으로 개선.'
  worked_examples:
  - '예시 1: 자동 평가 지표(예: Faithfulness)가 0.9로 높게 나왔으나, 인간 검토 결과 검색 문서에는 없는 내용이 포함된 경우.
    분석: 모델이 검색된 정보가 아닌 내부 가중치에 포함된 과거 정보를 사용한 환각으로 분류하고, 이를 시스템 오류 로그에 기록함.'
  - '예시 2: TrueTeacher 모델을 사용하여 시스템이 답변의 사실성을 스스로 평가하도록 설계한 경우. LLM이 ''참''이라고 평가한
    답변 중 일부를 인간이 표본 조사하여, LLM 평가기의 오류율(False Positive)을 측정하고 이를 평가 보고서에 명시함 [S5].'
  lab:
    title: 표본 인간 검토 및 오류 분석 수행
    steps:
    - 자동 평가 파이프라인(Ragas 등)을 통해 100건의 답변에 대한 Faithfulness 점수를 도출한다.
    - 점수가 가장 낮은 10건과 중간 수준의 10건, 높은 10건을 무작위로 추출하여 검토셋을 만든다.
    - 답변, 검색 문서(Context), 정답(Ground Truth)을 대조하며 '검색 누락', '정보 왜곡', '환각 생성' 여부를 수동
      기록한다.
    - 기록된 인간 판단과 자동 평가 점수를 비교하여 상관관계 분석을 수행한다.
    safety:
    - 검토 대상 데이터셋에 실제 개인정보나 민감한 비공개 문서가 포함되지 않았는지 반드시 확인한다.
    - 검토 완료된 데이터는 로컬 스토리지에 안전하게 보관하며, 검증되지 않은 외부 API에 업로드하지 않는다.
    deliverables:
    - 최소 30건의 인간 검토 기록이 포함된 오류 분류 시트(CSV/Excel)
    - 자동 지표와 인간 평가 간의 일치도를 분석한 요약 리포트
  assignment:
    title: RAG 신뢰성 분석 보고서 작성
    deliverables:
    - 인간 검토를 통해 분류된 실패 유형 빈도 표
    - 현재 시스템의 주요 취약점(검색 단계 혹은 생성 단계)에 대한 분석 보고서
    - 향후 자동 평가 파이프라인 개선을 위한 제언
    rubric:
    - 오류 유형이 체계적으로 분류되었는가?
    - 자동 평가 지표의 한계를 구체적인 예시와 함께 논리적으로 서술했는가?
    - 인간 검토 데이터가 신뢰성 분석의 근거로 적절하게 활용되었는가?
  quiz:
  - question: 자동화된 사실성 평가 지표만으로 시스템 신뢰성을 확정하기 어려운 주된 이유는 무엇인가?
    choices:
