modules:
- id: m1
  slug: intro-rag-architecture
  phase_id: p1
  title: RAG 아키텍처 이해
  estimated_hours: 8.0
  prerequisites: []
  objectives:
  - RAG(Retrieval-Augmented Generation) 아키텍처의 핵심 구성 요소를 이해한다.
  - 대규모 언어 모델(LLM)이 가진 지식 한계와 검색 기반 증강의 필요성을 파악한다.
  - 검색-생성 파이프라인의 구조적 흐름을 설명할 수 있다.
  theory_markdown: '## RAG(Retrieval-Augmented Generation) 아키텍처 개요


    최신 자연어 처리(NLP) 및 딥러닝 모델은 방대한 텍스트 데이터를 학습하여 뛰어난 성능을 보이지만, 모델 학습 시점에 포함되지 않은 최신
    정보나 특정 도메인의 비공개 데이터에 대해서는 환각(hallucination)을 보이거나 정보를 알지 못하는 한계가 있습니다 [S1].


    ### 검색을 통한 LLM의 한계 극복

    RAG는 모델이 모든 지식을 매개변수(parameter) 내부에 암기하게 하는 대신, 질문과 관련된 외부의 신뢰할 수 있는 문서를 ''적절한
    시점(just-in-time)''에 검색하여 생성 단계의 입력으로 제공하는 방식입니다 [S2].


    ### 핵심 구성 요소

    1. **검색기(Retriever)**: 사용자의 질의(query)를 받아 벡터 데이터베이스 등에서 관련성이 높은 문서 조각(chunk)을
    식별합니다.

    2. **증강(Augmentation)**: 검색된 문서와 원래 질문을 조합하여 LLM에 전달할 프롬프트를 구성합니다.

    3. **생성기(Generator)**: 증강된 정보를 바탕으로 사실 기반의 응답을 생성합니다.


    이러한 구조는 모델의 지식을 최신 상태로 유지하고, 생성된 답변의 근거를 추적 가능하게 함으로써 신뢰성을 확보하는 데 기여합니다.'
  worked_examples:
  - '사례 1: 전통적인 LLM 방식 - ''오늘자 뉴스 알려줘''라고 질문할 경우 학습 데이터 이후의 사건을 인지하지 못해 잘못된 정보를 생성할
    위험이 있음.'
  - '사례 2: RAG 방식 - ''오늘자 뉴스 알려줘'' 질문 시, 1) 외부 검색 엔진이나 실시간 뉴스 API를 통해 검색기(Retriever)가
    관련 기사를 수집하고, 2) 이를 문맥(context)으로 포함하여 LLM에 전달함으로써 정확한 최신 정보 응답을 생성.'
  lab:
    title: RAG 아키텍처 흐름 시각화 및 분석
    steps:
    - Jupyter Notebook을 열고 RAG 기본 파이프라인의 3단계(입력, 검색, 생성) 구조를 도식화한다.
    - 오픈 라이선스 문서 코퍼스에서 5개의 짧은 텍스트를 추출하여 데이터셋 샘플을 만든다.
    - 간단한 키워드 매칭 검색기(Retriever) 함수를 작성하여 질문에 맞는 문서를 반환하도록 구현한다.
    - 검색된 문서를 프롬프트 템플릿에 주입하는 증강 단계를 코드로 작성한다.
    safety:
    - 실제 개인정보나 기밀문서를 절대 코퍼스 데이터로 사용하지 않는다.
    - API 사용 시 호출 횟수 제한(Rate Limit)을 확인하고 테스트 코드에 시드(seed) 값을 설정하여 재현성을 확보한다.
    deliverables:
    - RAG 아키텍처 다이어그램 (Notebook 셀 내 포함)
    - 간단한 키워드 기반 검색기 구현 코드
    - 문서 주입형 프롬프트 생성 결과물
  assignment:
    title: RAG 기반 정보 검색 파이프라인 분석 보고서
    deliverables:
    - 구현한 RAG 파이프라인의 작동 원리를 설명하는 Notebook
    - 검색기가 문서의 관련성을 판단할 때 발생할 수 있는 잠재적 실패 사례 3가지 기술
    rubric:
    - RAG의 3단계(검색, 증강, 생성)가 정확하게 구분되어 설명되었는가?
    - 검색 단계에서 관련 없는 문서가 검색될 가능성에 대한 분석이 타당한가?
    - 비공개 데이터 보안 지침을 준수하며 구현하였는가?
  quiz:
  - question: RAG가 LLM 학습 방식과 비교하여 가지는 주된 장점은 무엇입니까?
    choices:
    - LLM의 파라미터 크기를 줄일 수 있다.
    - 모델의 지식을 최신 상태로 유지하고 근거를 제시할 수 있다.
    - 모델의 학습 속도를 가속화한다.
    - 모든 질문에 대해 100% 사실인 답변을 생성한다.
    answer_index: 1
    explanation: RAG는 외부 문서를 참조하므로 최신 정보를 반영할 수 있고, 생성된 답변의 근거를 문서에서 찾을 수 있어 신뢰성이
      높습니다.
  - question: 검색기(Retriever)의 역할로 올바른 것은 무엇입니까?
    choices:
    - 답변을 생성하는 역할을 한다.
    - 학습 데이터를 다시 학습시키는 역할을 한다.
    - 질문과 관련된 외부 문서 조각을 검색한다.
    - 사용자 인터페이스를 관리한다.
    answer_index: 2
    explanation: 검색기는 사용자의 질문과 의미적으로 유사하거나 관련성이 높은 문서를 외부 데이터 소스에서 찾아오는 역할을 합니다.
  completion_criteria:
  - RAG 아키텍처의 구성 요소를 설명할 수 있다.
  - 실습한 RAG 파이프라인 코드가 정상적으로 작동하여 관련 문서를 검색 및 증강하는 것을 확인한다.
  - RAG 파이프라인의 한계점과 개선 방향을 분석 보고서에 기술한다.
  source_ids:
  - S1
  - S2
- id: m2
  slug: corpus-curation
  phase_id: p1
  title: 평가용 문서 코퍼스 큐레이션
  estimated_hours: 8.0
  prerequisites:
  - m1
  objectives:
  - RAG 평가를 위한 고정 문서 코퍼스의 중요성을 이해한다.
  - 평가용 문서 데이터의 품질 결정 요소(정확성, 다양성, 중복 제거)를 학습한다.
  - 정량적 평가를 위한 문서-질문-정답 쌍(QA Pair) 데이터셋 구축 전략을 익힌다.
  - 데이터 누출(Data Leakage)을 방지하기 위한 학습/평가 분할 방법을 습득한다.
  theory_markdown: '## RAG 평가를 위한 코퍼스 큐레이션


    대규모 언어 모델(LLM)은 학습된 파라미터 내의 지식에 의존할 때 환각(Hallucination) 위험이 존재합니다. 검색 증강 생성(RAG)은
    모델이 실시간으로 외부 지식에 접근하도록 하여 이러한 한계를 극복합니다 [S2]. 효과적인 RAG 시스템의 신뢰성을 정량적으로 평가하기 위해서는
    **고정되고 제어 가능한 평가용 문서 코퍼스(Fixed Evaluation Corpus)**가 필수적입니다.


    ### 1. 코퍼스 품질 결정 요소

    - **정확성(Factuality):** 문서 내의 정보는 최신이고 사실적이어야 합니다. 잘못된 정보가 포함된 코퍼스는 잘못된 답변을 생성하게
    합니다.

    - **도메인 적합성:** 평가하고자 하는 실제 서비스 환경과 유사한 주제 및 어휘를 포함해야 합니다.

    - **중복 제거(De-duplication):** 동일한 정보가 여러 문서에 중복될 경우, 검색 결과의 다양성이 저해되고 평가 통계에 편향을
    줄 수 있습니다.


    ### 2. QA 평가 데이터셋 구축

    문서 코퍼스만으로는 평가가 불가능합니다. ''문서-질문-정답'' 쌍을 구축하여 검색기가 관련 문서를 가져오는지, 생성기가 이를 기반으로 정확한
    답변을 하는지 측정해야 합니다.

    - **질문 생성:** LLM을 사용하여 문서에서 질문을 자동으로 생성하거나, 도메인 전문가가 직접 작성합니다.

    - **정답 정의:** 답변의 근거가 되는 문서 구간(Chunk)을 명확히 명시해야 합니다.


    ### 3. 데이터 분할 및 무결성

    평가셋의 신뢰성을 위해 **개발용(Development Set)**과 **최종 평가용(Hold-out Test Set)**을 엄격히 분할해야
    합니다. 평가셋에 포함된 질문이 검색 대상 문서에 직접적으로 포함되어 노출되는 ''데이터 누출'' 현상을 방지해야 합니다.'
  worked_examples:
  - '예제 1: 문서 청킹(Chunking) 전략. 텍스트를 고정 크기로 나눌 때 문맥이 끊기지 않도록 문단 단위나 의미 단위로 나누는 파이썬
    스크립트 작성법.'
  - '예제 2: 질문-답변 데이터 구성. { ''question'': ''...'', ''ground_truth'': ''...'', ''context_chunk_id'':
    ''...'' } 형식의 JSON 객체 생성 예시.'
  lab:
    title: 평가용 코퍼스 구축 실습
    steps:
    - 평가할 대상 도메인의 오픈 라이선스 텍스트 파일(.txt)을 확보한다.
    - 파이썬을 사용하여 텍스트 파일을 읽고 청크 단위로 나누는 스크립트를 작성한다.
    - 각 청크에 고유 식별자(ID)를 부여하고 메타데이터(제목, 소스)를 기록한다.
    - 작성한 청크들 중에서 질문을 생성하고, 답변의 근거가 되는 청크 ID를 기록하여 50개의 QA 쌍을 구성한다.
    - 전체 코퍼스를 8:2 비율로 개발셋과 테스트셋으로 나누어 저장한다.
    safety:
    - 개인정보가 포함된 문서는 평가 코퍼스에 포함하지 않는다.
    - 외부 API 사용 시 요청 수 상한을 설정하여 비용을 제어한다.
    - 작업 시 생성된 데이터는 Git을 통해 버전을 관리하여 재현성을 확보한다.
    deliverables:
    - 구축된 문서 코퍼스 파일(JSONL 형식)
    - 질문과 정답이 포함된 QA 데이터셋(JSON 형식)
    - 코퍼스 분할 기록이 담긴 Jupyter Notebook 파일
  assignment:
    title: 도메인 기반 RAG 데이터셋 완성
    deliverables:
    - 최소 100문항의 QA 데이터셋 파일
    - 데이터셋 통계 분석 보고서(질문 길이, 청크 길이 등)
    - 데이터 분할 과정이 포함된 Python 코드
    rubric:
    - 코퍼스 내 중복 청크 제거 완료 여부
    - 테스트셋과 개발셋의 데이터 누출 여부 확인
    - 답변의 근거가 되는 문서 구간(Chunk ID)의 정확한 매핑 여부
  quiz:
  - question: RAG 시스템에서 '데이터 누출(Data Leakage)'을 방지하는 가장 좋은 방법은 무엇인가요?
    choices:
    - 모든 문서에 대해 동일한 질문을 생성한다.
    - 개발셋과 최종 평가용 테스트셋을 분리하여 관리한다.
    - 학습 데이터에 검색 대상 문서 전체를 포함시킨다.
    - 평가셋을 매번 새로 생성하여 관리한다.
    answer_index: 1
    explanation: 평가셋이 학습(또는 개발) 과정에서 검색 대상 문서에 노출되면 공정한 평가가 불가능하므로, 평가용 테스트셋을 엄격히
      분리해야 합니다.
  - question: 코퍼스 큐레이션 과정에서 '중복 제거'가 중요한 이유는 무엇인가요?
    choices:
    - LLM의 생성 속도를 높이기 위해서
    - 디스크 저장 공간을 절약하기 위해서
    - 검색 결과의 다양성을 확보하고 통계적 편향을 방지하기 위해서
    - 문서의 의미론적 유사도를 낮추기 위해서
    answer_index: 2
    explanation: 중복된 정보는 검색 엔진이 특정 정보에 편향되게 검색 결과를 반환하게 만들며, 정량적 평가 지표를 왜곡시킬 수 있습니다.
  completion_criteria:
  - 평가용 문서 코퍼스(최소 100개 청크 이상) 구축 완료
  - 검증 가능한 QA 데이터셋(최소 100문항) 생성 완료
  - 데이터셋 분할 정책 준수 확인
  - 결과물에 대한 동료 검토 또는 자기 평가 체크리스트 작성 완료
