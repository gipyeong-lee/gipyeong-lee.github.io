- id: m4
  slug: electronics-fundamentals
  phase_id: p2
  title: 電子回路基礎
  estimated_hours: 12.0
  prerequisites:
  - m3
  objectives:
  - DYNAMIXELスマートアクチュエーターの電気的特性と電源システムの理解
  - FSR 402センサを活用した電圧分圧回路設計およびADC信号取得
  - システム過電流保護のためのヒューズベース電源分岐設計
  - 電気回路の絶縁および物理的安全分離原則の熟知
  theory_markdown: 異常発熱・臭気・煙を感知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証されたupstream
    master disconnectで3個のアダプターの供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁ずる。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無電源計測確認後にのみ行う
    [S14] [S17] [S26, S25] [S26] [S15] [S27] [S16]
  worked_examples:
  - 例題1：分岐電源電流合計計算。一分岐に4台のアクチュエータ(ストール電流各2.3 A)が割り当てられた場合、最大理論電流は9.2 Aです。これは10 Aヒューズの定格内であり、アダプタの11.5
    A出力限度を超えないため安全に駆動可能です [S14, S17, S26]。
  - 例題2：FSR分圧器出力計算。FSRに力が加わりセンサ抵抗が10 kΩになったとき、分圧ノードの電圧は3.3 V * (10 kΩ / (10 kΩ + 10
    kΩ)) = 1.65 Vとなります。これはOpenCR 12ビットADCの有効範囲内であるため精密な力フィードバックが可能です [S15, S16, S27]。
  lab:
    title: 電源分岐構成およびセンサー入力試験
    steps:
    - 各MEAN WELLアダプタ出力線に0AFH0001Zインラインホルダと10 A ATOFヒューズを直列に設置します [S17, S25, S26]。
    - 各分岐の12 V電圧が正常範囲内であるかマルチメータで測定します。
    - OpenCR 3.3 Vピンと10 kΩ抵抗、FSR 402を使用して分圧回路をブレッドボードに構成します [S16, S27]。
    - センサ電圧が0~3.3 V範囲内にあるか確認し、力を加える際、電圧変化を観察します。
    safety:
    - 整備および接近前、3個の電源アダプタを物理的に分離した後、各分岐のDC電圧が1 V未満であることをマルチメータで必ず確認します。
    - 回路構成中、電源投入禁止。電圧測定はすべての結線完了後、固定治具状態で行います。
    - 耐衝撃用保護メガネを常時着用します。
    - アクチュエータ電源(12 V)とセンサ電源(3.3 V)を絶対に混線させないでください。
    deliverables:
    - 回路別電圧測定データシート
    - FSR力センサーの力-電圧反応曲線プロット
    - 過電流保護のための分岐別ヒューズ結線写真
  assignment:
    title: 電源配分およびセンサーデータ収集設計
    deliverables:
    - アクチュエーター分岐別電力割り当て計画書
    - OpenCR ADC回路図を含む配線図
    - ヒューズ定格選定論理レポート
    rubric:
    - 電源分岐合計電流が各アダプターの許容範囲を遵守している
    - FSR回路が3.3 Vセンサレールのみに接続されていること
    - ヒューズが過電流保護を適切に遂行できる定格で選定されている
  quiz:
  - question: 次の中で電源分岐構成時に禁じられる行為は何ですか？
    choices:
    - 分岐ごとに10 Aヒューズを直列に設置すること
    - 独立したアダプターの陽(+)端子を並列に接続すること
    - アクチュエーターを4:4:3で配分すること
    - FSRセンサを3.3 Vレールに接続すること
    answer_index: 1
    explanation: 各アダプター出力は独立した分岐として使用しなければならず、電源アダプター出力間の並列接続はシステム故障および火災の危険を招く恐れがあるため、絶対禁じられます。
  - question: FSR 402センサ電圧分圧回路構成時の注意事項として正しいものは？
    choices:
    - 12 Vアクチュエータ電源レールを使用しなければならない。
    - 5 V電源を使用してADC解像度を高めなければならない。
    - OpenCRの3.3 Vセンサ電源を使用しなければならない。
    - 抵抗なしにFSRのみを接続しなければならない。
    answer_index: 2
    explanation: FSRセンサの電圧信号はOpenCR ADC入力範囲(0~3.3 V)を超えてはいけないため、必ず3.3 Vセンサ電源を使用しなければなりません。
  completion_criteria:
  - すべての電源分岐回路の電圧が1 V未満に物理的に分離されていることをマルチメータで立証
  - ヒューズ装着および3.3 V電源分圧回路構成完了
  - FSRセンサ信号がOpenCR ADCで0~3.3 V内で正常に取得されることを確認
  source_ids:
  - S6
  - S9
  - S14
  - S17
  - S26
  - S25
  - S15
  - S27
  - S16
- id: m5
  slug: actuators-sensors
  phase_id: p2
  title: アクチュエーターおよびセンサー統合
  estimated_hours: 13.0
  prerequisites:
  - m4
  objectives:
  - DYNAMIXELスマートアクチュエーターの制御信号と電源配分構造を理解する。
  - FSR(力感応抵抗)センサーの動作原理を把握し、OpenCRコントローラーで電圧分圧回路を設計する。
  - アクチュエーター電源分岐および個別ヒューズ保護の重要性を習得する。
  - テンドン駆動システムの機構的特性と電子制御フィードバックの連動方法を習得する。
  theory_markdown: 異常発熱・臭気・煙を感知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証されたupstream
    master disconnectで3個のアダプターの供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁ずる。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無電源計測確認後にのみ行う
    [S14] [S16] [S17] [S15] [S27] [S26]
  worked_examples:
  - 例題1：アクチュエータ分岐別最大負荷計算。1台のアクチュエータストール電流2.3 Aの場合[S14]、4台のアクチュエータが配置された分岐の最大ピーク電流は4
    * 2.3 A = 9.2 Aである。これは10 Aヒューズの定格内であり[S26]、11.5 Aアダプタ出力仕様を超えないため安全である[S17]。
  - 例題2：FSR分圧回路のADC電圧算出。センサ抵抗をR_fsr、固定抵抗をR_fixed(10 kΩ)とする時、ADC入力電圧V_adc = 3.3V *
    (R_fixed / (R_fsr + R_fixed))である[S16, S27]。接触力がない時(無限大抵抗) V_adcは0 V、最大接触時、センサ抵抗が固定抵抗より小さくなるとV_adcは3.3
    Vに近づき、力データをデジタル化する。
  lab:
    title: アクチュエーターおよびFSRセンサー統合試験
    steps:
    - 各アダプタ出力端にATOインラインヒューズホルダを接続し、10 Aヒューズを挿入する[S25, S26]。
    - DYNAMIXELアクチュエーターハーネスをヒューズ以降の電源分岐に接続する [S9]。
    - FSRセンサと10 kΩ抵抗を使用して電圧分圧回路を構成し、OpenCRの3.3 V ADCポートに接続する[S16, S27]。
    - マルチメータをDC電圧モードに設定し、各分岐の出力電圧が12 Vであることを確認する。
    - ソフトウェアでアクチュエーターを低速無負荷回転させ、通信状態を点検する。
    safety:
    - 整備前、3個の電源アダプタを物理的に分離した後、1 V未満であることを測定して無電源状態を確認する。
    - 電源投入中は手をアクチュエーターの可動範囲に入れない。
    - 回路試験時は保護メガネを必ず着用する。
    - 異常発熱・臭気・煙を感知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証されたupstream master disconnectで3個のアダプターの供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁ずる。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無電源計測確認後にのみ行う
    deliverables:
    - 分岐別電圧測定校正記録用紙
    - FSRセンサー圧力-ADC値特性曲線グラフ
    - 正常作動状態のロボットハンドハーネス写真および配線図
  assignment:
    title: 電源システム設計およびフィードバックロジック実装
    deliverables:
    - アクチュエーター分岐別負荷配分およびヒューズ保護計算書
    - FSRセンサーデータを利用した把持力制御アルゴリズム(擬似コード)
    - 最終配線および電源統合設計レポート
    rubric:
    - 12 Vアクチュエータと3.3 Vセンサレールが正しく分離されているか？
    - 分岐別最大ピーク電流がヒューズ定格を超えないか？
    - 教育用プロトタイプは機械安全標準遵守や認証を主張せず、人間が接近する環境へ投入前には有資格の安全専門家の別途検討が必要であるか？
    - 安全規則に従った電源物理分離手順を理解したか？
  quiz:
  - question: FSR電圧分圧回路の供給電源として適切なものは？
    choices:
    - 12 Vアクチュエータ電源
    - OpenCR 3.3 Vセンサ電源
    answer_index: 1
    explanation: FSRセンサのADC信号はOpenCRの3.3 Vセンサレールを使用しなければならず、12 Vアクチュエータ電源とは電気的に完全に分離されなければならない。
  - question: 分岐別ヒューズ保護の主な目的は何ですか？
    choices:
    - 電圧を12 Vに強制固定するため
    - 異常発熱・臭気・煙を感知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証されたupstream master disconnectで3個のアダプターの供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁ずる。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無電源計測確認後にのみ行う
    answer_index: 1
    explanation: 各分岐に配置された10 Aヒューズは、アクチュエータのピーク電流を許容しながら、配線ショート等の故障発生時、過電流からシステムを保護する。
  - question: 絶縁型電源アダプターの独立した陽(+)出力同士を接続してもよいか？
    choices:
    - 分岐電流合計のために必ず接続しなければならない
    - 絶対禁じられ、各分岐を独立的に維持しなければならない
    answer_index: 1
    explanation: 独立型分岐構造のため、陽(+)出力並列接続は絶対禁じられ、各出力は物理的に分離された電源ハーネスとして運営されなければならない。
  completion_criteria:
  - 各アクチュエータ分岐で12 V電圧が正常に計測されることを確認した。
  - FSRセンサーデータをコントローラーで正常に取得し、接触力変化によるADC値変化を立証した。
  - システム電源を物理的に遮断し、1 V未満の状態において安全に整備接近を遂行できる。
  - すべての実習課題および安全遵守誓約書を提出した。
  source_ids:
  - S14
  - S15
  - S16
  - S17
  - S27
  - S26
  - S25
  - S9
- id: m6
  slug: assembly
  phase_id: p2
  title: ロボットハンド組み立て
  estimated_hours: 15.0
  prerequisites:
  - m5
  objectives:
  - ロボットハンド機構組み立てのための精密部品締結原理を理解する。
  - テンドン(Dyneema)駆動システムの張力伝達構造を把握する。
  - 独立電源分岐構成と物理的配線安全を学習する。
  - FSRセンサーと分圧回路の正しい統合方法を習得する。
  theory_markdown: '### 精密組み立ておよびハーネスシステム


    ロボットハンド組み立ては機械的剛性と電子的な信頼性を同時に確保しなければならない精密工程です。主要構造物は剛性と寸法安定性が高い炭素繊維充填PCフィラメント(PC-CF)で製作され
    [S21]、M3真鍮熱圧入インサートを通じて繰り返しの分解と組み立てが可能なように設計されました [S23]。


    #### 腱駆動原理

    腱はアクチュエータの回転運動を指関節の屈曲運動に変換します。Dyneema SK78素材は直径1.5 mmで230 daNの高い破断荷重と1%未満の低い作動伸率を提供し、張力伝達効率を最大化します
    [S18]。組み立て時、キャプスタン縁の丸め処理は、腱の摩耗を防止する必須要素です。


    #### 独立電源および安全分岐

    本システムは3個の独立した12 V電源分岐を使用します [S17]。各分岐はアダプタ別に電気的に絶縁され、絶対に陽(+)出力を並列に連結しません。各分岐には10
    A ATOFヒューズが直列に配置され、配線欠陥から保護します [S26]。これはアクチュエータのストール電流合計が安全に収容されるように設計されました。


    #### センサインターフェース

    指先のFSR 402センサは圧力に応じて抵抗が変わる可変抵抗体です [S15]。教育用プロトタイプは機械安全標準遵守や認証を主張しておらず、人接近環境投入前、資格のある安全専門家の別途検討が必要です
    [S27] [S16]。'
  worked_examples:
  - 例示1：ヒューズ容量計算。XM430アクチュエータ11台(ストール電流合計9.2 A)を1個の12 V分岐に接続する場合、10 Aヒューズを使用することが適切です。これは正常運転範囲を収容しながら、配線過負荷時、回路を保護する標準規格です
    [S14, S26]。
  - 例示2：熱圧入インサート深さ。M3真鍮インサートはPC-CF出力物に垂直に正確に熱圧入されなければならず、4.4 mm外径に合わせた4 mmパイロットホールが必要です
    [S23]。傾きはねじ山組み立て精度を低下させるため注意しなければなりません。
  lab:
    title: ロボットハンド機構組み立ておよび配線実習
    steps:
    - M3熱圧入インサートを指リンクと手のひらフレームに設置します。
    - igus JSM-0810-10ベアリングと8 mmアルミニウムシャフトを手首および関節軸に装着します。
    - Dyneemaテンドンをキャプスタンに巻き、適正張力で指に連結します。
    - Micro-Fit 3.0コネクタを使用して各アクチュエータと指先センサハーネスを配線します [S9]。
    - 各独立12 V分岐に10 Aヒューズを設置し、個別電源接続を確認します [S26, S25]。
    safety:
    - 電源投入前には必ずマルチメーターで3個の電源分岐の絶縁状態を確認してください。
    - テンドン張力試験中、テンドン破断時の跳ね返り防止のため常に保護メガネを着用してください。
    - 整備および部品接近前、3個の電源アダプタを物理的に分離し、各分岐の電圧が1 V未満であることを計測確認してください。
    - 絶対に二つ以上の電源アダプタ陽(+)出力を並列に連結しないでください。
    deliverables:
    - 関節別摩擦のない駆動確認映像
    - 各電源分岐別ヒューズ設置写真
    - 組み立て完了したロボットハンドの配線図および締結トルク記録
  assignment:
    title: ロボットハンドシステム統合レポート
    deliverables:
    - 完成された組み立て体3面図および締結点詳細図(CAD)
    - 電源分岐別負荷配分表およびヒューズ容量検証結果
    - 指屈曲時のテンドン張力データ記録
    rubric:
    - 機構組み立て精度およびベアリング摩擦最小化(40%)
    - 独立分岐別の独立的な電源配線および安全指針遵守(40%)
    - 提出物の技術仕様の正確性(20%)
  quiz:
  - question: 次の中で電源供給方式に対する説明として正しいものは？
    choices:
    - 3個の電源アダプターの陽(+)端子を並列に接続して電流容量を大きくする。
    - 各電源アダプターは独立した分岐として使用し、陽(+)端子は電気的に絶縁する。
    answer_index: 1
    explanation: システム安全のために各電源アダプターは独立した分岐として使用し、陽(+)出力を並列に接続することは絶対禁じられます。
  - question: FSR 402センサをOpenCRボードに接続する際に使用しなければならない電圧は？
    choices:
    - 3.3 Vセンサ電源レール
    - 12 Vアクチュエータ電源レール
    answer_index: 0
    explanation: FSRセンサ分圧回路はADC信号を0-3.3 V範囲内に維持するために必ず3.3 Vセンサレールに接続しなければなりません。
  - question: テンドン素材としてDyneema SK78を使用する主な理由は？
    choices:
    - 安い価格と簡単な加工性
    - 小さな直径対比高い破断荷重と非常に低い作業伸長率
    answer_index: 1
    explanation: Dyneema SK78は非常に高い強度と低い伸長率を提供し、精密な張力伝達に適しています。
  completion_criteria:
  - すべての5個の指関節の物理的組み立て完了
  - 独立的な3個の電源分岐のヒューズ設置確認
  - 組み立て完了後、3個の分岐それぞれ無電源状態(1 V未満)確認
