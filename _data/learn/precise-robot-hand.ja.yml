  slug: precise-robot-hand
  title: 精巧な5知ロボットハンドの製作
  summary: ロボット工学の基礎から5知ロボットハンドの設計、機構学、電子回路、制御アルゴリズム、およびシステム統合までの全工程を行うプロジェクト中心のコースです。
  outcome: 独立動作可能な5知ロボットハンドのプロトタイプ製作、機構設計能力、組み込み制御システムの実装能力の獲得。
  audience: ロボット工学入門の大学生およびメイカー
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3Dプリンター
  - マルチメーター
  - はんだごて
  - 一般的な手工具
  - PC-CF用硬化鋼ノズル
  - 耐衝撃用保護メガネ
  - バーニヤキャリパー
  safety_summary:
  - 低電圧教育用プロトタイプであり、認証された機械安全システムではありません
  - 学習者が作成した停止回路を安全機能や非常停止として使用しないこと
  - 通常停止はソフトウェアによるトルクオフで実行し、計画停止後の整備・接近前には3個の絶縁電源アダプターを物理的に分離して無電源状態を計測確認すること
  - 電源投入中は可動範囲に手を入れず、固定治具で無負荷から試験すること
  - 切断・ドリル・テンドン張力試験中は耐衝撃用保護メガネを着用すること
  - 異常発熱・臭気・煙を感知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証されたupstream master disconnectで3個のアダプター供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁ずる。トルクオフは電源遮断の代わりにはならない
  - 人間が接近する環境へ投入する前には、有資格の安全専門家の検討のもと、二重チャンネル・手動リセット・EDM・フィードバック可能な二重接触器を別途設計および検証しなければならない
