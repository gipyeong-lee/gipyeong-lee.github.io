modules:
- id: m1
  slug: intro-robotics
  phase_id: p1
  title: ロボット工学概論
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - ロボット工学の定義とシステム構成要素を理解する。
  - 5知ロボットハンドのプロトタイプに使用されるアクチュエーターとコントローラーの役割を把握する。
  - ロボットシステムの安全な電源分岐構成と物理的遮断原理を学習する。
  - 力覚センサー(FSR)の動作原理とADCデータ取得方法を習得する。
  theory_markdown: '## ロボットシステムの構成要素

    ロボットは感覚(Sensor)、思考(Controller)、動作(Actuator)の三つの核心要素で構成されます [S1]。本課程の5本指ロボットハンドはDYNAMIXEL
    XM430-W350-Tアクチュエータを使用し、腱駆動方式で関節を制御します [S14]。また、OpenCR 1.0コントローラを通じてこれらアクチュエータと指先のFSRセンサ信号を処理します
    [S16]。


    ## 電力システムの安全な設計

    アクチュエータは12 Vの電圧でストール電流2.3 Aを要求するため [S14]、システム全体の負荷を考慮してMEAN WELL GST160A12-R7Bアダプタを3個使用します
    [S17]。各アダプタは4台/4台/3台のアクチュエータを担当する独立した12 V分岐として運用され、これら分岐の陽(+)出力は互いに結合せず、物理的に隔離されます。各分岐には10
    A ATOFヒューズをインラインホルダ(0AFH0001Z)経由で設置し、過電流発生時に配線を保護します [S25, S26]。これは単純な停止機能を超えた電気的安全の基礎です。


    ## センサインターフェース

    FSR 402センサは接触力に応じて抵抗が減少する特性を持ちます [S15]。これを10 kΩ抵抗と共に分圧回路で構成し、OpenCRの12ビットADCポートに接続することで接触力を電圧に換算します
    [S16, S27]。この際、センサ回路は3.3 Vセンサ電源レールからのみ供給を受ける必要があり、アクチュエータ用12 Vレールと混用してはいけません。'
  worked_examples:
  - アクチュエータ負荷計算：XM430-W350-Tを4台、1個の分岐に配置する場合、ピーク電流は4 * 2.3 A = 9.2 Aとなります [S14]。これは10
    Aヒューズの定格内であり、電源アダプタの11.5 A出力定格よりも小さいため安定した運用が可能です [S17, S26]。
  - FSR電圧分圧器の設計：センサと10 kΩ抵抗を直列接続した分圧器において、3.3 V入力時、センサが押圧を受けず高抵抗状態のとき、ADCは0 Vに近い値を出力し、強い力を受けて抵抗が急減するとADCは3.3
    Vに近い値を出力します [S15, S27]。
  lab:
    title: 電源分岐構成およびシステム基本通電試験
    steps:
    - 各MEAN WELLアダプタの陽(+)端子にATOインラインホルダと10 Aヒューズを接続し、3個の独立した分岐を生成する [S17, S25, S26]。
    - マルチメータをDC電圧モードに設定し、各分岐の出力電圧が12 Vであることを確認する。
    - OpenCRコントローラを3.3 Vセンサ電源レールに接続し、FSRセンサと10 kΩ抵抗を活用した分圧回路を構成する [S16, S27]。
    - コントローラーに電源を投入した後、各テンドンアクチュエーターが正常に通信しているかDYNAMIXEL Wizardで確認する [S14, S16]。
    safety:
    - 電源投入前、すべての結線をマルチメーターの抵抗モードではなく、目視と図面で再検証する。
    - 通電中はシステムへの接近を禁じ、必ず非通電状態(物理的なアダプター分離)で配線する。
    - 異常発熱・臭気・煙を感知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカーまたは認証されたupstream master disconnectで3個のアダプターの供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁ずる。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無電源計測確認後にのみ行う。
    - 保護メガネを常時着用し、可動範囲に身体の一部を入れない。
    deliverables:
    - 各分岐別の12 V測定記録写真
    - OpenCR ADCセンサーデータ取得コード
    - 独立分岐結線配線図
  assignment:
    title: ロボットシステム安全設計レポート
    deliverables:
    - 独立電源分岐構成図
    - アクチュエーターピーク電流対ヒューズ定格妥当性分析
    - FSR電圧分圧回路設計値算出式
    rubric:
    - アクチュエーター11台と電源分岐3個の割り当てが明確か？
    - 3.3 Vセンサレールと12 Vアクチュエータレールの分離が正しく説明されているか？
    - 電源遮断手順(物理的分離)が正確に記述されているか？
  quiz:
  - question: システム電源設計時、12 V出力端子の陽(+)極を並列接続することが禁止される理由は何か？
    choices:
    - 電圧が24 Vに上昇するため
    - アダプター間の電位差による逆電流の発生および独立分岐保護破壊の危険
    - アクチュエーターの通信速度が低下するため
    - ソフトウェアによるトルクオフ機能を使用できないため
    answer_index: 1
    explanation: 各電源アダプターは独立した分岐として運用されなければならず、出力端子を結合する場合、故障したり独立ヒューズによる安全保護機能が無効化される危険があります。
  - question: OpenCRのADCポートでFSR信号を読み取る際の適切な供給電圧は？
    choices:
    - 12 Vアクチュエータレール
    - 3.3 Vセンサレール
    - 24 V入力電源
    - 非接触式無線電力
    answer_index: 1
    explanation: OpenCRのADCは0~3.3 V範囲を使用し、センサ保護のために必ず専用の3.3 Vセンサレールから供給を受ける必要があります。
  - question: システム点検および整備のために電源を遮断する最も安全な方法は？
    choices:
    - ソフトウェア命令でアクチュエーターのトルクをオフにする
    - ヒューズを取り外す
    - 3個の電源アダプターを物理的に分離した後、電圧を計測する
    - コントローラーの電源スイッチのみを切る
    answer_index: 2
    explanation: ソフトウェアコマンドやヒューズは完全な無電源状態を保証しません。必ずアダプタを物理的に分離し、マルチメータで1 V未満であることを計測しなければなりません。
  completion_criteria:
  - 各分岐別の12 V電圧が正常範囲内であることをマルチメータで確認し、写真を提出する
  - FSRセンサーの接触力に応じたADC値の変化をコントローラーで確認し、正当な値を取得すること
  - 物理的電源遮断および電圧計測を通じた安全停止手順を理解し、遵守すること
  source_ids:
  - S1
  - S14
  - S16
  - S17
  - S25
  - S26
  - S15
  - S27
- id: m2
  slug: mechanism-design
  phase_id: p1
  title: ロボット機構設計
  estimated_hours: 15.0
  prerequisites:
  - m1
  objectives:
  - ロボットハンド機構設計の核心原理であるアンダーアクチュエート(Underactuated)システムを理解する。
  - テンドン駆動方式の動力学的特性と摩擦および伸長率管理の重要性を学習する。
  - 剛性と寸法安定性を考慮したエンジニアリング素材(PC-CF)の選択および設計技法を習得する。
  - 熱圧入インサートとベアリングを活用した精密組み立て設計の基礎を固める。
  theory_markdown: '## ロボット機構設計原理


    精巧な5本指ロボットハンド設計の核心は、駆動器(Actuator)数より多い自由度(DoF)を効率的に制御するアンダーアクチュエイテッドシステムの実現にあります
    [S11]。これにより、関節数を無理に増やさなくても多様な形状の物体を安定して把持できます [S3]。


    ### 腱駆動動動力学

    腱(Tendon)駆動は、遠隔モータの張力を関節に伝達する方式です。このとき、腱の物理的特性が制御の精密さを決定します。本課程では`Dyneema SK78`繊維を使用しており、これは直径1.5
    mmで230 daNの高い破断荷重に耐え、作動伸率(Working stretch)が1%未満と非常に低いため繰り返し精度が優れています [S18]。


    ### 素材および構造設計

    ロボットハンドのフレームとリンクには高い剛性と寸法安定性が求められます。FDM方式の`Prusament PC Blend Carbon Fiber`は炭素繊維が含まれたPC素材で、高温耐性と優れた強度を提供し、エンジニアリンググレードの部品製作に適しています
    [S21]。組み立て時、繰り返しの分解と再組み立てのために直接ねじ山を締結する代わりに、M3真鍮熱圧入インサート(外径4.4 mm、長さ5.8 mm)を使用してねじ山の耐久性を確保します
    [S23]。回転軸には無給油ポリマースリーブベアリング(JSM-0810-10)を使用し、メンテナンス不要で滑らかな回転と摩擦管理を実現します [S19]。'
  worked_examples:
  - 例題1：腱張力伝達分析。腱の作動伸率が1%の場合、100 mmの距離で1 mmの誤差が発生します。精密制御のためにはアクチュエータの電流フィードバックとセンサデータを活用した閉ループ制御が必須です
    [S14]。
  - 例題2：インサート締結部設計。PC-CF出力物にHTBI-M3-BRインサートを挿入する際、推奨パイロットホール直径である4 mmをCAD設計時に必ず遵守しなければ、遊びのない組み立ては不可能です
    [S23]。
  lab:
    title: ロボット関節およびテンドンモジュールの組み立て実習
    steps:
    - 保護メガネを着用し、作業台を整理します。
    - PC-CF出力物のパイロットホールの状態を確認し、必要に応じて加工します。
    - 熱圧入インサートをはんだごてで加熱し、出力物に垂直に圧入します。
    - igusベアリングを手首および関節ハウジングに装着します。
    - アルミシャフトをベアリングに通し、ガタを確認します。
    - Dyneemaテンドンをキャプスタンに巻き、組み立てられた関節に固定します。
    safety:
    - はんだごて使用時は高温に注意し、保護メガネを必ず着用します。
    - テンドン張力試験中、テンドン破断時の跳ね返り事故を防ぐため、可動範囲に手を入れません。
    - システム組み立て完了後、電源投入前に物理的分離状態を計測器で確認します。
    deliverables:
    - 組み立てられたロボット関節モジュール
    - ベアリングおよびシャフトのガタ測定記録
  assignment:
    title: 5知ロボットハンド機構設計プロジェクト
    deliverables:
    - ロボットハンド全体のCAD組み立て図
    - 部品リスト(BOM)および選定根拠レポート
    - テンドン経路最適化設計図
    rubric:
    - 使用された部品が規格(BOM)を遵守しているか？
    - 熱圧入インサートおよびベアリング設計が適切か？
    - 機構的な干渉なしに自由な動きが実現されているか？
  quiz:
  - question: テンドン駆動でDyneema SK78を使用する主な理由は何ですか？
    choices:
    - 伸長率が大きく、価格が安いため
    - 低い伸長率と高い破断荷重を提供し、精度の確保が可能なため
    answer_index: 1
    explanation: Dyneema SK78は伸長率が1%未満と非常に低く、ロボット制御の繰り返し精度を高めてくれます [S18]。
  - question: PC-CF出力物に繰り返しのねじ組み立てをするために推奨される方法は？
    choices:
    - 出力物に直接ねじ山を加工する
    - 真鍮熱圧入インサートを挿入する
    answer_index: 1
    explanation: 熱圧入インサートはPC-CFのようなエンジニアリングプラスチックにおいて、ねじ山の耐久性を大幅に向上させます [S23]。
  completion_criteria:
  - 各部品の規格と仕様をBOMに合わせて文書化完了
  - 組み立て完了した関節モジュールの機能的な動きを確認
  - 安全指針を遵守し、実習を完遂した
  source_ids:
  - S3
  - S11
  - S18
  - S21
  - S23
  - S19
  - S14
- id: m3
  slug: cad-modeling
  phase_id: p1
  title: 3D CADモデリング
  estimated_hours: 15.0
  prerequisites:
  - m2
  objectives:
  - 3D CADモデリングの設計制約事項と製造プロセス(FDM)を理解する。
  - 構造的な剛性を高めるPC-CFフィラメントの活用技法を学習する。
  - 熱圧入インサートとベアリング公差を考慮した精密組み立て設計を行う。
  theory_markdown: '### 3D CADモデリングと製造設計


    精巧な5本指ロボットハンド製作のためには、FDM方式の積層造形特性を考慮した設計(Design for Additive Manufacturing, DfAM)が必須です。炭素繊維が含まれたPC-CFフィラメントは機械的剛性と寸法安定性が優れており、精密リンクの製作に適しています
    [S21]。


    #### 核心設計考慮事項

    1. **公差管理およびベアリング装着**：8mm精密アルミニウムシャフトとigus JSM-0810-10ベアリング使用時、ハウジングボア公差を設計に反映しなければなりません。ベアリングは圧入(Press-fit)方式で固定されるため、ボア内径はベアリング外径(10mm)より微細に小さく設計し、強固な組み立てを誘導します
    [S19, S20]。

    2. **締結部品設計**：PC-CF出力物は直接ねじ山を切るには不適合です。繰り返しの分解・組み立ての再現性のため、HTBI-M3-BR真鍮熱圧入ねじ山インサートを使用します。そのために設計時、4mm直径のパイロットホールを配置しなければなりません
    [S23]。

    3. **構造最適化**：腱駆動方式では張力によりリンクが変形する可能性があります。応力が集中する関節部位は壁厚を確保し、積層方向が引張強度に有利になるようモデルを配置します。


    ### システム統合および安全

    本プロジェクトの電気システムは3個の独立した12V電源分岐で構成されます。アクチュエータ駆動時、過電流保護のために分岐ごとに10A ATOFヒューズを必ず装着しなければならず、アクチュエータは4/4/3台の比率で分配してピーク電流を管理します
    [S17, S26]。センサ信号取得時、FSR 402センサは3.3Vセンサ電源レールから分圧抵抗を通じてADC入力値を生成しなければならず、12Vアクチュエータ電源とは完全に分離されなければなりません
    [S15, S16, S27]。'
  worked_examples:
  - '**インサートホール設計**: Accu-componentsのM3インサート外径が4.4mmであるため、3D CADにおいて出力物に4.0mmのパイロットホールをモデリングします
    [S23]。出力後、インサートを加熱して挿入すれば真鍮素材がプラスチック内部に安定して収まり、強固なM3雌ねじが形成されます。'
  - '**ベアリングハウジング公差**: igusベアリングJSM-0810-10を使用するとき、10mmハウジング穴は圧入後、内径が8mm精密シャフトとガタなく密着するように設計します。広すぎると軸のガタが発生し、狭すぎるとベアリングが破損するため、試験出力を行って公差を調整します
    [S19, S20]。'
  lab:
    title: 精密リンク設計および組み立て検証
    steps:
    - 提供されたテンドン経路と関節メカニズムを3D CADで設計しシミュレーションする。
    - PC-CFフィラメントをFDMプリンターにロードし、硬化鋼ノズルを使用して試片を出力する [S21]。
    - 出力物に4mmパイロットホールを確認した後、熱圧入インサートを挿入する [S23]。
    - 8mmアルミシャフトとベアリングを組み立て、リンクの回転自由度を確認してガタを測定する [S19, S20]。
    - マルチメーターを使用して独立した3個の電源分岐のヒューズホルダー接続状態を確認し、通電前にヒューズが正常に装着されているか検査する [S25, S26]。
    safety:
    - 耐衝撃用保護メガネを常時着用する。
    - 熱圧入作業時は火傷に注意し、換気の良い場所で作業する。
    - 電源投入時は必ず固定治具を使用し、回転部位に手を絶対に入れない。
    - システムを整備または接近するときは、必ず3個の電源アダプターを物理的に分離し、マルチメーターで1V未満であることを確認する。
    deliverables:
    - ロボットハンド全体組み立て3D CADモデルファイル
    - インサートおよびベアリング公差調整を含む設計検証レポート
    - 電源分岐別の独立接続状態およびヒューズ装着検査写真
  assignment:
    title: ロボットハンド機構設計および統合配線計画
    deliverables:
    - すべてのリンクと関節が含まれた詳細3D CAD設計ファイル
    - BOMと設計一致性の確認レポート
    - 3個の独立分岐およびヒューズ配置図が含まれた配線図
    rubric:
    - 3D設計が積層製造公差と真鍮インサート規格(4.4mm OD)を遵守しているか？
    - ベアリングハウジングとシャフト間のガタが適切か？
    - 電気配線図で12Vアクチュエーター電源とセンサー回路が分離されており、各分岐ごとに10Aヒューズが設計されているか？
  quiz:
  - question: PC-CFフィラメントで出力されたモデルにねじ山が必要な場合、最も適切な方法は？
    choices:
    - 出力時、ねじ山を直接モデリングして出力する。
    - 真鍮熱圧入インサートを加熱して挿入する。
    answer_index: 1
    explanation: PC-CF素材に直接ねじ山をモデリングするよりも、繰り返し組み立ての再現性のために真鍮熱圧入インサートを使用することが推奨されます
      [S23]。
  - question: 3個の独立した12V電源分岐を構成する際の注意事項は？
    choices:
    - アダプターの陽(+)出力を並列に接続して電流容量を増やす。
    - 各分岐は独立した10Aヒューズを通じて過電流を保護する。
    answer_index: 1
    explanation: 独立電源アダプターの陽(+)出力は並列接続が禁じられ、各分岐別に独立ヒューズを装着して保護しなければなりません [S17, S26]。
  - question: FSR力覚センサー駆動のための電圧源は何を使用しなければならないか？
    choices:
    - OpenCRの3.3Vセンサー電源レール
    - 12Vアクチュエーター電源レール
    answer_index: 0
    explanation: FSR分圧回路は必ず3.3Vセンサー電源レールから電力を供給されなければならず、アクチュエーター電源とは分離されていなければなりません
      [S16]。
  completion_criteria:
