- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D プリントおよび部品加工
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 炭素繊維補強 PC フィラメント(PC-CF)を使用した部品製作および出力設定最適化の理解
  - 熱圧入インサート(Heat-set insert)およびスリーブベアリングの精密組み立て公差管理の習得
  - 腱駆動メカニズムのための Dyneema ライン取り扱いおよびキャプスタン設計構造の理解
  - ロボット構造物の寸法安定性と剛性確保のための加工および締結技法の熟知
  theory_markdown: '### 3D プリントおよび部品加工理論


    #### 炭素繊維強化エンジニアリング素材 (PC-CF)

    PC(Polycarbonate)は高剛性と耐熱性に優れており、ここに炭素繊維が添加された PC-CF フィラメントは剛性を極大化するため、構造部品の製作に適している
    [S19]。ただし、炭素繊維の摩耗性により、必ず硬化鋼ノズルを使用しなければならず [S19]、285°C 前後の高温出力が必要である [S19]。


    #### 精密組み立てのためのインサートおよび締結

    プラスチック出力物に反復的な組み立て・分解を可能にするため、熱圧入ネジ山インサートを使用する [S21]。M3 インサートの場合、4.0mm 直径のパイロットホールを
    CAD 設計時にあらかじめ配置し、正確な位置に定着させなければならない [S21]。また、無給油ポリマー・スリーブベアリング(iglide J)は 8mm
    アルミニウムシャフトと組み立てられる際、圧入後に内径が最適な隙間を持つよう設計されており [S17]、軸径 8mm との公差管理が必須である [S17, S18]。


    #### 腱駆動構造

    Dyneema SK78 繊維は 1.5mm 直径で 230 daN の高い破断荷重と 1% 未満の伸度を示し [S16]、鋼鉄ケーブルの優れた代替材である。腱は回転軸から屈曲が繰り返されるため、キャプスタン端をラウンド処理して摩擦による断線を防止する構造設計が重要である。'
  worked_examples:
  - '例題 1: PC-CF フィラメントノズルの選定 - 炭素繊維の高い摩耗度を考慮するとき、Brass(真鍮)ノズルは急速に摩耗して出力品質低下とノズル詰まりを誘発するため、必ず硬化鋼(Hardened
    steel)ノズルを選択しなければならないことを確認 [S19]。'
  - '例題 2: インサートホール設計 - Accu HTBI-M3-BR インサートの外径が 4.4mm だが、公式推奨穴直径は 4.0mm であるため [S21]、CAD
    設計時に穴直径を 4.0mm に固定して熱圧入時にプラスチックがインサート・ナーリング(knurling)の間へ十分に食い込むようにする [S21]。'
  lab:
    title: 指構造物製作および組み立て実習
    steps:
    - 硬化鋼ノズルを装着した FDM 3D プリンタで炭素繊維 PC フィラメント出力環境設定 [S19]。
    - 指リンクと手のひらフレーム出力後、サポート除去および表面整理。
    - 4.0mm パイロットホールに熱圧入インサートをホットツールで垂直定着 [S21]。
    - IGUS 精密アルミニウムシャフトをベアリング規格に合わせて切断および端面モデリング [S18]。
    - スリーブベアリングをハウジングに圧入後、シャフトを挿入して隙間を確認 [S17]。
    - M3 キャップスクリューで構造物およびセンサブラケットを締結 [S20]。
    safety:
    - 高温のノズル(285°C)およびベッド(110°C)による火傷に注意 [S19]。
    - 出力物後加工および面取り時は保護メガネ着用必須。
    - インサート加熱時に煙が発生する可能性があるため、換気施設を稼働。
    - 電源投入前にすべての機械的締結状態を確認。
    deliverables:
    - 製作された 5 指ロボットハンド構造物(リンク、手のひら)。
    - 熱圧入インサートの垂直度およびベアリングの隙間測定記録。
    - 最終締結部肉眼検査完了レポート。
  assignment:
    title: ロボットハンド製作精度検証
    deliverables:
    - 完成した構造物の CAD データと実寸法測定比較表
    - 組み立て公差管理計画書
    - 腱ラウティング構造の摩擦低減設計説明書
    rubric:
    - 熱圧入インサートの垂直定着の有無 (上/中/下)
    - シャフト・ベアリング組み立て後の円滑な回転運動の有無 (合格/不合格)
    - BOM に明示された部品定格およびモデル規格遵守の有無 [B10, B11, B12, B13, B14]
  quiz:
  - question: PC-CF フィラメント使用時、硬化鋼ノズルを使用しなければならない主な理由は？
    choices:
    - 炭素繊維の摩耗性による真鍮ノズルの急激な摩耗防止
    - フィラメントの融点が低く、一般ノズルでは出力不可
    - 出力物の表面光沢を増大させるため
    - 押出速度を高めるため
    answer_index: 0
    explanation: 炭素繊維は非常に高い摩耗性を持ち、一般的な真鍮ノズルを急速に破損させるため、硬化鋼ノズルが必須です [S19]。
  - question: M3 熱圧入インサート(Accu HTBI-M3-BR)使用時、推奨されるパイロットホール直径は？
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: 公式データシートで推奨される穴直径は 4.0mm です [S21]。
  completion_criteria:
  - すべての構造用部品が FDM 3D プリンタで製作完了 [B10]
  - 熱圧入インサートがすべての指定された穴に正確に定着 [B14]
  - アルミニウムシャフトとスリーブベアリングの組み立て隙間が基準値を満足 [B11, B12]
  - 締結時、明示された M3 規格のキャップスクリューが正しく使用された [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: ベアリングおよび締結部品設置
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 精密ロボットハンド製作のためのベアリングおよびシャフトの機械的公差と設置原理を理解する。
  - 熱圧入インサート(Heat-set insert)を使用して、エンジニアリングプラスチック部品の締結強度を確保する方法を習得する。
  - 適切なトルクと締結規格を使用して組み立て隙間を最小化する。
  theory_markdown: '### ベアリングとシャフトの公差管理

    精密ロボット関節の円滑な動きと剛性確保のために iglide® J スリーブベアリング(JSM-0810-10)と 8 mm アルミニウム精密シャフト(AWMP-08)を使用する。スリーブベアリングはハウジングに圧入(press-fit)されるとき内径が調整されるように設計されており、ハウジングの推奨内径公差を遵守することが核心である
    [S17, S18]。隙間が発生すると関節の精度が低下し、逆に狭すぎると摩擦力が増加して駆動機(DYNAMIXEL XM430)の電流効率を低下させる。


    ### 熱圧入インサート設置

    PC-CF(炭素繊維補強 PC)出力物は、金属ネジを直接締結する場合、材質の特性上ネジ山が摩耗しやすい。これを防止するために真鍮材質の熱圧入インサート(HTBI-M3-BR)を使用する
    [S21]。インサートは 4.0 mm パイロットホールに挿入後、熱を加えて周辺樹脂を溶かして締結することで、反復的な分解組み立てにも高い機械的強度を維持する
    [S21]。この際、インサートが傾くと組み立てられたリンクの整列がずれるため、垂直維持が必須である。'
  worked_examples:
  - '例示 1: ハウジング内径確認 - iglide® JSM-0810-10 ベアリングの外径は 10 mm である。したがってハウジングボアは 10 mm
    に合わせて設計されるべきであり、インサート挿入時、パイロットホール 4.0 mm を守らなければインサートが空転したりハウジングが破損したりする可能性がある
    [S17, S21]。'
  - '例示 2: M3 ネジ組み立て - M3x10 キャップスクリューは 2.5 mm 六角レンチを使用して締結し、過度なトルクはインサート周辺樹脂にクラックを誘発する可能性があるため、「これ以上回らない時点」で最小限の力で固定する
    [S20]。'
  lab:
    title: ロボットハンド関節精密組み立て
    steps:
    - 1. PC-CF 出力物ハウジングに 4.0 mm パイロットホールが綺麗か確認し、インサートを垂直に整列する。
    - 2. はんだごてを適正温度に加熱し、インサートを垂直にゆっくり押してハウジング表面と平行になるように圧入する。
    - 3. iglide® ベアリングをボアに圧入し、8 mm アルミニウムシャフトを挿入して隙間と抵抗を確認する。
    - 4. M3 ネジを使用してリンク間の締結を完了し、関節を動かして摩擦が均一か検証する。
    safety:
    - はんだごては高温のため火傷に注意し、加熱後直ちにスタンドへ戻すこと。
    - インサート圧入時に発生する微細な粉塵は吸入しないよう、換気を徹底すること。
    - 保護メガネを必ず着用して作業を進めること。
    - 異常発熱・異臭・煙を検知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証された upstream master disconnect
      により 3 個のアダプタの供給電源を遮断した後に避難すること。危険区域外で動作可能な upstream 遮断手段がない場合、システムの通電を禁じる。トルクオフは電源遮断の代替にはならない。整備・接近は計画停止後の物理的分離および無電源計測確認の後でのみ実行すること
    deliverables:
    - 関節別摩擦試験ログ
    - インサート垂直整列確認写真
    - 組み立てられたリンクの自由度および隙間測定記録
  assignment:
    title: 組み立て公差および締結力分析レポート
    deliverables:
    - 関節組み立て順序およびトルク管理計画書
    - 隙間発生時の解決方案(Shim 使用または公差修正)記述
    - 組み立て完了したロボットハンドリンクの把持試験予備データ
    rubric:
    - インサート挿入の垂直度が明確に記述されているか？
    - ベアリングとシャフトの公差概念を正しく説明しているか？
    - 組み立て段階での安全守則を遵守したか？
  quiz:
  - question: iglide® J ベアリングがハウジングに圧入された後、内径が調整される理由は何であるか？
    choices:
    - ベアリング材質の弾性のため、圧入時に内径が自動的に広がる。
    - 圧入過程においてベアリング内径がハウジングボアの公差に合わせて精密に調整されるよう設計されたためである。
    - 圧入前の内径は常に基準値より小さく制作されるためである。
    answer_index: 1
    explanation: iglide® スリーブベアリングは圧入前の基準値より大きい状態で制作され、正しいハウジングボアに圧入された時に設計された公差内の内径を持つよう設計されています
      [S17]。
  - question: PC-CF 出力物に真鍮熱圧入インサートを使用する際、適切なパイロットホールサイズは？
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: データシートによると、HTBI-M3-BR インサートの推奨パイロットホールサイズは 4.0 mm です [S21]。
  completion_criteria:
  - 組み立てられた 5 個の指関節の摩擦抵抗が均一であることを確認し、測定記録提出。
  - すべてのインサートが PC-CF ハウジングと水平をなすか、肉眼および寸法検査完了。
  - 組み立て中の安全守則を遵守したことを誓約し、作業記録簿提出。
  source_ids:
  - S17
  - S18
  - S20
  - S21
- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: 配線および安全な電源分離構築
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - アクチュエータ駆動のための独立的 12 V 電源分岐構成方法を理解する。
  - 過電流保護のための ATOF ヒューズの役割と選定原理を学習する。
  - 安全な電源管理および物理的遮断プロトコルを習得する。
  - OpenCR コントローラおよび FSR センサの安全な電圧分圧回路を構成する。
  theory_markdown: '## 安全な配線および電源分離の原理


    5台のロボットハンドシステムは多数の高トルクアクチュエータを使用するため、効率的かつ安全な電源分配が不可欠です。本プロジェクトは電源アダプタ11個を使用してアクチュエータを4台／4台／3台単位で分離配置し、これは各分岐の電流負荷を分散させ、電源安定性を高めるためです
    [S15]。


    ### 1. 電源独立性の確保

    各アダプタの正（＋）出力は独立した分岐として維持される必要があり、任意にまとめたり束ねたりする行為は絶対禁止です。[S15]に明示されたアダプタの定格出力電流（11.5
    A）内でアクチュエータピーク電流（XM430-W350-T 1台あたり2.3 A）を収容するように設計します [S11]。4台単位の分岐のピーク電流合計は9.2
    Aであり、アダプタの連続出力許容範囲内にあります。


    ### 2. 過電流保護（Protection Coordination）

    分岐ごとに10 AのATOFヒューズを配置し、配線やアクチュエータエラー時の過電流からシステムを保護します [S25]。ATOFヒューズは定格電流の110％～135％レベルで作動するため、ピーク電流9.2
    Aに対して安定した保護が可能です。ただし、ヒューズ選定は必ず製造元が提供する「Time-Current Curve（時間-電流特性曲線）」を参照しなければならず、負荷電流が低いからといって安全が保障されるわけではありません
    [S25]。


    ### 3. 制御回路の分離

    DYNAMIXELポート内蔵型OpenCR制御ボードを使用し、複雑な外部ブリッジ回路を排除することで再現性を高めます [S13]。FSR力センサはADC入力へと電圧を変換するため、3.3
    Vセンサレールから供給される分圧回路を使用し、12 Vアクチュエータ電源とは電気的に分離される必要があります [S13]。


    ### 4. 作業安全規則

    ベンチプロトタイプは認証された機械安全システムではないため、整備や修正作業前には必ず3個の電源アダプタを物理的に分離し、各分岐の残留電圧が1 V未満であることをマルチメーターのDC電圧モードで計測確認しなければなりません
    [S7]。'
  worked_examples:
  - 異常発熱・異臭・煙を検知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証された upstream master disconnect
    により 3 個のアダプタの供給電源を遮断した後に避難すること。危険区域外で動作可能な upstream 遮断手段がない場合、システムの通電を禁じる。トルクオフは電源遮断の代替にはならない。整備・接近は計画停止後の物理的分離および無電源計測確認の後でのみ実行すること
    [S11] [S25]
  - '例題 2: FSR ADC 回路電圧 - OpenCR の 3.3 V センサレールを使い 10 kΩ 分圧抵抗と FSR 402 を接続します [S13,
    S26]。センサ信号電圧は 0～3.3 V 範囲内にあるべきであり、この回路は 12 V アクチュエータ電源回路と物理的/電気的に分離して保護します。'
  lab:
    title: 電源分岐ハーネス製作および安全点検
    steps:
    - 各アダプタ出力ラインに ATO インラインヒューズホルダーをはんだ付けし、10 A ATOF ヒューズを挿入する [S24, S25]。
    - Molex Micro-Fit 3.0 コネクタを使用してアクチュエータおよびセンサ接続ハーネスを製作する [S14]。
    - OpenCR ボードと各アクチュエータを 3 個の分岐に分配して配線し、各電源アダプタへ接続する [S13]。
    - 電源投入前に、各アダプタ出力端子の絶縁状態をマルチメータ抵抗モードで確認する。
    - 電源投入後、電圧モードで各分岐が 12 V であることを確認し、遮断時には必ず 3 個のアダプタをすべて除去する。
    safety:
    - 整備前には 3 個の電源アダプタを物理的に分離すること。
    - 残留電圧が 1 V 未満であることをマルチメータで確認した後に部品を交換すること。
    - 電源投入中は可動範囲内に手を入れないこと。
    - すべての結線部は絶縁処理し、はんだ付け時は保護メガネを着用すること。
    deliverables:
    - 製作された電源分岐ハーネス写真
    - 各分岐別測定電圧記録用紙
    - 配線図レビュー確認書
  assignment:
    title: 安全配線設計レポート
    deliverables:
