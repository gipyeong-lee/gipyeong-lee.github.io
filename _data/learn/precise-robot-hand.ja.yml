modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: ロボット機構学基礎
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - ロボット機構学の基本定義と剛体変換(Rigid-body transformation)の概念を理解する。
  - 座標系変換と回転行列を使用して、ロボットの位置と方向を数学的に記述する方法を習得する。
  - 5 指ロボットハンド設計のための機構学的基礎理論を習得し、解析的アプローチを習得する。
  theory_markdown: '## ロボット機構学の基礎


    ロボット機構学は、ロボットの運動を力やトルクを考慮せず、位置、速度、加速度の側面から扱う学問です [S1]。ロボットハンドのようなマニピュレータ設計の出発点は、各関節の状態を空間上の座標として記述することです。


    ### 1. 剛体変換 (Rigid-body Transformation)

    ロボットの各リンクは剛体とみなされ、ある座標系から他の座標系への変換は、回転(Rotation)と移動(Translation)の組み合わせで表されます。3
    次元空間において、回転行列(Rotation Matrix) $R$ は直交行列であり、これを通じて二つの座標系間の方向を定義します [S1]。


    ### 2. 順機構学 (Forward Kinematics)

    順機構学は、関節の変数(角度または位置)を知っているとき、ロボット先端(End-effector)の位置と方向を計算する過程です。5 指ロボットハンドでは、指の関節角度($\theta_1,
    \theta_2, \dots, \theta_n$)を通じて指先位置を求めます。


    ### 3. 逆機構学 (Inverse Kinematics)

    逆機構学は、希望する指先の位置を目標値に設定したとき、これを達成するための各関節変数を求める過程です。非線形方程式で構成されており、解が存在しなかったり、多重解が発生したりすることがあります
    [S1]。'
  worked_examples:
  - '例題 1: 2 次元平面において、1 個の回転関節(Rotation Joint)を持つロボットリンクの先端位置 $(x, y)$ を求めよ。関節角度が
    $\theta$ でリンク長が $L$ のとき、$x = L \cos(\theta)$, $y = L \sin(\theta)$ である [S1]。'
  - '例題 2: $x$ 軸に対して $\theta$ だけ回転する 2 次元回転行列 $R$ を記述せよ。$R = \begin{bmatrix} \cos(\theta)
    & -\sin(\theta) \\ \sin(\theta) & \cos(\theta) \end{bmatrix}$ である [S1]。'
  lab:
    title: 座標系変換シミュレーションおよび基礎機構学解析
    steps:
    - 機構学解析ソフトウェアを使用して、2 リンク平面マニピュレータモデルを作成する。
    - 関節角度を変化させながら、先端位置の軌跡を確認する。
    - 逆機構学計算式を手動で導出し、シミュレーション結果と比較する。
    safety:
    - コンピュータ作業時は画面の明るさを調整し、定期的に休憩を取ること。
    - 本実習はシミュレーションベースであるため、ハードウェアへの通電は要求しない。
    deliverables:
    - 機構学解析過程を含んだ要約レポート
    - 軌跡シミュレーション結果画像
  assignment:
    title: 5 指ロボットハンド関節構造機構学モデリング
    deliverables:
    - ロボット指 1 本に対する順機構学方程式の導出成果物
    - 関節角度変化による指先位置変化予測データ
    rubric:
    - 回転行列の数学的正確性
    - 順機構学方程式の物理的妥当性
    - レポートの論理的構成
  quiz:
  - question: ロボット機構学において、力やトルクを考慮せず運動のみを記述する学問は何か？
    choices:
    - 動力学(Dynamics)
    - 機構学(Kinematics)
    - 制御理論(Control Theory)
    - 材料力学(Material Mechanics)
    answer_index: 1
    explanation: 機構学は、力とトルクを除いた位置、速度、加速度中心の運動論です [S1]。
  - question: 3 次元空間において、二つの座標系間の方向を定義する行列は？
    choices:
    - 回転行列(Rotation Matrix)
    - 質量行列(Mass Matrix)
    - 剛性行列(Stiffness Matrix)
    - 減衰行列(Damping Matrix)
    answer_index: 0
    explanation: 回転行列は、二つの座標系間の方向を数学的に変換する直交行列です [S1]。
  completion_criteria:
  - 理論講座の学習完了
  - 機構学解析結果レポートの提出
  - 理論クイズで 100 点達成
  source_ids:
  - S1
- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: 腱駆動メカニズム設計
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - 腱駆動メカニズムの基本力学構造と関節模倣の原理を理解する。
  - 精巧なロボットハンドのための腱材料(Dyneema SK78)の特性を学習する。
  - 腱の張力伝達経路と、キャプスタン設計時の摩擦および摩耗防止法を習得する。
  - アクチュエータのストールトルクと、腱駆動時の機械的利得を計算する。
  theory_markdown: '## 腱駆動メカニズムの基礎


    腱駆動(Tendon-driven)システムは、遠隔地に位置するアクチュエータから、腱(紐)を介して関節へ引張力を伝達し駆動する方式である [S9]。生物学的な指の腱構造を模倣し、アクチュエータを手のひらや前腕へ移動させることで、指自体の質量を減らし精巧な動きを実現できる
    [S10]。


    ### 1. 腱の選択および張力伝達

    本設計では高強度低伸度繊維である Dyneema SK78 を使用する [S16]。この材料は直径 1.5 mm で 230 daN(約 230 kgf)の破断荷重を有し、稼働伸度が
    1% 未満であり精密な位置制御に適している [S16]。


    ### 2. 機械的利得と駆動機の選定

    XM430-W350-T スマートアクチュエータは、ストールトルク 4.1 N·m を提供する [S11]。腱は回転軸からキャプスタン半径を通じて力を変換するため、アクチュエータのトルク出力は腱の張力に置換される。システム全体は
    11 台のアクチュエータを使用し、ピーク電流の合計は約 25.3 A に到達し得る [S11]。したがって、これを安定して供給するために合計 3 個の独立した
    12 V 電源分岐を構成し、各分岐は独立した 10 A ヒューズ保護を通じて過電流を防止する [S15, S24, S25]。


    ### 3. 安全および保護設計

    各 12 V 電源分岐は独立したヒューズを通じて運用される [S15, S24]。3 個の電源アダプタはそれぞれ 11.5 A 定格で、合計電流容量は 34.5
    A に達し、システムピーク電流である 25.3 A を十分に収容する [S11, S15]。分岐合計定格がアクチュエータ総ピーク電流を上回るように設計し、運用安全性を確保する。'
  worked_examples:
  - '例題 1: 腱駆動時の張力計算

    アクチュエータトルク(τ)が 1 N·m でキャプスタン半径(r)が 0.01 m のとき、腱張力(T)は T = τ/r = 1/0.01 = 100 N
    である。Dyneema SK78 の破断荷重 230 daN(約 2300 N) に対する安全率を考慮して設計する [S16]。'
  - '例題 2: 電源分岐の分配および保護

    アクチュエータ合計 11 台のストール電流合計は 25.3 A である [S11]。これを 3 個の分岐に 4 台、4 台、3 台と配分すれば、各分岐の最大負荷はそれぞれ
    9.2 A、9.2 A、6.9 A である。4 台アクチュエータ分岐の理論ピーク 9.2 A は 10 A ヒューズおよび 11.5 A アダプタ定格より低いが、この数値だけで安全性や動作順序を保証するわけではない。ヒューズメーカーの時限・電流曲線とアダプタの
    OCP 特性を併せて検討し、保護協調を確認する [S24, S25]。'
  lab:
    title: 腱張力および関節摩擦測定実習
    steps:
    - 提供されたリンクとベアリングを使用して指関節モデルを組み立てる。
    - 腱を連結し、テンショナーを使用して初期張力を設定する。
    - マルチメータを DC 電圧モードに設定し、各分岐の 12 V 電源アダプタ出力を物理的に分離して確認する。
    - 電源投入前に、関節の回転摩擦力を手動で測定して記録する。
    safety:
    - 整備・接近前には、3 個の絶縁電源アダプタを物理的に分離し、マルチメータで 1 V 未満の DC 電圧であることを確認する。
    - 電源投入中は、絶対に指の可動範囲に接近しないこと。
    - 耐衝撃作業用保護メガネを必ず着用すること。
    deliverables:
    - 関節回転角度に応じた腱張力測定データ
    - 摩擦力分析レポート
    - 最終安全計測記録
  assignment:
    title: 5 指ロボットハンド腱経路設計
    deliverables:
    - ロボット指腱経路 CAD 図面
    - 腱摩擦および損失計算書
    - 分岐別電源負荷配分およびヒューズ保護設計図
    rubric:
    - 腱経路が屈曲部の摩擦を最小化するように設計されているか？
    - Dyneema SK78 の物理的特性が考慮されているか？
    - 3 個の電源分岐の負荷配分がアクチュエータのストール電流を適切に反映しているか？
    - ヒューズおよび電源短絡防止設計が BOM 仕様を遵守しているか？
  quiz:
  - question: Dyneema SK78 腱を使用する際の主な利点は何か？
    choices:
    - 高い伸度による衝撃吸収
    - 非常に低い稼働伸度と高い破断荷重
    - 金属より軽い重量と低い引張強度
    - 電気伝導性
    answer_index: 1
    explanation: Dyneema SK78 は伸度が 1% 未満と非常に低く、位置制御の精度を高める、非常に高い破断荷重を持つ高性能繊維です [S16]。
  - question: 3 個の 12 V 電源アダプタ(各 11.5 A)を使用する理由として適切なものは？
    choices:
    - すべてののアクチュエータを一つの電源で駆動するため
    - 電圧を 36 V に増幅してトルクを高めるため
    - アクチュエータの総ピーク電流を分散収容し、個別分岐ヒューズで保護するため
    - 電源ノイズを除去するため
    answer_index: 2
    explanation: 合計 11 台のアクチュエータのピーク電流を安全に分散し、各分岐を 10 A ヒューズで保護してシステムの過電流の危険を低くするためです
      [S11, S15, S25]。
  completion_criteria:
  - すべての実習データと図面が最終レポートに含まれていなければならない。
  - 物理的な電源分離後、3 個の分岐の DC 電圧が 1 V 未満であることを計測により立証しなければならない。
  - 腱経路設計において、キャプスタン摩擦を考慮した解析が含まれていなければならない。
  source_ids:
  - S9
  - S10
  - S16
  - S11
  - S15
  - S24
  - S25
- id: M3
  slug: actuator-controller-selection
  phase_id: P1
  title: 駆動機およびコントローラの選定
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - DYNAMIXEL XM430-W350-T アクチュエータの定格電圧、電流、および通信特性を理解する。
  - OpenCR 1.0 コントローラの DYNAMIXEL ポート構成および 12V 電源分離構造を熟知する。
  - FSR 402 センサと 10kΩ 抵抗を用いた電圧分圧回路を設計する。
  - システム電力要件を計算し、独立分岐ヒューズ保護設計を樹立する。
  theory_markdown: '### 駆動機およびコントローラシステム設計理論


    #### 1. アクチュエータ選定および電力特性

    ロボットハンドの精密駆動のために DYNAMIXEL XM430-W350-T を使用する。このアクチュエータは 12V 定格電圧で動作し、ストール(Stall)電流は
    2.3A である [S11]。ロボットハンド全体は 11 個のアクチュエータで構成されるため、全ストール電流合計は約 25.3A に達する。したがって安定した駆動のために独立した電源供給体系が必要である。


    #### 2. コントローラアーキテクチャ

    OpenCR 1.0 は 216MHz ARM Cortex-M7 プロセッサを搭載しており、リアルタイム制御に適している [S13]。このコントローラは、12V
    アクチュエータ電源とロジック/センサ電源を物理的に分離できる構造をサポートする。FSR センサのようなアナログ入力は 0～3.3V 範囲内で処理しなければならないため、センサ電圧分圧回路は必ず
    OpenCR の 3.3V センサレールから供給されなければならない [S13]。


    #### 3. 過電流保護および電源分岐設計

    138W 出力の MEAN WELL GST160A12-R7B アダプタ 3 個を使用する [S15]。各アダプタの定格電流は 11.5A であり、これを通じて独立した
    12V 分岐を 3 個生成する。各分岐には 10A ATOF ヒューズをインラインで装着し、過電流発生時に回路を保護する [S24, S25]。ヒューズは定格電流
    11.5A より低く設定し、保護協調を達成する。


    #### 4. センサ信号取得

    FSR 402 は、圧力が上昇すると抵抗が減少する特性を持つ [S12]。これを 10kΩ 固定抵抗と電圧分圧器に接続して力の変化を電圧信号に変換し、OpenCR
    の 12bit ADC ポートへ入力する [S12, S13, S26]。'
  worked_examples:
  - '例題 1: 分岐あたりの最大電流確認。分岐一つに 4 個の XM430 アクチュエータを接続する場合、ストール電流の合計は 4 * 2.3A = 9.2A
    である。これはアダプタの 11.5A 定格およびインラインヒューズの 10A 定格を満たし、安全な範囲を維持する [S11, S15, S25]。'
  - '例題 2: FSR 分圧回路電圧計算。3.3V 供給電圧下で FSR 抵抗が R_fsr のとき、ADC 入力電圧 V_adc = 3.3 * (10k
    / (10k + R_fsr)) V となる。センサ範囲(0.2N～20N)に応じて抵抗変化を確認し、0～3.3V 範囲を超えないように補正する [S12,
    S13, S26]。'
  lab:
    title: 電源分岐構成および ADC センサインターフェース実習
    steps:
    - 各 MEAN WELL アダプタ出力に 0AFH0001Z ヒューズホルダーを接続し、0287010 10A ヒューズを挿入する。
    - マルチメータを DC 電圧モードに設定し、各分岐の電圧が安定した 12V であることを確認する。
    - OpenCR の 3.3V センサレールに 10kΩ 抵抗と FSR 402 を使用して分圧回路を構成する。
    - 非通電状態で、分圧回路の出力電圧が 0～3.3V 範囲内にあるか確認する。
    safety:
    - 作業開始前には 3 個のアダプタの AC 電源を物理的に遮断し、マルチメータで 0V であることを確認する。
    - 耐衝撃作業用保護メガネを常時着用すること。
    - 電源投入中は、絶対に回路を変更したり配線に触れたりしないこと。
    - ヒューズは過電流遮断用であり、計画停止手段ではないことを明示する。
    deliverables:
    - 各分岐別の 12V 出力測定値記録用紙
    - FSR 分圧回路組み立て完了写真
    - 構成された配線図
  assignment:
    title: 電源分岐および保護設計レビュー
    deliverables:
    - ロボットハンド全体の電流分岐分配表(各分岐別の割り当て)
    - 選定したヒューズがアクチュエータのストール電流を保護しながらアダプタ容量を超過しないことを証明する計算書
    rubric:
    - 独立ヒューズが各分岐に正確に配置されているか？
    - アクチュエータ分岐配分が 4/4/3 で規定に合致するか？
    - センサ電源が 12V ではなく 3.3V センサレールから供給されているか？
  quiz:
  - question: FSR 402 センサと 10kΩ 抵抗を使用した分圧回路の正しい電源接続は？
    choices:
    - 12V アクチュエータ電源
    - OpenCR 3.3V センサレール
    - 5V 汎用電源
    - OpenCR 12V 出力
    answer_index: 1
    explanation: OpenCR の ADC 入力は 3.3V を基準に動作するため、電圧分圧回路は必ず 3.3V センサレールから電源を供給されなければなりません
      [S13]。
  - question: XM430-W350-T アクチュエータのストール電流値は？
    choices:
    - 1.0A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: データシートによると、当該アクチュエータのストール電流は 2.3A です [S11]。
  - question: 電源分岐設計において絶対禁止されている行為は？
    choices:
    - 各アダプタ出力へのヒューズ装着
    - アダプタの陽(+)出力の並列接続
    - 分岐あたり 10A ヒューズの使用
    - 絶縁型アダプタの使用
    answer_index: 1
    explanation: アダプタの陽(+)出力は独立した分岐として維持しなければならず、並列接続は絶対禁止です [B3]。
  completion_criteria:
  - 実習において 3 個の独立分岐の 12V 電圧をマルチメータで検証完了
  - FSR 402 センサ分圧回路の配線と ADC 入力電圧範囲確認完了
  - 電源分岐および保護設計レポート提出および合格
