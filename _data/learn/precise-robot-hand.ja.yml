- id: m7
  slug: firmware-control
  phase_id: p3
  title: ファームウェアおよび制御
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - DYNAMIXELスマートアクチュエータの動作原理と制御プロトコル(Protocol 2.0)を理解する。
  - OpenCRコントローラーの構造を把握し、センサーおよびアクチュエーターインターフェースを構成する。
  - FSR電圧分圧回路を設計し、ADC信号処理過程を実装する。
  - 状態機械(State Machine)を活用してロボットハンドの把持および制御ロジックをファームウェアで作成する。
  theory_markdown: '## DYNAMIXELスマートアクチュエータ制御

    ロボットハンドの各関節はXM430-W350-Tアクチュエータを使用して駆動される [S14]。このアクチュエータは位置、速度、電流フィードバックをリアルタイムで提供し、DYNAMIXEL
    Protocol 2.0を通じて制御される [S14]。コントローラであるOpenCR 1.0は216MHz ARM Cortex-M7プロセッサを搭載し、別途の通信ブリッジなしに直接アクチュエータと通信する
    [S16]。


    ## ADCおよびセンサインターフェース

    指先の接触力はFSR 402センサを使用して測定する [S15]。FSRは印加された力が強まるにつれて抵抗が減少する特性を持つ [S15]。OpenCRのADC入力解像度は12ビットであり
    [S16]、3.3Vセンサ電源レールを使用して電圧分圧回路を構成する [S16, S27]。


    10 kΩプルダウン分圧器は$V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$を使用する


    ここで$R_{fixed}$は10kΩ抵抗を使用する [S27]。安全のためにすべてのアナログ信号は0-3.3V範囲を超えないように設計されなければならない
    [S16]。


    ## ファームウェア構造

    ロボットハンドの制御システムは「待機」、「把持遂行」、「把持維持」、「解除」の状態機械で具現する。ファームウェアはループ内でセンサ値を周期的にポーリングし、アクチュエータの電流および位置データを分析して安定した把持力を維持する。'
  worked_examples:
  - '例題1: FSR ADC値の正規化。FSRセンサーがOpenCR ADCに接続され、0～4095(12ビット)範囲の値をするとき、これを0.0～1.0の力比率へ変換するコードを作成せよ。(式:
    `normalized = adc_value / 4095.0`)'
  - '例題2: XM430位置制御命令。DYNAMIXEL SDKを使用して1番関節を2048(中央値)へ移動させる命令を構成せよ。 `packetHandler->write2ByteTxRx(portHandler,
    1, ADDR_GOAL_POSITION, 2048, &error);` のような呼び出し体系を使用する。'
  lab:
    title: ロボットハンドファームウェア実装およびセンサー補正
    steps:
    - OpenCR 1.0ボードをPCとUSBで接続し、基本通信環境を設定する [S16]。
    - 各指に接続されたFSR分圧回路をOpenCRの3.3Vセンサー電源レールにはんだ付けして接続する [S16, S27]。
    - マルチメーターを使用してFSR無負荷時および加圧時に電圧が0-3.3V範囲内にあるか確認する。
    - ファームウェアからセンサー値を読み取ってシリアルモニターに出力し、物理的接触時の変化を確認する。
    - 単一アクチュエーターを固定治具に接続し、制御コードを通じて精密移動を試験する。
    safety:
    - 絶対に5Vまたは12Vアクチュエーター電源レールをADCセンサー回路に直接接続しない [S16]。
    - 電源投入前に配線図を再確認し、短絡の有無をマルチメーターで確認する。
    - アクチュエーター無負荷状態で初期稼働試験を遂行する。
    - 異常発熱・臭気・煙を感知した場合は接近せず、危険区域外の事前指定された建物分電盤ブレーカー、または認証されたupstream master disconnectで3個のアダプターの供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁ずる。トルクオフは電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無電源計測確認後にのみ行う
      [S17]
    - 接近する前に3個の電源アダプターを物理的に取り外し、DC電圧モードで各分岐の電圧が1V未満であることを確認する。
    deliverables:
    - センサーデータ出力シリアルログ
    - 動作試験および校正済みのファームウェアソースコード
    - ADC正規化数式定義書
  assignment:
    title: 5指ロボットハンドシステム統合制御報告書
    deliverables:
    - 状態機械設計図およびロジック詳細技術書
    - 全11個のアクチュエーターおよび5個のセンサー統合制御ファームウェア
    - 動作検証動画および把持力分析グラフ
    rubric:
    - 状態機械が安全に把持および解除ループを実行しているか？
    - センサーデータがノイズなく安定的に取得されているか？
    - 電源分岐ごとの設計がBOMの独立分岐原則を遵守しているか？
    - 安全規則（物理的な電源分離など）を遵守し、記録しているか？
  quiz:
  - question: OpenCRコントローラーでFSR電圧分圧回路のために使用しなければならない電源レールは？
    choices:
    - 12Vアクチュエーター電源
    - 3.3Vセンサー電源
    - 5V電源
    - USB 5V
    answer_index: 1
    explanation: OpenCRマニュアルと互換性基準に従い、FSR電圧分圧は3.3Vセンサー電源レールのみを使用しなければならない [S16]。
  - question: アクチュエーター電源分岐アダプターが3個である状況において、正しい電源接続方法は？
    choices:
    - 3個のアダプターの正(+)出力を並列に接続して電流容量を増やす。
    - 各アダプターを独立した分岐として構成し、ヒューズを通す。
    - 1個のアダプターにすべてのアクチュエーターを接続し、残りは予備とする。
    - アダプターの出力を組み合わせて36Vに昇圧して使用する。
    answer_index: 1
    explanation: 正(+)出力の並列接続は禁止されており、各アダプターは独立した分岐として維持し、ヒューズを通じて過電流を保護しなければならない [S17]。
  - question: ロボットハンドシステムの整備または接近前に実行しなければならない必須ステップは？
    choices:
    - ソフトウェアのトルク解除命令のみを行う。
    - ヒューズを取り外す。
    - 3個の電源を物理的に分離し、マルチメーターで各分岐の1V未満の電圧を確認する。
    - コントローラーのResetボタンを押す。
    answer_index: 2
    explanation: トルク解除は電源遮断の代わりにはならず、必ず3個のアダプターを取り外し、DC電圧計測で確認しなければならない。
  completion_criteria:
  - 統合制御ファームウェアが5指ロボットハンドの把持動作をループ内で実行していること。
  - すべてのセンサーがADC信号を0-3.3Vの範囲内で正常に取得していること。
  - すべての電気的接続が、ヒューズを含む独立分岐設計基準を満たしていること。
  - 安全レビュー報告書に、無電源計測確認の記録が含まれていること。
  source_ids:
  - S16
  - S14
  - S15
  - S27
  - S17
- id: m8
  slug: testing-validation
  phase_id: p3
  title: 試験および検証
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - ロボットハンドの駆動システム性能を評価するための体系的な試験手順を確立する。
  - データに基づく精密検証のために、センサーデータとアクチュエーターフィードバックを分析する。
  - ロボットハンドの機構的な耐久性および繰り返し精度を検証する。
  - システム統合後の安全な運用のための運用ガイドラインを作成する。
  theory_markdown: '### 1. ロボットハンド性能評価の主要指標

    ロボットハンドの性能検証は、機構設計の忠実度と制御アルゴリズムの効果を立証する過程です [S1]。主な評価指標は以下の通りです。

    - **繰り返し精度(Repeatability):** 同一の目標位置に到達する際の誤差範囲で、`XM430-W350-T`アクチュエーターの高解像度エンコーダーフィードバックを通じて計算されます
    [S14]。

    - **把持安定性(Grasp Stability):** `FSR 402`センサーで測定される接触力分布を分析し、物体を滑らせることなく把持しているかを評価します
    [S15]。

    - **耐久性(Durability):** テンドン(`Dyneema SK78`)およびリンク(`PC-CF`)構造の疲労破壊の有無を確認するため、繰り返し負荷試験を行います
    [S18, S21]。


    ### 2. データ取得および分析

    `OpenCR`制御ボードのADCを通じてFSRデータをリアルタイムで収集します。3.3 Vセンサー電源を使用し、0~3.3 Vの範囲内で最大12-bit解像度で力信号を変換します
    [S16]。データ取得時、ノイズを低減するために移動平均フィルターなどを適用し、把持力の変化を平滑化します。


    ### 3. 電気的安全検証

    各アクチュエーターグループは独立した`12 V`アダプター分岐で構成され、`10 A` ATOFヒューズで過電流から保護されます [S17, S26]。システムの無電源状態の確認は、常にDC電圧モード（1
    V未満）で計測して行います。'
  worked_examples:
  - '**例題1: 繰り返し精度誤差分析**

    目標地点50度から100回繰り返し移動した後にエンコーダー値を収集した結果、平均50.02度、標準偏差0.05度であることが確認されました。これは要求される精度範囲内です。'
  - '**例題2: FSRに基づく把持力校正**

    圧力がかかっていない時のADC値が50、最大把持(20 N)時に3800である場合、線形補間式を使用してADC値から力(N)をリアルタイム推定します [S15]。'
  lab:
    title: ロボットハンド可動範囲および把持力検証
    steps:
    - 各独立分岐の電源アダプター接続部で電圧が12 Vであることを確認する。
    - ソフトウェアトルク解除状態で、ロボットハンドのリンク間に干渉がないか機構的に点検する。
    - 無負荷状態で各指の可動範囲を段階的に確認する。
    - FSRセンサーにかかる圧力を段階的(0.5 N、1 N、5 N)に印加し、ADC信号をログする。
    - 通電検査を終了した後、すべての電源アダプターを物理的に取り外す。
    - マルチメーターを使用して3個の分岐の電圧が1 V未満まで放電されたことを確認する。
    safety:
    - 整備および接近前に3個の絶縁電源アダプターを物理的に取り外し、無電源状態を計測確認する。
    - 電源印加中は絶対に手を可動範囲に入れないこと。また、固定ジグを用いて試験を行う。
    - 異常発熱・臭気・煙を検知した場合、接近せず危険区域外から指定された建物分電盤の遮断器、または認証されたupstream master disconnectで3個のアダプターの供給電源を遮断した後に退避する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁じる。トルク解除は電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無電源計測確認を行った後でのみ行う。
    - 作業時は衝撃防止用の保護メガネを必ず着用する。
    deliverables:
    - 可動範囲および把持力試験ログデータファイル
    - 繰り返し精度統計分析報告書
    - 電源分岐ごとの計測安全確認書
  assignment:
    title: 最終性能検証報告書の作成
    deliverables:
    - システム統合検証報告書(PDF)
    - 性能指標数値データおよび可視化グラフ
    - 運用ガイドラインおよびトラブルシューティング手順書
    rubric:
    - 可動範囲および繰り返し精度測定データの一貫性確認
    - FSRセンサーデータを活用した力制御アルゴリズムの有効性検証
    - 機構的な耐久性試験を通じた破損の有無および組立安定性評価
    - 安全ガイドライン遵守および手続きの妥当性
  quiz:
  - question: システム安全整備手順のうち、正しくないものは？
    choices:
    - ソフトウェアトルク解除を実行する。
    - 計画停止後、整備・接近前に3個の電源アダプターを物理的に取り外し、各分岐の無電源状態を計測確認する。
    - 3個の電源アダプターを物理的に取り外し、マルチメーターのDC電圧モードで各分岐の残留電圧が1 V未満であることを確認する。
    - DC電圧モードで各分岐が1 V未満であることを計測確認する。
    answer_index: 2
    explanation: 抵抗モードは、通電中の回路を測定したり、放電されていないコンデンサによって装置の損傷や誤読を誘発する可能性があります。無電源状態の確認は必ずDC電圧モードを使用しなければなりません。
  - question: FSR 402 センサーと OpenCR ボードを活用した回路構成時の注意点は？
    choices:
    - FSR電圧分圧器は3.3 Vセンサー電源のみを使用し、アナログ入力信号を0~3.3 V範囲に維持する。
    - FSR分圧回路は3.3 Vセンサー電源のみを使用しなければならない。
    answer_index: 1
    explanation: OpenCRのADC入力は0~3.3 Vの範囲を超えてはならないため、必ず安定した3.3 Vセンサー電源を使用しなければなりません。
  completion_criteria:
  - 試験および検証段階のすべての実験データを提出し、ログ分析を完了すること。
  - 3個の独立電源分岐の物理的分離および安全電圧計測手順を遵守すること。
  - 繰り返し精度と把持力に関する定量的な評価指標が目標範囲を達成すること。
  - すべての機構部品と電子回路が安全に動作することを最終報告書で立証すること。
