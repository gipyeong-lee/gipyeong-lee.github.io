capstone:
  title: ロボットハンド最終組立および把持試験
  deliverables:
  - 最終組立済みのロボットハンド
  - 制御ファームウェアソースコード
  - 把持試験データ記録
  - 最終プロジェクト報告書
  rubric:
  - 機構的精度および動作範囲
  - 把持成功率（様々な対象物）
  - 制御システム反応速度
  - 電気的および機構的安全遵守
  safety:
  - 計画停止後、整備・接近前に3個の絶縁電源アダプターを物理的に取り外し、各分岐の残留電圧がDC電圧モードで1 V未満であることを記録
