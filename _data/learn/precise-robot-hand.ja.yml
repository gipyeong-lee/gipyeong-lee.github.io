- id: M7
  slug: firmware-development
  phase_id: P3
  title: ファームウェア開発および制御
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - DYNAMIXEL スマートアクチュエータ通信および制御フレームワークの理解
  - OpenCR 制御ボードを活用したアクチュエータおよび FSR センサ信号取得の実装
  - リアルタイムロボット制御状態機械および閉ループフィードバックループ設計
  - 安全な電源管理およびトルクオフシーケンスプログラミング
  theory_markdown: '### ファームウェアアーキテクチャおよび DYNAMIXEL 制御

    ロボットハンドのファームウェアは高速ループ内でセンサデータを取得し、アクチュエータ命令を処理する。`OpenCR 1.0` コントローラは 216MHz ARM
    Cortex-M7 プロセッサを基盤とし [S13]、別途ブリッジなしで DYNAMIXEL プロトコル 2.0 を処理して [S11] 遅延時間を最小化する。各アクチュエータは電流、速度、位置モードをサポートし、ロボットハンドは電流制御を通じたトルクベース把持戦略を使用する。


    ### FSR 力フィードバックシステム

    FSR 402 センサは印加された力に反比例する抵抗特性を持つ [S12]。OpenCR の 12 ビット ADC を使用して [S13] 3.3V センサレールから
    10kΩ 抵抗と電圧分圧回路を構成する。分圧された電圧は `ADC値 = (V_in * R_fsr) / (R_fsr + R_ref)` を通じて正規化され、この値は指の腱張力と連動し、把持力フィードバックとして使用される。


    ### 安全な制御ルーチン

    システム停止は安全のため二段階に分けられる。ソフトウェア段階ではアクチュエータトルクを解除(Torque Off)し、物理的駆動力を即時除去する。整備前には必ず
    3 個の独立電源アダプタの電源を物理的に分離した後、マルチメータ DC モードを使用してすべての分岐で 1V 未満であることを確認しなければならない。'
  worked_examples:
  - '1. アクチュエータ目標位置/電流設定: DYNAMIXEL SDK を使用して XM430 アクチュエータの電流制限(Goal Current)を設定し、センサ値に応じた
    PID ループを通じて指関節の最終位置を更新する例題。'
  - '2. FSR 電圧データフィルタリング: ADC から収集された元データ(RAW データ)のノイズを除去するために移動平均フィルタ(Moving Average
    Filter)を適用し、上限(20N)と下限(0.2N)範囲を正規化するコード実装 [S12]。'
  lab:
    title: ロボットハンド統合制御および精密把持実習
    steps:
    - 各独立分岐の電圧が 1V 未満であることをマルチメータ DC モードで確認した後、組み立てを開始する。
    - OpenCR の 3.3V センサレールに FSR 電圧分圧回路をはんだ付けし、ADC ポートに接続する。
    - DYNAMIXEL SDK を使用して 11 個のアクチュエータの ID をスキャンし、初期位置を設定する。
    - 無負荷状態で指関節駆動命令をテストし、腱の伸度と張力を調節する。
    - FSR センサデータをシリアルモニタで視覚化し、把持力応答をチューニングする。
    safety:
    - 絶対に 5V または 12V アクチュエータ電源を FSR センサ回路の供給電源として使用しないこと。
    - システム通電中は絶対に指の可動範囲に接近せず、固定治具を使用すること。
    - 電源分岐アダプタの陽(+)端子を絶対に互いに接続しないこと。
    - 整備・組み立て接近前には、必ず 3 個の電源アダプタを物理的に分離し、すべての分岐で 1V 未満であることを計測確認すること。
    deliverables:
    - リアルタイムセンサデータフィードバックを含むファームウェアソースコード
    - 電圧分圧データの正規化および校正データシート
    - アクチュエータフィードバックループ正常動作ログ
  assignment:
    title: 把持状態機械設計および実装
    deliverables:
    - 把持および把持解除状態機械ダイアグラム
    - 電流ベーストルク制御実装コード
    - 最終性能評価レポート
    rubric:
    - センサ値に応じた電流制限範囲(0-2.3A)が安定的に制御されるか？
    - トルク解除指令時に物理的な張力が即座に解除されるか？
    - コード内に安全なハードウェア分離手順が明示されているか？
  quiz:
  - question: FSR 402 センサと分圧回路を構成する際に推奨される電源レールは何ですか？
    choices:
    - 12Vアクチュエータ電源レール
    - 5V汎用電源レール
    - OpenCR 3.3Vセンサレール
    - 24V外部入力レール
    answer_index: 2
    explanation: システム安全とOpenCR ADC保護のため、FSR分圧回路は必ず 3.3Vセンサ電源レールに接続しなければなりません。
  - question: ロボットハンド整備時にシステムが「無通電状態」であることを確認する正しい方法は何ですか？
    choices:
    - ソフトウェアでトルク解除指令を送る。
    - マルチメータの抵抗モードで配線状態を確認する。
    - マルチメータのDC電圧モードですべての分岐が1V未満であることを計測する。
    - 電源分岐ヒューズを取り外す。
    answer_index: 2
    explanation: 物理的な電源分離後、必ずマルチメータのDC電圧モードですべての分岐の残留電圧が1V未満であることを直接確認しなければなりません。
  - question: 複数の独立電源アダプタ出力のプラス(+)端子を並列に接続してもよいですか？
    choices:
    - 電流合計のために必要だ。
    - 絶対禁止される。
    - 定格出力電流が同じであれば可能だ。
    - ヒューズを装着すれば可能だ。
    answer_index: 1
    explanation: 独立分岐で構成された電源アダプタのプラス(+)出力は、相互に接続したり統合したりしては絶対にいけません。
  completion_criteria:
  - 各分岐別の独立電源供給およびヒューズ保護がBOM仕様に従って構成されていることをマルチメータで検証完了
  - OpenCR ADCを通じた 5個のFSRセンサの精密な力信号取得およびフィルタリング確認
  - ソフトウェアトルク解除ルーチンと物理的な電源遮断後の計測手順を完璧に遂行
  - 把持状態機械が意図通りにアクチュエータとセンサデータを処理し、最終報告書が提出済み
  source_ids:
  - S13
  - S11
  - S12
- id: M8
  slug: sensor-integration
  phase_id: P3
  title: センサ統合およびフィードバック制御
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - FSR 402 センサと 10 kΩ抵抗を用いた分圧回路の構成原理の理解
  - OpenCRコントローラのADC機能と入力範囲(0-3.3 V)の制約条件の習得
  - センサデータのフィルタリングおよびキャリブレーション技術の習得
  - フィードバックに基づく把持制御アルゴリズムの実装およびロボットハンドの接触力制御実習
  theory_markdown: '## センサ統合と接触力フィードバック


    ロボットハンドの精密な把持制御は、指先に作用する力を正確に測定することから始まります。FSR 402 センサは、加えられる圧力が大きくなるほど抵抗値が減少する感圧抵抗器です
    [S12]。これをマイクロコントローラが読み取れる電圧信号に変換するには、分圧回路が必要です。


    ### 1. 分圧回路

    FSRセンサと 10 kΩの分圧抵抗を直列に接続し、 3.3 Vのセンサ電源を供給します [B4, B5, B2]。ADCピンはセンサと抵抗の接点に接続され、出力電圧
    $V_{out}$は次のように計算されます。

    10 kΩプルダウン分圧器は $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$ を使用する


    - OpenCRコントローラのADCは 12ビットの解像度を持ち、入力範囲は 0〜3.3 Vに制限されています [B2]。この範囲外の入力は回路素子を損傷させる可能性があるため、必ず指定されたセンサ電源レール(3.3
    V)のみを使用しなければなりません [B2]。


    ### 2. 制御ループとフィードバック

    測定された力データは、PID制御アルゴリズムや適応制御戦略の入力値として使用されます [S3]。ロボットハンドが物体を把持する際、腱駆動モータ(DYNAMIXEL
    XM430-W350-T)はセンサ値を参照し、設定された目標接触力に達するまでトルクを微調整します [B1, B4]。'
  worked_examples:
  - '例題 1: FSR出力計算。 $R_{FSR}$ が 5 kΩであり、$R_{fixed}$ が 10 kΩであるとき、 3.3 V入力基準で $V_{out}
    = 3.3 \times (5 / (5 + 10)) = 1.1 V$。これはADC入力範囲(0-3.3 V)内に正常に位置します。'
  - '例題 2: 把持力補正。センサ値がノイズによって変動する場合、単純移動平均フィルタを適用することで、センサ値の急激な変動を抑え、把持力を安定的に維持できます。'
  lab:
    title: 指先FSRセンサ回路の構成および補正
    steps:
    - OpenCRの 3.3 VセンサレールとGNDをブレッドボードに接続します。
    - FSR 402と 10 kΩ抵抗を直列に接続して分圧回路を構成します [B4, B5]。
    - 分圧の接点をOpenCRのADCピンに接続します [B2]。
    - PCとOpenCRを接続し、センサ値を読み取るテストコードを実行します。
    - 無負荷状態と目標力が加えられる時のADC値を記録し、補正表を作成します。
    safety:
    - 電源投入前に必ずマルチメータで 3.3 Vレールと 12 Vアクチュエータレールの短絡の有無を確認してください [B2]。
    - 保護メガネを常時着用し、通電中はロボットハンドの可動範囲内に手を入れないでください。
    - 異常発熱・異臭・煙の感知時は接近せず、危険区域外で事前指定された建物分電盤のブレーカー、または認証されたupstream master disconnectで
      3個のアダプタへの供給電源を遮断した後に避難する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁止する。トルク解除は電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無通電計測を確認した後にのみ行うこと。
    - 修理やセンサへの接近前に 3個の絶縁電源アダプタを物理的に取り外し、すべての分岐の電圧が 1 V未満であることを計測確認してください。
    deliverables:
    - ADCセンサ読み取りテスト結果データ
    - センサ補正テーブル(ADC値 vs 物理的な力)
    - センサデータフィルタリング実装コード
  assignment:
    title: 把持力フィードバック制御アルゴリズムの実装
    deliverables:
    - フィードバック制御コード(センサ読み取り、目標値比較、モータトルク調整)
    - 把持試験結果グラフ(時間対力)
    - 最終報告書(制御ロジックの説明および把持安定性分析)
    rubric:
    - ADCデータが 0-3.3 V範囲内で安定的に測定されているか？
    - センサ値が目標値に達した時、モータが適切にトルクを解除または維持しているか？
    - 非常時にトルク解除がソフトウェア的に正常動作するか？
    - 報告書に電源遮断確認手順が記述されているか？
  quiz:
  - question: OpenCRコントローラのADCピンにFSR分圧信号を入力する際、必ず守らなければならないことは何ですか？
    choices:
    - 12 Vアクチュエータ電源レールを使用する。
    - 3.3 Vセンサ電源レールのみを使用する。
    - 5 V電源レールを使用する。
    - 電源を別途外部から供給する。
    answer_index: 1
    explanation: OpenCRのADC入力範囲は 0-3.3 Vであるため、これを超える電圧が印加されないよう、必ず 3.3 Vセンサ電源レールのみを使用しなければなりません。
  - question: FSRセンサの抵抗値変化と物理的な力の関係はどのようになっていますか？
    choices:
    - 圧力が上昇すると抵抗値が上昇する。
    - 圧力が上昇すると抵抗値が減少する。
    - 圧力の変化と抵抗値は無関係である。
    - 圧力が上昇すると抵抗値が一定の割合で増幅される。
    answer_index: 1
    explanation: FSRは、圧力をかけるとセンサの抵抗値が減少する特性を持つ感圧抵抗器です。
  - question: ロボットハンドのプロトタイプ作業中に、整備や接近のために電源を遮断した後で確認すべき安全状態は何ですか？
    choices:
    - ソフトウェア的にトルクを解除したか確認する。
    - ヒューズの断線の有無をマルチメータで測定する。
    - 3個の電源アダプタを物理的に取り外し、各分岐の電圧が 1 V未満であることをDC電圧モードで計測する。
    - 電源スイッチを切った後、抵抗モードで導線の状態を測定する。
    answer_index: 2
    explanation: 電源遮断とは 3個の電源を物理的に取り外すことであり、安全のために必ずマルチメータのDC電圧モードで、すべての分岐が 1 V未満であることを直接確認しなければなりません。
  completion_criteria:
  - ADCを通じたFSR値読み取り実習合格
  - 把持力フィードバック制御コードが目標値に 90%以上到達
  - すべての安全規則(物理的電源分離および電圧測定)の遵守証明
  - 最終結果報告書の提出
  source_ids:
  - S3
  - S12
  - S26
- id: M9
  slug: testing-validation
  phase_id: P3
  title: 性能試験および検証
  estimated_hours: 10.0
  prerequisites:
  - M8
  objectives:
  - ロボットハンドの精度および再現性を検証するための定量的試験指標の設計
  - FSRセンサデータを活用した把持力制御アルゴリズムの安定性評価
  - DYNAMIXELアクチュエータのフィードバックデータと実際の物理的動作との誤差分析
  - 機構的欠陥および腱駆動メカニズムの耐久性検証手順の習得
  theory_markdown: '## 性能試験および検証理論


    ロボットハンドの性能検証は、設計仕様と実際の物理的挙動との一致を確認するプロセスです [S1]。主な指標は以下の通りです。


    ### 1. 位置および把持精度

    再現性(Repeatability)とは、同一の指令を遂行した際にロボットハンドが到達する位置の誤差範囲を意味します。XM430-W350-Tアクチュエータは内部エンコーダを通じて精密な位置フィードバックを提供しますが
    [S11]、最終的な指先の位置は腱の伸びや摩擦によって誤差が発生します。Dyneema腱は伸びが 1%未満と非常に低く、再現性の確保に有利です [S16]。


    ### 2. 力制御とFSRセンサ信号処理

    FSR 402 センサは加えられた力に従って抵抗が減少する特性を持ちます [S12]。これを 10 kΩ抵抗と分圧回路で構成し、OpenCRの 12ビットADCで測定します
    [S13, S26]。センサデータはノイズが多いため、移動平均フィルタ(Moving Average Filter)を適用して安定的な把持力フィードバックループを形成する必要があります。


    ### 3. 過電流保護および電源安定性

    システムは 3個の独立した 12 V電源分岐を使用します [S15]。各分岐は 10 AのATOFヒューズで保護されており [S25]、アクチュエータのピーク電流合計が保護定格を超えないように配分しなければなりません。これは製造業者から提供されるヒューズの「時間-電流曲線」を通じて保護協調を検証する必要があります。'
  worked_examples:
  - '例題 1: OpenCR ADC電圧計算。FSR抵抗が 10 kΩであり、直列抵抗が 10 kΩであるとき、 3.3 V電圧分圧器の出力は V_out =
    3.3 * (10k / (10k + 10k)) = 1.65 Vです。これは 12ビットADCの範囲内に適しています [S13, S26]。'
  - '例題 2: ヒューズ保護協調。アクチュエータ 4台がストール状態のとき、電流合計は 9.2 Aです [S11]。 10 Aヒューズの冷間抵抗は 7.7 mΩであるため
    [S25]、通常運転時の電圧降下は約 0.07 Vレベルで無視できますが、過電流時の正確な応答はヒューズメーカーの「時間-電流曲線」を参照する必要があります。'
  lab:
    title: ロボットハンド統合機能試験
    steps:
    - 各電源分岐を物理的に分離した状態で、 3個のアダプタの出力をDC電圧モードで計測し、 12 Vが出力されるかを確認します。
    - 安全治具にロボットハンドを固定し、コントローラ(OpenCR)をPCに接続してアクチュエータトルクを 0として解除します。
    - 指ごとにFSRセンサに加えられる圧力を手で加え、ADCデータの変化を記録します。
    - 無負荷状態で各指の最大可動範囲(ROM)を 5回繰り返し動作させ、腱の干渉の有無を確認します。
    - 試験終了後、必ず 3個の電源アダプタを壁面のコンセントから取り外し、残留電圧を確認します。
    safety:
    - 必ず保護メガネを着用して試験に臨みます。
    - 通電中、可動範囲内に手を入れません。
    - 異常発熱・異臭・煙の感知時は接近せず、危険区域外で事前指定された建物分電盤のブレーカー、または認証されたupstream master disconnectで
      3個のアダプタへの供給電源を遮断した後に避難する。危険区域外で操作可能なupstream遮断手段がない場合、システムの通電を禁止する。トルク解除は電源遮断の代わりにはならない。整備・接近は計画停止後、物理的分離および無通電計測を確認した後にのみ行うこと。
    - 電圧計測なしにシステムに触れてはいけません。 1 V未満のDC確認は必須です。
    deliverables:
    - 指把持力センサ校正記録
    - 繰り返し動作精度測定データ
    - 電源分岐別負荷電流測定値
  assignment:
    title: ロボットハンド性能分析最終報告書
    deliverables:
    - 性能試験結果分析報告書
    - データに基づく把持制御アルゴリズムコード
    rubric:
    - センサデータの信号対雑音比(SNR)分析の適切性
    - 繰り返し動作試験における精度の定量化
    - 保護設計(ヒューズ)がシステム保護の意図を満足するかについての理論的考察
    - 設計仕様と実際の製作物の性能指標の比較
  quiz:
  - question: FSR 402 センサとOpenCR ADCを用いた力測定回路の構成について正しいものはどれですか？
    choices:
    - FSR分圧器は 3.3 Vセンサ電源のみを使用し、アナログ入力信号を 0〜3.3 V範囲内に維持する。
    - FSRと 10 kΩ抵抗で分圧器を構成し、 3.3 Vセンサレールを使用する。
    - ADC信号は常に 0〜5 V範囲でなければならない。
    - FSRは抵抗が一定なので、別途の分圧抵抗は不要である。
    answer_index: 1
    explanation: OpenCRセンサレール(3.3 V)を使用してADC入力を 0〜3.3 V範囲内に制限し、分圧回路を構成して抵抗変化を電圧変化として読み取らなければなりません
      [S13, S26]。
  - question: DYNAMIXEL XM430-W350-Tアクチュエータの 12 V電源分岐を管理する方法として正しいものはどれですか？
    choices:
    - 3個のアダプタのプラス(+)出力を一つにまとめて電力を合計する。
    - アダプタごとに 10 Aヒューズを装着し、個別の独立分岐として使用する。
    - 電流がヒューズ定格以下なので安全検証なしに使用可能である。
    - 電源アダプタ出力はヒューズなしで直接並列に接続する。
    answer_index: 1
    explanation: 各アダプタの出力は独立して維持されなければならず、独立分岐に適したヒューズを装着して過電流から保護しなければなりません [S15]。
  - question: ロボットハンド検証段階で最も重要な安全手順は何ですか？
    choices:
    - ソフトウェア的にトルクを解除すれば、電源遮断と同じである。
    - 常にマルチメータで 1 V未満のDCであることを確認してから整備に接近する。
    - ヒューズは計画停止装置の役割を果たすので、ヒューズを抜けばよい。
    - 導通(Continuity)モードで電源が遮断されたことを確認する。
    answer_index: 1
    explanation: ソフトウェア解除は物理的な電源遮断の代わりにはならず、物理的な分離後にDC電圧モードで残留エネルギーがないことを計測確認することが必須です。
  completion_criteria:
  - 性能試験結果報告書の提出および 70点以上獲得
  - すべてのLab段階で安全指針の遵守および物理的な電源分離の確認完了
  - 制御コードのセンサデータフィルタリング機能の実装確認
