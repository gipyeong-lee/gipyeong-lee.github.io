    title: ML-KEM 및 ML-DSA 알고리즘 기초 실험
    steps:
    - liboqs를 설치하고 환경 변수를 설정한다.
    - 샘플 Python 코드를 사용하여 ML-KEM 키 쌍 생성 및 캡슐화 과정을 실행한다.
    - ML-DSA를 사용하여 메시지에 서명하고 검증하는 스크립트를 수행한다.
    - 각 연산에 소요되는 시간을 측정하여 기록한다.
