  theory_markdown: '### 전환 우선순위 전략 (Migration Prioritization Strategy)


    NIST 포스트퀀텀 표준(ML-KEM, ML-DSA)으로의 전환은 시스템 전반의 암호 자산 평가에서 시작됩니다. 전환 우선순위는 단순히 알고리즘의
    노후화 정도가 아니라, 데이터의 수명(Data Shelf Life), 암호 노출 위험, 그리고 시스템의 전략적 중요도에 따라 결정됩니다 [S1].


    #### 1. 암호 자산 평가 기준 (Assessment Criteria)

    전환 시급성을 판단하기 위해 다음 기준을 활용합니다:

    - **데이터 보안 수명:** 암호화된 데이터가 미래 양자 컴퓨터에 의해 해독되었을 때 미치는 영향(예: 10년 이상 기밀 유지 필요 데이터).

    - **시스템 민첩성:** 현재 구현된 암호가 하드코딩되었는지, 구성 파일(Config)을 통해 알고리즘 교체가 가능한지 여부.

    - **기술 부채:** 해당 암호 모듈을 사용하는 종속성(Dependency) 및 유지보수 가능 여부.


    #### 2. 암호 민첩성 확보

    전환 로드맵의 핵심은 알고리즘 교체 시 코드 변경을 최소화하는 것입니다. 추상화 레이어(Abstraction Layer)를 사용하여 비즈니스
    로직과 암호 엔진을 분리하고, 하이브리드 키 교환 방식을 통해 기존 알고리즘의 안정성과 PQC의 양자 저항성을 동시에 확보하는 전략이 권장됩니다.'
  worked_examples:
  - '예시 1: 데이터 생명주기 기반 우선순위 산정 - 20년 보존되는 인적 정보 데이터베이스는 5년 보존되는 로그 데이터보다 PQC 전환 우선순위가
    높게 평가됨.'
