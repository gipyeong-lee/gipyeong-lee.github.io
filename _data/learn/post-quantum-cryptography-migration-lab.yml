    - 우선순위 상위 3개 자산에 대한 하이브리드 구현 계획을 세웁니다.
    - 전환 시 발생할 수 있는 호환성 문제와 대응책(Fall-back 전략)을 기술합니다.
    safety:
    - 모든 계산 및 분석은 독립된 격리 가상 환경에서만 수행합니다.
