- id: m6
  slug: performance-benchmarking
  phase_id: p3
  title: 성능 평가 및 벤치마킹
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - 포스트퀀텀 암호 알고리즘(ML-KEM)의 성능 평가 지표(시간, 메모리, 처리량)를 이해한다.
  - TLS 1.3 핸드셰이크 과정에서 KEM 연산이 성능에 미치는 영향을 분석한다.
  - Liboqs 및 oqs-provider 프레임워크를 활용하여 하이브리드 암호 모드의 성능을 벤치마킹한다.
  theory_markdown: '## 성능 평가 및 벤치마킹


    포스트퀀텀 암호(PQC)로의 전환은 단순히 알고리즘을 교체하는 것이 아니라, 기존 네트워크 프로토콜(예: TLS 1.3)의 성능과 직결되는
    문제입니다. 특히 KEM(Key Encapsulation Mechanism) 연산은 핸드셰이크의 지연 시간(latency)과 서버의 초당 연결
    처리량(handshakes per second)에 직접적인 영향을 미칩니다 [S2].


    ### 성능 지표

    1. **연산 시간(Computation Time):** 키 생성(KeyGen), 캡슐화(Encaps), 역캡슐화(Decaps) 각각에 소요되는
    CPU 사이클 또는 시간(ms).

    2. **데이터 크기:** 공개키 및 캡슐화된 텍스트(ciphertext)의 크기. 이는 네트워크 대역폭 소비와 단편화 발생 가능성을 결정합니다.

    3. **처리량(Throughput):** 초당 처리 가능한 핸드셰이크 수. 최적화된 구현(예: AVX-512 활용)은 폴리노미얼 곱셈 및
    모듈러 연산 속도를 높여 처리량을 크게 개선할 수 있습니다 [S2].


    ### 하이브리드 모드

    전환기에는 전통적인 알고리즘(ECDH)과 PQC(ML-KEM)를 함께 사용하는 하이브리드 접근법이 권장됩니다. 이는 PQC의 잠재적 취약성에
    대비하면서도 PQC의 보안 이점을 확보하기 위함입니다. 하이브리드 모드는 연산 복잡도가 증가하므로 성능 저하를 면밀히 평가해야 합니다 [S2].'
  worked_examples:
  - '예제 1: Liboqs를 사용한 단일 KEM 연산 벤치마킹

    Python 스크립트를 통해 `ML-KEM-768`의 `keypair`, `encaps`, `decaps` 동작 시간을 `timeit` 모듈로
    측정하고 결과를 CSV로 저장하는 방법입니다.'
  - '예제 2: 하이브리드 TLS 1.3 핸드셰이크 처리량 측정

    oqs-provider가 적용된 로컬 서버/클라이언트 환경에서 `s_client`와 `s_server`를 사용하여 100회 연결 시 소요되는
    총 시간을 측정하여 초당 핸드셰이크 수(TPS)를 산출하는 분석 절차입니다.'
