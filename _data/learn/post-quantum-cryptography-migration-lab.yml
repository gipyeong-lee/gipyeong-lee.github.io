    - 실험용 가상 환경 외의 시스템 인증서나 실제 키 파일에 접근하지 않는다.
    - liboqs 라이브러리는 연구 및 테스트 용도로만 사용하며 운영 환경 보안 솔루션으로 오해하지 않는다.
    - 실험 데이터는 모두 로컬 가상 환경에 유지하며 외부 네트워크로 전송하지 않는다.
    deliverables:
