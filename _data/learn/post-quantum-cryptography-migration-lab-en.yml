- id: m3
  slug: crypto-inventory
  phase_id: p2
  title: Cryptographic Asset Identification and Management
  estimated_hours: 8.0
  prerequisites:
  - m2
  objectives:
  - Explain the concept and necessity of Cryptographic Inventory.
  - Learn how to systematically classify encryption algorithms, libraries, and usage
    in an organization.
  - Identify metadata management elements for Crypto-agility.
  - Evaluate the risk of identified cryptographic assets to determine Post-Quantum
    migration priorities.
  theory_markdown: '## Cryptographic Inventory


    Cryptographic asset identification is the process of systematically listing all
    cryptographic algorithms, protocols, libraries, and the systems and data they
    are applied to within an organization. This is the first step in preparing for
    the migration to Post-Quantum Cryptography (PQC), and identifying dependencies
    on the cryptographic algorithms being protected is key [S1].


    ### 1. Key Management Targets

    - **Algorithms and Protocols**: TLS, SSH, code signing, data encryption (AES,
    RSA, ECC, etc.), etc.

    - **Infrastructure**: Certificate Authorities (CA), Key Management Systems (KMS),
    HSM, cloud key storage.

    - **Software**: Encryption library versions (OpenSSL, BoringSSL, etc.) and static/dynamic
    linkage status.


    ### 2. Crypto-agility

    Crypto-agility refers to the ability to quickly replace encryption algorithms
    while minimizing code changes. For this, systems should not be hard-coded to specific
    algorithms but should have an abstraction layer that allows selecting algorithms
    through configuration files.


    ### 3. Risk Assessment Criteria

    - **Data Lifecycle**: Does the encrypted data need to remain secret in the future?
    (e.g., data at risk of being stolen now and decrypted in the future)

    - **Migration Difficulty**: Is hardware replacement needed, or is software update
    sufficient?

    - **Regulation and Compliance**: Alignment with NIST PQC standard application
    timelines.'
  worked_examples:
  - 'System scan result example: Identifying an asset as ''Using TLS 1.2(ECDHE-RSA-AES128-GCM-SHA256)''.
    In this case, recognize that RSA and ECDHE are exposed to quantum threats and
    categorize targets for ML-KEM/ML-DSA migration.'
  - 'Crypto-agility self-checklist: If ''Is the algorithm hard-coded?'' is ''Yes'',
    increase risk score. If ''Is it possible to select cryptographic algorithms via
    configuration files?'' is ''No'', increase migration difficulty.'
  lab:
    title: Cryptographic Asset Identification and Risk Assessment Lab
    steps:
    - Search source code of sample projects for keywords 'AES', 'RSA', 'ECC' to find
      where they are used.
    - Record identified cryptographic implementations (including libraries) in 'Cryptographic
      Asset Inventory CSV'.
    - Calculate risk scores for each asset based on 'security lifespan', 'quantum
      threat level', and 'data importance'.
    - Classify migration priorities (P0~P3) based on the calculated scores.
    safety:
    - Do not scan private keys or actual service certificates of systems currently
      in operation.
    - Use only dummy certificates (for testing) isolated within the virtual environment
      for testing.
    - Do not include actual secret values or encryption key values in the analysis
      results (CSV, documents).
    deliverables:
    - Cryptographic Asset Inventory CSV file (including algorithm, usage, library,
      library version).
    - Priority-based cryptographic asset risk assessment report (Markdown).
  assignment:
    title: Cryptographic Agility Analysis and Migration Roadmap Establishment
    deliverables:
    - Cryptographic Asset Inventory CSV.
    - Decision table with migration priorities defined.
    - Post-Quantum Migration Roadmap.
    rubric:
    - Were cryptographic assets comprehensively identified?
    - Are risk assessment criteria objective and valid?
    - Does the migration roadmap follow the logical order of Post-Quantum technology
      migration?
    - Are specific technical suggestions included for improving cryptographic agility?
  quiz:
  - question: What is the primary purpose of Cryptographic Inventory?
    choices:
    - To optimize the performance of all encryption libraries.
    - To understand cryptographic dependencies within an organization to prepare for
      PQC migration.
    - To delete all encryption algorithms.
    - To force the use of asymmetric encryption only.
    answer_index: 1
    explanation: Cryptographic Inventory aims to efficiently perform PQC migration
      by systematically managing the locations and dependencies of encryption algorithms
      that need to be migrated.
  - question: Which of the following is the most appropriate definition of Crypto-agility?
    choices:
    - The process of replacing hardware for stronger encryption.
    - The function that automates encryption library updates.
    - Flexibility to minimize code changes and quickly replace encryption algorithms
      when necessary.
    - Changing encryption keys very frequently.
    answer_index: 2
    explanation: Crypto-agility refers to the ability to adapt to changing security
      environments by minimizing the burden of code changes when replacing algorithms.
  completion_criteria:
  - Submit Cryptographic Asset Identification Inventory CSV and complete risk assessment.
  - Author a report stating the migration difficulty and risk priority of each cryptographic
    asset.
  - Achieve 100% correct answers in the quiz.
  source_ids:
  - S1
- id: m4
  slug: test-env-setup
  phase_id: p2
  title: Setting up Isolated Experimental Environments
  estimated_hours: 8.0
  prerequisites:
  - m3
  objectives:
  - Understand the configuration principles of isolated local development environments
    for Post-Quantum Cryptography (PQC) experiments and the roles of essential tools
    (liboqs, oqs-provider).
  - Analyze the impact of KEM performance on handshake latency in protocols such as
    TLS 1.3.
  - Design and build a reproducible experimental environment with fixed dependencies
    using Docker containers.
  theory_markdown: '### Need for Isolated PQC Experimental Environments

    To protect existing public-key cryptography (RSA, ECDH, etc.) from quantum computer
    threats, NIST has standardized post-quantum algorithms such as ML-KEM (based on
    Kyber) and ML-DSA (based on Dilithium). To evaluate the performance and security
    of these algorithms in a local environment, a reproducible environment with **Crypto-agility**
    is essential [S2].


    #### 1. Key Components

    *   **liboqs**: A C-language implementation of PQC algorithms, providing a foundation
    to test various KEM and signature algorithms.

    *   **oqs-provider**: An interface that uses the OpenSSL 3 provider architecture
    to allow integrating PQC algorithms into existing TLS infrastructure.

    *   **Hybrid Mode**: A transitional strategy that combines existing classical
    cryptography (ECDH) with PQC algorithms to maintain existing security levels despite
    potential vulnerabilities in PQC libraries [S2].


    #### 2. The Core of Experimental Environments: Isolation and Reproducibility

    Experiments must be completely separated from operational environments. By locking
    dependency versions using container technologies like Docker, one can reduce differences
    in execution results between researchers and accurately measure the effects of
    algorithm optimization (e.g., utilizing AVX-512) [S2]. When evaluating handshake
    performance, one should use fixed hardware and an isolated network to minimize
    latency uncertainty.'
  worked_examples:
  - 'Example 1: Building an environment based on oqs-provider utilizing Dockerfile.
    Describes how to ensure build reproducibility by specifying versions for each
    library.'
  - 'Example 2: Hybrid TLS handshake test using OpenSSL CLI. Describes how to simulate
    an ML-KEM-768-supported hybrid TLS 1.3 connection using ''openssl s_server'' and
    ''s_client''.'
  lab:
    title: Building an Isolated PQC Testbed
    steps:
    - Prepare an experimental Docker container image base (Ubuntu 22.04 LTS or higher).
    - Clone liboqs and oqs-provider source code and check out specific commit hashes
      to lock versions.
    - Perform build by setting optimization levels (e.g., AVX2) when compiling liboqs
      using CMake.
    - Configure OpenSSL 3.x environment and activate oqs-provider.
    - Measure basic TLS 1.3 handshake performance standards through fixed loopback
      connections on local network interfaces.
    safety:
    - Experimental environments must be run only within isolated local containers.
    - Certificates, actual private keys, and customer data from operational environments
      must never be brought into containers.
    - Note that measurements generated during compilation and execution are considered
      public test data and are irrelevant to actual security policies.
    - When monitoring actual hardware or power, comply with the rated current and
      voltage ranges specified by the manufacturer.
    deliverables:
    - Dockerfile with locked dependency versions and build logs.
    - Terminal capture showing successful loading of the PQC algorithm list in OpenSSL.
    - Checksum (SHA-256) of the isolated development environment with completed configuration.
  assignment:
    title: PQC Testbed Documentation and Evaluation
    deliverables:
    - Configuration diagram of the built testbed and specification of selected algorithm
      versions.
    - CSV of handshake time comparison data between classical algorithms and hybrid
      ML-KEM algorithms in the testbed environment.
    - Security policy report for maintaining isolated environments.
    rubric:
    - Possibility of locking dependency versions and reproducing builds (30%).
    - Success of hybrid TLS handshake in an isolated experimental environment (40%).
    - Clarity of algorithm configuration and measurement procedures and security compliance
      (30%).
  quiz:
  - question: What is the primary role of oqs-provider?
    choices:
    - Accelerates PQC algorithms at the hardware level.
    - Acts as an interface that allows Post-Quantum algorithms to be used in TLS protocols,
      etc., in OpenSSL 3.
    - Automatically renews security certificates in operational environments.
    - Blocks quantum computer attack vectors.
    answer_index: 1
    explanation: oqs-provider uses the OpenSSL provider architecture to integrate
      PQC algorithms into standard libraries, allowing existing applications to use
      PQC algorithms.
  - question: Why should versions be locked in an isolated experimental environment?
    choices:
    - Because the latest version is always faster.
    - To ensure reproducibility and reduce measurement errors due to differences in
      execution environments between researchers.
    - To strengthen operational security.
    - To shorten build times.
    answer_index: 1
    explanation: Version locking is essential to ensure that the same environment
      can be reproduced, securing the integrity of performance measurement values
      and the objectivity of research.
  completion_criteria:
  - Successful configuration of a Docker-based isolated build environment.
  - Demonstration of ML-KEM hybrid mode through oqs-provider.
  - Submission of a report including experimental data measurement and security policies.
  source_ids:
  - S2
- id: m5
  slug: liboqs-integration
  phase_id: p2
  title: Integration of OQS and oqs-provider
  estimated_hours: 8.0
  prerequisites:
  - m4
  objectives:
  - Understand the Open Quantum Safe (OQS) architecture and the role of oqs-provider.
  - Understand how PQ (Post-Quantum) algorithms are integrated into TLS 1.3.
  - Configure and verify a hybrid TLS handshake in a local environment.
  - Consider the impact of KEM implementation optimization (e.g., AVX-512) on actual
    handshake performance.
  theory_markdown: '## Theory of OQS and oqs-provider Integration


    To protect existing data transmissions from the threat of quantum computers, it
    is essential to integrate NIST-standard-based post-quantum algorithms (PQC) into
    existing protocols like TLS 1.3. The OQS (Open Quantum Safe) project provides
    major frameworks to accelerate this integration [S2].


    ### 1. liboqs and oqs-provider

    - **liboqs**: The core library containing C-language implementations of PQC algorithms
    (ML-KEM, ML-DSA, etc.). It provides a unified API for various algorithms.

    - **oqs-provider**: An intermediate layer that utilizes the OpenSSL 3 provider
    structure to help OpenSSL applications (e.g., `s_client`, `s_server`) natively
    use PQC algorithms in liboqs. This allows testing PQC features in existing TLS
    tools without modification.


    ### 2. PQ Integration Method for TLS 1.3

    During the TLS 1.3 handshake process, PQC KEM replaces or supplements existing
    key exchanges (e.g., ECDH).

    - **PQ-only mode**: Exchanges keys using only PQC KEM.

    - **Hybrid mode**: Combines existing classical algorithms (ECDH) with PQC algorithms.
    This is a transitional strategy that secures post-quantum safety while maintaining
    classical security guarantees, protecting against potential PQC library implementation
    errors or future vulnerabilities.


    ### 3. Performance Considerations

    PQC KEM can have larger key sizes or higher computational loads than existing
    algorithms, directly impacting handshake performance [S2]. Utilizing latest hardware
    instruction sets (e.g., AVX-512) to optimize polynomial multiplication and modular
    reduction can increase handshake speeds [S2].'
  worked_examples:
  - 'Example 1: To verify that oqs-provider is loaded in OpenSSL, run the `openssl
    list -providers` command. The output must include the ''oqs'' provider.'
  - 'Example 2: When performing a hybrid handshake, specify the key exchange group
    via command arguments, e.g., `openssl s_client -groups kyber768_x25519...`. This
    is a hybrid group that combines ML-KEM (Kyber) and classical Curve25519.'
  lab:
    title: Hybrid TLS Testing in Local Environment
    steps:
    - Build and install liboqs and oqs-provider within an isolated Docker container.
    - Modify the OpenSSL configuration file (`openssl.cnf`) to activate the oqs provider.
    - Open two terminals and run `openssl s_server` in one and `openssl s_client`
      in the other in hybrid mode.
    - Use Wireshark to capture and analyze how the shared key group (Key Share) is
      transmitted in the ClientHello packet.
    - Check handshake success and session encryption algorithm information.
    safety:
    - Experiments must be performed only within an isolated local virtual environment.
    - Never use certificates or keys used for operational services.
    - Be careful not to include actual service traffic when capturing with Wireshark.
    deliverables:
    - Screenshot confirming activation of oqs-provider.
    - Hybrid handshake log file.
    - Analysis report of shared key group in Wireshark captured packets.
  assignment:
    title: Migration Analysis Report Based on Cryptographic Agility
    deliverables:
    - TLS handshake performance measurement result data (CSV).
    - Analysis essay on the reasons for using hybrid mode and performance degradation.
    - Priority-based Post-Quantum Migration Roadmap.
    rubric:
    - Success of OQS toolchain build and execution.
    - Did you accurately describe hybrid mode operation through TLS packet analysis?
    - Is performance measurement data inclusive of experimental environment and version
      information and reproducible?
    - Is the migration roadmap logically authored based on the concept of cryptographic
      agility?
  quiz:
  - question: What is the core role of oqs-provider in OpenSSL?
    choices:
    - Hardware accelerator for encrypting network packets.
    - A layer that allows OpenSSL to call PQC algorithms of liboqs.
    - A service that issues public key certificates on the internet.
    - IDS tool for detecting attacks by quantum computers.
    answer_index: 1
    explanation: oqs-provider utilizes OpenSSL's provider structure to connect liboqs'
      algorithms so they can be directly used in OpenSSL applications.
  - question: What is the primary reason for using 'hybrid mode' key exchange in TLS
      1.3?
    choices:
    - To increase performance by more than 100 times.
    - To ensure security against single algorithm implementation errors or future
      vulnerabilities.
    - To support all legacy clients.
    - To handshake using quantum computers.
    answer_index: 1
    explanation: Hybrid mode combines classical algorithms and PQC algorithms, serving
      as a multi-layered defense strategy to prepare for implementation defects or
      unknown vulnerabilities.
  completion_criteria:
  - Completion of building a local test environment based on oqs-provider.
  - Completion of hybrid TLS handshake and packet capture verification.
  - Completion of report including experimental results and analysis.
  - Completion of Post-Quantum Migration Roadmap.
  source_ids:
  - S2
- id: m6
  slug: performance-benchmarking
  phase_id: p3
  title: Performance Evaluation and Benchmarking
  estimated_hours: 8.0
  prerequisites:
  - m5
  objectives:
  - Understand the performance evaluation indicators (time, memory, throughput) for
    post-quantum cryptographic algorithms (ML-KEM).
  - Analyze the impact of KEM operations on performance in the TLS 1.3 handshake process.
  - Benchmark the performance of hybrid cryptographic modes utilizing the Liboqs and
    oqs-provider framework.
  theory_markdown: '## Performance Evaluation and Benchmarking


    Migration to Post-Quantum Cryptography (PQC) is not just about algorithm replacement,
    but a problem directly linked to the performance of existing network protocols
    (e.g., TLS 1.3). In particular, KEM (Key Encapsulation Mechanism) operations directly
    impact the handshake latency and server connection processing throughput (handshakes
    per second) [S2].


    ### Performance Indicators

    1. **Computation Time:** CPU cycles or time (ms) spent on key generation (KeyGen),
    encapsulation (Encaps), and decapsulation (Decaps).

    2. **Data Size:** Size of public keys and encapsulated text (ciphertext). This
    determines network bandwidth consumption and potential for fragmentation.

    3. **Throughput:** Number of handshakes processable per second. Optimized implementations
    (e.g., utilizing AVX-512) increase polynomial multiplication and modular operation
    speed, greatly improving throughput [S2].


    ### Hybrid Mode

    During migration, a hybrid approach using traditional algorithms (ECDH) together
    with PQC (ML-KEM) is recommended. This is to secure PQC''s security benefits while
    preparing for PQC''s potential vulnerabilities. Hybrid modes have increased computational
    complexity, so performance degradation must be closely evaluated [S2].'
  worked_examples:
