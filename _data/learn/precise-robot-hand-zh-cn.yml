course:
  course_type: build_project
  slug: precise-robot-hand
  title: 制作精密的 5 仿生机器人手
  summary: 这是一个大学及研究生水平的实践型课程，从机器人工程基础出发，指导学生自行设计、制作、控制和验证 5 仿生机器人手。
  outcome: 学生将理解执行器、控制器、传感器集成及肌腱驱动机制，并能够对精密机器人手进行原型制作。
  audience: 机器人工程入门的学生及工程志向者
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3D 打印机
  - 万用表
  - 电烙铁
  - 常用手工工具
  - PC-CF 专用硬化钢喷嘴
  - 防冲击作业护目镜
  - 游标卡尺
  safety_summary:
  - 本设备为低压教学原型，并非认证的机器安全系统
  - 不得将学习者制作的停止电路用作安全功能或紧急停止装置
  - 正常停止应通过软件转矩释放执行，计划停止后的维护与接近前，必须物理断开 3 个绝缘电源适配器，并测量确认处于无电状态
  - 通电期间不得将手伸入运动范围，应先在固定夹具上从空载开始测试
  - 切割、钻孔、肌腱张力测试期间必须佩戴防冲击作业护目镜
  - 检测到异常发热、气味或烟雾时，切勿靠近，应切断危险区域外预先指定的建筑物配电盘断路器或认证的 upstream master disconnect 以断开
    3 个适配器的电源后再撤离。若危险区域外没有可操作的 upstream 断开手段，则禁止系统通电。转矩释放不能代替断电
  - 投入人员可接触环境前，必须在具备资质的安全专家评审下，另行设计并验证双通道、手动复位、EDM、可反馈的双接触器
