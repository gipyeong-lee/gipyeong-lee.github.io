capstone:
  title: 智能 5 指机械手最终制作与测试
  deliverables:
  - 最终设计 CAD 文件
  - 集成固件及控制代码
  - 抓取性能及耐久性测试数据
  - 系统安全评估报告
  - 最终项目成果报告
  rubric:
  - 机械精度及可操作性评估
  - 实时控制算法实现水平
  - 计划停机后维护/靠近前，物理断电与无源测量流程记录的完整性
  - 文档（BOM，图纸）的完整性
  - 测试数据分析及性能验证
  safety:
  - 计划停机后维护/靠近前，物理分离 3 个绝缘电源适配器，并记录各分支残余电压在直流电压档下低于 1 V
  - 检查各独立电源分支的 10 A 保险丝额定值及时间-电流特性
  - 在固定夹具上完成空载测试后，逐步增加抓取负载
