- id: M3
  slug: actuator-controller-selection
  phase_id: P1
  title: 执行器及控制器选型
  estimated_hours: 10.0
  prerequisites:
  - M2
  objectives:
  - 理解 DYNAMIXEL XM430-W350-T 执行器的额定电压、电流及通信特性。
  - 熟悉 OpenCR 1.0 控制器的 DYNAMIXEL 端口配置及 12V 电源分离结构。
  - 设计利用 FSR 402 传感器和 10kΩ 电阻的分压电路。
  - 计算系统功率需求并制定独立分支保险丝保护设计。
  theory_markdown: '### 执行器与控制器系统设计理论


    #### 1. 执行器选型与功率特性

    为实现机器人手的精密驱动，选用 DYNAMIXEL XM430-W350-T。该执行器在 12V 额定电压下工作，失速(Stall)电流为 2.3A [S11]。整个机器人手由
    11 个执行器组成，因此总失速电流合计达到约 25.3A。因此，为了稳定驱动，需要独立的电源供应体系。


    #### 2. 控制器架构

    OpenCR 1.0 搭载 216MHz ARM Cortex-M7 处理器，适合实时控制 [S13]。该控制器支持物理分离 12V 执行器电源和逻辑/传感器电源的结构。由于
    FSR 传感器等模拟输入需在 0~3.3V 范围内处理，因此传感器分压电路必须从 OpenCR 的 3.3V 传感器导轨获取电源 [S13]。


    #### 3. 过电流防护与电源分支设计

    使用 3 个 138W 输出的 MEAN WELL GST160A12-R7B 适配器 [S15]。每个适配器的额定电流为 11.5A，由此创建 3 个独立的
    12V 分支。每个分支串联安装 10A ATOF 保险丝，以在发生过电流时保护电路 [S24, S25]。保险丝设定在低于额定电流 11.5A 的水平，以实现保护协调。


    #### 4. 传感器信号获取

    FSR 402 具有电阻随压力增加而减小的特性 [S12]。将其与 10kΩ 固定电阻连接成电压分压器，将力变化转换为电压信号输入到 OpenCR 的 12bit
    ADC 端口 [S12, S13, S26]。'
  worked_examples:
  - '示例 1: 确认各分支最大电流。若在一个分支上连接 4 个 XM430 执行器，失速电流合计为 4 * 2.3A = 9.2A。该值满足适配器的 11.5A
    额定值及在线保险丝的 10A 额定值，并维持在安全范围内 [S11, S15, S25]。'
  - '示例 2: FSR 分压电路电压计算。在 3.3V 电源电压下，当 FSR 电阻为 R_fsr 时，ADC 输入电压 V_adc = 3.3 * (10k
    / (10k + R_fsr)) V。根据传感器范围(0.2N~20N)确认电阻变化，进行校准以确保不超过 0~3.3V 范围 [S12, S13, S26]。'
  lab:
    title: 电源分支构建及 ADC 传感器接口实习
    steps:
    - 在每个 MEAN WELL 适配器输出端连接 0AFH0001Z 保险丝座并插入 0287010 10A 保险丝。
    - 将万用表设为 DC 电压模式，确认各分支电压是否为稳定的 12V。
    - 在 OpenCR 的 3.3V 传感器导轨上，使用 10kΩ 电阻和 FSR 402 构建分压电路。
    - 在非通电状态下，确认分压电路的输出电压是否在 0~3.3V 范围内。
    safety:
    - 作业开始前，必须物理切断 3 个适配器的 AC 电源，并用万用表确认电压为 0V。
    - 必须时刻佩戴防冲击作业护目镜。
    - 通电期间绝不可修改电路或触碰线路。
    - 明确指出保险丝仅用于过电流切断，并非计划停止手段。
    deliverables:
    - 各分支 12V 输出测量记录表
    - FSR 分压电路组装完成照片
    - 构建的配线图
  assignment:
    title: 电源分支及防护设计评审
    deliverables:
    - 机器人手整体电流分支分配表（各分支执行器分配）
    - 证明所选保险丝在保护执行器失速电流的同时未超过适配器容量的计算书
    rubric:
    - 独立保险丝是否准确部署在每个分支上？
    - 执行器分支分配是否符合 4/4/3 的规定？
    - 传感器电源是否从 3.3V 传感器导轨供给，而非 12V？
  quiz:
  - question: 利用 FSR 402 传感器和 10kΩ 电阻的正确分压电路电源连接是什么？
    choices:
    - 12V 执行器电源
    - OpenCR 3.3V 传感器导轨
    - 5V 通用电源
    - OpenCR 12V 输出
    answer_index: 1
    explanation: OpenCR 的 ADC 输入基准工作电压为 3.3V，因此电压分压电路务必从 3.3V 传感器导轨获取电源 [S13]。
  - question: XM430-W350-T 执行器的失速电流值是多少？
    choices:
    - 1.0A
    - 2.3A
    - 4.1A
    - 11.5A
    answer_index: 1
    explanation: 根据数据手册，该执行器的失速电流为 2.3A [S11]。
  - question: 在电源分支设计中绝对禁止的行为是？
    choices:
    - 在各适配器输出端安装保险丝
    - 并联适配器的正(+)输出
    - 每个分支使用 10A 保险丝
    - 使用绝缘型适配器
    answer_index: 1
    explanation: 适配器的正(+)输出必须维持为独立分支，严禁并联连接 [B3]。
  completion_criteria:
  - 实验中已通过万用表验证 3 个独立分支的 12V 电压
  - 已确认 FSR 402 传感器分压电路的配线及 ADC 输入电压范围
  - 提交电源分支及防护设计报告并获通过
  source_ids:
  - S4
  - S5
  - S11
  - S13
  - S15
  - S24
  - S25
  - S12
  - S26
- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D 打印及零部件加工
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - 理解使用碳纤维增强 PC 线材(PC-CF)进行零部件制作及优化打印设置。
  - 掌握热熔嵌件(Heat-set insert)及滑动轴承的精密组装公差管理。
  - 理解用于肌腱驱动机制的 Dyneema 线处理方法及绞盘设计结构。
  - 掌握确保机器人结构件尺寸稳定性与刚性的加工及锁紧技术。
  theory_markdown: '### 3D 打印及零部件加工理论


    #### 碳纤维增强工程材料 (PC-CF)

    PC(Polycarbonate)具有优异的刚性和耐热性，添加碳纤维的 PC-CF 线材可最大化刚性，适合制作结构件 [S19]。但由于碳纤维的磨损性，必须使用硬化钢喷嘴
    [S19]，且需要 285°C 左右的高温打印 [S19]。


    #### 精密组装用的嵌件及锁紧

    为使塑料打印件能够反复拆装，使用热熔螺纹嵌件 [S21]。对于 M3 嵌件，必须在 CAD 设计阶段预先布置 4.0mm 直径的引孔，以确保精准定位 [S21]。此外，免润滑聚合物滑动轴承(iglide
    J)在与 8mm 铝轴组装时，其设计旨在压入后内径具有最佳游隙 [S17]，因此轴径 8mm 的公差管理至关重要 [S17, S18]。


    #### 肌腱驱动结构

    Dyneema SK78 纤维在 1.5mm 直径下具有 230 daN 的高断裂载荷和低于 1% 的伸长率 [S16]，是钢缆的优良替代品。由于肌腱在旋转轴处反复弯曲，设计圆角化的绞盘边缘以防止摩擦导致的断裂结构非常重要。'
  worked_examples:
  - '示例 1: PC-CF 线材喷嘴选择 - 考虑到碳纤维的高磨损性，Brass(黄铜)喷嘴会快速磨损导致打印质量下降和堵头，因此确认必须选择硬化钢(Hardened
    steel)喷嘴 [S19]。'
  - '示例 2: 嵌件孔设计 - Accu HTBI-M3-BR 嵌件外径为 4.4mm，但官方建议孔径为 4.0mm [S21]，因此 CAD 设计时将孔径固定为
    4.0mm，使塑料在热熔时能充分嵌入嵌件滚花(knurling)之间 [S21]。'
  lab:
    title: 手指结构件制作与组装实习
    steps:
    - 设定配备硬化钢喷嘴的 FDM 3D 打印机打印碳纤维 PC 线材的环境 [S19]。
    - 手指连杆和手掌框架打印完成后，去除支撑并整理表面。
    - 利用热工具将热熔嵌件垂直安放在 4.0mm 引孔内 [S21]。
    - 按轴承规格切割 IGUS 精密铝轴并对端部倒角 [S18]。
    - 滑动轴承压入外壳后插入轴，确认游隙 [S17]。
    - 使用 M3 帽螺钉锁紧结构件及传感器支架 [S20]。
    safety:
    - 注意高温喷嘴(285°C)及平台(110°C)导致的烫伤风险 [S19]。
    - 打印件后处理及倒角作业时必须佩戴护目镜。
    - 热熔嵌件加热时可能会产生烟雾，应开启通风设备。
    - 通电前确认所有机械锁紧状态。
    deliverables:
    - 制作完成的 5 仿生机器人手结构件（连杆、手掌）。
    - 热熔嵌件垂直度及轴承游隙测量记录。
    - 最终锁紧部位目视检查完成报告。
  assignment:
    title: 机器人手制作精度验证
    deliverables:
    - 成品结构的 CAD 数据与实际尺寸测量对比表
    - 组装公差管理计划书
    - 肌腱路径结构的减摩设计说明书
    rubric:
    - 热熔嵌件是否垂直安装（优/良/差）
    - 轴-轴承组装后是否旋转运动顺畅（合格/不合格）
    - 是否遵守 BOM 中明确的零件额定值及型号规格 [B10, B11, B12, B13, B14]
  quiz:
  - question: 使用 PC-CF 线材时必须使用硬化钢喷嘴的主要原因是？
    choices:
    - 防止碳纤维的磨损性导致黄铜喷嘴快速磨损
    - 线材熔点低，普通喷嘴无法打印
    - 为了增加打印件的表面光泽
    - 为了提高挤出速度
    answer_index: 0
    explanation: 碳纤维具有极高的磨损性，会快速损坏普通黄铜喷嘴，因此硬化钢喷嘴必不可少 [S19]。
  - question: 使用 M3 热熔嵌件(Accu HTBI-M3-BR)时建议的引孔直径是？
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: 数据手册建议的孔径为 4.0mm [S21]。
  completion_criteria:
  - 所有结构件均通过 FDM 3D 打印完成制作 [B10]
  - 热熔嵌件准确安装在所有指定孔位 [B14]
  - 铝轴与滑动轴承的组装游隙满足标准 [B11, B12]
  - 锁紧时正确使用了指定的 M3 规格帽螺钉 [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: 轴承及锁紧件安装
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - 理解精密机器人手制作所需的轴承及轴的机械公差与安装原理。
  - 学习使用热熔嵌件(Heat-set insert)确保工程塑料零件锁紧强度的方法。
  - 使用合适的转矩和锁紧规格，最大限度减少组装游隙。
  theory_markdown: '### 轴承与轴的公差管理

    为保证精密机器人关节的顺畅运动及刚性，使用 iglide® J 滑动轴承(JSM-0810-10)和 8 mm 铝合金精密轴(AWMP-08)。滑动轴承设计为在外壳中压入(press-fit)时内径会进行调整，遵循外壳建议的内径公差是关键
    [S17, S18]。游隙过大会降低关节精度，而过窄则会导致摩擦力增加，降低执行器(DYNAMIXEL XM430)的电流效率。


    ### 热熔嵌件安装

    PC-CF(碳纤维增强 PC)打印件若直接锁紧金属螺钉，因材料特性极易磨损螺纹。为防止此类情况，使用黄铜材质的热熔嵌件(HTBI-M3-BR) [S21]。嵌件插入
    4.0 mm 引孔后加热熔化周围树脂进行锁紧，即使反复拆装也能维持极高的机械强度 [S21]。若此时嵌件倾斜，会导致组装后的连杆对齐偏差，因此保持垂直至关重要。'
  worked_examples:
  - '示例 1: 确认外壳内径 - iglide® JSM-0810-10 轴承外径为 10 mm。因此外壳孔径必须按 10 mm 设计，且插入嵌件时若不遵守
    4.0 mm 的引孔规格，会导致嵌件打滑或外壳损坏 [S17, S21]。'
  - '示例 2: M3 螺钉组装 - M3x10 帽螺钉使用 2.5 mm 内六角扳手锁紧，过大转矩会导致嵌件周围树脂产生裂纹，因此要在“不再转动的一点”用最小限度的力固定
    [S20]。'
  lab:
    title: 机器人手关节精密组装
    steps:
    - 1. 确认 PC-CF 打印件外壳上的 4.0 mm 引孔干净，将嵌件垂直对齐。
    - 2. 将烙铁加热至合适温度，垂直缓慢按下嵌件，使其与外壳表面平行压入。
    - 3. 将 iglide® 轴承压入孔位，插入 8 mm 铝轴，确认游隙与阻力。
    - 4. 使用 M3 螺钉完成连杆间锁紧，转动关节验证摩擦是否均匀。
    safety:
    - 烙铁温度极高，注意烫伤，加热后立即放入架上。
    - 嵌件压入时产生的微尘应防止吸入，必须彻底通风。
    - 佩戴护目镜进行作业。
    - 检测到异常发热、气味或烟雾时，切勿靠近，应切断危险区域外预先指定的建筑物配电盘断路器或认证的 upstream master disconnect 以断开
      3 个适配器的电源后再撤离。若危险区域外没有可操作的 upstream 断开手段，则禁止系统通电。转矩释放不能代替断电。维护与接近必须在计划停止后，通过物理断开及测量确认无电后方可执行。
    deliverables:
    - 关节摩擦测试日志
    - 嵌件垂直对齐检查照片
    - 组装后连杆的自由度及游隙测量记录
  assignment:
    title: 组装公差及锁紧力分析报告
    deliverables:
    - 关节组装顺序及转矩管理计划书
    - 发生游隙时的解决方法（使用垫片或修改公差）技术描述
    - 已组装机器人手连杆的抓取测试预备数据
    rubric:
    - 是否明确描述了嵌件插入的垂直度？
    - 是否正确解释了轴承与轴的公差概念？
    - 是否遵守了组装阶段的安全守则？
  quiz:
  - question: iglide® J 轴承压入外壳后内径发生调整的原因是什么？
    choices:
    - 因轴承材料的弹性，压入时内径自动增大。
    - 设计旨在压入过程中根据外壳孔径的公差精密调整轴承内径。
    - 压入前的内径总是制作得比基准值小。
    answer_index: 1
    explanation: iglide® 滑动轴承在压入前制作得比基准值大，在压入正确的外壳孔径中时，设计为达到规定公差内的内径 [S17]。
  - question: 在 PC-CF 打印件上使用黄铜热熔嵌件时合适的引孔尺寸是？
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: 根据数据手册，HTBI-M3-BR 嵌件建议的引孔尺寸为 4.0 mm [S21]。
  completion_criteria:
  - 确认已组装的 5 个手指关节的摩擦阻力均匀并提交测量记录。
  - 目视及尺寸检查确认所有嵌件均与 PC-CF 外壳水平。
  - 签署组装过程中已遵守安全守则的誓言书并提交作业记录簿。
  source_ids:
  - S17
  - S18
  - S20
  - S21
- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: 配线与安全断电构建
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - 理解执行器驱动所需的独立 12 V 电源分支构建方法。
  - 学习用于过电流防护的 ATOF 保险丝的作用及选型原理。
  - 掌握安全电源管理及物理断开协议。
  - 配置 OpenCR 控制器及 FSR 传感器的安全分压电路。
  theory_markdown: '## 安全配线及电源分离原理


    5 仿生机器人手系统使用了多个高转矩执行器，因此高效且安全的电源分配至关重要。本项目使用 11 个电源适配器将执行器分为 4台/4台/3台单位进行独立 배치，目的是分散各分支的电流负载并提高电源稳定性
    [S15]。


    ### 1. 电源独立性保障

    各适配器的正(+)输出必须维持为独立分支，严禁任意合并或捆绑。应在 [S15] 指定的适配器额定输出电流(11.5 A)内，设计以承载执行器峰值电流（XM430-W350-T
    1台合计 2.3 A）[S11]。 4 台单位分支的峰值电流合计为 9.2 A，在适配器的连续输出允许范围内。


    ### 2. 过电流防护 (Protection Coordination)

    在每个分支部署 10 A ATOF 保险丝，以保护系统免受线路或执行器故障引发的过电流侵害 [S25]。仅凭保险丝与负载/电源额定的对比并不能保证安全性或动作顺序。需结合保险丝制造商的时间-电流曲线及电源
    OCP 特性确认保护协调。但保险丝选型必须参照制造商提供的 ''Time-Current Curve''，即便负载电流较低也不代表安全性得到保证 [S25]。


    ### 3. 控制电路分离

    使用 DYNAMIXEL 端口内置型 OpenCR 控制板，通过消除复杂的外部桥接电路来提高可再现性 [S13]。 FSR 力传感器为将电压转换为 ADC
    输入，使用从 3.3 V 传感器导轨供给的分压电路，该电路必须与 12 V 执行器电源进行电气隔离 [S13]。


    ### 4. 作业安全守则

    台式原型并非认证的机器安全系统，因此在进行维护或修正作业前，必须物理断开 3 个电源适配器，并使用万用表 DC 电压模式计量确认各分支的残余电压低于 1 V
    [S7]。'
  worked_examples:
  - 检测到异常发热、气味或烟雾时，切勿靠近，应切断危险区域外预先指定的建筑物配电盘断路器或认证的 upstream master disconnect 以断开
    3 个适配器的电源后再撤离。若危险区域外没有可操作的 upstream 断开手段，则禁止系统通电。转矩释放不能代替断电。维护与接近必须在计划停止后，通过物理断开及测量确认无电后方可执行
    [S11] [S25]
  - '示例 2: FSR ADC 电路电压 - 使用 OpenCR 的 3.3 V 传感器导轨，连接 10 kΩ 分压电阻和 FSR 402 [S13, S26]。传感器信号电压必须在
    0~3.3 V 范围内，该电路必须与 12 V 执行器电源电路进行物理/电气分离防护。'
  lab:
    title: 电源分支线束制作与安全点检
    steps:
    - 在各适配器输出线路焊接 ATO 在线保险丝座，并插入 10 A ATOF 保险丝 [S24, S25]。
    - 使用 Molex Micro-Fit 3.0 连接器制作执行器及传感器连接线束 [S14]。
    - 将 OpenCR 板与各执行器分配为 3 个分支进行配线，并连接至各电源适配器 [S13]。
    - 通电前，用万用表电阻模式确认各适配器输出端的绝缘状态。
    - 通电后，在电压模式确认各分支为 12 V，断开时必须移除 3 个适配器。
    safety:
    - 维护前必须物理断开 3 个电源适配器。
    - 在万用表确认残余电压低于 1 V 后，方可更换零件。
    - 通电期间不得将手伸入活动范围。
    - 所有接点需进行绝缘处理，焊接时必须佩戴护目镜。
    deliverables:
    - 制作完成的电源分支线束照片
    - 各分支测量电压记录表
    - 配线图检查确认书
  assignment:
    title: 安全配线设计报告
    deliverables:
    - 3 个电源分支的执行器分配设计方案（每分支 4台/4台/3台）
    - 各分支过电流切断计算书（峰值电流与保险丝额定值对比）
    - 维护与接近前，必须物理断开 3 个电源适配器，并计量确认各分支处于无电状态
    rubric:
    - 是否遵守了电源独立性与分离原则？
    - 保险丝与连接器的额定值是否针对负载进行了适当选型？
    - 电源断开及残余电压确认协议是否遵循安全指南？
  quiz:
  - question: 各电源适配器的 12 V 输出(+)是否可以并联？
    choices:
    - 可以，电流供给能力会增强。
    - 不可以，必须维持为独立分支。
    - 电压一致时可以并联。
    - 添加保险丝后可以并联。
    answer_index: 1
    explanation: 各适配器输出必须维持独立，严禁并联连接 [S15]。
  - question: 维护机器人手前最优先采取的安全措施是什么？
    choices:
    - 软件转矩释放
    - 万用表电阻测量
    - 3 个电源适配器的物理断开及残余电压确认
    - 按下计划停止按钮
    answer_index: 2
    explanation: 维护前必须物理断开 3 个电源适配器，并用万用表确认各分支残余电压低于 1 V。
  - question: FSR 力传感器 ADC 电路应使用什么电源导轨？
    choices:
    - 12 V 执行器导轨
    - 5 V 电源导轨
    - 3.3 V 传感器导轨
    - 24 V 电源导轨
    answer_index: 2
    explanation: 为保护 OpenCR 的 ADC 电路，必须使用 3.3 V 传感器导轨 [S13]。
  completion_criteria:
  - 已完成 3 个独立分支线束配置及保险丝安装
  - 各分支空载电压测得为 12 V
  - 物理断开电源后，所有测量节点的残余电压均记录为低于 1 V
  - 提交配线安全设计报告并获通过
  source_ids:
  - S14
  - S24
  - S25
  - S7
  - S15
  - S11
  - S13
  - S26
- id: M7
  slug: firmware-development
  phase_id: P3
  title: 固件开发与控制
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - 理解 DYNAMIXEL 智能执行器通信及控制框架。
  - 实现利用 OpenCR 控制板进行执行器及 FSR 传感器信号获取。
  - 设计实时机器人控制状态机及闭环反馈回路。
  - 编程安全电源管理及转矩释放序列。
  theory_markdown: '### 固件架构与 DYNAMIXEL 控制

    机器人手的固件在高频循环内获取传感器数据并处理执行器指令。 `OpenCR 1.0` 控制器基于 216MHz ARM Cortex-M7 处理器 [S13]，直接处理
    DYNAMIXEL 协议 2.0，无需额外桥接 [S11]，最大限度减小延迟。各执行器支持电流、速度、位置模式，机器人手使用基于电流控制的力矩抓取策略。


    ### FSR 力反馈系统

    FSR 402 传感器具有电阻与施加力成反比的特性 [S12]。使用 OpenCR 的 12 位 ADC [S13]，在 3.3V 传感器导轨上构建 10kΩ
    电阻分压电路。分压电压通过 `ADC值 = (V_in * R_fsr) / (R_fsr + R_ref)` 归一化，该值与手指肌腱张力联动，作为抓取力反馈使用。


    ### 安全控制例程

    系统停止为确保安全分为两阶段。软件阶段，释放执行器转矩(Torque Off)，立即移除物理驱动力。维护前，必须物理断开 3 个独立电源适配器，并使用万用表
    DC 模式确认所有分支均低于 1V。'
  worked_examples:
  - 1. 执行器目标位置/电流设定：使用 DYNAMIXEL SDK 设定 XM430 执行器的电流限制(Goal Current)，并通过传感器反馈值的 PID
    回路更新手指关节最终位置的示例。
  - 2. FSR 电压数据滤波：为去除 ADC 采集的原始数据噪声，应用移动平均滤波(Moving Average Filter)，并实现归一化上限(20N)与下限(0.2N)范围的代码
    [S12]。
  lab:
    title: 机器人手集成控制与精密抓取实习
    steps:
    - 用万用表 DC 模式确认各独立分支电压低于 1V 后，开始组装。
    - 在 OpenCR 的 3.3V 传感器导轨焊接 FSR 分压电路并连接至 ADC 端口。
    - 使用 DYNAMIXEL SDK 扫描 11 个执行器 ID 并设定初始位置。
    - 空载状态测试手指关节驱动指令，调节肌腱伸长率与张力。
    - 在串口监视器可视化 FSR 传感器数据，调优抓取力响应。
    safety:
    - 绝不可将 5V 或 12V 执行器电源用作 FSR 传感器电路的供给电源。
    - 系统通电期间绝不可接近手指活动范围，应使用固定夹具。
    - 绝不可将电源分支适配器的正(+)端子相互连接。
    - 维护与组装接近前，必须物理断开 3 个电源适配器，并计量确认所有分支低于 1V。
    deliverables:
    - 包含实时传感器数据反馈的固件源代码
    - 电压分压数据的归一化及校准数据手册
    - 执行器反馈回路正常工作日志
  assignment:
    title: 抓取状态机设计与实现
    deliverables:
    - 抓取及释放状态机流程图
    - 基于电流的力矩控制实现代码
    - 最终性能评估报告
    rubric:
    - 根据传感器值进行的电流限制范围(0-2.3A)控制是否稳定？
    - 当发出力矩解除指令时，物理张力是否立即消失？
    - 代码中是否明确了安全的硬件分离流程？
  quiz:
  - question: 配置 FSR 402 传感器和分压电路时，推荐的电源轨是什么？
    choices:
    - 12V 执行器电源轨
    - 5V 通用电源轨
    - OpenCR 3.3V 传感器轨
    - 24V 外部输入轨
    answer_index: 2
    explanation: 为确保系统安全和保护 OpenCR ADC，FSR 分压电路必须连接到 3.3V 传感器电源轨。
  - question: 维护机械手时，确认系统处于“无源状态”的正确方法是什么？
    choices:
    - 通过软件发送力矩解除指令。
    - 使用万用表的电阻档检查布线状态。
    - 使用万用表直流电压档测量所有分支电压是否低于 1V。
    - 拆除电源分支保险丝。
    answer_index: 2
    explanation: 物理断电后，必须使用万用表直流电压档直接确认所有分支的残余电压低于 1V。
  - question: 可以将多个独立电源适配器的正极(+)端并联连接吗？
    choices:
    - 为了电流求和是必要的。
    - 绝对禁止。
    - 若额定输出电流相同则可以。
    - 安装保险丝后可以。
    answer_index: 1
    explanation: 独立分支配置的电源适配器的正极(+)输出绝对不能相互连接或合并。
  completion_criteria:
  - 使用万用表验证各分支独立供电及保险丝保护均已按 BOM 规范配置完毕
  - 确认通过 OpenCR ADC 精确获取 5 个 FSR 传感器的力信号及滤波效果
  - 完整执行软件力矩解除例程及物理断电后的测量流程
  - 抓取状态机按预期处理执行器和传感器数据，并提交最终报告
