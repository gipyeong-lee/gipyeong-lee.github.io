- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D Printing and Part Machining
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - Understand part fabrication and print setting optimization using carbon-fiber-reinforced
    PC filament (PC-CF).
  - Master assembly tolerance management for heat-set inserts and sleeve bearings.
  - Understand Dyneema line handling and capstan design structures for tendon-driven
    mechanisms.
  - Master machining and fastening techniques to secure the dimensional stability
    and rigidity of robot structures.
  theory_markdown: '### 3D Printing and Part Machining Theory


    #### Carbon-Fiber-Reinforced Engineering Material (PC-CF)

    PC (Polycarbonate) has excellent rigidity and heat resistance, and PC-CF filament
    reinforced with carbon fiber maximizes rigidity, making it suitable for manufacturing
    structural parts [S19]. However, due to the abrasiveness of carbon fiber, a hardened
    steel nozzle must be used [S19], and high-temperature printing around 285°C is
    required [S19].


    #### Inserts and Fastening for Precision Assembly

    Heat-set threaded inserts are used to enable repeated assembly/disassembly of
    plastic prints [S21]. For M3 inserts, a pilot hole with a diameter of 4.0mm must
    be pre-arranged in CAD design to ensure accurate placement [S21]. Additionally,
    lubrication-free polymer sleeve bearings (iglide J) are designed to have optimal
    clearance after press-fitting when assembled with 8mm aluminum shafts [S17], and
    tolerance management for an 8mm shaft diameter is essential [S17, S18].


    #### Tendon-Driven Structure

    Dyneema SK78 fiber shows a high breaking load of 230 daN at a 1.5mm diameter and
    an elongation of less than 1% [S16], making it an excellent replacement for steel
    cables. Since tendons undergo repeated bending at the axis of rotation, structural
    design that rounds capstan corners to prevent wire breakage due to friction is
    important.'
  worked_examples:
  - 'Example 1: PC-CF filament nozzle selection - Considering the high abrasiveness
    of carbon fiber, verify that a brass nozzle will wear quickly, causing poor print
    quality and nozzle clogging, and therefore a hardened steel nozzle must be selected
    [S19].'
  - 'Example 2: Insert hole design - Since the outer diameter of the Accu HTBI-M3-BR
    insert is 4.4mm but the official recommended hole diameter is 4.0mm [S21], fix
    the hole diameter at 4.0mm in CAD design so that plastic sufficiently penetrates
    between insert knurling during heat-set [S21].'
  lab:
    title: Finger Structure Fabrication and Assembly Lab
    steps:
    - Set up FDM 3D printer environment for carbon fiber PC filament with a hardened
      steel nozzle installed [S19].
    - Print finger links and palm frame, remove supports, and finish surfaces.
    - Vertically place heat-set inserts into 4.0mm pilot holes using a hot tool [S21].
    - Cut and chamfer IGUS precision aluminum shafts according to bearing specifications
      [S18].
    - Press-fit sleeve bearings into the housing and insert the shaft to check clearance
      [S17].
    - Fasten structures and sensor brackets with M3 cap screws [S20].
    safety:
    - Caution against burns from high-temperature nozzles (285°C) and beds (110°C)
      [S19].
    - Must wear safety glasses when post-processing and chamfering prints.
    - Operate ventilation facilities as smoke may be generated during insert heating.
    - Verify all mechanical fastening states before applying power.
    deliverables:
    - Manufactured 5-finger robotic hand structure (links, palm).
    - Heat-set insert perpendicularity and bearing clearance measurement records.
    - Final fastening visual inspection completion report.
  assignment:
    title: Robotic Hand Fabrication Precision Verification
    deliverables:
    - Comparison table of actual dimension measurements versus CAD data of finished
      structure
    - Assembly tolerance management plan
    - Explanation of friction-reducing design for tendon routing structure
    rubric:
    - Perpendicularity of heat-set insert (High/Med/Low)
    - Smooth rotational movement after shaft-bearing assembly (Pass/Fail)
    - Compliance with part ratings and model specifications listed in BOM [B10, B11,
      B12, B13, B14]
  quiz:
  - question: What is the main reason for using a hardened steel nozzle when using
      PC-CF filament?
    choices:
    - To prevent rapid wear of brass nozzles due to carbon fiber abrasiveness
    - Filament melting point is low, so it cannot be printed with standard nozzles
    - To increase the surface gloss of the print
    - To increase extrusion speed
    answer_index: 0
    explanation: Carbon fiber is highly abrasive and will quickly damage standard
      brass nozzles, making a hardened steel nozzle essential [S19].
  - question: What is the recommended pilot hole diameter when using an M3 heat-set
      insert (Accu HTBI-M3-BR)?
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: The hole diameter recommended in the official datasheet is 4.0mm
      [S21].
  completion_criteria:
  - All structural parts successfully fabricated with FDM 3D printer [B10]
  - Heat-set inserts accurately seated in all designated holes [B14]
  - Clearance between aluminum shaft and sleeve bearing satisfies standard values
    [B11, B12]
  - Correct M3 cap screws used as specified for fastening [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: Bearing and Fastening Part Installation
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - Understand mechanical tolerances and installation principles of bearings and shafts
    for precision robotic hand production.
  - Master methods to secure fastening strength of engineering plastic parts using
    heat-set inserts.
  - Minimize assembly clearance using appropriate torque and fastening specifications.
  theory_markdown: '### Bearing and Shaft Tolerance Management

    For smooth movement and rigidity of precision robot joints, iglide® J sleeve bearings
    (JSM-0810-10) and 8 mm aluminum precision shafts (AWMP-08) are used. Sleeve bearings
    are designed to adjust their inner diameter when press-fitted into a housing,
    and compliance with the recommended housing inner diameter tolerance is key [S17,
    S18]. If clearance occurs, joint precision drops; conversely, if too narrow, friction
    increases, degrading the current efficiency of the actuator (DYNAMIXEL XM430).


    ### Heat-Set Insert Installation

    PC-CF (carbon-fiber-reinforced PC) prints tend to wear out threads easily when
    metal screws are directly fastened due to material characteristics. To prevent
    this, brass heat-set inserts (HTBI-M3-BR) are used [S21]. Inserts are inserted
    into 4.0 mm pilot holes and fastened by melting surrounding resin with heat, maintaining
    high mechanical strength even after repeated disassembly and assembly [S21]. Verticality
    is essential here, as tilting causes misalignment of the assembled links.'
  worked_examples:
  - 'Example 1: Housing inner diameter check - The outer diameter of the iglide® JSM-0810-10
    bearing is 10 mm. Therefore, the housing bore should be designed to fit 10 mm,
    and if the pilot hole 4.0 mm is not maintained when inserting, the insert may
    spin loosely or the housing may be damaged [S17, S21].'
  - 'Example 2: M3 screw assembly - Fasten M3x10 cap screws using a 2.5 mm hex key;
    excessive torque can cause cracks in the resin around the insert, so fix with
    minimal force at the point where it ''no longer turns'' [S20].'
  lab:
    title: Robotic Hand Joint Precision Assembly
    steps:
    - 1. Check if the 4.0 mm pilot hole in the PC-CF print housing is clean, and align
      the insert vertically.
    - 2. Heat the soldering iron to an appropriate temperature and slowly press the
      insert vertically to press-fit it parallel to the housing surface.
    - 3. Press-fit the iglide® bearing into the bore, and insert the 8 mm aluminum
      shaft to check clearance and resistance.
    - 4. Complete fastening between links using M3 screws, and move the joint to verify
      that friction is uniform.
    safety:
    - Soldering irons are high temperature; use caution regarding burns and place
      in a stand immediately after heating.
    - Ventilate thoroughly to avoid inhaling micro-dust generated during insert press-fitting.
    - Proceed with work while wearing safety glasses.
    - If abnormal heat, odor, or smoke is detected, do not approach; disconnect the
      power supply of the 3 adapters at a pre-designated building distribution board
      circuit breaker outside the hazard zone or via an authorized upstream master
      disconnect, and evacuate. If no upstream disconnection means capable of operating
      outside the hazard zone is available, do not energize the system. Torque release
      is not a substitute for power disconnection. Maintenance/access should only
      be performed after planned stops, physical disconnection, and verification of
      a de-energized state by measurement.
    deliverables:
    - Friction test logs per joint
    - Photos of insert vertical alignment confirmation
    - Records of degrees of freedom and clearance measurements of assembled links
  assignment:
    title: Assembly Tolerance and Fastening Force Analysis Report
    deliverables:
    - Joint assembly order and torque management plan
    - Technical solution for clearance occurrence (use of shims or tolerance modification)
    - Preliminary grasp test data for assembled robotic hand links
    rubric:
    - Was the verticality of insert insertion clearly described?
    - Was the concept of bearing and shaft tolerance correctly explained?
    - Were assembly stage safety rules followed?
  quiz:
  - question: Why does the inner diameter of an iglide® J bearing adjust after being
      press-fitted into a housing?
    choices:
    - The inner diameter automatically increases due to the elasticity of the bearing
      material.
    - It is designed so that the inner diameter is precisely adjusted to the tolerance
      of the housing bore during the press-fitting process.
    - Because the inner diameter before press-fitting is always manufactured to be
      smaller than the reference value.
    answer_index: 1
    explanation: iglide® sleeve bearings are manufactured larger than the reference
      value before press-fitting and are designed to have an inner diameter within
      the designed tolerance when press-fitted into the correct housing bore [S17].
  - question: What is the appropriate pilot hole size when using brass heat-set inserts
      on PC-CF prints?
