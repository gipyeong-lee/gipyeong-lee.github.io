capstone:
  title: Final Assembly and Gripping Test of Robot Hand
  deliverables:
  - Final assembled robot hand
  - Control firmware source code
  - Gripping test data records
  - Final project report
  rubric:
  - Mechanical precision and workspace
  - Grip success rate (targeting various objects)
  - Control system response speed
  - Adherence to electrical and mechanical safety
  safety:
  - After planned shutdown and before maintenance/access, physically disconnect 3
    isolated power adapter(s) and record that residual voltage of each branch is less
    than 1 V in DC voltage mode
  - Check 10 A fuse rating and time-current characteristics of each independent power
    branch
  - Gradually increase gripping load after no-load test on fixed jig
  - Wear impact-resistant safety goggles during cutting, drilling, tendon tensioning,
    and gripping tests
