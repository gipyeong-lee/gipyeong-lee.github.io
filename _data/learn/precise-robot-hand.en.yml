modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: Fundamentals of Robot Kinematics
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - Understand the basic definitions of robot kinematics and the concept of rigid-body
    transformation.
  - Learn how to mathematically describe the position and orientation of a robot using
    coordinate system transformations and rotation matrices.
  - Acquire basic kinematic theories for designing an 5-finger robotic hand and learn
    analytical approaches.
  theory_markdown: '## Fundamentals of Robot Kinematics


    Robot kinematics is the study of robot motion in terms of position, velocity,
    and acceleration without considering forces or torques [S1]. The starting point
    for designing a manipulator, such as a robotic hand, is to describe the state
    of each joint as coordinates in space.


    ### 1. Rigid-body Transformation

    Each link of a robot is considered a rigid body, and the transformation from one
    coordinate system to another is represented as a combination of rotation and translation.
    In 3-dimensional space, the rotation matrix $R$ is an orthogonal matrix, through
    which the orientation between two coordinate systems is defined [S1].


    ### 2. Forward Kinematics

    Forward kinematics is the process of calculating the position and orientation
    of the end-effector when the joint variables (angles or positions) are known.
    For an 5-finger robotic hand, the position of the fingertips is obtained through
    the finger joint angles ($\theta_1, \theta_2, \dots, \theta_n$).


    ### 3. Inverse Kinematics

    Inverse kinematics is the process of finding the joint variables required to achieve
    a desired fingertip position. It consists of non-linear equations, and solutions
    may not exist or multiple solutions may occur [S1].'
  worked_examples:
  - 'Example 1: Find the end position $(x, y)$ of a robot link with 1 rotation joints
    in a 2-dimensional plane. When the joint angle is $\theta$ and link length is
    $L$, $x = L \cos(\theta)$ and $y = L \sin(\theta)$ [S1].'
  - 'Example 2: Describe a 2-dimensional rotation matrix $R$ that rotates by $\theta$
    about the $x$-axis. $R = \begin{bmatrix} \cos(\theta) & -\sin(\theta) \\ \sin(\theta)
    \\ \cos(\theta) \end{bmatrix}$ [S1].'
  lab:
    title: Coordinate System Transformation Simulation and Basic Kinematic Analysis
    steps:
    - Create an 2-link planar manipulator model using kinematic analysis software.
    - Observe the trajectory of the end position while changing the joint angles.
    - Derive inverse kinematic equations manually and compare them with the simulation
      results.
    safety:
    - Adjust screen brightness and take periodic breaks when working on computers.
    - This practice is simulation-based, so hardware energization is not required.
    deliverables:
    - Summary report including the kinematic analysis process
    - Trajectory simulation result images
  assignment:
    title: Kinematic Modeling of 5-Finger Robotic Hand Joint Structure
    deliverables:
    - Forward kinematics equation derivation results for 1 robot fingers
    - Fingertip position change prediction data according to joint angle changes
    rubric:
    - Mathematical accuracy of rotation matrices
    - Physical validity of forward kinematics equations
    - Logical structure of the report
  quiz:
  - question: What is the discipline in robot kinematics that describes only motion
      without considering forces or torques?
    choices:
    - Dynamics
    - Kinematics
    - Control Theory
    - Material Mechanics
    answer_index: 1
    explanation: Kinematics is the study of motion focused on position, velocity,
      and acceleration, excluding force and torque [S1].
  - question: In 3-dimensional space, what matrix defines the orientation between
      two coordinate systems?
    choices:
    - Rotation Matrix
    - Mass Matrix
    - Stiffness Matrix
    - Damping Matrix
    answer_index: 0
    explanation: A rotation matrix is an orthogonal matrix that mathematically transforms
      orientation between two coordinate systems [S1].
  completion_criteria:
  - Completion of theory lectures
  - Submission of kinematic analysis result report
  - Achieve 100 points on the theory quiz
  source_ids:
  - S1
- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: Tendon-Driven Mechanism Design
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - Understand the basic mechanical structure of tendon-driven mechanisms and the
    principles of joint simulation.
  - Learn the characteristics of tendon material (Dyneema SK78) for sophisticated
    robotic hands.
  - Learn tendon tension transmission paths and methods to prevent friction and wear
    in capstan design.
  - Calculate the stall torque of actuators and mechanical gain during tendon driving.
  theory_markdown: '## Fundamentals of Tendon-Driven Mechanisms


    A tendon-driven system is a method of driving by transmitting tension from remotely
    located actuators to joints via tendons (cables) [S9]. By mimicking the tendon
    structure of biological fingers and moving actuators to the palm or forearm, the
    mass of the fingers themselves is reduced, enabling sophisticated movements [S10].


    ### 1. Selection and Tension Transmission of Tendons

    Dyneema SK78, a high-strength, low-elongation fiber, is used in this design [S16].
    This material has a breaking load of 230 daN (approx. 230 kgf) at a diameter of
    1.5 mm, with an operating elongation of less than 1%, making it suitable for precision
    position control [S16].


    ### 2. Mechanical Gain and Actuator Selection

    The XM430-W350-T smart actuator provides a stall torque of 4.1 N·m [S11]. Since
    the tendon transforms force through the capstan radius from the axis of rotation,
    the actuator''s torque output is replaced by tendon tension. The entire system
    uses 11 actuators, and the peak current total can reach approximately 25.3 A [S11].
    Comparing fuse and load/power ratings alone does not guarantee safety or operating
    sequences. Review the fuse manufacturer''s time-current curves and power supply
    OCP characteristics together to verify protection coordination [S15, S24, S25].


    ### 3. Safety and Protection Design

    Each 12 V power branch is operated through an independent fuse [S15, S24]. The
    3 power adapters are each rated at 11.5 A, with a combined current capacity reaching
    34.5 A, which sufficiently accommodates the system peak current of 25.3 A [S11,
    S15]. Design such that the sum of branch ratings exceeds the total actuator peak
    current to ensure operational safety.'
  worked_examples:
  - 'Example 1: Calculating tendon tension during driving

    When actuator torque (τ) is 1 N·m and capstan radius (r) is 0.01 m, tendon tension
    (T) is T = τ/r = 1/0.01 = 100 N. Design considering the safety factor against
    Dyneema SK78''s breaking load of 230 daN (approx. 2300 N) [S16].'
  - 'Example 2: Power branch distribution and protection

    The sum of stall currents for all 11 actuators is 25.3 A [S11]. If distributed
    into 3 branches with 4, 4, and 3 units, the maximum load for each branch is 9.2
    A, 9.2 A, and 6.9 A respectively. Comparing fuse and load/power ratings alone
    does not guarantee safety or operating sequences. Review the fuse manufacturer''s
    time-current curves and power supply OCP characteristics together to verify protection
    coordination. Review the fuse manufacturer''s time-current curves and adapter
    OCP characteristics together to verify protection coordination [S24, S25].'
  lab:
    title: Tendon Tension and Joint Friction Measurement Practice
    steps:
    - Assemble the finger joint model using the provided links and bearings.
    - Connect the tendons and set initial tension using the tensioner.
    - Set the multimeter to DC voltage mode and physically verify the 12 V power adapter
      output for each branch.
    - Manually measure and record the rotational friction of the joint before energizing.
    safety:
    - Before maintenance/access, physically disconnect the 3 insulated power adapters
      and verify DC voltage of less than 1 V using a multimeter.
    - Never approach the operating range of the fingers while power is applied.
    - Always wear impact-resistant work goggles.
    deliverables:
    - Tendon tension measurement data according to joint rotation angle
    - Friction analysis report
    - Final safety measurement records
  assignment:
    title: 5-Finger Robotic Hand Tendon Path Design
    deliverables:
    - CAD drawings of robotic finger tendon paths
    - Tendon friction and loss calculation sheet
    - Branch-specific power load distribution and fuse protection design
    rubric:
    - Is the tendon path designed to minimize friction at bends?
    - Are the physical characteristics of Dyneema SK78 considered?
    - Does the load distribution of the 3 power branches appropriately reflect actuator
      stall current?
    - Do the fuse and power short-circuit protection designs comply with BOM specifications?
  quiz:
  - question: What is the main advantage of using Dyneema SK78 tendons?
    choices:
    - Shock absorption due to high elongation
    - Very low operating elongation and high breaking load
    - Lighter weight and lower tensile strength than metal
    - Electrical conductivity
    answer_index: 1
    explanation: Dyneema SK78 has very low elongation of less than 1%, improving precision
      of position control, and is a high-performance fiber with a very high breaking
      load [S16].
  - question: What is the appropriate reason for using 3 power adapters (11.5 A each)
      with 12 V?
    choices:
    - To drive all actuators with a single power source
    - To boost voltage to 36 V to increase torque
    - To distribute and accommodate total peak current of actuators and protect with
      individual branch fuses
    - To eliminate power noise
    answer_index: 2
    explanation: Comparing fuse and load/power ratings alone does not guarantee safety
      or operating sequences. Review the fuse manufacturer's time-current curves and
      power supply OCP characteristics together to verify protection coordination
      [S11, S15, S25].
  completion_criteria:
  - All lab data and drawings must be included in the final report.
  - Must prove via measurement that the DC voltage of 3 branches is less than 1 V
    after physical power disconnection.
  - Tendon path design must include analysis considering capstan friction.
