capstone:
  title: Final Fabrication and Testing of Intelligent 5-fingered Robot Hand
  deliverables:
  - Final design CAD files
  - Integrated firmware and control code
  - Grasp performance and durability test data
  - System safety assessment report
  - Final project results report
  rubric:
  - Evaluation of mechanical precision and operability
  - Level of real-time control algorithm implementation
  - Completeness of documentation for physical power disconnection and de-energized
    measurement procedures before maintenance/access after planned shutdown
  - Completeness of documentation (BOM, drawings)
  - Analysis of test data and performance verification
  safety:
  - After planned shutdown and before maintenance/access, physically disconnect 3
    isolated power adapters and record that the residual voltage of each branch is
    less than 1 V in DC voltage mode.
  - Check the 10 A fuse rating and time-current characteristics of each independent
    power branch.
  - Gradually increase grasp load after no-load testing on a fixing jig.
  - Wear safety glasses to prevent impact during cutting, drilling, tendon tensioning,
    and grasp testing.
