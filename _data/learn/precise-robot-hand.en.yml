- id: M7
  slug: firmware-development
  phase_id: P3
  title: Firmware Development and Control
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - Understand DYNAMIXEL smart actuator communication and control framework.
  - Implement actuator and FSR sensor signal acquisition using OpenCR control board.
  - Design real-time robot control state machine and closed-loop feedback loop.
  - Program safe power management and torque release sequences.
  theory_markdown: '### Firmware Architecture and DYNAMIXEL Control

    The robotic hand firmware acquires sensor data and processes actuator commands
    within a high-speed loop. The `OpenCR 1.0` controller is based on a 216MHz ARM
    Cortex-M7 processor [S13] and processes DYNAMIXEL protocol 2.0 without a separate
    bridge [S11], minimizing latency. Each actuator supports current, velocity, and
    position modes, and the robotic hand uses a current-control-based torque grip
    strategy.


    ### FSR Force Feedback System

    The FSR 402 sensor has a resistance characteristic inversely proportional to the
    force applied [S12]. A voltage divider circuit is configured with a 10kΩ resistor
    on the 3.3V sensor rail using OpenCR''s 12-bit ADC [S13]. The divided voltage
    is normalized via `ADC value = (V_in * R_fsr) / (R_fsr + R_ref)`, and this value
    is linked with the tendon tension of the fingers and used as grip force feedback.


    ### Safe Control Routine

    System stop is divided into two stages for safety. In the software stage, actuator
    torque is released (Torque Off) to immediately remove physical driving force.
    Before maintenance, you must physically disconnect the 3 independent power adapters
    and verify that all branches are less than 1V using multimeter DC mode.'
  worked_examples:
  - '1. Setting actuator goal position/current: An example of using DYNAMIXEL SDK
    to set current limit (Goal Current) for XM430 actuator and updating finger joint
    final position via a PID loop based on sensor values.'
  - '2. FSR voltage data filtering: Code implementation for applying a Moving Average
    Filter to remove noise from raw data collected from ADC and normalizing the range
    with upper (20N) and lower (0.2N) limits [S12].'
  lab:
    title: Robotic Hand Integrated Control and Precision Grip Practice
    steps:
    - Verify that the voltage of each independent branch is less than 1V using multimeter
      DC mode before starting assembly.
    - Solder FSR voltage divider circuit to OpenCR's 3.3V sensor rail and connect
      to ADC port.
    - Scan IDs of 11 actuators using DYNAMIXEL SDK and set initial positions.
    - Test finger joint drive commands in no-load state and adjust tendon elongation
      and tension.
    - Visualize FSR sensor data via serial monitor and tune grip force response.
    safety:
    - Never use 5V or 12V actuator power as supply for FSR sensor circuit.
    - Never approach the operating range of fingers while system is energized; use
      fixtures.
    - Never connect positive (+) terminals of power branch adapters to each other.
    - Before maintenance/assembly access, physically disconnect the 3 power adapters
      and verify that it is less than 1V in all branches by measurement.
    deliverables:
    - Firmware source code including real-time sensor data feedback
    - Data sheet for normalization and calibration of voltage divider data
    - Actuator feedback loop normal operation logs
  assignment:
    title: Grip State Machine Design and Implementation
    deliverables:
    - Grip and release state machine diagram
    - Code implementing current-based torque control
    - Final performance evaluation report
    rubric:
    - Is the current limit range (0-2.3A) according to sensor values stably controlled?
    - Does the physical tension dissipate immediately upon the torque release command?
    - Is a safe hardware disconnection procedure explicitly stated in the code?
  quiz:
  - question: What is the recommended power rail when configuring an FSR 402 sensor
      and a voltage divider circuit?
    choices:
    - 12V actuator power rail
    - 5V general-purpose power rail
    - OpenCR 3.3V sensor rail
    - 24V external input rail
    answer_index: 2
    explanation: For system safety and OpenCR ADC protection, the FSR voltage divider
      circuit must be connected to the 3.3V sensor power rail.
  - question: What is the correct way to confirm that the system is in a 'de-energized
      state' when performing robot hand maintenance?
    choices:
    - Send a torque release command via software.
    - Check the wiring status with a multimeter in resistance mode.
    - Measure with a multimeter in DC voltage mode to ensure it is under 1V in all
      branches.
    - Remove the power branch fuses.
    answer_index: 2
    explanation: After physically disconnecting the power, you must verify with a
      multimeter in DC voltage mode that the residual voltage in all branches is less
      than 1V.
  - question: Is it permissible to connect the positive (+) terminals of multiple
      independent power adapter outputs in parallel?
    choices:
    - It is necessary for current summation.
    - It is strictly prohibited.
    - It is possible if the rated output currents are the same.
    - It is possible if fuses are installed.
    answer_index: 1
    explanation: The positive (+) outputs of power adapters configured as independent
      branches must never be connected or integrated with each other.
  completion_criteria:
  - Multimeter verification completed that independent power supply and fuse protection
    for each branch are configured according to BOM specifications
  - Confirmed precision force signal acquisition and filtering of 5 FSR sensors via
    OpenCR ADC
  - Successfully performed the software torque release routine and post-physical power
    disconnection measurement procedure
  - The grasping state machine processes actuator and sensor data as intended, and
    the final report is submitted
  source_ids:
  - S13
  - S11
  - S12
- id: M8
  slug: sensor-integration
  phase_id: P3
  title: Sensor Integration and Feedback Control
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - Understand the configuration principle of a voltage divider circuit using an FSR
    402 sensor and a 10 kΩ resistor
  - Master the ADC function of the OpenCR controller and its input range (0-3.3 V)
    constraints
  - Acquire sensor data filtering and calibration techniques
  - Implement feedback-based grasping control algorithms and practice robot hand contact
    force control
  theory_markdown: '## Sensor Integration and Contact Force Feedback


    Precise grasping control of a robot hand begins with accurately measuring the
    force applied to the fingertips. The FSR 402 sensor is a Force-Sensing Resistor
    whose resistance value decreases as the applied pressure increases [S12]. To convert
    this into a voltage signal that a microcontroller can read, a voltage divider
    circuit is required.


    ### 1. Voltage Divider Circuit

    Connect the FSR sensor and a 10 kΩ divider resistor in series and supply 3.3 V
    sensor power [B4, B5, B2]. The ADC pin is connected to the junction of the sensor
    and the resistor, and the output voltage $V_{out}$ is calculated as follows:

    For a 10 kΩ pull-down voltage divider, $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$
    is used.


    - The OpenCR controller''s ADC has a 12-bit resolution, and the input range is
    limited to 0~3.3 V [B2]. Inputs outside this range can damage circuit components,
    so you must use only the specified sensor power rail (3.3 V) [B2].


    ### 2. Control Loop and Feedback

    Measured force data is used as an input for PID control algorithms or adaptive
    control strategies [S3]. When the robot hand grasps an object, the tendon-driven
    motor (DYNAMIXEL XM430-W350-T) refers to sensor values and fine-tunes the torque
    until the target contact force is reached [B1, B4].'
  worked_examples:
  - 'Example 1: FSR output calculation. When $R_{FSR}$ is 5 kΩ and $R_{fixed}$ is
    10 kΩ, given a 3.3 V input, $V_{out} = 3.3 \times (5 / (5 + 10)) = 1.1 V. This
    is normally within the ADC input range (0-3.3 V).'
  - 'Example 2: Grasping force calibration. If sensor values fluctuate due to noise,
    applying a simple moving average filter can reduce rapid variations in sensor
    readings and maintain stable grasping force.'
  lab:
    title: Fingertip FSR Sensor Circuit Configuration and Calibration
    steps:
    - Connect the OpenCR's 3.3 V sensor rail and GND to the breadboard.
    - Configure a voltage divider circuit by connecting the FSR 402 and a 10 kΩ resistor
      in series [B4, B5].
    - Connect the voltage divider junction to an OpenCR ADC pin [B2].
    - Connect the PC to the OpenCR and run the test code to read sensor values.
    - Record ADC values in no-load and target force-applied states to create a calibration
      table.
    safety:
    - Before applying power, you must verify with a multimeter that there is no short
      circuit between the 3.3 V rail and the 12 V actuator rail [B2].
    - Always wear safety glasses and do not place your hands within the robot hand's
      range of motion while it is powered.
    - If abnormal heat, odor, or smoke is detected, do not approach; evacuate after
      cutting the supply power to the 3 adapters at the pre-designated building distribution
      panel breaker or an authorized upstream master disconnect outside the hazardous
      zone. If there is no accessible upstream disconnection means outside the zone,
      do not energize the system. Torque release is not a substitute for power disconnection.
      Maintenance/access must only be performed after a planned shutdown, physical
      disconnection, and confirmation by de-energized measurement.
    - Before maintenance or sensor access, physically disconnect the 3 isolated power
      adapters and verify by measurement that the voltage in all branches is less
      than 1 V.
    deliverables:
    - ADC sensor reading test result data
    - Sensor calibration table (ADC value vs. physical force)
    - Sensor data filtering implementation code
  assignment:
    title: Grasping Force Feedback Control Algorithm Implementation
    deliverables:
    - Feedback control code (sensor reading, target comparison, motor torque adjustment)
    - Grasping test result graph (Force over time)
    - Final report (control logic explanation and grasping stability analysis)
    rubric:
    - Is the ADC data measured stably within the 0-3.3 V range?
    - Does the motor appropriately release or maintain torque when the sensor value
      reaches the target?
    - Does the torque release function work normally in software during an emergency?
    - Is the power disconnection verification procedure described in the report?
  quiz:
  - question: What must be strictly observed when inputting an FSR voltage divider
      signal to an OpenCR controller ADC pin?
    choices:
    - Use the 12 V actuator power rail.
    - Use only the 3.3 V sensor power rail.
    - Use the 5 V power rail.
    - Supply power separately from an external source.
    answer_index: 1
    explanation: The OpenCR ADC input range is 0-3.3 V, so you must use only the 3.3
      V sensor power rail to ensure no voltage exceeding this is applied.
  - question: What is the relationship between the FSR sensor's resistance change
      and physical force?
    choices:
    - Resistance increases as pressure increases.
    - Resistance decreases as pressure increases.
    - There is no relationship between pressure change and resistance.
    - Resistance is amplified at a constant rate as pressure increases.
    answer_index: 1
    explanation: An FSR is a pressure-sensing resistor characterized by a decrease
      in sensor resistance when pressure is applied.
  - question: What is the safety state that must be verified after disconnecting power
      for maintenance or access while working on the robot hand prototype?
    choices:
    - Confirm that torque has been released via software.
    - Measure if the fuse is blown using a multimeter.
    - Physically disconnect the 3 power adapters and measure with a multimeter in
      DC voltage mode to ensure the voltage in each branch is less than 1 V.
    - Turn off the power switch and measure the wire continuity in resistance mode.
    answer_index: 2
    explanation: Power disconnection refers to physically disconnecting the 3 power
      sources, and for safety, it is essential to personally verify with a multimeter
      in DC voltage mode that all branches are less than 1 V.
  completion_criteria:
  - Passed ADC-based FSR value reading lab
  - Grasping force feedback control code reaches at least 90% of the target
  - Proof of compliance with all safety rules (physical power disconnection and voltage
    measurement)
  - Final results report submission
  source_ids:
  - S3
  - S12
  - S26
- id: M9
  slug: testing-validation
  phase_id: P3
  title: Performance Testing and Verification
  estimated_hours: 10.0
  prerequisites:
  - M8
  objectives:
  - Design quantitative test metrics to verify the robot hand's precision and repeatability
  - Evaluate the stability of the grasping force control algorithm utilizing FSR sensor
    data
  - Analyze the error between DYNAMIXEL actuator feedback data and actual physical
    motion
  - Learn procedures for verifying mechanical defects and the durability of the tendon
    drive mechanism
  theory_markdown: '## Performance Testing and Verification Theory


    Robot hand performance verification is the process of confirming the consistency
    between design specifications and actual physical behavior [S1]. Key metrics include
    the following:


    ### 1. Positioning and Grasping Precision

    Repeatability refers to the range of error in the position reached by the robot
    hand when performing the same command. While the XM430-W350-T actuator provides
    precise position feedback via its internal encoder [S11], the final position of
    the fingertip incurs errors due to tendon elongation and friction. Dyneema tendons
    have very low elongation (less than 1%), which is advantageous for ensuring repeatability
    [S16].


    ### 2. Force Control and FSR Sensor Signal Processing

    The FSR 402 sensor is characterized by a decrease in resistance as the applied
    force increases [S12]. This is configured with a 10 kΩ resistor in a voltage divider
    circuit and measured with the OpenCR''s 12-bit ADC [S13, S26]. Since sensor data
    is noisy, a Moving Average Filter must be applied to form a stable grasping force
    feedback loop.


    ### 3. Overcurrent Protection and Power Stability

    The system uses 3 independent 12 V power branches [S15]. Each branch is protected
    by a 10 A ATOF fuse [S25], and distribution must be managed so that the sum of
    the actuator peak currents does not exceed the protection rating. This must be
    verified by coordinating protection via the time-current curves provided by the
    manufacturer.'
  worked_examples:
  - 'Example 1: OpenCR ADC voltage calculation. When the FSR resistance is 10 kΩ and
    the series resistor is 10 kΩ, the 3.3 V voltage divider output is $V_{out} = 3.3
    * (10k / (10k + 10k)) = 1.65 V. This is suitable for the 12-bit ADC range [S13,
    S26].'
  - 'Example 2: Fuse protection coordination. When 4 actuators are in a stall state,
    the sum of currents is 9.2 A [S11]. Since the cold resistance of a 10 A fuse is
    7.7 mΩ [S25], the voltage drop during normal operation is approximately 0.07 V,
    which can be neglected; however, for overcurrent, refer to the fuse manufacturer''s
    time-current curve for the exact response.'
  lab:
    title: Robot Hand Integrated Functional Testing
    steps:
    - With each power branch physically disconnected, measure the output of the 3
      adapters in DC voltage mode to confirm it reads 12 V.
    - Fix the robot hand in a safety jig and connect the controller (OpenCR) to a
      PC to release the actuator torque to 0.
    - Record the ADC data changes while manually applying pressure to the FSR sensor
      of each finger.
    - Repeat the maximum range of motion (ROM) for each finger 5 times in a no-load
      state to check for tendon interference.
    - After the test is complete, you must unplug the 3 power adapters from the wall
      outlet and check for residual voltage.
    safety:
    - Always wear safety glasses during testing.
    - Do not place your hands within the range of motion while power is applied.
    - If abnormal heat, odor, or smoke is detected, do not approach; evacuate after
      cutting the supply power to the 3 adapters at the pre-designated building distribution
      panel breaker or an authorized upstream master disconnect outside the hazardous
      zone. If there is no accessible upstream disconnection means outside the zone,
      do not energize the system. Torque release is not a substitute for power disconnection.
      Maintenance/access must only be performed after a planned shutdown, physical
      disconnection, and confirmation by de-energized measurement.
    - Do not touch the system without measuring voltage. Verifying DC is less than
      1 V is mandatory.
    deliverables:
    - Fingertip grasping force sensor calibration records
    - Repeatability precision measurement data
    - Load current measurements per power branch
  assignment:
    title: Robot Hand Performance Analysis Final Report
    deliverables:
    - Performance test result analysis report
    - Data-driven grasping control algorithm code
    rubric:
    - Appropriateness of the Signal-to-Noise Ratio (SNR) analysis of sensor data
    - Quantification of precision in repeatability tests
    - Theoretical reflection on whether the protection design (fuses) satisfies the
      intended system protection
    - Comparison of design specifications and actual built performance metrics
  quiz:
  - question: Which of the following is correct when configuring a force measurement
      circuit using an FSR 402 sensor and OpenCR ADC?
    choices:
    - The FSR voltage divider uses only the 3.3 V sensor power and keeps the analog
      input signal in the 0~3.3 V range.
    - Configure a voltage divider with an FSR and a 10 kΩ resistor, and use a 3.3
      V sensor rail.
    - The ADC signal must always be in the 0~5 V range.
    - Since the FSR resistance is constant, no separate divider resistor is needed.
    answer_index: 1
    explanation: Use the OpenCR sensor rail (3.3 V) to limit the ADC input to the
      0~3.3 V range and configure a voltage divider circuit to read the resistance
      change as a voltage change [S13, S26].
  - question: Which of the following is correct for managing the 12 V power branch
      of a DYNAMIXEL XM430-W350-T actuator?
    choices:
    - Combine the positive (+) outputs of 3 adapters to sum the power.
    - Install a 10 A fuse for each adapter and use them as separate, independent branches.
    - Use it without safety verification since the current is below the fuse rating.
    - Connect the power adapter outputs directly in parallel without fuses.
    answer_index: 1
    explanation: Each adapter output must remain independent, and you must protect
      against overcurrent by installing a fuse suitable for the independent branch
      [S15].
  - question: What is the most important safety procedure during the robot hand verification
      stage?
    choices:
    - Releasing torque via software is equivalent to cutting power.
    - Always verify that DC is less than 1 V with a multimeter before approaching
      for maintenance.
    - Remove the fuse, as it acts as a planned shutdown device.
    - Verify that power is cut using 'Continuity' mode.
    answer_index: 1
    explanation: Software release cannot substitute for physical power disconnection;
      it is essential to verify by measurement that there is no residual energy using
      DC voltage mode after physical disconnection.
  completion_criteria:
  - Submitted performance test result report and obtained at least 70 points
  - Complied with safety guidelines in all Lab steps and confirmed physical power
    disconnection
  - Confirmed implementation of the sensor data filtering function in the control
    code
