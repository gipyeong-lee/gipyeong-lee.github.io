course:
  course_type: build_project
  slug: precise-robot-hand
  title: Building a Sophisticated 5-Finger Robotic Hand
  summary: A university/graduate-level hands-on curriculum that starts from the basics
    of robotics and guides you through the design, fabrication, control, and validation
    of an 5-finger robotic hand.
  outcome: Students will understand actuators, controllers, sensor integration, and
    tendon-driven mechanisms, and be able to prototype a precision robotic hand.
  audience: Engineering aspirants and students new to robotics
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3D Printer
  - Multimeter
  - Soldering Iron
  - General Hand Tools
  - Hardened Steel Nozzle for PC-CF
  - Impact-Resistant Safety Glasses for Work
  - Vernier Caliper
  safety_summary:
  - This is a low-voltage educational prototype, not a certified machine safety system.
  - Do not use stop circuits built by the learner as a safety function or emergency
    stop.
  - Perform normal stops via software torque release, and after planned stops, physically
    disconnect the 3 isolated power adapters and measure to verify a de-energized
    state before maintenance/access.
  - Do not place hands in the operating range while powered, and test from no-load
    in a mounting jig.
  - Wear impact-resistant safety glasses for work during cutting, drilling, and tendon
    tension testing.
  - If abnormal heat, odor, or smoke is detected, do not approach; disconnect the
    power supply of the 3 adapters at a pre-designated building distribution board
    circuit breaker outside the hazard zone or via an authorized upstream master disconnect,
    and evacuate. If no upstream disconnection means capable of operating outside
    the hazard zone is available, do not energize the system. Torque release is not
    a substitute for power disconnection.
  - Before deploying in human-accessible environments, a dual-channel, manual reset,
    EDM, feedback-capable dual contactor must be separately designed and verified
    under the review of a qualified safety expert.
  last_reviewed: '2026-08-29'
