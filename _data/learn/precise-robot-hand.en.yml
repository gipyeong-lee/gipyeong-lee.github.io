capstone:
  title: Intelligent 5-fingered Robot Hand Final Production and Testing
  deliverables:
  - Final design CAD files
  - Integrated firmware and control code
  - Grasping performance and durability test data
  - System safety assessment
  - Final project results report
  rubric:
  - Mechanical precision and operability evaluation
  - Level of real-time control algorithm implementation
  - Completeness of documentation on physical power disconnection and de-energized
    measurement procedures before maintenance/access after planned shutdown
  - Completeness of documentation (BOM, drawings)
  - Analysis of test data and performance verification
  safety:
  - Physically disconnect the 3 isolated power adapters after planned shutdown, and
    record that the residual voltage in each branch is less than 1 V in DC voltage
    mode
  - Check the 10 A fuse rating and time-current characteristics for each independent
    power branch
  - Increase grasping load incrementally after no-load testing in the fixed jig
  - Wear safety glasses to prevent impact during cutting, drilling, tendon tensioning,
    and grasping tests
