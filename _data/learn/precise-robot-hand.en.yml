course:
  course_type: build_project
  slug: precise-robot-hand
  title: Building a Sophisticated 5-Finger Robotic Hand
  summary: A university-level practical curriculum starting from the fundamentals
    of robotics to designing, manufacturing, controlling, and verifying an 5-finger
    robotic hand.
  outcome: Students will understand actuators, controllers, sensor integration, and
    tendon-driven mechanisms, and be able to prototype a precision robotic hand.
  audience: Engineering aspirants and students beginning in robotics
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3D printer
  - Multimeter
  - Soldering iron
  - General hand tools
  - Hardened steel nozzle for PC-CF
  - Impact-resistant work goggles
  - Vernier calipers
  safety_summary:
  - Low-voltage educational prototype, not a certified machine safety system
  - Do not use stop circuits created by learners as safety functions or emergency
    stops
  - Perform normal stops by software torque release; after planned stops, physically
    disconnect the 3 insulated power adapters and verify the de-energized state by
    measurement before maintenance or access
  - Do not place hands in the operating range while power is applied; test from no-load
    in a fixture
  - Wear impact-resistant work goggles during cutting, drilling, and tendon tension
    testing
  - In case of abnormal heat, odor, or smoke, do not approach; cut the power supply
    to the 3 adapters via a pre-designated building panel breaker outside the hazard
    zone or a certified upstream master disconnect and evacuate. If no upstream disconnect
    is available outside the hazard zone, do not energize the system. Torque release
    is not a substitute for power disconnection
  - Before introducing to environments with human access, a dual-channel, manual reset,
    EDM, feedback-capable dual contactor must be separately designed and verified
    under the review of a qualified safety expert
  last_reviewed: '2026-08-29'
