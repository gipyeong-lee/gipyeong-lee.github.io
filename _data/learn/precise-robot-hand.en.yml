- id: M6
  slug: wiring-safety-system
  phase_id: P2
  title: Wiring and Safe Power Disconnection Construction
  estimated_hours: 10.0
  prerequisites:
  - M5
  objectives:
  - Understand how to configure independent 12 V power branches for actuator driving.
  - Learn the role and selection principles of ATOF fuses for overcurrent protection.
  - Acquire safe power management and physical disconnection protocols.
  - Configure the OpenCR controller and FSR sensor's safe voltage divider circuit.
  theory_markdown: '## Safe Wiring and Power Disconnection Principles


    The 5-finger robotic hand system uses multiple high-torque actuators, so efficient
    and safe power distribution is essential. This project uses 11 power adapters
    to separately arrange actuators in units of 4/4/3 to distribute the current load
    of each branch and improve power stability [S15].


    ### 1. Securing Power Independence

    Positive (+) outputs of each adapter must be maintained as independent branches,
    and the act of arbitrarily combining or tying them together is strictly prohibited.
    Design to accommodate actuator peak current (XM430-W350-T 2.3 A per 1 actuator)
    within the rated output current (11.5 A) of the adapters specified in [S15] [S11].
    The sum of peak current for the 4-unit branches is 9.2 A, which is within the
    continuous output tolerance range of the adapters.


    ### 2. Overcurrent Protection (Protection Coordination)

    Place a 10 A ATOF fuse in each branch to protect the system from overcurrent in
    case of wiring or actuator errors [S25]. ATOF fuses operate at the 110%~135% level
    of rated current, enabling stable protection against the peak current of 9.2 A.
    However, fuse selection must refer to the ''Time-Current Curve'' provided by the
    manufacturer; safety is not guaranteed just because the load current is low [S25].


    ### 3. Control Circuit Separation

    Reproducibility is improved by removing complex external bridge circuits using
    an OpenCR control board with a built-in DYNAMIXEL port [S13]. FSR force sensors
    use a divider circuit supplied from the 3.3 V sensor rail to convert voltage for
    ADC input, and must be electrically separated from the 12 V actuator power [S13].


    ### 4. Work Safety Rules

    Since the bench prototype is not a certified machine safety system, you must physically
    disconnect the 3 power adapters before maintenance or modification work, and verify
    with a multimeter in DC voltage mode that the residual voltage of each branch
    is less than 1 V [S7].'
  worked_examples:
  - If abnormal heat, odor, or smoke is detected, do not approach; disconnect the
    power supply of the 3 adapters at a pre-designated building distribution board
    circuit breaker outside the hazard zone or via an authorized upstream master disconnect,
    and evacuate. If no upstream disconnection means capable of operating outside
    the hazard zone is available, do not energize the system. Torque release is not
    a substitute for power disconnection. Maintenance/access should only be performed
    after planned stops, physical disconnection, and verification of a de-energized
    state by measurement [S11] [S25]
  - 'Example 2: FSR ADC circuit voltage - Connect a 10 kΩ divider resistor and FSR
    402 using the 3.3 V sensor rail of OpenCR [S13, S26]. Sensor signal voltage must
    be within the 0~3.3 V range, and this circuit must be physically/electrically
    separated and protected from the 12 V actuator power circuit.'
  lab:
    title: Power Branch Harness Fabrication and Safety Inspection
    steps:
    - Solder an ATO inline fuse holder to each adapter output line and insert a 10
      A ATOF fuse [S24, S25].
    - Fabricate actuator and sensor connection harnesses using Molex Micro-Fit 3.0
      connectors [S14].
    - Distribute and wire the OpenCR board and each actuator into 3 branches and connect
      them to each power adapter [S13].
    - Before applying power, check the insulation state of each adapter output terminal
      using a multimeter in resistance mode.
    - After applying power, verify that each branch is 12 V in voltage mode, and always
      remove both 3 adapters when disconnecting.
    safety:
    - Physically disconnect the 3 power adapters before maintenance.
    - Replace parts after confirming that residual voltage is less than 1 V with a
      multimeter.
    - Do not place hands in the operating range while power is applied.
    - Insulate all connections and wear safety glasses when soldering.
    deliverables:
    - Photos of the manufactured power branch harness
    - Voltage measurement record sheet for each branch
    - Wiring diagram review confirmation
  assignment:
    title: Safety Wiring Design Report
    deliverables:
    - Actuator allocation design plan for 3 power branches (4/4/3 units per branch)
    - Overcurrent cutoff calculation sheet per branch (peak current vs. fuse rating)
    - Physically disconnect the 3 power adapters after planned stops, and verify the
      de-energized state of each branch by measurement before maintenance/access.
    rubric:
    - Were the principles of power independence and separation followed?
    - Were the fuse and connector ratings appropriately selected for the load?
    - Do the power disconnection and residual voltage verification protocols follow
      safety guidelines?
  quiz:
  - question: Is it permissible to connect the 12 V outputs (+) of each power adapter
      in parallel?
    choices:
    - Possible, current supply capacity increases.
    - Impossible, must maintain independent branches.
    - Possible if voltage matches.
    - Possible if fuses are added.
    answer_index: 1
    explanation: Adapter outputs must be maintained independently; parallel connection
      is strictly prohibited [S15].
  - question: What is the safety measure that must be prioritized before robotic hand
      maintenance?
    choices:
    - Software torque release
    - Multimeter resistance measurement
    - Physical disconnection of 3 power adapters and residual voltage verification
    - Planned stop button press
    answer_index: 2
    explanation: Before maintenance, you must physically disconnect the 3 power adapters
      and verify with a multimeter that the residual voltage of each branch is less
      than 1 V.
  - question: What power rail must be used for the FSR force sensor ADC circuit?
    choices:
    - 12 V actuator rail
    - 5 V power rail
    - 3.3 V sensor rail
    - 24 V power rail
    answer_index: 2
    explanation: To protect the OpenCR ADC circuit, the 3.3 V sensor rail must be
      used [S13].
  completion_criteria:
  - 3 independent branch harness configuration and fuse installation complete
  - Voltage for each branch measured as 12 V when unloaded
  - Record that residual voltage at all measurement nodes is less than 1 V after physical
    power disconnection
  - Submission and passing of wiring safety design report
  source_ids:
  - S14
  - S24
  - S25
  - S7
  - S15
  - S11
  - S13
  - S26
- id: M7
  slug: firmware-development
  phase_id: P3
  title: Firmware Development and Control
  estimated_hours: 15.0
  prerequisites:
  - M6
  objectives:
  - Understand the communication and control framework for DYNAMIXEL smart actuators.
  - Implement actuator and FSR sensor signal acquisition using the OpenCR control
    board.
  - Design real-time robot control state machines and closed-loop feedback loops.
  - Program safe power management and torque release sequences.
  theory_markdown: '### Firmware Architecture and DYNAMIXEL Control

    The robotic hand''s firmware acquires sensor data and processes actuator commands
    within a high-speed loop. The `OpenCR 1.0` controller is based on a 216MHz ARM
    Cortex-M7 processor [S13] and processes DYNAMIXEL protocol 2.0 without a separate
    bridge [S11], minimizing latency. Each actuator supports current, velocity, and
    position modes, and the robotic hand uses a grasp strategy based on torque through
    current control.


    ### FSR Force Feedback System

    The FSR 402 sensor has resistance characteristics inversely proportional to the
    force applied [S12]. A voltage divider circuit is configured with a 10kΩ resistor
    and a 12-bit ADC [S13] using OpenCR''s 3.3V sensor rail. The divided voltage is
    normalized via `ADC_value = (V_in * R_fsr) / (R_fsr + R_ref)`, and this value
    is linked with the tendon tension of the finger and used as feedback for grasp
    force.


    ### Safe Control Routines

    System stops are divided into two stages for safety. In the software stage, actuator
    torque is released (Torque Off) to immediately remove physical driving force.
    Before maintenance, you must physically disconnect the power of the 3 independent
    power adapters, then use a multimeter in DC mode to verify that it is less than
    1V in all branches.'
  worked_examples:
  - '1. Setting actuator goal position/current: Example of code implementation to
    set the goal current of the XM430 actuator using DYNAMIXEL SDK and update the
    final position of the finger joint via PID loop according to sensor values.'
  - '2. FSR voltage data filtering: Code implementation to apply a Moving Average
    Filter to remove noise from raw data collected from the ADC, and normalize the
    upper (20N) and lower (0.2N) limits [S12].'
  lab:
    title: Robotic Hand Integrated Control and Precision Grasp Lab
    steps:
    - After confirming that the voltage of each independent branch is less than 1V
      in DC mode with a multimeter, start assembly.
    - Solder the FSR voltage divider circuit to the 3.3V sensor rail of OpenCR and
      connect it to the ADC port.
    - Scan the IDs of 11 actuators and set initial positions using DYNAMIXEL SDK.
    - Test finger joint driving commands in a no-load state and adjust tendon elongation
      and tension.
    - Tune grasp force response while visualizing FSR sensor data on a serial monitor.
    safety:
    - Never use 5V or 12V actuator power as a supply voltage for the FSR sensor circuit.
    - Never approach the finger operating range while the system is energized, and
      use a mounting jig.
    - Never connect the positive (+) terminals of power branch adapters to each other.
    - Before maintenance/assembly access, you must physically disconnect the 3 power
      adapters and verify that it is less than 1V in all branches by measurement.
    deliverables:
    - Firmware source code including real-time sensor data feedback
    - Normalization and calibration datasheet for voltage divider data
    - Actuator feedback loop normal operation log
  assignment:
    title: Grasp State Machine Design and Implementation
    deliverables:
    - Grasp and release state machine diagram
    - Code implementation of current-based torque control
    - Final performance evaluation report
    rubric:
    - Is the current limit range (0-2.3A) based on sensor values stably controlled?
    - Does the torque release command immediately remove physical tension?
    - Is a safe hardware disconnection procedure explicitly stated in the code?
  quiz:
  - question: What is the recommended power rail when configuring an FSR 402 sensor
      and a voltage divider circuit?
    choices:
    - 12V actuator power rail
    - 5V general-purpose power rail
    - OpenCR 3.3V sensor rail
    - 24V external input rail
    answer_index: 2
    explanation: For system safety and OpenCR ADC protection, the FSR voltage divider
      circuit must be connected to the 3.3V sensor power rail.
  - question: What is the correct method to verify that the system is in a 'de-energized
      state' during robotic hand maintenance?
    choices:
    - Send a torque release command via software.
    - Check the wiring state with a multimeter in resistance mode.
    - Measure with a multimeter in DC voltage mode to ensure it is less than 1V in
      all branches.
    - Remove the power branch fuse.
    answer_index: 2
    explanation: After physical power disconnection, you must verify with a multimeter
      in DC voltage mode that the residual voltage in all branches is less than 1V.
  - question: Is it permissible to connect the positive (+) terminals of multiple
      independent power adapter outputs in parallel?
    choices:
    - It is necessary for current summation.
    - It is strictly prohibited.
    - It is possible if the rated output currents are the same.
    - It is possible if fuses are installed.
    answer_index: 1
    explanation: The positive (+) outputs of power adapters configured as independent
      branches must never be connected or integrated with each other.
  completion_criteria:
  - Verified with a multimeter that independent power supply and fuse protection for
    each branch are configured according to BOM specifications
  - Confirmed precise force signal acquisition and filtering for 5 FSR sensors via
    OpenCR ADC
  - Successfully performed software torque release routine and post-physical power
    disconnection measurement procedure
  - Grasp state machine processes actuator and sensor data as intended and final report
    is submitted
  source_ids:
  - S13
  - S11
  - S12
- id: M8
  slug: sensor-integration
  phase_id: P3
  title: Sensor Integration and Feedback Control
  estimated_hours: 10.0
  prerequisites:
  - M7
  objectives:
  - Understand the configuration principle of a voltage divider circuit using an FSR
    402 sensor and a 10 kΩ resistor
  - Master the ADC function of the OpenCR controller and its input range (0-3.3 V)
    constraints
  - Acquire sensor data filtering and calibration techniques
  - Implement feedback-based grasp control algorithms and practice robot hand contact
    force control
  theory_markdown: '## Sensor Integration and Contact Force Feedback


    Precise grasp control of a robot hand begins with accurately measuring the force
    applied to the fingertips. The FSR 402 sensor is a force-sensing resistor whose
    resistance value decreases as the applied pressure increases [S12]. To convert
    this into a voltage signal that a microcontroller can read, a voltage divider
    circuit is required.


    ### 1. Voltage Divider Circuit

    Connect the FSR sensor and the 10 kΩ divider resistor in series and supply 3.3
    V sensor power [B4, B5, B2]. The ADC pin is connected to the junction of the sensor
    and the resistor, and the output voltage $V_{out}$ is calculated as follows:


    A 10 kΩ pull-down divider uses $V_{out}=V_{ref}\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$


    - The OpenCR controller''s ADC has a 12-bit resolution and is limited to an input
    range of 0~3.3 V [B2]. Input outside this range can damage circuit components,
    so you must only use the specified sensor power rail (3.3 V) [B2].


    ### 2. Control Loop and Feedback

    The measured force data is used as an input value for PID control algorithms or
    adaptive control strategies [S3]. When the robot hand grasps an object, the tendon-driven
    motor (DYNAMIXEL XM430-W350-T) references the sensor values to fine-tune torque
    until the set target contact force is reached [B1, B4].'
  worked_examples:
  - 'Example 1: Calculating FSR output. When $R_{FSR}$ is 5 kΩ and $R_{fixed}$ is
    10 kΩ, based on 3.3 V input, $V_{out} = 3.3 \times (5 / (5 + 10)) = 1.1 V. This
    is normally located within the ADC input range (0-3.3 V).'
  - 'Example 2: Grasp force calibration. If the sensor value fluctuates due to noise,
    applying a simple moving average filter can reduce rapid fluctuations in sensor
    data and maintain grasp force stably.'
  lab:
    title: Fingertip FSR Sensor Circuit Configuration and Calibration
    steps:
    - Connect OpenCR's 3.3 V sensor rail and GND to the breadboard.
    - Connect FSR 402 and 10 kΩ resistor in series to construct a voltage divider
      circuit [B4, B5].
    - Connect the divider junction to the OpenCR's ADC pin [B2].
    - Connect PC to OpenCR and execute the test code to read sensor values.
    - Create a calibration table by recording ADC values in the no-load state and
      when the target force is applied.
    safety:
    - Before applying power, always use a multimeter to check for short circuits between
      the 3.3 V rail and the 12 V actuator rail [B2].
    - Always wear safety glasses, and do not put your hands within the robot hand's
      range of motion while energized.
    - If abnormal heat, odor, or smoke is detected, do not approach. Evacuate after
      cutting off supply power to 3 adapters using a designated building distribution
      board circuit breaker or a certified upstream master disconnect outside the
      hazard zone. Do not energize the system if no upstream disconnecting means is
      operable outside the hazard zone. Torque release does not replace power disconnection.
      Maintenance and access must only be performed after planned shutdown, physical
      disconnection, and verified measurement of a de-energized state.
    - Before repairing or accessing sensors, physically disconnect 3 isolated power
      adapters and verify by measurement that the voltage in all branches is less
      than 1 V.
    deliverables:
    - ADC sensor reading test result data
    - Sensor calibration table (ADC value vs physical force)
    - Sensor data filtering implementation code
  assignment:
    title: Grasp Force Feedback Control Algorithm Implementation
    deliverables:
    - Feedback control code (sensor reading, target comparison, motor torque adjustment)
    - Grasp test result graph (Force vs Time)
    - Final report (Explanation of control logic and grasp stability analysis)
    rubric:
    - Is ADC data measured stably within the 0-3.3 V range?
    - Does the motor appropriately release or maintain torque when the sensor value
      reaches the target?
    - Does the emergency torque release function normally via software?
    - Is the power-off verification procedure described in the report?
  quiz:
  - question: When inputting an FSR voltage divider signal to the OpenCR controller's
      ADC pin, what must be observed?
    choices:
    - Use the 12 V actuator power rail.
    - Use only the 3.3 V sensor power rail.
    - Use the 5 V power rail.
    - Supply power externally.
    answer_index: 1
    explanation: The OpenCR ADC input range is 0-3.3 V, so you must use only the 3.3
      V sensor power rail to ensure no voltage exceeding this is applied.
  - question: What is the relationship between the FSR sensor's resistance value change
      and physical force?
    choices:
    - Resistance increases as pressure increases.
    - Resistance decreases as pressure increases.
    - There is no relationship between pressure change and resistance.
    - Resistance amplifies at a constant rate as pressure increases.
    answer_index: 1
    explanation: The FSR is a pressure-sensitive resistor characterized by its resistance
      value decreasing when pressure is applied.
  - question: What is the safety state that must be verified after turning off the
      power for maintenance or access during robot hand prototype work?
    choices:
    - Confirm that torque has been released via software.
    - Measure whether the fuse is blown using a multimeter.
    - Physically disconnect 3 power adapters and measure with DC voltage mode to ensure
      the voltage in each branch is less than 1 V.
    - Turn off the power switch and measure the conductor state in resistance mode.
    answer_index: 2
    explanation: Power disconnection means physically separating 3 power sources,
      and for safety, you must directly verify by measurement in DC voltage mode that
      all branches are less than 1 V.
  completion_criteria:
  - Passed FSR value reading practice via ADC
  - Grasp force feedback control code reached 90% or more of the target value
  - Proof of compliance with all safety protocols (physical power disconnection and
    voltage measurement)
  - Submission of final results report
  source_ids:
  - S3
  - S12
  - S26
- id: M9
  slug: testing-validation
  phase_id: P3
  title: Performance Testing and Verification
  estimated_hours: 10.0
  prerequisites:
  - M8
  objectives:
  - Design quantitative test metrics to verify robot hand precision and repeatability
  - Evaluate the stability of grasp force control algorithms utilizing FSR sensor
    data
  - Analyze errors between DYNAMIXEL actuator feedback data and actual physical motion
  - Acquire procedure for verifying mechanical defects and tendon drive mechanism
    durability
  theory_markdown: '## Performance Testing and Verification Theory


    Robot hand performance verification is the process of confirming the correspondence
    between design specifications and actual physical behavior [S1]. The main indicators
    are as follows.


    ### 1. Position and Grasp Precision

    Repeatability refers to the error range of the position reached by the robot hand
    when performing the same command. The XM430-W350-T actuator provides precise position
    feedback via internal encoders [S11], but errors occur in the final fingertip
    position due to tendon elongation and friction. Dyneema tendons have very low
    elongation, less than 1%, which is advantageous for securing repeatability [S16].


    ### 2. Force Control and FSR Sensor Signal Processing

    The FSR 402 sensor is characterized by its resistance decreasing according to
    the applied force [S12]. This is configured with a 10 kΩ resistor and a voltage
    divider circuit to be measured by OpenCR''s 12-bit ADC [S13, S26]. Since sensor
    data has significant noise, a Moving Average Filter must be applied to form a
    stable grasp force feedback loop.


    ### 3. Overcurrent Protection and Power Stability

    The system uses 3 independent 12 V power branches [S15]. Each branch is protected
    by a 10 A ATOF fuse [S25], and distribution must be done so that the sum of actuator
    peak currents does not exceed protection ratings. Protection coordination must
    be verified using the time-current curves of the fuses provided by the manufacturer.'
  worked_examples:
  - 'Example 1: Calculating OpenCR ADC voltage. When FSR resistance is 10 kΩ and serial
    resistance is 10 kΩ, the 3.3 V voltage divider output V_out = 3.3 * (10k / (10k
    + 10k)) = 1.65 V. This is suitable within the 12-bit ADC range [S13, S26].'
  - 'Example 2: Fuse protection coordination. When 4 actuators are in a stall state,
    the sum of current is 9.2 A [S11]. Since the cold resistance of a 10 A fuse is
    7.7 mΩ [S25], the voltage drop during normal operation is about 0.07 V and can
    be ignored, but for precise response during overcurrent, refer to the fuse manufacturer''s
    time-current curve.'
  lab:
    title: Robot Hand Integrated Function Test
    steps:
    - With each power branch physically disconnected, measure the output of 3 adapters
      in DC voltage mode to verify that 12 V is output.
    - Fix the robot hand in a safety jig, connect the controller (OpenCR) to the PC,
      and release actuator torque to 0.
    - Record ADC data changes by manually applying pressure to the FSR sensor for
      each finger.
    - Repeatedly operate each finger to its maximum range of motion (ROM) 5 times
      in a no-load state to check for tendon interference.
    - After the test, always disconnect 3 power adapters from the wall outlet and
      verify residual voltage.
    safety:
    - Always wear safety glasses during the test.
    - Do not put your hands within the range of motion while power is applied.
    - If abnormal heat, odor, or smoke is detected, do not approach. Evacuate after
      cutting off supply power to 3 adapters using a designated building distribution
      board circuit breaker or a certified upstream master disconnect outside the
      hazard zone. Do not energize the system if no upstream disconnecting means is
      operable outside the hazard zone. Torque release does not replace power disconnection.
      Maintenance and access must only be performed after planned shutdown, physical
      disconnection, and verified measurement of a de-energized state.
    - Do not touch the system without voltage measurement. DC verification of less
      than 1 V is mandatory.
    deliverables:
    - Fingertip grasp force sensor calibration records
    - Repeatability precision measurement data
    - Load current measurements per power branch
  assignment:
    title: Final Robot Hand Performance Analysis Report
    deliverables:
    - Performance test result analysis report
    - Data-driven grasp control algorithm code
    rubric:
    - Appropriateness of sensor data signal-to-noise ratio (SNR) analysis
    - Quantification of precision in repeatability testing
    - Theoretical reflection on whether the protection design (fuse) satisfies the
      system protection intent
    - Comparison of design specifications and performance indicators of the final
      product
  quiz:
  - question: When configuring a force measurement circuit using an FSR 402 sensor
      and OpenCR ADC, what is correct?
    choices:
    - The FSR voltage divider uses only the 3.3 V sensor power and keeps the analog
      input signal in the 0~3.3 V range.
    - Construct a voltage divider with an FSR and a 10 kΩ resistor and use the 3.3
      V sensor rail.
    - The ADC signal must always be in the 0~5 V range.
    - An FSR has constant resistance, so no separate divider resistor is needed.
    answer_index: 1
    explanation: Use the OpenCR sensor rail (3.3 V) to limit the ADC input to the
      0~3.3 V range, and configure a divider circuit to read resistance changes as
      voltage changes [S13, S26].
  - question: What is the correct way to manage the 12 V power branch of a DYNAMIXEL
      XM430-W350-T actuator?
    choices:
    - Bundle the positive (+) outputs of 3 adapters together to sum the power.
    - Equip each adapter with a 10 A fuse and use it as an individual independent
      branch.
    - It can be used without safety verification because the current is below the
      fuse rating.
    - Connect power adapter outputs directly in parallel without fuses.
    answer_index: 1
    explanation: Each adapter output must be maintained independently, and overcurrent
      must be protected by installing a fuse suitable for the independent branch [S15].
  - question: What is the most important safety procedure in the robot hand verification
      stage?
    choices:
    - Releasing torque via software is equivalent to cutting off power.
    - Always approach maintenance after checking for less than 1 V DC with a multimeter.
    - The fuse acts as a planned shutdown device, so you can pull the fuse out.
    - Confirm that power is disconnected with continuity mode.
    answer_index: 1
    explanation: Software release does not replace physical power cutoff; it is essential
      to verify that there is no residual energy by measuring in DC voltage mode after
      physical disconnection.
  completion_criteria:
  - Submission of performance test result report and achieving 70 points or more
  - Compliance with safety guidelines and verification of physical power disconnection
    completed in all Lab steps
  - Verification of sensor data filtering function implementation in control code
