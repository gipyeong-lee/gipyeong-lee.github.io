modules:
- id: M1
  slug: robot-mechanics-fundamentals
  phase_id: P1
  title: Basics of Robot Kinematics
  estimated_hours: 10.0
  prerequisites: []
  objectives:
  - Understand the basic definitions of robot kinematics and the concept of Rigid-body
    transformation.
  - Learn how to mathematically describe the position and orientation of a robot using
    coordinate transformation and rotation matrices.
  - Acquire basic kinematic theoretical knowledge for 5-finger robotic hand design
    and learn analytical approaches.
  theory_markdown: '## Basics of Robot Kinematics


    Robot kinematics is the study of robot motion in terms of position, velocity,
    and acceleration, without considering forces or torques [S1]. The starting point
    for designing manipulators like robotic hands is to describe the state of each
    joint as coordinates in space.


    ### 1. Rigid-body Transformation

    Each link of a robot is considered a rigid body, and the transformation from one
    coordinate system to another is expressed as a combination of rotation and translation.
    In 3-dimensional space, the Rotation Matrix $R$ is an orthogonal matrix, which
    defines the orientation between two coordinate systems [S1].


    ### 2. Forward Kinematics

    Forward kinematics is the process of calculating the position and orientation
    of the robot''s end-effector when the joint variables (angles or positions) are
    known. For an 5-finger robotic hand, the position of the fingertip is found through
    finger joint angles ($\theta_1, \theta_2, \dots, \theta_n$).


    ### 3. Inverse Kinematics

    Inverse kinematics is the process of finding the joint variables required to achieve
    a desired fingertip position. It consists of nonlinear equations, so solutions
    may not exist or multiple solutions may arise [S1].'
  worked_examples:
  - 'Example 1: Find the end position $(x, y)$ of a robot link with 1 rotation joints
    in a 2-dimensional plane. Given joint angle $\theta$ and link length $L$, $x =
    L \cos(\theta)$ and $y = L \sin(\theta)$ [S1].'
  - 'Example 2: Describe a 2-dimensional rotation matrix $R$ that rotates by $\theta$
    about the $x$-axis. $R = \begin{bmatrix} \cos(\theta) & -\sin(\theta) \\ \sin(\theta)
    & \cos(\theta) \end{bmatrix}$ [S1].'
  lab:
    title: Coordinate System Transformation Simulation and Basic Kinematic Analysis
    steps:
    - Create an 2-link planar manipulator model using kinematic analysis software.
    - Check the trajectory of the end position while varying the joint angles.
    - Derive inverse kinematic formulas manually and compare with simulation results.
    safety:
    - Adjust screen brightness and take periodic breaks when working on computers.
    - This lab is simulation-based, so hardware energization is not required.
    deliverables:
    - Summary report including the kinematic analysis process
    - Trajectory simulation result images
  assignment:
    title: Kinematic Modeling of 5-Finger Robotic Hand Joint Structure
    deliverables:
    - Forward kinematics derivation results for 1 robot fingers
    - Data predicting fingertip position changes according to joint angle changes
    rubric:
    - Mathematical accuracy of the rotation matrix
    - Physical validity of the forward kinematics equations
    - Logical structure of the report
  quiz:
  - question: What is the discipline in robot kinematics that describes only motion
      without considering forces or torques?
    choices:
    - Dynamics
    - Kinematics
    - Control Theory
    - Material Mechanics
    answer_index: 1
    explanation: Kinematics is the study of motion focused on position, velocity,
      and acceleration, excluding forces and torques [S1].
  - question: What is the matrix that defines the orientation between two coordinate
      systems in 3-dimensional space?
    choices:
    - Rotation Matrix
    - Mass Matrix
    - Stiffness Matrix
    - Damping Matrix
    answer_index: 0
    explanation: A rotation matrix is an orthogonal matrix that mathematically transforms
      the orientation between two coordinate systems [S1].
  completion_criteria:
  - Completion of theory lectures
  - Submission of kinematic analysis report
  - Achievement of 100 points on the theory quiz
  source_ids:
  - S1
- id: M2
  slug: tendon-driven-design
  phase_id: P1
  title: Tendon-Driven Mechanism Design
  estimated_hours: 10.0
  prerequisites:
  - M1
  objectives:
  - Understand the basic mechanical structure and joint mimicry principles of tendon-driven
    mechanisms.
  - Learn the characteristics of tendon materials (Dyneema SK78) for sophisticated
    robotic hands.
  - Learn tendon tension transmission paths and methods to prevent friction and wear
    in capstan design.
  - Calculate the stall torque of actuators and the mechanical advantage in tendon-driven
    systems.
  theory_markdown: '## Foundations of Tendon-Driven Mechanisms


    Tendon-driven systems are a method of driving joints by transmitting tensile force
    from remotely located actuators through tendons (cables) [S9]. By mimicking the
    tendon structure of biological fingers and moving actuators to the palm or forearm,
    the mass of the fingers themselves can be reduced, enabling sophisticated movements
    [S10].


    ### 1. Selection and Tension Transmission of Tendons

    This design uses Dyneema SK78, a high-strength, low-stretch fiber [S16]. This
    material has a breaking load of 230 daN (approx. 230 kgf) at a diameter of 1.5
    mm, and is suitable for precision position control with an operating elongation
    of less than 1% [S16].


    ### 2. Mechanical Advantage and Actuator Selection

    The XM430-W350-T smart actuator provides a stall torque of 4.1 N·m [S11]. Since
    tendons convert force through the capstan radius at the rotation axis, actuator
    torque output is replaced by tendon tension. The entire system uses 11 actuators,
    and the sum of peak currents can reach approximately 25.3 A [S11]. Therefore,
    to supply this stably, a total of 3 independent 12 V power branches are configured,
    and each branch prevents overcurrent through an independent 10 A fuse protection
    [S15, S24, S25].


    ### 3. Safety and Protection Design

    Each 12 V power branch operates via an independent fuse [S15, S24]. The 3 power
    adapters are each rated at 11.5 A, and their combined current capacity reaches
    34.5 A, sufficient to accommodate the system peak current of 25.3 A [S11, S15].
    Operational safety is secured by designing the combined branch rating to exceed
    the total peak current of the actuators.'
  worked_examples:
  - 'Example 1: Tendon tension calculation

    When actuator torque (τ) is 1 N·m and capstan radius (r) is 0.01 m, the tendon
    tension (T) is T = τ/r = 1/0.01 = 100 N. Design considering a safety factor against
    the 230 daN (approx. 2300 N) breaking load of Dyneema SK78 [S16].'
  - 'Example 2: Power branch distribution and protection

    The sum of stall currents for all 11 actuators is 25.3 A [S11]. Distributing this
    into 3 branches of 4, 4, and 3 units results in maximum loads for each branch
    of 9.2 A, 9.2 A, and 6.9 A respectively. Although the theoretical peak of 9.2
    A for the 4-actuator branch is lower than the 10 A fuse and 11.5 A adapter rating,
    these figures alone do not guarantee safety or operational sequences. Verify protection
    coordination by reviewing fuse manufacturer time-current curves and adapter OCP
    characteristics together [S24, S25].'
  lab:
    title: Tendon Tension and Joint Friction Measurement Lab
    steps:
    - Assemble the finger joint model using the provided links and bearings.
    - Connect the tendons and set initial tension using a tensioner.
    - Set the multimeter to DC voltage mode and physically disconnect and verify the
      output of each 12 V power adapter branch.
    - Manually measure and record the rotational friction of the joint before applying
      power.
    safety:
    - Before maintenance/access, physically disconnect the 3 isolated power adapters
      and verify a DC voltage of less than 1 V with a multimeter.
    - Never approach the operating range of the fingers while power is applied.
    - Must wear impact-resistant safety glasses for work.
    deliverables:
    - Tendon tension measurement data according to joint rotation angle
    - Friction analysis report
    - Final safety measurement records
  assignment:
    title: 5-Finger Robotic Hand Tendon Path Design
    deliverables:
    - CAD drawings of robotic finger tendon paths
    - Tendon friction and loss calculation sheet
    - Power load distribution and fuse protection design by branch
    rubric:
    - Was the tendon path designed to minimize friction at bends?
    - Were the physical properties of Dyneema SK78 considered?
    - Did the load distribution of the 3 power branches appropriately reflect actuator
      stall currents?
    - Do the fuse and power short-circuit prevention designs comply with BOM specifications?
  quiz:
  - question: What is the main advantage of using Dyneema SK78 tendons?
    choices:
    - Shock absorption due to high elongation
    - Very low operating elongation and high breaking load
    - Lighter weight than metal and low tensile strength
    - Electrical conductivity
    answer_index: 1
    explanation: Dyneema SK78 is a high-performance fiber with very low elongation
      of less than 1%, increasing position control precision, and a very high breaking
      load [S16].
  - question: What is the appropriate reason for using 3 12 V power adapters (11.5
      A each)?
    choices:
    - To drive all actuators with a single power source
    - To boost voltage to 36 V to increase torque
    - To distribute the total peak current of actuators and protect them with individual
      branch fuses
    - To eliminate power noise
    answer_index: 2
    explanation: It is to safely distribute the peak current of 11 actuators and lower
      the system overcurrent risk by protecting each branch with 10 A fuses [S11,
      S15, S25].
  completion_criteria:
  - All lab data and drawings must be included in the final report.
  - Must demonstrate via measurement that the DC voltage of 3 branches is less than
    1 V after physical power disconnection.
  - Analysis considering capstan friction must be included in tendon path design.
  source_ids:
