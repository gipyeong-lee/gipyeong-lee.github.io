course:
  course_type: build_project
  slug: precise-robot-hand
  title: Sophisticated 5-fingered robotic hand fabrication
  summary: A project-based course covering the entire process from fundamentals of
    robotics to 5-fingered robotic hand design, kinematics, electronic circuitry,
    control algorithms, and system integration.
  outcome: Production of an independently operable 5-fingered robotic hand prototype,
    acquisition of mechanical design competencies, and implementation capabilities
    for embedded control systems.
  audience: Undergraduate students and makers new to robotics
  level: beginner
  estimated_hours: 100.0
  budget_krw:
    min: 4500000
    max: 6500000
  required_tools:
  - FDM 3D printer
  - Multimeter
  - Soldering iron
  - General hand tools
  - Hardened steel nozzle for PC-CF
  - Safety glasses for impact-resistant work
  - Vernier caliper
  safety_summary:
  - This is a low-voltage educational prototype and not a certified machine safety
    system.
  - Do not use learner-created stop circuits as safety functions or emergency stops.
  - Perform normal stops via software torque release, and verify zero-energy state
    by physically disconnecting the 3-rated isolated power adapter and measuring before
    maintenance or access after a planned stop.
  - Do not place hands in the operating range while power is applied, and test from
    no-load in a fixed jig.
  - Wear impact-resistant safety glasses during cutting, drilling, and tendon tension
    testing.
  - If abnormal heat, odor, or smoke is detected, do not approach; cut power to the
    3 adapter supply from a pre-designated building distribution board circuit breaker
    outside the hazard zone or an authorized upstream master disconnect, then evacuate.
    If there are no operable upstream disconnect means outside the hazard zone, do
    not energize the system. Torque release is not a substitute for power disconnection.
  - Before deploying in human-accessible environments, dual-channel, manual-reset,
    EDM, feedback-capable dual contactors must be separately designed and validated
    under the review of a qualified safety expert.
