- id: m7
  slug: firmware-control
  phase_id: p3
  title: Firmware and Control
  estimated_hours: 10.0
  prerequisites:
  - m6
  objectives:
  - Understand the operating principles and control protocols (Protocol 2.0) of DYNAMIXEL
    smart actuators.
  - Identify the structure of OpenCR controllers and configure sensor and actuator
    interfaces.
  - Design FSR voltage divider circuits and implement ADC signal processing processes.
  - Write grasping and control logic for robotic hands into firmware utilizing State
    Machines.
  theory_markdown: "## DYNAMIXEL Smart Actuator Control\nEach joint of the robotic\
    \ hand is driven using XM430-W350-T actuators [S14]. These actuators provide real-time\
    \ position, velocity, and current feedback and are controlled via DYNAMIXEL Protocol\
    \ 2.0 [S14]. The OpenCR 1.0 controller is equipped with a 216MHz ARM Cortex-M7\
    \ processor and communicates directly with actuators without a separate communication\
    \ bridge [S16].\n\n## ADC and Sensor Interface\nFingertip contact force is measured\
    \ using FSR 402 sensors [S15]. FSR resistance decreases as applied force increases\
    \ [S15]. OpenCR ADC input resolution is 12 bits [S16], and a voltage divider circuit\
    \ is configured using the 3.3V sensor power rail [S16, S27]. \n\nThe 10 kΩ pull-down\
    \ divider uses $V_{out}=V_{ref}\\frac{R_{fixed}}{R_{FSR}+R_{fixed}}$\n\nHere,\
    \ 10kΩ resistor is used for $R_{fixed}$ [S27]. For safety, all analog signals\
    \ must be designed not to exceed the 0-3.3V range [S16].\n\n## Firmware Structure\n\
    The robotic hand control system is implemented as a state machine of 'Standby',\
    \ 'Perform Grasp', 'Maintain Grasp', and 'Release'. Firmware periodically polls\
    \ sensor values within a loop and analyzes actuator current and position data\
    \ to maintain stable grasping force."
  worked_examples:
  - 'Example 1: FSR ADC value normalization. Write code to convert FSR sensor outputs
    (0~4095 (12-bit) range when connected to OpenCR ADC) to a force ratio of 0.0~1.0.
    (Formula: `normalized = adc_value / 4095.0`)'
  - 'Example 2: XM430 position control command. Construct a command to move joint
    1 to 2048 (center value) using the DYNAMIXEL SDK. Use a calling scheme such as
    `packetHandler->write2ByteTxRx(portHandler, 1, ADDR_GOAL_POSITION, 2048, &error);`.'
  lab:
    title: Robotic Hand Firmware Implementation and Sensor Calibration
    steps:
    - Connect the OpenCR 1.0 board to a PC via USB and set up the basic communication
      environment [S16].
    - Solder and connect FSR divider circuits connected to each finger to the OpenCR
      3.3V sensor power rail [S16, S27].
    - Use a multimeter to verify that voltage is within the 0-3.3V range when FSR
      is unloaded and pressurized.
    - Read sensor values from firmware, print to serial monitor, and verify changes
      during physical contact.
    - Connect a single actuator to a fixed jig and test precision movement via control
      code.
    safety:
    - Never connect 5V or 12V actuator power rails directly to ADC sensor circuits
      [S16].
    - Re-verify wiring diagrams before applying power and confirm short circuits via
      multimeter.
    - Perform initial operation tests in an unloaded actuator state.
    - If abnormal heating, odor, or smoke is detected, do not approach. Evacuate after
      cutting off the supply power of 3 adapter(s) from outside the hazardous zone
      using a pre-designated building distribution board circuit breaker or a certified
      upstream master disconnect. If there is no upstream disconnecting means operable
      from outside the hazardous zone, energizing the system is prohibited. Torque
      release does not replace power disconnection. Maintenance/access shall only
      be performed after a planned shutdown, physical disconnection, and confirmation
      of zero-energy measurement [S17].
    - Physically disconnect 3 power adapters before access, then confirm that the
      voltage of each branch is less than 1V in DC voltage mode.
    deliverables:
    - Sensor data output serial log
    - Operation test and calibration-completed firmware source code
    - ADC normalization formula definition document
  assignment:
    title: 5-fingered Robot Hand System Integrated Control Report
    deliverables:
    - State machine design diagram and detailed logic description
    - Integrated control firmware for 11 total actuator(s) and 5 total sensor(s)
    - Motion verification video and gripping force analysis graph
    rubric:
    - Does the state machine safely perform the gripping and release loop?
    - Is sensor data acquired stably without noise?
    - Does the per-power-branch design adhere to the BOM's independent branch principle?
    - Were safety rules (physical power disconnection, etc.) followed and recorded?
  quiz:
  - question: Which power rail must be used for the FSR voltage divider circuit on
      the OpenCR controller?
    choices:
    - 12V actuator power
    - 3.3V sensor power
    - 5V power
    - USB 5V
    answer_index: 1
    explanation: According to the OpenCR manual and compatibility standards, FSR voltage
      division must use only the 3.3V sensor power rail [S16].
  - question: What is the correct power connection method in a situation where there
      are 3 actuator power branch adapter(s)?
    choices:
    - Connect the positive (+) outputs of the 3 adapter(s) in parallel to increase
      current capacity.
    - Configure each adapter as an independent branch and pass through a fuse.
    - Connect all actuators to 1 adapter(s) and keep the others as spares.
    - Combine adapter outputs to boost voltage to 36V for use.
    answer_index: 1
    explanation: Parallel connection of positive (+) outputs is prohibited; each adapter
      must be maintained as an independent branch and protected against overcurrent
      via a fuse [S17].
  - question: What is the mandatory step to perform before maintenance or access to
      the robot hand system?
    choices:
    - Issue only the software torque release command.
    - Remove the fuse.
    - Physically disconnect 3 power sources and confirm voltage of each branch is
      less than 1V using a multimeter.
    - Press the Reset button on the controller.
    answer_index: 2
    explanation: Torque release cannot replace power disconnection; you must physically
      disconnect the 3 adapter(s) and confirm via DC voltage measurement.
  completion_criteria:
  - Integrated control firmware performs the gripping motion of the 5-fingered robot
    hand within a loop.
  - All sensors acquire ADC signals normally within the 0-3.3V range.
  - All electrical connections meet the independent branch design standard including
    fuses.
  - Safety review report includes records of zero-energy measurement verification.
  source_ids:
  - S16
  - S14
  - S15
  - S27
  - S17
- id: m8
  slug: testing-validation
  phase_id: p3
  title: Testing and Verification
  estimated_hours: 10.0
  prerequisites:
  - m7
  objectives:
  - Establish systematic testing procedures to evaluate the performance of the robot
    hand drive system.
  - Analyze sensor data and actuator feedback for data-driven precision verification.
  - Verify mechanical durability and repetitive precision of the robot hand.
  - Draft operating guidelines for safe operation after system integration.
  theory_markdown: '### 1. Key Indices of Robot Hand Performance Evaluation

    Robot hand performance verification is the process of proving the fidelity of
    mechanical design and the effectiveness of control algorithms [S1]. Major evaluation
    indices are as follows:

    - **Repeatability:** The error range when reaching the same target position, calculated
    via high-resolution encoder feedback of the `XM430-W350-T` actuator [S14].

    - **Grasp Stability:** Evaluates whether an object is gripped without slipping
    by analyzing the contact force distribution measured by the `FSR 402` sensor [S15].

    - **Durability:** Repeated load tests are performed to check for fatigue failure
    of tendon (`Dyneema SK78`) and link (`PC-CF`) structures [S18, S21].


    ### 2. Data Acquisition and Analysis

    FSR data is collected in real-time via the ADC of the `OpenCR` control board.
    It converts force signals with up to 12-bit resolution within a 0~3.3 V range
    using 3.3 V sensor power [S16]. During data acquisition, a moving average filter,
    etc., is applied to smooth changes in gripping force to reduce noise.


    ### 3. Electrical Safety Verification

    Each actuator group is configured as an independent `12 V` adapter branch and
    protected from overcurrent with a `10 A` ATOF fuse [S17, S26]. Verification of
    the system''s zero-energy state is always performed by measuring in DC-voltage
    mode (less than 1 V).'
  worked_examples:
  - '**Example 1: Repetitive Precision Error Analysis**

    As a result of collecting encoder values after 100 repeated movements to the target
    point of 50 degrees, it was confirmed to be 50.02 degrees on average, with a standard
    deviation of 0.05 degrees. This is within the required precision range.'
  - '**Example 2: FSR-based Gripping Force Calibration**

    When the ADC value is 50 with no pressure and 3800 at maximum grip (20 N), force
    (N) is estimated in real-time from the ADC value using a linear interpolation
    formula [S15].'
  lab:
    title: Robot Hand Workspace and Gripping Force Verification
    steps:
    - Verify that the voltage is 12 V at the power adapter connection of each independent
      branch.
    - Mechanically check that there is no link interference of the robot hand in the
      software torque release state.
    - Gradually check the workspace of each finger in an unloaded state.
    - Log ADC signals while applying pressure to the FSR sensor in stages (0.5 N,
      1 N, 5 N).
    - After finishing the continuity test, physically disconnect all power adapters.
    - Use a multimeter to confirm that the voltage of the 3 branch(es) has discharged
      to less than 1 V.
    safety:
    - Before maintenance and access, physically disconnect the 3 isolated power adapter(s)
      and verify the zero-energy state by measurement.
    - Never place hands within the workspace while power is applied; test on a fixed
      jig.
    - If abnormal heating, odor, or smoke is detected, do not approach. Evacuate after
      cutting off the supply power of 3 adapter(s) from outside the hazardous zone
      using a pre-designated building distribution board circuit breaker or a certified
      upstream master disconnect. If there is no upstream disconnecting means operable
      from outside the hazardous zone, energizing the system is prohibited. Torque
      release does not replace power disconnection. Maintenance/access shall only
      be performed after a planned shutdown, physical disconnection, and confirmation
      of zero-energy measurement.
    - Always wear impact-resistant safety goggles when working.
    deliverables:
    - Workspace and gripping force test logging data file
    - Repetitive precision statistical analysis report
    - Measurement safety confirmation certificate by power branch
  assignment:
    title: Writing Final Performance Verification Report
    deliverables:
    - System integration verification report (PDF)
    - Performance index numerical data and visualization graphs
    - Operating guidelines and troubleshooting procedures manual
    rubric:
    - Verification of consistency in workspace and repetitive precision measurement
      data
    - Verification of the effectiveness of the force control algorithm utilizing FSR
      sensor data
    - Evaluation of breakage and assembly stability through mechanical durability
      tests
    - Adherence to safety guidelines and procedural validity
  quiz:
  - question: Which of the following is incorrect regarding the system safety maintenance
      procedure?
    choices:
    - Perform software torque release.
    - After a planned shutdown and before maintenance/access, physically disconnect
      3 power adapter(s) and verify the zero-energy state of each branch by measurement.
    - Physically disconnect 3 power adapter(s) and verify with a multimeter in DC
      voltage mode that the residual voltage of each branch is less than 1 V.
    - Verify by measurement in DC voltage mode that each branch is less than 1 V.
    answer_index: 2
    explanation: Resistance mode can cause equipment damage and misreadings if measuring
      a circuit being energized or by capacitors that have not discharged. Zero-energy
      state verification must always use DC-voltage mode.
  - question: What should be noted when configuring a circuit utilizing an FSR 402
      sensor and an OpenCR board?
    choices:
    - The FSR voltage divider must use only 3.3 V sensor power and maintain analog
      input signals in the 0~3.3 V range.
    - The FSR divider circuit must use only 3.3 V sensor power.
    answer_index: 1
    explanation: Since the OpenCR ADC input must not exceed the 0~3.3 V range, a stable
      3.3 V sensor power must be used.
  completion_criteria:
  - Submit all experimental data from the testing and verification stage and complete
    log analysis.
  - Adhere to the physical disconnection and safety voltage measurement procedure
    of 3 independent power branch(es).
  - Quantitative evaluation indices for repetitive precision and gripping force must
    achieve target ranges.
  - Prove in the final report that all mechanical parts and electronic circuits operate
    safely.
