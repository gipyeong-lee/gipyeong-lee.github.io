- id: M4
  slug: 3d-printing-assembly
  phase_id: P2
  title: 3D Printing and Part Machining
  estimated_hours: 15.0
  prerequisites:
  - M3
  objectives:
  - Understand part fabrication using carbon-fiber-reinforced PC filament (PC-CF)
    and optimization of printing settings
  - Acquire precision assembly tolerance management for heat-set inserts and sleeve
    bearings
  - Understand handling of Dyneema lines and capstan design structure for tendon-driven
    mechanisms
  - Master machining and fastening techniques to ensure dimensional stability and
    rigidity of robotic structures
  theory_markdown: '### 3D Printing and Part Machining Theory


    #### Carbon Fiber Reinforced Engineering Material (PC-CF)

    PC (Polycarbonate) has excellent rigidity and heat resistance, and PC-CF filament
    added with carbon fiber maximizes rigidity, making it suitable for structural
    parts [S19]. However, due to the abrasiveness of carbon fiber, a hardened steel
    nozzle must be used [S19], and high-temperature printing of around 285°C is required
    [S19].


    #### Inserts and Fastening for Precision Assembly

    Heat-set threaded inserts are used to allow repetitive assembly/disassembly in
    plastic prints [S21]. For M3 inserts, a 4.0mm diameter pilot hole must be pre-placed
    in CAD design to ensure accurate seating [S21]. Also, maintenance-free polymer
    sleeve bearings (iglide J) are designed to have optimal clearance after being
    press-fitted when assembled with 8mm aluminum shafts [S17], and tolerance management
    with the 8mm shaft diameter is essential [S17, S18].


    #### Tendon Driving Structure

    Dyneema SK78 fiber shows a high breaking load of 230 daN and elongation of less
    than 1% at a 1.5mm diameter [S16], making it an excellent alternative to steel
    cables. Since the tendon is repeatedly bent at the rotation axis, structural design
    that rounds capstan corners to prevent breakage due to friction is important.'
  worked_examples:
  - 'Example 1: PC-CF filament nozzle selection - Considering the high abrasiveness
    of carbon fiber, confirm that a Brass nozzle must be avoided as it wears quickly,
    causing printing quality degradation and nozzle clogging, and a Hardened steel
    nozzle must be selected [S19].'
  - 'Example 2: Insert hole design - Since the outer diameter of the Accu HTBI-M3-BR
    insert is 4.4mm but the official recommended hole diameter is 4.0mm [S21], fix
    the hole diameter to 4.0mm in CAD design so that plastic sufficiently penetrates
    between insert knurling during heat-setting [S21].'
  lab:
    title: Finger Structure Fabrication and Assembly Practice
    steps:
    - Configure FDM 3D printing environment for carbon-fiber PC filament with a hardened
      steel nozzle [S19].
    - Remove supports and finish surfaces after printing finger links and palm frame.
    - Vertically seat heat-set inserts into 4.0mm pilot holes using a hot tool [S21].
    - Cut IGUS precision aluminum shafts according to bearing specifications and deburr
      the ends [S18].
    - Press-fit sleeve bearings into housing, insert shafts, and check clearance [S17].
    - Fasten structure and sensor brackets with M3 cap screws [S20].
    safety:
    - Beware of burns from high-temperature nozzles (285°C) and beds (110°C) [S19].
    - Always wear goggles when finishing and deburring prints.
    - Operate ventilation facilities as smoke may be generated during insert heating.
    - Check all mechanical fastening states before applying power.
    deliverables:
    - Fabricated 5-finger robotic hand structure (links, palm).
    - Records of heat-set insert perpendicularity and bearing clearance measurements.
    - Final fastening visual inspection completion report.
  assignment:
    title: Robotic Hand Fabrication Precision Verification
    deliverables:
    - Comparison table of CAD data and actual dimensional measurements of completed
      structures
    - Assembly tolerance management plan
    - Manual for friction-reducing design of tendon routing structure
    rubric:
    - Vertical seating of heat-set inserts (High/Medium/Low)
    - Smooth rotational movement after shaft-bearing assembly (Pass/Fail)
    - Compliance with part ratings and model specifications specified in BOM [B10,
      B11, B12, B13, B14]
  quiz:
  - question: What is the main reason for using a hardened steel nozzle when using
      PC-CF filament?
    choices:
    - Prevent rapid wear of brass nozzles due to carbon fiber abrasiveness
    - Filament melting point is too low for ordinary nozzles
    - Increase surface gloss of prints
    - Increase extrusion speed
    answer_index: 0
    explanation: Carbon fiber is highly abrasive and quickly damages ordinary brass
      nozzles, making a hardened steel nozzle essential [S19].
  - question: What is the recommended pilot hole diameter when using M3 heat-set inserts
      (Accu HTBI-M3-BR)?
    choices:
    - 3.0mm
    - 4.0mm
    - 4.4mm
    - 5.0mm
    answer_index: 1
    explanation: The hole diameter recommended by the official datasheet is 4.0mm
      [S21].
  completion_criteria:
  - All structural parts fabricated with FDM 3D printer [B10]
  - Heat-set inserts seated accurately in all designated holes [B14]
  - Assembly clearance of aluminum shaft and sleeve bearing satisfies standard [B11,
    B12]
  - M3 spec cap screws correctly used when fastening [B13]
  source_ids:
  - S19
  - S21
  - S17
  - S18
  - S16
  - S20
- id: M5
  slug: bearing-fastener-install
  phase_id: P2
  title: Bearing and Fastening Part Installation
  estimated_hours: 10.0
  prerequisites:
  - M4
  objectives:
  - Understand mechanical tolerances and installation principles of bearings and shafts
    for precision robotic hand fabrication.
  - Master methods to secure fastening strength of engineering plastic parts using
    heat-set inserts.
  - Minimize assembly clearance using appropriate torque and fastening specifications.
  theory_markdown: '### Tolerance Management of Bearings and Shafts

    For smooth movement and rigidity of precision robotic joints, we use iglide® J
    sleeve bearings (JSM-0810-10) and 8 mm aluminum precision shafts (AWMP-08). Sleeve
    bearings are designed to adjust their inner diameter when press-fitted into housings,
    and complying with the recommended housing inner diameter tolerance is key [S17,
    S18]. If clearance occurs, joint precision drops; if too narrow, friction increases,
    reducing the current efficiency of the actuator (DYNAMIXEL XM430).


    ### Heat-set Insert Installation

    PC-CF (carbon fiber reinforced PC) prints are prone to thread wear due to material
    characteristics when metal screws are directly fastened. To prevent this, brass
    heat-set inserts (HTBI-M3-BR) are used [S21]. Inserts are inserted into 4.0 mm
    pilot holes and heated to melt surrounding resin for fastening, maintaining high
    mechanical strength even after repetitive disassembly/reassembly [S21]. If the
    insert tilts, the alignment of the assembled link becomes misaligned, so maintaining
    perpendicularity is essential.'
  worked_examples:
  - 'Example 1: Housing inner diameter check - The outer diameter of iglide® JSM-0810-10
    bearing is 10 mm. Therefore, the housing bore must be designed to 10 mm, and if
    the pilot hole 4.0 mm is not maintained during insert insertion, the insert may
    spin or the housing may be damaged [S17, S21].'
  - 'Example 2: M3 screw assembly - M3x10 cap screws are fastened using a 2.5 mm hex
    wrench, and since excessive torque can cause cracks in the resin around the insert,
    fix it with minimum force at the ''point where it no longer turns'' [S20].'
  lab:
    title: Robotic Hand Joint Precision Assembly
    steps:
    - 1. Verify the 4.0 mm pilot hole in the PC-CF print housing is clean and align
      the insert vertically.
    - 2. Heat the soldering iron to an appropriate temperature and slowly press the
      insert vertically to press-fit parallel to the housing surface.
    - 3. Press-fit iglide® bearing into the bore, insert 8 mm aluminum shaft, and
      check clearance and resistance.
    - 4. Complete fastening between links using M3 screws and verify that friction
      is uniform by moving the joint.
    safety:
    - Soldering iron is high temperature, so beware of burns and place on stand immediately
      after heating.
    - Ventilate thoroughly so as not to inhale fine dust generated during insert press-fitting.
    - Proceed with work while wearing goggles.
    - In case of abnormal heat, odor, or smoke, do not approach; cut power supply
      to the 3 adapters via a pre-designated building panel breaker outside the hazard
      zone or a certified upstream master disconnect and evacuate. If no upstream
      disconnect is available outside the hazard zone, do not energize the system.
      Torque release is not a substitute for power disconnection. Maintenance/access
      must only be performed after planned stops, physical disconnection, and verifying
      the de-energized state by measurement
    deliverables:
    - Friction test logs per joint
    - Photos verifying vertical alignment of inserts
    - Records of degrees of freedom and clearance of assembled links
  assignment:
    title: Assembly Tolerance and Fastening Force Analysis Report
    deliverables:
    - Joint assembly sequence and torque management plan
    - Techniques for solving clearance issues (using shims or modifying tolerances)
    - Preliminary grip test data for assembled robotic hand links
    rubric:
    - Is the verticality of insert insertion clearly described?
    - Did you correctly explain the concept of bearing and shaft tolerance?
    - Were safety rules followed during the assembly phase?
  quiz:
  - question: Why does the inner diameter of an iglide® J bearing adjust after being
      press-fitted into a housing?
    choices:
    - Inner diameter automatically increases due to elasticity of bearing material
      during press-fit.
    - It is designed so the bearing inner diameter is precisely adjusted to the tolerance
      of the housing bore during the press-fit process.
    - The inner diameter before press-fit is always manufactured smaller than standard.
    answer_index: 1
    explanation: iglide® sleeve bearings are manufactured larger than standard before
      press-fitting and are designed to have an inner diameter within the designed
      tolerance when press-fitted into the correct housing bore [S17].
  - question: What is the appropriate pilot hole size when using brass heat-set inserts
      in PC-CF prints?
    choices:
    - 3.5 mm
    - 4.0 mm
    - 4.4 mm
    answer_index: 1
    explanation: According to the datasheet, the recommended pilot hole size for HTBI-M3-BR
      inserts is 4.0 mm [S21].
  completion_criteria:
  - Verify uniform friction resistance of 5 assembled finger joints and submit measurement
    records.
  - Visual and dimensional inspection to ensure all inserts are flush with the PC-CF
    housing.
  - Pledge to follow safety rules during assembly and submit work log.
