# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. cancel-in-progress must stay false:
# posts are pushed roughly hourly by the content daemon while a full build
# takes ~40 min, so cancelling in-progress builds starves deployment —
# most runs died cancelled and the site lagged behind main for hours.
# With false, the running build always completes and the newest push waits
# in the queue (intermediate pending runs are superseded automatically).
concurrency:
  # Manual branch builds must not supersede pending production deployments.
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # A versioned image, not ubuntu-latest: a floating label swaps the
    # compiler under Gemfile.lock without a commit (the move to 26.04 broke
    # every deploy from 2026-10-21). google-protobuf, sass-embedded, nokogiri
    # and ffi are locked as x86_64-linux-gnu builds, so only small extensions
    # compile here. Verify a cold `bundle install` on a new image before moving.
    runs-on: ubuntu-26.04
    steps:
      # audio/ is 82% of the HEAD tree (4,121 mp3s, 4.35 GB on 2026-11-15)
      # and nothing here reads it: _config.yml excludes it from the build
      # and the player streams it from jsDelivr. So the checkout leaves it
      # out. Non-cone mode because cone mode can only name directories to
      # include, not one to drop. sparse-checkout implies filter: blob:none
      # (actions/checkout src/git-source-provider.ts), so audio blobs are
      # never downloaded. `git ls-files audio/` still lists the files from
      # the index; reading their content or size (git cat-file,
      # git ls-tree -l) would fetch each blob in its own request.
      # Checkout: median 140 s over 40 runs -> 31 s and 23 s (branch runs
      # 43710063626, 43710245049), same artifact.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/audio/
          sparse-checkout-cone-mode: false
      # Fail in seconds on broken front matter instead of silently dropping
      # posts from a ~40 min build (Jekyll only warns on YAML errors).
      - name: Validate post front matter
        run: |
          pip install pyyaml
          python3 scripts/validate_posts.py
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # A series, not a patch: new images only get the newest patch of each
          # series (3.2.0 had no 26.04 build). Matches the local Homebrew Ruby.
          ruby-version: '4.0'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Jekyll 4 caches markdown/Liquid conversion in .jekyll-cache keyed by
      # content — restoring it means only new/changed posts re-render.
      - name: Cache Jekyll conversion cache
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-cache-${{ github.sha }}
          restore-keys: |
            jekyll-cache-
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # git keeps each post's 1600x900 jpg + webp hero (~0.3 MB, three
      # quarters of the artifact, which hit 997 MB of deploy-pages' 1 GiB on
      # 2026-11-15); Pages gets one 1200 px progressive jpg per hero instead.
      # Why these numbers: scripts/shrink_site_images.py.
      - name: Shrink hero images
        run: |
          pip install pillow==13.0.0
          python3 scripts/shrink_site_images.py _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    # Branch dispatches validate the build; only main may deploy to Pages.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # deploy-pages cancels the deployment after 10 minutes, a hard cap
      # (MAX_TIMEOUT; a larger `timeout` input is clamped). Pages' file sync
      # is bimodal: 10-35 s usually, 5-9 min when it re-syncs the whole ~1 GB
      # artifact, so with queueing it sometimes misses the cap (6 of 130 main
      # deploys 2026-11-01..10, all "Timeout reached" in syncing_files). A
      # second attempt on the same artifact gets a fresh 10-minute window
      # instead of leaving the site stale until the next post.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry deploy after a timeout
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
