# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. cancel-in-progress must stay false:
# posts are pushed roughly hourly by the content daemon while a full build
# takes ~40 min, so cancelling in-progress builds starves deployment —
# most runs died cancelled and the site lagged behind main for hours.
# With false, the running build always completes and the newest push waits
# in the queue (intermediate pending runs are superseded automatically).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Fail in seconds on broken front matter instead of silently dropping
      # posts from a ~40 min build (Jekyll only warns on YAML errors).
      - name: Validate post front matter
        run: |
          pip install pyyaml
          python3 scripts/validate_posts.py
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.0'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Jekyll 4 caches markdown/Liquid conversion in .jekyll-cache keyed by
      # content — restoring it means only new/changed posts re-render.
      - name: Cache Jekyll conversion cache
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-cache-${{ github.sha }}
          restore-keys: |
            jekyll-cache-
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
