baseurl: "" # the subpath of your site, e.g. /blog
url: "https://gipyeong-lee.github.io" # the base hostname & protocol for your site, e.g. http://example.com


# Build settings
markdown: kramdown
permalink: pretty
future: true
plugins:
  - jekyll-paginate

collections:
  learn:
    output: true

# Tag pages come from _plugins/tag_pages.rb (jekyll/tagging was dropped:
# it generated a page for every one of ~5,700 mostly-unique LLM tags).
tag_min_posts: 5

# audio/ stays committed but is excluded from the built site — 1.6GB of
# mp3s made every Pages artifact ~2.3GB. The player loads them from the
# jsDelivr GitHub CDN instead (see _layouts/default.html).
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - audio
  - scripts
  - docs
  - AGENTS.md
  - CLAUDE.md
  - README.md

paginate: 5
paginate_path: "/page/:num"


# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false
  - scope:
        path: "_posts"
    type: "posts"
    values:
      comments: true      
  - scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_learn"
      type: "learn"
    values:
      no_ads: true
include:
  - _pages


# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  pretty

sass:
  sass_dir: _sass
  style: compressed

# Localization
languages: ["ko", "en", "ja", "zh-cn", "zh-tw"]
default_lang: ko
language_names:
  ko: "한국어"
  en: "English"
  ja: "日本語"
  zh-cn: "简体中文"
  zh-tw: "繁體中文"
